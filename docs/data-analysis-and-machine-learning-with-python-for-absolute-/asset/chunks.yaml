    # Introduction


    ## Preliminary Machine Learning for data analysts


    Obtaining insight from data is the core purpose of data analysis. To achieve this
    goal, it is not enough to rely solely on human observation. We cannot do wonders
    without machine learning algorithms and principles.


    In this module, we will introduce the preliminary knowledge of machine learning,
    and will help you to examine what is learning and machine learning, as well as
    several major categories of machine learning (supervised learning, unsupervised
    learning, semi-supervised learning). We will also discuss the model evaluation
    and performance measurement of machine learning, including confusion matrix, precision,
    ROC curve and so on.


    Main points of this module are as shown below:


    * Help readers understand the meaning of learning and machine learning

    * Help readers understand the connotation of supervised learning, unsupervised
    learning and semi-supervised learning

    * Help readers master over-fitting and under-fitting

    * Learn and understand confusion matrix, P-R curve and ROC curve


    # Chapter 1: Definition of Machine Learning


    In this section, we will mainly discuss the definition of machine learning and
    three important steps in the process of machine learning.


    ### What is machine learning?

    When it comes to machine learning, initially we need to know what the essence
    of learning is. Professor Herbert Simon, a famous scholar and winner of Turing
    Prize in 1975 and also who own Nobel Prize in Economics in 1978, once defined
    learning as a system that can improve its performance by executing a certain process.
    Process of learning is particularly important for machine learning systems. In
    Simon''s view, the core purpose of learning is to improve performance.


    In fact, for people, this definition is also applicable at many instances and
    situations. If we only carry out low-level repetitive learning, but fail to achieve
    the goal of cognitive upgrading, even if we seem to be very diligent, we are actually
    just a pseudo-learner whose performance is not being improved. Simon believes
    that for computer systems, it is Machine Learning (ML) that is essential to improve
    the performance of machine systems by using data and some specific methods (such
    as statistical methods or reasoning methods).


    In the classic textbook of Machine Learning, Tom Mitchell, a famous scholar and
    professor at Carnegie Mellon University, also gave a more specific (actually abstract)
    definition of "machine learning" as said below. For a certain `Task(T)` and a
    certain `Performance evaluation criterion(P)`, if a computer program is on `T`,
    taking `P` as the performance measure, and constantly improving itself with the
    accumulation of Experience (E), then we can say that this computer program has
    learned from `E`.


    For example, AlphaGo, a program for learning Go( A chess game), can gain experience
    by playing chess with itself. Then, its task `T` is to participate in the game
    of Go, and its performance `P` is measured by the probability of winning the game.
    Similarly, students tasks `T` are attending classes, reading books and writing
    homework and their performance `P` is measured by test scores.


    Mitchell believes that for a learning problem, we need to make clear of three
    characteristics: first being the type of task, second being the standard to measure
    the improvement of task performance and finally the source of gaining experience.
    In fact, the definition of machine learning is slightly different from different
    perspectives.


    For example, Vladimir Vapnik, the main proponent of Support Vector Machine (SVM),
    put forward in his book "The Essence of Statistical Learning Theory" that machine
    learning is a function estimation problem based on empirical data. In another
    another classic book, *The Basis of Statistical Learning*, written by Trevor Hastie
    of Stanford University''s Department of Statistics he mentions that machine learning
    is primarily used to extract important patterns and trends and understand the
    connotation expression of data, that is, to learn from data.


    These three definitions of machine learning have their own emphases and merits:

    * Mitchell''s definition emphasises the effect of learning.

    * Wanpnik''s definition focuses on the operability of machine learning.

    * Hasty''s definition highlights the classification of learning tasks.


    But the common feature of the three is that they all emphasise the importance
    of experience and data, and they all recognise that machine learning provides
    a method to extract knowledge from data.


    **What Next?** We will talk about three steps of machine learning in the next
    chapter. Follow along!


    # Chapter 2: Three Steps of Machine Learning


    Machine learning, in real, can be approximately equivalent to finding a function
    `f` related to a specific input and expected output in a data object by means
    of statistics or reasoning. Usually, we write the input variable (feature) space
    as capital `X`, and the output variable space as capital `Y`.


    Then according to the definition machine learning is approximately equivalent
    to `Y≈f(X)` in form. In such a function, for the speech recognition function,
    if an audio signal is given as input, then this function `F` can output strings
    such as "Hello" and "How are you?". For the picture recognition function, if a
    picture is given as an input, a judgment of cat or dog can be used as an output
    (or recognised) under the processing of this function.


    In view of the chess game function, if the input is a chess score situation of
    Go, the next "best" move of this game can be used as output. For systems with
    intelligent interactive functions (such as Microsoft''s Bing), when we enter a
    function, such as "How are you?" with the same statement then it can output intelligent
    responses such as "I am fine, thank you.".


    Every specific input is an instance, which is usually composed of feature vector.
    Here, the space where all feature vectors exist is called feature space, and each
    dimension of feature space corresponds to a feature of an instance. But the problem
    is that such "easy-to-use" functions are not so easy to find.


    After inputting the picture of the cat, this function may not necessarily output
    "This is a cat", it may mistakenly output that this is a dog or this is a snake.
    Due to this we need to build an evaluation system to identify the advantages and
    disadvantages of functions. Of course, it is naturally necessary to cultivate
    the good quality of functions through training the data using models and this
    is where machine learning comes into existence.


    As we mentioned earlier, the core of learning is to improve performance. Through
    training data, we improve success rate from `f1` to `f2`. Even though `f2` still
    has classification errors, its performance (classification accuracy) is improved
    compared with all errors in `f1`, which is still in the learning stage. To be
    specific, if you want to do machine learning well, you need to understand and
    follow three major steps and philosophical principles revolving around it:


    1. Understanding how to find a series of functions to realise the expected functions
    as a modelling problem.

    2. Understanding how to find a series of evaluation criteria to evaluate the function
    as an evaluation problem.

    3. Understanding how to find the functions with the best performance quickly as
    an optimisation problem.

