    # 第 7 章 循环与条件


    ## for 循环

    `for` 循环用于遍历任何项目序列（可以是列表或字符串），并对序列中的每个项目执行相应的操作。例如，数据分析师的必修课程主要包括 `Excel`、`SQL`、`Python`
    和统计学。如果你想成为数据分析师，你必须学习这四门课程，且学习顺序应该是先 `Excel`，然后是 `SQL`，接着是 `Python`，最后是统计学。循环学习这四门课程的过程就是遍历一个
    `for` 循环。


    ```python

    for (在此处输入参数) { // 在此处输入逻辑 }

    ```


    ## while 循环

    `while` 循环用于循环执行程序，即满足条件时，它将执行程序，直到条件不满足时终止。例如，在七周内成为数据分析师意味着只要你按照课程学习七周，就能成为数据分析师并找到工作。这是基于你是否已经学习了七周。如果学习时间未达到七周，你就需要继续学习，直到学习时间超过七周才能停止学习并找到工作。`while`
    语句的具体执行过程所示，以下是实现代码。


    ```python

    While ( // 在此处输入条件) { // 在此处输入逻辑 }

    ```


    ## 条件语句


    ### if 语句

    `if` 条件语句程序首先判断是否满足了某个条件，如果满足条件，则执行该判断语句。`if` 条件后的程序第一行需要进行缩进。例如，如果你学习了数据分析师的必要技能，就能找到与数据分析相关的工作，但如果你不努力，就很难找到数据分析相关的工作。我们用
    `1` 表示努力，用 `0` 表示不努力，并赋一个初始值 `1`，意味着你正在努力。在判断是否努力时，具体过程如如下所示。以下是实现代码。


    ```python

    If ( 条件) { // 语句 }

    ```


    在判断是否没有努力时，具体的流程如如下所示。以下是实现代码。


    ```python

    If ( 条件) { // 逻辑 1 } { // 逻辑 2 }

    ```

    因为条件不满足，执行了 `if` 条件后的程序，即输出为空（null）。


    ### else 语句

    `else` 语句是 `if` 语句的补充。`if` 条件只解释了条件满足时程序做什么，但没有解释条件不满足时程序做什么。`else` 语句专门用于解释条件不满足时程序做什么。在判断是否努力时，具体过程如下所示。以下是它的代码实现。


    ```python

    Else { // 在此处输入条件 }

    ```

    在判断条件是否不努力时，执行了述代码。


    ### elif 语句

    `elif` 语句可以近似理解为 `else_if`。上述 `if` 语句和 `else` 语句只能判断一个语句，但当你需要判断多个语句时，可以使用 `elif`
    语句。`elif` 可能有也可以没有 `else` 语句，但它必须有一个 `if` 语句。具体的执行顺序是判断 `if` 之后的条件是否满足，如果是，则运行
    `IF` 为真时的程序并结束循环；如果 `if` 条件不满足，则判断 `elif` 语句。可以有多个 `elif` 语句，但只有 0 个或 1 个 `elif`
    语句会被执行。例如，如果你想猜某人考试得了多少分，应该怎么猜？首先，判断这个人是否通过了考试（`60` 分为标准）。`elif` 语句可以判断多个条件。如果通过，则判断分数小于
    `60` 分。代码实现如下。


    ```python

    elif { // 逻辑 1 }

    If { // 逻辑 2 }

    ```


    # 第 8 章 函数


    函数是在程序中可以重复使用的程序。函数由语句和名称组成。一旦定义了函数，就可以通过该名称在程序中调用。


    ## 普通函数

    普通函数通常由函数名、参数、语句块和返回值组成。函数的定义语法如下。


    ```python

    def // 在此处输入带参数的函数

    ```

    定义函数的关键字是 `def`，参数放在括号内（参数可以为空）。参数后以冒号结尾，语句块需要缩进。语句块是函数要执行的内容。定义一个名为 `learn_python`
    的函数：上面多次通过函数名 `learn_python` 调用语句块。


    ```python

    def learn_python

    ```

    函数的参数有两种：物理参数（形式参数）和实际参数（实参）。定义函数时使用的参数是形式参数，例如`上方`；调用函数时传递的参数是实际参数，例如`上方`。在上面的语句块中，直接执行
    `print` 操作，没有返回值。我们也可以使用 `Return` 返回语句块的运行结果。


    带返回值的函数：

    ```python

    return python

    ```

    这次调用函数时，没有直接执行 `print` 操作，而是通过 `return` 返回了结果。


    定义带多个参数的函数：


    ```python

    def python(int 2, int 3)

    ```


    ## 匿名函数

    匿名函数字面意思是没有的函数，即省略了通过 `def` 定义函数的过程。`lambda` 就是一个表达式，没有函数体。`lambda` 的用法如下：


    ```python

    lambda arg1,arg2,arg3: expression

    ```

    `arg1`、`arg2` 和 `arg3` 代表具体的参数，`expression` 代表参数的操作。现在我们使用普通函数和匿名函数来构建两个数相加的函数，以便看到它们之间的区别。匿名函数如下：


    ```python

    lambda // 在此处输入逻辑

    ```


    匿名函数比普通函数简单得多，而且也非常常用，因此每个人必须熟练掌握它。


