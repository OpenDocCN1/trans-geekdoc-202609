- fmt: "\n# Chapter 1 Introduction to Data Analysis\n\nWe will start with a pretty\
    \ basic understanding of data analysis in this chapter and will further try to\
    \ expand your knowledge with various real life examples. Remember that data analysis\
    \ is a skill with less programming prerequisites unlike its predecessors such\
    \ as `machine learning` and `data science`.\n\n## What is data analysis?\n\nData\
    \ analysis refers to the use of appropriate statistical analysis methods to analyse\
    \ a large amount of collected data, integrate and refine the valuable information\
    \ hidden in a large number of seemingly chaotic data, and find out the inner law\
    \ of the research object. \n\nIn general, the initial data collected in the initial\
    \ stage is relatively rough, and it needs to be processed by certain technical\
    \ means, and finally the knowledge that is easy for users to understand should\
    \ be refined. Generally the rough data at the bottom is processed through a series\
    \ of processing, and then the relevant information generated by the processing\
    \ is combined with the actual business methodologies to conduct regular summary\
    \ and generate knowledge that can be useful for enterprises (`solutions` or `business\
    \ forecasts`). \n\n## The Value and Application of Data Analysis\n\nPractice has\
    \ proved that data analysis is very valuable, and its applications are closely\
    \ related to real life. For example, credit card approval limits, e-commerce website\
    \ product recommendations to consumers, prize settings for game activities, bundled\
    \ promotions in supermarkets, diagnosis and prediction of patient diseases, etc\
    \ are all possible due to the data analysis trends. Data analysis can penetrate\
    \ into these business links to help realise business processes optimisation, improve\
    \ work efficiency, and can assist users to make quick judgments in order to take\
    \ effective actions.\n\n## Operation steps of data analysis\n\nData analysis has\
    \ a set of relatively standardised operating steps. As a data analyst, you must\
    \ master it in order to reduce work errors and improve work efficiency.\n\n###\
    \ 1. Clear purpose\nThe first step in data analysis is to clarify the purpose\
    \ of the analysis. Just like everyone dealing with something in life, first determine\
    \ the goal, and then implement it. For example, after an e-commerce App was launched,\
    \ a large number of new users were imported in the early stage, but the user quality\
    \ may not be very good, data analysis was always needed to find out the reasons.\
    \ As a data analyst, it is necessary to make it clear that the purpose of this\
    \ analysis is to find out the reasons why a large number of registered users have\
    \ a short login time and low payment amount. You can start with the analysis from\
    \ the attributes of registered users.\n\n### 2. Data collection\nData is the prerequisite\
    \ for data analysis. Data collection is particularly important for various reasons.\
    \ According to different collection methods, data collection can be divided into\
    \ `online collection` and `offline collection`. According to different collection\
    \ channels, it can be divided into `internal collection` and `external collection`.\n\
    \n*   **Online collection**: Data collected online refers to data automatically\
    \ collected using Internet technology. For example, the company collects data\
    \ through `data burying points`, and then stores the collected data in a `database`.\
    \ In addition, the use of `crawler technology` to obtain web data or third-party\
    \ tools to obtain online data are all online collection methods. Under normal\
    \ circumstances, Internet technology companies, Internet e-commerce companies,\
    \ and Internet game companies use this method to collect user behaviour data because\
    \ of its high efficiency and low error rate. Famous examples include `Facebook`,\
    \ `Google` and `Tiktok`.\n*   **Offline collection**: The data collected offline\
    \ is relatively traditional and does not require high technical requirements.\
    \ For example, collecting data through traditional market survey questionnaires\
    \ is a good example of offline collection. In addition, obtaining data through\
    \ manual entry, authoritative data collected by publications, and obtaining data\
    \ through electronic forms provided by others are all offline collection methods.\
    \ This method of collecting data is inefficient and prone to deviations. In general,\
    \ traditional manufacturing companies, offline retail companies, and market research\
    \ and consulting companies use this method to collect data.\n*   **Internal collection**:\
    \ The internally collected data refers to the data obtained from the company's\
    \ internal `database`, daily financial data, sales business data, customer complaint\
    \ data, operational activity data, etc. The acquisition of such data is relatively\
    \ convenient, and data analysts can process and analyse internally collected data\
    \ according to actual business needs.\n*   **External collection**: Externally\
    \ collected data means that the data is not generated internally by the enterprise,\
    \ but obtained from the outside through other means. For example, web page data\
    \ obtained using `crawler technology`, authoritative data collected from public\
    \ publications, data obtained from market research and data provided by third-party\
    \ platforms, etc all belong to this category. The collection of external data\
    \ is not as easy as internal collection, and most of it is fragmented and scattered\
    \ data. Therefore, data analysts need to clean and integrate these data, and then\
    \ analyse.\n\n### 3. Data processing\nGenerally, the raw data collected through\
    \ different channels are relatively rough and disordered. At this instance, it\
    \ is necessary to use data processing software for a series of processing tasks\
    \ to reduce the complexity of the original data, and finally summarise it into\
    \ business indicators that can be interpreted by users. Data processing includes\
    \ early dirty data cleaning, missing value filling, data grouping conversion,\
    \ data sorting and filtering, later business indicator calculation, report template\
    \ filling, etc. Commonly used data processing tools include spreadsheet software\
    \ such as `Excel`, various database software, `Python`, `R`, `SAS`, `SPSS`, etc.\
    \ These tools all include data processing modules to facilitate users to quickly\
    \ clean the data and then analyse it.\n\n### 4. Data analysis and data mining\n\
    Based on the processed data, data analysts can analyse and mine it, draw relevant\
    \ conclusions based on actual business, and provide them to the management for\
    \ decision-making. Therefore, data analysts need to master the common methods\
    \ of data analysis and data mining in order to lay a solid foundation for the\
    \ production of later data reports.\n\nThe focus of data analysis lies in the\
    \ proficiency of the business. An excellent data analyst often knows the company's\
    \ business well. For example, data analysts must be very familiar with the pre-design\
    \ of daily product activities, mid-term online tracking, post-tracking.\n\nUsing\
    \ `CRISP-DM` (Cross-Industry Standard Process for Data Mining), the stages include:\n\
    1.  `Business understanding`\n2.  `Data understanding`\n3.  `Data preparation`\n\
    4.  `Model building`\n5.  `Model evaluation`\n6.  `Deployment`\n\n## 4. Make a\
    \ data report\nThe final results of data analysis need to be summarised into a\
    \ report. The most common way is `PPT` format. The production of data analysis\
    \ reports is particularly important. The structure of data analysis report requires\
    \ a clear purpose, clear structure, and justification.\n\n*   **Catalog**: The\
    \ catalog at the beginning is the overall outline of the data analysis report,\
    \ which requires conciseness, clear structure, and logical order.\n*   **Foreword**:\
    \ The foreword is a basic summary of the purpose, background, ideas, methods,\
    \ and conclusions of the analysis report, leading to the content.\n*   **Main\
    \ Text**: The analysis and demonstration of the main text is the core part of\
    \ the data analysis report, which is explained separately according to the chapter\
    \ order of the catalog.\n*   **Conclusions and Recommendations**: The conclusions\
    \ and recommendations at the end are based on the previous analysis results. The\
    \ conclusion requires accuracy, competence, and value.\n"
