    `T` (|`x`⟩ − |`x′`⟩) = 0，这意味着 |`x`⟩−|`x′`⟩ 位于 `T` 的零空间，我们记为 `𝒩(T)`。因此，零空间的正交补
    `𝒩(T)`⊥ 与算子的值域 Im `T` 之间存在双射。故我们将通过将输入 |`ψ`⟩ 分解为正交分量 |`ψ`⟩ = |`μ`⟩ + |`ν`⟩ 来实现非单射运算，其中
