    _{n}}V\\_{i}\\\\left( {y\\_{i},f^{- 1}\\\\left\\\\{ y\\_{i} \\\\right\\\\}} \\\
    \\right),$ \n\nwhere these *y*[*i*] each have more than one preimage element;\
    \ for example, *f*^( − 1){*y*[*i*]} = {*x*[1],…, *x*[*n*[*i*]]}, where *n*[*i*] = |*f*^( − 1){*y*[*i*]}| ≥ 2.\
    \ The output state |*ψ*[*i*]⟩ for such a range element is the OR of the input\
    \ states |*ξ*[*j*]⟩ (*j* = 1, …, *n*[*i*]) of its preimage elements:\n\n|*ψ*[*i*]⟩|*γ*⟩ = *O**R*[*n*[*i*]]|*ξ*[1]⟩⋯|*ξ*[*n*[*i*]]⟩|1⟩^( ⊗ (*n*[*i*] − 1)),\
    \ \n\nwhere *O**R*[*n*[*i*]] is a cascade of *n*[*i*] − 1 *O**R*[2] gates and\
    \ |*γ*⟩ is 2(*n*[*i*] − 1) dimensional garbage. This is accomplished by the operators\
    \ `V[i]`(*y[i]*,{*x*[1],…, *x*[*n*[*i*]]}) ∈ ℒ(ℋ^(2*n*[*i*] − 1),ℋ^(2*n*[*i*] − 1)):\n\
    \n(2.35)$V\\_{i}\\\\left( {y\\_{i},\\\\left\\\\{ {x\\_{1},\\\\ldots,\\\\ x\\_{n\\\
    _{i}}} \\\\right\\\\}} \\\\right)\\\\overset{def}{=}\\\\left\\\\lbrack {y\\_{i},\\\
    \\gamma\\_{1},\\\\ldots,\\\\ \\\\gamma\\_{2{({n\\_{i} - 1})}}} \\\\right\\\\rbrack\\\
    \\leftarrow OR\\_{n\\_{i}}\\\\ \\\\left\\\\lbrack {x\\_{1},\\\\ldots,\\\\ x\\\
    _{n\\_{i}};\\\\ o\\_{1},\\\\ldots,\\\\ o\\_{n\\_{i} - 1}} \\\\right\\\\rbrack,$\
    \ \n\nwhere *o*[1], …, *o*[*n*[*i*] − 1] are the qubits that provide ancillary\
    \ |1⟩s for the ORs, and the garbage outputs *γ*[1], …, *γ*[2(*n*[*i*] − 1)] receive\
    \ the negated inputs and intermediate OR outputs. The bracket notation identifies\
    \ the qubits that are the inputs and outputs of *O**R*[*n*[*i*]]. This completes\
    \ the construction of `U[f]` [[eq. (2.29)](#bodymatter-002.xhtml#b_9783110670707-002_eq_029)].\n\
    \nThere are more efficient ways to compute `U[f]`, but the above construction\
    \ is easier to understand. This basic approach can be used to approximate a variety\
    \ of unary functions useful in neural networks, such as sigmoid functions, including\
    \ non-injective, non-surjective squashing functions. However, neural networks\
    \ also require non-unary functions such as addition and multiplication, to which\
    \ we now turn.\n\n## 2.4.3 Binary functions\n"
