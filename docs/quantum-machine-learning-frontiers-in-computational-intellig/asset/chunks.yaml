    \\otimes |\\\\psi\\_{3}\\\\rangle\\\\cdots|\\\\psi\\_{n}\\\\rangle|1\\\\rangle^{\\\
    \\otimes {({n - 2})}}} \\\\right\\\\rbrack\\\\quad(n > 2).$ \n\n为完整起见，我们定义 $OR_{1}\\\
    overset{def}{=}I$。\n\n在前述动机下，我们可以给出通过地形量子位映射计算任意有限函数的构造：\n\n### 命题 5\n\n假设 `f`:\
    \ `Ω` → `Ω′`，其中 `Ω` = `{x[1],…,x[n]}` 且 `Ω′` = `{y[1],…,y[n]}`。设 $m_{nr}\\overset{def}{=}n\
    \ - \\left| {{Im\\,}f} \\right|$ 为不在 `f` 值域中的陪域元素的数量。设 `n[b]` 为单射定义域元素的数量，且设 $n_{n}\\\
    ;\\overset{def}{=}\\; n - n_{b}$ 为非单射定义域元素的数量。设 $m_{n}\\overset{def}{=}\\left|\
