- raw: '## 1.5 Quantum neural networks


    Quantum neural networks (QNNs) are incarnations of neural network models entailing
    the principles of quantum mechanics. From the computational point of view \[[53](#bodymatter-001.xhtml#b_9783110670707-001_ref_053),
    [54](#bodymatter-001.xhtml#b_9783110670707-001_ref_054)\], one class of quantum
    neural network combine artificial neural network models and embed the features
    of quantum computing inside to evolve more robust and efficient models. The basic
    philosophy behind these efforts is to circumvent the limitations of classical
    neural networks in handling big data by resorting to the features of quantum parallelism,
    interference and entanglement. However, most of the QNN models try to replace
    the classical binary or the McCulloch-Pitts neurons with qubits (also called “qurons”)
    manifested with quantum mechanical principles.


    In 1995, Subhash Kak \[[55](#bodymatter-001.xhtml#b_9783110670707-001_ref_055)\]
    and Ron Chrisley \[[56](#bodymatter-001.xhtml#b_9783110670707-001_ref_056)\] put
    forward the idea of a quantum neural model by establishing the similarity of the
    neural activation function with the quantum mechanical Eigenvalue equation. Ajit
    Narayanan and Tammy Menneer introduced a photonic implementation of a quantum
    neural network using the many-universe theory which collapses into the desired
    states on application of quantum measurement \[[57](#bodymatter-001.xhtml#b_9783110670707-001_ref_057)\].
    Since then, a lot of efforts have been invested to find the quantum version of
    the perceptron. However, the advances in this direction was impeded due to the
    fact that the characteristic neural nonlinear activation functions seldom follow
    the mathematical structure of quantum theory due to the inherent linear operations
    in a quantum system. After much effort, Schuld, Sinayskiy and Petruccione used
    the quantum phase estimation algorithm \[[58](#bodymatter-001.xhtml#b_9783110670707-001_ref_058)\]
    to implement the activation function. Apart from this, lots of quantum-inspired
    models have come up to implement a fuzzy logic based neural network \[[59](#bodymatter-001.xhtml#b_9783110670707-001_ref_059)\].


    Elizabeth Behrman and Jim Steck \[[60](#bodymatter-001.xhtml#b_9783110670707-001_ref_060)\]
    proposed a novel quantum computing setup comprising a number of qubits with tunable
    mutual interactions. In their model, the interaction strengths are updated using
    a training set of desired input-output relations following the classical back-propagation
    algorithm thereby enabling the quantum network to learn an algorithm.


    The quantum associative memory was introduced by Dan Ventura and Tony Martinez
    in 1999 \[[61](#bodymatter-001.xhtml#b_9783110670707-001_ref_061)\]. The authors
    proposed an algorithm to emulate an associative memory for a circuit-based quantum
    computer. In this algorithm, the memory states are envisaged as a superposition
    of quantum states. A quantum search algorithm is then used to retrieve the memory
    state closest to a given input. This emulation promises an exponential storage
    capacity of memory states.


    ## 1.6 Conclusion


    This chapter provides an overview of the basic concepts and principles pertaining
    to quantum machine learning. Apart from throwing light on different aspects of
    quantum algorithms, the chapter also provides a bird’s eye view on the principles
    of quantum reinforcement learning and quantum annealing. The evolution of quantum
    neural networks with special mention to the pioneering works in this direction
    is also touched upon to enlighten the readers.


