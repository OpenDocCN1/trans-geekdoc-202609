    \ techniques [[57](#bodymatter-003.xhtml#b_9783110670707-003_ref_057)].\n\n1.\
    \ Employ Hamiltonian `Ĥ(s) = (1-s(t))*H[ini] + s(t)*H[fin]`, where `s(t)` is as\
