    ## 5.4 Fundamental idea of quantum computing


    A classical computer is capable to hold a single binary bit 0 or 1 at a time.
    Unlike classical computer, a quantum computer is capable to store a unit of information
    which is called quantum bit or `qubit`, in which a single `qubit` is able to store
    the numbers zero (0) and one (1) at the same moment, which referred as the superposition
    state in quantum computing \[[24](#bodymatter-005.xhtml#b_9783110670707-005_ref_024),
    [25](#bodymatter-005.xhtml#b_9783110670707-005_ref_025), [26](#bodymatter-005.xhtml#b_9783110670707-005_ref_026)\].
    It is known that the `qubits` are able to accomplish numerous processes simultaneously
    which yields fastest execution of process. In a two-dimensional Hilbert space,
    a `qubit` are represented by a unit vector and are considered as a two state quantum-mechanical
    phenomena. In QC, the superpositions of the basis states are represented by the
    following equation.


    $|\Psi\rangle = \sum\limits_{i = 1}^{n}\mathcal{C}_{i}|\mathcal{V}_{i}\rangle$
    (5.7)|*Ψ*⟩ = 𝒞[1]|𝒱[1]⟩+ 𝒞[2]|𝒱[2]⟩ + …+ 𝒞[*n*]|𝒱[*n*]⟩


    where, 𝒱[*i*] is the *i*^(*t**h*) quantum states and 𝒞[*i*] ∈ ℂ. For a two states
    quantum bit or qubit, [eq. (5.7)](#bodymatter-005.xhtml#b_9783110670707-005_eq_007)
    can be denoted by a linear superposition as |*Ψ*⟩=𝒞[1]|0⟩ + 𝒞[2]|1⟩, in which,
    the state |0⟩ is acknowledged as “ground state” and |1⟩ is acknowledged as “excited
    state”, and 𝒞[*i*] belongs to the set of complex number which should satisfy the
    following normalization condition.


    (5.8)$\sum\limits_{i = 1}^{n}|\mathcal{C}_{i}|^{2} = 1$


    In QC, there exist two striking features, viz., Coherence and Decoherence. Coherence
    is represented by the linear superposition (|*Ψ*⟩) of the basis states whereas,
    decoherence is occurred when a forceful destruction is happened on the previously
    defined linear superposition. Quantum computing generally uses quantum logic gates
    as hardware devices.


    A predefined unitary operator is used to update the `qubits` within a fixed time
    period. Mathematically, the unitary `U` operator quantum gates hold the relation
    `U†` = `U^(-1)` and `U U†` = `U† U` = `I`.


    In quantum computer a `n` qubit quantum register is able to store 2^(`n`) states
    simultaneously. As for example the eight states |000〉, |001〉, |010〉, |011〉, |100〉,
    |101〉, |110〉 and |111〉 require three quantum registers in which the three qubit
    system can be represented as $\left\lbrack {\begin{matrix} \alpha_{1} \\ { \beta_{1}\
    } \\ \end{matrix}\ \begin{matrix} \alpha_{2} \\ { \beta_{2}\ } \\ \end{matrix}\begin{matrix}
    \alpha_{3} \\ { \beta_{3}\ } \\ \end{matrix}} \right\rbrack$ where `α[i]`² + `β[i]`² = 1,
    `i` = 1, 2, 3.


    But in case of classical computer in order to store these eight states eight registers
    are required.


    There are several quantum gates exists, such as Rotation Gate, Pauli – X Gate
    or NOT Gate, C-NOT Gate, Toffoli Gate, Fredkin Gate and Hadamard Gate \[[24](#bodymatter-005.xhtml#b_9783110670707-005_ref_024),
    [25](#bodymatter-005.xhtml#b_9783110670707-005_ref_025), [26](#bodymatter-005.xhtml#b_9783110670707-005_ref_026)\]
    etc. and they can be used in several ways in different types of problems.


    Rotation gate strategy can be used to update the values of (`α[i]`, `β[i]`) of
    the `i`^(*t**h*) qubit by the following equation.


    (5.9)$\begin{pmatrix} \alpha_{i}^{\prime} \\ \beta_{i}^{\prime} \\ \end{pmatrix}
    = \ \left( {\begin{matrix} {\cos\theta_{i}} \\ {\sin\theta_{i}} \\ \end{matrix}\
    \begin{matrix} {- \sin\theta_{i}} \\ {{cos}\theta_{i}} \\ \end{matrix}} \right)\
    \begin{pmatrix} \alpha_{i} \\ \beta_{i} \\ \end{pmatrix}$


    Here, the rotation angle for each of the `qubit` is represented by `θ[i]`, which
    is chosen according to specific problem. If `α[i]` and `β[i]` represent the probability
    amplitude of a `qubit` before rotation then after rotation they become `α[i]′`
    and `β[i]′` respectively and can be achieved by the following way.


    (5.10) $\begin{pmatrix} \alpha_{i}^{\prime} \\ \beta_{i}^{\prime} \\ \end{pmatrix}
    = \ \begin{pmatrix} {\cos\left( {\theta + \ \delta} \right)_{i}} \\ {\sin\left(
    {\theta + \ \delta} \right)_{i}} \\ \end{pmatrix}$


    where $\begin{pmatrix} \alpha_{i} \\ \beta_{i} \\ \end{pmatrix} = \begin{pmatrix}
    {\cos\delta_{i}} \\ {\sin\delta_{i}} \\ \end{pmatrix}$


    ## 5.5 Cluster validity index


    In the year 1979, David L. Davies and Donald W. Bouldin introduced an efficient
    cluster validity index, named, Davies-Bouldin (DB) Index \[[40](#bodymatter-005.xhtml#b_9783110670707-005_ref_040)\],
    which was used in this article as an objective function to compute the fitness
    of each individual. The optimum number of clusters within a given dataset is determined
    by the calculated value of the `DB` index \[[40](#bodymatter-005.xhtml#b_9783110670707-005_ref_040)\],
    where, minimum value of `DB` index \[[40](#bodymatter-005.xhtml#b_9783110670707-005_ref_040)\]
    is taken for consideration. It can be considered as a function of the ratio between
    the sum of within-cluster scatter and the cluster separation. Let us consider
    the cluster similarity measure is `CM[ij]` between two different clusters `Cl[i]`
    and `Cl[j]`. It is given by:


    (5.11)$ CM_{ij} = \frac{dM_{i} + \ dM_{j}}{d_{ci\_ cj}}$


    Here `dM[i]` be the dispersion measure of `i`^(*t**h*) cluster and is denoted
    as


    $dM_{i} = \left\lbrack {\frac{1}{tn\_ o_{i}}\sum_{k = 1}^{tn\_ o_{i}}{\parallel
    {Dp_{k}^{(i)} - Cc_{i}} \parallel}^{2}} \right\rbrack^{\frac{1}{2}}$


    such that, `tn_o[i]` denotes the total number of objects and `Cc[i]` denotes the
    `i`^(*t**h*) cluster center in cluster `Cl[i]` and ∀`Dp[k]^(i)`∈ `Cl[i]`.


    The distance between the clusters `Cl[i]` and `Cl[j]` and can be defined as


    `d[ci_cj]` =  ∥ `Cc[i]` − `Cc[j]`∥.


    The following equation is used to define the Davies – Bouldin (DB) index \[[40](#bodymatter-005.xhtml#b_9783110670707-005_ref_040)\].


    (5.12)$DB\_ I = \frac{1}{no_{c}}\sum_{i = 1}^{no_{c}}H_{i}$


    Where $H_{i} = \max\limits_{j = 1,2,\ldots,no_{c},\; i \neq j}\left( {CM_{ij}}
    \right),\; i = 1,2,\ldots,\; no_{c}$


    ## 5.6 Quantum inspired Genetic algorithm


    ### 5.6.1 Proposed methodology for QIGA


    In this section, the operational strategy of quantum inspired GA algorithm is
    discussed. In order to recognize the optimum number of cluster presents within
    images, the proposed method was experimented on image dataset.

