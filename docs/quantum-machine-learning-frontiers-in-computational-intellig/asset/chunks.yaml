    `f` = `Ω`′ = {`y`[1],…,`y`[`m`]}。因此 `ℋ(Ω′)` 是 `ℋ′` 的子空间。设 { |`w`[1]⟩,…, |`w`[`n`
    − `m`]⟩ } 为 `ℋ(Ω′)`⊥ 的一组基，即 `ℋ(Ω′)` 在 `ℋ′` 中的正交补。（该子空间将表示“垃圾”，在计算上无关紧要。）

    我们将定义 { |`u`[1]⟩,…, |`u`[`m`]⟩ } 为 `𝒩(T)`⊥ 的任意 ON 基（`T` 的行空间），其中 `m` 为 `T` 的秩，并将定义
    { |`v`[1]⟩,…, |`v`[`n[o]`]⟩ } 为 `𝒩(T)` 的任意 ON 基，其中 `n[o]` = `n` − `m` 为 `T` 的零度。这些基将决定任意输入被分离成的正交分量
    |`μ`⟩ ∈ `𝒩(T)`⊥ 和 |`ν`⟩ ∈ `𝒩(T)`。

