    ## 2.3 地形基映射


    在大脑中，地形图的状态是一个定义在（通常是二维）空间 Ω 上的实值函数。为了将这些思想应用于量子计算，我们考虑一个量子态 |*ψ*⟩，其中位置 **r** ∈ Ω
    处的概率幅 *ψ*(**r**) 通过对应关系 **r **\= *µ*(**x**) 表示值 **x** 的幅值（存在、重要性等）。这里 **r** ∈ Ω
    可以是一个连续指标，表示例如空间位置，或离散量子态的指标，如波长或量子比特寄存器的状态。态 |*r*⟩ 构成了输入和输出量子态的离散基或连续伪基。在连续情况下，输入值
    **x** 由连续基态 |*μ*(**x**)⟩ 表示，它是 **r **\= *µ*(**x**) 处的狄拉克单位脉冲，即 |**r**⟩ = *δ***[r]**，其中
