    centroids.


    ```

    (5.19)$\\ \\delta_{i} = \\ \\{\\begin{matrix} {1\\ if\\ \\beta_{i} > \\ \\alpha_{i}\\
    } \\\\ {0\\ Otherwise} \\\\ \\end{matrix}$

    ```


    where, `δ[i]`(`1` < `i` < `n`) was the activation threshold. By observing the
    value of `δ[i]`, the cluster centroids were chosen from a single solution. Here
    `α[i]` and `β[i]` were the complex coefficients and `δ[i]` was considered similar
    to the state of the quantum bit. A value of 1 for `δ[i]` represents the activated
    cluster center implies that the quantum bit is in excited state otherwise it is
    in the ground state. The following [Figure 5.1](#bodymatter-005.xhtml#b_9783110670707-005_fig_001)
    is showing the Cluster Centroid representation scheme.


    ## 5.8.2 Experimental result analysis


    In this article two different population based quantum inspired meta-heuristic
    algorithms, viz., quantum inspired genetic algorithm and quantum inspired bat
    algorithm are presented. The experiment was performed over four Berkeley images
    and two real life images. The performance of any meta-heuristic algorithm is very
    much dependent upon the settings of the parameter i.e., an appropriate selection
    of parameters can influence the convergence speed of the meta-heuristic algorithm
    to a great level.


    The parameters for QIGA were chosen as Number of generations was considered for
    the range of values 100 to 500; Population size was taken from 25 to 50. Mutation
    probability was chosen as 0.01. And for CGA the number of generations was considered
    from 100 to 500. Population size was taken from 25 to 50. Crossover and Mutation
    probability was chosen as 0.9 and 0.01 respectively. The parameters for QIBA and
    CBA were chosen as number of iterations from 100 to 300, Population size was taken
    from 25 to 50, `γ` = `α` = 0.5, initially pulse rate could be denoted as `r[i]⁰`
    ∈ `[0, 1]`, the wavelength range was [`λ[min]`, `λ[max]`] = `[0, 1]`, and the
    range of frequency was [`F[min]`, `F[max]`] = `[0, 1]` and the loudness `L[0]`
    = 0.5.


    During the Experiment it was seen that the quantum inspired methods can produce
    a good result without having a large population or large number of iteration than
    their corresponding classical methods. Due to the probability amplitude (`α`,
    `β`) of qubits a single solution may generate several solutions which may lead
    to increase the size of a small population. So in case of quantum inspired methods
    the search can start with a small population. For each of the specific settings
    of parameters each procedure was run for 30 times. The mean value of the fitness
    was computed from several runs. The computed valued from several runs was presented
    in the following tables.


    The optimal number of clusters along with their associated optimal fitness value
    for all the implemented algorithms like QIGA, CGA, QIBA and CBA were presented
    in [Table 5.1](#bodymatter-005.xhtml#b_9783110670707-005_tab_001). From [Table
    5.1](#bodymatter-005.xhtml#b_9783110670707-005_tab_001) it can be stated that
    the computed fitness value from the method QIBA was providing the best fitness
    value (minimum value) among all other implemented methods for every image datasets
    and it was also seen that the better fitness values were achieved from quantum
    inspired methods than their classical counterparts. In [Table 5.2](#bodymatter-005.xhtml#b_9783110670707-005_tab_002)
    the optimal execution time for all the implemented methods was presented which
    shows that the quantum inspired methods were taking less time than their classical
    counterparts and the processing time taken by QIBA was the minimal among other
    methods. [Table 5.3](#bodymatter-005.xhtml#b_9783110670707-005_tab_003) provides
    the computed mean value, standard deviation and standard error from QIGA and CGA.
    Here it is seen that QIGA is providing more promising results than CGA in terms
    of mean, standard deviation and standard error. Similarly QIBA is providing more
    promising results than CBA which is presented in [Table 5.4](#bodymatter-005.xhtml#b_9783110670707-005_tab_004).
    From these two tables it is seen that QIBA has the minimum error among all other.
    The statistical superiority test named unpaired `t-test` was performed between
