    量子纠缠 \[28\] 是量子力学中一个非常重要的性质，其中量子比特通过一种未知的、不限于光速的通信方式瞬时相互作用，而与它们之间的距离无关。只要相关粒子保持隔离，无论它们之间的距离如何，仍保持纠缠。


    如果我们无法将多量子比特态分解为每个量子比特各自的确定态的直积，则该态是纠缠的。因此，一对量子比特 `A` 和 `B` 纠缠当且仅当我们无法将联合态 |`ψ`[`A``B`]?⟩
    写成量子比特 A 的态与量子比特 B 的态的乘积，即当且仅当 |`ψ`[`A``B`]?⟩=|`ψ`[`A`]?⟩ ⊗ |`ψ`[`B`]?⟩ 对任意态 |`ψ`[`A`]?⟩
    和 |`ψ`[`B`]?⟩ 都不成立。


    我们考虑两个非相互作用的系统 `A` 和 `B`，关于有限维希尔伯特空间 `H`[`A`] 和 `H`[`B`]。


    `H`[`A`] ⊗ `H`[`B`] 是希尔伯特空间中复合系统的张量积。复合系统的态为 |`ψ`[`A`]?⟩ ⊗ |`ψ`[`B`]?⟩，其中第一个系统处于态
    |`ψ`[`A`]?⟩，第二个处于态 |`ψ`[`B`]?⟩。


    上述表示的复合系统态是可分离态。但一般来说，并非所有态都是可分离态。


    通过固定 `H`[`A`] 的基 |`i`[`A`]?⟩ 和 `H`[`B`] 的基 | `j`[`B`]?⟩，`H`[`A`] ⊗ `H`[`B`] 中最一般的态形式为：


    (4.12)$|\\psi\_{AB}\\rangle = \\sum\\limits\_{i,j}c\_{ij}\\left| {i\_{A}\\rangle\\;
    \\otimes \\;} \\right|j\_{B}\\rangle$


    该态可分离的条件为


    (4.13)*c*[*i**j*] = *c*[*i*]^(`A`)*c*[*j*]^(`B`)


    由此得到：


    (4.14)$|{\\psi\_{A}\\rangle = \\sum\\limits\_{i,j}c\_{i}^{A}|{i\_{A}\\rangle\\;{and}}\\;|\\psi\_{B}\\rangle
    = \\sum\\limits\_{j}c\_{i}^{B}}|j\_{B}\\rangle\\ $


    如果


    (4.15)*c*[*i**j*] ≠ *c*[*i*]^(`A`)*c*[*j*]^(`B`)


    如果一个态不可分离，则称为纠缠态。


