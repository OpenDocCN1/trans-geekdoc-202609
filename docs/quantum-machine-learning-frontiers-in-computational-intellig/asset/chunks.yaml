    \\psi\\_{1}\\\\left( t \\\\right)\\\\left| \\\\frac{dH}{dt} \\\\right|\\\\psi\\\
    _{0}\\\\left( t \\\\right)\\\\rangle$\n\nThe adiabatic theorem states that if\
