    for scalars `s`, `s′`, `t`, `t′` and for `|γ⟩` ∈ `ℋ[G]`. That is, the input register
    is initialized to the input `|x[j]⟩` with some positive amplitude `s`, possibly
    with superimposed garbage with amplitude `t`; the ancillary input register is
    initialized to constant `|y[0]⟩`. After computation, the output register will
    contain the function’s value `|f(x[j])⟩` with some positive amplitude `s′`; and
    superimposed garbage with amplitude `t′`. The ancillary output register may also
    contain garbage. In other words, the argument to `f` is in the first input register
