    Topographic maps provide another point of contact between artificial neural networks
    and quantum computation, because the computational maps in the brain are large
    and dense enough that they can be usefully treated mathematically as *fields*,
    that is, as continuous distributions of continuous quantity \[[9](#bodymatter-002.xhtml#b_9783110670707-002_ref_009)\].
    Such representations are suggestive of quantum mechanical wave functions, which
    are also continuous distributions of continuous quantity (the complex probability
    amplitude). In both cases these fields are treated mathematically as continuous
    functions on a continuous domain, and Hilbert spaces provide the mathematical
    framework for describing them \[[7](#bodymatter-002.xhtml#b_9783110670707-002_ref_007)\].
    In this chapter we exploit this analogy to implement brain-inspired approaches
    to quantum machine learning.


    Because of their spatial representation of values, topographic maps can be used
    to implement arbitrary functions in the brain, essentially by a kind of table
    lookup. Suppose the brain needs to implement a (possibly nonlinear) transformation,
    `y = f(x)`. This can be accomplished by neural connections from locations `r =
    µ(x)` in the input map to corresponding locations `s = μ''(y) = μ''[f(x)]` in
    the output map that represents the result space. Thus activity representing `x`
    in the input map will cause corresponding activity representing `y` in the output
    map. Moreover, a superposition of input values will lead to a corresponding superposition
    of output values. Therefore, topographic representations allow the computation
    of nonlinear functions in linear superposition \[[9](#bodymatter-002.xhtml#b_9783110670707-002_ref_009),
    [10](#bodymatter-002.xhtml#b_9783110670707-002_ref_010), [11](#bodymatter-002.xhtml#b_9783110670707-002_ref_011),
    [12](#bodymatter-002.xhtml#b_9783110670707-002_ref_012), [13](#bodymatter-002.xhtml#b_9783110670707-002_ref_013)\],
    which suggests their usefulness in quantum computation \[[7](#bodymatter-002.xhtml#b_9783110670707-002_ref_007)\].
    On the other hand, topographic maps make relatively inefficient use of representational
    resources, because every represented value has to have a location in the map \[although
    this can be mitigated by means of *coarse coding*, by which precise values are
    represented by a population of broadly tuned neurons with overlapping receptive
    fields \[[14](#bodymatter-002.xhtml#b_9783110670707-002_ref_014), [15](#bodymatter-002.xhtml#b_9783110670707-002_ref_015)\]\].
    Therefore, use of topographic representations will require a reasonably scalable
    quantum computing technology. In this chapter we explore two topographic approaches
    to quantum computation with a focus on machine learning.


    ## 2.3 Topographic basis maps


    In the brain, the state of a topographic map is a real-valued function defined
    over a (typically two-dimensional) space Ω. To apply these ideas in quantum computation,
    we consider a quantum state |*ψ*⟩ in which the probability amplitude *ψ*(**r**)
    at location **r** ∈ Ω represents the amplitude (presence, importance, etc.) of
    the value **x** via the correspondence **r **\= *µ*(**x**). Here **r** ∈ Ω may
    be a continuous index representing, for example, spatial location, or the index
    of a discrete quantum state, such as a wavelength or the state of a qubit register.
    The states |*r*⟩ form a discrete basis or continuous pseudo-basis for the input
    and output quantum states. In the continuous case, the input value **x** is represented
    by a continuous basis state |*μ*(**x**)⟩, which is a Dirac unit impulse at **r **\= *µ*(**x**),
    that is, |**r**⟩ = *δ***[r]** where *δ***[r]**(**s**) = *δ*(**s **− **r**). Similarly
    an output value **y** is represented by the continuous basis state |*μ*^′(**y**)⟩=|*μ*^′\[*f*(**x**)\]⟩ = *δ*[*μ*^′(**y**)].
    We call such a representation (whether discrete or continuous) a *topographic
    basis map*.


    For such a continuous basis we can define a Hilbert-Schmidt linear operator:


    $T\_{f} = \\int\\limits\_{\\mathcal{X}}^{}d\\mathbf{x}\\left| {\\mu^{\\prime}\\left\\lbrack
    {f\\left( \\mathbf{x} \\right)} \\right\\rbrack} \\right.\\rangle\\langle\\mu\\left(
    x \\right)|,$


    where 𝒳 is the space of input values. (We write *T *\= *T[f]* when *f* is clear
    from context.) This operator has the desired behavior: *T*|*μ*(**x**)⟩=|*μ*^′\[*f*(**x**)\]⟩
    for all **x** ∈ 𝒳. In this manner the linear operator *T* computes the nonlinear
    function *f* via the computational maps. We call such an operator a *graph kernel*
    because it uses the explicit *graph* of *f* \[that is, the set of pairs (*μ*^′\[*f*(**x**)\], *μ*(**x**))
    for all **x** ∈ 𝒳\] to do a kind of table lookup.[²](#fn2)


