    |`x`[`j`]`⟩ to |`f`(`x`[`j`])`⟩:


    (2.5)$T\\overset{def}{=}\\sum\\limits\_{j = 1}^{n}\\left| {f\\left( x\_{j} \\right)\\rangle}
    \\right|v\_{1}\\rangle\\langle x\_{j}|\\langle w\_{1}|.$


