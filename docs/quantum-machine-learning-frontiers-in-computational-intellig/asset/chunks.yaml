    3. Measure the qubits in `|Ψ(T)⟩` to find the solution of the problem and present\
    \ result by classical evaluation as objective function value, `y`.\n4. If `y`\
    \ is less than threshold `Yth`, then\n`Yth = y - Δy` where `Δy ≥ 0` for minimization\
    \ problem\n\ni. \nIf `I > T[tot]`, then Stop, where `T[tot]` is given by [eq.\
    \ (3.38)](#bodymatter-003.xhtml#b_9783110670707-003_eq_038)\n\nj. \n`I = I + T`\n\
    \nk. \n`m[e] = m[e] - 1`\n\nl. \nGo to c.\n\n### 3.8.1 Discussions\n\nThe nucleus\
