    # Genetic Algorithm (GA)


    The well-known nature inspired meta-heuristic algorithm named, Genetic Algorithm
    (`GA`) is a kind of evolutionary algorithm based on the concept of Darwin’s theory
    of evolution. John Holland is known as the inventor of `GA`, who proposed this
    algorithm in the year 1975 [[9](#bodymatter-005.xhtml#b_9783110670707-005_ref_009)].


    `GA` is a very useful population based adaptive searching process, in which each
    individual in a population is called a chromosome. In order to achieve the optimal
    solution `GA` basically explores the entire search space. During the search process
    the current population evolves to a same sized next population by applying three
    genetic operations, such as selection, crossover and mutation. In the successive
    iteration, the best chromosomes are selected among all the participating chromosomes
    from the previous pool and the selection is carried over depending upon their
    computed fitness value. Several methods can be used for the purpose of selection,
    such as Boltzmann selection, Roulette Wheel selection, Rank selection, Tournament
    selection etc. The crossover operation is used to produce a new pair of chromosomes
    by combining the portions of two or more randomly selected parent chromosomes
    which lead to produce a population by replacing the parent chromosomes by the
    new one. During the crossover operation one or multiple points can be selected
    as the partitioning points from each of the individual in the population. In order
    to ensure the genetic diversity in the population mutation operation takes place
    in which a randomly selected position of a randomly selected chromosome is altered
    depending upon a predefined value called mutation probability. This kind of alteration
    may be performed on a single point or multiple points of one or more randomly
    selected individuals in the population. In order to achieve faster convergence
    it is recommended to perform elitism at each generation. `GA` was already successfully
    applied in many applications like data clustering [[17](#bodymatter-005.xhtml#b_9783110670707-005_ref_017),
    [18](#bodymatter-005.xhtml#b_9783110670707-005_ref_018)], portfolio management
    [[41](#bodymatter-005.xhtml#b_9783110670707-005_ref_041)], image processing [[42](#bodymatter-005.xhtml#b_9783110670707-005_ref_042)]
    and many more.


    ## Basic Steps of Genetic Algorithm


    Basic steps involved in Genetic algorithm are presented as follows.

    1. Population of chromosomes is initialized randomly.

    2. Fitness of each of the chromosome is evaluated.

    3. Selection of chromosomes for next generation is done.

    4. Do the following steps until the termination condition are satisfied.

    5. Crossover is accomplished between a pair of randomly selected parent chromosomes
    to get child chromosomes, depending upon a predefined crossover probability.

    6. Mutation is applied on the randomly selected offspring/ chromosome to introduce
    diversity in the population, depending upon a predefined mutation probability.

    7. Selection is carried out for generating the next generation population.

    8. End Loop.


    # 5.3 Overview of Bat Algorithm


    In the year 2010, an efficient nature inspired population based meta-heuristic
    algorithm, viz., Bat algorithm and this algorithm was initially developed by Yang
    [[14](#bodymatter-005.xhtml#b_9783110670707-005_ref_014)]. This algorithm is capable
    to identify the optimal solution or near optimal solution from a given problem,
    which can be an optimization problem of simple or complex type. Bats generally
    use echolocation for sensing the prey and recognizing their roosting crevices
    at the dark. They can also avoid their upcoming obstacles by using echolocation.
    Generally, bats can be able to produce a very loud sound pulse and listen for
    the bounced back echo from their surroundings. Depending upon the loudness of
    the response and the time delay from the emission to the reflection they can understand
    the shape, size and the velocity of the prey and can navigate accordingly. It
    is known that the high frequency emitted sound pulses influence them to give detailed
    information about their close environment so that they are able to detect the
    position of the prey precisely and allow them to move shorter distances. But,
    if the emitted sound pulses have low frequency then they travel longer distance
    and provide rough information about their surroundings. Also the higher values
    of the loudness of the echolocation indicate that they are nearer to the prey
    and produce sound pulse very quickly. The following process describes the basic
    steps involved in the hunting strategy of the bats.

    1. All bats are able to detect the distance between the prey/food and the obstacles
    of their surroundings by using the echolocation characteristics.

    2. Bats are able to fly randomly from a position `P[i]` with the velocity `V[i]`,
    a fixed frequency `F[min]`, with varying wavelength `λ` and loudness `L[0]` to
    search the prey.

    3. Their loudness can be changed from a large number `L[0]` to a minimum constant
    number `L[min]` and also the frequency can vary from `F[min]` to `F[max]`.


    Let us considered in a search space, `n` numbers of bats are flying randomly.
    In a time stamp `t`, they are initiated their search from the position `P[i]`
    having initial velocity `V[i]`, frequency `F[min]`, pulse rate `r[i]` and loudness
    `L[0]`. At time stamp `t + 1`, they may change their next position and velocity
    by using the following equations.


    `(5.1) F[i] = F[min] + (F[min] - F[max]) * β`

    `(5.2) V[i]^(t + 1) = V[i]^(t) + (P[i]^(t + 1) - P[best]) * F[i]`

    `(5.3) P[i]^(t + 1) = P[i]^(t) + V[i]^(t + 1)`


    where, `β ∈ [0, 1]`. The minimum and the maximum frequencies are `F[min] = 0`
    and `F[max] = 2` respectively. Here, `P[best]` signifies the global best bat’s
    location among the positions of the `n` numbers of bats in the current population.
    After evaluating the fitness of all solutions in the population, the position
    of the best solution among them is identified as the global best position. Now,
    it remains to check whether the bats are near or far away from the prey by using
    their pulse rates. A low pulse rate `r[i]` with high probability (`rand[1] > r[i]`)
    indicates that the bats will fly near to the current superior bat before carrying
    out a short random fly there. Otherwise, it is considered that the bats are nearer
    to the prey and they will do a random fly around their current position. Here,
    `rand[1]` is a uniformly distributed random number between [0, 1]. The following
    equation is used to represent the new positions of the bats.


    `(5.4) P[new] = P[old] + ε * L^(t)`


    where, `ε ∈ [-1, 1]` and at the time stamp `t`, the average loudness of `n` bats
    is computed by $L^{t} = \\frac{1}{n}\\sum\_{i = 1}^{n}L\_{i}^{t}$. After the random
    fly, if a bat is able to achieve a better position than the current global best
    position and its emitted sound is loud enough and also better than a random number
    (`rand[2] < L[i]`), then it is considered that the bat will fly to this new position
    and the current global best position value will be updated with the newly generated
    position value. Here `rand[2]` is a random number which is distributed uniformly
    between [0, 1]. Now, the pulse rate (`r[i]`) of the bats are increased and the
    loudness (`L[i]`) of the bats are decreased simultaneously by the following equations.


    `(5.5) r[i]^(t + 1) = r[i]^0 * (1 - e^(-γ t))`

    `(5.6) L[i]^(t + 1) = α * L[i]^(t)`


    where, `r[i]^0 ∈ [0, 1]` represents the initial pulse rate in which `γ` (0 < `γ`
    < 1) and `α` (0 < `α` < 1) are constants. Now, the current `P[best]` is selected
    by computing the fitness of all the bats.


    ## Basic Steps of Bat Algorithm


    Basic steps involved in Bat algorithm are presented as follows.

    1. Bat population `𝒫` is initialized randomly.

    2. Pulse frequency (`ℱ`), velocity (`𝒱`), pulse rate (`r[i]`) and loudness (`ℒ[0]`)
    are initialized for each of the individual.

