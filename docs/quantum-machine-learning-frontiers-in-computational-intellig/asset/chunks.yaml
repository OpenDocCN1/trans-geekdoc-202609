    \ learning. Apart from throwing light on different aspects of quantum algorithms,\
    \ the chapter also provides a bird’s eye view on the principles of quantum reinforcement\
    \ learning and quantum annealing. The evolution of quantum neural networks with\
    \ special mention to the pioneering works in this direction is also touched upon\
    \ to enlighten the readers.\n\nOne of the most common information representations\
    \ in the brain is the topographic or computational map, in which neurons are arranged\
    \ systematically according to the values they represent. By representing quantitative\
    \ relationships spatially, computational maps enable the brain to compute complex,\
