    # 1 Introduction to quantum machine learning


    Sandip Dey Department of Computer Science, Sukanta Mahavidyalaya, Jalpaiguri,
    West Bengal, India Sourav De Department of Computer Science & Engineering, Cooch
    Behar Government Engineering College, Cooch Behar, West Bengal, India Siddhartha
    Bhattacharyya CHRIST (Deemed to be University), Department of Computer Science
    and Engineering, CHRIST (Deemed to be University), Bangalore, India, Hosur Road,
    560029, Kolkata, Bangalore, Karnataka, India


    ## Abstract


    Quantum Machine Learning (QML) is popularly known to be an integrative approach
    to learning of the Quantum Physics (QP) and Machine Learning (ML). In this chapter,
    an outline of the fundamental ideas and features related to quantum machine learning
    is laid out. The different facets of quantum algorithms are discussed in this
    chapter. In addition to this, the basic features of quantum reinforcement learning
    and quantum annealing are also provided in this chapter. Finally, the chapter
    deliberates about the advancement of quantum neural networks to through light
    in the direction of QML.


    Keywords: machine learning, Grover’s Search Algorithm, reinforcement learning,
    quantum annealing, quantum neural networks,


    ### 1.1 Quantum machine learning

