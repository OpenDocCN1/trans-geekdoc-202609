    In \[[34](#bodymatter-003.xhtml#b_9783110670707-003_ref_034)\], it was demonstrated
    that a partial adiabatic search algorithm on quantum circuit model could be implemented
    and the performance of the algorithm was same as that of the local adiabatic algorithm
    for the case where a single element is marked i.e. `M = 1` by investigating the
    minimum energy gap between the first excited state and the ground state of the
    system Hamiltonian. Moreover, the algorithm keeps the advantages of global adiabatic
    algorithms without losing the speedup of the local adiabatic search algorithm
    by evolving globally only for a small interval during evolution from initial to
    final / problem Hamiltonian.


    In \[[22](#bodymatter-003.xhtml#b_9783110670707-003_ref_022)\], it was shown that
    quantum circuit models can simulate efficiently an arbitrary AQC based algorithm.
    Subsequently, it has also been shown in \[[35](#bodymatter-003.xhtml#b_9783110670707-003_ref_035)\]
    that an appropriate AQC based algorithm can efficiently simulate any quantum circuit
    model. Further a simple proof of equivalence between adiabatic quantum computation
    and quantum computation in the circuit model has been provided by Mizel et al.
    \[[36](#bodymatter-003.xhtml#b_9783110670707-003_ref_036)\]. Therefore, AQC and
    Quantum Circuit models of computation are essentially equivalent, which implies
    that a quantum algorithm can be designed in either of the two models for solving
    difficult problems. Brady and Van Dam has also investigated the necessary run-time
    required for AQC based optimization \[[37](#bodymatter-003.xhtml#b_9783110670707-003_ref_037)\]
    and showed that nonadiabatic speedup does not occur for general cases but only
    for special case. Recently, Quantum Approximate Optimization Algorithm (QAOA)
    \[[38](#bodymatter-003.xhtml#b_9783110670707-003_ref_038), [39](#bodymatter-003.xhtml#b_9783110670707-003_ref_039)\]
    and the Variational Quantum Eigensolver \[[40](#bodymatter-003.xhtml#b_9783110670707-003_ref_040)\]
    have been proposed to address classical combinatorial optimization and quantum
    chemistry problems, respectively.


    In this chapter, a framework based on Adiabatic Quantum Computation for solving
    global optimization problem has been proposed in [Section 3.4](#bodymatter-003.xhtml#b_9783110670707-003_s_003_s_004).,
    which would be helpful in training of Machine Learning techniques which models
    non-linear processes unlike their computationally efficient counterparts. Further,
    constrained optimization using AQC was discussed in \[[41](#bodymatter-003.xhtml#b_9783110670707-003_ref_041)\].


    ## 3.3 Adiabatic quantum computation


    Adiabatic quantum computation \[[42](#bodymatter-003.xhtml#b_9783110670707-003_ref_042)\]
    is an alternative approach to quantum computing that has been shown to be equivalent
    to the quantum circuit model, but appears to have some advantages over the circuit
    model \[[31](#bodymatter-003.xhtml#b_9783110670707-003_ref_031)\]. It is based
    on a well-known technique in quantum mechanics, called adiabatic approximation
    \[[43](#bodymatter-003.xhtml#b_9783110670707-003_ref_043)\]. It is used for determining
    approximate solutions of Schrodinger equation subject to the condition that the
    Hamiltonian governing the dynamics of the system is changing slowly with time.
    This implies that if a quantum system is prepared in its nth eigenstate, then
    it will stay in the nth eigenstate throughout the evolution provided the neighborhood
    energy gaps are large enough and its Hamiltonian varies slowly enough.


    Let a quantum system in state `|φ〉` evolve according to the Schrodinger’s equation:


    (3.1)$i\\hslash\\frac{d}{dt}|\\Phi\\left( t \\right)\\rangle = {}H\\left( t \\right)|\\Phi\\left(
    t \\right)\\rangle$


    where `H(t)` is the Hamiltonian of the quantum system and `ħ` is reduced Planck’s
    constant \[[31](#bodymatter-003.xhtml#b_9783110670707-003_ref_031)\]. Let `H[ini]`
    be the Hamiltonian of the system in its initial state i.e. at `t = 0` and `H[fin]`
    be the Hamiltonian of the system in its final state i.e. at `t = T`, where


    (3.2)`H(t) = (1 - s(t)) H[ini] + s(t) H[fin]`


    where `s(t)` is a continuous function with `s(0) = 0` and `s(T) = 1`. The instantaneous
    eigenstates associated with `H[i]` are denoted by `|ψ[i]⟩`. In general, let eigenstates
    of `H(t)` be `|ψ[k](t)⟩` such that:


    (3.3)`H(t) |ψ[k](t)⟩ = E[k](t) |ψ[k](t)⟩`


    where `E[k](t)` are the corresponding eigenvalues and `k` labels the eigenstates
    (`k = 0` indicates the ground state).


    The minimum gap between the lowest two eigenvalues is defined as follows:


    (3.4)$g\_{min} = \\min\\limits\_{0 \\leq t \\leq T}\\lbrack E\_{1}\\left( t \\right)
    - E\_{0}\\left( t \\right)\\rbrack$


    The maximum value of the matrix element of `dH/dt` between the two corresponding
    eigenstates is given by the following equation:


    (3.5)$D\_{max} = \\max\\limits\_{0 \\leq t \\leq T}\\left| \\left\\langle \\frac{dH}{dt}
    \\right\\rangle\_{1,0} \\right|$


    where `⟨ dH/dt ⟩_{1,0} = ⟨ψ1(t) | dH/dt | ψ0(t)⟩`


    The adiabatic theorem states that if the system at time `t = 0` is in its ground
    state `|ψ[ini]⟩ = |ψ[0](0)⟩` and let it evolve under the Hamiltonian `H(t)`, then


    (3.6)`|⟨ψ[0](T) | Φ(T)⟩| ≥ 1 - ε²`


    provided:


    (3.7)$\\frac{D\_{max}}{g\_{min}^{2}} \\leq \\varepsilon$


    where `0 < ε ≪ 1`,


    and


    (3.8)$\\left| \\frac{\\langle\\psi\_{1}\\left( t \\right)\\left| \\frac{dH}{dt}
    \\right|\\psi\_{0}\\left( t \\right)\\rangle}{\\left\\lbrack {E\_{1}\\left( t
    \\right) - E\_{0}\\left( t \\right)} \\right\\rbrack^{2}} \\right| < \\varepsilon,t\\
    \\epsilon\\ \\left\\lbrack {0,T} \\right\\rbrack.$


    where `ε ≪ 1`.


    The above conditions for adiabatic computation are based on Folk theorem, which
    has come under criticism recently \[[44](#bodymatter-003.xhtml#b_9783110670707-003_ref_044)\].
    These conditions do not guarantee general applicability of Adiabatic approximation.
    A number of attempts have been made to rigorously study Adiabatic Theorem and
    provide new conditions for generic applicability of adiabatic approximation \[[45](#bodymatter-003.xhtml#b_9783110670707-003_ref_045)\].
    Tong et al. have also proposed a set of conditions, which are sufficient for verifying
    the validity of adiabatic approximation \[[46](#bodymatter-003.xhtml#b_9783110670707-003_ref_046)\].
    These are three conditions:


    (3.9) $\\!\\!\\!\\! I.\\quad\\quad\\left| \\frac{\\langle\\psi\_{n}\\left( t \\right)|\\psi\_{\\!\\!
    m}^{\\prime}\\left( t \\right)\\rangle}{E\_{n}\\left( t \\right) - E\_{m}\\left(
    t \\right)} \\right| \\ll 1,{}t\\ \\epsilon\\ {}{}\\left\\lbrack {0,T} \\right\\rbrack$
    (3.10) ${II}.\\quad\\;\\;\\int\\limits\_{0}^{T}\\left| {\\left( \\frac{\\langle\\psi\_{n}\\left(
    t \\right)|\\psi\_{\\!\\! m}^{\\prime}\\left( t \\right)\\rangle}{E\_{n}\\left(
    t \\right) - E\_{m}\\left( t \\right)} \\right)^{\\prime}} \\right|dt \\ll 1$
    (3.11) $\\quad\\quad\\quad\\quad\\;{III}.\\quad\\int\\limits\_{0}^{T}\\left| \\left(
    \\frac{\\langle\\psi\_{n}\\left( t \\right)|\\psi\_{\\!\\! m}^{\\prime}\\left(
    t \\right)\\rangle}{E\_{n}\\left( t \\right) - E\_{m}\\left( t \\right)} \\right)^{\\prime}
    \\right|\\left| {\\langle\\psi\_{n}\\left( t \\right)|\\psi\_{l}\\!^{\\prime}\\left(
    t \\right)\\rangle} \\right|dt \\ll 1$


    where `m ≠ l`, `n ≠ m`, `T` is total evolution time, `|ψ[k](t)⟩` and `E[k](t)`
    are eigenvectors and corresponding eigenvalues of `H` at time `t`, `k = 1,…,N`
    (`N` is the size of state space of the system, which includes `l`, `m` and `n`).
    `ψ′[m]` is first derivative of `ψ[m]`.

