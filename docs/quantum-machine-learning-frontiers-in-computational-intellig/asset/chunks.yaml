- raw: 'Some popular Machine Learning algorithms are Artificial Neural Networks (ANN)
    \[[8](#bodymatter-003.xhtml#b_9783110670707-003_ref_008)\], Support Vector Machines
    (SVM) \[[9](#bodymatter-003.xhtml#b_9783110670707-003_ref_009)\], K-means Clustering
    \[[10](#bodymatter-003.xhtml#b_9783110670707-003_ref_010)\], Regression \[[11](#bodymatter-003.xhtml#b_9783110670707-003_ref_011)\],
    Decision trees \[[12](#bodymatter-003.xhtml#b_9783110670707-003_ref_012)\] etc.
    The generic steps involved in any machine learning project are as follows:


    Data collection: This step involves collecting data pertaining to the problem
    to be solved. The data should be of high quality, which is necessary for a high
    quality model. There are several measures available to evaluate the quality of
    data \[[13](#bodymatter-003.xhtml#b_9783110670707-003_ref_013)\]. Low quality
    of data will generally result in low quality of model and subsequently predictions
    or decisions.


    Model selection: This step involves selection of a specific technique like ANN
    or SVM etc. Further, it also involves selecting the structure of the model i.e.
    in case of ANN, number of hidden layers, no. of neurons in each hidden layer,
    activation functions etc.


    Training: In this step, the parameters of the model are decided i.e. in case of
    ANN and SVM, weights are determined using some loss function i.e., a loss function
    which represents the performance of the model on training data set is used to
    search / compute the weights.


    Validation: In this step, the performance of the model on testing data set is
    determined and compared with other existing models.


    Deployment: Finally the model is deployed so that it can be used for making predictions
    or decisions in real situations.


    The first step is specific to the problem being solved by using machine learning,
    but can be automated in most cases, to make data collection process reliable,
    quick and cheap. The second step of Model selection usually requires past experience
    and trial and error approach, which can be translated into a heuristic \[[13](#bodymatter-003.xhtml#b_9783110670707-003_ref_013)\].
    The selection of the model is often done more than once and is typically based
    on the empirical evidence regarding the performance of the model, which is known
    after the validation. The third step of training is usually the most compute intensive
    approach of all the other steps and depending on the complexity of model, it can
    be efficient also if the underlying process is linear, then its modelling results
    in well-behaved loss function i.e., loss function is convex, continuous and differentiable
    in the region of interest. However, most loss functions are often not well behaved
    due to the underlying nonlinear process which is generating the data and in such
    cases, the optimization of loss function becomes a key challenge in successful
    implementation of machine learning technique. It has been often experienced that
    when loss function is well-behaved, the model is less useful \[[14](#bodymatter-003.xhtml#b_9783110670707-003_ref_014)\]
    and when loss function is difficult to optimize, then the resulting model is more
    powerful \[[15](#bodymatter-003.xhtml#b_9783110670707-003_ref_015)\]. Validation
    and deployment are usually computationally less expensive as the trained model
    takes input and gives output in the form of predictions or decisions. In this
    chapter, we will primarily focus on making training more efficient in machine
    learning through quantum optimization.


    Optimization is applied routinely in almost all types of machine learning techniques
    and its applications. Chambers dictionary describes optimization as an act of
    ‘making the most or best of anything’. Therefore, performing optimization in training
    stage of machine learning means finding the most or best suitable parameters of
    the model. There are machine learning models like linear SVM whose weights can
    be determined by matrix inversion techniques \[[16](#bodymatter-003.xhtml#b_9783110670707-003_ref_016)\],
    which can be implemented efficiently in case of gate model of quantum computation,
    thus showing exponential speed-up. However, such techniques often require existence
    of quantum RAM \[[17](#bodymatter-003.xhtml#b_9783110670707-003_ref_017)\] and
    data to be generated from a linear process with low noise. In real world problems,
    the assumption of linearity is often violated and thus most popular techniques
    are non-linear and convexity cannot be guaranteed. If the optimization problem
    is convex then gradient based techniques are guaranteed to find the global optima
    regardless of the initialization \[[18](#bodymatter-003.xhtml#b_9783110670707-003_ref_018)\].
    So many optimization techniques try to simplify the problem so that they appear
    linear or convex \[[13](#bodymatter-003.xhtml#b_9783110670707-003_ref_013)\].
    Alternatively, they try to solve the problem approximately by using techniques
    like stochastic gradient descent \[[19](#bodymatter-003.xhtml#b_9783110670707-003_ref_019)\],
    which are iterative and not the desired single shot techniques. Thus, these techniques
    are usually computationally time-consuming as the nature of the problem they are
    trying to solve is non-linear, non-differentiable, multi-dimensional, multi-modal,
    and stochastic. Several quantum enhanced approaches have been proposed to solve
    computational issues in machine learning, of which global optimization using adiabatic
    quantum computation (AQC) is a promising technique, especially for problems which
    are non-linear, non-differentiable, multi-dimensional, and multi-modal. Efforts
    have also been made to solve quadratic unconstrained binary optimization problems
    on AQC model \[[20](#bodymatter-003.xhtml#b_9783110670707-003_ref_020)\]. In this
    chapter, we propose an adiabatic quantum computing based iterative global optimizer
    for minimizing the loss function of machine learning techniques, which would be
    useful when the optimization problem is non-linear, non-differentiable, multi-dimensional,
    and multi-modal, where gradient based techniques like \[[19](#bodymatter-003.xhtml#b_9783110670707-003_ref_019)\]
    and single shot techniques \[[21](#bodymatter-003.xhtml#b_9783110670707-003_ref_021)\]
    are not computationally efficient or relevant. Further, there are some Variational
    Quantum computing proposals, where they are focusing on implementing function
    evaluation on a near term quantum computing device and implementing a traditional
    gradient free optimization technique like Nelder-Meads method on classical computer
    \[[19](#bodymatter-003.xhtml#b_9783110670707-003_ref_019)\], however, our proposal
    is different from such proposals as the entire optimization step will be run on
    a future Adiabatic Quantum Computer. This chapter is further organized as follows:
    Related work about the development of AQC based algorithms is discussed in [Section
    3.2](#bodymatter-003.xhtml#b_9783110670707-003_s_003_s_002). The theoretical underpinning
    of Adiabatic Quantum Computing is discussed in [Section 3.3](#bodymatter-003.xhtml#b_9783110670707-003_s_003_s_003).
    [Section 3.4](#bodymatter-003.xhtml#b_9783110670707-003_s_003_s_004) presents
    the development of Grover’s Adaptive Search. Problem formulation is described
    in [Section 3.5](#bodymatter-003.xhtml#b_9783110670707-003_s_003_s_005). [Section
    3.6](#bodymatter-003.xhtml#b_9783110670707-003_s_003_s_006) presents quantum search
    based on AQC. Minimum finding algorithm based on AQC is described in [Section
    3.7](#bodymatter-003.xhtml#b_9783110670707-003_s_003_s_007). [Section 3.8](#bodymatter-003.xhtml#b_9783110670707-003_s_003_s_008)
    discusses the framework for implementing quantum optimization algorithm based
    on AQC. Conclusions and some directions for future work are presented in [Section
    3.9](#bodymatter-003.xhtml#b_9783110670707-003_s_003_s_009).


    ## 3.2 Related work'
  fmt: '

    # Machine Learning Algorithms and Project Overview


    Some popular Machine Learning algorithms are Artificial Neural Networks (`ANN`)
    \[[8](#bodymatter-003.xhtml#b_9783110670707-003_ref_008)\], Support Vector Machines
    (`SVM`) \[[9](#bodymatter-003.xhtml#b_9783110670707-003_ref_009)\], `K-means`
    Clustering \[[10](#bodymatter-003.xhtml#b_9783110670707-003_ref_010)\], Regression
    \[[11](#bodymatter-003.xhtml#b_9783110670707-003_ref_011)\], Decision trees \[[12](#bodymatter-003.xhtml#b_9783110670707-003_ref_012)\]
    etc. The generic steps involved in any machine learning project are as follows:


    ## Generic Steps in Any Machine Learning Project


    ### Data collection

    This step involves collecting data pertaining to the problem to be solved. The
    data should be of high quality, which is necessary for a high quality model. There
    are several measures available to evaluate the quality of data \[[13](#bodymatter-003.xhtml#b_9783110670707-003_ref_013)\].
    Low quality of data will generally result in low quality of model and subsequently
    predictions or decisions.


    ### Model selection

    This step involves selection of a specific technique like `ANN` or `SVM` etc.
    Further, it also involves selecting the structure of the model i.e. in case of
    `ANN`, number of hidden layers, no. of neurons in each hidden layer, activation
    functions etc.


    ### Training

    In this step, the parameters of the model are decided i.e. in case of `ANN` and
    `SVM`, weights are determined using some loss function i.e., a loss function which
    represents the performance of the model on training data set is used to search
    / compute the weights.


    ### Validation

    In this step, the performance of the model on testing data set is determined and
    compared with other existing models.


    ### Deployment

    Finally the model is deployed so that it can be used for making predictions or
    decisions in real situations.


    The first step is specific to the problem being solved by using machine learning,
    but can be automated in most cases, to make data collection process reliable,
    quick and cheap. The second step of Model selection usually requires past experience
    and trial and error approach, which can be translated into a heuristic \[[13](#bodymatter-003.xhtml#b_9783110670707-003_ref_013)\].
    The selection of the model is often done more than once and is typically based
    on the empirical evidence regarding the performance of the model, which is known
    after the validation. The third step of training is usually the most compute intensive
    approach of all the other steps and depending on the complexity of model, it can
    be efficient also if the underlying process is linear, then its modelling results
    in well-behaved loss function i.e., loss function is convex, continuous and differentiable
    in the region of interest. However, most loss functions are often not well behaved
    due to the underlying nonlinear process which is generating the data and in such
    cases, the optimization of loss function becomes a key challenge in successful
    implementation of machine learning technique. It has been often experienced that
    when loss function is well-behaved, the model is less useful \[[14](#bodymatter-003.xhtml#b_9783110670707-003_ref_014)\]
    and when loss function is difficult to optimize, then the resulting model is more
    powerful \[[15](#bodymatter-003.xhtml#b_9783110670707-003_ref_015)\]. Validation
    and deployment are usually computationally less expensive as the trained model
    takes input and gives output in the form of predictions or decisions. In this
    chapter, we will primarily focus on making training more efficient in machine
    learning through quantum optimization.


    ## Optimization in Machine Learning


    Optimization is applied routinely in almost all types of machine learning techniques
    and its applications. Chambers dictionary describes optimization as an act of
    ‘making the most or best of anything’. Therefore, performing optimization in training
    stage of machine learning means finding the most or best suitable parameters of
    the model. There are machine learning models like linear `SVM` whose weights can
    be determined by matrix inversion techniques \[[16](#bodymatter-003.xhtml#b_9783110670707-003_ref_016)\],
    which can be implemented efficiently in case of gate model of quantum computation,
    thus showing exponential speed-up. However, such techniques often require existence
    of quantum RAM \[[17](#bodymatter-003.xhtml#b_9783110670707-003_ref_017)\] and
    data to be generated from a linear process with low noise. In real world problems,
    the assumption of linearity is often violated and thus most popular techniques
    are non-linear and convexity cannot be guaranteed. If the optimization problem
    is convex then gradient based techniques are guaranteed to find the global optima
    regardless of the initialization \[[18](#bodymatter-003.xhtml#b_9783110670707-003_ref_018)\].
    So many optimization techniques try to simplify the problem so that they appear
    linear or convex \[[13](#bodymatter-003.xhtml#b_9783110670707-003_ref_013)\].
    Alternatively, they try to solve the problem approximately by using techniques
    like `stochastic gradient descent` \[[19](#bodymatter-003.xhtml#b_9783110670707-003_ref_019)\],
    which are iterative and not the desired single shot techniques. Thus, these techniques
    are usually computationally time-consuming as the nature of the problem they are
    trying to solve is non-linear, non-differentiable, multi-dimensional, multi-modal,
    and stochastic. Several quantum enhanced approaches have been proposed to solve
    computational issues in machine learning, of which global optimization using adiabatic
    quantum computation (`AQC`) is a promising technique, especially for problems
    which are non-linear, non-differentiable, multi-dimensional, and multi-modal.
    Efforts have also been made to solve quadratic unconstrained binary optimization
    problems on `AQC` model \[[20](#bodymatter-003.xhtml#b_9783110670707-003_ref_020)\].
    In this chapter, we propose an adiabatic quantum computing based iterative global
    optimizer for minimizing the loss function of machine learning techniques, which
    would be useful when the optimization problem is non-linear, non-differentiable,
    multi-dimensional, and multi-modal, where gradient based techniques like \[[19](#bodymatter-003.xhtml#b_9783110670707-003_ref_019)\]
    and single shot techniques \[[21](#bodymatter-003.xhtml#b_9783110670707-003_ref_021)\]
    are not computationally efficient or relevant. Further, there are some Variational
    Quantum computing proposals, where they are focusing on implementing function
    evaluation on a near term quantum computing device and implementing a traditional
    gradient free optimization technique like `Nelder-Meads` method on classical computer
    \[[19](#bodymatter-003.xhtml#b_9783110670707-003_ref_019)\], however, our proposal
    is different from such proposals as the entire optimization step will be run on
    a future Adiabatic Quantum Computer. This chapter is further organized as follows:
    Related work about the development of `AQC` based algorithms is discussed in [Section
    3.2](#bodymatter-003.xhtml#b_9783110670707-003_s_003_s_002). The theoretical underpinning
    of Adiabatic Quantum Computing is discussed in [Section 3.3](#bodymatter-003.xhtml#b_9783110670707-003_s_003_s_003).
    [Section 3.4](#bodymatter-003.xhtml#b_9783110670707-003_s_003_s_004) presents
    the development of `Grover’s Adaptive Search`. Problem formulation is described
    in [Section 3.5](#bodymatter-003.xhtml#b_9783110670707-003_s_003_s_005). [Section
    3.6](#bodymatter-003.xhtml#b_9783110670707-003_s_003_s_006) presents quantum search
    based on `AQC`. Minimum finding algorithm based on `AQC` is described in [Section
    3.7](#bodymatter-003.xhtml#b_9783110670707-003_s_003_s_007). [Section 3.8](#bodymatter-003.xhtml#b_9783110670707-003_s_003_s_008)
    discusses the framework for implementing quantum optimization algorithm based
    on `AQC`. Conclusions and some directions for future work are presented in [Section
    3.9](#bodymatter-003.xhtml#b_9783110670707-003_s_003_s_009).


    ## 3.2 Related work

