    from a space ℋ[`C`], and so the complete input space will be in ℋ(`Ω`) ⊗ ℋ[`C`].
    Our implementation will also generate “garbage” output in a space `H`[`G`], and
    so the complete output space will be in ℋ(`Ω`^′)⊗ ℋ[`G`]. The input and output
    dimensions must be equal, and the simplest way to accomplish this is to make ℋ[`C`]
