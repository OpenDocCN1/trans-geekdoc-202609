    ## 2.3.2 Non-surjective Injections


    As a further step towards the quantum computation of arbitrary functions by means
    of computational maps, we consider a relatively simple case: non-surjective injections
    (that is, one-to-one non-onto functions). We restrict our attention to finite
    domains and codomains. Therefore, let `Ω` = {`x`[1],…,`x`[`n`]} and `Ω`^′ = {`y`[1],…,`y`[`m`]},
    where `n` < `m`, and consider an injection `f` : `Ω` → `Ω`^′. Input maps will
    be in an `n`-dimensional Hilbert space ℋ(`Ω`) and output maps will be in an `m`-dimensional
