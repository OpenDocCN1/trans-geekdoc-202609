    article. The diversity of the bat population was achieved through quantum rotation
    gates which helped the proposed algorithm to avoid premature convergence without
    affecting the convergence speed though the efficiency of the proposed algorithm
    in terms of computational time was guaranteed [[43](#bodymatter-005.xhtml#b_9783110670707-005_ref_043)].


