    × 80，（d）`#97017` 大小为 120 × 80，（e）`couple` 大小为 512 × 512，（f）`clown` 大小为 512 × 512。


    ## 5.9 结论


    本文设想了一种自动聚类技术，用于识别图像数据集中存在的最优聚类点数，该技术展示了一种将量子计算的特性与两种不同的元启发式算法，即遗传算法和蝙蝠算法相结合的新方法。这些提出的技术的优越性超过了其经典对应方法，因为它们在显著较短的时间范围内自动识别图像数据集中存在的最优聚类点数方面优于相应的经典对应方法。此外，量子启发算法的有效性根据计算得到的最优适应度值、适应度均值、适应度标准差、适应度标准误差以及统计优越性检验
    `t-test` 计算得到的 `p-value` 来判断并呈现。最后，进行了 Friedman 检验以识别量子启发版本与其经典版本之间的优越技术。此外，量子启发蝙蝠算法被发现是其他方法中表现最好的方法。所有计算结果均在前面的表格中呈现，以证明量子启发方法相对于其经典对应方法的有效性以及证明
    `QIBA` 的优越性。到目前为止，仅使用灰度图像用于实验目的，所提出的技巧仅用于一次满足一个目标。


    目前作者正在探索量子计算领域，以在较短的时间范围内有效高效地解决相关多目标优化问题，并尝试为该研究方向处理真彩色图像。


