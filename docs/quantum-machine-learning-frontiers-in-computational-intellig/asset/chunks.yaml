    # 5 Quantum inspired automatic clustering algorithms: A comparative study of Genetic
    algorithm and Bat algorithm


    Alokananda Dey RCC Institute of Information Technology, Canal South Road, Beliaghata,
    700015, Kolkata, West Bengal, India. Sandip Dey Sukanta Mahavidyalaya, Jalpaiguri,
    West Bengal, India. Siddhartha Bhattacharyya CHRIST (Deemed to be University),
    RCC Institute of Information Technology, Department of Computer Science and Engineering,
    Hosur Road, 560029, Bangalore, Karnataka, India. Jan Platos VSB Technical University
    of Ostrava, Ostrava, Czech Republic. Vaclav Snasel VSB Technical University of
    Ostrava, Ostrava, Czech Republic.


    ## Abstract


    This article is intendant to present two automatic clustering techniques of image
    datasets, based on quantum inspired framework with two different meta-heuristic
    algorithms, viz., Genetic Algorithm (`GA`) and Bat Algorithm (`BA`). This work
    provides two novel techniques to automatically find out the optimum clusters present
    in images and also provides a comparative study between the Quantum Inspired Genetic
    Algorithm (`QIGA`) and Quantum Inspired Bat Algorithm (`QIBA`). A comparison is
    also presented between these quantum inspired algorithms with their analogous
    classical counterparts. During the experiment, it was perceived that the quantum
    inspired techniques beat their classical techniques. The comparison was prepared
    based on the mean values of the fitness, standard deviation, standard error of
    the computed fitness of the cluster validity index and the optimal computational
    time. Finally, the supremacy of the algorithms was verified in terms of the `p`-value
    which was computed by `t-test` (statistical superiority test) and ranking of the
    proposed procedures was produced by the Friedman test. During the computation,
    the betterment of the fitness was judge by a well-known cluster validity index,
    named, `DB` index. The experiments were carried out on four Berkeley image and
    two real life grey scale images.


    Keywords: automatic clustering, quantum computing, meta-heuristic algorithm, genetic
    algorithm, bat algorithm, `DB` Index, statistical test (`t-test`), Friedman test,


    ## 5.1 Introduction


    Clustering [[1](#bodymatter-005.xhtml#b_9783110670707-005_ref_001), [2](#bodymatter-005.xhtml#b_9783110670707-005_ref_002)]
    is a process of separating a heterogeneous dataset of different types of objects
    into some meaningful sets of homogeneous objects. Mathematically clustering can
    be described as follows. A dataset `D_S` of `K` number of points can be represented
    as follows.


    `D_S` = {`d_p`[1], `d_p`[2], `d_p`[3],…, `d_p`[`K`]}, in which, each `d_p`[`i`]
    represents a single point of the specific dataset `D_S`, where `i` = {1, 2,…,
    `K`}. Now, in order to achieve a successful cluster `C_N` of the dataset `D_S`
    into `p` number of partition namely, {`C`[`N`][1], `C`[`N`][2],…, `C`[`N`][`p`]}
    the following properties must be hold.

