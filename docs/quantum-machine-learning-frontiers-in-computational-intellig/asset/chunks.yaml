    # 4 From classical to quantum machine learning


    Arit Kumar Bishwas AIIT, Amity University, Information Technology, Noida, Uttar
    Pradesh, India Ashish Mani EEE, ASET, Amity University, EEE, ASET, G012A, E-I
    Block, Sector 125, 201303, Noida, Uttar Pradesh, India Vasile Palade Coventry
    University, Faculty of Engineering and Computing, Coventry University, Coventry,
    UK


    ## Abstract


    In recent years, Machine Learning (ML) has started to be ubiquitously applied
    to practically most of the human activity domains. Although traditional, or classical
    machine learning (CML) approaches are useful in solving many complex tasks, there
    are still many challenges that such approaches are facing. One issue is the limitation
    in the processing speed of current silicon technology based computers, which made
    researchers look to the underlying quantum theory principles and try to run complex
    quantum computing experiments. In future, in order to develop more complex artificial
    intelligence systems, we will have to process huge amounts of data at high speed,
    and the existing classical computing will probably not serve well this purpose,
    due to silicon technology limitations. A different technology that can handle
    huge volumes of data and at high speed is needed. In recent years, the progress
    in quantum computing research seems to provide hopeful answers to overcome the
    speed processing barrier. This is very important for the training of many computational
    intensive machine learning models. The latest advancements in quantum technology
    appear to be promising, which can boost the field of machine learning overall.
    In this chapter, we discuss the transition from classical machine learning to
    quantum machine learning (QML) and explore the recent progress in this domain.
    QML is not only associated with the development of high-performance machine learning
    algorithms that can run on a quantum computer with significant performance improvements
    but also has a very diverse meaning in other aspects. The chapter tried to touch
    those aspects in brief too, but the main focus is on the advancements in the field
    of developing machine learning algorithms that will run on a quantum computer.


    Keywords: quantum algorithm, quantum random access memory (QRAM), quantum deep
    learning, quantum computation,


    ## 4.1 Introduction


    Machine learning is an important and popular field of study these days when Artificial
    Intelligence and intelligent algorithms have become embedded in our everyday life.
    Machine learning models are trained with large amounts of data using some mathematical
    and statistical based algorithms. Machine learning algorithms are categorized
    into two broad classes – supervised and unsupervised learning algorithms. In supervised
    learning, data are provided in the form of labelled data. In the case of unsupervised
    learning, the datasets are not labelled. In recent years, machine learning has
    demonstrated great visibility and publicity in applications to many important
    domains of real life, such as medical image processing, online product recommendation
    systems, financial modelling and prediction, risk evaluation, human language processing,
    etc. The recent advancements in deep learning research opened even more possibilities
    for solving complex problems. In machine learning, data play a vital role. Some
    problems can be solved well with less data, but deep learning requires huge volumes
    of data. Apart from the issue of availability of big datasets, another crucial
    factor is the processing and learning speed of the system. Deep learning algorithms
    are computationally very intensive. Although by using GPUs and high-performance
    computing systems, this problem can be somehow alleviated, it still takes a long
    time to perform machine learning (and especially deep learning) on big data. The
    rule of thumb is that, in order to train with more data, we would require more
    processing power. To develop more complex future artificial intelligence systems
    that process a huge amount of data, the existing classical computing technologies
    will probably not be sufficient, due to the limitations related to the silicon-based
    technology. We need a different technology, which can handle the processing speed
    issue and which can process huge volumes of data. Classical computers are now
    part of our lives and help us in solving complex problems, but still, there are
    great challenges in solving some of the problems (for example optimization problems)
    whose computational complexities increases at a very high scale with a small increase
    in inputs. These kind of problems are very difficult or not possible to solve
    with the classical computers. Quantum computing is the answer to overcome these
    processing issues. Quantum computer’s computational power scales significantly
    as the system size grows due to its unique properties which are not found in classical
    systems, and two of the most important properties are – superposition & entanglement.
    Section 3 discusses these properties in detail.


    The term quantum machine learning (QML) mostly refers to classical machine learning
    algorithms [[1](#bodymatter-004.xhtml#b_9783110670707-004_ref_001), [2](#bodymatter-004.xhtml#b_9783110670707-004_ref_002)]
    that can be run on a quantum computer. This involves mostly researchers working
    on developing quantum versions of classical machine learning algorithms, concerned
    mainly with the speed-up factors for the training procedure. Apart from this,
    the term QML also has a general connotation. Developing a fully functional commercial
    quantum computer is a very active field, but it is still not clear if we can have
    one to work in the near future. In recent time, researchers focused on developing
    small quantum subroutines/devices which can combine with classical machine learning
    approaches to get the quantum advantages to some ex-tent [[3](#bodymatter-004.xhtml#b_9783110670707-004_ref_003)].
    These quantum subroutines/devices can be designed to solve some of the complex
    tasks which are computationally difficult in the classical domain [[4](#bodymatter-004.xhtml#b_9783110670707-004_ref_004),
    [5](#bodymatter-004.xhtml#b_9783110670707-004_ref_005), [6](#bodymatter-004.xhtml#b_9783110670707-004_ref_006)].


    Some recent works have also exhibited that by using quantum algorithms we can
    analyze quantum states [[7](#bodymatter-004.xhtml#b_9783110670707-004_ref_007)].
    The term QML is also associated with analyzing the data generated from quantum
    experiments. Applying machine learning in analyzing quantum phase transitions
    is a very classic example of this [[8](#bodymatter-004.xhtml#b_9783110670707-004_ref_008),
    [9](#bodymatter-004.xhtml#b_9783110670707-004_ref_009), [10](#bodymatter-004.xhtml#b_9783110670707-004_ref_010),
    [11](#bodymatter-004.xhtml#b_9783110670707-004_ref_011)].

