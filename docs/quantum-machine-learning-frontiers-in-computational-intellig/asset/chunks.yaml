    对所有 **x** ∈ 𝒳 成立。以这种方式，线性算子 *T* 通过计算图计算非线性函数 *f*。我们称这样的算子为 *图核*，因为它使用 *f* 的显式
    *图* \[即所有 **x** ∈ 𝒳 的成对集合 (*μ*^′\[*f*(**x**)\]， *μ*(**x**))\] 来进行一种查表。²


    请注意，如果输入图是输入值的叠加，|*ψ*⟩=*a*|*μ*(**x**)⟩ + *b*|*μ*(**x**^′)⟩，那么输出图将是相应结果的叠加：*T*|*ψ*⟩=*a*|*μ*^′\[*f*(**x**)\]⟩ + *b*|*μ*^′\[*f*(**x**^′)\]⟩。因此，连续地形基映射允许在线性叠加中计算非线性函数（量子并行）。这是迈向量子计算的一步，但
    *T* 可能不是幺正的，我们还有更多工作要做。


    读者可能会质疑使用连续基。首先，注意对于可分希尔伯特空间，连续基始终可以用无限离散基代替，例如用适当维度的正弦或复指数的离散序列。其次，无限离散基可以用有限离散基来近似，例如用带限正弦或复指数。这种近似对于神经网络机器学习尤其合适，后者只需要低精度计算。


