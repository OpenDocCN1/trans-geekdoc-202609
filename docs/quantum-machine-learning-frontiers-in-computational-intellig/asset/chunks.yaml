    Besides supervised and unsupervised learning, reinforcement learning (`RL`) is
    also a popular category of learning method. In contrast to `SL` and `UL`, `RL`
    employs a scalar value called reward to assess the input-output pairs and uses
    the policy of trial-and error to interact with the environment for learning a
    mapping from states to actions. Since the year of 1980, `RL` has gradually become
    a significant approach to `ML` \[[5](#bodymatter-001.xhtml#b_9783110670707-001_ref_005)\].
    So far, it has been extensively applied in artificial intelligence (`AI`), particularly
    in robotics \[[13](#bodymatter-001.xhtml#b_9783110670707-001_ref_013), [14](#bodymatter-001.xhtml#b_9783110670707-001_ref_014),
    [15](#bodymatter-001.xhtml#b_9783110670707-001_ref_015), [16](#bodymatter-001.xhtml#b_9783110670707-001_ref_016),
    [17](#bodymatter-001.xhtml#b_9783110670707-001_ref_017)\]. It is due to the fact
    that it shows an excellent performance in on-line adaptation, and in addition,
    it has a prevailing learning ability to any complex nonlinear systems.


    There may have some complicated problems while dealing with practical applications,
    such as the exploration strategy, slow learning speed; in particular handling
    complex problems. It can be observed, especially whilst the state-action space
    grows to be gigantic and the number of parameters that are to be learned grows
    up exponentially with the increase of dimension. So far, several methods have
    been introduced in the recent years to combat this situation.


    Different learning paradigms are united for optimizing `RL`. Smith \[[18](#bodymatter-001.xhtml#b_9783110670707-001_ref_018)\]
    proposed a novel model to represent and generalize in model-less `RL` on the basis
    of self-organizing map (`SOM`) and benchmark `Q-learning`. In addition, for the
    sake of adaptation of fuzzy inference systems with Watkins’ `Q-learning` for problems
    having large/continuous state-action spaces is also presented \[[17](#bodymatter-001.xhtml#b_9783110670707-001_ref_017),
    [19](#bodymatter-001.xhtml#b_9783110670707-001_ref_019), [20](#bodymatter-001.xhtml#b_9783110670707-001_ref_020)\].
    Different `RL` methods have been improved in practice \[[21](#bodymatter-001.xhtml#b_9783110670707-001_ref_021),
    [22](#bodymatter-001.xhtml#b_9783110670707-001_ref_022), [23](#bodymatter-001.xhtml#b_9783110670707-001_ref_023),
    [24](#bodymatter-001.xhtml#b_9783110670707-001_ref_024)\].


    Two significant quantum algorithms, called the `Shor algorithm` \[[25](#bodymatter-001.xhtml#b_9783110670707-001_ref_025),
    [26](#bodymatter-001.xhtml#b_9783110670707-001_ref_026)\] and the `Grover algorithm`
    \[[27](#bodymatter-001.xhtml#b_9783110670707-001_ref_027), [28](#bodymatter-001.xhtml#b_9783110670707-001_ref_028)\],
    have been introduced. Rigatos and Tzafestas \[[29](#bodymatter-001.xhtml#b_9783110670707-001_ref_029)\]
    applied the theory of quantum computing to get the benefit of parallelization
    of fuzzy-logic control algorithm (`FCA`), whose objective is to speed up the fuzzy
    inference. Quantum-inspired evolutionary algorithms (`QIEA`) have been developed
    to enhance the performance of the existing evolutionary algorithms (`EA`) \[[30](#bodymatter-001.xhtml#b_9783110670707-001_ref_030)\].
    Later, Hogg and Portnov \[[31](#bodymatter-001.xhtml#b_9783110670707-001_ref_031)\]
    introduced a quantum algorithm to solve combinatorial optimization problem having
    over constrained satisfiability and asymmetric traveling salesman. In recent times,
    the quantum search method has been applied to dynamic programming \[[32](#bodymatter-001.xhtml#b_9783110670707-001_ref_032)\].
    Taking into account the spirit of computation, Dong et al. \[[33](#bodymatter-001.xhtml#b_9783110670707-001_ref_033)\]
    have developed the concept of Quantum Reinforcement Learning (`QRL`) inspired
    by the basic concept of quantum computing, called state superposition principle
    and parallelism. `QRL` was developed to speed-up learning and attaining a trade-off
    between exploitation and exploration of `RL` in the course of simulated experiments.


    ## 1.4 Quantum annealing


    In statistical mechanics, quantum annealing (`QA`) that is applied in the field
    of quantum-mechanical fluctuations is the quantum version of the simulated annealing
    (`SA`) \[[34](#bodymatter-001.xhtml#b_9783110670707-001_ref_034), [35](#bodymatter-001.xhtml#b_9783110670707-001_ref_035)\].
    It is also known as Quantum Stochastic Optimization algorithm. Like the `SA`,
    quantum annealing is also successfully applied to solve the hard optimization
    problem. It works on the principal of the quantum adiabatic evolution in the active
    field of the quantum computation and it is a profitable hybridization between
    classical and quantum technology. `QA` is applied in different fields as computer
    science \[[36](#bodymatter-001.xhtml#b_9783110670707-001_ref_036)\], machine learning
    \[[37](#bodymatter-001.xhtml#b_9783110670707-001_ref_037), [38](#bodymatter-001.xhtml#b_9783110670707-001_ref_038)\],
    graph theory \[[39](#bodymatter-001.xhtml#b_9783110670707-001_ref_039)\], communications
    \[[40](#bodymatter-001.xhtml#b_9783110670707-001_ref_040), [41](#bodymatter-001.xhtml#b_9783110670707-001_ref_041),
    [42](#bodymatter-001.xhtml#b_9783110670707-001_ref_042)\], finance \[[43](#bodymatter-001.xhtml#b_9783110670707-001_ref_043)\],
    aeronautics \[[44](#bodymatter-001.xhtml#b_9783110670707-001_ref_044)\] and any
    others real world problems.


    In simulated annealing \[[45](#bodymatter-001.xhtml#b_9783110670707-001_ref_045)\],
    a temperature dependent random walk of a statistical-mechanical system is employed
    as the cost function of a given optimization problem. This function determines
    the potential energy profile of the solution space and thermal fluctuations avoid
    that the exploration gets stuck in a local minimum \[[46](#bodymatter-001.xhtml#b_9783110670707-001_ref_046)\].
    It is expected that the system will stay close to thermal equilibrium during time
    evolution. It can happen if the rate of decrease of temperature is sufficiently
    slow, and thus lead in the end to the zero-temperature equilibrium state, the
    lowest-energy state \[[47](#bodymatter-001.xhtml#b_9783110670707-001_ref_047)\].
    Due to the general applicability, reasonable performance, and relatively easy
    implementation in most cases, `SA` is employed effectively in many real life applications.
    When a problem requires an infinitely long time to derive the exact solution by
    keeping the system close to thermal equilibrium, `SA` is applied to obtain the
    approximate solution within a measurable computation time. The quantum fluctuations
    are induced in `QA` by introducing artificial degrees of quantum nature, non-commutative
    operators. The strength of the quantum fluctuations are controlled to reach the
    ground state by slowly reducing the temperature.


    Like the finding the minimization of a cost function of a optimization problem,
    it can be considered as finding the ground state of a classical Ising Hamiltonian
    `H0` \[[48](#bodymatter-001.xhtml#b_9783110670707-001_ref_048)\]. Different types
    of practical problems have cost functions with large number of local minima. Similarly,
    Ising Hamiltonians are remindful of classical spin glasses \[[49](#bodymatter-001.xhtml#b_9783110670707-001_ref_049),
    [50](#bodymatter-001.xhtml#b_9783110670707-001_ref_050)\]. For these types of
    characteristics, it is very tough to find the global minima for classical algorithms.
    This problem can be overcame with the idea to elevate the classical Ising Hamiltonian
    `H0` to the quantum domain. Based on the adiabatic theorem of quantum mechanics,
    the ground state of the classical Ising model can be derived by formatting the
    system in the ground state of some initial Hamiltonian `H1` \[[51](#bodymatter-001.xhtml#b_9783110670707-001_ref_051),
    [52](#bodymatter-001.xhtml#b_9783110670707-001_ref_052)\]. It is easy to develop
    both theoretically and experimentally. `H1` is selected in such a way it does
    not exchange with `H0`. The Hamiltonian changes gradually from `H1` to `H0` as
    the system parameters modified sufficiently slowly.

