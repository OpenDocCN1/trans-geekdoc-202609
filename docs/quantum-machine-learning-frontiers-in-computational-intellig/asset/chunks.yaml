    # 2 量子机器学习的地形表示


    Bruce J. MacLennan 田纳西大学电气工程与计算机科学系，1520 Middle Dr., 37996, Knoxville, Tennessee,
    USA


    ## 摘要


    大脑中最常见的信息表示之一是 *地形* 或 *计算图*，其中神经元根据其所代表的值系统地排列。通过将定量关系空间化，计算图使大脑能够以所需的精度计算复杂、非线性函数。本章提出了两种利用地形表示进行机器学习的量子计算方法。它展示了如何构造可在量子计算机上实现的幺正算子，通过计算图实现任意（包括非线性）函数。


    关键词: 计算图, 神经网络, 量子计算, 量子机器学习, 量子神经网络, 地形图, 地形表示,


    ## 2.1 引言


    本章提出了一种受大脑启发的量子机器学习方法，旨在规避其他方法的许多复杂性。量子过程的幺正性既带来机遇也带来挑战。主要机遇之一是可以在线性叠加中并行进行大量计算，即量子并行。量子计算当然存在许多技术挑战，但量子机器学习中的主要理论挑战在于量子过程是线性的，而大多数机器学习方法都至关重要地依赖于非线性操作。人工神经网络尤其需要非线性激活函数，例如逻辑
    sigmoid 函数，才能进行非平凡的机器学习。幸运的是，情况并非无望，因为我们知道非线性过程可以嵌入到幺正过程中，这在量子计算的电路模型中很熟悉 \[1\]。


    尽管量子机器学习存在复杂性，它仍为在后摩尔定律技术时代实现大规模机器学习提供了一种诱人的方法。然而，机器学习的方法有很多，量子计算的方法也有几种（例如，电路模型、退火），并且并非明显哪种组合最有可能成功。Schuld、Sinayskiy
    和 Petruccione \[2, 3\] 提供了一些关于量子神经网络以及更广泛的量子机器学习方法的最新综述。他们得出结论，没有任何量子神经网络的提议成功地结合了人工神经网络和量子计算的优势。他们认为涉及与环境耗散相互作用的开放量子系统是最有前景的方法。此外，很少有提议包含真正的量子机器学习理论。


    本章探讨了一种量子实现机器学习的方法，涉及对以地形方式表示的信息进行非线性函数操作，这在神经皮层中很常见。然而，神经计算，即受大脑启发的计算，有许多方法，其中一些可能比其他方法更适合量子实现，因此我们必须对替代方案说几句话。因为大脑可以在许多不同层次上建模，并且每个层次上的模型都可能为机器学习提供基础。例如，近年来，脉冲神经网络模型再次变得流行，主要是由于它们在硬件实现时的功耗优势
    \例如，[4, 5\]。此类模型模仿生物神经元的“全或无”动作电位产生，而不涉及动作电位的详细动力学。另一方面，当代人工神经网络的大多数应用，包括深度学习中使用的应用，都使用更高层次的基于速率的模型。也就是说，在单元（神经元类似物）之间传递的实值表示神经尖峰的速率而不是单个尖峰。有人认为这是建模神经信息处理的适当层次，因为动作电位的产生和接收存在许多随机效应，并且信息处理的基本单元是包含约
    100 个神经元的 *微柱* \\[[6\], 第 2 章\]。因此，最有成效的是将神经计算视为大规模并行模拟计算的一种形式。由于量子计算本质上使用复值概率幅，因此将其视为模拟计算的一种形式也很有成效，因此模拟信息表示提供了量子计算与人工神经网络之间的一个接触点
    \[7\]。


    ## 2.2 大脑中的地形表示


    大脑中信息处理与大多数人工神经网络模型不同的另一个方面是生物神经网络在空间上组织，连接依赖于空间组织。虽然人工神经网络通常按层组织，但各层中神经元之间通常没有空间关系；¹


    大脑使用的一种最常见的空间信息组织是 *地形表示* 或 *计算图*。在这种表示中，抽象空间 `𝒳` 中不同的点 `x` 系统地映射到皮层二维区域中的物理位置
    `r = µ(x)`；也就是说，神经元之间的空间关系与抽象空间中的拓扑关系相关。这些图在运动区 \[8\] 和感觉区 \\[[6\], 第 6 章\] 中尤其常见。例如，音调拓扑图使对不同音高有反应的神经元按音高顺序排列。视网膜拓扑图具有与视网膜和视野组织相镜像的空间组织。初级视觉皮层中对边缘有反应的神经元根据边缘的方向系统地排列。大脑中还有许多其他例子，这或许是脑部使用最常见的信息表示。


    在这些地形图中，特定值 `x` 由相应皮层位置 `µ(x)` 中的活动峰值表示。活动的强度反映了该值的存在程度、重要性或概率。此外，具有不同相对强度或概率的多个同时值由多个同时活动峰值以不同的振幅表示。因此，这样的皮层图可以表示具有各自振幅的值的叠加。

