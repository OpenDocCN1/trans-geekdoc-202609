    ### Algorithm


    1. initialize the index `I[index]` = any random element, 1 ≤ `I[index]` ≤ `k`

    2. initialize `|V[qn]⟩` as the vector of all classified class probabilities in
    QRAM

    3. while (`P[m]` < `P[threshold]`)

    4. initialize the memory as `|Ψ⟩ = 1/√k Σ_r |r⟩|I_index⟩`

    5. `GROVER-QUANTUM-SEARCH` (`|Ψ⟩`, `|V[qn]⟩`, `I[index]`)

    6. if (`|V[qn]⟩[I[index_new]]` > `|V[qn]⟩[I[index]]`)

    7. `I[index]` = `I[index_new]`

    8. return `I[index]`


    ### Algorithm 3: Quantum All-Pair Algorithm


    1. initialize `class` = any random element, 1 ≤ `class_index` ≤ `k`

    2. initialize `|V[q]⟩` as the vector of all classified classes

    3. initialize frequency estimate `s[class_index]` with any very small value

    4. `INITIAL-FREQUENCY-COUNT` (`class_index`, `s[class[index]]`)

    5. while (`total running time` < `O(log k)`)

    6. initialize the memory `|C[i]⟩` = Σ_j `β[i,j]` `|j⟩`

    7. initialize the memory as

    ```

    |ψ_c⟩ = Σ_{i = 0}^{k - 1} |i⟩|C_i⟩|class_index⟩|s_class_index⟩

    ```

    8. `GROVER-QUANTUM-SEARCH` (`|ψ[c]⟩`, `|V[q]⟩`, `class_index`, `s[class_index]`)

    9. `MEASURE-REGISTER` (`|ψ[c]⟩`)

    10. if (`s_class_index_new` > `s_class_index` + `ε/(2k)`)

    11. `class_index` = `class_index[new]`

    12. `s[class_index]` = `s[class_index_new]`

    13. return `|V[q]⟩[class_index]`


    ### 4.5.3 Quantum K-means clustering


    Clustering is a very important problem in machine learning and more generally
    falls under unsupervised learning. Clustering algorithm groups the unlabeled dataset
    into multiple categories based on their similar features. The `K`-Means clustering
    algorithm is a very popular and simple clustering algorithm. `K`-Means groups
    the unlabelled dataset into `k` categories, however, we have to specify `K` in
    advance. In [[25]], authors show the formulation of a `K`-Means clustering algorithm
    in the quantum paradigm. In the quantum `K`-Means, the closest centroids are calculated
    in the same way as in the classical version, but by using the Grover’s search
    [[10]]. The quantum version of `k`-Means has been claimed to be exponentially
    faster in runtime complexity as compared to the classical counterpart. The quantum
    `K`-Means is based on an adiabatic quantum process.


    Suppose the output of the quantum `K`-Means clustering algorithm is in the following
    quantum state:


    (4.25) `|ξ⟩ = M^{-1/2} Σ_l |c_l⟩|l⟩ = M^{-1/2} Σ_{c,l ε c} |c⟩|l⟩`


    We construct the above output quantum state with `O(ε^{-1} K log(KMN))` runtime
    complexity, where `ε` is the accuracy, and with `O(^{-1} log(KMN))` runtime complexity
    when the clusters are well separated. The adiabatic gap in this case is `O(1)`.


    Let us first select `K` objects with labels `i[c]` as initial seeds. We begin
    with the state:


    (4.26) `{(MK)^{-1/2}} Σ_{c'' l} |c''⟩|l⟩ {(K^{-1/2}) Σ_c |c⟩|i_c⟩}^{⊗ D}`


    Here, `D` copies of the state permit us to evaluate the distances `|x⃗[l] − x⃗[i[c'']]|²`
    in the `c'' l` superposition component. By applying the adiabatic algorithm with
    the initial Hamiltonian


    (4.27) `H_0 = 1 - |φ⟩⟨φ| , |φ⟩ = K^{-0.5} Σ_{c''} |c''⟩`


    The initial clustering is:


    (4.28) `|ψ_1⟩ = M^{-1/2} Σ_{c,l ε c} |c⟩|l⟩`


    We evolve the initial Hamiltonian `H[0]` slow enough to the Hamiltonian:


    (4.29) `H_2 = Σ_{c'' l} { |x⃗_l - x⃗_{i_{c''}}|² } |c''⟩⟨c''| ⊗ |l⟩⟨l|`


    We can construct the separate cluster `|ϕ_1^(c)⟩ = M^{-0.5} Σ_{l ε c} |l⟩`, assuming
    we have `D` copies of `|ψ_1⟩`. We can now estimate the number of quantum states
    `M[c]` in the cluster `c`. With `D` copies of `|ψ_1⟩` together with the clusters
    `|ϕ_1^(c)⟩`, we evaluate the average distance between `x[l]` and the individual
    cluster’s mean


    (4.30) `|x⃗_l - (M_c)^{-1} Σ_{K ε c''} x⃗_K|² = |x⃗_l - x⃗_c|²,`


    by applying a phase `e^{-i|x⃗[l] - x⃗[c'']|² δt}` to each component `|c''|l⟩`
    of the superposition using the following Hamiltonian,


    (4.31) `H_F = Σ_{c'' l} { |x⃗_l - x⃗_{c''}|² } |c''⟩⟨c''| ⊗ |l⟩⟨l| ⊗ I^D`


    With the initial Hamiltonian `H[0] = 1 − |ϕ⟩⟨ϕ|` at the ground state, we initiate
    the adiabatic evolution on the state `{(MK)^{-0.5}} Σ_{c'', l} |c''|l⟩|Ω_1⟩^{⊗
    D}`, where `|ϕ⟩ = K^{-0.5} Σ_{c''} |c''⟩` is the superposition of the cluster
    centroids. We get the final state:


    (4.32) `{(M)^{-0.5} Σ_{c'' l ∈ c''} |c''⟩|l⟩} |Ω_1⟩^{⊗ D} = |Ω_2⟩ |Ω_1⟩^{⊗ D}`


    By repeating the final state `D` times, we construct `D` copies of `|Ω_2` and
    keep on iterating the cluster assignment procedure until it gets converged to
    `|ξ⟩`.


    ### 4.5.4 Quantum deep learning


    Deep learning `DL` revolutionized the world of machine learning with its performance
    for a large domain of applications. `DL` is an efficient and effective tool for
    machine learning modeling. With the development of GPUs, a very wide area opened
    for developing highly complex machine learning models using deep learning, which
    was not possible earlier without large availability of high-performance computing.
    Deep learning requires a large amount of training data. Processing such a huge
    volume of datasets is a computationally complex task, this inspired the exploration
    of the quantum advantages for `DL` algorithms. Recent progress in developing programmable
    photonic circuits and quantum annealers [[46], [47], [48]] open up the possibilities
    of developing a quantum framework for deep learning algorithms.


    The latest research on Boltzmann machine formulation in a quantum paradigm [[49]]
    demonstrated very strong footsteps towards quantum deep learning. The current
    results are focusing on developing quantum deep learning algorithms which do not
    require a fully functional quantum computer. These quantum `DL` algorithms can
    run with quantum annealers, which are special-purpose quantum information processors
    and they are very easy to construct as compared to larger quantum computers.


    ## 4.6 Recent progress in the implementation of quantum machine learning

