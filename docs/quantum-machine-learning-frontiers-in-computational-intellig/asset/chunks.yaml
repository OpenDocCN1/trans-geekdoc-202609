    ### 5.8.3 Simulation of work


    Python environment was used to carry out the experimental process. The experiment
    was done on four Berkeley images, two of dimensions 80 × 120 and other two of
    dimensions 120 × 80 and two real life images of dimensions 512 × 512. The development
    environment was consisting of Windows 7 with the configuration facility of DELL
    Intel(R) Core(TM) i3, 2.00 GHz and 4.00 GB RAM.


    The efficiency of the suggested methods over their classical counterparts was
    proved depending upon computed mean fitness value, standard deviation, standard
    error and smallest computation time. Moreover, the competence of the quantum inspired
    algorithms over their classical algorithms was justified by performing the *t
    – test* (statistical superiority test). The optimal number of cluster (𝒪\_𝒩[𝒞])
    and its associated optimal fitness value (𝒪\_ℱ[𝒯]) for all the algorithms (QIGA,
    CGA, QIBA and CBA) were reported in [Table 5.1](#bodymatter-005.xhtml#b_9783110670707-005_tab_001).
    The optimal execution time (𝒪\_𝒯[ℰ]) in second for all the algorithms (QIGA, CGA,
    QIBA and CBA) were shown in [Table 5.2](#bodymatter-005.xhtml#b_9783110670707-005_tab_002).
    The mean fitness value (ℱ[*μ*]), standard deviation (ℱ[*σ*]) and standard error
    (𝒮[ℰ]) of the algorithms QIGA and CGA and were demonstrated in [Table 5.3](#bodymatter-005.xhtml#b_9783110670707-005_tab_003)
    and the same things for the algorithms QIBA and CBA were demonstrated in [Table
    5.4](#bodymatter-005.xhtml#b_9783110670707-005_tab_004). Finally, the result of
    *t* − *t**e**s**t* \[[37](#bodymatter-005.xhtml#b_9783110670707-005_ref_037)\]
    was presented in [Table 5.5](#bodymatter-005.xhtml#b_9783110670707-005_tab_005)
    which was performed with 95% confidence level. During the test, the 𝒫 − *v**a**l**u**e*
    is checked. If it is less than 0.05 then null hypotheses is considered for rejection
    against the alternative hypothesis. Finally, Friedman test \[[38](#bodymatter-005.xhtml#b_9783110670707-005_ref_038),
    [39](#bodymatter-005.xhtml#b_9783110670707-005_ref_039)\] was performed among
    the participating procedure and was enlisted in [Table 5.6](#bodymatter-005.xhtml#b_9783110670707-005_tab_006).
    The obtained rank from the proposed algorithms QIGA, CGA, QIBA and CBA are 2.66,
    3.91, 1.08 and 2.33 respectively. According to the rank value, QIBA can be considered
    as the superior algorithm as it has the minimum rank value.


