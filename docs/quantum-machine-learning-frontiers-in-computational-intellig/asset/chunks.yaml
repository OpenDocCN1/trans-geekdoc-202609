    (4.16)$\\frac{1}{\\sqrt{2}}\\left( {\\left| {0\_{A}\\rangle\\; \\otimes \\;} \\right|1\_{B}\\rangle
    - \\left| {1\_{A}\\rangle\\; \\otimes \\;} \\right|0\_{B}\\rangle} \\right),$


    其中 |0[`A`]?⟩ & |1[`A`]?⟩ 是 `H`[`A`] 的两个基向量，而 |0[`B`]? & |1[`B`]? 是 `H`[`B`] 的两个基向量。


    ## 4.2.5 量子绝热模型


    如果量子系统处于哈密顿量 `H` 的基态，则系统保持在此态。根据绝热定理 \[18\]，只要变化足够缓慢，系统仍会接近基态。设 |`E`[0]; `t`⟩
    & |`E`[1]; `t`⟩ 为哈密顿量 `H`(`t`) 的基态和第一激发态，其中 `E`0 和 `E`1 分别对应基态和第一激发态的能量。我们将这两个本征值之间的最小能隙定义为：


    (4.17)$g\_{min} = \\min\\limits\_{0 \\leq t \\leq T}\\left\\lbrack {E\_{1}\\left(
    t \\right) - E\_{0}\\left( t \\right)} \\right\\rbrack$


    因此，当我们在时间 `t` = 0 时将系统制备在其基态 |`E`[0]; 0 并使其在哈密顿量 `H`(`t`) 下演化时，我们得到：


    (4.18)|⟨`E`[0];`T`|`ψ`(`T`)⟩|² ≥ 1 − `ε`²


    其中 $1 \\gg \\varepsilon \\geq \\frac{\\max\\limits\_{0 \\leq t \\leq T}\\left|
    \\left\\langle \\frac{dH}{dt} \\right\\rangle\_{1,0} \\right|}{g\_{min}^{2}}$,
    且 $\\left\\langle \\frac{dH}{dt} \\right\\rangle\_{1,0} = \\left\\langle {E\_{1};\\,
    t|\\frac{dH}{dt}|E\_{0};\\, t} \\right\\rangle$


    ## 4.2.6 SWAP 测试


    `SWAP-test` 在给定两个输入量子态 |`ψ`[1]⟩ 和 |`ψ`[2]⟩ 时估计 |⟨`ψ`[1]|`ψ`[2]⟩|²，其精度为 $O\\left(
    \\frac{1}{\\sqrt{M}} \\right)$，其中 `M` 为测量的次数。


    ## 4.2.7 量子算法


    量子算法是专门为在量子计算机上运行而编写的特殊类型的算法。这些算法基于量子力学的原理。这是目前非常活跃的研究领域，最近的研究工作表明，许多经典算法的量子版本在计算复杂度方面效率更高，其中一些比经典对应算法快呈指数级。一些最著名的量子算法是
    Grover 搜索算法 \[10\]、Shore 算法 \[19\]、量子支持向量机 \[21, 23, 24\] 以及 HHL 算法 \[20\]。


    # 4.3 构建量子机器学习框架的基本基础


    本节讨论开发量子机器学习算法的基本基础。这些基础概念非常重要。单一概念无法用于开发量子机器算法，不同的概念用于培养不同的算法。本节解释了一些非常关键的基础概念，它们为构建量子机器学习算法提供支持。我们在第
    4.4 节和 4.5 中讨论了不同方法如何使用这些概念来阐述各种量子机器算法。


    ## 4.3.1 Grover 搜索算法


