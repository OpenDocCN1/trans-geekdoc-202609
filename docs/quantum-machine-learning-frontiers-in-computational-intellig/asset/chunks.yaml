    \ = (1/√2) * (0⟩ + (1/√2))`\n\nd. \nMake Problem Hamiltonian `H[fin]`, which is\
    \ specific to the particular UCOP, however the structure would remain same irrespective\
    \ of the UCOP.\n\n`H[fin]|q[1]q[2]q[3]…q[n]⟩ = fpb(q[1]q[2]q[3]…q[n]) |q[1]q[2]q[3]…q[n]⟩`\n\
