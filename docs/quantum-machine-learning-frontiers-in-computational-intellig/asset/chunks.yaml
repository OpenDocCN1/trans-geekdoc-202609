- raw: 'We discuss here some of the significant developments on implementing quantum
    machine learning algorithms.


    In 2003 \[[50](#bodymatter-004.xhtml#b_9783110670707-004_ref_050)\], a group of
    researches discussed that image data can be very efficiently encoded in quantum
    states. This may reduce the resources to some order of magnitude to perform some
    specific and challenging image processing tasks. During the year of 2009 \[[51](#bodymatter-004.xhtml#b_9783110670707-004_ref_051)\],
    D-Wave demonstrated some remarkable results with their adiabatic D-Wave quantum
    system. Using regularized boosting with a non-convex objective function, researchers
    conducted experiments in the D-Wave system to identify cars in images. In the
    same year (2009), another research group showed mapping an input data and memorized
    the data with a Hamiltonian using a quantum Hopfield network with adiabatic quantum
    computation \[[52](#bodymatter-004.xhtml#b_9783110670707-004_ref_052)\].


    Since 2013 \[[53](#bodymatter-004.xhtml#b_9783110670707-004_ref_053), [54](#bodymatter-004.xhtml#b_9783110670707-004_ref_054)\],
    NASA, Google research, and the University Space Research Association are working
    on exploring the D-Wave quantum computer for solving complex optimization problems,
    which may have an impact in solving some of the machine learning algorithms with
    the help of advantages offered by quantum properties. In 2015, researchers demonstrated
    the classification between the digit ‘6’ and ‘9’ by implementing a quantum support
    vector machine algorithm with an NMR (Nuclear magnetic resonance) technology on
    a liquid-state quantum computer \[[55](#bodymatter-004.xhtml#b_9783110670707-004_ref_055)\].
    Another important result came in the same year 2015 when a research team implemented
    an all-optical linear classifier using non-linear photonics \[[56](#bodymatter-004.xhtml#b_9783110670707-004_ref_056)\].


    Recently, IBM launched an online framework for access to their quantum computer
    (named IBM Q), and the system supports around 32 + qubits to work with. They allow
    free access up to 5 qubits to work on the real quantum computer. We can run small
    specific quantum routines (e.g., Grover’s search, Hadamard gate, quantum SWAP
    test, etc.) into this system, which can help in solving complex machine learning
    use cases by using the outputs of these specific small quantum subroutines \[[16](#bodymatter-004.xhtml#b_9783110670707-004_ref_016)\].
    A fully functional quantum neural network is possible by implementing nonlinear
    interactions in the quantum dynamics, recently claimed by a research team in 2016
    \[[57](#bodymatter-004.xhtml#b_9783110670707-004_ref_057)\].


    Very recently, in 2017 \[[58](#bodymatter-004.xhtml#b_9783110670707-004_ref_058)\],
    the researchers demonstrated that their model is able to generate handwritten
    digits. The model is a probabilistic generative model based on arbitrary pairwise
    connectivity. Also in 2017, researchers encoded image information with the quantum
    image in a quantum system and discussed some interesting challenges on this topic
    \[[59](#bodymatter-004.xhtml#b_9783110670707-004_ref_059)\]. In 2017, a very interesting
    research work by Yao et.al. discussed the implementation of quantum image processing
    and its applications for detecting edges \[[60](#bodymatter-004.xhtml#b_9783110670707-004_ref_060)\].


    In July 2018, Google announced the first public alpha of Cirq, an open source
    framework at the First International Workshop on Quantum Software and Quantum
    Machine Learning (QSML). This will allow developers to build quantum algorithms,
    which may include some simple quantum machine learning algorithms with small scale
    data sets, without requiring a quantum physics background \[[61](#bodymatter-004.xhtml#b_9783110670707-004_ref_061)\].
    In 2020, Google announced TensorFlow Quantum which is a quantum machine learning
    library for rapid prototyping of hybrid quantum-classical ML models \[62\].


    ## 4.7 Conclusion


    Quantum machine learning is a fast emerging field of research that opens new horizons
    for artificial intelligence based research and applications. We are seeing active
    research developments in this area, and with the advancement of quantum computers
    and quantum devices, it may solve some of the most challenging problems that are
    difficult to solve with classical machine learning like clustering and classification
    training with big data in reasonable time period. Recent advancements in deep
    learning helped us train complex machine learning models with the help of GPUs
    and high-performance computing, which demonstrated remarkable speed ups and improved
    accuracies. More complex machine learning problems require high volumes of data
    and tremendous computational power, and, due to the limitations of silicon-based
    chip technology, we have significant constraints on the upper bound of the computational
    power. Quantum based systems promise significant improvements in speed up factors
    as compared to the classical systems. Some of the quantum machine learning algorithms,
    such as the quantum binary/multiclass SVM, quantum K-Means clustering, and the
    quantum Boltzmann machine, have revealed substantial performance improvements
    with big data. However, we have important challenges that need to be addressed
    in order to make effective and efficient quantum machine learning algorithms,
    such as: how to transform classical big data into quantum form in a very efficient
    way; the hardware where such quantum algorithms will be run is still at initial
    stages of development, so proper testing and validation of these theoretical quantum
    machine learning models is still an issue. Also, the QML opens new doors for exploring
    other domains like understanding the processing of neural network based algorithms
    like deep learning, understanding the quantum experiments data analysis with the
    classical machine learning. Small quantum devices are easier to develop as compared
    to fully functional quantum computers. It is believed these small specific quantum
    devices can speed up the merging of quantum terminologies and methods with the
    machine learning ones and can solve many domain-specific complex problems in a
    hybrid framework, where such small quantum devices are used to solve a small complex
    task in a big complex problem domain.


    ## References


    \[1\]Alpaydin, E. Introduction to Machine Learning. Adaptive Computation and Machine
    Learning. MIT Press, Cambridge, MA, 2004. [→](#bodymatter-004.xhtml#xref_d6256e39003)


    \[2\]Wikipedia, cite\_note 5-2. [→](#bodymatter-004.xhtml#xref_d6256e39006)


    \[3\]Schuld, M., Sinayskiy, I., & Petruccione, F. An in-troduction to quantum
    machine learning. Contemporary Physics. 2014, 56(2),172–185. [→](#bodymatter-004.xhtml#xref_d6256e39009)


    \[4\]Benedetti, M., Realpe-Gómez, J., Biswas, R., & Perdomo-Ortiz, A. Quantum-Assisted
    Learning of Hard-ware-Embedded Probabilistic Graphical Models. Physical Review
    X. ISSN 2160-3308. 2017, 7(4),041052. arXiv:1609.02542. doi:10.1103/PhysRevX.7.041052 [→](#bodymatter-004.xhtml#xref_d6256e39012)


    \[5\]Farhi, E. & Neven, H. Classification with Quantum Neural Networks on Near
    Term Processors. 2018-02-16. arXiv:1802.06002. [→](#bodymatter-004.xhtml#xref_d6256e39015)


    \[6\]Schuld, M., Bocharov, A., Svore, K., & Wiebe, N. Circuit-centric quantum
    classifiers. 2018-04-02. arXiv:1804.00633. [→](#bodymatter-004.xhtml#xref_d6256e39019)


    \[7\]Yu, S., Albarran-Arriagada, F., Retamal, J. C., Wang, Y. -T., Liu, W., Ke,
    Z.-J., Meng, Y., Li, Z.-P., and Tang, J.-S. Reconstruction of a Photonic Qubit
    State with Quantum Rein-forcement Learning. 2018-08-28. [→](#bodymatter-004.xhtml#xref_d6256e39027)


    \[8\]Broecker, P., Assaad, F. F., & Trebst, S. Quantum phase recognition via unsupervised
    machine learning. 2017-07-03. arXiv:1707.00663 [→](#bodymatter-004.xhtml#xref_d6256e39030)'
