    28. 最后，算法生成并报告了最优聚类数 𝒪_𝒩[𝒞] 及其对应的适应度值 𝒪_ℱ[𝒯]。


    ## 5.7 量子启发蝙蝠算法


    ### 5.7.1 QIBA 的提出方法


    如今，蝙蝠算法被广泛应用于多种复杂优化问题，因为其实现机制简单且收敛速度快，但有时会导致过早收敛。过早收敛可能由多种原因引起，例如蝙蝠多样性下降导致蝙蝠陷入局部最优，或最有希望的蝙蝠陷入局部最优，进而影响其他所有蝙蝠跟随相同的轨迹，因为其他蝙蝠被指示跟随当前最优解，而且在蝙蝠算法中没有明确的方法摆脱局部最优。为了解决这个问题，本文提出了一种量子启发的蝙蝠算法。蝙蝠种群的多样性通过量子旋转门实现，这有助于所提算法避免过早收敛而不影响收敛速度，尽管所提算法在计算时间方面的效率得到了保证
    [43]。


    预期算法建立在蝙蝠算法框架之上，并带有量子计算的特色。为了控制开发和探索，使用参数 `ℬ*R*` 和 `ℬ*A*` 并对其进行更新以指导局部和全局搜索过程。然而，每个候选者的新速度和位置通过以下方程更新。


    (5.13)$V_{i}^{t + 1} = \\left\\{ \\begin{matrix} {V_{i}^{t},if(\\delta{}_{i},\\delta{}_{best})
    = \\left( {0,0} \\right)} \\\\ {V_{i}^{t} + \\left( {P_{i}^{t + 1} - P_{best}}
    \\right),if(\\delta{}_{i},\\delta{}_{best}) = \\left( {1,1} \\right)} \\\\ {V_{i}^{t}
    + \\left( {P_{i}^{t + 1} - P_{best}} \\right)rand,if(\\delta{}_{i},\\delta{}_{best})
    = \\left\\{ {\\left( {1,0} \\right)or\\left( {0,1} \\right)} \\right\\}} \\\\
    \\end{matrix} \\right.$ (5.14)*P*[*i*]^(*t* + 1)\= *P*[*i*]^(*t*)+ *V*[*i*]^(*t* + 1)


    其中 `δ[i]` 和 `δ[best]` 分别表示当前蝙蝠和局部最优蝙蝠的量子态，而 `rand` 是 0 到 1 之间的随机数。如果当前蝙蝠和最佳蝙蝠的状态均为
    0，则表示该当前蝙蝠在此时间点不会影响搜索过程，因此无需改变该位置的速度。如果当前蝙蝠和最佳蝙蝠的状态均为 1，则表示该当前蝙蝠将很大程度上影响搜索过程，因为它接近当前最优解，因此它将利用当前最优位置的信息改变其当前速度。如果当前蝙蝠的状态值与最佳蝙蝠的状态值正好相反，则表示它远离当前最优解，因此它会倾向于在当前最佳解附近进行随机飞行，并利用当前最优解的信息以及
    0 到 1 之间的随机值更新其速度。最后，当前蝙蝠的新位置是利用其新生成的速度计算得出的。


    在搜索过程中，每只蝙蝠的位置按如下方式更新。


    (5.15) $P_{new} = {}\\{\\begin{matrix} {P_{old} + \\varepsilon AL^{t}\\,\\,\\,\\,
    if\\,\\, rand > p} \\\\ {P_{old} + \\varepsilon\\left( {AL^{t} - P_{old}} \\right)\\,\\,\\,
    otherwise} \\\\ \\end{matrix}{}$


    其中，`ε` ∈ [−1, 1]，在时间戳 `t` 时，$AL^{t} = \\frac{1}{n}\\sum_{i = 1}^{n}AL_{i}^{t}$
    表示 `n` 只蝙蝠的平均响度，而 `pτ` 表示脉冲速率。


    如果脉冲速率 `pτ` 低于某个概率（`rand` > `pτ`），则表示蝙蝠将在执行短暂随机飞行之前飞向当前更优的蝙蝠附近。否则，认为蝙蝠更接近猎物，它们将在当前位置周围进行随机飞行。这里
    `rand` 是一个均匀分布的随机数，在计算过程中取值范围为 [0, 1]。


    脉冲速率 (`pτ[i]`) 的增加和蝙蝠的响度 (`AL[i]`) 的减小由以下方程给出。


    (5.16) *p*τ[*i*]^(*t* + 1) = *p*τ[*i*]⁰(1−*e*^( − *γ**t*)) (5.17)*A*L[*i*]^(*t* + 1) = *α* *A*L[*i*]^(*t*)


    其中，常数项 `γ` 和初步脉冲速率 `pτ[i]⁰` 均在 0 到 1 之间选取。随后，估计每只蝙蝠的适应度值并选择当前的 `P[best]`。这里 `α`
    被视为收缩-扩张，可定义如下。


    (5.18) $\\alpha = \\ \\alpha_{i} - \\frac{\\alpha_{i} - \\ \\alpha_{\\ell}}{\\mathcal{T}}\\
    t$


    这里 `α[i]` 定义 `α` 的初始值，而 `α[ℓ]` 定义 `α` 的最后值。最大迭代次数用 `𝒯` 表示。在执行过程中，`α[i]` = 1 且
    `α[ℓ]` = 0.5 被设定以提高算法性能 [43, 44]。


    本节描述了通过量子启发 BAT 算法识别图像数据集所属的最优聚类数的过程。


    最初，蝙蝠种群 `P_BAT` 被初始化，种群大小为 `Psize`，其中每个解的长度为 `BLn`，种群中的每个解都被视为问题的解。初始化采用输入图像的归一化像素强度值，该值是随机选择的。输入图像的最大强度值首先经过平方根函数处理，然后被视为每个粒子的长度（`BLn`）。另一个变量
    `Inormal` 用于存储输入图像每个像素强度的归一化值（介于 0 和 1 之间）（第 1 行）。


    现在，为 `P_BAT` 的每个元素创建了量子态 `Q^(ℬAT)`。并且 `P_BAT` 由 `P_BAT^(α)` 和 `P_BAT^(β)` 编码，式
    (5.8) 应得到满足。编码过程如下所示。


    最初，为种群解的每个粒子随机创建 `θ[i,j]`（0≤`θ[i,j]`≤2`π`），用于生成量子态，即 `Q^(ℬAT)`。对于特定的 `t^(th)`
    代，量子态 `Q^(ℬAT)(t)` 表示如下。


    `Q^(ℬAT)(t)` = {`q[1]^(ℬATt)`, `q[2]^(ℬATt)`, …, `q[N]^(ℬATt)`}，其中 `q[i]^(ℬATt)`（`i`=1,
    2,…, `Psize`）表示 `Q^(ℬAT)(t)` 的任意元素，可表示为


    $q_{i}^{\\mathcal{B}ATt} = \\ \\begin{bmatrix} {\\alpha_{i,1}^{\\mathcal{B}ATt}\\
    \\left| {\\ \\alpha_{i,2}^{\\mathcal{B}ATt}\\ \\left| \\ldots \\right|\\alpha_{i,m}^{\\mathcal{B}ATt}}
    \\right|} \\\\ {\\ \\beta_{i,1}^{\\mathcal{B}ATt}\\left| {\\ \\beta_{i,2}^{\\mathcal{B}ATt}\\
    } \\right|\\ldots\\left| {\\ \\beta_{i,m}^{\\mathcal{B}ATt}} \\right|} \\\\ \\end{bmatrix},\\
    \\left( {s.t.\\ m = BLn} \\right)$


    这里，`α[i,j]^(st)` 和 `β[i,j]^(st)` 的每个值由下式计算


    $\\begin{pmatrix} \\alpha_{i,j}^{\\mathcal{B}ATt} \\\\ {\\ \\beta_{i,j}^{\\mathcal{B}ATt}}
    \\\\ \\end{pmatrix} = \\begin{pmatrix} {\\cos\\theta_{i,j}^{\\mathcal{B}ATt}}
    \\\\ {\\sin\\theta_{i,j}^{\\mathcal{B}ATt}} \\\\ \\end{pmatrix},\\ {where}\\ i
    = \\left\\{ {1,2,\\ldots,P\\, size} \\right\\}\\ and\\ j = \\left\\{ {1,2,\\ldots,BLn}
    \\right\\}$


    并且它们对应的值分别保存在 `P_BAT[i,j]^(α)` 和 `P_BAT[i,j]^(β)` 中。（第 2 行）。

    '
