    \ and can be constructed reversibly as follows:\n\nIf (`f(q) ≥ Yth`) … … for Minimization\n\
    `fpb(q) = 0;`\nelse\n`fpb(q) = 1;`\n\nwhere `|q[1]q[2]q[3]…q[n]⟩` are `n` qubits\
    \ representing the decision variables of the UCOP being solved given eq. (3.13)\
    \ and `q = q[1]q[2]q[3]…q[n]`. The `fpb(q)` would be implemented in an Oracle\
    \ and so its outcome would be reflected in the state of ancilla qubit, `qo`. `Yth`\
    \ is the threshold value computed from the objective function of the UCOP being\
