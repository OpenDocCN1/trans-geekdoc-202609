    ### 4.5.3 量子 K-means 聚类


    聚类是机器学习中一个非常重要的问题，更一般地属于无监督学习。聚类算法根据相似特征将未标记的数据集分组到多个类别中。`K`-Means 聚类算法是一种非常流行且简单的聚类算法。`K`-Means
    将未标记的数据集分组为 `k` 个类别，然而，我们必须提前指定 `K`。在 [[25]] 中，作者展示了 `K`-Means 聚类算法在量子范式中的表述。在量子
