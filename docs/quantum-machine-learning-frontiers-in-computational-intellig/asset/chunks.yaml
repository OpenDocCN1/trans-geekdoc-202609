    \ adiabatic algorithm for the case where a single element is marked i.e. M = 1\
    \ by investigating the minimum energy gap between the first excited state and\
    \ the ground state of the system Hamiltonian. Moreover, the algorithm keeps the\
    \ advantages of global adiabatic algorithms without losing the speedup of the\
    \ local adiabatic search algorithm by evolving globally only for a small interval\
    \ during evolution from initial to final / problem Hamiltonian.\n\nIn \\[[22](#bodymatter-003.xhtml#b_9783110670707-003_ref_022)\\\
    ], it was shown that quantum circuit models can simulate efficiently an arbitrary\
    \ AQC based algorithm. Subsequently, it has also been shown in \\[[35](#bodymatter-003.xhtml#b_9783110670707-003_ref_035)\\\
    ] that an appropriate AQC based algorithm can efficiently simulate any quantum\
    \ circuit model. Further a simple proof of equivalence between adiabatic quantum\
    \ computation and quantum computation in the circuit model has been provided by\
    \ Mizel et al. \\[[36](#bodymatter-003.xhtml#b_9783110670707-003_ref_036)\\].\
    \ Therefore, AQC and Quantum Circuit models of computation are essentially equivalent,\
    \ which implies that a quantum algorithm can be designed in either of the two\
