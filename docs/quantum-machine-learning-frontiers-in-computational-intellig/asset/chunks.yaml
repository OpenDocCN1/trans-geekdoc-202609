    unique cluster points was stored in `ℬCP[i]`.


    ![Figure 5.1: Cluster Centroid Representation Scheme.](graphic/converted/b_9783110670707-005_fig_001.png)

    Figure 5.1: Cluster Centroid Representation Scheme.


    Now, from `ℬCP[i]`, the fitness (`ℱ[T][i]`) of each solution was evaluated with
    the help of a cluster validity index namely, `DB-Index`. [[eq. (5.12)](#bodymatter-005.xhtml#b_9783110670707-005_eq_012)].
    (Lines 5–10).


    Now, the best fitness value `𝒪_ℱ[T]` was identified from all computed fitness
    values (`𝒪_ℱ[T][i]`) and saved along with the respective number of cluster points
    `𝒪_𝒩[C]`. (Line 11).


    Using rotation gate ([eq. (5.10)](#bodymatter-005.xhtml#b_9783110670707-005_eq_010))
    strategy another set of populations `P_BAT[new]^(α)` and `P_BAT[new]^(β)` were
    created. Update the values of `P_BAT^(α)` and `P_BAT^(β)` by using their earlier
    values or by using their recently created values of `P_BAT[new]^(α)` and `P_BAT[new]^(β)`
    on the basis of the best value of fitness. Now, if the recently created values
    were not able to make better fitness values then the current set of values were
    rejected and the old set of values were preserved in the population otherwise
    the new set of values were accept. Now, it was possible to create a novel quantum
    population as it produces the diversity in the solution space (Line 12).


    The rotation gate updating process was applied which yielded the best fitness
    value (`ℬℱ[T]`) and the respective cluster points were preserved in `ℬCP` and
    `ℬnc` conserved the total number of cluster points (Line 13).


    During each execution of the main loop, the quantum positions and velocities were
    updated by the [eqs. (5.13)](#bodymatter-005.xhtml#b_9783110670707-005_eq_021)
    and [(5.14)](#bodymatter-005.xhtml#b_9783110670707-005_eq_022) (Line 16).


    The rotation gate strategy was responsible for the improvement of the best quantum
    solutions (Line 17).


    The best solution was selected from the computed fitness of the updated positions
    and a local solution was generated by using the [eq. (5.15)](#bodymatter-005.xhtml#b_9783110670707-005_eq_015).
    (Lines 18–20).


    Next, the new quantum solutions were estimated and by applying rotation gate strategy
    each value of the state `Q^(BAT)(t)[J]`, `P_BAT[J]^(α)` and `P_BAT[J]^(β)` were
    updated. (Lines 21–22).


    Now the new solution was accepted and the pulse rate of each bat was increased
    and the loudness of each bat was decreased by the [eqs. (5.16)](#bodymatter-005.xhtml#b_9783110670707-005_eq_016)
    and ([5.17](#bodymatter-005.xhtml#b_9783110670707-005_eq_017)). (Lines 23–26).


    The best quantum solutions was determined and saved (Line 27).


    In order to achieve the best solution the main loop was continued for a predefined
    number of times (Lines 14–29).


    Finally, the best quantum solution was determined and the optimum number of cluster
    was identified along with its associated value of fitness. (Line 30).


    The working principle for QIBA is presented as follows.


    ### Algorithm

    Quantum Inspired Bat Algorithm for automatic clustering


    Input parameter:

    Maximum number of Iteration: `MI`

    Size of population: `Psize`


    Output parameter:

    Optimum cluster number: `𝒪_𝒩[C]`

    Optimum fitness value: `𝒪_ℱ[T]`


    ```

