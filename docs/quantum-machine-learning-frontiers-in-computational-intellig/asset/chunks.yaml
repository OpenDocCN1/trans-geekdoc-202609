    \ be applied to a (crisp) set of values with quantum parallelism.\n\n## 2.4 Topographic\
    \ qubit maps\n\n### 2.4.1 Representation\n\nTo further explore quantum computation\
    \ by topographic maps, in this section we present an alternative representation\
    \ of the maps and a circuit-based implementation of arbitrary functions on a finite\
    \ domain. In these *topographic qubit maps*, each domain value *x*[*j*] ∈ *Ω* = {*x*[1],…,*x*[*n*]}\
    \ or codomain value *y*[*i*] ∈ *Ω*^′ = {*y*[1],…,*y*[*m*]} is assigned a separate\
    \ qubit, whose state, for example, |*ψ*[*j*]⟩ = *p*[*j*]^′|0⟩ + *p*[*j*]|1⟩, where\
    \ |*p*[*j*]^′|² + |*p*[*j*]|² = 1, represents the activity level of neuron *x*[*j*]\
    \ by the amplitude *p*[*j*]. This topographic representation can be contrasted\
    \ with a binary representation such as that proposed by Chen, Wang, and Charbon\
    \ \\[[17](#bodymatter-002.xhtml#b_9783110670707-002_ref_017)\\]. Our one-out-of-*n*\
    \ (or “one-hot”) representation might seem unrealistically inefficient, but (1)\
    \ we are assuming a scalable qubit implementation, which permits arrays of many\
    \ thousands of qubits, and (2) neural computations typically require only low\
    \ precision \\[in the brain perhaps as little as one digit: \\[[18](#bodymatter-002.xhtml#b_9783110670707-002_ref_018)\\\
    ]\\]. Therefore a quantity can be represented by a few tens of qubits; that is,\
    \ our *m* and *n* will typically be small (*m, n < *100).\n\nLike the topographic\
    \ basis maps, these topographic qubit maps can also be viewed as representations\
    \ of subsets of the domain; for *S* ⊆ Ω:\n\n$\\\\left| {S\\\\rangle} \\\\right.\
    \ = \\\\sum\\\\limits\\_{x\\_{j} \\\\in S}\\\\left| {1\\\\rangle}\\_{j} \\\\right.\
    \ + \\\\sum\\\\limits\\_{x\\_{j} \\\\notin S}\\\\left| {0\\\\rangle}\\_{j} \\\\\
    right..$ \n\nThat is, the *x*[*j*] qubit is in state |1⟩ if *x*[*j*] is in *S*\
    \ and is in state |0⟩ if it is not. Therefore we use the notation |{*x*[*j*]}⟩\
    \ for the topographic map representing just the number *x*[*j*]. The set of representations\
    \ of all possible subsets of Ω is then an ON basis for the 2*^n*\\-dimensional\
    \ Hilbert space of these qubits. The basis can be written:\n\n{|*k*⟩|*k*∈2^(*n*)} = {|*S*⟩|*S*⊆2^(*Ω*)},\
    \ \n\nwhere on the left **2***^n* is the set of *n*\\-bit binary strings, and\
    \ on the right **2**^Ω is the powerset of Ω. Therefore, the sets are basis states\
    \ and as a consequence topographic qubit maps permit *multiple* sets to be processed\
    \ in quantum superposition. Moreover, because the sets are represented by computational\
    \ basis vectors, they can be copied without violating the no-cloning theorem.\n\
    \nBy using amplitudes other than 0 and 1, we can represent fuzzy sets. Suppose\
    \ *S* is a fuzzy set with membership function *µ*: *S* → \\[0, 1\\], and let *m[j] *\\\
    = *µ*(*x[j]*). Then *S* is represented by the topographic qubit map\n\n$|S\\\\\
    rangle = \\\\sum\\\\limits\\_{j = 1}^{n}m\\_{j}|1\\\\rangle\\_{j} + \\\\sqrt{1\
    \ - m\\_{j}^{2}}\\\\ |0\\\\rangle\\_{j}.$ \n\nFuzzy sets cannot, in general, be\
    \ copied (nor can arbitrary superpositions of crisp sets).\n\nWith the topographic\
    \ qubit representation, the transformations between computational maps will be\
    \ implemented by the quantum circuit model, and so one might ask whether it would\
    \ be simpler to implement ordinary binary digital quantum computation. The answer\
    \ is that computation on topographic maps can be implemented by a few relatively\
    \ simple operations (described in the following subsections), so that computational\
    \ maps buy a simpler quantum implementation at the cost of greater representational\
    \ expense (number of qubits). We expect topographic quantum computation to be\
    \ more simply implemented than a full-scale digital quantum arithmetic-logic unit.\n\
