    25. ℬR[i] was increased and ℬA[i] was decreased by using the eqs. (5.16) and (5.17).

    26. end if.

    27. The best solution was chosen.

    28. end for.

    29. end for

    30. Finally, the algorithm produced and reported the optimal number of cluster
    points 𝒪_𝒩[C] with its associated fitness value 𝒪_ℱ[T].

