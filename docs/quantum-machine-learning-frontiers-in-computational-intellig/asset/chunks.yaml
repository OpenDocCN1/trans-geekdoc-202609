    for `k` ≠ 0.) These `N` basis vectors are in a one-to-one relation with the codomain
    elements |`k Δ x`⟩ (for `k` = 0,…, `N` − 1). The nullity is `n[o]` = (2`N`−1)
    − `N` = `N` − 1 and the basis vectors of the null space are:


    ```

    |v_k⟩ = (|kΔx⟩ - |-kΔx⟩)/√2   (for k = 1,…,N - 1).

    ```


