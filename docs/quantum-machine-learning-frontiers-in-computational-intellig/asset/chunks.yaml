    ## Notes


    # 3 Quantum optimization for machine learning


    Ashish Mani ASET, Amity University UP, EEE, ASET, G012A, E-I Block, Sector 125,
    201303, Noida, Uttar Pradesh, India Siddhartha Bhattacharyya Department of Computer
    Science and Engineering, CHRIST (Deemed to be University), Hosur Road, Bangalore,
    Karnataka, India Amlan Chatterjee California State University Dominguez Hills,
    Computer Science, California State University, 1000, E Victoria, 90747, Dominguez
    Hills, California, USA


    ### Abstract


    Machine learning is a branch of Artificial Intelligence that seeks to make machines
    learn from data. It is being applied for solving real world problems with huge
    amount of data. Though, Machine Learning is receiving wide acceptance, however,
    execution time is one of the major concerns in practical implementations of Machine
    Learning techniques. It largely comprises of a set of techniques that trains a
    model by reducing the error between the desired or actual outcome and an estimated
    or predicted outcome, which is often called as loss function. Thus, training in
    machine learning techniques often requires solving a difficult optimization problem,
    which is the most expensive step in the entire model-building process and its
    applications. One of the possible solutions in near future for reducing execution
    time of training process in Machine learning techniques is to implement them on
    quantum computers instead of classical computers. It is conjectured that quantum
    computers may be exponentially faster than classical computers for solving problems
    which involve matrix operations. Some of the machine learning techniques like
    support vector machines make extensive use of matrices, which can be made faster
    by implementing them on quantum computers. However, their efficient implementation
    is non-trivial and requires existence of quantum memories. Thus, another possible
    solution in near term is to use a hybrid of Classical Quantum approach, where
    a machine learning model is implemented in classical computer but the optimization
    of loss function during training is performed on quantum computer instead of classical
    computer. Several Quantum optimization algorithms have been proposed in recent
    years, which can be classified as gradient based and gradient free optimization
    techniques. Gradient based techniques require the nature of optimization problem
    being solved to be convex, continuous and differentiable otherwise if the problem
    is non-convex then they can find local optima only whereas gradient free optimization
    techniques work well even with non-continuous, non-linear and non-convex optimization
    problems. This chapter discusses a global optimization technique based on Adiabatic
    Quantum Computation (AQC) to solve minimization of loss function without any restriction
    on its structure and the underlying model, which is being learned. Further, it
    is also shown that in the proposed framework, AQC based approach would be superior
    to circuit-based approach in solving global optimization problems.


    Keywords: Artificial Intelligence, quantum computing, non-convex optimization,


    ## 3.1 Introduction


    Humanity has been enamored with the creation of artificially intelligent machines
    since the advent of programmable electronic computing devices in last century.
    In 1956, the term ‘Artificial Intelligence’ was coined for ‘thinking machines’
    in the workshop held at Dartmouth \[[1](#bodymatter-003.xhtml#b_9783110670707-003_ref_001)\].
    Several proposals have been made to make machines behave intelligently \[[2](#bodymatter-003.xhtml#b_9783110670707-003_ref_002)\],
    but most of them suffered from non-availability of technology required to implement
    them efficiently. Learning is considered as manifestation of the intelligent behavior,
    so a machine which can learn a difficult task will be treated at least artificially
    intelligent. The discipline which deals with the learning techniques involving
    data is called as Machine learning. It tries to make a computer learn from past
    experiences represented in from of data and make reliable decisions from it. These
    techniques can fine tune their performance as fresh experiences are gathered.
    It helps in building a data driven model rather than a static precise model and
    is widely used in classification, clustering and pattern recognition etc. It is
    being widely used in real world fields like financial services \[[3](#bodymatter-003.xhtml#b_9783110670707-003_ref_003)\],
    health services \[[4](#bodymatter-003.xhtml#b_9783110670707-003_ref_004)\], marketing
    and sales \[[5](#bodymatter-003.xhtml#b_9783110670707-003_ref_005)\], social network
    analysis \[[6](#bodymatter-003.xhtml#b_9783110670707-003_ref_006)\], and virtual
    personal assistants \[[7](#bodymatter-003.xhtml#b_9783110670707-003_ref_007)\]
    etc.

