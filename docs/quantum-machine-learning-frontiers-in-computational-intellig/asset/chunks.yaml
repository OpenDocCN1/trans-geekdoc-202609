- raw: "Quantum entanglement \\[[28](#bodymatter-004.xhtml#b_9783110670707-004_ref_028)\\\
    ] is a very important property of quantum mechanics, in which qubits interact\
    \ with each other instantaneously irrespective of the distances between them through\
    \ an unknown way of communication that is not limited to the speed of light. Correlated\
    \ particles remain entangled as long as they are isolated irrespective of the\
    \ distance between them.\n\nIf we cannot factor a multi-qubit state into the direct\
    \ product of a definite state for each qubit individually, then the states are\
    \ entangled. Hence, a pair of qubits *A* and *B* are entangled if and only if\
    \ we cannot write the joint state |*ψ*[*A**B*]⟩ as the product of a state for\
