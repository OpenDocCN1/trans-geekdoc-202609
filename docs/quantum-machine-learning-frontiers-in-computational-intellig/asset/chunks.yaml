    # 6 Conclusion


    Siddhartha Bhattacharyya


    Machine learning is a branch of Artificial intelligence, which tries to develop
    techniques that have ability to learn from experiences. These experiences are
    articulated as data generated from underlying models. The goal of any machine
    learning technique is to abstract the underlying model reliably for specific tasks
    like prediction and decision making. Enticed by the versatility of quantum mechanics,
    scientists have embarked on evolving machine learning algorithms based on the
    principles of quantum mechanics. As a result, different incarnations of the classical
    machine learning algorithms have come up enveloped within the quantum computing
    mechanisms. This book intends to throw a light on some of the recent advancements
    in this direction.


    The book first introduces to the readers the basics of quantum machine learning
    with reference to the well-known quantum algorithms in the form of Grover’s search
    algorithm \[[1](#bodymatter-006.xhtml#b_9783110670707-006_ref_001)\], quantum
    reinforcement learning \[[2](#bodymatter-006.xhtml#b_9783110670707-006_ref_002),
    [3](#bodymatter-006.xhtml#b_9783110670707-006_ref_003), [4](#bodymatter-006.xhtml#b_9783110670707-006_ref_004),
    [5](#bodymatter-006.xhtml#b_9783110670707-006_ref_005), [6](#bodymatter-006.xhtml#b_9783110670707-006_ref_006)\]
    and quantum annealing \[[7](#bodymatter-006.xhtml#b_9783110670707-006_ref_007),
    [8](#bodymatter-006.xhtml#b_9783110670707-006_ref_008)\]. A bird’s eye view on
    the evolution of quantum neural networks \[[9](#bodymatter-006.xhtml#b_9783110670707-006_ref_009),
    [10](#bodymatter-006.xhtml#b_9783110670707-006_ref_010), [11](#bodymatter-006.xhtml#b_9783110670707-006_ref_011),
    [12](#bodymatter-006.xhtml#b_9783110670707-006_ref_012), [13](#bodymatter-006.xhtml#b_9783110670707-006_ref_013),
    [14](#bodymatter-006.xhtml#b_9783110670707-006_ref_014), [15](#bodymatter-006.xhtml#b_9783110670707-006_ref_015),
    [16](#bodymatter-006.xhtml#b_9783110670707-006_ref_016), [17](#bodymatter-006.xhtml#b_9783110670707-006_ref_017)\]
    is also presented. The information processing capabilities of quantum algorithms
    depends on the quantum implementation of machine learning algorithms involving
    nonlinear functions operating on information represented topographically, as is
    common in neural cortex. Several approaches to quantum computation for machine
    learning by means of topographic representation have been proposed. These approaches
    show ways to construct unitary operators, implementable on quantum computers,
    that implement arbitrary (including nonlinear) functions via computational maps.


    Optimization problems are ubiquitous in machine learning and other domains like
    engineering and a number of specialized techniques for efficiently solving specific
    problems have been developed. A novel quantum optimization algorithm based on
    Adiabatic Quantum Computation through local evolution and inspired by the ideas
    from Grover’s Search algorithm \[[1](#bodymatter-006.xhtml#b_9783110670707-006_ref_001)\]
    can be evolved for finding minimum and employed in solving unconstrained optimization
    problems.


    As a transition from the classical paradigm to quantum paradigm, several researchers
    are involved in developing quantum inspired algorithms to bridge the gap between
    the two paradigms. Notable among them include the quantum inspired metaheuristic
    algorithms capable of delivering outputs in real time. Different incarnations
    of the quantum inspired metaheuristic algorithms have come up, thanks to the relentless
    efforts on the part of the scientists. These algorithms are efficient enough to
    obtain stable outputs by emulating the quantum mechanical principles on classical
    computers. In most of the cases, it is found that the quantum inspired versions
    of the metaheuristic algorithms outperform their classical counterparts.


    Although most of the quantum machine learning algorithms are based on the bilevel
    qubits, of late, much work is being carried out using multilevel quantum systems
    (using qutrits or qudits), which promise more efficiency.


