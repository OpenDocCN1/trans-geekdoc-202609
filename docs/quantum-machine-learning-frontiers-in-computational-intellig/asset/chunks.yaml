    除了监督学习和无监督学习之外，强化学习（`RL`）也是一个流行的学习方法类别。与 `SL` 和 `UL` 相比，`RL` 采用称为奖励的标量值来评估输入-输出对，并使用试错策略与环境交互以学习从状态到动作的映射。自
    1980 年以来，`RL` 逐渐成为 `ML` 的重要方法 \[5\]。迄今为止，它已广泛应用于人工智能（`AI`），特别是在机器人技术中 \[13, 14,
    15, 16, 17\]。这是因为它在线自适应方面表现出优异性能，并且对任何复杂非线性系统都具有普遍的学习能力。


    在处理实际应用时可能会出现一些复杂问题，例如探索策略、学习速度慢；特别是处理复杂问题。尤其可以观察到，当状态-动作空间变得巨大且随着维度的增加需要学习的参数数量呈指数增长时。迄今为止，近年来已引入了几种方法来应对这种情况。


    不同学习范式被联合用于优化 `RL`。Smith \[18\] 提出了一种新颖的模型，用于基于自组织映射（`SOM`）和基准 `Q-learning` 在无模型
    `RL` 中进行表示和泛化。此外，为了使模糊推理系统适应 Watkins 的 `Q-learning` 以解决具有大/连续状态-动作空间的问题，也提出了相关方法
    \[17, 19, 20\]。不同的 `RL` 方法在实践中得到了改进 \[21, 22, 23, 24\]。


    两个重要的量子算法，即 `Shor algorithm` \[25, 26\] 和 `Grover algorithm` \[27, 28\]，已被引入。Rigatos
    和 Tzafestas \[29\] 应用量子计算理论以获得模糊逻辑控制算法（`FCA`）并行化的益处，其目标是加快模糊推理。量子启发式进化算法（`QIEA`）已被开发以增强现有进化算法（`EA`）的性能
    \[30\]。后来，Hogg 和 Portnov \[31\] 引入了一种量子算法来解决具有过度约束可满足性和不对称旅行商问题的组合优化问题。最近，量子搜索方法已应用于动态规划
    \[32\]。考虑到计算的精神，Dong 等人 \[33\] 受量子计算的基本概念，即态叠加原理和平行性启发，发展了量子强化学习（`QRL`）的概念。`QRL`
    被开发用于加速学习，并在模拟实验过程中实现 `RL` 的探索与利用之间的权衡。


    ## 1.4 量子退火


    在统计力学中，应用于量子力学涨落领域的量子退火（`QA`）是模拟退火（`SA`）的量子版本 \[34, 35\]。它也被称为量子随机优化算法。与 `SA`
    一样，量子退火也成功应用于解决困难的优化问题。它基于量子计算活跃领域的量子绝热演化原理运作，并且是经典与量子技术之间有利的混合。`QA` 应用于不同领域，如计算机科学
    \[36\]、机器学习 \[37, 38\]、图论 \[39\]、通信 \[40, 41, 42\]、金融 \[43\]、航空航天 \[44\] 以及其他任何现实世界问题。


    在模拟退火 \[45\] 中，统计力学系统的温度依赖随机游走被用作给定优化问题的代价函数。该函数决定了解决方案空间的势能分布，热涨落避免探索陷入局部最小值
    \[46\]。期望系统在时间演化过程中保持接近热平衡。如果温度下降速率足够慢，就会发生这种情况，最终导致零温平衡态，即最低能量态 \[47\]。由于通用适用性、合理的性能以及在大多数情况下相对容易实现，`SA`
    在许多现实生活应用中被有效采用。当保持系统接近热平衡需要无限长的时间来得出精确解时，`SA` 被用于在可测量的计算时间内获得近似解。`QA` 中的量子涨落通过引入人工的量子特性自由度、非对易算符而被诱导。通过缓慢降低温度来控制量子涨落的强度以达到基态。


    如同优化问题的代价函数最小化问题，它可以被视为寻找经典 Ising 哈密顿量 `H0` 的基态 \[48\]。不同类型的实际问题具有大量局部最小值的代价函数。同样，Ising
    哈密顿量让人联想到经典自旋玻璃 \[49, 50\]。对于这些特征，经典算法很难找到全局最小值。这一问题可以通过将经典 Ising 哈密顿量 `H0` 提升到量子域的想法来克服。基于量子力学的绝热定理，经典
    Ising 模型的基态可以通过使系统处于某个初始哈密顿量 `H1` 的基态来推导 \[51, 52\]。它在理论上和实验上都很容易发展。`H1` 的选择方式使其不与
    `H0` 对易。随着系统参数的足够缓慢改变，哈密顿量从 `H1` 逐渐变化到 `H0`。

    '
