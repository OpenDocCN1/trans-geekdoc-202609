    16. The velocity and location of every particles in P_BAT[J] were modified by
    using the eqs. (5.13) and (5.14).

    17. Each value of the state Q^(BAT)(t)[J], P_BAT[J]^(α) and P_BAT[J]^(β) were
    updated using the rotation gate strategy in order to achieve a better solution
