    ## 2.4 Operator Construction and Garbage Analysis


    The operator is constructed very similarly to `U[tsum]`, but we also have to consider
    non-range codomain elements for non-surjective functions, which didn’t occur in
    that case. As before, the computation of the outer product will require `n`² ancillary
    `|0⟩` inputs and it will generate 2`n` qubits containing the passed-through inputs.
    We can consider disjoint subsets of the codomain. Codomain elements that are not
    in the range of `f` will need to be sent a `|0⟩` state, for which we need an additional
    `m[nr]` ancillary `|0⟩` inputs. Let `n[b]` be the number of input pairs that are
    mapped one-to-one to the corresponding outputs; they neither require ancillary
    constants nor generate garbage. The remaining codomain elements are range elements
    with `n[i]` ≥ 2; let `m[n]` = `n` − `m[nr]` − `n[b]` be the number of them. Each
    of these will receive the OR of the corresponding (preimage) domain elements.
    As we saw previously, the `OR[n[i]]` operation requires `n[i]` − 1 ancillary `|1⟩`
    qubits and produces 2`n[i]` − 2 qubits of garbage. Therefore, the total number
    of `|1⟩` qubits required for the `n`² − `n[b]` input pairs mapping to the `m[n]`
    non-injectively mapped range elements is:


    (2.40)$\\sum\\limits\_{i = 1}^{m\_{n}}\\left( {n\_{i} - 1} \\right) = \\sum\\limits\_{i
    = 1}^{m\_{n}}n\_{i} - m\_{n} = n^{2} - n\_{b} - m\_{n} = n^{2} - n + m\_{nr},$


    since `m[n]` = `n` − `m[nr]` − `n[b]`. The garbage generated by the ORs is then


    (2.41)$\\sum\\limits\_{i = 1}^{m\_{n}}\\left( {2n\_{i} - 2} \\right) = 2\\left(
    {n^{2} - n + m\_{nr}} \\right).$


    The complete input dimension is 2`n` (arguments) + (`n`² + `m[nr]`) (for `|0⟩`
    ancillae) + (`n`² − `n` + `m[nr]`) [for `|1⟩` ancillae, [eq. (2.40)](#bodymatter-002.xhtml#b_9783110670707-002_eq_040)]
    = 2`n`² + `n` + 2`m[nr]`. The output dimension is 3`n` (arguments and result)
    + 2(`n`²−`n`+`m[nr]`) [garbage, [eq. (2.41)](#bodymatter-002.xhtml#b_9783110670707-002_eq_041)]
    = 2`n`² + `n` + 2`m[nr]`.


    The same approach can be used for operations with more than two arguments, but
    the number of qubits increases exponentially with the number of arguments.


    ## 2.5 Conversions between representations


    Ordinary binary representations can be translated to topographic qubit maps by
    a unitary demultiplexer `U[demux]` that operates on an `m`-qubit binary number
    `|k⟩` and directs a `|1⟩` qubit to the `k`^(th) of `n` = 2^`m` output qubits (the
    remainder receiving `|0⟩`). Let `|{k}⟩` be the resulting computational qubit map.
    Then:


    (2.42)`U[demux]`|`k⟩`|`1⟩`|`0⟩`^(⊗ (`n` − 1)) = `|k⟩`|`{k}⟩`.


    `U[demux]` operates on an `m` + `n` = `m` + 2^(`m`) dimensional Hilbert space.
    A demultiplexer can be implemented with `CSWAP` (`Fredkin`) gates [[19](#bodymatter-002.xhtml#b_9783110670707-002_ref_019)].


    The opposite translation, from a computational map to a binary representation,
    is more complicated. First, we must decide what we want it to do, for in general
    a topographic qubit map represents multiple values with different amplitudes,
    `$|{\psi\rangle = \otimes_{j = 1}^{n}({p_{j}^{\prime}\left| {0\rangle} \right.
    + p_{j}|{1\rangle}})$`, where `|p[j]′|`² + `|p[j]|`² = 1. Which `x[j]` should
    it produce? The one with the maximum amplitude? (And what if several have the
    same maximum amplitude?) An `x[j]` chosen probabilistically based on `|p[j]|`²?
    The binary representation of a weighted average, `n^{-1}\sum_{j = 1}^{n}p_{j}x_{j}`?
    A normalized superposition of all the values? The answer is not apparent, so we
    leave the question open.[⁴](#fn4)


    ## 2.6 Applications to quantum machine learning


    Given this general ability to compute non-unitary and even nonlinear functions
    by means of topographic qubit maps, it is possible to do the operations useful
    for machine learning such as inner products and sigmoid nonlinearities. For example,
    an inner product of `N`-dimensional vectors requires `N` multiplications and `N`
    − 1 additions. If `|Ω|` = `n`, then each multiplication and addition will require
    approximately 2`n`² qubits (`Prop. 6`), for a total of approximately 2`N`²`n`².


    For one layer of a neural network, with say `N` neurons projecting through an
    `M` × `N` weight matrix into `M` neurons, we must do `M` inner products with the
    input. Since crisp sets are represented by computational maps that are basis vectors
    in the computational basis, they can be copied. Therefore, the `N`-dimensional
    input vector can be copied `M` − 1 times to do the `M` inner products. (This requires
    `M` − 1 `CNOT` gates and (`M`−1)`n` ancillary `|0⟩` qubits. Overall, one layer
    requires about 2`M``N`²`n`² qubits for the computation (not including ancillary
    qubits).


    ## 2.7 Conclusions


    Topographic (computational) maps are widely used in the brain to implement simultaneous
    nonlinear vector transformations on multiple inputs. In this chapter we have explored
    two approaches to quantum topographic computing with a focus on brain-inspired
    machine learning applications. The first, called a topographic basis map, assigns
    locations in the map to state vectors in a continuous or discrete basis for a
    quantum Hilbert space. Arbitrary functions can be implemented on such maps, which
    can be interpreted as representing crisp sets of inputs, but there is an unavoidable
    data-dependent attenuation of the result (relative to a “garbage” state) that
    is not easily avoidable. The second approach, called a topographic qubit map,
    assigns a separate qubit to each location in the map and uses the relative amplitude
    of the `|1⟩` and `|0⟩` states to represent the presence of values in the (crisp
    or fuzzy) set represented by the map. Arbitrary functions on these maps are implemented
    by well-known quantum logic gates. In particular, computational maps enable the
    implementation of the functions commonly used in artificial neural networks.


    ## References


    \[1\]Nielsen, M. A. and Chuang, I. L. 2010. *Quantum computation and quantum information*
    (10th Anniversary Edition ed.). Cambridge, UK: Cambridge Univ. Press. [a](#bodymatter-002.xhtml#xref_d6256e3555),
    [b](#bodymatter-002.xhtml#xref_d6256e12665)


    \[2\]Schuld, M., Sinayskiy, I., and Petruccione, F. 2014. The quest for a quantum
    neural network. *Quantum Information Processing* 13:2567–2586. [https://doi.org/10.1007/s11128-014-0809-8](https://doi.org/10.1007/s11128-014-0809-8) [→](#bodymatter-002.xhtml#xref_d6256e3564)


    \[3\]Schuld, M., Sinayskiy, I., and Petruccione, F. 2015. An Introduction to quantum
    machine learning. *Contemporary Physics* 56:172–185. [https://doi.org/10.1080/00107514.2014.964942](https://doi.org/10.1080/00107514.2014.964942) [→](#bodymatter-002.xhtml#xref_d6256e3567)


    \[4\]Furber, E. F., Lester, D. R., Plana, L. A., Garside, J. D., Painkras, E.,
    Temple, S., and Brown, A. D. 2013. Overview of the SpiNNaker system architecture.
    *IEEE Transactions on Computers* 62:2454–2467. [https://doi.org/10.1109/TC.2012.142](https://doi.org/10.1109/TC.2012.142) [→](#bodymatter-002.xhtml#xref_d6256e3573)


    \[5\]Neftci, E., Binas, J., Rutishauser, U., Chicca, E., Indiveri, G., and Douglas,
    R. J. 2013. Synthesizing cognition in neuromorphic electronic systems. *Proceedings
    of the National Academy of Sciences of the United States of America* 110:E3468–E3476.
    [http://dx.doi.org/10.1073/pnas.1212083110](http://dx.doi.org/10.1073/pnas.1212083110) [→](#bodymatter-002.xhtml#xref_d6256e3576)


    \[6\]O’Reilly, R. C., Munakata, Y., Frank, M. J., Hazy, T. E., and contributors.
    2014. *Computational cognitive neuroscience* (2nd ed.). [http://ccnbook.colorado.edu/](http://ccnbook.colorado.edu/)
