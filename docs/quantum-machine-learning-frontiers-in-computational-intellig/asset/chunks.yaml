    \ vector and vice versa (see [Figure 2.1](#bodymatter-002.xhtml#b_9783110670707-002_fig_001)).\
    \ Summing the numbers of basis vector dyads for *T, S, R, Q* gives:\n\n*n* + *m*[*n**r*] + (*m*−1)(*n*−1) + (*n*−1) = *m* + (*m*−1)(*n*−1) + *n* − 1 = *m**n*.\
    \ \n\n#### Proposition 2\n\nLet *Ω* and *Ω*^′ be finite sets with *n* = |*Ω*|,\
    \ *m* = |*Ω*^′|, and *m* > *n*. Let *f* : *Ω* → *Ω*^′ be a non-surjective injection.\
    \ Let ℋ[*C*] and ℋ[*G*] be Hilbert spaces of dimension *m* and *n*, respectively\
    \ (representing ancillary constant inputs and garbage outputs). Let |*ω*⟩ be a\
    \ fixed basis vector of ℋ[*C*] and |*υ*⟩ be a fixed basis vector of ℋ[*G*]. Then\
    \ there is a unitary operator *U* ∈ ℒ\\[ℋ(*Ω*) ⊗ ℋ[*C*], ℋ(*Ω*^′)⊗ ℋ[*G*]\\] such\
    \ that for all *x* ∈ *Ω*,\n\n(2.9)*U*(|*x*⟩⊗|*ω*⟩) = |*f*(*x*)⟩⊗|*υ*⟩. \n\n####\
    \ Proof:\n\nThe proposition follows from the construction preceding the proposition.\n\
    \nIf the input to *U* is a (normalized) superposition, |*ψ*⟩ = ∑[*k*]*p*[*k*]|*x*[*k*]⟩,\
    \ then the output will be a superposition of the corresponding function results:\
    \ *U*|*ψ*⟩|*ω*⟩ = ∑[*k*]*p*[*k*]|*f*(*x*[*k*])⟩|*υ*⟩.\n\nThe dimension of the\
    \ input and output spaces of this implementation is *mn*. A more resource-efficient\
    \ but also more complicated implementation operates on a space of dimension *L**C**M*(*m*, *n*).\
    \ The principle is the same: a permutation of the basis vectors.\n\n### 2.3.3 Non-injective\
    \ surjections\n\nNext we consider functions *f* : *Ω* → *Ω*^′ that are surjections\
    \ but not injections; that is, *f* maps onto *Ω*^′ but might not be one-to-one.\
    \ This includes many useful functions, such as non-injective squashing functions\
    \ and Gaussians, but also binary functions such as addition and multiplication\
    \ (as explained later).\n\nA non-injective function loses information, and thus\
    \ for quantum computation it must be embedded in a larger injective function,\
    \ which moreover must be unitary. In particular, if *f* is non-injective (e.g.,\
    \ *f*(*x*) = *f*(*x*^′) for some *x* ≠ *x*^′), then the corresponding graph kernel\
    \ will also be non-injective: *T*|*x*⟩=|*y*⟩ = *T*|*x*^′⟩ for |*x*⟩ ≠ |*x*^′⟩.\
    \ Therefore *T*(|*x*⟩ − |*x*^′⟩)= 0, which implies that |*x*⟩−|*x*^′⟩ is in the\
    \ null space of *T*, which we write \U0001D4A9(*T*). Therefore there is a bijection\
    \ between the orthogonal complement of the null space, \U0001D4A9(*T*)^⊥, and\
    \ the range of the operator, Im *T*. Hence we will implement the non-injective\
    \ operation by decomposing the input |*ψ*⟩ into orthogonal components |*ψ*⟩=|*μ*⟩ + |*ν*⟩,\
    \ where |*μ*⟩∈ \U0001D4A9(*T*)^⊥ and |*ν*⟩∈ \U0001D4A9(*T*). The |*μ*⟩ component\
    \ is sufficient to determine the output, so there is a bijection |*μ*⟩↦*T*|*ψ*⟩,\
    \ and the |*ν*⟩ component preserves the information to differentiate the inputs\
    \ that map to this output.\n\nTo explain how this separation can be accomplished,\
    \ we consider the finite-dimensional case, but it is easily extended. Let *Ω* = {*x*[1],…,*x*[*n*]}\
    \ and *Ω*^′  = {*y*[1],…,*y*[*m*]}; since *f* is surjective, *m *≤ *n*.\n\nThe\
    \ desired operator *T* is in ℒ(ℋ, ℋ^′), where ℋ = ℋ(*Ω*) is an *n*\\-dimensional\
    \ Hilbert space with basis {|*x*[1]⟩,…,|*x*[*n*]⟩}. The output space ℋ^′ is also\
    \ *n*\\-dimensional, and *m* of its basis vectors {|*y*[1],…,|*y*[*m*]} are used\
    \ to represent a topographic map of the function’s codomain (which is also its\
    \ range), Im *f *\\= *Ω*^′ = {*y*[1],…,*y*[*m*]}. Therefore ℋ(*Ω*^′) is a subspace\
