    \ \n\nprovided:\n\n(3.7)$\\\\frac{D\\_{max}}{g\\_{min}^{2}} \\\\leq \\\\varepsilon$\
    \ \n\nwhere 0 < *ε* ≪ 1,\n\nand\n\n(3.8)$\\\\left| \\\\frac{\\\\langle\\\\psi\\\
