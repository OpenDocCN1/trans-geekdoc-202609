    _{0 \\\\leq t \\\\leq T}\\\\lbrack E\\_{1}\\\\left( t \\\\right) - E\\_{0}\\\\\
    left( t \\\\right)\\\\rbrack$ \n\nThe maximum value of the matrix element of *dH*/*dt*\
