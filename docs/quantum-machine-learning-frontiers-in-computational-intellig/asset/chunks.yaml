    本文的目的是提出两种不同的量子启发式算法，结合两种不同的元启发式算法的工作流程，即遗传算法和蝙蝠算法，以识别给定图像中存在的最优聚类数。为了完成实验，DB-Index
    [40] 被用作目标函数。最优结果是在计算得到的最小时值下实现的。以下小节展示了实验得到的结果。


    ## 5.8.1 聚类中心的表示方案


    给定图像数据集中的聚类中心被用于自动识别该数据集中存在的最优聚类点数。在该过程执行期间，使用以下方程来选择聚类中心。


    ```

    (5.19)$\\ \\delta_{i} = \\ \\{\\begin{matrix} {1\\ if\\ \\beta_{i} > \\ \\alpha_{i}\\
    } \\\\ {0\\ Otherwise} \\\\ \\end{matrix}$

    ```


    其中，`δ[i]`（`1` < `i` < `n`）为激活阈值。通过观察 `δ[i]` 的值，聚类中心是从单一解中选择的。这里 `α[i]` 和 `β[i]`
    为复系数，且 `δ[i]` 被认为类似于量子比特的状态。`δ[i]` 的值为 1 表示聚类中心被激活，这意味着量子比特处于激发态，否则处于基态。以下 图 5.1
    显示了聚类中心表示方案。


    ## 5.8.2 实验结果分析


    本文提出了两种不同的基于种群的量子启发式元启发式算法，即量子启发式遗传算法和量子启发式蝙蝠算法。实验在四张伯克利图像和两张真实生活图像上进行。任何元启发式算法的性能在很大程度上取决于参数的设置，即，适当的参数选择可以极大地影响元启发式算法的收敛速度。


    QIGA 的参数选择为：世代数取值范围为 100 至 500；种群大小取自 25 至 50。变异概率选为 0.01。对于 CGA，世代数取值范围为 100
    至 500。种群大小取自 25 至 50。交叉和变异概率分别选为 0.9 和 0.01。QIBA 和 CBA 的参数选择为迭代次数 100 至 300，种群大小取自
    25 至 50，`γ` = `α` = 0.5，初始脉冲率可表示为 `r[i]⁰` ∈ `[0, 1]`，波长范围为 [`λ[min]`, `λ[max]`]
    = `[0, 1]`，频率范围为 [`F[min]`, `F[max]`] = `[0, 1]`，且响度 `L[0]` = 0.5。


    在实验过程中发现，量子启发式方法可以在没有比其对应的经典方法更大的种群或更多的迭代次数的情况下产生良好的结果。由于量子比特的概率幅值（`α`, `β`），单一解可能产生多个解，这可能导致小种群规模的增加。因此，在量子启发式方法中，搜索可以从较小的种群开始。对于每种特定的参数设置，每个过程均运行
    30 次。适应度的均值由多次运行计算得出。多次运行计算得到的值在以下表格中呈现。


    所有实现算法如 QIGA、CGA、QIBA 和 CBA 的最优聚类数及其相关的最优适应度值在 表 5.1 中呈现。从 表 5.1 可以看出，方法 QIBA
    计算出的适应度值在所有其他实现方法中为每种图像数据集提供了最佳适应度值（最小值），并且还发现量子启发式方法比其经典对应方法获得了更好的适应度值。在 表 5.2
    中呈现了所有实现方法的最佳执行时间，这表明量子启发式方法比其经典对应方法花费的时间更少，且 QIBA 的处理时间在其他方法中为最小。表 5.3 提供了 QIGA
    和 CGA 计算得到的均值、标准差和标准误差。这里可以看出，在均值、标准差和标准误差方面，QIGA 比 CGA 提供了更有前景的结果。同样，QIBA 比 CBA
    提供了更有前景的结果，这在 表 5.4 中呈现。从这两个表格可以看出，QIBA 在所有其他方法中具有最小误差。名为 unpaired `t-test` 的统计优越性检验在
    QIGA 与 CGA 之间以及 QIBA 与 CBA 之间进行，这在 表 5.5 中呈现。从 表 5.5 可以看出，在 QIGA 与 CGA 的比较中，六个结果中有三个结果极显著，其余三个结果非常显著。而对于
    QIBA 和 CBA，六个结果中有四个极显著，一个非常显著，一个显著。该分析表明量子启发式方法远优于其经典对应方法。最后，QIGA、CGA、QIBA 和 CBA
    的 Friedman 检验结果在 表 5.6 中呈现。根据排名，QIBA 是最优选的方法，因为它获得了第一名。


