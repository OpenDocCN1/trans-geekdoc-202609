    \ \n\n输入量子位。*m*[nr] 个常数 |0⟩ 直接传递到非像陪域元素的输出量子位。用于单射输入的 *n*[b] 个量子位传递到相同数量的输出量子位，按需要置换。OR\
    \ 的输出投影到表示具有多个原像的值域值的 *m*[n] 个量子位上。每个 `OR[2]` 还产生两个垃圾量子位，总共 2(*n*[n] − *m*[n])。因此输出量子位的总数为\n\
    \n*m*[*n**r*] + *n*[*b*] + *m*[*n*] + 2(*n*[*n*]−*m*[*n*]) = 2*n*[*n*] + *n*[*b*] + *m*[*n**r*] − *m*[*n*],\
    \ \n\n这等于输入量子位的数量，正如它应有的那样。接下来我们将 `U[f]` 明确定义为三个算子的张量积：\n\n(2.30)$U_{f}\\;\\overset{def}{=}\\\
    ; U_{b} \\otimes U_{nr} \\otimes U_{n}.$ \n\n我们将使用记号 |1⟩[*q*] 表示量子位 *q* 中的 |1⟩\
    \ 状态，以及 |0⟩[*q*] 表示量子位 *q* 中的 |0⟩ 状态。\n\n`U[nr]` 算子是将常数 |0⟩ 辅助量子位复制到不在 `f` 值域中的陪域元素中的恒等操作。因此，设\
    \ {*c*[1],…, *c*[*m*[*n**r*]]} ⊆ *Ω*^′ − *I**m* *f* 为此子集，并设 |*z*[*i*]⟩ 为提供常数 |0⟩\
    \ 的辅助量子位。则 `U[nr]` ∈ ℒ(ℋ^(*m*[*n**r*]),ℋ^(*m*[*n**r*])) 定义为：\n\n(2.31)$U_{nr}\\\
    ;\\overset{def}{=}\\;\\sum\\limits_{i = 1}^{m_{nr}}\\left| {0\\rangle} \\right.\\\
    _{c_{i}}\\langle 0|\\_{z_{i}} + \\left| {1\\rangle} \\right.\\_{c_{i}}\\langle\
    \ 1|\\_{z_{i}}.$ \n\n也就是说，*z*[*i*] 输入量子位（ intended to be |0⟩）的状态被转移到 *c*[*i*]\
    \ 输出量子位。该算子可以用以下括号记号缩写：\n\n(2.32)$U_{nr}\\overset{def}{=}\\left\\lbrack {c_{1},\\\
    ldots,c_{m_{nr}}} \\right\\rbrack\\leftarrow\\left\\lbrack {z_{1},\\ldots,z_{m_{nr}}}\
    \ \\right\\rbrack.$ \n\n它只是量子位的置换，可以通过量子位 SWAP 操作实现。\n\n`U[b]` 算子处理映射到其像的单射定义域元素。因此，设\
    \ {*v*[1], …, *v*[*n*[*b*]]} ⊆ *I**m* *f* 为单射定义域元素，并设 *u[i] *\\= *f* (*v[i]*)\
    \ 为相应的值域元素。则 `U[b]` ∈ ℒ(ℋ^(*n*[*b*]),ℋ^(*n*[*b*])) 是地形映射元素的该子集的置换：\n\n(2.33)$U_{b}\\\
    overset{def}{=}\\left\\lbrack {u_{1},\\ldots,u_{n_{b}}} \\right\\rbrack\\leftarrow\\\
    left\\lbrack {v_{1},\\ldots,v_{n_{b}}} \\right\\rbrack.$ \n\n对于 `U[n]`，我们必须对对应于具有多个原像的每个值域元素的定义域元素进行\
    \ OR。因此我们将 `U[n]` 定义为每个此类值域元素的算子的张量积：\n\n(2.34)$U_{n}\\;\\overset{def}{=}\\; \\\
    otimes \\,_{i = 1}^{m_{n}}V_{i}\\left( {y_{i},f^{- 1}\\left\\{ y_{i} \\right\\\
    }} \\right),$ \n\n其中这些 *y*[*i*] 各自具有多个原像元素；例如，*f*^( − 1){*y*[*i*]} = {*x*[1],…, *x*[*n*[*i*]]}，其中\
    \ *n*[*i*] = |*f*^( − 1){*y*[*i*]}| ≥ 2。如此值域元素的输出状态 |*ψ*[*i*]⟩ 是其原像元素的输入状态 |*ξ*[*j*]⟩\
    \ (*j* = 1, …, *n*[*i*]) 的 OR：\n\n|*ψ*[*i*]⟩|*γ*⟩ = *O**R*[*n*[*i*]]|*ξ*[1]⟩⋯|*ξ*[*n*[*i*]]⟩|1⟩^( ⊗ (*n*[*i*] − 1)),\
    \ \n\n其中 *O**R*[*n*[*i*]] 是 *n*[*i*] − 1 个 *O**R*[2] 门的级联，且 |*γ*⟩ 是 2(*n*[*i*] − 1)\
    \ 维垃圾。这由算子 `V[i]`(*y[i]*,{*x*[1],…, *x*[*n*[*i*]]}) ∈ ℒ(ℋ^(2*n*[*i*] − 1),ℋ^(2*n*[*i*] − 1))\
    \ 实现：\n\n(2.35)$V_{i}\\left( {y_{i},\\left\\{ {x_{1},\\ldots,\\ x_{n_{i}}} \\\
    right\\}} \\right)\\overset{def}{=}\\left\\lbrack {y_{i},\\gamma_{1},\\ldots,\\\
    \ \\gamma_{2{({n_{i} - 1})}}} \\right\\rbrack\\leftarrow OR_{n_{i}}\\ \\left\\\
    lbrack {x_{1},\\ldots,\\ x_{n_{i}};\\\\ o_{1},\\ldots,\\ o_{n_{i} - 1}} \\right\\\
    rbrack,$ \n\n其中 *o*[1], …, *o*[*n*[*i*] − 1] 是为 OR 提供辅助 |1⟩ 的量子位，而垃圾输出 *γ*[1], …, *γ*[2(*n*[*i*] − 1)]\
    \ 接收取反的输入和中间 OR 输出。括号记号标识 *O**R*[*n*[*i*]] 的输入和输出量子位。这完成了 `U[f]` 的构造 [式 (2.29)]。\n\
    \n存在更高效的计算 `U[f]` 的方法，但上述构造更容易理解。这种基本方法可用于近似神经网络中有用的各种一元函数，例如 sigmoid 函数，包括非单射、非满射的压缩函数。然而，神经网络还需要加法和乘法等非一元函数，我们现在转向这些函数。\n\
    \n## 2.4.3 二元函数\n"
