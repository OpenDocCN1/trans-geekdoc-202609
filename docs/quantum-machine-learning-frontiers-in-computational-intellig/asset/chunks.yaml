    基于幅度编码的机器学习算法的目标 \[9, 11, 20, 33, 36, 37, 38, 39, 40\] 是构建量子机器学习算法，其资源随 `n` 个量子比特呈多项式运行时间增长，并随幅度以及输入维度呈对数增长。许多基于该方法的
    `QML` 算法通过量子力学求解线性方程组来利用加速优势 \[20\]。量子矩阵求逆是求解线性方程组比经典方法快指数级的核心过程之一。基于幅度编码方法的一些著名量子机器学习算法是
    `quantum support vector machine` \[21, 22, 23\] 和 `least-square linear regression`
    \[37, 38\]。


    ## 4.4.2 基于 Grover 搜索的方法

    基于 `Grover` 搜索算法的机器学习算法，使用 `amplitude amplification` 技术以二次运行时间加速展开无结构搜索问题，将 Grover
    搜索子程序应用于解决更大问题。 `Quantum K-Means` \[25\]、 `K-Median` \[41\] 和 `k-nearest neighbors`
    \[42\] 是一些使用 Grover 搜索算法作为子程序来解决机器学习任务的机器学习算法。Grover 搜索子程序的另一个最新用途是在训练 `perceptron`
    \[43\] 中。


    ## 4.4.3 基于量子退火的方法

    最近，一些基于 `quantum annealing` \[44\] 的实验已经完成。在这项工作中，研究人员使用量子退火机对转录因子结合进行分类和排序，以研究蛋白质（在基因中）如何识别并特异性结合其
    DNA 靶点。研究人员使用 `D-Wave` 系统来实现量子退火算法。在这里，机器学习技术已成为揭示基因水平相互作用机制的有效工具。


    ## 4.5 量子机器学习算法的最新进展

    近年来，开发量子机器学习算法的研究呈指数级增长，日复一日地发布新的有趣量子机器学习算法。在这里，我们涵盖了与经典方法相比表现出显著最先进性能的最具突破性和流行的算法。


    ### 4.5.1 量子二值最小二乘支持向量机

    `quantum binary least square support vector machine` 是 `QML` 领域的突破，作者 Rebentrost
    等 \[21\] 在支持向量机公式中展示了指数级加速增益。

    在最小二乘 `SVM` 中，优化问题被转化为包含 `kernel matrix` 的线性方程组以求解优化问题。我们通过求解最小二乘公式并加速核矩阵计算，以更快的速度求解线性方程组。以下领域我们利用量子优势来提高
    `SVM` 的性能：

    1. 使用量子随机存取存储器进行数据准备 (`QRAM`) – 量子机器学习中的一项具有挑战性的任务是为处理准备数据集以输入量子系统。 `QRAM` 有助于将经典数据集制备成量子形式。
    `QRAM` 需要 `O(log[2] d)` 步来从内存中查询信息以重构状态，其中 `d` 是特征向量的维度。

    2. 核矩阵计算 – 点积评估在核矩阵计算中起主要作用。因此，如果我们在量子公式中获得点积评估的加速优势，则意味着核矩阵计算的整体加速增益。在 \[35\]
    中，作者讨论了在量子特性的帮助下更快地进行点积计算的方法。此外，归一化核矩阵 `K^(-1)` 的逆的指数化在量子范式中执行。如我们之前讨论的， `QRAM`
    只需 `O(log[2] d)` 步即可查询以重构状态，因此使用 `QRAM` 的单个点积需要 `O(ϵ^(-1) log[2] d)` 步，其中 `ϵ`
    是精度。

    3. 最小二乘公式 – 在训练阶段，由于在非稀疏密度矩阵 \[35\] 中指数更快本征向量公式的量子力学实现、稀疏矩阵模拟 \[45\] 以及矩阵求逆算法
    \[35\]，加速增益是可能的。

    least square `SVM` 表示为以下公式：

    ```

    (4.24)$\widehat{F}(\left| {b,\ \overrightarrow{\alpha}\rangle) =} \right|\overrightarrow{y}\rangle,\
    \widehat{F} = \begin{bmatrix} 0 & 1^{T} \\ 1 & {K + \gamma^{- 1}I} \\ \end{bmatrix},$

    ```

    其中 `\widehat{F} = \frac{F}{trF}` 是归一化的 `F`，而 `trF` 是 `F` 的迹。目标是求解优化问题 `F̂(|b,
    α⃗⟩)=|y⃗⟩`，以获得参数 `b` 和 `α⃗`。这里， `K` 是核矩阵。


    ### 4.5.2 量子多类支持向量机

    `SVM` 是二分类算法。要处理多类分类，我们使用 `one-against-all` 和 `all-pair` 算法。量子多类支持向量机 (`SVM`)
    是量子二值 `SVM` 的广义版本。在 \[23\] 中，作者讨论了两种技术： `one-against-all` 的量子版本以及 `all-pair` 算法的量子版本。在
    `one-against-all` 中，我们首先构建并训练 `k` 个二分类器，然后这些分类器各自对给定的未知输入进行分类。对应分类器的概率置信度得分最高的类别被选为预测类别。在
    `all-pair` 中，我们构建 `k(k-1)/2` 个分类器。每个分类器使用包含一个主要类别数据和另一个类别的其余数据的数据集进行训练，即我们制作成对数据集并训练分类器，从而得到
    `k(k-1)/2` 个总分类器。当需要预测未知输入时，这全部 `k(k-1)/2` 个分类器预测给定输入的类别，并通过应用投票机制选择要预测的类别。以下算法展示了这两种方法的量子版本，详细解释请参阅
    \[22, 23\]。


    #### 算法 2：

    `Quantum One-Against-All Algorithm`

    '
