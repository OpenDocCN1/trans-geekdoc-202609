    ### 5.8.3 工作仿真


    `Python` 环境用于执行实验过程。实验在四张伯克利图像上进行，其中两张尺寸为 80 × 120，另外两张尺寸为 120 × 80，以及两张真实生活图像，尺寸为
    512 × 512。开发环境由 Windows 7 组成，配置为 DELL Intel(R) Core(TM) i3、2.00 GHz 和 4.00 GB
    RAM。


    所建议方法相对于其经典对应方法的效率取决于计算得到的适应度均值、标准差、标准误差和最小计算时间得以证明。此外，通过执行 `t-test`（统计优越性检验）证明了量子启发算法相对于其经典算法的能力。所有算法（`QIGA`、`CGA`、`QIBA`
    和 `CBA`）的最优聚类数（`𝒪_𝒩[𝒞]`）及其相关最优适应度值（`𝒪_ℱ[𝒯]`）已在 表 5.1 中报告。所有算法（`QIGA`、`CGA`、`QIBA`
    和 `CBA`）的最优执行时间（`𝒪_𝒯[ℰ]`）以秒为单位显示在 表 5.2 中。算法 `QIGA` 和 `CGA` 的适应度均值（`ℱ[*μ*]`）、标准差（`ℱ[*σ*]`）和标准误差（`𝒮[ℰ]`）已在
    表 5.3 中展示，算法 `QIBA` 和 `CBA` 的相同指标已在 表 5.4 中展示。最后，`t-test` 的结果 [37] 已在 表 5.5 中呈现，该检验以
    95% 置信水平进行。在检验过程中，会检查 `𝒫-value`。如果它小于 0.05，则原假设被认为应被拒绝而支持备择假设。最后，对参与的方法进行了 Friedman
    检验 [38, 39]，并列于 表 5.6 中。所提出算法 `QIGA`、`CGA`、`QIBA` 和 `CBA` 获得的排名分别为 2.66、3.91、1.08
    和 2.33。根据排名值，`QIBA` 可被视为优越的算法，因为它具有最小的排名值。


