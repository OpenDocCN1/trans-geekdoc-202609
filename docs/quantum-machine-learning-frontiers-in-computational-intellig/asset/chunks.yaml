    \ evolved efficient searching techniques in the quantum domain. These searching\
    \ techniques outperform the classical techniques both in terms of time and space.\
    \ Inspired by this, researchers are on the spree for conjoining the existing soft\
    \ computing tools with the quantum computing paradigm to evolve more robust and\
    \ time efficient intelligent algorithms. The resultant algorithms are immensely\
    \ useful for solving several scientific and engineering problems, which includes\
    \ data processing and analysis, machine vision, social networks, big data analytics,\
    \ flow shop scheduling problems to name a few.\n\nQuantum machine learning is\
    \ an emerging interdisciplinary research area which resorts to the principles\
    \ of quantum physics applied to machine learning. Quantum machine learning algorithms\
    \ helps to improve classical methods of machine learning by taking the advantages\
    \ offered by quantum computation. Given the inherent parallelism offered due to\
    \ the features of quantum computing, researchers have evolved different intelligent\
    \ tools and techniques which are more robust and efficient in performance.\n\n\
    Quantum-enhanced machine learning refers to quantum algorithms that solve tasks\
    \ in machine learning, thereby improving a classical machine learning method.\
    \ Such algorithms typically require one to encode the given classical dataset\
    \ into a quantum computer, so as to make it accessible for quantum information\
    \ processing. After this, quantum information processing routines can be applied\
    \ and the result of the quantum computation is read out by measuring the quantum\
    \ system. For example, the outcome of the measurement of a qubit could reveal\
