  fmt: '

    We have |*v*[*j*]⟩ ∈ ℋ, the basis vectors for the 𝒩(`T`) subspace of the domain,
    which has dimension *n*[*o*] = *n* − *m*. Let {|*w*[*j*] ⟩ |*j*=1,…,*n*[*o*]}
    be any basis for ℋ(`Ω`^′)^⊥, the orthogonal complement of ℋ(`Ω`^′) in ℋ^′, which
    also has dimension *n* − *m*. We define `N` ∈ ℒ(ℋ, ℋ^′) to map the null space
    components down to this *n[o]*-dimensional subspace:


    (2.12)

    ```

    N\overset{def}{=}\sum\limits_{j = 1}^{n_{o}}|w_{j}\rangle\langle v_{j}|.

    ```


    Since there is a one-one correspondence between basis vectors |*u*[*i*]⟩ and output
    vectors |*y*[*i*]⟩, we implement the function `f` by an operator `M` ∈ ℒ(ℋ, ℋ^′)
    defined:


    (2.13)

    ```

    M\overset{def}{=}\sum\limits_{i = 1}^{m}|y_{i}\rangle\langle u_{i}|.

    ```


    This maps the *n*-dimensional input into an *m*-dimensional output subspace. As
    a result the operator


    (2.14)

    ```

    T = M + N ∈ ℒ(ℋ, ℋ^′)

    ```

    maps an input |*x*⟩ to the correct output |*f*(*x*)⟩, but with a scale factor
    and additional “garbage.” Specifically, for *x[j]* ∈ *f* ^(−1){*y[i]*},


    (2.15)

    ```

    T|x[j]⟩ = (M+N)|x[j]⟩ = M|x[j]⟩ + N|x[j]⟩ = n[i]^(−1/2)|y[i]⟩ + |γ[j]⟩.

    ```

    where |*γ*[*j*]⟩ = `N`|*x*[*j*]⟩ and ‖|γ_j⟩‖ = sqrt((n_i - 1)/n_i). Note that
    the garbage |*γ*[*j*]⟩ is superimposed on the desired output. Subsequent computations
    operate on the ℋ(`Ω`^′) subspace and ignore the orthogonal subspace, which contains
    the garbage (which nevertheless must be retained, since it is entangled with the
    computational results).


    The `T` operator is just a transformation from the {|*x*[1]⟩,…,|*x*[*n*]⟩} basis
    to the {|*y*[1]⟩,…,|*y*[*m*]⟩,|*w*[1]⟩,…,|*w*[*n* − *m*]⟩} basis, and is obviously
    unitary:


    ```

    (M+N)†(M+N) = M†M + N†M + M†N + N†N = I[𝒩(T)⊥] + 0 + 0 + I[𝒩(T)] = I[ℋ],

    (M+N)(M+N)† = MM† + NM† + MN† + NN† = I[ℋ(Ω′)] + 0 + 0 + I[ℋ(Ω′)⊥] = I[ℋ′].

    ```


    Since the `T` operator is unitary, it can be approximated arbitrarily closely
    by a combination of `H` (Hadamard), `CNOT` (conditional NOT), and `T` (π/8) gates
    [[1]], §4.5, or any other universal set of quantum gates.


    Unfortunately, the output vectors |*y*[*i*]⟩ have amplitudes that depend on their
    preimage multiplicities. That is, if *y*[*i*] = `f`(*x*[*j*]), then `T`|*x*[*j*]⟩
    = *n*[*i*]^(−1/2)|*y*[*i*]⟩ + |*γ*[*j*]⟩, and we get different scale factors *n*[*i*]^(−1/2)
    depending on the preimage multiplicity. For *y*[*i*] = `f`(*x*[*j*]), we define
    s_i ≜ n_i^{-1/2} to be this scale factor so that `T`|*x*[*i*]⟩ = s[*i*]|*y*[*i*]⟩
    + |*γ*[*j*]⟩. We would like to equalize the differing amplitudes but there does
    not seem to be a unitary means for doing so.


    It might seem that something like a `Grover` iteration [[16]] could be used to
    rotate the state vector from s[*i*]|*y*[*i*]⟩+|*γ*[*j*]⟩ to |*y*[*i*]⟩, but different
    s[*i*] require different numbers of iterations. Something like Grover’s algorithm
    with an unknown number of solutions could be used, but this would require trying
    multiple rotations. Therefore, it seems better to accept the unwanted scale factors
    and work with them. This means that any |*y*[*i*]⟩ with positive amplitudes are
    considered outputs from the computation, and therefore all positive amplitudes
    are treated the same.


    If we ignore the relative magnitudes of positive amplitudes, then a quantum state
    |*ψ*⟩ = ∑[*j*]*p*[*j*]|*x*[*j*]⟩ (with *p*[*j*] ≥ 0) can be interpreted as representing
    the set of all *x*[*j*] with positive amplitudes: {*x*[*j*]∈`Ω` | *p*[*j*]>0},
    where we assume of course that ∑[*j*]*p*[*j*]² ≤ 1. Moreover, the sum can be strictly
    less than one only if there are additional ancillary states that make up the difference
    (like |*γ*[*j*]⟩ in the previous example). Applying `T` to such a state computes
    a state representing the image of the input set. That is, `T`|*ψ*⟩ = ∑[*j*]*p*[*j*]*s*[*j*]|*f*(*x*[*j*])⟩,
    which represents the set {*f*(*x*[*j*])∈`Ω`|*p*[*j*]>0}. If `S` ⊆ `Ω` is the set
    represented by |*ψ*⟩, then `T` |*ψ*⟩ represents its image `f`[*S*]. Since zero
    amplitudes will always map to zero amplitudes and positive amplitudes will map
    to positive amplitudes, set membership will be appropriately mapped from the domain
    to the codomain. The preceding construction gives us:


    ### Proposition 3


    Let `Ω` = {*x*[1],…,*x*[*n*]} and `Ω`′ = {*y*[1],…,*y*[*m*]} be finite sets with
    *n* ≥ *m*. Suppose {|*x*[1]⟩,…,|*x*[*n*]⟩} is an ON basis for a Hilbert space
    ℋ and {|*y*[1]⟩,…,|*y*[*m*]⟩} is an ON basis for a subspace ℋ(`Ω`′) of ℋ. For
    any surjective function `f`: `Ω`↠`Ω`′ there is a unitary operator `T` ∈ ℒ(ℋ, ℋ)
    such that for any *x* ∈ `Ω`,


    (2.16)

    ```

    T|x⟩ = 1/√(n_x) |f(x)⟩ + |γ⟩,

    ```

    where *n*[*x*] = |*f*^(−1){*f*(*x*)}|, |*γ*⟩ ∈ ℋ(`Ω`′)^⊥, and ‖|γ⟩‖ = sqrt((n_x
    - 1)/n_x).


    #### Proof


    As previously shown [[eqs. (2.12)–(2.14)]], this operator is given explicitly
    by


    ```

    T = Σ_{i=1}^{m} |y_i⟩⟨u_i| + Σ_{k=1}^{n-m} |w_k⟩⟨v_k|,

    ```

    where |u_i⟩ ≜ 1/√(n_i) Σ_{x_j ∈ f^{-1}{y_i}} |x_j⟩, *n*[*i*] = |*f*^(−1){*y*[*i*]}|,
