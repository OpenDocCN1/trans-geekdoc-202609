- raw: "GAS corresponds to the weaker version of Pure Adaptive search as it cannot\
    \ be guaranteed that after application of Grover Search, an strictly better solution\
    \ would be found. It can be argued that Grover Search can return an objective\
    \ function value, which is less than the threshold and so it does not corresponds\
    \ to Pure Adaptive Search Framework, but, in such a case, the inferior value would\
    \ be discarded and the current threshold would be treated as the output of the\
    \ algorithm for the particular iteration. Thus, the overall GAS corresponds to\
    \ weaker version of Pure Adaptive Search.\n\nAn important design decision of Grover’s\
    \ Adaptive Search is determination of the rotation count sequence. It is possible\
    \ to determine the optimal rotation count ‘r’ for every iteration of the GAS provided\
    \ the information regarding improving fraction ‘P’ of the domain is available.\
    \ Thus, if the optimal rotation count is used for every run of Grover’s Search,\
    \ then a better (improved) solution will almost certainly be found in every iteration\
    \ of the GAS. However, in real world problems, the improving fraction *P* is often\
    \ unknown. An estimate of the improving fraction P can always be made by using\
    \ all the information available at the end of an iteration and considering the\
    \ nature of the problem. That is a Bayesian approach can be applied by tracking\
    \ the improving fraction at every iteration through the sequence of posterior\
    \ distributions, which will be subsequently used for choosing rotation count at\
    \ the particular iteration. However, this kind of approach might be very complicated\
    \ and cumbersome \\[[56](#bodymatter-003.xhtml#b_9783110670707-003_ref_056)\\\
    ]. Thus, other methods have been devised to strike a balance between ease of implementation\
    \ and optimality of rotation count selection, which includes method based on Boyer\
    \ et al. \\[[48](#bodymatter-003.xhtml#b_9783110670707-003_ref_048)\\] used by\
    \ Durr and Hoyer illustrated in \\[[50](#bodymatter-003.xhtml#b_9783110670707-003_ref_050)\\\
    ].\n\nAnother method proposed by Baritompa et al. is based on maximizing the benefit\
    \ to cost ratio denoted by parameter b in the heuristic \\[[52](#bodymatter-003.xhtml#b_9783110670707-003_ref_052)\\\
    ]. The benefit has been taken to be the expected decrease in the improving fraction\
    \ of the domain, which is difficult to ascertain without knowing the nature of\
    \ the problem being solved. The cost is dependent on the rotation count. The pseudo\
    \ code for heuristic is as follows:\n\n1.  Initialize *u*[0](*Ω*)  = *Ω* // u[0]\
    \ is a polynomial\n\n2.  For *i*\\= 1, 2, …, do: // Generating rotation count\
    \ r for ith iteration\n\n    1.  *E*[*u**i*] = 1 − ∫[0]¹*u*[*i*](*Ω*)*d**Ω*\n\n\
    \    2.  *β*\\= 0\n\n    3.  For *r*\\= 0, 1, … , until *E*[*u**i*]/(*r*+ 1) < 2*β*,\
    \ do:\n\n        1.  $v\\\\left( \\\\Omega \\\\right) = u\\_{i}\\\\left( \\\\\
    Omega \\\\right) + \\\\Omega\\\\int\\_{\\\\Omega}^{1}\\\\frac{g\\_{r}\\\\left(\
    \ P \\\\right)}{P}du\\_{i}\\\\left( P \\\\right)\\\\ //g\\_{r}(P) = sin^{2}((2r\
    \ + 1)sin^{- 1}\\\\sqrt{}P)$\n\n        2.  *E*[*v*] = 1 − ∫[0]¹*v*(*Ω*)*d**Ω*\n\
    \n        3.  $b = \\\\frac{\\\\left( {E\\_{ui} - E\\_{v}} \\\\right)}{r + 1}$\n\
    \n        4.  If *b* > *β*, then\n\n            1.  ȓ = *r*\n\n            2.\
    \  *β* = *b*\n\n            3.  *u*[*i* + 1](*Ω*) = *v*(*Ω*)\n\n    4.  Output\
    \ ȓ\n\nThe sequence of rotation counts produced by the heuristic is independent\
    \ of the particular optimization problem and is as follows for first 33 entries\
    \ \\[[52](#bodymatter-003.xhtml#b_9783110670707-003_ref_052)\\]:\n\n**0,** **0,\
    \ 0, 1, 1, 0, 1, 1, 2, 1, 2, 3, 1, 4, 5, 1, 6, 2, 7, 9, 11, 13, 16, 5, 20, 24,\
    \ 28, 34, 2, 41, 49, 4, 60*, … .***\n\nRecently, the above heuristic method has\
    \ been further studied and improved by Liu and Koehler \\[[56](#bodymatter-003.xhtml#b_9783110670707-003_ref_056)\\\
    ]. One improvement has been to simplify the calculations involved in computing\
    \ distributions by employing Chebyshev polynomials, which considerably reduced\
    \ the computation time. The other improvement has been to convert the above heuristic\
    \ into a dynamic one, which takes into account whether the Grover search in a\
    \ particular iteration was successful or not. This has been made possible by using\
    \ Bayes Law to update the distribution after one complete round of Grover Search\
    \ depending on success or failure of finding a better solution. The heuristic\
    \ for computing dynamic rotation schedule is as follows:\n\n1.  Initialize *u*[0](*Ω*)  = *Ω*\n\
    \n2.  For *i*\\= 1, 2, …, do: // Generating rotation count r for ith iteration\n\
    \n    1.  $E\\_{ui} = 1 - \\\\int\\\\limits\\_{0}^{1}u\\_{i}\\\\left( \\\\Omega\
    \ \\\\right)d\\\\Omega$\n\n    2.  *β*\\= 0\n\n    3.  For *r*\\= 0, 1, … , until\
    \ *E*[*u**i*]/(*r*+ 1) < 2*β*, do:\n\n        1.  $b = \\\\int\\\\limits\\_{0}^{1}Pg\\\
    _{r}\\\\left( P \\\\right)du\\_{i}\\\\left( P \\\\right)$\n\n        2.  If *b* > *β*,\
    \ then\n\n            1.  $\\\\overset{\\\\frown}{r} = \\\\, r$\n\n          \
    \  2.  *β* = *b*\n\n    4.  Output ȓ\n\n    5.  If (Search\\_outcome = Success)\n\
    \n         $u\\_{i + 1}\\\\left( \\\\Omega \\\\right) = {}\\\\frac{\\\\int\\_{0}^{y}g\\\
    _{r}\\\\left( P \\\\right)du\\_{i}\\\\left( P \\\\right) + \\\\!\\\\int\\_{y}^{1}\\\
    \\frac{y}{P}g\\_{r}\\\\left( P \\\\right)du\\_{i}\\\\left( P \\\\right)}{\\\\\
    int\\_{0}^{1}g\\_{r}\\\\left( P \\\\right)du\\_{c}\\\\left( P \\\\right)}$ \n\n\
    \        Else\n\n        $u\\_{i + 1}\\\\left( {y\\\\Omega} \\\\right) = {}\\\\\
    frac{u\\_{i}\\\\left( \\\\Omega \\\\right) - \\\\!\\\\int\\_{0}^{y}g\\_{r}\\\\\
    left( P \\\\right)du\\_{i}\\\\left( P \\\\right)}{1 - \\\\!\\\\int\\_{0}^{1}g\\\
    _{r}\\\\left( P \\\\right)du\\_{c}\\\\left( P \\\\right)}$ \n\nLiu and Koehler\
    \ have reported that formal derivation of the expected time required by the proposals,\
    \ made by Durr and Hoyer \\[[50](#bodymatter-003.xhtml#b_9783110670707-003_ref_050)\\\
    ] (based on Boyer et al. algorithm \\[[48](#bodymatter-003.xhtml#b_9783110670707-003_ref_048)\\\
    ]), Baritompa et al. \\[[52](#bodymatter-003.xhtml#b_9783110670707-003_ref_052)\\\
    ] and their own improved and dynamic version \\[[56](#bodymatter-003.xhtml#b_9783110670707-003_ref_056)\\\
    ] of quantum algorithms for global optimization, is hard to derive. This is because\
    \ the basic subroutine employed for searching needs knowledge of the distribution\
    \ function of the improving fraction. Therefore, numerical simulations have been\
    \ used to compare the methods. However, such simulation studies are computationally\
    \ very expensive as they require digital computer to simulate a quantum computer.\
    \ Thus, the performance of such algorithms could be investigated on only problems\
    \ of small size, which have not much practical significance.\n\nThis chapter identifies\
    \ that basic problem in the above global optimization algorithms is due to the\
    \ dependence of basic search subroutine on the improving fraction to determine\
    \ the rotation count in a particular iteration. This problem can be solved by\
    \ changing quantum computation model from quantum circuit model to Adiabatic Quantum\
    \ Computation (AQC) model.\n\nAQC provides a distinct advantage over quantum circuit\
    \ model on Grover’s Search i.e. it eliminates the problem of overshooting. This\
    \ is possible because the solution is encoded as the ground state of the Problem\
    \ Hamiltonian, therefore, even if the system is evolved for time period longer\
    \ than required, the system remains in the ground state of the problem Hamiltonian.\
    \ This feature of AQC makes it possible to formally derive the expected running\
    \ time of Global Optimization Algorithm based on AQC.\n\n## 3.5 Problem formulation\n\
    \nOptimization problems that are regularly solved in machine learning and engineering\
    \ domain are mostly in continuous domain. Such problems are classified as unconstrained\
    \ and constrained global optimization problems. The unconstrained global optimization\
    \ problems (UCOP) in continuous variables are generally formulated as follows:\n\
    \nOptimize f(x) where x = (x[1], x[2], ...., x[E]) *ε* *R*^(*E*),\n\n(3.13)$\\\
    \\begin{matrix} & {Such\\\\, that:} \\\\\\\\ & {x\\_{il} < x\\_{i} < x\\_{iu}{;\\\
    \\, where}\\\\ x\\_{i}{\\\\ {is\\\\, the}}\\\\ i^{th}\\\\ {variable\\\\ with}\\\
    \\, x\\_{il}\\\\,{and}\\\\, x\\_{iu}\\\\;{as\\\\ its\\\\ lower\\\\ and\\\\ upper\\\
    \\ limits}.} \\\\\\\\ \\\\end{matrix}$ "
  fmt: "\n## Grover's Adaptive Search\n`GAS` corresponds to the weaker version of\
    \ `Pure Adaptive Search` as it cannot be guaranteed that after application of\
    \ `Grover Search`, an strictly better solution would be found. It can be argued\
    \ that `Grover Search` can return an objective function value, which is less than\
    \ the threshold and so it does not corresponds to `Pure Adaptive Search Framework`,\
    \ but, in such a case, the inferior value would be discarded and the current threshold\
    \ would be treated as the output of the algorithm for the particular iteration.\
    \ Thus, the overall `GAS` corresponds to weaker version of `Pure Adaptive Search`.\n\
    \n### Rotation Count Sequence\nAn important design decision of `Grover's Adaptive\
    \ Search` is determination of the rotation count sequence. It is possible to determine\
    \ the optimal rotation count `r` for every iteration of the `GAS` provided the\
    \ information regarding improving fraction `P` of the domain is available. Thus,\
    \ if the optimal rotation count is used for every run of `Grover's Search`, then\
    \ a better (improved) solution will almost certainly be found in every iteration\
    \ of the `GAS`. However, in real world problems, the improving fraction `P` is\
    \ often unknown. An estimate of the improving fraction `P` can always be made\
    \ by using all the information available at the end of an iteration and considering\
    \ the nature of the problem. That is a Bayesian approach can be applied by tracking\
    \ the improving fraction at every iteration through the sequence of posterior\
    \ distributions, which will be subsequently used for choosing rotation count at\
    \ the particular iteration. However, this kind of approach might be very complicated\
    \ and cumbersome [[56](#bodymatter-003.xhtml#b_9783110670707-003_ref_056)]. Thus,\
    \ other methods have been devised to strike a balance between ease of implementation\
    \ and optimality of rotation count selection, which includes method based on Boyer\
    \ et al. [[48](#bodymatter-003.xhtml#b_9783110670707-003_ref_048)] used by Durr\
    \ and Hoyer illustrated in [[50](#bodymatter-003.xhtml#b_9783110670707-003_ref_050)].\n\
    \n### Benefit-to-Cost Heuristic\nAnother method proposed by Baritompa et al. is\
    \ based on maximizing the benefit to cost ratio denoted by parameter `b` in the\
    \ heuristic [[52](#bodymatter-003.xhtml#b_9783110670707-003_ref_052)]. The benefit\
    \ has been taken to be the expected decrease in the improving fraction of the\
    \ domain, which is difficult to ascertain without knowing the nature of the problem\
    \ being solved. The cost is dependent on the rotation count. The pseudo code for\
    \ heuristic is as follows:\n```\n1. Initialize u[0](Ω) = Ω // u[0] is a polynomial\n\
    2. For i = 1, 2, …, do: // Generating rotation count r for ith iteration\n   1.\
    \ E[u_i] = 1 − ∫[0]¹ u[i](Ω) dΩ\n   2. β = 0\n   3. For r = 0, 1, … , until E[u_i]/(r+1)\
    \ < 2β, do:\n      1. v(Ω) = u_i(Ω) + Ω ∫_Ω^1 g_r(P)/P du_i(P) // g_r(P) = sin²((2r\
    \ + 1) sin⁻¹√P)\n      2. E[v] = 1 − ∫[0]¹ v(Ω) dΩ\n      3. b = (E_ui - E_v)/(r\
    \ + 1)\n      4. If b > β, then\n         1. ȓ = r\n         2. β = b\n      \
    \   3. u[i+1](Ω) = v(Ω)\n   4. Output ȓ\n```\nThe sequence of rotation counts\
    \ produced by the heuristic is independent of the particular optimization problem\
    \ and is as follows for first 33 entries [[52](#bodymatter-003.xhtml#b_9783110670707-003_ref_052)]:\n\
    `0, 0, 0, 1, 1, 0, 1, 1, 2, 1, 2, 3, 1, 4, 5, 1, 6, 2, 7, 9, 11, 13, 16, 5, 20,\
    \ 24, 28, 34, 2, 41, 49, 4, 60, …`.\n\n### Dynamic Rotation Schedule\nRecently,\
    \ the above heuristic method has been further studied and improved by Liu and\
    \ Koehler [[56](#bodymatter-003.xhtml#b_9783110670707-003_ref_056)]. One improvement\
    \ has been to simplify the calculations involved in computing distributions by\
    \ employing Chebyshev polynomials, which considerably reduced the computation\
    \ time. The other improvement has been to convert the above heuristic into a dynamic\
    \ one, which takes into account whether the Grover search in a particular iteration\
    \ was successful or not. This has been made possible by using Bayes Law to update\
    \ the distribution after one complete round of Grover Search depending on success\
    \ or failure of finding a better solution. The heuristic for computing dynamic\
    \ rotation schedule is as follows:\n```\n1. Initialize u[0](Ω) = Ω\n2. For i =\
    \ 1, 2, …, do: // Generating rotation count r for ith iteration\n   1. E_ui =\
    \ 1 - ∫_0^1 u_i(Ω) dΩ\n   2. β = 0\n   3. For r = 0, 1, … , until E[u_i]/(r+1)\
    \ < 2β, do:\n      1. b = ∫_0^1 P g_r(P) du_i(P)\n      2. If b > β, then\n  \
    \       1. ȓ = r\n         2. β = b\n   4. Output ȓ\n   5. If Search_outcome =\
    \ Success\n      u_{i+1}(Ω) = [∫_0^y g_r(P) du_i(P) + ∫_y^1 y/P g_r(P) du_i(P)]\
    \ / ∫_0^1 g_r(P) du_c(P)\n      Else\n      u_{i+1}(yΩ) = [u_i(Ω) - ∫_0^y g_r(P)\
    \ du_i(P)] / [1 - ∫_0^1 g_r(P) du_c(P)]\n```\nLiu and Koehler have reported that\
    \ formal derivation of the expected time required by the proposals, made by Durr\
    \ and Hoyer [[50](#bodymatter-003.xhtml#b_9783110670707-003_ref_050)] (based on\
    \ Boyer et al. algorithm [[48](#bodymatter-003.xhtml#b_9783110670707-003_ref_048)]),\
    \ Baritompa et al. [[52](#bodymatter-003.xhtml#b_9783110670707-003_ref_052)] and\
    \ their own improved and dynamic version [[56](#bodymatter-003.xhtml#b_9783110670707-003_ref_056)]\
    \ of quantum algorithms for global optimization, is hard to derive. This is because\
    \ the basic subroutine employed for searching needs knowledge of the distribution\
    \ function of the improving fraction. Therefore, numerical simulations have been\
    \ used to compare the methods. However, such simulation studies are computationally\
    \ very expensive as they require digital computer to simulate a quantum computer.\
    \ Thus, the performance of such algorithms could be investigated on only problems\
    \ of small size, which have not much practical significance.\n\nThis chapter identifies\
    \ that basic problem in the above global optimization algorithms is due to the\
    \ dependence of basic search subroutine on the improving fraction to determine\
    \ the rotation count in a particular iteration. This problem can be solved by\
    \ changing quantum computation model from quantum circuit model to Adiabatic Quantum\
    \ Computation (`AQC`) model.\n\n`AQC` provides a distinct advantage over quantum\
    \ circuit model on Grover's Search i.e. it eliminates the problem of overshooting.\
    \ This is possible because the solution is encoded as the ground state of the\
    \ Problem Hamiltonian, therefore, even if the system is evolved for time period\
    \ longer than required, the system remains in the ground state of the problem\
    \ Hamiltonian. This feature of `AQC` makes it possible to formally derive the\
    \ expected running time of Global Optimization Algorithm based on `AQC`.\n\n##\
    \ 3.5 Problem formulation\nOptimization problems that are regularly solved in\
    \ machine learning and engineering domain are mostly in continuous domain. Such\
    \ problems are classified as unconstrained and constrained global optimization\
    \ problems. The unconstrained global optimization problems (`UCOP`) in continuous\
    \ variables are generally formulated as follows:\nOptimize `f(x)` where `x` =\
    \ (`x[1]`, `x[2]`, ...., `x[E]`) ε `R^(E)`,\n(3.13)\n```\n\\begin{matrix}\n  &\
    \ {Such\\, that:} \\\\\n  & {x_{il} < x_i < x_{iu};\\, where} \\\\\n  x_i{ is\
    \ the} \\\\\n  i^{th} {variable with} \\, x_{il} \\,{and} \\, x_{iu} \\\\\n  {as\
    \ its lower and upper limits}. \\\\\n\\end{matrix}\n```\n"
  trans: "\n## Grover 自适应搜索\n`GAS` 对应于 `Pure Adaptive Search` 的较弱版本，因为在应用 `Grover\
    \ Search` 之后无法保证能找到严格更好的解。可以认为 `Grover Search` 可能返回一个小于阈值的目标函数值，因此它并不对应于 `Pure\
    \ Adaptive Search Framework`，但在这种情况下，较差的值将被丢弃，并且当前阈值将被视为该迭代中算法的输出。因此，整体的 `GAS`\
    \ 对应于 `Pure Adaptive Search` 的较弱版本。\n\n### 旋转次数序列\n`Grover's Adaptive Search`\
    \ 的一个重要设计决策是旋转次数序列的确定。只要有关于域的改进分数 `P` 的信息，就有可能为 `GAS` 的每次迭代确定最佳旋转次数 `r`。因此，如果在\
    \ `Grover's Search` 的每次运行中都使用最佳旋转次数，那么在 `GAS` 的每次迭代中几乎肯定会找到更好的（改进的）解。然而，在实际问题中，改进分数\
    \ `P` 通常是未知的。通过利用迭代结束时可获得的所有信息并考虑问题的性质，始终可以对改进分数 `P` 进行估计。也就是说，可以通过在每次迭代中跟踪改进分数的后验分布序列来应用贝叶斯方法，该序列随后将用于在特定迭代中选择旋转次数。然而，这种方法可能非常复杂且繁琐\
    \ [56]。因此，已经设计了其他方法来在实现简易性和旋转次数选择的优化性之间取得平衡，其中包括基于 Boyer 等人 [48] 的方法，由 Durr 和\
    \ Hoyer 使用并在 [50] 中说明。\n\n### 收益-成本启发式\nBaritompa 等人提出的另一种方法基于最大化启发式中参数 `b` 表示的收益成本比\
    \ [52]。收益被认为是域的改进分数的预期减少，这在不知道所解决问题的性质的情况下难以确定。成本取决于旋转次数。启发式的伪代码如下：\n```\n1. Initialize\
    \ u0 = Ω // u[0] is a polynomial\n2. For i = 1, 2, …, do: // Generating rotation\
    \ count r for ith iteration\n   1. E[u_i] = 1 − ∫[0]¹ ui dΩ\n   2. β = 0\n   3.\
    \ For r = 0, 1, … , until E[u_i]/(r+1) < 2β, do:\n      1. v(Ω) = u_i(Ω) + Ω ∫_Ω¹\
    \ g_r(P)/P du_i(P) // g_r(P) = sin²((2r + 1) sin⁻¹√P)\n      2. E[v] = 1 − ∫[0]¹\
    \ v(Ω) dΩ\n      3. b = (E_ui - E_v)/(r + 1)\n      4. If b > β, then\n      \
    \   1. ȓ = r\n         2. β = b\n         3. ui+1 = v(Ω)\n   4. Output ȓ\n```\n\
    该启发式产生的旋转次数序列与特定的优化问题无关，前 33 个条目如下 [52]：\n`0, 0, 0, 1, 1, 0, 1, 1, 2, 1, 2, 3,\
    \ 1, 4, 5, 1, 6, 2, 7, 9, 11, 13, 16, 5, 20, 24, 28, 34, 2, 41, 49, 4, 60, …`.\n\
    \n### 动态旋转计划\n最近，上述启发式方法已被 Liu 和 Koehler 进一步研究和改进 [56]。一项改进是采用 Chebyshev 多项式来简化计算分布时涉及的计算，从而大大减少了计算时间。另一项改进是将上述启发式转换为动态启发式，该启发式考虑了特定迭代中\
    \ Grover 搜索是否成功。这是通过使用贝叶斯定律根据找到更好解的成功或失败来更新一次完整的 Grover 搜索后的分布而实现的。计算动态旋转计划的启发式如下：\n\
    ```\n1. Initialize u0 = Ω\n2. For i = 1, 2, …, do: // Generating rotation count\
    \ r for ith iteration\n   1. E_ui = 1 - ∫_0¹ u_i(Ω) dΩ\n   2. β = 0\n   3. For\
    \ r = 0, 1, … , until E[u_i]/(r+1) < 2β, do:\n      1. b = ∫_0¹ P g_r(P) du_i(P)\n\
    \      2. If b > β, then\n         1. ȓ = r\n         2. β = b\n   4. Output ȓ\n\
    \   5. If Search_outcome = Success\n      u_{i+1}(Ω) = [∫_0^y g_r(P) du_i(P) +\
    \ ∫_y¹ y/P g_r(P) du_i(P)] / ∫_0¹ g_r(P) du_c(P)\n      Else\n      u_{i+1}(yΩ)\
    \ = [u_i(Ω) - ∫_0^y g_r(P) du_i(P)] / [1 - ∫_0¹ g_r(P) du_c(P)]\n```\nLiu 和 Koehler\
    \ 报告称，由 Durr 和 Hoyer [50]（基于 Boyer 等人算法 [48]）、Baritompa 等人 [52] 及其改进的动态版本 [56]\
    \ 的用于全局优化的量子算法提案所需预期时间的正式推导是困难的。这是由于用于搜索的基本子程序需要了解改进分数的分布函数。因此，已使用数值模拟来比较这些方法。然而，这样的模拟研究在计算上非常昂贵，因为它们需要数字计算机来模拟量子计算机。因此，这类算法的性能只能在规模很小的问题上进行研究，这些问题没有多大实际意义。\n\
    \n本章指出上述全局优化算法中的基本问题是由于基本搜索子程序依赖于改进分数来确定特定迭代中的旋转次数。这个问题可以通过将量子计算模型从量子电路模型更改为绝热量子计算\
    \ (`AQC`) 模型来解决。\n\n`AQC` 在 Grover 搜索方面比量子电路模型具有明显的优势，即它消除了过冲问题。这是可能的，因为解被编码为问题哈密顿量的基态，因此，即使系统演化的时间超过所需时间，系统仍保持在问题哈密顿量的基态。`AQC`\
    \ 的这一特性使得能够正式推导出基于 `AQC` 的全局优化算法的预期运行时间。\n\n## 3.5 问题表述\n在机器学习和工程领域中经常解决的优化问题大多在连续域中。这类问题被归类为无约束和有约束的全局优化问题。连续变量中的无约束全局优化问题\
    \ (`UCOP`) 通常表述如下：\n优化 `f(x)`，其中 `x` = (`x[1]`, `x[2]`, ...., `x[E]`) ε `R^(E)`，\n\
    (3.13)\n```\n\\begin{matrix}\n  & {Such\\, that:} \\\\\n  & {x_{il} < x_i < x_{iu};\\\
    , where} \\\\\n  x_i{ is the} \\\\\n  i^{th} {variable with} \\, x_{il} \\,{and}\
    \ \\, x_{iu} \\\\\n  {as its lower and upper limits}. \\\\\n\\end{matrix}\n```\n"
