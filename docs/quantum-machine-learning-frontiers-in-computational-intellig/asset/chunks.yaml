    We discuss a quantum-based process for dot product evaluation [[31](#bodymatter-004.xhtml#b_9783110670707-004_ref_031)]
    of two training inputs (normalized), ∥ `X⃗[i]`⟩ & ∥ `X⃗[j]`⟩ (in the quantum arrangement),
    in a linear kernel. For calculating a dot product of ∥ `X⃗[i]`⟩ & ∥ `X⃗[j]`⟩,
    at first, we generate two quantum states ∥ `ψ`⟩ and ∥ `ϕ`⟩ using an ancilla variable.
    Next, we estimate the squared norms sum of the two training inputs, say parameter
    `Z` = |`X⃗[i]`|² + |`X⃗[j]`|². At last, we execute a `swap test` to implement
    a projective measurement on the ancilla alone.


    Initially, by querying the `QRAM`, we construct a quantum state |`ψ`⟩:


    (4.20)$|\\psi\\rangle = \\frac{1}{\\sqrt{2}}\\left( {\\left| {0\\rangle} \\right|{\\overrightarrow{X}}\_{i}\\rangle
    + \\left| {1\\rangle} \\right|{\\overrightarrow{X}}\_{j}\\rangle} \\right)$


    Let us assume another quantum state:


    (4.21)$|\\xi\\rangle = \\left( {\\frac{1}{\\sqrt{2}}\\left( {\\left| {0\\rangle
    -} \\right|1\\rangle} \\right)\\; \\otimes \\;|0\\rangle} \\right)$


    We put on a unitary transformation [[32](#bodymatter-004.xhtml#b_9783110670707-004_ref_032)]
    `e`^( − `i` `H` `t`) to the state |`ξ`⟩, where `H` = ((∥ `X⃗[i]` ∥ |0⟩⟨0| + ∥
    `X⃗[j]` ∥ |1⟩⟨1|) ⊗ `σ[x]`) is a Hamiltonian. This outcomes the following state,


    (4.22)$\\begin{matrix} & \\left\\lbrack {\\frac{1}{\\sqrt{2}}\\left( {cos\\left(
    {{\\parallel {\\overrightarrow{X}}\_{i} \\parallel}t} \\right)\\left| {0\\rangle
    - cos\\left( {{\\parallel {\\overrightarrow{X}}\_{j} \\parallel}t} \\right)} \\right|1\\rangle}
    \\right) \\otimes |0\\rangle} \\right\\rbrack \\\\ & {\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,
    - \\left\\lbrack {\\frac{i}{\\sqrt{2}}\\left( {sin\\left( {{\\parallel {\\overrightarrow{X}}\_{i}
    \\parallel}t} \\right)\\left| {0\\rangle - sin\\left( {\\parallel {\\overrightarrow{X}}\_{j}
    \\parallel} \\right)} \\right|1\\rangle} \\right) \\otimes |1\\rangle} \\right\\rbrack}
    \\\\ \\end{matrix}$


    With an appropriate choice of `t`, we now measure the ancilla bit, where `X⃗[i]`
    `t`, `X⃗[j]` `t` ≪ 1, which outcomes in the state:


    (4.23)$|\\phi\\rangle = \\frac{1}{\\sqrt{\\left( {{\\parallel {\\overrightarrow{X}}\_{i}
    \\parallel}^{2} + {\\parallel {\\overrightarrow{X}}\_{j} \\parallel}^{2}} \\right)}}\\left(
    {{\\parallel {\\overrightarrow{X}}\_{i} \\parallel}\\left| {0\\rangle - {\\parallel
    {\\overrightarrow{X}}\_{j} \\parallel}} \\right|1\\rangle} \\right),$


    with probability $\\frac{1}{2}{\\lbrack{({{\\parallel {\\overrightarrow{X}}\_{i}
    \\parallel}^{2} + {\\parallel {\\overrightarrow{X}}\_{j} \\parallel}^{2}})t}\\rbrack^{2}}$.


    This sanctions the estimation of the squared norms sum of |`X⃗[i]` ⟩ & |`X⃗[j]`⟩.
    By applying `quantum counting`, we can estimate (∥ `X⃗[i]`∥² + ∥ `X⃗[j]`∥²) and
    generate the quantum state |`ϕ`⟩ with accuracy `ϵ`. The complexity will be `O`(`ϵ`^(
    − 1)). Using an ancilla alone, we then execute a `swap test` with states |`ψ`⟩
    & |`ϕ`⟩. If |`ψ`⟩ & |`ϕ`⟩ are equal then the measurement gives us a zero. Thus,
    the overall complexity in evaluating a single dot product of the training instances,
    considering the `QRAM` access [[30](#bodymatter-004.xhtml#b_9783110670707-004_ref_030)],
    estimating (∥ `X⃗[i]`∥² + ∥ `X⃗[j]`∥²), and fabricating the quantum state |`ϕ`⟩
    is `O`(`ϵ`^( − 1) `log` `N`).


    ### 4.3.4 The HHL algorithm


    Harrow, Hassidim, and Lloyd [[20](#bodymatter-004.xhtml#b_9783110670707-004_ref_020)]
    developed the `HHL` algorithm which quantum mechanically inverts a system of linear
    equations. This algorithm is one of the most significant and fundamental quantum
    algorithms, and the base for constructing many QML algorithms. The algorithm pursues
    to solve the system of equations `A` `x⃗` = `b⃗` in a quantum computer. Quantum
    mechanically it is represented as `A`|`x`⟩ = |`b`⟩, where `A` is a Hermitian matrix.
    `b⃗` is expressed as a quantum state |`b`⟩ = ∑[n] `b`[n] |`E`[n]⟩ over `log`[2]
    `N` qubits where `E`[n] is an eigenvector of `A` with eigenvalue `λ`[n] ≥ `Λ`,
    and `x⃗` is stated as |`x`⟩. The algorithm aims to solve |`x`⟩ = `A`^( − 1) |`b`⟩,
    where `A`^( − 1) is the inverse of the `A`. We then compute `λ`[n] by applying
    the `phase estimation`. By uncomputing the `phase-estimation` we get $\\sum\_{n}b\_{n}|E\_{n}\\rangle\\left(
    {\\frac{\\Lambda}{\\lambda\_{n}}|1\\rangle + \\sqrt{1 - \\frac{\\Lambda^{2}}{\\lambda\_{n}^{2}}}|0\\rangle}
    \\right)$, where $\\frac{\\Lambda}{\\lambda\_{n}}$ is the angle of arcsin through
    which an ancillary qubit is rotated. To succeed, we apply `O`(`||A||`/`Λ`) number
    of times the state preparation circuit after applying `amplitude amplification`.


    As compared to the classical counterpart, the algorithm claims exponential speed-up
    gain under certain problem statements. The algorithm takes `O`(( `log` `N`)²)
    quantum states to output, whereas it takes `O`(`N` `log` `N`) steps to output
    in a classical computer.


    ### 4.3.5 Quantum principal component analysis


    Principal component analysis (`PCA`) [[33](#bodymatter-004.xhtml#b_9783110670707-004_ref_033)]
    is a very important technique for dimensionality reduction. In a more formal way,
    we can define that `PCA` operates by diagonalizing the covariance matrix `C` =
    ∑[j] `v⃗` `v⃗`[j]^(`T`) of the data, where `T` is the transpose operation. The
    covariance matrix encapsulates the correlations between data’s different components.
    The covariance matrix in the form of eigenvectors and eigenvalues can be represented
    as `C` = ∑[k] `e`[k] `c⃗`[k] `c⃗`[k]^†, where `e`[k] are the eigenvalues correspond
    to the eigenvectors `c⃗`[k] of `C`. The few eigenvalues which are large as compared
    to the rests, are known as the principal components. Each of the principal components
    are then considered as the new feature vectors. The classical algorithm for `PCA`
    works in `O`(`d`²) runtime complexity, where `d` is the dimension of the Hilbert
    space. In quantum `PCA` [[33](#bodymatter-004.xhtml#b_9783110670707-004_ref_033)],
    a randomly chosen data vector is mapped into a quantum state using `QRAM` [[30](#bodymatter-004.xhtml#b_9783110670707-004_ref_030)].
    The resulting state has a density matrix $\\rho = \\frac{1}{N}\\sum\_{j}\\left|
    {v\_{j}\\rangle\\langle v\_{j}} \\right|$, where N is the cardinality of the data
    vector set. Using `density matrix exponentiation` [[34](#bodymatter-004.xhtml#b_9783110670707-004_ref_034)]
    with the `quantum phase estimation algorithm` [[35](#bodymatter-004.xhtml#b_9783110670707-004_ref_035)],
    and repeating the data sampling, allow us to decompose the data vectors into principal
    components. The quantum `PCA` algorithm works in `O`(( `log` `d`)²) runtime complexity.


    ## 4.4 Quantum machine learning approaches


    ### 4.4.1 HHL or quantum amplitude based approaches

