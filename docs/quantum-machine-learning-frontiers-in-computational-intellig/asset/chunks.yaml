    ## 2.3.2 非满单射


    作为通过计算映射实现任意函数量子计算的进一步步骤，我们考虑一个相对简单的情形：非满单射（即一一对应但非满射的函数）。我们将注意力限制在有限的定义域和值域上。因此，令
    `Ω` = {`x`[1],…,`x`[`n`]} 且 `Ω`^′ = {`y`[1],…,`y`[`m`]}，其中 `n` < `m`，并考虑单射 `f`
