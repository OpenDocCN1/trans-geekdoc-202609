    #### Proposition 2

    Let `Ω` and `Ω`′ be finite sets with `n` = |`Ω`| , `m` = |`Ω`′| , and `m` > `n`.
    Let `f` : `Ω` → `Ω`′ be a non-surjective injection. Let `ℋ[C]` and `ℋ[G]` be Hilbert
    spaces of dimension `m` and `n`, respectively (representing ancillary constant
    inputs and garbage outputs). Let |`ω`⟩ be a fixed basis vector of `ℋ[C]` and |`υ`⟩
    be a fixed basis vector of `ℋ[G]`. Then there is a unitary operator `U` ∈ `ℒ[ℋ(Ω)
    ⊗ ℋ[C], ℋ(Ω′)⊗ ℋ[G]]` such that for all `x` ∈ `Ω`,


    ```

    (2.9) U(|x⟩⊗|ω⟩) = |f(x)⟩⊗|υ⟩.

    ```


    #### Proof:

    The proposition follows from the construction preceding the proposition.

    If the input to `U` is a (normalized) superposition, |`ψ`⟩ = ∑[k] `p`[k] |`x`[k]⟩,
    then the output will be a superposition of the corresponding function results:
    `U` |`ψ`⟩ |`ω`⟩ = ∑[k] `p`[k] |`f(x[k])`⟩ |`υ`⟩.

    The dimension of the input and output spaces of this implementation is `mn`. A
    more resource-efficient but also more complicated implementation operates on a
    space of dimension `L C M(m, n)`. The principle is the same: a permutation of
    the basis vectors.


    ### 2.3.3 Non-injective surjections

    Next we consider functions `f` : `Ω` → `Ω`′ that are surjections but not injections;
    that is, `f` maps onto `Ω`′ but might not be one-to-one. This includes many useful
    functions, such as non-injective squashing functions and Gaussians, but also binary
    functions such as addition and multiplication (as explained later).

    A non-injective function loses information, and thus for quantum computation it
    must be embedded in a larger injective function, which moreover must be unitary.
    In particular, if `f` is non-injective (e.g., `f(x)` = `f(x′)` for some `x` ≠
    `x′`), then the corresponding graph kernel will also be non-injective: `T` |`x`⟩
    = |`y`⟩ = `T` |`x′`⟩ for |`x`⟩ ≠ |`x′`⟩. Therefore `T` (|`x`⟩ − |`x′`⟩) = 0, which
    implies that |`x`⟩−|`x′`⟩ is in the null space of `T`, which we write `𝒩(T)`.
    Therefore there is a bijection between the orthogonal complement of the null space,
    `𝒩(T)`⊥, and the range of the operator, Im `T`. Hence we will implement the non-injective
    operation by decomposing the input |`ψ`⟩ into orthogonal components |`ψ`⟩ = |`μ`⟩
