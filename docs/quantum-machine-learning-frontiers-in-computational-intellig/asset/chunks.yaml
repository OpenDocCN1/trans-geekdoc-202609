    ## 5.4 量子计算的基本思想


    经典计算机一次只能保存一个二进制位 0 或 1。与经典计算机不同，量子计算机能够存储一个称为量子位或 `qubit` 的信息单元，其中单个 `qubit`
    能够在同一时刻存储数字零 (0) 和一 (1)，这在量子计算中被称为叠加态 \[24, 25, 26\]。已知 `qubits` 能够同时完成大量过程，从而实现最快的执行。在二维希尔伯特空间中，`qubit`
    由单位向量表示，并被视为一种双态量子力学现象。在 QC 中，基态的叠加由以下方程表示。


    $|\Psi\rangle = \sum\limits_{i = 1}^{n}\mathcal{C}_{i}|\mathcal{V}_{i}\rangle$
    (5.7)|*Ψ*⟩ = 𝒞[1]|𝒱[1]⟩+ 𝒞[2]|𝒱[2]⟩ + …+ 𝒞[*n*]|𝒱[*n*]⟩


    其中，𝒱[*i*] 是第 *i*^(*t**h*) 个量子态，𝒞[*i*] ∈ ℂ。对于双态量子位或量子位，式 (5.7) 可以表示为线性叠加 |*Ψ*⟩=𝒞[1]|0⟩ + 𝒞[2]|1⟩，其中，态
    |0⟩ 被认为是“基态”，|1⟩ 被认为是“激发态”，且 𝒞[*i*] 属于复数集合，应满足以下归一化条件。


    (5.8)$\sum\limits_{i = 1}^{n}|\mathcal{C}_{i}|^{2} = 1$


    在 QC 中，存在两个显著特征，即相干性和退相干。相干性由基态的线性叠加 (|*Ψ*⟩) 表示，而退相干则发生在先前定义的线性叠加受到强制破坏时发生。量子计算通常使用量子逻辑门作为硬件设备。


    预定义的酉算子用于在固定时间段内更新 `qubits`。从数学上讲，酉 `U` 算子量子门满足关系 `U†` = `U^(-1)` 且 `U U†` = `U†
    U` = `I`。


    在量子计算机中，`n` 个量子位的量子寄存器能够同时存储 2^(`n`) 个状态。例如，八个状态 |000〉、|001〉、|010〉、|011〉、|100〉、|101〉、|110〉
    和 |111〉 需要三个量子寄存器，其中三量子位系统可以表示为 $\left\lbrack {\begin{matrix} \alpha_{1} \\ {
    \beta_{1}\ } \\ \end{matrix}\ \begin{matrix} \alpha_{2} \\ { \beta_{2}\ } \\ \end{matrix}\begin{matrix}
    \alpha_{3} \\ { \beta_{3}\ } \\ \end{matrix}} \right\rbrack$ 其中 `α[i]`² + `β[i]`² = 1，`i` = 1,
    2, 3。


    但在经典计算机的情况下，为了存储这八个状态需要八个寄存器。


    存在多种量子门，例如旋转门、Pauli – X 门或 NOT 门、C-NOT 门、Toffoli 门、Fredkin 门和 Hadamard 门 \[24,
    25, 26\] 等，它们可以在不同类型的问题中以多种方式使用。


    旋转门策略可用于通过以下方程更新第 `i`^(*t**h*) 个量子位的 (`α[i]`, `β[i]`) 值。


    (5.9)$\begin{pmatrix} \alpha_{i}^{\prime} \\ \beta_{i}^{\prime} \\ \end{pmatrix}
    = \ \left( {\begin{matrix} {\cos\theta_{i}} \\ {\sin\theta_{i}} \\ \end{matrix}\
    \begin{matrix} {- \sin\theta_{i}} \\ {{cos}\theta_{i}} \\ \end{matrix}} \right)\
    \begin{pmatrix} \alpha_{i} \\ \beta_{i} \\ \end{pmatrix}$


    这里，每个 `qubit` 的旋转角度由 `θ[i]` 表示，其根据具体问题选择。如果 `α[i]` 和 `β[i]` 表示旋转前 `qubit` 的概率幅，则旋转后它们分别变为
    `α[i]′` 和 `β[i]′`，可通过以下方式实现。


    (5.10) $\begin{pmatrix} \alpha_{i}^{\prime} \\ \beta_{i}^{\prime} \\ \end{pmatrix}
    = \ \begin{pmatrix} {\cos\left( {\theta + \ \delta} \right)_{i}} \\ {\sin\left(
    {\theta + \ \delta} \right)_{i}} \\ \end{pmatrix}$


    其中 $\begin{pmatrix} \alpha_{i} \\ \beta_{i} \\ \end{pmatrix} = \begin{pmatrix}
    {\cos\delta_{i}} \\ {\sin\delta_{i}} \\ \end{pmatrix}$


    ## 5.5 聚类有效性指数


    1979 年，David L. Davies 和 Donald W. Bouldin 提出了一种高效的聚类有效性指数，名为 Davies-Bouldin (DB)
    指数 \[40\]，本文将其用作计算每个个体适应度的目标函数。给定数据集中最优的聚类数由计算得到的 `DB` 指数值 \[40\] 决定，其中考虑 `DB`
    指数 \[40\] 的最小值。它可以被视为簇内离散总和与簇间分离之比的函数。设 `CM[ij]` 为两个不同簇 `Cl[i]` 和 `Cl[j]` 之间的簇相似度度量。其由下式给出：


    (5.11)$ CM_{ij} = \frac{dM_{i} + \ dM_{j}}{d_{ci\_ cj}}$


    这里 `dM[i]` 为第 *i*^(*t**h*) 个簇的离散度度量，表示为


    $dM_{i} = \left\lbrack {\frac{1}{tn\_ o_{i}}\sum_{k = 1}^{tn\_ o_{i}}{\parallel
    {Dp_{k}^{(i)} - Cc_{i}} \parallel}^{2}} \right\rbrack^{\frac{1}{2}}$


    其中，`tn_o[i]` 表示对象的总数，`Cc[i]` 表示簇 `Cl[i]` 中第 `i`^(*t**h*) 个簇中心，且 ∀`Dp[k]^(i)`∈
    `Cl[i]`。


    簇 `Cl[i]` 与 `Cl[j]` 之间的距离可以定义为


    `d[ci_cj]` =  ∥ `Cc[i]` − `Cc[j]`∥.


    以下方程用于定义 Davies – Bouldin (DB) 指数 \[40\]。


    (5.12)$DB\_ I = \frac{1}{no_{c}}\sum_{i = 1}^{no_{c}}H_{i}$


    其中 $H_{i} = \max\limits_{j = 1,2,\ldots,no_{c},\; i \neq j}\left( {CM_{ij}} \right),\;
    i = 1,2,\ldots,\; no_{c}$


    ## 5.6 受量子启发的遗传算法


    ### 5.6.1 QIGA 的提出方法论


    本节讨论了受量子启发的 GA 算法的操作策略。为了识别图像中存在的最优聚类数，所提出的方法在图像数据集上进行了实验。

