    \n## 3.7 AQC based minimum searching algorithm\n\nThe algorithm presented by Durr\
    \ and Hoyer \\[[50](#bodymatter-003.xhtml#b_9783110670707-003_ref_050)\\] on quantum\
    \ circuit model can be modified to fit into AQC framework as follows:\n\n1.  Set\
