    The matrix element of `dH/dt` in [eq. (3.5)](#bodymatter-003.xhtml#b_9783110670707-003_eq_005)
    can be alternately expressed as follows:

    (3.25)${\\langle\\frac{dH}{dt}\\rangle\_{1,0}} = \\frac{ds}{dt}{\\langle\\frac{d\\widetilde{H}}{ds}\\rangle\_{1,0}}$

    Using [eqs. (3.5)](#bodymatter-003.xhtml#b_9783110670707-003_eq_005) and (3.[25](#bodymatter-003.xhtml#b_9783110670707-003_eq_025)),
    for all times `t`, we get new condition

    (3.26)$\\left| \\frac{ds}{dt} \\right| \\leq \\varepsilon\\frac{g^{2}\\left( s
    \\right)}{\\left| {\\langle\\frac{d\\widetilde{H}}{ds}\\rangle}\_{1,0} \\right|}$

    Using [eq. (3.26)](#bodymatter-003.xhtml#b_9783110670707-003_eq_026) and bounding
    $|{\\langle\\frac{d\\widetilde{H}}{ds}\\rangle}\_{1,0}| \\leq 1$, the Hamiltonian
    `H(t)` is evolved at a following rate:

    (3.27)$\\frac{ds}{dt} = \\varepsilon g^{2}\\left( s \\right) = \\varepsilon\\left\\{
    {1 - 4\\left( {1 - \\frac{m\_{e}}{N\_{e}}} \\right)s\\left( {1 - s} \\right)}
    \\right\\}$

    After integration, we get:

    (3.28)$t = \\frac{1}{2\\varepsilon}\\left\\{ \\frac{N\_{e}}{\\sqrt{m\_{e}(N\_{e}
    - m\_{e}}} \\right\\}\\left\\lbrack {\\tan^{- 1}\\left\\{ {\\left( \\sqrt{\\frac{N\_{e}
    - m\_{e}}{m\_{e}}} \\right)\\left( {2s - 1} \\right)} \\right\\} + \\tan^{- 1}\\left(
    \\sqrt{\\frac{N\_{e} -}{m\_{e}}} \\right)} \\right\\rbrack$

    And from the above [eq. (3.28)](#bodymatter-003.xhtml#b_9783110670707-003_eq_028),
    `s(t)` can be obtained as follows:

    (3.29)$s\\left( t \\right) = \\frac{1}{2}\\left\\{ {\\left( \\sqrt{\\frac{m\_{e}}{N\_{e}
    - m\_{e}}} \\right)\\tan\\left\\lbrack {2\\varepsilon\\left\\{ \\frac{\\sqrt{m\_{e}\\left(
    {N\_{e} - m\_{e}} \\right)}}{N\_{e}} \\right\\} t - \\tan^{- 1}\\left( \\sqrt{\\frac{N\_{e}
    - m\_{e}}{m\_{e}}} \\right)} \\right\\rbrack + 1} \\right\\}$

    Therefore, the total computation time `T` can be calculated by equating `s = 1`
    in [eq. (3.28)](#bodymatter-003.xhtml#b_9783110670707-003_eq_028), we get:

    (3.30)$T = \\frac{1}{\\varepsilon}\\left\\{ \\frac{N\_{e}}{\\sqrt{m\_{e}\\left(
    {N\_{e} - m\_{e}} \\right)}} \\right\\}\\tan^{- 1}\\left( \\sqrt{\\frac{N\_{e}
    - m\_{e}}{m\_{e}}} \\right)$ (3.31)$\\max\\left\\{ {\\tan^{- 1}\\left( \\sqrt{\\frac{N\_{e}
    - m\_{e}}{m\_{e}}} \\right)} \\right\\} \\leq \\;\\frac{\\pi}{2}\\,\\forall\\;
    N\_{e} > m\_{e}$ (3.32)$\\left\\{ \\frac{N\_{e}}{\\sqrt{m\_{e}\\left( {N\_{e}
    - m\_{e}} \\right)}} \\right\\} \\leq \\left\\{ {\\sqrt{2}\\left( \\sqrt{\\frac{N\_{e}}{m\_{e}}}
    \\right)} \\right\\}\\;\\forall\\; m\_{e} \\leq \\frac{N\_{e}}{2}$

    Using above three equations i.e. from (3.30) to (3.32), we can conclude that

    (3.33)$T \\leq \\frac{\\pi\\sqrt{2}}{2\\varepsilon}\\left( \\sqrt{\\frac{N\_{e}}{m\_{e}}}
    \\right)\\;\\forall\\; m\_{e} \\leq \\frac{N\_{e}}{2}$

    The above result is very useful from the point of quantum search based on AQC
    for solving optimization problems, which have been attempted in \[[52](#bodymatter-003.xhtml#b_9783110670707-003_ref_052)\].
    Further, the result in \[[32](#bodymatter-003.xhtml#b_9783110670707-003_ref_032)\]
    was derived for cases in which `m[e] ≪ N[e]`. Thus, the bounds provided here are
    applicable to more generic cases.

    One observation, which shows that AQC is a better model than Quantum Circuit model
    for implementing canonical Grover’s search is that, it does not overshoot the
    marked element if the system is evolved for time longer than required i.e. if
    the rate of evolution given by [eq. (3.27)](#bodymatter-003.xhtml#b_9783110670707-003_eq_027)
    is slower than necessary, there is no overshooting involved as the system remains
    in the eigenstate of the final Hamiltonian. That is if the system is evolved at
    `g[min] = 1/√N[e]` instead of `g[min ]= √(m[e]/N[e])`, where `m[e] > 1`, then
    it just takes more time to evolve than necessary, but the solution is still reached,
    unlike Grover’s search on circuit model in which if more rotations than required
    are given to the state vector, then it overshoots the target state. However, in
    such cases, the overall computational complexity is `O(√N[e])` instead of `O(√(N[e]/m[e]))`,
    which when `m[e]` is large would be a substantial slow down.


    ## 3.7 AQC based minimum searching algorithm

    The algorithm presented by Durr and Hoyer \[[50](#bodymatter-003.xhtml#b_9783110670707-003_ref_050)\]
    on quantum circuit model can be modified to fit into AQC framework as follows:

    1. Set `m[e] = N[e]/2` and termination counter `I = 0`.

    2. Select the initial threshold, `Yth`, by randomly taking a sample.

    3. Initialize `H_ini` as given in [eq. (3.19)](#bodymatter-003.xhtml#b_9783110670707-003_eq_019).

    4. Let `H_fin` be as given by eq. (3.20).

    where function `fpb(ϕ[i])` has been implemented as follows:

    ```

    If(D[ϕ[i]] < Yth) // D is the table fpb(ϕ[i]) = 0

    else

    fpb(ϕ[i]) = 1

    ```

    5. Employ Hamiltonian `Ĥ(s) = (1-s(t))*H_ini + s(t)*H_fin`, where `s(t)` is as
    given [eq. (3.29)](#bodymatter-003.xhtml#b_9783110670707-003_eq_029).

    6. Perform evolution of the system for time `T` as per [eq. (3.1)](#bodymatter-003.xhtml#b_9783110670707-003_eq_001).
    The time `T` is given by [eq. (3.33)](#bodymatter-003.xhtml#b_9783110670707-003_eq_033).

    7. Measure the qubits in `|Ψ(T)〉` to find the solution of the problem and present
    result by classical evaluation as objective function value, `y`.

    8. If `D[y]` is less than threshold `Yth`, then

    `Yth = D[y]`

    9. If `I > T_tot`, then Stop

    10. `I = I + T`

    11. `m[e] = m[e]-1`

    12. Go to c.


    ### Theorem 1

    The above algorithm finds the minimum in a database in `O(√N[e])` time with error
    probability `ε²` in expectation.


    ### Proof

    Let us rank all the elements in the database with rank 1 assigned to the element
    with minimum value and rank `N[e]` assigned to the element with maximum value.
    All other elements are also ranked according to their position, if there are several
    elements with same value, then rank them sequentially as they appear without breaking
    order with elements having different values.

    The above algorithm would move through a succession of points before finding the
    minima, therefore, assume that it starts with the element as threshold, whose
    rank is `N[e]/2`, (which can be found by either randomly choosing the threshold
    by sampling the database a few times) then the total running time, `T_tot`, of
    the algorithm is as follows;

    (3.34)$T\_{tot} = \\sum\\limits\_{r = 1}^{N/2}\\left\\{ {P\\left( {N\_{e},r\_{n}}
    \\right)T\\left( {N\_{e},r\_{n} - 1} \\right)} \\right\\}$

    where `P(N[e],r[n])` is the probability of the element with rank `r[n]` ever being
    selected and `T(N[e],r[n]-1)` is the expected time required to evolve the system
    for finding an element with a better rank than `r[n]`.

    The `P(N[e],r[n])` has been shown to be independent of the database size in lemma
    1 of \[[50](#bodymatter-003.xhtml#b_9783110670707-003_ref_050)\] and is dependent
    only on its rank `r[n]`.

    `P(N[e],r[n]) = 1/r[n]`

    The `T(N[e], r[n]-1)` can be found by inserting the value of `r[n]` in [eq. (3.33)](#bodymatter-003.xhtml#b_9783110670707-003_eq_033):

    (3.36)$T\\left( {N\_{e},r\_{n} - 1} \\right) = \\frac{\\pi\\sqrt{2}}{2\\varepsilon}\\left(
    \\sqrt{\\frac{N\_{e}}{r\_{n} - 1}} \\right)$

    Therefore,

    (3.37)$T\_{tot} = \\sum\\limits\_{r\_{n} = 2}^{\\frac{N\_{e}}{2}}\\left\\lbrack
    {\\frac{1}{r\_{n}}\\left\\{ {\\frac{\\pi\\sqrt{2}}{2\\varepsilon}\\left( \\sqrt{\\frac{N\_{e}}{r\_{n}
    - 1}} \\right)} \\right\\}} \\right\\rbrack = \\left( \\frac{\\pi\\sqrt{2}}{2\\varepsilon}
    \\right){\\sqrt{N}}\_{e}\\sum\\limits\_{r\_{n} = 1}^{\\frac{N\_{e}}{2}}\\left\\lbrack
    {\\left( \\frac{1}{r\_{n} + 1} \\right)\\left( \\frac{1}{{\\sqrt{r}}\_{n}} \\right)}
    \\right\\rbrack$ (3.38)$T\_{tot} = \\left( \\frac{5\\pi\\sqrt{2}}{4\\varepsilon}
    \\right){\\sqrt{N}}\_{e}$

    Thus, the AQC based minimum finding algorithm can be analyzed analytically and
    has a better running time in expectation.


    ## 3.8 Adiabatic quantum optimization algorithm

