    ## 1.5 量子神经网络


    量子神经网络（QNNs）是体现量子力学原理的神经网络模型的化身。从计算角度来看 [53, 54]，一类量子神经网络结合人工神经网络模型并在内部嵌入量子计算的特征，以演化出更稳健高效的模型。这些努力背后的基本哲学是通过利用量子并行性、干涉和纠缠的特征，来规避经典神经网络在处理大数据方面的局限性。然而，大多数
    QNN 模型试图用体现量子力学原理的量子比特（也称为“qurons”）取代经典的二元或 McCulloch-Pitts 神经元。


    1995 年，Subhash Kak [55] 和 Ron Chrisley [56] 通过建立神经激活函数与量子力学本征值方程的相似性，提出了量子神经模型的想法。Ajit
    Narayanan 和 Tammy Menneer 引入了一种量子神经网络的光子实现，使用多宇宙理论，该理论在量子测量作用下坍缩为期望状态 [57]。此后，投入了大量努力来寻找感知器的量子版本。然而，这一方向的进展受到了阻碍，因为由于量子系统固有的线性运算，特征性的神经非线性激活函数很少遵循量子理论的数学结构。经过大量努力，Schuld、Sinayskiy
    和 Petruccione 使用量子相位估计算法 [58] 来实现激活函数。除此之外，许多受量子启发的模型也出现了，用于实现基于模糊逻辑的神经网络 [59]。


    Elizabeth Behrman 和 Jim Steck [60] 提出了一种新型量子计算装置，包含若干具有可调相互作用的量子比特。在他们的模型中，相互作用强度根据期望的输入-输出关系训练集，按照经典反向传播算法进行更新，从而使量子网络能够学习算法。


    量子联想记忆由 Dan Ventura 和 Tony Martinez 于 1999 年提出 [61]。作者提出了一种算法，用于在基于电路的量子计算机上模拟联想记忆。在此算法中，记忆状态被设想为量子态的叠加。然后使用量子搜索算法检索最接近给定输入的记忆状态。这种模拟有望实现记忆状态的指数级存储容量。


    ## 1.6 结论


    本章概述了与量子机器学习相关的基本概念和原理。除了阐明量子算法的不同方面外，本章还对量子强化学习和量子退火的原理进行了概览。量子神经网络的演进，尤其是这一方向的开创性工作，也被提及以启发读者。


