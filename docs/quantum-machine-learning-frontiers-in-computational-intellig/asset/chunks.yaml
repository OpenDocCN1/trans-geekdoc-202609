  fmt: '

    A novel quantum optimization algorithm based on Adiabatic Quantum Computation
    framework, which employs local evolution instead of global evolution, has been
    proposed. It is also inspired by the application of Grover’s Search algorithm
    for finding minimum solution in a database, however, the proposed algorithm solves
    real domain optimization problems, which are routinely solved in Machine learning
    algorithms. Further, the proposed algorithm has been analytically analyzed and
    has been shown to have the same signature of quadratic speed up of Grover’s search
    algorithm. Baritompa et al. had made a similar effort on gate-based quantum computation
    model for solving unconstrained global optimization problem. However, the proposed
    AQC based algorithm is conceptually better than gate-based model as there is no
    fear of overshooting the optima, which is a major concern in gate-based models,
    when a priori knowledge of the number of optimal solutions is not available, whereas
    the optimal solutions are encoded as the ground state of the problem Hamiltonian.
    The problem of overshooting in gate-based model could further increase convergence
    time in real world implementations.


    In future, we would like to develop a simulator and architecture of a hybrid Classical
    and Adiabatic Quantum Computer on which we can demonstrate operations of our proposal
    of Quantum Optimization Algorithm for Machine Learning techniques, which would
    require addressing several challenging issues like implementation of loss function
    on a quantum computer and weights updating in learning mechanism.


