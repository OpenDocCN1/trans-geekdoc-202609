    在感觉皮层区域存在许多地形图，它们表示刺激的两个或多个维度（例如视网膜位置和边缘方向）；这些图中的局部活动表示这些维度上的值的联合。类似地，量子计算图可以将值的联合表示为函数的输入或输出。


    假设我们想计算一个函数 `f` : `Ω` × `Ω` → `Ω′`，其中 `Ω` = {`x[1]`,…, `x[n]`} 且 `Ω′` = {`y[1]`,…,
    `y[n]`}。我们将用每个 (`x[j]`, `x[k]`) 对的二维量子比特数组来表示函数的输入。（只要对每个值对都有一个量子比特，它们不必物理上排列成二维数组。）这需要
    `n²` 个量子比特，但我们假设 `n` 很小，因为神经网络只需要低精度。因此我们预计二维图通常包含数千个量子比特。表示 (`x[j]`, `x[k]`)
    对的量子比特随后通过 `Prop. 5` 中描述的方法映射到表示输出 `f(x[j], x[k])` 的量子比特。


    `n²` 个联合由 `n²` 个 `CCNOT` 门计算，每个门需要一个 `|0⟩` 辅助位并在联合之外生成两个额外的量子比特（包含输入）。然而，这些额外的量子比特沿行和列传递以用于其他联合，因此总垃圾量子比特只有
    `2n` 个。综上所述，共有 `2n` + `n²` 个输入量子比特（包括 `n²` 个辅助位）和 `n²` + `2n` 个输出量子比特（包括 `2n`
    个垃圾）。也就是说，如果 `|ϕ[j]⟩` 是一个输入图的第 `j` 个元素的态，且 `|ψ[k]⟩` 是另一个输入图的第 `k` 个元素的态，则二维图中元素
    (`j, k`) 的态 `|χ[jk]⟩` 由以下式计算


    ```

    (2.36) |ϕ[j]⟩|ψ[k]⟩|χ[jk]⟩ = CCNOT |ϕ[j]⟩|ψ[k]⟩|0⟩.

    ```


    `If` `|ϕ[j]⟩` = `p′|0⟩` + `p|1⟩` 且 `|ψ[k]⟩` = `q′|0⟩` + `q|1⟩`，则 `CCNOT` 的结果为


    ```

    |ϕ[j]⟩|ψ[k]⟩|χ[jk]⟩ = p′q′|000⟩ + p′q|100⟩ + p q′|010⟩ + p q|111⟩.

    ```


    量子比特是纠缠的，但如果我们把振幅的平方解释为概率，则联合计算出类似概率的振幅。


    基于以上内容，我们在 `n² + 2n` 维希尔伯特空间上定义一个幺正算符 `U[OP]`，它在两个一维图上执行相当于外积的操作以计算二维图：


    ```

    (2.37) |φ⟩|ψ⟩|χ⟩ = U[OP] |φ⟩|ψ⟩|0⟩^(⊗ n²),

    ```


    其中输入 `|φ⟩` 和 `|ψ⟩` 为 `n` 维，输出 `|χ⟩` 为 `n²` 维并由 式 (2.36) 计算得出。


    为了说明计算图实现二元运算的用法，我们将使用一个简单且有用的函数——加法。我们希望定义 `sum` : `Ω` × `Ω` → `Ω′` 使 `sum(x,
    y)` = `x + y`，但我们有一个问题，因为 `x + y` 的最大值大于 `x` 和 `y` 的最大值。由于我们图所表示的数值的范围相当有限，这比二进制加法中的溢出问题更严重。一个解决方案是使值域图足够大；例如，如果
    `Ω` = {0, `Δx`, 2`Δx`,…, (`n`−1)`Δx`}，则令 `Ω′` = {0, `Δx`, 2`Δx`,…, 2(`n`−1)`Δx`}。一般来说，更方便的是让值域图与定义域图相同，因为这有助于函数复合。因此，另一个解决方案是对输入或输出进行缩放，以便例如计算
    `h sum(x, y)` = (`x`+`y`)/2；如果我们知道最终会缩放这些量，这通常很有用。第三种选择是将加法与压缩函数复合，以便例如计算截断的 `tsum(x,
    y)` = min(`x`+`y`, `x[n]`)，其中 `x[n]` = max `Ω`。这就是我们将用于说明的解决方案。


    如果 `Ω` = {0, `Δx`,…, (`n`−1)`Δx`}，则二维量子比特图的 (`j, k`) 元素将表示输入对 ((`j`−1)`Δx`, (`k`−1)`Δx`)。如果
    `j` + `k` − 2 < `n` − 1，它将被映射到和 (`j`+`k`−2)`Δx`，否则映射到最大值 (`n`−1)`Δx`。因此，位于 `j`
    + `k` = `n` + 1 反对角线之上的常数 `j` + `k` 反对角线各自映射到一个值，(`j`+`k`−2)`Δx`，它是 (`j`−1)`Δx`
    与 (`k`−1)`Δx` 的和。`j` + `k` = `n` + 1 反对角线之下的元素全部映射到相同的 (`n`−1)`Δx` 值，因为和超过了地形图中的最大可表示值。


    `Proposition 5` 展示了如何实现截断加法，但它将其视为 `n²` 维空间上的一个元函数，这很浪费，因为预期输出（和）是 `n` 维的，而剩余的
    `n²` − `n` 个元素是垃圾。因此，我们实现一个幺正算符，直接将输入对映射到相应的输出。


    为了计算外积，我们需要 `n²` 个常数 `|0⟩` 辅助位，并且该计算还将两个 `n` 维输入作为垃圾输出传递。表示 (0, 0) 的量子比特双射地映射到表示
    0 的输出量子比特 `y[1]`。其余 `n` − 1 个输出量子比特 `y[i]`（`i` = 2,…, `n`）各有两个或多个定义域对映射到它。如前所述，令
    `n[i]` 为输出 `i` 的原像重数，并注意 `∑_{i = 1}^{n} n_i = n²`。每个非单射输出都从 `OR[n[i]]` 操作接收其值，该操作需要
    `n[i]` − 1 个输入 `|1⟩` 辅助位并生成 `2n[i]` − 2 个输出垃圾量子比特（`n[i]` 个用于取反输入，`n[i]` − 1 个用于中间析取）。因此，`|1⟩`
    辅助位的总数为


    ```

    ∑_{i = 2}^{n} (n_i - 1) = ∑_{i = 2}^{n} n_i - (n - 1) = (n² - 1) - n + 1 = n²
    - n.

    ```


    此外，完整的输入维度为 `2n` + `n²` + `n²` − `n` = `2n²` + `n`。


    这也是完整的输出维度，因为我们有 `n` 个量子比特用于函数值，`2n` 个量子比特用于传递的输入参数（垃圾），以及来自 `OR` 门的垃圾输出，其为：


    ```

    ∑_{i = 2}^{n} (2n_i - 2) = 2(n² - n).

    ```


    也就是说，完整的输出维度为 `3n` + `2(n² - n)` = `2n²` + `n`。


    总之，存在一个幺正算符 `U[tsum]` ∈ `ℒ(ℋ^{2n² + n}, ℋ^{2n² + n})` 使得


    ```

    (2.38) U[tsum] |{x}⟩ |{y}⟩ |0⟩^(⊗ n²) |1⟩^(⊗ n(n - 1)) = |{tsum(x, y)}⟩ |{x}⟩
    |{y}⟩ |γ⟩,

    ```


    其中垃圾 `|γ⟩` 的维度为 `2n(n - 1)`（传递的输入也可以视为垃圾）。


    基于此示例，我们陈述一个更一般的结果。


    ### 命题 6


    设 `f` : `Ω` × `Ω` → `Ω`，且令 `n` = |`Ω`|。令 `m_nr` ≜ `n - |Im f|` 为不在 `f` 值域中的值域元素的数量。则存在一个幺正算符
    `U[f]` ∈ `ℒ(ℋ, ℋ)`，其中 `ℋ` 是 `2n² + n + 2m[nr]` 维希尔伯特空间，使得：


    ```

    (2.39) U[f] |{x}⟩ |{y}⟩ |0⟩^(⊗ (n² + m[nr])) |1⟩^(⊗ (n² - n + m[nr])) = |{f(x,
    y)}⟩ |{x}⟩ |{y}⟩ |γ⟩,

    ```


    其中垃圾 `|γ⟩` 的维度为 `2(n² - n + m[nr])`（`2n` 个传递的输入也可以视为垃圾）。


