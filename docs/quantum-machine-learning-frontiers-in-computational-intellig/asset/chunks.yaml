    # Preface


    Imparting intelligence to the machines has always been a challenging thoroughfare.
    Over the years, several intelligent tools have been invented or proposed to deal
    with the uncertainties encountered by human beings with the advent of the soft
    computing paradigm. However, it has been observed that even the soft computing
    tools often fall short in offering a reliable and reasonable solution in real
    time. Hence, scientists employed hybrid intelligent techniques using the combination
    of several soft computing tools to overcome the shortcomings.'
