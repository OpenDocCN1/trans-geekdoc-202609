    # Adiabatic Quantum Algorithms


    Adiabatic quantum algorithms were introduced by Farhi et al. \[[22](#bodymatter-003.xhtml#b_9783110670707-003_ref_022)\]
    based on the adiabatic conditions derived from Folk theorem. These algorithms
    have a Hamiltonian constructed for the problem being solved which is called as
    Problem Hamiltonian (`H[fin]`). The ground state of the `H[fin]` can be expressed
    as the optimal solution of the problem. Further, initially the system is prepared
    in the ground state of an initial Hamiltonian, which is easy to build. Subsequently,
    the initial Hamiltonian is changed progressively towards the `H[fin]` so that
    the probability of finding the solution is large at the end of the evolution.
    However, the change from initial Hamiltonian to final Hamiltonian i.e. `H[fin]`
    cannot be instantaneous or even lesser than the minimum time required according
    to the adiabatic theorem. If the system is evolved slowly enough then adiabatic
    theorem guarantees that system will remain in the ground state of the instantaneous
    Hamiltonian, thus the evolution time of varying the Hamiltonian from initial to
    problem is a measure of complexity of the AQC based algorithm. Several constraint
    satisfaction problems along with optimization problems can be represented by an
    aggregated set of local Hamiltonians `H = ∑i H i` where `H i` represents a local
    constraint. The ground state of `H` would satisfy the maximum possible number
    of such constraints and represents a desired optimal solution amongst other possible
    optimal solutions in case of multimodal problems, i.e. the problems having more
    than one optima solutions. The system stays in the instantaneous ground state
    of the evolving Hamiltonian as it will remain close to the ground state provided
    the rate of change of Hamiltonian from initial to `H[fin]` remains within the
    bounds specified by the adiabatic theorem. The bounds on the evolution time is
    dependent on the energies of the initial and problem Hamiltonian as well as on
    the inverse gap of the instantaneous Hamiltonians `H(t)`. The energy difference
    between the ground state of a Hamiltonian and its first excited state represents
    the gap of the Hamiltonian. That is when Hamiltonian is presented as a matrix
    then the gap is the difference between Hamiltonian’s smallest and second smallest
    eigenvalue. Farhi et al. \[[22](#bodymatter-003.xhtml#b_9783110670707-003_ref_022)\]
    have proposed and investigated AQC based algorithms for NP-complete problems like
    `3SAT`. However, the key challenge in AQC based algorithm for solving a specific
    problem is analytical calculation of the Hamiltonian gap, which is not known for
    most of the problems till date. The other approach is to numerically simulate
    the system but the computational cost of simulating quantum mechanical system
    on classical computers is very expensive so the number of qubits in numerical
    simulations is limited. However, the numerical simulation performed in \[[22](#bodymatter-003.xhtml#b_9783110670707-003_ref_022)\]
    on small sized problems did show that the time required to solve NP-complete problems
    scaled only polynomially with the problem size. But later work \[[23](#bodymatter-003.xhtml#b_9783110670707-003_ref_023)\]
    gave strong negative evidence for the speed up shown in \[[22](#bodymatter-003.xhtml#b_9783110670707-003_ref_022)\]
    for AQC based algorithms. It was shown that the performance of adiabatic algorithms
    is even sensitive to the choice of initial Hamiltonian and it can fail if the
    selection of initial Hamiltonian is not performed according to the structure of
    the problem \[[23](#bodymatter-003.xhtml#b_9783110670707-003_ref_023)\]. Further,
    some investigations were made in \[[24](#bodymatter-003.xhtml#b_9783110670707-003_ref_024)\]
    by mapping the `H[fin]` of certain instances of `3-SAT` to an Ising model and
    it was shown that the Hamiltonian gap is exponentially small in some problem instances.
    Further, some special instances of `3-SAT` were also constructed in \[[25](#bodymatter-003.xhtml#b_9783110670707-003_ref_025)\]
    which were hard for the AQC based algorithm. Subsequently, it was shown in \[[26](#bodymatter-003.xhtml#b_9783110670707-003_ref_026),
    [27](#bodymatter-003.xhtml#b_9783110670707-003_ref_027)\] that local minimum of
    some optimization problems can cause very small gaps in the spectrum of the Hamiltonian.
    These studies had designed hard instances of problems to highlight the weakness
    of AQC based algorithms. But in \[[28](#bodymatter-003.xhtml#b_9783110670707-003_ref_028)\],
    randomly generated instances of the NP-complete problem Exact Cover 3 (`EC3`),
    also known as `1-in-3 SAT` were used to test AQC based algorithm and it was shown
    that failure probability of AQC based algorithm was high. Altshuler et al. argued
    that their study provided strong evidence against adiabatic quantum optimization,
    i.e. hard instances of NP-complete problems are difficult for AQC based algorithm
    but the basis for this conclusion depends on some common properties shared by
    other NP-complete problems such as `3-SAT`. However, initially Choi \[[29](#bodymatter-003.xhtml#b_9783110670707-003_ref_029)\]
    and later Dickson and Amin \[[30](#bodymatter-003.xhtml#b_9783110670707-003_ref_030)\]
    challenged the argument against AQC in \[[28](#bodymatter-003.xhtml#b_9783110670707-003_ref_028)\].
    Choi’s argued that a failure of a specific instance of AQC based algorithm is
    not sufficient to conclude that a problem is hard for adiabatic quantum computation
    / optimization in general. An AQC based algorithm comprise of three variable components,
    namely, initial Hamiltonian, problem Hamiltonian and evolution path. Thus, there
    are many combinations possible of these three components for designing an AQC
    based algorithm. He further argued that if it is to be proved that adiabatic quantum
    computation is inefficient even for a particular problem then, it has to be shown
    that there exists no polynomial-time adiabatic quantum algorithms for the problem,
    which requires testing all combinations possible for designing AQC based algorithms
    and not just few instances. Further, Dickson and Amin \[[30](#bodymatter-003.xhtml#b_9783110670707-003_ref_030)\]
    analytically showed that there always exist adiabatic paths for the NP-hard problem
    of maximum independent set along which no such crossings of local minima of the
    final Hamiltonian with its global minimum occur, thus the Hamiltonian gap need
    not be vanishingly small and hence designing of efficient AQC based algorithm
    is possible. Therefore, in order to prove that adiabatic quantum optimization
    fails for any NP-complete problem, one must prove that it is impossible to find
    any such path along with combination of initial and problem / final Hamiltonian
    in polynomial time. Therefore, it is still an open problem whether AQC can solve
    NP complete problems efficiently. However, it is becoming increasingly clear that
    there may not exit one unique path for solving all the NP complete problems.


    ## Quantum Unstructured Search


    Quantum unstructured search has been implemented adiabatically by Farhi et al.
    \[[31](#bodymatter-003.xhtml#b_9783110670707-003_ref_031)\]. This implementation
    was based on global evolution model and had a computational complexity of `O(N)`,
    where `N` is the size of the database. Later Roland and Cerf showed that quadratic
    speed up is possible in adiabatic version also by continuously adjusting the rate
    with which the initial Hamiltonian is switched to final Hamiltonian by only fulfilling
    locally, the conditions of adiabaticity \[[32](#bodymatter-003.xhtml#b_9783110670707-003_ref_032)\].
    The adiabatic quantum search has been rigorously studied by Rezakhani et al. \[[33](#bodymatter-003.xhtml#b_9783110670707-003_ref_033)\]
    where the results relating the accuracy and the run time of the AQC based algorithm
    has been determined. It has also been demonstrated that AQC based algorithm shows
    two discernible regimes with respect to error i.e., the error reduces exponentially
    for short times and then reduces polynomially for longer times, under fairly general
    conditions.

    '
  trans: '

    # 绝热量子算法


    绝热量子算法由 Farhi 等人 \[22\] 提出，基于由 Folk 定理推导出的绝热条件。这些算法具有为所求解问题构建的哈密顿量，被称为问题哈密顿量 (`H[fin]`)。`H[fin]`
    的基态可以表示为问题的最优解。此外，系统最初被制备在易于构建的初始哈密顿量的基态中。随后，初始哈密顿量逐步改变趋向于 `H[fin]`，使得在演化结束时找到解的概率很大。然而，从初始哈密顿量到最终哈密顿量即
    `H[fin]` 的变化不能是瞬时的，甚至不能小于绝热定理要求的最小时间。如果系统演化得足够缓慢，则绝热定理保证系统将保持在瞬时哈密顿量的基态中，因此从初始到问题的哈密顿量变化的演化时间是基于
    AQC 的算法复杂度的度量。若干约束满足问题以及优化问题可以用一组聚合的局部哈密顿量 `H = ∑i H i` 表示，其中 `H i` 表示一个局部约束。`H`
    的基态将满足尽可能多的此类约束，并在多峰问题（即具有一个以上最优解的问题）的情况下代表其他可能最优解中的期望最优解。系统保持在演化哈密顿量的瞬时基态，因为只要从初始到
    `H[fin]` 的哈密顿量变化率保持在绝热定理规定的界限内，它就会保持接近基态。演化时间的界限取决于初始和问题哈密顿量的能量以及瞬时哈密顿量 `H(t)`
    的能隙的倒数。哈密顿量的基态与其第一激发态之间的能量差代表哈密顿量的能隙。也就是说，当哈密顿量表示为矩阵时，能隙是哈密顿量最小和第二小特征值之间的差。Farhi
    等人 \[22\] 提出了并研究了针对 `3SAT` 等 NP-完全问题的基于 AQC 的算法。然而，基于 AQC 的算法解决特定问题的关键挑战是哈密顿量能隙的解析计算，目前大多数问题的能隙尚不清楚。另一种方法是数值模拟系统，但用经典计算机模拟量子力学系统的计算成本非常昂贵，因此数值模拟中的量子比特数有限。然而，\[22\]
    中对小规模问题进行的数值模拟确实显示，解决 NP-完全问题所需的时间仅随问题规模多项式增长。但后来的工作 \[23\] 对 \[22\] 中显示的基于 AQC
    算法的加速提供了强烈的负面证据。研究表明，绝热算法的性能甚至对初始哈密顿量的选择很敏感，如果初始哈密顿量的选择未根据问题的结构进行，算法可能会失败 \[23\]。此外，在
    \[24\] 中通过将 `3-SAT` 的某些实例的 `H[fin]` 映射到 Ising 模型进行了一些研究，并表明在某些问题实例中哈密顿量能隙呈指数级小。此外，在
    \[25\] 中还构造了一些 `3-SAT` 的特殊实例，这些实例对基于 AQC 的算法很困难。随后，在 \[26, 27\] 中表明，某些优化问题的局部最小值会导致哈密顿量谱中出现非常小的能隙。这些研究设计了难题实例以突出基于
    AQC 算法的弱点。但在 \[28\] 中，使用了 NP-完全问题 Exact Cover 3 (`EC3`)（也称为 `1-in-3 SAT`）的随机生成实例来测试基于
    AQC 的算法，并表明基于 AQC 的算法的失败概率很高。Altshuler 等人认为他们的研究为绝热量子优化提供了强有力的反证，即 NP-完全问题的难题实例对基于
    AQC 的算法很困难，但这一结论的基础取决于其他 NP-完全问题（如 `3-SAT`）共有的一些特性。然而，最初 Choi \[29\]，后来 Dickson
    和 Amin \[30\] 对 \[28\] 中的反 AQC 论点提出了质疑。Choi 认为，基于 AQC 的算法的特定实例的失败不足以得出该问题对绝热量子计算/优化普遍困难的结论。基于
    AQC 的算法包含三个可变组成部分，即初始哈密顿量、问题哈密顿量和演化路径。因此，设计基于 AQC 的算法时，这三个组成部分存在许多可能的组合。他进一步认为，如果要证明绝热量子计算即使对特定问题也是低效的，则必须证明该问题不存在多项式时间的绝热量子算法，这需要测试设计基于
    AQC 算法时所有可能的组合，而不仅仅是少数实例。此外，Dickson 和 Amin \[30\] 解析地证明了对于 NP-困难的最大独立集问题，始终存在绝热路径，沿此路径最终哈密顿量的局部最小值与其全局最小值之间不会发生此类交叉，因此哈密顿量能隙不必趋于零，从而可以设计高效的基于
    AQC 的算法。因此，要证明绝热量子优化对任何 NP-完全问题都失败，必须证明在多项式时间内不可能找到此类路径以及初始和问题/最终哈密顿量的组合。因此，AQC
    是否能高效解决 NP 完全问题仍然是一个开放问题。然而，越来越清楚的是，可能不存在一条唯一路径来解决所有 NP 完全问题。


    ## 量子无结构搜索


    Farhi 等人 \[31\] 已绝热地实现了量子无结构搜索。该实现基于全局演化模型，其计算复杂度为 `O(N)`，其中 `N` 是数据库的大小。后来 Roland
    和 Cerf 表明，通过连续调整初始哈密顿量切换到最终哈密顿量的速率，仅在局部满足绝热性条件，也可以在绝热版本中实现二次加速 \[32\]。绝热量子搜索已被
    Rezakhani 等人 \[33\] 严格研究，其中确定了与基于 AQC 算法的精度和运行时间相关的结果。还已证明，基于 AQC 的算法在误差方面表现出两个可区分的区域，即在相当一般的条件下，误差在短时间内呈指数下降，然后在较长时间内呈多项式下降。

    '
