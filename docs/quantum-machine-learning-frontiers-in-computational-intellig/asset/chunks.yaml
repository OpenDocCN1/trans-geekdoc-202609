    另一个活跃的研究领域是 `QML`，旨在理解某些物理系统与深度学习之间的结构和操作相似性。深度学习使用受量子表述启发的某些数学和数值技术，同样，深度学习探索了与量子系统在结构和程序上的一些等价性
    \[12, 13, 14\]。

    像 `D-Waves` \[15\]、 `IBM` \[16\] 和 `Google` \[17\] 这样的大公司在构建量子计算机方面展示了一些进展。这里，D-Wave
    的模型基于绝热量子过程 \[18\]，而 `IBM` \[16\] 主要在研究非绝热模型。`IBM` 发布了 `IBM-Q` 量子计算机供自由访问和使用（当时限制为
    5 量子比特系统访问）。除了量子硬件方面的进展外，在量子算法开发领域也有非常活跃的研究。其中一些最著名的量子算法是 `Grover’s search` \[10\]、
    `Shor’s algorithm` \[19\]、 `HLL` \[20\] 等，它们在解决计算问题方面展示了显著的速度提升。近年来，量子技术的进步涉及了一些最先进的机器学习方法
    \[21, 22, 23, 24, 25\]。这些量子机器学习算法比其经典对应算法快呈指数级。

    在本章中，我们的重点将放在一类可以在量子计算机上运行的经典机器学习算法上。首先，我们简要讨论量子计算基础，包括一些有助于量子机器学习算法发展的知名技术，随后介绍量子机器学习算法领域的最新进展。


    ## 4.2 量子计算概述


    ### 4.2.1 希尔伯特空间与狄拉克符号


    `Hilbert space` `ℂ^(*n*)` 是一个抽象向量空间，非常适用于表示量子系统。`Dirac notation` \[26\] 是在希尔伯特空间中定义向量的非常便捷的方式，以诺贝尔奖获得者保罗·狄拉克命名。在狄拉克符号中，向量
    `V` 表示为：

    (4.1)$V = \\begin{bmatrix} v\_{0} \\\\ v\_{1} \\\\ \\vdots \\\\ v\_{n} \\\\ \\end{bmatrix}
    = |V\\rangle$

    这里，`|V⟩` 被称为“ket `V`”。在同一语境下，`|V⟩` 的对偶向量被称为“bra `V`”并表示为：

    (4.2)$\\langle V| = \\left\\lbrack {\\overset{‾}{v\_{0}}\\ \\overset{‾}{v\_{1}}\\ldots\\overset{‾}{v\_{n}}}
    \\right\\rbrack = \\overset{‾}{V^{T}}$

    我们在狄拉克符号中定义向量 `U` 和 `V` 的内积为：

    (4.3)$\\langle U|V\\rangle = \\left\\lbrack {\\overset{‾}{u\_{0}}\\ \\overset{‾}{u\_{1}}\\ldots\\overset{‾}{u\_{n}}}
    \\right\\rbrack\\begin{bmatrix} v\_{0} \\\\ v\_{1} \\\\ \\vdots \\\\ v\_{n} \\\\
    \\end{bmatrix} = \\ \\overset{‾}{U^{T}}V$

    此外，希尔伯特空间中向量的长度，称为“`Norm`”，定义为：

    (4.4)${\\parallel {|V\\rangle} \\parallel} = \\sqrt{\\langle V|V\\rangle}$

    同样，外积可以用狄拉克符号如下定义：

    (4.5)$\\left| {V\\rangle\\langle U} \\right| = \\begin{bmatrix} v\_{0} \\\\ v\_{1}
    \\\\ \\vdots \\\\ v\_{n} \\\\ \\end{bmatrix}\\left\\lbrack {\\overset{‾}{u\_{0}}\\
    \\overset{‾}{u\_{1}}\\ldots\\overset{‾}{u\_{m}}} \\right\\rbrack = \\begin{bmatrix}
    {v\_{0}\\overset{‾}{u\_{0}}} & \\cdots & {v\_{0}\\overset{‾}{u\_{m}}} \\\\ \\vdots
    & \\ddots & \\vdots \\\\ {v\_{n}\\overset{‾}{u\_{0}}} & \\cdots & {v\_{n}\\overset{‾}{u\_{m}}}
    \\\\ \\end{bmatrix}$


    ### 4.2.2 量子比特与门


    在经典计算中，任何计算构建块的基本单元是 `bit`。在同一语境下，任何量子计算的基本组成部分被称为 `qubit`。在经典计算中，一个称为 `bit` 的二进制数可以是
    0 或 1，但 `qubit` 可以同时处于 0 和 1 两种状态。数学上我们将 `qubit` 表示为 `ℂ²` 中的二维状态空间，具有正交基向量 `|0⟩`
    & `|1⟩`，如下所示，

    (4.6) `|ψ⟩` = `a[0]` `|0⟩` + `a[1]` `|1⟩`; |`a[0]`|² + |`a[1]`|²\= 1

    状态 `|0⟩` & `|1⟩` 处于 `superposition`（这将在 下一节 中详细介绍）而复标量振幅 `a[0]`  &  `a[1]` 分别是测量时获得值
    `|0⟩` & `|1⟩` 的概率。

    单个 `qubit` 用处不大，但一堆量子比特可以具有更实际的可用性。如同经典计算机一样，`quantum register` 是量子比特的集合。在量子寄存器中，寄存器中的量子比特可以处于
    `|0⟩` & `|1⟩` 的叠加态，并在测量时坍缩为 `bit`。因此，如果有一个 `n` 个量子比特的寄存器，则会有 2^(`n`) 个可能的叠加态。例如，假设我们有一个
    3 个量子比特的寄存器，则会有 2³ = 8 个叠加态，如下所示：

    (4.7)$\\begin{matrix} & {|\\psi\_{3}\\rangle = \\sum\\limits\_{i = 0}^{2^{3} -
    1}a\_{i}|i\\rangle = a\_{0}|000\\rangle + a\_{1}|001\\rangle + a\_{2}|010\\rangle
    + a\_{3}|011\\rangle + a\_{4}|100\\rangle + a\_{5}|101\\rangle} \\\\ & {\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,
    + a\_{6}|110\\rangle + a\_{7}|111\\rangle} \\\\ \\end{matrix}$

    与经典计算类似，我们也有量子门，用于对量子比特和寄存器执行某种操作。以下是一些最重要的量子门：

    * a.`Hadamard gate` (`H`) – 这是一个非常重要的量子门。哈达玛门将量子比特变换为量子比特的叠加态，如下所示：

    * (4.8)$H|0\\rangle = \\frac{|0\\rangle + |1\\rangle}{\\sqrt{2}}$

    * (4.9)$H|1\\rangle = \\frac{|0\\rangle - |1\\rangle}{\\sqrt{2}}$

    * b.`Pauli-X` quantum gate (`X`) – 泡利-X 是经典 NOT 门的量子等价物。它交换 `|0⟩` & `|1⟩` 的振幅。

    * c. `Pauli-Y` quantum gate (`Y`) – 它交换 `|0⟩` & `|1⟩` 的振幅，将每个振幅乘以 `i`，然后否定 `|1⟩`
    的振幅。

    d.`Pauli-Z` quantum gate (`Z`) – 当对量子比特应用泡利-Z 量子门时，如果它是 `|1⟩`，则否定该量子比特的振幅，否则如果量子比特是
    `|0⟩`，则不执行任何操作。


    ### 4.2.3 叠加


    量子 `superposition` \[27\] 是量子世界中量子粒子似乎同时存在于多个状态的现象。它是量子力学的基本原理。当处于叠加态的粒子被测量时，叠加态会坍缩并结果对应于仅一个可能的状态。

    因此，在任何时刻，`qubit` 可以同时处于 `|0⟩` 和 `|1⟩` 两种状态的 `superposition` 中，例如：

    (4.10)$\\left| {W\\rangle = a} \\right|0\\rangle + b|1\\rangle = \\begin{pmatrix}
    a \\\\ b \\\\ \\end{pmatrix}$

    其中系数 `a` 和 `b` 是复数，分别是分量 `|0⟩` 和 `|1⟩` 的振幅，具有以下性质：

    (4.11)|`a`|² + |`b`|² = 1


