    # Quantum Inspired Genetic Algorithm for Automatic Clustering


    ## Overview


    At first, a population (`P_c`) was initialized with `N` number of chromosomes.
    Each individual chromosome was of length `L_n` from the population was considered
    as a solution of the problem. (Line 1).

    Now, the population (`P_c`) was encoded to produce the quantum states `Q^(s)`.
    The encoding process is discussed as follows.

    Initially for each of the chromosome of the population a state `θ[i,j]^(s)` (0≤`θ[i,j]^(s)`≤2π)
    was created randomly. Using the value of `θ[i,j]` the quantum state `Q^(s)` was
    created. For a particular `t^(t h)` generation the quantum state `Q^(s)(t)` was
    represented as follows. `Q^(s)(t)` = {`q[1]^(s t)`, `q[2]^(s t)`, …, `q[N]^(s
    t)`},

    where, `q[i]^(s t)` (`i`=1,2,…,`N`) denotes the arbitrary elements of `Q^(s)(t)`
    and can be denoted as


    ```

    $q_{i}^{st} = \\begin{bmatrix} {\\alpha_{i,1}^{st}\\left| {\\alpha_{i,2}^{st}\\left|
    \\ldots \\right|\\alpha_{i,m}^{st}} \\right|} \\\\ {\\beta_{i,1}^{st}\\left| \\beta_{i,2}^{st}
    \\right|\\ldots\\left| \\beta_{i,m}^{st} \\right|} \\\\ \\end{bmatrix}\\,\\,,\\,
    here\\, m = Ln$

    ```


    and `α[i,j]^(s t)` = cos `θ[i,j]^(s t)` and `β[i,j]^(s t)` = sin `θ[i,j]^(s t)`
    was computed from the random value of `θ[i,j]^(s t)`, where `i` = {1,2,…,`N`}
    and `j` = {1,2,…,`L_n`}.(Line 2).

    Now, in order to generate the active cluster points a selection procedure was
    applied on the population and the selection process was guided by the state `Q^(s)(t)`
    to produce a binary solution `B_c(t)`. The binary solution `B_c(t)` = {`b_c[1]^(t)`,`b_c[2]^(t)`,…,`b_c[N]^(t)`}
    was produced by observing the state `Q^(s)(t)` in the initial generation `t` =
    1.

    Each of the binary solution `b_c[i]^(t)` was generated as follows.


    ```

    $bc_{i,j}^{t} = \\{\\begin{matrix} {1,\\ If\\ \\beta_{i,j}^{st} > \\ \\alpha_{i,j}^{st}}
    \\\\ {\\ 0,\\ Otherwise} \\\\ \\end{matrix},\\ s.t.\\ i = \\left\\{ {1,\\ 2,\\ldots,\\
    N} \\right\\}\\ and\\ j = \\left\\{ {1,2,\\ldots,\\ Ln} \\right\\}.$

    ```


    The criteria `b_c[i,j]^(t)` = 1 was set to identify the activated cluster points
    from the population `P_c(t)` for the `t^(t h)` generation, where `i` = {1,2,…,`N`}
    and `j` = {1,2,…,`L_n`}. (Line 3–8).

    Now, the fitness of each individual chromosome from the quantum population was
    computed by an objective function (DB index [[40](#bodymatter-005.xhtml#b_9783110670707-005_ref_040)]
    – [eq. (5.12)](#bodymatter-005.xhtml#b_9783110670707-005_eq_012)).

    The best chromosomes from the quantum population were chosen for generating the
    next generation population. (Line 9).

    Now, a quantum rotation gate `G_s[i,j]^(t)(ϕ)` was used for updating each quantum
    state `Q^(s)(t)`, which can be denoted as follows.


    ```

    $Gs_{i,j}^{t}\\left( \\phi \\right) = \\left\\lbrack {\\begin{matrix} {\\cos\\phi_{i,j}^{st}\\
    } \\\\ {\\sin\\phi_{i,j}^{st}} \\\\ \\end{matrix}\\begin{matrix} {- {sin}\\phi_{i,j}^{st}}
    \\\\ {\\cos\\phi_{i,j}^{st}} \\\\ \\end{matrix}} \\right\\rbrack,$

    ```


    where, the rotation angle `ϕ[i,j]^(s t)` was chosen randomly between (−0.5, 0.5).

    The updated quantum state `Q^(new)(t)` was identified by the [eq. (5.10)](#bodymatter-005.xhtml#b_9783110670707-005_eq_009).(Line
    11).

    In case of quantum inspired genetic algorithm, the probability amplitude (`α`,
    `β`) of qubits were used to encode the chromosomes. After that quantum rotation
    gate was used to update (`α`, `β`), which lead to realize the genetic operation
    for generating the offspring instead of determining them from their parents as
    the chromosomes were in superposition or entangled state. In general, rotation
    influences the search space to extend as it is able to produce 2^(n) number of
    states from n qubit chromosome. The different values of (`α`, `β`) were responsible
    for generating the states (Lines 12–18).

    A predefined mutation probability was used to perform the quantum mutation operation.
    The probability amplitude `α` would be converted to `β` and `β` would be converted
    to `α` for the greater value of the predefined mutation probability from a random
    number between (0,1). The following quantum NOT gate strategy was used to alter
    the probability amplitude (`α`, `β`) to (`β`, `α`).


    ```

    $\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\!\\begin{bmatrix}
    0 & 1 \\\\ 1 & 0 \\\\ \\end{bmatrix}\\ \\begin{bmatrix} \\alpha_{i,j} \\\\ \\beta_{i,j}
    \\\\ \\end{bmatrix}$\=$\\begin{bmatrix} \\beta_{i,j} \\\\ \\alpha_{i,j} \\\\ \\end{bmatrix}$

    ```


    ```

    $\\begin{bmatrix} 0 & 1 \\\\ 1 & 0 \\\\ \\end{bmatrix}\\ \\begin{bmatrix} {\\cos\\theta_{i,j}}
    \\\\ {\\sin\\theta_{i,j}} \\\\ \\end{bmatrix}$\=$\\begin{bmatrix} {\\sin\\theta_{i,j}}
    \\\\ {\\cos\\theta_{i,j}} \\\\ \\end{bmatrix}$ (Lines 19–26).

    ```


    The generation number `t` was updated by `t` = `t` + 1 and perform the above mentioned
    procedure for a predefined number of generation or until it met the stopping criteria.
    (Lines 10–27).

    The best chromosome was identified and preserved along with its fitness and number
    of cluster.(Line 28).


