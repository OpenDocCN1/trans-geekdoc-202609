    Another active research field in `QML` is to understand the structural and operational
    similarities between certain physical systems and deep learning. Deep leaning
    uses some mathematical and numerical techniques that are inspired by quantum formulation,
    and in the same way, deep learning explores some structural and procedural equivalences
    with quantum systems \[[12](#bodymatter-004.xhtml#b_9783110670707-004_ref_012),
    [13](#bodymatter-004.xhtml#b_9783110670707-004_ref_013), [14](#bodymatter-004.xhtml#b_9783110670707-004_ref_014)\].

    Big companies like `D-Waves` \[[15](#bodymatter-004.xhtml#b_9783110670707-004_ref_015)\],
    `IBM` \[[16](#bodymatter-004.xhtml#b_9783110670707-004_ref_016)\], and `Google`
    \[[17](#bodymatter-004.xhtml#b_9783110670707-004_ref_017)\] demonstrated some
    progress in building a quantum computer. Here, the D-Wave’s model is based on
    the adiabatic quantum process \[[18](#bodymatter-004.xhtml#b_9783110670707-004_ref_018)\]
    and the `IBM` \[[16](#bodymatter-004.xhtml#b_9783110670707-004_ref_016)\] is working
    on mostly non-adiabatic models. `IBM` released the `IBM-Q` quantum computer to
    be accessed and used freely (with the restriction of 5 qubits system access at
    the time). Apart from the progress in quantum hardware, there is very active research
    going on in the area of developing quantum algorithms. Some of the most notable
    quantum algorithms are `Grover’s search` \[[10](#bodymatter-004.xhtml#b_9783110670707-004_ref_010)\],
    `Shor’s algorithm` \[[19](#bodymatter-004.xhtml#b_9783110670707-004_ref_019)\],
    `HLL` \[[20](#bodymatter-004.xhtml#b_9783110670707-004_ref_020)\], etc., which
    demonstrated significant speed-up gains insolving computational problems. In recent
    years, the advancement in quantum technologies has involved some state-of-the-art
    machine learning approaches \[[21](#bodymatter-004.xhtml#b_9783110670707-004_ref_021),
    [22](#bodymatter-004.xhtml#b_9783110670707-004_ref_022), [23](#bodymatter-004.xhtml#b_9783110670707-004_ref_023),
    [24](#bodymatter-004.xhtml#b_9783110670707-004_ref_024), [25](#bodymatter-004.xhtml#b_9783110670707-004_ref_025)\].
    These quantum machine learning algorithms are exponentially faster than their
    classical counterparts.

    In this chapter, our focus will be on a category of classical machine learning
    algorithms that can run on a quantum computer. At first, we discuss quantum computing
    basics in brief, including some well-known techniques that are useful in the advancement
    of quantum machine learning algorithms, followed by the recent advancements in
    the field of quantum machine learning algorithms.


    ## 4.2 Overview of quantum computing


    ### 4.2.1 Hilbert space & Dirac notation


    A `Hilbert space` `ℂ^(*n*)` is an abstract vector space which is very useful for
    representing a quantum system. The `Dirac notation` \[[26](#bodymatter-004.xhtml#b_9783110670707-004_ref_026)\]
    is a very convenient way of defining vectors in the Hilbert space, named after
    the Nobel laureate Paul Dirac. In Dirac notation, a vector `V` is represented
    as:

    (4.1)$V = \\begin{bmatrix} v\_{0} \\\\ v\_{1} \\\\ \\vdots \\\\ v\_{n} \\\\ \\end{bmatrix}
    = |V\\rangle$

    Here, `|V⟩` is known as “ket `V`”. In the same context, the dual vector of `|V⟩`
    is known as “bra `V`” and represented as:

    (4.2)$\\langle V| = \\left\\lbrack {\\overset{‾}{v\_{0}}\\ \\overset{‾}{v\_{1}}\\ldots\\overset{‾}{v\_{n}}}
    \\right\\rbrack = \\overset{‾}{V^{T}}$

    We define the inner product of vectors `U` and `V` in Dirac notation as:

    (4.3)$\\langle U|V\\rangle = \\left\\lbrack {\\overset{‾}{u\_{0}}\\ \\overset{‾}{u\_{1}}\\ldots\\overset{‾}{u\_{n}}}
    \\right\\rbrack\\begin{bmatrix} v\_{0} \\\\ v\_{1} \\\\ \\vdots \\\\ v\_{n} \\\\
    \\end{bmatrix} = \\ \\overset{‾}{U^{T}}V$

    Also, the length of the vector in the Hilbert space, known as “`Norm`”, is defined
    as:

    (4.4)${\\parallel {|V\\rangle} \\parallel} = \\sqrt{\\langle V|V\\rangle}$

    Similarly, the outer product can be defined as follows with the Dirac notation:

    (4.5)$\\left| {V\\rangle\\langle U} \\right| = \\begin{bmatrix} v\_{0} \\\\ v\_{1}
    \\\\ \\vdots \\\\ v\_{n} \\\\ \\end{bmatrix}\\left\\lbrack {\\overset{‾}{u\_{0}}\\
    \\overset{‾}{u\_{1}}\\ldots\\overset{‾}{u\_{m}}} \\right\\rbrack = \\begin{bmatrix}
    {v\_{0}\\overset{‾}{u\_{0}}} & \\cdots & {v\_{0}\\overset{‾}{u\_{m}}} \\\\ \\vdots
    & \\ddots & \\vdots \\\\ {v\_{n}\\overset{‾}{u\_{0}}} & \\cdots & {v\_{n}\\overset{‾}{u\_{m}}}
    \\\\ \\end{bmatrix}$


    ### 4.2.2 Quantum bits and gates


    In classical computation, the fundamental unit for the building block of any computation
    is the `bit`. In the same context, the fundamental component of any quantum computation
    is known as a `qubit`. In classical computation, a base-2 number known as a `bit`
    can be either 0 or 1, but a `qubit` can also be in both states, 0 and 1, at the
    same time. Mathematically we represent a `qubit` as a two-dimensional state space
    in `ℂ²` with orthogonal basis vectors `|0⟩` & `|1⟩` as,

    (4.6) `|ψ⟩` = `a[0]` `|0⟩` + `a[1]` `|1⟩`; |`a[0]`|² + |`a[1]`|²\= 1

    The states `|0⟩` & `|1⟩` are in `superposition` (this will be covered in detail
    in the [next section](#bodymatter-004.xhtml#b_9783110670707-004_s_004_s_002))
    and the complex scalar amplitudes `a[0]`  &  `a[1]` are the probabilities of obtaining
    the values `|0⟩` & `|1⟩` upon measurement, respectively.

    A single `qubit` is of no significant use, but a bunch of qubits can involve much
    more practical usability. Like a classical computer, the `quantum register` is
    the collection of qubits. In the quantum register, a qubit in a register can be
    in a superposition of `|0⟩` & `|1⟩`, and upon measurement collapse to a `bit`.
    So, if there is a `n` qubits register, then there will be 2^(`n`) possible states
    in superposition. For example, suppose we have a 3 qubits register, then there
    will be 2³ = 8 states in superposition as shown:

    (4.7)$\\begin{matrix} & {|\\psi\_{3}\\rangle = \\sum\\limits\_{i = 0}^{2^{3} -
    1}a\_{i}|i\\rangle = a\_{0}|000\\rangle + a\_{1}|001\\rangle + a\_{2}|010\\rangle
    + a\_{3}|011\\rangle + a\_{4}|100\\rangle + a\_{5}|101\\rangle} \\\\ & {\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,
    + a\_{6}|110\\rangle + a\_{7}|111\\rangle} \\\\ \\end{matrix}$

    Like classical computing, we have quantum gates too, which are used to perform
    some kind of operations on qubits and registers. The followings are some of the
    most important quantum gates:

    * a.`Hadamard gate` (`H`) – This is a very important quantum gate. The Hadamard
    gate transforms a qubit into a superposition of qubits as shown:

    * (4.8)$H|0\\rangle = \\frac{|0\\rangle + |1\\rangle}{\\sqrt{2}}$

    * (4.9)$H|1\\rangle = \\frac{|0\\rangle - |1\\rangle}{\\sqrt{2}}$

    * b.`Pauli-X` quantum gate (`X`) – Pauli–X is quantum equivalent to classical
    NOT gate. It swaps the amplitudes of the `|0⟩` & `|1⟩`.

    * c. `Pauli-Y` quantum gate (`Y`) – It swaps the amplitudes of `|0⟩` & `|1⟩`,
    multiplies each amplitude by `i`, and then negates the amplitude of `|1⟩`.

    d.`Pauli-Z` quantum gate (`Z`) – When applying a Pauli-Z quantum gate to a qubit,
    it negates the amplitude of the qubit if it is `|1⟩`, otherwise, it performs no
    action if the qubit is `|0⟩`.


    ### 4.2.3 Superposition


    The Quantum `superposition` \[[27](#bodymatter-004.xhtml#b_9783110670707-004_ref_027)\]
    is a phenomenon in the quantum world in which quantum particles appear to exist
    in multiple states simultaneously. It is the fundamental principle of quantum
    mechanics. When the particle is measured in superposition, the superposition collapses
    and results in correspond to only one of the possible states.

    Thus, at any instance, a `qubit` can be in a `superposition` of both states `|0⟩`
    and `|1⟩` simultaneously, such as:

    (4.10)$\\left| {W\\rangle = a} \\right|0\\rangle + b|1\\rangle = \\begin{pmatrix}
    a \\\\ b \\\\ \\end{pmatrix}$

    where the coefficients `a` and `b` are complex numbers and the amplitudes of the
    components `|0⟩` and `|1⟩` respectively, possessing the following property:

    (4.11)|`a`|² + |`b`|² = 1


    ### 4.2.4 Entanglement

