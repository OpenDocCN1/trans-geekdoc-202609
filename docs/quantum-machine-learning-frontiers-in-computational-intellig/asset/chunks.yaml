    {f\\left( x \\right)\\rangle\\langle x|f^{- 1}\\left( y \\right)\\rangle\\langle
    y} \\right|\\ dxdy} \\\\ & {= \\int\\limits\_{\\Omega^{\\prime}}^{}|f\\left( {f^{-
    1}\\left( y \\right)} \\right)\\rangle\\langle y|dy = I\_{\\Omega^{\\prime}}.}
