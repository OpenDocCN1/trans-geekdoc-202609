    \\\\ {\\sin\\theta_{i,j}^{\\mathcal{B}ATt}} \\\\ \\end{pmatrix},\\ {where}\\ i
    = \\left\\{ {1,2,\\ldots,P\\, size} \\right\\}\\ and\\ j = \\left\\{ {1,2,\\ldots,BLn}
    \\right\\}$


    and the corresponding values of them are preserved in `P_BAT[i,j]^(α)` and `P_BAT[i,j]^(β)`
