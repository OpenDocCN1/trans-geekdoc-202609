    in order to encode P_BAT the information of the quantum state was used and produce
    P_BAT^(α) and P_BAT^(β).

    3. The frequency (ℬℱ)[i] and velocity (ℬ𝒱[i]) were initialized for every solution
    of the population.

    4. The loudness (ℬA[i]) and the pulse rates (ℬR[i]) were also initialized.

    5. for i = 1 to Psize do

    6. for j = 1 to BLn do

    7. 𝒩[C][i] numbers of cluster points from P_BAT[i] were created by satisfying
    the condition P_BAT[ij]^(β) > P_BAT[ij]^(α) and the cluster points were stored
    in ℬCP[i].

    8. Now, the fitness ℱ[T][i] was evaluated from ℬCP[i] by using the cluster validity
    index (DB-Index).

    9. end for.

    10. end for.

    11. The best solution in terms of the best fitness value 𝒪_ℱ[T] was identified.

