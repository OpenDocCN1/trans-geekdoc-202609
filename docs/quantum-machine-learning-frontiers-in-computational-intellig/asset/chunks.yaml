    \[7\]。另一方面，地形图对表征资源的利用相对低效，因为每个被表征的值都必须在图中有一个位置 \尽管这可以通过 *粗编码* 来缓解，通过这种方式，精确值由具有重叠感受野的宽调谐神经元群体来表征
