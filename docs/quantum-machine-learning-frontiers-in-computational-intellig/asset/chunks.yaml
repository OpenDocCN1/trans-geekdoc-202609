    \ cluster centroids\n\nThe cluster centroids within a given image dataset were\
    \ used to automatically recognize the optimal number of cluster points present\
    \ in that dataset. During the execution of the process, the following equation\
    \ was used to choose the cluster centroids.\n\n(5.19)$\\\\ \\\\delta\\_{i} = \\\
    \\ \\\\{\\\\begin{matrix} {1\\\\ if\\\\ \\\\beta\\_{i} > \\\\ \\\\alpha\\_{i}\\\
    \\ } \\\\\\\\ {0\\\\ Otherwise} \\\\\\\\ \\\\end{matrix}$ \n\nwhere, *δ*[*i*](1 < *i* < *n*)\
    \ was the activation threshold. By observing the value of *δ*[*i*], the cluster\
    \ centroids were chosen from a single solution. Here *α*[*i*]  and *β*[*i*] were\
    \ the complex coefficients and *δ*[*i*] was considered similar to the state of\
    \ the quantum bit. A value of 1 for *δ*[*i*] represents the activated cluster\
    \ center implies that the quantum bit is in excited state otherwise it is in the\
