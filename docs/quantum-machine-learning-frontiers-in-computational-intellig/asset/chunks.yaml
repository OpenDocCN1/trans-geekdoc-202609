    ## 2.4 算符构造与垃圾分析


    算符的构造与 `U[tsum]` 非常相似，但我们还必须考虑非满射函数中非值域的余域元素，而在那种情况下并未出现。如前所述，外积的计算将需要 `n`² 个辅助
    `|0⟩` 输入，并且会生成包含透传输入的 2`n` 个量子比特。我们可以考虑余域的不相交子集。余域中不在 `f` 值域内的元素需要发送一个 `|0⟩` 状态，为此我们需要额外的
    `m[nr]` 个辅助 `|0⟩` 输入。令 `n[b]` 为映射为一一对应的输入对的数量；它们既不需要辅助常数也不产生垃圾。剩余的余域元素是值域元素且 `n[i]`
    ≥ 2；令 `m[n]` = `n` − `m[nr]` − `n[b]` 为其数量。这些元素中的每一个都将接收相应的（原像）定义域元素的 OR。如前所述，`OR[n[i]]`
    操作需要 `n[i]` − 1 个辅助 `|1⟩` 量子比特并产生 2`n[i]` − 2 个量子比特的垃圾。因此，映射到 `m[n]` 个非单射映射值域元素的
    `n`² − `n[b]` 个输入对所需的 `|1⟩` 量子比特总数为：


    (2.40)$\\sum\\limits\_{i = 1}^{m\_{n}}\\left( {n\_{i} - 1} \\right) = \\sum\\limits\_{i
    = 1}^{m\_{n}}n\_{i} - m\_{n} = n^{2} - n\_{b} - m\_{n} = n^{2} - n + m\_{nr},$


    由于 `m[n]` = `n` − `m[nr]` − `n[b]`。OR 产生的垃圾为


    (2.41)$\\sum\\limits\_{i = 1}^{m\_{n}}\\left( {2n\_{i} - 2} \\right) = 2\\left(
    {n^{2} - n + m\_{nr}} \\right).$


    完整的输入维度为 2`n`（参数）+ (`n`² + `m[nr]`)（用于 `|0⟩` 辅助）+ (`n`² − `n` + `m[nr]`) 用于 `|1⟩`
    辅助，[公式 (2.40)] = 2`n`² + `n` + 2`m[nr]`。输出维度为 3`n`（参数和结果）+ 2(`n`²−`n`+`m[nr]`)
    垃圾，[公式 (2.41)] = 2`n`² + `n` + 2`m[nr]`。


    同样的方法可用于具有两个以上参数的操作，但量子比特数会随参数数量呈指数增长。


    ## 2.5 表示之间的转换


    普通二进制表示可以通过幺正解复用器 `U[demux]` 转换为地形量子比特图，该解复用器作用于 `m` 量子比特的二进制数 `|k⟩` 并将一个 `|1⟩`
    量子比特导向 `n` = 2^`m` 个输出量子比特中的第 `k` 个（其余接收 `|0⟩`）。令 `|{k}⟩` 为由此产生的计算量子比特图。则：


    (2.42)`U[demux]`|`k⟩`|`1⟩`|`0⟩`^(⊗ (`n` − 1)) = `|k⟩`|`{k}⟩`.


    `U[demux]` 作用于 `m` + `n` = `m` + 2^(`m`) 维的希尔伯特空间。解复用器可以用 `CSWAP` (`Fredkin`)
    门实现 [19]。


    相反的转换，从计算图到二进制表示更为复杂。首先，我们必须决定它想要做什么，因为一般来说地形量子比特图用不同振幅表示多个值， `$|{\psi\rangle
    = \otimes_{j = 1}^{n}({p_{j}^{\prime}\left| {0\rangle} \right. + p_{j}|{1\rangle}})$`，其中
    `|p[j]′|`² + `|p[j]|`² = 1。它应该产生哪个 `x[j]`？是振幅最大的那个吗？（如果有几个振幅相同最大怎么办？）是基于 `|p[j]|`²
    概率选择的 `x[j]` 吗？加权平均值的二进制表示，`n^{-1}\sum_{j = 1}^{n}p_{j}x_{j}`？所有值的归一化叠加？答案并不明显，所以我们将这个问题留待开放。⁴


    ## 2.6 应用于量子机器学习


    鉴于通过地形量子比特图计算非幺正甚至非线性函数这一通用能力，可以执行机器学习中有用的操作，例如内积和 sigmoid 非线性。例如，`N` 维向量的内积需要
    `N` 次乘法和 `N` − 1 次加法。如果 `|Ω|` = `n`，则每次乘法和加法大约需要 2`n`² 个量子比特（`Prop. 6`），总计大约为
    2`N`²`n`²。


    对于神经网络的一层，假设有 `N` 个神经元通过 `M` × `N` 权重矩阵投影到 `M` 个神经元，我们必须对输入执行 `M` 次内积。由于清晰集合由计算基中的基向量表示的计算图表示，因此它们可以被复制。因此，`N`
    维输入向量可以被复制 `M` − 1 次以执行 `M` 次内积。（这需要 `M` − 1 个 `CNOT` 门和 (`M`−1)`n` 个辅助 `|0⟩`
    量子比特。总的来说，一层大约需要 2`M``N`²`n`² 个量子比特用于计算（不包括辅助量子比特）。


    ## 2.7 结论


    地形（计算）图在脑中被广泛用于对多个输入实现同时的非线性向量变换。在本章中，我们探讨了两种量子地形计算方法，重点关注受大脑启发的机器学习应用。第一种称为地形基图，将图中的位置分配给量子希尔伯特空间的连续或离散基中的态向量。此类图上可以实现任意函数，可解释为表示输入的清晰集合，但结果相对于“垃圾”状态存在不可避免的数据相关衰减，且难以避免。第二种方法称为地形量子比特图，为图中的每个位置分配一个单独的量子比特，并使用
    `|1⟩` 和 `|0⟩` 状态的相对振幅来表示图中表示的（清晰或模糊）集合中值的存在。这些图上的任意函数由众所周知的量子逻辑门实现。特别是，计算图使得能够实现人工神经网络中常用的函数。


    ## References


    \[1\]Nielsen, M. A. and Chuang, I. L. 2010. *量子计算与量子信息* (第 10 周年纪念版). Cambridge,
    UK: Cambridge Univ. Press. a, b


    \[2\]Schuld, M., Sinayskiy, I., and Petruccione, F. 2014. 量子神经网络的探索. *量子信息处理*
    13:2567–2586. [`doi.org/10.1007/s11128-014-0809-8`](https://doi.org/10.1007/s11128-014-0809-8) →


    \[3\]Schuld, M., Sinayskiy, I., and Petruccione, F. 2015. 量子机器学习的介绍. *当代物理* 56:172–185.
    [`doi.org/10.1080/00107514.2014.964942`](https://doi.org/10.1080/00107514.2014.964942) →


    \[4\]Furber, E. F., Lester, D. R., Plana, L. A., Garside, J. D., Painkras, E.,
    Temple, S., and Brown, A. D. 2013. SpiNNaker 系统架构概述. *IEEE 计算机汇刊* 62:2454–2467.
    [`doi.org/10.1109/TC.2012.142`](https://doi.org/10.1109/TC.2012.142) →


    \[5\]Neftci, E., Binas, J., Rutishauser, U., Chicca, E., Indiveri, G., and Douglas,
    R. J. 2013. 神经形态电子系统中的认知合成. *美国国家科学院院刊* 110:E3468–E3476. [`dx.doi.org/10.1073/pnas.1212083110`](http://dx.doi.org/10.1073/pnas.1212083110) →


