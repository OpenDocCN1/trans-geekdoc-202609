    18. if (Rand(0,1)>ℬR[ij]) then

    19. The best solution was selected after calculating the fitness of all bats from
    their updated positions and a native solution was generated with the help of the
    eq. (5.15).

    20. end if.

    21. Now, new solution was evaluated.

    22. Each value of the state Q^(BAT)(t)[J], P_BAT[J]^(α) and P_BAT[J]^(β) were
    updated by using the rotation gate strategy in order to achieve a better solution
    from the population.

    23. if (Rand(0,1)<ℬA[i]&ℬℱ[T][new]<ℬℱ[T][Best]) then

