    ## 5.9 Conclusion


    This article is envisaged an automatic clustering technique to recognize the optimal
    number of cluster points present in an image dataset, which shows a new way to
    combine the features of quantum computing with two different meta-heuristic algorithms,
    viz., Genetic algorithm and Bat algorithm. These proposed techniques were found
    superior over their classical counterparts as they out performed over corresponding
    classical counterparts for automatically identifying the optimal number of cluster
    points present in an image dataset within a significantly small time frame. Also
    the effectiveness of the quantum inspired algorithms were judged and presented
    depending upon the computed value of optimal fitness, mean fitness value, standard
    deviation of the fitness, standard error of the fitness and more over the computed
    *p* − *v**a**l**u**e*  from the statistical superiority test *t* − *t**e**s**t*.
    Finally, Friedman test were performed to identify the superior technique between
    the quantum inspired versions with their classical version. Moreover, it was seen
    that the quantum inspired Bat algorithm was the best performing procedure among
    the others. All the computed results were presented in the previous tables in
    order to proof the effectiveness of the quantum inspired methods over their classical
    counterparts as well as prove the superiority of QIBA. So far, only gray level
    images were used for experimental purpose and the proposed techniques were developed
    to satisfy only one objective at a time.


    Currently authors are involved to explore the realm of quantum computing to resolve
    the concerned multi objective optimization problems effectively and efficiently
    within a smaller time frame and also trying to take care of the true colour images
    for this direction of the research.


