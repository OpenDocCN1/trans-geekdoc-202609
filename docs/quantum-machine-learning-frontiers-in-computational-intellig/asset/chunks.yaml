    \ \n\n其中 |*γ*⟩ 是 2(*n*[n] − *m*[n]) 个量子位的垃圾。\n\n#### 证明：\n\n输入为输入映射的 *n* 个元素、*m*[nr]\
    \ 个常数 |0⟩ 辅助量子位（用于非像元素），以及用于将多个定义域元素映射到同一值域元素的 `OR[2]` 门的 *n*[n] − *m*[n] 个常数\
