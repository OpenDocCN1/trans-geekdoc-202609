- raw: "Another active research field in QML is to understand the structural and operational\
    \ similarities between certain physical systems and deep learning. Deep leaning\
    \ uses some mathematical and numerical techniques that are inspired by quantum\
    \ formulation, and in the same way, deep learning explores some structural and\
    \ procedural equivalences with quantum systems \\[[12](#bodymatter-004.xhtml#b_9783110670707-004_ref_012),\
    \ [13](#bodymatter-004.xhtml#b_9783110670707-004_ref_013), [14](#bodymatter-004.xhtml#b_9783110670707-004_ref_014)\\\
    ].\n\nBig companies like D-Waves \\[[15](#bodymatter-004.xhtml#b_9783110670707-004_ref_015)\\\
    ], IBM \\[[16](#bodymatter-004.xhtml#b_9783110670707-004_ref_016)\\], and Google\
    \ \\[[17](#bodymatter-004.xhtml#b_9783110670707-004_ref_017)\\] demonstrated some\
    \ progress in building a quantum computer. Here, the D-Wave’s model is based on\
    \ the adiabatic quantum process \\[[18](#bodymatter-004.xhtml#b_9783110670707-004_ref_018)\\\
    ] and the IBM \\[[16](#bodymatter-004.xhtml#b_9783110670707-004_ref_016)\\] is\
    \ working on mostly non-adiabatic models. IBM released the IBM-Q quantum computer\
    \ to be accessed and used freely (with the restriction of 5 qubits system access\
    \ at the time). Apart from the progress in quantum hardware, there is very active\
    \ research going on in the area of developing quantum algorithms. Some of the\
    \ most notable quantum algorithms are Grover’s search \\[[10](#bodymatter-004.xhtml#b_9783110670707-004_ref_010)\\\
    ], Shor’s algorithm \\[[19](#bodymatter-004.xhtml#b_9783110670707-004_ref_019)\\\
    ], HLL \\[[20](#bodymatter-004.xhtml#b_9783110670707-004_ref_020)\\], etc., which\
    \ demonstrated significant speed-up gains insolving computational problems. In\
    \ recent years, the advancement in quantum technologies has involved some state-of-the-art\
    \ machine learning approaches \\[[21](#bodymatter-004.xhtml#b_9783110670707-004_ref_021),\
    \ [22](#bodymatter-004.xhtml#b_9783110670707-004_ref_022), [23](#bodymatter-004.xhtml#b_9783110670707-004_ref_023),\
    \ [24](#bodymatter-004.xhtml#b_9783110670707-004_ref_024), [25](#bodymatter-004.xhtml#b_9783110670707-004_ref_025)\\\
    ]. These quantum machine learning algorithms are exponentially faster than their\
    \ classical counterparts.\n\nIn this chapter, our focus will be on a category\
    \ of classical machine learning algorithms that can run on a quantum computer.\
    \ At first, we discuss quantum computing basics in brief, including some well-known\
    \ techniques that are useful in the advancement of quantum machine learning algorithms,\
    \ followed by the recent advancements in the field of quantum machine learning\
    \ algorithms.\n\n## 4.2 Overview of quantum computing\n\n### 4.2.1 Hilbert space\
    \ & Dirac notation\n\nA Hilbert space ℂ^(*n*) is an abstract vector space which\
    \ is very useful for representing a quantum system. The Dirac notation \\[[26](#bodymatter-004.xhtml#b_9783110670707-004_ref_026)\\\
    ] is a very convenient way of defining vectors in the Hilbert space, named after\
    \ the Nobel laureate Paul Dirac. In Dirac notation, a vector *V* is represented\
    \ as:\n\n(4.1)$V = \\\\begin{bmatrix} v\\_{0} \\\\\\\\ v\\_{1} \\\\\\\\ \\\\vdots\
    \ \\\\\\\\ v\\_{n} \\\\\\\\ \\\\end{bmatrix} = |V\\\\rangle$ \n\nHere, |*V*⟩ is\
    \ known as “ket *V*”. In the same context, the dual vector of |*V*⟩ is known as\
    \ “bra *V*” and represented as:\n\n(4.2)$\\\\langle V| = \\\\left\\\\lbrack {\\\
    \\overset{‾}{v\\_{0}}\\\\ \\\\overset{‾}{v\\_{1}}\\\\ldots\\\\overset{‾}{v\\_{n}}}\
    \ \\\\right\\\\rbrack = \\\\overset{‾}{V^{T}}$ \n\nWe define the inner product\
