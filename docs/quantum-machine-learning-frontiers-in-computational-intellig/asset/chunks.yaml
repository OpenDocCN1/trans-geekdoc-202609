    ## Abstract


    One of the most common information representations in the brain is the *topographic*
    or *computational map*, in which neurons are arranged systematically according
    to the values they represent. By representing quantitative relationships spatially,
    computational maps enable the brain to compute complex, nonlinear functions to
    the accuracy required. This chapter proposes two approaches to quantum computation
    for machine learning by means of topographic representation. It shows how to construct
    unitary operators, implementable on quantum computers, that implement arbitrary
    (including nonlinear) functions via computational maps.


    Keywords: computational map, neural network, quantum computation, quantum machine
    learning, quantum neural network, topographic map, topographic representation,


    ## 2.1 Introduction


    This chapter proposes a brain-inspired approach to quantum machine learning with
    the goal of circumventing many of the complications of other approaches. The fact
    that quantum processes are unitary presents both opportunities and challenges.
    A principal opportunity is that a large number of computations can be carried
    out in parallel in linear superposition, that is, with quantum parallelism. There
    are of course many technical challenges in quantum computing, but the principal
    theoretical challenge in quantum machine learning is the fact that quantum processes
    are linear whereas most approaches to machine learning depend crucially on nonlinear
    operations. Artificial neural networks, in particular, require a nonlinear activation
    function, such as a logistic sigmoid function, for nontrivial machine learning.
    Fortunately, the situation is not hopeless, for we know that nonlinear processes
    can be embedded in unitary processes, as is familiar from the circuit model of
    quantum computation \[[1](#bodymatter-002.xhtml#b_9783110670707-002_ref_001)\].


    Despite the complications of quantum machine learning, it presents a tantalizing
    approach to implementing large-scale machine learning in a post-Moore’s law technological
    era. However, there are many approaches to machine learning and several approaches
    to quantum computation (e.g., circuit model, annealing), and it is not obvious
    which combinations are most likely of success. Schuld, Sinayskiy, and Petruccione
    \[[2](#bodymatter-002.xhtml#b_9783110670707-002_ref_002), [3](#bodymatter-002.xhtml#b_9783110670707-002_ref_003)\]
    provide useful recent reviews of some approaches to quantum neural networks and
    quantum machine learning more generally. They conclude that none of the proposals
    for quantum neural networks succeed in combining the advantages of artificial
    neural networks and quantum computing. They argue that open quantum systems, which
    involve dissipative interactions with the environment, are the most promising
    approach. Moreover, few of the proposals include an actual theory of quantum machine
    learning.


    This chapter explores an approach to the quantum implementation of machine learning
    involving nonlinear functions operating on information represented topographically,
    as is common in neural cortex. However, there are many approaches to neurocomputing,
    that is, to brain-inspired computing, some of which may be more amenable to quantum
    implementation than others, and so we must say a few words about the alternatives.
    For the brain may be modelled at many different levels, and models at each of
    these levels may provide a basis for machine learning. For example, in recent
    years spiking neural network models have become popular once again, largely due
    to their power advantages when implemented in hardware \[e.g., [4](#bodymatter-002.xhtml#b_9783110670707-002_ref_004),
    [5](#bodymatter-002.xhtml#b_9783110670707-002_ref_005)\]. Such models mimic the
    “all or none” action potential generation by biological neurons without addressing
    the detailed dynamics of the action potential. On the other hand, most contemporary
    applications of artificial neural networks, including those used in deep learning,
    use a higher level, rate-based model. That is, the real values passed between
    the units (neuron analogs) represent the rate of neural spiking rather than individual
    spikes. It has been argued that this is the appropriate level for modeling neural
    information processing, since there are many stochastic effects on the generation
    and reception of action potentials, and because the fundamental units of information
    processing are *microcolumns* comprising about 100 neurons \[\[[6](#bodymatter-002.xhtml#b_9783110670707-002_ref_006)\],
    chapter 2\]. Therefore it is most fruitful to view neural computation as a species
    of massively parallel analog computation. Since quantum computation makes essential
    use of complex–valued probability amplitudes, it is also fruitful to treat it
    as a species of analog computation, and so analog information representation provides
    one point of contact between quantum computation and artificial neural networks
    \[[7](#bodymatter-002.xhtml#b_9783110670707-002_ref_007)\].


    ## 2.2 Topographic representation in the brain


    Another respect in which information processing in the brain differs from most
    artificial neural network models is that biological neural networks are spatially
    organized, with connectivity dependent on spatial organization. Although artificial
    neural networks are typically organized in layers, there is generally no spatial
    relationship among the neurons in each layer;[¹](#fn1)


    One of the most common spatial information organizations used by the brain is
    the *topographic representation* or *computational map*. In such representations,
    distinct points `x` in some abstract space `𝒳` are mapped systematically to physical
    locations `r = µ(x)` in a two-dimensional region of cortex; that is, spatial relationships
    among the neurons are correlated with topological relationships in the abstract
    space. These maps are especially common in motor areas \[[8](#bodymatter-002.xhtml#b_9783110670707-002_ref_008)\]
    and sensory areas \[\[[6](#bodymatter-002.xhtml#b_9783110670707-002_ref_006)\],
    ch. 6\]. For example, tonotopic maps have the neurons that respond to different
    pitches arranged in order by pitch. Retinotopic maps have a spatial organization
    that mirrors the organization of the retina and visual field. Neurons in primary
    visual cortex that respond to edges are arranged systematically according to the
    orientation of the edges. There are many other examples throughout the brain,
    and this is perhaps the single most common information representation used by
    the brain.


    In these topographic maps, a particular value `x` is represented by an activity
    peak in the corresponding cortical location `µ(x)`. The strength of the activity
    reflects the value’s degree of presence, importance, or probability. Moreover,
    multiple simultaneous values, with differing relative strengths or probabilities,
    are represented by multiple simultaneous activity peaks of differing amplitudes.
    Therefore, such cortical maps can represent superpositions of values, each with
    its own amplitude.

