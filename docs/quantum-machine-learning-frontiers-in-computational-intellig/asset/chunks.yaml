    \ 3.2: Quantum Oracle.\n\n## 3.4 Grover’s adaptive search\n\nBaritompa et al.\
    \ generalized the quantum minimum search algorithm for solving finite global optimization\
    \ problems, which have been formulated as follows \\[[52](#bodymatter-003.xhtml#b_9783110670707-003_ref_052)\\\
    ]:\n\n(3.12) *O**p**t**i**m**i**z**e* `f`(`α`), `α` ∈ `A`\n\nwhere `f` is a real\
    \ valued function on a finite set `A`.\n\nLet the cardinality of set `A` be `N`.\
    \ Let `a[1]` < `a[2]` < `a[3]` … < `a[L]` be ‘`L`’ distinct values of the objective\
    \ function `f`(`α`) for all `α` in `A`. Therefore, `L` should be less than or\
    \ equal to `N` i.e. if `L` would be equal to `N` then for every value of `α` in\
    \ set `A`, there would be a distinct objective function value of `f`. Let there\
    \ be a uniform probability measure `λ` on `A`, such that `ϒ` be the range measure\
    \ given by a stochastic vector (`ϒ[1]`, `ϒ[2]`, …, `ϒ[L]`) induced by `f`, so\
    \ that `ϒ[j]` = |`f^(−1)`(`a[j]`)|/`N` for `j` = 1, 2, …, `L`. Let `P[j]` = $\\\
    \\sum\\_{i = 0}^{j}\\\\Upsilon\\_{j}$, the probability that a random point has\
    \ value of ‘`a[j]`’ or less, i.e. `P[L]` = 1. Therefore, there is an improving\
    \ region corresponding to all values of objective function `f`(`α`), which belongs\
    \ to a sub-set of `A`, where `f`(`α`) has strictly better value \\[[52](#bodymatter-003.xhtml#b_9783110670707-003_ref_052)\\\
    ]. The measure of improving region under `λ` is denoted as improving fraction\
    \ `P`. So if we choose a particular value for objective function, say ‘`θ`’, then\
    \ the improving region would comprise of set of all the point whose objective\
    \ function values are better than ‘`θ`’.\n\nThe algorithm proposed by Baritompa\
    \ et al. is known as Grover Adaptive search (GAS), which takes a sequence of rotation\
    \ counts and an objective function value threshold as the input. Its pseudo code\
    \ is as follows \\[[52](#bodymatter-003.xhtml#b_9783110670707-003_ref_052)\\]:\n\
    \n1. Select `α[1]` in `A`, and set `θ[1]` = `f`(`α[1]`).\n2. Set count `nc` =\
    \ 1.\n3. While (termination condition is not met)\n* {\n* a. Perform a Grover\
    \ search of `r[nc]` rotations on `f` with threshold `V[nc]`, and denote the outputs\
    \ by `α` and `θ`.\n* b. If `v` < `V[nc]`, set `θ[nc+1 ]` = `α` and `V[nc +1 ]`\
    \ = `v`; otherwise, set `θ[nc+1 ]` = `θ[nc]` and `V[nc +1 ]` = `V[nc]`.\n* c. `nc`\
    \ = `nc` + 1.\n* }\n\nGAS has been studied using an adaptive search framework\
    \ developed in \\[[53](#bodymatter-003.xhtml#b_9783110670707-003_ref_053), [54](#bodymatter-003.xhtml#b_9783110670707-003_ref_054),\
    \ [55](#bodymatter-003.xhtml#b_9783110670707-003_ref_055)\\] which has been applied\
    \ for theoretically analyses of convergence properties of optimization methods\
    \ that use stochastic global search. One of the underlying assumptions of the\
    \ adaptive algorithms is that search can find better (“improving”) solutions (at\
    \ some cost). GAS is based on an oracular function that can find better solutions\
    \ than the current one with a finite probability in every iteration, if one exists.\
    \ This oracle takes an input string `α` ∈ `A`, computes `f`(`α`), compares `f`(`α`)\
    \ with current threshold and outputs zero or one depending on the result of comparison\
    \ and the type of optimization problem being solved i.e. whether it is a minimization\
    \ or maximization problem. Such oracles can be implemented using reversible /\
    \ quantum circuits as shown in [Section 3.3.1](#bodymatter-003.xhtml#b_9783110670707-003_s_003_s_003_s_001).\n\
    \nThus, GAS generates a series of domain solutions, which are uniformly distributed\
    \ in the improving region of the previous solution. Further, according Theorem\
    \ 1 and Corollary 6 given in \\[[54](#bodymatter-003.xhtml#b_9783110670707-003_ref_054)\\\
    ], such a series converges to a global optimal solution rapidly; e.g., a unique\
    \ optimal solution in a domain of size `K` can be located after 1 + ln(`K`) such\
    \ improvements, in expectation \\[[54](#bodymatter-003.xhtml#b_9783110670707-003_ref_054)\\\
    ].\n\nTheorem 1 \\[[54](#bodymatter-003.xhtml#b_9783110670707-003_ref_054)\\].\
    \ *The expected number of iterations, I, required for solving the finite optimization\
    \ problem described by* [eq. (3.12)](#bodymatter-003.xhtml#b_9783110670707-003_eq_012)\
    \ *is:*\n\n1. $I = 1 + \\\\sum\\\\limits\\_{i = 2}^{N}\\\\frac{\\\\Upsilon\\_{i}}{P\\\
    _{i}}$ *for strong Pure Adaptive Search.*\n2. $I = 1 + \\\\sum\\\\limits\\_{i\
    \ = 2}^{N}\\\\frac{\\\\Upsilon\\_{i}}{P\\_{i - 1}}$ *for weak Pure Adaptive Search.*\n\
    \nwhere Strong Pure Adaptive Search implies that each iteration of the search\
    \ algorithm should sample objective function value from a strictly improving region.\
    \ The weak Adaptive search implies that each iteration of the search algorithm\
    \ should sample objective function value that is either equal or better.\n\n###\
    \ Corollary 6\n\n\\[[54](#bodymatter-003.xhtml#b_9783110670707-003_ref_054)\\\
    ]. *The expected number of iterations, I, for solving finite global optimization\
    \ described by* [eq. (3.12)](#bodymatter-003.xhtml#b_9783110670707-003_eq_012)*,\
    \ and given a uniform distribution on the objective function values, is:*\n\n\
    1. *bounded above by 1 + log`N` for strong Pure Adaptive Search.*\n2. *bounded\
    \ above by 2 + log(`N`−*1) for weak Pure Adaptive Search.*\n"
  trans: "\n已对绝热近似在 AQC 框架下 Grover 量子搜索情况下基于这三个条件的适用性进行了严格研究，见 [46]。发现最初由 Folk 定理得到的结论仍然有效。由于本章主要使用\
    \ Grover 搜索，因此本章其余部分将应用 Folk 定理的结果。\n\nGrover 量子搜索算法 [47]及其变体可作为子程序用于设计求解优化问题的算法。Grover\
    \ 搜索算法的变体，如不需要预先知道目标实体数量的 Boyer 的提议 [48]和不动点方案 [49]，尤其适用于此类问题。Durr 和 Høyer 在 [50]中提出了一种算法，用于在数据库中寻找最小值，该算法采用\
    \ [48]中提出的算法作为子程序。\n\n用于定位最小值的量子算法在未排序的表‘`D`’中搜索最小项，`D`包含 `K` 个项目，每个项目的值属于一个有序集合。量子最小值搜索算法的伪代码如下：\n\
    \n1. 随机选择阈值索引 `J[in]` ∈ [0,`K`−1]。\n2. 重复直到总运行时间超过 22.5√`K` + 1.4 lg² `K`。\n \
    \   1. 应用 Boyer 等人的量子搜索算法 \\[48\\]。\n    2. 观测第一个寄存器：令 `D`[`J[in′]`] 为结果。\n  \
    \  3. 如果 `D[J[in′]]` < `D[J[in]]`，则将阈值索引 `J[in]` 设置为 `J[in′]`。\n3. 返回 `J[in]`。\n\
    \n量子最小值搜索算法找到最小值的索引，并为进一步开发优化算法和启发式方法提供了灵感，因此在某种程度上是开创性的研究。\n\n### 3.3.1 预言机\n\
    \n函数 `f(x)` 的经典预言机可以像 图 3.1 所示那样可逆地实现。类似地，正则量子预言机可以像 图 3.2 所示那样实现 [51]。然而，它与可逆预言机不同，因为它可能以基态的某种叠加作为输入，并产生可能纠缠且处于基态某种叠加的输出。\n\
    \n![图 3.1：经典预言机的可逆实现。](img/b_9783110670707-003_fig_001.png)\n\n图 3.1：经典预言机的可逆实现。\n\
    \n![图 3.2：量子预言机。](img/b_9783110670707-003_fig_002.png)\n\n图 3.2：量子预言机。\n\n## 3.4 Grover\
    \ 自适应搜索\n\nBaritompa 等人将量子最小值搜索算法推广用于求解有限全局优化问题，其表述如下 [52]：\n\n(3.12) *优化* `f`(`α`), `α` ∈ `A`\n\
    \n其中 `f` 是有限集 `A` 上的实值函数。\n\n设集合 `A` 的基数为 `N`。设 `a[1]` < `a[2]` < `a[3]` … < `a[L]`\
    \ 为所有 `α` ∈ `A` 的目标函数 `f`(`α`) 的 ‘`L`’ 个不同取值。因此，`L` 应小于或等于 `N`，即如果 `L` 等于 `N`，则集合\
    \ `A` 中每个 `α` 值都有 `f` 的不同目标函数值。设 `A` 上存在均匀概率测度 `λ`，使得 `ϒ` 为由 `f` 诱导的随机向量 (`ϒ[1]`,\
    \ `ϒ[2]`, …, `ϒ[L]`) 给出的范围测度，使得 `ϒ[j]` = |`f^(−1)`(`a[j]`)|/`N`，其中 `j` = 1, 2,\
    \ …, `L`。设 `P[j]` = $\\\\sum\\_{i = 0}^{j}\\\\Upsilon\\_{j}$，即随机点取值小于或等于 ‘`a[j]`’\
    \ 的概率，即 `P[L]` = 1。因此，存在一个改进区域，对应于目标函数 `f`(`α`) 的所有取值，该取值属于 `A` 的子集，其中 `f`(`α`)\
    \ 具有严格更好的值 [52]。`λ` 下改进区域的测度记为改进分数 `P`。因此，如果我们为目标函数选择一个特定值，例如 ‘`θ`’，则改进区域将包括所有目标函数值优于\
    \ ‘`θ`’ 的点的集合。\n\nBaritompa 等人提出的算法被称为 Grover 自适应搜索（GAS），它以旋转次数序列和目标函数值阈值作为输入。其伪代码如下\
    \ [52]：\n\n1. 在 `A` 中选择 `α[1]`，并设 `θ[1]` = `f`(`α[1]`)。\n2. 设计数 `nc` = 1。\n3.\
    \ 当终止条件未满足时\n* {\n* a. 对 `f` 执行 `r[nc]` 次旋转的 Grover 搜索，阈值为 `V[nc]`，并用 `α` 和 `θ`\
    \ 表示输出。\n* b. 如果 `v` < `V[nc]`，则设 `θ[nc+1 ]` = `α` 且 `V[nc +1 ]` = `v`；否则，设 `θ[nc+1\
    \ ]` = `θ[nc]` 且 `V[nc +1 ]` = `V[nc]`。\n* c. `nc` = `nc` + 1。\n* }\n\nGAS 已使用\
    \ [53, 54, 55] 中开发的自适应搜索框架进行研究，该框架已应用于使用随机全局搜索的优化方法的收敛性质的理论分析。自适应算法的基本假设之一是搜索可以在一定成本下找到更好的“改进”解。GAS\
    \ 基于一个预言函数，该函数在每次迭代中以有限概率找到比当前解更好的解，如果存在的话。该预言机接收输入字符串 `α` ∈ `A`，计算 `f`(`α`)，将\
    \ `f`(`α`) 与当前阈值进行比较，并根据比较结果和所求解的优化问题的类型，即是最小化还是最大化问题，输出零或一。此类预言机可使用可逆/量子电路实现，如\
    \ 第 3.3.1 节 所示。\n\n因此，GAS 生成一系列域解，这些解在前一解的改进区域中均匀分布。此外，根据 [54] 中给出的定理 1 和推论 6，这样的序列会迅速收敛到全局最优解；例如，在期望情况下，在大小为\
    \ `K` 的域中，唯一的最优解可以在 1 + ln(`K`) 次改进后定位 [54]。\n\n定理 1 [54]。*求解由* 式 (3.12) *描述的有限优化问题所需的迭代次数\
    \ I 的期望值为：*\n\n1. $I = 1 + \\\\sum\\\\limits\\_{i = 2}^{N}\\\\frac{\\\\Upsilon\\\
    _{i}}{P\\_{i}}$ *用于强纯自适应搜索。*\n2. $I = 1 + \\\\sum\\\\limits\\_{i = 2}^{N}\\\\\
    frac{\\\\Upsilon\\_{i}}{P\\_{i - 1}}$ *用于弱纯自适应搜索。*\n\n其中强纯自适应搜索意味着搜索算法的每次迭代都应从严格改进区域采样目标函数值。弱自适应搜索意味着搜索算法的每次迭代应采样目标函数值，该值相等或更好。\n\
    \n### 推论 6\n\n[54]。*求解由* 式 (3.12) *描述的有限全局优化所需的迭代次数 I 的期望值，在目标函数值上给定均匀分布时，为：*\n\
    \n1. *强纯自适应搜索的上界为 1 + log`N`。*\n2. *弱纯自适应搜索的上界为 2 + log(`N`−1)。*\n"
