- raw: "The Adiabatic quantum optimization algorithm has been developed for solving\
    \ unconstrained optimization problems, which have been described in [Section 3.5](#bodymatter-003.xhtml#b_9783110670707-003_s_003_s_005).\
    \ The AQC based minimum finding algorithm has been used as the underlying framework\
    \ for developing the optimization algorithm.\n\nThe unconstrained optimization\
    \ problems in continuous domain can be converted into a finite global optimization\
    \ problem as shown in [Section 3.5](#bodymatter-003.xhtml#b_9783110670707-003_s_003_s_005).\
    \ Each domain point can be ranked on the basis of its objective function value\
    \ i.e. the point with best objective function value can be assigned RANK 1 and\
    \ the point with worst objective function value can be assigned RANK N[e]. The\
    \ rest of points can similarly be assigned a suitable rank. If two or more points\
    \ have same objective function value then they would be assigned different ranks,\
    \ randomly chosen within the range, while maintaining their relative position\
    \ with rest of the points. Thus, the points are now analogues to the index of\
    \ the database, so, the optimization algorithm can be designed on the same framework\
    \ as the minimum finding algorithm described in [Section 3.5](#bodymatter-003.xhtml#b_9783110670707-003_s_003_s_005).\n\
    \nAdiabatic quantum optimization algorithm for solving Unconstrained Global Optimization\
    \ problem is as follows:\n\n1.  Set m[e] = N[e]/2 and termination counter I = 0.\n\
    \n2.  Compute Yth by taking a random sample of domain point x.\n\n3.  Construct\
    \ Beginning Hamiltonian H[ini], which would be same for all the UCOP problems.\n\
    \n*H*[*i**n**i*]\\= ∑ *H*[*i**n**i*\\_*i*], where\n\n*H*[*i**n**i*] [*i*]  = *I* − |*ψ*[*i*]⟩⟨*ψ*[*i*]|,where\n\
    \n$|\\\\psi\\_{i}\\\\rangle\\\\,\\\\, = \\\\,\\\\,\\\\left( {1/\\\\sqrt{}2} \\\
    \\right) \\\\ast \\\\left( {0\\\\rangle\\\\,\\\\, + \\\\,\\\\,\\\\left( {1/\\\\\
    sqrt{}2} \\\\right)} \\\\right)$ \n\nd.\n\n: \n\nMake Problem Hamiltonian H[fin],\
    \ which is specific to the particular UCOP, however the structure would remain\
    \ same irrespective of the UCOP.\n\nH[fin]|q[1]q[2]q[3]…q[n]〉 = fpb (q[1]q[2]q[3]…q[n])\
    \ |q[1]q[2]q[3]…q[n]〉\n\nwhere fpb(q[1]q[2]q[3]…q[n]) is a Boolean function, which\
    \ models the problem and can be constructed reversibly as follows:\n\nIf (f(q) ≥ Yth)\
    \ … … for Minimization\n\n*f**p**b*(*q*) = 0; \n\nelse\n\n*f**p**b*(*q*) = 1;\
    \ \n\nwhere |q[1]q[2]q[3]…q[n]〉 are n qubits representing the decision variables\
    \ of the UCOP being solved given eq. (3.13) and q = q[1]q[2]q[3]…q[n]. The fpb(q)\
    \ would be implemented in an Oracle and so its outcome would be reflected in the\
    \ state of ancilla qubit, qo. Yth is the threshold value computed from the objective\
    \ function of the UCOP being solved. The first value of Yth may be assigned randomly\
    \ or seeded by meta-heuristics techniques \\[[57](#bodymatter-003.xhtml#b_9783110670707-003_ref_057)\\\
    ].\n\n1.  Employ Hamiltonian Ĥ(s) = (1-s(t))\\*H[ini] + s(t)\\*H[fin], where s(t)\
    \ is as given [eq. (3.29)](#bodymatter-003.xhtml#b_9783110670707-003_eq_029).\n\
    \n2.  Perform evolution of the system for time T as per [eq. (3.1)](#bodymatter-003.xhtml#b_9783110670707-003_eq_001).\
    \ The time T is given by [eq. (3.33)](#bodymatter-003.xhtml#b_9783110670707-003_eq_033).\n\
    \n3.  Measure the qubits in |Ψ(T)〉 to find the solution of the problem and present\
    \ result by classical evaluation as objective function value, y.\n\n4.  If y is\
    \ less than threshold Yth, then\n\nYth = y – Δy where Δy ≥ 0 for minimization\
    \ problem\n\ni.\n\n: \n\nIf I > T[tot], then Stop, where T[tot] is given by [eq.\
    \ (3.38)](#bodymatter-003.xhtml#b_9783110670707-003_eq_038)\n\nj.\n\n: \n\nI = I + T\n\
    \nk.\n\n: \n\nm[e] = m[e]−1\n\nl.\n\n: \n\nGo to c.\n\n### 3.8.1 Discussions\n\
    \nThe nucleus of the proposed algorithm is a search routine designed on AQC framework\
    \ to find optimal value. It adapts the evolution rate to local adiabatic condition\
    \ based on local adiabatic evolution, which has O(√N[e]) run-time complexity and\
    \ is asymptotically optimal as shown in \\[[32](#bodymatter-003.xhtml#b_9783110670707-003_ref_032)\\\
    ].\n\nThe termination of the run of algorithm for solving a particular instance\
    \ of the problem is also supported by the laws of Quantum mechanics (i.e. Adiabatic\
    \ Theorem) that is if no improvement is made even after considering m[e] = 1,\
    \ then the search can be terminated with conclusion that no better points exists\
    \ with probability 1-ε², where ε ≪ 1. This consideration makes the proposed algorithm\
    \ a global optimizer.\n\nThe working of the algorithm is further illustrated with\
    \ the help of an example. Let us Minimize f(x) = x² such that −1.0 < x < 1.0\n\
    \nThe variable x is discretized between \\[−1.0, 1.0\\] by using 10 qubits i.e.\
    \ n = 10.\n\nThe total number of domain points in search space, N = 2^n = 2^(10) = 1024.\n\
    \nFor first iteration: Let ε = 0.707, x = 0.5; Y[th] = (0.5)² = 0.25, m[e] = 512,\
    \ therefore T = 2.22 time units. If the run is successful, a new threshold would\
    \ be found or else with the earlier threshold, and after reducing m[e] by 1, the\
    \ second iteration would be executed, so on and so forth. Subsequently, say, after\
    \ 256 iterations, lf |x| > 0.25, then it would have a high chance of success run\
    \ as T for which it would be evolved is larger than required, whereas if |x| < 0.25,\
    \ then T is less than required but in next few iterations, the T would become\
    \ equal or larger (as m[e] is reduced) than required for a success run. Moreover,\
    \ when |x| < 0.25, the performance of the algorithm is better than expected. Therefore,\
    \ if the algorithm fails, it is because its performance is better than expected\
    \ otherwise it is almost guaranteed to produce a good result. Thus, after running\
    \ the algorithm for T[tot] time, it can be re-run for m[e] = 1 and if no improvement\
    \ is found in threshold then it can be said that global optimal has been found\
    \ with failure probability at most ε².\n\nThe actual running time of the algorithm\
    \ can be improved further by doing some additional processing like counting the\
    \ successful and unsuccessful iterations and for updating the value of m[e] as\
    \ the [eq. (3.38)](#bodymatter-003.xhtml#b_9783110670707-003_eq_038) gives an\
    \ average case result. However, the analytical analysis of such adaptive schemes\
    \ would be difficult and is left for future studies.\n\nAQC optimization algorithm\
    \ is better than the Quantum circuit implementation of Grover Adaptive Search\
    \ as the rotation count is no longer required to be guessed or randomly / heuristically\
    \ assigned. Further, even if the quantum system were evolved for time duration\
    \ larger than the minimum time, the system would only get closer to the ground\
    \ state and would not overshoot the marked state containing the solution.\n\n\
    ## 3.9 Conclusions\n\nMachine learning is a branch of Artificial intelligence,\
    \ which tries to develop techniques that have ability to learn from experiences.\
    \ These experiences are articulated as data generated from underlying models.\
    \ The goal of any machine learning technique is to abstract the underlying model\
    \ reliably for specific tasks like prediction and decision making. Optimization\
    \ problems are ubiquitous in machine learning and other domains like engineering\
    \ and a number of specialized techniques for efficiently solving specific problems\
    \ have been developed. However, general purpose techniques like enumerative strategies\
    \ have run time complexity of O(N), where N is the number of domain points. Grover’s\
    \ quantum search algorithm provides quadratic speed up over its classical counter\
    \ parts. Baritompa et al. integrated ideas from Grover’s search into the framework\
    \ of Pure adaptive search and called the new framework as Grover Adaptive search.\
    \ It was further improved by Liu and Koehler. However, GAS was essentially an\
    \ optimization heuristic due to which analytical analysis was difficult."
  fmt: "\nThe Adiabatic quantum optimization algorithm has been developed for solving\
