    An additional input quantum register will be used to provide the constant zero
    amplitudes for non-range elements for non-surjective functions. The `m` + 1 dimensional
    state of this ancillary register will be in, for convenience, `ℋ[C]` = `ℋ(Ω*)`
    with basis {`|y[0]⟩`,`|y[1]⟩`, …, `|y[m]⟩`}. There will also be an additional
    output quantum register to hold the null space garbage for non-injective functions.
    Its `n` + 1 dimensional state is in, for convenience, `ℋ[G]` = `ℋ(Ω∘)` with basis
    {`|x[0]⟩`,`|x[1]⟩`, …, `|x[n]⟩`}. Note that both the input and output spaces have
    dimension (`m`+1)(`n`+1). This is because the ancillary input register is in the
    same space as the regular output register, and the ancillary output register is
    in the same space as the regular input register. This can be confusing because,
    as will be seen, we use the extra output vector `|y[0]⟩` as a constant in the
    ancillary input register, and the extra input vector `|x[0]⟩` appears in the ancillary
    output register.


