    function (a noninjective surjection between these sets). A basis for the nonnull
    space `𝒩(T)`⊥ comprises |`u`[0]⟩ = |0⟩ and the vectors `|u_k⟩ = (|{-kΔx⟩} + |{kΔx⟩})/√2`
