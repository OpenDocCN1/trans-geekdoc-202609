    should be satisfied. The encoding process is shown as follows.


    Initially, `θ[i,j]` (0≤`θ[i,j]`≤2`π`) was created randomly for each of the particle
    of the solution of the population, which was used to produce the quantum state
    namely, `Q^(ℬAT)`. For a particular `t^(th)` generation the quantum state `Q^(ℬAT)(t)`
    was represented as follows.


    `Q^(ℬAT)(t)` = {`q[1]^(ℬATt)`, `q[2]^(ℬATt)`, …, `q[N]^(ℬATt)`}, where `q[i]^(ℬATt)`
    (`i`=1, 2,…, `Psize`) denotes the arbitrary elements of `Q^(ℬAT)(t)` and can be
    represented as


    $q_{i}^{\\mathcal{B}ATt} = \\ \\begin{bmatrix} {\\alpha_{i,1}^{\\mathcal{B}ATt}\\
    \\left| {\\ \\alpha_{i,2}^{\\mathcal{B}ATt}\\ \\left| \\ldots \\right|\\alpha_{i,m}^{\\mathcal{B}ATt}}
    \\right|} \\\\ {\\ \\beta_{i,1}^{\\mathcal{B}ATt}\\left| {\\ \\beta_{i,2}^{\\mathcal{B}ATt}\\
    } \\right|\\ldots\\left| {\\ \\beta_{i,m}^{\\mathcal{B}ATt}} \\right|} \\\\ \\end{bmatrix},\\
