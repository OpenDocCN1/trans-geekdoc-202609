    \ if several have the same maximum amplitude?) An *x[j]* chosen probabilistically\
    \ based on |*p*[*j*]|²? The binary representation of a weighted average, $n^{-\
    \ 1}\\\\sum\\_{j = 1}^{n}p\\_{j}x\\_{j}$? A normalized superposition of all the\
    \ values? The answer is not apparent, so we leave the question open.[⁴](#fn4)\n\
    \n## 2.6 Applications to quantum machine learning\n\nGiven this general ability\
    \ to compute non-unitary and even nonlinear functions by means of topographic\
    \ qubit maps, it is possible to do the operations useful for machine learning\
    \ such as inner products and sigmoid nonlinearities. For example, an inner product\
    \ of *N*\\-dimensional vectors requires *N* multiplications and *N* − 1 additions.\
    \ If |Ω| = *n*, then each multiplication and addition will require approximately\
    \ 2*n*² qubits (Prop. 6), for a total of approximately 2*N*²*n*².\n\nFor one layer\
    \ of a neural network, with say *N* neurons projecting through an *M* × *N* weight\
    \ matrix into *M* neurons, we must do *M* inner products with the input. Since\
    \ crisp sets are represented by computational maps that are basis vectors in the\
    \ computational basis, they can be copied. Therefore, the *N*\\-dimensional input\
    \ vector can be copied *M* − 1 times to do the *M* inner products. (This requires\
    \ *M* − 1 CNOT gates and (*M*−1)*n* ancillary |0⟩ qubits. Overall, one layer requires\
    \ about 2*M**N*²*n*² qubits for the computation (not including ancillary qubits).\n\
    \n## 2.7 Conclusions\n\nTopographic (computational) maps are widely used in the\
    \ brain to implement simultaneous nonlinear vector transformations on multiple\
    \ inputs. In this chapter we have explored two approaches to quantum topographic\
    \ computing with a focus on brain-inspired machine learning applications. The\
    \ first, called a topographic basis map, assigns locations in the map to state\
    \ vectors in a continuous or discrete basis for a quantum Hilbert space. Arbitrary\
    \ functions can be implemented on such maps, which can be interpreted as representing\
    \ crisp sets of inputs, but there is an unavoidable data-dependent attenuation\
    \ of the result (relative to a “garbage” state) that is not easily avoidable.\
    \ The second approach, called a topographic qubit map, assigns a separate qubit\
    \ to each location in the map and uses the relative amplitude of the |1⟩ and |0⟩\
    \ states to represent the presence of values in the (crisp or fuzzy) set represented\
    \ by the map. Arbitrary functions on these maps are implemented by well-known\
    \ quantum logic gates. In particular, computational maps enable the implementation\
    \ of the functions commonly used in artificial neural networks.\n\n## References\n\
