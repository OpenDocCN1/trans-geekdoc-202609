    < `N`}。设 `abs` : `Ω` → `Ω`′ 为绝对值函数（这两个集合之间的非单射满射）。非零空间 `𝒩(T)`⊥ 的一组基由 |`u`[0]⟩
    = |0⟩ 和向量 `|u_k⟩ = (|{-kΔx⟩} + |{kΔx⟩})/√2` 组成（对于 `k` = 1,…, `N` − 1）。（注意，对于 `k`
    ≠ 0，|−`k Δ x`⟩ 和 |`k Δ x`⟩ 是正交向量。）这 `N` 个基向量与陪域元素 |`k Δ x`⟩（对于 `k` = 0,…, `N`
    − 1）之间存在一一对应关系。零度为 `n[o]` = (2`N`−1) − `N` = `N` − 1，零空间的基向量为：


    ```

    |v_k⟩ = (|kΔx⟩ - |-kΔx⟩)/√2   (for k = 1,…,N - 1).

    ```


    投影到该空间保留了区分映射到给定输出的具体原像所需的信息。在这种情况下，它记住输入的符号：注意 ⟨`v_k`|`kΔx`⟩ = +1/√2 且 ⟨`v_k`|-`kΔx`⟩
    = -1/√2。因此，对于输入 |`k Δ x`⟩，正交分量为 |`μ`⟩ = |`u_k`⟩/√2 且 |`ν`⟩ = |`v_k`⟩/√2；对于输入 |−`k
    Δ x`⟩，它们为 |`μ`⟩ = |`u_k`⟩/√2 且 |`ν`⟩ = - |`v_k`⟩/√2。这完成了示例，我们返回到任意非单射满射的构造。

    对于每个 `y`[`i`] ∈ `Ω`′，设 `f^(-1){y[i]}` = {`x` | `f(x)` = `y[i]`} 为 `y[i]` 的原像；这些是定义域
    `Ω` 的不相交子集，对应于 `ℋ` 的正交子空间。设 `n[i]` = |`f^(-1){y[i]}`| 为 `y[i]` 的原像重数，其中 `n` =
    `n`[1] + … + `n`[`m`]。由于不同的 `y[i]` ∈ Im `T` 具有不同的原像重数，将 `f` 分解为 `m` 个常值函数 `f[i]`
    : `f^(-1){y[i]}` → {`y[i]`} 将很方便，对应的图核为：


    ```

    (2.10) T_i = 1/√n_i Σ_{x_j ∈ f^{-1}{y_i}} |y_i⟩⟨x_j| = |y_i⟩ 1/√n_i Σ_{x_j ∈ f^{-1}{y_i}}
    ⟨x_j| = |y_i⟩⟨u_i|,

    ```


    其中我们定义了 `𝒩(T)`⊥ 的以下归一化基向量：


    ```

    (2.11) |u_i⟩ = 1/√n_i Σ_{x_j ∈ f^{-1}{y_i}} |x_j⟩,   i = 1,…,m.

    ```


    常值映射 `T[i]` 在 `ℋ` 的正交子空间上独立作用。

    注意 ⟨`u[i]`|`x[j]`⟩ ≠ 0 当且仅当 `y[i]` = `f(x[j])`，此时 `T[i]` |`x[j]`⟩ = `n[i]^(-1/2)`
    |`y[i]`⟩。（`n[i]^(-1/2)` 因子是为了归一化 |`u[i]`⟩ 所需。）显然 { |`u`[1]⟩,…, |`u`[`m`]⟩ } 是一个
    ON 集合，因为其元素是基向量不相交集合的归一化线性组合。因此，输出向量 |`y[i]`⟩ 与 `𝒩(T)`⊥ 的基向量 |`u[i]`⟩ 之间存在一一对应关系。

    接下来我们刻画 `𝒩(T)` 和 `𝒩(T)`⊥。注意 |`ψ`⟩ ∈ `𝒩(T[i])` 当且仅当 0 = `T[i]` |`ψ`⟩ = |`y[i]`⟩
    ⟨`u[i]`|`ψ`⟩，即当且仅当 ⟨`u[i]`|`ψ`⟩ = 0。因此，`𝒩(T[i])` 是与 |`u[i]`⟩ 正交的 `n` − 1 维子空间，而
    `𝒩(T[i])`⊥ 是由 { |`u[i]`⟩ } 张成的一维子空间。因此 `𝒩(T)`⊥ 由 { |`u`[1]⟩,…, |`u`[`m`]⟩ } 张成。

    算子 `T` 的实现分为两部分，一部分处理表示零空间的分量，另一部分处理表示其正交补、非零空间的分量。第一部分产生“垃圾”，但这是操作可逆从而酉所必需的；第二部分完成计算
    `f` 的工作。

    '
