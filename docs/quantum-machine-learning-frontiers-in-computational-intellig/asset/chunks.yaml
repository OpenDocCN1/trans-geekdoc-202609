    # 3 机器学习中的量子优化


    Ashish Mani ASET, Amity University UP, EEE, ASET, G012A, E-I Block, Sector 125,
    201303, Noida, Uttar Pradesh, India Siddhartha Bhattacharyya 计算机科学与工程系，CHRIST（被视为大学），Hosur
    Road，班加罗尔，卡纳塔克邦，印度 Amlan Chatterjee 加州州立大学多明格斯山分校，计算机科学，加州州立大学，1000，E Victoria，90747，多明格斯山，加利福尼亚，美国


    ### Abstract


    机器学习是人工智能的一个分支，旨在使机器从数据中学习。它正被应用于解决具有海量数据的大量现实世界问题。尽管机器学习得到广泛接受，然而执行时间是机器学习技术实际应用中的主要关注点之一。它主要包括一套通过减少期望或实际结果与估计或预测结果之间的误差来训练模型的技术，该误差通常称为损失函数。因此，机器学习技术的训练通常需要解决一个困难的优化问题，这是整个模型构建过程及其应用中最昂贵的步骤。在不久的将来，减少机器学习技术训练过程执行时间的一种可能解决方案是将其在量子计算机上实现，而不是在经典计算机上实现。人们推测，量子计算机在解决涉及矩阵运算的问题时可能比经典计算机快呈指数级。一些机器学习技术，如支持向量机，大量使用矩阵，通过在量子计算机上实现可以使其更快。然而，它们的有效实现并非易事，并且需要量子存储器的存在。因此，近期另一个可能的解决方案是使用经典量子混合方法，其中机器学习模型在经典计算机上实现，但在训练期间损失函数的优化是在量子计算机上执行，而不是在经典计算机上执行。近年来提出了几种量子优化算法，可分为基于梯度和无梯度优化技术。基于梯度的技术要求所解决的优化问题的性质为凸、连续且可微，否则如果问题是非凸的，则它们只能找到局部最优，而无梯度优化技术即使在非连续、非线性和非凸优化问题上也能很好地工作。本章讨论了一种基于绝热量子计算（AQC）的全局优化技术，用于在不对损失函数的结构和所学习的底层模型施加任何限制的情况下求解损失函数的最小化。此外，还表明在所提出的框架中，基于
    AQC 的方法在解决全局优化问题方面将优于基于电路的方法。


    Keywords: 人工智能，量子计算，非凸优化，


    ## 3.1 Introduction


    人类自上个世纪可编程电子计算设备出现以来就对创造人工智能机器着迷。1956 年，在达特茅斯举办的工作坊中，‘人工智能’一词被创造出来用于‘思考机器’ \[1\]。已经提出了许多使机器智能行为的建议
    \[2\]，但其中大多数都因缺乏有效实现所需的技术而受阻。学习被认为是智能行为的表现，因此能够学习困难任务的机器至少会被视为人工智能。处理涉及数据的学习技术的学科称为机器学习。它试图使计算机从以数据形式表示的过去经验中学习并据此做出可靠的决策。这些技术可以随着新经验的积累而微调其性能。它有助于构建数据驱动模型而非静态精确模型，并在分类、聚类和模式识别等领域得到广泛应用。它在金融服务
    \[3\]、健康服务 \[4\]、营销和销售 \[5\]、社交网络分析 \[6\] 和虚拟个人助理 \[7\] 等现实世界领域得到广泛应用。


