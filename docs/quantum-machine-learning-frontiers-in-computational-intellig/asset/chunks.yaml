    amplitudes to non-range codomain elements, and R and Q bijectively map the remaining
    basis elements.](graphic/converted/b_9783110670707-002_fig_001.jpg)


    Figure 2.1: Permutation of basis vectors to implement non-surjective injections.
    After each component of the kernel, the number of basis vectors that it maps is
    indicated in parentheses; for example, `R` maps (`m`−1)(`n`−1) basis vectors.
    `T` maps function inputs to outputs, `S` maps zero amplitudes to non-range codomain
    elements, and `R` and `Q` bijectively map the remaining basis elements.


    The `S` component ensures that non-range elements of the codomain have preimages
    in the domain. Therefore, let `m[nr]` be the number of codomain elements that
    are not in the range of `f`, that is, `m[nr]` = |`Ω`^′ ∖ Im `f`| = `m` − `n`.
    Call these non-range codomain elements {`z`[1],…,`z`[`m[nr]`]} ⊂ `Ω`^′. Then the
    `S` component is defined:


    (2.6) $S\\overset{def}{=}\\sum\\limits\_{i = 1}^{m\_{nr}}\\left| {z\_{i}\\rangle}
    \\right|v\_{1}\\rangle\\langle x\_{1}|\\langle w\_{i + 1}|.$


    Therefore, `S` is a bijection of an `m[nr]`-dimensional subspace and each non-range
    element |`z`[`i`]`⟩ |`v`[1]⟩ has a unique preimage |`x`[1]⟩ |`w`[`i` + 1]⟩.


    Note that `T` transforms `n` basis vectors (those for which the second register
    is |`w`[1]⟩), and `S` transforms `m[nr]` basis vectors (those for which the first
    register is |`x`[1]⟩ and the second register is one of |`w`[2]⟩, …, |`w`[`m[nr]`
    + 1]⟩), for a total of `n` + `m[nr]` = `m` basis elements, but the input space
    has a total of `mn` basis elements, and the remainder must be bijectively mapped.
    Therefore, to complete the unitary operator we add the following additional components:


    (2.7) $R\\overset{def}{=}\\sum\\limits\_{i = 2}^{m}\\sum\\limits\_{j = 2}^{n}\\left|
    {y\_{i}\\rangle} \\right|v\_{j}\\rangle\\langle x\_{j}|\\langle w\_{i}|,$ (2.8)$Q\\overset{def}{=}\\sum\\limits\_{j
    = 1}^{n - 1}\\left| {y\_{1}\\rangle} \\right|v\_{j + 1}\\rangle\\langle x\_{1}|\\langle
    w\_{m\_{nr} + j}|.$


    `R` maps (`m`−1)(`n`−1) basis elements: those for `i` ≠ 1 and `j` ≠ 1, that is,
    those with neither |`x`[1]⟩ in the first register nor |`w`[1]⟩ in the second.
    `Q` maps the remaining `n` − 1 basis elements: those which have |`x`[1]⟩ in the
    first register and |`w`[`m[nr]` + 1]⟩ to |`w`[`m[nr]` + `n`]`⟩ in the second (recall
    that `m` = `m[nr]` + `n`).

