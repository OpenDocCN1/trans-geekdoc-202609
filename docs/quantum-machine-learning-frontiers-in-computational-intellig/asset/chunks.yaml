    基于绝热量子计算框架的一种新型量子优化算法，该算法采用局部演化而非全局演化，已被提出。它还受到了 Grover 搜索算法在数据库中寻找最小解应用的启发，然而，所提出的算法解决的是实际领域的优化问题，这些问题通常在机器学习算法中被解决。此外，所提出的算法已进行了分析性分析，并被证明具有与
    Grover 搜索算法相同的二次加速特征。Baritompa 等人曾在基于门的量子计算模型上为解决无约束全局优化问题做过类似的尝试。然而，所提出的基于 AQC
    的算法在概念上优于基于门的模型，因为不存在超调最优解的风险，而这是在事先不知道最优解数量的情况下基于门模型的主要担忧，而最优解被编码为问题哈密顿量的基态。基于门模型的超调问题可能会进一步增加实际实现中的收敛时间。


    今后，我们希望开发一个混合经典与绝热量子计算机的模拟器和架构，以便在该平台上演示我们提出的用于机器学习技术的量子优化算法的操作，这将需要解决若干具有挑战性的问题，例如在量子计算机上实现损失函数以及学习机制中的权重更新。


