    ## 摘要


    量子机器学习（QML）通常被认为是将量子物理学（QP）和机器学习（ML）相结合的整合方法。本章概述了与量子机器学习相关的基本思想和特征。本章讨论了量子算法的不同方面。此外，本章还提供了量子强化学习和量子退火的基本特征。最后，本章讨论了量子神经网络的进展，以阐明
    QML 的方向。


    关键词: machine learning, Grover’s Search Algorithm, reinforcement learning, quantum
