    The objective of amplitude encoding based machine learning algorithms \[[9](#bodymatter-004.xhtml#b_9783110670707-004_ref_009),
    [11](#bodymatter-004.xhtml#b_9783110670707-004_ref_011), [20](#bodymatter-004.xhtml#b_9783110670707-004_ref_020),
    [33](#bodymatter-004.xhtml#b_9783110670707-004_ref_033), [36](#bodymatter-004.xhtml#b_9783110670707-004_ref_036),
    [37](#bodymatter-004.xhtml#b_9783110670707-004_ref_037), [38](#bodymatter-004.xhtml#b_9783110670707-004_ref_038),
    [39](#bodymatter-004.xhtml#b_9783110670707-004_ref_039), [40](#bodymatter-004.xhtml#b_9783110670707-004_ref_040)\]
    is to articulate quantum machine learning algorithms whose resources grow in polynomial
    runtime with the `n` qubits, and expands to a logarithmic growth with amplitudes
    and thus the input dimension. Many `QML` algorithms based on this approach uses
    the speedup advantages by solving a system of linear equations quantum mechanically
    \[[20](#bodymatter-004.xhtml#b_9783110670707-004_ref_020)\]. Quantum matrix inversion
    is one of the main core processes in solving the system of linear equations exponentially
    faster than the classical counterpart. Some of the notable quantum machine learning
    algorithms based on amplitude encoding approach are the `quantum support vector
    machine` \[[21](#bodymatter-004.xhtml#b_9783110670707-004_ref_021), [22](#bodymatter-004.xhtml#b_9783110670707-004_ref_022),
    [23](#bodymatter-004.xhtml#b_9783110670707-004_ref_023)\] and `least-square linear
    regression` \[[37](#bodymatter-004.xhtml#b_9783110670707-004_ref_037), [38](#bodymatter-004.xhtml#b_9783110670707-004_ref_038)\].


    ## 4.4.2 Grover’s search-based approaches

    Machine learning algorithms based on `Grover`’s search algorithms, which use the
    technique of `amplitude amplification` to unfold an unstructured search problem
    with a quadratic runtime speedup, apply Grover’s search subroutine to solve a
    larger problem. `Quantum K-Means` \[[25](#bodymatter-004.xhtml#b_9783110670707-004_ref_025)\],
    `K-Median` \[[41](#bodymatter-004.xhtml#b_9783110670707-004_ref_041)\], and `k-nearest
    neighbors` \[[42](#bodymatter-004.xhtml#b_9783110670707-004_ref_042)\] are some
    of the machine learning algorithms which use Grover’s search algorithms as a subroutine
    to solve the machine learning task. Another recent use of the Grove’s search subroutine
    is in training the `perceptron` \[[43](#bodymatter-004.xhtml#b_9783110670707-004_ref_043)\].


    ## 4.4.3 Quantum annealing based approaches

    Very recently, some experiments have been done based on `quantum annealing` \[[44](#bodymatter-004.xhtml#b_9783110670707-004_ref_044)\].
    In this work, the researchers used a quantum annealer to classify and rank the
    transcription factors binding to study how the proteins (in a gene) identify and
    specifically bind to their DNA targets. The researchers used the `D-Wave` system
    to implement the quantum annealing algorithm. Here, the machine learning techniques
    have been the effective tools to disclose interaction mechanism at the genetic
    level.


    ## 4.5 Recent progress in quantum machine learning algorithms

    The research in developing quantum machine learning algorithms has exponentially
    grown in recent years, and day by day new interesting quantum machine learning
    algorithms are being published. Here, we are covering the most ground-breaking
    and popular algorithms which demonstrated significant state-of-the-art performances
    as compared to their classical counterparts.


    ### 4.5.1 Quantum binary least square support vector machine

    The `quantum binary least square support vector machine` is a break-through in
    the field of `QML`, where the authors, Rebentrost et al. \[[21](#bodymatter-004.xhtml#b_9783110670707-004_ref_021)\],
    demonstrated an exponential speedup gain in support vector machine formulation.

    In the least square `SVM`, the optimization problem is transformed into a system
    of linear equations which encompasses the `kernel matrix` for solving the optimization
    problem. We solve the system of linear equations in a much faster way by solving
    the least squares formulation and speeding up the kernel matrix calculations.
    The following areas where we take the quantum advantages to improve the performance
    of the `SVM` are:

    1. Data preparation with quantum random access memory (`QRAM`) – One of the challenging
    tasks in quantum machine learning is to prepare the data set for feeding into
    the quantum systems for processing. `QRAM` helps in preparing the classical data
    set into the quantum form. `QRAM` takes `O(log[2] d)` steps to query the information
    from memory for reconstructing a state, where `d` is the dimension of the feature
    vector.

    2. Kernel matrix calculation – The dot product evaluation plays the main role
    in the kernel matrix calculation. So, if we get the speed up advantages in the
    dot product evaluation in the quantum formulation, it will imply overall speedup
    gain in the kernel matrix calculation. In \[[35](#bodymatter-004.xhtml#b_9783110670707-004_ref_035)\],
    authors have discussed the faster way to do dot product calculation with the help
    of quantum properties. Also, the exponentiation of the inverse of the normalized
    kernel matrix `K^(-1)` is performed in a quantum paradigm. As we have discussed
    earlier, `QRAM` takes only `O(log[2] d)` steps to query for reconstructing a state,
    thus a single dot product with `QRAM` takes `O(ϵ^(-1) log[2] d)` steps, where
    `ϵ` is the accuracy.

    3. Least square formulation – The speedup gain is possible during the training
    phase because of the quantum mechanical implementation of the exponentially faster
    eigenvector formulation in the non-sparse density matrices \[[35](#bodymatter-004.xhtml#b_9783110670707-004_ref_035)\],
    the sparse matrix simulation \[[45](#bodymatter-004.xhtml#b_9783110670707-004_ref_045)\],
    and the matrix inversion algorithm \[[35](#bodymatter-004.xhtml#b_9783110670707-004_ref_035)\].

    The least square `SVM` is represented as the following formulation:

    ```

    (4.24)$\widehat{F}(\left| {b,\ \overrightarrow{\alpha}\rangle) =} \right|\overrightarrow{y}\rangle,\
    \widehat{F} = \begin{bmatrix} 0 & 1^{T} \\ 1 & {K + \gamma^{- 1}I} \\ \end{bmatrix},$

    ```

    where `\widehat{F} = \frac{F}{trF}` is the normalized `F`, and `trF` is a trace
    of `F`. The target is to solve the optimization problem, `F̂(|b, α⃗⟩)=|y⃗⟩`, for
    the parameters `b` and `α⃗`. Here, `K` is the kernel matrix.


    ### 4.5.2 Quantum multiclass support vector machine

    The `SVM` is a binary class classification algorithm. To handle multiclass classification,
    we use `one-against-all` and `all-pair` algorithms. The quantum multiclass support
    vector machine (`SVM`) is the generalized version of the quantum binary `SVM`.
    In \[[23](#bodymatter-004.xhtml#b_9783110670707-004_ref_023)\], the authors discussed
    two techniques: the quantum version of the `one-against-all` as well as the quantum
    version of `all-pair` algorithms. In `one-against-all`, we first construct and
    train `k` binary classifiers and then each of these classifiers classify a given
    unknown input. The class for which the corresponding classifier’s probability
    confidence score is the highest, is selected as the predicted class. In `all-pair`,
    we construct `k(k-1)/2` classifiers. Each classifier is trained with a dataset
    which contains one primary class data and the rest of the data for another class,
    i.e., we make pairwise datasets and train the classifiers, resulting in `k(k-1)/2`
    total classifiers. When an unknown input is to get predicted, these all `k(k-1)/2`
    classifiers predict the class for the given input and by applying voting mechanism
    we select the class to be predicted. The following algorithms show the quantum
    version of these two approaches, for detail explanations please refer to \[[22](#bodymatter-004.xhtml#b_9783110670707-004_ref_022),
    [23](#bodymatter-004.xhtml#b_9783110670707-004_ref_023)\].


