    In this example, IERC20 is an interface for the ERC-20 token standard, defining
    the essential functions that any ERC-20 token contract must implement. These functions
    include transferring tokens, checking balances, and approving allowances. By adhering
    to this interface, different token contracts can ensure they provide a consistent
    set of functionalities, allowing them to interact with other contracts and applications
    that recognize the ERC-20 standard.


    Abstract Contracts


    Abstract contracts in Solidity serve as base contracts that define functions without
    implementing all of them. Unlike interfaces, abstract contracts can contain both
    implemented and unimplemented (abstract) functions. They can also include state
    variables and modifiers. Abstract contracts are used to share common logic and
    functionality among derived contracts while leaving certain functions to be defined
    by the inheriting contracts.


    abstract contract AbstractToken {


    function totalSupply() public view virtual returns (uint256);


    function balanceOf(address account) public view virtual returns (uint256);


    function transfer(address recipient, uint256 amount) public virtual returns (bool);


    mapping(address => uint256) internal balances;


    function \_transfer(address sender, address recipient, uint256 amount) internal
    {


    require(balances\[sender\] >= amount, "Insufficient balance");


    balances\[sender\] -= amount;


    balances\[recipient\] += amount;


    }


    }


    In this example, AbstractToken is an abstract contract that defines several virtual
    functions (totalSupply, balanceOf, and transfer) without providing their implementations.
    It also includes an internal \_transfer function that performs the actual transfer
    logic and updates balances. Derived contracts must implement the abstract functions
    to complete the contract.


    Combining Interfaces and Abstract Contracts


    Combining interfaces and abstract contracts allows developers to define clear,
    modular, and reusable contract architectures. Interfaces ensure that contracts
    conform to expected behaviors, while abstract contracts provide shared logic and
    structure. This approach promotes code reuse and simplifies the development of
    complex smart contract systems.


    contract MyToken is AbstractToken, IERC20 {


    uint256 private \_totalSupply;


    constructor(uint256 initialSupply) {


    \_totalSupply = initialSupply;


    balances\[msg.sender\] = initialSupply;


    }


    function totalSupply() public view override returns (uint256) {


    return \_totalSupply;


    }


    function balanceOf(address account) public view override returns (uint256) {


    return balances\[account\];


    }


    function transfer(address recipient, uint256 amount) public override returns (bool)
    {


    \_transfer(msg.sender, recipient, amount);


    return true;


    }


    }


    In this MyToken contract, the ERC-20 interface (IERC20) is implemented along with
    the AbstractToken abstract contract. The MyToken contract provides the implementations
    for the abstract functions, leveraging the shared logic in AbstractToken and ensuring
    compatibility with the ERC-20 standard defined by IERC20.


    By using interfaces and abstract contracts, Solidity developers can create modular
    and interoperable smart contract systems that enhance maintainability, flexibility,
    and integration across the Ethereum blockchain.


    Chapter 3: Advanced Solidity Concepts


    1.​Inheritance and Interfaces


    Contract Inheritance


    Inheritance is a powerful feature in Solidity that allows developers to create
    new contracts based on existing ones. This capability enables the reuse of code,
    enhances modularity, and promotes the development of robust and maintainable smart
    contract systems. By inheriting from one or more base contracts, a derived contract
    can access and extend the functionality of the parent contracts, facilitating
    code sharing and reducing redundancy.


    Basic Inheritance


    In Solidity, a contract can inherit from another contract using the is keyword.
    The derived contract inherits all the state variables, functions, and modifiers
    from the base contract. This allows developers to build on top of existing contracts
    without rewriting common logic, making the code more modular and easier to maintain.


    contract BaseContract {


    uint256 public baseValue;


    function setBaseValue(uint256 \_value) public {


    baseValue = \_value;


    }


    }


    contract DerivedContract is BaseContract {


    function incrementBaseValue() public {


    baseValue += 1;


    }


    }


    In this example, DerivedContract inherits from BaseContract. It can access and
    modify baseValue, a state variable declared in BaseContract, and it also inherits
    the setBaseValue function. Additionally, DerivedContract introduces a new function,
    incrementBaseValue, which builds upon the inherited state and functionality.


    Multi-level and Multiple Inheritance


    Solidity supports multi-level inheritance, where a contract inherits from a base
    contract that itself inherits from another base contract. This hierarchical structure
    allows the creation of complex inheritance chains, promoting extensive code reuse.


    contract GrandparentContract {


    function greet() public pure returns (string memory) {


    return "Hello from Grandparent";


    }


    }


    contract ParentContract is GrandparentContract {


    function greetParent() public pure returns (string memory) {


    return "Hello from Parent";


    }


    }


    contract ChildContract is ParentContract {


    function greetChild() public pure returns (string memory) {


    return "Hello from Child";


    }


    }


    In this example, ChildContract inherits from ParentContract, which in turn inherits
    from GrandparentContract. ChildContract has access to functions from both ParentContract
    and GrandparentContract, allowing it to utilize their functionalities and add
    its own.


    Solidity also supports multiple inheritance, where a contract can inherit from
    multiple base contracts. This enables combining functionalities from different
    contracts into a single derived contract. However, it requires careful management
    to avoid conflicts, especially with functions that have the same signature.


    contract A {


    function sayHello() public pure returns (string memory) {


    return "Hello from A";


    }


    }


    contract B {


    function sayHello() public pure returns (string memory) {


    return "Hello from B";


    }


    }


    contract C is A, B {


    function sayHello() public pure override(A, B) returns (string memory) {


    return super.sayHello();


    }


    }


    In this example, C inherits from both A and B, which both define a sayHello function.
    To resolve the conflict, C overrides the sayHello function and explicitly calls
    the super keyword to specify which base contract’s implementation to use. The
    override keyword indicates that the function overrides multiple base functions.


    Virtual Functions and Overriding


    To facilitate flexible inheritance, Solidity allows functions to be declared as
    virtual in base contracts, indicating that derived contracts can override them.
    The overriding functions in derived contracts must use the override keyword.


    contract Base {


    function sayHello() public pure virtual returns (string memory) {


    return "Hello from Base";


    }


    }


    contract Derived is Base {


    function sayHello() public pure override returns (string memory) {


    return "Hello from Derived";


    }


    }


    In this example, Base declares a virtual function sayHello, which is overridden
    by Derived to provide a different implementation. This mechanism allows developers
    to customize inherited functions to suit specific requirements while preserving
    the overall contract architecture.


    By leveraging inheritance, Solidity developers can create modular, reusable, and
    extensible smart contracts that promote efficient code management and scalability
    on the Ethereum blockchain. Understanding and utilizing inheritance effectively
    is crucial for building sophisticated decentralized applications with shared functionality
    and minimal code duplication.


