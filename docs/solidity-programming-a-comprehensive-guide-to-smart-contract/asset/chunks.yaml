- raw: '1.  Code Reusability: Libraries promote the reuse of code across multiple
    contracts, reducing redundancy and simplifying contract maintenance.


    2.  Modularity: By encapsulating common functionalities in libraries, developers
    can create more modular and organized codebases.


    3.  Gas Efficiency: Libraries can be more gas-efficient than using inline code,
    especially when the same logic is used in multiple places. Once deployed, the
    library''s code does not need to be duplicated in each contract, saving on deployment
    and execution costs.


    4.  Security: Libraries can enhance security by centralizing critical logic, making
    it easier to audit and update.


    Deploying and Linking Libraries


    To use a library in your contracts, you need to deploy it to the blockchain and
    then link it to your contracts. This process involves two steps: deploying the
    library and then deploying the contract that uses the library, ensuring the library''s
    address is correctly referenced.


    pragma solidity ^0.8.0;


    library SafeMath {


    function safeAdd(uint256 a, uint256 b) internal pure returns (uint256) {


    uint256 c = a + b;


    require(c >= a, "Addition overflow");


    return c;


    }


    }


    contract MyContract {


    using SafeMath for uint256;


    uint256 public total;


    function add(uint256 value) public {


    total = total.safeAdd(value);


    }


    }


    When deploying MyContract, you must ensure that the SafeMath library is already
    deployed and its address is linked to MyContract. Most development frameworks
    like Truffle and Hardhat automate this process, making it seamless for developers.


    By understanding and effectively using libraries, Solidity developers can create
    more robust, efficient, and maintainable smart contracts, leveraging the power
    of modular and reusable code.


    Defining Custom Errors


    In Solidity, defining custom errors is a crucial practice for enhancing the readability
    and efficiency of smart contract code. Custom errors provide a more informative
    and efficient way to handle and report errors, compared to using traditional error-handling
    methods like require statements with revert messages. Introduced in Solidity 0.8.4,
    custom errors help save gas by reducing the storage and transaction costs associated
    with error reporting.


    Defining Custom Errors


    Custom errors are defined using the error keyword followed by the error name and
    optional parameters. These errors are declared at the top level of the contract,
    similar to event declarations. They provide a way to specify detailed and context-specific
    error messages that can include information about the state or the arguments that
    caused the error.


    // SPDX-License-Identifier: MIT


    pragma solidity ^0.8.4;


    contract ExampleContract {


    uint256 public totalSupply;


    mapping(address => uint256) public balances;


    error InsufficientBalance(uint256 requested, uint256 available);


    function transfer(address recipient, uint256 amount) public {


    uint256 senderBalance = balances\[msg.sender\];


    if (senderBalance < amount) {


    revert InsufficientBalance({


    requested: amount,


    available: senderBalance


    });


    }


    balances\[msg.sender\] -= amount;


    balances\[recipient\] += amount;


    }


    }


    In this example, the custom error InsufficientBalance is defined with two parameters:
    requested and available. This error provides detailed information about the attempted
    transaction and the available balance when the error is thrown. When the transfer
    function encounters an insufficient balance, it uses the revert statement to throw
    the InsufficientBalance error with the relevant data.


    Advantages of Custom Errors


    1.  Gas Efficiency: Custom errors are more gas-efficient compared to string-based
    revert messages. Since they are stored as encoded data rather than strings, they
    reduce the amount of data that needs to be stored and transmitted, saving on gas
    costs.


    2.  Enhanced Debugging: Custom errors provide more detailed and specific information
    about what went wrong, making it easier to debug and understand the source of
    the error. This specificity helps developers identify issues more quickly and
    accurately.


    3.  Better Contract Design: Using custom errors encourages better contract design
    by making error handling an explicit part of the contract''s interface. This clarity
    leads to more robust and maintainable code.


    4.  Consistency: Custom errors provide a consistent way to handle errors across
    different functions and contracts. This uniformity simplifies the error-handling
    logic and improves the overall readability of the code.


    Using Custom Errors in Practice


    Custom errors can be used in various parts of a contract, such as within require
    statements, complex condition checks, and multi-step transactions. They are particularly
    useful in scenarios where detailed information about the failure is essential
    for understanding and resolving issues.


    error UnauthorizedAccess(address caller);


    function restrictedFunction() public {


    if (msg.sender != owner) {


    revert UnauthorizedAccess(msg.sender);


    }


    // Function logic here


    }


    In this example, the UnauthorizedAccess error is used to handle unauthorized access
    attempts. The error includes the address of the caller, providing clear information
    about who attempted the restricted action.


    By adopting custom errors, Solidity developers can create more efficient, informative,
    and maintainable smart contracts. This approach not only reduces gas costs but
    also enhances the clarity and robustness of error-handling mechanisms, contributing
    to the overall quality of the contract code.


    3.​Events and Logging


    Emitting Events


    Emitting events in Solidity is a crucial mechanism for logging information and
    communicating with external applications. Events are a way for smart contracts
    to log significant occurrences that can be monitored and acted upon by external
    observers, such as decentralized applications (DApps) and blockchain explorers.
    Events provide an efficient and reliable way to record and track state changes,
    making them indispensable for various use cases, including transaction tracking,
    audit trails, and triggering off-chain actions.


    Defining and Emitting Events


    Events in Solidity are defined using the event keyword, followed by the event
    name and its parameters. Parameters can be indexed to facilitate efficient searching
    and filtering in event logs. Once defined, events can be emitted within functions
    using the emit keyword.


    // SPDX-License-Identifier: MIT


    pragma solidity ^0.8.0;


    contract Token {


    mapping(address => uint256) public balances;


    event Transfer(address indexed from, address indexed to, uint256 value);


    function transfer(address to, uint256 amount) public {


    require(balances\[msg.sender\] >= amount, "Insufficient balance");


    balances\[msg.sender\] -= amount;


    balances\[to\] += amount;


    emit Transfer(msg.sender, to, amount);


    }


    }


    In this example, the Transfer event is defined with three parameters: from, to,
    and value. The indexed keyword is used for the from and to parameters to make
    these fields searchable in the event logs. The transfer function emits the Transfer
    event after updating the balances, providing a transparent and traceable record
    of the transaction.


    Benefits of Emitting Events


    1.  Transaction Logs: Events create a permanent record of important actions and
    state changes within a contract. These logs are stored on the blockchain and can
    be accessed by external applications and services, enabling comprehensive transaction
    tracking and auditing.


    2.  Efficient Data Retrieval: Indexed event parameters allow for efficient filtering
    and retrieval of specific events from the blockchain. This capability is particularly
    valuable for applications that need to monitor and react to specific activities,
    such as token transfers or contract state changes.'
  fmt: "\n# 代码复用性、模块化、Gas 效率与安全性\n\n1.  **代码复用性**：库促进了跨多个合约的代码复用，减少了冗余并简化了合约维护。\n\
    2.  **模块化**：通过将通用功能封装在库中，开发者可以创建更模块化、更有条理的代码库。\n3.  **Gas 效率**：库比使用内联代码更节省 Gas，尤其是当相同逻辑在多处使用时。库部署一次后，其代码无需在每个合约中重复，从而节省部署和执行成本。\n\
    4.  **安全性**：库通过集中化关键逻辑来增强安全性，使其更易于审计和更新。\n\n# 部署与链接库\n\n要在合约中使用库，你需要将其部署到区块链，然后将其链接到你的合约。此过程包含两个步骤：部署库，然后部署使用该库的合约，确保正确引用库的地址。\n\
    \n```solidity\npragma solidity ^0.8.0;\n\nlibrary SafeMath {\n\n    function safeAdd(uint256\
    \ a, uint256 b) internal pure returns (uint256) {\n        uint256 c = a + b;\n\
    \        require(c >= a, \"Addition overflow\");\n        return c;\n    }\n\n\
    }\n\ncontract MyContract {\n\n    using SafeMath for uint256;\n\n    uint256 public\
    \ total;\n\n    function add(uint256 value) public {\n        total = total.safeAdd(value);\n\
    \    }\n\n}\n```\n\n部署 `MyContract` 时，必须确保 `SafeMath` 库已部署且其地址已链接到 `MyContract`。大多数开发框架（如\
    \ `Truffle` 和 `Hardhat`）会自动完成此过程，使开发者能无缝衔接。\n\n通过理解并有效使用库，Solidity 开发者可以创建更健壮、高效且易于维护的智能合约，利用模块化和可复用代码的力量。\n\
    \n# 定义自定义错误\n\n在 Solidity 中，定义自定义错误是提升智能合约代码可读性和效率的关键实践。与使用带有回滚消息的 `require` 语句等传统错误处理方法相比，自定义错误提供了更具信息量且更高效的错误处理和报告方式。自定义错误于\
    \ Solidity 0.8.4 引入，通过减少错误报告相关的存储和交易成本来节省 Gas。\n\n## 定义自定义错误\n\n自定义错误使用 `error`\
    \ 关键字定义，后跟错误名称和可选参数。这些错误在合约顶层声明，类似于事件声明。它们提供了一种指定详细且上下文相关的错误消息的方式，这些消息可包含导致错误的状态或参数信息。\n\
    \n```solidity\n// SPDX-License-Identifier: MIT\npragma solidity ^0.8.4;\n\ncontract\
    \ ExampleContract {\n\n    uint256 public totalSupply;\n    mapping(address =>\
    \ uint256) public balances;\n\n    error InsufficientBalance(uint256 requested,\
    \ uint256 available);\n\n    function transfer(address recipient, uint256 amount)\
    \ public {\n        uint256 senderBalance = balances[msg.sender];\n        if\
    \ (senderBalance < amount) {\n            revert InsufficientBalance({\n     \
    \           requested: amount,\n                available: senderBalance\n   \
    \         });\n        }\n        balances[msg.sender] -= amount;\n        balances[recipient]\
    \ += amount;\n    }\n\n}\n```\n\n在此示例中，自定义错误 `InsufficientBalance` 定义了两个参数：`requested`\
    \ 和 `available`。当抛出错误时，该错误提供关于尝试交易和可用余额的详细信息。当 `transfer` 函数遇到余额不足时，它使用 `revert`\
    \ 语句抛出带有相关数据的 `InsufficientBalance` 错误。\n\n## 自定义错误的优势\n\n1.  **Gas 效率**：自定义错误比基于字符串的回滚消息更节省\
    \ Gas。因为它们作为编码数据存储而非字符串，减少了需存储和传输的数据量，从而节省 Gas 成本。\n2.  **增强调试**：自定义错误提供更详细、具体的故障信息，使调试和理解错误来源更容易。这种特异性帮助开发者更快、更准确地定位问题。\n\
    3.  **更好的合约设计**：使用自定义错误通过将错误处理作为合约接口的显式部分，鼓励更好的合约设计。这种清晰度带来了更健壮、可维护的代码。\n4.  **一致性**：自定义错误为跨不同函数和合约处理错误提供了一致的方式。这种统一性简化了错误处理逻辑，提高了代码整体可读性。\n\
    \n## 实践中使用自定义错误\n\n自定义错误可用于合约的各个部分，如 `require` 语句中、复杂条件检查中和多步交易中。在需要详细故障信息以理解和解决问题的场景中，它们特别有用。\n\
    \n```solidity\nerror UnauthorizedAccess(address caller);\n\nfunction restrictedFunction()\
    \ public {\n    if (msg.sender != owner) {\n        revert UnauthorizedAccess(msg.sender);\n\
    \    }\n    // Function logic here\n}\n```\n\n在此示例中，`UnauthorizedAccess` 错误用于处理未授权访问尝试。该错误包含调用者的地址，提供了关于谁尝试了受限操作的清晰信息。\n\
    \n通过采用自定义错误，Solidity 开发者可以创建更高效、信息丰富且易于维护的智能合约。这种方法不仅降低了 Gas 成本，还增强了错误处理机制的清晰度和健壮性，有助于提升合约代码的整体质量。\n\
    \n# 事件与日志\n\n## 触发事件\n\n在 Solidity 中触发事件是记录信息和与外部应用通信的关键机制。事件是智能合约记录重要发生情况的一种方式，这些情况可被外部观察者（如去中心化应用\
    \ DApps 和区块链浏览器）监控和响应。事件提供了一种高效可靠的方式来记录和追踪状态变更，使其在交易追踪、审计追踪和触发链下操作等各种用例中不可或缺。\n\
    \n## 定义与触发事件\n\nSolidity 中的事件使用 `event` 关键字定义，后跟事件名称及其参数。参数可标记为 `indexed` 以便在事件日志中高效搜索和过滤。定义后，可在函数内使用\
    \ `emit` 关键字触发事件。\n\n```solidity\n// SPDX-License-Identifier: MIT\npragma solidity\
    \ ^0.8.0;\n\ncontract Token {\n\n    mapping(address => uint256) public balances;\n\
    \n    event Transfer(address indexed from, address indexed to, uint256 value);\n\
    \n    function transfer(address to, uint256 amount) public {\n        require(balances[msg.sender]\
    \ >= amount, \"Insufficient balance\");\n        balances[msg.sender] -= amount;\n\
    \        balances[to] += amount;\n        emit Transfer(msg.sender, to, amount);\n\
    \    }\n\n}\n```\n\n在此示例中，`Transfer` 事件定义了三个参数：`from`、`to` 和 `value`。`indexed`\
    \ 关键字用于 `from` 和 `to` 参数，使这些字段在事件日志中可搜索。`transfer` 函数在更新余额后触发 `Transfer` 事件，提供交易的透明且可追溯记录。\n\
    \n## 触发事件的益处\n\n1.  **交易日志**：事件创建了合约内重要操作和状态变更的永久记录。这些日志存储在区块链上，可被外部应用和服务访问，实现全面的交易追踪和审计。\n\
    2.  **高效数据检索**：`indexed` 事件参数允许从区块链高效过滤和检索特定事件。此功能对需要监控和响应特定活动（如代币转账或合约状态变更）的应用尤为宝贵。\n"
