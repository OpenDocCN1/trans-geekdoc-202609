    Chapter 2: Solidity Basics


    1.​Syntax and Structure


    Basic Syntax and Data Types


    Solidity, the primary programming language for writing smart contracts on the
    Ethereum blockchain, features a syntax similar to JavaScript and C++, making it
    accessible for developers familiar with these languages. Solidity is statically
    typed, meaning that data types are specified at compile time. This ensures that
    type-related errors are caught early in the development process, enhancing code
    reliability and security.


    Basic Syntax


    Solidity code is organized into contracts, which are the fundamental building
    blocks of Ethereum applications. A contract is analogous to a class in object-oriented
    programming. Here''s a simple example of a Solidity contract:


    // SPDX-License-Identifier: MIT


    pragma solidity ^0.8.0;


    contract SimpleStorage {


    uint256 storedData;


    function set(uint256 x) public {


    storedData = x;


    }


    function get() public view returns (uint256) {


    return storedData;


    }


    }


    In this example, the pragma directive specifies the Solidity compiler version.
    The contract keyword is used to define a new contract named SimpleStorage. This
    contract has a state variable storedData, and two functions set and get to modify
    and retrieve the value of storedData, respectively.


    Data Types


    Solidity supports several basic data types, each serving a specific purpose. Here
    are some of the most commonly used types:


    *   Booleans: Used to represent true or false values.


    bool isReady = true;


    Integers: Solidity supports signed (int) and unsigned (uint) integers of various
    sizes (e.g., int8, uint256). By default, uint is an alias for uint256.


    uint256 count = 1;


    int256 balance = -10;


    Addresses: Represents Ethereum addresses, commonly used to track account balances
    and send transactions.


    address recipient = 0xAbC1234567890abcdef1234567890abcdef123456;


    Strings and Bytes: Strings represent text, while byte arrays (bytes) represent
    sequences of bytes. Solidity also has fixed-size byte arrays (bytes1 to bytes32).


    string name = "Alice";


    bytes32 data = "0x1234567890abcdef";


    Arrays and Structs: Arrays can be of fixed or dynamic size. Structs allow grouping
    of variables.


    uint256\[\] numbers; // Dynamic array


    struct Person {


    string name;


    uint256 age;


    }


    Mappings: Similar to hash tables or dictionaries in other languages, mappings
    store key-value pairs. They are especially useful for associating addresses with
    data.


    mapping(address => uint256) balances;


    Control Structures


    Solidity includes familiar control structures such as if, else, while, for, and
    switch (in recent versions). These structures are used to control the flow of
    execution within contracts.


    function example(uint256 x) public pure returns (uint256) {


    if (x < 10) {


    return x \* 2;


    } else {


    return x / 2;


    }


    }


    Understanding the basic syntax and data types of Solidity is crucial for writing
    robust smart contracts. With a strong foundation in these fundamentals, developers
    can create more complex and secure decentralized applications on the Ethereum
    blockchain.


    Functions and Modifiers


    Functions in Solidity are fundamental building blocks that define the behavior
    and logic of smart contracts. They allow contracts to perform various operations,
    including modifying state variables, interacting with other contracts, and handling
    user inputs. Functions in Solidity can be of different types based on their visibility
    and mutability, providing a robust framework for controlling access and ensuring
    secure interactions.


    #### Functions


    A function in Solidity is defined using the function keyword followed by its name,
    parameters, visibility, and a body. Here’s an example of a simple function in
    a Solidity contract:


    function set(uint256 x) public {


    storedData = x;


    }


    In this example, the set function takes a single parameter x and assigns it to
    the state variable storedData. The public keyword indicates that this function
    can be called both internally within the contract and externally by other contracts
    or users.


    Functions can also specify return types:


    function get() public view returns (uint256) {


    return storedData;


    }


    The get function here is marked as view, indicating that it does not modify the
    state of the contract. It returns the value of storedData. Solidity also supports
    pure functions, which neither read nor modify the state, making them useful for
    computations that rely solely on input parameters.


    Function Visibility


    Solidity provides four types of visibility for functions:


    *   public: Accessible from within the contract, derived contracts, and externally.


    *   private: Accessible only within the contract that defines the function.


    *   internal: Accessible within the contract and derived contracts.


    *   external: Accessible only from external calls, not from within the same contract.


    function \_internalFunction() internal {


    // Logic here


    }


    function \_privateFunction() private {


    // Logic here


    }


    Function Modifiers


    Modifiers are a powerful feature in Solidity that allow you to change the behavior
    of functions in a declarative way. They are often used to apply preconditions,
    such as ensuring that certain conditions are met before a function executes. Modifiers
    are defined using the modifier keyword:


    modifier onlyOwner() {


    require(msg.sender == owner, "Not the contract owner");


    \_;


    }


    In this example, onlyOwner is a modifier that checks if the function caller (msg.sender)
    is the contract owner. The \_ symbol is a placeholder representing the body of
    the function that the modifier is applied to. Here’s how you apply the modifier
    to a function:


    function changeOwner(address newOwner) public onlyOwner {


    owner = newOwner;


    }


    function changeOwner(address newOwner) public onlyOwner {


    owner = newOwner;


    }


    In this example, onlyOwner is a modifier that checks if the function caller (msg.sender)
    is the contract owner. The \_ symbol is a placeholder representing the body of
    the function that the modifier is applied to. Here’s how you apply the modifier
    to a function:


    The changeOwner function can only be called by the current owner of the contract.
    If msg.sender is not the owner, the function call will be reverted with the error
    message "Not the contract owner".


    Combining Functions and Modifiers


    Modifiers can be stacked, enabling the application of multiple preconditions:


    modifier onlyWhileOpen() {


    require(now <= deadline, "Deadline has passed");


    \_;


    }


    function withdraw() public onlyOwner onlyWhileOpen {


    // Withdrawal logic here


    }


    In this example, the withdraw function can only be called by the owner and only
    if the current time (now) is before the deadline. If either condition fails, the
    function will not execute.


    Functions and modifiers are integral to writing secure and efficient smart contracts
    in Solidity. Functions encapsulate the logic and behavior of contracts, while
    modifiers enforce preconditions and enhance code reusability. By understanding
    and leveraging these features, developers can build robust decentralized applications
    on the Ethereum blockchain.


