  fmt: "\n# Solidity Interfaces, Abstract Contracts, and Inheritance\n\n## Interfaces\n\
    \n```solidity\ninterface IERC20 {\n    function transferFrom(address sender, address\
    \ recipient, uint256 amount) external returns (bool);\n}\n```\n\nIn this example,\
    \ `IERC20` is an interface for the ERC-20 token standard, defining the essential\
    \ functions that any ERC-20 token contract must implement. These functions include\
    \ transferring tokens, checking balances, and approving allowances. By adhering\
    \ to this interface, different token contracts can ensure they provide a consistent\
    \ set of functionalities, allowing them to interact with other contracts and applications\
    \ that recognize the ERC-20 standard.\n\n## Abstract Contracts\n\nAbstract contracts\
    \ in Solidity serve as base contracts that define functions without implementing\
    \ all of them. Unlike interfaces, abstract contracts can contain both implemented\
    \ and unimplemented (abstract) functions. They can also include state variables\
    \ and modifiers. Abstract contracts are used to share common logic and functionality\
    \ among derived contracts while leaving certain functions to be defined by the\
    \ inheriting contracts.\n\n```solidity\nabstract contract AbstractToken {\n  \
    \  function totalSupply() public view virtual returns (uint256);\n    function\
    \ balanceOf(address account) public view virtual returns (uint256);\n    function\
    \ transfer(address recipient, uint256 amount) public virtual returns (bool);\n\
    \n    mapping(address => uint256) internal balances;\n\n    function _transfer(address\
    \ sender, address recipient, uint256 amount) internal {\n        require(balances[sender]\
    \ >= amount, \"Insufficient balance\");\n        balances[sender] -= amount;\n\
    \        balances[recipient] += amount;\n    }\n}\n```\n\nIn this example, `AbstractToken`\
    \ is an abstract contract that defines several virtual functions (`totalSupply`,\
    \ `balanceOf`, and `transfer`) without providing their implementations. It also\
    \ includes an internal `_transfer` function that performs the actual transfer\
    \ logic and updates balances. Derived contracts must implement the abstract functions\
    \ to complete the contract.\n\n## Combining Interfaces and Abstract Contracts\n\
    \nCombining interfaces and abstract contracts allows developers to define clear,\
    \ modular, and reusable contract architectures. Interfaces ensure that contracts\
    \ conform to expected behaviors, while abstract contracts provide shared logic\
    \ and structure. This approach promotes code reuse and simplifies the development\
    \ of complex smart contract systems.\n\n```solidity\ncontract MyToken is AbstractToken,\
    \ IERC20 {\n    uint256 private _totalSupply;\n\n    constructor(uint256 initialSupply)\
    \ {\n        _totalSupply = initialSupply;\n        balances[msg.sender] = initialSupply;\n\
    \    }\n\n    function totalSupply() public view override returns (uint256) {\n\
    \        return _totalSupply;\n    }\n\n    function balanceOf(address account)\
    \ public view override returns (uint256) {\n        return balances[account];\n\
    \    }\n\n    function transfer(address recipient, uint256 amount) public override\
    \ returns (bool) {\n        _transfer(msg.sender, recipient, amount);\n      \
    \  return true;\n    }\n}\n```\n\nIn this `MyToken` contract, the ERC-20 interface\
    \ (`IERC20`) is implemented along with the `AbstractToken` abstract contract.\
    \ The `MyToken` contract provides the implementations for the abstract functions,\
    \ leveraging the shared logic in `AbstractToken` and ensuring compatibility with\
    \ the ERC-20 standard defined by `IERC20`.\n\nBy using interfaces and abstract\
    \ contracts, Solidity developers can create modular and interoperable smart contract\
    \ systems that enhance maintainability, flexibility, and integration across the\
    \ Ethereum blockchain.\n\n# Chapter 3: Advanced Solidity Concepts\n\n## 1. Inheritance\
    \ and Interfaces\n\n### Contract Inheritance\n\nInheritance is a powerful feature\
    \ in Solidity that allows developers to create new contracts based on existing\
    \ ones. This capability enables the reuse of code, enhances modularity, and promotes\
    \ the development of robust and maintainable smart contract systems. By inheriting\
    \ from one or more base contracts, a derived contract can access and extend the\
    \ functionality of the parent contracts, facilitating code sharing and reducing\
    \ redundancy.\n\n### Basic Inheritance\n\nIn Solidity, a contract can inherit\
    \ from another contract using the `is` keyword. The derived contract inherits\
    \ all the state variables, functions, and modifiers from the base contract. This\
    \ allows developers to build on top of existing contracts without rewriting common\
    \ logic, making the code more modular and easier to maintain.\n\n```solidity\n\
    contract BaseContract {\n    uint256 public baseValue;\n\n    function setBaseValue(uint256\
    \ _value) public {\n        baseValue = _value;\n    }\n}\n\ncontract DerivedContract\
    \ is BaseContract {\n    function incrementBaseValue() public {\n        baseValue\
    \ += 1;\n    }\n}\n```\n\nIn this example, `DerivedContract` inherits from `BaseContract`.\
    \ It can access and modify `baseValue`, a state variable declared in `BaseContract`,\
    \ and it also inherits the `setBaseValue` function. Additionally, `DerivedContract`\
    \ introduces a new function, `incrementBaseValue`, which builds upon the inherited\
    \ state and functionality.\n\n### Multi-level and Multiple Inheritance\n\nSolidity\
    \ supports multi-level inheritance, where a contract inherits from a base contract\
    \ that itself inherits from another base contract. This hierarchical structure\
    \ allows the creation of complex inheritance chains, promoting extensive code\
    \ reuse.\n\n```solidity\ncontract GrandparentContract {\n    function greet()\
    \ public pure returns (string memory) {\n        return \"Hello from Grandparent\"\
    ;\n    }\n}\n\ncontract ParentContract is GrandparentContract {\n    function\
    \ greetParent() public pure returns (string memory) {\n        return \"Hello\
    \ from Parent\";\n    }\n}\n\ncontract ChildContract is ParentContract {\n   \
    \ function greetChild() public pure returns (string memory) {\n        return\
    \ \"Hello from Child\";\n    }\n}\n```\n\nIn this example, `ChildContract` inherits\
    \ from `ParentContract`, which in turn inherits from `GrandparentContract`. `ChildContract`\
    \ has access to functions from both `ParentContract` and `GrandparentContract`,\
    \ allowing it to utilize their functionalities and add its own.\n\nSolidity also\
    \ supports multiple inheritance, where a contract can inherit from multiple base\
    \ contracts. This enables combining functionalities from different contracts into\
    \ a single derived contract. However, it requires careful management to avoid\
    \ conflicts, especially with functions that have the same signature.\n\n```solidity\n\
    contract A {\n    function sayHello() public pure returns (string memory) {\n\
    \        return \"Hello from A\";\n    }\n}\n\ncontract B {\n    function sayHello()\
    \ public pure returns (string memory) {\n        return \"Hello from B\";\n  \
    \  }\n}\n\ncontract C is A, B {\n    function sayHello() public pure override(A,\
    \ B) returns (string memory) {\n        return super.sayHello();\n    }\n}\n```\n\
    \nIn this example, `C` inherits from both `A` and `B`, which both define a `sayHello`\
    \ function. To resolve the conflict, `C` overrides the `sayHello` function and\
    \ explicitly calls the `super` keyword to specify which base contract's implementation\
    \ to use. The `override` keyword indicates that the function overrides multiple\
    \ base functions.\n\n### Virtual Functions and Overriding\n\nTo facilitate flexible\
    \ inheritance, Solidity allows functions to be declared as `virtual` in base contracts,\
    \ indicating that derived contracts can override them. The overriding functions\
    \ in derived contracts must use the `override` keyword.\n\n```solidity\ncontract\
    \ Base {\n    function sayHello() public pure virtual returns (string memory)\
    \ {\n        return \"Hello from Base\";\n    }\n}\n\ncontract Derived is Base\
    \ {\n    function sayHello() public pure override returns (string memory) {\n\
    \        return \"Hello from Derived\";\n    }\n}\n```\n\nIn this example, `Base`\
    \ declares a `virtual` function `sayHello`, which is overridden by `Derived` to\
    \ provide a different implementation. This mechanism allows developers to customize\
    \ inherited functions to suit specific requirements while preserving the overall\
    \ contract architecture.\n\nBy leveraging inheritance, Solidity developers can\
    \ create modular, reusable, and extensible smart contracts that promote efficient\
    \ code management and scalability on the Ethereum blockchain. Understanding and\
    \ utilizing inheritance effectively is crucial for building sophisticated decentralized\
    \ applications with shared functionality and minimal code duplication.\n\n## Implementing\
    \ Interfaces\n"
  trans: "\n\n# Solidity 接口、抽象合约与继承\n\n## 接口\n\n```solidity\ninterface IERC20 {\n\
    \    function transferFrom(address sender, address recipient, uint256 amount)\
    \ external returns (bool);\n}\n```\n\n在本例中，`IERC20` 是 ERC-20 代币标准的接口，定义了任何 ERC-20\
    \ 代币合约必须实现的基本函数。这些函数包括转账代币、查询余额和授权额度。通过遵循该接口，不同的代币合约可以确保提供一组一致的功能，从而能与识别 ERC-20\
    \ 标准的其他合约和应用程序进行交互。\n\n## 抽象合约\n\nSolidity 中的抽象合约作为基础合约，定义函数但不实现所有函数。与接口不同，抽象合约可以同时包含已实现和未实现（抽象）的函数。它们还可以包含状态变量和修饰符。抽象合约用于在派生合约之间共享通用逻辑和功能，同时将某些函数留待继承合约定义。\n\
    \n```solidity\nabstract contract AbstractToken {\n    function totalSupply() public\
    \ view virtual returns (uint256);\n    function balanceOf(address account) public\
    \ view virtual returns (uint256);\n    function transfer(address recipient, uint256\
    \ amount) public virtual returns (bool);\n\n    mapping(address => uint256) internal\
    \ balances;\n\n    function _transfer(address sender, address recipient, uint256\
    \ amount) internal {\n        require(balances[sender] >= amount, \"Insufficient\
    \ balance\");\n        balances[sender] -= amount;\n        balances[recipient]\
    \ += amount;\n    }\n}\n```\n\n在本例中，`AbstractToken` 是一个抽象合约，定义了若干 `virtual`（虚）函数（`totalSupply`、`balanceOf`\
    \ 和 `transfer`）但未提供实现。它还包含一个执行实际转账逻辑并更新余额的内部 `_transfer` 函数。派生合约必须实现这些抽象函数以完成合约。\n\
    \n## 组合接口与抽象合约\n\n组合使用接口和抽象合约，使开发者能够定义清晰、模块化且可复用的合约架构。接口确保合约符合预期行为，而抽象合约提供共享逻辑和结构。这种方法促进了代码复用，并简化了复杂智能合约系统的开发。\n\
    \n```solidity\ncontract MyToken is AbstractToken, IERC20 {\n    uint256 private\
    \ _totalSupply;\n\n    constructor(uint256 initialSupply) {\n        _totalSupply\
    \ = initialSupply;\n        balances[msg.sender] = initialSupply;\n    }\n\n \
    \   function totalSupply() public view override returns (uint256) {\n        return\
    \ _totalSupply;\n    }\n\n    function balanceOf(address account) public view\
    \ override returns (uint256) {\n        return balances[account];\n    }\n\n \
    \   function transfer(address recipient, uint256 amount) public override returns\
    \ (bool) {\n        _transfer(msg.sender, recipient, amount);\n        return\
    \ true;\n    }\n}\n```\n\n在 `MyToken` 合约中，实现了 ERC-20 接口（`IERC20`）并继承了 `AbstractToken`\
    \ 抽象合约。`MyToken` 合约为抽象函数提供了实现，利用了 `AbstractToken` 中的共享逻辑，并确保与 `IERC20` 定义的 ERC-20\
    \ 标准兼容。\n\n通过使用接口和抽象合约，Solidity 开发者可以创建模块化且可互操作的智能合约系统，增强以太坊区块链上的可维护性、灵活性和集成能力。\n\
    \n# 第 3 章：Solidity 进阶概念\n\n## 1. 继承与接口\n\n### 合约继承\n\n继承是 Solidity 中的一项强大功能，允许开发者基于现有合约创建新合约。此能力实现了代码复用，增强了模块化，并促进了健壮且可维护的智能合约系统的开发。通过从一个或多个基础合约继承，派生合约可以访问并扩展父合约的功能，从而促进代码共享并减少冗余。\n\
    \n### 基础继承\n\n在 Solidity 中，合约可以使用 `is` 关键字继承自另一个合约。派生合约继承基础合约的所有状态变量、函数和修饰符。这使开发者能够在现有合约基础上构建，而无需重写通用逻辑，使代码更加模块化且易于维护。\n\
    \n```solidity\ncontract BaseContract {\n    uint256 public baseValue;\n\n    function\
    \ setBaseValue(uint256 _value) public {\n        baseValue = _value;\n    }\n\
    }\n\ncontract DerivedContract is BaseContract {\n    function incrementBaseValue()\
    \ public {\n        baseValue += 1;\n    }\n}\n```\n\n在本例中，`DerivedContract` 继承自\
    \ `BaseContract`。它可以访问并修改 `BaseContract` 中声明的状态变量 `baseValue`，同时也继承了 `setBaseValue`\
    \ 函数。此外，`DerivedContract` 引入了一个新函数 `incrementBaseValue`，该函数基于继承的状态和功能进行构建。\n\n\
    ### 多级继承与多重继承\n\nSolidity 支持多级继承，即合约继承自一个基础合约，而该基础合约又继承自另一个基础合约。这种层级结构允许创建复杂的继承链，促进广泛的代码复用。\n\
    \n```solidity\ncontract GrandparentContract {\n    function greet() public pure\
    \ returns (string memory) {\n        return \"Hello from Grandparent\";\n    }\n\
    }\n\ncontract ParentContract is GrandparentContract {\n    function greetParent()\
    \ public pure returns (string memory) {\n        return \"Hello from Parent\"\
    ;\n    }\n}\n\ncontract ChildContract is ParentContract {\n    function greetChild()\
    \ public pure returns (string memory) {\n        return \"Hello from Child\";\n\
    \    }\n}\n```\n\n在本例中，`ChildContract` 继承自 `ParentContract`，后者又继承自 `GrandparentContract`。`ChildContract`\
    \ 可以访问 `ParentContract` 和 `GrandparentContract` 的函数，从而利用它们的功能并添加自己的功能。\n\nSolidity\
    \ 还支持多重继承，即一个合约可以继承自多个基础合约。这使得将不同合约的功能组合到单个派生合约中成为可能。不过，这需要仔细管理以避免冲突，特别是具有相同签名的函数。\n\
    \n```solidity\ncontract A {\n    function sayHello() public pure returns (string\
    \ memory) {\n        return \"Hello from A\";\n    }\n}\n\ncontract B {\n    function\
    \ sayHello() public pure returns (string memory) {\n        return \"Hello from\
    \ B\";\n    }\n}\n\ncontract C is A, B {\n    function sayHello() public pure\
    \ override(A, B) returns (string memory) {\n        return super.sayHello();\n\
    \    }\n}\n```\n\n在本例中，`C` 同时继承自 `A` 和 `B`，两者都定义了 `sayHello` 函数。为解决冲突，`C` 重写了\
    \ `sayHello` 函数，并显式使用 `super` 关键字指定调用哪个基础合约的实现。`override` 关键字表明该函数重写了多个基础函数。\n\
    \n### 虚函数与重写\n\n为实现灵活的继承，Solidity 允许在基础合约中将函数声明为 `virtual`，表示派生合约可以重写它们。派生合约中的重写函数必须使用\
    \ `override` 关键字。\n\n```solidity\ncontract Base {\n    function sayHello() public\
    \ pure virtual returns (string memory) {\n        return \"Hello from Base\";\n\
    \    }\n}\n\ncontract Derived is Base {\n    function sayHello() public pure override\
    \ returns (string memory) {\n        return \"Hello from Derived\";\n    }\n}\n\
    ```\n\n在本例中，`Base` 声明了一个 `virtual` 函数 `sayHello`，`Derived` 重写该函数以提供不同的实现。此机制允许开发者自定义继承函数以满足特定需求，同时保持整体合约架构不变。\n\
    \n通过利用继承，Solidity 开发者可以创建模块化、可复用且可扩展的智能合约，促进以太坊区块链上的高效代码管理和可扩展性。有效理解和利用继承对于构建具有共享功能且代码重复最少的复杂去中心化应用至关重要。\n\
    \n## 实现接口\n\n"
