- raw: 'In Solidity, state variables and local variables play a crucial role in defining
    the data and behavior of smart contracts. Understanding the difference between
    these types of variables is essential for writing effective and efficient smart
    contracts.


    State Variables


    State variables are variables whose values are permanently stored on the blockchain.
    They define the state of the contract and are persistent across function calls
    and transactions. State variables are declared inside the contract but outside
    any function, and their values are written to the blockchain, making them visible
    to all participants of the Ethereum network.


    contract Example {


    uint256 public count;


    address public owner;


    constructor() {


    count = 0;


    owner = msg.sender;


    }


    function increment() public {


    count += 1;


    }


    }


    In this example, count and owner are state variables. The count variable keeps
    track of a numerical value, while owner stores the address of the contract creator.
    These variables are stored on the blockchain, and their values persist between
    different function calls and transactions. Access to state variables can be controlled
    using visibility modifiers such as public, internal, and private.


    Local Variables


    Local variables, on the other hand, are temporary variables declared inside functions.
    They exist only during the execution of the function and are not stored on the
    blockchain. Once the function execution is completed, local variables are discarded,
    and their values are lost.


    function calculateSum(uint256 a, uint256 b) public pure returns (uint256) {


    uint256 sum = a + b;


    return sum;


    }


    In this example, sum is a local variable. It is declared inside the calculateSum
    function and is used to store the result of adding a and b. Since sum is a local
    variable, it only exists during the execution of the calculateSum function and
    is not stored on the blockchain.


    Local variables are useful for temporary computations and logic that do not need
    to be preserved after the function call. They are more efficient than state variables
    as they do not incur storage costs on the blockchain.


    Differences and Considerations


    The key differences between state variables and local variables are their scope
    and persistence. State variables have a broader scope as they are accessible throughout
    the contract and persist across function calls, making them suitable for storing
    the contract''s state. Local variables, with their limited scope and temporary
    nature, are ideal for intermediate computations and logic that do not need to
    be stored permanently.


    When writing smart contracts, it''s important to use state variables judiciously,
    given their storage costs on the blockchain. Overusing state variables can lead
    to increased gas costs for contract deployment and execution. On the other hand,
    local variables do not incur such costs, making them more efficient for temporary
    data storage and computation.


    Understanding the distinction between state variables and local variables is fundamental
    for writing efficient and cost-effective smart contracts in Solidity. By leveraging
    the strengths of each type of variable appropriately, developers can optimize
    their contracts for performance and minimize unnecessary blockchain storage costs.


    2.​Contracts and Interfaces


    Defining Contracts


    Defining contracts in Solidity is the foundation of creating smart contracts on
    the Ethereum blockchain. A contract in Solidity is similar to a class in object-oriented
    programming and serves as the primary building block for decentralized applications
    (DApps). Each contract encapsulates state variables, functions, events, and modifiers
    that collectively define the behavior and state of the smart contract.


    Basic Structure of a Solidity Contract


    A Solidity contract begins with a version pragma, which specifies the compiler
    version to ensure that the contract is compiled with the intended version. This
    is followed by the contract definition using the contract keyword, the contract
    name, and a pair of curly braces enclosing its contents.


    // SPDX-License-Identifier: MIT


    pragma solidity ^0.8.0;


    contract SimpleStorage {


    uint256 public storedData;


    function set(uint256 x) public {


    storedData = x;


    }


    function get() public view returns (uint256) {


    return storedData;


    }


    }


    In this example, SimpleStorage is a basic contract that stores a single unsigned
    integer storedData. The contract includes two functions: set to modify the value
    of storedData and get to retrieve its value. The public visibility modifier makes
    these functions accessible from outside the contract.


    State Variables, Functions, and Visibility


    Contracts typically include state variables to store data that persists on the
    blockchain, functions to define behavior and logic, and visibility modifiers to
    control access. State variables are declared within the contract but outside any
    function, ensuring their persistence across transactions.


    Visibility modifiers such as public, private, internal, and external determine
    who can call the functions and access the variables. Functions can also have mutability
    modifiers like view and pure to indicate whether they modify the state or not.


    contract Counter {


    uint256 private count;


    function increment() public {


    count += 1;


    }


    function getCount() public view returns (uint256) {


    return count;


    }


    }


    In the Counter contract, count is a private state variable, meaning it cannot
    be accessed directly from outside the contract. The increment function modifies
    the state by increasing the count, while the getCount function reads the state
    without modifying it, hence marked as view.


    Inheritance and Modularity


    Solidity supports inheritance, allowing contracts to inherit properties and functions
    from other contracts. This feature promotes modularity and code reuse, enabling
    developers to build complex contracts by extending simpler ones.


    contract Owned {


    address public owner;


    constructor() {


    owner = msg.sender;


    }


    modifier onlyOwner() {


    require(msg.sender == owner, "Not the contract owner");


    \_;


    }


    }


    contract Destructible is Owned {


    function destroy() public onlyOwner {


    selfdestruct(payable(owner));


    }


    }


    In this example, Owned is a contract that sets the owner upon deployment and includes
    an onlyOwner modifier to restrict access to certain functions. The Destructible
    contract inherits from Owned and uses the onlyOwner modifier in its destroy function,
    ensuring only the contract owner can destroy the contract.


    By defining contracts effectively, Solidity developers can create robust, reusable,
    and maintainable smart contracts that underpin the decentralized applications
    on the Ethereum blockchain. Understanding the structure, state management, and
    inheritance in Solidity is crucial for building sophisticated and secure DApps.


    Interfaces and Abstract Contracts


    In Solidity, interfaces and abstract contracts are essential tools for designing
    flexible and modular smart contracts. They enable the definition of standardized
    behaviors and the separation of contract logic, promoting reusability and interoperability
    across different contracts and DApps.


    Interfaces


    Interfaces in Solidity define the functions that a contract must implement without
    providing the actual implementation. They are similar to abstract classes in other
    programming languages and are used to establish a contract''s expected behavior.
    Interfaces allow for decoupling the contract''s functionality from its implementation,
    enabling different contracts to interact seamlessly based on a common set of functions.


    interface IERC20 {


    function totalSupply() external view returns (uint256);


    function balanceOf(address account) external view returns (uint256);


    function transfer(address recipient, uint256 amount) external returns (bool);


    function allowance(address owner, address spender) external view returns (uint256);


    function approve(address spender, uint256 amount) external returns (bool);'
  fmt: "\n# Solidity 状态变量与局部变量\n\n在 Solidity 中，状态变量和局部变量在定义智能合约的数据和行为方面起着至关重要的作用。理解这两种变量类型的区别对于编写有效且高效的智能合约至关重要。\n\
    \n## 状态变量\n\n状态变量是其值永久存储在区块链上的变量。它们定义了合约的状态，并在函数调用和交易之间持久化。状态变量声明在合约内部但在任何函数之外，其值被写入区块链，使以太坊网络的所有参与者均可见。\n\
    \n```solidity\ncontract Example {\n    uint256 public count;\n    address public\
    \ owner;\n\n    constructor() {\n        count = 0;\n        owner = msg.sender;\n\
    \    }\n\n    function increment() public {\n        count += 1;\n    }\n}\n```\n\
    \n在该示例中，`count` 和 `owner` 是状态变量。`count` 变量用于跟踪数值，而 `owner` 存储合约创建者的地址。这些变量存储在区块链上，其值在不同的函数调用和交易之间持久存在。可以使用\
    \ `public`、`internal` 和 `private` 等可见性修饰符控制对状态变量的访问。\n\n## 局部变量\n\n另一方面，局部变量是在函数内部声明的临时变量。它们仅在函数执行期间存在，且不存储在区块链上。函数执行完成后，局部变量被丢弃，其值也随之丢失。\n\
    \n```solidity\nfunction calculateSum(uint256 a, uint256 b) public pure returns\
    \ (uint256) {\n    uint256 sum = a + b;\n    return sum;\n}\n```\n\n在该示例中，`sum`\
    \ 是局部变量。它声明在 `calculateSum` 函数内部，用于存储 `a` 和 `b` 相加的结果。由于 `sum` 是局部变量，它仅在 `calculateSum`\
    \ 函数执行期间存在，不会存储在区块链上。\n\n局部变量适用于不需要在函数调用后保留的临时计算和逻辑。它们比状态变量更高效，因为它们不会产生区块链存储成本。\n\
    \n## 区别与注意事项\n\n状态变量和局部变量的关键区别在于其作用域和持久性。状态变量具有更广泛的作用域，可在整个合约中访问，并跨函数调用持久化，适合存储合约状态。局部变量因其有限的作用域和临时性，适合中间计算和不需要永久存储的逻辑。\n\
    \n编写智能合约时，鉴于状态变量在区块链上的存储成本，应审慎使用。过度使用状态变量会导致合约部署和执行的 Gas 成本增加。相反，局部变量不产生此类成本，因此对于临时数据存储和计算更为高效。\n\
    \n理解状态变量和局部变量的区别，是编写高效且具成本效益的 Solidity 智能合约的基础。通过恰当利用各类变量的优势，开发者可优化合约性能，并将不必要的区块链存储成本降至最低。\n\
    \n# 合约与接口\n\n## 定义合约\n\n在 Solidity 中定义合约是以太坊区块链上创建智能合约的基础。Solidity 中的合约类似于面向对象编程中的类，是去中心化应用（DApps）的主要构建模块。每个合约封装了状态变量、函数、事件和修饰符，它们共同定义了智能合约的行为和状态。\n\
    \n### Solidity 合约的基本结构\n\nSolidity 合约以版本声明（`pragma`）开头，用于指定编译器版本，确保合约使用预期版本进行编译。随后使用\
    \ `contract` 关键字、合约名称和一对花括号来定义合约内容。\n\n```solidity\n// SPDX-License-Identifier:\
    \ MIT\npragma solidity ^0.8.0;\n\ncontract SimpleStorage {\n    uint256 public\
    \ storedData;\n\n    function set(uint256 x) public {\n        storedData = x;\n\
    \    }\n\n    function get() public view returns (uint256) {\n        return storedData;\n\
    \    }\n}\n```\n\n在该示例中，`SimpleStorage` 是一个存储单个无符号整数 `storedData` 的基础合约。合约包含两个函数：`set`\
    \ 用于修改 `storedData` 的值，`get` 用于检索其值。`public` 可见性修饰符使这些函数可从合约外部访问。\n\n### 状态变量、函数与可见性\n\
    \n合约通常包含用于存储持久化区块链数据的状态变量、用于定义行为和逻辑的函数，以及用于控制访问的可见性修饰符。状态变量声明在合约内部但在任何函数之外，确保其跨交易持久化。\n\
    \n`public`、`private`、`internal` 和 `external` 等可见性修饰符决定了谁可以调用函数和访问变量。函数还可以具有 `view`\
    \ 和 `pure` 等状态可变性修饰符，以指示它们是否修改状态。\n\n```solidity\ncontract Counter {\n    uint256\
    \ private count;\n\n    function increment() public {\n        count += 1;\n \
    \   }\n\n    function getCount() public view returns (uint256) {\n        return\
    \ count;\n    }\n}\n```\n\n在 `Counter` 合约中，`count` 是 `private` 状态变量，意味着无法从合约外部直接访问。`increment`\
    \ 函数通过增加 `count` 来修改状态，而 `getCount` 函数在不修改状态的情况下读取状态，因此标记为 `view`。\n\n### 继承与模块化\n\
    \nSolidity 支持继承，允许合约从其他合约继承属性和函数。此功能促进了模块化和代码复用，使开发者能够通过扩展简单合约来构建复杂合约。\n\n```solidity\n\
    contract Owned {\n    address public owner;\n\n    constructor() {\n        owner\
    \ = msg.sender;\n    }\n\n    modifier onlyOwner() {\n        require(msg.sender\
    \ == owner, \"Not the contract owner\");\n        _;\n    }\n}\n\ncontract Destructible\
    \ is Owned {\n    function destroy() public onlyOwner {\n        selfdestruct(payable(owner));\n\
    \    }\n}\n```\n\n在该示例中，`Owned` 合约在部署时设置 `owner`，并包含 `onlyOwner` 修饰符以限制对特定函数的访问。`Destructible`\
    \ 合约继承自 `Owned`，并在其 `destroy` 函数中使用 `onlyOwner` 修饰符，确保只有合约所有者可以销毁合约。\n\n通过有效定义合约，Solidity\
    \ 开发者可以创建健壮、可复用且可维护的智能合约，支撑以太坊区块链上的去中心化应用。理解 Solidity 中的结构、状态管理和继承对于构建复杂且安全的 DApps\
    \ 至关重要。\n\n## 接口与抽象合约\n\n在 Solidity 中，接口和抽象合约是设计灵活且模块化智能合约的重要工具。它们支持标准化行为的定义和合约逻辑的分离，促进了不同合约和\
    \ DApps 之间的可复用性和互操作性。\n\n### 接口\n\nSolidity 中的接口定义了合约必须实现的函数，但不提供实际实现。它们类似于其他编程语言中的抽象类，用于建立合约的预期行为。接口允许将合约的功能与其实现解耦，使不同合约能够基于一组通用函数无缝交互。\n\
    \n```solidity\ninterface IERC20 {\n    function totalSupply() external view returns\
    \ (uint256);\n    function balanceOf(address account) external view returns (uint256);\n\
    \    function transfer(address recipient, uint256 amount) external returns (bool);\n\
    \    function allowance(address owner, address spender) external view returns\
    \ (uint256);\n    function approve(address spender, uint256 amount) external returns\
    \ (bool);\n}\n```\n"
