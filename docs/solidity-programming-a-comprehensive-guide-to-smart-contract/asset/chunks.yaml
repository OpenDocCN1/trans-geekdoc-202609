    \ in the migrations directory, e.g., 2\\_deploy\\_contracts.js.\n\n3.  Run the\
    \ migration:\n\ntruffle migrate\n\nUsing Hardhat:\n\n1.  Create a new contract\
    \ in the contracts directory, e.g., MyContract.sol.\n\n2.  Add a deployment script\
    \ in the scripts directory, e.g., deploy.js.\n\n3.  Run the script:\n\nnpx hardhat\
    \ run scripts/deploy.js --network localhost\n\nBy following these steps, you will\
    \ have Truffle or Hardhat set up and ready to use for your Ethereum smart contract\
    \ development projects.\n\nInstalling MetaMask and Ganache\n\nSetting up MetaMask\
    \ and Ganache is essential for developing, testing, and interacting with decentralized\
    \ applications (DApps) on the Ethereum blockchain. Here’s a detailed guide on\
    \ how to install and configure both tools:\n\nInstalling MetaMask\n\nMetaMask\
    \ is a browser extension that allows you to manage your Ethereum wallet, interact\
    \ with DApps, and connect to the Ethereum network. Here’s how to install and set\
    \ it up:\n\nStep 1: Install MetaMask Extension\n\n1.  Go to the [MetaMask website](https://metamask.io/).\n\
    \n2.  Click on \"Download\" and choose the browser you're using (Chrome, Firefox,\
    \ Brave, or Edge).\n\n3.  Follow the instructions to add the MetaMask extension\
    \ to your browser.\n\nStep 2: Set Up Your MetaMask Wallet\n\n1.  After installing\
    \ the extension, click on the MetaMask icon in your browser toolbar.\n\n2.  Click\
    \ \"Get Started\" and then \"Create a Wallet.\"\n\n3.  Create a strong password\
    \ and write down your seed phrase (backup phrase) in a secure place. This phrase\
    \ is crucial for recovering your wallet.\n\n4.  Confirm your seed phrase to complete\
    \ the setup.\n\nStep 3: Connect MetaMask to a Network MetaMask can connect to\
    \ various Ethereum networks, including the mainnet, testnets, and local networks\
    \ like Ganache.\n\n1.  Open MetaMask and click on the network dropdown at the\
    \ top (it usually shows \"Ethereum Mainnet\" by default).\n\n2.  Select \"Custom\
    \ RPC\" to add a new network.\n\nInstalling Ganache\n\nGanache is a personal blockchain\
    \ for Ethereum development that you can use to deploy contracts, develop applications,\
    \ and run tests.\n\nStep 1: Download Ganache\n\n1.  Go to the Ganache website.\n\
    \n2.  Download the appropriate version for your operating system (Windows, macOS,\
    \ or Linux).\n\nStep 2: Install Ganache\n\n1.  Run the downloaded installer and\
    \ follow the installation instructions.\n\nStep 3: Start Ganache\n\n1.  Open Ganache.\n\
    \n2.  Click \"Quickstart Ethereum\" to start a new workspace. Ganache will launch\
    \ a local blockchain with predefined accounts and funds for testing.\n\nStep 4:\
    \ Note Down RPC Server URL\n\n1.  In the Ganache interface, note down the RPC\
    \ Server URL (e.g., http://127.0.0.1:7545). You will need this URL to connect\
    \ MetaMask to Ganache.\n\nConnecting MetaMask to Ganache\n\nStep 1: Add Ganache\
    \ Network to MetaMask\n\n1.  Open MetaMask and click on the network dropdown at\
    \ the top.\n\n2.  Select \"Custom RPC.\"\n\n3.  Fill in the network details:\n\
    \n    *   Network Name: Ganache\n\n    *   New RPC URL: The URL from Ganache,\
    \ e.g., http://127.0.0.1:7545\n\n    *   Chain ID: 1337 (default for Ganache CLI)\
    \ or 5777 (default for Ganache GUI)\n\n    *   Currency Symbol: ETH (optional)\n\
    \n    *   Block Explorer URL: (leave blank or provide if you have one)\n\n4. \
    \ Click \"Save.\"\n\nStep 2: Import Ganache Accounts into MetaMask\n\n1.  In Ganache,\
    \ click on the key icon next to an account to view its private key.\n\n2.  Copy\
    \ the private key.\n\n3.  Open MetaMask, click on your account icon, and select\
    \ \"Import Account.\""
  fmt: "\n# 安装 Node.js 和 npm\n\n## 步骤 1：打开终端\n\n## 步骤 2：更新软件包列表并安装前置依赖\n\n运行以下命令：\n\
    \n```bash\nsudo apt update\nsudo apt install curl\n```\n\n## 步骤 3：安装 Node.js\n\
    \n使用 NodeSource 仓库安装 Node.js。运行以下命令：\n\n```bash\ncurl -fsSL https://deb.nodesource.com/setup_lts.x\
    \ | sudo -E bash -\nsudo apt install -y nodejs\n```\n\n## 步骤 4：验证安装\n\n运行以下命令检查\
    \ Node.js 和 npm 的版本：\n\n```bash\nnode -v\nnpm -v\n```\n\n## 更新 npm\n\n虽然 npm 会随\
    \ Node.js 自动安装，但建议将其更新到最新版本：\n\n```bash\nnpm install -g npm\n```\n\n## 使用 nvm\
    \ (Node Version Manager)\n\n对于需要管理多个 Node.js 版本的开发者，使用 `nvm` 是一个很好的选择。以下是安装 `nvm`\
    \ 并用它安装 Node.js 的方法：\n\n### 步骤 1：安装 nvm\n\n1. 打开终端。\n2. 运行以下命令安装 `nvm`：\n\n```bash\n\
    curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash\n\
    ```\n\n3. 将 `nvm` 加载到当前的 Shell 会话中。\n\n### 步骤 2：使用 nvm 安装 Node.js\n\n1. 使用 `nvm`\
    \ 安装 Node.js 的 LTS 版本：\n\n```bash\nnvm install --lts\n```\n\n2. 验证安装：\n\n```bash\n\
    node -v\nnpm -v\n```\n\n完成上述步骤后，您的系统上将安装好 Node.js 和 npm，可用于开发项目。\n\n# 设置 Truffle\
    \ 或 Hardhat\n\n设置 Truffle 或 Hardhat 对于在以太坊区块链上开发、测试和部署智能合约至关重要。两者都提供强大的功能，但针对略微不同的需求和偏好。以下是设置每个工具的分步指南：\n\
    \n## 设置 Truffle\n\n### 步骤 1：安装 Node.js 和 npm\n\n确保已安装 Node.js 和 npm。您可以通过运行以下命令验证安装：\n\
    \n```bash\nnode -v\nnpm -v\n```\n\n### 步骤 2：安装 Truffle\n\n1. 打开终端（命令提示符、PowerShell\
    \ 或 Terminal）。\n2. 全局安装 Truffle：\n\n```bash\nnpm install -g truffle\n```\n\n###\
    \ 步骤 3：验证安装\n\n检查已安装的 Truffle 版本：\n\n```bash\ntruffle version\n```\n\n### 步骤 4：创建新的\
    \ Truffle 项目\n\n1. 为项目创建一个新目录并进入该目录：\n\n```bash\nmkdir my-truffle-project\ncd\
    \ my-truffle-project\n```\n\n2. 初始化一个新的 Truffle 项目：\n\n```bash\ntruffle init\n\
    ```\n\n### 步骤 5：安装 Ganache（可选但推荐）\n\nGanache 是用于以太坊开发的个人区块链。您可以将其作为桌面应用程序或 CLI\
    \ 工具安装。\n\n1. 安装 CLI 版本：\n\n```bash\nnpm install -g ganache-cli\n```\n\n2. 启动\
    \ Ganache CLI：\n\n```bash\nganache-cli\n```\n\n## 设置 Hardhat\n\n### 步骤 1：安装 Node.js\
    \ 和 npm\n\n确保已安装 Node.js 和 npm。通过运行以下命令验证安装：\n\n```bash\nnode -v\nnpm -v\n```\n\
    \n### 步骤 2：创建新的 Hardhat 项目\n\n1. 打开终端。\n2. 为项目创建一个新目录并进入该目录：\n\n```bash\nmkdir\
    \ my-hardhat-project\ncd my-hardhat-project\n```\n\n3. 初始化一个新的 Hardhat 项目：\n\n\
    ```bash\nnpm init -y\nnpm install --save-dev hardhat\nnpx hardhat\n```\n\n###\
    \ 步骤 3：遵循设置说明\n\n1. 您将被提示选择项目类型。选择 \"Create a basic sample project\" 以进行标准设置。\n\
    2. 按照说明安装必要的依赖项。\n\n### 步骤 4：安装 Hardhat 插件（可选）\n\nHardhat 拥有丰富的插件生态系统来扩展其功能。一些常用插件包括：\n\
    \n1. **Ethers.js**：用于与以太坊交互。\n\n```bash\nnpm install --save-dev @nomiclabs/hardhat-ethers\
    \ ethers\n```\n\n2. **Waffle**：用于测试。\n\n### 步骤 5：配置 Hardhat\n\n1. 打开 `hardhat.config.js`\
    \ 文件并根据您的需求进行配置。例如，添加对 Ethers.js 的支持：\n\n```javascript\nrequire(\"@nomiclabs/hardhat-ethers\"\
    );\n\nmodule.exports = {\n  solidity: \"0.8.4\",\n  networks: {\n    hardhat:\
    \ {\n      chainId: 1337\n    }\n  }\n};\n```\n\n## 示例项目结构\n\n### Truffle 项目结构\n\
    \n```text\nmy-truffle-project/\n├── contracts/        # Solidity 合约\n│   └── Migrations.sol\n\
    ├── migrations/       # 部署脚本\n│   └── 1_initial_migration.js\n├── test/      \
    \       # 测试文件\n│   └── test_example.js\n└── truffle-config.js # Truffle 配置文件\n\
    ```\n\n### Hardhat 项目结构\n\n```text\nmy-hardhat-project/\n├── contracts/      \
    \    # Solidity 合约\n│   └── Greeter.sol\n├── scripts/            # 部署脚本\n│   └──\
    \ sample-script.js\n├── test/               # 测试文件\n│   └── sample-test.js\n└──\
    \ hardhat.config.js   # Hardhat 配置文件\n```\n\n## 部署简单合约\n\n### 使用 Truffle\n\n1.\
    \ 在 `contracts` 目录中创建一个新合约，例如 `MyContract.sol`。\n2. 在 `migrations` 目录中添加部署脚本，例如\
    \ `2_deploy_contracts.js`。\n3. 运行迁移：\n\n```bash\ntruffle migrate\n```\n\n### 使用\
    \ Hardhat\n\n1. 在 `contracts` 目录中创建一个新合约，例如 `MyContract.sol`。\n2. 在 `scripts`\
    \ 目录中添加部署脚本，例如 `deploy.js`。\n3. 运行脚本：\n\n```bash\nnpx hardhat run scripts/deploy.js\
    \ --network localhost\n```\n\n遵循这些步骤，您将完成 Truffle 或 Hardhat 的设置，并准备好用于以太坊智能合约开发项目。\n\
    \n# 安装 MetaMask 和 Ganache\n\n设置 MetaMask 和 Ganache 对于在以太坊区块链上开发、测试和与去中心化应用（DApps）交互至关重要。以下是关于如何安装和配置这两个工具的详细指南：\n\
    \n## 安装 MetaMask\n\nMetaMask 是一个浏览器扩展，允许您管理以太坊钱包、与 DApps 交互并连接到以太坊网络。以下是安装和设置方法：\n\
    \n### 步骤 1：安装 MetaMask 扩展\n\n1. 访问 [MetaMask 网站](https://metamask.io/)。\n2. 点击\
    \ \"Download\" 并选择您使用的浏览器（Chrome、Firefox、Brave 或 Edge）。\n3. 按照说明将 MetaMask 扩展添加到您的浏览器。\n\
    \n### 步骤 2：设置您的 MetaMask 钱包\n\n1. 安装扩展后，点击浏览器工具栏中的 MetaMask 图标。\n2. 点击 \"Get Started\"\
    ，然后点击 \"Create a Wallet\"。\n3. 创建一个强密码，并将您的种子短语（备份短语）写在安全的地方。此短语对于恢复您的钱包至关重要。\n\
    4. 确认您的种子短语以完成设置。\n\n### 步骤 3：将 MetaMask 连接到网络\n\nMetaMask 可以连接到各种以太坊网络，包括主网、测试网和本地网络（如\
    \ Ganache）。\n\n1. 打开 MetaMask，点击顶部的网络下拉菜单（默认通常显示 \"Ethereum Mainnet\"）。\n2. 选择\
    \ \"Custom RPC\" 以添加新网络。\n\n## 安装 Ganache\n\nGanache 是用于以太坊开发的个人区块链，可用于部署合约、开发应用程序和运行测试。\n\
    \n### 步骤 1：下载 Ganache\n\n1. 访问 Ganache 网站。\n2. 下载适合您操作系统的版本（Windows、macOS 或 Linux）。\n\
    \n### 步骤 2：安装 Ganache\n\n1. 运行下载的安装程序并按照安装说明操作。\n\n### 步骤 3：启动 Ganache\n\n1. 打开\
    \ Ganache。\n2. 点击 \"Quickstart Ethereum\" 以启动新工作区。Ganache 将启动一个带有预定义账户和资金的本地区块链，用于测试。\n\
    \n### 步骤 4：记下 RPC 服务器 URL\n\n1. 在 Ganache 界面中，记下 RPC Server URL（例如 `http://127.0.0.1:7545`）。您将需要此\
    \ URL 将 MetaMask 连接到 Ganache。\n\n## 将 MetaMask 连接到 Ganache\n\n### 步骤 1：将 Ganache\
    \ 网络添加到 MetaMask\n\n1. 打开 MetaMask，点击顶部的网络下拉菜单。\n2. 选择 \"Custom RPC\"。\n3. 填写网络详情：\n\
    \   - **Network Name**: Ganache\n   - **New RPC URL**: 来自 Ganache 的 URL，例如 `http://127.0.0.1:7545`\n\
    \   - **Chain ID**: `1337`（Ganache CLI 默认）或 `5777`（Ganache GUI 默认）\n   - **Currency\
    \ Symbol**: ETH（可选）\n   - **Block Explorer URL**: （留空或在有区块浏览器时提供）\n4. 点击 \"Save\"\
    。\n\n### 步骤 2：将 Ganache 账户导入 MetaMask\n\n1. 在 Ganache 中，点击账户旁边的钥匙图标以查看其私钥。\n2.\
    \ 复制私钥。\n3. 打开 MetaMask，点击您的账户图标，然后选择 \"Import Account\"。\n"
