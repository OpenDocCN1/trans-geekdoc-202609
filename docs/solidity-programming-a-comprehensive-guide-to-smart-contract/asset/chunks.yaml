    const Web3 = require('web3');\n\nconst web3 = new Web3('https://mainnet.infura.io/v3/YOUR_INFURA_PROJECT_ID');\n\
    \nconst contractAddress = '0xYourContractAddress';\n\nconst abi = [ /* Contract\
