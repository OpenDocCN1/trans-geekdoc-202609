  \ doi:10.1002/dac.2417\n\n##### 作者\n\n*   **Leandros Maglaras**  \n    ![Orcid Imagehttps://orcid.org/0000-0001-5360-9782](https://orcid.org/0000-0001-5360-9782)\
  \  \n    德蒙福特大学，英国\n\n*   **Helge Janicke**  \n    网络安全合作研究中心，埃迪斯科文大学，澳大利亚\n\n*\
  \   **Mohamed Amine Ferrag**  \n    ![Orcid Imagehttps://orcid.org/0000-0002-0632-3172](https://orcid.org/0000-0002-0632-3172)\
  \  \n    盖尔马大学，阿尔及利亚\n\n##### 摘要\n\n本研究从技术上分析了长度不超过 12 个字符的常用密码的最大组合数量。文中还给出了存储所有不超过\
  \ 12 个字符的可能密码所需的最大存储空间，并将其与主流云存储服务商公布的存储成本以及一个国家的情报和国防预算进行了对比。作者证明，仅凭当前市面上可购买的商用组件，任何密码都有可能在几秒钟内被计算出来。研究结论指出，民族国家甚至合作的多个民族国家有可能已经购买了私人公民和企业的密码，这表明我们可能已经进入了一个密码不再是隐私合法防线的时代。\n\
  \n##### 引言\n\n随着关键国家基础设施越来越容易遭受网络攻击，其防护已成为任何组织乃至国家的重大议题。此外，工业控制系统与物联网（`IoT`）的协同效应应运而生，带来了新的安全挑战（Maglaras\
  \ 等，2018），这使得基于安全工具、人员和流程的重叠防御策略的部署成为必要。传统安全机制是保护组织或国家边界的适当且有效的手段。防火墙架构、邮件扫描、`DPI`、`VPN`、`HIDS`、`NIDS`\
  \ 均是组织减少恶意软件入侵其环境机会的成熟途径。作为补充措施，锁定未使用的端口、`USB` 设备，通过企业目录使用访问控制，以及强制执行最小权限访问，所有这些都能降低内部威胁。任何组织必须采取的基本但重要的安全措施之一是密码策略（Gupta\
  \ 等，2018），以及其他防御机制（Jiang 等，2018；Almomani 等，2013）。\n\n在不深究密码的历史或哲学定义，而纯粹专注于现代科学层面的密码定义方面，根据剑桥词典“商务英语”中的“Password”条目，在商业和计算术语中，它被定义为：“你在使用计算机、网站等时，用来证明你身份的秘密单词或字母和数字的组合：”（剑桥词典，2019）。显然，这并不准确，因为它排除了现在大多数企业密码策略中常见的特殊字符。因此，在本章中，当提到密码时，其定义将是“用户从现代计算软硬件可用字符集中选取的一组字符，用于认证目的”。密码固有许多变量，因为它们本身就是从我们各种形式的复杂语言中提取的，即使不代表一个可定义的单词。\n\
  \n围绕密码存在许多复杂而有趣的理论，这引发了大量讨论和有趣的内容，例如期刊文章“作为熵博弈的密码安全性”（Rass 等，2018），也催生了一些真正鼓舞人心的数学研究。此外，我们正见证着量子计算的出现所带来的“可能的艺术”的演进，这增进了我们对物理学的理解。量子计算为工业带来了以指数级提升的速度计算复杂问题的绝佳机遇。然而，人们早已推测，这种计算能力的巨大飞跃可能预示着密码及依赖复杂性的类似安全防御的消亡。这在论文“量子计算机的全球灾难性风险与安全启示”（Major\
  \ 等，2015）中有很好的描述，作者也支持这一观点。然而，在本文中，作者质疑的是当下的可能性，仅利用当今人人可买到的现成商用设备。\n\n###### 图 1.\
  \ 密码规则\n\n![Figure978-1-7998-2701-6.ch017.f01](img/ch017.f01.png)\n\n为了高效地探讨这一问题，本章作者希望在引入增加成功猜测概率的数学理论之前，先审视密码的最基本要素。此时，问一个合理的问题：“为什么我们不想增加找到匹配的概率？”答案大概是：我们想。然而，现代社会中的某些领域将机会和可能性视为应尽可能消除的“脏话”，例如情报界、医疗和金融部门。为此，本章旨在在合理约束和替代方案下，估算存储任何人正在使用的所有可能密码组合的成本。\n\
  \n在本章中，我们不会研究长度超过 12 个字符的密码，并将重点放在英国键盘配置上。在没有这些约束的情况下进行进一步研究很有趣，也值得后续跟进，但为了保持本章切合实际且易于理解，这些约束对于以最基本形式证明该理论似乎是合理的。\n\
  \n###### 图 2. 密码与哈希函数\n\n![Figure978-1-7998-2701-6.ch017.f02](img/ch017.f02.png)\n\
  \n\n\n\n\n####### 密码与哈希函数\n\n本章将探讨密码通常如何存储、常见密码的长度、存储位置和方式、感兴趣的最大熵值、这在存储大小方面会是什么样子、这种假设性存储的相关成本、是否负担得起、是否有更好的方法，最后可以得出什么推论。\n\
  \n####### 密码与哈希函数\n\n密码当然可以在计算系统中以明文形式存储。也就是说，当计算机要求你设置密码时，无论是在网站、远程服务器，甚至是你的本地桌面，它都会以你输入系统的形式存储它（即：你输入的密码\
  \ = `Password1`，系统存储的密码 = `Password1`）。然而，这并非现代最佳实践，系统也不常这样设计。\n\n如果系统被攻破，以明文形式存储的密码读取起来易如反掌。在现代计算系统中，密码实际上大多以哈希函数的输出值形式存储。下面是字符串\
  \ `Password1` 通过消息摘要算法 5 (`MD5`) 哈希处理的示例；你可以看到函数的输出与原始文本毫无相似之处：\n\n| 图 3. MD5 示例\
  \ |\n| --- |\n| ![Figure978-1-7998-2701-6.ch017.f03](img/ch017.f03.png) |\n\n根据英国国家网络安全中心的说法，“哈希是一种单向加密函数，可将明文密码转换为‘哈希值’”（国家网络安全中心，2016）。从本质上讲，对密码进行哈希处理意味着当密码被输入系统时，密码会被转换为其自身的数学表示，然后该表示通过一个设计为不可逆的单向数学函数。这意味着一旦密码被哈希，就不应能通过进一步的数学计算将其转换回原始形式。了解哈希函数原始字符串输入的唯一方法是反复尝试输入字符串，直到出现与相关原始哈希字符串相同的输出，这意味着这必定是用于认证的原始输入字符串。对此规则有称为冲突的例外情况；即两个不同的输入被传入函数，但产生了相同的输出。这些冲突相对罕见，取决于所使用的哈希函数，就本章而言，被视为超出范围。\n\
  \n将密码作为哈希值存储的好处是为密码增加了一层防御（Gupta 等人，2015），因为如果系统被完全攻破，攻击者可以窃取密码哈希值（Gupta 等人，2015\
  \ 年 5 月），但随后还面临破解哈希以还原原始密码的进一步任务（假设他们不使用本章范围之外的 `pass the hash`（SANS 2010）技术）。用户的原始密码从未存储在系统中；存储的只是代表它的哈希函数的数学输出，这使得攻击者更难利用。用户在注册后每次登录时，输入的密码会再次被哈希，输出结果与注册阶段存储的哈希值进行比较；如果匹配，则意味着输入了正确的密码。这在以下简化图中有所体现：\n\
  \n| 图 4. 密码注册与后续认证 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch017.f04](img/ch017.f04.png)\
  \ |\n\n哈希函数的一个关键优势是，无论输入是什么，哈希函数的输出始终生成相同格式和长度的字符串。这在以下三张使用 `MD5` 哈希函数的图片中得到了演示：\n\
  \n| 图 5. MD5 长度示例 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch017.f05](img/ch017.f05.png)\
  \ |\n\n请注意，尽管输入的长度和格式不同，但每个哈希的输出长度和格式都相同。哈希函数类型有很多，可以在 Hashcat 网站上看到。这将是本章后续的一个有用考量因素。\n\
  \n回到密码本身，大多数企业密码策略针对普通用户的密码长度倾向于十二个字符或更少。这就是将限制任意设定为十二个字符的原因。作者还将排除长度为空至八个字符的密码，因为如果攻击者有足够的决心，这些密码可以通过传统手段暴力破解。例如，作者的机器在没有任何额外配置或考量的情况下，能够利用其图形处理单元\
  \ (`GPU`)——该 GPU 现已六年历史——以每秒 365.1 兆（百万）次哈希 (`365.1 MH/s`) 的速度，利用 Hashcat 默认输入字符集检查\
  \ `MD5` 哈希函数所有可能的密码组合，如下两张图所示：\n\n| 图 6. Hashcat 状态截图 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch017.f06](img/ch017.f06.png)\
  \ |\n\n| 图 7. Hashcat 状态速度值 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch017.f07](img/ch017.f07.png)\
  \ |\n\n上图显示，即使是一台过时且未调优的系统，利用一块旧 `GPU`（NVIDIA Corporation GK106M [GeForce GTX 765M]），也能在\
  \ 2 分 29 秒内检查 55,146,708,992 个密码。其总完成时间可按小时计算。\n\n即使只有一块旧 `GPU` 的旧系统，也能在极短的时间内猜测所有可能的组合。加密货币挖矿的最新发展推动了哈希破解技术的进步；这可以从市面上可购买的\
  \ Antminer S15-28TH/s（Britain 2019）中看出，其宣称每秒可达 28 万亿次哈希检查 (`28 TH/s`)。这表明，如果能将此技术调整为检查\
  \ `MD5` 哈希（如我们的场景中有 5,533,380,698,112 个约 5.5 万亿种可能的组合需要检查），Antminer S15 将在 0.198\
  \ 秒内以 `28 TH/s` 的速度完成所有可能组合的检查。正是出于这个原因，作者认为八个字符或更少的密码不再具有学术研究价值。然而，专用哈希挖矿软件的技术是相关的。\n\
  \n自从发现微软 LM 哈希函数的弱点以来，许多组织的最佳实践是要求密码长度为九个或更多字符。\n\n发现 LanMan (`LM`) 哈希函数存在缺陷，表明密码实际上被分成两部分再进行哈希，这意味着可以通过实际上猜测两次四字符密码来暴力破解密码。更糟糕的是，其中一个字符是其他字符的校验和，使得这两半实际上只有四个和三个字符长。`NTLM`\
  \ 哈希是 `LM` 哈希的替代品。微软在其文章“如何防止 Windows 在 Active Directory 和本地 SAM 数据库中存储你的密码的 LAN\
  \ 管理器哈希”中提到了 `LM` 的弱点。对于本章而言，这些都相对无关紧要，除了进一步证明我们为何只关注九到十二个字符长的密码，因为这是一种社会和文化规范，或许是由技术发现引起的。\n\
  \n\n\n\n用户的密码或哈希值通常存储在其注册的系统上，或被推送到另一个系统（如数据库服务器）进行存储。无论存储在何处，必须攻破存储密码的系统或其通信链路，攻击者才能窃取密码或哈希值。或者，如果攻击者试图入侵的系统没有速率限制（即允许的密码尝试次数不受限制），那么密码尝试的速率将受限于系统处理这些尝试的能力。这被称为在线暴力破解攻击。此外，跨站脚本攻击（XSS）是针对\
  \ Web 应用程序的此类攻击之一，用户必须妥协其浏览器资源，而哈希可用于使系统对这类攻击具有鲁棒性（Gupta 等人，2017）。\n\n那么，利用英国键盘创建的密码，最大可能的密码组合数是多少？以下是基于英国键盘、基于\
  \ ASCII 可打印字符为本章生成的字符集：\n\n*   **数字**：`0123456789`\n*   **小写字母**：`abcdefghijklmnopqrstuvwxyz`\n\
  *   **大写字母**：`ABCDEFGHIJKLMNOPQRSTUVWXYZ`\n*   **特殊字符**：`` `~!@#$%^&*()-_=+[]\\\
  {}|;':\",./<>?£ ``\n\n如果包含空格字符，总共是 96 个可能的字符。有方法可以获得更高的数字，但作者认为这已足够，且能覆盖大多数人的使用情况。使用\
  \ Crunch¹（Kali Linux 渗透测试操作系统中包含的密码生成工具），我们可以看到每种可能组合的纯文本结果的计算输出统计数据，如下图所示：\n\n\
  > 此处我们注意到，在运行此命令前已编辑字符集，追加了额外字符以确保其反映上述 96 个字符。\n\n| Figure 8. Crunch 内存使用示例 |\n\
  | --- |\n| ![Figure978-1-7998-2701-6.ch017.f08](img/ch017.f08.png) |\n\n即使不包含 0–8\
  \ 位长度的密码可能性，仍有 692,533,995,824,480,256 种可能性。此外，我们可以看到，如果不压缩，仅纯文本存储这样一个字典所需的总存储容量为\
  \ 6208 PB。\n\n####### 密码与成本\n\n根据微软发布的 Azure Data Lake Storage 价格表（Microsoft 2019），撰写本章时价格为\
  \ £0.001/GB/月，该列表的存储成本约为 £6,510,191.62（四舍五入到分），年成本为 £78,122,299.44。显然，这个数字超出了大多数实体的承受范围，但让我们结合英国的国防预算来考虑这个数字。\n\
  \n根据“UK Defence in Numbers”（Ministry of Defence UK, 2017），英国 2016/17 财年的支出为 353\
  \ 亿英镑，是世界第 5 大国防预算。这还不包括国防共同既得利益与情报界及执法部门预算分配的结合。那么，一个类似英国的国家能否负担得起一个包含所有 9–12 位可能密码的数据库？答案是肯定的，即使是以最基础的原始形式，事实上，它们可能相对轻松地负担得起考虑超过\
  \ 12 位密码的数据库。\n\n那么，接下来的问题是——他们会这么做吗？从技术角度来看，答案是否定的。因为没有应用任何压缩，意味着花费的钱超过了必要数额。仅应用基本的\
  \ zip 压缩，就能大幅降低总成本。此外，我们感兴趣的实际上并非所有可能密码的列表，因为在大多数情况下，这些密码是以哈希形式存储的。因此，如果应用到上述示例中，数据集中的每个条目都需要相应的\
  \ MD5 哈希值才有用。假设一字节对应一字符，MD5 哈希有 32 字符，这会给数据集中的每个条目增加 32 字节。我们的数据集有 692,533,995,824,480,256\
  \ 行，因此（`(692533995824480256 * 32 = 2.2161088e+19)`（`2.2161088e+19` 字节转换为 GB = `22161088000`）（`22161088000`\
  \ GB 转换为 PB = `22161.088PB`）需要额外 22162 PB。同样基于微软发布的 Azure Data Lake 价格，这将构成每月额外\
  \ £22,161,088 或每年 £265,933,056 的成本（压缩前）。考虑到这只是单一哈希类型的成本，这是一个显著的成本增量。\n\n那么，还有多少其他哈希类型，这将如何影响我们的数字？查看\
  \ Hashcat 网站上的示例哈希，很容易发现 Hashcat 已知有许多不同类型的哈希，如下图所示：\n\n| Figure 9. 示例哈希 |\n| ---\
  \ |\n| ![Figure978-1-7998-2701-6.ch017.f09](img/ch017.f09.png) |\n\n仔细研究此页面时，我们也无法再回避盐值的话题。存储密码时的一个良好实践是向哈希函数引入盐值。盐值是引入数学运算的随机值，用于增加复杂性，使攻击者更难暴力破解答案。坚持我们的示例，MD5\
  \ 哈希列出了七种哈希模式变体。我们已经计算了在公共云环境中存储所有可能 MD5 哈希的成本，如下表所示：\n\n######## 表 1. MD5 哈希存储成本\n\
  \n| Mode | Hash Type | Example Hash | Cost per Year |\n| --- | --- | --- | --- |\n\
  | 0 | MD5 | `8743b52063cd84097a65d1633f5c74f5` | £265,933,056 + £78,122,299.44 |\n\
  \n查看 Hashcat 示例中的下一个条目，显示了一个示例 MD5 及其关联的盐值为 `01dfae6e5d4d90d9892622325959afbe:7050461`，冒号后的关键数字\
  \ `7050461` 即为盐值。在此格式下，其最大值为 9,999,999。这意味着，对于原始密码列表中的每一行，我们还需要存储 9,999,999 个 32\
  \ 字节的 MD5 哈希。这使得数据库成本（不压缩）约为 2.659 万亿英镑。无需进一步计算，这显然超出了单一国家的预算，实际上当考虑到下表所示的所有不同哈希类型和格式（仅针对\
  \ MD5 哈希类型）时，极有可能超出任何国家集团的预算：\n\n######## 表 2. 哈希存储成本\n\n| Mode | Hash Type | Example\
  \ Hash | Cost per Year |\n| --- | --- | --- | --- |\n| 0 | MD5 | `8743b52063cd84097a65d1633f5c74f5`\
  \ | £265,933,056 + £78,122,299.44 |\n| 10 | `md5($pass.$salt)` | `01dfae6e5d4d90d9892622325959afbe:7050461`\
  \ | £2,659 trillion+ £78,122,299.44 |\n| 20 | `md5($salt.$pass)` | `f0fda58630310a6dd91a7d8f0a4ceda2:4225637426`\
  \ | > £2,659 trillion |\n| 30 | `md5(utf16le($pass).$salt)` | `b31d032cfdcf47a399990a71e43c5d2a:144816`\
  \ | < £2,659 trillion |\n| 40 | `md5($salt.utf16le($pass))` | `d63d0e21fdc05f618d55ef306c54af82:13288442151473`\
  \ | > £2,659 trillion |\n\n####### 总结与结论\n\n\n\n\n####### 结论\n\n是否有人可能拥有包含世界上所有类型密码的预计算数据库？答案显而易见：没有。这将是一项毫无意义且徒劳的练习。可能性的数量惊人，相关成本更是天文数字。然而，正如本章前面所见，从\
  \ GPU 破解向专用加密货币挖矿机的进步，实际上可能正在加速密码的灭绝。\n\n解决这一问题的一种更切合实际的方法，是考察定制版 `Antminer S15-28TH/s`\
  \ 或类似专用技术解决该问题所需的时间。该设备在本章撰写时的零售价为 £772.14（$1020）。假设制造商增加了足以使其值得投入时间的利润率，我们或许可将该数字向下取整，估算批量生产成本约为\
  \ £500。鉴于这是估算值，若将单位成本翻倍以弥补估算偏差及为支持多种哈希类型、联网所需的定制和布线成本，则单节点价格约为 £1000。\n\n现在重新审视本章前面提到的国防预算背景。若能提出合理的商业论证，在三到五年内资本化的项目，硬件成本达一亿英镑并不算过分。这意味着一个国家可负担制造十万台此类设备（基于前述单价估算），每个节点每秒潜在检查高达\
  \ 28 万亿次哈希（取决于哈希类型）。此时，技术可行性层面的数学问题似乎已解决：在合理时间内核对所有可能组合是可行的。事实上，在此规模和能力下，更大的技术挑战将是功耗及相关电力成本。\n\
  \n鉴于以上分析，你的密码是否可能在几秒钟内仅凭当前市售组件被破解？简短回答：是的。事实上，除非密码异常长且复杂，否则对于拥有时间、资源和专业知识的实体而言，这只是微不足道的小事。\n\
