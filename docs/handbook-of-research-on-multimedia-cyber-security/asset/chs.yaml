  \    ![Orcid Imagehttps://orcid.org/0000-0002-7275-1677](https://orcid.org/0000-0002-7275-1677)\
  \  \n    Prince Sultan University, Saudi Arabia\n\n*   **Mamdouh Alenezi**  \n \
  \   ![Orcid Imagehttps://orcid.org/0000-0001-6852-1206](https://orcid.org/0000-0001-6852-1206)\
  \  \n    Prince Sultan University, Saudi Arabia\n\n##### 摘要\n\n云计算技术为用户提供了节省成本和服务灵活性。随着多媒体数据的爆炸式增长，越来越多的数据所有者将其个人多媒体数据外包到云端。同时，一些计算成本高昂的任务也由云服务器承担。然而，外包的多媒体数据及其应用可能会泄露数据所有者的私人信息，因为数据所有者失去了对其数据的控制。最近，这一想法激发了针对外包多媒体数据的隐私保护可逆数据隐藏的新研究兴趣。本章将提出匿名认证方案，作为云计算专业人员采用的最相关、最适用、最恰当的技术，以消除与隐私风险和挑战相关的风险。\n\
  \n##### 引言\n\n认证是确定特定个人或设备是否应被允许访问系统、应用程序或仅仅是运行在设备上的对象的过程。这是一个确保基本安全目标（即机密性和完整性）的重要过程。此外，充分的认证是保护任何资源的第一道防线。重要的是，并非在每种场景下都可使用相同的认证技术。例如，与访问企业数据库相比，访问“聊天服务器”可能采用不那么复杂的方法。大多数现有的认证方案都需要在客户端和服务器端进行处理。因此，任何认证方案的可接受性在很大程度上取决于其抵御攻击的鲁棒性，以及客户端和服务器端的资源需求。由于移动和手持设备的普及，资源需求已成为一个主要因素。如今，随着手机的使用，用户可以访问包括银行和企业数据库在内的任何信息。\n\
  \n\n\n\n\n###### 云计算中的匿名性与隐私\n\n匿名性与保密性和隐私息息相关。用户应知晓其在线活动是安全的，仅对其本人及服务提供商的少数授权人员可见。用户的全部浏览、购物活动被他人访问是不可接受的，云服务提供商应确保此类情况不发生。用户不应让欺诈者获知其访问过的在线商店、购买的商品、访问频率及交易详情。\n\
  \n匿名性的关键在于避免发送中的数据被拦截。如果无法确定用户的云状态，匿名性便能得到保障，因为第三方将无法判断用户是否处于活跃状态，从而不会发生数据拦截。用户应获得匿名性保证，且不应允许\
  \ Cookie 监控其活动，因为云服务涉及敏感的财务和个人数据，一旦落入不法之徒手中，可能被用于有害目的。\n\n对于不愿与他人分享个人或私人信息的用户而言，隐藏真实身份至关重要。例如，他们可能不愿分享与商业伙伴的会议日程、购买阅读的书籍、账户资金数额、执行的交易、去向等信息。简而言之，许多用户强烈倾向于在一切可能的情况下和时机保持匿名。\n\
  \n###### 移动与无线技术的演进\n\n自 20 世纪复兴以来，移动和无线技术实现了巨大增长。目前，绝大多数无线设备用户（包括手机、笔记本电脑、智能手机、PDA\
  \ 等）均可随时随地在全球范围内访问各类在线应用和服务。这些服务可能包括视频会议、网络研讨会、社交网络、远程医疗、政府服务、VoIP 和网页浏览。然而，这些在线服务的一个局限性在于公共互联网的基础设施，它允许攻击者篡改、中断并窃听两个可信实体之间传输的消息。因此，确保传输消息的安全性（包括用户隐私）已成为最重要的因素。此外，先进的云计算技术为用户提供了经济且灵活的服务，导致海量机密多媒体数据被外包至云端，从而引发了与该数据相关的风险和隐私担忧。隐私保护已成为云计算领域近几年来的热门研究课题之一。鉴于一旦用户数据泄露，可能导致多种负面后果，因此构建与隐私保护相关的技术已成为云计算领域的根本关切。\n\
  \n云计算技术为用户提供了节省成本和灵活的服务。随着多媒体数据的爆发式增长，越来越多的数据所有者将个人多媒体数据外包至云端。同时，云服务器也承担了一些计算成本高昂的任务。然而，由于数据所有者失去了对数据的控制权，外包的多媒体数据及其应用可能会泄露数据所有者的私人信息。最近，这一问题引发了关于外包多媒体数据上“隐私保护可逆数据隐藏”的新研究兴趣。本章将提出匿名认证方案，作为云计算专业人员采用的最相关、最适用、最恰当的技术，以消除与隐私风险和挑战相关的风险。\n\
  \n###### 云中的多媒体数据担忧\n\n先进的云计算技术为用户提供经济且灵活的服务，加上云端多媒体数据的爆发式增长，导致数据所有者大量将私人多媒体数据外包至云端。同时，云服务器承担了少量计算成本高昂的任务，但由于所有者失去了对数据的控制，已外包的多媒体数据可能泄露数据所有者的机密信息。近期，针对已外包多媒体数据上的“隐私保护可逆数据隐藏”展开了研究。正如\
  \ Xiong (2018) 所讨论的，建议对多媒体数据进行加密，以在数据外包后保护隐私。\n\n移动设备在个人日常生活中的重要地位催生了一系列应用，特别是在移动云计算领域。人们到达陌生地点时的常见做法是上传照片并签到。下一步则是搜索附近的住所或购物场所。正如\
  \ Wang (2017) 所述，“基于位置的服务 (LBS)” 用于解决此类问题，用户向 LBS 服务器云发送查询。按时间和位置序列排序这些信息，一旦发生数据泄露，可能会给个人带来威胁。例如，鼓励用户在品牌店购物时签到上传照片以获取折扣券是一种普遍的营销趋势，这可通过多种社交网络应用实现，但关键在于，这种持续的签到可能导致个人大规模信息泄露的概率增加；因为它凸显了一个人经常去哪些地方，Peng\
  \ (2017)。\n\n“车载自组网” 与社交网络的融合提供了一些创新应用，主要致力于娱乐和安全。例如，考虑一名驾驶员收到附近发生事故的警告消息。在此类紧急情况（如交通拥堵、火灾、自然灾害等）下，车载自组网中安全相关消息的通信可向车辆推送预警消息。多媒体消息（如视频和音频）在车载通信中十分有效，因为与纯文本消息相比，它们更具说明性、用户友好、全面和描述性。\n\
  \n\n\n\n\n###### 认证方案\n\n文献中存在多种认证方案，大致可分为以下三类：\n\n*   **知识因素（What you know）**\n\
  *   **持有因素（What you have）**\n*   **生物因素（What you are）**\n\n传统的用户名/密码或基于 `PIN` 的认证方案属于“知识因素”类型。智能卡或电子令牌属于“持有因素”类型，最后，基于生物特征的认证方案属于“生物因素”类型。某些认证系统可能会组合使用上述方案。\n\
  \n尽管传统字母数字密码广泛使用，但它们存在难以记忆、易受猜测、字典攻击、键盘记录器、肩窥攻击和社会工程学攻击等问题，正如 Islam et al. (2019)\
  \ 所报告的。除了这些攻击类型外，用户倾向于选择弱密码或记录密码，这可能会进一步削弱认证方案。作为基于传统密码方案的替代，引入了生物识别系统。该系统依赖于人一生中保持不变的独特特征，如指纹、虹膜等。作为认证方案，生物识别的主要问题是识别过程所需额外设备的高昂成本，正如\
  \ Pierce et al. (2005) 所提到的。如果设备不够健壮，误报率和漏报率也可能很高。生物识别系统易受重放攻击（利用手指在设备上留下的粘性残留物），这降低了安全性和可用性水平。因此，近期的发展试图通过引入基于令牌的认证方案来克服生物识别的缺陷。\n\
  \n基于令牌的系统依赖于使用物理设备（如智能卡或电子钥匙）进行认证。这也可以结合传统的基于密码的系统使用。Ying et al. (2005) 表明，基于令牌的系统易受中间人攻击，攻击者在用户不知情的情况下，充当用户和认证设备之间的代理，拦截用户会话并记录凭证。因此，作为替代方案，引入了基于图形的密码以解决上述方案中提到的安全性和可用性局限。\n\
  \n基于图形的密码技术已被提出作为基于文本技术的潜在替代方案，部分得益于人类更擅长记忆图像而非文本这一事实，正如 Wells et al. (2006) 所报告的。心理学家证实，在识别和回忆两种场景下，图像都比文本更容易记忆。因此，基于图形的认证方案比其他认证技术具有更高的可用性。另一方面，正如\
  \ Takada 和 Hoike (2003) 所讨论的，使用字典攻击、暴力破解和间谍软件等常规攻击手段也难以破解图形密码，而这些攻击曾影响基于文本和基于令牌的认证方案。因此，基于图形的认证方案的安全级别高于其他认证技术。\n\
  \n一般来说，图形密码技术可分为两类：基于识别和基于回忆的图形技术。\n\n####### 基于识别的系统\n\n在基于识别的系统中，一组图像会显示给用户，通过的认证要求按特定顺序点击或触摸正确的图像。基于识别的系统示例包括\
  \ `Awase-E` 系统、`Pass-faces` 系统和 `AuthentiGraph`，分别由 Takada 和 Hoike (2003)、Memon\
  \ et al. (2007) 以及 Wei-Chi 和 Maw-Jinn (2005) 提出。\n\n\n\n\n\n######## 图形密码系统综述\n\n\
  ######### Awase-E 系统\n\n一种称为 Awase-E 的图像密码系统，允许用户使用喜欢的图像作为“通行图像”来替代文本密码进行身份验证。Awase-E\
  \ 认证框架包含两个阶段：图像注册界面和通知界面。\n\n要注册图像，用户需通过电子邮件将图像及几次关键点击发送给系统，随后从其他图像中选择通行图像。通知界面为用户提供触发器以实际处理威胁，会通知用户与认证过程相关的各类事件发生情况。例如，Awase-E\
  \ 会向已注册照片的用户发送包含 URL（统一资源定位符）的电子邮件。该 URL 链接的网页包含用户刚注册的照片，用户可通过网页确认注册的照片。\n\n尽管 Awase-E\
  \ 系统具有较高的易用性，但由于图像存储空间需求大且无法抵御重放攻击，实现难度较大。此外，用户倾向于选择知名图像（或与用户有关联的图像，如子女、配偶或访问过的地点等），这可能导致猜测攻击。\n\
  \nDirik 等人（2007）研究了基于识别的方案，得出结论：即使过了一两个月，用户仍能以 90% 的准确率记住其图形密码。该研究支持“人类对图像的记忆优于文本”这一理论。此外，商业系统\
  \ Passfaces 使用人脸图像。研究表明，用户的密码选择受种族和性别影响，这使得 Passfaces 的密码具有一定可预测性。\n\n虽然基于识别的图形密码易于记忆，提高了易用性，但并不完全安全。Wei-Chi\
  \ 和 Maw-Jinn（2005）指出，为提供合理大的密码空间，认证需要多轮图像识别，这很繁琐。此外，由于使用固定图像作为密码，基于识别的系统容易受到重放攻击和鼠标追踪攻击。因此，我们在下一章描述的拟议系统中考虑了这些缺陷，该系统也克服了基于回忆方案的问题。\n\
  \n######### 基于回忆的系统\n\n在基于回忆的系统中，用户需重现注册阶段创建或选择的内容。基于回忆的方案大致可分为两类：纯回忆技术和提示回忆技术。\n\
  \n########## 纯回忆技术\n\n此方法要求用户在无任何系统帮助或提示的情况下重现密码。Draw-A-Secret（DAS）技术、网格选择和 Passdoodle\
  \ 是常见的纯回忆技术示例。\n\nTowhidi 等人（2009）提出了 DAS（Draw-A-Secret）方案，其中密码是绘制在大小为 `G * G` 的二维网格上的形状（如图\
  \ 1 所示）。网格中的每个单元格由不同的矩形坐标 `(x, y)` 表示。触摸网格的值按绘制的时间顺序存储。如果按相同的注册序列穿过确切坐标，则通过身份验证。与其他纯回忆技术一样，DAS\
  \ 存在许多缺陷。Birget 和 Dawei（2006）的调查表明，大多数用户会忘记笔画顺序，且记忆文本密码比 DAS 更容易。此外，用户选择的密码容易受到图形字典攻击和重放攻击。\n\
  \n| 图 1. |\n| --- |\n| ![Figure978-1-7998-2701-6.ch003.f01](img/ch003.f01.png) |\n\
  \nThorpe 和 Van Oorschot 提出了网格选择技术（Renaud，2009 引用），旨在增强 DAS 的密码空间。他们的研究显示笔画数对 DAS\
  \ 密码空间的影响：对于固定密码长度，笔画减少会导致密码空间显著减小。为提高 DAS 安全级别，他们建议采用“网格选择”技术：初始选择网格较大，显示一个细粒度网格供用户选择绘图网格，即一个用于放大的矩形区域，用户可在其中输入密码（如图\
  \ 2 所示）。该技术增加了 DAS 的密码空间，从而提高了安全级别。但实际上，该技术仅改善了 DAS 的密码空间，仍保留上述 DAS 的弱点和缺陷。\n\n\
  | 图 2. |\n| --- |\n| ![Figure978-1-7998-2701-6.ch003.f02](img/ch003.f02.png) |\n\
  \nPassdoodle（Birget 和 Dawei，2006 讨论）是手绘图形或文本的图形密码，通常用触控笔在触摸屏上绘制（如图 3 所示）。研究表明，用户识别完整涂鸦密码的准确度与文本密码相当。不幸的是，Passdoodle\
  \ 方案存在许多缺陷。Renaud（2009）提到，用户会被其他用户绘制的涂鸦吸引，常输入他人密码仅为绘制不同于自己的涂鸦。作者得出结论：Passdoodle\
  \ 方案易受猜测、间谍软件、键盘记录器和肩窥攻击。\n\n| 图 3. |\n| --- |\n| ![Figure978-1-7998-2701-6.ch003.f03](img/ch003.f03.png)\
  \ |\n\n########## 提示回忆技术\n\n此技术中，系统提供提示帮助用户高准确度地重现密码。提示以图像中的热点（区域）形式呈现。用户需选择部分区域注册为密码，登录时按相同顺序选择相同区域。用户必须记住“选定的点击点”并保密。实现方式包括\
  \ Blonder 算法和 PassPoint 方案。\n\n1996 年，Blonder 算法设计了一种方法：在视觉显示器上向用户展示预定图像，用户需按特定顺序“点击”图像上的预定义位置以通过身份验证（如图\
  \ 4 所示）。该方法后经修改作为 Passpoint 呈现（Dawei 等人，2006；Birget 等人，2005）。\n\n| 图 4. |\n| ---\
  \ |\n| ![Figure978-1-7998-2701-6.ch003.f04](img/ch003.f04.png) |\n\n2005 年，PassPoint\
  \ 方案被创建，类似于 Blonder 方案但克服了其主要局限。在 PassPoint 中，图像可以是包含许多可点击区域的任意照片或绘画（如图 5 所示）。这将增加\
  \ PassPoint 方案的密码空间，进而提高安全级别。另一区别在于没有像 Blonder 算法那样具有清晰边界的预定义点击区域。用户密码可包含图像中任意选定的点序列，提高了该方案的易用性。\n\
  \n| 图 5. |\n| --- |\n| ![Figure978-1-7998-2701-6.ch003.f05](img/ch003.f05.png) |\n\
  \nPassPoint 系统拥有巨大的密码空间，与其他类似系统相比提高了安全级别。例如，图像上的五或六个点击点可产生的密码数量超过标准 26 字母表的 8 字符文本密码。为增强安全性，PassPoint\
  \ 系统以哈希（加密）形式在密码文件中存储图像密码。此外，哈希不允许近似匹配：两个几乎相同但不完全相同的密码将产生不同的哈希值。为通过身份验证，用户必须点击接近选定点的位置，在距通行点某个测量容差距离内。\n\
  \n\n\n\nWiedenbeck 等人 (2006) 提出了此类图像中点击点周围的最佳容差。要登录，用户应在该点击点的容差范围内点击。事实上，更大的密码空间会导致所选点击点或像素周围的容差尺寸变小，例如（2\
  \ 到 5 mm²）。例如，尺寸为（330 x 260 mm²）且容差区域大小为（6 x 6 mm²）的图像可提供 590 多个容差区域。显然，密码空间取决于容差大小或系统选择。这一改进使\
  \ Passpoint 系统更加灵活，特别是对于使用移动设备的人群。\n\n上述方案用于设备级认证和应用级认证。不幸的是，正如下一节所示，它们遭受不同的问题。\n\
  \n####### 认证方案的问题\n\n传统的字母数字密码始终容易受到猜测和字典攻击。甚至可能存在流氓程序记录按键并将其发布到远程网站。为了克服基于键盘记录器的攻击，较新的系统可能会显示图形键盘，用户必须使用“鼠标点击”输入正确的密码。如果攻击者使用屏幕捕获机制而不是键盘记录器，这种方法也可能被破解。由于新的视频编解码器提供了更高的压缩比，攻击者可能会使用屏幕捕获程序录制短视频片段并将其发送到远程服务器进行发布。因此，作为替代方案，可以使用基于令牌的认证方法，无论是作为独立认证还是结合传统的字母数字密码使用。但这项技术并不普及。用户可能需要携带受信任的令牌卡读取器。面对未知的令牌读取器，用户可能不知道自己使用的是受信任的合法读取器，还是可能克隆令牌的不受信任读取器（类似于最近的\
  \ ATM 卡诈骗）。\n\n尽管上述基于图像的认证系统解决了大多数威胁，但它们仍然遭受以下攻击：重放攻击、肩窥攻击和屏幕录制。\n\n有人可能会辩称，重放攻击可以通过加密和防篡改时间戳来防止，物理肩窥攻击可能为用户所知，因为此过程具有侵入性。然而，由于高带宽移动设备和轻量级、高效视频编解码器的普及，流氓程序可能能够捕获密码并远程发布。由于我们已知的所有基于图像的密码方案都使用静态密码，录制的视频可能被重放，并通过一些人工交互，用户的密码可能被解码。此外，使用固定图像或静态密码容易受到内部软件录制的攻击，例如特洛伊木马软件，这可能被远程黑客控制。特洛伊木马通常充当不可检测的后门，联系控制器，后者随后可对受影响设备进行未经授权的访问。因此，加密和防篡改时间戳不足以防止此类用户遭受重放攻击和肩窥攻击。表\
  \ 1 总结了认证方案的优缺点。\n\n######## 表 1. 认证方案总结\n\n| | 示例 | 优势 | 劣势 |\n| --- | --- | ---\
  \ | --- |\n| 基于文本 | 字母数字 | 易于使用、成本不高、易于实现 | 易受猜测和攻击，如字典攻击、肩窥攻击、重放攻击、社会工程学等 |\n|\
  \ 基于令牌 | 卡片、一次性密码令牌机 | 易于使用、比基于文本的更安全 | 令牌的额外成本，易受中间人攻击、丢失和盗窃、肩窥攻击等攻击 |\n| 基于生物特征\
  \ | 指纹、语音、面部和虹膜识别 | 简单易用、无需记忆密码 | 实施成本高、易受中间人攻击、重放攻击和内部录制攻击 |\n| 基于图形 | Awase-E、AuthentiGraph、Passdoodle、Draw\
  \ a secret | 易于使用和记忆。 | 易受重放攻击和肩窥攻击，需要额外硬件 |\n| 基于图像 | Blonder、Passfaces、Passpoint\
  \ | 易于记忆、比其他方案更安全。 | 易受肩窥攻击和重放攻击 |\n\n####### 匿名认证\n\n匿名认证和位置隐私的概念可分为三大类。\n\n########\
  \ 加密 IMSI\n\n在 LTE（长期演进）网络的认证协议中，IMSI（国际移动用户识别码）的捕获已被视为隐私挑战。因此，存在一种基于公钥密码学在传输过程中加密\
  \ IMSI 的自认证方案，称为“SP-AKA”。然而，两个传输身份之间的关联至今仍是隐私顾虑。Sanaa 等人 (2017) 在研究异构网络时，考虑了移动节点的匿名性和位置隐私。他们认为，保护某些移动节点的位置隐私是通过异构网络进行可信漫游所面临的挑战。因此，作者为“mobileIPv6\
  \ 无线网络”提出了“匿名归属构建”的更新方案。该方案包含实现相互认证以及在两个匿名网络之间共享对称密钥。现有文献还揭示，4G 网络伴随着多宿主、位置隐私和移动性等诸多挑战。因此，引入了一种用于修改的代理协议，即\
  \ IPv6 协议。在该方案中，利用虚拟身份实现位置隐私。然而，这些代理协议允许归属实体将特权委托给其他实体代表其进入。因此，正如 Jabr (2017) 所讨论的，冒充攻击至今仍然存在。\n\
  \n######## 基于动态身份的隐私\n\n正如 Hamandi (2013) 所述，互联网连接和 AP（接入点）被视为不可信实体。因此，活动和被动攻击者可能通过这些不可信的互联网连接和\
  \ AP 传播，以侵犯用户设备的隐私。为了保护用户设备的隐私，分配了一些动态身份，而不是使用传统的 IMSI 来创建化名“W-AKA”。“归属用户服务器 (HSS)”实体必须在每次认证过程中定期或最初会面，这给网络造成了巨大的开销。此外，由于即将到来的化名是在先前化名的帮助下生成的，该方案除了实现进一步的保密性外，未实现后向保密性。此外，在注册过程中必须以明文传输\
  \ IMSI，这导致建立了与 IMSI 的关联。\n\n同样，Gier M. Koien (2013) 提出了一种称为相互认证的增强隐私方法，即密码学，因为他认为用户设备隐私可能通过追踪攻击被侵犯，因为此类攻击可能针对用户设备的临时身份序列。因此，文献提供了作者利用公钥加密，使用虚拟\
  \ IMSI 构建能够抵御追踪攻击的临时不可链接身份。然而，该方案增加了执行认证所需的消息数量，导致消耗大量网络带宽，Zaher (2013)。\n\n########\
  \ 基于化名的隐私\n\n\n\n\n######## 用于实现 IMSI 的认证方案 (HSK-AKA) 中的假名\n\n用于实现 IMSI 的认证方案 (HSK-AKA)\
  \ 中的假名由 Hamandi 等人 (2013) 提出。由于所提认证方案必须到达 HSS，该方案会消耗网络带宽。此外，网络实体——移动性管理实体和用户设备——不具备检查假名准确性的能力。因此，恶意攻击者仍然是一个问题。\n\
  \n用户设备的永久 ID 提出了一种基于假名的认证方案，用于保护 IMSI 隐私。另一方面，预期的认证方案必须到达 HSS，这需要消耗更多带宽。此外，所提方案依赖于一组新颖的函数，这可能适用也可能不适用于\
  \ LTE 网络基础设施。\n\n此外，Parne 等人 (2019) 在 LTE 认证方案中利用假名来保护 IMSI 隐私。正如 Haddad (2017)\
  \ 所证明的，由于攻击者有能力将两个永久假名关联起来，可追踪攻击仍然是一个挑战。\n\n######## 现有认证方案中的漏洞\n\n上述认证方案易受多种威胁攻击，例如：\n\
  \n*   偷窥攻击\n*   重放攻击（内部或外部记录）\n\n在下一节中，研究人员提出了一种免疫上述威胁的认证方案。所提认证方案，我们称之为**隐式密码认证系统**，属于基于图形的技术。IPAS\
  \ 具有轻量级、易记忆、且难以被常见攻击方法破解的特点。此外，IPAS 以友好灵活的方式适用于移动和非移动设备。\n\n####### 隐式密码认证系统 (IPAS)\n\
  \n认证是防止机密性和完整性受损的第一道防线。尽管传统的登录/基于密码的方案易于实现，但它们一直遭受多种攻击。作为替代方案，引入了基于令牌和生物特征的认证系统。然而，它们的改进尚不足以证明投资的合理性。因此，引入了登录/密码方案的一种变体，即图形方案，但它也因偷窥攻击和屏幕转储攻击而受损。在本节中，研究人员介绍了一个由\
  \ Almuairfi 等人 (2011) 发起的名为**隐式密码认证系统** 的框架，该框架能免疫其他认证方案所遭受的常见攻击。\n\n######## 概述\n\
  \nIPAS 类似于图形方案，但有一些细微差别。在我们所知的每一种“你知道要输入什么”的认证方案中，服务器都要求用户复现注册时提供给服务器的事实。这在图形密码（如\
  \ PassPoint）中同样适用。\n\n在 IPAS 中，我们将密码视为服务器在注册时已知的一条信息。在认证时，用户以只有服务器能理解的隐式形式提供该信息。IPAS\
  \ 也可实现在任何客户端-服务器环境中，用于将人类作为客户端进行认证（IPAS 不适用于机器对机器认证）。作者还假设服务器拥有足够的硬件资源，如内存和 CPU。这并不夸张，因为高端服务器正日益变得廉价。\n\
  \n######## IPAS 实现\n\n认证系统通常包含客户端和服务端两个组件。每个组件通过定义标准接口函数和初始化函数来促进实现，该初始化函数将模块注册到系统中。事实上，客户端-服务器模型比其他模型是一种更具可扩展性的客户端认证方法。\n\
  \n因此，IPAS 的设计模型是一个客户端-服务器模型，其中两端都必须受信。当客户端连接到服务器（云）并随后受信时，即完成认证。经过认证的用户操作将根据特定的访问控制策略进行检查，该策略控制允许或拒绝访问。\n\
  \n######## IPAS 设计阶段\n\n客户端设备可以是任何便携设备，如笔记本电脑或手机。手机在我们的日常生活中变得越来越重要。一个主要原因是手机集成了越来越多的功能，如互联网浏览、移动银行和购物。一些最新的智能手机在性能上类似于十年前的高端台式电脑。\n\
  \n人们现在比以前更加关注他们的手机，这使得手机相对较难丢失，相比之下，用户不太在意的设备（如 USB 闪存驱动器）更容易丢失。然而，拥有这种安全优势还不足以证明手机比\
  \ USB 驱动器更适合网上银行认证。因此，对手机、恶意软件和应用程序进行深入检查是必要的。\n\nIPAS 通过允许用户在移动中以高安全性和可用性访问其账户，考虑了这一问题。我们的系统不需要任何高端专用软件。拥有标准网页浏览器和互联网连接即可启动我们的应用程序。因此，我们的系统可以从智能手机很好地扩展到台式电脑。\n\
  \n另一方面，服务器（位于云端）是 IPAS 设计模型中的另一个实体。然而，我们假设客户端和服务器之间的通信通过 **SSL (Secure Socket Layer，安全套接字层)**\
  \ 和 **IPSec** 等协议是安全且受信的，可防止恶意中间节点缓存并进行离线猜测。这仅增加了一层额外保护。然而，IPAS 认证过程即使没有此假设仍可工作。\n\
  \n位于云端的服务器应配备适当的安全措施，如防火墙、入侵检测系统和快速恢复机制，以保证信息安全。认证服务器是我们设计模型中最重要的服务器之一，应包含一个**智能图形模块**，以将用户信息/答案转换为图像。\n\
  \n该图像隐式地代表用户的密码，将在认证过程中推送到客户端设备。只有当用户点击图像中与存储信息匹配的正确对象时，才会通过认证。此外，认证服务器与主图像数据库服务器之间应建立受信链接，以实现此认证级别的访问控制目的。\n\
  \n######## IPAS 开发模型\n\n在该阶段，研究人员提供了重构 IPAS 所需的系统需求。客户端-服务器交互始于定义各方的需求。因此，我们需要定义系统属性，这些属性可被任何组织或用于任何支付环境。\n\
  \n######### 图像数据库\n\n服务器端的图像数据库是我们认证方案的核心。根据用户数量，图像数据库可能包含数万到数百万张图像。系统管理员和/或用户可定期添加更多图像。\n\
  \n每张图像可能包含多个“可点击”对象。每个可点击对象关联一个或多个文本关键词。图像中的某些对象将被用作诱饵对象，以提高 IPAS 的安全级别。图像对象与关联文本之间的关系在我们的认证方案中起着重要作用，将在本章后面描述。\n\
  \n########## 注册阶段\n\n\n\n\n\n########## 注册阶段\n\n在此阶段，将收集用户的初始信息，以使其能够使用该系统。在注册时（无论是在线还是离线），系统会向用户提供一组不同的主题，例如童年回忆、当前爱好、梦想假期等。用户可能需要从\
  \ `n` 个主题中选择 `m` 个（其中 `m` 和 `n` 是由领域专家决定的系统参数）。\n\n对于每个选定的主题，用户必须提供一个包含足够信息的故事（同样，这取决于具体应用和领域）。如果信息不足，系统将再次提示用户输入更多信息。用户提供的故事为该用户创建了一个个性化的信息空间（类似于静态密码）。\n\
  \n现在作者通过一个示例演示此功能。在此，用户描述了他/她的童年经历。\n\n> “回想起来，我度过了一个真正美好的童年。我相信一些孩子理应相信的事物，比如圣诞老人和牙仙，这让生活充满了期待。圣诞节总是过得很开心，玩具摆放得就像圣诞老人来过一样；掉牙时，我把牙齿放在枕头下，就会得到钱。我喜欢玩童年游戏，和表兄弟姐妹及其他孩子一起玩。我迷恋芭比娃娃，拥有很多芭比娃娃和芭比娃娃屋。我有一辆自行车和一辆滑板车。我拥有家人的爱与关怀，并深知这一点。我喜欢在蹦床上跳跃和在户外玩耍。嗯，小时候生活真美好！我可以随心所欲地打扮，没有真正的烦恼。我日子过得不辛苦；过得又好又轻松。我讨厌鬼魂和恐怖故事。我总是害怕黑暗的地方和独自一人。”\n\
  \n基于给定的故事，系统将从每个可能的句子中提取关键词和信息，或者系统管理员可能从给定的故事中提取关键词。以下是可能的关键词和信息：\n\n*   圣诞老人\n\
  *   牙仙\n*   在蹦床上跳跃\n*   讨厌鬼魂和恐怖故事\n*   害怕黑暗的地方和独自一人\n*   迷恋芭比娃娃。拥有芭比娃娃屋。\n*   喜欢和表兄弟姐妹及朋友一起玩。\n\
  \n基于这些信息，系统可能会创建或链接到现有的图像数据库。关键词和信息将被嵌入图像中，并在认证过程中隐式地呈现给用户。用户必须点击正确的对象来代表他/她的答案。研究表明，这些信息比复杂密码更容易记忆。\n\
  \n########## 分割阶段\n\n在此阶段，系统致力于创建用户记录答案（关键词）的可视化图像，从而引导出界面行为。可视化中使用的工具旨在改进系统设计，以便在系统开发中实现的技术能够被完美地分割。\n\
  \n据 Merch 和 White (2003) 报道，图像关系功能可分为三组：(A) 表达与文本远/疏远关系的功能；(B) 表达与文本近/紧密关系的功能；(C)\
  \ 超越文本的功能。应用这些组别可识别每个图像的隐式程度。该概念的语义变体可由系统开发人员快速且轻松地开发。因此，实施一项新的技术分段将需要专业技能、时间以及许多组织必须考虑在内的大量资源。\n\
  \n########## 认证阶段\n\n首先，用户可通过提供其用户名和所需的访问级别来请求访问系统。这可能以明文形式发送。根据所需的访问级别，系统可能会要求用户在注册过程中选定的\
  \ `m` 个领域中提供 `k` 个。对于每个选定的领域，服务器可能会从用户的故事中提取的关键词中随机选取一个。对于每个关键词，服务器可能会再次从图像数据库中随机选取一张包含具有所选文本属性对象的图像。\n\
  \n类似于 Kerberos，会话密钥 `S` 通过函数 `f(I)` 从正确的可点击区域派生而来。服务器将选择一个随机数 `p`，然后用会话密钥 `S` 加密\
  \ `p`，并将 `(Image, S[p], f(I))` 传输到移动设备。客户端应用程序随后显示该图像。用户需要使用触控笔或鼠标选择正确的“可点击区域”。然后，基于函数\
  \ `f(I)`、图像 `I` 以及用户点击的区域，客户端将生成一个密钥 `K`。函数 `f(I)` 的选择方式使得 `S = K` 当且仅当用户和服务器在图像中拥有完全相同的关注区域。用户随后解密\
  \ `S[p]` 以获得随机数。然后他传输 `p+1` 给服务器进行认证并进入下一级。通过这种方式，用户被隐式认证，且无机密信息在网络上交换。当服务器在认证过程中执行最后一个问题时，它不会加密伪随机数，而是会选取一个会话密钥并用派生密钥对其加密。当客户端解密它时，他会从服务器接收到一条隐式消息，指示使用此会话密钥进行传输。此过程不仅隐式地认证用户，还隐式地交换会话密钥。\n\
  \n图 6 展示了已注册用户的 IPAS 客户端/服务器认证过程步骤，如下所示：\n\n1.  用户使用其移动电话设备或计算机向 IPAS 服务器发送认证（登录）请求。\n\
  2.  服务器检查用户的注册状态。如果用户未注册，则认证过程失败（结束）；但是，对于已注册用户，它将继续下一步。\n3.  系统根据用户预设的 IPAS 域和图像中对象的隐式级别检查用户的访问级别（在支付流程的情况下，访问控制将检查支付金额以做出决定）。\n\
  4.  根据步骤 3 的输出，创建 IPAS 认证图像并发送给用户。\n5.  用户收到带有 IPAS 图像的服务器响应。如果用户点击了错误的对象来代表其密码，则他/她需要重新发送认证请求（即返回步骤\
  \ 1）。但是，如果用户在 IPAS 图像中点击了正确的对象，则用户将通过认证（登录）。\n\n![图 6. IPAS 客户端/服务器认证过程](img/ch003.f06.png)\n\
  \n在本节中，我们展示了用户（客户端）和服务器（云）之间 IPAS 认证过程的高层流程图。上述步骤展示了客户端和服务器为认证目的而进行的交互架构。我们未来的方向将集中于使用\
  \ UML（统一建模语言）设计详细的软件架构/原型，这将包括软件工程和数学模型。我们认为 IPAS 是一个包含多个阶段的复杂项目；因此，更多的科学模型和系统流程将留待未来的设计、开发和实施。此外，IPAS\
  \ 及其域性能指标的更多分析模型将在后续阶段涵盖。通信/网络媒体和移动设备能力的快速发展将帮助我们形成 IPAS 剩余阶段的未来工作。\n\n########\
  \ 数据库和图像特征\n\n\n\n\n######## 用户画像与智能图像服务器关联\n\n包含个人信息、账户数据、访问控制级别以及身份验证问题和答案的用户画像将链接到智能图像服务器。每个身份验证图像可能包含一个或多个“可点击对象”，这些对象代表用户的关键字或信息。例如，“蹦床”代表用户说她喜欢跳的关键字之一。对于其他用户，它可能代表他/她最讨厌的游戏；可能代表黑色；可能代表体操等。因此，图像可能具有以下特征：\n\
  \n*   图像可能包含一个或多个对象\n*   每个可点击区域可能关联不同的关键字\n*   每个对象一次隐式代表一个答案\n*   对象只能点击一次\n*\
  \   图像中可能存在一些诱饵对象以提高安全级别\n*   每次呈现时，每个关键字将由不同的对象代表\n\n系统选取图像的方式使得“预期”关键字仅存在于呈现的图像中。例如，如果预期答案是蹦床，而图像同时包含蹦床和“芭比”娃娃，则存在冲突。为避免冲突，系统可能会选择仅包含一个预期关键字的图像，或将代表“芭比”的区域设为“不可点击”。\n\
  \n如前所述，`IPAS` 密码是用户（客户端）和系统（云端服务器）共知的一条信息。该信息存储在数据库服务器中（关联至用户画像），用于身份验证过程。密码以隐式方式通过图像呈现给合法用户，这是\
  \ `IPAS` 身份验证的主要方法。呈现对象的隐式级别将根据访问控制级别而变化，该级别在用户与管理员（云系统）的注册阶段决定。\n\n在某些情况下（如手机屏幕显示不清晰），用户可能难以处理\
  \ `IPAS` 身份验证过程中代表其密码的图像。此时，`IPAS` 提供辅助选项以继续身份验证过程。这些辅助选项是基于文本或基于令牌的身份验证方法，用户可在注册阶段将其作为可选方法选择。辅助身份验证选项不会影响\
  \ `IPAS` 的安全级别，用户的匿名级别也无变化。\n\n若用户难以处理 `IPAS` 主要身份验证图像，可切换至基于文本的方法。此场景下，用户将使用设备键盘输入密码，而非点击图像上的对象。若密码尝试失败，用户可请求另一次尝试（涉及另一次身份验证请求）。用户以加密显式形式输入密码，该形式代表\
  \ `IPAS` 图像中的隐式对象。下一个密码与前一个不同，消除了因重放攻击或窥视黑客导致密码被复制或记录的可能性。因此，用户切换至 `IPAS` 辅助选项时，安全级别不受影响。\n\
  \n在基于令牌的辅助选项方法中（特别是数字形式的密码），用户可在需要时从 `IPAS` 主要方法切换至辅助方法。此场景不影响 `IPAS` 安全级别，且免疫任何外部或内部攻击。用户可使用\
  \ `OTP`（一次性密码）令牌，它代表用户在 `IPAS` 身份验证过程中的密码。该密码每次都会变化，将密码被复制或记录的可能性降至最低。如今，`OTP` 软令牌作为手机应用程序可用，有助于消除传统硬件令牌的额外成本。因此，`IPAS`\
  \ 辅助身份验证选项安全且免疫外部和内部攻击。此外，辅助选项展示了 `IPAS` 作为灵活且用户友好的身份验证系统的动态特性。\n\n结果，用户可在无法识别当前图像时请求另一图像，或随时切换至基于文本/令牌的方法。因此，`IPAS`\
  \ 提供了灵活的身份验证环境，增强了方案的用户友好性，并提供了如上所述的高安全级别。\n\n######## IPAS 示例场景\n\n针对每个关键字（密码），服务器可使用图像创建智能身份验证空间，将各用户针对特定关键字的答案隐式嵌入图像中。身份验证时，服务器可随机选取用户注册时选择的一个或多个关键字（关键字数量取决于请求的服务级别）。针对每个选定关键字，服务器可从身份验证空间随机选择一幅图像作为挑战呈现给用户。用户需使用手写笔或鼠标浏览图像并点击正确答案。例如，服务器可能呈现一幅地球图片。若悉尼是用户喜欢访问或已访问过的城市，他需点击澳大利亚。随后澳大利亚放大，用户需在地图上点击悉尼（如图\
  \ 7 所示）。下一次若服务器选中相同关键字，呈现的场景可能不同。下一次服务器可能显示包含著名建筑和纪念碑的图像。用户需点击“悉尼歌剧院”以隐式传达答案。由于服务器每次使用不同场景且答案隐式给出，该系统免疫屏幕捕获攻击。此外，除服务器和合法用户外，对其他人答案可能模糊不清。例如，用户点击“歌剧院”可能意味着“用户喜欢聆听的音乐类型”，或代表其“出生地”、“当前居住地”等。\n\
  \n| Figure 7. |\n| :--- |\n| ![Figure978-1-7998-2701-6.ch003.f07](img/ch003.f07.png)\
  \ |\n\n######## IPAS 组件\n\n大多数当前用于用户身份验证的方案在静态过程中运行（如密码或令牌），然而 `IPAS` 的灵活性根据所需操作的访问级别，为用户提供了身份验证过程的空间和选择。因此，用户可随时使用相同信息从基于图像的方法切换至基于文本的方法，详见下一小节。\n\
  \n######### 智能基于图像的身份验证选项\n\n基于图像的身份验证是 `IPAS` 的主要组件，用户的答案在身份验证过程中隐式呈现于图像中。系统将根据先前分阶段描述的请求访问级别选择图像的隐式级别。因此，用户需点击图像中代表其答案的正确对象以完成身份验证。随后，访问控制模块将允许用户执行所需操作和动作。\n\
  \n得益于 `IPAS` 的动态性和高灵活性，用户可在成功导航基于图像的方法时随时切换至基于文本的方法。此外，若用户在当前图像上遇到困难，可请求另一幅图像。\n\
  \n######### 智能基于文本的身份验证选项\n\n\n\n######## IPAS 认证方法\n\n######### 基于文本的方法\n\n在基于文本的方法中，允许用户使用键盘输入答案。这些答案（关键词）代表给定图像中的隐式对象。例如，如果图像包含苹果或枕头的隐式对象，用户可以输入“apple”或“pillow”。只有当用户针对给定隐式图像的对象输入正确答案时，才会通过认证。然后，访问控制模块将控制所需的操作。\n\
  \n######### 基于令牌的方法\n\n与基于文本的方法类似，用户可以切换到基于令牌的“所拥有物”类型的密码，特别是数字密码。因此，如果用户因某些原因无法正确响应基于图像的方法，他/她可以随时切换到基于令牌的方法。例如，某些银行提供的一次性密码（OTP）令牌，可用作数字密码，适用于用户无法在隐式基于图像的方法中识别数字的情况。\n\
  \n######### 隐私与可用性考量\n\n出于认证目的，最好依赖用户已知的信息，而不是要求他/她记忆额外的信息。一般来说，收集用户信息的系统或注册机构应了解用户隐私原则。因此，IPAS\
  \ 的隐私、安全性和可用性是主要关注点。\n\n######## IPAS 域\n\nIPAS 提供另一项服务，允许系统用于任何客户端-服务器环境。IPAS 的域服务使其足够灵活，适用于任何组织，无论位置或规模如何。注册用户可根据其交互行为分类为：区域/州域和词汇空间/距离域。\n\
  \n######### 区域/州域\n\n系统中的各类用户有时对其需求有不同的看法。例如，身处美国的人的认知可能与身处澳大利亚的人不同。因此，系统在创建用户密码时会考虑用户所属的区域/地区，并将其信息链接到区域域。结果，认证图像中的对象将与用户的区域相关。例如，如果关键词或信息是“Opera”，澳大利亚用户可能容易识别悉尼歌剧院，而欧洲用户可能更容易识别伦敦科利塞姆剧院，而不是悉尼歌剧院（甚至可能完全无法识别）。因此，该域下的系统将依赖于国家/地区，这应在生产推出模块中予以考虑。\n\
  \n######### 词汇空间/距离域\n\n其次，空间/距离域将依赖图像与单词之间分类关系的分类法，可用于分析图像与文本的交互方式。Merch 和 White\
  \ (2003) 指出，该分类法确定了图像针对相关文本执行的 49 种功能。例如，设选定的关键词为“apple”。包含苹果派的图像将代表与单词“apple”较近的关系，而包含史蒂夫·乔布斯的图像将代表与单词“apple”较远的关系。因此，词汇空间/距离域可根据所需的安全级别应用其中一些功能。\n\
  \n######### 域的影响\n\n上述域是 IPAS 的关键组件，因为它们提高了其可用性和安全性。将用户链接到其所在区域的区域域，提高了 IPAS 的可用性和用户友好标准；而用户选择关键词与图像之间隐式层级的距离域，增强了\
  \ IPAS 的安全性和匿名性级别，如下所述。\n\n######## IPAS 评估标准\n\n作为 IPAS 设计和评估的辅助，考虑了匿名性、安全性和可用性标准。\n\
  \n######### 匿名性\n\n在使用个人信息的环境中，遵循公认的隐私原则应成为常规做法。例如，收集的个人用户信息应仅用于认证过程。此外，此类问题的答案应允许用户访问其账户的特定级别。\n\
  \n##### 安全性\n\n一般来说，IPAS 的安全性关注保护用户的账户信息和财务记录。另一方面，在密码空间方面，将 IPAS 与其他认证方案进行比较，显示了\
  \ IPAS 在安全性标准方面的优势。此外，正式攻击破解 IPAS 的难度提高了其相对于其他方案的安全级别。\n\n######### 可用性\n\nIPAS\
  \ 的可用性关注在回答从用户先前提供的难忘故事中挑选出的个人问题阶段，提供用户友好的体验。事实上，使用信息作为密码，可以使用户在认证过程中轻松记住其密码。此外，在某些情况下，IPAS\
  \ 不用作常规认证的替代品，而是作为附加因素。因此，允许用户随时切换回常规认证过程，例如使用常规用户名和密码。\n\n######## IPAS 的优势与局限性\n\
  \n显而易见，IPAS 免疫窥视攻击和屏幕转储攻击。此外，认证信息以隐式形式呈现给用户，仅合法最终用户能够理解和解码。在 IPAS 中，客户端和服务器之间不交换任何密码信息。由于认证信息是隐式传达的，IPAS\
  \ 能够容忍窥视攻击和屏幕转储攻击，而现有方案均无法容忍。IPAS 的优势在于创建一个良好的认证空间，拥有足够大的图像集合以避免短周期重复。与我们研究中回顾的其他方法相比，IPAS\
  \ 可能需要人工交互以及精心选择图像和“可点击”区域。传统的基于密码的认证方案和 PassPoint 是 IPAS 的特例。IPAS 的伮势在很大程度上取决于认证信息嵌入图像的隐式效果如何，它应易于合法用户解密，而对非合法用户则高度模糊。\n\
  \n此外，IPAS 提供了如下可接受级别的属性：\n\n######### 正确性\n\n每个单独认证实例的结果应是正确的。只有合法用户能轻松通过认证步骤，获得对系统的正确访问权限。\n\
  \n######### 用户匿名性与隐私\n\n在 IPAS 中完成认证过程，无需泄露用户的真实身份，也不会被黑客知晓。\n\n######### 速度\n\n\
  IPAS 认证过程快速且灵活，可在任何客户端-服务器环境中实施，且适用于手机。\n\n######### 抗攻击性\n\nIPAS 对重放攻击、外部泄露、猜测攻击、通信窃听和主机入侵等常见攻击提供强有力的抵抗。\n\
  \n######### 低成本\n\n与基于令牌的认证技术不同，IPAS 无需任何额外设备即可用于认证目的。\n\n######### 通用性\n\nIPAS\
  \ 用户将在所有服务和任何地方使用相同的认证方法，根据其属性应用 IPAS 域。\n\n######## 抵抗攻击\n\nIPAS 能抵抗暴力攻击、窥视攻击、字典攻击和重放攻击等。\n\
  \n######### 暴力攻击\n\nIPAS 通过拥有庞大的密码空间（由基于文本的密码或基于图形的密码组成）来防范暴力攻击。\n\n######### 字典攻击\n\
  \n由于 IPAS 包含高度的随机性，因此很难对其发起字典攻击。\n\n\n\n\n\n######### 肩窥攻击\n\n肩窥攻击基本上是指在用户输入密码时，通过摄像头在用户肩后观察或记录其密码。IPAS\
  \ 通过在每次认证时提供一个新的隐式对象作为密码，从而免疫此类攻击。\n\n######### 重放攻击\n\n键盘记录器或键盘间谍软件无法破解 IPAS 方案，鼠标追踪软件也无法攻破\
  \ IPAS，因为它完全受到保护，免受这些威胁。\n\n######## IPAS 局限性\n\n与任何系统一样，IPAS 因各种组件（如网络、人为因素和系统硬件问题）而存在一定的局限性。最常见的复杂情况可能被视为\
  \ IPAS 过程的障碍，并可能影响系统性能，具体如下：\n\n*   **某些位置网络和无线通信的覆盖范围有限或较短**，导致用户（客户端）无法与服务器或服务提供商通信，尤其是在支付认证过程中。\n\
  *   **客户端移动设备的存储空间、屏幕显示或处理能力有限**，可能导致处理 IPAS 图像时出现延迟。\n*   **用户频繁登录**可能导致 IPAS 图像在特定层级上重复出现，例如，使用\
  \ IPAS 登录设有 1 分钟自动锁屏的手机，若用户一小时内登录超过 30 次。这种情况需要许多图像来表示用户的密码，可能导致服务器端过载。\n*   有人认为即使是隐式对象也可能被猜测。\n\
  \n研究人员尝试通过应用不同的解决方案来最小化上述局限性，这有助于稳定 IPAS 的使用。第一种解决方案是为用户提供可选的次要方法，当他们在处理 IPAS 主要认证方法时遇到困难，可以切换到基于文本或基于令牌的方法。第二种解决方案取决于\
  \ IPAS 域，它帮助用户在 IPAS 图像中选择其对象的隐式层级，如前一节所述。最后，为避免图像重复，用户可以使用实时个人图像（用自己的相机拍摄）更新其个人资料，并不时更改代表其密码的关键词。由于我们旨在引入一种免疫常见攻击（如重放攻击（内部和外部）和/或肩窥攻击）的认证方案，上述解决方案有助于最小化上述\
  \ IPAS 局限性的副作用，但无法完全消除它们。\n\n######## 总结\n\n在本章中，作者介绍了 IPAS 及其应用，它们解决了其他认证方案的安全缺陷，并在云环境中为多媒体数据提供了安全性与匿名性之间可接受的平衡。\n\
  \n在认证方面，IPAS 具有以下诸多特性：\n\n*   **免疫重放攻击和肩窥攻击**，这些被认为是其他认证系统和基于图形的密码认证系统（如 PassPoint）的主要问题，IPAS\
  \ 通过在每次认证时以隐式形式提供新图像来解决。\n*   **灵活**，与其他基于图形的认证技术相比，用户若在处理图像时遇到困难，可通过应用智能基于文本的认证选项切换到基于文本的密码。\n\
  *   **IPAS 域**根据用户需求提供不同级别的安全性。\n*   **可在移动和非移动设备上实现**。总体而言，IPAS 是一种客户端-服务器认证，可在个人电脑和手机上运行。\n\
  *   **IPAS 将提高云中多媒体数据的安全级别。**\n*   **IPAS 是一种面向移动用户的快速且灵活的认证方案。**\n*   **所提方案的计算成本可接受，并能适应不同的安全级别。**\n\
  \n####### 结论\n\n云计算技术为用户提供了节省成本和服务灵活性。随着多媒体数据的爆发式增长，越来越多的数据所有者将其个人多媒体数据外包到云端。隐私保护近年来是云计算中的热门话题。一旦用户数据泄露，负面影响可能非常巨大。因此，隐私保护技术的发展是云计算的关键因素。IPAS\
  \ 可为用户在云环境中的多媒体数据提供第一层保护和便捷访问。它在移动银行、多媒体数据和在线购物等某些敏感应用中非常理想且有用。\n\n##### 参考文献\n\n\
