  \n##### 作者\n\n*   **José María Jorquera Valero**  \n    穆尔西亚大学，西班牙\n\n*   **Pedro\
  \ Miguel Sánchez Sánchez**  \n    穆尔西亚大学，西班牙\n\n*   **Alberto Huertas Celdran**\
  \  \n    ![Orcid Image](https://orcid.org/0000-0001-7125-1710)  \n    沃特福德理工学院，爱尔兰\n\
  \n*   **Gregorio Martínez Pérez**  \n    穆尔西亚大学，西班牙\n\n##### 摘要\n\n持续认证系统允许用户无需持有或记忆任何凭据即可完成自我认证。这些系统执行永久性认证，提升了仅间歇性认证的传统机制的安全级别。尽管持续认证益处良多，但用于建模用户行为的维度与特征选择，以及基于机器学习的精确模型创建与管理，仍是两大开放性挑战。本章提出了一种基于异常检测的机器学习技术的持续自适应认证系统。通过考量应用使用情况和移动设备位置，检测用户与设备交互时的异常行为。所提系统通过模式的插入与删除，提供了对行为变化的适应性。最后，概念验证及若干实验论证了设计与实现过程中决策的合理性，并证明了其适用性与性能。\n\
  \n##### 1. 引言\n\n持续认证系统提供的安全级别（Gupta, Yamaguchi, & Agrawal, 2018）高于传统认证系统。这是因为传统系统依赖密码、图案或\
  \ PIN 码，这些凭据可能丢失、遗忘或被攻击者破解。此外，用户往往在不同服务中使用相同的认证凭据，一旦被窃取便会造成安全隐患。在此背景下，持续认证系统允许用户无需持有或记忆凭据即可在设备或系统中完成自我认证。这一特性改善了用户的服务质量体验，因为它使得需要预先认证的操作能以更快捷、简便的方式完成。这是因为持续认证系统负责在不要求新凭据的情况下执行认证。除了当前移动设备提供的各种传统安全技术外，持续认证用户的能力提供了更高级别的安全性。此外，它还允许用户以更简单、敏捷和愉悦的方式与需要预先认证的应用程序进行交互。\n\
  \n多媒体移动设备（Jararweh et al., 2017）是持续认证应用的最重要对象之一。这些设备的使用已成为工业化国家大多数人口的日常活动，例如，截至今日（2019\
  \ 年），全球有 27.1 亿智能手机用户（Deyan, 2019）。在这广泛的多媒体移动设备范围内，其用途种类繁多，从社交网络、拍照或录像、网上银行、娱乐等私人个人用途，到生成发票、查询客户数据等专业用途。存储在多媒体设备中的敏感信息及其使用极为重要（Huertas,\
  \ Gil, García & Martínez, 2016），因此必须采取若干知识管理措施。私人信息应受到保护，因此大多数用户通过控制设备访问来限制对该信息的访问。为此，有必要使用认证机制。\n\
  \n基于用户行为（行为生物识别）的认证机制理念应运而生，作为提升多媒体移动设备安全性（Gupta, 2018）的潜在解决方案。这些机制允许持续分析设备所有者的行为模式。在对用户行为建模后，认证系统创建一个与该行为或行为相关联的行为档案。最后，认证系统实时将移动设备的当前行为与所有者的存储档案进行评估。根据该评估的数值输出，系统判断使用设备的人是否为所有者。该机制是被动的，不需要改变用户与设备之间的交互方式。请注意，若处理在外部云中进行，应采取额外措施以保护用户隐私（Olakanmi\
  \ & Dada, 2019）。\n\n尽管持续认证系统提供了如前所述的诸多益处，但也存在一些亟待解决的开放性挑战，以构建完整有效的系统。在这些开放性挑战中，我们重点强调以下几点：\n\
  \n*   **选择能够准确有效地建模用户行为的维度和特征。** 认证系统获取用户行为信息的不同设备输入源与维度的组合与选择，以及构成这些维度的特征，是正确评估用户行为的主要支柱之一。\n\
  \n*   **创建和管理塑造用户行为的模型。** 一旦选定了将纳入用户行为建模的维度，必须为每个维度选择特征。每个维度的特征集将存储在数据集中。在此背景下，必须做出的另一个重要决定是确定何时用新特征更新数据集内容以建模用户行为。这将确保系统的适应性。\n\
  \n*   **使用能在不忽视资源受限等关键方面的前提下准确认证移动设备所有者的机器学习（ML）技术。** 应使用基于异常检测而非基于用户向量分类的机器学习算法。\n\
  \n\n\n\n\n###### 改进挑战的目标：基于用户行为的多媒体移动设备机器学习自适应持续认证系统\n\n旨在改进以往的挑战，本章提出了一种基于用户行为的多媒体移动设备机器学习自适应持续认证系统。该系统能够根据移动设备的位置和多媒体应用的使用情况创建用户行为档案。档案创建后，该解决方案利用基于异常检测的机器学习技术，实时测量当前设备使用情况与档案建模的已知行为之间的相似度。该持续认证系统具有足够的通用性，可适应不同的现实环境。本章展示了一系列实验，以证明该解决方案的适用性和性能。\n\
  \n###### 本章结构\n\n本章其余部分结构如下：\n\n- **第 2 节** 回顾同领域的先前工作，重点关注在准确率方面取得良好结果的解决方案。\n\
  - **第 3 节** 解释所提方案的方法论，重点介绍不同的现有机器学习技术。本节还详述了该方案的设计与实现细节。\n- **第 4 节** 结合现有方案讨论所提方案。\n\
  - **第 5 节** 通过一系列测试演示所提方案的实用性。\n- **第 6 节** 总结已完成的工作，并提出继续开发该系统的不同未来步骤。\n\n######\
  \ 2 文献综述\n\n在当前技术水平中，可找到多项针对移动设备持续认证的研究。\n\n####### 触屏与传感器识别用户\n\n(Bo, Zhang, Li,\
  \ Huang & Wang, 2013) 通过触屏和设备传感器识别用户。在传感器维度上，作者利用加速度计和陀螺仪，开展了不同的用户实验，获取设备信息，如与屏幕交互时的旋转和振动、用户施加在屏幕上的压力和持续时间，以及上述传感器的数值（见图\
  \ 1）。实验涵盖用户静止和行走两种状态。用户按压屏幕生成的模式与行走时获得的模式相结合，可通过非侵入式技术识别用户，虚拒率（FRR）低于 1%。\n\n**图\
  \ 1. 认证流程概览**\n\n![Figure978-1-7998-2701-6.ch002.f01](img/ch002.f01.png)\n\n*(Bo,\
  \ Zhang, Li, Huang and Wang, 2013)*\n\n####### 多维度分析与分类器对比\n\n(Patel, Chellappa,\
  \ Chandra & Barbello, 2016) 分析了人脸识别、用户手势、触屏、设备移动、应用和位置等维度。作者使用 SVM (Ng, 2003)、决策树\
  \ (Gilles, 2014)、贝叶斯网络 (Ben-Gal, Ruggeri, Faltin & Kenett, 2007) 和 K-NN (Sutton,\
  \ 2012) 等机器学习分类算法进行测试。结果显示，SVM 算法产生的高计算成本是将原型部署在用户设备上的负面因素。\n\n####### 基于运动传感器的交互识别\n\
  \n(Ehatisham-ul-Haq et al., 2017) 提出了一种基于加速度计、陀螺仪和磁力计识别用户与设备交互的解决方案。基于日常习惯，作者确定了设备所处的五种位置。该框架将三种运动传感器（加速度计、陀螺仪、磁力计）组合作为活动识别和用户认证的输入数据源。作者对每个传感器的坐标应用最大值、最小值、平均值、方差、峰峰距离等公式生成不同特征。生成特征向量后，基于训练数据集对用户行为进行分类。训练数据集由不同用户的向量组成，包含各传感器函数返回的结果和设备可能的位置。向量将被分类为不同的用户档案，以赋予不同权限级别（见图\
  \ 2）：\n- **已认证用户**：获得设备完全访问权限。\n- **子用户**：行为与已认证用户相似，拥有受限访问权限。\n- **未认证用户**：权限级别为零。\n\
  \n作者使用了 SVM (Ng, 2003)、贝叶斯网络 (Ben-Gal, Ruggeri, Faltin & Kenett, 2007)、K-NN (Sutton,\
  \ 2012)、决策树 (Zhu, 2018) 等分类算法。结果表明，SVM 分类用户的平均成功率为 99.18%，贝叶斯网络为 97.38%。值得注意的是，尽管贝叶斯网络成功率略低，但其计算成本是\
  \ SVM 的五分之一，平均仅需 5 秒分类一个用户向量，而 SVM 需 25 秒。\n\n**图 2. 设备持续认证的方法论**\n\n![Figure978-1-7998-2701-6.ch002.f02](img/ch002.f02.png)\n\
  \n*(Ehatisham-ul-Haq et al., 2017)*\n\n####### 多特征融合认证\n\n(Fridman, Weber, Greenstadt\
  \ & Kam, 2017) 考虑了截然不同的特征，分别评估后再结合以获得结果。作者考量了用户输入文本、位置、使用的应用和访问的网页。实验由 200 名受试者完成，各自使用\
  \ Android 设备至少 30 天。认证系统在用户与设备交互 1 分钟后达到 0.05（5%）的等错误率（EER），30 分钟后达到 0.01（1%）。交互\
  \ 1 分钟后，位置维度对短时间内分类用户行为的贡献最大，是其他维度的两到三倍。其次依次为网页、使用的应用和用户输入（见图 3）。\n\n**图 3. 四个分类器的相对贡献**\n\
  \n![Figure978-1-7998-2701-6.ch002.f03](img/ch002.f03.png)\n\n*(Fridman, Weber, Greenstadt\
  \ & Kam, 2017)*\n\n\n\n\n\n####### 相关研究综述\n\n######## 基于键盘动力学的用户识别\n\n(Bala, 2017)\
  \ 开展的项目基于机器学习（ML）的不同特征组合和算法，生成用户画像，从而能够通过击键动力学识别用户。选择脉冲动力学作为识别用户行为的方法的主要原因在于，该技术被认为比其他生物识别方法更可靠、成本更低且速度更快。该项目的目标是在完成训练阶段后展示评估结果，该阶段存储了由一些无关特征组成的向量，并展示仅选择被认为相关的特征后的后续影响。从数据集中移除无关特征的过程可减少过拟合、提高准确率并缩短训练时间。为了筛选数据集的相关特征，我们使用\
  \ Weka 工具（Weka 3, 2019），它允许通过各种图表观察构成数据集的特征值，并选择要从输入数据集中移除的特征。此外，还使用不同的 ML 算法来检查哪种特征组合能获得最佳结果，并显示选择相关特征前后的评估值。\n\
  \n######## 基于加速度计数据的异常行为检测\n\n(Centeno, van Moorsel & Castruccio, 2017) 发表了另一篇相关文章，旨在仅通过设备的传感器（更具体地说是通过加速度计数据）检测用户的异常行为。与其他找到的文章和项目不同，在本例中，数据处理不是在设备上执行的，而是在公司的服务器（Gupta\
  \ & Agrawal, 2019）上进行的，该服务器通过接收设备中定期生成的向量来获取数据。该系统在现实场景中的有效性已被证明，在 20 秒的评估时间内可达到\
  \ 2.2% 的等错误率（EER）。为满足移动平台的内在需求，检测过程基于少量的特征生物识别数据，这些数据被发送到云端进行处理。处理用户认证请求所花费的时间微不足道（约五毫秒），而训练达到最高准确率的模型所需时间约为\
  \ 72 秒。\n\n######## 移动设备智能自适应持续认证系统\n\n(Jorquera et al., 2018) 提出了一种面向移动设备的智能自适应持续认证系统。该系统通过考虑来自应用程序、传感器的统计信息以及基于异常检测的机器学习技术，实现了用户的实时认证。多项实验证明了其解决方案的准确性、适应性和资源消耗。最后，提出了一个在线银行应用作为概念验证，允许用户根据其认证等级执行不同操作。\n\
  \n######## PALOT 框架：基于物联网的上下文感知认证授权\n\n(Nespoli et al., 2019) 提出了 PALOT 框架，该框架利用物联网（IoT）提供上下文感知、持续且非侵入式的认证和授权服务。具体而言，作者基于本体论提出了一个形式化的信息系统模型，作为框架的主要知识来源。此外，为了识别物联网生态系统中的用户行为模式，他们引入了置信度管理器模块。随后，该模块被集成到他们早期框架架构\
  \ IoTCAF（Nespoli et al., 2018）的扩展版本中，从而适配以包含上述组件。\n\n######## 面向智能办公室的持续智能认证架构\n\
  \n(Sánchez, Huertas, Fernández, Martínez & Wang, 2019) 提出了一种面向智能办公室的持续智能认证架构。该架构面向云计算范式，并考虑使用\
  \ ML 技术根据用户行为对其进行认证。一些实验证明了该解决方案在使用分类算法识别和认证不同用户时的适用性。\n\n######## 商业持续认证解决方案\n\n\
  ######### BehavioSec\n\n发现有多家公司为用户提供持续认证服务。其中，(BehavioSec, 2019) 目前是在安卓和 iOS 操作系统设备上持续认证领域提供最佳产品的私营公司。BehavioSec\
  \ 成立于 2006 年，总部位于瑞典。通过使用行为生物识别技术，他们获取属于用户行为的特征，维度包括键盘动力学、移动和手势模式，随后将这些特征结合，通过使用\
  \ ML 技术保证对异常行为的精确检测。所提供的产品通过使用一个随用户行为和能力保持更新的算法，提供透明且自适应的安全技术，因此随着用户行为和能力的变化和提升，安全层也随之改进，从而减少误报。核心算法持续改进以验证合法用户，为自动化和动态风险评估提供风险情报。\n\
  \n######### Veridium\n\nVeridium (Veridium Ltd., 2019) 是一家为移动设备提供 SDK 的公司，支持安卓和\
  \ iOS，允许将生物识别认证集成到任何企业或消费者应用程序中。为了识别用户行为，它使用摄像头、传感器、设备闪光灯以及多种生物识别因素，如设备屏幕上的压力和触摸。此外，该产品利用视觉密码学来保护用户的生物识别数据。这种密码学包含\
  \ SDK 对捕获的生物识别向量进行加密和分割。一部分存储在服务器上，而另一部分保留在设备上。为了进行用户识别，这些碎片会被重组并解密，以便在认证期间进行比较。Veridium\
  \ 允许配置 SDK，使事件的数据存储发生在您的后端服务器或设备内存中。如果将数据存储在后端服务器上，设备与服务器之间的通信将通过安全的双向 SSL 连接发送。\n\
  \n\n\n\n总部位于马萨诸塞州贝德福德的 Aware 公司提供了一款市场产品，能够通过行为和生理生物特征对用户进行认证，尽管不像之前的提案那样是连续进行的。该产品利用语音识别、面部识别、击键动力学和指纹识别。名为\
  \ Knomi 的产品通过一组运行在移动设备（Android 或 iOS）上的生物特征 SDK 以及一台服务器执行生物特征认证，二者协同工作，允许从使用生物特征数据的单一移动设备上进行强认证、多因子认证和无密码认证。Knomi\
  \ 软件组件可用于不同的组合和配置，以实现以服务器为中心的架构或以设备为中心的实现。另一家提供基于连续认证产品的公司是 Zighra，它提供了一个由人工智能驱动的连续认证和威胁检测平台，既适用于移动设备（Android\
  \ 和 iOS），也适用于 Web 端。其产品名为 SensifyID，结合了生成行为模型和生物系统的知识，与当今使用的 AI 方法相比，能够更快地训练、动态适应并加速威胁检测。更具体地说，它利用位置、用户书写技巧、网络和传感器等维度。该产品由基于任务的认证技术组成，通过这些技术，系统会要求用户执行特定操作，以证明当前使用设备的人是合法所有者。此外，为了识别用户行为，他们使用专有的\
  \ ML 和 AI 算法，能够持续学习用户行为，最重要的是，仅需利用用户与设备的 15 次交互即可快速完成。\n\n###### 3. 方法论\n\n#######\
  \ 3.1 用于连续认证的可用机器学习技术\n\nML 算法分为两大类：监督学习和无监督学习。监督学习算法旨在基于训练数据集确定一个函数，该函数能够从输入数据中获得期望的结果。因此，训练数据集向量被标记，即训练数据将是分为两部分的向量：输入数据和期望输出，也称为类别。从这个意义上说，从一组训练向量出发，算法确定该函数，使得从特定输入出发，将产生最适合该输入数据的输出。无监督学习算法旨在检测异常或聚类数据向量。这类算法在现有技术中已存在多年，但如今影响力更大。如果输出是一个数字，该算法将是回归算法。相反，如果输出是已知集合内的一个值，该算法将是分类算法。此类算法的一些示例包括\
  \ `支持向量机 (SVM)`、`贝叶斯网络`、`决策树`、`神经网络` 或 `K 近邻 (k-NN)`。\n\n接下来，将分析用于执行异常检测的主要算法，并通过比较这些算法在准确性和性能方面的特性，选择最适合连续认证系统的算法。\n\
  \n######## 3.1.1 单类 SVM (支持向量机)\n\n尽管 `SVM` 是一种监督学习算法，但存在一种符合连续认证系统的特殊情况，允许我们检测用户生成向量中的异常。这种情况符合训练数据集中所有向量具有相同输出的条件，即所有训练向量属于同一类。这种情况称为单类\
  \ SVM 或 `One-Class SVM`。\n\n`SVM` 的运作基于将训练向量表示为多维空间中的点（维度数等于向量值的数量），因此算法尝试构建一组超平面，根据向量指示的类别来分离这些点。因此，对于每种可能的结果，都将有一组点与其余点分离。如果训练向量只有单一类别，算法将表现为无监督学习算法，在数据间生成关联，但无法预测输出，因为生成的超平面会将所有点归为同一空间划分。因此，`One-Class\
  \ SVM` 能够评估一个向量，以确定其在空间中放置时，是落在生成的超平面所界定的坐标内部还是外部。如果向量被放置在由超平面界定的集合内、靠近其他点的位置，该向量将被视为正常向量。另一方面，如果向量落在集合之外，该向量将被视为异常，并由此由算法显示。\n\
  \n在这种情况下，算法的输出将为 `1` 或 `-1`，其中值 `1` 表示向量正常，`-1` 表示向量异常。这种输出的缺点之一是，如果向量是异常的，无法知道其异常的程度，只知道它是否异常。该算法的另一个对应面是其计算复杂度，因为训练的阶数介于\
  \ `O (n2m)` 和 `O (n3m)` 之间，具体取决于实现方式，其中 `n` 是训练向量的数量，`m` 是每个向量的字段数。`One-Class SVM`\
  \ 算法的运作如图 4 所示。这是一个向量具有两个输入字段的示例，这使得空间可以在二维图上表示，从而让人眼易于理解，并使我们能更好地理解算法的运作。\n\n|\
  \ 图 4. 双变量向量单类 SVM 的图形化表示 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch002.f04](img/ch002.f04.png)\
  \ |\n| --- |\n| *(Zhu, Yang, Gao, Xu, Ye, & Yin, 2016)* |\n\n######## 3.1.2 用于检测异常的\
  \ K-NN\n\n`K-NN` (`k nearest neighbours`) 算法也是监督学习。然而，它可以像本文所讨论的那样，适配用于异常检测系统。`K-NN`\
  \ 算法通过将向量放置在训练数据集向量旁边的空间中来对向量进行分类。然后，计算待评估向量与训练向量在空间中的距离，选择最近的 `k` 个邻居进行评估。根据距离及其所属类别，从这些邻居中计算待评估向量属于每个\
  \ `k` 个邻居类别的概率。算法运作的二维图形表示如图 5 所示。\n\n| 图 5. k-NN 算法运作的图形化表示 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch002.f05](img/ch002.f05.png)\
  \ |\n| --- |\n| *(Ömer, 2019)* |\n\n\n\n\n用于异常检测的 k-NN 算法使用单一类别的向量，就像 `One-Class\
  \ SVM` 的情况一样。在这种情况下，算法计算待评估实例与其最近的 `k` 个邻居之间的距离（`k-distance`）。获得的分数将反映待评估点周围点空间中的密度。因此，值越接近\
  \ 0 表示有许多向量与被评估向量相似，而结果越高，被评估向量将离空间中点的聚集区越远，因此将被视为异常。使用该算法的问题之一是，不存在一个固定的分数来判定向量何时为异常，而是取决于训练数据集。例如，在某些情况下，`k-distance`\
  \ 为 4 可能代表异常，而在其他情况下则可能不是。用于异常检测的 k-NN 算法也称为 `Local outlier factor (LOF)`，在某些文献中可以看到这一称呼。k-NN\
  \ 算法的复杂度阶为 `O (nkd)`，其中 `k` 是考虑的邻居数量，`d` 是所用向量的维度数，`n` 是使用的样本数量，即训练数据集的大小。由于 `k`\
  \ 通常是 3 到 10 之间的整数，该阶可以简化为 `O (nd)`。\n\n######## 3.1.3 隔离森林\n\n`Isolation Forest`（Liu,\
  \ F., Ming, K., & Zhou, Zhi-Hua., 2008）是一种基于 `Random Forest`（Svetnik, Andy, Christopher,\
  \ Culberson, Sheridan, & Bradley, 2003）的无监督学习算法，专门设计用于执行异常检测。该算法的目标是通过由训练向量生成的空间的随机划分来隔离被评估的实例。为此，首先，算法随机选择向量的一个特征。接下来，也随机地划分该变量的值集合。划分后，选择包含被评估向量值的值集合，检查该值是否已与其他值分离，或者该集合中是否仍包含其他训练向量的值。此过程重复必要的次数，直到实例被完全隔离，从而生成一棵树，树上包含对每个特征值集合所做的不同划分。\n\
  \n`Isolation Forest` 随机选择向量的一个特征，通过对采样空间进行不同的递归划分来创建一棵树。然而，此过程并非仅执行一次；默认情况下，算法生成\
  \ 100 棵树，因为该数量在准确性和资源消耗之间实现了平衡的性能。与采样大小一样，执行算法时可以手动确定此数字以改进获得的结果。通过上述过程，算法能够给向量一个代表其相对于训练数据集的异常程度的值。该值介于\
  \ 0 和 1 之间。因此，值越高（越接近 1），向量越异常（见图 6）。为了计算该值，算法会计算隔离该值所需的划分次数。少量的划分表示异常值，而大量的划分表明该向量位于一个大的点云中，表明该向量处于正常范围内。\n\
  \n| 图 6. Isolation Forest 授予的异常值图形化表示 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch002.f06](img/ch002.f06.png)\
  \ |\n| --- |\n| *(Liu, F., Ming, K., & Zhou, Zhi-Hua., 2008)* |\n\n`Isolation Forest`\
  \ 的算法复杂度在训练阶段为 `O (tvlog (v))`，执行时为 `O (ntlog (v))`（Liu, F., Ming, K., & Zhou, Zhi-Hua.,\
  \ 2008），其中 `n` 为待评估实例的数量，`t` 为生成的树的数量，`v` 为采样大小。取默认值 `t = 100` 和 `v = 256`，算法的复杂度保持为\
  \ `O (100256log (256)) + O (n100log (256))`。因此，由于常数在复杂度阶中没有权重，我们得到该算法的复杂度实际上为 `O\
  \ (n)`。\n\n######## 3.1.4 椭圆包络\n\n`elliptic envelope` 算法（Rousseeuw, & Driessen,\
  \ 1999）也允许在数据集中发现异常。该算法在代表数据集向量的点空间周围生成一个椭圆。随后，为了评估一个实例，将其置于空间中，并根据其是否落在椭圆内部及其与椭圆的接近程度给出一个分数。当构成数据集的数据遵循高斯分布时，该算法能产生良好的结果。然而，当向量具有大量字段且不遵循高斯分布时，算法的性能会下降。高斯分布是指其密度函数图形呈喇叭状（见图\
  \ 7）的分布，即最常重复的数值集中在值域中的一个点周围。\n\n| 图 7. 高斯分布（蓝色）与非高斯分布（黑色）对比 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch002.f07](img/ch002.f07.png)\
  \ |\n| --- |\n\n####### 3.2 所提方案的机器学习算法选择\n\n重要的是要考虑到向量将拥有大量字段，且其值预期不会呈高斯分布。这导致从最初的问题切入点来看，`elliptic\
  \ envelope` 算法被排除在外。\n\n一个对比不同算法的有趣参考文献是文章“A Comparative Evaluation of Unsupervised\
  \ Anomaly Detection Algorithms for Multivariate Data”（Goldstein, & Uchida 2016），该文展示了\
  \ `One-Class SVM` 在大多数情况下比 `k-NN` 具有更好的准确率。此外，在（Agarwal & Sureka 2015）中可以看到，在检测反映在线激进化的异常推文时，`One-Class\
  \ SVM` 的精度超过了 `k-NN`。另一方面，（Agarwal & Sureka 2015）也显示 `One-Class SVM` 的执行时间远大于 `k-NN`，这非常合理，因为\
  \ SVM 的复杂度阶大于 `k-NN`，即 `O (nd) < O (n2d)`，其中 `n` 是训练数据集中的实例数量，`d` 是每个实例的维度数。\n\n\
  在 `One-Class SVM` 和 `k-NN` 之间选择 `One-Class SVM` 作为更好的选项，因为它比 `k-NN` 具有更好的准确性。为了解决性能惩罚，提议在评估阶段保持算法预训练状态，这样在确定向量是否为异常时，每次执行就不需要重新训练它。现在，将\
  \ `One-Class SVM` 与 `Isolation Forest` 进行比较，以确定这两个算法中哪一个将具有更好的准确性和执行速度。正如我们在图 8（Novelty\
  \ and Outlier detection, 2019）中所见，`Isolation Forest` 在检测异常向量方面具有更高的精度。此外，如上所述，其算法复杂度阶小于\
  \ `One-Class SVM`（`O (n2d) > O (n)`）。\n\n因此，决定本工作中使用的异常检测算法为 `Isolation Forest`，因为与\
  \ `One-Class SVM` 或 `LOF` 相比，它以更低的资源消耗提供了更好的结果。\n\n| 图 8. 异常检测算法对比 |\n| --- |\n\
  | ![Figure978-1-7998-2701-6.ch002.f08](img/ch002.f08.png) |\n| --- |\n| *(Novelty\
  \ and Outlier detection, 2019)* |\n\n####### 3.3 自适应持续智能认证系统的设计与实现\n\n\n\n\n\n########\
  \ 基于设备用户画像建模的持续认证系统\n\n######### 系统概述\n\n该提议的持续认证系统基于对设备所有者画像的建模，将其与当前使用情况进行比较，并评估二者之间的相似度。为建立用户画像，需生成一个或多个包含用户使用设备时行为数据的数据集。\n\
  \n######### 实现平台选择\n\n考虑到当前 Android 设备用户（约 23 亿）多于其主要竞争对手 iOS（Android Developers,\
  \ 2019），决定在 Android 平台上开发概念验证方案。此外，我们使用 API 21（对应 Android 5.0）或更高版本，因为该版本覆盖了超过 84%\
  \ 的 Android 设备。\n\n######### 特征维度与向量生成\n\n用于形成向量的特征来源于两个维度：**应用使用统计**和**位置信息**。两个维度生成的向量将分别存储在不同的数据集中，以便后续生成用户行为画像。\n\
  \n########## 应用使用统计维度\n\n该维度每分钟生成一次向量。仅在设备解锁时收集应用相关向量，这使得我们能在不产生高能耗的情况下进行必要的读取以收集信息。这些向量包含以下特征：\n\
  \n*   上一分钟不同应用和总应用打开数。\n*   上一分钟最常用应用及其访问次数。\n*   上一分钟最后使用和倒数第二个使用的应用。\n*   上一分钟在最后一个应用之前使用次数最多的应用。\n\
  *   过去一天不同应用和总应用打开数。\n*   过去一天最常用应用及其访问次数。\n*   上一分钟发送和接收的字节数。\n*   星期几和时间（秒）。\n\
  \n########## 位置信息维度\n\n该维度每 5 分钟收集一次向量，无论用户设备是锁定还是解锁状态。这些向量包含以下特征：\n\n*   纬度。\n\
  *   经度。\n*   星期几。\n*   时间（秒）。\n\n######### Android 应用架构设计\n\n确定两个维度的向量特征后，下一步是设计并实现一个\
  \ Android 应用，包含收集这些信息所需的类，在训练和评估阶段将数据存储在不同的数据集中。\n\n########## 核心类\n\n*   **`AlarmManager`**：核心类之一，用于通过计划闹钟管理应用使用统计和位置统计收集服务的启动。由于设备长时间闲置时闹钟会自动暂停，需额外使用\
  \ **`BootReceiver`** 类（继承自 `BroadcastReceiver`）。该类负责接收设备开机事件并安排必要的闹钟。\n*   **`IntentService`**：Android\
  \ 库提供的类，支持在后台异步执行获取向量数据所需的操作。该类同时用于 **`DataApssIntentService`** 类和 **`Location`**\
  \ 类，以周期性收集各维度特征。配合闹钟程序（`AlarmManager`），即使实现传感器收集的应用在后台运行甚至关闭，也能获取特征信息。\n\n##########\
  \ 数据收集类\n\n*   **`DataApssIntentService`**：负责周期性收集（每分钟）所有与应用使用统计相关的特征。通过 `Android.app.usage`\
  \ 库提供的类获取应用数据（如打开顺序、使用时长、首次使用时间等）。收集完成后，将特征发送给 **`DataMachineLearning`** 类生成该维度向量并存入对应数据集。\n\
  *   **`Location`**：负责周期性收集（每 5 分钟）设备位置。使用 **Google Play Services location API**\
  \ 实现位置检测，可节省能耗。收集特征后，将数值发送给 **`DataMachineLearning`** 类存入对应数据集。\n\n########## 机器学习处理类\n\
  \n*   **`DataMachineLearning`**：实现从 `Localization` 和 `DataApssIntentService` 类获取特征、生成各维度向量并存入数据集的功能。此外，该类还负责执行\
  \ **Isolation Forest** 算法训练，以及在为期两周的训练阶段结束后，对用户实时生成的向量进行评估。图 9 展示了上述步骤的流程图。\n\n\
  | Figure 9. UML diagram of application main actions |\n| --- |\n| ![Figure978-1-7998-2701-6.ch002.f09](img/ch002.f09.png)\
  \ |\n\n######### Isolation Forest 算法应用\n\n如前所述，我们使用 Isolation Forest 识别异常并认证设备所有者。提供配置\
  \ Isolation Forest 算法所需方法的最常用库是 **Scikit-learn**（Scikit-learn developers, 2019）。\n\
  \n########## 训练阶段\n\n训练阶段预计持续 **14 天** 以获得最佳效果。\n\n*   应用使用统计特征：通过 `DataApssIntentService`\
  \ 每分钟收集一次。\n*   位置特征：通过 `Location` 类每 5 分钟收集一次。\n*   每个维度独立生成向量，存储在不同文件中，供 Isolation\
  \ Forest 算法训练使用。\n\n########## 评估阶段\n\n训练阶段结束后，IF 算法已学习所有者行为，进入评估阶段。数据收集服务保持相同的周期性流程，不同之处在于每分钟设备解锁时会对生成的向量进行评估。\n\
  \n由于用户评估过程每分钟进行一次，而位置特征收集服务每 5 分钟激活一次，若评估用户时尚未生成新的位置向量，算法将使用上一次生成的向量。\n\nIsolation\
  \ Forest 算法对每个待评估向量分别评估（即一个应用使用统计向量和一个位置统计向量）。每个向量的评估结果为 0 到 1 之间的值。决定对构成每个维度数据集的向量进行加权。\n\
  \n**认证度计算公式：**\n\n```\nGA = 0.5 * Uva + 0.5 * Uvl\n```\n\n其中：\n*   **`GA`**：认证度，取值范围\
  \ [0, 1]，计算公式为 `1 - 待评估向量的异常分数`。\n*   **`Uva`**：最后一个应用特征向量的评估结果。\n*   **`Uvl`**：最后一个位置特征向量的评估结果。\n\
  \n*   评估结果接近 **0**：表示评估向量由算法视为异常的特征组成。\n*   评估结果接近 **1**：表示用户行为与训练阶段获得的行为具有高度相似性。\n\
  \n\n\n\n最后，请注意本文档中使用的隔离森林算法具有适应所有者用户行为某些变化的能力。为此，一旦训练阶段结束，算法将使用超过设定阈值的某些向量进行重新训练，这些向量被认为用户的行为并非异常。重新训练的目的是为认证系统提供适应所有者行为可能变化的能力。因此，一旦评估阶段开始（在此阶段用户将持续进行实时认证），如果系统认为评估向量属于所有者用户，它们将被添加到训练阶段生成的数据集中。通过不存储超过系统运行所需的数据，也保护了用户的隐私（Huertas,\
  \ Gil, García & Martínez, 2014a, 2017, 2014b, 2016）。\n\n########## 讨论\n\n本章提出的系统在现有技术水平中属于创新，因为没有其他工作结合应用程序和位置的数据。正如表\
  \ 1 所示，尽管之前的解决方案取得了一定进展，但它们存在一系列缺陷。例如，大多数系统使用分类机器学习算法，而不是异常检测算法。这一事实意味着这些系统无法检测任何入侵者，只能识别其拥有行为数据的用户。此外，那些执行异常检测的系统，其结果不如使用分类算法的系统好。\n\
  \n########## 表 1. 最新解决方案的比较\n\n| 提案 | 考虑的维度 | 适应性 | 机器学习技术 | 结果 |\n| --- | --- |\
  \ --- | --- | --- |\n| SilentSense (Bo, Zhang, Li, Huang and Wang, 2013) | 移动和屏幕触摸\
  \ | 否 | OneClass-SVM, SVM | 准确率：72.36%<br>误接受率 (FAR)：24.99% |\n| (Ehatisham-ul-Haq\
  \ et al., 2017) | 加速度计、磁力计和陀螺仪传感器 | 否 | SVM, 贝叶斯网络 (BN), 决策树 (DT), K-近邻 (K-NN) |\
  \ 准确率：99.18-93.30%，取决于算法 |\n| SenGuard (Shi, Yang, Jiang, Yang & Xiong, 2011) |\
  \ 移动、位置、语音和屏幕触摸 | 否 | 贝叶斯网络 | 准确率：97-95% |\n| (Fridman, Weber, Greenstadt & Kam,\
  \ 2017) | 位置、已用应用程序、网页导航和书写 | 否 | SVM | 准确率：95%<br>等错误率 (EER)：5% |\n| (Parreño,\
  \ Moorsel & Castruccio, 2017) | 加速度计 | 是 | 自编码器 | 准确率：97.8%<br>等错误率 (EER)：2.2% |\n\
  | (Li, Clarke, Papadaki and Dowland, 2011) | 通话、短信和应用程序 | 是 | 分类算法 | 等错误率 (EER)：分别为\
  \ 5.4%、2.2% 和 13.5% |\n| (Jorquera et al., 2018) | 应用程序使用统计和传感器 | 是 | 隔离森林 | 精确率：77%\
  \ 召回率：92% |\n\n在此意义上，本工作提出的解决方案旨在改进现有解决方案。为此，它结合了位置和应用程序使用这两个维度，并使用无监督算法对其进行评估以检测异常。此外，它是一个能适应用户行为变化的系统，同时不忘记移动设备资源消耗这一关键方面。\n\
  \n(Bo, Zhang, Li, Huang and Wang, 2013) 未提出系统对新行为的适应性，也未分析资源消耗。在 (Parreño, Moorsel\
  \ & Castruccio, 2017) 中，移动设备必须连接互联网，而这种情况并不总是能满足。相比之下，本工作提出的解决方案可以离线工作，因为它独立包含在设备上。(Li,\
  \ Clarke, Papadaki and Dowland, 2011) 是唯一提供能耗信息的工作，其能耗高于本工作。\n\n请注意，所呈现的工作基于 (Jorquera\
  \ et al., 2018)，但使用了其他维度，因此在资源消耗和使用的算法方面，结果相似。作为实际意义，开发的系统可用于提高移动设备的安全性，补充传统认证系统并授予用户额外的隐私级别。该系统适用于几乎任何智能手机，因为所用数据来源于任何现代设备中都存在的源。\n\
  \n作为系统局限性，GPS 坐标定位并非在所有环境下都能正常工作。因此，在用户四周被建筑物包围的大城市中，坐标可能更不准确或难以确定。此外，使用运动传感器可能导致系统在用户做出跑步或其他运动等异常动作时无法正常工作。\n\
  \n########## 结果\n\n在本节中，将解释为确定最佳特征和维度集而执行的不同实验。通过不同的实验，旨在实现一个持续且自适应的认证系统，能够准确评估用户行为，检测异常行为。\n\
  \n########## 5.1 第一次实验\n\n本次实验的目的是收集尽可能多的特征来建模用户的行为档案，以检测异常行为。为进行此实验，实现了一个 Android\
  \ 移动应用程序，负责收集设备所有者在 14 天内的应用程序使用情况。训练阶段的数据收集是在设备处于静止状态（锁屏）以及所有者每日使用设备（解锁）时进行的。\n\
  \n训练阶段每个向量中编译的特征如下：\n\n*   打开的不同应用程序和总应用程序数。\n*   最后一分钟打开的不同应用程序和总应用程序数。\n*   使用最多的应用程序、使用次数和平均使用时间。\n\
  *   最后一分钟使用最多的应用程序和访问次数。\n*   最后使用的应用程序和平均使用时间。\n*   倒数第二个使用的应用程序和平均使用时间。\n*   最后一个应用程序之前，倒数第二个应用程序被使用的次数。\n\
  *   最后一个应用程序之前使用次数最多的应用程序及其使用次数。\n\n训练阶段结束后，无论设备是锁屏还是解锁，每分钟都会收集用户生成的向量，随后对设备所有者的行为进行评估。当所有者日常使用设备和设备处于待机模式时，会进行不同的评估。此外，一个在训练阶段未使用过设备的外部用户，会像所有者一样使用设备。\n\
  \n表 2 显示了评估阶段所进行的不同测试所获得的标准化结果的平均值。\n\n########## 表 2. 使用手机锁屏和解锁状态下收集的应用程序数据的认证结果\n\
  \n| 评估用户 | 结果 |\n| --- | --- |\n| 合法用户 | ~0.51 设备锁屏<br>~0.43 设备解锁 |\n| 非法用户 | ~0.35\
  \ 设备解锁 |\n\n接下来展示一张图（见图 10），显示一组向量相对于隔离森林拥有的训练数据集的评估情况。图中的红线（见图 10）代表异常行为和正常行为之间的分界阈值，黄线代表数据集中每个向量评估的结果。评估数据集由\
  \ 20 个向量组成，其中前 15 个属于所有者用户，后 5 个属于异常用户。为了以图形方式表示这些值，有必要将系统针对每个表示向量返回的认证程度结果进行归一化。\n\
  \n########## 图 10. 实验 1 数据集的图形表示\n\n![Figure978-1-7998-2701-6.ch002.f10](img/ch002.f10.png)\n\
  \n\n\n可以看出，第一次实验获得的结果不够显著，无法区分设备使用中的异常行为（向量 16-20）。这是由两个因素造成的：\n\n*   由于手机大部分时间处于待机模式，算法在设备处于锁定状态时会给用户更高的评价，将设备的使用视为异常行为。\n\
  *   向量中收集的一些特征无法为算法检测异常提供有用信息。收集了一些特征，即使用户行为发生变化，这些特征也会线性增加或变化极小。\n\n##########\
  \ 5.2 第二次实验\n\n本实验的目的是选择最相关的特征，以更确定地判定所有者的异常行为，并选择收集特征的时间点。具体而言，代表应用使用统计维度的向量由以下特征组成：\n\
  \n*   最近一分钟打开的不同应用和总应用数。\n*   最近一分钟最常用的应用及其访问次数。\n*   最近一分钟最后使用和倒数第二个使用的应用。\n* \
  \  最近一分钟在最后一个应用之前使用次数最多的应用。\n*   最近一天打开的不同应用和总应用数。\n*   最近一天最常用的应用及其访问次数。\n*   最近一分钟发送和接收的字节数\n\
  \n得益于 `Weka` 工具（`Weka 3`，2019），检测出了一些未为算法提供相关信息的特征的使用情况。通过可视化生成向量中每个特征的图表，观察到某些特征的值线性增加，但并非建模用户配置文件所关注的数据。\n\
  \n在移除特征并添加一些新特征后，进行了不同的测试：所有者正常使用设备，然后由非法用户使用设备。获得的归一化结果（在 0 和 1 之间）显示，设备所有者的得分约为\
  \ 0.52，异常用户的得分约为 0.34。\n\n图 11 展示了 `Isolation Forest` 所用训练数据集相关向量集的评估结果。红线表示异常行为与正常行为之间的边界阈值，黄线表示数据集中每个向量的评估结果。评估数据集由\
  \ 20 个向量组成，前 15 个属于所有者用户，后 5 个属于异常用户。正如所观察到的，获得的结果显示出的评估能够区分设备使用中的异常行为。\n\n| 图 11.\
  \ 实验 2 数据集的图形化表示 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch002.f11](img/ch002.f11.png)\
  \ |\n\n如果我们将图 10 与图 11 的结果进行比较，可以看到在进行特征选择后，属于所有者的向量评估值更好（在本实验中，大多数值在 0.5 左右）。然而，我们认为如果考虑额外的维度，这些结果可能会更好。在此意义上，下一个实验展示了增加新维度对评估值的影响。\n\
  \n########## 5.3 第三次实验\n\n根据上一测试获得的结果，我们研究了考虑有助于建模用户配置文件并提高异常检测成功率的新维度和特征的可能性。在此意义上，我们决定添加地理位置维度的以下特征。\n\
  \n*   纬度。\n*   经度。\n*   当前时间。\n*   星期。\n\n插入时间和星期的目标在于创建时间范围，在这些范围内，设备所有者通常使用特定应用，且在大多数情况下，由于日常习惯，会在特定时间处于相同位置。一旦指定了新维度并选定了将构成每个向量的特征，便进行了新的训练和评估阶段。\n\
  \n本测试分别在从向量中移除与时间和星期相关的特征以及不移除这些特征的情况下进行。移除这些特征的原因是 `IF` 会随机选择某些特征来判定用户行为的异常程度，可能会出现选择当天时间或星期作为特征，也可能不选择的情况。此外，将对比过滤训练数据集（按小时和天）后的评估结果，与评估相同向量但不对训练数据集应用任何过滤器的结果。获得的归一化结果平均值（在\
  \ 0 和 1 之间，同实验 1）如表 3 所示。\n\n表 3. 使用新特征并选择将用于训练的数据集向量时的所有者向量认证结果。\n\n| 应用使用与定位 |\
  \ | 得分 |\n| --- | --- | --- |\n| 所有者 | 按小时和天过滤 | 删除小时和天 | ~0.83 |\n| 按小时和天过滤 | 不删除小时和天\
  \ | ~0.66 |\n| 不按小时和天过滤 | 删除小时和天 | ~0.89 |\n| 不按小时和天过滤 | 不删除小时和天 | ~0.84 |\n\n由于以下原因，本次测试获得的结果与本实验旨在解决的初衷相悖：\n\
  \n*   数据集规模的减小，在获取表中所示结果的大多数测试中，用于训练 ML 算法并随后评估用户的数据集所包含的向量数少于 200 个。\n*   构成数据集的向量所提供的值域较小，这导致\
  \ ML 算法只需进行较少的分割即可隔离随机选定特征的值。\n*   训练阶段用户的行为不如预测的那样重复，对随后所有者用户进行日常行为的评估阶段产生了负面影响。\n\
  \n最后，将通过评估不属于所有者用户的不同向量，来评估系统是否能够检测设备的异常行为。与前一种情况一样，将通过对训练数据集应用过滤以获得更具体和更小的数据集，以及在不应用任何过滤器以获得减少向量数量的两个数据集的情况下，检查训练数据集的评估结果。获得的结果如表\
  \ 4 所示。\n\n表 4. 使用新特征并选择将用于训练的数据集向量时的异常向量认证结果。\n\n| 应用使用与定位 | | 得分 |\n| --- | ---\
  \ | --- |\n| 异常用户 | 按小时和天过滤 | 删除小时和天 | ~0.282 |\n| 按小时和天过滤 | 不删除小时和天 | ~0.316 |\n\
  | 不按小时和天过滤 | 删除小时和天 | ~0.238 |\n| 不按小时和天过滤 | 不删除小时和天 | ~0.208 |\n\n正如所见，无论是否对训练数据集应用过滤以仅选择属于同一天且同时间的收集向量，系统都能准确检测异常向量。原因如下：\n\
  \n*   一周中的时间和天特征可能被 `Isolation Forest` 选为判定待评估向量是否异常的特征。因此，消除这些特征可使算法随机选择其他特征，这些特征相对于训练数据集向量将具有异常值。\n\
  \n\n\n• 不应用时间和星期几的过滤器这一事实，由于数据集规模较小，为检测异常提供了更好的结果。这意味着 `Isolation Forest` 只需执行较少次数的分割即可隔离向量所选特征的值。\n\
  \n结论是，决定为位置维度使用一个数据集，为应用维度使用另一个数据集。这两个数据集均不按时间和星期几进行过滤。此外，新增的特征（本意欲通过它们构建两个特定的训练数据集）被移除，因为\
  \ `Isolation Forest` 可以从异常向量中选择这些特征。\n\n图 12 显示了 `Isolation Forest` 所拥有的训练数据集方面的一组向量的评估。被评估的数据集由\
  \ 15 个向量（前面表示的那些）组成，属于设备所有者用户；以及 5 个向量（后面表示的那些）组成，属于异常用户。正如你所见，设定在 0.55 的阈值使我们能够区分设备所有者用户与具有异常行为用户的行为。\n\
  \n| 图 12. 实验 3 数据集的图形表示 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch002.f12](img/ch002.f12.png)\
  \ |\n\n###### 6. 结论与未来工作\n\n在本工作中，提出了一种基于通过位置维度和应用使用统计维度收集用户特征的、面向多媒体移动设备的持续自适应认证系统。采用了一种基于异常检测的无监督机器学习技术（如\
  \ `IF`），以精确的结果检测设备所有者和入侵者。选择 `IF` 作为使用的算法，是因为它在移动设备上使用时具有低能耗和低计算消耗，且提供较高的精度水平。在\
  \ `IF` 经过设备所有者配置文件训练后，所提出的解决方案准备好实时评估用户行为，允许算法通过插入满足特定特征的新向量到数据集中来实现自适应性。最后，不同的实验获得了有效结果，能够准确区分异常用户和设备所有者的行为。\n\
  \n在未来的研究方向中，我们计划将 `IF` 执行的计算迁移到云端，以降低其在移动设备上产生的计算成本和能耗成本。还打算研究新的维度，以更确定地建模用户行为档案。最后，我们计划使用额外的机器学习算法，测试在新改进加入后的异常检测效率。\n\
