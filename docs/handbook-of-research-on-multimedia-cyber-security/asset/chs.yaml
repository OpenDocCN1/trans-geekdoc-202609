  \ Image](https://orcid.org/0000-0002-1476-4162)  \n    计算机科学系，朱夫大学，沙特阿拉伯\n\n*  \
  \ **Shatha Shakhatreh**  \n    赛义德·苏玛雅技术大学，约旦\n\n*   **Mohammad Alauthman**  \n\
  \    ![Orcid Image](https://orcid.org/0000-0003-0319-1968)  \n    扎尔卡大学，约旦\n\n*\
  \   **Ammar Almomani**  \n    ![Orcid Image](https://orcid.org/0000-0002-8808-6114)\
  \  \n    信息技术系，侯赛因大学学院，巴尔卡应用大学，约旦\n\n##### 摘要\n\n物联网设备在全球范围内的普及显著增加，由于其设计安全性较低，比台式计算机更容易遭到攻破。这导致了基于物联网的僵尸网络攻击现象，如\
  \ Mirai 僵尸网络，其最近已成为持续存在的高调威胁。需要准确及时的检测方法来识别这些攻击并缓解这些新威胁。为此，本章将使用各种机器学习和特征选择算法，实施一种基于网络的异常检测方法来应对\
  \ Mirai 僵尸网络。作者采用`Multiphase Genetic Algorithm`节中的方法和`PSO`来选择能够产生良好整体分类结果的最佳特征子集，借助该`Feature\
  \ Selection Algorithm`，`Random forest`算法能够以 100%的准确率检测所有异常行为。\n\n##### 引言\n\n物联网（`IoT`）是一个平台，日常设备变得更智能，日常处理变得更智能化，日常通信变得更富有信息量（Ray,\
  \ 2018）。随着物联网设备参与到方方面面，其数量在安全性缺乏的情况下极速增长，从而引发灾难性攻击，因此，及时检测物联网攻击的方法变得至关重要，以促进物联网网络安全并防止攻击蔓延。物联网是一种新范式，旨在将物理世界的所有组件连接到数字世界中，其理念是将代表世界的事物融合到软件应用和互联网中，使它们能够通信并利用世界的上下文信息（Alauthman\
  \ et al., 2019; Alauthman et al., 2020; Atzori et al., 2010; Gonzalez et al., 2008;\
  \ Sterling, 2005）。物联网技术发展迅速，已成为现代城市和大型企业的焦点，最近构建了许多应用。作为一项新技术，它面临着许多挑战，其中一个非常重要且关键的挑战是安全性（Alauthaman\
  \ et al., 2018; Xia et al., 2012）。\n\n\n\n\n\n###### 基于多阶段特征选择的物联网僵尸网络检测\n\n物联网设备和系统正遭受安全和隐私问题的困扰，这些问题是万物互联的核心（Lee\
  \ & Kim, 2017），且存在极高风险的漏洞。这些设备在缺乏基本安全和隐私保护考量的情况下涌入市场——即“设计上的不安全”。因此，物联网的普及及其日益增长的流行度，加上其拥有大量不安全、算力强、资源丰富的设备，使其成为攻击者寻求入侵这些设备并利用其构建大规模僵尸网络的容易、诱人且强大的目标。\n\
  \n僵尸网络是被恶意软件感染并受第三方（攻击者）控制的机器组成的机器人网络；它利用命令控制基础设施实施各种恶意攻击，如垃圾邮件投递、身份盗窃和分布式拒绝服务攻击（DDOS）。DDOS\
  \ 攻击调动大量机器（僵尸节点），用海量请求淹没目标网站。因此，目标网站将无法为实际和合法用户提供服务。物联网设备的安全薄弱助长了此类攻击，并使其规模更大、危害更强（Bertino\
  \ & Islam, 2017）。\n\n图 1 展示了 DDOS 攻击。2016 年，计算机安全顾问 Brian Krebs 的网站遭受了 620 Gbps\
  \ 流量的攻击；随后又发生了一次攻击，波及 Twitter、Netflix、Reddit 和 GitHub 等数百个网站；2017 年 2 月，针对一所美国大学的\
  \ DDOS 攻击持续了 54 小时，以及其他危险攻击。分析这些大规模 DDOS 攻击表明，物联网设备助长了这些攻击，这也是攻击规模如此巨大的原因。他们称这种类型的\
  \ DDOS 攻击为 Mirai（意为“未来”）（Shoemaker, 2017）。这次攻击凸显了安全的重要性，而这在物联网设备中一直缺失，导致了灾难性的攻击。Mirai\
  \ 攻击取代了此前最大、最危险、最有效的 DDOS 攻击，达到了前所未有的水平（Kolias et al., 2017）。\n\n| 图 1. 利用僵尸网络的\
  \ DDOS 攻击，Shoemaker |\n| --- |\n| ![Figure978-1-7998-2701-6.ch016.f01](img/ch016.f01.png)\
  \ |\n| *(Shoemaker, 2017).* |\n\n此类物联网僵尸网络攻击凸显了及时检测方法的必要性，以保障网络安全。因此，实时僵尸网络检测成为当今最重要的研究课题之一，它对于降低此类攻击相关风险至关重要，通过检测受感染机器的实时异常行为，阻止僵尸网络传播并防止进一步的出站攻击流量（Kamal\
  \ et al., 2020; Meidan et al., 2018）。各种深度学习和机器学习算法有助于检测受感染机器的异常行为，以在攻击发生前发出预警。本文的动机是提出一种新型的\
  \ Mirai 僵尸网络检测技术，采用遗传算法和粒子群优化的多阶段特征选择算法，证明较少的特征也能取得优异结果并高效检测异常行为，随后对比不同机器学习算法在分类网络流量行为方面的效果。\n\
  \n本文结构安排如下：第 2 节讨论相关工作。第 3 节介绍数据集描述。第 4 节描述提出的方法。第 5 节讨论实验与结果。最后，第 6 节总结并结论本文的发现。\n\
  \n####### 背景\n\n已有多种僵尸网络检测方法被提出，其分类取决于检测方法和待检测的操作步骤。在（Alieyan et al., 2019）中，他们提出了一种基于网络的物联网攻击检测方法，针对\
  \ Bashlite 和 Mirai 攻击，为了评估其方法，他们研究了九种商用物联网设备的行为，通过从最近 100ms 到 1min 的五个时间窗口获取快照来监控数据包行为，并提取了\
  \ 115 个统计特征（每个窗口 23 个）。他们使用深度自编码器作为无监督学习算法来检测网络的异常行为。他们在每个设备的正常行为上训练自编码器，这赋予了自编码器识别任何异常行为的能力，他们提出的方法成功以\
  \ 100% 的准确率检测了 Mirai 和 Bashlite 的所有异常行为。\n\n在（Özçelik et al., 2017）中，他们研究了检测物联网僵尸网络的操作步骤，重点关注感染和传播的早期阶段以及与\
  \ C&C 服务器的通信。他们使用了仿真物联网节点、模拟数据集，并采用流规则的动态更新来检测搜索更多设备的 Mirai 感染物联网设备。正如（Summerville\
  \ et al., 2015）所做的，他们在两台真实设备上使用深度数据包异常检测，作为蠕虫传播、隧道技术和代码注入攻击的检测方法。仅通过监控组织网络流量来识别感染早期阶段的检测手段是不充分的。\n\
  \n在（Sedjelmaci et al., 2016）中，他们提出使用混合检测方法，即基于特征的检测和异常检测（BPN），来检测在无线传感器网络上模拟的 DDOS\
  \ 攻击中被攻陷的设备。同理，在（Bostani & Sheikhan, 2017）中，他们也采用了混合检测方法，即基于规范的检测和异常检测（OFPC），利用在代表智慧城市的\
  \ 6LoWPAN WSN 上的仿真来检测路由攻击（选择性转发和黑洞攻击）。\n\n在（Midi et al., 2017）中，他们引入了 Kalis，一种知识驱动的自适应入侵检测系统。他们使用真实设备，在\
  \ ZigBee、6LoWPAN、XBee、WIFI 和 BT 上进行数据仿真，利用知识驱动的异常检测来检测 ICMP 洪水、Smurf 攻击、TCP SYN\
  \ 洪水、蜂窝攻击、数据篡改、选择性转发、Hello 干扰和复制等不同攻击。该方法不影响物联网设备上应用的性能，且不需要对软件进行任何更改。\n\n在这些建议的僵尸网络检测方法中，每种技术应用的部署层级存在本质差异；第一种是基于主机的检测方法（Sedjelmaci\
  \ et al., 2016; Summerville et al., 2015），第二种是基于网络的检测方法（Bostani & Sheikhan, 2017;\
  \ Butun et al., 2015; Midi et al., 2017; Özçelik et al., 2017）。依赖基于主机检测的方法被认为在检测物联网受感染设备方面不够现实，因为我们无法保证软件安装在设备上（因为其中一些是可穿戴设备）；我们也无法依赖制造商在其设备上安装异常检测器。此外，工具的资源和计算能力各不相同，安装异常检测算法时会反映在性能上，这可能影响其主要功能，因此单一的非分布式解决方案更好。\n\
  \n在（Raza et al., 2013）中，他们引入了 SVELTE，一种面向物联网的入侵检测系统。他们使用在 6LoWPAN 上的模拟数据，采用混合的基于特征和异常检测，来检测选择性转发、黑洞攻击，以及篡改信息或欺骗等路由攻击。该方法不影响物联网设备上应用的能量和内存容量，并能检测所有发起的恶意节点。\n\
  \n总之，本文区别于先前研究之处在于，它专注于能够选择与问题最相关特征并减少总体特征数量的特征选择算法，以用于实时检测问题，从而节省时间和计算资源，并使依赖少量特征即可高效检测实时异常行为成为可能，随后利用这些特征训练随机森林机器学习算法以识别异常行为。\n\
  \n####### 提出的方法\n\n\n\n\n######## Mirai 攻击检测流程\n\n在本节中，我们将介绍通过研究被感染机器产生的网络流量异常行为来检测\
  \ Mirai 攻击所遵循的流程。高效检测 Mirai 攻击将有助于在早期阶段阻止攻击，并防止其他机器被感染。我们使用了多阶段特征选择算法和不同的机器学习算法。图\
  \ 2 展示了总体方法，每个阶段将在下文中详细描述。\n\n######## 数据集\n\n我们使用了一个名为 N-BALOT 的数据集。该数据集通过在交换机上使用端口镜像捕获原始网络流量数据（PCAP\
  \ 格式），然后使用 Wireshark 数据包分析器记录流量数据（组织流量通常通过该分析器流动）而收集。为确保训练数据不含恶意行为，在 IoT 设备安装入网后立即采集其常规流量。他们在最近\
  \ 100ms、500ms、1.5 秒、10 秒和 1 分钟的多个时间窗口内采集了主机和协议的行为快照，并通过计算不同的流量统计度量（如数据包大小的均值和方差）提取了每个窗口的\
  \ 23 个特征，汇总为四类：\n\n1.  来自同一 IP 生成的数据包\n2.  来自同一 IP 地址和同一源媒体访问控制层生成的数据包\n3.  源 IP\
  \ 和目的 IP 之间发送的数据包（信道）\n4.  源和目的 TCP/UDP 套接字之间发送的数据包\n\n最终数据集包含 115 个特征和一个目标标签，其值为恶意行为或良性（Meidan\
  \ 等人，2018）。\n\n######## 数据预处理与特征选择\n\nN-BALOT 数据集干净且无缺失值。因此，无需应用任何缺失值处理技术。接下来是特征选择阶段，当数据集拥有成百上千个属性时，该阶段被认为是构建机器学习模型的关键阶段。其结果影响整个过程并提升分类性能。该过程包含选择与目标变量相关且能对预测结果值有贡献的特征。\n\
  \n特征选择方法分为包装器方法和过滤器方法。过滤器方法作为预处理步骤，独立于预测器选择子集；而包装器方法则使用搜索算法和学习机，基于变量的预测能力来选择变量子集（Guyon\
  \ & Elisseeff, 2003）。\n\n本文的贡献主要集中在减少特征数量以检测 Mirai 僵尸网络的异常行为。我们将进行实验评估，以证明较少的特征也能取得良好结果并高效识别异常行为。我们专注于包装器方法，并应用了两种优化搜索算法来选择最佳特征子集；我们研究了遗传算法的双重影响，随后是粒子群优化（PSO）。特征包装器方法需要两个阶段：子集评估和搜索策略。\n\
  \n######### 子集评估\n\n这是评估由搜索算法确定的子集的步骤。为选择最佳子集解决方案，我们决定使用基于相关性的特征选择（CFS）来评估子集。它通过寻找属性之间的相关性以及属性与目标变量之间的相关性来工作，然后选择的子集将是特征之间相关性低且与目标变量相关性高的那个（Hall,\
  \ 1999）。\n\n| 图 2. 建议方法的主要步骤 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch016.f02](img/ch016.f02.png)\
  \ |\n\n######### 搜索策略\n\n在此阶段，可应用任意搜索算法在多个解决方案中搜索最优解（变量子集）。在我们的实验中，为寻找最优子集，我们利用了两种最知名的元启发式搜索算法的影响，即遗传算法和\
  \ PSO（Leardi, 1996）。\n\n######## 建模\n\n特征选择后，包含所选合适特征的新过滤数据集即可输入模型进行学习，从而具备检测异常行为的能力。将使用\
  \ Breiman (2001) 提出的随机森林算法（RF）作为分类算法，将观测值分类为异常或良性类别。由于 RF 通过结合多棵随机树（树林）工作，在变量数量远大于观测值数量时，取其结果的平均值，这使得\
  \ RF 近期在实现高准确率方面展现出高效性（Biau and Scorned）。\n\n以下是随机森林算法工作原理的描述：\n\n*   从原始集合 `k`\
  \ 生成带有放回的随机子样本 `k'`（样本装袋），其中 `k' < k`。\n*   随后，对每个子集应用属性装袋，所选属性数量为总属性数 `n` 的平方根。\n\
  *   生成随机的特征和样本子集，然后为每个子群构建一棵决策树并计算每棵树的分类误差。\n*   选择分类误差最小的决策树参与投票过程。\n*   重复步骤 2-4\
  \ 直到形成一片树林。\n*   每棵决策树为每个实例投票一个类别。\n*   返回每个实例得票最多的预测类别。\n\n######## 实验与结果\n\n我们的目标是通过研究网络流量正确检测\
  \ Mirai 攻击的异常行为。我们的实验专注于与目标类别相关的属性特征选择，以证明在实时检测中提取较少数量的特征足以让预测模型更高效地检测异常行为。\n\n\
  表 1 展示了五组属性（MI、H、HH、HH_jit、HpHp）；这些组别根据所捕获属性所在的层被归类为“数据链路层”、“网络层”和“传输层”。例如，MAC 地址属于“数据链路层”，因此所有包含\
  \ MAC 地址的属性均被归类在“数据链路层”。\n\n######### 表 1. 属性分组\n\n| 属性标头 | 描述 | 相关层 | 属性数量 |\n\
  | --- | --- | --- | --- |\n| MI | 源 MAC-IP 地址 | 数据链路层和网络层 | 15 |\n| H | 源 IP 地址\
  \ | 网络层 | 15 |\n| HH | 信道（源 IP - 目的 IP） | 网络层 | 35 |\n| HH_jit | 信道抖动（源 IP - 目的\
  \ IP） | 时延（时间）- 与网络层相关 | 15 |\n| HpHp | 套接字（源 IP:端口 - 目的 IP:端口） | 网络层和传输层 | 35 |\n\
  \n其他属性遵循相同方法。除了将数据集分为三类外，我们还执行特征选择方法以减少每类中的特征数量。我们使用粒子群优化来选择最佳特征。表 2 显示了应用特征选择算法前后每类的元素数量。\n\
  \n######### 表 2. 应用特征选择算法后各类别的特征数量\n\n| 数据类别 | 属性数量 | 选择后的特征数量 |\n| --- | --- |\
  \ --- |\n| 网络层 | 65 | 9 |\n| 网络层和传输层 | 35 | 9 |\n| 网络层和数据链路层 | 15 | 4 |\n\n\n\n\n\
  \n######## 实验与结果分析\n\n随后，我们采用了随机森林分类算法，因为它在实验中取得了最佳结果。我们将随机森林应用于三个类别，以查看哪一类数据包层对检测攻击贡献最大、效果最好且准确率最高；同时也将其应用于各类别的选定特征，以检查准确率的变化。在保持高效率的前提下获得最少数量的特征将是最佳解决方案。\n\
  \n######### 实验 1\n\n首先，为利用最少特征检测 Mirai 攻击，我们分别采用了两种最常见的元启发式搜索算法——遗传算法和粒子群优化（PSO），以检验它们在众多解决方案中搜索最佳特征子集的效率。遗传算法从\
  \ 116 个元素中选择了 18 个特征，粒子群优化选择了 12 个元素。\n\n随后，我们应用了三种分类算法——朴素贝叶斯、J48 和随机森林——构建模型以检测网络流量中\
  \ Mirai 僵尸网络的恶意行为，并对比哪种算法效果最佳。我们使用 10 折交叉验证测试模型，并采用准确率、精确率、召回率和 F1 值等指标评估结果。表 3\
  \ 展示了分别应用遗传算法和 PSO 后，这些分类算法在数据集上的性能表现。随机森林算法在两种特征选择算法中均取得最佳结果，遗传算法下准确率为 99.53%，PSO\
  \ 下为 99.81%。该数据集上的先前工作已达到 100% 准确率（Meidan 等，2018）。因此，我们尝试一种能获得更高准确率的方法：先应用遗传算法再应用\
  \ PSO 的实验达到了预期效果，该方法仅选择了 8 个特征，却足以以 100% 的准确率检测 Mirai 僵尸网络的异常行为。表 4 展示了该实验结果，随机森林算法结合这种双重特征选择影响也获得了\
  \ 100% 的最佳准确率。\n\n########## 表 3. 两个网络层子集在随机森林算法下的结果\n\n| 数据子集 | 特征选择前准确率 | 特征选择后准确率\
  \ |\n| :--- | :---: | :---: |\n| 网络层 | 100% | 99.98% |\n| 网络层和传输层 | 99.96% | 99.95%\
  \ |\n| 网络层和数据链路层 | 100% | 100% |\n\n########## 表 4. 遗传算法与 PSO 单独应用的结果\n\n| 指标 |\
  \ 遗传算法 | | | 粒子群优化 (PSO) | | |\n| :--- | :---: | :---: | :---: | :---: | :---: |\
  \ :---: |\n| | 朴素贝叶斯 | J48 | 随机森林 | 朴素贝叶斯 | J48 | 随机森林 |\n| 准确率 | 98.10% | 96.3%\
  \ | **99.53%** | 98.00% | 95.73% | **99.81%** |\n| 精确率 | 0.880 | 0.962 | **1.00**\
  \ | 0.981 | 0.952 | **1.00** |\n| 召回率 | 0.880 | 0.974 | **1.00** | 0.981 | 0.975\
  \ | **1.00** |\n| F1 值 | 0.880 | 0.967 | **1.00** | 0.981 | 0.963 | **1.00** |\n\
  \n########## 表 5. 多阶段特征选择（遗传算法后接 PSO）的结果\n\n| 指标 | 遗传算法 + PSO | | |\n| :--- | :---:\
  \ | :---: | :---: |\n| | 朴素贝叶斯 | J48 | 随机森林 |\n| 准确率 | 99.99% | 98.99% | **100%**\
  \ |\n| 精确率 | 1.00 | 0.989 | **1.00** |\n| 召回率 | 1.00 | 1.00 | **1.00** |\n| F1 值\
  \ | 1.00 | 0.994 | **1.00** |\n\n######## 结论与未来工作\n\n本文提出了一种结合遗传算法和粒子群优化的多阶段特征选择方法，配合随机森林集成机器学习算法，构建了一个用于检测基于网络的\
  \ Mirai 异常行为的分类模型，且仅使用最少数量的特征。在三种分类算法（朴素贝叶斯、J48 和随机森林）的对比中，随机森林表现最佳，成功以 100% 的准确率检测出所有异常行为。未来工作将重点关注传输层（TCP/UDP\
  \ 套接字）的特性及其对检测异常流量行为的影响，以期获得更好的结果和准确率，并证明仅分析该层并实时计算其统计特征即足以检测 Mirai 的异常行为。\n\n#####\
