  \n#### 第 11 章\n\n##### 作者\n\n*   **Chaoran Liu**  \n    奥克兰理工大学，新西兰\n\n*   **Wei\
  \ Qi Yan**  \n    奥克兰理工大学，新西兰\n\n##### 摘要\n\n步态识别主要利用每个个体的不同姿态进行身份认证。在现有方法中，使用全周期步态图像进行特征提取，但在实际场景中存在遮挡和丢帧等问题。获取全周期步态图像并不容易。因此，如何基于少量步态图像构建高效的步态识别算法框架，以提高识别的效率和准确性，已成为步态识别研究的焦点。在本章中，创建了深度神经网络\
  \ `CRBM+FC`。基于 `局部二值模式（LBP）` 和 `方向梯度直方图（HOG）` 融合的特征，提出了一种从 `步态能量图像（GEI）` 学习到输出的步态识别方法。提出了一种基于\
  \ `LBP` 和 `HOG` 分层融合的全新步态识别算法。本章还提出了一种特征学习网络，该网络使用无监督卷积约束玻尔兹曼机来训练 `步态能量图像（GEI）`。\n\
  \n##### 引言\n\n生物特征识别基于个体独特的生理或行为特征。生物特征识别不像身份证等物理证件那样容易被转移或窃取，具有安全、可靠、方便的特点（Ahonen,\
  \ Hadid, & Pietikainen, 2006）。步态识别基于人体的行走姿态（Little & Boyd, 1998）。与指纹识别、语音识别、人脸识别等技术相比，步态识别具有采集容易、距离远、接触少、难以伪造等优势，是生物特征识别、计算机视觉、智能监控等领域的热门研究课题（Cunado,\
  \ et al. 1997）。\n\n\n\n\n\n###### 计算机视觉与步态识别\n\n计算机视觉是包含步态识别的研究领域之一。给定一个包含一个或多个行走姿态的图像序列，广义上的步态识别可分为四个主要阶段：行人检测、行人区域分割、行人跟踪和行人识别（Boykov\
  \ & Jolly, 2001; Bulat & Tzimiropoulos, 2016; Cao et al., 2017; Tan et al., 2006）。\n\
  \n####### 行人检测阶段\n\n在行人检测阶段，它定位单个视频帧中行人的位置并确定图像大小（Liu & Payandeh, 2018）。\n\n#######\
  \ 行人分割阶段\n\n在行人分割阶段，基于检测结果执行像素级分割，并将视频中的背景信息移除。\n\n####### 行人跟踪阶段\n\n行人跟踪阶段确定目标对象的运动轨迹，并从视频序列中区分不同个体（Foresti,\
  \ 1999）。\n\n####### 分类与识别阶段\n\n在分类与识别阶段，它将类标签之一分配给测试步态样本以识别人员（Kusakunniran, 2014）。该过程计算测试样本与注册样本之间的相似度，并根据机器学习规则完成分类。该阶段通常与特征提取相结合，以识别适合分类的类别。根据时间序列方式的步态特征，此类方法可分为两类。\n\
  \n###### 相关工作\n\n一般来说，步态识别指的是行人识别（Sarkar et al., 2005; Shiraga et al., 2016），它利用从行人轮廓图中提取的特征来识别人员（Lam\
  \ et al., 2011; Murase & Sakai, 1996; Wang et al., 2004）。近年来，随着深度学习的发展，例如 `Mask\
  \ Region-Based Convolutional Neural Network (Mask-RCNN)`，将步态识别应用于实际复杂场景成为可能（He et\
  \ al., 2017; Lee & Grimson, 2002）。\n\n不同于直接将步态轮廓作为输入送入深度神经网络，Shiraga 采用 `Gait Energy\
  \ Images (GEI)` 作为输入特征（Tao & Maybank, 2007）。`GEI` 是一种步态模型，包含一序列混合步态轮廓中的静态和动态信息。模型中每个像素的能量是通过计算一个步态周期内轮廓像素的平均强度获得的。\n\
  \n`LBP` 基于灰度图像像素的值。`HOG` 主要利用像素的梯度大小和方向（Dalal & Triggs, 2005）。因此，经过第一轮操作后，仍然存在具有灰度强度变化的图像。为了从灰度图像中获取丰富且有用的纹理信息和边缘形状信息，可以生成分层\
  \ `LBP` 和 `HOG`（见图 2）。\n\n如图 2 所示，所有图像都包含用于后续处理的有用信息。图 2(b) 清楚地表达了强烈的纹理信息和轮廓信息。图\
  \ 2(e) 明显指示了人体步态的边缘信息。图 2(c) 和图 2(f) 比图 2(b) 和图 2(e) 较弱，但仍有可利用的有用信息。因此，分层结构显然能提供更多信息。\n\
  \n提取步态特征的传统步态识别算法相对简单（Niyogi & Adelson, 1994）。此外，由于遮挡、光照和其他干扰因素的影响，步态识别率通常很低。因此，信息融合理论广泛应用于步态识别。Han\
  \ 结合 Platts 分析与椭圆傅里叶描述子来匹配人体轮廓以进行步态识别（Han, 2010）。该方法结合了人体的时空运动特征、统计和物理参数来分析步态轮廓形状。然而，它忽略了内部特征。Derlatka\
  \ 提出了一种基于人体不同步态数据的生物特征系统，结合了动态信息（地面反作用力）和静态信息（如躯干和臀部宽度、大腿长度和身高）（Derlatka & Bogdan,\
  \ 2015）。该方法需要繁琐的特征提取过程和复杂的信息输入，导致计算过程复杂，无法满足实时需求。本章的组合方法不仅能描述局部纹理信息，还能描述边缘轮廓信息，计算非常简单快捷。\n\
  \n| 图 1. 步态识别通用步骤流程图 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch011.f01](img/ch011.f01.png)\
  \ |\n\n| 图 2. 分层 LBP 和 HOG 特征 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch011.f02](img/ch011.f02.png)\
  \ |\n\n前两层的 `LBP` 和 `HOG` 特征包含相对清晰的纹理特征和轮廓边缘。随着提取层数的增加，图像中可用的信息减少。第三层的信息明显模糊。因此，本章将由三层表示的\
  \ `LBP` 和 `HOG` 特征图像进行划分，每层均包含有用信息。如果综合不同层的信息，提取的信息将更加完整和有效。因此，本章采用特征融合方法，即分层 `LBP`\
  \ 和基于分层 `LBP` 的分层特征融合。该方法首先对 `GEI` 图提取三次 `LBP` 特征，以获得每层的 `LBP` 直方图和每层的 `LBP` 图像，然后在每层的\
  \ `LBP` 图像上提取相应的 `HOG` 特征。基于 `LBP` 图像的 `HOG` 特征图像，将每层的 `LBP` 特征直方图和基于 `LBP` 图像的\
  \ `HOG` 特征直方图顺序连接，得到每层的融合特征直方图，最后将三层的特征直方图顺序级联，形成最终的融合特征。\n\n根据目标不同，步态识别可分为两类。一类任务是验证：根据相似度指数或给定阈值判断给定样本和验证样本，以识别给定对象；即给定测试样本，研究问题是如何在给定数据集中找到具有相同身份的样本（Johansson,\
  \ 1973）。\n\n步态数据集包括训练数据集和测试集。训练集用于训练并生成分类模型；测试集用于评估分类模型的泛化性能。训练集和测试集保持互斥关系；即测试样本不应出现在训练集中（Zheng\
  \ et al., 2011）。通常，我们使用训练数据集训练模型，并基于测试集评估步态识别方法的优劣。从实际角度来看，识别率是衡量步态识别算法性能的指标。一般来说，识别率越高，算法性能越好。此外，累积识别率和\
  \ `ROC` 曲线常用于评估性能（Yu et al., 2006; Yu et al., 2009）。\n\n####### 方法论\n\n本章采用结合 `HOG`（Viola\
  \ et al., 2005）和 `LBP`（Han & Bhanu, 2005; Jeevan et al., 2013）的特征。从 `GEI` 提取 `m`\
  \ 次特征可获得 `m` 级 `LBP` 特征图像（Derlatka & Bogdan, 2015; Yan et al., 2015）。将每级 `LBP` 特征与\
  \ `HOG` 特征融合，可获得最终的融合特征。将所有特征顺序连接在一起（Wang et al., 2003）即可得到该 `GEI` 的最终特征，如图 2 所示。\n\
  \n\n\n\n\n###### 深度神经网络架构\n\n本章的深度神经网络由一个卷积受限玻尔兹曼机和一个全连接层网络组成（Begg, Palaniswami\
  \ & Owen, 2005）。不同于卷积神经网络的监督学习方法（Tao & Maybank, 2007; Yu, et al. 2006），卷积受限玻尔兹曼机是一种无监督学习模型，它通过比较散度算法来学习网络参数，并完成输入图像的特征提取以用于识别和分类（Chen,\
  \ et al. 2009; Lee, et al. 2009）。本章提出的网络使用 GEI+LBP+HOG 特征作为输入，并分别用 3×3 和 7×7 卷积核对其进行卷积，以获得不同尺度下的异步特征（Xu,\
  \ et al. 2011）。同时，在卷积受限玻尔兹曼机之后获得步态特征，利用全连接网络将两个不同卷积核获得的特征融合，最终在全连接网络末端利用该特征进行分类识别，如图\
  \ 3 所示。\n\n| 图 3. 网络结构 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch011.f03](img/ch011.f03.png)\
  \ |\n\n首先，使用卷积受限玻尔兹曼机（CRBM）进行特征提取；提取的步态特征通过全连接网络进行训练，最后使用 softmax 函数对特征进行分类以获得预测结果；然后将预测结果与真实结果进行比较，计算交叉熵损失。同时，使用反向传播算法优化网络参数。\n\
  \n在卷积受限玻尔兹曼模型训练中设置了两个不同尺寸的卷积核，分别为 3×3 和 7×7 矩阵；每种尺寸各有 32 个卷积核。通过此操作，将发现核尺寸对性能的影响。\n\
  \n####### 实验结果\n\n实验旨在研究所提算法的有效性。在实验中，训练数据的行走姿态与测试数据的行走姿态相同，该组实验（训练集-测试集）记为 (nm-nm)、(bg-bg)、(cl-cl)。在跨状态实验中，训练数据集的行走姿态与测试数据集不同，实验（训练集-测试集）包括\
  \ (nm-bg) 和 (nm-cl)。数据集中的四个视频序列用于 (nm-nm) 的训练，其余数据用于测试。在 (bg-bg) 和 (cl-cl) 中，一半数据用作训练集，一半用作测试集。在跨状态实验\
  \ (nm-bg) 和 (nm-cl) 中，nm 中的四个视频序列作为训练集，bg 和 cl 中的所有数据作为测试集。表 2 展示了我们的实验策略。\n\n表\
  \ 1 展示了已建立的步态识别数据库。目前，这些数据库缺乏普适性和广泛的适用性。目前最大的步态数据库是英国南安普顿大学创建的 Soton Big Gait Database，以及中国科学院自动化研究所（CASIA）创建的多视角步态数据库（CASIA-B）和红外步态数据库（CASIA-C）。此外，CASIA-C\
  \ 数据库是目前唯一公开可用的大规模红外步态数据库。USMT 步态数据库是目前为数不多的可用 3D 步态库之一。\n\n####### 表 1. 现有的步态识别数据库\n\
