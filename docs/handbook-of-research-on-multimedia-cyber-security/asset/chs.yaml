  表 4 和表 5 对比了两个不同公开数据集上用于人体行为识别的传统机器学习方法、深度学习方法和集成学习方法。对于 `YOLOv3`，我们达到了最高 96.29%\
  \ 的准确率；最近邻分类器（`NNC`）通过使用兴趣点的全局时空分布，显示出了 95.6% 的准确率（Bregonzio et al., 2009）。此外，就深度学习方法而言，它们实现了实时识别；同时，传统方法需要逐帧进行人体行为识别。\n\
  \n对于 KTH 数据集，`DenseNet` 达到了 86.63% 的准确率。关于 3D CNN，它们通过执行 3D 卷积提取时空特征，拥有最高准确率（90.2%）（Ji\
  \ et al., 2013）。此外，Ivan 等人提出了一种基于贪婪匹配方法的梯度直方图来识别人体行为，准确率达到了 94.2%（Ivanov et al.,\
  \ 2000）。由于某些行为具有相似的局部时空事件，导致了错误分类（Laptev et al., 2004）。此外，Jagadeesh 等人通过采用带有 HOG\
  \ 特征的 SVM 实现了 92.48% 准确率的人体行为识别（Jagadeesh et al., 2019）。此外，还提出了一种基于集成学习的方法，使用 Weka\
  \ 3 将这四个模型结合在一起，在人体行为识别中获得了更先进的结果。在实验中，我们利用两种不同的集成学习器来评估结果。对于带有随机森林的 Bagging 分类器，其准确率达到了\
  \ 98.8%，比单模型识别高出 12.17%；通过利用带有随机森林的 AdaBoost 分类器，在 KTH 数据集上能够达到 98.71% 的准确率。通过在魏茨曼数据集上结合\
  \ AdaBoost 和 Bagging 集成学习器与随机森林，最终准确率达到了 97.76%。\n\n########### 表 5. 使用 KTH 数据集的机器学习与深度学习方法对比\n\
