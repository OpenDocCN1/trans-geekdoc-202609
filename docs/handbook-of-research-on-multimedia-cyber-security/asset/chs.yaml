  \ 结论与未来工作\n\n在本文中，我们提出了一个用于触摸屏持续用户认证的框架，旨在识别冒名顶替者对机器的任何滥用。我们的研究证明，使用可以在触摸会话级提取的会话级特征模型，在使用\
  \ `ANN` 分类器对触摸设备用户进行分类时更为高效。考虑到我们的实验条件和规格，我们获得了更好的性能和识别准确率。此外，在笔划级特征模型中，冒名顶替者用户以某种方式可以模拟笔划行为，然而，他无法模拟长时间在设备上工作的所有触摸会话中的所有笔划。因此，当我们有大量训练样本时，强烈推荐使用此模型，此时分类准确率将非常令人满意。\n\
  \n由于会话级模型中的样本数量较少，使用 `SVM` 分类器的结果令人不满意。根据在使用 `ANN` 和 `SVM` 分类算法的两个特征模型中使用 `PCA`\
  \ 的情况，我们发现减少特征可以对模型复杂度和降维产生积极影响，但它对分类准确率和 `FRR` 产生了负面影响。\n\n未来的工作可以考虑不同的操作系统和不同尺寸、分辨率和像素密度的触摸屏，以使该概念适用于所有设备，并具有令人满意的性能和效率。此外，可以使用其他机器学习算法和工具，如深度学习、`k`\
  \ 近邻、朴素贝叶斯或决策树，以获得更好的性能和更高的准确率。移动应用程序开发框架的新趋势，如 `Xamarin` 跨平台和 `Cordova` 框架，可用于构建认证框架。\n\
