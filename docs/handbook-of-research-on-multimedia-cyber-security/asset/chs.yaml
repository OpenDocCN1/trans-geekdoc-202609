  \    墨尔本大学，澳大利亚\n*   Rajkumar Buyya\n    墨尔本大学，澳大利亚\n\n##### 摘要\n\n容器被组织广泛用于部署各种工作负载，例如\
  \ Web 服务、大数据和 IoT 应用。容器编排平台旨在管理大规模集群中容器化应用的部署。大多数此类平台针对固定规模的集群优化容器调度，并未启用集群自动伸缩功能，也不考虑公有云环境特有的特性。本章提出了一种具有三个目标的资源管理方法：1)\
  \ 通过在现有资源上高效调度容器来优化其初始放置；2) 基于集群工作负载在运行时自动伸缩资源数量；3) 在运行时将应用整合到更少的 VM 中。该框架作为 `Kubernetes`\
  \ 插件实现，并在澳大利亚云基础设施上评估了其效率。实验表明，通过动态管理集群规模和应用放置，可实现 58% 的成本降低。\n\n##### 引言\n\n容器（如\
  \ `Docker` (`Docker`, n.d.) 和 `Linux Containers` (`LXC`) (`Bernstein`, 2014)）是独立且自包含的单元，将软件及其依赖项打包在一起。与虚拟机\
  \ (`VMs`) 类似，容器是一种虚拟化技术，允许多个用户和应用共享单个计算节点的资源。然而，`VMs` 在硬件层面虚拟化资源，而容器则在操作系统层面进行虚拟化。这使它们成为一种轻量级虚拟化方法，能够实现应用环境隔离、快速灵活的部署以及细粒度的资源共享。\n\
  \n组织越来越多地依赖容器化来部署源自现代应用的各种工作负载，例如 Web 服务、大数据和 IoT 应用。容器编排平台（如 `Kubernetes` (`Hightower\
  \ et al.`, 2017)、`Docker Swarm` (`Naik`, 2016) 和 `Apache Mesos` (`Hindman et al.`,\
  \ 2011)）负责在共享计算集群中高效编排此类应用。这些平台管理容器的生命周期以及集群资源的使用，因此其主要目标之一是（近乎）最优地将容器化应用放置在可用节点上。这一调度问题正是本章的重点。\n\
  \n随着应用被提交部署，编排系统必须尽快将它们调度到可用资源之一上。这必须在尝试最大化集群计算资源利用率的前提下完成，因为这很可能会降低组织的运营成本。这种放置还应考虑诸如可用机器容量、应用性能和服务质量\
  \ (`QoS`) 要求、容错能力和能耗等因素。尽管现有的容器编排平台在一定程度上解决了这些问题，但仍需进一步研究，以便在不同情况下和针对不同应用需求更好地优化资源使用。\n\
  \n在云环境中，容器和 `VMs` 可结合使用，为用户在部署、构建和管理应用方面提供极大的灵活性。在这种情况下，不仅容器的数量应伸缩以满足应用需求，可用计算资源的数量也应调整以充分托管所需容器。在任何给定时间点，云容器编排系统都应避免\
  \ `VMs` 资源利用不足，作为一种成本和能耗控制机制。它还应能动态向集群添加工作节点 `VMs`，以避免因资源过度利用导致应用性能下降。因此，自动伸缩 `VMs`\
  \ 数量对于成功满足部署在公有云上的容器化应用的性能目标以及降低租赁所需基础设施的运营成本至关重要。这增加了上述容器放置和调度问题的复杂性。\n\n现有的容器编排框架提供装箱算法以在固定规模的集群上调度容器，但未启用集群规模自动伸缩功能。相反，这一决策留给用户或平台层面的外部框架。此类场景的一个例子是使用\
  \ `Kubernetes` 进行容器放置，并使用亚马逊的自动伸缩机制管理集群节点。这种方法不仅可能不切实际，而且效率低下，因为外部实体对容器工作负载的信息有限。\n\
  \n主流编排系统未考虑的另一个优化方面与重新调度有关；特别是为了减少资源碎片和缩小集群规模而进行的重新调度。无论这些任务的初始放置有多好，随着工作负载的变化，资源利用率会随时间下降。重新调度那些能容忍组件关闭并重启的应用，将使编排系统能够整合和重新排列任务，从而在相同数量的节点上部署更多应用，或关闭某些节点以降低成本或节省能源。同样，如果向集群添加更多节点，能够将部分已部署应用重新调度到新节点上，从长远来看可能是有益的。\n\
  \n因此，本章的工作主张：一个能够做出所有资源管理决策（包括自动伸缩和重新调度）的以云为中心的容器编排框架，对于在云环境中成功优化资源使用至关重要。因此，这项工作的主要贡献是一个综合的容器资源管理框架，具有三个不同的目标。第一个目标是优化容器的初始放置，以使工作节点\
  \ `VMs` 的数量最小化，同时满足容器化应用的内存和 CPU 需求。第二个目标是基于当前集群工作负载自动伸缩工作节点 `VMs` 的数量。一方面，扩容将使当前资源需求得到满足，同时减少放置和启动容器所需的时间。另一方面，缩容将使应用得以重新定位，从而关闭利用率低的\
  \ `VMs` 以降低基础设施成本。最后，重新调度机制将通过在可能时将应用整合到更少的 `VMs` 中，进一步支持资源的高效利用，以避免不必要的扩容操作并鼓励缩容操作。\n\
  \n本章其余部分组织如下。第 2 节介绍现有的容器管理平台及其他相关调度算法。第 3 节讨论我们的编排框架所考虑的应用和资源模型。第 4 节讨论拟议系统的架构及其利用\
  \ `Kubernetes` 的实现。第 5 节讨论拟议的自动伸缩、重新调度和调度方法。第 6 节展示在澳大利亚国家云基础设施上对我们的框架和拟议算法的评估。最后，第\
  \ 7 节总结本章，并确定和讨论新的研究方向。\n\n###### 相关工作\n\nUijlings, J., Sande, K., Gevers, T., &\
  \ Smeulders, A. (2013). Selective search for object recognition. *International\
  \ Journal of Computer Vision*, 104(2), 154-171.\n\nXiang, T., Gong, S. (2005) Video\
  \ behavior profiling and abnormality detection without manual labelling. *Proceedings\
  \ of the IEEE International Conference on Computer Vision*, pp. 1238-1245.\n\n\n\
  \n\n在研究和开源社区中，已经有大量尝试构建可靠且可扩展的集群容器管理平台（Rodriguez & Buyya, 2019）。这些系统负责管理通用应用程序的部署，这些应用通常打包在基于\
  \ `Docker` 或 `Linux cgroups` 的容器中。在本节中，我们将简要介绍容器编排领域中软件系统和资源管理算法的相关工作。\n\n#####\
  \ 软件系统\n\n**Kubernetes** (Hightower, Burns, & Beda, 2017) 是领先的开源容器管理平台，源自 Google\
  \ 的内部 **Borg** 系统 (Verma et al., 2015)。Kubernetes 在虚拟化或物理集群中编排和管理异构容器化应用程序（如服务和批处理作业）的生命周期。它提供了一个默认调度器，根据用户定义的需求筛选可用集群资源，并基于单独定义的应用亲和性进行排序，将每个容器组（或\
  \ `pod`）分配给这些资源。Kubernetes 的详细评估可参见 (Medel, Rana, Bañares, & Arronategui, 2016)。\n\
  \n**Docker Swarm** (Naik, 2016) 是 `Docker` 容器的原生集群解决方案。它提供发现服务，并使用预定义的策略和过滤器将容器调度到主机上。默认情况下，它支持两种简单策略：i)\
  \ 分散策略，倾向于在负载最低的主机上运行新容器；ii) 紧凑策略，倾向于在资源足够运行容器的负载最高的主机上运行。Docker Swarm 还采用过滤机制来识别合格资源；用户可以定义关于主机状态、健康检查结果和容器配置（如资源和文件亲和性以及对其他容器的依赖）的过滤器。\n\
  \n**Apache Mesos** (Hindman et al., 2011) 实现了各种应用程序之间的集群共享。与 Kubernetes 和 Swarm\
  \ 不同，Mesos 可被视为运行在这些平台之上的元平台。它采用两阶段调度方法。在第一阶段，它划分集群资源，并通过资源提供分别向每个应用程序配置资源。一旦应用程序接受资源提供，它就可以继续使用自己的调度逻辑在获得的资源上调度其任务。之后，Mesos\
  \ 实际上在相应主机上为应用程序启动任务。\n\n**Apache Marathon** (Marathon, n.d.) 和 **Apache Aurora**\
  \ (DelValle, Rattihalli, Beltre, Govindaraju, & Lewis, 2016) 是构建在 Mesos 之上的两个流行通用框架。Marathon\
  \ 旨在编排长期运行的服务。因此，它专注于为应用程序提供容错和高可用性；Marathon 将确保已启动的应用程序即使在节点故障时也能继续运行。Aurora 最初由\
  \ Twitter 开发，是一个调度器，支持在集群中部署长期运行的服务、定时作业和临时作业。Aurora 专注于确保服务持续运行，因此，当发生机器故障时，作业会被智能地重新调度到健康的机器上。值得注意的是，就功能而言，Marathon\
  \ 和 Aurora 是非常相似的产品。然而，两者存在一些差异。主要区别在于 Marathon 仅处理服务类作业。此外，设置和使用 Marathon 被认为比\
  \ Aurora 更简单；例如，Marathon 包含一个用户界面，用户可通过它直接调度任务。\n\n**YARN** (Vavilapalli et al.,\
  \ 2013) 是一个旨在编排 Hadoop 任务的集群管理器，尽管它也支持 Giraph、Spark 和 Storm 等其他框架。运行在 YARN 之上的每个应用程序框架都根据自身情况协调各自的执行流程和优化。在\
  \ YARN 中，每个集群有一个资源管理器（`RM`），每个框架有一个应用程序主节点（`AM`）。`AM` 向 `RM` 请求资源，并根据接收到的资源生成物理计划。因此，YARN\
  \ 的两级调度模型与 Mesos 相似，但不同之处在于应用程序向 YARN 请求所需资源，而不是由 YARN 主动提供资源。\n\n尽管上述大多数系统已经成熟，但资源管理优化领域仍可进一步探索。这在云计算时代尤为真实，因为大多数现有框架假设资源集群是静态的，而忽略了云平台的许多固有特性。结果是，弹性、定价和服务异构性被忽视。用于碎片整理和自动扩缩容的重新调度是上述系统中缺失的另一项功能。本文旨在通过探索在管理集群资源时考虑自动扩缩容和重新调度的优势来弥补这些空白。\n\
  \n##### 资源管理算法\n\n本节讨论专注于基于容器调度算法的相关工作。Xu 等人 (Xu, Yu, & Pei, 2014) 为基于容器的云环境提出了一种资源调度方法，旨在减少请求响应时间并提高资源利用率，该方法利用稳定机器理论获得容器到主机的最优映射。(Zhang\
  \ et al., 2016) 设计了一个基于容器的新型视频监控云平台，应用未来工作负载预测实现细粒度资源配置并确保服务质量。(Kaewkasi & Chuenmuneewong,\
  \ 2017) 应用蚁群优化算法将容器分配给主机，旨在平衡资源使用。(Kehrer & Blochinger, 2018) 为 **Apache Mesos**\
  \ 提出了一种两阶段部署方法，以实现对容器更灵活的管理。(Guerrero, Lera, & Juiz, 2018) 为 **Kubernetes** 平台提出了一种遗传算法，以优化容器分配和弹性管理。他们的算法可以提高系统性能并减少网络开销。与本章提出的工作相反，上述方法专注于容器的初始放置（即调度），并未考虑重新调度和自动扩缩容。\n\
  \n(Yin, Luo, J., & Luo, H., 2018) 利用容器构建了一个任务调度模型，并开发了一种任务调度算法以减少雾计算环境中的任务完成时间。他们还提出了一种重新调度方法来优化任务延迟。然而，结果仅在模拟环境中得到验证。\n\
  \n(Xu, Toosi,, & Buyya, 2018) 提出了一种基于容器和 Brownout（电压降低/功能降级）的方法，可以动态激活和停用可选容器，以在满足服务质量要求的前提下实现云资源的节能管理。该方法应用自动扩缩容来减少活跃主机数量，但未考虑容器的初始放置和重新调度。\n\
  \n表 1 总结了专注于资源管理算法的相关工作对比。\n\n**表 1. 相关算法工作对比**\n\n| 工作 | 目标/关注点 | 初始放置 | 重新调度 |\
  \ 自动扩缩容 | 平台 |\n| --- | --- | --- | --- | --- | --- |\n| (Xu et al. 2014) | 减少响应时间\
  \ | √ | | | 仿真 |\n| (Zhang et al., 2016) | 提高资源利用率 | √ | | | Docker |\n| (Kaewkasi\
  \ & Chuenmuneewong, 2017) | 平衡资源使用 | √ | | | Docker |\n| (Yin et al., 2018) | 减少任务延迟\
  \ | √ | √ | | 仿真 |\n| (Guerrero et al., 2018) | 减少网络开销 | √ | | | Kubernetes |\n\
  | (Kehrer & Blochinger, 2018) | 灵活管理 | √ | | | Mesos |\n| (Xu et al. 2018) | 降低能耗\
  \ | | | √ | Docker |\n| 本工作 (本章) | 降低成本 | √ | √ | √ | Kubernetes |\n\n##### 应用与资源模型\n\
  \n\n\n###### 容器编排框架\n\n我们考虑一个部署在虚拟化公有云环境中的容器编排框架，由组织或平台即服务提供商部署。因此，该框架可以访问无限数量的虚拟机，这些虚拟机可按需供应和取消供应。在本工作的初始阶段，我们假设虚拟机是同构的，即具有相同的价格和特征，并按计费周期收费。虚拟机的特征由其内存和\
  \ CPU 容量定义。\n\n本工作中考虑的工作负载特征源自 Google、Alibaba 和 Fuji 等组织大规模集群的使用模型。为了高效利用资源，这些组织倾向于在共享集群上运行不同类型的容器化应用程序，而不是运行同构容器的独立集群。我们考虑的工作负载由两种持续到达的容器化任务类型组成。第一类任务是长期运行的服务，需要高可用性且必须处理延迟敏感型请求。示例包括面向用户的\
  \ Web 应用程序或 Web 服务。第二类任务是批处理作业。这些作业生命周期有限，且更能容忍性能波动。示例包括科学计算、数据分析和 MapReduce 作业。\n\
  \n我们假设所有任务都定义了它们所需的 CPU 和内存数量（即资源请求）。这样，任务将仅部署在至少拥有其所需资源量的节点上。此外，长期运行的服务可由用户定义为可移动的。可移动任务是指那些为了重新调度和自动扩缩容，可以容忍被关闭并在不同节点上重新启动的任务。这可能包括无状态\
  \ Web 应用程序或复制的 Web 服务。\n\n从高层视角来看，本工作解决的问题分为三个阶段：\n\n*   **调度**：将传入的任务放置在至少拥有该任务请求的\
  \ CPU 和内存资源量的集群资源上。\n*   **重新调度**：如果存在无法调度的传入任务（即没有节点有所需的可用资源量），则重新调度器将尝试重新排列可移动的运行中任务，以便为无法调度的任务腾出空间。\n\
  *   **自动扩缩容**：此问题分为两个子问题：i) 扩容和 ii) 缩容。一方面，如果尝试重新调度后仍有无法调度的任务，自动扩缩容器应考虑扩容（供应新的虚拟机）以增加集群容量。如果存在未使用的虚拟机或集群资源利用效率低下，自动扩缩容器应考虑关闭未使用的虚拟机或合并任务，以提高集群利用率并取消供应不必要的虚拟机。\n\
  \n本工作的总体目标是强调并说明容器编排需要整体资源管理方法的必要性；即一种同时考虑调度、重新调度和自动扩缩容的方法。所提出的框架集成了这三个过程，并允许不同的策略无缝插入。\n\
  \n###### 系统架构\n\n图 1 描述了系统的架构及其通过扩展 Kubernetes (K8s) 平台实现的方式。现有的 K8s 组件显示为蓝色，扩展组件显示为绿色。在本节其余部分中，我们首先介绍\
  \ Kubernetes 及与本工作相关的关键特性，随后概述每个提议的组件。\n\n| Figure 1. Architecture of the prototype\
  \ system |\n| --- |\n| ![Figure978-1-7998-2701-6.ch010.f01](img/ch010.f01.png) |\n\
  \n####### Kubernetes\n\nKubernetes 是一个旨在管理集群上容器化工作负载的框架。Kubernetes 中的基本构建块是 `pod`。一个\
  \ `pod` 封装一个或多个紧密耦合的容器，这些容器被放置在同一位置并共享同一组资源。`pod` 还封装存储资源、一个网络 IP 以及一组选项，这些选项控制\
  \ `pod` 的容器应如何运行。一个 `pod` 旨在运行应用程序的单个实例；通过这种方式，可以使用多个 `pod` 来水平扩展应用程序。创建 `pod` 时可以指定容器所需的\
  \ CPU、内存和临时存储量。然后调度程序可以使用此信息来决定 `pod` 的放置。这些计算资源既可以指定为请求量，也可以指定为容器允许消耗的量的限制。\n\n\
  默认的 Kubernetes 调度程序确保放置在节点上的所有 `pod` 的计算资源请求总量不超过节点的容量。即使实际资源消耗非常低，也是如此。这样做的原因是为了保护应用程序，防止当资源使用稍后增加时（例如在每日高峰期间）节点上出现资源短缺。如果容器超过其内存限制，它可能会被终止，并可能稍后重新启动。如果它超过其内存请求，当节点内存耗尽时它可能会被终止。关于\
  \ CPU 使用，容器可能被允许在一段时间内超过其限制，但不会因此被终止。另一方面，超过存储限制的容器和 `pod` 将被驱逐。\n\n其他资源（称为 `Extended\
  \ Resources`）可以被指定以宣告新的节点级资源，其资源核算由调度程序管理，以确保不会同时向 `pod` 分配超过可用数量的资源。\n\n从技术角度来看，Kubernetes\
  \ 允许使用各种类型的容器运行时，`Docker` 和 `rkt` 由平台原生支持。最近，框架的容器运行时接口 (`CRI`) API 的发布使 Kubernetes\
  \ 能够支持其他容器技术，如 `containerd` 和 `frakti`（一种基于虚拟机监控程序的容器运行时）。此外，`CRI-O`（`CRI` API 的一种实现）目前使\
  \ Kubernetes 能够支持任何符合 `OCI` (Open Container Initiative) 标准的容器运行时，如 `runc`。此外，`etcd`（一个开源、高可用、分布式的键值存储）支持\
  \ Kubernetes 管理集群节点和作业。具体而言，`etcd` 用于存储集群的所有数据，并充当框架所有组件的单一事实来源。\n\n总体而言，Kubernetes\
  \ 是一个高度成熟的系统；它源自 Google 十年来在 `Borg` 和 `Omega` 上的经验，并且是拥有广泛社区驱动支持和开发基础的领先容器化集群管理系统。它为用户提供了广泛的选项来管理其\
  \ `pod` 及其调度方式，甚至允许可插拔的自定义调度程序轻松集成到系统中。总之，尽管 Kubernetes 的性能和可扩展性可能仍未达到 `Borg` 等行业系统的水平，但截至\
  \ 1.10 版本，Kubernetes 能够支持多达 5000 个节点的集群，这适合许多现代组织的需求。\n\n####### 扩展组件\n\n本节讨论作为本章提出的工作实现的一部分而添加到\
  \ Kubernetes 框架中的附加组件。\n\n######## Algorithm 1\n\n```\nwhile the scheduler exit\
  \ condition is not satisfied\n    get all pending tasks\n    for each pending task\
  \ t\n        schedule t\n        if t cannot be placed\n            reschedule\n\
  \            if rescheduling failed\n                scale out\n        scale in\n\
  ```\n\n\n\n######## 自定义调度器与 Kubernetes API 交互，持续监控集群中 Pod 的状态\n\n一个 Pod 对应单个任务，无论是长期运行还是批处理。因此，调度器专注于处理待调度\
  \ Pod（即那些需要被调度的 Pod）。对于每个待调度 Pod，会从整个集群资源池中筛选出一组合适的资源（即 Kubernetes 工作节点）。然后从中选择一个资源，并在该\
  \ Pod 与资源之间创建绑定。此绑定会导致 Kubernetes 在选定节点上运行该 Pod。再次值得一提的是，已实现了不同的策略来选择合适的节点集合并将任务分配给其中一个，这些策略可轻松插入系统。这些内容在第\
  \ 5 节中详细描述。\n\n每当无法放置 Pod 时，自定义调度器会与自定义重调度器交互。重调度器随后尝试整合可移动的 Pod，以便将传入的 Pod 放置在现有节点上。如果集群已达容量上限，且没有空间容纳传入的待调度\
  \ Pod，则会调用自动扩缩容组件，以确定是否应配置新的 VM 来放置该 Pod。自动扩缩容器随后可决定要启动的 VM 数量和类型，并指示云适配器通过特定的 IaaS\
  \ 云提供商 API 创建新实例。在此期间，不可调度的 Pod 可保留在调度队列中处于待调度状态，以便在新配置（或最近释放）的资源可用时，在后续周期中进行调度。该\
  \ Pod 也可从常规调度队列中移除，以便在新创建的节点可用后直接分配给它。自定义组件之间的交互如算法 1 所示。\n\n| 图 2. 原型系统的类图 |\n\
  | --- |\n| ![Figure978-1-7998-2701-6.ch010.f02](img/ch010.f02.png) |\n\n########\
  \ 设计与实现\n\n原型系统使用 Java 实现。它作为一个独立进程运行，因此无需部署在属于 Kubernetes 集群的节点上。如图 1 所示，系统通过 API\
  \ 与 Kubernetes 交互。图 2 展示了原型系统的高层类图。我们包含了与本文讨论相关的类、方法和属性。`util` 包中的类是直接与 Kubernetes\
  \ 交互的类，而其余类包含算法的实际逻辑。\n\n长期运行任务被定义为 Kubernetes 部署。一个部署会创建一个副本集，生成所需数量的复制 Pod。Pod\
  \ 定义了实际的应用程序或任务。当副本失败时，Pod 会自动重新创建。在本工作的初始实例中，我们假设部署具有单个副本。此外，定义为可移动的长期运行服务必须包含一个标签来指示这一点（键：`rescheduling`，值：`moveable`）。必须指定\
  \ CPU 和内存请求，以及 CPU 和内存限制，二者应相等，以确保 Pod 被分配到 Kubernetes **Guaranteed** QoS 类。图 3\
  \ 展示了定义单副本 nginx 服务部署的 YAML 文件示例。\n\n| 图 3. 定义单副本 nginx 服务部署的 YAML 文件 |\n| --- |\n\
  | ![Figure978-1-7998-2701-6.ch010.f03](img/ch010.f03.png) |\n\n| 图 4. 定义批处理作业的 YAML\
  \ 文件 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch010.f04](img/ch010.f04.png) |\n\n\
  ######### 算法 2. 最佳适配装箱调度器\n\n**输入：** 待调度 Pod `p`\n\n**输出：** 成功返回 `true`，否则返回 `false`\n\
  \n```\nnodes = getAllSuitableNodes(p)\nnode = nodes 中可用 RAM 量最少的节点\nif node is not\
  \ null\n    createBinding(node, p)\n    return true\nreturn false\n```\n\n关于请求/限制和副本的相同规则也适用于批处理作业。然而，这些是使用\
  \ Kubernetes Job 而非 Deployment 定义的，Job 允许定义运行至完成的任务。此外，Job 不能标记为可移动，而必须使用键 `type`\
  \ 和值 `batch` 进行标记。图 4 展示了定义 Job 的示例 YAML。\n\n######### 成本高效的调度与自动扩缩容算法\n\n本节描述了在原型系统中提出并实现的算法。该框架的设计灵活，允许在启动系统时使用任意组合的调度、重调度和自动扩缩容算法。\n\
  \n########## 调度\n\n########### 最佳适配装箱调度器\n\n通用装箱问题可定义如下。给定 `n` 个不同重量的物品和容量均为 `c`\
  \ 的箱子，将每个物品分配到一个箱子中，使得使用的箱子总数最小化。针对此问题的在线版本（即物品逐个到达，必须在考虑下一个物品前将当前物品放入箱子）设计了多种贪心解法。其中一种解法称为最佳适配，它将物品放入仍能容纳该物品且未超出箱子容量的最满箱子中。\n\
  \n针对本工作解决的调度问题，物品对应 Pod，箱子对应集群节点。由于 Pod 持续到达等待执行，我们也将该问题视为在线问题。因此，该调度器将传入的待调度 Pod\
  \ 放置在满足 Pod 要求且可用资源量最小的节点上。然而，此问题并非一维的，因为 Pod 需要两种不同的可用资源：CPU 和内存。我们通过首先筛选出具有足够可用\
  \ CPU 的节点，然后从该列表中选择可用内存量最少且至少满足传入 Pod 内存请求的节点来解决此问题。这样做有两个原因。首先，我们的目标是保持算法简单且能快速做出决策。其次，我们认为\
  \ CPU 是可压缩资源；即如果超出请求量或节点过载，其使用可被限制。另一方面内存是不可压缩的，其使用无法被限制。阻止 Pod 使用超额内存只能通过终止 Pod\
  \ 来实现，而缓解节点内存压力只能通过驱逐当前部署在该节点上的 Pod 来实现。\n\n########## 重调度\n\n见算法 3。\n\n###########\
  \ 算法 3. 非绑定重调度器\n\n**输入：** 不可调度 Pod `p`\n\n```\nIf age of p is greater than or equal\
  \ to max_pod_age\n    nodes = getAllNodesWithEnoughCPU(p)\n    sort nodes descending\
  \ based on available memory\n    for each node in nodes\n        if the node has\
  \ moveable pods running\n            sort moveable pods descending based on requested\
  \ memory\n            for each moveable pod\n                if the pod can be placed\
  \ somewhere else\n                    add pod to list of pods to evict\n       \
  \             update freed memory\n                    if enough memory has been\
  \ freed\n                        evict pods\n                        success = true\n\
  \                        break\n            if success\n                break\n\
  ```\n\n############ 空重调度器\n\n空重调度器将直接忽略重调度请求，因此等同于没有重调度能力的系统。\n\n############ 非绑定重调度器\n\
  \n此重调度器旨在驱逐节点上的可移动 Pod，当且仅当 i) 这些可移动 Pod 可被重新调度到其他位置，且 ii) 通过驱逐这些可移动 Pod，该节点现在拥有足够资源来放置不可调度的\
  \ Pod。然而，仅当不可调度 Pod 处于待调度状态的时间至少达到 `max_pod_age` 时才会尝试此操作。其目的是减少不必要的重调度和自动扩缩容决策，因为这给了批处理作业完成的机会，从而为不可调度\
  \ Pod 腾出空间。\n\n\n\n基于最佳适配启发式算法，并在关于可压缩和不可压缩资源的假设与最佳适配装箱调度器相同的前提下，非绑定重调度器通过以下方式实现其目标。首先，对节点进行过滤，仅获取那些拥有足够可用\
  \ CPU 以容纳不可调度 Pod 的节点。然后，根据这些节点拥有的可用内存量按升序排序。接着，对于这些节点中的每一个，如果一个或多个可移动 Pod 可以在集群中的其他节点上调度，并且该节点释放的内存量足以执行不可调度\
  \ Pod，则驱逐这些可移动 Pod，并将这些 Pod 以及不可调度 Pod 留在待调度队列中，以便它们在下一个周期中由调度器进行放置（即非绑定方式）。\n\n\
  ########## 绑定重调度器\n\n绑定重调度器的工作方式与非绑定重调度器类似。唯一的区别在于，它不会将被驱逐和不可调度的 Pod 留在待调度队列中，而是由重调度器实际将它们放置在其对应的节点上。\n\
  \n########### 算法 4. 绑定重调度器\n\n**输入：** 不可调度 Pod `p`\n\n```\nIf age of p is greater\
  \ than or equal to max_pod_age\nnodes = getAllNodesWithEnoughCPU(p)\nsort nodes\
  \ descending based on available memory\nfor each node in nodes\n    if the node\
  \ has moveable pods running\n        sort moveable pods descending based on requested\
  \ memory\n        for each moveable pod\n            if the pod can be placed somewhere\
  \ else\n                add <pod, newNode> to map of pods to evict\n           \
  \     update freed memory\n            if enough memory has been freed\n       \
  \         evict moveable pods from node\n                for each pod in pods to\
  \ evict\n                    createBinding(pod, newNode)\n                success\
  \ = true\n                break\n    if success\n        break\n```\n\n##########\
  \ 自动扩缩容\n\n########### 空自动扩缩器\n\n空自动扩缩器将直接忽略扩容和缩容请求，因此等同于一个不具备自动扩缩容能力的系统。\n\n###########\
  \ 简单自动扩缩器\n\n每当调用扩容操作时，简单自动扩缩器都会考虑启动一个预定义类型的新实例。启动的实例数量上限为每个 `provisioning_interval`\
  \ 一个。此限制背后的动机基于以下观察。不可调度 Pod 很可能成批出现。也就是说，如果资源不足以部署一个 Pod，则队列中的下一个待调度 Pod 也可能因资源不足而无法部署。因此，在同一个调度周期中，可能会多次发出扩容请求。这可能导致启动过多的实例，而实际上一个实例可能就足以执行那些不可调度\
  \ Pod。事实上，我们根据实例预配延迟的估计值（即虚拟机启动并加入 K8s 集群所需的时间）加上一个小的应急值来设置 `provisioning_interval`。但请注意，该参数可由用户配置。\n\
  \n关于缩容操作，仅当调度周期成功地将队列中所有待调度 Pod 都放置完毕时才会发生。此外，仅考虑动态创建的节点（例如通过扩容创建的节点）进行关闭。如果满足这些条件，首先，取消预配任何没有运行\
  \ Pod 的空闲节点。其次，关闭那些仅运行可移动 Pod 且这些 Pod 可以在集群中任何其他节点上放置的节点。第三，如果某节点同时运行可移动 Pod 和批处理\
  \ Pod，且其所有可移动 Pod 都可以放置在其他节点上，则将该节点标记为不可调度。如果是这种情况，则驱逐可移动 Pod，留待 Kubernetes 重新创建，并在下一个周期由调度器进行放置。因为该节点已被标记为不可调度，除非严格必要（即没有其他未标记的节点具有足够容量），否则调度器将避免在该节点上放置\
  \ Pod。通过这种方式，一旦节点上运行的批处理作业完成，该节点有可能变为空闲，从而在后续的缩容周期中被取消预配。\n\n############ 算法 5.\
  \ 简单自动扩缩器 – 扩容\n\n**输入：** 不可调度 Pod `p`\n\n```\nif elapsed time since last instance\
  \ launched >= provisioning_interval\n    launch new instance\n    update last instance\
  \ launch time\nelse\n    ignore scale out operation\n```\n\n############ 算法 6. 简单自动扩缩器\
  \ – 缩容\n\n```\nif all pending pods were successfully scheduled in the last cycle\n\
  \    shutdown any nodes that are empty and were autoscaled\n    nodes = getAllSchedulableNodes()\n\
  \    for each node in nodes\n        if all pods are moveable\n            if all\
  \ pods can be placed on other nodes\n                delete node\n             \
  \   let Kubernetes recreate the pods\n                let the scheduler place the\
  \ recreated pods\n        if some pods are moveable and some pods are batch jobs\n\
  \            if all moveable pods can be placed on other nodes\n               \
  \ delete all moveable pods\n                let Kubernetes recreate the pods\n \
  \               let the scheduler place the recreated pods\n                taint\
  \ the node as unschedulable\n```\n\n########### 单实例绑定自动扩缩器\n\n该启发式算法类似于单实例自动扩缩器。然而，此自动扩缩器旨在解决非绑定自动扩缩器的一个关键劣势。当不可调度\
  \ Pod 未以任何方式绑定或关联到自动扩容启动的节点时，由同一个不可调度 Pod 触发的多次自动扩容请求可能会被调用。这可能导致不必要地启动多个实例。\n\n\
  此自动扩缩器会跟踪 Pod 以及为它们启动的扩容节点。事实上，自动扩缩器会维护一个列表，记录那些可能在正在预配的节点上运行的 Pod。对于已关联到正在启动过程中节点的\
  \ Pod 发出的扩容请求将被忽略。一旦节点完成预配并加入集群，自动扩缩器会收到通知，从而取消该 Pod 与任何节点的关联。随后调度器负责在下一个周期将该 Pod\
  \ 放置在集群中可用的节点上，这很可能是新预配的节点，但这并非强制要求。如果该节点被调度器填满了其他待调度 Pod，则会为该 Pod 触发扩容请求，并重复该过程。\n\
  \n为了进一步防止不必要的节点启动，绑定自动扩缩器在决定是否启动新实例时，会考虑已预配但尚未加入集群的节点。当为不可调度 Pod 发出扩容请求时，自动扩缩器会扫描正在预配过程中的节点列表。如果这些节点中仍有空间容纳该待调度\
  \ Pod，则将该 Pod 添加到可能在该节点上运行的 Pod 列表中，并且不启动新实例。\n\n############ 算法 7. 简单绑定自动扩缩器 –\
  \ 扩容\n\n**输入：** 不可调度 Pod `p`\n\n```\nif pod has not been assigned to a provisioning\
  \ node\n    if pod can fit in one of the nodes being provisioned\n        assign\
  \ pod to provisioning node\n    else\n        launch a new node and assign the pod\
  \ to the node\nwhen new node is provisioned\n    unassign any pod associated to\
  \ the node\n    remove node from list of provisioning nodes\n    let the scheduler\
  \ place pods in the new node\n```\n\n########## 性能评估\n\n########### 测试环境与工作负载\n\n\
  \n\n\n########## 实验验证\n\n为了展示所提框架的潜在能力以及自动扩缩容的优势，我们执行了一组验证实验。我们根据表 2 的描述，对由批处理作业和长期运行服务组成的合成工作负载进行了建模。如表\
  \ 3 所示，我们使用了三种不同的工作负载，它们具有不同的作业到达间隔时间以及作业与服务的组合。为了生成这些工作负载，作业以相等的概率随机选择，它们之间的延迟从具有不同均值的指数分布中采样。对于突发型工作负载，使用了\
  \ 10 秒的均值，旨在模拟高速率到达的作业。对于缓慢型工作负载，使用了 60 秒的均值。混合型工作负载结合了突发和缓慢的作业到达率。它通过将工作负载分割为多个周期来生成，每个周期要么是突发的，要么是缓慢的。第一个周期随机选择，后续周期交替进行。每个周期中的作业数量随机选择，每个周期的最小作业数为\
  \ 10。\n\n作业实际上并不使用所请求的资源；然而，这不影响获得的结果，因为请求的目的是验证调度器的功能和性能。\n\n########### 表 2. 评估中使用的作业类型\n\
  \n| Name | Task | Memory Requests | CPU Requests |\n| --- | --- | --- | --- |\n\
  | **Batch Jobs** | | | |\n| `batch_small` | `sleep 5 min` | 0.3Gi | 100m |\n| `batch_med`\
  \ | `sleep 10 min` | 0.6Gi | 200m |\n| `batch_large` | `sleep 15 min` | 0.9Gi |\
  \ 300m |\n| **Long-running Services** | | | |\n| `service_small` | nginx server\
  \ | 1Gi | 100m |\n| `service_med` | nginx server | 1.4Gi | 200m |\n| `service_large`\
  \ | nginx server | 2.359Gi | 300m |\n\n########### 表 3. 评估中使用的工作负载\n\n| Workload\
  \ Name | Exponential Dist. Mean (sec) | Number of Batch Jobs | | | Number of Service\
  \ Jobs | | | Total Batch | Total Service | Total |\n| --- | --- | --- | --- | ---\
  \ | --- | --- | --- | --- | --- | --- |\n| | | Small | Med | Large | Small | Med\
  \ | Large | | | |\n| Bursty | 10 | 10 | 8 | 5 | 6 | 12 | 9 | 23 | 27 | 50 |\n| Slow\
  \ | 60 | 17 | 11 | 4 | 6 | 7 | 5 | 32 | 18 | 50 |\n| Mixed | 60 slow, 10 bursty\
  \ | 6 | 7 | 9 | 7 | 11 | 10 | 22 | 28 | 50 |\n\n########### 表 4. Master 和 Worker\
  \ 节点 VM 规格\n\n| VM Type | # of vCPUs | RAM | Operating System |\n| --- | --- | ---\
  \ | --- |\n| Master: `m2.medium` | 2 | 6 GB | Ubuntu 17.01 |\n| Worker: `m2.small`\
  \ | 1 | 4 GB | Ubuntu 17.01 |\n\n########### 表 5. 评估中使用的算法专用参数值\n\n| Parameter |\
  \ Value | Algorithm |\n| --- | --- | --- |\n| VM price per second | $0.011 | N/A\
  \ |\n| `max_pod_age` | 1 min | Rescheduler |\n| `provisioning_interval` | 1 min\
  \ | Autoscaler |\n\nKubernetes 集群部署在 Nectar（Nectar, n.d.）上，这是一个基于 OpenStack 的澳大利亚研究云平台。用于部署\
  \ Kubernetes Master 和 Worker 节点的 VM 规格如表 4 所示。自定义架构组件部署在 Nectar 之外的一台 MacBook Pro\
  \ 上（配置为 2.9 GHz Intel Core i7 处理器和 8 GB 内存），使用的 Kubernetes 版本为 1.10。由于 Nectar 不收取资源使用费，我们根据现有云提供商的计费模型估算每种方法的成本。具体而言，我们假设每个\
  \ Worker 的按秒计费为 $0.011，基于 Microsoft Azure 通用型 B2S 实例类型，任何部分使用均向上取整至最近的秒。虽然 Microsoft\
  \ 按分钟计费，但考虑到实验的性质和规模，我们假设按秒计费，这不会影响结果的显著性。表 5 描述了算法专用参数所使用的值。\n\n########## 结果\n\
  \n首先，我们从成本和调度时长两方面评估每种重调度和自动扩缩容启发式算法的性能。我们将调度时长定义为从提交第一个作业时刻到最后一个批处理作业完成执行时刻所经过的时间。成本根据每个\
  \ VM 被提供的时间量进行估算；即从向云提供商发出提供请求的那一刻起，直到发出取消提供请求的那一刻止。对于静态节点，成本基于工作负载的总调度时间进行估算。最后，整个实验过程中只有重调度和自动扩缩容策略发生变化，调度器（最佳适配装箱算法）保持不变。\n\
  \n图 5 展示了每种调度器/自动扩缩容器组合在三种工作负载下的成本和总调度时长。对于混合工作负载，`Non-binding Rescheduler` 和 `Binding\
  \ Autoscaler`（NBR-BAS）组合获得了最低的成本和调度时长。事实上，`Binding Autoscaler` 与任何一种重调度器结合都能带来最低成本，且在\
  \ 3 种情况中有 2 种实现了最低调度时长。这强调了拥有旨在避免不必要的扩容操作的启发式算法的重要性。`Non-binding Autoscaler` 会在\
  \ Pod 无法放置时盲目提供新实例，而 `Binding Autoscaler` 会在提供新节点之前，将正在提供中的实例视为传入 Pod 的潜在宿主。至于 `Binding`\
  \ 和 `Non-binding Rescheduler` 之间的性能差异，允许调度器放置所有待处理 Pod 似乎比在重调度器中尝试复制调度器的工作更好。\n\n\
  | Figure 5. 三种不同工作负载和六种不同算法的成本与调度时长。 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch010.f05](img/ch010.f05.png)\
  \ |\n\n突发型工作负载的成本结果与混合工作负载类似。再次，`Binding Autoscaler` 导致使用的资源数量较少，因此成本较低。然而，由于资源提供的频率较低且方式更保守，且作业到达率极高，作业可能需要等待更长时间才能被放置，从而导致更高的调度时长。对于这种特定工作负载，重调度器的存在在成本和调度时间方面似乎没有显著影响。也许重调度仅延迟了\
  \ VM 的提供，而实验规模不足以观察到这些影响。然而，在表 5 中我们展示了使用重调度器时资源的实际利用率确实有所提高，尽管由于上述原因提高幅度很小。\n\n\
  对于缓慢型工作负载，表现最好的算法组合再次是 NBR-BAS，无论是在成本还是调度时长方面。在这种情况下，该方法与 `Void Rescheduler` 和 `Binding\
  \ Autoscaler`（VR-BAS）在两个指标上的差异显著，因此可以清楚地体会到重调度作业以更好地利用资源的好处。\n\n为了进一步了解所提方法的优势，我们还将其性能与默认\
  \ Kubernetes 调度器进行了比较。我们根据每种重调度器/自动扩缩容器组合在成本和调度时长方面的表现给出一个得分，两者权重相同。我们将 Kubernetes\
  \ 调度器（K8S）与每种工作负载下得分最低（即性能最佳）的两种算法进行比较。结果如图 6 所示。K8S 的成本和调度时间是通过在 K8S 能成功放置并执行所有作业的最少静态节点数上运行每个工作负载来估算的。在重调度器/自动扩缩容器算法组合中，VR\
  \ 对应 `Void Rescheduler`，NBR 对应 `Non-binding Rescheduler`，NBAS 对应 `Non-binding Autoscaler`，BAS\
  \ 对应 `Binding Autoscaler`。\n\n\n\n\n\n########### 图 6. 不同工作负载（混合、突发和缓慢）下 k8s 调度器与表现最佳的重调度器/自动扩缩容器组合的成本与调度时长对比。\n\
  \n![Figure978-1-7998-2701-6.ch010.f06](img/ch010.f06.png)\n\n对于每种工作负载，与 Kubernetes\
  \ 调度器相关的成本均明显高于所提方法的相关成本。最大的成本降低出现在缓慢工作负载中，`NBR-BAS` 相比 Kubernetes 默认调度器实现了超过 58%\
  \ 的成本降低。关于调度时长，我们算法的性能仅略逊于 `K8S`。考虑到在成本方面获得的收益，我们认为这是一个非常合理的权衡。\n\n########### 表\
  \ 6. 每种重调度器/自动扩缩容器组合的调度性能与资源利用率。\n\n| 工作负载 | 重调度器 | 自动扩缩容器 | 中位数调度时间 (秒) | 平均内存\
  \ 请求/容量 | 平均 CPU 请求/容量 | 平均 Pod 数/节点 |\n| :--- | :--- | :--- | :--- | :--- | :---\
  \ | :--- |\n| 混合 | Void | Non-binding | 25.00 | 0.72 | 0.68 | 2.03 |\n| 混合 | Binding\
  \ | Non-binding | 37.00 | 0.73 | 0.67 | 1.99 |\n| 混合 | Non-binding | Non-binding\
  \ | 111.00 | 0.79 | 0.72 | 2.22 |\n| 混合 | Void | Binding | 49.50 | 0.81 | 0.72 |\
  \ 2.20 |\n| 混合 | Binding | Binding | 26.00 | 0.77 | 0.70 | 2.14 |\n| 混合 | Non-binding\
  \ | Binding | 112.50 | 0.80 | 0.72 | 2.23 |\n| 缓慢 | Void | Non-binding | 14.00 |\
  \ 0.79 | 0.72 | 2.41 |\n| 缓慢 | Binding | Non-binding | 11.50 | 0.78 | 0.70 | 2.33\
  \ |\n| 缓慢 | Non-binding | Non-binding | 10.00 | 0.83 | 0.74 | 2.52 |\n| 缓慢 | Void\
  \ | Binding | 12.50 | 0.82 | 0.72 | 2.44 |\n| 缓慢 | Binding | Binding | 17.50 | 0.84\
  \ | 0.74 | 2.49 |\n| 缓慢 | Non-binding | Binding | 12.50 | 0.86 | 0.76 | 2.62 |\n\
  | 突发 | Void | Non-binding | 422.50 | 0.65 | 0.69 | 2.11 |\n| 突发 | Binding | Non-binding\
  \ | 297.00 | 0.67 | 0.71 | 2.24 |\n| 突发 | Non-binding | Non-binding | 467.00 | 0.62\
  \ | 0.67 | 2.04 |\n| 突发 | Void | Binding | 418.00 | 0.70 | 0.72 | 2.28 |\n| 突发 |\
  \ Binding | Binding | 354.00 | 0.71 | 0.73 | 2.31 |\n| 突发 | Non-binding | Binding\
  \ | 388.50 | 0.73 | 0.74 | 2.36 |\n\n最后，在表 6 中，我们展示了每种方法性能的更详细洞察。特别是，我们展示了中位数调度时间，它对应于\
  \ Pod 处于 Pending 状态的中位时间。我们还展示了每个节点的平均内存请求与内存容量之比。节点的平均内存请求对应于在整个调度时长内每 20 秒采集一次测量值的平均值。这些测量值是分配给该节点的所有\
  \ Pod 的内存请求之和。节点的内存容量是指节点中所有 Pod 可请求的最大内存量。平均 CPU 请求与容量之比也在表 5 中描绘，其估算方式与内存比相同。每个节点上部署的平均\
  \ Pod 数量也已展示。\n\n中位数调度时间在缓慢工作负载和 `NBR-NBAS` 组合下最快。这符合算法的预期，因为非绑定自动扩缩容器会导致更多资源被预置，从而在作业到达时随时可用。此外，作业到达间隔时间较大意味着批处理作业可以完成，从而在新作业到达时腾出空间。缓慢与突发工作负载中位时间之间的巨大差异进一步支持了这一点。突发工作负载中的作业必须在\
  \ Pending 状态等待相当长的时间，因为资源无法足够快地预置。这主要归因于虚拟机预置延迟。\n\n关于内存利用率比，所有使用非绑定自动扩缩容器的方法表现最差。这是因为资源被过度预置，从而导致利用率不足。CPU\
  \ 比率也获得了类似的结果。在突发工作负载上，`NBR-BAS` 方法在更好的利用率方面优势明显，它获得了最高的比率和每节点平均 Pod 数。\n\n##########\
  \ 结论与未来方向\n\n在本工作中，我们提出了将调度器、自动扩缩容器和重调度器集成使用，作为使容器编排系统具备云感知能力的一种机制。其中，调度器优化容器的初始放置；自动扩缩容器使当前资源需求得到满足，并关闭利用率不足或空闲的节点，以提高系统利用率并降低成本；最后，重调度器允许在运行时修订容器的初始放置，以减少碎片并整合负载，从而促进更好的资源利用。我们开发了一个原型系统，作为\
  \ Kubernetes（一种广泛使用的开源容器管理系统）的扩展。我们提出、实现并评估了各种重调度和自动扩缩机制。总体而言，我们发现重调度和自动扩缩在最小化计算成本和提高资源效率方面具有明显优势。我们还确定并讨论了未来的研究方向。\n\
  \n有多个领域可进一步探索，以更好地优化调度器、重调度器和自动扩缩容器的决策。例如，考虑异构虚拟机可带来更高效的资源利用和更低的成本。这将支持根据不同定价模型动态预置资源到虚拟集群，以最低成本满足应用不断增长的需求。例如，面向客户的应用应放置在以较低成本长期租用且提供高可用性的预留实例上。另一方面，批处理作业可放置在不可靠的折扣资源上，其突然终止不会干扰最终用户体验。按需实例的使用可用于介于两者之间的应用，即需要可用性但非长期运行的服务。\n\
  \n实现数据感知算法是另一个值得探索的领域。这种数据感知可能指容器镜像或应用数据。将临时存储作为除内存和 CPU 之外的一种资源进行考量，也能进一步改进所提系统和方案。扩展可移动\
  \ Pod 的定义使其更加稳健，也能使框架对有更严格要求的用户更具吸引力。例如，如果某个 Pod 当前运行着多个副本，且应用能容忍其中一个副本被关闭并重启（如无状态服务或使用持久卷的应用），则可将该容器定义为可移动。\n\
  \n应用 QoS 管理是另一个值得探索的改进方向。应用具有特定的 QoS 要求，例如，长期运行的服务通常必须在单位时间内服务最少数量的请求，或有严格的延迟要求。另一方面，批处理作业可能有截止时间作为执行的时间约束，或需要尽可能快地完成。针对第一种场景，许多系统提供基本的自动扩缩机制。它监控服务的\
  \ CPU 利用率，如果超过预定义阈值，则启动另一个服务实例。然而，这是一种基线自动扩缩方法，需要将更复杂的方法集成到基于容器的管理系统中。对于批处理作业，对其进行编排并分配资源以满足其\
  \ QoS 是另一个开放的研究领域。这一功能在任何开源系统中均不存在，对异构 QoS 约束的支持仍未被探索。\n\n\n\n\n\n########## 资源消耗估算\n\
  \n资源消耗估算可用于预测和估算容器在不同时间点消耗的资源量，而不仅仅依赖于为特定容器请求的资源量。原因有二。首先，用户通常会错误估计和高估资源请求。其次，任务的资源消耗可能会随时间变化，峰值消耗仅持续其生命周期的一小部分。这两种情况都会导致资源被预留但大部分时间处于闲置状态，从而导致集群利用率不足。通过监控和估算容器的资源消耗，系统可以做出更好的超售和机会主义调度决策。在所提出的系统原型中，这可以通过利用\
  \ `Kubernetes metrics server`、一个用于存储收集到的消耗数据时间序列的 `InfluxDB`，以及专为流式数据设计的在线预测算法（如分层时序记忆（Cui,\
  \ Ahmad, & Hawkins, 2016））来实现。\n\n###### 致谢\n\n本工作由墨尔本大学与三星电子（韩国）之间的合作研究协议资助，作为三星\
  \ GRO（全球研究推广）计划的一部分。我们感谢徐敏贤对提高本章质量所提供的帮助。\n\n##### 参考文献\n\nBernstein, D. (2014).\
