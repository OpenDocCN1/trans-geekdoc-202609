  #### 第 15 章\n\n*   Chen Xin\n    奥克兰理工大学，新西兰\n\n*   Minh Nguyen\n    奥克兰理工大学，新西兰\n\
  \n*   Wei Qi Yan\n    奥克兰理工大学，新西兰\n\n##### 摘要\n\n\n\n\n##### 基于目标识别的火焰识别在智能监控中具有重要应用价值\n\
  \n本章重点关注利用深度学习进行火焰识别及其评估。为实现这一目标，作者设计了一种多火焰检测方案（`MFD`），该方案利用卷积神经网络（`CNNs`）。作者在深度学习中使用\
  \ `TensorFlow`，配合 `NVIDIA GPU` 训练图像数据集并构建了用于火焰识别的模型。本章的贡献包括：(1) 火焰识别的数据增强，(2) 深度学习的模型构建，以及\
  \ (3) 基于深度学习的火焰识别结果评估。\n\n###### 简介\n\n如今，火焰识别已成为视觉目标识别领域最热门的研究课题之一（Jiao 等，2011；Wang\
  \ 等，2018；Ren 等，2018；Wang 等，2017；Lu 等，2017；Gu 等，2017）。它在公共安全监控方面拥有无数宝贵的应用。在本章中，我们旨在开发一种计算工具，能够自动检测各类火焰，并从输入视觉数据中对火焰进行分类。可靠的识别需要一个设计良好的深度神经网络。人类视觉系统基于日常生活中的长期训练来识别物体。当视觉目标相对复杂时，我们通常根据人类经验进行推断（Yan，2017）。\n\
  \n对于目标分类，输出通常是类别标签。在真实场景中，由于各种原因，人类视觉有时甚至难以正确识别火焰（Gupta, Agrawal, Yamaguchi，2018）。如果我们使用计算机快速分类火焰，采用机器学习算法的识别率将很低，无法达到火焰识别的预期目标。\n\
  \n传统机器学习的实验结果大多基于精心准备的特定图像数据集（Jiao 等，2011）。火焰的光照/遮挡变化远小于真实场景中的变化。此外，火焰的外观或形状持续变化，同一火焰在不同视角下的图像差异巨大。因此，火焰识别的准确度远低于我们的预期（Erhan\
  \ 等，2014）。\n\n因此，在本章中，我们提出了模型：`SSD`（Liu 等，2016）。火焰检测可视为火焰识别的一个课题。我们将火焰识别任务分为两类：(1)\
  \ 火焰分类，(2) 火焰检测与定位。首先使用 `CNN` 操作从输入图像中提取特征图，这些特征图被用作深度神经网络进行分类和识别的输入。利用深度学习（LeCun\
  \ 等，2015），识别准确率将大幅提高；它能极大地增强火焰识别的鲁棒性（Erhan 等，2014）。\n\n自 LeCun 等人设计并训练了 `ConvNets`（LeCun,\
  \ Huang & Bottou，2004），该网络使用了基于误差梯度的算法（LeCun 等，1989）以来，在模式识别领域取得了卓越的性能。此外，卷积网络已被证明是有效的（Luo\
  \ 等，2017）。目前，深度学习已成功应用于各种应用，如文档分析、人脸检测、语音检测、车牌识别、数字手写识别、人体动作识别和人脸识别（Zheng 等，2018）。\n\
  \n在本章中，我们采用 `CNN` 模型创建一种新的神经网络，以深度识别火焰。此外，该方法可避免传统方法的复杂性。我们的火焰识别算法基于主要方法 `CNN` 实现。我们在\
  \ `TensorFlow` 这一基于 GPU 的平台辅助下，利用图像数据集训练模型。我们采用 `NVIDIA GTX 980M GPU` 来加速实验计算。GPU\
  \ 训练效率高得多。通过从录制视频的每一帧中裁剪火焰区域，我们收集这些图像并将其用作数据集。同时，我们人工标注了包含火焰区域的图像。\n\n本章结构安排如下。相关工作见第\
  \ 2 节，我们的方法见第 3 节。我们的结果与分析见第 4 节，结论见第 5 节。\n\n###### 相关工作\n\n火焰识别的性能主要取决于火焰分类器（Jiao\
  \ 等，2011）。因此，我们需要一种具有高准确率和低误报率的分类器。大多数基于视频的火灾检测技术致力于火焰检测，以提供早期火灾报警。传统的紫外线和红外线火灾检测存在诸多缺点。由于影响因素过多，极易产生误报或虚警。同时，火焰的位置、大小和增长率也可能判断错误。\n\
  \n针对这些问题，开发了一种通过分析流式视觉数据自动进行视频采集和火焰检测的技术。该算法基于火焰的光谱、空间和时间特征（Healey 等，1993）。1994\
  \ 年，数字图像处理被用于隧道火灾检测（Phillips 等，2000）。图像处理方法通过使用红外摄像头进行了回顾。提取了火灾发生时的交通流图；然后通过比较图像的灰度强度进行火焰检测（Healey\
  \ 等，1993）。\n\n使用 `CCD` 摄像头捕捉闪烁的火焰，并实时处理火焰的时间序列数据。该方法利用数据挖掘消除无关信息的干扰，以满足检测系统的鲁棒性要求（Yamagishi\
  \ & Yamaguchi，1999）。基于光谱的机器视觉已被应用于检测碳氢化合物火灾。由于亮度、颜色、光谱和闪烁频率是火焰的独特特征，这些特征常被用于将火焰与背景区分开来。火灾报警系统通常需要迅速对火焰进行分类，以防止火灾灾害。\n\
  \n基于用于早期火灾检测的机器视觉方法，通过计算两个连续视频图像是否超过预设阈值来考虑火焰的外观，具体而言，即两个视频帧直方图的差异与基于实时数据性能的一组统计量进行比较（Foo，2000；Healey\
  \ 等，1993）。\n\n2016 年，一种通过神经网络进行森林火灾检测的深度学习方法被提出（Shen 等，2018）。火灾检测以级联方式执行；即首先由全局分类器测试完整图像。若存在火焰，则使用细粒度分类器进行精确的火灾位置检测。火点探测器利用精心准备的数据集实现了\
  \ 90% 以上的准确率（Zhang 等，2014）。一种卷积神经网络（`CNN` 或 `ConvNet`）被提出用于识别视频中的火焰。`CNN` 在相同架构下的目标分类领域表现良好。在真实视频上测试，基于\
  \ `CNN` 的方法实现了优异的分类性能，结果极具前景（Frizzi 等，2016）。\n\n\n\n\n\n####### YOLO 目标分类方法\n\n\
  YOLO（Redmon 等，2016）是一种优秀的目标分类方法，它与其他方法（Shen 等，2018）截然不同，例如 F-FCN（Dai 等，2016）、R-CNN（Zhang\
  \ 等，2014）、Fast R-CNN（Girshick，2015）和 Faster R-CNN（Ren 等，2015）。YOLO（Redmon 等，2016；Redmon\
  \ & Farhadi，2017）（You Only Look Once，只看一次）还阐释了该方法如何利用神经网络处理数字图像。YOLO 的架构受用于图像分类的\
  \ GoogLeNet 模型启发。该网络拥有 24 个卷积层，后接 2 个全连接层。采用了 `1×1` 缩减层，随后接 `3×3` 卷积层，而非 GoogLeNet\
  \ 使用的初始模块。当输入图像进入 YOLO 的神经网络时，图像仅被分析一次，这与 R-CNN（Girshick，2015）等传统分类器不同。\n\nYOLO\
  \ 中的网络将输入图像分割成 `13×13` 的网格，每个网格将预测五个边界框。这些边界框勾勒出包围物体的矩形；这意味着，这些边界框不仅揭示是否存在物体，还描述物体属于何种类别。预测结果基于置信度得分，它向我们展示边界框包围物体的优劣程度。置信度得分反映框的形状是否良好，而非框内是什么物体。对于每个边界框，网格还会预测一个类别；它给出所有可能类别的概率分布。YOLO\
  \ 网络还表明，向预训练网络添加卷积层和连接层可以提升性能。\n\n####### R-FCN 检测器\n\nR-FCN（Dai 等，2016）是一种用于目标检测或识别的最先进检测器。它通过将卷积操作移至\
  \ RoI 层之前，并使用位置敏感特征图来评估每个类别的概率，修改了传统的 Faster R-CNN 结构（Ren 等，2015）。RoI 池化功能已被用于所有目标检测方法。它将任意大小的输入矩形区域转换为固定大小的特征。这种方法能实现更高的定位精度，并极大地提高目标检测的速度。R-FCN\
  \ 必须解决的根本问题是 Faster R-CNN 检测速度慢。其速度慢的原因在于，不同的候选区域在 RoI 层之后不共享其结构。\n\n####### 方法论\n\
  \n火焰检测可视为火焰识别的一个步骤。我们将火焰识别任务分为两部分：火焰的分类与检测。图像首先被导入以提取高层特征（Girshick 等，2014）；然后，这些特征被用作网络的输入。考虑到网络模型的大规模（Karpathy\
  \ 等，2014），火焰识别的复杂性也低于一般目标识别（Szegedy, Toshev & Erhan，2013）。\n\n对于 `n` 分类问题，我们通常设置概率向量\
  \ `p = (p[1], p[2], …, p[n])` 作为输出数据。概率 `p[i] ∈ [0, 1]` 表示输入图像属于第 `i` 个类别的概率。我们为训练样本设置标签\
  \ `q = (q[1], q[2],…,q[n])`。因此，如果一个训练样本属于第 `i` 类，则 `q[i] = 1` 且 `q[j] = 0 (i ≠ j)`。目标分类问题使用交叉熵作为损失函数。\n\
  \n对于 `p[i] ∈ [0, 1]`，`Σ^p[k=1] p[k] = 1`，我们使用 softmax 函数对来自深度神经网络（DNN）的输出 `f[loc]\
  \ = (y[1], y[2], …, y[n])` 进行归一化：\n\n![Mathtype978-1-7998-2701-6.ch015.m01](img/ch015.m01.svg)\
  \ (1)\n\n另一方面，我们使用回归方法处理火焰定位问题。我们将位置回归的输出设为 `f[loc]`，`b` 用作训练样本边界框的偏置。因此，定位问题的损失函数为：\n\
  \n![Mathtype978-1-7998-2701-6.ch015.m02](img/ch015.m02.svg) (2)\n\n在本章中，我们的工作与现有研究不同。我们的贡献在于使用数据增强进行预处理，并在我们提出的模型中调整\
  \ YOLOv3 结构。`f[loc]` 和 `b` 也适用于边界框。在框编码中，我们将编码设计为 `[x[c]/w, y[c]/h, w[b]/w, h[b]/h]`，`w`\
  \ 和 `h` 分别表示输入图像的宽度和高度，`(x[min], x[max])` 和 `(y[min], y[max])` 分别为边界框左上角和右下角的坐标。\n\
  \n我们还指示边界框中心的坐标为：\n\n![Mathtype978-1-7998-2701-6.ch015.m03](img/ch015.m03.svg) (3)\n\
  \n其中 `w[b]` 和 `h[b]` 分别表示边界框的宽度和高度，满足：\n\n![Mathtype978-1-7998-2701-6.ch015.m04](img/ch015.m04.svg)![Mathtype978-1-7998-2701-6.ch015.m05](img/ch015.m05.svg)\
  \ (4)\n\n我们选择 `L[1]` 函数作为损失函数 `l[loc]`：\n\n![Mathtype978-1-7998-2701-6.ch015.m06](img/ch015.m06.svg)\
  \ (5)\n\n其中 `α` 为一个因子。通过最小化上述损失函数，我们可以利用深度学习实现火焰识别。我们的模型主要由两类层组成：卷积层和全连接层。对于卷积层，其结构为：\n\
  \n![Mathtype978-1-7998-2701-6.ch015.m07](img/ch015.m07.svg) (6)\n\n其中 `x` 表示输入层，`y`\
  \ 代表输出层，`W` 代表卷积模板；`b` 为基础项（偏置）。在我们的模型中，`x` 的维度为 `[N, M, N, C]`。`N` 是训练时的批次大小，即仅在一步训练中的输入样本数量。`M×N`\
  \ 表示输入特征的尺寸，`C` 表示输入特征的数量。卷积模板 `W` 的维度为 `[m, n, C, D]`，`m×n` 指卷积模板的尺寸，`C` 是输入特征数，`D`\
  \ 是输出特征数。此外，`δ (•)` 为激活函数。经过卷积处理后，输出 `y` 的维度变为 `[N, M, N, D]`。\n\n关于激活函数，也有许多选择，如\
  \ Sigmoid、ReLU 和 Leaky ReLU。我们对比这些函数并选择最合适的一个。在这些函数中，Sigmoid 是最早的激活函数。然而，容易出现梯度消失问题，导致模型难以训练。ReLU\
  \ 函数解决了梯度消失问题，我们选择 Leaky ReLU 作为新的激活函数。\n\n卷积层之后通常接最大池化层。在每次池化中，其尺寸为 `m×n`，输出数据为该池化操作中的最大值。如果输入数据特征的尺寸为\
  \ `[N, M, N, C]`，则输出数据的尺寸将变为 `[N, ⌊M/m⌋, ⌊N/n⌋, C]`。\n\n此外，为避免过拟合问题，我们可以添加 dropout\
  \ 层，使得仅有一部分节点参与训练。基于此结构，我们构建了如表 1 所示的模型。\n\n输入图像进入 `input[process]` 层，该层将像素强度从 `[0,\
  \ 255]` 归一化为 `[-1, 1]` 范围内的浮点数。在 CNN 训练中，训练样本的框将在此层同时进行编码。CNN 中共有六层；这些层从原始图像中提取高层特征。结构展开如图\
  \ 1 所示。\n\n\n\n\n\n####### 实验结果\n\n经过六层 CNN 后，紧接着一个名为 `flatten[dropout]` 的层。我们展开\
  \ CNN 的输出并添加 dropout 操作以克服过拟合问题。然后，`flatten[dropout]` 的结果将被导入 `cls[output]` 和 `loc[output]`\
  \ 层进行火焰分类和定位。`cls[output]` 和 `loc[output]` 都等同于一个两层 MLP，由两个子层组成。我们在输出层使用非线性激活函数。`predict`\
  \ 层通过处理 `cls[output]` 和 `loc[output]` 层的输出给出最终输出，最终输出呈现为 `[classID, conf, x[min],\
  \ x[max], y[min], y[max]]`，其中 `classID` 代表对象所属类别的标签，`conf` 指属于该类别的概率。输出的其余部分 `[x[min],\
  \ x[max], y[min], y[max]]` 是边界框的坐标。\n\n| Figure 1. The architecture of our proposed\
  \ model |\n| --- |\n| ![Figure978-1-7998-2701-6.ch015.f01](img/ch015.f01.png) |\n\
  \nTable 1. The structure of our proposed neural network\n\n| ![Figure978-1-7998-2701-6.ch015.g01](img/ch015.g01.png)\
  \ |\n\n分类是我们实验中最关键的步骤，直接影响火焰识别的结果。在本章中，我们研究了六类火焰，包括营火、蜡烛火、燃气火、喷枪火、燃气罐火和酒精壁炉火，如 Figure\
  \ 2 所示。当火焰出现在我们的摄像头前时，我们的模型将自动检测区域并识别这五类火焰之一。我们将火焰限制在带有火焰类别名称的边界框内，并使用分类准确率。卷积神经网络有一种独特的方式将视频帧的颜色层转换为数字矩阵。CNN\
  \ 模型的结果与使用颜色模型的结果一样好，边界框定位的准确率相当高。这些图片中显示的、与火焰具有非常相似颜色和纹理的背景，并未出现在我们检测到的边界框中。我们用六组实验的结果展示了最高准确率（98.6%）。\n\
  \n在运行神经网络之前，我们不需要从图像中提取特征。因此，与使用机器学习的传统目标识别相比，CNN 具有显著的性能优势。我们看到火焰几乎位于边界框的中心。不同燃烧材料的火焰都位于边界框内，除了蜡烛火焰的结果。幸运的是，从\
  \ Figure 2 所示的最后一张图像中，我们发现 CNN 并未将墙上蜡烛火焰的反射识别为有意义的情况。\n\n关于火焰检测的定位问题，我们将其视为一般回归问题。定位损失函数中的预测位置\
  \ `f[loc]` 和期望位置 `b` 也适用于边界框。因此，我们为模型尝试了 Table 3 所示的四组参数，其中 `MFD2` 等同于 `MFD1` 的线性变换，区别在于\
  \ `MFD2` 将值归一化到区间 `[0, 1]` 内。`MFD3` 和 `MFD4` 旨在改善模型对小目标的定位结果。因为 `MFD1` 和 `MFD2`\
  \ 基于定位误差的绝对测量，所以大目标和小目标之间的偏差被同等对待。例如，10 像素的偏差对于大目标可能很小，但对于小目标却可能相当大。\n\nTable 2.\
  \ Comparisons of multiple models for flame recognition(%)\n\n| ![Figure978-1-7998-2701-6.ch015.g02](img/ch015.g02.png)\
  \ |\n\n在这些模型上使用相同数据集测试后，我们获得了 Table 2 中的结果。我们看到，在这些结果中，我们的 `MFD 1` 在总体准确率方面表现最好。因为我们的测试基于\
  \ NVIDIA GTX 950M GPU 进行，且 `MFD 1` 表现良好，我们使用 CPU 进行了相同的训练。我们结果的准确率为 93.5%，这也表明性能非常好；但\
  \ CPU 上使用的时间几乎是 GPU 的两倍；因此，GPU 显著减少了我们实验的训练时间。\n\n| Figure 2a. Motion pictures for\
  \ single flame detection: Kindle fire detection |\n| --- |\n| ![Figure978-1-7998-2701-6.ch015.f02a](img/ch015.f02a.png)\
  \ |\n\n| Figure 2b. Motion pictures for single flame detection: Camp fire detection\
  \ |\n| --- |\n| ![Figure978-1-7998-2701-6.ch015.f02b](img/ch015.f02b.png) |\n\n\
  | Figure 3. Motion pictures for multiple flames detection |\n| --- |\n| ![Figure978-1-7998-2701-6.ch015.f03](img/ch015.f03.png)\
  \ |\n\n`YOLO` 和 `R-FCN` 在训练结果上分别达到了 93.1% 和 95.4% 的准确率，尽管它们没有超过我们设计的 `MFD 1` 模型。关于耗时，我们从\
  \ Table 2 看到，使用相同的硬件和数据集训练模型，`YOLO` 仅花费 20 小时，是所有模型中最快的。从单个火焰类型的角度来看，基于 `MFD 1`，识别营火、燃气灶火和燃气罐火的准确率最高；蜡烛火在\
  \ `MFD 2` 上表现最好。同时，`R-FCN` 在喷枪火焰和酒精火焰的识别上具有最佳性能。\n\nTable 3. Four groups of parameters\
  \ for the proposed MFD models\n\n| ![Figure978-1-7998-2701-6.ch015.g03](img/ch015.g03.png)\
  \ |\n\n总的来说，`MFD 1` 模型在我们的火焰识别中表现最好。卓越的准确率不仅体现在识别上，也体现在定位上，无论目标大小。在我们的比较中，`YOLO`\
  \ 对小目标表现不佳，因为它在一个网格中预测两个框且只归属一类。由于损失函数的选择，定位误差是影响检测效率的主要原因，特别是在处理过大或过小目标时。由于结构复杂，`R-FCN`\
  \ 在火焰识别方面表现优于 `YOLO`。\n\n####### 结论\n\n在本章中，我们使用深度学习中的卷积神经网络训练了一个有价值的模型，用于自动识别和检测火焰的发生。基于我们自己的数据集，介绍并考察了卷积神经网络的各种要素和相关关键功能。\n\
  \n在实验中，我们设计了一个相对简化的神经网络来实现火焰识别的目标。我们收集了六种类型的火焰来扩充数据集。最终，我们获得了 96% 的平均准确率。此外，我们检测了火焰区域并评估了相应的准确率。我们发现，当火焰占据视频帧的很大一部分时，识别准确率将显著提高。\n\
  \n未来，我们将致力于多火焰的检测和识别。此外，森林火灾、建筑火灾等更复杂的火焰将被加入项目。由于真实场景中复杂多变的环境，将会有更多不可控因素可能影响我们的火焰识别。未来，视频源的动态特性（如白炽灯、荧光灯等）将被纳入考虑。\n\
