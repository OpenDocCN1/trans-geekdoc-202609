  胡志明市国家大学信息技术大学 (VNU-HCM)，越南\n\n**Trung Hong Phan**  \n胡志明市国家大学信息技术大学 (VNU-HCM)，越南\n\
  \n##### 摘要\n\n在本章中，使用 `Image2vec` 或 `Video2vector` 将大型多媒体数据库中的图像和视频片段转换为向量。`M-tree`\
  \ 是一种索引结构，可用于高效解决复杂对象上的相似性查询。在从对象中提取了相关特征的前提下，`M-tree` 可有效地用于多媒体数据库上的基于内容的检索。在大型多媒体数据库中，为了搜索相似性，如\
  \ `k-NN` 查询和 `Range` 查询，需要计算查询对象到所有其余对象（图像或视频片段）的距离。在大型多媒体数据库中，查询与实体之间的计算是不可行的。本章提出了一种解决方案，将\
  \ `M-Tree` 结构分布在 `Apache Spark` 框架上，以解决包含大量图像和视频片段的大型多媒体数据库中的 `Range Query` 和 `kNN\
  \ Query` 问题。\n\n##### 绪论\n\n多媒体数据库包含图像和视频片段（Guo, 2013; Riaz, Ashraf, & Aslam, 2014）。如今，多媒体数据库的容量包含海量对象。在此我们使用\
  \ `Image2vec` (Garcia-Gasulla, Béjar, Cortés, Ayguadé, & Labarta, 2015) 或 `Video2vec`\
  \ (Hu, Li, & Li, 2016) 将图像和视频转换为向量，并存储这些向量以便于处理。为了在向量空间中（代表图像和视频片段）搜索相似性，如 `kNN`\
  \ 查询和 `Range` 查询，我们需要计算查询向量到所有其余向量的距离。在大型多媒体数据库中，向量空间包含数百万到数十亿个向量。上述距离计算是不可行的。因此，我们需要一种方法来减少这些问题中的距离计算次数。`M-Tree`\
  \ 结构是一种基于距离的向量空间索引方法，可以有效地解决 `Range` 查询和 `kNN` 查询（Ciaccia, Patella, & Zezula, 1997;\
  \ Kouahla, 2011）。由于 `M-Tree` 结构是在本地系统上实现的，它只能解决小型向量空间中的问题，其中向量集可以放入一台计算机中。然而，包含数百万图像或视频片段向量的超大型多媒体数据库非常普遍。本地\
  \ `M-Tree` 结构无法满足在大型向量空间中解决相似性搜索问题的新需求，在这些空间中，向量必须分布式地存储在多台计算机上。因此，在本文中，我们提出了一种将\
  \ `M-Tree` 结构分布在 `Apache Spark` 框架上（Assefi, Behravesh, Liu, & Tafti, 2018; Shanahan\
  \ & Dai, 2019; Zecevic & Bonaci, 2017）的解决方案，以解决大型向量空间中的 `kNN` 和 `Range Query` 问题。此外，我们还展示了基于不同规模的\
  \ 64 维向量集创建本地和分布式 `M-Tree` 结构的实验结果。最后，我们展示了在图像和视频片段多媒体数据库的已构建 `M-Tree` 结构上进行 `kNN`\
  \ 和 `Range` 查询的实验结果。\n\n本文的主要贡献如下：\n\n*   使用 `Image2vec` 和 `Video2vec` 将多媒体对象（图像和视频片段）转换为向量。\n\
  *   提出一种分布式 `M-Tree` 结构解决方案，以满足大数据时代的新需求。\n*   基于分布式 `M-Tree` 结构解决 `kNN` 和 `Range\
  \ Query` 问题。\n*   提供相关的实验结果。\n\n本文其余部分组织如下。第 2 节是相关工作。第 3 节介绍本文使用的知识库。第 4 节是方法论。第\
  \ 5 节是实验。最后是结论与未来工作。\n\n###### 相关工作\n\n\n\n\n\n######## 相关工作综述\n\n始于一篇提出 M-Tree\
  \ 结构作为有效相似性搜索方法的论文（Ciaccia et al., 1997），随后出现了许多实现和开发 M-Tree 结构以及开发类似索引结构的工作。\n\n\
  2010 年，Akrivi Vlachou 提出了一个分布式相似性搜索框架，其中每个参与节点存储自己的数据，并使用 M-Tree 结构在本地建立索引。为了搜索的可扩展性和效率，他们采用了超级节点架构，超级节点负责查询路由。他们还提出了构建适用于度量空间中分布式相似性搜索的度量路由索引（Vlachou,\
  \ Doulkeridis, & Kotidis, 2010）。\n\n2011 年，Z. Kouahla 研究了一种用于索引和查询数据的度量树数据结构变体，并进行了实验将其解决方案与\
  \ MM-Tree 和 SliM-Tree 技术进行比较。作者还提供了度量空间中索引技术的分类法，如图 1 所示（Kouahla, 2011）。\n\n最近，在\
  \ 2019 年 2 月，Jörg Peter Bachmann 提出了 SuperM-Tree 结构作为 M-Tree 结构的扩展（Bachmann, 2019）。该作者引入了度量子集空间作为度量空间的广义概念。各种度量距离函数可以扩展为度量子集距离函数。\n\
  \n上述大多数工作未提及大型向量空间（其中数据分布式存储在计算机集群中），Akrivi Vlachou 的工作除外。然而，该作者提出了一个新的分布式相似性搜索框架。在此，我们不构建新框架，而是使用著名的\
  \ `Apache Spark` 框架来分发 M-Tree 结构，以解决相似性搜索问题。\n\n| Figure 1. A simplified taxonomy\
  \ of indexing techniques in metric spaces |\n| --- |\n| ![Figure978-1-7998-2701-6.ch007.f01](img/ch007.f01.png)\
  \ |\n| --- |\n\n###### 大数据时代的向量表示\n\n在大数据时代，词表示已被用于多个研究领域。著名模型是 Mikolov 开发的 `word2vec`\
  \ 模型（Mikolov, Chen, Corrado, & Dean, 2013）。基于该模型，我们有 `graph2vec`、`node2vec`、`topic2vec`\
  \ 等模型（Cai, Zheng, & Chang, 2018）。通常，这些模型使用预训练模型将对象（词、图节点、文档主题）转换为向量（Cai et al.,\
  \ 2018; Mikolov et al., 2013; H. Cai V. W., 2018）。许多作者开发了类似模型将图像转换为向量，这些模统称为 `Image2vec`（Garcia-Gasulla,\
  \ 2016）。此外，还有 `Video2vec` 模型（Hu et al., 2016），可将视频片段转换为向量。本文不深入讨论 `Image2vec` 或\
  \ `Video2vec`，仅使用此类模型生成图像或视频片段的向量，然后将这些向量输入我们提出的 `DM-Tree` 模型。\n\n###### 预备知识\n\n\
  ####### 图像转向量\n\n本节讨论如何将图像或视频片段转换为向量。向量空间词表示包含语言学规律，支持基于向量算术的语义操作。在语言学研究中，我们使用 `Word2vec`\
  \ 或 `Glove2vec` 等预训练模型将词转换为向量（Mikolov et al., 2013）。同样，本文使用相同方法获取大型稀疏向量。作者使用 `CNN`\
  \ 为每张图像构建向量。他们使用 `Caffe` 深度学习框架中可用的 `GoogLeNet` 预训练模型，该模型使用 120 万张图像训练而成，用于创建图像向量（Garcia-Gasulla\
  \ et al., 2015）。此外，我们也可将视频片段转换为向量。该模型使用循环神经网络（`RNN`）学习视频的时间结构，并嵌入语义含义以形成固定长度的向量表示，称为\
  \ `Video2vec`（Hu et al., 2016）。\n\n####### 度量空间与欧氏距离\n\n在数学中，度量空间是一个集合及其上的度量。度量是定义集合中任意两个成员（通常称为点）之间距离概念的函数（Ciaccia\
  \ et al., 1997; Kouahla, 2011）。度量满足以下性质：\n\n*   点到自身的距离为零。\n*   两个不同点之间的距离为正。\n\
  *   从 x 到 y 的距离等于从 y 到 x 的距离。\n*   从 x 到 y 的直接距离小于或等于经任意第三点 z 到达的距离。\n\n以下是度量空间的形式化定义。\n\
  \n**定义 1：度量空间**\n\n给定 `X` 为非空集合。映射 `d: X × X → R` 若对任意 `x, y, z ∈ X` 满足：\n\n*  \
  \ `d(x, y) = d(y, x)`（对称性）\n*   `d(x, y) ≥ 0`（非负性）\n*   `d(x, z) ≤ d(x, y) + d(y,\
  \ z)`（三角不等式）\n\n则 `d` 称为 `X` 上的距离或度量，有序对 `(X, d)` 称为度量空间。\n\n例如，定义映射 `d: R^n × R^n\
  \ → R`，对任意 `x = (x_1, ..., x_n)` 和 `y = (y_1, ..., y_n)`，有 `d(x, y) = Σ|x_i - y_i|`。易证\
  \ `d` 满足定义 1，故 `d` 是 `R^n` 上的度量，`(R^n, d)` 是度量空间。`d` 称为曼哈顿距离。\n\n度量空间 `(X, d)` 常简写为\
  \ `X`，当 `d` 从上下文隐含且不引起混淆时。常见距离有曼哈顿距离、切比雪夫距离、欧氏距离等，本文仅介绍欧氏距离。\n\n**定义 2：欧氏距离**\n\n\
  在 `R^n` 中，点（或向量）`x` 和 `y` 之间的欧氏距离或欧氏度量是连接它们的线段长度，由勾股公式给出：\n\n`d(x, y) = √(Σ(x_i\
  \ - y_i)²)`\n\n例如，在 `R²` 中，给定 `x = (x_1, x_2)` 和 `y = (y_1, y_2)`，则\n\n`d(x, y)\
  \ = √((x_1 - y_1)² + (x_2 - y_2)²)`\n\n####### 相似性查询\n\n有两种重要的相似性查询类型：范围查询和 k 最近邻（`kNN`）查询。范围查询用于在度量空间中查找与查询对象距离小于或等于给定半径的对象。k\
  \ 最近邻查询用于在度量空间中查找最接近查询对象的 k 个对象。定义如下（Ciaccia et al., 1997）。\n\n**定义 3：范围查询**\n\n\
  给定度量空间 `M = (X, d)`、查询对象 `Q ∈ X` 和最大搜索距离 `r ≥ 0`。范围查询 `Range(Q, r)` 选择所有满足 `d(O,\
  \ Q) ≤ r` 的对象 `O ∈ X`。\n\n**定义 4：K 最近邻查询**\n\n给定度量空间 `M = (X, d)`、查询对象 `Q ∈ X` 和整数\
  \ `k ≥ 1`。`kNN` 查询 `kNN(Q, k)` 选择 `X` 中距离 `Q` 最近的 k 个对象。\n\n\n\n\n####### M-Tree\n\
  \nM-Tree 是一种用于索引度量空间的方法。从结构上看，M-Tree 是一棵平衡树，能够处理动态数据文件，因此不需要定期重建。它根据特定距离函数测量的相对距离对对象进行划分，并将这些对象存储到固定大小的节点中，这些节点对应于度量空间的区域。\n\
  \nM-Tree 的一个节点最多可存储 `M` 个条目，其中 `M` 是节点的容量。内部节点存储路由对象的条目，而叶子节点存储所有被索引对象的条目。每个路由对象\
