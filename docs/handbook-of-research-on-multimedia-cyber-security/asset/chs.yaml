  \ |\n\n###### 性能指标\n\n本文考虑的性能指标为均方误差 (MSE)（Romi Singh, Shipra Sharma & Shikha Singh,\
  \ 2014）和峰值信噪比。两幅图像间的 MSE 计算公式为：\n\n![Mathtype978-1-7998-2701-6.ch012.m06](img/ch012.m06.svg)\n\
  \n峰值信噪比 (PSNR) 由下式给出：\n\n![Mathtype978-1-7998-2701-6.ch012.m07](img/ch012.m07.svg)\n\
  \n已获得结果以寻找 BCH 编码器参数 (n, k, t) 的最优值。所有结果均基于置换数组为 `[2 0 1 3 4]` 的假设获得。\n\n#######\
  \ 表 1. 不同 BCH 编码块 (n,k,t) 的 MSE 和 PSNR 值\n\n| 序号 | BCH (n, k, t) | BCH 编码比特数 | 字数\
  \ | MSE | PSNR |\n| --- | --- | --- | --- | --- | --- |\n| 1 | (7,4,1) | 875000\
  \ | 437500 | 3.7412 | 42.4006 |\n| 2 | (15,11,1) | 681810 | 340905 | 4.4806 | 41.617\
  \ |\n| 3 | (15,7,2) | 1071420 | 535710 | 4.1003 | 42.0027 |\n| 4 | (15,5,3) | 1500000\
  \ | 750000 | 3.7412 | 42.4006 |\n\n\n\n\n\n| 5 || (31,26,1) || 596130 || 298065\
  \ || 5.0051 || 41.13 |\n| 6 || (31,16,3) || 968750 || 484375 || 3.7412 || 42.4006\
  \ |\n| 7 || (63,51,2) || 617589 || 308795 || 6.3971 || 40.0710 |\n| 8 || (63,36,5)\
  \ || 874944 || 437472 || 5.6426 || 40.6160 |\n\n从表 1 的结果可以看出，编码器 `(n, k, t)` 取值为\
  \ `(7, 4, 1)`、`(15, 5, 3)` 和 `(63,51, 2)` 时可获得最大 PSNR。此处通过同时考虑编码位数的权衡来寻找最优值。编码位数越少，符号数越少，因此跨信道传输所需的子载波数也越少。通过观察上述结果表可知，采用参数\
  \ `(7, 4, 1)` 进行编码，可获得 42.4006 的最大 PSNR 值。因此，为进一步测试以寻找置换数组，`(n, k, t)` 值固定为 `(7,\
  \ 4, 1)`。表 2 给出了通过改变置换数组获得的 MSE 和 PSNR 值。\n\n####### 表 2. 不同置换数组的 MSE 和 PSNR\n\n\
  | 级别 || 置换数组 || MSE || PSNR |\n| --- | --- | --- | --- |\n| 1. || `[2 0 1]` || 4.1003\
  \ || 42.0037 |\n| --- | --- | --- | --- |\n| 2. || `[2 0 1 3 4]` || 3.7412 || 42.4006\
  \ |\n| 3. || `[3 0 5 2 4 1]` || 4.1003 || 42.0027 |\n| 4. || `[6 0 5 2 4 1 3]` ||\
  \ 4.0516 || 42.0545 |\n| 5. || `[6 0 5 2 7 1 3 4 ]` || 3.3712 || 42.4006 |\n| 6.\
  \ || `[6 0 8 2 7 1 3 4 5]` || 4.7078 || 41.4026 |\n| 7. || `[6 9 10 2 7 1 3 4 5\
  \ 0 8]` || 4.9396 || 41.1939 |\n\n分析表 2 可知，置换数组 `[2 0 1 3 4]` 给出了最大 PSNR 值，因此这些\
  \ `(n, k, t)` 参数值和置换数组可固定下来，配合通用软件无线电外设 (`USRP-2920`) 硬件组件一起使用。\n\n####### 结论\n\n\
  本工作专注于使用 LabVIEW 工具开发基于 OFDM 的收发器，并利用 OFDM 收发器传输数据。借助 USRP 实现了这一点，因为它是无线系统公认的通用原型。为克服信道噪声，采用了\
  \ BCH 编码方案。为确保数据安全，数据与 Hadamard 矩阵进行异或运算。这为传输数据提供了低级别的保护。该工作可通过用强加密算法替换 Hadamard\
  \ 矩阵来扩展。这以复杂度增加为代价确保了高级别的保护。\n\n###### 致谢\n\n作者谨向 SASTRA 视同大学表示衷心感谢，感谢其提供的 R&M 基金资助\
