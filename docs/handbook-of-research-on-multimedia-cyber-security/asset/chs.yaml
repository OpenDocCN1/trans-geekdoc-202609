  ##### 摘要\n\n\n\n\n\n###### 简介\n\n在全球互联网使用中，网络上不断增加的多媒体消息（包括视频、音频、图像和文本文档）引发了许多与版权相关的问题。为了版权保护、认证目的以及伪造检测，数字水印是社交网络内容保护的稳健方式。在这项技术中，私有信息被嵌入到图像和视频等多媒体内容内部。嵌入在多媒体内容内部的受保护内容称为水印启用信息。为了使水印过程更有效，内容在嵌入图像前会先进行加密。基本上，数字水印嵌入过程是在空域和频域这两个不同域中实现的。在空域数字水印中，根据所选的位平面和图像的像素，水印信息被嵌入到原始图像的最低有效位中；并执行嵌入和检测操作。\n\
  \n\n\n\n\n###### 数字水印技术综述\n\n####### 1. 社交媒体背景与虚假信息传播\n\n自 1990 年代中期以来，社交媒体视角下人际沟通模式发生了变化。Facebook、Twitter、Instagram\
  \ 和 WhatsApp 等多个在线社交网络（OSN）使得用户的实时信息能够在同一网络或不同网络的多个用户之间轻松分发。由于在线社交网络具有易用性、传播速度快、成本低等特点，它已成为重要的沟通和信息共享方式。如今，几乎所有社交网络用户都通过在线渠道获取新闻\
  \ (Zhang et al., 2017)。然而，随着 OSN 的日益流行，互联网使用已成为传播虚假新闻的理想途径。虚假新闻以误导性内容、虚假评论、虚假谣言、广告、政治虚假言论、讽刺等形式，通过图像在社交媒体中传播速度比主流媒体更快\
  \ (Sahoo & Gupta, 2020; Sahoo & Gupta, 2018)。\n\n####### 2. 数字水印概述\n\n为了保护图像、视频、文本和音频等多媒体内容免受攻击者侵害，数字水印是将特定信息以数字方式隐藏并嵌入到该内容中的过程\
  \ (Sahoo & Gupta, 2019)。这是保护多媒体内容用户/作者权利、并查明内容是否被网络中未授权用户滥用/篡改的有效方法 (Balan et al.,\
  \ 2017; Zedan et al., 2017; Sahoo & Gupta, 2019)。\n\n数字水印在一定程度上与隐写术相关。在该技术中，我们将文本消息隐藏在任何可用的多媒体内容背后。数字水印过程用于认证多媒体内容所有者或作者的身份。早期，不同领域使用水印技术保护相似性，即水印最初用于纸张，随后用于纸币\
  \ (Singh et al., 2012)。\n\n近年来，由于社交网络及其音频、视频、图像等内容以及其他个人和专业内容共享方式的推动，互联网普及率迅速扩大。因此，为恶意目的复制原始内容并篡改主题的现象日益增加，影响了普通用户。因此，为防止未授权访问保护多媒体内容，数字水印是最有力的方式\
  \ (Abraham et al., 2016)。\n\n在数字水印中，原始多媒体内容通过信号或数据嵌入 (Li et al., 2019; Li et al.,\
  \ 2018; Gupta et al., 2015)。同一原理也用于嵌入音频、视频和图像 (Ansari et al., 2012)。嵌入在原始多媒体内容中的信息称为水印内容，可通过特定的预定义应用程序和算法提取和删除。水印内容可以是图像、音频、文本等形式。根据数字信号存在于原始信息或内容的每一个未改动副本中，它充当所有副本的数字签名\
  \ (Verma et al., 2006)。\n\n嵌入数字水印的原始多媒体内容应具有持久性、鲁棒性、不可感知性，并包含多媒体内容所有权的所有信息。为实现最大保护，水印应具备以下属性：\n\
  \n1. 必须受到保护，且黑客和攻击者无法删除；\n2. 统计分析时应不可检测，即加密水印；\n3. 应能容忍有损等压缩技术；\n4. 应能容忍对该内容执行的各种不同操作；\n\
  5. 必须在感知上不可见。\n\n####### 3. 水印技术分类\n\n水印过程分为两大类：空域水印和频域水印 (Patel et al., 2013)。\n\
  \n######## 3.1 空域水印\n\n在空域水印技术中，基于图像的像素进行嵌入和检测。空域水印方法是一种通过修改原始图像的像素值来嵌入水印信息的技术。该技术实现简单，但对压缩、裁剪等不同类型的攻击不够鲁棒\
  \ (Cheng et al., 2004)。\n\n为防止不同攻击，水印在嵌入原始图像前会用伪随机噪声加密。加密水印根据水印像素的 LSB（最低有效位）是置位还是复位，嵌入原始图像的最低有效位中。水印嵌入原始图像后，水印图像的\
  \ LSB 发生变化，原始图像会产生轻微失真 (Zeki et al., 2011)。此处逐像素处理水印，根据水印图像的 LSB 设置或复位原始图像的 LSB。若水印位置位，则原始图像\
  \ LSB 置位；若水印位复位，则原始图像 LSB 复位。该技术的局限性在于水印未加密，若攻击者知晓加解密算法，极易遭受攻击 (Singh et al., 2012)。\n\
  \n将水印分解为 RGB 通道，并将加密水印按 8x8 块嵌入原始图像分块中，但用于水印的水印本身未分区 (Zeimpekis et al., 2006)。该技术对椒盐噪声和裁剪攻击提供鲁棒性，但不抗压缩攻击及其他攻击，且\
  \ PSNR 和 MSE 值不如拟议技术理想。该方法实现简单直接。无法抵抗 JPEG 压缩和低通滤波攻击。编解码所需计算时间较少。图像像素信息因根据水印图像操作而产生少量失真\
  \ (Dougherty et al., 2009)。\n\n######## 3.2 频域水印\n\n另一方面，频域技术基于图像的频率表示工作。常用变换包括离散余弦变换（DCT）、奇异值分解（SVD）、快速傅里叶变换（FFT）和时效离散小波变换（DWT）。与空域技术相比，频域水印技术更鲁棒。基于可见性，数字水印分为可见和不可见两类。Bianchi\
  \ et al. (2013) 描述了一种基于带加密水印的空域水印技术的不可见水印技术。\n\nDWT 相比包含 DFT 和 DCT 在内的其他变换方法，计算效率更高\
  \ (Lowe et al., 2004)。相比之下，由于信息分散在整个图像上，频域数字水印比空域数字水印更安全、更鲁棒 (Almomani et al., 2013;\
  \ Jiang et al., 2018)。由于鲁棒性要求，图像的高频部分不应用于水印嵌入过程。\n\n在 DWT 中，图像的数字水印在频域生成。它以不同小波的形式表示整幅图像。小波由具有特定频率和确定持续时间的小波组成。在此过程中，选定图像沿\
  \ X 和 Y 坐标平面用高通和低通滤波器进行滤波。该方法将整幅图像分为四个不同的子带：LL、LH、HL 和 HH。其中，LL 包含最低频率分量，HH 包含最高频率分量。进一步将低频带\
  \ LL 划分为四个区域，并持续至第 3 级。为增强水印鲁棒性，DWT 增加了第 2 级和第 3 级。该技术将整幅图像分为表 1 所示的四个不同子带。\n\n\n\
  \n\n\n######## 表 1. 图像的 DWT 分解模型\n\n| (HL)[3] | | (LH)[3] | | (LH)[2] | | (LH)[1]\
  \ |\n| --- | --- | --- | --- | --- | --- | --- |\n| (HL)[3] | | (HH)[3] | | | |\n\
  | (HL)[2] | | (HH)[2] | | | |\n| (HL)[1] | | (HH)[1] | | | |\n\n图像的每一部分即子带都包含关于原始图像的一些信息。其中，`(LL)[1]`\
  \ 频带包含图像的最大信息量[7]。对于图像变换，基于 DWT 的水印技术使用各种滤波器，如 Haar 小波滤波器、Morlet 小波、Coiflets 小波、Meyer\
  \ 小波等。互联网上可用的视频内容也需要类似的机制，且与其他内容相比，用户对视频内容的关注度更高。视频由大量帧组合在一起，产生某种错觉并以高速播放。因此，为了使用数字水印保护视频内容，整个视频被分割成各种帧；即对于\
  \ 25 fps，视频中每秒将有 25 帧。分割成帧后，该技术被应用于一帧或多帧以保护数字内容。选定的图像首先利用低通和高通滤波器以及两个坐标 X 和 Y，根据其频率分量分解为若干子带\
  \ (Kang et al., 2003)。成功地将水印应用于视频的某些部分后，我们将所有帧组合成单个视频作为含水印视频 (Gupta, 2018; Zhang\
  \ et al., 2018; Chaudhary et al., 2016)。本文其余部分组织如下。第 2 节描述基于可用内容的各种数字水印类型。第 3 节描述与数字水印原理相关的文献综述。此外，我们在第\
  \ 4 节和第 5 节中描述各域中的水印嵌入过程。第 6 节描述与水印相关的鲁棒性和各种抗攻击性。第 7 节描述信息流和处理过程。最后，我们在第 8 节通过比较分析描述各种结果分析，并在第\
  \ 9 节总结整个执行过程的总体情况。\n\n######## 基于可用内容的水印类型\n\n根据用途和内容保护，水印原理实现于各种多媒体内容中，如图像水印、视频水印、音频水印和文本水印。在图像水印中，数字水印内容被嵌入图像中，以便在必要时检测和提取原始内容以确立所有者的所有权\
  \ (Ruanidh et al., 1996)。此外，图像水印原理可通过下文描述的多种方式实现。\n\n*   **可见水印**：在此类水印原理中，徽标或符号在图像上可见。电视频道和通过横幅展示的产品广告使用此水印原理。\n\
  *   **不可见水印**：它用于确定所有权以及防止用户未经授权访问图像。在此过程中，水印被嵌入图像内部，但该水印对其他用户不可见。\n*   **鲁棒水印**：鲁棒水印原理用于为任何数字作品签署版权信息。它保护内容免受未经授权的访问，并能抵抗常见的编辑处理。\n\
  *   **脆弱水印**：脆弱水印是用于完整性问题的最敏感水印原理之一，对信号变化极其敏感。它保护内容免遭篡改。\n*   **半脆弱水印**：半脆弱水印类似于脆弱水印，但能容忍含水印图像一定程度的变化。在此方法中，攻击者可以改变图像的某些部分，例如向原始图像添加量化噪声。\n\
  *   **不可见鲁棒水印**：不可见鲁棒水印通过图像的像素值实现。在此过程中，水印的检测极难识别，只能通过解码过程恢复。\n*   **不可见脆弱水印**：这是一个结合了脆弱水印与不可见概念的过程。由于其不可见的性质，它不会被任何用户或威胁篡改。\n\
  \n另一方面，在视频水印中，水印基于视频内容可用的特征进行。在此水印原理中，总帧根据特征供给情况被分割成若干帧用于嵌入。它是图片水印的详细阐述。在音频水印方面，由于网络音乐、MP3\
  \ 和其他一些声音格式，先进的水印技术占主导地位 (Xianglin et al., 2006)。最常用的称为文本水印的原理，使用 PDF、.doc 文件及社交结构上可用的其他文档的先进水印技术。用于唯一标识的信息也随文档内容一同添加。\n\
  \n######## 数字水印的应用覆盖\n\n基于社交网络中可用内容的各种水印相关应用及其用于抵御 OSN 中攻击者的各种威胁描述如下：\n\n为了保护通过各种电视频道广播的内容，该内容的所有者将版权图像嵌入多媒体内容中。水印仅嵌入某一特定图像而非所有可用内容，以维持网络或媒体中的质量\
  \ (Hamadi et al., 2015)。另一个应用称为数字水印中的事务追踪。例如，各种水印被嵌入视频的某些部分，这些部分在接收端被接收并记录电影每个合法副本的接收者。如果电影内容在互联网上泄露，则内容所有者可以轻松识别哪个接收者泄露了内容或传播内容的来源\
  \ (Ding et al., 2016)。\n\n*   **版权保护**：这将是受鼓励的水印技术最实质性的准备，可能是针对不同未授权用户的版权保护 (Ansari\
  \ et al., 2017)。\n*   **广播监控**：此应用检查未经授权的广播站 (Abraham et al., 2016)，并分析内容是否由授权供应商播放。篡改检测是基于脆弱水印的另一个应用。如果通过任何方式发现水印被破坏，则表明存在篡改，因此数字内容不再可靠\
  \ (Hu et al., 2011)。\n*   **认证与完整性验证**：数字水印的目的还包括保护客户内容免受未经授权的访问。如果有人使用了用户内容的合法副本，并有意或无意地与他人重新分发该内容，则使用含水印内容更容易检测到该内容。在每个交易点，水印作为发送方和接收方之间的屏障来保护内容。通过此过程，追踪未授权用户变得更容易\
  \ (Tusi et al., 2008)。基于指纹的认证：现有的指纹相关技术保护用户内容。如果有人合法制作了复制品并非法分发给他人，则指纹认证可防止此类未经授权的访问。此原理也可用于通过将水印原理嵌入网络上的多媒体内容来追踪整个交易\
  \ (Lu et al., 2000)。\n\n\n\n\n\n######### 内容描述：水印中的多媒体内容标记与渲染\n\n水印嵌入过程发生在宿主图像内部。嵌入图像的尺寸与原始图像长度一致，且能在不产生任何行为变化的情况下轻松嵌入。该应用所选的水印方法对鲁棒性要求较低。由于水印中存储了大量信息，水印尺寸较大，且该应用对鲁棒性要求极低。\n\
  \n######### 与医疗相关的应用\n\n为防止未授权访问医疗信息，数字水印技术投入应用。相关内容包括患者报告及其他与专利和医院记录相关的文档（Tyagi\
  \ et al., 2016）。鉴于多媒体内容在网络上频繁传输，医疗数据的安全性与验证至关重要。\n\n######## 空间域中的水印嵌入与提取过程\n\n\
