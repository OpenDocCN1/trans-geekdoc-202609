  \ 3(1), 16–28. doi:10.1109/TIFS.2007.916275\n\n\n\n\n\n#### 第 6 章：医学图像认证的应用\n\n\
  **Poonkuntran Shanmugam**  \n![Orcid Imagehttps://orcid.org/0000-0002-2778-7937](https://orcid.org/0000-0002-2778-7937)\
  \  \nVelammal College of Engineering and Technology, Madurai, India\n\n**Manessa\
  \ Jayaprakasam**  \nIndependent Researcher, India\n\n##### 摘要\n\n本章提出了一种基于整数变换的水印方案，用于数字眼底图像认证。它被呈现为医学中的多媒体应用。本章介绍了基于水印的图像认证和数字眼底图像。开发眼底图像水印方案的关键要求及其挑战被识别并重点强调。作者描述了一种基于整数变换的水印方案。实验结果强调了该方案在满足关键要求方面的能力及其成效。详细结果已总结。\n\
  \n##### 引言\n\n现代计算技术的出现与万维网（WWW）的爆发式增长相结合，为大量家庭和企业提供了即时信息访问。这种融合的发展刺激了以文本、图片、图形和集成多媒体应用形式的信息使用。此类信息通过将连续信号转换为数字格式而获取，并可使用计算机显示器和投影仪等显示设备进行查看。这种信息以数字视觉格式广泛交换，用于其传输、接收、存储、处理和显示。互联网的最新发展结合廉价的数字记录和存储设备，创造了一个环境，在该环境中数字信息可以轻松地被访问、复制和分发，而不会有任何质量损失。这已成为信息安全的一个隐患。因此，在交换此类信息时，需要用高效的方法对其进行保护（Bovik,\
  \ 2000; Cole, 2003）。\n\n数字图像处理（DIP）是数字计算和电信领域的一项新技术进步。图像可定义为二维函数 `f(x, y)`，其中 `x`\
  \ 和 `y` 为空间坐标，`f` 为空间坐标对 `(x, y)` 处的幅度，称为该位置 `(x, y)` 的灰度值或强度值。如果空间坐标 `(x, y)` 和幅度\
  \ `f` 均为有限的离散量，则该图像称为数字图像。术语 DIP 指利用数字计算机对数字图像进行处理（Gonzalez & Woods, 2002）。DIP 包含先验知识、目标识别、目标解释、目标描述、模式分类和模式识别。\n\
  \nDIP 的应用获取了广泛的辐射谱，如图 1 所示。各类图像类型均可从各种类型的辐射中衍生出来。数字图像获取方法是通过这些辐射开发和改进的。例如，医学图像的最新发展源自新型传感器，它们记录来自先前很少使用的辐射源的图像数据，如正电子发射断层扫描（PET）和磁共振成像（MRI）（Bovik,\
  \ 2000）。\n\n| 图 1. 数字图像处理（DIP）的应用 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch006.f01](img/ch006.f01.png)\
  \ |\n\n###### 从密码学到水印技术\n\n虽然安全是文献中使用的一个通用术语，但安全在人类日常生活中的应用方式却是非同寻常的。其范围涵盖从用于进入安全计算机和电子钱包的密码，到用于个人身份识别的指纹扫描技术。因此，安全措施已成为人类日常生活的一部分，就像电话或汽车一样。人类的日常生活被一个秘密通信的世界所包围，各类人员都在传输信息，既有发送给在线商店的加密信用卡号这样无害的信息，也有发送给恐怖分子的劫机计划这样危险的信息。因此，安全的秘密通信变得至关重要。秘密通信可通过两种技术实现。它们是密码学和数据隐藏（也称为信息隐藏）。\n\
  \n*   **密码学**：它是利用数学对敏感信息进行加密和解密的科学。密码学以不可读的乱码格式（称为密文）跨不安全网络传输敏感信息。因此，除预期接收者外，任何人都无法读取该信息。待传输的信息称为明文。明文无需任何处理即可阅读和理解。加密是将明文转换为密文的过程。它用于确保信息对非预期接收者隐藏，即使是那些能看到加密信息的人也无法读取。将密文还原为其原始明文的过程称为解密。加密和解密如图\
  \ 2 所示。\n\n| 图 2. 加密和解密 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch006.f02](img/ch006.f02.png)\
  \ |\n\n虽然密码学技术用于防止未经授权访问数字信息，但显然密码学在保护知识产权方面存在局限性。一旦信息被解密，就没有任何东西能阻止授权用户非法复制该信息。因此，需要另一种技术来促进内容认证、保护所有权、追踪内容使用、确保授权访问和防止非法复制（Cox,\
  \ Miller, Linnartz & Kalker, 1999）。\n\n\n\n\n\n###### 数据隐藏或信息隐藏\n\n数据隐藏或信息隐藏是一个统称，包含两个子学科：隐写术和水印技术。\n\
  \n**隐写术** 是一种将秘密信息隐藏在看似无害的载体媒介中进行传输的过程，使其存在不可被察觉。秘密信息总是以不可见的方式隐藏。\n\n**水印技术** 是通过不可感知地改变载体媒介来嵌入关于该载体媒介的信息的过程。水印技术与隐写术密切相关；然而，两者之间存在差异。在水印技术中，秘密信息与载体媒介相关。隐写术涉及双方之间的秘密点对点通信，其中秘密信息与载体媒介无关。水印技术具有额外特性：它必须具有抵抗试图移除隐藏秘密信息的攻击的鲁棒性。隐写术不涉及攻击的概念，因为秘密信息与载体无关，不会引起攻击者的任何怀疑。\n\
  \n####### 图 3. 通用水印模型\n\n![Figure978-1-7998-2701-6.ch006.f03](img/ch006.f03.png)\n\
  \n通用水印模型如图 3 所示。它涉及两个过程：嵌入和提取。在该模型中，载体媒介称为载体数据（`I`），可以是文本、音频、图像或视频。嵌入过程使用密钥（`k`）以加密形式将秘密信息（称为水印\
  \ `W`）插入载体数据中。密钥可以是秘密的，也可以是非秘密的。嵌入过程的输出是复合数据，称为含水印数据（`I[W]`），其中包含嵌入在载体数据内的加密秘密信息。这种含水印数据可能会受到黑客攻击以破坏嵌入的水印，从而生成被攻击版本的含水印数据（`I[W]'`）。一旦含水印数据被攻击，载体数据就会变得容易受到各种欺诈。提取过程从含水印数据中分离出载体数据和水印。从含水印数据中移除的水印称为提取水印（`W[E]`），也称为置信度度量。\n\
  \n它用于载体数据的验证和确认。提取过程可以在已知或未知载体数据或水印的情况下进行。根据目标应用，提取过程可以是有损的，也可以是无损的。\n\n###### 水印技术的历史\n\
  \n水印技术并非本世纪才出现。700 多年前，意大利就已采用水印技术来标识造纸品牌和造纸厂。18 世纪，水印技术开始被用于货币和其他文件的防伪措施（Muharemagic\
  \ & Furht, 2004）。\"Watermark\"（水印）一词是在 18 世纪末提出的。由于这些标记类似于水在纸上产生的效果，因此选择了\"watermark\"\
  这一术语。1954 年，Emil Hembrook 就其在音乐数字水印方面的识别方法申请了专利。这是数字水印领域的首项工作，并成为了典范。1988 年，Komatsu\
  \ 和 Tominaga 在文献中首次使用了\"Digital Watermarking\"（数字水印）一词。自 1995 年以来，水印研究的兴趣开始增长（Muharemagic\
  \ & Furht, 2004; Cox, Miller, Linnartz & Kalker, 1999）。\n\n###### 水印技术在医学图像中的相关性\n\
  \n医学图像处理（MIP）是指用于为临床目的创建和操作人体图像的技术。临床目的包括旨在揭示和诊断疾病的医疗程序。该领域具有研究潜力，试图理解人类或动物模型中的过程。虽然通用图像处理技术可用于医学图像，但由于其特殊性质，它们需要特殊处理。医学图像源自不同的采集方法，如\
  \ X 射线、计算机断层扫描（CT）、磁共振成像（MRI）、超声成像、核医学成像、眼底成像等。因此，医学图像因采集方法而异。它们也因被采集对象的不同而异。医学图像经过处理以推断皮肤下体积的信息，专门用于探测皮肤下隐藏物体的解剖结构。医学图像可以是二维投影信息，也可以是完整的三维映射信息。在所有视觉信息和临床记录以数字形式存储和交换的电子医疗环境中，医学图像保护和认证非常重要。医学图像水印技术是一个增强信息安全、验证和保真度的过程。同时，必须尽可能保留图像中的原始信息，以避免医生诊断性能的下降。\n\
  \n# 医学图像的安全特性\n\n医学图像的安全性源于严格的伦理和立法规则，可分为三个固定特性：机密性、可靠性和可用性（Dutta, Singh, Singh,\
  \ Burget & Prinosil, 2015; Melkemi, Kamal, Singh & Golea, 2017; Hai, Dong Qing,\
  \ & Ke, 2018; Sliwa, 2019）。\n\n## 机密性\n\n这意味着只有授权用户才能在计划系统中访问图像。\n\n## 可靠性\n\n它由两个特性给出：\n\
  \n1.  **完整性**：确保图像未被未授权人员修改。\n2.  **认证**：确保图像确实属于正确的患者，且来源于正确的源头。\n\n######### 可用性\n\
  \n它是指图像在正常计划的访问和使用条件下，能被授权用户使用的能力。\n\n在医学图像安全的情况下，主要必须考虑前两个特性。水印方案已被认可为通过强调完整性和真实性来控制图像可靠性的手段（Coatrieux,\
  \ Maitre, Sankur, Rolland & Collorec, 2000）。数字水印是一种依赖密钥的秘密信号，插入数字数据中，稍后可被检测或提取以做出断言。在医学图像中，因插入过程导致的改动不被医生接受用于诊断。因此，医学图像的需求与多媒体应用不同（Amato,\
  \ Cozzolino, Mazzeo & Romano, 2018; Wang, Ding & Gu, 2019; Karmakar & Basu, 2019;\
  \ Bhatt, 2017）。\n\n当医学图像在公共或私有网络中交换时，会引发两个主要问题：\n\n1.  **这是谁的图像？** 它指的是发送图像用于诊断的医院及相关患者详细信息。\n\
  2.  **接收到的图像是真实的吗？** 它指的是图像的认证。\n3.  **源头验证**：它检查图像是否来自正确的源头，并确保其未被修改。\n\n这些问题可以通过水印方案中的两个不同应用分支来回答：版权保护和认证。版权保护保护所有者的知识产权并追踪内容非法副本的来源。认证检查接收到的图像是否被篡改并定位被篡改区域。认证是任何安全架构中的第一步和基本步骤，其成功可防止系统中的其他问题。\n\
  \n本章重点在于开发一种用于数字眼底图像（DFI）认证的水印方案，DFI 是医学图像的一个特殊类别。接下来的几节将讨论 DFI 的重要性及其安全性。\n\n######\
  \ 数字眼底图像\n\n\n\n\n\n####### 医学科学中的数字眼底图像\n\n######## 概述\n\n数字眼底图像是医学图像的一个特定类别。眼科学是处理视觉通路（包括眼球、大脑以及眼睑等周围区域）疾病和手术的医学分支。在眼科学中，眼底是眼球的内表面，由视网膜、视神经乳头和黄斑组成。眼底可通过眼底镜观察，眼底图像则通过眼底相机捕获。\n\
  \n眼底相机是一种带有摄像头的专用低倍显微镜，旨在拍摄眼球内表面，如**图 4**所示。其光学设计基于单眼间接检眼镜原理，提供直立、放大的眼底视图。典型相机可观察\
  \ 30 至 50 度的视网膜区域，放大倍数为 2.5 倍，可通过变焦或辅助透镜进行修改，范围从 15 度（5 倍放大）到 140 度（广角镜头将图像缩小一半）。其光学系统类似于间接检眼镜，即观察系统和照明系统遵循不同的路径（Coatrieux,\
  \ Lamard, Puentes & Roux, 2005）。\n\n观察光通过一系列透镜聚焦于一个甜甜圈状的孔径，然后通过中央孔径形成一个环形光束，再通过相机物镜和角膜到达视网膜。从视网膜反射的光通过照明系统形成的甜甜圈状非照明孔径。由于两个系统的光路相互独立，因此形成的图像中极少捕捉到光源的反射。成像光线继续向低倍望远镜目镜传播。当按下按钮拍照时，一面反射镜会中断照明系统的光路，使闪光灯的光线进入眼睛。同时，一面反射镜落在观察望远镜前，将光线重定向到捕获介质上。由于眼睛在通过望远镜观察时倾向于调节，因此必须保证出射光线为平行光，以便在捕获介质上形成清晰的图像。**图\
  \ 5**展示了眼底图像的示例。眼底摄影通常使用绿色滤镜来获取视网膜血管图像。绿光被血液吸收，在眼底照片中呈现比背景和视网膜神经纤维层更深的颜色。因此，眼底图像的绿色通道比其他通道包含更多有价值的诊断信息（Hu,\
  \ GuoHu, & Chen, 2005）。\n\n| 图 4. 眼底相机 |\n| :--- |\n| ![Figure978-1-7998-2701-6.ch006.f04](img/ch006.f04.png)\
  \ |\n| *(来源：Creative Common, USA)* |\n\n| 图 5. 数字眼底图像 |\n| :--- |\n| ![Figure978-1-7998-2701-6.ch006.f05](img/ch006.f05.png)\
  \ |\n\n######## 数字眼底图像在医学科学中的重要性\n\n验光师、眼科医生和受过培训的医疗专业人员使用眼底图像来监测疾病进展和进行诊断。它们还可以与视网膜血管造影结合用于大规模筛查，此时首先对这些图像进行分析。视网膜眼底图像有助于早期发现多种眼部疾病，若不及时治疗，这些疾病可能导致失明。使用视网膜眼底图像进行检查具有成本效益，适合大规模筛查。因此，在许多医疗中心和医疗机构的体检中，都会获取视网膜眼底图像用于眼科检查。眼科检查的增加改善了眼部健康护理，但也增加了眼科医生的工作量。因此，现代医疗系统开发了计算机辅助设计（CAD）和网络技术来分析视网膜眼底图像，协助减轻眼科医生的工作量并提高筛查准确性。此类现代医疗系统需要高度安全的通信技术来交换信息（Wu\
  \ & Liu, 2003）。\n\n为数字眼底图像开发用户认证是一项具有挑战性的任务。当图像通过网络发送给不同地理位置的医疗专家征求意见和判断时，必须确保其免受任何形式的外部攻击。\n\
  \n######## 数字眼底图像研究范围\n\n数字眼底图像的研究是医学科学中一个新兴且前景广阔的领域。定期的眼底检查可以检测出糖尿病视网膜病变等多种重大疾病的早期迹象，从而大幅降低此类疾病在后期阶段的实际治疗成本。在医学图像安全领域，数字眼底图像尚未得到广泛研究。因此，本文着手开发数字眼底图像的安全方案。\n\
  \n######## 医学图像认证方案的关键需求\n\n以下是用于设计和开发任意类别医学图像认证方案的关键需求。这些需求同样适用于数字眼底图像；然而，不同类别图像的需求表现会有所不同。\n\
  \n######### R1：可逆性\n\n可逆性是指一种无损水印方案，在提取过程后保留原始图像。如果方案在提取后无法无损地恢复原始图像，则称为不可逆。由于眼底图像用于诊断目的，水印方案必须是可逆的。此类情况下的信息丢失可能导致不准确的诊断。因此，眼底图像仅使用可逆水印方案（Bovik,\
  \ 2000; Muharemagic & Furht, 2004; Poonkuntran, Rajesh, & Eswaran, 2008）。\n\n#########\
  \ R2：篡改检测\n\n篡改检测是认证中的一项基本功能。它检测眼底图像在网络传输过程中遭受的未经授权的修改。该需求只能检测眼底图像上的修改，而无法定位修改位置（Bovik,\
  \ 2000; Gonzalez & Woods, 2002）。\n\n######### R3：篡改定位\n\n这是认证中的另一项功能。它定位眼底图像中的修改区域。基于该需求（R3），可衡量第二个需求（R2）。对于给定的眼底图像，如果没有修改，则图像是真实的；否则，则不是真实的（Bovik,\
  \ 2000; Gonzalez & Woods, 2002）。\n\n######### R4：不可感知性\n\n不可感知性是指在正常观察下水印在眼底图像中出现的程度。由于研究主要针对认证，水印应当是不可见的。隐藏的水印不应在图像中产生任何外部伪影。外部伪影可能给黑客留下可疑的空间（Bovik,\
  \ 2000）。\n\n######### R5：容量\n\n容量是指嵌入眼底图像中的信息量，以比特数衡量。容量将与不可感知性和脆弱性存在权衡关系，如**图 6**所示。\n\
  \n| 图 6. 不可感知性、脆弱性与容量之间的权衡 |\n| :--- |\n| ![Figure978-1-7998-2701-6.ch006.f06](img/ch006.f06.png)\
  \ |\n\n######### R6：盲检测\n\n\n\n\n\n######## 水印提取过程可通过两种方式完成\n\n它们分别是盲检测和知情检测。\n\n\
  ######### 盲检测\n\n在盲检测中，无需了解原始图像即可从含水印图像中提取水印。仅借助密钥（秘密或非秘密），即可提取水印。\n\n#########\
  \ 知情检测\n\n在知情检测中，利用原始图像的知识来提取水印。提取过程中对原始图像知识的需求可能会降低安全性。此外，原始图像的知识可能帮助攻击者在不改变水印的情况下篡改图像。从而导致认证过程失效（Bovik,\
  \ 2000; Gonzalez & Woods, 2002）。因此，决定在本研究中采用盲检测。\n\n######## R7：脆弱性\n\n脆弱性是指水印方案对攻击的敏感度。该方案必须对攻击敏感，从而使水印容易被破坏，以实现认证目的（Bovik,\
  \ 2000）。\n\n######## 问题陈述与挑战\n\n本工作的主要目标是对数字眼底图像认证水印方案的设计与开发进行详细研究，以满足上述所有关键需求（R1-R7）。本研究的第二个目标是提出并验证一种基于数学的算法水印方案，用于眼底图像认证。该方案将在通用测试平台上进行定量分析，以针对上述需求（R1-R7）评估其满足所有需求的程度。\n\
  \n从上述讨论可知，数字眼底图像在内容认证安全性方面尚未被研究和分析。同时也发现，尚无针对满足上述关键需求（R1-R7）的数字眼底图像认证的专门研究。因此，必须开展满足所有关键需求（R1-R7）的数字眼底图像认证方案的设计与开发详细研究。以下是设计此类认证方案面临的挑战性问题。\n\
  \n数字眼底图像属于医学图像的一种特定类别，通过眼底相机获取。眼底图像的特性可能会限制方案的表现，导致部分关键需求无法满足。在需求中，容量、不可见性和脆弱性本质上存在权衡。对方案所有需求的完整研究非常困难（Muharemagic\
  \ & Furht, 2004）。要找到一个使所有需求均能在可能的最大程度上得到满足的最优点，也非常困难（Muharemagic & Furht, 2004）。朝着当前研究领域方向的文献极少。方案设计应符合当前可用的网络带宽需求，不应寻求额外的带宽需求（Poonkuntran,\
  \ Rajesh & Eswaran, 2009a; Poonkuntran, Rajesh & Eswaran, 2009b; Poonkuntran, Rajesh\
  \ & Eswaran, 2009c; Poonkuntran, Rajesh & Eswaran, 2009d）。\n\n######## 拟议方案：改进整数变换水印方案\n\
  \n本节提出了一种用于眼底图像认证的改进整数变换水印方案（`MITWS`）。`MITWS` 利用像素的颜色特征和整数变换。它将图像中像素的颜色值分为主色和次色。仅次色用于通过整数变换进行嵌入。`MITWS`\
  \ 在提高容量的同时改善了不可见性。`MITWS` 能在接收端完整提取水印。\n\n###### 相关工作\n\nNammer 和 Emman（2007）提出了一种用于彩色位图（`BMP`）图像的高容量隐写方案（`HCSS`）。它将数据隐藏在通过大量颜色差异识别出的图像“非感兴趣区域”中。它提供了高嵌入率，并能抵抗视觉和统计攻击。`HCSS`\
  \ 的局限性在于不可逆性。眼底图像需要一种可逆方案，能在无任何信息丢失的情况下恢复图像原貌。因此，`HCSS` 无法直接应用于眼底图像。Tian（2003）提出了一种用于医学图像的多层数据隐藏方案（`MLDHS`）。它利用整数变换嵌入秘密数据并产生可逆解。但它无法提供可靠且保密的通信。原因在于嵌入在多层进行时会产生高失真。上述两种方案均不适用于眼底图像。因为第一种方案\
  \ `HCSS` 不可逆，第二种方案 `MLDHS` 产生高失真，这两种方案都不适合数字眼底图像。通过文献调研发现，利用像素的颜色特征可在低失真下提高容量。既然\
  \ `HCSS` 利用颜色特征嵌入，而 `MLDHS` 具有可逆性，因此提出了一种结合 `HCSS` 和 `MLDHS` 的新型混合水印方案。拟议方案主要利用像素的颜色特征和整数变换。`MLDHS`\
  \ 中的整数变换采用顺序像素选择策略，拟议方案通过引入一种称为“平面内差值嵌入”的新像素选择策略对其进行了修改，以降低失真。由于拟议方案采用改进的整数变换，故称为“改进整数变换水印方案（`MITWS`）”。\n\
  \n######### 像素的颜色特征及其与水印的相关性\n\n在图像内部隐藏信息是当今一种流行的技术。\n\n包含秘密消息的图像可轻松通过万维网传播。\n\n\
  为在不改变图像可见属性的前提下在图像中隐藏消息，可在颜色变化丰富的“杂乱”区域修改载体图像，从而减少对修改的察觉。Poonkuntran, Rajesh & Eswaran（2009a;\
  \ 2009b; 2009c; 2009d）中的方案是最常见的采用上述方式进行嵌入的方案。在真彩色图像中，每个像素由红色（`R`）、绿色（`G`）和蓝色（`B`）分量给出。这三个分量被称为主色或\
  \ `RGB` 色彩空间。此处，每个像素用 24 位或 3 字节表示。每字节包含 0 到 255 之间的数值。利用这三个字节，计算机可生成 256×256×256\
  \ = 16777216 种组合。图 7 展示了此类组合，其中 `R`、`G` 和 `B` 分量分别绘制在三个不同轴上。通过调整这三个分量来精确定义一种颜色是非常困难的。\n\
  \n| 图 7. RGB 色彩空间（立方体模型） |\n| --- |\n| ![Figure978-1-7998-2701-6.ch006.f07](img/ch006.f07.png)\
  \ |\n\n\n\n\n\n######### 利用平面内差值嵌入的整数变换\n\n########## 整数变换\n\n整数变换也称为整数哈尔小波变换或 S\
  \ 变换。整数变换满足可逆性（Tian, 2002）。其工作原理如下。对于一对 8 位灰度像素 `(x, y)`，整数变换由一对 `(m, d)` 给出。其中\
  \ `m` 表示整数平均值，`d` 表示差值。\n\n`m` 和 `d` 的计算如下。\n\n```\nm = floor((x + y) / 2)  (1)\n\
  d = x - y               (2)\n```\n\n逆变换由下式给出\n\n```\nx = m + floor((d + 1) / 2)\
  \  (3)\ny = m - floor(d / 2)        (4)\n```\n\n其中 `floor()` 表示向下取整运算，将数值舍入为最接近的整数。在整数变换中，差值\
  \ (`d`) 根据水印比特 (`b`) 进行修改，以将 `b` 隐藏到像素对中。可逆整数变换在 `(x, y)` 和 `(m, d)` 之间提供了一一对应关系。\n\
  \n此处 `(x, y)` 和 `(m, d)` 均为表示图像中像素的整数。\n\n`(x, y)` 的取值范围为 `[0, 255]`。`(m, d)` 也应在同一范围\
  \ `[0, 255]` 内，以防止溢出和下溢。这意味着对于给定的像素对 `(x, y)`，`(m, d)` 应满足以下条件。\n\n```\n0 <= m +\
  \ floor((d + 1) / 2) <= 255  (5)\n0 <= m - floor(d / 2) <= 255        (6)\n```\n\
  \n上述不等式等价于\n\n```\n-d - 1 <= 2m - 255 <= d     (7)\n-d <= 2m - 255 <= d + 1    \
  \ (8)\n```\n\n由此，可轻易得到以下条件。\n\n```\n|2m - 255| <= d             (9)\n```\n\n此处，秘密数据比特（水印）可通过扩展差值\
  \ (`d`) 来嵌入。扩展后的差值 (`d'`) 由下式获得\n\n```\nd' = 2 * d + b              (10)\n```\n\n\
  扩展后的差值应满足溢出和下溢条件。因此，\n\n```\n|2m - 255| <= d'            (11)\n```\n\n若满足以下条件，则称\
  \ `d'` 为可扩展的\n\n```\n|2m - 255| <= 2 * d + b\n```\n\n其中 `b = {0, 1}` 表示水印（秘密信息）。在扩展这些差值时，整数平均值不进行扩展。因此，利用\
  \ `(m, d')` 通过公式 3 和 4 生成新的像素对。\n\n由公式 10 可知，扩展后的差值由 2 的倍数之和给出。因此，扩展后的差值可重写为\n\n\
  ```\nd' = 2 * d + LSB(d')        (12)\n```\n\n其中 `LSB(d')` 返回整数 `d'` 的最低有效位。以下示例解释了公式\
  \ 10 如何通过公式 12 重写。\n\n考虑差值 `d = 4` 和水印 `b = 1`。使用公式 10，`d = 4` 的扩展过程如下。\n\n由公式 10\n\
  \n```\nd' = 2 * d + b              (13)\n```\n\n将 `d = 4` 和 `b = 1` 代入公式 13\n\n\
  ```\nd' = 2 * 4 + 1 = 9          (14)\n```\n\n现在，利用公式 12 从 `d'` 导出 `d'`，过程如下。\n\n\
  由公式 12\n\n```\nd' = 2 * d + LSB(d')        (15)\n```\n\n将 `d' = 9` 代入公式 15\n\n```\n\
  9 = 2 * 4 + 1               (16)\n```\n\n因此，扩展后的差值 (`d'`) 被重写。首先检查差值是否可扩展。对于可扩展的差值，通过修改\
  \ LSB 进行扩展。在此修改后，可扩展差值可进一步改变以嵌入另一比特信息。这称为多层嵌入。扩展后的差值在整数平均值下进行改变。整数平均值在整数变换中不被改变。借助该整数平均值，在提取过程中可无损恢复原始像素值。因此，整数变换实现了可逆嵌入。\n\
  \n########## 利用平面内差值嵌入的改进整数变换\n\nTian (2003) 提出了一种利用上述整数变换的 MLDHS。它通俗地称为 DE 方法。该方案工作流程如下。\n\
  \n1.  **步骤 1：** 从图像中的连续像素形成像素对，并利用整数变换转换该像素对。例如，考虑像素对 `(208, 203)`。根据上述整数变换：\n\n\
  \    ```\n    x = 208, y = 203\n    平均值 (m) = floor((208 + 203) / 2) = 205\n   \
  \ 差值 (d) = 208 - 203 = 5.\n    ```\n\n    现在，从像素对 `(x, y)` 获得 `(m, d)` 对。这称为正向整数变换。\n\
  \n2.  **步骤 2：** 扩展差值以在像素对 `(x, y)` 内嵌入水印比特 (`b)`。这是通过用水印比特 (`b`) 修改差值 (`d`) 来完成的。例如\
  \ `b = 1`，根据公式 10 获得修改后的差值 (`d'`) 如下：\n\n    ```\n    d' = 2 * d + b = 2 * 5 + 1\
  \ = 11.\n    ```\n\n3.  **步骤 3：** 利用修改后的差值生成含水印像素。应用逆整数变换获得修改后的像素对。对于步骤 1 和 2 中的示例：\n\
  \n    ```\n    x' = m + floor((d' + 1) / 2) = 205 + (12 / 2) = 211.\n    y' = m\
  \ - floor(d' / 2) = 205 - (11 / 2) = 200.\n    ```\n\n    获得修改后的像素对 `(x' = 211,\
  \ y' = 200)`。因此，水印被嵌入图像中。现在，将此 `(x', y')` 发送给接收方。\n\n4.  **步骤 4：** 接收方收到 `(x', y')`\
  \ 后，对 `x = x'` 和 `y = y'` 重复步骤 1。`x' = 211` 和 `y' = 200`：\n\n    ```\n    平均值 (m)\
  \ = floor((211 + 200) / 2) = 205\n    差值 (d) = 211 - 200 = 11.\n    ```\n\n5.  **步骤\
  \ 5：** 读取 (`d`) 的最低有效位以获取水印信息。\n\n    ```\n    LSB(d) = LSB(11) = 1 → 此处提取出水印。\n\
  \    ```\n\n6.  **步骤 6：** 通过将 `d` 修改为 `d / 2` 来恢复原始像素对。\n\n    ```\n    d' = floor(d\
  \ / 2) = floor(11 / 2) = 5.\n    x = m + floor((d' + 1) / 2) = 205 + floor((5 +\
  \ 1) / 2) = 208.\n    y = m - floor(d' / 2) = 205 - floor(5 / 2) = 203.\n    ```\n\
  \n\n\n\n因此，无需任何信息损失即可提取水印和原始像素对。实验发现，对于较小尺寸的水印，MLDHS 并不脆弱。当该方案应用于具有各种尺寸水印的眼底图像时，该方案仅能在一个颜色平面上进行更改。其余颜色平面保持不变。\n\
  \n当 MLDHS 应用于眼底图像时，如表 1 所示，对于水印尺寸从 10000 到 100000 的情况，它仅改变眼底图像的红色颜色平面。\n\n它不会改变其他颜色平面。水印无法感知在其他颜色平面（绿色和蓝色）中所做的修改。因此，MLDHS\
  \ 在脆弱性方面失败了。然而，可以增加大小（容量）使方案变得脆弱。增加容量直接影响不可感知性。文献调查表明，脆弱性取决于选择图像位置进行嵌入的方式。与有序选择不同，如果随机选择位置，则可以提高脆弱性。这意味着以一种方式选择位置，当尝试篡改图像时，嵌入的水印也会发生变化（Poonkuntran,\
  \ Rajesh & Eswaran, 2009e）。因此，一种新的位置选择策略已被引入 MITWS。它被称为**平面内差值嵌入**。它选择跨颜色平面的像素对，而不是单一颜色平面中的连续像素。因此，在嵌入水印时，MITWS\
  \ 修改两个颜色平面以提高脆弱性，如表 2 所示。因此，新引入的平面内差值嵌入策略提高了 MITWS 的脆弱性。\n\n容量、篡改检测和篡改定位是 MLDHS\
  \ 中发现的其他局限性。对于给定尺寸为 256×256 的眼底图像，MLDHS 每层最多可嵌入 128×128 位。原因是它连续选择像素对。在 MITWS 中，像素对是跨平面形成的。因此，MITWS\
  \ 每层最多可嵌入 256×256 位。因此，MITWS 中的新像素选择策略提高了容量。然而，篡改定位和检测尚未由 MITWS 解决。上述讨论的颜色特征和带有新像素选择策略的修正整数变换被选为本章提出的\
  \ MITWS 设计的关键技术。\n\n**表 1. MLDHS 的脆弱性**\n\n| ![Figure978-1-7998-2701-6.ch006.g01](img/ch006.g01.png)\
  \ |\n\n| --- |\n\n**表 2. 使用平面内差值嵌入的 MITWS 脆弱性**\n\n| ![Figure978-1-7998-2701-6.ch006.g02](img/ch006.g02.png)\
  \ |\n\n| --- |\n\n########## 修正整数变换水印方案 (MITWS)\n\n原始眼底图像 (`I`) 在 MITWS 中以 24 位或\
  \ 3 字节的 RGB 颜色给出。每个字节包含两个半字节。左半字节包含字节中的最高值，而右半字节包含字节中的最低值。由于半字节值用 4 位表示，在区间 `[0,\
  \ 15]` 内产生 16 个不同的十进制值。\n\n此区间用于识别图像中像素的主色和次色。对于 RGB 中的给定像素，颜色索引计算如下：\n\n![Mathtype978-1-7998-2701-6.ch006.m21](img/ch006.m21.svg)\
  \ (17)\n\n其中 `Color Value = {Red, Green, Blue}`。包含最小索引值的颜色被选为主色，其他为次色。像素的主色保持不变，其余像素颜色被用于整数变换进行嵌入。MITWS\
  \ 中的整数变换工作如下。对于 8 位灰度像素对 `(x, y)`，`(x, y) ε Z`，`0 ≤ Z ≤ 255`，整数平均值 `m` 和差值 `d` 定义如下：\n\
  \n`m = floor((x + y) / 2)` (18)\n\n`d = x - y` (19)\n\n逆变换定义为：\n\n`x' = m + floor((d\
  \ + 1) / 2)` (20)\n\n`y' = m - floor(d / 2)` (21)\n\n差值 (`d`) 通过使用水印位 `b` 进行扩展，以创建扩展差值\
  \ (`d'`)。\n\n`d' = 2 × d + b` (22)\n\n其中 `d'` 是嵌入水印位 (`b`) 后的修正差值。\n\n为防止嵌入过程中的溢出或下溢，通过满足以下条件计算修正差值\
  \ (`d'`)。\n\n![Mathtype978-1-7998-2701-6.ch006.m22](img/ch006.m22.svg)如果 ![Mathtype978-1-7998-2701-6.ch006.m23](img/ch006.m23.svg)\n\
  \n![Mathtype978-1-7998-2701-6.ch006.m24](img/ch006.m24.svg)如果 ![Mathtype978-1-7998-2701-6.ch006.m25](img/ch006.m25.svg)\
  \ (23)\n\n如果 `d'` 满足公式 23，则 `d` 可扩展。否则，`d` 不可扩展。可扩展差值可用于隐藏秘密信息。如果所有可扩展差值均被选中用于数据嵌入，则容量率达到最大极限。设\
  \ `N` 和 `N[e]` 分别表示差值总数和可扩展差值数。\n\n图像的隐藏容量定义为：\n\n`C = N[e] / N` (24)\n\n因此，图像的隐藏容量与可扩展差值的数量成正比。因此，MITWS\
  \ 将秘密数据嵌入原始眼底图像以创建含水印图像。建议的嵌入过程如图 8 所示。\n\n**图 8. MITWS 的嵌入过程**\n\n| --- |\n\n|\
  \ ![Figure978-1-7998-2701-6.ch006.f08](img/ch006.f08.png) |\n\n| --- |\n\n提取过程是可逆的，它无需任何信息损失即可提取秘密数据和原始图像。对于多层嵌入，选择相同的像素对进行进一步的数据嵌入。在此，某些差值可能无法长时间保持可扩展性（Tian,\
  \ 2003）。提取过程需要图像中像素主色的信息。原因是像素的主色在嵌入过程中未被改变。这意味着主色中未隐藏任何信息，且在该过程中保持不变。像素的次色通过整数变换进行修改以嵌入水印。此时，像素的实际颜色特征发生变化，并在提取过程中从含水印图像中移除水印后恢复。如果没有先验信息，在提取过程中也很难对主色和次色进行分类。\n\
  \n为避免此问题，单独创建了**颜色分类映射 (CCM)**，并随含水印图像一起发送。`CCM` 包含二进制值 `{0, 1}`。`0` 表示该颜色为主色，在嵌入过程中未被改变。`1`\
  \ 表示该颜色为次色，在嵌入过程中被改变。对于图像中的一个像素，为红、绿、蓝各主色平面生成一个 3 位代码。图像中的可扩展像素对也可通过此 `CCM` 轻松识别。对于不可扩展像素，`CCM`\
  \ 为 `000`。\n\n然后，提取过程变得简单。提取过程接收含水印图像和 `CCM`。`CCM` 识别像素的次色。这些像素值被送入公式 18 和 19 以求得\
  \ `m` 和 `d`。然后，通过读取像素对中像素间差值的最低有效位 (LSB) 来提取嵌入在像素对中的水印或秘密信息。其他步骤按第 4.4.2 节讨论的进行。\n\
  \n因此，MITWS 使用平面内差值嵌入和像素颜色特征进行嵌入和提取。\n\n########### 实验结果与分析\n\nMITWS 已使用本研究创建的一个专用通用测试平台进行模拟，用于对建议方案进行定量分析。测试平台详情如下。\n\
  \n*   **测试图像：** 测试数字眼底图像取自两个公共研究数据库 STARE 和 DRIVE（Poonkuntran, Rajesh & Eswaran,\
  \ 2014）。数据库详情如下。\n\n    *   **数据库名称：** 视网膜结构分析 (STARE)\n\n    *   **数字视网膜图像用于血管提取\
  \ (DRIVE)**\n\n\n\n\n########### 数据集与实验设置\n\n*   **Address**: `http://www.ces.clemson.edu/~ahoover/stare/`\n\
  *   `http://www.isi.uu.nl/Research/Databases/DRIVE/`\n*   **Image Format**: Tagged\
  \ Image File Format (TIFF)\n*   **Size of the image**: 565x584x3\n*   **Color Mode**:\
  \ RGB (Red, Green, Blue)\n\n############ 图像格式\n\n实验中使用的测试图像采用 **Tagged Image File\
  \ Format (TIFF)** 格式。Tagged Image File Format（简称 TIFF）是一种用于存储图像（包括照片和线条图）的文件格式。截至\
  \ 2010 年，它由 Adobe Systems 控制。最初由 Aldus 公司创建，称为“桌面出版”。TIFF 格式广泛应用于医学图像处理、图像处理、出版、扫描、传真、文字处理、光学字符识别及其他应用。收购了\
  \ Aldus 的 Adobe Systems 现在持有 TIFF 规范的版权。实验使用了图 9 所示的 12 张测试图像。用于嵌入的秘密消息如图 10 所示。\n\
  \n| Figure 9. 实验中使用的测试图像 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch006.f09](img/ch006.f09.png)\
  \ |\n\n| Figure 10. 实验中使用的秘密消息 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch006.f10](img/ch006.f10.png)\
  \ |\n\n秘密消息由 64 位 IIN（图像识别号）、160 位数字签名、48 位清单类型（包含视网膜各类改变的代码，例如 emboli 指栓塞表现）和 128\
  \ 位血管信息（包含视盘直径、杯盘比 (C/D) 和血管宽度细节）组成。最后，总信息量达 400 位 (Coatrieux, Maitre, Sankur, Rolland\
  \ & Collorec, 2000; Gonzalez & Woods, 2002)。因此，水印是作为与载体无关的水印生成的。实验针对第 1 节提到的所有关键需求进行。结果将在后续小节中分析和讨论。\n\
  \n########### 可逆性实验\n\n为了定量评估 MITWS 的可逆性，采用原始图像 (I) 与其提取版本图像 (I[E]) 之间的峰值信噪比 (PSNR)（单位：分贝\
  \ dB）作为参数。PSNR 由下式给出：\n\n```\nPSNR (I, I[E]) = 10 Log[10] [(2^(depth)-1)² / MSE]\
  \  (25)\n```\n\n![Mathtype978-1-7998-2701-6.ch006.m26](img/ch006.m26.svg)  (26)\n\
  \n其中 MSE 为均方误差，i=0 到 M-1，j=0 到 N-1。实验发现 MITWS 对任意大小的水印（容量）均具有可逆性。MITWS 产生的 PSNR\
  \ 为 100%，从而保证了可逆性。这证实了因嵌入而在原始图像中所做的更改因整数变换而完全可恢复。\n\n########### 不可见性实验\n\n上述 PSNR\
  \ 再次用于衡量方案的不可见性。此处 PSNR 取原始图像 (I) 与其加水印图像 (I[W]) 之间。实验发现 MITWS 的平均不可见性 PSNR 为 80.72%。这意味着\
  \ 80.72% 的原始图像未被改变，且在正常视觉下不产生任何外部伪影。较低的 PSNR 会产生伪影。然而，不可见性受容量限制。当容量增加时，不可见性降低。不可见性结果列于表\
  \ 3。\n\n**Table 3. MITWS 的不可见性**\n\n| ![Figure978-1-7998-2701-6.ch006.g03](img/ch006.g03.png)\
  \ |\n| --- |\n\n########### 篡改检测、篡改定位与脆弱性实验\n\n本实验根据文献调查 (Muharemagic & Furht, 2004;\
  \ Poonkuntran & Rajesh, 2014) 选取了 11 种攻击。包括抖动攻击、几何攻击和滤波攻击。这些攻击广泛针对图像认证 (Muharemagic\
  \ & Furht, 2004)。攻击说明如下：\n\n*   **Jittering Attack（抖动攻击）**：抖动攻击是任何类型水印系统常见的攻击。它通过以不易察觉的方式改变像素值或复制像素值来修改图像的像素值。因此，此类攻击在外部不会引起任何怀疑。在正常视觉下，人类无法察觉这些差异。实验中抖动等级建模为\
  \ 5% 到 95% 的 5 的倍数。\n*   **Average（均值滤波）**：返回图像的均值滤波输出。均值滤波可使用大小为 (M x N) 的掩码完成。M\
  \ 指行数，N 指列数。实验使用 3x3 掩码大小。\n*   **Disk（圆盘滤波）**：返回图像的圆形均值滤波输出。通过掩码和圆半径完成。掩码大小基于所用圆的半径定义。若圆半径为\
  \ R，则掩码大小为 (2xR+1) x (2xR+1)。实验使用的圆半径为 5。\n*   **Gaussian（高斯滤波）**：返回图像的旋转对称高斯低通滤波输出。通过掩码和\
  \ sigma 值两个参数完成。实验使用 3x3 掩码大小和默认 sigma = 0.5。\n*   **Laplacian（拉普拉斯滤波）**：用近似二维拉普拉斯算子形状操作图像并返回输出。拉普拉斯的近似形状由称为\
  \ alpha 的参数控制。实验使用 3x3 掩码大小和默认 alpha=0.2。\n*   **Log（高斯拉普拉斯滤波）**：返回图像的旋转对称高斯拉普拉斯滤波输出。实验使用的掩码大小为\
  \ 5×5。默认 sigma = 0.5。\n*   **Motion（运动滤波）**：返回运动滤波器的输出。运动滤波器用 l 个像素的线性运动和逆时针 theta\
  \ 度角的相机卷积图像近似。对于水平和垂直运动，滤波器变为向量。默认 l 为 9，默认 theta 为 0，对应水平移动 9 个像素。实验使用滤波器的默认值。\n\
  *   **Prewitt（Prewitt 边缘滤波）**：返回图像的 Prewitt 边缘滤波输出。\n*   **Sobel（Sobel 边缘滤波）**：返回图像的\
  \ Sobel 边缘滤波输出。\n*   **Unsharp（反锐化掩模）**：返回图像的 3x3 反锐化对比度增强滤波输出。\n*   **Rotate（旋转）**：将图像绕其中心点逆时针或顺时针旋转\
  \ angle 度。旋转图像使用双线性插值计算。最终旋转图像被裁剪以适应原始图像大小。实验使用两个角度值 25° 和 75°。\n\n对于上述所有攻击，实验均使用参数的默认值。原因是默认值规定了所有攻击的稳定行为。此外，这些是攻击的最低要求。\n\
  \n如果方案对攻击的最低要求是脆弱的，那么该方案对攻击的其他等级要求必定也是脆弱的。\n\n第一个实验针对抖动攻击。其中，加水印图像按 5 的倍数从 5% 修改到\
  \ 95%。同时测量相应水印中改变的比特数。结果发现 MITWS 平均改变约 38% 的水印以进行认证。结果列于表 4。\n\n**Table 4. MITWS：抖动攻击结果**\n\
