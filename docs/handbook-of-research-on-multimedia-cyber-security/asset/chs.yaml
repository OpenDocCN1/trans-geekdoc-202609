  \ | 0.9880 | - |\n\n结果表明，传统机器学习方法和深度学习方法在人类行为识别方面均取得了成功。然而，传统机器学习方法虽然可能在行为识别上达到最佳准确率，但需要对\
  \ ROI、分割和特征提取进行预处理；无法实现实时识别。Ji 等人 (Ji et al., 2013) 提出的 3D CNN 模型具有最高的准确率 90.2%，该模型不仅利用了视频帧的空间信息，还通过使用多个相邻帧捕获了时序运动信息。3D\
  \ CNN 模型可应用于实际场景中的实时识别。\n\n####### 结论\n\n在我们的实验中，我们实现了四种深度神经网络以比较结果。先前的研究采用传统方法进行人类行为识别。我们的研究表明，深度学习在未来可以得到改进。然而，目前仅考虑了空间信息，我们未考虑场景的时序信息。对于未来的工作，我们希望纳入时序信息，以避免对相似行为的误分类，使模型更适用、更稳健。\n\
