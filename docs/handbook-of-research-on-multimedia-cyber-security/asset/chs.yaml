  \n#### 第 1 章\n\n*   **Reinaldo Padilha França**  \n    坎皮纳斯州立大学 (UNICAMP)，巴西\n\n\
  *   **Yuzo Iano**  \n    坎皮纳斯州立大学 (UNICAMP)，巴西\n\n*   **Ana Carolina Borges Monteiro**\
  \  \n    坎皮纳斯州立大学 (UNICAMP)，巴西\n\n*   **Rangel Arthur**  \n    坎皮纳斯州立大学 (UNICAMP)\
  \ 技术学院 (FT)，巴西\n\n##### 摘要\n\n数据压缩是使用一种表示方法对数据进行编码的过程，该方法可减小数据的总体大小，当原始数据集包含某种类型的冗余时，这种减小成为可能。数据压缩也称为紧凑化，是减少存储或传输给定信息所需数据量的过程，通常使用编码技术。多媒体压缩是采用工具和技术来减小各种媒体格式的文件大小，从而占用更少的空间。下载和上传压缩文件所需的时间都少得多。数据压缩是促进信息和通信技术巨大增长的因素之一。没有压缩，大多数如今司空见惯的消费和娱乐科技产品将永远不会问世。本章提供了多媒体压缩的最新综述，展示并探讨了其成功关联，并附有简明的文献背景，对这两种技术的潜力进行了分类和综合。\n\
  \n##### 引言\n\n互联网用户消费的多媒体内容越来越多。据估计，到 2020 年，视听格式将占在线内容的 80%。然而，文件通常很大，可能无法在所有设备上轻松运行，因此了解什么是音频和视频压缩至关重要\
  \ (Kaplan et al., 2014)。\n\n数据压缩是使用一种表示方法对数据进行编码以减小数据总体大小的过程。当原始数据集包含某种类型的冗余时，这种减小成为可能。数据压缩也称为紧凑化，是减少存储或传输给定信息所需数据量的过程，通常通过使用编码技术实现。多媒体压缩是采用工具和技术来减小各种媒体格式的文件大小。压缩包含减小信息块的物理大小。压缩器使用一种算法，通过考虑将要压缩的数据类型的特定因素来优化数据。因此，有必要解压以重建原始数据，这要归功于与压缩所用算法相反的算法\
  \ (Sayood, 2017)。\n\n压缩方法本质上取决于要压缩的数据类型，即压缩图像的方式与压缩音频文件的方式不同。它是减少文件中的大量数据，使其占用设备内存的空间更少，或需要更少的宽带传输。它可以是有损或无损的，尽管大多数都会消除一些几乎难以察觉的细节。然而，音频和视频的压缩程度越大，通常会导致质量越低；在压缩声音文件时，它会减少或简化比特重复，并消除人耳认为难以察觉的数据\
  \ (Sayood, 2017; Uthayakumar et al., 2018)。\n\n现代技术探索人耳的感知，提供一种表面上没有损失的压缩。最流行的是\
  \ FLAC（免费无损音频编解码器：无损压缩），与大多数不同，它不会删除声音文件中的任何信息，但可以将其体积减小高达 50%。尽管体积减小，它仍可能比 MP3\
  \ 格式重达十倍；ALAC（Apple Lossless；无损）：由苹果公司开发的音频数据压缩；MP3（MPEG-1/2 Audio Layer 3，有损）最流行的音频压缩格式，大幅减小了文件大小并仍保持了其质量。它于\
  \ 2017 年正式停止授权，但仍非常流行；Ogg Vorbis（有损）一种音频格式，提供比 MP3 更低的比特率和更高的质量。它分为两部分，Ogg 负责文件的元数据，Vorbis\
  \ 是压缩歌曲的编码器；AAC（有损）旨在成为 MP3 的继任者，AAC 是 iPhone、iPad 和 PlayStation 等设备上播放音频的标准格式 (Uthayakumar\
  \ et al., 2018; Siegert et al., 2016; Firmansah et al., 2016; Ahmed et al., 2018;\
  \ Hennequin et al., 2017; Hennequin et al., 2017)。\n\n与音频一样，视频压缩涉及减小文件大小，但在这种情况下是移除已经投影的部分。当无损发生时，图像的任何部分数据都不会被丢弃。在有损压缩中，比特会被选择性地丢弃。实现这一点的方法之一是减少帧数，通常与电视相同（每秒\
  \ 30 帧）。一些最流行的压缩格式有 MKV (Matroska Video)，广泛用于高分辨率视频，MKV 提供有效的压缩并保持质量。为此，编解码器将音频、视频和字幕轨道封装到单个容器中；MPEG\
  \ (Moving Picture Experts Group) 由 ISO 定义为标准视频压缩格式，它可以在 MPEG-1（用于 VCD）、MPEG-2（DVD）和\
  \ MPEG-4 之间变化；AVI (Audio Video Interleave) 与 MKV 一样，AVI 将音频和视频封装在单个容器中。因此，两者可以同步播放。由于它是由微软生产的，该格式在\
  \ Windows 上易于运行，并被兼容 DivX 编解码器的 DVD 和蓝光播放器识别 (Sayood, 2017; Chalmers et al., 2016)。\n\
  \n除了占用更少的空间外，下载和上传压缩文件所需的时间也少得多。当你想在社交网络上发布一些视频文件时，这会容易得多。音频和视频压缩也使流媒体成为可能。没有它，许多流媒体平台和社交网络将不会拥有目前的知名度和盈利能力。因此，数据压缩是促进信息和通信技术巨大增长的因素之一。没有压缩，大多数如今平常的消费和娱乐科技产品将永远不会问世\
  \ (Burroughs, 2019)。\n\n事实上，多媒体压缩技术允许您更高效地表示信息，减少所占用的大量存储空间，从而减少在网络和互联网上传输所消耗的带宽。因此，本章旨在提供多媒体压缩的最新综述，展示并探讨其成功关联，并附有简明的文献背景，对这两种技术的潜力进行分类和综合。\n\
  \n####### 方法论\n\n\n\n\n\n###### 研究综述\n\n本研究基于 66 篇涉及多媒体和多媒体压缩主题的科学文章和书籍，主要探讨了历史回顾和相关技术的适用性。这些文献的分析依据为发表日期在\
  \ 5 年以内，重点关注 IEEE 和 Google Scholar 等知名数据库中的出版物和索引。\n\n########## 结果\n\n随着技术进步和手机、平板电脑、计算机等产品的普及，传输和存储的信息量（如图像、语音和视频）不断增长。因此，通信网络的带宽和/或存储容量需求需要最小化。鉴于此，信号需要高效编码以适应传输信道限制和存储内存限制。高速信息和通信系统的技术发展促使分布式系统领域出现了新应用。这一背景下的主要趋势之一是将文本、语音、图像和视频等不同类型的媒体集成到广泛的分布式计算应用中（如远程教学、电子出版、协同工作，以及目前的娱乐传播）（Hashem\
  \ et al., 2015; Jeschke et al., 2017）。\n\n多媒体是本十年最常用的术语之一，该术语处于计算机、电信、广告、音视频设备消费者、电视和电影产业这五大领域的交汇点。这些强大产业的极大兴趣推动了多媒体的飞速发展。多媒体也被视为关注计算机控制下文本、图形、图像、视频、动画、声音及任何其他媒介集成的领域，所有类型的信息均可在其中表示、存储、传输和数字化处理。多媒体系统是指能够以数字形式同步处理至少一种离散媒体类型和一种连续媒体类型的系统。已捕获媒体是从现实世界捕获的信息，如图像、视频和声音；相对地，合成媒体是由计算机合成的信息，如文本、图形和动画。这两类媒体均为多媒体应用，其中音频、视频和图像是自然的通信手段。多媒体系统广泛应用于教育/培训、娱乐、医疗、健康、点播媒体、电子商务甚至电子政务等所有需要使用、通信和共享这些媒体的领域（Hanjalic,\
  \ 2017; Alvi et al., 2015）。\n\n值得注意的是，在多媒体主题中存在离散媒体，即静态（或块）媒体，由独立于时间的信息项组成。这些媒体具有唯一的空间维度，如文本、图像、图形，时间不是信息语义的一部分，下载是恢复离散媒体的操作，其流量具有突发性。正如连续媒体是动态（或时变）媒体，信息项之间的时间或时序依赖性是信息本身的一部分，它们具有时间维度，如音频、视频和动画。如果不遵守语义依赖性，其含义可能会改变。流式传输是指连续媒体在接收的同时直接发送并呈现给目的地（实时），其流量可以是\
  \ CBR（恒定比特率）或 VBR（可变比特率）（Kaae, 2017; Baroňák et al., 2017）。\n\n多媒体数据具有时间维度，即必须以固定速率传输、处理和呈现，其处理和通信必须满足实时要求，多媒体应用使用多种媒体类型，必须保持媒体间的时空关系。多媒体数据量大，必须压缩，需要高速网络和强大计算机。尽管多媒体数据缺乏明显的语法和语义，传统数据库无法有效支持多媒体数据，因此需要索引、检索和识别多媒体信息的技术。总体而言，在当今现代世界，多媒体广泛存在于交互式互联网应用和娱乐应用中，此类应用要求对非常规对象进行编码、存储和操作、长对象操作、连续数据传输和高数据速率，以及对数据的同步访问（Ohm,\
  \ 2015）。\n\n####### 数据压缩\n\n计算机上的文件大小以 Bit、Byte、Kilobyte、Megabyte、Gigabyte 表示，目前\
  \ Terabyte 也很常见（均为 1024 的倍数）。通常，文本文件比图像、视频和声音文件小得多，因为后者在原始格式下非常庞大。创建后，我们必须存储它们，无论是为了本地打印还是传输，都需要合适的介质，如\
  \ CD 和 DVD。但图像和视频需要大量数据来表示/存储，并需要大带宽来传输。因此，数据压缩对于使信息占用可接受的磁盘空间并以合理的传输速率通过网络传输至关重要。如果没有近年来压缩算法及其实现的显著进步，就不会有今天的多媒体（Sayood,\
  \ 2017; Cato, 2015）。\n\n另一个问题是为互联网使用准备这些数据，数据需要以一定速度传输并保持最低性能，特别是视频，我们希望获得实时观看的感知，最广泛使用的解决方案之一是数据压缩。顾名思义，压缩文件意味着将其缩小、变轻，为了实现这一点，我们必须使用消除冗余的技术。多媒体（音频和视频）压缩是使多媒体文件能在\
  \ PC、手机和平板电脑上播放和存储的技术。我们可以看到压缩在任何多媒体应用用户生活中的巨大重要性，包括一些当代且广泛使用的互联网应用，通常依赖某种流式系统，甚至数字游戏播放器。尽管通信和计算能力不断扩展，但对新多媒体应用的需求增长迅速，传输和存储成本趋于降低。然而，存储设备的速度仍然限制了时变媒体（特别是视频）的呈现，因此有必要制定标准以促进互操作性和硬件实现（ZainEldin\
  \ et al., 2015; Berres et al., 2017）。\n\n数据压缩是对特定信息集进行编码，使生成的代码比源数据更小。压缩技术的使用对多媒体应用显然至关重要。有两个原则：压缩原则，指对数据集编码以生成比源数据更小的最终代码；数据冗余（或相关性）消除原则，即利用人类解读数据的方式，如相邻音频采样、静音消除、数字图像中扫描或采样行的相似性、视频中区域的相似性。因为多媒体对象可能需要不可用的网络带宽，即由于传输的数据量（或连接时间），网络上发送的数据越少，成本越低。多媒体数据压缩技术基本上探索两个因素：数据冗余和人类感知特性（Gupta\
  \ et al., 2016; Wu et al., 2017）。\n\n\n\n\n\n######## 数据冗余\n\n数据冗余涉及后续的音频和图像采样（用于视频）并非完全不同。因此，数字音频是一系列采样值；数字图像是采样值（像素）的数组，而数字视频是以特定速率呈现的一系列图像。由于序列或矩阵中相邻值通常以某种方式相关。这种相关性称为冗余。移除这种冗余不会改变数据的含义；仅仅是消除了数据复制（Wu\
  \ 等，2017；Terplan & Morreale，2018）。\n\n######### 时间冗余\n\n时间冗余在于利用构成动态图像的连续帧之间的相似性。一个实际的例子是高尔夫球手击球的图像，在发球后，连续帧之间的差异仅在于任意给定时刻球的位置。这样，算法将发送一帧完整图像的信息加上有效的动态图像位移矢量。运动补偿基于后续图像之间的相似性，仅允许传输差异。这种方法可以理解为用一幅图像减去其前一帧（Wu\
  \ 等，2017；Wien，2015）。\n\n######### 空间冗余\n\n另一方面，空间冗余或空间频率在于图像相邻像素的相似性。一个可能的类比是飞机在无云的天空中飞行，需要传输的相关信息是飞机，而背景是蓝色图像中内容实际上均匀的部分。基于这一物理概念，即消除高频不会导致图像出现明显的质量下降（Wu\
  \ 等，2017；Rasch 等，2018）。\n\n######## 熵减少\n\n虽然“压缩”一词并不意味着损失，然而，在计算机科学中，该表达指的是外部因素作用使系统压力增加的过程。\n\
  \n在熵减少中，使用的算法负责寻找最佳解决方案，即尽可能移除更多比特，以保留“想要展示”的内容。在这种压缩类型中，质量通常会妥协，因为从原始文件中提取了比特，作者根据需要应用压缩比，最高可达\
  \ 1:200。这是互联网兼容性最常用的类型；一个非常常见的例子是 JPG 格式（Sikora，2018；Wang & Yao，2016；Wu 等，2015）。\n\
  \n######## 冗余减少\n\n然而在冗余减少中，数据仅被压缩，算法消除冗余。当需要保持质量时使用它们，即数据被重新排列，可还原为其原始形式。这些算法通过重新排列比特工作，例如存在\
  \ `zzzzzzzz`（8 个相等的字节）的地方，现在存储为 `8z`（2 个字节）。压缩比在 1:2 到 1:4 之间，因此文件体积缩减不大；实际应用于 ZIP\
  \ 格式（Wang & Yao，2016；Joshi 等，2017）。\n\n######## 压缩技术\n\n压缩基本上是改变某些数据的表示形式以减小其体积，且不损失质量，或者即使存在损失也是极小的。因此，当数据减少导致信息丢失时，会针对图像、音频和视频等特定信号使用一些技术；即感知无损压缩，人类无法察觉（MP3）。有损压缩旨在使原始数据的一个版本能被检索出来，并被用户感知为与原始数据足够相似，因为人眼和耳朵无法察觉信号质量的微小损失。如果信息压缩后能被精确重构，则称该压缩技术为无损。这种技术必须用于压缩法律或医疗程序和文档。无损压缩技术并非新想法；它们被广泛使用。这些技术仅利用数据统计（数据冗余），压缩比通常较低。这类压缩的一个例子是用特殊标志和出现次数替换连续的空格字符或零（Gregor\
  \ 等，2016）。\n\n无损技术的例子包括算术编码、霍夫曼编码和游程编码。有损压缩技术用于音频、图像和视频压缩，这些场景下错误和损失是可容忍的。这些技术通常基于数据统计和人类感知特性。借助它们，可以获得较高的压缩比。作为无损技术的例子（用于音频和视频编码）有游程编码，基本上是一行值相等的符号；霍夫曼编码是一种压缩文件的算法，特别是文本文件，给更频繁的符号分配较短的码，给较少频繁的符号分配较长的码，需记住码是一组比特；Lempel-Ziv，是由\
  \ Terry Welch 开发的 Lempel-Ziv 变体，实现于 GIF 格式用于图像存储（Hidayat 等，2018）。\n\n作为有损技术的例子，有小波变换，是一种能够分解和描述或表示另一个函数（或数据集）的函数，后者原本在时域（或另一个或多个自变量，如空间）中描述，以便我们可以在不同的频率和时间尺度上分析这个其他函数；矢量量化可视为标量量化在多维空间中的扩展，基于香农的速率-失真理论，根据该理论，对采样块（即矢量）进行编码比对单个（即标量）采样进行编码能获得更好的性能，量化是信号压缩系统中的相关技术。其目的是将信号的采样值数字化。同样，按传输数据量（或连接时间）收费的网络用户，将从网络上发送数据量的减少中受益（Chui，2016；Pagès，2015）。\n\
  \n######### 域减少\n\n域减少简单地丢弃少量采样。一个应用示例是数字视频标准，采用 4:2:2、4:2:0 格式，其中亮度信息比色度更重要，因此色度采样数量可以较少；类似地，图像压缩通过增加像素大小来降低几何分辨率；也应用于数字视频标准。\n\
  \n######### 量化空间减少\n\n量化空间减少减少每个采样的比特数，在图像压缩中有实际应用，其中原始图像每像素 24 位（1600 万色）可压缩为每像素\
  \ 8 位（256 色），通过在代码之间建立映射来实现（Onggosanusi 等，2015）。\n\n######### 差分编码\n\n差分编码或相对编码，当一个采样的幅度很大，但连续采样之间的幅度差异相对较小时，不是编码每个采样的值，而是编码其值与前一个值的差值，使用更少的比特并获得相同的误差。在差分脉冲编码调制（DPCM）和自适应差分脉冲编码调制（ADPCM）等实际传输应用中使用（Wu\
  \ & Rao，2017）。\n\n######### 子带编码\n\n子带编码是将信号通过带划分为若干个分别编码的子带，更精确地处理信号中最重要的子带。例如，语音信号，如\
  \ Hz（音质和音色及每采样 8 位，低信息量为每采样 2 位，具有识别度和可懂度及更大信息内容如金属音，每采样 3 位）（Aydin & Foroosh，2017）。\n\
  \n######### 变换编码\n\n变换编码将数据变换到另一个数学域，在该域中可应用最佳压缩技术，即傅里叶变换将时域信号变换到频域。然而，必须存在逆变换，其中有效的数据约简变换为\
  \ DCT - 离散余弦变换（JPEG）和 FFT - 快速傅里叶变换（MPEG 音频）（Sikora，2018）。\n\n\n\n\n\n######## 向量量化\n\
  \n向量量化构建一个表（或使用预定义的表），其中包含出现频率最高的值的集合（默认值）。对于每个块，都会查询该表以找到最相似的模式，因此每个块都用向量的索引进行编码。解码器必须知道相同的表，并使用索引来生成原始数据流的近似值（Guo\
  \ 等，2017）。\n\n######## 多媒体数据压缩\n\n多媒体中使用的大多数文件都包含重复信息，压缩所做的无非是组织并消除这些冗余。多媒体数据压缩的主要目标是减少存储空间以及减少传输时间。\n\
  \n######## 音频\n\n######### 预测编码与静音移除\n\n在许多情况下，相邻的音频采样是相似的，未来的采样并不完全不同于过去的采样；下一个值可以根据当前值进行预测。利用这一音频特性的压缩技术称为**预测编码**。预测压缩技术基于这样一个事实：可以存储前一个采样并利用它来帮助构建下一个采样。\n\
  \n在数字语音的情况下，存在另一种类型的冗余，假设你不会一直说话。在信息爆发之间，存在静默时刻。在知道该时段得以保留的前提下，这段静默期可以在不丢失信息的情况下被抑制。这些压缩技术称为**静音移除**（Gibson,\
  \ 2016）。\n\n######### 采样与量化\n\n声音经过滤波、采样和量化后，便处于数字格式，而且是人耳可听的，因此通常被称为音频。采样过程以称为**采样频率**的频率观察原始（模拟）声音信号，该频率决定了在\
  \ 1 秒间隔内将进行多少次（等间距）观察。此过程用等间距的值对 x 轴进行离散化。\n\n根据**奈奎斯特-香农采样定理**，要使采样信号能够完美重建，采样频率必须等于或大于组成原始信号的最高频率的两倍。由于人耳可听频谱范围在\
  \ 20 Hz 到 20 kHz 之间，因此采样频率必须至少为 40 kHz，以便将原本限制在该频谱范围内的信号完美重建。利用这一原理，CD 使用 **44100\
  \ Hz**，在此介质中满足这一条件。请注意，采样频率越高，存储该信号所需的内存空间就越大。\n\n量化过程则对 y 轴进行离散化，从而采用一组有限的可能值供每个音频采样假定。决定不同可能值数量的是分辨率位深；**2\
  \ 位**允许使用 **4** 个不同的值；**3 位**允许 **8** 个值；**4 位**允许 **16** 个值，以此类推（Sayood, 2017;\
  \ Chion, 2019; Sanders, 2017）。\n\n######### CD 音频规格\n\n对于 CD，使用 **16 位**，即每个采样有\
  \ **65536** 个不同的可取值。仍按 **44100 Hz** 采样频率和 **16 位** 位深计算，单声道音频信号每秒将需要 **705,600 位**（或\
  \ **88200 字节**）。对于一首 **5 分钟的歌曲**（或 **300 秒**），总计将是 **26,460,000 字节**，即每个音频通道约消耗\
  \ **25.2 兆字节**。由于 CD 有 **2 个音频通道**（即立体声），一首歌将占用 **50.4 MB**。\n\n如果我们想基于比特率进行分析，其度量单位通常以\
  \ **kbps** 给出，考虑到该音频每秒消耗的千比特数，每个音轨的结果为 **705.600 位/秒**。此时比特率约为 **1411 kbps**。请注意，比特率会干扰所听音频的质量，这一指标与用户收听音频时的体验质量相关（Sayood,\
  \ 2017; Chion, 2019; Sanders, 2017）。\n\n######### 流媒体服务与压缩效率\n\n流媒体服务与上述场景完全相关，免费计划用户可访问约\
  \ **128 kbps** 比特率的音乐，而付费用户通常可访问 **256 kbps**、**320 kbps** 或高达 **1411 kbps** 的音乐。然而，对于绝大多数非发烧友用户来说，**128\
  \ kbps** 的音乐已经足够好听且令人愉悦。\n\n值得注意的是，确保流媒体服务运行所需的最小理论带宽必须高于音频比特率。需要额外带宽（超出服务比特率的部分）来妥善使用**缓冲区**，可用的额外带宽越多（同时也遵守服务器限制），缓冲区填充得就越快。\n\
  \n**MP3** 并非唯一存在的压缩音乐格式，但无疑是最著名的。如果使用 **MP3** 以 **128 kbps** 的恒定速率压缩相同的 **5 分钟白噪音立体声**\
  \ 音频，结果将是一个仅略大于 **4.5 MB** 的小文件。基于 **WAV** 文件占用的 **50.4 MB** 空间，此 **MP3** 版本实现了约\
  \ **91% 的压缩效率**。从计算机网络的角度来看，关注比特率可以更容易地理解这种压缩的重要性（Sayood, 2017; Chion, 2019; Sanders,\
  \ 2017）。\n\n######### 音频格式：有损与无损\n\n数字音乐随着时间的推移有了巨大发展。**MP3** 文件是使用最广泛的音频文件，但还有更多格式正变得越来越流行，如\
  \ **FLAC**、**WAV** 和 **AAC**。在这些文件中，有**有损格式**，从 CD 导入到计算机时会丢失数据。这一压缩过程的好处是文件体积缩小。**MP3**\
  \ 和 **AAC** 是此类格式的例子。\n\n也有**无损格式**，这些格式与 CD 相比不显示质量损失。然而，文件大小平均占用四倍以上的空间。此外，iPod\
  \ 和 MP3 播放器不支持此类别中的主流音频格式（**FLAC** 和 **WAV**）（Dittmar, 2017; Kim & Rafii, 2018）。\n\
  \n######### MP3 与 AAC 对比\n\n**MP3** 是互联网上的主要音频文件，并受所有音乐播放器支持。尽管它是有损文件，但如果 **MP3**\
  \ 文件的比特率为 **224-320 kbps** 或 **192 kbps**，你几乎无法将其与 CD 区分开来。\n\n**AAC**（高级音频编码）得益于苹果而越来越流行。尽管\
  \ iPod 和 iPhone 支持 **MP3**，但它们的默认格式是 **AAC**。与 **MP3** 格式一样，**AAC** 格式也有数据丢失。\n\n\
  **MP3** 和 **AAC** 的区别在于 **MP3** 格式的采样频率为 **16 至 48 kHz**，而 **AAC** 为 **8 至 96 kHz**。**AAC**\
  \ 的通道数也更多，**48** 个对比 **5.1**。**AAC** 的压缩比也能带来更高的质量和更小的文件（Britanak & Rao, 2018）。\n\
  \n\n\n\n\n######## 音频格式\n\n######### FLAC\n\nFLAC 是 **Free Lossless Audio Codec**（免费无损音频编解码器）的首字母缩写，顾名思义，它是一种无损音频格式。这种格式已变得流行，被希望在电脑上保存\
  \ CD 收藏的用户所使用。已有支持此类文件的便携式播放器。任何人都可以自由使用 FLAC。\n\n######### WAV\n\nWAV 由微软公司创建，但也兼容\
  \ Macintosh。它包含与 FLAC 相同的质量，但作为一种鲜为人用的格式，其体积平均是 FLAC 文件的两倍。\n\n######### MPEG-1（三层）\n\
  \nMPEG-1 由 Fraunhofer IIS 研究所创建，对应一种三层压缩方案。音频数据压缩存在大量损失，仅受限于人耳预期的质量。默认压缩比为 10:1。\n\
  \n######### HD-AAC\n\nHD-AAC 是 AAC 的继任者，为提取的音频文件提供高质量。该格式提供了新的音乐存储能力，因为它压缩率较低，且受\
  \ iPod 和手机支持。与 CD 相比（CD 采用 16 位压缩和 44.1 kHz 采样率），该格式提供了更好的质量。其优势在于保留了原曲的所有比特信息，得益于\
  \ 96 kHz 采样率和 24 位压缩。\n\n######### WMA\n\nWMA 是 **Windows Media Audio** 的首字母缩写，由微软创建。它允许创建比\
  \ MP3 小 50% 的文件，但会有轻微的质量损失（Britanak & Rao, 2018; Rai & Sathuvalli, 2017）。\n\n#########\
  \ MPEG-2\n\nMPEG-2 是一种高级音频编码格式，是 MPEG 最新的感知声音编码标准。它使用一种涉及众多技术的复杂编码系统，其中包括：霍夫曼编码；量化与缩放；M/S\
  \ 矩阵；强度立体声；耦合通道；反向自适应预测；时域噪声整形；修正离散余弦变换；增益控制和混合滤波器组（多相正交滤波器）（Britanak & Rao, 2018;\
  \ Rai & Sathuvalli, 2017; Cardozo et al., 2018）。\n\n######### VQF / TwinVQ\n\n正如\
  \ VQF 格式一样，与 MP3 相比，编解码需要更快的计算机。**Transform-domain Weighted Interleave Vector Quantization\
  \ (VQF)** 或 **TwinVQ** 是来自 YAMAHA 的专有音频压缩格式。由于 VQF 格式的高压缩比，最终文件大小比同质量的 MP3 文件小约\
  \ 30%（以 128kbps 码率编码的 MP3 为基准）。在三种格式中，它具有最好的最终质量（最接近原版）。然而，其最大问题之一是存在多个直接不兼容的版本（显著的编码差异）。尽管质量较低，但\
  \ MP3 更受欢迎，因为可用的音乐和软件更多（Britanak & Rao, 2018; Rai & Sathuvalli, 2017; Cardozo et\
  \ al., 2018）。\n\n######## 音频编解码器\n\n音频编解码器是编码器与解码器（压缩器/解压缩器）的结合，用最少的比特量表示高质量音频信号，从而减少存储空间和带宽。在某些语境下，音频编解码器指声卡的硬件实现。按此用法，音频编解码器指将模拟音频信号编码的设备。\n\
  \n根据压缩类型，分为**有损音频编解码器**和**无损音频编解码器**：\n\n- **有损音频编解码器**：编码声音，通过牺牲质量换取更高的压缩比。许多此类编解码器作用于\
  \ MP3、AC3 和 WMA 文件时质量损失可忽略不计。\n- **无损音频编解码器**：编码声音，压缩文件且不改变质量。此类编解码器生成的编码文件比原始文件小\
  \ 2 到 3 倍。广播电台普遍使用，作用于 FLAC、Shorten、WavPack 文件（Hennequin et al., 2017, March）。\n\
  \n############ 图像格式\n\n######### 图像基础\n\n图像可理解为像素数组。以 RGB（红、绿、蓝）模式为例，每个像素可用一个三维向量表示，每个分量对应一个颜色通道的值。通常使用\
  \ 8 位色深，即每个像素的 3 个颜色通道各接受 0 到 255 之间的整数值。\n\n在数字图像中，扫描线上的相邻采样点和相邻行上的相邻采样点是相似的。这种相似性称为**空间冗余**。可通过预测编码或其他编码技术去除。\n\
  \n现代常规显示器普遍采用所谓的 **Full HD（或 FHD）**，分辨率为 1920x1080。该分辨率表示像素矩阵的大小：1920 列、1080 行。行数乘以列数得\
  \ 2,073,600 个像素。按 8 位（1 字节）表示每个颜色通道计算，每个像素需 3 字节；一张 Full HD 图像约需 6,220,800 字节，即约\
  \ 6 MB（Wu & Rao, 2017; Stearns & Hush, 2016）。\n\n######### JPEG\n\n**JPEG（Joint\
  \ Pictures Expert Group）** 是通过电子邮件发送图像的最佳格式。它诞生于 1983 年，最终成为最流行的互联网标准之一。JPEG（也称\
  \ JPG）文件体积相对其他格式较小，便于存储和分发。它将数据压缩得更小，但会导致图像质量损失，最常用于文件大小比最大图像质量更重要的场景（如网页、博客、电子邮件、相机存储卡等）（Wu\
  \ & Rao, 2017; Stearns & Hush, 2016; Kaur & Choudhary, 2016）。\n\n######### GIF\n\
  \n**GIF（Graphics Interchange Format）** 是互联网上另一种非常常见的格式。它体积轻巧，因动态摄影（动画 GIF）而闻名。推荐给需要在互联网上传播大量图像的人，因为它生成的文件很小；也适合不关心低色彩图像的人，因为\
  \ GIF 仅支持 256 色方案（8 位），所以不常用于照片。\n\nGIF 创建于 1987 年，由 CompuServe 在 8 位计算机视频早期设计，甚至早于\
  \ JPG，用于拨号调制解调器连接速度下的查看。它不适合 24 位彩色照片，因此不要将 GIF 用于当今的彩色照片，色彩非常有限。但 GIF 仍非常适合网络图形（色彩数量有限）。尽管因色彩数量少似乎受限，GIF\
  \ 因其某些特性而被广泛使用。其用途主要在图标、插图（主要是黑白）和小动画。它还允许保存透明背景文件和无损压缩（Wu & Rao, 2017; Stearns\
  \ & Hush, 2016; Kaur & Choudhary, 2016）。\n\n######### PNG\n\n**Portable Network\
  \ Graphics (PNG)** 与 GIF 不同，支持更多颜色。它是 GIF 的竞争对手。1996 年出现，具备使 GIF 广受接受的特性：动画、透明背景和无损压缩（即使反复保存），支持数百万色而非仅\
  \ 256 色，是照片的绝佳选择。\n\nPNG 的额外特性是 24 位 RGB 图像的透明度。通常 PNG 文件比 TIF 略小（两者均使用 LZW 进行无损压缩，但压缩类型不同），但\
  \ PNG 读写可能稍慢。它仍不如 TIF 或 JPG 广泛使用，但却是无损质量工作的另一个好选择（Wu & Rao, 2017; Stearns & Hush,\
  \ 2016; Kaur & Choudhary, 2016）。\n\n######### BMP\n\n位图可支持数百万色并保留细节，但因不使用压缩，文件极大。若想给朋友发照片，请忘掉\
  \ Bitmap。该格式因文件未压缩，导致在互联网上传输图像缓慢。BMP 是一种历史格式，随 Windows 操作系统出现。BMP 图像范围从黑白（每像素 1\
  \ 位）到 24 位色彩（1670 万色）（Wu & Rao, 2017; Stearns & Hush, 2016; Kaur & Choudhary, 2016）。\n\
  \n\n\n\n\n######## 图像文件格式\n\n######### 标签图像文件格式 (TIFF)\n\n标签图像文件格式 (TIFF) 最常被图像专业人士使用。它是大多数平面设计师用于编辑和打印的首选文件类型。它们几乎没有压缩或无压缩，且不丢失任何细节，尽管文件可能相当大。除网页外，TIF\
  \ 是最通用的格式，因为某些浏览器不显示 TIF 图像。它也广泛用于扫描（扫描仪和传真）。它提供大量的色彩和出色的图像质量，导致文件体积较大。它还允许使用图层（如原始\
  \ Photoshop PSD 文件）并支持透明背景 (Wu & Rao, 2017; Stearns & Hush, 2016; Kaur & Choudhary,\
  \ 2016)。\n\n######### RAW\n\nRAW 是某些数码相机的标准，但它不是必需的格式，您可以在 JPG 或 PNG 标准之间进行选择。之所以称之为“原始”，是因为它不包含任何特效或调整。因此，它提供高图像质量和更大的色彩深度。由于该模式下的文件是“纯净”的，编辑者可以自由地按捕获时的方式使用图像，并应用自己的特效或调整，通常能生成非常好的照片\
  \ (Wu & Rao, 2017; Stearns & Hush, 2016; Kaur & Choudhary, 2016)。\n\n######### 可交换图像文件格式\
  \ (EXIF)\n\n可交换图像文件格式 (EXIF) 是一种类似于带有 TIFF 扩展的 JFIF 格式的文件标准，它被合并到大多数相机使用的 JPEG 写入软件中。其目的是记录并标准化数码相机图像与其编辑和查看软件之间的元数据交换。元数据记录在单个图像中，包括相机设置、日期和时间、快门速度、曝光、图像尺寸、压缩、相机名称和色彩信息等。当图像被图像编辑软件查看或编辑时，所有这些信息都可能被显示\
  \ (Wu & Rao, 2017; Stearns & Hush, 2016; Kaur & Choudhary, 2016)。\n\n######### SVG\
  \ (可缩放矢量图形)\n\nSVG (可缩放矢量图形) 是一种矢量图像文件。它是一种开放格式，由 W3C 开发，于 2001 年出现。它不基于像素，即组成图像的“点”，而是使用\
  \ XML 语言来描述文件应有的外观。适用于静态和动态图像。作为矢量图，图像可以放大或缩小而不造成质量损失。CDR 图像（来自 CorelDraw 程序）也是同样的情况\
  \ (Wu & Rao, 2017; Stearns & Hush, 2016; Kaur & Choudhary, 2016)。\n\n######### WebP\n\
  \nWebP 是一种使用有损压缩的新图像格式。它由 Google 设计，旨在减小图像文件大小以加快网页加载速度：其主要目的是取代 JPEG 成为网页照片的主要格式。WebP\
  \ 基于 VP8 帧内编码，并使用基于 RIFF 的容器 (Wu & Rao, 2017; Stearns & Hush, 2016; Kaur & Choudhary,\
  \ 2016)。\n\n######## 视频\n\n######### 视频基础\n\n视频是一组图像，例如，位图（帧）以特定速度按顺序播放，以传达运动的概念。每秒播放的图像数量通常称为帧率或每秒帧数\
  \ (nfs)。在视频的情况下，有大量的移动图像，并且可以包含音频。以全高清和 24 FPS（每秒帧数）标准的视频为例，这常用于电影。这相当于每 24 秒的视频以等间隔序列显示。以未压缩场景为例，假设每张图像占用\
  \ 6 MB，外加 WAV 音频比特率为每秒立体声 0.2 MB。对于一部 2 小时的电影（或 7200 秒），将显示 172,800 张图像。仅图像就会消耗\
  \ 1,036,800 MB（接近 1 TB）。音频单独消耗 1440 MB。值得注意的是，就所需空间而言，音频可以忽略不计。无论如何，一部电影大约需要 1 TB\
  \ 的存储空间（如果通过流媒体观看则为流量） (Kaur & Choudhary, 2016; Owens, 2017)。\n\n如果通过流媒体播放，甚至连 1\
  \ Gbps 的连接都不足以确保视频不间断播放，这意味着普通终端用户无法享受此类服务，即使电影托管在本地服务器上，因为终端用户的网卡通常限制在 1 Gbps（甚至老旧机型仍为\
  \ 100 Mbps）。尽管如此，Netflix、YouTube 和 Twitch 等服务很可能已享受比示例中引用的更高分辨率甚至更高帧率的服务，其中关键因素正是所使用的压缩技术，它在确保极佳图像质量和高运动流畅度的同时，使用户无需依赖难以置信的强大连接\
  \ (Kaur & Choudhary, 2016; Owens, 2017)。\n\n######### 压缩视频格式\n\n########## 视频压缩原理\n\
  \n视频压缩是指**冗余减少**，即帧的某些区域具有跨越多个像素的相同颜色（空间冗余）；当场景或其部分主要包含垂直方向的物体时，两条相邻线极有可能相同（空间冗余）；同样，某些像素在多帧中重复的图像（时间冗余）。标准清晰度视频最多有\
  \ 480 条可视线，而高清视频高达 1,080 条。高清视频更清晰，尤其是在大屏幕上观看时 (Bovik, 2010; Wu et al., 2018; Wu\
  \ et al., 2018; Baraniuk et al., 2017)。\n\n########## MPEG 标准\n\nISO 成立了**动态图像专家组\
  \ (MPEG)** 以制定数字视频标准，创建于 1988 年。压缩同时发生在视频和音频中，比特率范围从 1.5 Mbps 到 60 Mbps（MPEG1、MPEG2\
  \ 和 MPEG3（后被废弃））。显示视频从 30 帧/秒高达 60 fps。MPEG-1 是用于 VCD 制订的标准，分辨率为 352 x 240，质量略低于录像带。MPEG-2\
  \ 是 DVD 标准，分辨率为 720 x 480 或 1280 x 780，质量极佳，是数字电视中最流行的使用方法。MPEG2 过程的基本原理是使用人眼难以察觉的降低图像质量的技术，以及不影响图像质量的技术，主要通过消除信息冗余的过程。MPEG-4\
  \ 与 MPEG-1/2 的线性音视频编码不同，它是基于对象对视听场景进行编码，例如一辆移动的汽车、一张狗的照片，以及一个图像或音频对象，如乐器或声音，因此我处理视听对象。它是创作、多媒体、游戏、视频会议、移动通信、交互式图形应用和\
  \ WWW 的当前标准。它质量良好，广泛用于窄带 (Shree, 2016; Paikray et al., 2018)。\n\n########## VCD\
  \ 与 SVCD\n\nVCD (Video Compact Disc) 由飞利浦、JVC、松下和索尼组成的财团于 1993 年创建，使用 MPEG1 标准，可在\
  \ CR-ROM 和 DVD 播放器上播放，属于只读标准和单面录制。可容纳 70 分钟（普通电影时长需要 2 张光盘）。具有 350 x 240 NTSC 和\
  \ 352 x 288 PAL 分辨率，质量类似于录像带。SVCD (Super Video CD) 由中国国家录制标准委员会于 1998 年开发，使用 MPEG2\
  \ 标准，可在 CR-ROM 和 DVD 播放器上以只读模式播放，且仅在 CD 媒体单面刻录。可容纳 70 分钟（普通电影时长需要 2 张光盘）。1988 年，中国确立了一种名为超级\
  \ VCD 的标准，此类播放器应能播放 CVD、SVCD、VCD 1.1、VCD 2.0 和 CD-Audio。采用可变比特率 MPEG2 分辨率，5.1 环绕声，效果逊于\
  \ DVD 但优于 VCD，NTSC 制式为 480 x 480，PAL 制式为 480 x 576 (Shree, 2016; Paikray et al.,\
  \ 2018)。\n\n\n\n\n\n########## DivX\n\nDivX 由两个软件组件组成：`DeCSS`，它通过破解阻止 DVD 文件被复制到计算机的加密来提取内容；以及微软制作的\
  \ MPEG-4 版本（codec avi）软件，这是一种内置于 Windows Media Tools 中的视频压缩标准。DivX 可以将 DVD 放入 CD\
  \ 中，分辨率与 MPEG4 相同。在计算机上通过互联网全屏观看时，其质量类似于普通电视广播。Xvid 与 DivX 相同，但代码免费；其分辨率取决于播放的视频，在保持良好质量的同时比\
  \ DivX 更好（Shree, 2016; Paikray et al., 2018; Zhang & Mao, 2019）。\n\n########## WMV\
  \ (Windows Media Video)\n\nWMV 是微软的格式，工作在 1.3–2 Mbps，分辨率为 480 到 1280，质量极佳。\n\n##########\
  \ Matroska (MKV - Matroska Video 和 MKA - Matroska Audio)\n\nMatroska 不是视频编解码器，而是一个容器，允许你将视频、音频和字幕的组合插入单个文件中。你可以将\
  \ DivX 电影与字幕包结合；它也适用于纯音频。Matroska 是一个开源项目，质量良好，分辨率与 MPEG4 相当（Batubara & Ariani,\
  \ 2016）。\n\n######## 数字游戏\n\n对于那些喜欢长时间玩数字游戏的人来说，特别是竞技玩家，他们渴望以高达 240 FPS 的帧率进行游戏，甚至是那些虽然不一定支付如此高昂费用，但热爱高分辨率（如日益普及的\
  \ 4K (3840x2160)，相当于 2x2 矩阵排列的 4 个全高清屏幕）的玩家而言，媒体压缩与这一现实成正比。\n\n举例说明一个当今可能存在的场景：一个使用\
  \ 10 位 RGB 标准、运行在 240 FPS 的 4K 游戏：每个 4K 图像相当于 8,294,400 个像素，如果每个像素需要 30 位，那将达到每帧\
  \ 248,832,000 位（接近 237 MB）。以每秒 240 帧计算，单秒将需要处理 56,880 MB（接近 56 GB）的信息。仅作说明用途，一局《英雄联盟》或《FIFA》等游戏的单场比赛持续约\
  \ 30 分钟（1800 秒），将需要处理 100,800 GB（接近 98 TB）的信息，这还不包括玩家之间的语音通话。考虑到访问此类内容的设备范围从普通移动设备到专为执行此类场景设计的设备，这清楚地说明了多媒体压缩的重要性（Redi\
  \ et al., 2015; Eliseo & Silva, 2016）。\n\n######## 音频编码与压缩\n\n音频压缩用于减少音频文件的带宽（以信号频率带宽、赫兹为单位测量）和/或物理空间。在音频压缩出现之前，高质量音频文件的数字数据占用了大量磁盘空间。一个例子是\
  \ CD 音质音乐，具有 44.1 kHz 立体声（2 声道），每采样 16 位，意味着每分钟音频约 10 兆字节。在此背景下，音频编码等同于音频压缩，因为只有通过这些概念才能减小音频文件的大小。因此，当前的文件格式（MP3）利用人耳听觉能力来减小音频文件大小，而不会造成明显的质量损失（Thompson,\
  \ 2018; Winer, 2017）。\n\n音频压缩分为两点：编码，即将存储在未压缩文件中的音频文件数据转换为压缩文件（在称为比特流的结构内）；以及解码，它分析比特流并将其重新展开。解码后得到的文件与原始文件不同；所有不重要的信息已被删除。然而，根据文件压缩比，该文件听起来仍然相同（或多或少）。通常，压缩率越低，文件质量越好，因为比特率指的是压缩力度，它表示一秒内将带来压缩比特流的平均比特数（Thompson,\
  \ 2018; Winer, 2017）。\n\n######### 表 1\n\n| 比特率 | 带宽 | 质量（相当/更好） |\n| :--- | :---\
  \ | :--- |\n| 16 kbps | 4.5 kHz | 短波广播 |\n| 32 kbps | 7.5 kHz | 调幅广播 (AM) |\n| 96\
  \ kbps | 11 kHz | 调频广播 (FM) |\n| 128 kbps | 16 kHz | 接近 CD |\n| 160-180 kbps | 20\
  \ kHz | 感知透明度 |\n| 256 kbps | 22 kHz | 录音棚 |\n\n######## 文件编解码 - CODEC\n\nCODEC\
  \ 一词由 COder 和 DECoder（编码和解码）或 Compression 和 DECompression（压缩和解压缩）的结合形成。正如前文某些情况提到的，该技术的一个常见例子是压缩视频；如果没有适当的\
  \ CODEC 来解码视频保存所用的文件格式，图像将不会出现在屏幕上，而是会报告缺少特定 CODEC 的消息。如今，以互联网用户通用语言中的著名 MP3、AIFF、AAC、MIDI、AVI、WMA、MPEG、MPEG2、DivX\
  \ 等所谓的压缩格式下载或保存文件很常见，运行所有现有 CODEC（如图像、视频和声音）的程序也是如此（Khan et al., 2017）。\n\n########\
  \ 性能参数\n\n编解码器之所以能达到最佳压缩率，是因为它压缩数据（无论是音频、图像还是视频），然后解压缩以检索其内容或查看它，同时也具有数据丢失的特性，即该媒体质量的部分或全部丢失。然而，有一些指标有助于估算该媒体压缩性能的质量以及其通过特定媒介的传输质量（Winer,\
  \ 2017; Khan et al., 2017; Dubin et al., 2018）。\n\n压缩比是原始数据大小与压缩后数据大小的比率。在无损技术的情况下，压缩比越高，压缩技术越好。对于有损压缩技术，还应考虑还原媒体的质量。还原媒体的质量可以用\
  \ SNR（信噪比）来衡量。此参数仅适用于有损技术。在选择有损压缩技术时，应在高压缩比和开发应用所需的期望质量之间做出妥协。实现复杂度和压缩速度通常相关：技术越复杂，压缩速度越低。对于视频会议等实时应用，应考虑这些参数。这是因为压缩/解压缩必须实时执行。在信息收集和演示应用的情况下，压缩速度不是很重要，但解压缩速度很重要（Winer,\
  \ 2017; Khan et al., 2017; Dubin et al., 2018）。\n\n######## 趋势\n\n\n\n\n\n########\
  \ 创新与技术突破\n\n创新与技术突破正变得更快、更频繁，正在改变社会和商业，我们看到世界正朝着一个未来迈进，在这个未来中，世界将被大容量光纤数据网络交织连接，连接我们所有日益无处不在的设备。从便携媒体正在改变世界这一点来看，未来是移动的；起初，通信行业和媒体是电子化的，如今它们是数字化的，在此过程中，它们已成为多媒体，并将日益变得更具交互性。而移动性正是这种变革。现代设备是电子化的，从本章呈现的所有方面来看，也被视为多媒体，但尚不擅长交互性。互联网在这方面做得很好，但使用传统设备时尚未普及到每个地方。因此，移动性是正在发生并将通过移动设备越来越多地发生的变革，我们借此实现人们的通信。只要你做一些有趣的事，在那一刻用照片记录下来，并利用移动设备通过互联网上传，或上传游戏或阅读一些新闻。从那时起，它获得了交互功能，从那时起，成为了一种多媒体通信设备（AlZu’bi\
  \ 等，2019；Zhang 等，2018；Li 等，2018；Li 等，2019；Wang 等，2018；Gupta，2018；Gupta 等，2016；Tian\
  \ 等，2019；Hai 等，2018；Li 等，2018；Panjanathan & Ramachandran，2017）。\n\n类似于基于 LUT 的客户端水印嵌入共谋安全性、用于分层属性的多授权中心\
  \ CP-ABE 压缩密文长度方案、多媒体物联网的高效应用、通过标签相关性挖掘进行自我标注、多媒体传感器网络中基于水印的认证与图像恢复、云存储方法下多媒体社交网络的新授权方案、面向无线应用的带有主动队列管理的增强型低延迟排队算法等新技术的涌现，以及其他许多将促进并为人们提供更高质量生活和技术交互的技术（AlZu’bi\
  \ 等，2019；Zhang 等，2018；Li 等，2018；Li 等，2019；Wang 等，2018；Gupta，2018；Gupta 等，2016；Tian\
  \ 等，2019；Hai 等，2018；Li 等，2018；Panjanathan & Ramachandran，2017）。\n\n####### 结论\n\n\
  数据压缩是减少给定设备所占用数据空间的行为。此操作通过各种压缩算法执行，减少表示给定数据（图像、文本或任何文件）所需的字节数。压缩数据还旨在消除冗余，因为过多数据包含可能需要以某种方式删除的冗余信息。这种形式是通过一条规则（称为代码或协议）来实现的，随后消除冗余信息位以减小其在文件中的大小。除了消除冗余外，压缩数据还出于多种原因。最著名的原因是节省硬盘等存储设备上的空间，或在传输中获得性能提升（减少这些传输发生的时间）。\n\
  \n尽管它们看起来可能是同义词，但数据压缩和压缩是截然不同的过程。正如所见，压缩减少表示某些数据所需的位数，而压缩的功能是将未连接的数据连接起来。如今，在 21\
  \ 世纪，与技术相关的主要关键词是优化和低内存消耗。因此，创建新方法并投资于此类研究将导致更轻量、更紧凑的电信设备和信道的开发，它们允许数据以更流畅的方式和低计算消耗流动，为家庭、医疗、工业、社交和教育设备的数据共享以及通信带来更大便利的时代铺平道路。\n\
