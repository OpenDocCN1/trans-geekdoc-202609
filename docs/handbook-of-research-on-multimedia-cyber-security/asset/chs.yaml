  \ `MAX=255`（Abraham et al., 2016）。\n\n\n\n\n\n######### 图像提取算法\n\n从嵌入图像中提取图像的过程详情如下。\n\
  \n1.  对水印图像应用一级 DWT；此过程将整个图像分为 4 个不同的子带：`LL[1]`、`LH[1]`、`HL[1]` 和 `HH[1]`。同一 DWT\
  \ 应用于 `LL[1]`，获得 `LL[1]` 的二级 DWT，即 `LL[2]`。对 `LL[2]` 再次应用 DWT 后，`LL[2]` 再次分为 `LL[3]`、`LH[3]`、`HL[3]`、`HH[3]`。\n\
  \n2.  用于水印嵌入的可见性因子 `F` 和图像的子带发生变化。例如：\n    `WMKD-LL[3] = H-LL[3] + (F * W-LL[3])`。\n\
  \n    为了从上述方程中找到水印子带信息，我们按如下方式求得水印子带：\n    `W-LL[3] = (Wmkd-LL[3] - H-LL[3]) / F`。\n\
  \n    其中，`WMKD-LL[3]` 是水印图像的 `LL[3]`，`H-LL[3]` 是宿主图像的 `LL[3]`，`W-LL[3]` 是水印图像的 `LL[3]`（如图\
  \ 11 所示）。\n\n    类似地，水印图像的 `LL[2]` 通过对 `LL[3]`、`LH[3]`、`HL[3]`、`HH[3]` 进行 IDWT（逆离散小波变换）获得。同样，水印图像的\
  \ `LL[1]`、`LH[1]`、`HL[1]`、`HH[1]` 通过 IDWT 获得（如图 12 所示）。\n\n| 图 11. 水印提取 |\n| ---\
