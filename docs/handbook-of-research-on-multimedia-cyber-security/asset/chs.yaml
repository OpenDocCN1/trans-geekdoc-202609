  \ Engineering , 6, 1033–1040.\n\n#### 第 13 章\n\n*   Amany Sarhan\n\n\n\n\n工程学院计算机与控制工程系，坦塔大学，埃及\n\
  \n*   Ahmed Ramadan\n\n    工程学院计算机与控制工程系，坦塔大学，埃及\n\n##### 摘要\n\n如今，触摸屏移动设备在市场中占据更大份额，这使得持续认证基于触摸的设备用户的有效且稳健的方法成为必要。本文提出了一个分类框架，该框架学习用户的触摸行为，随后能够通过监控用户执行输入触摸动作时的行为来认证用户。构建了两种特征模型：低级特征（笔画级）模型或高级抽象特征（会话级）模型。在构建这些模型时，对两种不同的特征选择和数据分类方法进行了权衡：加权特征法和主成分分析（PCA）。使用了两种分类算法：人工神经网络（ANN）和支持向量机（SVM）。实验结果表明，利用会话级特征比笔画级特征更有希望实现触摸输入用户的持续认证。作者发现，在构建会话级模型时使用加权特征法和人工神经网络，能产生最高效、最准确的行为生物特征持续用户认证。\n\
  \n##### 引言\n\n随着移动计算设备及其访问银行等安全服务和其他交易的应用日益普及，保护移动设备上的用户数据变得日益重要。数字技术如今已成为生活的一部分。从网上购物到网上银行、政府事务和商业基础设施，保护这一大量数据发挥着至关重要的作用。数据可以通过各种软硬件技术来保护（Karnan\
  \ 等，2011；Ouaguid 等，2018；Olakanmi & Dada, A. 2019）。\n\n一些常用工具包括防病毒软件、加密、防火墙、双因素认证、软件补丁、更新等。许多人存在一个共同的误解，认为数据安全仅对大型组织、政府和企业重要，且它们才是数据攻击者的目标。数据安全不仅对企业或政府重要。您的计算机、平板电脑和移动设备可能成为下一个目标。通常，普通用户会因其敏感信息（如信用卡详情、银行详情、密码等）而成为攻击者的目标。所有上述原因导致了最著名的认证方案——密码方案的出现，以保护用户数据和隐私（Mahfouz\
  \ 等，2017；Feng 等，2012；Zhao 等，2014；Jouini & Rabai，2016）。\n\n当前的应用程序通过支持每次登录时的用户认证来维护用户敏感数据的隐私。如今，大多数移动设备应用程序通过传统的基于文本的密码方案来强制实施安全性以认证用户。然而，用户往往选择弱密码，以使登录过程更轻松、快捷（Jain\
  \ 等，2004）。随着触摸设备迅速普及，这一现象尤为明显。Findlater 等（2011）表明，在平滑玻璃上打字的速度比物理键盘慢 31%。这通常导致用户选择更短的密码以缩短登录时间。选择合适的密码使用户陷入两难：既要使用易记的密码，同时又要安全，因此大多数用户为保证轻松快捷的登录过程（这是触摸输入移动设备上最频繁的操作）而牺牲安全性，因此迫切需要寻找其他替代认证方法来解决这一两难问题，给用户更快捷、轻松的登录体验，同时不牺牲安全性（Frank\
  \ 等，2013）。\n\n其他可能作为密码认证方案更好替代方案的认证方法，如图形图案，最令人鼓舞，但也容易受到攻击，例如试图发现多次输入同一图案后触摸屏上留下的残留痕迹。除了上述问题，传统安全系统的主要局限性在于用户仅在会话开始时被认证一次。此认证过程直到下一次需要解锁设备时才会再次执行（Karnan\
  \ 等，2011）。所有这些问题和局限性导致采用某种隐式和持续认证方法来克服这些局限。据此，认证方法需要是持续的，以克服任何非法访问受保护数据的企图（Gianni\
  \ 等，2017）。这些方法在许多情况下无效，例如在线考试中的学生认证。\n\n除了持续性外，认证过程还应是隐式和透明的，以免影响用户活动。在此背景下，多个学术和工业研究小组提出了不同的解决方案，以监控用户活动并在其使用设备的期间对其进行认证。持续认证可以是主要认证方法，也可以是用于更高保障的辅助欺诈检测。它为系统增加了额外的可靠性并增强了易用性（Eberz\
  \ and Rasmussen，2017）。持续认证可根据软硬件要求用不同方法实现。例如，我们可以通过设置会话超时并要求用户执行认证过程来实现，但这对用户非常恼人。另一种方法是记录用户如何使用设备的数据，并频繁地将这些数据与同一用户先前记录的数据进行比较。当我们处理行为生物特征认证方法时，该解决方案更具适用性，这将在后面讨论。\n\
  \n从易用性角度来看，传统认证方案（即密码、PIN 码或图形图案）不方便，因为用户每次开始与设备交互时都必须专注于认证步骤。当我们考虑移动设备时，这种不便成为一个重大问题，因为移动设备被频繁访问，且每次使用通常时间较短。\n\
  \n另一个重大问题是，用户大多选择易记的密码，如前所述，这很容易被窃取。即使是最强大的密码也可能被字典攻击、窥视攻击、暴力破解攻击，或近期的社会工程学攻击窃取，此外还可能被遗忘。这促使研究人员转向生物特征识别，如指纹、虹膜扫描、人脸识别和语音识别，作为更方便、安全的认证方法，但这带来了另一个问题：许多基于生物特征的认证方法要么成本高昂、要么不方便、要么实施复杂。为了解决上述问题，大多数研究如\
  \ Mahfouz 等（2017）、Fierrez 等（2018）、Yampolskiy and Govindaraju（2008）以及 Song Fierrez\
  \ 等（2017）引入了行为生物特征认证方法，这些方法考虑了固有因素，即用户“所是”的东西。这些方法依赖于监控用户在使用鼠标、键盘和触摸屏等输入外设与设备交互时的行为。\n\
  \n\n\n\n###### 触摸屏输入动作作为行为生物特征认证\n\n本文关注触摸屏输入动作作为一种行为生物特征认证方法，通过监控和分析用户如何与触摸屏移动设备交互来识别用户。触摸屏交互数据的监控可应用于用户能执行的最简单手势层面，即手指触摸屏幕然后抬起，这被称为**笔划**。笔划是用户将手指放在屏幕上然后释放时形成的轨迹（Eljetlawi,\
  \ 2010）。根据记录这些动作的采样率，每个笔划由若干触摸动作组成。另一个监控层面是**会话层面**，可在其中记录和处理多个笔划作为一个整体，称为**触摸会话**。这不同于前述的笔划层面，后者将每个单独的笔划作为一个独立的信息单元进行处理。\n\
  \n主要研究集中在将笔划层面作为信息单元（Frank et al., 2013; Fierrez et al., 2018），这可简化系统实现；然而，它忽略了所有这些单个笔划之间的相关性，而这些相关性可能包含大量关于用户身份的重要信息。少数研究，如\
  \ O'connell 和 Walker (2017) 以及 Karnan 等人 (2011)，已引入会话层面认证，我们将在论文中应用该方法，同时结合笔划层面监控。先前的研究已针对上述问题提出不同方式的适用解决方案；因此，我们将利用这些方案提出一个更高效、更准确的解决方案。我们将使用现代触摸屏技术支持的单点触控笔划和多点触控笔划，因为依我们来看，多点触控笔划比单点触控笔划包含更多关于用户身份的重要信息，尤其是其手部几何特征。本文的主要贡献是提出一个基于行为生物特征的认证框架，该框架专注于从两个不同视角分析触摸屏输入动作；即我们提出两种不同的特征提取模型：笔划层面特征模型和会话层面特征模型。我们使用两种不同分类算法和两种不同特征选择方法的组合来比较这两个模型的性能，以决定哪个模型在认证过程中更准确、更有效。\n\
  \n本文为引入其贡献所采用的方法论可列举如下：\n\n*   引入一个用户认证框架，作为概念验证，旨在考虑用户在触摸屏上的输入动作的会话层面信息，以获得更准确、更高效的认证方法。\n\
  *   在两个模型中使用人工神经网络和支持向量机作为分类算法，以选择最优分类算法。\n*   通过搜索特征判别力和特征一致性，并根据特征重要性使用加权特征法，引入一种新的特征选择方法。\n\
  *   使用 PCA 作为特征选择的替代方法，以代替加权特征法，从而选择特征选择方法。\n*   将单点触控笔划和多点触控笔划结合到一个模型中，以利用现代触摸屏的所有能力，并最大化认证系统的整体准确性和效率。\n\
  \n本文结构安排如下。除本节外，第 2 节重点介绍与行为生物特征相关的背景知识，特别是触摸屏输入行为，以帮助我们理解基于触摸屏的行为生物特征认证方案。还详细展示了该研究领域先前相关工作的贡献。第\
  \ 3 节介绍一种从用户触摸动作原始数据中提取的最合适特征的选择方法，详细描述其背后的概念，然后展示我们如何开发该框架以使其灵活适应未来的改进。第 4 节展示构建和评估该认证框架所进行的实验阶段，并呈现我们为评估所提框架而进行的所有实验结果，分析这些结果以评估所提框架的性能。最后，第\
  \ 5 节总结本论文，并给出未来工作的路线图特征。\n\n###### 生物特征认证\n\n任何生物特征识别系统（见图 1）都必然通过检查某人已注册的物理和/或行为特征及其提交的相应查询特征，来自动识别该人。理想的生物特征应具有“零”误接纳率和误拒率，并应满足一些特性，如普遍性、唯一性、永久性、可接受性，且应能抵御可能的攻击。图\
  \ 1 描绘了包含四个组件的生物特征系统框图，定义如下（Jain et al., 2004）：\n\n*   **数据源**：该模块处理从个体采集的生物特征数据。它包括硬件和软件。还可能包含一个额外的“质量检查器”组件以确保数据质量。\n\
  *   **特征提取器**：该模块处理从采集的生物特征样本中提取判别性特征，以便在数据库中描绘最相关的用户信息。\n*   **数据库**：该模块处理从用户数据生成的生物特征模板的存储和管理。\n\
  *   **匹配器/比较器**：该模块将声称的或查询的模式与先前存储的模式进行匹配，并决定接受/拒绝。对于验证，它执行一对一匹配；对于识别，它将输入查询模式与所有类别的所有存储模式进行匹配（1:N），随后根据获得的最高分数识别用户。\n\
  \n| 图 1. 通用生物特征识别系统 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch013.f01](img/ch013.f01.png)\
  \ |\n\n生物特征模态的选择取决于除识别性能外的各种因素。文献考虑了确定这些特征适用性的七个因素，如下所述（Jain et al., 2011）：\n\n\
  1.  **普遍性**：每个用户都需要具备该生物特征模态。该因素有助于确定生物特征识别系统的注册失败率（FTER）。\n2.  **唯一性**：给定的模态在一组人群中应在不同个体间有足够的差异。\n\
  3.  **一致性**：给定的模态应在一定时间段内保持一致。\n4.  **可测量性**：在不给用户造成任何不便的前提下，使用最佳设备采集和数字化生物特征模态的可能性。\n\
  5.  **性能**：除了识别准确性，生物特征系统的吞吐量也应能应对应用施加的约束。\n6.  **可接受性**：它反映了用户向系统提供其特征的容易程度和舒适度。\n\
  7.  **规避性**：它指复制、模仿或修改其他参与者的模态以获取系统非法访问权限的容易程度。\n\n生理生物特征通常需要一种获取方法，如扫描仪或摄像头，以及一种将其从详细扫描转换为简洁特征向量的方法，该向量代表最显著（即最独特）的部分。这些生物特征各有优劣，选择使用哪种取决于将部署它的应用程序的需求。生理生物特征的例子包括指纹、掌纹、虹膜和视网膜扫描以及人脸识别。\n\
  \n\n\n\n\n###### 生物特征特性分析\n\n####### 生理生物特征\n\n表 1 展示了每种生物特征如何满足生物特征特性。针对每种生物特征，均已确定其对相关特性的符合程度。判定等级为高\
  \ (H)、中 (M) 和低 (L)，由作者选定。例如，指纹普适性判定为 H 意味着大多数人可通过指纹扫描进行认证。视网膜采集性判定为 L 意味着采集视网膜扫描存在问题，阻碍了其更高的采集性\
  \ (Yampolskiy and Govindaraju, 2008)。生理生物特征的一些问题，特别是采集性和规避性，可通过使用行为生物特征来解决。基于个人行为的生物特征模式可能不那么独特，但它们通常不需要额外硬件，且可在受试者从事正常活动时采集，而非要求其接受扫描。\n\
  \n**表 1. 选定生理生物特征的特性。**\n\n| 生物特征 | 普适性 | 独特性 | 永久性 | 采集性 | 性能 | 可接受性 | 规避性 |\n\
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: |\n| 指纹 | H | H |\
  \ M | M | M-L | H | H |\n| 掌纹 | H | H | M | M | M | M | M |\n| 视网膜 | H | H | H |\
  \ L | M | M | L |\n| 虹膜 | H | H | H | H | H | M | L |\n| 人脸 | H | M | M | M | M\
  \ | M | L |\n\n####### 行为生物特征\n\n生理生物特征可能存在局限性，特别是在移动设备环境中，因为它们可能需要额外硬件来采集生物特征。行为生物特征被认为不如生理生物特征独特\
  \ (Yampolskiy and Govindaraju, 2008)，但相较于生理系统具有若干优势。它们易于在受试者进行其他任务时采集，因此非常适合透明认证。其采集通常不需要特殊硬件，因此可能更具成本效益。已有大量研究探讨各种可能性，包括击键动力学\
  \ (Clarke and Furnell, 2007)、语音验证 (Bimbot et al., 2004 and Kenny et al., 2004)、触屏交互模式\
  \ (Khan et al., 2014) 和设备使用模式 (Gamboa and A. Fred 2004, Yampolskiy and Govindaraju,\
  \ 2008)。下表简要描述了关键行为生物特征。\n\n1.  **签名**：是个人签署姓名的独特方式。签名指标包括书写工具压力（仅限电子签名）、字母形状以及点和装饰笔画等其他附加特征。它长期以来被政府和法律机构以及公众接受为一种识别和验证方法。它需要使用书写工具以及纸张或电子签名面，成本相对较低。签名极易遭到伪造，尽管通过人工验证签名或改进的模式匹配算法可以改善这些方法\
  \ (Fierrez et al., 2018)。签名变异性可能很大，因此需要在一定容差范围内接受，而非要求完全匹配。\n\n2.  **步态**：是个人行走的特征方式。步态是一种复杂的生物特征，因为它结合了空间和时间问题，即必须同时测量三维空间中的运动以及每次运动的时序。它使用加速度计和陀螺仪等硬件进行测量\
  \ (Mantyjarvi et al., 2005)，这些在移动设备中很常见，也可使用 3D 摄像头。步态的问题包括普适性有限，因为无法行走者直接被排除在外，包括幼童、老弱病残及轮椅使用者。步态还可能因受试者的体重、年龄和精神状态等而变化，因此不具备高度不变性\
  \ (Gafurov et al., 2006)。由于采集数据的复杂性，在特征向量创建和匹配方面计算量密集。\n\n3.  **设备使用**：试图采集受试者使用台式机、笔记本电脑和手机等设备的模式。设备使用示例包括事件序列、快捷键与菜单项的使用偏好、步行或驾驶时的路线选择\
  \ (Mazhelis and Puuro, 2007)。这些模式可从浏览器历史记录和应用通知等中采集，预期具有中等独特性，且需要相对较长的训练期 (Shi et\
  \ al., 2011)。它们受设备更换影响（即受试者开始使用新手机），以及设备功能变化影响（即电脑上安装了新软件或程序）。这种监控可能因其类似窃听而引起受试者担忧。\n\
  \n4.  **打字**：个人的打字方式预期具有独特性，称为击键动力学 (Karnan et al., 2011)。采集按键速度、字符和 n-gram 频率以及按键压力等测量值，并将其组合成独特模式\
  \ (Clarke and Furnell, 2007, and Eberz and Rasmussen, 2017)。它被认为适合验证但不适合识别 (Jain\
  \ et al., 2004)。由于精神状态、受试者姿势（即站立、坐着或行走）和键盘熟悉度，该生物特征变异性很高。可在受试者进行其他任务时使用标准键盘采集。击键动力学可能遭受重放和模仿攻击，尽管后者可能更难实施。\n\
  \n5.  **语音**：既是生理也是行为生物特征。生理方面包括因受试者喉部、声门褶皱、口腔和嘴唇等特征的独特形状而变化的语音特征测量 (Jain et al.,\
  \ 2004)。行为方面包括发音、词频和用法及口音。生理方面在一个人一生中相对不变，但行为方面可能受情绪、心理状态、年龄和感冒等疾病影响。语音生物特征不够独特，且因录音时其他噪音污染问题，不适合大规模部署\
  \ (Bonastre et al., 2003)。它可能因录制和重放受试者语音而被滥用，且可在受试者不知情的情况下采集。\n\n**表 2. 选定行为生物特征的特性。**\n\
  \n| 生物特征 | 普适性 | 独特性 | 永久性 | 采集性 | 性能 | 可接受性 | 规避性 |\n| :--- | :---: | :---: | :---:\
  \ | :---: | :---: | :---: | :---: |\n| 签名 | H | M | L | H | M | H | M |\n| 步态 |\
  \ L | M | L | H | M | H | L |\n| 设备使用 | L | M | L | H | M | L | L |\n| 打字 | H |\
  \ M | L | H | M | M | M |\n| 语音 | H | M | M | H | M | H | M |\n\n####### 多模态生物特征\n\
  \n近年来，生物特征认证的准确性和可靠性显著提高。然而，大多数经过评估和测试的先进生物特征系统也存在一些局限性；其中一些局限性与数据类型有关，一些与方法论有关。更具体地说，由于输入数据中存在噪声、类间变异、非普适性以及其他可能影响这些系统性能、安全性和可用性的因素，生物特征系统的性能会大打折扣\
  \ (Ross et al., 2008)。\n\n\n\n\n###### 多模态生物识别系统\n\n多模态生物识别系统是一种较新的方法，旨在解决单模态生物识别系统相关的一些问题。它整合了来自多个信息源的数据，例如将指纹扫描仪和虹膜扫描仪的数据相结合，并额外收集鼠标和键盘输入动态数据。这种组合提高了识别性能和效率。多模态系统能显著提升识别性能并增加人口覆盖率（从而降低\
  \ FTER），防止欺骗攻击，并增加自由度。尽管与单模态生物识别系统相比，这些系统需要更多存储空间、更高的处理时间并涉及更多计算成本，但上述优势使其在大规模认证系统中部署极具吸引力（Clancy\
  \ et al., 2003）。\n\n###### 生物识别认证系统的性能指标\n\n评估击键生物识别系统或任何其他生物识别系统性能最常用的指标是**误拒率（FRR）**和**误纳率（FAR）**（AbdelDayem\
  \ et al., 2017）。FRR 是被标记为冒名顶替者并被拒绝访问的合法用户的百分比。其定义如下（Kumar et al., 2016; AbdelDayem\
  \ et al., 2017）：\n\n```\nFRR = (False Rejects / Total Legitimate Access Attempts)\
  \ × 100%\n```\n\n其中 `False Rejects` 是被拒绝访问的合法用户数量。\n\nFAR 是被允许访问系统的冒名顶替者（冒充合法用户）的百分比。其定义如下（Kumar\
  \ et al., 2016; AbdelDayem et al., 2017）：\n\n```\nFAR = (False Accepts / Total Impostor\
  \ Access Attempts) × 100%\n```\n\n其中 `False Accepts` 是被允许访问的冒名顶替者数量。\n\n在统计学中，FRR\
  \ 被称为**第一类错误**，表示系统的特异性。FAR 被称为**第二类错误**，表示系统的灵敏度。这两种错误率理想情况下都应为 0%。从安全角度来看，应将第二类错误最小化，即不给未授权用户任何登录机会。然而，第一类错误也应不频繁发生，因为如果系统错误地拒绝合法用户，会让他们感到恼火。FAR\
  \ 和 FRR 之间的关系是成反比的；当一个降低时，另一个会增加。因此，这两个指标不能同时在一个认证系统中得到改善。在安全性不是首要考虑因素的系统中，通常倾向于较高的\
  \ FAR；而在高安全性应用中，则倾向于较高的 FRR（AbdelDayem et al., 2016）。\n\n生物识别系统最常用的度量之一是 FAR 和 FRR\
  \ 相等时的比率。这被称为**等错误率（EER）**，或**交叉错误率（CER）**（Jain et al., 2004）。该值表示误接受的比例等于误拒绝的比例。EER\
  \ 值越低，生物识别系统越好。\n\n###### 持续认证方法与途径\n\n认证是提高移动设备安全性的常用措施。在认证过程中，根据用户直接或间接提供的不同信息源来验证用户身份。认证过程可分为**基于知识的方法**（如密码、PIN\
  \ 码和图形图案）和**基于生物特征的方法**。\n\n基于知识的方法自该技术面市以来就已被使用，尽管存在弱点和缺陷，但仍被广泛采用。基于生物特征的认证方法被认为更可靠、更安全，而近期移动设备集成的众多新传感器为开发新系统提供了更多机会。大多数生物特征方法作为**一次性认证方法**运行，即在设备使用会话开始时验证用户，导致会话其余时间容易受到未授权访问。\n\
  \n针对上述问题，提出了**持续认证方法**。目前提出的为数不多的持续生物识别认证方法均基于机器学习技术，如 `k-nearest neighbor`、`support\
  \ vector machines` 和 `artificial neural networks`。这些方法允许自动检测欺诈用户，但在所有情况下并不总能达到足够有效的结果。在下一节中，我们将介绍一些先前的研究方法。\n\
  \n####### 触摸屏认证研究\n\n过去十年中，触摸屏在认证中的应用增长迅速。许多研究致力于将其与其他生物特征融合用于认证，或验证其作为独立认证方法的可行性。Zhao\
  \ et al. (2017) 使用由语音、人脸和签名数据组成的多模态生物特征进行手机认证。目标是使具有法律约束力的合同能够被签署。虽然人脸验证显示出非常高的等错误率（EER），约为\
  \ 28%，但语音和签名的 EER 分别约为 5% 和 8%。三种生物特征的融合将 EER 降低至 2%，从而增强了系统。此类系统的问题在于高度侵入式的认证过程，用户需要阅读、签名并输入\
  \ PIN 码。此外，还有多项研究涉及采用基于图形的密码代替基于文本的密码进行认证。Rachna 和 Adrian (2000) 研究了基于图形的密码并将其与传统密码和\
  \ PIN 认证进行比较。结果表明，在基于文本的密码难以频繁访问的情况下，基于图形的密码表现更好。\n\nWei et al. (2010) 的另一项研究比较了多种类型的密码。研究证实，基于图形的密码比基于文本的密码具有更好的易记性。此外，使用暴力破解、字典攻击等传统攻击方法时，基于图形的密码也更难被破解。\n\
  \n**单指触摸滑动手势**（或简称**滑动**）被视为一种触摸手势，用户将一根手指放在触摸屏上并快速水平或垂直移动，通常用于滚动目的。尽管滑动并非唯一适合移动生物识别的触摸信号（例如，也可使用点击、按压或捏合信号），但迄今为止绝大多数触摸生物识别研究都表明，使用单指滑动手势能获得最佳结果。因此，我们将专注于滑动信号，在本文其余部分将互换使用“滑动生物识别”和“触摸生物识别”术语。\n\
  \n现有的滑动生物识别文献可分为两大类。第一类使用在入口点（即秘密图案）上进行的滑动来认证主体。因此，认证不是持续进行的。第二类方法探索**主动认证方法**，即在与设备的正常交互过程中进行的屏幕滑动被持续用于认证。由于正如引言所述，本文的主要焦点是滑动生物识别用于主动认证，本节将回顾一些属于此类技术的现有方法。其他比较基于图像特征并探讨经验、性别和年龄等因素的相关工作分别发表在（Zhao\
  \ et al., 2014 和 Antal et al., 2015）中。\n\n\n\n####### 智能手机认证方法综述\n\n######## 触屏分析认证\n\
  \n智能手机先驱认证方法基于触屏分析。Feng 等人（2012）提出了 `FAST`（基于触屏的手指手势认证系统），这是一种新型的基于触屏的移动设备认证方法。除了从配备触屏的智能手机提取触摸数据外，`FAST`\
  \ 还使用我们利用现成组件构建的数字传感器手套来补充和验证这些数据。`FAST` 利用最先进的分类算法提供透明且持续的移动系统保护。一个显著特点是 `FAST`\
  \ 的持续、用户透明的登录后认证。他们使用从 40 位用户收集的触摸数据表明，`FAST` 在持续登录后用户认证中实现了 4.66% 的误接纳率（`FAR`）和\
  \ 0.13% 的误拒率。低 `FAR` 和 `FRR` 值表明 `FAST` 提供了卓越的登录后访问安全性，且不打扰诚实的移动用户。\n\nLin 等人（2013）提出了一种基于加权\
  \ k-最近邻算法的方法。在受控环境中的实验显示，当重新认证时间设置为最多十分钟时，等错误率（`EER`）为 3.5%。减少重新认证时间会导致结果显著变差，从而限制了该方法在真实场景中的实用性，因为\
  \ Budiu（2015）最近的研究表明平均智能手机会话时长为 72 秒。此外，触摸识别用于持续认证的一个明显局限性是需要用户持续输入。智能手机活动用途非常多样，一些最流行的活动涉及很少的打字。随着加速度计、磁力计和陀螺仪等传感器的嵌入，智能手机运动认证成为越来越多研究的主题。部分近期文献专注于基于持握模式识别用户（Conti\
  \ 等人，2011）。由于智能手机上的运动数据可以持续收集，类似的方法可用于实现持续生物特征认证系统，尽管该领域的文献非常稀少（Lin 等人，2013）。\n\n\
  ######## 运动识别认证\n\nNeverova 等人（2016）提出了一种基于加速度计和陀螺仪数据的持续运动识别系统。该方法分两阶段应用。在第一阶段，他们将观察值转换为一组新特征，并使用高斯混合模型估计其总体分布。当新用户加入方案时，他们对总体数据模型的均值向量执行最大后验适应，以构建特定客户端模型。然后，两个模型均用于为每个新观察值生成验证分数。作者在真实场景中获得了\
  \ 18.2% 的 `ERR`。\n\nSong Fierrez 等人（2017）提出了一种多模态方法，包括加速度计、陀螺仪和触屏观察。作者使用单类 `SVM`\
  \ 模型将样本分类为属于所有者或访客/攻击者。他们在受控环境中使用数据集测试了该方法，要求用户在坐着和走路时输入文本。用户走路时获得 7.16% 的 `EER`，坐着时获得\
  \ 10.05% 的 `EER`。作者将真实场景下的评估推迟到未来研究。\n\n######## 多点触控手势认证\n\n触屏技术已改进以应对更复杂的输入需求。现代触屏不再仅支持单指执行所需手势，现在支持单个手势中多达十指的触摸动作，这使得执行更复杂的手势成为可能，并提供更多关于用户手部几何结构的信息，这在行为生物特征认证中非常有用。\n\
  \nJain 等人（2011）使用 22 种不同的多点触控手势在 `iPad` 上认证 34 位用户。作者报告称，如果用户执行一个手势，`EER` 为 7%–15%；如果结合两个手势，`EER`\
  \ 为 2.6%–3.9%；如果每个用户使用一个唯一手势，`EER` 为 3%。这两篇论文的问题设定与我们的工作至少有两个显著差异。虽然 Buriro 等人（2016）要求用户认证的定义入口点，但他们旨在实现隐式和持续的场景。其次，在他们的认证方案中，用户可以随意与屏幕交互，而\
  \ Jain 等人（2011）和 Buriro 等人（2016）中，触摸轨迹与特定的（秘密）手势进行比较。\n\n######## 连续触摸认证\n\nFrank\
  \ 等人（2013）是最早且最全面的利用触摸数据进行持续认证的工作之一。他们研究了 41 名受试者，这些受试者在比较图像和阅读文本时提供了单点触摸操作的数据。研究了会话内和会话间认证，使用带径向基函数（`RBF`）的支持向量机（`SVM`）和\
  \ k-最近邻（`kNN`）获得小于 4.0% 的等错误率（`EER`）。分类器在会话内认证中达到 0% 的中位等错误率，会话间认证为 2%–3%，注册阶段一周后进行认证测试时低于\
  \ 4%。此外，观察到结合笔画块进行认证可获得更好性能，其他工作也得出了相同结论，如 Serwadda 等人（2013）和 Shen 等人（2016）。\n\n\
  Serwadda 等人（2013）使用包含 190 名受试者跨两个不同会话获取的触摸数据操作的大型数据集，生成了适用于基于滑动生物特征主动认证的最佳算法基准。提取\
  \ 28 维特征向量，他们报告使用逻辑回归、`SVM` 和随机森林获得了约 15% `EER` 的最佳性能。\n\nShen 等人（2016）研究了 `SVM`、`kNN`、神经网络和随机森林分类器在不同应用（如文档阅读或图片查看）以及自由任务中的表现。他们分析了四种触摸操作类型（上、下、左、右），并在每种类型中提取了不同的特征集。他们得出结论：1）活动区域较小的滑动（水平手势）更稳定且更具辨别力；2）遵循相同方法论，特定任务（1%\
  \ `EER`）比自由任务（5% `EER`）获得更好结果。\n\nZhang 等人（2015）在三个数据集上比较了 `SVM` 和基于稀疏表示的字典，其中两个是公开的（Frank\
  \ 等人，2013，14），报告字典性能略优于 `SVM`，`EER` 范围为 0.4% 至 23.8%。\n\nMahbub 等人（2016）研究了在允许自由交互的更真实应用中获得的、每个受试者拥有大量样本的数据集上的触摸数据认证。利用\
  \ `kNN`、`SVM`、随机森林和梯度提升模型（`GBM`）进行认证，`EER` 范围为 22% 至 38%。\n\n此外，单点触摸操作与其他生物特征的融合已在\
  \ Xu 等人（2014）（击键、滑动、捏合）、Kumar 等人（2018）（击键、滑动、手机移动）和 Sitov´a 等人（2016）（手部移动、方向、握持、点击、击键特征）中研究。第一项使用\
  \ `SVM` 报告了 90% 以上的准确率，第二项仅使用滑动数据进行认证，利用 `kNN` 和随机森林获得 10% `EER`。最后，第三项比较了用户走路和坐着时获得的\
  \ `EER`，报告结合所有上述特征时分别为 7.16% 和 10.05%。\n\n\n\n\n######## 相关工作综述\n\n上述文献大多假设训练时同时拥有真实样本和冒名顶替者样本。然而，某些应用场景施加的限制使得使用冒名顶替者样本进行训练变得困难甚至不切实际。为应对这些情况，研究人员探索了单类分类器和异常检测技术的应用。\n\
  \nMurmuria 等人 (2015) 提出了基于异常度的离群点检测，通过监测功耗、触摸手势和物理移动来建模用户行为。当有足够数据为每位用户建模（仅使用真实样本）时，这些算法展现出具有竞争力的性能，EER\
  \ 低于 7%。\n\nKumar 等人 (2018) 分析了三种用于持续认证的单类分类器，包括单类支持向量机、椭圆包络和局部离群因子算法。结果表明，仅使用真实数据训练也能达到与同时使用真实和冒名顶替者数据训练相当的性能。\n\
  \n异常检测方法也被应用于基于触屏交互的持续认证。Perera 和 Patel (2018) 为移动主动用户认证提出了多种快速入侵检测方法，结果显示仅需相对较少的手势即可检测出高比例的入侵。同样，Mondal\
  \ 和 Bours (2015) 提出了一种基于反向传播人工神经网络的信任模型。\n\nKin 等人 (2017) 为新颖性检测算法提出了一种用户自适应特征提取方法，以提升基于自由文本击键动力学的用户认证性能。受个体击键数据代表其打字行为这一事实启发，他们通过考虑所有双击键对的平均打字速度，将双击键分配自适应地调整为八个特征。随后，训练了五种新颖性检测算法来构建认证模型。为验证该方法，他们从\
  \ 150 名参与者处收集击键数据，每人提供超过 13,000 次击键。在各种条件下（即两种语言、25 种不同的训练和测试击键长度组合）的实验结果支持了该方法的有效性。当测试击键长度相对较短、且用户打字语言更熟悉时，性能提升显著。当训练和测试击键长度均为\
  \ 1,000 时，该方法的平均 EER 为 0.44%，被认为可接受于实际部署。\n\nAbdelDayem 等人 (2017) 针对短文本认证提出统计方法，针对长文本认证则使用\
  \ k-近邻算法。他们进行了两组实验测试系统认证性能。结果显示，短文本认证中，两组用户的 FRR 均为 0%，即知道登录凭据（用户名/密码组合）的用户不会被拒之门外。但两组用户的\
  \ FAR 分别为 12.5% 和 27.5%，意味着部分冒名顶替尝试会被接受。由于击键动力学并非唯一认证机制，而是与密码输入相结合，冒名顶替者需同时知道密码并模拟打字模式才能获得访问权限。\n\
  \n长文本认证方面，两组用户的 FAR 分别为 2.08% 和 1.28%，极少冒名顶替尝试能获得访问权限。使用相同长文本进行训练和测试可获得极低 FRR（两组用户分别为\
  \ 0% 和 3.84%），提升了系统性能。但要求用户每次输入相同长文本会造成不便，因此需测试使用不同长文本数据训练和测试时的性能。此时系统 FRR 值升高，尤其是第二组用户。原因在于部分用户在抄写不熟悉的长文本时，打字模式不一致且不稳定。\n\
  \nFridman 和 Weber (2016) 针对基于四种生物特征模态（文本、应用使用、网页浏览和位置）的分类器，提出了一种并行二元决策级融合架构。利用该融合方法，他们解决了主动认证问题，并在包含\
  \ 200 名受试者、每人使用个人 Android 设备至少 30 天的真实数据集上评估了性能。用户与设备交互 1 分钟后，认证系统达到 0.05 (5%) 的等错误率\
  \ (EER)；30 分钟后 EER 降至 0.01 (1%)。他们展示了各单独分类器的性能及其对融合全局决策的贡献。基于位置的分类器虽触发率最低，但对融合系统性能贡献最大。\n\
  \n######## 基于触屏动作的持续用户认证框架\n\n在本工作中，隐式认证定义为：在不显式打断用户活动、不要求用户额外付出的情况下，验证移动设备用户身份。这意味着认证决策所依据的数据源于用户执行常规任务时对设备的使用方式\
  \ (Gianni et al., 2017)。所提框架旨在提供一种隐式持续认证方案：用户像往常一样使用移动设备，同时隐式认证进程在后台持续运行。首先，在离线学习阶段为用户建立模型；随后，在用户日常使用设备期间，认证作为后台进程执行\
  \ (Eljetlawi, 2010)。\n\n先前研究如 (Eljetlawi, 2010)、(Nakamura 等人, 2012)、(Jeanjaitrong\
  \ 和 Bhattarakoso, 2013) 及 (Eberz 和 Rasmussen, 2017) 侧重于单次触摸笔画中与用户行为相关的简单特征，将其视为独立向量，未考虑同一触摸会话内的所有笔画。同一会话内的触摸笔画数据可能包含关于用户行为的相关信息，这对用户认证可能比单个笔画获取的信息更有价值。本研究构建了两种用户行为模型：笔画级模型和会话级模型，并对比两者性能，寻找能实现高效认证流程的模型。\n\
  \n######## Android MotionEvent 概览\n\n运动事件通过动作代码和一组轴值来描述运动。动作代码指明发生的状态变化，如指针按下或抬起。轴值描述位置及其他运动属性。例如，用户首次触摸屏幕时，系统会向相应视图分发一个触摸事件，其动作代码为\
  \ `ACTION_DOWN`，轴值集包含触摸点的 X、Y 坐标，以及接触区域的压力、大小和方向信息 (Android Developer, 2018)。\n\n\
  部分设备可同时报告多个运动轨迹。多点触控屏为每根手指发出一条运动轨迹。产生运动轨迹的单个手指或其他物体称为指针。运动事件包含当前所有活动指针的信息，即使自上次事件分发以来其中一些指针未移动。指针数量仅随单个指针的按下和抬起而逐个变化，手势取消时除外\
  \ (Android Developer, 2018)。\n\n\n\n\n每个指针都有一个唯一的 ID，该 ID 在指针首次按下时分配（由 `ACTION_DOWN`\
  \ 或 `ACTION_POINTER_DOWN` 指示）。指针 ID 保持有效，直到指针最终抬起（由 `ACTION_UP` 或 `ACTION_POINTER_UP`\
  \ 指示）或手势被取消（由 `ACTION_CANCEL` 指示，即指针离开子视图边界进入父视图时）。`MotionEvent` 类提供了许多方法来查询指针的位置和其他属性，例如\
  \ `getX(int)`、`getY(int)`、`getAxisValue(int)`、`getPointerId(int)`、`getToolType(int)`\
  \ 等。这些方法大多接受指针索引作为参数，而不是指针 ID。事件中每个指针的指针索引范围是从 0 到 `getPointerCount()` 返回值减 1（Android\
  \ Developer, 2018）。单个指针在动作事件中出现的顺序是未定义的。因此，指针的指针索引可能会从一个事件变到下一个事件，但只要指针保持激活状态，其指针\
  \ ID 保证保持不变。我们使用 `getPointerId(int)` 方法获取指针 ID，以便在手势中跨所有后续动作事件进行跟踪。然后对于后续的动作事件，我们使用\
  \ `findPointerIndex(int)` 方法获取该动作事件中给定指针 ID 对应的指针索引。\n\n鼠标和手写笔按钮状态可通过 `getButtonState()`\
  \ 获取。在处理触摸事件的 `ACTION_DOWN` 时检查按钮状态是个好主意。如果触摸事件是由次要按钮点击触发的（例如呈现上下文菜单），应用程序可以选择执行某些不同的操作（Android\
  \ Developer, 2018）。为了效率，带有 `ACTION_MOVE` 的动作事件可能会将多个移动样本批量合并在一个对象中。最新的指针坐标可通过 `getX(int)`\
  \ 和 `getY(int)` 获取。批量中的历史坐标可通过 `getHistoricalX(int, int)` 和 `getHistoricalY(int,\
  \ int)` 函数访问。这些坐标之所以称为“历史”坐标，是因为它们比批量中的当前坐标更早；然而，它们仍然不同于先前动作事件中报告的任何其他坐标。为了按时间顺序处理批量中的所有坐标，我们先处理历史坐标，再处理当前坐标（Android\
  \ Developer, 2018）。\n\n对于触摸屏或触控板，它报告手指或任何其他工具施加在表面上的近似压力。该值被归一化到 0（完全无压力）到 1（正常压力）的范围，尽管根据输入设备的校准情况，可能会生成大于\
  \ 1 的值。对于触摸屏或触控板，它报告接触区域相对于设备最大可检测尺寸的近似大小。该值也被归一化到 0（最小可检测尺寸）到 1（最大可检测尺寸）的范围，尽管它不是线性刻度。该值用途有限。为了获得校准后的尺寸信息，我们使用\
  \ `AXIS_TOUCH_MAJOR` 或 `AXIS_TOOL_MAJOR`（Android Developer, 2018）。\n\n######## 单点触控与多点触控笔划\n\
  \n笔划是一系列触摸数据序列，始于触摸屏幕，终于抬起手指。笔划“s”被编码为一系列触摸笔划向量的轨迹，格式为：\n\n![Mathtype978-1-7998-2701-6.ch013.m03](img/ch013.m03.svg)\
  \ (1)\n\n包含位置 ![Mathtype978-1-7998-2701-6.ch013.m04](img/ch013.m04.svg)、时间戳 ![Mathtype978-1-7998-2701-6.ch013.m05](img/ch013.m05.svg)、屏幕压力\
  \ ![Mathtype978-1-7998-2701-6.ch013.m06](img/ch013.m06.svg) 以及手指覆盖面积 ![Mathtype978-1-7998-2701-6.ch013.m07](img/ch013.m07.svg)。所有触摸手势均由若干笔划组成；单点触控笔划或多点触控笔划，其中单笔划在\n\
  \n图 2 (a) 中仅有一条轨迹，只有一个 `ACTION_DOWN` 动作、一个 `ACTION_UP` 动作，以及根据 Android 系统用于生成和消费动作事件对象的采样率而定的可变数量的\
  \ `ACTION_MOVE` 动作。另一方面，多点触控笔划如图 2 (b) 所示，一个手势中包含多个单点触控笔划，最多可达 10 个笔划。多点触控手势被用于在许多\
  \ Android 应用程序中对屏幕对象执行缩放和旋转等复杂触摸操作。\n\n| 图 2. (a) 单点触控和 (b) 多点触控笔划 |\n| --- |\n\
  | ![Figure978-1-7998-2701-6.ch013.f02](img/ch013.f02.png) |\n\n######## 提出的框架\n\n\
  图 3 展示了提出的用户认证框架。我们要强调的是，我们的主要目的是在用户自己的触屏移动设备上识别该用户，而不是验证多个用户，但我们以那种方式设计实验是为了简化研究。\n\
  \n| 图 3. 提出的触摸笔划级/会话级认证框架 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch013.f03](img/ch013.f03.png)\
  \ |\n\n######### 离线阶段\n\n在此阶段，构建一个训练好的神经网络模型，代表每个用户档案，该模型将在后续的在线阶段用于认证用户。该阶段分为四个步骤，如图\
  \ 4 所示；始于使用专为此目的开发的应用程序，通过 Android 操作系统 API 执行原始数据收集。然后提取、选择这些原始数据的特征，并用于训练神经网络模型，为每个用户生成一个训练好的模型。该模型代表了用户触摸设备屏幕的行为模式。\n\
  \n########## 原始数据收集与预处理组件\n\n我们框架中的原始数据是使用操作系统中提供的 API 收集的。在我们的工作中，我们依赖移动设备 Android\
  \ 操作系统提供的事件数据。在原始数据收集阶段，要求用户执行所有移动设备应用程序中常用的特定单点触控和多点触控手势。这实际上是通过一个专为此目的设计和实现的应用程序完成的。该阶段的主要目的是收集代表每个用户的原始触摸数据，以便对用户认证过程进行进一步分析。\n\
  \n从 Android 设备收集触摸数据受到这样一个事实的限制：Android 禁止跨不同应用程序访问触摸数据，即每个应用程序只能读取与其自身交互产生的触摸数据，正如\
  \ Frank 等人 (2013) 所述。基于上述事实，我们开发了一个 Android 应用程序，使用户能够执行特定触摸手势并以结构化形式记录原始触摸数据。在以下章节中，我们将阐述该应用程序的设计与实现。\n\
  \n########## 手势选择\n\n在我们的应用程序中，要求用户执行所有 Android 应用程序中最常用的手势，以模拟用户在使用任何 Android 应用程序时的真实体验（见图\
  \ 4）。因此，我们选择了以下手势：点击 - 长按 - 向上滚动 - 向下滚动 - 向左滚动 - 向右滚动 - 旋转 - 放大 - 缩小 - 快速滑动。\n\n\
  | 图 4. 所用触摸手势列表 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch013.f04](img/ch013.f04.png)\
  \ |\n\n执行的手势要么是单点触控手势，即用户仅使用一根手指执行，如点击、滚动、快速滑动等；要么是多点触控手势，需要用户使用两根或更多手指执行；如放大、缩小、旋转等。\n\
  \n########## 特征提取组件\n\n\n\n此时，许多问题浮现脑海：可以从这些原始数据中提取哪些特征？如何提取？这些特征是否适合很好地区分不同用户？本文将从两个不同的视角讨论特征。第一个是面向笔画的，即从每个笔画作为独立信息单元中提取特征，该单元包含制作笔画用户的指纹信息。这与许多先前研究的做法类似。第二个视角是面向会话的；每个触摸会话被视为一个独立信息单元，从所有会话笔画中提取特征，以获取关于制作该触摸会话用户的更具代表性的信息。将介绍这两种不同的模型，并提供两者之间的完整比较，以选择哪种模型在认证过程中更准确、更高效。在以下章节中，我们将深入探讨特征提取和特征选择过程的细节。\n\
  \n先前的研究介绍了许多可以从原始触摸数据中提取的特征。我们将这些特征纳入考量，此外，我们还将引入其他我们认为在我们的模型中更有用的特征，因为它们能很好地代表用户在触摸屏输入设备上的行为。我们试图涵盖先前与触摸相关的研究中提到的几乎所有最常见特征，例如：坐标、时间、覆盖面积、速度、加速度和按压压力。我们还使用了更复杂的特征，我们认为这些特征将在下一阶段（即分类和识别）中产生更好的结果，这将在本章后面讨论。\n\
  \n########### 笔画级特征模型\n\n正如上一节所述，我们将要实现的第一个特征模型是笔画级特征模型。表 3 列出了拟议的 27 个特征集。其中大多数不言自明，但对于其中一些，我们想补充一些关于它们如何计算以及为什么我们认为它们是相关特征的细节。笔画起点和终点的坐标被选中，因为注意到用户倾向于为其笔画使用独特的屏幕区域。\n\
  \n**表 3. 笔画级拟议特征。**\n\n| 特征名称 | 特征名称 |\n| --- | --- |\n| 起点 X 坐标 | 最后 3 个点的中位数速度\
  \ |\n| 起点 Y 坐标 | 前 5 个点的中位数加速度 |\n| 终点 X 坐标 | 端点连线长度与轨迹长度之比 |\n| 终点 Y 坐标 | 20% 分位数成对速度\
  \ |\n| 平均速度 | 50% 分位数成对速度 |\n| 平均方向 | 80% 分位数成对速度 |\n| 笔画持续时间 | 20% 分位数成对加速度 |\n\
  | 中段压力 | 50% 分位数成对加速度 |\n| 中段覆盖面积 | 80% 分位数成对加速度 |\n| 直接端点连线距离 | 20% 分位数偏离端点连线 |\n\
  | 端点连线方向 | 50% 分位数偏离端点连线 |\n| 轨迹长度 | 80% 分位数偏离端点连线 |\n| 平均合成长度 | 触摸动作数量 |\n| 最大偏离端点连线\
  \ | |\n\n设备独立于笔画位置进行反应。因此，根据 Frank 等人 (2013) 的研究，该位置的选择完全取决于用户，因此在不同用户之间差异很大。笔画最后五个点的中位数速度能够区分在抬起手指前停止手指的用户和在手指仍具有有限侧向速度时抬起手指的用户。根据\
  \ Frank 等人 (2013) 的研究，他们可能具有独特的投掷速度。\n\n触摸分析中的一个重要因素是时间。一些用户在阅读时稳定且缓慢地滚动。其他人快速滚动到新位置并在静止屏幕上阅读。这可以通过笔画持续时间来检测。根据\
  \ Frank 等人 (2013) 的研究，这是关于阅读速度的信息数据，据推测不同用户的阅读速度是不同的。我们用于从原始数据中提取这些特征的所有公式将在本论文末尾的附录\
  \ A 中提及。前面提到的每个特征以某种方式代表用户行为，例如，笔画的平均速度告诉我们用户书写是快还是慢，其他特征也是如此。\n\n########### 会话级特征模型\n\
  \n第二个特征模型是会话级特征模型，其中会话被视为一个信息单元。通过这种方式，收集更具泛化性的信息数据，从而提供触摸屏设备用户行为的更广阔视角。大多数会话级特征是从笔画级特征的聚合中提取的，以给出一般视图。这里拟议了一组\
  \ 35 个特征，如表 4 所列。\n\n**表 4. 会话级拟议特征。**\n\n| 特征名称 | 特征名称 |\n| --- | --- |\n| 平均点击压力\
  \ | 向右滚动平均速度 |\n| 旋转焦点平均压力 | 向上滚动平均距离 |\n| 向左滚动最后 3 点平均速度 | 长按平均压力 |\n| 向上滚动最后 3\
  \ 点平均速度 | 旋转平均半径 |\n| 向左滚动平均距离 | 向下滚动平均距离 |\n| 向上滚动平均方向 | 向下滚动最后 3 点平均速度 |\n| 缩放进入抬起点间距离\
  \ | 向右滚动最后 3 点平均速度 |\n| 向左滚动平均速度 | 缩放进入两次抬起延迟 |\n| 点击时间 | 缩放退出抬起点间距离 |\n| 抛掷平均方向\
  \ | 点击最大距离 |\n| 向上滚动平均速度 | 缩放退出落点间距离 |\n| 向右滚动平均距离 | 向左滚动平均方向 |\n| 向下滚动平均速度 | 平均点击面积\
  \ |\n| 向下滚动平均方向 | 缩放退出两次落点延迟 |\n| 缩放退出缩放时间 | 抛掷平均速度 |\n| 缩放进入缩放时间 | 缩放退出两次抬起延迟 |\n\
  | 向右滚动平均方向 | 缩放进入两次落点延迟 |\n| 缩放进入落点间距离 | |\n\n########## 特征选择\n\n现在我们拥有了所有特征数据，但大量的特征会导致复杂的分类和识别模型。我们必须从所有拟议特征列表中选择最佳特征。这引出了另一个问题：什么是最佳特征，我们如何选择它们？在以下章节中，我们将通过提供两种不同的特征选择方法来回答这个问题；第一种使用区分度和一致性值，而第二种使用主成分分析。在此之前，我们想更清晰地说明特征选择的重要性。\n\
  \n特征选择阶段的主要目的是选择能够以高效方式区分所有用户的特征。如果所选特征在所有触摸会话中对每个用户始终具有不同的值，并且该特征在不同用户会话中具有恒定值，则将达到该阶段的最佳状态。换句话说，最佳特征是同时具有最佳区分值和最佳一致性值的特征。\n\
  \n在接下来的章节中，我们将搜索触摸会话之间的用户-特征一致性以及不同用户之间的特征区分度。然后，我们将把这种方法应用于笔画级特征模型和会话级特征模型。\n\n\
  ########## 特征数据归一化\n\n在处理特征数据之前，我们必须指出它们具有不同的取值范围。以下是笔画级特征模型的特征数据向量示例：\n\n\n\n\n\
  ########### 数据归一化\n\n我们需要对所有特征数据进行归一化，以便使搜索判别性和一致性变得更加灵活。根据公式 (2) 对所有特征值进行归一化，使每个特征的缩放值落在\
  \ 0 到 1 之间：\n\n![Mathtype978-1-7998-2701-6.ch013.m08](img/ch013.m08.svg) (2)\n\n\
  其中 `x = (x[1], ……, x[n])`，`z[i]` 为第 `i` 个归一化数据，`min` 和 `max` 分别为该数据的最小值和最大值。\n\n\
  ########### 判别性与一致性\n\n使用公式 (3) 计算每个用户每个特征集的方差。\n\n![Mathtype978-1-7998-2701-6.ch013.m09](img/ch013.m09.svg)\
  \ (3)\n\n使用公式 (4) 计算每个特征针对所有用户的方差之和。\n\n![Mathtype978-1-7998-2701-6.ch013.m10](img/ch013.m10.svg)\
  \ (4)\n\n我们可以通过将方差之和按升序排列，来判断哪些特征比其他特征更一致。排在最前面的特征是在会话间具有最高用户-特征一致性的特征，即最理想的特征。特征判别性旨在找出哪些特征能比其他特征更好地区分不同用户。我们计算每个特征在所有用户所有会话中的方差，然后将这些方差按降序排列，以确定最理想的特征。排在最前面的特征是区分不同用户能力最强的特征。\n\
  \n########### 主成分分析\n\n主成分分析（PCA）在保留趋势和模式的同时简化高维数据的复杂性。它通过将数据转换为较少的维度来实现这一点，这些维度作为特征的摘要。高维数据在生物学中非常常见，当为每个样本测量多个特征（如许多基因的表达）时就会产生这类数据。这种数据带来的几个挑战可由\
  \ PCA 缓解：计算开销大，以及在测试每个特征与结果的关联时，因多重检验校正导致的错误率增加（Lever et al., 2017）。\n\nPCA 是一种无监督学习方法，类似于聚类——它在没有先验知识（即样本来自不同处理组或具有表型差异）的情况下寻找模式。PCA\
  \ 通过将数据几何投影到称为主成分（PCs）的低维空间来降低数据维度，目标是使用有限数量的 PC 找到数据的最佳摘要（Lever et al., 2017）。\n\
  \n########## ANN 与 SVM 学习（分类阶段）\n\n认证过程的核心是数据分类，这是用户认证中最重要、最关键的阶段。它代表了决策阶段，系统在此决定哪些特征数据属于哪个类（即分类系统将每组特征数据分类到其所属的用户）（Matlab\
  \ Guide, 2019）。\n\n分类算法可遵循三种不同的学习方法：监督学习、无监督学习或半监督学习。在监督学习中，算法使用一组已知标签的示例工作。标签可以是分类任务中的名义值，也可以是回归任务中的数值。相比之下，在无监督学习中，数据集中示例的标签未知，算法通常旨在根据属性值的相似性对示例进行分组，这构成了一个聚类任务。半监督学习通常用于只有少量标记示例可用，同时伴有大量未标记示例的情况（Matlab\
  \ Guide, 2019）。\n\n分类任务可视为一种监督技术，其中每个实例属于一个类，由特殊目标属性（即类属性）的值指示。目标属性可以取分类值，每个值对应一个类。每个示例由两部分组成：一组预测属性值和一个目标属性值。前者用于预测后者的值。预测属性应与预测实例的类别相关。在分类任务中，被挖掘的示例集被划分为两个互斥且穷尽的集合，称为训练集和测试集（Matlab\
  \ Guide, 2019；Shen et al., 2016）。\n\n分类过程相应地分为两个阶段：训练阶段，从训练集构建分类模型；测试阶段，在测试集上评估模型。在训练阶段，算法可以访问训练集中所有示例的预测属性值和目标属性值，并利用这些信息构建分类模型。该模型代表分类知识——本质上是预测属性值与类别之间的关系——允许根据示例的预测属性值预测其类别（Matlab\
  \ Guide, 2019）。\n\n在测试阶段，只有在做出预测后，算法才被允许查看刚分类示例的实际类别。分类算法的主要目标之一是最大化分类模型在训练期间未见过的测试集示例上分类时获得的预测准确率。分类算法发现的知识可以用多种不同方式表示，如规则、决策树、贝叶斯网络等（Mondal\
  \ and Bours, 2015）。在我们的研究中，我们将使用人工神经网络（ANN）和支持向量机（SVM）作为分类算法，构建认证框架的决策组件。\n\nANN\
  \ 和 SVM 用作分类器，将提取的数据特征分类到其对应的类别（即将每个特征向量分配给其对应的用户），因为神经网络分类器提供了使用学习算法进行适应以生成训练模型的能力，该模型可以区分不同用户。用户特征向量作为输入，输出为确定输入特征所属的用户。在下一小节中，将概述\
  \ ANN 和 SVM 的工作原理。在我们的工作中，将比较这两种不同分类器的性能，以找到最适合认证框架的分类器。\n\n######### 在线阶段\n\n在此阶段，我们几乎遍历离线阶段的所有步骤，不同之处在于在线阶段，我们使用每个用户先前训练好的模型，来识别未参与离线训练阶段的新特征数据是否属于该用户，然后将其训练模型用作用户画像。\n\
  \n########## 识别组件\n\n识别组件使用离线阶段生成的目标用户先前训练并适配的模型，针对新的未训练特征向量对其进行测试，以验证训练模型在多大程度上真正能区分设备所有者的触摸动作与冒充者的触摸动作。\n\
  \n########## 实验设计、结果与性能评估\n\n在本节中，将验证所提出的连续触屏认证框架。首先，我们将介绍为从两个不同角度（笔画级别和触摸会话级别）证明该概念而进行的实验。给出实验结果，并评估两种不同模型的性能，以决定哪种模型更具代表性并满足用户认证需求。\n\
  \n########### 原始数据移动应用设计\n\n\n\n\n\n############ 原始数据采集移动应用程序\n\n原始数据采集移动应用程序的设计非常简单。如前所述，由于安全问题，我们无法使用系统服务来监听移动设备上所有正在运行的应用程序中的所有触摸数据。Android\
  \ 操作系统的设计是将每个触摸动作仅传递给其所属的进程，因此我们设计了一个简单的应用程序，要求用户执行前面提到的单点触控和多点触控手势。\n\n#############\
  \ 通过应用程序收集的数据\n\n本小节提供了关于所开发应用程序的一些基本信息，以便充分理解其细节及通过它提取的数据。用户执行的每一笔划都以 `stroke`\
  \ 对象的形式存储在内存中，该对象包含一个触摸动作列表，其中含有以下数据字段：\n\n*   **ActionType（动作类型）**：该字段存储一个整数值，用于确定用户的动作类型，即\
  \ `ACTION_DOWN`、`ACTION_MOVE` 或 `ACTION_UP`，分别指向任意单点触控笔划的开始和结束。此外还有 `ACTION_POINTER_DOWN`\
  \ 和 `ACTION_POINTER_UP` 字段，分别指向任意多点触控笔划的开始和结束。\n*   **xPosition & yPosition（X 坐标与\
  \ Y 坐标）**：这两个字段根据以像素为单位的原点，存储用户手指在二维平面上的位置。\n*   **Size（尺寸）**：该字段存储依赖于触摸屏的指针尺寸。\n\
  *   **Pressure（压力）**：该字段存储用户用手指施加在触摸屏上的压力值。\n*   **TimeStamp（时间戳）**：该字段存储时间戳，我们用它来计算每笔划的持续时间。\n\
  \n随后会创建一个 `touch session`（触摸会话）对象，它包含一个单点触控笔划列表和一个多点触控笔划列表，并附带用户信息：姓名、会话开始时间和会话结束时间。我们将这些原始数据从客户端移动设备传输到服务器（在服务器上对其进行处理，以提取用于分类和识别模型的数据特征）的方式将在下文讨论。\n\
  \n在该阶段，我们面临两个问题：第一个问题是如何在实验期间高效地从用户那里收集原始数据，因为我们必须在很长一段时间内收集数据（以克服用户对实验的适应性）。第二个问题是如果需要，如何在更多触摸会话中收集更多数据？那将非常难以实现。为克服这两个问题，我们设计了一个\
  \ Windows Communication Foundation (WCF) Web 服务，用于接收来自我们移动应用程序的原始数据并将其存储在数据库中，以供进一步分析。\n\
  \n############## Windows Communication Foundation (WCF)\n\n**Windows Communication\
  \ Foundation (WCF)** 是一个用于构建面向服务的应用程序的框架。使用 WCF，您可以将数据作为异步消息从一个服务终结点发送到另一个服务终结点。服务终结点可以是由\
  \ IIS 承载的持续可用服务的一部分，也可以是承载在应用程序中的服务。终结点可以是请求来自服务终结点数据的服务客户端。消息可以像作为 XML、JSON 对象发送的单个字符或单词那样简单，也可以像二进制数据流那样复杂（What\
  \ Is Windows Communication Foundation, 2017）。WCF 旨在提供一种可管理的方法来创建 Web 服务和 Web 服务客户端。\n\
  \n############## JSON (JavaScript Object Notation)\n\n**JSON (JavaScript Object\
  \ Notation)** 是一种轻量级的数据交换格式。它易于人阅读和编写，同时也易于机器解析和生成。JSON 是一种完全独立于语言的文本格式，但使用了包括 C、C++、C#、Java、JavaScript、Perl、Python\
  \ 等在内的 C 语言家族程序员熟悉的约定。这些特性使 JSON 成为理想的数据交换语言（Introducing JSON, 2018）。\n\n在我们的实验中，内存中的对象（即\
  \ `session` 对象、`stroke` 对象和 `touch action` 对象）被转换为序列化的 JSON 对象，以便它们能通过 Web 服务跨互联网从\
  \ Android 客户端设备传输到数据库服务器，以进行进一步的数据分析。此处首选 JSON 对象而非 XML 消息，因为 JSON 比 XML 消息消耗更少的资源，且几乎所有编程语言都支持它，此外它比另一种选择（即\
  \ XML 消息）更简单。\n\n########### 实验设置\n\n选取了 10 名移动设备用户，年龄从 24 到 60 岁，4 名女性和 6 名男性，均为右撇子，执行特定的触摸动作；即单点触控和多点触控手势的组合。所用设备为三星\
  \ Galaxy Note 10.1 平板电脑，具有 2560 x 1600 像素、299 ppi 密度的超清 LCD 显示屏，运行 Android 4.4 系统。\n\
  \n根据我们的文献综述，大多数研究人员如 AbdelDayem 等人 (2016)、Fridman 和 Weber (2016) 以及 Ali 等人 (2016)\
  \ 都设计了带有指导方针的实验场景，以引导用户完成实验，从而使收集的原始数据保持在合适的区域内并降低其粗糙度。然而，在我们的实验场景中，我们没有对用户如何执行触摸手势施加任何限制。在我们的场景中，用户可以自由地执行手势，就像他在使用真实的移动应用程序并执行一系列触摸手势一样。我们认为，这更加真实，能给我们带来比大多数研究在其实验场景中所做的更能反映稳健适用模型的结果。\n\
  \n我们开发了一个 Android 应用程序，使用户能够执行特定的触摸手势，并以结构化形式记录原始触摸数据。每位用户在跨度为 2 个月的时间段内进行了约 10\
  \ 次触摸会话，以避免用户适应实验任务。用户需执行我们认为在大多数移动设备应用程序中最常用的特定触摸动作。要求用户执行以下触摸手势：点击、轻扫、长按、向上滚动、向下滚动、向左滚动、向右滚动、放大、缩小和旋转。图\
  \ 5 展示了我们实验中使用的应用程序快照，该程序模拟用户输入动作。执行的手势要么是单点触控手势，即用户仅使用一根手指执行，如点击、滚动、轻扫等；要么是多点触控手势，即用户必须使用两根或更多手指，如放大、缩小、旋转等。\n\
  \n| 图 5. 实验移动应用程序示例快照 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch013.f05](img/ch013.f05.png)\
  \ |\n\n在实验期间，平板设备记录了用户的触摸原始数据，这些数据代表若干原始特征：事件代码（例如手指抬起、手指按下、手指移动、多点触控）、以毫秒为单位的绝对事件时间以及设备方向。对于每个触摸手指，我们记录以下数据：\n\
  \n```\nS[i] = {x[i], y[i], P[i], A[i], Oi} (5)\n```\n\n其中 `x[i]`、`y[i]` 为手指位置的 x\
  \ 和 y 坐标，`P[i]` 为手指在触摸屏上的压力，`A[i]` 为手指覆盖的触摸屏面积，`Oi` 为屏幕方向。所有这些都是 Android 系统通过其标准\
  \ API 提供的原始特征。\n\n收集到的原始数据被提交到数据库服务器，以便在下一步中进行分析并提取我们研究所需的特征。在接下来的章节中，我们将展示分为两个方向的实验结果。首先给出笔划级方法的结果，随后是会话级方法的结果。最后，我们对这两种方法做出总结。在每组实验中，特征选择方法和分类器都会有所变化。\n\
