  \    Rustamji Institute of Technology, India\n\n##### 摘要\n\n本章简要介绍了与数字取证相关的各种基础知识和概念。数字取证的概述包括数字取证的生命周期及其不同阶段，即准备、收集、分析和报告。数字取证工具的评估包括\
  \ `EnCase Forensic`、`FTK (Forensics Tool Kit)` 和 `Helix` 数字取证工具及其优缺点。数字取证工具和技术检查包括数字检查技术、活体取证分析、Windows\
  \ 注册表恢复、数字取证工具比较，并重点关注用于数字取证分析的 ACPO 准则。\n\n##### 引言\n\n数字取证是一门科学，涉及证据收集、调查和逆向工程，可确定计算机是如何被组成的。有多种工具和方法可供使用，以正常工作并帮助调查人员认证和分析证据\
  \ (Bennett, 2012)。数字取证的目标是以最原始的形式保存任何类型的数字证据。数字取证基于通过收集、识别和验证数字证据或信息来执行结构化研究，主要目的是重现发生在受害者计算机上的网络犯罪相关的过去事件。\n\
  \n尽管如此，数字取证调查人员面临的挑战可分为三类：\n\n1.  **技术挑战**：如加密、隐写术、不同的媒体格式和分析。\n2.  **法律挑战**：如隐私问题、缺乏标准化的国际立法和行政问题。\n\
  3.  **资源挑战**：如获取和分析取证介质所需的时间。\n\n\n\n\n\n##### 犯罪发生且调查陷入僵局，因为似乎没有目击者或证据——直到数字取证介入。\n\
  \nFBI 于 2008 年利用计算机取证破获了一起案件，2011 年 FBI 政府部门接到一起事件响应与数字取证案件，涉及两名儿童在一家旅馆遭受性虐待。不幸的是，当线索被接收时，犯罪已经发生。当时没有证据可对罪犯提起指控，直到对嫌疑人的计算机进行了分析。计算机上的证据——一封已删除的、包含虐待发生地点旅馆路线的电子邮件——足以指控三名成年人，他们目前正在服无期徒刑。有时，直到进行取证分析，你才会知道犯罪已经发生。回想一下之前描述的情况：一名高管在辞职后、去竞争对手公司工作前，访问了商业机密。关键在于，事件可能看似无害或无法解决，直到情况被分析。例如，服务器似乎无故下线，分析日志文件后，你可能会确定原因是入侵后安装的恶意软件。如果犯罪已经发生或甚至只是被怀疑，调查员以取证合规的方式收集和记录证据至关重要，因为下一步就是将所有证据移交给执法部门\
  \ (Beebe, 2009)。\n\n数字取证的另一个应用是为电子取证收集证据——即审前阶段，收集电子证据。例如，律师可能想证明配偶出轨，并可能利用对电子邮件文件的取证分析来证实指控。在证据收集中，技术和准确性对于确保事件发生时所收集数据的真实性至关重要。取证调查员必须时刻铭记，他或她可能会被要求为收集证据所用的技术进行辩护。此处呈现一则判例法，以演示在收集和保存证据时若不遵守法律会发生什么。处理数字证据是一个复杂的过程，应由专业人员处理\
  \ (Beebe, 2009)。如果处理不当，证据很容易被销毁，若进入法庭审理，则会被判定为不可采信。有些证据容易找到，但也可能有其他证据被隐藏、删除或加密，任何人都无法访问。增加复杂性的是，如果证据处理不当，将被排除或导致败诉。\n\
  \n###### 数字取证的生命周期\n\n数字取证生命周期有四个主要阶段。\n\n####### 准备\n\n准备是数字取证生命周期的第一阶段。在此阶段，我们为涉及数字证据的取证调查做准备，这在长远来看能节省大量时间。这包括所需的所有设备、工具，以及对工具的理解，如如何高效使用这些工具来收集和分析证据。应有一个安全的地方存放我们的数据或证据，并确保其安全存储，以防污染或数据破坏。如今有大量硬件和软件用于执行取证调查。一些软件用于以取证合规的方式复制证据，不改变证据；一些软件用于分析已复制的驱动器空间；写保护器用于证明磁盘复制过程未修改证据。调查期间可能有用的其他物品包括笔记本、证据袋、胶带、标签、笔、相机等。这并非详尽的物品清单，但能让你了解准备数字取证调查时需要考虑哪些类型的事项\
  \ (Chan, 2011)。\n\n####### 收集\n\n收集是数字取证的第二阶段。这包括记录设备型号和制造商等信息，以及拍摄周围环境照片。调查员可拍摄屏幕照片，以显示进入现场时的情况。此外，调查员还可检查任务栏，并拍摄最大化运行的应用程序照片。文档记录完成后，需处理电子数据。众所周知，如今计算环境复杂性日益增加，调查员的响应并非对每起事件都相同，立即关机可能不是避免进一步损害的最佳主意。不应关闭计算机的原因是，易失性数据（运行中的进程或网络连接）会丢失。检测到关机时，恶意程序也可能发起恶意攻击。因此，有多种方式响应活体数据收集，重点收集易失性数据、收集易失性数据和日志文件，或通过收集所有内容（复制每一比特数据）进行全面调查。镜像存储在外部驱动器上，或可使用网络工具（如\
  \ `netcat` 或 `crypcat`）通过网络发送。`Netcat` 是一种网络工具，可跨网络连接读写数据。`Cryptcat` 是带加密功能的 netcat。请记住，切勿使用嫌疑系统进行任何分析，否则会覆盖证据。所有收集到的数字证据必须得到保存，以适合法庭使用。数字证据非常脆弱，如雪地或沙滩上的脚印，因为它极易被销毁或篡改。保存证据的一种方法是将数字信息传输到只读、不可写的\
  \ CD-ROM 上，或将数据上传到源服务器并对文件进行哈希，以确保数据完整性。\n\n############# 分析\n\n\n\n\n\n#############\
  \ 分析\n\n分析是数字取证的第三阶段。数据收集完成后，将对数据进行分析。嫌疑机器的镜像需要被还原，以便开始对证据进行分析。镜像应还原到一个稍大的干净驱动器上，或者还原到一个由同一制造商生产的干净目标驱动器上，以确保镜像能够完全容纳。之后，使用取证工具（如\
  \ `Encase` 取证工具包）开始审查过程。要恢复已删除的文件，需要审查镜像的未分配空间。调查人员可能会找到完整的文件或文件片段，因为利用删除功能时，文件永远不会从硬盘驱动器上真正移除。被删除的只是操作系统用于构建目录树结构的指针。一旦该指针消失，操作系统将无法找到该文件——但调查人员可以！但请记住，当创建新文件时，会选择一个内存位置，因此文件有可能被覆盖，或者至少部分被覆盖。原因如下：硬盘驱动器上的所有数据都被排列成称为簇的分配单元。\n\
  \n常见的调查之一是互联网使用情况分析，用于监控工作场所的不当使用，例如员工赌博或浏览色情内容。离婚律师可能会利用此类分析来证明不忠，通过展示社交网站上的证据，或证明配偶曾访问博客网站寻求轻松离婚的建议。通过证明配偶在博客发帖前后使用信用卡进行了购物，可以将匿名博客发帖归因于该配偶。Web\
  \ 浏览器存储多种信息，例如访问页面的历史记录、最近输入的 URL、先前查看页面的缓存版本和收藏夹。挑战还在于证明被指控者在事件发生时确实是使用该计算机的人。例如，如果在某员工的计算机上浏览了色情内容，调查人员必须确保该员工在滥用行为发生时并未休假或全天开会。\n\
  \n######## 报告\n\n数字取证生命周期的最后阶段是报告上一阶段分析的结果，并描述采取行动、选择工具和程序背后的理由。`NIST`（2006）描述了影响报告的三个主要因素：替代解释、受众考量和可执行信息。替代解释通过包含对发生事件的所有合理解释，来支持对事件结论的论证。\n\
  \n在 Julie Amero 案中，她因在未成年人面前于学校计算机上浏览色情内容而被判有罪（后被推翻）。如果调查人员寻找过替代解释，他们就会发现浏览色情网站是由间谍软件导致的。然而，显然无知的原始调查人员仅呈临时\
  \ Internet 文件目录中的证据，误导了陪审团。他们错过了替代解释，导致她被不公正地定罪，因为他们的调查结果（临时 Internet 文件和防火墙日志）并不能证明用户的主观意图。专家取证调查人员后来进行了重新分析（Fowler,\
  \ 2011）；结果发现，杀毒软件是过期的试用版，系统上未安装反间谍软件，且间谍软件肯定是在事件发生前安装的。原始调查人员还通过告知陪审团“间谍软件无法生成弹窗”（不实）、“弹窗不可能无限循环”（不实），以及色情网站上部分文本使用的红色链接颜色表明\
  \ Amero 点击了链接（无论是否有意，链接访问均显示为已访问颜色，他们称该颜色为红），从而误导了陪审团。在该特定案例中，链接确实是红色的；然而，如果原始调查人员打开过浏览器首选项，他们会注意到几点：链接设置为访问后显示绿色，而\
  \ HTML 源代码将字体颜色更改为了红色。调查人员还通过告诉陪审团“间谍软件安装到计算机的唯一途径是实际访问色情网站”（不实）来误导陪审团。原始调查中存在多处不一致之处。\n\
  \n取证分析结果报告的内容和详细程度会因事件而异。因此，取证分析报告的详细程度由需要该报告的受众决定。如果分析导致的是非刑事案件，高管或管理层可能只想要一份简单的概述（Giustini,\
  \ 2009）。\n\n######## 数字取证工具评估\n\n在数字取证中，分析和调查涉及许多步骤和技术。如今，有许多数字取证技术和相应工具可供数字取证调查使用，但其中能在市场上广受欢迎并成功提供准确证据和分析的寥寥无几。数字取证调查和分析中涉及的步骤是任何数字取证工具效率的主要贡献因素。有许多流行的数字取证工具，如\
  \ `Encase`、`FTK`（取证工具包）和 `Helix`，但主要目标是在不同参数上评估和比较这些工具。下文讨论了每种工具的优势和局限性（Fowler,\
  \ 2011）。\n\n######### Encase 数字取证工具\n\n众所周知，有数字取证工具和技术，但其中流行的寥寥无几。`Encase` 就是其中一款数字取证工具。它是最广泛使用的数字取证工具之一，可适用于数字取证证据、调查和分析过程的任何环节或每个步骤。`Encase`\
  \ 拥有许多新的不同功能和一些内置工具，可用于数字数据。`Encase V7` 中还有一个高级搜索选项，用于调查和分析传统计算机和数字源（Fowler, 2011）。\n\
  \n########## Encase 数字取证工具的优势\n\n`Encase` 数字取证工具有许多优势或益处。\n\n*   `Encase` 数字取证工具可用于完成传统计算机和高级数字取证证据的获取、调查和分析。\n\
  *   `Encase` 数字取证工具有助于查询处理和 `MLI`（多语言索引），可轻松针对数字证据源提取过程和进一步调查过程完成这些任务。\n*   `Encase`\
  \ 数字取证工具可用于 `C++`、`Java` 等编程语言的定制，这些场景使用面向对象编程语言。\n*   与其他数字取证工具相比，`Encase` 拥有简单的报告架构。\n\
  *   该数字取证工具的关键优势是生成二进制副本，为检查员提供了并行预览证据数据与实际数据的选项。\n\n########## 数字取证工具的局限性\n\n数字取证工具存在一些劣势和局限性。\n\
  \n*   `Encase` 在用户界面和设计阶段存在复杂功能问题。\n*   与 `Helix` 和 `FTK` 等其他数字取证工具相比，`Encase` 在最终用户培训和实时搜索功能方面存在时间限制问题。\n\
  \n########## FTK（取证工具包）\n\n\n\n\n\n########### FTK (取证工具包)\n\n与其他数字取证工具相比，FTK (Forensics\
  \ Tool Kit) 拥有许多先进的技术、特性和功能。访问数据是取证工具包的基本技术。FTK 提供了扫描硬盘和内存等数字证据源的最简便方法。借助 FTK，可以检索被删除的相关信息，如电子邮件、密码和其他相关文本或字符串。在数字取证工具\
  \ FTK 中，**Imager** 是可以扫描并以单个或多个磁盘镜像形式检索硬盘镜像的工具之一。与其他工具相比，借助 FTK 也可以完成复杂的 MD5 哈希值计算。FTK\
  \ 是最流行的数字取证工具，可用于许多调查和网络犯罪案件中。\n\n############ FTK 的优势\n\n*   FTK 提供了处理、搜索和轻松恢复\
  \ IPv4 和 IPv6 两种协议数据包的能力。\n*   借助 FTK，可以读取不同的文件格式，而其他数字取证工具则无法做到。\n*   FTK 的一个重要优势是与其他数字取证工具（如\
  \ Helix 和 EnCase）相比，能够轻松快速地恢复 ARP 以太网帧。\n*   FTK 提供了高效的网络、内存和文件管理，具有定制化程度和用户界面简洁性。\n\
  *   哈希值计算可以由取证工具包轻松完成。\n*   FTK 提供了简单读取多个证据源和相关文件的功能，其中包括手机、智能手机、平板电脑、PDA、笔记本电脑等。\n\
  \n############ 取证工具包的局限性\n\nFTK 存在一些局限性：\n\n*   FTK 数字取证工具在事件分析方面存在响应时间问题。\n*  \
  \ 在 FTK 中，将 FTK 与第三方取证工具集成的过程繁琐且复杂，配置的复杂性限制了工具级集成技术的范围。\n\n########### Helix 数字取证工具\n\
  \nHelix 构建于 UNIX 操作系统之上。它是一个基于 Ubuntu 操作系统架构的面向数字化的取证工具。Helix 数字取证工具的主要目标是对事件进行数字化调查、分析和获取。事件报告的生成同时满足传统计算机和数字取证的需求。Helix\
  \ 可以轻松在 CD 和 DVD 等便携式存储设备上运行。它还具备在包括 Windows、Linux 和 Solaris 等在内的多操作系统环境中工作的能力。Helix\
  \ 是一个合规的取证工具，并被视为数字取证分析过程中的主机计算机。\n\n############ Helix 数字取证工具的优势\n\n数字取证工具的一些优势如下：\n\
  \n*   数字取证工具的主要优势是它具有在 Live CD 上运行的能力。\n*   Helix 在数字取证过程中使现有操作系统处于非活动状态，并获取和分析源设备。\n\
  *   借助 Helix 数字取证工具，可以收集所需网络的全貌。\n*   Helix 具备在连接到网络的所有设备和复杂可疑网络上运行的能力。\n*   Helix\
  \ 拥有检查、调查和分析等许多关键功能。\n*   它还具备实时网络取证获取的关键功能。\n*   Helix 工具提供生成准确的数字取证调查报告的功能。\n\n\
  ############ Helix 数字取证工具的局限性\n\nHelix 数字取证工具存在一些局限性：\n\n*   Helix 数字取证工具的主要局限性是用户界面和复杂的命令知识要求。\n\
  *   实时成像和备份过程本质上比较复杂。\n\n########### 数字取证工具对比：FTK、EnCase 和 Helix\n\n见表 1。\n\n**表\
  \ 1.** EnCase、FTK (Forensics Tool Kit) 和 Helix 数字取证工具简要表格对比\n\n| FTK (Forensics\
  \ Tool Kit) | Helix 工具 | EnCase 工具 |\n| :--- | :--- | :--- |\n| 与其他数字取证工具相比，数字取证证据源的性质比较复杂。\
  \ | 只有借助该工具，才能进行检查、分析和实时取证获取。 | 与其他工具相比，EnCase 的调查、分析和数字取证证据获取非常容易，且配置较少。 |\n| 与其他数字取证工具相比，数据预览非常简单，但该工具的源媒体比较复杂。\
  \ | 在 Helix 数字取证工具中，源和数据预览与 EnCase 和 FTK 工具相比都比较复杂。 | 在 EnCase 数字取证工具中，数据预览和源证据方面具有并行处理的优势。\
  \ |\n| 与 Helix 和 EnCase 等其他工具相比，事件报告结构和数字取证分析非常简单易行。 | Helix 数字取证工具在相应的数字取证分析过程的实时报告方面存在不足，且复杂度较高。\
  \ | 在 EnCase 中，与 FTK 和 Helix 相比，数字取证分析和相应的报告结构比较简单。 |\n| 在 FTK 中，可以进行简单的实时和离线搜索。\
  \ | 在 Helix 数字取证中，实时搜索本质上比较复杂，但与其他取证工具相比，搜索时间非常短。 | 在 EnCase 数字取证工具中，存在耗时的实时搜索复杂性。\
  \ |\n| 在 FTK 数字取证工具中，可以读取 NTFS 等多种文件格式；这是 FTK 的主要优势。 | 在 Helix 数字取证工具中，无法读取多种文件格式。\
  \ | 在 EnCase 数字取证工具中，存在读取多种文件格式的限制。 |\n| 借助 FTK 工具，可以非常简单地进行密码恢复和注册表恢复。 | 使用 Helix\
  \ 进行密码恢复和注册表恢复存在一定困难。 | 在 EnCase 数字工具中，密码恢复和注册表恢复相对较慢且复杂。 |\n| FTK 工具的主要优势是复杂功能和数据完整性。\
  \ | 使用 Helix 时，数据完整性过程复杂且精密，但与当前工具相比，所需功能支持水平较低。 | 在 EnCase 中，数据完整性过程未能妥善完成，且存在哈希函数问题。\
  \ |\n| FTK 数字取证工具支持面向对象和结构化编程语言。 | Helix 数字取证工具支持 UNIX 编程语言和 Shell 脚本。 | EnCase\
  \ 也支持 C++ 和 Java 等面向对象编程语言。 |\n| 与 Helix 和 EnCase 相比，FTK 中可以进行简单的查询检索和处理功能。 | Helix\
  \ 的主要优势是在实时系统上具有更好的查询处理能力。 | EnCase 的主要优势是查询处理，且支持 MLI（多语言索引）。 |\n\n###########\
  \ 数字取证工具与技术考察\n\n\n\n\n\n########### 数字取证工具与技术\n\n我们在上一节中简要讨论了各种工具及其技术。通过对比这些工具，我们得出结论：这些工具既有优点也有局限性，且适用于各种技术。在数字取证的数据获取、检查、调查与分析过程中，证据来源可以是简单的计算机、内存、笔记本电脑、智能手机和平板电脑，而在所有这些场景中，数字证据来源都起着关键作用。这一数字调查来源在估算相应工具和技术的优化条件方面也起着关键作用，相应的工具可以是移动设备、内存或笔记本电脑（Huebner\
  \ 等，2009）。数字取证分析过程中的主要步骤是收集数字证据，在此背景下，评估本报告中提到的每个工具的作用以衡量数字取证工具的整体性能非常重要（Rocha，2011）。在本节中，我们将讨论\
  \ EnCase、FTK 和 Helix 等相关工具的数字检查技术，内容如下。\n\n############ 数字检查技术\n\n数字检查过程涉及多种技术。其中\
  \ Windows 注册表恢复或重建以及实时取证是关键。被调查分析的来源决定了相应数字取证工具的性能（Rocha，2011）。用于评估过程的两种技术如下。\n\n\
  ############# 实时取证分析\n\n数字取证检查过程中的关键环节是实时取证分析，其中包括在实时或离线环境中获取硬盘等内存设备镜像的步骤。相应的硬盘实时取证分析需要至少\
  \ 10 TB 的数据，且该过程可以是在线、实时或离线的。\n\n通常，典型的实时取证分析包括在在线和离线场景下制作硬盘或其他内存源的镜像。实时取证分析过程存在一些负面影响，包括哈希校验、时间戳、获取所需的交换密钥、收集注册表项以及频繁的内存检查。\n\
  \n使用 EnCase 可以进行实时取证分析，但在证据收集和所需的哈希校验方面存在局限性。EnCase 缺乏对 SHA-1 和相应加密技术所需级别的支持。\n\n\
  FTK 仅支持有限的实时搜索和取证分析选项，并受时间戳问题和故障困扰，因此配置本质上较为复杂。\n\n由于 Helix 运行在 Live CD 或 USB 上，因此它提供实时取证支持，但也会针对取证分析访问少量离线内容。\n\
  \n############# Windows 注册表恢复\n\n通常，恢复过程涵盖 Windows 注册表恢复或重建，包括 IIS 和 FTP 事件日志以及系统安全要求级别。所有已安装程序、访问过的网站、最近处理过的文档等关键信息均由\
  \ Windows 注册表保存。数字取证分析和调查过程可恢复所需的 Windows 注册表，也可重建所需的 Windows 目录（Pasupuleti，2019）。\n\
  \n此背景下的局限性在于，EnCase 无法维护相应目录所需的日志文件，因此无法使用该工具完成 Windows 注册表的重建和恢复。FTK 数字取证工具是恢复和重建\
  \ Windows 注册表的最佳途径。使用 FTK 工具可以更简单地搜索 Windows 注册表的复杂工件，如 URL 检索记录、日志文件和各类文档（Huebner\
  \ 等，2009）。\n\nHelix 纯粹运行在 UNIX 操作系统环境中，因此其主要局限性在于无法重建和恢复 Windows 注册表。\n\n############\
  \ 数字取证分析的 ACPO 准则\n\n数字取证分析过程遵循以下 ACPO 准则：\n\n*   **ACPO 准则 1：** 当前 ACPO 准则的主要来源是取证调查。在此背景下，网络犯罪调查中实施的所需职责、权限和相应行动纯粹属于法律和警方范畴，取证调查员没有重要角色。\n\
  *   **ACPO 准则 2：** 当前 ACPO 准则涵盖了实验室中所有与取证活动相关的活动。应考虑取证调查员或检查员的能力和水平。假设所有数字取证技术都应被考虑，或者任务不会在过程中途停止。\n\
  *   **ACPO 准则 3：** ACPO 准则 3 主要涉及数字取证中的实际数据记录。在此背景下，最高优先级给予所需的审计角色和管理。\n*   **ACPO\
  \ 准则 4：** 当前 ACPO 准则的主要来源是取证调查及相关信息。在数字取证分析过程中，维护所需的完整性和可靠性是取证调查员的责任。\n\n#######\
  \ 结论\n\n本章的主要目标是分析和评估各种数字取证工具和技术。分析过程考虑了 EnCase、FTK 和 Helix，在数字取证获取、检查和分析的各个层面对这些工具进行了比较和评估。报告讨论了每个层面的优缺点，并对所需的\
  \ ACPO 准则进行了讨论和解释。\n\n从对数字取证的整体分析来看，FTK、EnCase 和 Helix 数字取证工具各有局限性和特点，可应用于大多数数字取证和关键网络分析场景。\n\
  \n############ 数字取证的常见应用\n\n取证一词意味着在法庭上针对某些恶意犯罪者，数字取证用于恢复真实的数字证据，这在许多情况下属实。数字取证不仅限于法庭。数字取证寻找的证据或多或少能支持或反驳某种假设。根据这些应用，数字取证可分为五个部分：\n\
  \n############# 识别\n\n识别是所有数字取证的起点。在任何事情之前，识别存储的数据至关重要。如今，数据存储在计算机和服务器的硬盘、闪存驱动器、网络设备上。\n\
  \n############# 保全\n\n保全是数字取证的关键环节。它很大程度上取决于调查员。调查过程中，另一种常见做法是创建正在检查的数据或设备的取证镜像。\n\
  \n############# 恢复\n\n每个案件都涉及某种恢复过程。这包括从正常操作系统流程中恢复已删除文件、故意删除的文件、受密码保护的文件，甚至损坏或腐坏的文件。\n\
  \n############# 分析\n\n分析是调查的核心。我们使用多种应用程序和工具来查看常见工件，如内存、注册表、事件日志和浏览器历史记录。简单的 Google\
  \ 搜索就是一个很好的例子。每当你搜索某样东西时，它不仅记录在浏览器历史记录中，还有一个协调的注册表工件指向该搜索。\n\n############# 提交\n\
  \n\n\n\n\n#### 第 9 章\n\n**作者**\n\n*   **Jia Lu**  \n    奥克兰理工大学，新西兰\n*   **Wei Qi\
  \ Yan**  \n    奥克兰理工大学，新西兰\n\n##### 摘要\n\n随着摄像头等安防监控设施成本的降低，视频监控已广泛应用于银行、交通、商场等公共安全领域，使警方能够监控异常事件。通过深度学习，作者利用模型训练和测试实现了人体行为检测与识别的高性能。本章使用公共数据集\
  \ `Weizmann dataset` 和 `KTH dataset` 训练深度学习模型。研究了四种用于人体行为识别的深度学习模型。结果表明，`YOLOv3`\
  \ 模型表现最佳，在 `Weizmann dataset` 上实现了 96.29% 的 mAP，在 `KTH dataset` 上实现了 84.58% 的 mAP。本章利用深度学习进行人体行为识别，并在数据集的支持下评估了不同方法的结果。\n\
  \n##### 介绍\n\n随着各种场景中监控摄像头数量的快速增加，从成千上万的监控视频中定位感兴趣区域 (`ROI`) 已成为突出问题之一。另一方面，随着监控系统的持续扩展，海量视频资料被归档，从这些大数据中查找有用信息变得越来越困难；目标识别的效率也随之降低。因此，如何在海量视觉大数据的环境中使监控更加高效，需要予以考虑。\n\
  \n对于传统的人体行为识别，都需要考虑低层（无语义理解）和高层（有语义理解）两个处理过程。低层处理有助于定位感兴趣区域并减少视频资料中的无用信息；同时，高层处理将分析这些特征以最终实现行为识别。\n\
  \n如今，随着计算设备能力的增强，深度神经网络 (`DNNs`) 在目标检测方面获得了极大关注，从而开启了计算机视觉的新时代 (Lu et al., 2017)。深度学习模型\
  \ (Hinton et al., 2006) 包含多个隐藏层；采用预训练方法以缓解局部最优解的困扰；隐藏层因“深度”而达到多层，因此称为“深度学习”。最先进的方法主要依赖人工神经网络，如卷积神经网络\
  \ (`CNNs` 或 `ConvNets`)、`R-CNNs`、`Fast R-CNNs`、`Faster R-CNNs`、`Mask R-CNN` 和 `SSD`\
  \ (单发多框检测器)。此外，深度学习已在监督和无监督模型中均得以实现 (Ji et al., 2013)。显然，这些工作在各个方面清楚地展示了深度神经网络、浅层神经网络以及传统机器学习之间的差异\
  \ (Liu et al., 2016)。\n\n在人体行为识别中，为深度神经网络提出了边界框以对这些建议像素进行重采样。由于图像中存在固有的局部模式，如眼睛、鼻子、嘴巴等，`CNN`\
  \ 通过将数字图像处理与人工神经网络相结合而衍生出来，它通过卷积核连接上下层。卷积核在所有图像间共享；图像在卷积操作后仍保留原始位置。与传统方法相比，深度学习以端到端的方式进行，具有更高的分类概率，且对光照、姿态等表现出不变性\
  \ (LeCun et al., 2004)。此外，区域建议方法和基于区域的卷积神经网络 (`R-CNN`) 在模式识别中以高精度取得了更大成功 (Ren et\
  \ al., 2017)。选择性 `Faster R-CNN` (Uijlings et al., 2013) 在一系列比较中也表现出优异性能 (Ren et\
  \ al., 2017; He et al., 2016)。区域建议网络 (`RPN`) 为端到端目的而训练，并生成了感兴趣区域的精确位置。`RPN` 和 `Fast\
  \ R-CNN` 已合并为单一网络，能够加速检测 (Ren et al., 2017)。\n\n本书章节安排如下。第 2 节呈现文献综述，第 3 节描述我们的方法。第\
  \ 4 节展示我们的结果，第 5 节得出结论。\n\n###### 相关工作\n\n人体行为理解是指分析和识别人体运动模式，并用自然语言描述 (Aggarwal\
  \ et al., 1997)。运动序列可视为在不同状态节点中静态动作的遍历过程 (Guo et al., 1994)。因此计算遍历过程的联合概率；将其最大值纳入考量进行分类\
  \ (Fujiyoshi et al., 2004)。\n\n人体行为识别旨在自动识别预定义行为，从而有效减少人力 (Aggarwal et al., 1997)。为识别和分析人体行为的周期性运动，提出了时空模型\
  \ (Rui et al., 2000) 和周期性模型 (Cutler et al., 2000)。人体行为识别主要可分为两类，包含基于模板匹配的方法和基于状态空间的方法。\n\
  \n\n\n\n\n###### 利用无监督学习和深度学习进行人类行为识别\n\n####### 无监督学习方法\n\n人类行为识别可以通过无监督学习来实现，无监督学习不需要预训练数据；在这种情况下，训练数据中的类别是未标记的。无监督学习的目标是研究未标记的训练数据，以揭示数据的规律模式，从而进行进一步的数据分析。聚类是无监督学习中最典型的方法。\n\
  \n提出了一种多观测隐马尔可夫模型（`MOHMM`）来检测异常活动，该模型对嘈杂和稀疏的数据集非常有效（Xiang et al., 2005）。自组织映射（`SOM`）是一种无监督学习神经网络，它可以将高维输入数据映射到低维空间，保持高维空间中输入数据的拓扑结构；它将高维空间中相似的样本点映射到输出层中相邻的神经元。`SOM`被用于检测罕见事件；一种利用`SOM`映射中的高斯混合模型（`GMM`）对新事件进行分类的方法实现了异常行为识别（Petrushin\
  \ et al., 2005）。一种无监督学习方法通过提取兴趣点与时空词相结合，实现了人类动作分类，该方法可以对包含复杂视频序列的多种动作进行分类（Niebles\
  \ et al., 2008）。\n\n####### 深度学习基础\n\n2006 年，深度学习的概念被提出；具体而言，使用预训练方法来缓解局部最优解问题，隐藏层增加到多层，从而在实际场景中实现了“深度”。此外，多层神经网络具有更强的学习能力，通过逐层初始化可以有效缓解其训练复杂度（Hinton\
  \ et al., 2006）。与传统方法不同，受`CNNs`（`ConvNets`）启发的深度学习开启了现代计算的新纪元。尽管深度学习直接使用视频帧作为输入数据，但图像将在不进行特征提取的情况下直接输入网络。因此，这些方法被视为端到端方法，特征图由网络自行生成并集成到算法中，无需人工干预；端到端方法的输入是原始图像，输出是带有概率的类别。\n\
  \n######## 卷积神经网络（CNNs）\n\n`CNNs`作为目前最流行的方法之一，已被应用于直接处理原始图像。图像中存在固有的局部模式，如嘴巴、眼睛等；因此，`CNNs`被视为数字图像处理和人工神经网络的结合，在目标识别、图像分割（Ciresan\
  \ et al., 2012）和目标检测（Farabet et al. 2013; Girshick et al., 2014; Krizhevsky et al.,\
  \ 2012）中发挥着关键作用。`CNNs`通过卷积核将上下层连接在一起；“权重共享”策略可以充分利用一组具有相同权重的神经元，这在识别任务中取得了巨大成效（LeCun\
  \ et al., 1995; LeCun et al., 1998）。图 1 展示了典型`CNNs`的示例，其中“Conv”表示用于特征提取的卷积层；“Pool”表示用于降维的“池化层”，`FC`代表“全连接层”。\n\
  \n**图 1. 典型 CNN 示例**\n\n![Figure978-1-7998-2701-6.ch009.f01](img/ch009.f01.png)\n\
  \n与传统方法相比，卷积层中的卷积核可以用作特征图提取器。尽管每一层都需要自行设计，但不需要额外的操作来获取特征图。端到端学习方法消除了在执行每个单独学习任务之前对数据进行标注的需求。\n\
  \n在端到端模型中，预测结果作为输出获得。将预测结果与真实标签进行比较，可能会产生误差。该误差将通过反向传播最小化到模型的每一层，每一层的表示将根据误差进行调整，直到模型收敛或达到预期误差。然而，对于传统机器学习方法，从原始数据中提取的特征在图像中尤为突出，因为图像像素数量太大，数据维度非常高，这将导致维度灾难问题，而传统机器学习需要多个串联的模型。在表\
  \ 1 中，我们总结了这两种不同方法及其在人类行为识别中的优缺点。\n\n**表 1. 人类行为识别的两种不同方法总结**\n\n| | 缺点 | 优点 |\n\
  | --- | --- | --- |\n| **传统方法** | 易于实现。<br>训练前可减少冗余特征。<br>特征工程（易于解释和理解）。<br>通常不需要\
  \ GPU 加速。 | 通常无法实现实时识别。<br>需要多个模型协同工作。<br>结果可能受外部环境影响，准确性较低。 |\n| **深度学习方法** | 需要大量数据。<br>需要\
  \ GPU 加速。<br>训练需要更多时间。<br>黑盒（难以解释和理解）。 | 可实现实时识别。<br>可在无额外特征提取过程的情况下训练数据。<br>结果可能不受外部环境影响，准确性更高。<br>适应性强且易于转换（迁移学习）。\
  \ |\n\n######## 3D 卷积神经网络\n\n一种用于人类行为识别的 3D 神经网络构建了时空信息，并结合`SVM`分类器进行特征图提取（Ji et\
  \ al. 2013）。与 2D `CNNs`相比，无论 2D `CNNs`有多少通道，卷积核只能输出一个特征图，这意味着只存在空间关系，而时间关系将丢失。对于人类行为识别，时间信息对于提高分类性能也很重要。3D\
  \ 卷积操作是将多个连续帧堆叠成立方体，并将 3D 卷积核应用于该立方体（Tran et al., 2015）。在这种结构中，卷积层中的每个特征图将连接到上一层中多个相邻帧，从而捕获运动信息。图\
  \ 2 展示了 3D 卷积神经网络（`3D-CNN`）的简单过程。\n\n由于整个立方体中卷积核的权重与共享权重相同，3D 卷积核只能从立方体中提取一种类型的特征。图\
  \ 2 中相同颜色的连接线代表相同的权重。我们使用多个卷积核来提取特征图。\n\n######## 目标检测进展\n\nSzegedy et al.使用深度神经网络，将目标检测视为回归问题（Szegedy\
  \ et al., 2013）。Girshick et al.提出了一种基于区域的卷积神经网络（`R-CNN`），该网络利用区域建议（Sande et al.,\
  \ 2011）获取图像的多个局部区域；利用`CNNs`获取每个区域的特征以解决目标检测问题（Girshick et al., 2014）。区域建议是寻找图像中目标可能的位置，通过利用图像中的视觉信息（如纹理、边缘和颜色），在保证`IOU`（交并比）的同时选择少量候选窗口。然而，`R-CNNs`仍存在不足，如提取的局部区域增加了磁盘存储空间；此外，大多数区域建议可能相互重叠，导致从重叠部分提取的特征重复。空间金字塔池化网络（`SPP-Nets`）通过替换最后的池化层，克服了`R-CNNs`的信息损失和使用问题（He\
  \ et al., 2015）。\n\n**图 2. 3D 卷积神经网络（3D-CNN）的简单过程**\n\n![Figure978-1-7998-2701-6.ch009.f02](img/ch009.f02.png)\n\
  \n\n\n\n\n######## Fast R-CNN 与 Faster R-CNN\n\nFast R-CNN 的提出旨在改进 R-CNN，在 PASCAL\
  \ VOC2012 上实现了 66% 的更高 mAP（平均精度）。Fast R-CNN 通过采用 ROI 池化层和反向传播，具备了更新所有网络层训练过程的能力。Fast\
  \ R-CNN 将区域建议直接映射到特征图上，图像仅需获取一次，从而大幅降低了时间消耗。Faster R-CNN 采用区域建议网络（RPN）替代了 Fast R-CNN\
  \ 中的选择性搜索方法，以共享整张图像的卷积特征 (Ren et al., 2017)。图 3 展示了三种 R-CNN 及其处理步骤。\n\n| Figure\
  \ 3. The R-CNNs with its steps |\n| --- |\n| ![Figure978-1-7998-2701-6.ch009.f03](img/ch009.f03.png)\
  \ |\n\n######## YOLO (Darknets)\n\nYou Only Look Once (YOLO 或 Darknets) 近期被提出，它基于端到端神经网络，将视觉目标检测视为一个回归问题。YOLO\
  \ 网络包含 24 个卷积层和 2 个全连接层 (Redmon et al., 2016)。YOLO 的核心思想是将整张图片作为输入，直接输出边界框的位置。YOLO\
  \ 网络能够训练直接对应检测性能的损失函数，使整个模型能够联合训练。YOLO 算法描述如下：\n1.  对输入图像应用固定的 7×7 网格核。如果物体中心落在对应网格内，则该网格响应该物体位置的回归。\n\
  2.  每个网格预测包含物体位置及其置信度信息，编码为一个向量。\n3.  网络输出层为每个网格对应的结果，实现端到端训练。\n\n然而，YOLO 网络利用平方和误差作为损失函数，导致收敛效果变差；同时，它无法正确地与最大化平均精度对齐。\n\
  \n######## 本章贡献\n\n本章的贡献在于采用端到端深度学习方法进行人类行为识别。此外，使用强大的 GPU 加速处理以实现时间效率。本章实现了四种不同的深度学习模型并取得了积极结果。\n\
  \n####### 方法论\n\n######### YOLO9000 (YOLOv2)\n\nYOLO9000 (YOLOv2) 的提出旨在克服 YOLO 初始版本的局限性，可实时检测多达\
  \ 9000 个物体类别，并提高了物体定位的准确率/召回率。YOLOv2 使用 WordTree 对分类和检测进行联合训练，该联合训练算法旨在利用可用的分类和检测数据训练目标检测器\
  \ (Redmon et al., 2017)。它还能在没有框标注的情况下，预测字典中 9000 个概念的物体边界框。YOLOv2 引入了来自 Faster R-CNN\
  \ 的锚框思想，替代了 YOLO 网络中用于预测每个边界框坐标的全连接层。批量归一化被应用于所有卷积层，通过归一化所有层的数据来防止梯度消失和梯度爆炸。由于 YOLOv2\
  \ 仅包含卷积层和池化层，其输入限于固定尺寸图像。为增强模型鲁棒性，YOLOv2 采用了多尺度输入训练策略，即在训练过程中经过几轮迭代后改变模型的输入图像尺寸。因此，通过采用多尺度训练策略，YOLOv2\
  \ 能适应各种尺寸的图像并预测出良好结果。\n\n######### YOLOv3\n\nYOLOv3 的提出旨在改进 YOLOv2 网络，它使用逻辑回归基于边界框定位物体；逻辑回归独立用于每个类别；使用二元交叉熵损失替代\
  \ softmax 以提高类别预测率。边界框预测公式如下：\n\n![Mathtype978-1-7998-2701-6.ch009.m01](img/ch009.m01.svg)\
  \ (1)\n\n![Mathtype978-1-7998-2701-6.ch009.m02](img/ch009.m02.svg)\n\n![Mathtype978-1-7998-2701-6.ch009.m03](img/ch009.m03.svg)\n\
  \n![Mathtype978-1-7998-2701-6.ch009.m04](img/ch009.m04.svg)\n\n其中 `b[x]`、`b[y]`、`b[w]`\
  \ 和 `b[h]` 代表预测的中心坐标 x、y、w、h；`t[x]`、`t[y]`、`t[w]`、`t[h]` 代表预测坐标；`c[x]` 和 `c[y]`\
  \ 是图像单元格左上角到网格单元的距离；`p[w]` 和 `p[h]` 是边界框的宽度和高度；`σ` 用于约束其偏移范围。\n\n######## 数据集\n\n\
  有大量用于人类行为识别的公开数据集，由多个研究小组提供，如 Weizmann 数据集、KTH 数据集、UCF 数据集、CAVIAR 数据集、CASIA 数据集和\
  \ BEHAVE 数据集。表 2 简要描述了这些数据集。\n\n**Table 2. A brief description of the different\
  \ datasets**\n\n| Dataset | Description |\n| --- | --- |\n| Weizmann | 单人行为分析，日常数据，静态摄像头。\
  \ |\n| KTH | 单人行为分析，日常数据，不同视角的静态摄像头。 |\n| UCF | 从 YouTube 收集的真实动作视频。 |\n| CAVIAR\
  \ | 多人行为分析。 |\n| CASIA | 单人/多人交互数据，不同静态摄像头角度。 |\n| BEHAVE | 多智能体交互数据。 |\n\n本章所有实验基于前两个公开数据集，即\
  \ Weizmann 数据集和 KTH 数据集。对于 Weizmann 数据集，包含十个类别，每个类别由静态摄像头捕获，共有九名参与者。数据集分辨率为 180×144。对于\
  \ KTH 数据集，包含 25 名参与者在四个场景下完成的六个动作，共 2391 个视频。该数据集中的视频样本包含缩放、服装和光照变化，由静态摄像头捕获。图像分辨率为\
  \ 160×120。我们主要采用这两个公开数据集获得实验结果。此外，KTH 数据集有 5667 个视频帧；Weizmann 数据集包含 1500 个视频帧。所有实验在单块\
  \ GPU (RTX 2080Ti) 上运行，以减少训练时间消耗。\n\n######### 评价指标\n\n为衡量模型性能，采用交叉验证以评估人类行为识别的表现。混淆矩阵的主要目的是将真实标签与分类结果进行比较。此外，混淆矩阵不仅提供分类准确率，还展示结果与预测类别的相关关系。\n\
  \n####### 实验结果\n\n本章采用四种网络进行实验，包括 YOLOv3、YOLOv2、ResNet 和 DenseNet，以实现人类行为识别结果。我们的重点主要在于深度学习方法及其对结果的影响。图\
  \ 4 展示了利用两个采用数据集的这些模型的视频帧结果。\n\n| Figure 4. The video frames for the adopted datasets.\
  \ |\n| --- |\n| ![Figure978-1-7998-2701-6.ch009.f04](img/ch009.f04.png) |\n\n本章采用了四种不同的深度学习模型；利用这些模型，准确率最高达到\
  \ 90%。YOLOv3 显示出最高准确率 (96.29%)，DenseNet 准确率最低 (92.62%)。图 5 展示了各提议模型的训练损失，YOLOv2\
  \ 实现了最低训练损失 0.96%。YOLOv3 具有最高训练损失 1.81%。\n\n| Figure 5. The training loss via Weizmann\
  \ dataset by adopting proposed models |\n| --- |\n| ![Figure978-1-7998-2701-6.ch009.f05](img/ch009.f05.png)\
  \ |\n\n\n\n\n\n########## 魏茨曼数据集结果\n\n在魏茨曼数据集方面，`YOLOv3` 达到了最高准确率 96.29%，而 `ResNet`\
  \ 的总体准确率仅达到 91.40%（He et al., 2016）。经过 44,200 个 epoch 后，训练损失约为 0.0181。使用 `YOLOv3`\
  \ 的测试结果 mAP 为 0.946。Jacking（跳跃拍手）的精确率最高，达到 100%，测试帧率高达 22.7 FPS。此外，总准确率达到了 96.29%。采用\
  \ `YOLOv2` 时，总体准确率高达 92.71%。使用 `YOLOv2` 的测试结果 mAP 为 0.911；Jacking 动作的识别准确率最高（100%），而\
  \ Running（跑步）行为识别仅达到最低识别率（65.33%）。实验以 31.3 帧/秒（fps）的速度进行行为识别。实验中也使用了 `DenseNet`；人体行为识别的总准确率为\
  \ 92.62%。采用 `DenseNet` 的测试结果 mAP 为 0.953。Jacking 识别率最高（100%），而 Running 行为识别精确率仅达到最低（90.83%）；FPS\
  \ 高达 30.3。`ResNet` 达到了高达 91.40% 的准确率。与其他三个深度神经网络相比，采用 `ResNet` 的测试损失结果最低（0.888）。在此实验条件下，Jacking\
  \ 的识别精确率最高（100%），而 Running 的识别精确率仅为 82.05%。人体行为检测的帧率高达 17.1 fps。\n\n########## KTH\
  \ 数据集结果\n\n对于 KTH 数据集，`YOLOv3` 达到了最高 mAP 0.8458；`YOLOv2` 的 mAP 仅为 0.8059，与其他模型相比最低。图\
  \ 6 展示了各提议模型的训练损失，`DenseNet` 达到了最低的训练损失 1.85%。`ResNet` 的训练损失最高（3.92%）。\n\n###########\
  \ 图 6. 采用提议模型在 KTH 数据集上的训练损失\n\n![Figure978-1-7998-2701-6.ch009.f06](img/ch009.f06.png)\n\
  \n在 KTH 数据集中，`YOLOv3` 的准确率为 84%。经过 28,800 个 epoch 后，训练损失为 0.0373。测试结果高达 0.8458 mAP，FPS\
  \ 高达 22.7。Boxing（拳击）识别的精确率最高，达到 100%，而 Running 识别的精确率为 54%，低于其他行为。使用 `YOLOv2` 的测试结果仅产生\
  \ 0.8059 mAP，与其他神经网络相比最低；此外，FPS 高达 31.2。Boxing 行为识别精确率最高（100%），但 Running 识别的精确率最低（44.60%），低于其他行为。在\
  \ KTH 数据集中采用 `DenseNet`，准确率为 86.63%，平均精确率为 0.8446 mAP，FPS 高达 32.3。Boxing 行为识别精确率最高（100%），而\
  \ Running 行为最低（63.46%）。网络 `ResNet` 总准确率为 85.45%，测试结果达到 0.8383 mAP；FPS 仅为 16.4。Boxing\
  \ 行为精确率最高（100%），而 Running 行为与其他行为相比精确率最低（64.38%）。\n\n########### 图 7. 错误分类示例；正确标签为：(a)\
  \ Skip，（b) Run，（c) Jog，和 (d) Boxing\n\n![Figure978-1-7998-2701-6.ch009.f07](img/ch009.f07.png)\n\
  \n########## 讨论\n\n经过这些实验，`DenseNet` 拥有最高的 0.953 mAP 准确率；使用魏茨曼数据集时，`YOLOv3` 达到了最高的\
  \ 96.29% 准确率；在 KTH 数据集上，`YOLOv3` 拥有最高的 mAP（0.8458）。对于魏茨曼数据集，Jacking 识别拥有最高的精确率和准确率。此外，在所有实验中，使用\
  \ KTH 数据集的 Boxing 识别拥有最高精确率。然而，在魏茨曼数据集中，Running 和 Skipping 的精确率和准确率可能不够稳健；KTH 数据集中的\
  \ Running 和 Jogging 识别也是如此。导致精确率低的原因是我们使用视频帧作为训练数据集；这些行为之间可能存在相似性。因此，在测试期间，结果低于预期。\n\
