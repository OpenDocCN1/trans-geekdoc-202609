- "## 多媒体网络安全研究手册\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n---\n\n\n\n### 使命\n\n随着数字技术在日常生活中变得更加普及，以及私营和公共实体以日益增长的方式利用互联网，对数字威胁的担忧变得更加普遍。\n\
  \n**Advances in Information Security, Privacy, & Ethics (AISPE) 丛书** 提供了关于跨各行业和环境保护与滥用信息及技术的前沿研究。该丛书汇集了身份管理、密码学、系统安全、认证和数据保护等主题的学术研究，是\
  \ IT 专业人士、学者和高年级学生的理想参考资料。\n\n### 涵盖领域\n\n*   网络伦理\n*   IT 风险\n*   访问控制\n*   社交网络隐私问题\n\
