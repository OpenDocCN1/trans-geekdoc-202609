  \ |\n\n######## 频率域（DWT）中的水印嵌入过程\n\n下文详述频率域中水印的嵌入过程。\n\n######### 嵌入图像算法\n\n1. \
  \ 为加密水印，生成一个 2000 位的密钥或随机二进制字符串。\n2.  水印图像的行号或列号代表密钥中的位位置。初始按行加密水印：若密钥中对应位被置位，则整行顺时针旋转；否则逆时针旋转。\n\
  3.  接下来按列加密图像：若对应位被置位，则整列上下颠倒旋转；未置位则逆时针旋转。\n4.  为增强加密强度，重复步骤 2 和步骤 3 多次。整个 DWT 过程以图像形式展示，即水印加密如图\
  \ 8 所示，信号不同频带如图 9 所示，含水印图像如图 10 所示。\n\n| 图 8. 水印加密 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch005.f08](img/ch005.f08.png)\
  \ |\n\n5.  对宿主图像应用 1 级 DWT，将整幅图像分解为四个不同的子频带 `LL[1]`、`LH[1]`、`HL[1]` 和 `HH[1]`。再对\
  \ `LL[1]` 应用 DWT，获得 `LL[1]` 的 2 级 DWT 即 `LL[2]`。对 `LL[2]` 再应用 DWT，将其分解为 `LL[3]`、`LH[3]`、`HL[3]`、`HH[3]`。\n\
  \n| 图 9. 原始图像的不同频带 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch005.f09](img/ch005.f09.png)\
  \ |\n\n6.  根据可见性因子 `F` 进行水印嵌入，并相应改变图像频带。例如：`WMKD-LL[3] = H-LL[3] + (F * W-LL[3])`。\n\
  \n    其中，`WMKD-LL[3]` 为水印图像的 `LL[3]`，`H-LL[3]` 为宿主图像的 `LL[3]`，`W-LL[3]` 为水印图像的 `LL[3]`。\n\
  \n    同样，利用逆离散小波变换（`IDWT`）在 `LL[3]`、`LH[3]`、`HL[3]` 和 `HH[3]` 上获得含水印图像的 `LL[2]`。同理，通过\
  \ `IDWT` 获得含水印图像的 `LL[1]`、`LH[1]`、`HL[1]` 和 `HH[1]`。\n\n| 图 10. 含水印图像 |\n| --- |\n\
