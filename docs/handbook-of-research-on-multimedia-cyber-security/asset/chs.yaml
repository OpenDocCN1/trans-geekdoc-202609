  \ | 0.048222567 | 1 | 0.639040798 |\n\n########### 会话级分类\n\n人工神经网络分类器也被用于对所有触控会话的输入样本进行分类。使用了图\
  \ 6 所示的相同 ANN 结构，但输入特征为 35 个，而不是 27 个。输入样本被随机划分为：\n\n*   65% 用于训练。\n*   15% 用于验证\n\
  *   20% 用于测试。\n\n我们以这种方式划分数据样本，是因为在会话级模型中我们只有少量样本。\n\n########## 性能评估与结果讨论\n\n在本节中，我们介绍了使用分类和识别算法（ANN\
  \ 和 SVM）以及两种特征选择方法（利用判别性和一致性值的加权特征以及主成分分析 [PCA] 方法）进行实验的结果。\n\n########### 人工神经网络\n\
  \n在笔划级特征模型中执行 10 次训练会话后，我们获得了训练样本 14% - 16% 的误分类错误率和测试样本 25% - 30% 的误分类错误率，而在会话级特征模型中，我们获得了训练样本\
  \ 0% 的误分类错误率和测试样本 16% - 20% 的误分类错误率。使用这个会话级特征模型，我们得到了比笔划级特征模型更高效的分类器。\n\n图 7 显示了会话级模型分类器训练的误差直方图。该图显示了导致特定误差值的样本数量。\n\
  \n############ 图 7. 会话级分类误差直方图\n\n![Figure978-1-7998-2701-6.ch013.f07](img/ch013.f07.png)\n\
  \n\n\n\n########### 实验结果与分析\n\n根据图 7 所示，大多数样本的训练误差约为 0.04，根据图 8 所示的混淆矩阵，总体准确率约为\
  \ 93%。混淆矩阵显示了每个训练样本的目标类别和分类器提供的实际输出类别，矩阵对角线显示了训练会话中正确分类的样本数量。\n\n从图 8 可以看出，根据混淆矩阵中对角线单元格的值，会话级特征提供了更好的分类准确率。还可以看到，分类器在训练轮次\
  \ 31 达到了最佳验证性能 0.003，这意味着分类器训练算法收敛良好，请参见图 9，它显示了轮次数量与三组数据（训练、测试和验证）的验证性能之间的关系。通常，经过更多轮次的训练后误差会减小，但随着网络开始过拟合训练数据，验证数据集上的误差可能会开始增加。在默认设置中，验证误差连续增加六次后训练停止，并取验证误差最低的那一轮的最佳性能。\n\
  \n| 图 8. 10 个用户的会话级分类器混淆矩阵 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch013.f08](img/ch013.f08.png)\
  \ |\n\n在学习背景下，反向传播通常被梯度下降优化算法用来通过计算损失函数的梯度来调整神经元的权重。图 9 中梯度的大小和验证检查的次数被用来终止训练。随着训练达到最小性能，梯度将变得非常小，而验证检查的次数代表验证性能未能下降的连续迭代次数。因此，从该图可以看出，考虑到我们的实验规格，我们获得了最准确的分类器。\n\
  \n| 图 9. 验证性能 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch013.f09](img/ch013.f09.png)\
  \ |\n\n| 图 10. 验证检查 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch013.f10](img/ch013.f10.png)\
  \ |\n\n############ 评估指标\n\n评估基于触摸的生物识别系统或任何其他生物识别系统性能最常用的指标是误拒率（`FRR`）和误接率（`FAR`）（AbdelDayem\
  \ 等，2017）。`FRR` 是被标记为冒名顶替者并被拒绝访问的合法用户的百分比。`FRR` 表示系统的特异性。`FAR` 是被允许访问系统的冒名顶替者的百分比。`FAR`\
  \ 表示系统的灵敏度。以下公式用于计算 `FAR` 和 `FRR`（AbdelDayem 等，2017）。\n\n![Mathtype978-1-7998-2701-6.ch013.m13](img/ch013.m13.svg)\
  \ (8)\n\n其中 `False Rejects` 是被拒绝访问的合法用户数量。\n\n![Mathtype978-1-7998-2701-6.ch013.m14](img/ch013.m14.svg)\
  \ (9)\n\n其中 `False Accepts` 是被允许访问的冒名顶替者数量。\n\n图 11 展示了其中一个用户的混淆矩阵。`FAR` 通过将被验证为“1”类的“0”类样本数量除以“0”类样本总数来计算。以同样的方式，我们可以通过将被验证为“0”类的“1”类样本数量除以“1”类样本总数来计算\
  \ `FRR`。\n\n| 图 11. 识别混淆矩阵示例 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch013.f11](img/ch013.f11.png)\
  \ |\n\n############ 支持向量机\n\n支持向量机（`SVM`）分类器用于笔划级和会话级模型。准确率值汇总在表 7 中。从表中可以注意到，三次\
  \ `SVM` 在笔划级模型中给出了最佳准确率，但在会话级模型中，二次 `SVM` 给出了最高准确率值。\n\n**表 7. 支持向量机分类器准确率。**\n\n\
  | SVM | | 准确率 |\n| --- | --- | --- |\n| | 笔划级 | 会话级 |\n| 线性 | 56.1% | 69% |\n| 二次\
  \ | 73.3% | 75% |\n| 三次 | 75.2% | 69% |\n| 精细高斯 | 65.3% | 27% |\n| 中等高斯 | 67.3%\
  \ | 70% |\n| 粗糙高斯 | 47.2% | 57% |\n\n通过两个提出模型的实验发现，笔划级和会话级模型分别导致 `FAR` 约为 0.8% 和\
  \ 0%；正如我们所认为的，这些结果反映了更安全的模型。然而，就 `FRR` 而言，会话级模型给出了比笔划级模型更好的比率。在会话级模型中，`FRR` 约为 5%，而在笔划级模型中，考虑\
  \ `ANN` 分类器时达到了 40%。\n\n另一方面，考虑 `SVM` 分类器，笔划级和会话级模型导致 `FAR` 分别等于 2% 和 3%，而 `FRR`\
  \ 分别为 36% 和 44%。但当我们在两个模型（笔划级和会话级）中使用 `PCA` 时，我们在笔划级和会话级分别获得了约 53% 和 43% 的更高 `FRR`\
  \ 值。所有这些结果汇总在表 8 中。\n\n**表 8. 总体结果汇总。**\n\n| 结果汇总 | | | | | | | | | |\n| --- | ---\
