  全连接层网络的训练基于交叉熵损失函数，通过迭代更新网络参数以获得优化的网络模型。训练过程中，训练误差曲线如图 7 所示。迭代后，训练误差逐渐减小并趋于稳定，这表明模型已收敛。\n\
  \n####### 图 7. 训练误差曲线\n\n| ![Figure978-1-7998-2701-6.ch011.f07](img/ch011.f07.png)\
  \ |\n\n该方法的验证也在自拍视频上进行了测试，我们对数据集进行标记用于训练和测试。图 8 展示了实验研究结果。\n\n####### 图 8. 正确结果显示在单个框中，错误结果显示在多个框中。\n\
  \n| ![Figure978-1-7998-2701-6.ch011.f08](img/ch011.f08.png) |\n\n在本实验中，对比了算法在三个步态数据集上、在\
  \ 2×4、4×4、4×8、8×8、8×16、16×16、16×32 个分块下的识别率。获得了最佳分块，结果如图 9 所示。\n\n在图 9 中，最佳分块为 8×8。过大或过小的分块都会影响识别率，因为过大的分块无法提取准确合适的局部特征；而过小的分块对图像配准和人体运动敏感，提取的全局和局部特征不准确。\n\
  \n####### 图 9. 分块大小对准确率的影响\n\n| ![Figure978-1-7998-2701-6.ch011.f09](img/ch011.f09.png)\
  \ |\n\n本章在评估算法性能时，采用“留一交叉验证法”获得正确分类率（CCR）的无偏估计；即每次实验保留一个样本序列作为测试样本，其余样本序列作为 ANN\
  \ 的训练样本（Rida, et al. 2016），根据与训练样本的相似度进行分类（Han, 2010）。为了对比本章融合特征的优势，对比了 Original-GEI（Han\
  \ & Bhanu, 2005）、GEI+LBP+PCA（Sivapalan, et al. 2013）、Bayes+HMM（Chen, et al. 2009）和\
  \ Integrated-HOG（Viola, et al. 2005）的识别率。结果如表 2 所示。\n\n####### 表 2. 不同特征提取方法的 CCR\n\
  \n| ![Figure978-1-7998-2701-6.ch011.g02](img/ch011.g02.png) |\n\n此外，累积匹配分数（CMS）也被应用于评估。CMS\
  \ 定义为测试度量实际类别在其前序秩值（例如 Rank = 10）处的累积概率。CCR 是 Rank 等于 1 时的累积识别率。五种方法的 CMS 分别如表 3\
  \ 所示。\n\n####### 表 3. 跨状态测试结果\n\n| ![Figure978-1-7998-2701-6.ch011.g03](img/ch011.g03.png)\
  \ |\n\n\n\n\n\n使用 CASIA-B 数据集的卷积核识别率优于 `3×3` 卷积核的识别结果，特征融合基于 `3×3` 和 `7×7` 卷积核。后续识别准确率优于或等于单一卷积核的识别准确率。同时，本章将所提方法与其他现有方法\
  \ GPPE、GEI、STIPs 及基于 CNN 的方法进行了比较。在表 3 中，所提方法在同一状态实验（nm-nm）和（cl-cl）中略低于现有基于深度学习的方法，因为后者使用了更深的网络。在跨状态实验中，该方法表现更好，表明本章方法在鲁棒性方面更优。此外，跨状态的准确率低于其他现有方法，因为传统方法可通过针对性设计特征进行识别，而深度学习需要更多步态姿态进行训练以增强网络的泛化能力。然而，仅有一种步态状态会导致网络泛化能力较差；因此，跨状态的实验结果不优于现有方法。\n\
  \n####### 结论\n\n本章构建了用于人体步态识别的深度神经网络 `CRBM+FC`。基于 LBP 和 HOG 融合，提出了一种从 GEI 到输出的端到端深度学习步态识别方法。本文还提出了一种基于步态能量图的步态识别算法。该方法采用分层思想克服了步态能量图的缺陷，不仅捕捉人体图像的局部信息，还提取其轮廓和形状信息。这些信息的融合基于\
  \ CASIA 步态数据集。本章的识别算法实现了较高的识别率。文中提出了一种由卷积受限玻尔兹曼机和全连接神经网络组成的特征学习网络。该网络首先利用不同卷积核的特征受限玻尔兹曼机从步态图像中提取特征；由于卷积受限玻尔兹曼机是无监督的，它们能够广泛且丰富地学习。尽管学习到了丰富的步态特征信息，但必然存在冗余和不太有用的信息。因此，本文使用有监督的全连接层网络对这些特征进行深度学习。\n\
  \n在单一场景中，步态的检测和提取相对简单。然而，在复杂的实际场景中，背景和多个个体等因素的复杂性使得难以准确获取步态。不准确的步态信息直接影响最终的识别效率和准确性（Sivapalan\
