  \n########## 结果与评估\n\n生成的含水印图像的特性通过所提算法的两个指标进行衡量，即 PSNR 和 MSE。PSNR 是峰值信噪比，如文献（Abraham\
  \ et al., 2016）所述。该指标显示了实际内容以及水印嵌入过程中添加的噪声。原始图像在嵌入水印的过程中不应产生过大的失真。高 PSNR 值表明含水印图像质量良好，显示出低失真度。通过计算含水印图像的\
  \ PSNR 和 MSE（均方误差）来确定失真量（Sruthi et al., 2014）。\n\nNCC = ![Mathtype978-1-7998-2701-6.ch005.m15](img/ch005.m15.svg)\
