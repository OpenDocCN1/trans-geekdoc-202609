  **Avila Jayapalan**  \nSASTRA University (Deemed), India\n\n##### 摘要\n\n随着无线技术的飞速发展，正交频分复用（`OFDM`）近年来越来越受欢迎。`OFDM`\
  \ 构成了当前许多无线传输标准的基本骨干。它是一种多载波调制方案，克服了因多径传播导致的 `ISI`（符号间干扰）而需要均衡器的问题。在本工作中，利用源编码、信道编码、`IFFT-FFT`、扰码器、循环前缀和信号映射器等各种模块开发了一个基于\
  \ `OFDM` 的收发器。为确保数据传输安全，哈达玛矩阵与数据进行 `XOR`（异或）运算。这为传输的图像提供了一定程度的低级保护。`LabVIEW` 已被用作处理工具来开发收发器，并利用通用软件无线电外设（`USRP`）测试了开发的原型。\n\
  \n##### 绪论\n\n无线系统的发展因其成本较低且易于使用，为全球连接敞开了大门。但是，即使存在这些优势，仍需应对一个称为多径衰落的严重问题，它会导致符号间干扰（`ISI`）或串扰。\n\
  \n正交频分复用（`OFDM`）（Gouda, Hussien, Ragab, Anwar, & Gouda, 2017）解决了上述问题。它是一种独特的 `FDM`（频分复用）类型，用户获得的一组子载波在频域中重叠（Bartalwar\
  \ & Deepa, 2017）。然而，这些子载波经过专门设计，彼此正交，这使它们能够在没有任何干扰的情况下占用相同的带宽。这反过来又消除了对保护频带的需求。因此，子载波可以紧密排列以提高信道效率。\n\
  \n在 `OFDM` 中，大带宽的高速数据流被分割成并行的、较慢的、较低带宽的子流，称为子载波（Salwa & Eldin, 2017）。这些子载波以直流（`D.C`）两侧的载波频率为中心。随着带宽的增加，其中的子载波数量也随之增加。子载波的放置方式是：在一个子载波的峰值处，所有其他子载波均具有零分量。这样的子载波称为正交子载波。通过确保所有子载波具有相同的符号持续时间\
  \ `Ts` 且子载波间隔保持在 `f=1/Ts` 的等距，实现了正交性。\n\n在时域中，这些子载波将表现为这些载波频率上的永恒正弦波。然而，为了在这些子载波上传输数据，它们被加载了调制符号，这些符号代表数字调制方案（如正交相移键控（`QPSK`）和\
  \ M 阵正交幅度调制（`QAM`））（Sklar & Ray, 2001）的星座点。\n\n##### 图像获取\n\n本工作强调仅传输灰度图像（Saravanan,\
  \ 2010）。灰度图像是一种图像类型，其中每个像素元素中的值仅代表光的量，即强度。灰度级由 `2^n` 给出，其中 `n` 是考虑的位数。由于重点是 8 位灰度图像，因此有\
  \ `2⁸` 即 256 个级别，范围从 0 到 255。考虑的输入数据是一幅 `256*256` 的灰度图像。\n\n##### 安全性\n\n加密是对数据进行编码的过程，使得只有拥有加密密钥的人才能访问数据（Balouch,\
  \ Aslam, & Ahmed, 2017）。在发射端，阵列元素根据加密密钥进行打乱；而在接收端，接收到的数据根据相同的密钥进行重新排序，从而恢复原始传输的数据。为了确保通过\
  \ `OFDM` 收发器传输的图像具有一定程度的低级安全性，哈达玛序列被 `XOR`（异或）运算。\n\n哈达玛矩阵是一个由 1 和 -1 两个值组成的方阵，其行彼此正交。这可以用两个基本术语来解释。从几何术语来看，每一对行都是相互垂直的向量；从组合术语来看，可以说每一对行恰好有一半的元素匹配。某些哈达玛矩阵被用作纠错码，如哈达玛码。哈达玛矩阵也用于低规模加密目的，因为将图像与同尺寸的哈达玛矩阵相乘会产生一幅打乱的图像（Lee,\
  \ Shahab, Kader & Shin, 2016）。\n\n##### USRP\n\n\n\n\n\n###### 使用 LabVIEW 工具开发的收发机随后利用\
  \ USRP 实现\n\nUSRP 软件定义无线电设备是一种可调谐的收发机（Nafkha, Naoues, Cichon, & Kliks, 2014）。利用\
  \ LabVIEW 软件工具可设计任意无线系统，并通过使用 USRP 发送和接收信号来分析各种参数。\n\n本工作旨在开发基于 OFDM 的收发机，其中包括源编码、信道编码、信号映射器、扰码器-解扰码器、IFFT-FFT\
  \ 模块，均借助 LabVIEW 工具实现。图像利用 Hadamard 序列加密，并通过 USRP 进行发送和接收。\n\n###### 相关工作\n\n在 Serkin\
  \ & Vazhenin (2013) 中，作者讨论了通过 USRP 进行数据传输。设计并分析了基于 Simulink 的 FSK 发射机和接收机。在 Jian\
  \ Chen, Shengli Zhang, Hui Wang & Xiufeng Zhang (2013) 中，利用 USRP 传输了两类信号。一类是 FM\
  \ 信号，另一类是 GPS 信号。两种信号均被接收并记录。在 Nagarjuna Telagam, Shailender Reddy, Menakadevi Nanjundan\
  \ & Nehru (2018) 中，使用 LabVIEW 工具设计了基于 OFDM 的收发机，并利用 USRP 进行信号发送和接收。在 Rupali B. Patil,\
  \ K. D. Kulat & A. S. Gandhi (2018) 中，通过 USRP 传输和接收了真实视频信号。同时将视频信号视为主用户，并利用基于能量检测的频谱感知检测白空的存在。使用\
  \ GNU Radio 作为处理工具。在 Carsten Andrich, Alexander Ihlow, Julia Bauer, Niklas Beuster\
  \ & Giovanni Del Galdo (2018) 中，利用 USRP 对正弦和脉冲参考信号进行了高精度测量。在 C. I. M. Althaf & S.\
  \ C. Prema (2018) 中，利用特征值法进行了频谱感知。在 Shujaat Ali Khan Tanoli, Mubashir Rehman, Muhammad\
  \ Bilal Khan, Ihtesham Jadoon, Farman Ali Khan, et al. (2018) 中，利用 USRP 分析了协作环境下的信道容量。在\
  \ A. Kumar, A. S. Khan, N. Modanwal & S. Saha (2019) 中，使用能量检测法和特征值法检测主用户的存在。决策时考虑的不是最小特征值，而是平均特征值。在\
  \ Nagarjuna Telagam, S. Lakshmi & K. Nehru (2019) 中，利用广义频分复用技术传输和接收了数字音频信号。在 J.\
  \ Muslimin, A. L. Asnawi, A. F. Ismail & A. Z. Jusoh (2016) 中，使用 GNU Radio 开发了一个采用高斯最小频移键控\
  \ (GMSK) 作为调制方案的简单数字通信系统。发送和接收信号后，绘制并分析了功率谱密度。在 Devidas Kushnure, Murtaza Jiniyawala,\
  \ Sushama Molawade & Snehal Patil (2017) 中，设计了调频发射机和接收机，并传输了音频信号。仿真信号证明了发射信号与接收信号相似。除了\
  \ USRP 接收机外，音频信号还通过手机接收。在 Fei Peng, Shunqing Zhang, Shan Cao & Shugong Xu (2018)\
  \ 中，根据实时场景修改了 LTE 框架，并得出结论：需要 4dB 回退以支持可靠的车车通信。\n\n在 Padmapriya Praveenkumar, P.\
  \ Catherine Priya, J. Avila1, K. Thenmozhi, ohn Bosco Balaguru Rayappan et al. (2017)\
  \ 中，对图像进行加密以防止入侵者窃取，并通过空气介质利用 USRP 传输加密图像。在接收端恢复了原始图像。作者主要关注加密算法。本文主要关注基于 USRP 的数据传输。\n\
  \n####### 提出的方法\n\nHuffman 编码是一种无损压缩技术（Arshad, Saleem, Khan, 2016）。在利用 Hadamard\
  \ 矩阵进行扰码后，采用了 Huffman 编码。该扰码单元的输出（即一组扰乱后的像素值）被写入文件。计算这些值（即符号值）的直方图并写入文件。该直方图将给出图像包含的唯一像素值。通过将每个像素的出现次数除以输入图像中存在的总像素数，计算每个像素的出现概率，并写入文件。编码后的值被写入文件，由\
  \ `Permute` 模块读取以进行后续处理。在接收端，解压缩在解扰后进行。该解码器的输出被写入文件，供后续处理阶段使用。\n\n####### 置换\n\n\
  Huffman 编码后的输入比特被送入 `MT Permute` 模块。该模块根据置换数组参数中指定的值改变输入数据元素的位置。置换数组参数是一个用户指定元素的数组，作为双端加密的密钥。置换越彻底，加密越安全。此外，随着置换数组参数中数组元素数量的增加以及所用置换器数量的增加，加密等级可能会提高。在接收端，通过将相同的置换数组参数作为输入送入\
  \ `MT depermute` 模块来执行解密。这将根据置换数组元素的位置重新排列接收到的数据。\n\n####### 信道编码\n\n信道编码使用 `MT\
  \ BCH encoder`（Mathew, Augustine, G. & Devis, 2014）和 `MT BCH decoder` 模块执行。在该系统中，采用了\
  \ BCH 编码器和解码器，其中 `(n, k, t) = (7, 4, 1)`。该编码方案接收一个 `k` 比特的数据字，并产生一个 `n` 比特的码字。BCH\
  \ 编码后，编码数据被转换为布尔型，并送往后续的比特到字转换阶段。\n\n####### 利用 Hadamard 矩阵进行数据隐藏\n\n设 `H` 为 `n`\
  \ 阶 Hadamard 矩阵。Hadamard 矩阵的构造如下：\n\n![Mathtype978-1-7998-2701-6.ch012.m01](img/ch012.m01.svg)\
  \ (1)\n\n其中 `2^k` 表示 Hadamard 矩阵的阶。第一行和第一列的所有元素均为 `1`。像素矩阵与 `256*256` Hadamard 矩阵相乘，产生扰乱后的输出图像。与发射端的过程类似，接收端接收到的像素值必须进行解扰。由于根据上述性质\
  \ Hadamard 矩阵等于其逆矩阵，因此将扰乱后的二维数组再次乘以同一 `256` 阶 Hadamard 矩阵，以重现输入图像。\n\n####### FFT\
  \ 和 IFFT\n\n傅里叶变换是分析信号并从其频率分量构建信号的有力工具。逆傅里叶变换用于将信号从频域转换到时域。在发射端，OFDM 符号通过将输入比特映射到\
  \ QPSK 符号，然后根据 OFDM 符号中的子载波数量按特定长度对其进行排序，在频域中构建。也就是说，通过映射和排序过程，构建了 OFDM 符号的频率分量。为了发射它们，信号必须在时域中表示。这通过逆快速傅里叶变换\
  \ (IFFT) 实现。在 OFDM 系统的接收部分，使用了快速傅里叶变换。快速傅里叶变换用于将接收信号从时域转换回频域，以便在系统的其余部分处理信号。\n\n\
  ![Mathtype978-1-7998-2701-6.ch012.m02](img/ch012.m02.svg) (2)\n\n![Mathtype978-1-7998-2701-6.ch012.m03](img/ch012.m03.svg)\
  \ (3)\n\n其中，\n\n*   `X[k]` 为频域采样值\n*   `x[n]` 为时域采样值\n*   `K` 取值范围为 `0` 到 `(N-1)`\n\
  *   `N` 为 FFT 规模\n\n####### 图像重建\n\n\n\n\n\n###### 接收端\n\n在接收端，需要重建处理后的像素值。像素值以一维数组的格式接收。为了将其描绘为图片，必须将一维数组转换为二维数组。因此，使用数组调色板中的\
  \ `reshape array` 块，其中行和列维度均设为 256。这样便获得了二维表示。这些像素使用图形和声音调色板中的 `Flatten pixmap`\
  \ 块进行扁平化处理。8 位灰度图像的相应色表也作为输入给出。输出可以写入文件或使用指示器显示。结合上述讨论的模块，所提方法的发射端和接收端框图如图 1a 和图\
  \ 1b 所示。\n\n| 图 1a. 发射端框图 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch012.f01a](img/ch012.f01a.png)\
  \ |\n\n| 图 1b. 接收端框图 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch012.f01b](img/ch012.f01b.png)\
  \ |\n\n###### USRP 传输\n\nUSRP 是无线系统公认的原型平台。实验装置如图 2 所示。使用两台 USRP。一台 USRP 作为发射机，另一台作为接收机。实验在室内进行，以空气为传输介质。待传输的图像被转换为一维数组并发射。在接收端执行反向过程，图像得以恢复。\n\
  \n| 图 2. 实验装置 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch012.f02](img/ch012.f02.png)\
  \ |\n\n###### 结果与讨论\n\n软件仿真涉及输入 256×256 灰度图像的可观传输与接收，以及通过仿真 AWGN 噪声信道模型在接收端的正确重建。结合上述获得的参数值，软件仿真结果在\
  \ `LabVIEW` 平台上进行测试。所提方法包括在发射端按给定顺序串联低级加密模块：使用哈达马矩阵、BCH 编码器、置换器、符号映射、`IFFT` 块、循环前缀插入和加窗。上述模块使用\
  \ `LabVIEW` 中各种信号处理和射频通信调色板中的不同模块构建。获得的仿真结果在框图窗口和前面板窗口中以特写形式展示如下。\n\n待传输的图像使用 `LabVIEW`\
  \ 视觉工具包中的图像采集块获取，如图 3 所示。从输入文件路径读取图像，并使用 `IMAQ Image to Pixel` 块以二维数组形式获取每个像素值。这些像素值进一步处理并发送进行哈达马矩阵低级加密。同时，也输入了发射机属性参数，包括位数、子载波数、字到符号映射、D/A\
  \ 速率、基频、循环前缀百分比和所选加窗方法类型。\n\n| 图 3. 图像采集 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch012.f03](img/ch012.f03.png)\
  \ |\n\n像素的二维数组与 256 阶哈达马矩阵相乘以打乱像素。该图像经置换矩阵进一步加密后，实现了大量的数据隐藏，分别如图 4a 和 4b 所示。\n\n\
  | 图 4a. 哈达马变换后 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch012.f04a](img/ch012.f04a.png)\
  \ |\n\n| 图 4b. 置换后 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch012.f04b](img/ch012.f04b.png)\
  \ |\n\n经过哈达马矩阵和置换器的低级加密后，像素被转换为无符号 8 位二进制值，并拼接在一起形成输入比特流。然后，输入比特作为源编码部分进行霍夫曼编码，作为信道编码部分进行\
  \ BCH 编码。由于哈达马矩阵处理和信道编码的增加会增加带宽使用，因此使用无损压缩来抵消这种影响至关重要。霍夫曼编码是一种可变长编码方案。图 5 显示了源编码和信道编码数据的前面板。\n\
  \n| 图 5. 源编码和信道编码前面板 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch012.f05](img/ch012.f05.png)\
  \ |\n\n输出串行比特需要从比特转为字，再从字转为符号，以进行符号映射。比特到字的转换可使用数组调色板中的 `reshape array` 和 `slit\
  \ 1D array` 块实现。此处每个符号的位数取为 2。软件仿真采用 QPSK 映射。可进一步分析采用 4-QAM 和 16-QAM 等不同调制方案。适当符号的星座位置在发射机属性的字到符号映射输入参数中给出。面板窗口如图\
  \ 6 所示。\n\n| 图 6. 符号映射 – 前面板 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch012.f06](img/ch012.f06.png)\
  \ |\n\n进行 `IFFT` 处理以获取并保持正交性并实现域变换。仿照 802.11a 的特性规范，FFT 大小固定为 64。`IFFT` 后，信号发送进行循环前缀插入。借助数组函数，将末尾\
  \ 25% 的信号追加到开头。发射端的最后一步是加窗，随后信号通过建模为 AWGN 噪声信道模型的信道发送。循环前缀插入的前面板如图 7 所示。\n\n| 图\
  \ 7. 循环前缀插入 - 前面板 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch012.f07](img/ch012.f07.png)\
  \ |\n\n整个发射端部分的前面板窗口如图 8 所示。\n\n| 图 8. 发射端 - 前面板 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch012.f08](img/ch012.f08.png)\
  \ |\n\n发射信号通过建模的 AWGN 噪声信道到达接收端，进行循环前缀移除、FFT 处理（大小 64）和符号到比特转换。转换后的比特流进一步解码并重建图像。循环前缀移除如图\
  \ 9 所示，源解码如图 10 所示。\n\n| 图 9. 循环前缀移除 - 前面板 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch012.f09](img/ch012.f09.png)\
  \ |\n\n| 图 10. 源解码和信道解码及去置换与图像重建 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch012.f10](img/ch012.f10.png)\
  \ |\n\nUSRP 的前面板如图 11a 和图 11b 所示。\n\n| 图 11a. USRP 发射端 - 前面板 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch012.f11a](img/ch012.f11a.png)\
