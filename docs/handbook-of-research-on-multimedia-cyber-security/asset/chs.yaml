  \ `PCA` (13/27) | (35/35) | `PCA` (21/35) | (27/27) | `PCA` (13/27) | (35/35) |\
  \ `PCA` (21/35) |\n| 分类准确率 | 70-85% | 72.6-76.5% | 90-94% | 83-94% | 75% | 72% |\
  \ 74% | 63% |\n| 识别准确率 | 92.25% | 94.57% | 97% | 98.1% | 95.8% | 94.23% | 95.3%\
  \ | 93.2% |\n| `FAR` | 0.85% | 1.22% | 0% | 0.88% | 2.22% | 3.2% | 3.31% | 2.7%\
