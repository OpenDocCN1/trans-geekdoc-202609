  \ (6)\n\n![Mathtype978-1-7998-2701-6.ch004.m07](img/ch004.m07.svg) (7)\n\n![Mathtype978-1-7998-2701-6.ch004.m08](img/ch004.m08.svg)\
  \ (8)\n\n其中分解级别为 ![Mathtype978-1-7998-2701-6.ch004.m09](img/ch004.m09.svg)。![Mathtype978-1-7998-2701-6.ch004.m10](img/ch004.m10.svg)\
  \ 和 ![Mathtype978-1-7998-2701-6.ch004.m11](img/ch004.m11.svg) 为冲激响应。DWT 提供的视觉图像质量优于\
  \ DCT，且提供更好的局部化。DWT 支持宿主图像的多尺度描述。图像分辨率的级数可从低到高显示。其局限性在于计算成本高、计算时间长。示例见图 5。\n\n|\
  \ Figure 5. Image decomposition using DWT |\n| --- |\n| ![Figure978-1-7998-2701-6.ch004.f05](img/ch004.f05.png)\
  \ |\n| --- |\n\n######## 离散傅里叶变换（DFT）水印技术\n\n该技术具有纯频域分析特性，是常用技术之一。它能抵抗缩放、平移、旋转、裁剪等各类攻击。应用\
  \ DFT 时，图像转换为正弦和余弦形式。它们进一步分为基于模板的嵌入和离散嵌入。在直接嵌入技术中，通过修改 DFT 相位系数和幅度来嵌入水印。利用 DFT 域，估计包含模板结构的变换因子。在图像变换过程中，通过估计变换因子来搜索模板。对于嵌入的扩频水印提取，使用检测器。DFT\
  \ 用于数字信号、周期性信号和离散时间函数。其计算公式如下，周期 MP 为：\n\n![Mathtype978-1-7998-2701-6.ch004.m12](img/ch004.m12.svg)\
  \ (9)\n\n逆离散傅里叶变换计算如下：\n\n![Mathtype978-1-7998-2701-6.ch004.m13](img/ch004.m13.svg)\
  \ (10)\n\n其中 v, i = 0, 1, 2, ..., MP-1。DFT 的计算维度公式如方程 11 和 12 所示。\n\n![Mathtype978-1-7998-2701-6.ch004.m14](img/ch004.m14.svg)\
  \ (11)\n\n![Mathtype978-1-7998-2701-6.ch004.m15](img/ch004.m15.svg) (12)\n\n在 DFT\
  \ 中，图像为复值图像，以幅度和相位形式表示。低频分量是 DFT 最重要的分量之一，也称为中心分量。它针对导致频谱模糊的裁剪攻击有效。由于水印嵌入在幅度中，因此不需要任何同步。如果对图像执行缩放，通过相关系数发现的提取信号会被放大。它能从几何攻击中恢复，因此对平移、缩放和旋转具有不变性。在\
  \ DFT 和 DWT 中，几何畸变难以恢复。DFT 的主要局限性是输出为复值。在时空域中，不产生定位信息。\n\n######## 奇异值分解（SVD）水印技术\n\
  \n它源于线性代数，用于降维。对矩阵 B 应用 SVD 时，矩阵分解为三个矩阵。第一个生成的矩阵是 'V'，一个正交矩阵；'J' 是另一个矩阵的转置；'S' 是一个对角矩阵。该方法能清晰地揭示变量间的关系，因为它将相关变量转换为不相关变量集。数字图像的矩阵由非负标量项组成。假设\
  \ 'B' 是大小为 i x J 的图像。SVD 方法可用于分解 SVD 图像，如方程 13 所示。\n\nB = V L J^T (13)\n\n它是高鲁棒性方法之一。在该过程中，生成的奇异值有助于保护所有者提供的水印。内存约束减小，精度提高。此外，它能抵抗攻击。奇异值代表图像层的亮度。\n\
  \n######## 鲁棒水印技术\n\n研究重点是针对几何畸变鲁棒的水印算法（Elbafisi, 2012）。解决此类问题的各种方法包括隐式同步、不变域、同步模板/模式和穷举搜索。RST\
  \ 的唯一变体主要是几何变换不变算法。\n\n\n\n\n\n######## 几何失真水印技术综述\n\n######### 几何失真标准的重要性\n\n几何失真标准的重要性日益凸显。全局对齐变换对水印算法性能影响巨大，但实现复杂。\n\
  \n######### 详尽水印搜索\n\n详尽水印搜索是解决重同步问题最流行的方法之一 (Kutter, Jordan, & Bossen, 1998)。水印检测在由引导几何逆变形组成的训练序列上进行。水印搜索在每个失真参数中执行。在缺少原始图像的情况下，难以分析变形参数\
  \ (Alghoniemy & Tewfik, 2000; 2006)。同时也存在高计算复杂度。参数包括待探索的空间。因此，搜索空间的大小限制降低了感知质量。但搜索空间中存在不可接受的影响\
  \ (Lichtenauer, Setyawan, Kalker, & Lagendijk, 2003)，导致基于同步器结果的错误。此外，由于插值误差和几何失真\
  \ (FiAlvarez-Rodriguez & Perez-Gonzalez, 2002)，存在激增的假阳性概率。\n\n######### 基于模板的方法与自同步\n\
  \n针对同步攻击，最常用的解决方案是将周期性水印模式嵌入图像，或在水印的同时插入模板 (Herrigel, Perrig, & Ruanaidh, 1997;\
  \ Stankovic, Djurovic, & Pitas, 2001)。为了重同步，额外的模板被用作人工嵌入的参考。其中携带的信息不敏感。基于模板的技术通过补偿和估计几何变换，以及断言水印的存在来完成重同步模式\
  \ (Lu, Lu, & Chung, 2006)。因此，配准方法被识别并能抵御几何攻击 (Bas, Chassery, & Macq, 2002)。\n\n\
  本节介绍的基于模板的算法侧重于模板强度的自适应确定，以约束搜索空间。搜索空间的收缩关乎系统可信度。同步点的数量限制了模板，导致在应用仿射变换估计参数时出现不可接受的假计数概率。水印检测方法依赖于精确的模板。检测的容错性对于检测位置的不准确性是不可接受的。为了缩小搜索空间，执行了不必要的同步。\n\
  \n基于模板的水印领域取得了巨大进展，但这些方法忽略了含水印图像与原始图像之间的相似性。模板和水印的插入发生在嵌入位置，并仔细加强了账户管理。它还保持了原始图像的受限保真度，导致数据负载妥协。\n\
  \n此外，安全方面被忽视，因为所有这些算法都容易受到模板移除攻击 (Dong & Galatsanos, 2002; Herrigel, Voloshynovskiy,\
  \ & Rytsar, 2001; Bas, Chassery, & Macq, 2002)。可利用特定特征来破坏同步模式。模板的插入作为伪随机噪声模式执行，如滤波算子滤除局部最大值。然后通过恶意攻击，消除已应用的模板。因此，它存在无法承受模板攻击和威胁风险的局限性。\n\
  \n与基于模板的方法类似，自同步水印 (Kutter, 1999; Delannay & Macq, 2000) 也容易受到估计或移除攻击，因为攻击者利用水印周期性平铺的知识来移除它。此外，自相关函数中的峰值可通过频域或空域滤波移除，从而使水印容易受到几何攻击。\n\
  \n######### 不变域\n\n另一种技术是在几何不变子空间中嵌入水印。建议使用直方图规定 (Coltuc & Bolon, 1999) 将水印隐藏至几何失真中。也提出了基于\
  \ Fourier-Mellin 变换 (Lin & Brandt, 1993) 的水印方法 (Ruanaidh & Pun, 1998; Lin et al.,\
  \ 2001)。利用傅里叶变换的不变性和对数极坐标映射 (LPM) 处理平移，获得了平移、缩放和旋转不变域。该方案在图像经历局部几何变形后实施具有局限性。此外，图像离散性质的近似问题和嵌入空间的减小，使水印对有损压缩和低通滤波的抵抗力变弱。\n\
  \n存在另一种技术 (Alghoniemy & Tewfik, 2000)，其中水印空间被定义为基于几何图像矩的归一化、规范空间。这将图像转换为独立于缩放、旋转和垂直/水平反射的形式。水印在此空间嵌入，然后应用逆变换技术获得最终含水印图像。在检测阶段执行矩计算并估计归一化参数。归一化后，可轻松检测图像上的水印。\n\
  \n另一种技术提出创建自相似水印，而非在不变空间嵌入水印 (Solachidis & Pitas, 2000)。这些水印嵌入 DFT 域且不影响 DFT 幅度。使用相同扇区创建水印，因此即使旋转也能轻松检测。它还减少了频率采样步骤，仅在图像缩放或裁剪时执行检测。\n\
  \n######### 水印特征\n\n多年来开发了许多基于特征的水印算法。为解决水印同步问题，首选方法是特征区域检测，以抵抗局部几何失真。基于内容的同步方法遵循的主要步骤如下：\n\
  \n1.  检测特征点的定位\n2.  通过非极大值抑制消除非局部最大值的像素\n3.  通过阈值确定最终特征集\n4.  应用提取的特征识别插入水印的区域\n\
  5.  在接收端无同步错误地检测特征点\n\n这些促成了各种算法的发展 (Deng, Gao, Li, & Tao, 2009; Li & Guo, 2009;\
  \ Lichtenauer et al., 2003; Seo & Yoo, 2004; Yu, Lu, Ling, & Zou, 2006; Yuan et\
  \ al., 2006; Zheng, Liu, Zhao, & Saddik, 2007)。局部化水印算法被特征点基方法使用。水印使用图像中的稳定特征点检测，水印插入对应的局部区域\
  \ (Kutter, 1999)。因此，基于特征的过程对局部几何变形不变。它是带盲检测的抗几何变形鲁棒性问题的最佳方法之一。\n\n另一种方法中 (Bas, Chassery,\
  \ Macq, 2002)，使用 Harris 检测器提取特征点，在稳定特征点组上生成 Delaunay 三角剖分。之后在每个三角剖分三角形中插入水印。但这些点对缩放不变\
  \ (Mikolajczyk & Schmid, 2002)，无法抵御缩放攻击。\n\n\n\n\n\n######## 基于特征的水印技术进一步发展\n\n\
  ######### 墨西哥帽小波与哈里斯特征点\n\n此外，引入了墨西哥帽小波尺度（Tang & Hang, 2003）。对图像进行单独利用，处理以获取的特征点为坚定中心和半径的重叠圆。在每个图像圆中选择两个\
  \ `32 X 32` 的块用于嵌入水印（Li & Guo, 2009）。它能抵抗大多数攻击，但缩放变换攻击会对其产生影响，因为这会改变块的内容。\n\n此外，还提出了一种具有归一化尺度的哈里斯特征点技术，水印嵌入在每个具有固定半径和局部最稳定哈里斯点的圆盘区域内。该技术能抵抗全局几何变换，包括适度的平移、旋转和缩放。但这无法抵抗裁剪攻击。\n\
  \n######### 尺度不变特征变换 (SIFT)\n\n进一步引入了尺度不变特征变换（`SIFT`），用于生成圆形图案作为插入模块（Gupta, Agrawal,\
  \ & Yamaguchi, 2016）。矩形水印被变换为极坐标映射水印（Li, Yu, Gupta, & Ren, 2018）。反之，在水印插入前，通过极坐标映射来确定插入模块。圆形卷积用于检测水印对应关系（Li,\
  \ Deng, Gupta, Wang, & Choi, 2019）。利用极坐标映射圆形垫的平移特性来获得旋转不变水印。\n\n######### 哈里斯-拉普拉斯与仿射归一化\n\
  \n哈里斯-拉普拉斯技术适用于利用哈里斯角点提取尺度不变特征点（Lee, Kim, & Lee, 2006）。根据每个特征点的局部特征尺度，在仿射归一化后嵌入水印。特征尺度被定义为归一化尺度空间表示达到最大值时的尺度。方向特征依赖于图像主轴的角度（Hai,\
  \ Qing, & Ke, 2018）。\n\n######### 局部圆形区域与切比雪夫矩\n\n引入了一种结合局部圆形区域（`LCRs`）和切比雪夫矩的技术（Deng,\
  \ Gao, Li, & Tao, 2009）。`LCRs` 的形成由哈里斯-拉普拉斯检测器完成，`LCRs` 的全局特性通过切比雪夫矩获得。\n\n#########\
  \ 仿射不变点检测器\n\n此外，引入了仿射不变点检测器来检测特征点（Li, Yu, Gupta, & Ren, 2018; Mikolajczyk & Schmid,\
  \ 2002）。对于特定特征点，使用并形成椭圆特征区域用于空间域插入。根据区域形状，在嵌入前将水印几何变换为椭圆图案。\n\n####### 结论\n\n随着多媒体技术的进步和全球网络的快速普及，存储设备和经济实惠的数字记录技术构建了一个平台，使得以数字格式传输、分发、复制、呈现和获取内容成为可能，且质量不降低。篡改也变得可能。然而，通过网络传输内容使其变得不安全。安全特性对于某些类型的传输媒体数据至关重要。因此，我们引入了数字水印技术，这是最热门的研究领域之一。该方法涉及以某种方式嵌入信息的过程。从而满足了版权保护等各种应用对信息安全的需求。\n\
  \n在本章中，分析并回顾了不同的水印方法。这基于变换域和空间域。进一步回顾了使用离散小波变换和奇异值分解的方法。此外，可以得出结论：各种攻击技术被用于评估水印系统。此外，抗几何畸变的水印算法是主要关注点。解决这些问题的不同方案广泛包括同步模板/模式、穷举搜索、隐式同步和利用图像特征的不变域。\n\
