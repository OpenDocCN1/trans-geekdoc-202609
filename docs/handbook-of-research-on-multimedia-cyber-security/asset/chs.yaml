  \ |\n\n######### 鲁棒且抗攻击的数字水印\n\n为更安全地嵌入水印，在现有方法论中增加了以下改进。\n\n*   应用了不可见水印概念，且可见性因子可根据条件控制。\n\
  *   使用三级 DWT 保护图像，与二级或一级 DWT 相比更鲁棒，同时保持图像质量。\n*   在应用于原始图像前对水印进行加密，以提高安全性。加密内容使用\
  \ 2000 位进行加密。\n*   对不同类型的攻击（如椒盐噪声攻击和压缩攻击）具有更强的抵抗力。\n*   为更好地分析，维护水印图像的 PSNR 值。\n\
  \n为保持图像质量，我们将水印嵌入图像的 LL 子带，因其失真较小且不可见（Abraham et al., 2016）。另一方面，通过将水印嵌入原始图像，可安全地保护图像。攻击者不易提取，且恶意用户无法在网络中篡改。因此，这使得水印图像易于验证但难以修改（Sruthi\
  \ et al., 2014）。不同类型的攻击会影响图像的原始性，如裁剪攻击、以椒盐噪声形式出现的噪声攻击等。本文描述了在尽可能维护 PSNR 值的前提下，保护图像免受不同攻击的方法。维护原始图像的\
  \ PSNR 很重要，因为最大信噪比有助于保持质量。\n\n######### 数据流图\n\n########## Level 0 DFD\n\nLevel\
