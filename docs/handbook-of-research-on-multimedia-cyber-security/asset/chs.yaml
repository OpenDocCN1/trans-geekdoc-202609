  \n图 11. MITWS：对几何攻击与滤波攻击的脆弱性\n\n![Figure978-1-7998-2701-6.ch006.f11](img/ch006.f11.png)\n\
  \n########### 容量实验\n\n为了确定具有良好不可感知性的水印最佳尺寸，实验在一组尺寸为 `512×512×3` 的测试眼底图像上进行，并利用原始图像\
  \ (`I`) 与含水印图像 (`I[W]`) 之间的 PSNR 计算了相应的不可感知性。在本实验中，仅考虑眼底图像的红色和蓝色色彩平面的不可感知性。原因在于眼底图像的绿色色彩平面是主要颜色，且在嵌入过程中不被修改。仅修改眼底图像的红色和蓝色色彩平面用于嵌入。\n\
  \n从表 6、图 12 和图 13 可知，红色平面能够为 `100000 bits` 的水印尺寸产生良好的 PSNR 值（平均约 70 dB）。同时，蓝色平面无法产生良好的\
  \ PSNR。在蓝色平面中，当尺寸为 `20000 bits` 时，PSNR 降至 50 dB 以下。\n\n因此，通过数值测试得出结论：`30000 bits`\
  \ 是具有良好不可感知性（平均约 60 dB）的水印最佳尺寸。这在图 14 中清晰地显示出来。当水印尺寸超过 `30000 bits` 时，会引入视觉伪影。\n\
  \n############ 表 6. MITWS：不可感知性与容量\n\n![Figure978-1-7998-2701-6.ch006.g06](img/ch006.g06.png)\n\
