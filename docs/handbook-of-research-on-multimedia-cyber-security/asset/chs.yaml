  \n\n\n\n###### 简介\n\n随着高端数据流设备的改进，以及物联网、无线传感器网络、云计算等技术范式的发展，数据生产源呈现显著增长。多媒体在信息与通信技术（ICT）领域取得了重大突破。伴随这一突破的是海量信息在互联网上的计算设备间生成与传输。消费类应用、娱乐、医疗保健和智慧城市等应用领域中，多媒体方面发挥着至关重要的作用。这些应用伴随着参与实体间更高的移动性和交互性。然而，这些信息（包括信用卡信息和商业机密）通常具有机密性质，需要高端防护以抵御恶意用户或对手。网络攻击已成为全球个人和组织的关键关切，因为它们可能在财务和其他方面造成巨大损失。不安全的信道使得这些信息容易遭受身份盗窃、版权和所有权侵犯、机密性泄露等攻击。机密信息在不同应用中暴露给恶意用户是一个重大关切。因此，建立充分的安全措施以保护敏感信息，并识别和评估安全挑战，已成为必然。\n\
  \n因此，《多媒体网络安全研究手册》为理解多媒体安全领域的最新进展和研究发现提供了全面的解决方案。此外，本书还将呈现网络安全的基础知识，作为学习如何保护机密多媒体信息免受对手侵害的第一步。就所涵盖的概念、开放研究挑战、各种解决方案和研究洞见而言，本书将对读者大有裨益。它强调将关注点聚焦于快速演变且至关重要的网络世界，并开发潜在解决方案以应对相关的安全挑战。本书的主题涵盖了多媒体网络安全的基础、技术、挑战和应用。它通过示例、模型和术语阐释了底层概念，将吸引读者深入了解极具信息量的内容。此外，本书还涵盖了该领域的当前趋势和未来研究方向。本书适合寻求在网络安全、多媒体安全、IT\
  \ 安全、应急响应、网络管理等领域开展工作的教师、科学家、研究人员、学者和专业人士。\n\n#### 章节概览\n\n本手册包含涉及多媒体网络安全不同方面的章节。这些方面包括多媒体加密、多媒体压缩、多媒体水印、多媒体取证、多媒体移动设备认证、云中多媒体数据隐私保护的匿名认证、在线社交网络（OSN）嵌入多媒体内容的安全、医学图像认证、多媒体数据库、医学中的多媒体应用、云计算环境中的多媒体安全、消费类应用的多媒体安全、多媒体软计算技术、人类行为识别、云计算中具有成本效益自动扩缩容的容器编排、用于步态识别的深度学习、基于\
  \ USRP 的安全数据传输、用户认证、基于默克尔树的可视区块链设计与实现、火焰识别、基于网络的 Mirai 僵尸网络检测、密码安全。本手册共组织为 17 章。\n\
  \n##### 第 1 章：多媒体压缩综述\n\n第 1 章旨在提供一份更新的多媒体压缩综述，展示并探讨其成功关联，附带简明的书目背景，对两种技术的潜力进行分类与综合。\n\
  \n##### 第 2 章：持续自适应认证系统\n\n在第 2 章中，作者提出了一种基于异常检测的机器学习技术的持续自适应认证系统。应用使用情况和移动设备的位置被用于检测用户与设备交互时的异常行为。所提系统通过模式的插入和消除，提供了对行为变化的适应性。最后，概念验证和若干实验证明了该工作在设计和实现过程中决策的合理性，并展示了其适用性和性能。\n\
  \n##### 第 3 章：云中隐私保护的匿名认证\n\n云计算技术为用户提供了节省成本和服务灵活性的优势。随着多媒体数据的爆发式增长，越来越多的数据所有者将其个人多媒体数据外包到云端。同时，一些计算开销大的任务也由云服务器承担。然而，外包的多媒体数据及其应用可能会泄露数据所有者的私人信息，因为数据所有者失去了对数据的控制。最近，这一想法激发了针对外包多媒体数据的隐私保护可逆数据隐藏的新研究兴趣。第\
  \ 3 章提出匿名认证方案，作为云计算专业人员采用的最相关、适用和恰当的技术，以消除与隐私风险和挑战相关的风险。\n\n##### 第 4 章：多媒体水印技术综述\n\
  \n在第 4 章中，基于鲁棒性和嵌入容量对近期多媒体水印技术进行了综述。此外，本文还介绍了多媒体水印技术的特性、应用及攻击手段。\n\n##### 第 5 章：基于\
  \ DWT 的水印技术用于版权保护\n\n为了使水印过程更加有效，内容在嵌入图像前先进行加密。选定图像根据轴选择（即 X 方向和 Y 方向）通过低通和高通滤波器。基于方法选择，图像的整体频带被分解为四个不同的子频带，称为\
  \ `LL`、`LH`、`HL` 和 `HH`。其中低低频（`LL`）包含最低频率分量，高高频（`HH`）包含任何图像的最高频率分量。在第 5 章提出的方法中，`LL`\
  \ 还被分解为四个不同区域，并再次分解了二级 `LL`。`DWT` 在三级提供水印嵌入。为了评估和识别水印过程的有效性，作者在所提模型中评估了 `PSNR`（峰值信噪比）和\
  \ `MSE`（均方误差）值。另一个有效指标即 `NCC`（归一化相关系数）用于将提取的水印与原始水印进行匹配。通过应用此过程，借助 `DWT` 实现了图像版权保护。作者还为视频内容实现了类似应用，通过将视频内容分解为若干不同帧，用于社交网络平台上的共享。\n\
  \n##### 第 6 章：基于整数变换的医学图像水印技术\n\n第 6 章提出了一种基于整数变换的水印方案，用于数字眼底图像认证。这属于医学多媒体应用范畴。本章从水印图像认证和数字眼底图像介绍入手。识别并强调了开发眼底图像水印方案的关键需求及其挑战。本章描述了基于整数变换的拟议水印方案。实验结果强调了该方案在满足关键需求方面的能力及其达成情况。同时，也总结了详细结果。\n\
