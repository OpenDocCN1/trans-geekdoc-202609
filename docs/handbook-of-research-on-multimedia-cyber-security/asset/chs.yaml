  \ |\n\n###### 水印系统分类\n\n水印系统分为三个不同类别（Mathon, Cayre, Bas, & Mac, 2014; Singh, Dave,\
  \ & Mohan, 2014; Singh, Kumar, Singh, & Mohan, 2017; Tsai, Jhuang, & Lai, 2012），如下图\
  \ 3 所示。\n\n*   **盲水印**：在该技术中，通过使用水印图像来提取水印。应用包括电子投票系统、版权保护、医疗保健等。\n*   **非盲水印**：在该技术中，提取过程中需要原始图像和嵌入的水印。应用包括版权保护和隐蔽通信。\n\
  *   **半盲水印**：该技术基于非盲水印系统工作，但检测时不需要原始数据。该技术的应用包括 CAD 模型、认证等。\n\n| 图 3. 水印提取过程 |\n\
  | --- |\n| ![Figure978-1-7998-2701-6.ch004.f03](img/ch004.f03.png) |\n\n###### 水印特性\n\
  \n\n\n\n\n####### 水印特征与应用\n\n它表现出图 4 所示的多种水印特征 [106]。\n\n**鲁棒性**被定义为算法抵抗噪声的能力。**安全性**是指在不破坏载体图像的情况下，修改或移除水印的难度。**数据载荷**是指所包含信息的数量。水印的**透明度**是不可感知性的结果。**认证框架**是脆弱水印的主要关注领域。揭示和嵌入水印的总成本被定义为**计算水印**。其他重要特征定义见\
  \ Singh, Kumar, Singh, & Mohan (2017)。\n\n| 图 4. 水印的各种特征 |\n| --- |\n| ![Figure978-1-7998-2701-6.ch004.f04](img/ch004.f04.png)\
  \ |\n\n######## 水印应用\n\n不同的水印方法用于不同的应用。这些包括数字取证、版权保护、医疗保健、军事、医疗应用等，如下所示 (Vallabha,\
  \ 2003; Kumar, Singh, & Kumar, 2018)。\n\n1.  **版权保护**：隐藏秘密信息以向数字信息提供版权保护。\n2.  **广播监控**：它使所有者能够验证内容通过卫星电视和有线电视在何处、何时以及播放了多长时间。\n\
  3.  **指纹识别**：该方法通过包含预期接收者的身份信息，追踪非法分发的源头。\n4.  **医疗应用**：该方法提供医疗数据的机密性和认证。它为医疗保健应用提供了增值方法。\n\
  5.  **电子投票系统**：随着计算机网络的发展，互联网遍布全球。它是在选举期间按安全偏好安排选举的方法。由于互联网在购物、银行业务等领域的快速使用，安全交易是一个重要因素。\n\
  6.  **远程教育**：远程教育在乡村最为普遍。远程教育需要智能技术。水印技术为远程学习数据提供了认证。\n7.  **云安全**：随着图像数量的增加，基于内容的图像检索被纳入考量。图像占用的存储量比文本大。因此，云存储是一个例子\
  \ (Xia et al., 2016)。\n\n在将敏感图像传输到另一处之前，必须对其进行认证。因此，云服务器在发送加密图像到服务器之前插入唯一水印。当发现非法图像时，未经授权的用户会被识别出来。\n\
  \n######## 水印攻击\n\n在水印应用中，数据的处理方式就像它将水印的接收者分散开一样 (Sherekar, Thakare, & Jain, 2011)。在水印的定义中，攻击是指在水印过程中损害未隐藏的秘密信息。此外，被攻击的数据由经过处理的含水印数据描述。攻击分类如下：\n\
  \n1.  **主动攻击**：在此类攻击中，黑客移除水印并使其无法检测。主要目的是扭曲嵌入的水印，使其无法被识别。例子包括拷贝控制、指纹识别、版权保护等。\n\
  2.  **被动攻击**：在被动攻击中识别水印。不执行删除或破坏。它们在隐蔽信道中起重要作用。\n3.  **伪造攻击**：黑客插入新水印，而不是移除旧水印。\n\
  4.  **共谋攻击**：它们属于主动攻击。黑客使用多个相同信息的实例，其中每个实例包含不同的标记，以构建一个不带任何标记的副本。\n5.  **简单攻击**：也可称为噪声攻击或波形攻击。这是最简单的攻击之一，因为它在不识别单个水印的情况下损害嵌入的水印。例子包括基于波形的压缩、噪声添加、伽马校正等。\n\
  6.  **模糊攻击**：这类攻击通过生成虚假的原始数据或含水印数据来迷惑用户。其中一个例子是反转攻击。\n7.  **密码攻击**：此攻击的主要目标是破解水印技术中的安全方法，并找到移除已插入水印信息的模式。由于计算复杂度高，此技术应用有限。\n\
  8.  **移除攻击**：在不妨碍水印技术安全性的情况下，完全移除含水印数据 (Voloshynovskiy, Pereira, Pun, Eggers, &Su,\
  \ 2001)。嵌入水印时不使用密钥。它使用量化和去噪。\n9.  **几何攻击**：主要目标是将水印检测与插入的信息同步，而不移除插入的水印。\n\n#######\
  \ 多媒体水印技术综述\n\n######## 数字水印技术\n\n数字水印由多种方法组成，用于保护数字数据免遭修改，以及防止未经授权的数据访问。水印技术分为变换域和空间域。水印的嵌入在空间域中执行，功能作用于像素\
  \ (Singh, Sharma, Dave, & Mohan, 2012)。该技术中会改变像素值。它主要使用 `LSB` 技术进行修改过程。变换域技术的主要目标是改变变换域系数。变换域中水印主要使用的方法是\
  \ `DFT`、`DWT` 和 `DCT`。由于安全性和鲁棒性，变换域比空间域技术有效得多。\n\n######### 空间域水印\n\n该技术将图像描绘为像素的组合。为了附加水印，修改像素的颜色值和像素强度。它们消耗较少的时间，且复杂度较低。该技术中的每一个操作都很简单，但具有较高的计算速度。这些对攻击的鲁棒性相对较弱。在\
  \ `LSB` 技术中 (Neeta, Snehal, & Jacobs, 2006)，水印嵌入在任意选定像素的最低有效位中。它可以轻松应用于图像，且不破坏图像质量。主要缺点是对信号处理操作缺乏鲁棒性，导致水印因信号处理攻击而耗尽。它能抵抗简单的攻击，如噪声添加和裁剪。\n\
  \n######### 变换域水印\n\n在此方法中，不在载体图像上执行水印嵌入。第一步，对载体图像进行变换，然后将水印嵌入到变换后的图像中。此外，为提取图像，对操作后的系数计算逆变换\
  \ (Akiyama, Motoyoshi, Uchida, & Nakanishi, 2006)。这些对 JPEG 压缩等攻击具有鲁棒性。它们用于鲁棒水印，以确保水印对最流行的信号处理攻击的灵活性。存在许多变换水印技术，如奇异值分解\
  \ (`SVD`)、离散小波变换 (`DWT`)、离散余弦变换 (`DCT`) 和离散傅里叶变换 (`DFT`)。这些方法具有高不可感知性、对信号处理攻击和图像改动的有效抵抗力。与基于空间域的方法相比，该方法的计算成本更高。\n\
  \n\n\n\n\n######## 离散余弦变换（DCT）水印技术\n\n它从时域信号获取频域信号。当对图像应用 DCT 技术时，会形成一个二维系数矩阵（Lin,\
  \ Shie, & Guo, 2010）。它用于模式识别、数据压缩以及图像处理的各个领域。在 DCT 方法中，图像被划分为固定维度的非重叠块。它适用于图像的每个块。应用块选择标准以提取重要块。相应地，根据选定的相应块选择系数。在系数矩阵的左上角位于低频分量，右下角位于高频分量。它将图像分解为伪频带。水印嵌入在中频子带中。如果水印嵌入在高频分量之间，则可以隐藏。系数被平滑修改以插入水印。最后，对图像块应用逆\
  \ DCT。\n\n对于长度为 M 的一维序列，DCT 计算如下：\n\n![Mathtype978-1-7998-2701-6.ch004.m01](img/ch004.m01.svg)\
  \ (1)\n\n其中 V = 0, 1, 2, 3 ... M-1\n\n逆 DCT 计算如下：\n\n![Mathtype978-1-7998-2701-6.ch004.m02](img/ch004.m02.svg)\
  \ (2)\n\nα(V) 描述如下：\n\n![Mathtype978-1-7998-2701-6.ch004.m03](img/ch004.m03.svg)\
  \ (3)\n\n对图像块应用 DCT 时，会得到两种系数：DC 和 AC（Kothari & Dwivedi, 2013）。系数矩阵仅包含一个 DC 系数，其余均为\
  \ AC 系数。DCT 方法能抵抗噪声、锐化、裁剪和滤波等各类攻击。它还具有出色的计算能力，并为比特率降低提供了改进的性能。对于二维变换，DCT 定义如方程所示。\n\
  \n![Mathtype978-1-7998-2701-6.ch004.m04](img/ch004.m04.svg) (4)\n\n######## 离散小波变换（DWT）水印技术\n\
  \n它生成多尺度图像视图，有助于理解图像的形成。此外，可在多个分辨率下观察信号（Tao & Eskicioglu, 2004）。图像分解为低频和高频分量。为获得期望结果，对低频分量进行递归分解。对图像应用\
  \ DWT 时，图像分解为四个子带，如图 4 所示。四个子带 HH、HL、LH 和 LL 分别包含图像的对角细节、水平数据、垂直数据和近似分量。近似子带包含适合嵌入水印的图像低频分量。图像的最大相关信息包含在该子带中。逆离散小波变换（IDWT）用于恢复原始图像。由于多尺度和局部化特性，DWT\
  \ 是水印过程中最常用的技术之一。通过空间局部化特性可识别嵌入在图像区域中的水印。应用 DWT 后，图像分解为四个非重叠的多尺度集合。方程 5、6、7、8 描述了系数：\n\
