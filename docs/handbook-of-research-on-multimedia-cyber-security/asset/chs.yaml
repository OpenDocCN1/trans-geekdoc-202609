  \ end-to-end line | 0.74887838122 | 0.0743096253077 | 1 | 1 |\n\n表 5 展示了所有用户会话中各特征方差之和的整体视图，较小的值意味着更好的特征一致性。最后，我们需要选择同时具有可接受的一致性和判别值的最理想特征。通过将方差之和按升序排列，可确定比其他特征更一致的特征。排在最前面的特征是会话间最一致的用户特征，即最理想的特征。\n\
  \n在本研究中，根据加权特征选择法，我们发现笔画级特征中最好的特征是与用户触摸动作坐标及触摸笔画轨迹形状相关的特征，例如：`X-Coordinates`、`Y-Coordinates`、`Average\
  \ Direction` 和 `Ratio of end-to-end line to length of trajectory`。这种行为可能与实验设备屏幕的尺寸有关，屏幕尺寸赋予每个用户使用屏幕最合适部分的自由度。\n\
  \n然而，在本研究中，我们使用了表中所示的所有 27 个特征，但根据每个特征的一致性和判别性，为其分配了一个 0 到 1 之间的权重值。这是通过计算特征一致性和判别值的平均值，根据公式\
  \ 6 计算该特征的权重来实现的。\n\n![Mathtype978-1-7998-2701-6.ch013.m11](img/ch013.m11.svg) (6)\n\
  \n其中 `W[i]` 是特征 `i` 的结果权重，`D[i]` 是特征 `i` 的归一化判别值，`C[i]` 是特征 `i` 的归一化一致性值。\n\n作为替代方案，可根据所需模型复杂度选择一系列特征，或使用任何适合的准则根据应用需求选择特征。使用主成分分析（PCA）进行降维，结果是从所有特征的\
  \ 27 个维度中仅选择了 13 个维度。\n\n########### 笔画级分类\n\n本节将考虑两种不同的分类算法：人工神经网络（ANN）和支持向量机（SVM）。\n\
  \n########### 人工神经网络\n\n本节将深入探讨如何使用 ANN 工具对笔画级和会话级分类器建模，如何在识别过程中使用生成的模型，以及性能评估参数。\n\
  \n我们使用人工神经网络分类器对约 2903 个输入样本的 27 个输入特征进行分类，这些样本属于前面提到的 10 个移动设备用户。我们的 ANN 由一个输入层、一个隐藏层和一个输出层组成，使用\
  \ Sigmoid 激活函数（Activation Functions in Neural Networks, 2017），如图 6 所示。\n\n![Mathtype978-1-7998-2701-6.ch013.m12](img/ch013.m12.svg)\
  \ (7)\n\n| Figure 6. The Artificial Neural Network Classifier Construction |\n|\
  \ --- |\n| ![Figure978-1-7998-2701-6.ch013.f06](img/ch013.f06.png) |\n\n我们使用这种激活函数是因为它具有类似阶跃函数的特性，但增加了一个不确定区域。Sigmoid\
  \ 函数也非常类似于生物神经元的输入/输出关系，因此被用于大多数神经网络应用。我们使用 Sigmoid 函数的主要原因是它的输出范围在（0 到 1）之间。因此，它特别适用于需要预测概率作为输出的模型。由于任何事物的概率仅存在于\
  \ 0 和 1 的范围内，Sigmoid 是正确的选择。\n\n我们将输入样本分为三组：\n\n*   50% 的样本用于训练。\n*   25% 的样本用于验证，以衡量网络泛化能力，并在泛化不再改善时停止训练。\n\
  *   25% 用于测试，这对训练没有影响，因此可在训练期间和训练后提供网络性能的独立度量。\n\n\n\n\n############# 在人工神经网络学习过程中使用了缩放共轭梯度（SCG）反向传播学习算法。与其他算法（如贪婪地消耗计算资源的\
  \ Levenberg-Marquardt 算法）相比，该算法提供了最佳性能和快速收敛（Matlab 指南，2019）。在我们的工作中，我们测试了不同的学习算法，然而，考虑到我们的实验规格和条件，SCG\
  \ 反向传播算法的结果在性能和速度方面表现最佳。\n\n我们使用了 MATLAB MathWorks 提供的现成 ANN 建模工具。我们使用了一台配备 Intel\
  \ Core i5 处理器、6GB 内存和 Nvidia GeForce 520m GPU 的笔记本电脑，运行 MATLAB 2017a 版本。它节省了大量实现\
  \ ANN、训练和部署的时间。MATLAB 中的神经网络工具箱提供了一个带有图形用户界面的应用程序，每个用户都可以通过遵循一些顺序步骤来提供输入样本和期望输出样本，轻松地提供输入、输出、学习算法、隐藏神经元数量以及激活每个神经网络中每个单个神经元所需的激活函数。\n\
  \n############ 支持向量机\n\nMATLAB MathWorks 还提供了一个图形用户界面应用程序，用于使用不同类型的分类器对数据进行分类。在这里，我们使用了具有不同核函数的\
  \ SVM 分类器，以找到最适合我们应用的分类器（Matlab 指南，2019）。此处使用的数据样本与之前在 ANN 分类器中使用的相同。SVM 的类型包括：线性、二次、三次、精细高斯、中等高斯和粗糙高斯。分类和识别的结果将在后面讨论。\n\
  \n########### 会话级模型特征选择结果\n\n在本节中，我们介绍了应用于高层会话特征模型的用户-特征一致性和特征-判别性搜索结果（见表 6）。我们在此也可以使用任何选择标准来选择最佳特征。在这个特征模型中，我们考虑了第\
  \ 4.4 节中提到的特征选择方法。我们使用了所有特征，但为每个特征分配了一个权重数值，以在分类阶段放大最佳特征的效果并抑制最差特征的效果。\n\n在会话级模型中，最佳特征主要与用户在多点触控笔划中的行为有关，主要是放大和缩小的时机。此外，弹射速度是最佳特征。这种行为可能是由于我们实验中不同用户之间不同的手部几何结构造成的。当我们在\
  \ MATLAB 中使用主成分分析时，这 35 个特征减少到了 21 个特征；换句话说，PCA 算法将 35 维数据转换到新的 21 个维度或空间，以降低复杂性并消除这些特征中的冗余信息。\n\
