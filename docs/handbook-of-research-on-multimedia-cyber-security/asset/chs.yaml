  \n其余节点与上述类似。\n\n####### 方法论\n\n为了解决相似性搜索问题，我们可以计算查询向量与向量空间中所有其他向量之间的距离。然而，这种方法仅适用于小型向量空间。在大型向量空间中，我们必须寻找一种能够减少距离计算次数的方法。我们研究了许多方法，并意识到\
  \ M-Tree 可以帮助我们实现这一目标。因此，我们使用 Scala 语言实现了本地 M-Tree 结构（在单机上运行）。随后，我们在 Apache Spark\
  \ 框架上使用 Scala 语言实现了分布式 M-Tree。我们还对本地和分布式 M-Tree 结构进行了大量实验。M-Tree 结构在单机上进行测试，DM-Tree\
  \ 结构在 Spark 集群上进行测试，如图 8 所示。以下是我们解决方案的详细信息。\n\n我们基于 (Ciaccia et al., 1997; Kouahla,\
  \ 2011) 使用 Scala 语言创建了 `M-Tree` 类来表示本地 M-Tree 结构。`M-Tree` 类有两个用于搜索相似性的重要方法，如下所示：\n\
  \n*   `def kNNSearch(Q: Entry, k: Int): ListBuffer[(Long, Double)]`：执行 kNN 查询，并返回\
  \ Q 条目的 k 个最近邻条目的 k 对 (id, distance)。\n\n\n\n\n####### DM-Tree 结构与算法\n\n*   **`def\
  \ rangeSearch(Q: Entry, rQ: Double): ListBuffer[(Long, Double)]`**: 执行范围查询，返回满足从\
  \ Q 到条目距离小于或等于 rQ 的条目对 (id, distance)。\n\n我们不在此展示这些算法，因为它们已在 (Ciaccia et al., 1997)\
  \ 中描述。\n\n在大数据时代，我们拥有包含大量表示图像或视频片段向量的大型多媒体数据库。为了存储大型向量空间，我们使用 Hadoop 框架的 HDFS 分布式文件系统\
  \ (Zecevic & Bonaci, 2017)。除了 HDFS，我们还可以使用其他分布式文件系统，如 Amazon S3、Google File System\
  \ 等。为了解决在大型向量空间中搜索相似性的问题，我们构建了一个分布式 M-Tree 结构并将其命名为 DM-Tree。\n\n######## 表 1. DM-Tree\
  \ 类的属性\n\n| Properties | Types | Descriptions |\n| --- | --- | --- |\n| CAPACITY\
  \ | Int | DM-Tree 对象的容量。 |\n| M-Trees | `RDD[(Int, M-Tree)]` | 存储 M-Tree 对象及其 id。\
  \ |\n\n我们通过定义 DM-Tree 类并将其与 M-Tree 类结合来实现 DM-Tree 结构。一个 DM-Tree 对象包含一组由向量空间创建的 M-Tree\
  \ 对象。向量空间存储在 RDD 的分区中。我们从每个分区创建一个 M-Tree 对象，并使用 RDD 结构分布式存储这些 M-Tree 对象。表 1 和表 2\
  \ 展示了 DM-Tree 类的属性和方法。\n\n######## 表 2. DM-Tree 类的方法\n\n| Methods | Descriptions\
  \ |\n| --- | --- |\n| `def createFrom(path: String, CAPACITY: Int): DM-Tree` | 从包含向量的\
  \ HDFS 文件创建 DM-Tree 对象。 |\n| `def save(path: String, dmtree: DM-Tree): Unit` | 将\
  \ DM-Tree 对象存储到 HDFS 中。 |\n| `def load(path: String): DM-Tree` | 从 HDFS 加载 DM-Tree\
  \ 对象。 |\n| `def rangeSearch(Q: String, rQ: Double): ListBuffer[(Long,Double)]` |\
  \ 执行范围查询。 |\n| `def kNNSearch(Q: String, k: Int): ListBuffer[(Long,Double)]` | 执行\
  \ kNN 查询。 |\n\n以下是应用于 DM-Tree 类中的算法详情。\n\n####### 创建 DM-Tree 结构\n\n######## 图 3.\
  \ 从向量集创建 DM-Tree 结构的过程\n\n![Figure978-1-7998-2701-6.ch007.f03](img/ch007.f03.png)\n\
  \n创建 DM-Tree 结构的过程如图 3 所示。首先，我们将向量集从 Hadoop 框架的 HDFS 分布式文件系统加载到 Apache Spark 集群的\
  \ RDD 结构中 (Zecevic & Bonaci, 2017)。然后，在 RDD 结构的每个分区上，我们通过使用 Map 转换创建一个 M-Tree 结构。Map\
  \ 转换类似于 forEach 循环，但它并行执行任务。由 RDD 结构的分区创建的一组 M-Tree 结构即为 DM-Tree 结构。因为我们可以配置 RDD\
  \ 结构的分区数量，所以 DM-Tree 结构的 M-Tree 结构数量也可以配置。算法 1 详述了创建 DM-Tree 结构的算法。\n\n########\
  \ 算法 1. 从向量集创建 DM-Tree 对象的算法\n\n**输入**：\n1. `path`：包含向量集的 HDFS 文件路径。\n2. `CAPACITY`：DM-Tree\
  \ 对象中 M-Tree 对象的容量。\n\n**输出**：一个 DM-Tree 对象。\n\n1. 将向量集的 HDFS 文件加载到 Spark 集群的 RDD\
  \ 对象中。\n2. 使用 `CAPACITY` 作为 DM-Tree 对象中 M-Tree 对象的容量，创建一个新的 DM-Tree 对象。\n3. 将 RDD\
  \ 对象的每个分区映射到 DM-Tree 对象中的一个 M-Tree 对象（即并行地从 RDD 对象的每个分区创建一个 M-Tree 对象）。\n4. 返回 DM-Tree\
  \ 对象。\n\n####### 存储 DM-Tree 结构\n\n由于创建 DM-Tree 结构耗时，我们需要存储 DM-Tree 结构以便后续复用。此外，向量空间可能非常大，因此\
  \ DM-Tree 结构也可能非常大。我们无法将 DM-Tree 结构存储在本地文件系统中，而必须存储在像 HDFS 这样的分布式文件系统中。算法 2 详述了将\
  \ DM-Tree 结构存储到 HDFS 的算法。\n\n######## 算法 2. 将 DM-Tree 对象存储到 HDFS 的算法\n\n**输入**：\n\
  1. `path`：将存储 DM-Tree 对象的 HDFS 中目录的路径。\n2. `dmtree`：将被存储到 HDFS 的 DM-Tree 对象。\n\n\
  **输出**：无。\n\n1. 存储 DM-Tree 对象的信息，如：DM-Tree 对象的容量、DM-Tree 对象中 M-Tree 对象的数量。\n2. 映射\
  \ DM-Tree 对象中的每个 M-Tree 对象 {\n3. 将 M-Tree 对象存储到由 `path` 指定的 HDFS 目录中。\n4. }\n5.\
  \ 返回。\n\n####### 加载 DM-Tree 结构\n\n当我们需要在向量空间中有效地搜索相似性时，我们需要将 DM-Tree 结构从 HDFS 加载到\
  \ Spark 集群中。因为 DM-Tree 结构由一组 M-Tree 结构组成，每个执行器应该加载一个 M-Tree 结构以有效处理。因此，执行器的数量应等于\
  \ M-Tree 结构的数量。算法 3 详述了从 HDFS 加载 DM-Tree 对象的算法。\n\n######## 算法 3. 从 HDFS 加载 DM-Tree\
  \ 对象的算法\n\n**输入**：\n1. `path`：存储 DM-Tree 对象的 HDFS 中目录的路径。\n\n**输出**：一个 DM-Tree 对象。\n\
  \n1. 加载 DM-Tree 对象的信息，如：DM-Tree 对象的容量、DM-Tree 对象中 M-Tree 对象的数量。\n2. 使用加载的容量创建一个新的\
  \ DM-Tree 对象。\n3. 从每个执行器并行加载由 `path` 指定目录中文件中的 DM-Tree 对象的 M-Tree 对象。\n4. 返回 DM-Tree\
  \ 对象。\n\n####### 执行分布式 kNN 查询\n\n分布式 kNN 查询是在 DM-Tree 结构上进行的 kNN 查询。图 4 展示了执行分布式\
  \ kNN 查询的过程。首先，主节点中的驱动程序通过使用 Map 转换向工作节点中的 M-Tree 对象发送执行 kNN 查询的请求。然后，驱动程序将结果从工作节点收集到主节点，并通过使用\
  \ Reduce 动作将它们合并为单个结果。结果按距离升序排序，然后从排序后的结果中提取前 k 个条目。算法 4 详述了执行分布式 kNN 查询的算法。\n\n\
  ######## 图 4. 执行分布式 kNNSearch(Q, k) 的过程\n\n![Figure978-1-7998-2701-6.ch007.f04](img/ch007.f04.png)\n\
  \n######## 算法 4. 在 DM-Tree 对象上执行分布式 kNN 查询的算法\n\n**输入**：\n1. `Q`：一个查询向量。\n2. `k`：查询向量的最近邻数量。\n\
  \n**输出**：一个包含 (id, distance) 对的列表，其中 id 是向量的 id，distance 是从 Q 到该向量的距离。\n\n1. 映射\
  \ DM-Tree 对象的 M-Tree 对象 RDD 中的每个 `mtree` 对象 {\n2. 设置 `result = mtree.kNNSearch(Q,\
  \ k)`\n3. }\n4. 将结果从工作节点收集到主节点。\n5. 设置 `unionResult = union` 收集到的结果。\n6. 设置 `sortedResult\
  \ = unionResult.sortBy(\"distance\", \"ascending\")`。\n7. 返回 `sortedResult.top(k)`。\n\
  \n算法 4 成功解决了 kNN 搜索问题。然而，该算法仍有一个需要改进的缺点。即每个工作节点向主节点发送 k 个向量，然后主节点排序并仅选择最接近查询向量的\
  \ k 个向量。因此，存在发送到主节点但从未被使用的向量。这增加了从工作节点无谓传输到主节点的数据量，降低了算法的效率。然而，改进这一缺点并不简单。我们需要做更多研究。\n\
  \n####### 执行分布式范围查询\n\n######## 图 5. 执行分布式 RangeSearch(Q, rQ) 的过程\n\n![Figure978-1-7998-2701-6.ch007.f05](img/ch007.f05.png)\n\
  \n\n\n\n\n######## 分布式范围查询\n\n分布式范围查询是针对 `DM-Tree` 结构的范围查询。图 5 展示了执行分布式范围查询的过程。首先，驱动程序通过\
  \ `Map` 变换向工作节点中的 `M-Tree` 对象发送执行范围查询的请求。然后，驱动程序将结果从工作节点收集到主节点，并通过 `Reduce` 动作将它们合并为单个结果。为了便于观察，结果按距离升序排序。算法\
  \ 5 详细描述了在 `DM-Tree` 结构上执行范围查询的算法。\n\n######### 算法 5. 执行分布式范围查询的算法\n\n**输入：**\n\
  1. `Q`：查询向量。\n2. `rQ`：最大距离。\n\n**输出：** 一组键值对列表 `(id, distance)`，其中 `id` 是向量的 ID，`distance`\
  \ 是从 `Q` 到该向量的距离。\n\n```\n1. Map each mtree object in the RDD of M-Tree objects\
  \ of the DM-Tree object {\n2.   Set result = mtree.rangeSearch(Q, rQ)\n3. }\n4.\
  \ Collect the results from the worker nodes to the master node\n5. Set unionResult\
  \ = union the collected results\n6. Set sortedResult = unionResult.sortBy(\"distance\"\
  , \"ascending\")\n7. Return sortedResult\n```\n\n###### 实验\n\n本节展示了在 `M-Tree` 和\
  \ `DM-Tree` 结构上的实验。我们使用的数据是从马克斯·普朗克信息学研究所网站下载的 Yago 知识库（“YAGO (database) Wikipedia,”\
  \ n.d.; “YAGO Homepage,” n.d.）合成的。我们还使用 Scala 语言构建了一个应用程序来实现 `M-Tree` 和 `DM-Tree`\
  \ 结构以进行实验。以下是实验的详细信息。\n\n####### M-Tree 结构实验\n\n为了对 `M-Tree` 结构（“M-Tree Wikipedia,”\
