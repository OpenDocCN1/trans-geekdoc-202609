  \n########### 盲检测实验\n\nMITWS 提取水印需要水印的相关知识。\n\n实验发现 MITWS 是非盲的。\n\n########### 观察结果\n\
  \n本章介绍了利用颜色特征和整数变换进行眼底图像认证的 MITWS。MITWS 首先将图像像素的颜色值分为主要颜色和次要颜色。通过整数变换修改像素的次要颜色，以在其中隐藏秘密信息。该方案引入了一种名为“平面内差分嵌入”的新像素选择策略，该策略跨平面选择像素，而非在单一平面内选择连续像素。该策略提高了方案的脆弱性和容量。由于使用可逆整数变换进行嵌入，MITWS\
  \ 是可逆的。对于任何尺寸的水印，可逆性均得以保持。MITWS 平均可产生 80.72% 的不可感知性。MITWS 对抖动、滤波和几何攻击具有脆弱性。\n\n\
  MITWS 对抖动攻击的平均脆弱率为 38%，对滤波和几何攻击的平均脆弱率为 45%。它无法检测篡改，也无法定位图像中的篡改区域。发现 `30000 bits`\
  \ 的水印是具有良好不可感知水平的 MITWS 最佳容量。MITWS 是非盲的。在提取过程中需要水印的知识。\n\n########### 关键发现\n\nMITWS\
  \ 未解决篡改检测和定位问题。原因在于水印与载体无关，即方案在无需载体图像知识的情况下生成水印。如果利用载体图像的知识生成水印，则图像中的任何修改都能被轻松定位。因此，需要设计基于载体图像的水印生成方法。\n\
  \nMITWS 是非盲的。在提取过程中需要水印的知识。根据第 1 节给出的本研究关键需求，方案应为盲检测。原因在于水印与载体无关。如果水印是载体图像的函数，则可在提取过程中通过该函数获知水印，而无需在嵌入和提取之间共享任何信息。\n\
  \n########### 结论与未来改进\n\n本章阐述了用于眼底图像认证的改进整数变换水印方案 (MITWS)。它主要利用颜色特征和整数变换。该方案引入了一种名为“平面内差分嵌入”的新像素选择策略，通过跨颜色平面选择像素来形成像素对。MITWS\
  \ 具有可逆性、脆弱性和不可感知性。它无法检测和定位图像中的篡改。MITWS 是非盲的。在提取过程中需要水印的知识。篡改检测、篡改定位和盲检测是 MITWS 中的主要问题。如果水印作为载体图像的函数生成，上述两个主要问题便可轻松解决。对于篡改检测和定位，载体的任何变化都会导致用于生成水印的函数响应发生变化。如果图像被篡改，则水印也会被修改。因此，篡改可被轻松检测和定位。对于盲检测，用于生成水印的函数可用于在提取过程中生成参考水印，以进行验证和确认。实际嵌入的水印可通过整数变换提取。因此，该方案可设计为盲方案。\n\
  \n本工作的未来改进是利用非线性函数（如混沌模型和哈希技术）生成载体相关的水印。这一步骤将为所提方案带来篡改检测和定位功能。将进一步利用伪随机过程审查嵌入的标记空间，使方案能在完全无需原始数据和秘密数据知识的情况下进行完全盲提取。\n\
