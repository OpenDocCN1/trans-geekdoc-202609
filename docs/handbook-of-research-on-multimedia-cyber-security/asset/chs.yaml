  \  \nDuy Tan University, Da Nang, Vietnam\n\n##### 摘要\n\n在过去几十年中，网络信道上的数据传输量急剧增加。水印技术是将水印作为数字信号、标签或标记添加到载体媒体中的过程。多媒体水印的主要要求是鲁棒性和嵌入能力。鲁棒性被定义为算法抵抗噪声的强度。然而，同时实现这两者具有挑战性。水印的众多特性在多媒体水印系统中至关重要。研究人员在军事、数字取证、医疗等各种应用中使用水印方案。针对这些水印方案的攻击会损害或暴露水印中携带的秘密信息。潜在的研究人员提出了各种技术来平衡或改善这些问题。本章基于鲁棒性和嵌入能力回顾了近期的多媒体水印技术。介绍了多媒体水印技术的特性、应用和攻击。\n\
  \n##### 介绍\n\n在过去，各种信道和网络之间的数据传输有所增加。随着技术的发展，传输媒体的增长和使用也在增加。为避免滥用并确立真实性，应使用水印技术来保护多媒体数据。数字水印通过在宿主图像中隐藏数据所有权，防止了数字图像的恶意复制和非法传播（Ganic\
  \ & Eskicioglu, 2004; Patel, Mehta, & Pradhan, 2011）。水印被设计为一种将双重/单一水印作为标签、标记或数字信号进行嵌入的过程。水印过程根据不同的群组和域进行定义（Aslantas,\
  \ 2008）。水印方法分为变换域和空间域（Loukhaoukha, Nabti, & Zebbiche, 2014）。最初使用的方法是空间域，这是一种通过直接改变像素来执行水印嵌入的技术。它具有易于实现和计算成本低的特点。该领域的重要技术有基于相关的、扩频和最低有效位（`LSB`）。变换域的潜在例子包括离散傅里叶变换（`DFT`）、离散小波变换（`DWT`）、奇异值分解（`SVD`）和离散余弦变换（`DCT`）。从可见性角度来看，数字水印分为不可见和可见两大类。不可见水印的类别包括脆弱和鲁棒（Aslantas,\
  \ 2008）。详细的水印分类在（Aslantas, 2008; Singh, 2017; Tsai, Huang, Kuo, Horng, 2012）中进一步介绍。\n\
