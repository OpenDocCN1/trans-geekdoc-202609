  \ 作者简介\n\n**B. B. Gupta** 于 2009 年在印度理工学院鲁尔基分校获得信息与网络安全领域的博士学位。2009 年，他被加拿大政府选为加拿大联邦奖学金获得者。他在\
  \ IEEE、Elsevier、ACM、Springer、Wiley、Taylor & Francis、Inderscience 等高水平国际期刊和会议上发表了\
  \ 200 多篇研究论文。他曾访问加拿大、日本、澳大利亚、中国、西班牙、香港、意大利、马来西亚、澳门等多个国家，展示其研究成果。他的传记被选入第 30 版《Marquis\
  \ Who's Who in the World》（2012）。此外，他还被《Marquis Who's Who in the World》（美国）选为 2017\
  \ 年 Albert Nelson Marquis 终身成就奖获得者。Gupta 博士于 2017 年荣获印度电子与信息技术部颁发的 Sir Visvesvaraya\
  \ 青年教师研究奖学金奖。此外，他分别于 2018 年和 2019 年荣获印度国家理工学院库鲁克谢特拉分校颁发的最佳教师奖。他还担任多个由印度政府资助机构资助的研发项目的首席研究员。他分别担任\
  \ *IEEE Transactions on Industrial Informatics*、*IEEE Access* 的副编辑，以及 *IJITCA*（Inderscience）的执行编辑。此外，Gupta\
  \ 博士还担任 *International Journal of Cloud Applications and Computing (IJCAC)*（IGI\
  \ Global, USA）的主编。他还担任 IEEE、Springer、Wiley、Taylor & Francis 等多家期刊的审稿人。他曾担任 2018\
  \ 年 IEEE INFOCOM: CCSNA（美国）的 TPC 主席。此外，他还分别担任了在台湾和日本举办的第 10 届 NSS 2016 和第 17 届 IFSA-SCIS\
  \ 2017 的宣传主席。他还是 FISP 和 ISCW 研讨会的创始主席，这些研讨会每年在不同国家举办。自 2014 年起，Gupta 博士每年担任日本 IEEE\
  \ 全球消费电子会议 (GCCE) 中“网络安全最新进展专题会议 (SS-CBS)”的组织主席。Gupta 博士于 2016 年 10 月 7-10 日在第 5\
  \ 届 IEEE 全球消费电子会议 (GCCE)（日本京都）上同时获得了常规类和学生类优秀论文奖。Gupta 博士是 IEEE 高级会员、ACM 会员、SIGCOMM\
  \ 会员、SDIWC 会员、互联网协会会员、纳米技术学会会员、国际工程师协会 (IAENG) 终身会员、国际计算机科学与信息技术协会 (IACSIT) 终身会员。他曾于\
  \ 2015 年和 2018 年、2017 年、2018 年分别担任日本山口大学、澳大利亚迪肯大学和澳大利亚斯威本科技大学的访问研究员。目前，Gupta 博士在印度国家理工学院库鲁克谢特拉分校计算机工程系担任助理教授。他的研究兴趣包括信息安全、网络安全、移动/智能手机、云计算、Web\
  \ 安全、入侵检测、计算机网络和网络钓鱼。\n\n\n\n\n\n#### 作者简介\n\n##### Deepak Gupta\n\nDeepak Gupta\
  \ 拥有美国伊利诺伊理工学院计算机取证与网络安全专业理学硕士学位，专攻语音互联网协议（VOIP）。本科期间，他先后获得 CCNA（Cisco 认证网络管理员）和\
  \ MCP（Microsoft 认证专业人员）认证。研究生阶段，他致力于计算机网络安全与取证研究，涉及多重引导计算机系统引导加载程序变更、MP3 隐写术等课题。他还在芝加哥著名的\
  \ VOIP 研究实验室 Bell Labs 参与并主导研究项目，深化了对 VOIP 技术的兴趣。他在 P2P 通信和 SIP 协议方面的研究论文荣获 2007\
  \ 年最佳学生 VOIP 项目奖。\n\n拥有 10 余年专业经验的 Deepak，在计算机安全与技术领域积累了跨多个行业的广泛经验。以优异成绩获得计算机科学硕士学位后，他加入位于北卡罗来纳州罗利市的金融软件公司\
  \ Sageworks，开发了核心银行平台的集中式集成流程，使客户能轻松移植和映射数据至中央银行数据库。\n\n作为产品远见者和软件企业家，Deepak 创立了一家网络代理机构和两家初创公司，致力于简化企业用户沟通。在此期间，他凭借对创新与创业的热情，创立了\
  \ LoginRadius——一个云身份与访问管理（cIAM）SaaS 平台，通过在多个接触点创建统一数字身份，帮助企业改善和优化客户体验。他至今担任联合创始人兼\
  \ CTO。在 LoginRadius，Deepak 利用其在安全与取证方面的专长，创新并改进云身份领域身份服务的交付与保障方式，并通过简化的 REST API\
  \ 帮助企业实现社交媒体集成。\n\n目前，LoginRadius 是中大型企业云基础 CIAM 解决方案的领先提供商，平台服务超过 3,000 家企业，月度触达全球\
  \ 8.5 亿用户。公司被 Gartner、Forrester、KuppingerCole 和 Computer Weekly 评为 cIAM 领域的行业领导者。\n\
  \nDeepak 还热衷于帮助企业改善和优化客户体验。他每天与客户深入探讨：用户如何与网站互动、如何简化客户体验（通过单点登录、一键登录等）、如何保障客户数据安全。他是\
  \ IEEE、ACM、OpenID 基金会、云安全联盟（CSA）等技术社区的活跃成员。目前研究方向为机器学习、人工智能和区块链技术。\n\n网站：`www.guptadeepak.com`、`www.loginradius.com`\n\
  \n***\n\n##### Mohammad Alauthman\n\nMohammad Alauthman 于 2016 年在英国诺森比亚大学获得博士学位。2002\
  \ 年获约旦哈希姆大学计算机科学学士学位，2004 年获约旦安曼阿拉伯大学计算机科学硕士学位。现任约旦扎尔卡大学计算机科学系助理教授兼高级讲师。主要研究领域：网络安全、计算机取证、高级机器学习和数据科学应用。\n\
  \n##### Mamdouh Alenezi\n\nMamdouh Alenezi 现任苏丹王子大学教育服务院长。2011 年和 2014 年分别在美国德保罗大学和北达科他州立大学获得硕士和博士学位。他在数据挖掘和机器学习方面拥有丰富经验，曾应用多种数据挖掘技术解决软件工程问题。他开展了多项研究，利用机器学习开发预测模型，以预测易出错类、理解源代码，并预测分配给新\
  \ Bug 的合适开发人员。\n\n##### Ammar Almomani\n\nAmmar Almomani 于 2013 年在马来西亚理科大学（USM）获得博士学位。在国际知名期刊和会议上发表\
  \ 60 余篇研究论文。现任约旦阿尔巴尔卡应用大学阿尔胡森大学学院信息技术系助理教授兼高级讲师。研究兴趣包括高级互联网安全与监控。\n\n##### Sadiq\
  \ Almuairfi\n\nSadiq Almuairfi 现任沙特阿拉伯利雅得苏丹王子大学安全工程实验室电子服务总监兼研究员。2014 年获澳大利亚墨尔本拉特罗布大学网络安全博士学位，2005\
  \ 年获沙特阿拉伯吉达阿卜杜拉齐兹国王大学信息管理硕士学位，2001 年获沙特阿拉伯达兰法赫德石油矿业大学（KFUPM）计算机工程学士学位。研究兴趣包括网络安全、网络安全、电子商务安全。\n\
  \n##### Ahmad Al-Qerem\n\nAhmad Al-Qerem 1997 年获约旦科技大学应用数学学位，2002 年获同校计算机科学硕士学位。随后受聘为扎尔卡大学全职讲师。现任约旦扎尔卡大学互联网技术系副教授兼系主任，同时也是\
  \ Princess Sumaya University for Technology (PSUT) 客座教授。他拥有英国拉夫堡大学博士学位。研究兴趣涵盖性能与分析建模、移动计算环境、协议工程、通信网络、IPv6\
  \ 过渡和事务处理。在计算机科学多个领域发表多篇论文。\n\n##### Kirti Raj Bhatele\n\nKirti Raj Bhatele 是边境安全部队运营的\
  \ RJIT BSF Academy Tekanpur 的助理教授。目前正在攻读计算机科学工程与信息技术领域博士学位。拥有 RGPV 大学信息技术 M.Tech\
  \ 和 B.E. 学位，以及印度博帕尔国家法律学院网络法研究生文凭。拥有 8 年以上教学经验，发表 20 篇研究论文和 8 个章节。\n\n##### Xin\
  \ Chen\n\nXin Chen 于 2018 年在奥克兰理工大学获得计算机科学硕士学位，研究兴趣包括深度学习和智能监控。\n\n##### Phuc Do\n\
  \nPhuc Do 现任越南 VNU-HCM 信息技术大学（UIT）副教授。研究兴趣包括数据挖掘、文本挖掘、信息网络分析、人工智能和机器学习、大数据分析与应用。\n\
  \n\n\n\n\n#### 作者简介\n\n##### Mohamed Amine Ferrag\nMohamed Amine Ferrag 分别于 2008\
  \ 年、2010 年和 2014 年在阿尔及利亚的 Badji Mokhtar–Annaba 大学获得计算机科学学士、硕士和博士学位。自 2014 年以来，他一直担任阿尔及利亚\
  \ Guelma 大学计算机科学系助理教授。他编辑了著作 *Security Solutions and Applied Cryptography in Smart\
  \ Grid Communications*（IGI Global 出版）。他的研究兴趣包括无线网络安全、网络编码安全和应用密码学。他目前在多个期刊担任编辑委员会成员，如\
  \ *International Journal of Information Security and Privacy*（IGI Global）、*International\
  \ Journal of Internet Technology and Secured Transactions*（Inderscience Publishers）和\
  \ *EAI Endorsed Transactions on Security and Safety*（EAI）。他在众多国际会议中担任组织委员会成员（担任过专题主席、联合主席、宣传主席、论文集编辑和网站主席）。\n\
  \n##### Reinaldo França\nReinaldo França 毕业于计算机工程专业。他目前是 UNICAMP 电气与计算机工程学院 (FEEC)\
  \ DECOM 的博士候选人，也是视觉通信实验室 (LCV) 的研究员。他在技术与科学研究领域有浓厚兴趣，并掌握 `C/C++`、`Python`、`Java`\
  \ 和 `.NET` 语言的编程与开发知识，研究方向涉及仿真、操作系统、无线与网络、广播、电信系统、数字信号处理、数字图像处理和深度学习。\n\n##### Rui\
  \ Hu\nRui Hu 是在 AUT 就读的硕士研究生。\n\n##### Alberto Huertas Celdrán\nAlberto Huertas\
  \ Celdrán 是爱尔兰研究委员会爱尔兰政府博士后研究员，隶属于 TSSG, WIT。Huertas Celdrán 在西班牙穆尔西亚大学获得计算机科学硕士和博士学位。他的科学兴趣包括医疗网络物理系统\
  \ (MCPS)、脑机接口 (BCI)、网络安全、数据隐私、持续认证、语义技术、感知上下文系统和计算机网络。\n\n##### Prerana Jain\nPrerana\
  \ Jain 是助教，正在 Rustmaji Institute of Technology Border Security Force Academy 攻读计算机科学工程学位。\n\
  \n##### Shivangi Jain\nShivangi Jain 毕业于 Rustamji Institute of Technology, BSF Academy\
  \ Tekanpur，该学院由边境安全部队运营。她参与过多个与网络安全和机器学习相关的项目，并代表学院参加过黑客马拉松等国家级竞赛。她撰写过多篇关于计算机编程和网络安全的文章和博客。\n\
  \n##### Avila Jayapalan\nAvila Jayapalan 于 1990 年在 V.M.K.V 工程学院获得电子与通信工程学士 (ECE)\
  \ 学位，在 Vellore Institute Of Technology 获得通信工程硕士 (M.Tech) 学位，并在 SASTRA Deemed University,\
  \ Thanjavur 获得博士学位。目前她在 SASTRA Deemed University, Thanjavur 的 ECE 系担任高级助理教授。她拥有\
  \ 15 年教学经验，在国内外期刊发表了 35 篇研究论文。她指导过许多本科生和研究生项目。她的研究领域包括无线通信和认知无线电。她在著作 *Cognitive\
  \ Radio in 4G/5G Wireless Communication Systems* 中发表过书籍章节。\n\n##### Manessa Jayaprakasam\n\
  Manessa Jayaprakasam 于 2011 年在 Anna University, Trichy 获得计算机科学与工程学士 (CSE) 学位。她拥有\
  \ 2 年以上 IT 经验。她目前担任 `Java` 应用开发和 `PHP` 的自由职业培训师。她的兴趣包括内容安全和多媒体应用。\n\n##### José\
  \ María Jorquera Valero\nJosé María Jorquera Valero 是穆尔西亚大学网络安全与网络防御研究实验室的博士生。Jorquera\
  \ Valero 在西班牙穆尔西亚大学获得计算机科学学士和硕士学位。他的科学兴趣包括计算机网络、机器学习、网络安全、数据隐私和持续认证。\n\n##### Abhishek\
  \ Kataria\nAbhishek Kataria 毕业于 Rustamji Institute of Technology, BSF Academy Tekanpur，该学院由边境安全部队运营。他参与过多个与网络安全和机器学习相关的项目，并代表学院参加过黑客马拉松等国家级竞赛。他撰写过多篇关于计算机编程和网络安全的文章和博客。\n\
  \n##### Vinash Kaur\nVinash Kaur - 研究领域：物联网，云计算。\n\n##### Gregorio Martinez Perez\n\
  Gregorio Martinez Perez - 西班牙穆尔西亚大学信息与通信工程系。他的学术活动主要致力于网络安全、隐私和网络。Prof. Martinez\
  \ Perez 在西班牙穆尔西亚大学获得计算机科学硕士和博士学位。他在国内外会议论文集、杂志和期刊上发表了 200 多篇论文。他已指导 10 名博士生，其中多人获得荣誉学位。\n\
  \n##### Ana Carolina Monteiro\nAna Carolina Monteiro 毕业于生物医学专业，拥有工程硕士学位，目前是 UNICAMP\
  \ 电气与计算机工程学院 (FEEC) DECOM 的博士候选人，也是视觉通信实验室 (LCV) 的研究员，从事与医学领域相关的数字图像处理研究。她在健康与临床分析方面具有亲和力和专业知识，擅长\
  \ `Matlab`、`C/C++` 开发，研究方向涉及血液学、医学信息学、细胞生物学、细胞病理学、电信、广播和深度学习。\n\n##### Shadi Nashwan\n\
  Shadi Nashwan 1978 年出生于约旦安曼。他分别于 2001 年在巴勒斯坦 Alazhar University 获得计算机科学学士学位，2003\
  \ 年在约旦 University of Jordan 获得计算机科学硕士学位，2009 年在英国 Anglia Ruskin University 获得计算机与网络安全博士学位。博士毕业后，他在约旦安曼\
  \ Al-Zaytoonah University 计算机科学系担任助理教授。2010 年，他加入沙特阿拉伯 Jouf University 计算机科学系担任助理教授，并于\
  \ 2018 年成为计算机与网络安全副教授。他是年度国际计算机与信息科学会议 (ICCIS) 的出版主席。Prof. Nashwan 的研究重点是网络安全、认证协议、移动性管理以及\
  \ NFC、RFID 和 WSN 等无线网络的安全。他在认证协议、恢复技术和移动性管理领域发表了多篇 ISI 和 SCOPUS 收录的论文。\n\n#####\
  \ Ser Minh Nguyen\nSer Minh Nguyen 在新西兰奥克兰大学获得计算机科学博士学位。他的研究兴趣包括机器视觉、深度学习和虚拟现实。\n\
  \n##### Pedro Miguel Sánchez\nPedro Miguel Sánchez 是西班牙穆尔西亚大学计算机科学博士生。Pedro Miguel\
  \ Sánchez 在西班牙穆尔西亚大学获得计算机科学硕士和学士学位。他的科学兴趣包括机器学习、网络安全、数据隐私、持续认证和计算机网络。\n\n##### Amany\
  \ Sarhan\nAmany Sarhan 于 1990 年在 Mansoura University 工程学院获得电子工程学士学位，1997 年获得计算机工程硕士学位。她通过\
  \ Tanta Univ., Egypt 和 Univ. of Connecticut, USA 的联合研究获得博士学位。她目前在 Tanta Univ., Egypt\
  \ 担任全职教授兼计算机与控制系主任。她的研究兴趣领域包括：分布式系统、软件重构、面向对象数据库、图像和视频处理、GPU 和分布式计算。\n\n\n\n\n\n\
  #### 作者简介\n\n##### Shatha Shakhatreh\n\nShatha Shakhatreh 是 Princess Sumaya University\
  \ for technology (PSUT) Network and Security Engineering 部门的实验室讲师，位于约旦安曼。她在 PSUT\
  \ 获得了 Information System Security and Digital Criminology 硕士学位。她拥有 Linux 系统管理的实践经验。她的研究兴趣包括威胁狩猎、恶意软件分析、隐私和数字取证。\n\
  \n##### Poonkuntran Shanmugam\n\nPoonkuntran Shanmugam 于 2003 年在印度 Tiruchirapalli\
  \ 的 Bharathidasan University 获得 Information Technology 学士学位，分别于 2005 年和 2011 年在印度\
  \ Tirunelveli 的 Manonmaniam Sundaranar University 获得 Computer and Information Technology\
  \ 硕士和博士学位。他目前在印度 Tamilnadu Madurai 的 Velammal College of Engineering and Technology\
  \ 担任教授，并执行来自 ISRO (India)、DRDO (New Delhi) 和 MNRE (New Delhi) 的三项资助研究项目。他拥有 15 年以上的教学和研究经验。他是\
  \ IACSIT (Singapore)、CSI (India) 和 ISTE (India) 的终身会员。他在图像处理、信息安全和软计算方面发表了 4 篇国家会议论文、43\
  \ 篇国际会议论文、1 篇国家期刊论文和 20 篇国际期刊论文。他撰写了 6 本书和 1 个计算机科学章节。他在 2016-17 年担任 CSI (India)\
  \ Region VII 的 State Level Student Coordinator。他获得了 2017-18 年度 Cognizant Best Faculty\
  \ Award。目前他正在从事水下自主航行器的计算机视觉和医疗信息系统的信息安全研究。他的研究兴趣领域包括数字图像处理、软计算、节能感知计算和计算机视觉。\n\n\
  ##### Wei Qi Yan\n\nWei Qi Yan 是 Auckland University of Technology (AUT) 的副教授，专长领域为数字安全、监控和取证，他领导\
  \ AUT 的 Computer and Communication Security (CCS) Research Group。Dr. Yan 曾担任 Royal\
  \ Society of New Zealand (RSNZ) 和 Chinese Academy of Sciences (CAS) 之间的交换计算机科学家，他是\
  \ ACM Multimedia Chapter of New Zealand 的主席，ACM 会员，IEEE 高级会员，以及 IEEE TC 成员。Dr. Yan\
  \ 是 State Key Laboratory of Information Security (SKLOIS) 中国的客座（兼职）教授，拥有博士生指导资格。他是新西兰\
  \ University of Auckland 和新加坡 National University of Singapore 计算机科学系的访问教授。\n\n"
