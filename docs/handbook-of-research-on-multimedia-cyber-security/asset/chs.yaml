  \ 毫秒（约 5 秒）。\n\n######## 结论与未来工作\n\n在大数据时代，旧的解决方案已不再适用。我们需要分发数据和处理。Apache Spark\
  \ 与 HDFS 的结合是分布式存储和处理的有效且廉价的解决方案。如今，我们拥有包含大量图像或视频片段的超大多媒体数据库。我们使用 `Image2vec` 和\
  \ `Video2vec` 将图像或视频片段转换为向量，以便于处理。`M-Tree` 是度量空间的索引方法。它有助于有效解决度量空间中的相似性搜索问题，即 kNN\
  \ 和 Range 查询。然而，`M-Tree` 无法索引大型向量空间，例如大型多媒体数据库中的向量，这些向量必须分布式地存储在多台计算机上。为了满足以嵌入向量形式存在的、包含数百万图像和视频片段的大型多媒体数据库的新需求，我们在\
  \ Apache Spark 框架上研究并成功实现了分布式 M-Tree 结构，称为 `DM-Tree`。我们还展示了关于 `DM-Tree` 结构的一些实验，以证明\
  \ `DM-Tree` 在搜索多媒体数据库方面的性能。未来，我们将继续研究以减小 `DM-Tree` 结构的规模，并降低主节点与工作节点之间的通信成本，从而在更大的多媒体数据库中更有效地搜索相似性。\n\
  \n为了拥有一个好的分布式算法，重要的是要注意本地处理算法必须优秀，且工作节点与主节点之间的通信成本必须很小。事实上，同时满足这两个要求并不简单。\n\n######\
