    you provide, the better the model performs. One of the most common pitfalls is
    training a model on limited or insufficient data. In trading, patterns emerge
    over time, and short-term data may not capture the full picture.


    Without a robust dataset that covers different market conditions (bullish, bearish,
    flat, volatile), your model might end up being biased toward the specific period
