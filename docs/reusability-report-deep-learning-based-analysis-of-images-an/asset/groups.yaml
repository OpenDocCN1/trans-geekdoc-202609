    | LSTM decoder (256)+ES | **0.000204** |

    | LSTM decoder (64)+ES | 0.000211 |

    | Mat2Spec (K=25) | 0.000223 |

    | Mat2Spec (K=150) | 0.000220 |


    粗体文本突出了性能最佳的情况。


    增材制造数据集包含含有两类缺陷（气体诱发和缺陷熔合孔隙）的合金光学图像。为突出实例分割的优势，使用 AtomAI 框架训练了两种分割模型：一种是三类模型，将像素分类为气体诱发、缺陷熔合或背景；另一种是二类模型，将像素分类为孔隙和背景。后者模型进一步使用我们的实例分割模块进行了扩展，以区分两种类型的孔隙。具体来说，二类模型的输出预测使用分水岭算法进行处理，以获取与各个缺陷实例相关的掩码。一旦识别出缺陷，就可以使用
    scikit-image 计算其形状特征，例如周长、面积、长轴长度和固度。这些缺陷特征不仅对于揭示结构–性能关系非常重要，还可用于对不同类型的缺陷进行分类。例如，气体诱发孔隙是球形的，而缺陷熔合孔隙具有不规则边界并在特定方向上呈长条形。因此，在这里，我们使用长轴长度、固度和等效直径（补充信息）的组合来定义一个函数，该函数可以区分孔隙缺陷是缺陷熔合还是气体诱发。


