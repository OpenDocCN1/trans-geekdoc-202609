    on handcrafted features, which can be time consuming, subjective and limited in
    their ability to handle complex image structures. Deep learning models, specifically
    convolutional neural networks (CNNs), can overcome these limitations by learning
    hierarchical features from the images and can effectively capture complex patterns
    and structures without the need for explicit feature engineering. Thus, several
    attempts have been made to develop robust autonomous (or semi-autonomous) frameworks
    that utilize CNNs to efficiently and accurately accomplish the image segmentation
    task. This allows high-throughput segmentation of thousands of microscopy images
    and enables development of structure-property relations12. AtomAI, developed at
    Oak Ridge National Laboratory5, is one such popular framework, which primarily
    deals with the analysis of microscopy images. Furthermore, it provides easy-to-use
    libraries to


