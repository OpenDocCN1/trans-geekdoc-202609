  - '[PAGE 2]


    For the additive manufacturing dataset, a similar strategy was adopted. The dataset
    consists of 12 images, of which 3 images were initially selected as the test set.
    For the remaining 9 images, 500 patches of size 256 × 256 were extracted from
    each image, after which augmentation was carried out to result in a total of 4,500
    images. This was further split in an 80:20 ratio to produce the training and validation
    sets, respectively. The initial 12 images were manually segmented into three classes,
    namely the background, the gas-induced porosity and the lack-of-fusion porosity.
    We note that two images had an additional scale bar, which was removed by replacing
    the associated pixel values with the average of the background class pixel value.
    A few example images from the different datasets are included in Fig. 1b.


    Several augmentation strategies, such as Poisson noise, Gaussian noise, blur,
    image rotation and flips, were utilized on the training data to improve the model
    generalization. In terms of model architecture, AtomAI utilizes a U-Net adjacent
    network with six convolution blocks, three upsampling blocks and skip connections
    for efficient model training and information preservation. Two versions of the
    model, with and without ES, were trained in each case. The model with the lowest
    log-loss error on the validation set was selected as the final model and was used
    to make predictions on the test set and other new unseen images.


    A few additional studies that go beyond the original publication of the AtomAI
    framework were also performed to gain important insights. For the BFO dataset,
    we focused on the robustness of the trained model against Poisson noise and image
    scaling, the key idea being that the trained model is most useful if it performs
    well on images of similar samples that have different levels of noise, contrast
    or are acquired at slightly varying magnification levels, scenarios that are commonly
    encountered during imaging. To evaluate the model performance for such conditions,
