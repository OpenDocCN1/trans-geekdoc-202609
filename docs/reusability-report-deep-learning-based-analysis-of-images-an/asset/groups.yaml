    除了手稿中包含的原始 AtomAI 框架外，用于提高纳米粒子数据集模型性能的另一项采用的策略是使用更好的分类阈值。U-Net 模型的最后一层预测每个像素属于某个类别的概率。例如，对于二分类问题，U-Net
    提供逐像素概率图，其中大于 0.5 阈值的值通常被选为属于纳米粒子类，否则属于背景类。然而，基于我们的实验，我们发现 AtomAI 的默认阈值 0.5 并非最优，通过优化精确率–召回率权衡可以提高模型性能。如表
    2 所示，从验证集确定的更优阈值可用于提升模型性能。在背景与粒子数据集对比度较低的情况下，观察到 CdSe 数据集的性能提升更高。我们还预期，θ 调谐在不平衡数据集的情况下能特别提升性能。应注意，θ
    是在 U-Net 模型训练完成后进行调谐的。因此，我们对 AtomAI 框架进行的另一项重要代码改进是加入一个模块，允许确定最优阈值。我们还使用 AtomAI
    框架优化了 U-Net 模型的层数和丢弃率；然而，这并未比使用最优阈值策略训练的模型带来性能提升。


    ![](img/e0465bddcc78c2598c1eecd3ff04825c_3_0.png)


    除了自动阈值选择和 ES 之外，我们还扩展了 AtomAI 的功能，以支持实例分割，并使用增材制造数据集展示其优势。实例分割不仅对图像中的每个像素进行分类（类似于语义分割），还将像素分组以识别不同的对象实例。为实例分割模型创建训练数据集所需的工作量可能非常大。因此，我们使用连通域和分水岭分割的概念，使我们能够将语义分割模型转换为实例分割模型。有关更多详细信息，请参阅补充信息。


