    U-Net 相邻网络，以实现高效的模型训练和信息保存。在每种情况下，都训练了带有和不带有 ES 的两个模型版本。在验证集上 log 损失最低的模型被选为最终模型，并用于对测试集及其他未见的新图像进行预测。


    还进行了一些超出 AtomAI 框架原始出版物的额外研究，以获得重要的洞察。对于 BFO 数据集，我们关注训练模型对泊松噪声和图像缩放的鲁棒性，其核心思想是：如果训练好的模型在具有不同噪声水平、对比度或以略有不同放大倍率采集的类似样本图像上表现良好，则最有用，这些场景在成像过程中很常见。为了评估模型在该类条件下的性能，我们向测试集中的图像添加了不同级别的泊松噪声，并将其按不同放大倍率（×1.1–2）进行缩放。同样，对于纳米粒子数据集，还研究了不同增广策略组合的影响，以及确定能提高模型性能的类别标注阈值。


    对于 Im2Spec 任务，使用了原始 AtomAI 工作中存在的扫描透射电子显微镜（STEM）图像和电子能量损失（EEL）谱数据。尝试了多种编码器–解码器架构，包括带有长短期记忆网络（LSTM）的循环神经网络，以及最近发表的
    Mat2Spec 的修改版本，后者使用监督对比学习的概念和高斯混合模型来表示概率特征嵌入。所有尝试过的架构均已包含在更新后的 AtomAI 库中。


