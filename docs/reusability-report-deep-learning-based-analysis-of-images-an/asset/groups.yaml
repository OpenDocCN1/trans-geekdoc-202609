    ## 可重用性报告：基于深度学习的图像与光谱数据分析，使用AtomAI


    Received: 8 November 2023

    Accepted: 19 November 2024

    Published online: 2 January 2025

    Check for updates


    Pragalbh Vashistha, Hitesh Gupta Kattamuri, Nikhil Thawari, Murugaiyan Amirthalingam
    & Rohit Batra


    机器学习（ML）技术在材料图像处理应用中越来越受到重视。在此背景下，Ziatdinov 等人开发了 AtomAI，一个用户友好且全面的 Python 库，旨在处理广泛的材料成像任务，包括图像分割、去噪、图像生成、图像到光谱映射（以及反之）以及图像分辨结构的后续原子建模。鉴于其广泛的适用性，本报告旨在复制作者原始工作的关键方面，将其功能扩展到新的材料数据集，并增强某些功能以提高模型性能。我们不仅成功复制了原始研究的部分内容，还针对不同图像处理任务中的多个数据集开发了改进的
    ML 模型。发现 AtomAI 库易于使用，并且可以扩展以用于自定义应用程序。我们相信 AtomAI 对显微镜和光谱社区具有重大潜力，进一步开发——例如半自动图像分割——可能会扩大其实用性和影响。


    深度学习技术在材料表征任务中越来越流行。无论表征工具的输出类型如何，无论是图像形式还是光谱，都可以使用深度学习技术进行学习，以加速数据获取和处理，从而实现高效的高通量实验和知识提取。在该领域中，图像分割以及图像到光谱（Im2Spec）或光谱到图像这两种学习任务尤为重要。图像语义分割是将图像划分为多个区域或段，并为每个段分配标签的任务。其目标是将图像中的每个像素分类到特定类别，从而有效生成像素级分割图。图像语义分割使材料科学中的许多关键应用成为可能，例如缺陷检测、微图分割、孔隙率定量和定量晶粒表征。同样，Im2Spec
    任务涉及将图像形式的结构特征映射到相关光谱：例如，将能量光谱数据映射到局部图像，或将滞后回线映射到压电力显微镜的相关地形图像。


    传统图像分割方法通常需要人工干预或依赖手工制作的特征，这可能既耗时又主观，且在处理复杂图像结构方面能力有限。深度学习模型，特别是卷积神经网络（CNN），可以通过从图像中学习层次特征来克服这些局限，并能有效捕捉复杂的模式和结构，而无需进行显式特征工程。因此，已有多次尝试开发稳健的自主（或半自主）框架，利用
    CNN 高效且准确地完成图像分割任务。这允许对数千张显微图像进行高通量分割，并促进结构-性能关系的发展12。AtomAI 是橡树岭国家实验室开发的此类流行框架之一，主要处理显微图像分析。此外，它提供易于使用的库，用于


    ![](img/e0465bddcc78c2598c1eecd3ff04825c_1_0.png)


    ![](img/e0465bddcc78c2598c1eecd3ff04825c_1_1.png)


    **图 1 | 开发图像分割模型的工作流程。a**，首先，从带有标签数据的母图像中裁剪出标准尺寸的较小图像。然后，该图像数据集进一步划分为训练、测试和验证集，或者使用单独的图像作为测试集。训练数据集中的图像采用多种策略进行增强，以便更好地进行模型泛化。

    **b**，本工作探索的不同数据集中的示例图像及其对应标签。STEM，扫描透射电子显微镜；HRTEM，高分辨透射电子显微镜。


    执行材料表征领域中的其他任务，例如 Im2Spec、使用变分自编码器进行降维、使用统计和基于图的方法分析数据集，以及深度集成训练以提高准确性。


    在本报告中，我们使用 AtomAI 框架成功复制了原始工作中包含的图像分割和 Im2Spec 任务，并在最近公布的纳米粒子数据集上训练了模型。得益于 AtomAI
    框架提供的灵活性，我们发现要实现与之前工作中报告的相当（甚至更好）的模型准确性非常简单。此外，我们将训练好的模型在不同噪声水平和未见图像放大倍率下进行基准测试，以估计这些模型在现实场景中的真实性能。同时，我们扩展了
    AtomAI 框架的功能，以执行实例分割任务。使用增材制造合金的数据集，我们展示了相对于语义分割使用实例分割的优势。我们还指出，本报告限于 AtomAI 提供的其他功能中的图像分割和
    Im2Spec 任务，因为我们认为这些是最通用的任务，具有广泛的适用性。


    我们还报告了 AtomAI 框架原始实现的局限性，并建议代码更新以改进这些局限性。例如，AtomAI 框架不允许使用早期停止（ES），这是一种常用于避免深度学习模型过拟合和泛化能力差的概念。我们通过实现带有多个可用用户输入选项的模块化
    ES 版本来更新 AtomAI 框架。同样，我们添加了一个模块，以便在模型训练期间选择最佳分类阈值。我们展示了带有 ES 和阈值选择的改进版 AtomAI
    始终能为不同数据集实现更好的准确性。


    AtomAI 的另一个局限性是，在数据增强过程中，并未考虑所有可能的图像方向和翻转，从而导致次优模型训练。我们还发现影响模型训练过程的代码中的小缺陷。例如，存在与使用库
    numpy.random.randint 相关的重复错误——虽然该库返回下限（包含）和上限（不包含）之间的随机整数，但 AtomAI 代码是按照整数等于上限也包含在内的角度编写的。已提供包含这些修复的更新版本。


    ## 数据集


    我们关注两个透射电子显微镜图像数据集和一个光学显微镜图像数据集。透射电子显微镜数据集包括 Sm掺杂 BiFeO3 (BFO) 体系和 Au 和 CdSe 纳米粒子系统4。前者数据集取自原始
    AtomAI 出版物，包含一张尺寸为 3,000 × 3,000（约 20,000 个单元）的标记图像。图像中的每个像素被标记为子晶格 A、子晶格 B 或背景，从而构成基准真值数据。第二个数据集包含
    Au 和 CdSe 纳米粒子的图像，分辨率分别为 4,096 × 4,096 和 1,024 × 1,024 像素。这些图像的基准真值是通过手动将图像中的每个像素标记为粒子（代表纳米粒子类）或背景（代表周围环境或空空间）获得的。


    光学显微镜数据集是使用各种合金（包括 Inconel 625 和 H13）的激光床粉末熔融获得的。为了生成这些图像，一个尺寸为 10 × 10 × 10 mm³
    的立方体通过增材制造制成，然后沿构建方向斜向切割并在光学显微镜下观察。获得了不同尺寸的图像，展示了增材制造过程中形成的不同类型的孔隙，例如气体诱导和未熔合。此外，图像可能还包含样品切割过程中产生的划痕痕迹。


    图 1a 捕捉了本工作中为分割任务采用的整体工作流程。对于 BFO 和 Au 及 CdSe 纳米粒子数据集，从原始图像中提取了较小图像的补丁——BFO 数据集包含
    5,000 个大小为 256 × 256 像素的补丁，CdSe 纳米粒子数据集包含 172 个大小为 512 × 512 像素的补丁。补丁的数量和大小基于先前的研究，并为进行比较分析保持一致。接下来，获得的数据集补丁图像被划分为训练集、验证集和测试集。BFO
    数据集使用 3:1:1 的训练-验证-测试比例，而对于 CdSe 数据集，129 张图像用于训练和验证，43 张用于测试，以符合原始研究。


    '
