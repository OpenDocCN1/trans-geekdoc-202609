    学习问题被简化为特征与标签的潜在嵌入对齐，这通过对比学习实现。在这项工作中，我们将原始 Mat2Spec 文献中的图材料编码器替换为基于 CNN 的编码器。尽管在该数据集上仅实现了可比性能，但我们认为
    Mat2Spec 架构对于此类其他问题可能很有用。


    ## 讨论


    我们发现 AtomAI 框架易于使用，且便于未来代码扩展。我们在四个不同的数据集上验证了其适用性：两个来自原始 AtomAI 工作，一个来自文献，另一个是原始增材制造数据集。尽管
    AtomAI 框架提供多种功能，但在此我们将重点限定于图像分割和 Im2Spec 两项主要任务。我们不仅实现了这些工作中报告的模型准确性，还通过扩展 AtomAI
    框架以包含 ES、分类阈值优化、实例分割及其他深度网络架构，进一步提升了模型性能。我们对 AtomAI 代码的扩展非常直接，无需对其基本结构进行重大修改。在原始代码中发现了几个小
    bug，并在我们的实现中将其修复。我们认为 AtomAI 框架将成为显微镜和光谱学社区非常有用的工具，尤其是帮助那些进行高通量实验或处理材料微结构优化的人员。


    ## 未来方向


    在使用 AI 进行自动微观结构图像分割领域，一个重大瓶颈是地面真实标签的可用性或生成。因此，通过集成有助于半自动数据生成的软件工具，AtomAI 框架的有效性可以显著提升。例如，最近，少数几项研究^10,11
    使用了预训练模型或低精度机器学习（ML）模型的初始版本，以获取图像的近似分割图。这些低保真分割图随后可由专家用户轻松快速地编辑，以创建更准确的地面真实数据，进而用于微调
    ML 模型。遵循这种迭代闭环方案，用户可以快速训练准确的 ML 模型，而无需花费太多时间生成准确的图像标签。在谷物分析领域的一次此类工作中，Gorynski
    等人^12 采用了两个版本的 Mask 区域卷积神经网络，一个用于生成地面真实标签，另一个用于推理任务。他们构建了一个用户友好的图形用户界面，用户可以在其中输入单个谷物周围的边界框。随后，预训练的
    Mask 区域卷积神经网络模型利用这些边界框数据生成像素级的谷物掩码，这些掩码又用于训练专门用于谷物检测的 Mask 区域卷积神经网络。由于边界框（仅两个点）的标注远快于精确对象（或谷物）轮廓的标注，作者能够生成大量训练数据，这使他们能够以更高的精度训练
    ML 模型，涉及谷物属性，如面积、周长、质心以及最小/最大 Feret 直径。


    在这方面，CVAT（计算机视觉标注工具）库^13 可能是将半自动分割任务与 AtomAI 框架集成的宝贵资源。CVAT 是一个免费、开源的数字图像标注工具，使用
    Python 和 JavaScript 编写。将 CVAT 集成到 AtomAI 可为用户提供图形界面，以便在 ML 预测效果不佳的区域快速执行标注任务，从而为需要改进的
    ML 模型的条件生成新的数据标签。


    ## 数据可用性


    数据可通过以下笔记本文件获取：EarlyStopping_LBFO_pv.ipynb (BFO)、EarlyStopping_HRTEM_pv.ipynb
    (纳米粒子)、Instance_Segmentation.ipynb (增材制造) 以及 LSTM_EarlyStopping_Im2Spec.ipynb
    和 Mat2Spec_ImSpec.ipynb (Im2Spec)，网址为 https://github.com/Pragalbh/atomai/tree/master/examples/notebooks（参考文献
    14）。


    ## 代码可用性


    代码可在 https://github.com/Pragalbh/atomai 获取（参考文献 14）。


