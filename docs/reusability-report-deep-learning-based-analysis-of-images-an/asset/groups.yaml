    tasks. Irrespective of the type of output from the characterization tool, whether
    in the form of images or a spectrum, it can be learned using deep learning techniques
    to accelerate data acquisition and processing, thereby allowing efficient high-throughput
    experimentation and knowledge extraction. Two types of learning task are particularly
    important in this domain, image segmentation and image to spectrum (Im2Spec) or
