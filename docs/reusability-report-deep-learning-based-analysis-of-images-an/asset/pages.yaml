  md: '# Reusability report: Deep learning-based analysis of images and spectroscopy
    data with AtomAI


    Received: 8 November 2023

    Accepted: 19 November 2024

    Published online: 2 January 2025

    Check for updates


    Pragalbh Vashistha , Hitesh Gupta Kattamuri , Nikhil Thawari, Murugaiyan Amirthalingam
    & Rohit Batra


    Machine learning (ML) techniques are gaining traction for materials image processing
    applications. In this context, Ziatdinov et al. developed AtomAI, a user-friendly
    and comprehensive Python library designed for a wide range of materials imaging
    tasks, including image segmentation, denoising, image generation, image-to-spectrum
    mapping (and vice versa) and subsequent atomistic modelling of image-resolved
    structures. Given its broad applicability, this report aims to reproduce key aspects
    of the authors’ original work, extend its capabilities to new materials datasets
    and enhance certain features to improve model performance. We have not only successfully
    replicated parts of the original study, but also developed improved ML models
    for multiple datasets across different image processing tasks. The AtomAI library
    was found to be easy to use and extensible for custom applications. We believe
    that AtomAI holds significant potential for the microscopy and spectroscopy communities,
    and further development—such as semi-automated image segmentation—could broaden
    its utility and impact.


    Deep learning techniques are becoming increasingly popular for materials characterization
    tasks. Irrespective of the type of output from the characterization tool, whether
    in the form of images or a spectrum, it can be learned using deep learning techniques
    to accelerate data acquisition and processing, thereby allowing efficient high-throughput
    experimentation and knowledge extraction. Two types of learning task are particularly
    important in this domain, image segmentation and image to spectrum (Im2Spec) or
    spectrum to image. Image semantic segmentation is a task that involves dividing
    an image into multiple regions or segments and assigning a label to each segment.
    The goal is to classify each pixel of the image into specific categories, effectively
    producing a pixel-wise segmentation map. Image semantic segmentation enables many
    crucial applications in materials science, such as defect detection, micrograph
    segmentation, porosity quantification and quantitative grain characterization.
    Similarly, the Im2Spec task involves mapping structural features in the form of
    images to the associated spectrum: for example, mapping energy spectrum data


    to the localized image, or mapping hysteresis loops to the associated topographic
    images from piezoelectric force microscopy.

    Traditional image segmentation methods often require manual intervention or rely
    on handcrafted features, which can be time consuming, subjective and limited in
    their ability to handle complex image structures. Deep learning models, specifically
    convolutional neural networks (CNNs), can overcome these limitations by learning
    hierarchical features from the images and can effectively capture complex patterns
    and structures without the need for explicit feature engineering. Thus, several
    attempts have been made to develop robust autonomous (or semi-autonomous) frameworks
    that utilize CNNs to efficiently and accurately accomplish the image segmentation
    task. This allows high-throughput segmentation of thousands of microscopy images
    and enables development of structure-property relations12. AtomAI, developed at
    Oak Ridge National Laboratory5, is one such popular framework, which primarily
    deals with the analysis of microscopy images. Furthermore, it provides easy-to-use
    libraries to'
