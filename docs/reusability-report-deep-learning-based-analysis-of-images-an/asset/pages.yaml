    carry out other tasks in the domain of materials characterization, such as Im2Spec,
    dimensionality reduction using variational autoencoders, analysis of datasets
    using statistical and graph-based methods, and deep ensemble training for improved
    accuracy.


    In this report, we use the AtomAI framework to successfully reproduce image segmentation
    and Im2Spec tasks included in the original work, as well as to train models on
    a recently published nanoparticle dataset. Due to the flexibility offered by the
    AtomAI framework, we find it quite simple to achieve model accuracy as good as
    (or even better than) that reported in the previous works. Furthermore, we benchmark
    the performance of the trained models against different levels of noise and magnification
    in the unseen images to estimate the genuine performance of these models in realistic
    situations. Additionally, we expand the capability of the AtomAI framework to
    perform the instance segmentation task. Using a dataset of additively manufactured
    alloys, we demonstrate the advantage of using instance segmentation over semantic
    segmentation. We also note that we limit this report to the image segmentation
    and the Im2Spec tasks among the other capabilities offered by AtomAI, as we believe
    these are the most general tasks, with wide applicability.


    We also report the limitations of the original implementation of the AtomAI framework
    and suggest code updates to improve them. For example, the AtomAI framework does
    not allow for early stopping (ES), a concept commonly used to avoid overfitting
    and poor generalizability in deep learning models. We update the AtomAI framework
    by implementing a modularized version of ES with several available user input
    options. Similarly, we add a module to allow selection of the optimal classification
    threshold during model training. We show that the improved version of AtomAI with
    ES and threshold selection consistently achieves better accuracy for different
    datasets.


    Another limitation of AtomAI is that during data augmentation not all possible
    image orientations and flips are accounted for, thereby resulting in subpar model
    training. We also found minor bugs in the code that impact the model training
    process. For instance, there are repeated errors associated with the use of the
    library numpy.random.randint— while this library returns random integers between
    the lower limit (inclusive) and the higher limit (exclusive), the AtomAI code
    is written


    with the perspective that the integers equal to the higher limit are included
    as well. The updated version with these fixes is made available.


    # Datasets


    We focus on two transmission electron microscope image datasets and one optical
    microscope image dataset. The transmission electron microscope datasets consist
    of the Sm-doped BiFeO3 (BFO) bulk system and the Au and CdSe nanoparticle systems4.
    The former dataset is taken from the original AtomAI publication and contains
    a single labelled image of dimension 3,000 × 3,000 (~20,000 unit cells). Each
    pixel in the image is labelled as either sublattice A, sublattice B or the background,
    thus forming the ground-truth data. The second dataset comprises images of Au
    and CdSe nanoparticles with resolutions of 4,096 × 4,096 and 1,024 × 1,024 pixels,
    respectively. The ground-truth values for these images were obtained by manually
    labelling each pixel in the image as either a particle (representing the nanoparticle
    class) or background (representing the surroundings or empty space).


    The optical microscopy dataset was procured using laser bed powder fusion of various
    alloys, including Inconel 625 and H13. To generate these images, a cube of dimensions
    10 × 10 × 10 mm3 is additively manufactured, and is then cut diagonally along
    the build direction and observed under an optical microscope. Images of different
    sizes are obtained and showcase porosities of different types, such as gas induced
    and lack of fusion, formed during the additive manufacturing process. Additionally,
    the images might also contain scratch marks produced during the sample-cutting
    process.


    Figure 1a captures the overall workflow adopted in this work for the segmentation
    task. For the BFO and the Au and CdSe nanoparticle datasets, patches of smaller
    images were extracted from the original image(s)—5,000 patches of size 256 × 256
    pixels for the BFO dataset and 172 patches of size 512 × 512 pixels for the CdSe
    nanoparticle dataset. The number and size of patches were based on previous works
    and were kept consistent for comparative analysis. Next, the obtained dataset
    patch images was divided into training, validation and test sets. A 3:1:1 train–validation–test
    ratio was used for the BFO dataset, while for the CdSe dataset 129 images were
    used for training and validation and 43 for testing, in accordance with the original
    works.'
