    In addition to automatic threshold selection and ES, we extended AtomAI''s capabilities
    to allow for instance segmentation and demonstrate its advantage using the additive
    manufacturing dataset. Instance segmentation not only classifies each pixel of
    the image (similar to semantic segmentation), but also groups pixels together
    to identify different instances of objects. The effort required to create a training
    dataset for an instance segmentation model can be huge. Thus, we use the concept
    of connected components and watershed segmentation that allows us to convert a
    semantic segmentation model into an instance segmentation model. See Supplementary
    Information for more details.


