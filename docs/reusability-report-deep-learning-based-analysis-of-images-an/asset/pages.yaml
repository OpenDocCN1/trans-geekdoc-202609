    While the AtomAI framework helped us quickly train models (w/o θ) with accuracy
    similar to that reported in the previous work, we were able to train models (with
    θ) with higher accuracy by tuning the classification threshold.


    various augmentation strategies, such as Gaussian noise, rotation, blur, and salt
    and pepper, did not result in the best-performing models. Instead, the model that
    was trained using just rotation and flips as the augmentation strategy showed
    the best performance for the CdSe dataset, while for the Au dataset Gaussian augmentation
    alongside rotation was found to be the best.


    Beyond the original AtomAI framework included in the manuscript, another strategy
    that was adopted to improve the performance of the models on the nanoparticle
    dataset was the use of a better classification threshold value. The last layer
    of the U-Net model predicts the probability of each pixel belonging to a certain
    class. For example, for a two-class problem, U-Net gives a pixel-wise probability
    map, wherein a value greater than a threshold of 0.5 is (generally) chosen to
    belong to the nanoparticle class and otherwise belongs to the background class.
    However, on the basis of our experiments, we find that AtomAI’s default threshold
    value of 0.5 is not optimal and model performance can be improved by optimizing
    the precision–recall trade-off. As seen in Table 2, more optimal threshold values,
    as determined from the validation set, could be used to improve the model performance.
    The performance boost in the case of the CdSe dataset was observed to be higher
    where the contrast between the background and the particle dataset was low. We
    also expect the θ tuning to particularly improve performance in the case of unbalanced
    datasets. It should be noted that θ is tuned after the U-Net model training is
    completed. Thus, another important code improvement that we performed to the AtomAI
    framework is the inclusion of a module that allows the determination of the optimal
    threshold value. We also used the AtomAI framework to optimize the number of layers
    in the U-Net model and the dropout rate; however, it did not result in performance
    improvement over the model trained using the optimal threshold strategy.'
