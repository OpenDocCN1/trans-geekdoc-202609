- pgno: 2
  md: 'For the additive manufacturing dataset, a similar strategy was adopted. The
    dataset consists of 12 images, of which 3 images were initially selected as the
    test set. For the remaining 9 images, 500 patches of size 256 × 256 were extracted
    from each image, after which augmentation was carried out to result in a total
    of 4,500 images. This was further split in an 80:20 ratio to produce the training
    and validation sets, respectively. The initial 12 images were manually segmented
    into three classes, namely the background, the gas-induced porosity and the lack-of-fusion
    porosity. We note that two images had an additional scale bar, which was removed
    by replacing the associated pixel values with the average of the background class
    pixel value. A few example images from the different datasets are included in
    Fig. 1b.


    Several augmentation strategies, such as Poisson noise, Gaussian noise, blur,
    image rotation and flips, were utilized on the training data to improve the model
    generalization. In terms of model architecture, AtomAI utilizes a U-Net adjacent
    network with six convolution blocks, three upsampling blocks and skip connections
    for efficient model training and information preservation. Two versions of the
    model, with and without ES, were trained in each case. The model with the lowest
    log-loss error on the validation set was selected as the final model and was used
    to make predictions on the test set and other new unseen images.


    A few additional studies that go beyond the original publication of the AtomAI
    framework were also performed to gain important insights. For the BFO dataset,
    we focused on the robustness of the trained model against Poisson noise and image
    scaling, the key idea being that the trained model is most useful if it performs
    well on images of similar samples that have different levels of noise, contrast
    or are acquired at slightly varying magnification levels, scenarios that are commonly
    encountered during imaging. To evaluate the model performance for such conditions,
    we add different levels of Poisson noise to the images in the test set and scale
    them at various magnifications (×1.1–2). Similarly, the effect of different combinations
    of augmentation strategies and determination of a threshold value for class labelling
    that improves the model performance was studied for the nanoparticle dataset.


    For the Im2Spec task, the scanning transmission electron microscopy (STEM) images
    and electron energy loss (EEL) spectrum data present in the original AtomAI work
    was utilized. Several encoder–decoder architectures were attempted, including
    recurrent neural networks with long short-term memory (LSTM) and a modified version
    of the recently published Mat2Spec, which uses the concept of supervised contrastive
    learning and the Gaussian mixture model to represent probabilistic feature embeddings.
    All the architectures attempted have been included in the updated AtomAI library.


    # Experiments and implementation


    Table 1 shows the comparative performance of different models built on the BFO
    dataset. We were able to match errors reported in the original work using the
    standard training code shared by the AtomAI authors. More importantly, we find
    that ES consistently results in models that have higher generalization and low
    prediction variance. Thus, substantial improvement in the AtomAI framework was
    achieved by implementing ES. The Poisson noise and zoom implementation within
    AtomAI were used to introduce these variations. It can be observed that the model
    error increases with increasing level of noise and zoom, highlighting the importance
    of creating a diverse dataset to train a robust model.


    Results on the nanoparticle datasets are summarized in Table 2. Two versions of
    the model were trained, one with the threshold value tuned within a range of 0.05–0.95
    on the validation set (with θ) and one that had a fixed threshold value of 0.5
    (w/o θ). Again, models trained in this work were as good as (and in some cases
    slightly better than) those reported in the past work. Owing to lower contrast
    in the images, the models trained on the CdSe dataset had lower accuracy, which
    is consistent with the past work. Interestingly, the simultaneous use of


