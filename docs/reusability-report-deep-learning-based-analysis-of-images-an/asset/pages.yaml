    The additive manufacturing dataset consists of optical images of alloys containing
    defects of two types: gas-induced and lack-of-fusion porosities. To highlight
    the advantage of instance segmentation, two types of segmentation model were trained
    using the AtomAI framework: a three-class model that classifies pixels into gas
    induced, lack of fusion or background, and a two-class model that classifies pixels
    into porosity and background. The latter model was further extended using our
    instance segmentation module to differentiate between the two types of porosity.
    Specifically, the output predictions from the two-class model are processed using
    the watershed algorithm to obtain masks associated with individual instances of
    defects. Once the defects are identified, their shape characteristics, such as
    perimeter, area, major axis length and solidity, can be computed using scikit-image.
    These defect characteristics not only are important from the point of view of
    unveiling structure–property relations, but also can be used to classify defects
    of different types. For instance, gas-induced porosities are spherical, while
    lack-of-fusion porosities have irregular boundaries and are elongated in a particular
    direction. Thus, here, we used a combination of major axis length, solidity and
    equivalent diameter (Supplementary Information) to define a function that can
    differentiate between porosity defects as lack of fusion or gas induced.


    two-class model with instance segmentation is able to better distinguish between
    the two different types of porosity. This is further quantified using the precision,
    recall and F1 scores for the two models presented in Extended Data Table 1. Clearly,
    the instance segmentation not only allows the base AtomAI to perform better, but
    also can be utilized to further analyse the types or distribution of defects (or
    objects) present in images, which is extremely helpful in the domain of metallurgical
    and materials science.


    Figure 2 compares the performances of the three-class model and the two-class
    model with instance segmentation against the manually labelled ground-truth data.
    It can be seen that both the two-class and three-class models are able to detect
