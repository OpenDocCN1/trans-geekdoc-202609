    # 使用学习算法预测肝疾病：比较研究


    Md. Fazle Rabbi*, S. M. Mahed Hasan*, Arifa Islam Champa*, Md. Asif Zaman*, Md.
    Kamrul Hasan*


    *伊斯兰技术大学计算机科学与工程系

    **拉杰沙希工程技术大学计算机科学与工程系，Rajshahi-6204, Bangladesh**

    *****孟加拉国国际科学技术大学计算机科学与工程系

    南大大学


    摘要—肝脏是人体的一关器官，其主要任务是消除代谢产生的废物、消化食物和能量物质。肝脏疾病会导致各种健康问题，为了降低这些致命疾病的风险，对患者进行治疗是必须的。肝疾病的诊断非常广泛，已有许多使用机器学习（ML）进行的研究。在本文中，我们比较了四种机器学习算法（逻辑回归、决策树、随机森林和
    SVM）来分类肝患者数据集（LPDP）。应用了基于皮尔逊相关系数的特征选择（PCS）来消除数据集中的无关特征。从 ROC、F-1 分、精确率和召回率对所有算法的性能进行了分析。我们的实验结果表明，融合
    SVM 提供了 92.19% 的最高准确率。其中，每年有 200 万死于肝疾病。早期诊断和适当治疗是解决这一问题的唯一途径。该疾病的诊断可能包括血液检查、CT
    扫描、MRI 和超声，以检查一个人是否受到。肝疾病的检测总是困难的，因为我们需要经验丰富的医生并花费大量时间。为了辅助实践，机器学习是一个重要的工具。它可以从医学数据集中提取有用信息并建立模型来识别患者。研究人员已经使用了机器学习和数据挖掘技术，但由于肝脏数据集结构复杂且具有非线性特征，预测疾病非常困难。它包含许多缺失值和异常值，这使得预测变得困难。


    关键词—肝疾病、分类、机器学习、皮尔逊相关系数


    ## I. 引言


    肝脏是人体最重要的器官，位于身体右侧。它在毒素代谢、蛋白质合成以及产生不同类型的碳水化合物、脂肪和化学物质以消化食物方面起着至关重要的作用。它是唯一只要至少保留
    25% 就能再生的器官。保持健康的肝脏对于生存至关重要。多种致命疾病如肝硬化、肝炎、脂肪肝病、肝癌、肝衰竭、贫血和脂肪变性等是导致由于过度饮酒引起的感染等肝疾病的许多原因。肝疾病的征象和症状包括黄疸、腹痛、瘙痒、食欲不振和疲劳。根据统计，约有
    5000 万人患肝疾病，约占总人口的 4.5%。


    本文中比较了多种方法，如逻辑回归（LR）、决策树（DT）、随机森林（RF）和极端树（ET）来预测肝疾病。以前已经在提高预测准确率。在预处理阶段，通过标签编码对类别值进行编码。我们利用了合成少数过采样技术（SMOTE）来消除数据不平衡。在删除冗余特征后，使用特征选择来缓解类别分布问题，并使用
    AdaBoost 分类器提高每个分类算法的性能。


    ## II. 文献综述


    近年来，已进行了对肝患者进行分类的研究。Ramana 等人 [6] 考虑了不同的数据集来预测肝患者。比较实验结果，装袋分类器（bagging classifier）被证明更好，准确率为
    69.3%。


    研究论文的其余部分设计如下：第二节介绍了预测肝疾病的相关工作。第三节详细介绍了数据集。第四节描述了我们的方法以及实验和结果。第五节为分析。最后，第六节总结了论文。


    Anagawa 等人 [7] 设计了一种名为互补朴素贝叶斯（CNB）的双重学习模型，其中使用噪声构建模型。它缩短了时间并显示出优于 K 最近邻（KNN）的性能，准确率为
    71.96%。


    Rahman 等人 [8] 设计了六种不同的分类方法使用逻辑回归（LR）、KNN、决策树（DT）、支持机（SVM）、NB 和随机森林（RF）预测肝疾病。他们的实验显示
    LR 达到了 75% 的准确率。


    Veena 等人 [9] 使用数据挖掘工具 R 在印度肝脏数据集上实现了不同的算法。使用 C5.0 算法，他们实现了 75.19% 的准确率。[10] 提出了一种分类肝患者的方法。使用皮尔逊相关系数进行特征选择。虽然实施了不同的分类器，如
    DT、NB、SVM 和人工神经网络（ANN），但 DT 达到了 81% 的最高准确率。


    Kuzillahi 等人 [11] 使用带有遗传算法的 XGBoost 分类器，并使用 LR、KNN、DT 和 RF 等分类器优于使用遗传算法（GA）和少数过采样技术（SMOTE）的数据分类。在检测并删除异常值后，分类提供了
    88% 的最高准确率。


    Ramesh 等人 [12] 使用了不同的数据集 ILPD。为了减少特征维度，他们利用了主成分分析（PCA），然后利用 NB、KNN、SVM、DT、RF 等分类方法。此外，他们对算法使用了增强（boosting）和装袋（bagging）。在这些，SVM
    上的自适应增强产生了 89.1% 的最高准确率。


