    Google Colab [15] 是一种免费的云服务，适用于所有人。为了在不过拟合的情况下有效评估机器学习算法的性能，使用了10 折交叉验证 [16]。我们按照
    80/20 的比例将数据集分为训练和测试 [17]。在本研究中，我们比较了四（4）种算法如 LR、DT、RF 和 ET 的性能。在不应用选择技术的情况下应用数据预处理，利用算法进行分类。LR、DT、RF
    和 ET 分别提供了 68.75%、84.86%、86.9% 和 90.76% 的准确率，如图 2 所示。AdaBoost 也显示了算法的性能。从图 3 可以观察到这些算法的整体性能得到了增强。准确率、ROC、F1-score、精确率和召回率在表
    III 中进行了比较。


    ![](img/286b6dc2299a3afb809c8e3e15fdc268_3_0.png)

    ![](img/286b6dc2299a3afb809c8e3e15fdc268_3_1.png)


    图 3. 所有所有方法的性能分析


    # 表 III 使用所有方法的性能


    | 评估 | 准确率 | ROC | F1 分数 | 精确率 | 召回率 |

    |---|---|---|---|---|---|

    | LR | 68.75 | 71.33 | 64.97 | 81.58 | 55.53 |

    | 机器学习 | 84.86 | 84.25 | 80.78 | 91.41 | 83.23 |

    | RF | 86.9 | 82.79 | 80.62 | 96.62 | 82.18 |

    | ET | 90.6 | 90.78 | 87.89 | 91.47 | 88.55 |

    | AdaBoost | 69.71 | 75.22 | 68.57 | 76.63 | 71.5 |

    | 分类器 | 81.53 | 83.71 | 80.68 | 94.69 | 91.5 |


    我们注意到不重要的特征会降低算法的预测性能。我们采用皮尔逊相关系数移除无关特征。通过对四（4）种用于预测患者的算法进行数据预处理，LR、DT、RF 和 ET
    分别提供了 70.07%、81.14%、83.38% 和 91.77% 的准确率，如图 2 所示。AdaBoost 算法显示了 70.68%、87.26%
    和 92.19% 的准确率，如图 5 所示。准确率、ROC、F1-score 和召回率值在表 IV 中进行了比较。


    # 表 IV 使用 PCC-FS 的性能


    | 评估 | 准确率 | ROC | F1 分数 | 精确率 | 召回率 |

    |---|---|---|---|---|---|

    | LR | 70.03 | 73.87 | 65.89 | 83.89 | 91.57 |

    | 机器学习 | 87.14 | 84.61 | 88.35 | 91.58 | 87.34 |

    | RF | 87.38 | 87.97 | 81.32 | 86.38 | 91.7 |

    | ET | 91.7 | 90.87 | 88.55 | 92.18 | 90.54 |

    | AdaBoost 分类器 | 70.68 | 74.38 | 66.52 | 83.34 | 82.76 |

    | | | 87.65 | 81.51 | 95.64 | 92.19 97.14 93.37 |


    为了证明我们的工作，表 V 与之前的研究进行了比较。该表证实我们获得了比提到文献更高的准确率。


    # 表 V 与早期研究的准确率比较


    | 作者 (年份) | 方法 | 准确率 |

    |---|---|---|

    | Ramana (2019) [6] | Bagging | 69.3% |

    | Anagaw (2019) [7] | CNB | 71.36% |

    | Rahman (2019) [8] | LR | 75% |

    | Veena (2019) [9] | C5.0 Boosting | 75.19% |

    | Auxilia (2018) [10] | PCC+DT | |

    | Kuzhillareth (2020) [11] | GA-RF | 88% |

    | Ramesh (2019) [12] | PCA+SVM | 89.1% |

    | 我们的模型 | PCC+Adaptive (ET) | 92.19% |


    更好，为了达到预期结果，我们在 LR、RF 和 ET 算法上应用了自适应提升（AdaBoost）。带有 PCC-FS 的 AdaBoost 提高了这些算法的整体性能，因为自适应方法的估计准确率为
    92.1%。通过对比分析，我们可以说，这将有助于医疗从业人员对患者诊断做出有效决策。在未来，我们将使用深度学习和结合各种特征选择技术来分类患者。


