    # Prediction of Liver Disorders using Learning Algorithms: A Comparative Study


    Md. Fazle Rabbi*, S. M. Mahed Hasan*, Arifa Islam Champa*, Md. Asif Zaman*, Md.
    Kamrul Hasan*


    *Department of Computer Science & Engineering, Islamic University of Technology

    **Department of Computer Science & Engineering, Rajshahi University of Engineering
    & Technology, Rajshahi-6204, Bangladesh**

    *****Department of Computer Science & Engineering, Bangladesh International University
    of Science and Technology

    North South University


    Abstract— Liver, a crucial organ of the human body whose principal tasks are to
    eliminate waste produced by our metabolism, digest food, and energy materials.
    Liver disorder can cause various health problems, and treating the patients are
    compulsory to reduce the risk of these lethal disorders. The diagnosis of liver
    disorder is extensive and numerous researches have been performed using machine
    learning (ML). In this paper, we have compared four ML algorithms (Logistic Regression,
    Decision Tree, Random Forest, and SVM) to classify Liver Patient Dataset (LPDP).
    Pearson Correlation Coefficient based feature selection (PCS) is applied to eliminate
    irrelevant features from the dataset. The performance of all the algorithms is
    analyzed in terms of ROC, F-1 score, precision, and recall. Our experimental results
    show that having fusion on SVM provides the highest accuracy of 92.19%. Among
    them, 2 million people are dying due to liver disorders per year. Early diagnosis
    and proper treatments are the only solutions to get rid of this problem. The diagnosis
    of this disease may include blood tests, CT scans, MRI, ultrasounds to check whether
    a person is affected or not. The detection of liver disorders is always arduous,
    as it requires experienced physicians and takes a lot of time. To assist practice,
    machine learning is an important tool. It can extract valuable information from
    medical datasets and build a model to identify patients. Researchers have done
    using machine learning and data mining techniques but liver disorder prediction
    is difficult due to complex structure and non-linear characteristics of liver
    datasets. It contains a lot of missing values and outliers that make prediction
    difficult.


    Keywords—Liver Disease, Classification, Machine Learning, Pearson Correlation
    Coefficient


    ## I. INTRODUCTION


    The liver is the most important organ of our human body, which is on the right
    side of its body. It plays a vital role in the metabolism of toxins, synthesis
    of proteins, and produces different types of carbohydrates, fats, and chemicals
    to digest food. It is the only organ that can regenerate if at least 25% of the
    liver remains. Keeping healthy liver is very important for survival. Several fatal
    diseases such as cirrhosis, hepatitis, fatty liver disease, liver cancer, liver
    failure, anemia, and steatosis, etc., are many reasons for causing liver disorders
    such as infection due to excessive use of alcohol. The signs and symptoms of liver
    disease include jaundice, abdominal pain, itching, loss of appetite, and fatigue.
    According to stats, around 50 million people suffer from liver disorders, which
    are approximately 4.5% of general population.


    In this paper, we compared several methods such as Logistic Regression (LR), Decision
    Tree (DT), Random Forest (RF), and Extra Trees (ET) for the prediction of liver
    disorder. Previous researches have taken into improve prediction accuracy. At
    the preprocessing stage, categorical values are encoded through label encoding.
    We have utilized Synthetic Minority Over-sampling Technique (SMOTE) to remove
    imbalance in data. After the removal of redundant features, feature selection
    is used to mitigate the class distribution problem, and AdaBoost classifier is
    used to increase the performance of each classification algorithm.


    ## II. LITERATURE REVIEW


    Over the recent years, researches have been performed to classify liver patients.
    Ramana et al. [6] considered different datasets to predict liver patients. Comparing
    the experimental results, the bagging classifier proved to be better with an accuracy
    of 69.3%.


    The remaining part of the research paper is designed as follows: Section II presents
    related works for predicting liver disorder. Section III presents a detailed description
    of the dataset. Section IV describes our methodology with experiments and results.
    V Analysis. Finally, VI concludes the paper.


    Anagawa et al. [7] designed a double learning model named Complement Naive Bayesian
    (CNB), where noise were used to construct the model. It reduced time and showed
    better performance than K-Nearest Neighbors (KNN) with an accuracy of 71.96%.


    Rahman et al. [8] designed six different classification methods to predict liver
    diseases using Logistic Regression (LR), KNN, Decision Tree (DT), Support Machines
    (SVM), NB, and Random Forest (RF). Their experiment showed that LR achieved the
    accuracy of 75%.


    Veena et al. [9] implemented different algorithms on Indian Liver Dataset using
    R, a data mining tool. Using C5.0 algorithm, they achieved accuracy of 75.19%.
    [10] proposed a method to classify liver patients. Pearson Correlation was used
    for selecting features. While, different classifiers were implemented, such as
    DT, NB, SVM, and Artificial Neural Network (ANN), the DT achieved the highest
    accuracy of 81%.


    Kuzillahi et al. [11] used XGBoost classifier with genetic algorithm, and with
    other classifiers as LR, KNN, DT and RF outperformed the data classification using
    Genetic Algorithm (GA) and Minority Over-sampling Technique (SMOTE). After detecting
    and removing outliers, the classifications provided the highest accuracy of 88%.


    Ramesh et al. [12] used different datasets, using ILPD. To reduce dimension of
    the features, they utilized Principal Component Analysis (PCA) and then utilized
    classification methods such as NB, KNN, SVM, DT, RF. Moreover, they used boosting
    and bagging on algorithms. Among these, adaptive boosting on the SVM produced
    the highest accuracy of 89.1%.


