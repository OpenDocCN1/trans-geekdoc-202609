    为了评估多个机器学习模型的性能，我们采用了 K 折交叉验证将数据集划分为 k 个子集。在每一步中，使用 k-1 个样本进行训练，剩余的一个子集用于验证性能。最终结果通过重复此过程并汇总测试子集的结果获得。在本文中我们使用
    10 折交叉验证进行评估。分类准确率是机器学习的标准评估指标。我们还使用了不同的统计度量，如 F-Score、精确率（Precision）、召回率（Recall）和整体分类器来评估性能。混淆矩阵总结了机器学习模型的性能。使用混淆矩阵可以获得准确率、F-Score、召回率和精确率：


