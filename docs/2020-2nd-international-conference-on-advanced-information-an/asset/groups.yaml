    Abstract— Liver, a crucial organ of the human body whose principal tasks are to
    eliminate waste produced by our metabolism, food digest and energy materials.
    Liver disorder can cause various health problems and treating the patients are
    compulsory to reduce the risk of these lethal disorders. The diagnosis of liver
    disorder is extensive and numerous researches have been performed using machine
    learning (ML). In this paper, we have compared four ML algorithms (Logistic Regression,
    Decision Tree, Random Forest, and SVM) to classify Liver Patient Dataset (LPDP).
    Pearson Correlation Coefficient based feature selection (PCS) is applied to eliminate
    irrelevant features from the dataset. The performance of all the algorithms is
    analyzed in terms of ROC, F-1 score, precision, and recall. Our experimental results
    show that having fusion on SVM provides the highest accuracy of 92.19%.


