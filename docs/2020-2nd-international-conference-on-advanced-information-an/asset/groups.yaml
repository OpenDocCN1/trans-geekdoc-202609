    ## 3 过采样


    过采样是指对少数类进行随机复制。正如我们所见的，HLP 数据集包含 67 个负样本和 416 个正样本。它可能面临类别分布不平衡的问题，这可能导致多数类偏向预测。为了解决这个问题，使用了随机过采样器（Random
    OverSampler）来增加少数类样本。


    ## 4 特征缩放


    特征缩放将特征值归一化到指定的范围内。它是构建机器学习模型最重要的步骤之一。它缩短了训练时间，并有助于许多机器学习和神经网络算法实现收敛。如果数据集包含许多异常值，使用均值和标准差的效果可能会不同。我们使用
    Z-score 异常值技术，通过鲁棒缩放（Robust Scaling）检测并处理异常值。使用四分位范围（Interquartile Range）的鲁棒缩放来处理异常值并缩放数据。


    ## B. 分类


    ### 1 逻辑回归 (LR)


    逻辑回归（LR）是一种基于概率概念的预测性机器学习算法。旨在解决类别为 0 或 1 的二分类问题。它使用逻辑函数将输出压缩在 0 和 1 之间。预测概率 (P)
    为：


    ```

    $P = \frac{1}{1+e^{-(w_0+w_1x_1+w_2x_2-...-w_nx_n)}}$ (2)

    ```


    ### 2 决策树 (DT)


    决策树用于树结构解决分类和回归问题。树根指的是数据集属性的最佳特征、信息增益或吉尼指数。每个叶节点指的是属性、类别或因变量。该算法可以处理分类数据和数值数据。


    ### 3 随机森林 (RF)


    随机森林（RF）是一种集成机器学习方法，可应用于回归和分类问题 [14]。它构建了多棵决策树以获得良好且准确的预测。RF 通过使用训练样本解决了 DT 的过拟合问题。DT
    通常从样本中挑选最佳特征，这种方法会导致过拟合。但随机森林可以轻松地解决过拟合问题。


    ### 4 极端树 (Extra Trees)


    极端树或随机森林是与 RF 相似的集成机器学习算法。但 ET 和 RF 之间有两个根本区别。一个是样本不放回抽样，另一个是不是选择最佳特征，而是选择随机特征。在分割树节点后，通过对分类中的所有树情况取平均或通过聚合投票情况来构建树。


    ### 5 AdaBoost


    自适应提升（Adaptive boosting）是一种集成学习算法，通过改进弱分类器的弱点来构建更强的分类器。它通过为每个算法设置权重，并在训练阶段的每次迭代中确保预测正确，来减少偏差和方差并提高性能。弱分类器的组合可以表示为：


    ```

    $f(x) = \sum_{t=1}^{T} \alpha_t h_t(x)$ (3)

    ```


    其中 h(x) 是弱分类器。最终（强）分类器的结果是 H(x)=sign(f(x))。


