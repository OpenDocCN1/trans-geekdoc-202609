  md: 'have a higher statistical value with the class selected for the next step of
    classification. In this research, the Correlation Coefficients are used to select
    the most important features. Pearson Correlation ranging from -1 to 1 specifies
    the relationship between two variables, which is denoted as Pearson Correlation
    Coefficient (P). A value near 1 means a stronger positive correlation, and -1
    indicates a negative correlation. A value near 0 means a weak correlation between
    the variables. Pearson Correlation Coefficient for a pair (X, Y) of random variables
    is formulated as:


    ```

    $$\rho(X,Y) = \frac{cov(X,Y)}{\sigma_X\sigma_Y}$ (1)

    ```


    Where CO(X,Y) denotes the covariance and $\sigma_X$, $\sigma_Y$ are the standard
    deviation of X and Y.


    # 3 Oversampling


    Oversampling refers to the random duplication of minority classes. As we have,
    the HLP dataset has 67 negative samples and 416 positive samples. It may suffer
    from imbalance class distribution which may cause the majority class to bias the
    prediction. To overcome this problem, Random OverSampler is used to increase the
    minority class samples.


    # 4 Feature Scaling


    Feature scaling normalizes the features values in a specified range. It is one
    of the most vital steps for building a machine learning model. It reduces the
    training time and helps achieve convergence for many machine learning and neural
    network algorithms. Using mean and standard deviation may vary if a dataset contains
    many outliers. We use the Z-score outlier technique to detect and handle outliers
    using Robust Scaling. Robust Scaling using the Interquartile Range to handle the
    outliers as well as the scale data.


    # B. Classification


    # 1 Logistic Regression (LR)


    Logistic Regression (LR), a predictive analysis machine learning algorithm, is
    based on the notion of probability. It is planned to classify-class (binary) problems
    where the class is either 0 or 1. It uses the Logistic function to compress the
    output between 0 and 1. The predicted probability (P) is:


    ```

    $P = \frac{1}{1+e^{-(w_0+w_1x_1+w_2x_2-...-w_nx_n)}}$ (2)

    ```


    # 2 Decision Tree (DT)


    Decision Tree uses to solve classification and regression types in the structure
    of a tree. The root of the tree refers to the best feature of the dataset attributes,
    information gain, or Gini index. Each leaf node refers to the attribute or class
    or dependent variable. Both categorical and numerical data can be handled by this
    algorithm.


    # 3Random Forest (RF)


    Random Forest (RF), an ensemble Machine Learning method, can be applied for both
    regression and classification problems [14]. It constructs several decision trees
    to get a well-built and precise prediction. RF handles the overfitting problems
    of DT by using training samples. DT usually picks the best features from the samples,
    which is an approach that leads to overfitting. But RFs can easily solve the overfitting
    problem.


    # 4 Extra Trees


    Extra Trees or Randomized Forest is an ensemble machine learning algorithm like
    RF. But there are two fundamental differences between ET and RF. One is samples
    without replacement, and the other is instead of picking the best features, random
    features. After splitting the tree nodes, trees are constructed by averaging all
    the tree cases in classification or by aggregating votes cases in classification.


    # 5 AdaBoost


    Adaptive boosting is an ensemble learning algorithm that constructs a stronger
    classifier by amending the weaknesses of weak classifiers. It reduces bias and
    variance and improves performance by setting weights to each algorithm and ensuring
    correct prediction in each iteration during the training phase. The combination
    of weak classifier can be expressed as:


    ```

    $f(x) = \sum_{t=1}^{T} \alpha_t h_t(x)$ (3)

    ```


    Where h(x) is weak classifier. The result of the final (strong) classifier is
    H(x)=sign(f(x)).


    # C Evaluation Metrics


    To assess the performance of multiple ML models, we adopted K-fold-validation
    to partition the dataset into k subsets. At each step, k-1 samples are used for
    training, and the remaining one subset is used to validate the performance. The
    final result is obtained by repeating this process and aggregating the results
    of the test subset. In this paper we used 10-fold cross-validation for assessment.
    Classification accuracy is a standard evaluation metric for machine learning.
    We also used different statistical measures such as F-Score, Precision, Recall,
    and Overall Classifier to evaluate the performance. Confusion Matrix summarizes
    the performance of machine learning models. Using the confusion matrix, accuracy,
    F-Score, recall, and precision can be obtained as:


    # TABLE II. CONFUSION MATRIX


    | | Predicted Positive | Predicted Negative |

    |---|---|---|n| Positive | True Positive (TP) | False Negative (FN) |'
