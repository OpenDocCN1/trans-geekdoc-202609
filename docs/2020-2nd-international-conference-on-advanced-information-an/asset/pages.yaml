  md: '# # Prediction of Liver Disorders using Learning Algorithms: A Comparative
    Study


    Md. Fazle Rabbi*, S. M. Mahed Hasan*, Arifa Islam Champa*, Md. Asif Zaman*, Md.
    Kamrul Hasan*


    *Department of Computer Science & Engineering, Islamic University of Technology

    **Department of Computer Science & Engineering, Rajshahi University of Engineering
    & Technology, Rajshahi-6204, Bangladesh**

    *****Department of Computer Science & Engineering, Bangladesh International University
    of Science and Technology

    North South University


    Abstract— Liver, a crucial organ of the human body whose principal tasks are to
    eliminate waste produced by our metabolism, food digest and energy materials.
    Liver disorder can cause various health problems and treating the patients are
    compulsory to reduce the risk of these lethal disorders. The diagnosis of liver
    disorder is extensive and numerous researches have been performed using machine
    learning (ML). In this paper, we have compared four ML algorithms (Logistic Regression,
    Decision Tree, Random Forest, and SVM) to classify Liver Patient Dataset (LPDP).
    Pearson Correlation Coefficient based feature selection (PCS) is applied to eliminate
    irrelevant features from the dataset. The performance of all the algorithms is
    analyzed in terms of ROC, F-1 score, precision, and recall. Our experimental results
    show that having fusion on SVM provides the highest accuracy of 92.19%.


    populations [4]. Among them, 2 million people are dying due to liver disorders
    per year worldwide [5]. Early diagnosis and proper treatments are the only solutions
    to get rid of this problem. The diagnosis of this disease may include blood tests,
    CT scans, MRI, ultrasounds to check the damage or tumors. After these, doctors
    and practitioners decide whether a person is affected or not. The detection of
    liver disorders is always arduous, as it requires experienced physicians and takes
    a lot of time. To assist practitioner’s practice, machine learning is an important
    tool. It can extract valuable information from medical datasets and build a model
    to identify the patients. Researchers have been done using machine learning and
    data mining techniques but liver disorder prediction is difficult due to the complex
    structure and non-linear characteristics of liver datasets. It contains a lot
    of missing values and outliers that make the prediction difficult.


    Keywords—Liver Disease, Classification, Machine Learning, Pearson Correlation
    Coefficient, Algorithm


    # ## I. INTRODUCTION


    The liver is the most important organ of our human body, which looks like a football
    and positions into the right-side of its body. It plays a vital role in the metabolism
    of toxins, synthesis of proteins, blood production, and produces different types
    of carbohydrates, fats, and chemicals to digest out food [1]. It is the only organ
    of vertebrates that can regenerate if at least 25% of the liver remains. it takes
    8 to 15 days to complete the regeneration process without any loss of functionality!
    As functionality, the liver is one of the most parts of the body. So, keeping
    healthy liver is very important for survival. Several fatal diseases such as cirrhosis,
    hepatitis, fibrosis, fatty liver disease, liver cancer, liver failure, gibber
    syndrome, anemia, and hechromatosis, etc. There are many reasons for causing liver
    disorders such as infection [1] hepatitis due to excessive use of alcohol [4]
    biliary hepatitis [5] type 2 diabetes [6] through shared needles to inject drugs
    and blood tools [7]. The signs and symptoms of liver disease include jaundice,
    abdominal pain, itching skin, loss of appetite, and fatigue. [3]. According to
    stats, around 50 million people suffer from liver disorders, which are approximately
    4.5% to 9% of general


    In this paper, we compared several ML methods, such as Logistic Regression (LR),
    Decision Tree (DT), Random Forest (RF), and Extra Trees (ET) for the prediction
    of liver disorder. Previous researches have taken into to improve the prediction
    accuracy. At the preprocessing stage, categorical values are encoded through label
    encoding. We have utilized Synthetic Minority Over-sampling Technique (SMOTE)
    to remove the imbalance in data. After the removal of redundant features, oversampling
    is used to mitigate the imbalance class distribution problem, and feature selection
    is used to handle the outliers. After the AdaBoost classifier is used to increase
    the performance of each classification algorithm.


    # ## II. LITERATURE REVIEW


    Over the recent years, researches have been performed to classify liver patients.
    Ramana et al. [6] considered different datasets to predict liver patients. Comparing
    the experimental results, the bagging classifier proved to be better classifiers
    with an accuracy of 69.3%.


    The remaining part of the research paper is designed as follows: Section II presents
    related works in the for predicting liver disorder. Section III presents a detailed
    description of the dataset. Section IV describes our methodology with experiments
    and results. V Analysis. Finally, VI concludes the paper.'
