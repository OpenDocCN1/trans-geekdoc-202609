    # A. Preprocessing


    Data preprocessing is an essential part of classification to

    improve the prediction accuracy. By any

    prediction algorithm might reduce the quality of the data.

    if the dataset contains noisy values, outliers,

    then the overall performance, accuracy

    might lower. Our research is to increase the

    prediction accuracy for classifying liver patients. In

    this research, preprocessing of data includes

    categorical feature values, removal of irrelevant features

    handling of outliers, and oversampling. The Flow of

    our work is shown in Fig: 1.


