    dependencies. This means that additional modules were downloaded to satisfy the
    requirements of other modules. Actually, the zerolog package has its own go.mod
    file with its dependencies to be satisfied.


    ```

    github.com/juanmanuel-tirado/SaveTheWorldWithGo/11_modules/modules/example_01

    ```


