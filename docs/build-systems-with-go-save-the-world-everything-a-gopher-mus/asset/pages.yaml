  md: '# CHAPTER 6

    CONCURRENCY


    The title of this Chapter may sound intimidating. Concurrency is a tough topic
    in computer science that causes developer headaches. Fortunately, Go was designed
    with simplicity in mind. It facilitates the creation of concurrent programs, inter-thread
    communication, and other topics that in other languages require deep tech knowledge.
    At the end of this Chapter you will understand concepts as goroutines, channels,
