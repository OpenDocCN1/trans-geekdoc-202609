  md: '# CHAPTER 18

    RELATIONAL DATABASES


    Databases are basic components for any data-driven system and the Structured Query
    Language (SQL) is the most common and accepted language for relational databases.
    Widely adopted solutions such as MySQL, PostgreSQL, Apache Hive, etc. use SQL
    to create, retrieve and manage relational data. Go offers an elegant and easy-to-use
    interface for SQL databases with a large variety of database drivers from different
    projects. This Chapter assumes the reader to have basic notions of relational
    databases (tables, entities, relationships, transactions, etc.). The purpose of
    this Chapter is not to cover all the topics of relational databases because that
    would require an entire book. This Chapter aims at offering the reader to understand
    how relational databases can be used in any Go project. With this purpose in mind,
    this Chapter explores how the Go standard library defines an interface for SQL
    databases and introduces GORM an object-relational mapping solution.


    # 18.1 SQL IN GO


    The package database/sql³ defines a common interface for SQL databases. However,
    it does not implement any particular database driver. Specific drivers are expected
    to be imported from third-party projects maintaining the same interface for all
    of them. This permits to use the same code independently of the underlying database.
    There can be differences depending on the employed database, although a large
    portion of the code can be reused.


    # 18.1.1 Database and connections


    The database/sql package is built around the DB type⁵⁴. A DB instance can be obtained
    opening a database connection with the sql.Open or sql.OpenDB functions. A DB
    instance basically handles a pool of database connections.


    Example 18.1 shows how to connect with a SQLite database⁵⁵. First, we need to
    import a valid SQL driver for the target database. There is a large number of
    available drivers for many databases listed in the documentation⁶. In our examples,
    we use a driver for SQLite⁷ if not stated otherwise to skip the installation of
    additional databases. Remember that SQLite can connect with the local file system
    and does not require any database server. In any case, these examples can be applied
    to other databases requiring minor changes in some scenarios.


    Observe that we only import the side effects of the package (line 8) defining
    the driver. By doing this, we register the driver and make it available for the
    standard library⁸. The Open "sqlite3" and the file path of the database. For most
    cases, the data source is the database hostname with the username and database
    name. Check the documentation of your driver to be sure you use the correct data
    source definition.


    Example 18.1: Database connection.'
