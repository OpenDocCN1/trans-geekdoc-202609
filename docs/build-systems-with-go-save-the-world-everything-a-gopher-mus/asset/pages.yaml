  md: "# CHAPTER 1\nFIRST STEPS WITH GO\n\nThis chapter will show you how to write,\
    \ compile and execute your program in Go. For this, you need a working Go\ninstallation.\
    \ Follow the steps for your platform described in the official documentation¹.\
    \ Next, take any plain text editor of your choice: Notepad, Nano, Vim. You will\
    \ need one of them to write down the code. If you prefer to use more sophisticated\
    \ tools\ns as GoLand, Atom or Visual Studio Code the following examples still\
    \ apply. However, I recommend you follow the current\nexplanation if this is your\
    \ first time with Go.\n\n# 1.1 SAVE THE WORLD WITH GO!!!\n\nIf you are familiar\
    \ with any computer language you already know what comes next: a Hello World!\
    \ program. This is just anprogram that will print a message in your console output.\
    \ Traditionally this is the first approach to any programming language.\nAnd this\
    \ is still the case although we have changed the message.\n\n# Example 1.1: Save\
    \ the world with Go!!!\n\n```\npackage main\n\nimport \"fmt\"\nfunc main() {\n\
    \tfmt.Println(\"Save the world with Go!!!\")\n}\n```\n\nThe code above has the\
    \ basic components of a Go program. First, we set the name of the package that\
    \ contains our code\n(Line 1). In line 2, we import the library required to invoke\
    \ our Println function. The logic of our program is contained between\nbrackets\
    \ in a package called main between lines 5 and 7. The statement in line 6 prints\
    \ our message using the standard output.\n\nGo must be compiled before execution.\
    \ This is, we need to run our code through a compiler to generate executable code\
    \ for\nour platform. The result from the compilation process is an executable\
    \ file. Depending on your platform this file will be different.\nto compile our\
    \ program, we only need to write down the code in any text editor, save it as\
    \ main.go and compile it. To\ncompile the code only run the go build command.\n\
    \n# Example 1.2: Compilation with go build.\n\n```\n>> go build main.go\n>> ls\n\
    main.go\n>> ./main\nSave the world with Go!!!\n```\n\nIf you run the code above\
    \ in a Unix-compatible terminal you should get the same result. As you can see,\
    \ the process is\nstraight forward for this example. The go build command generates\
    \ an executable file named main. This file can be executed\n(notice that ./runs\
    \ any executable file) displaying our message."
