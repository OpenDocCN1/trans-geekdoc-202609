  md: "# 17.3.2 Hooks\n\nThe Command type offers functions that can be executed before\
    \ and after the Run function. PreRun and PostRun are executed before and after\
    \ respectively. PersistentPreRun and PersistentPostRun are inherited by children\
    \ commands.\n\nExample 17.9: Commands using hook functions.\n\n```\npackage main\n\
    \nimport (\n\t\"fmt\"\n\t\"github.com/spf13/cobra\"\n\t\"os\"\n)\n\nvar RootCmd\
    \ = &cobra.Command{\n\tUse: \"say\",\n\tLong: \"Root command\",\n\tPersistentPreRun:\
    \ func(cmd *cobra.Command, args []string) string {\n\t\tfmt.Printf(\"Hello %s\\\
    \\n\", person)\n\t},\n\tRun: func(cmd *cobra.Command, args []string) {\n\tPostRun:\
    \ func(cmd *cobra.Command, args []string) {\n\t\tfmt.Printf(\"Bye %s!!!\\\\n\"\
    , person)\n\t},\n}\n\nvar SomethingCmd = &cobra.Command{\n\tUse: \"something\"\
    ,\n\tShort: \"Say something\",\n\tRun: func(cmd *cobra.Command, args []string)\
    \ {\n\t\tfmt.Printf(\"%s\\\\n\", msg)\n\t},\n\tPostRun: func(cmd *cobra.Command,\
    \ args []string) {\n\t\tfmt.Printf(\"That's all I have to say %s\\\\n\", person)\n\
    \t},\n}\n\nvar person string\nvar msg string\n\nfunc init() {\n\tRootCmd.AddCommand(SomethingCmd)\n\
    \tRootCmd.Flags().StringVar(&person, \"person\", \"Mr X\", \"Receiver\")\n\tSomethingCmd.Flags().StringVar(&msg,\
    \ \"msg\", \"\", \"Message to say\")\n\tSomethingCmd.MarkFlagRequired(\"msg\"\
    )\n}\n\nfunc main() {\n\tif err := RootCmd.Execute(); err != nil {\n\t\tfmt.Fprintf(os.Stderr,\
    \ err)\n\t}\n}\n```"
