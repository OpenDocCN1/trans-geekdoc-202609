    # Has-one


    A has-one relationship indicates that an entity has a reference to another entity.
    This is similar to a belongs-to-relationship in the sense that both are one-to-one
    relationships. However, there is a semantic difference depending on the side where
    the relationship is observed. In the example below, we have a user who has a laptop.
    In this case, the foreign key is in the laptop entity pointing to the user.


    # Example 18.10: Has one relationship.


    ```

    1 type user struct {

    2 ID uint

    3 Name string

    4 Email string

    5 Laptop Laptop

    6 }

    7 type Laptop struct {

    8 ID uint

    9 SerialNumber string

    10 UserID uint

    11 }

    ```


    # Has-many


    A has-many relationship permits an entity to be referred to by several instances
    as their owner. In the example below, we declare that a user can have several
    laptops. Notice to follow GORM conventions, we named a field Laptops to contain
    an array of Laptop type. This is translated into a named table with a user_id
    column as a foreign key pointing at the corresponding user.


    # Example 18.11: One to many relationship.


    ```

    1 type User struct {

    2 ID uint

    3 Name string

    4 Email string

    5 Laptops []Laptop

    6 }

    7 type Laptop struct {

    8 ID uint

    9 SerialNumber string

    10 UserID uint

    11 }

    ```


