    offset\":188}\n}\n->Call http://localhost:8082/consumers/testGroup/instances/testConsumer\n\
    ->Response 204 No Content\n```\n\nNote that in this case, we are not modifying\
    \ the consumer offset. Calling the POST method at /consumers/testGroup/instances/testConsumer/positions\
    \ with the next offset indicated in the body prepares the consumer for the next\
    \ batch of messages. For our example where the latest record had offset 180, we\
    \ analyze the following body to set the next offset to 181.\n\n```\n\"offsets\"\
    : [\n{\n  \"topic\": \"HelloTopic\",\n  \"partition\": 0,\n  \"offset\": 181\n\
    }\n]\n```\n\n# 20.5 SUMMARY\n\nThis Chapter explores how to consume and produce\
    \ data with the Apache Kafka message streaming platform. We analyze different\
    \ Kafka clients provided by Confluent and Segmentio,"
