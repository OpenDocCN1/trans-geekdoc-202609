    Height and width fields. A struct can be instantiated in different ways. Not passing
    any argument (line 11) initializes every field in the struct with the zero value.
    Initial values can be set as them in the order they were defined (line 14). Additionally,
    we can set what value corresponds to what field using the field name (line 17).
    In this way, we do not need to set all the fields (line 20). Missing fields are
    set to their default value.


