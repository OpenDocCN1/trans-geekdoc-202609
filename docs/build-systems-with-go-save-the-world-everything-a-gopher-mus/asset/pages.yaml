    \n# 8.5 TAGS AND ENCODING\n\nIn Section 5.4, we explained how Go provides field\
    \ tags to enrich structs and how reflection can be used to analyse these tags.\
    \ The encodings presented in this Chapter use tags to define how to marshal/unmarshal\
    \ structs. Similarly, we can define our own tags to define new encoding solutions.\n\
    \nTo show how we can leverage tags to define our encoding, let's assume that we\
    \ have a solution that works with structs. For some reason, this solution makes\
    \ a strong distinction between lowercase and uppercase strings. Due to the nature\
    \ of the problem, we have to constantly use the functions strings.ToUpper and\
    \ strings.ToLower in our code. To eliminate redundant code, we decide to use an\
    \ encoding solution to automatically convert our strings to uppercase or lowercase.\n\
    \n```\ntype User struct {\n    UserId string ``pretty:upper`\n    Email string\
    \ ``pretty:lower`\n    password string ``pretty:lowerV`\n}\n```\n\n```\ntype Record\
    \ struct {\n    Name string ``pretty:lower`\n    Surname string ``pretty:upper`\n\
    }\n```"
