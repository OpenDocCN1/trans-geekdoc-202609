    \ Committer function can detect if the commit fails so we can handle the situation.\n\
    \n# Example 20.4: Confluent Kafka asynchronous consumer.\n\n```\npackage main\n\
    \nimport (\n    \"fmt\"\n    \"github.com/confluentinc/confluent-kafka-go/kafka\"\
    \n)\n\nconst COMMIT_N = 2\n\nfunc Committer(c *kafka.Consumer) {\n    offsets,\
    \ err := c.Commit()\n    if err != nil {\n        fmt.Printf(\"Error: %s\\n\"\
    , err)\n        return\n    }\n    fmt.Printf(\"offset: %v\\n\", offsets[].String())\n\
    }\n\nfunc main() {\n    c, err := kafka.NewConsumer(&kafka.Config{\n        \"\
    bootstrap.servers\": \"localhost:9092\",\n        \"group.id\": \"HelloGroup\"\
    ,\n        \"auto.offset.reset\": \"earliest\",\n    })\n    if err != nil {\n\
    \        panic(err)\n    }\n    defer c.Close()\n\n    c.Subscribe(\"helloTopic\"\
    , nil)\n    counter := 0\n    for {\n        ev, err := c.Poll(1000)\n       \
    \ switch ev := ev.(type) {\n        case *kafka.Message:\n            counter\
    \ += 1\n            if counter % COMMIT_N == 0 {\n                go Committer(c)\n\
    \            }\n            fmt.Printf(\"Msg on: %s\\n\", ev.TopicPartition, string(ev.Value))\n\
    \        case kafka.PartitionEOF:\n            fmt.Printf(\"%v\\n\", e)\n    \
    \    case kafka.Error:\n            fmt.Printf(\"Error: %v\\n\", err)\n      \
    \  }\n    }\n```\n\n![](img/c7dcb4df7215ed1d3fb76d25373be6c7_298_0.png)"
