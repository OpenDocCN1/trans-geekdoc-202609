  md: '# PREFACE


    Welcome and thank you for reading these lines.


    Since I started programming in Go, I have always enjoyed its extraordinary commitment
    to simplicity. It is difficult to find another language that can make things so
    easily. That is the beauty of this language. Years have passed and Go is no longer
    the new kid on the block, it has already become a mature language surrounded by
    a rich ecosystem of libraries, projects, and tools. Talking about Go is no longer
    talking about that fancy language that makes your life easier. Go is the grace
    of a continuously growing ecosystem of amazing solutions maintained by a devoted
    community of developers.


    Go was originally designed to simplify the building of complex systems. However,
    when a developer decides to learn Go one step further by exploring tools, libraries,
    and projects from the Go ecosystem this book goes to simply explain the language.
    This book can use to build ready-for-production systems. Everything gopher must
    know in a single book.


    I hope this book proves useful.


    # WHO SHOULD READ THIS BOOK?


    This book is oriented to new Go adopters and developers with programming experience
    in other languages. The first part of this book covers the Go language from its
    basics to more advanced concepts. The second part assumes these concepts to be
    known by the reader and explores how to use them with other tools to build systems.
    If you are new to Go you can start from the beginning. However, if you have some
    experience you can start with the second part and revisit any basic concept if
    needed. Or you go and check the chapters at your convenience.


    # STRUCTURE OF THIS BOOK


    This book is structured to easily find those pieces you may find more interesting
    for your work. However, if you are an absolute beginner or you do not feel comfortable
    with all the concepts explained in this book you can start from the beginning.
    Whatever your use case is, these are the contents of this book.


    +   * **Part 1: The Go language**nThe first part explores the language from the
    very basics to advanced tools offered by the standard library.


    +   * **Chapter 1: First steps with Go**nThis Chapter is specifically written
    to motivate novices to run their first Go program.


    +   * **Chapter 2: The basics**nThis Chapter explains all the Go basics including
    syntax, variables, types, pointers, functions, and execution flow.


    +   * **Chapter 3: Arrays, slices, and maps**nGo includes powerful native data
    structures such as arrays and maps. This Chapter extends previous concepts and
    shows the reader how to write her first data processing solutions.'
  merge: -1
  img_proc: true
