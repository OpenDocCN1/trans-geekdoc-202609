    # 15.8 SUMMARY


    gRPC is a modern, powerful, and versatile RPC framework. This Chapter has shown
    how to harness all the powerful features of gRPC. In conjunction with protocol
    buffers, gRPC is a must in every system designed to be scalable, portable, and
    maintainable. We have explained how to implement servers with their corresponding
    clients, to use streaming connections, and how to provide HTTP interfaces for
    our gRPC procedures with minimal code using transcoding. Finally, for advanced
    designs, we have shown how interceptors can be used to enhance the logic of our
    data communication channels.'
