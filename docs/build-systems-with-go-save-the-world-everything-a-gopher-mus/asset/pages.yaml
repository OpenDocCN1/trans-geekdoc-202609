  md: "# CHAPTER 15 GRPC\n\ngRPC³⁷ is a language and platform agnostic remote call\
    \ (RPC) framework. With gRPC, we can write a common definition of services and\
    \ their signatures and then, create the corresponding clients and servers. This\
    \ abstraction reduces development overhead and helps to maintain a healthy and\
    \ evolving ecosystem of APIs available for several platforms. In this Chapter,\
    \ we explore how to define services with gRPC and how to use the generated stubs\
    \ in Go, how to use streaming, transcoding, and interceptors.\n\n# 15.1 BASIC\
    \ CONCEPTS\n\nFigure 15.1 illustrates the components of a gRPC deployment. There\
    \ are two basic pieces to be defined in every deployment: messages and services.\
    \ In gRPC, messages are defined using protocol buffers (see Chapter 14) setting\
    \ a common serialization framework to send information between clients and servers.\
    \ The services collections of rpc methods that can receive messages as/or return\
    \ messages.\n\nLike in the Figure 15.1, the protoc program translates the services\
    \ definition into a collection of stubs for one of the supported languages (C/C++,\
    \ Java, Python, Go, etc.). These stubs implement all the logic to ensure the correctness\
    \ of messages and services. Hence developers only have to define the behaviour\
    \ of every exposed method following its signature.\n\n```\nmessage User {\n  \
    \  string user_id = 1;\n    string email = 2;\n}\nservice UserService {\n    rpc\
    \ GetUser(UserRequest) returns (User);\n}\n```\n\n![](img/c7dcb4df7215ed1d3fb76d25373be6c7_196_0.png)"
  merge: -1
