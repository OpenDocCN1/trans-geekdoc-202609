  md: '# 16.3 Multi-logger


    It is common to separate logs depending on the log level, the message final output
    (file, standard output). The MultilevelWriter aggregates several loggers making
    it possible for a single log message to be written to different destinations with
    different formats. Example 16.11 defines a multi-logger that simultaneously sends
    every message to a file, the standard output, and ConsoleWriter. The output shows
    the content from the two loggers dumping messages to the logs. Additional customizations
    such as setting log level to have specialized loggers can be done. This is a common
    approach to separate errors into specific logs.


    Example 16.11: Simultaneously logging to several outputs with MultiLevelWriter.


    ```

    package main

    2

    3 import (

    4    "io/ioutil"

    5    "os"

    6    "fmt"

    7    "github.com/rs/zerolog"

    8    "github.com/rs/zerolog/log"

    9\)

    10

    11 func main() {

    12

    13    tempFile, err := ioutil.TempFile(os.TempDir(),"deleteme")

    14    if err != nil {

    15\16        log.Error().Err(err)

    17        Msg("there was an error creating a temporary file for our log")

    18    }

    19

    20    defer tempFile.Close()

    21\    fmt.Printf("The log is allocated at %s\n", tempFile.Name)

    22

    23

    24    fileWriter := zerolog.New(tempFile).With().Logger()

    25    consoleWriter := zerolog.ConsoleWriter(Out: os.Stdout)

    26

    27

    28    multi := zerolog.MultiLevelWriter(consoleWriter, os.Stdout, fileWriter)

    29

    30    logger := zerolog.New(multi).With().Timestamp().Logger()

    31

    32

    33    logger.Info().Msg("Save the world with Go!")

    ```'
