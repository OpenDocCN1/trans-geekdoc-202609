  md: "# CHAPTER 10 TEMPLATES\n\nWhile you read these lines, there are thousands of\
    \ millions of reports, web pages and other structured and non-structured data\
    \ collections being generated. Many of them share a common template that is filled\
    \ with information extracted from users and processed accordingly to a pre-defined\
    \ logic. For example, the email sent to your account to reset your forgotten password\
    \ is always the same, except for small chunks containing data you should be aware\
    \ of.\n\nFrom a practical perspective, these templates should be easy to change\
    \ and modify without necessarily requiring to modify any source code. Go provides\
    \ data-driven templates for generating textual output. These templates are executed\
    \ by applying data structures that contain the data to be represented in the template\
    \ package. This Chapter explores how to use these templates using the text/template\
    \ and html/template packages for text and HTML respectively.\n\n# 10.1 FILLING\
    \ WITH STRUCTS\n\nThe text/template22 package defines the syntax to generate textual\
    \ templates. Our goal is to fill the gaps of a template with incoming data. Let's\
    \ consider the string below.\n\n> Dear {{.Name}}\nYou were registered with id\
    \ {{.UserId}}\nand e-mail {{.Email}}\n\nThis defines a template that is expected\
    \ to be filled with a struct with fields Name, UserId, and Email. Example 10.1\
    \ uses this syntax in conjunction with a User type to generate personalized messages.\n\
    \n# 10.1: Fill template with a struct.\n\n```\npackage main\n\nimport (\n\t\"\
    text/template\"\n\t\"os\"\n)\n\ntype User struct{\n\tName string\n\tUserId string\n\
    \tEmail string\n}\n\nconst Msg = 'Dear {{.Name}}.\\nYou were registered with id\
    \ {{.UserId}}.\\nand e-mail {{.Email}}'.\n```\n\n![](img/c7dcb4df7215ed1d3fb76d25373be6c7_132_0.png)"
