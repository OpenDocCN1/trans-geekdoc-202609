- pgno: 17
  md: '# CHAPTER 2

    THE BASICS


    This Chapter introduces the basics of Go. Like any programming language, Go uses
    variables, control loops, and data structures to create programs. You may find
    this Chapter not long enough to cover all the basics of a programming language.
    This is one of the greatest advantages of Go, its simplicity. The content of this
    Chapter reviews all the concepts a Go adopter must know to dive into the language.


    # 2.1 PACKAGES AND IMPORTS


    If you already read Chapter 1, you will have noticed that every piece of code
    starts with a package statement. Go programs are organized into packages. A package
    is a group of one or more source files which is accessible from the same package.
    Additionally, a package can be exported and used in other packages.


    The package main is a special case that informs the compiler to consider that
    package the entry point for an executable file. Actually, the package main is
    expected to have a main function in order to be compiled.


    A package can be imported into other packages using the keyword import. The line
    import "fmt" makes the fmt package available to the source file. When importing
    a package, Go checks the GOPATH and GORO environment variables. The GOPATH points
    to your workspace and is defined by the installation. GORO points to a custom
    installation. This variable should not be required unless a custom installation
    is done. The Go compiler will first check GORO and then the GOPATH when importing
    a package.


    # 2.1.1 Import third-party packages


    Programs may require additional packages that are developed by third-parties.
    For example, the implementation of a database driver. Go is dramatically different
    importing third-party code compared to other languages. Go forces code transparency
    by only compiling source code. This means that in order to import third-party
    packages, the source code must be locally available. Before importing any third-party
    package you can use the Go command-line to download the code.


    For example, the Mongo driver which is available at http://go.mongodb.org/mongo-go-driver
    we execute:


    # Example 2.1: Third-party package download using get.


    ```

    >>> go get -go.mongodb.org/mongo-driver

    get "go.mongodb.org/mongo-driver" found meta tag get.metalport(Prefix:"go.mongodb.org/mongo-driver",

    VCS:"git", RepoRoot:"https://github.com/mongodb/mongo-go-driver.git" at //go.mongodb.org/mongo-driver-go

    get-1

    gongo.mongodb.org/mongo-driver (download)

    package go.mongodb.org/mongo-driver: no Go files in /XXXX/src/go.mongodb.org/mongo-driver

    ```


    This downloads the source code from the external repository into ours. Afterwards,
    we can import the code using import "go.mongodb.org/mongo-driver/mongo". In some
    cases, the package name may not be very convenient. If required we can use an
    alias like shown below:


    package main'
