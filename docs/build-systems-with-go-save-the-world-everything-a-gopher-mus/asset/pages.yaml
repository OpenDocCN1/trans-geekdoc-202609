    # 2.6.2 Switch


    The switch operator is particularly useful when you want to take action for several
    values of the same variable.


    For example, the program described in Example 2.14 takes a number and prints the
    name of the corresponding finca. This is by enumerating the values we want to
    control and adding the corresponding statement before we define the next value
    that requires a different statement. Finally, we set the special case default
    that is reached when the value is not controlled by any case.


    # Example 2.14: switch example.


    ```

    1 package main

    2

