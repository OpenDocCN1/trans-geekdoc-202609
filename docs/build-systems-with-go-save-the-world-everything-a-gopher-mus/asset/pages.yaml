  md: "# CHAPTER 9\nHTTP\n\nSince Tim Berners Lee came up with the idea of the World\
    \ Wide Web, HTTP has been its foundation. A good understanding of HTTP is basic\
    \ to exchange data, manipulate APIs or crawl the web. This Chapter, details the\
    \ tools that Go provides all the necessary elements to manage HTTP constructs\
    \ such as requests, cookies or headers. In particular, we explore the net/http\
    \ package. This Chapter assumes you are familiar with HTTP and how it works.\n\
    \n# 9.1 REQUESTS\n\nHTTP requests are actions to be performed by an HTTP server\
    \ at a given URL following the client-server paradigm. Go simplifies HTTP requests\
    \ sending with functions Get, Post, and PostForm. By simply invoking these functions\
    \ an HTTP request is sent.\n\n# 9.1 GET\n\nThe simplest manner to send an GET\
    \ request is using the http.Get function. This function returns an http.Response\
    \ type with a filled error y. Like defined in the HTTP protocol, the response\
    \ has a Header type and a body encoded into a Reader type.\n\nExample 9.1: GET\
    \ request.\n\n```\npackage main\n\nimport (\n    \"bufio\"\n    \"fmt\"\n    \"\
    net/http\"\n)\n\nfunc main() {\n    resp, err := http.Get(\"https://httpbin.org/get\"\
    )\n    if err != nil {\n        panic(err)\n    }\n\n    fmt.Println(resp.Status)\n\
    \    fmt.Println(resp.Header[\"Content-Type\"])\n\n    defer resp.Body.Close())\n\
    \    buf := bufio.NewScanner(resp.Body)\n\n    for buf.Scan() {\n        fmt.Println(buf.Text())\n\
    \    }\n}\n```"
