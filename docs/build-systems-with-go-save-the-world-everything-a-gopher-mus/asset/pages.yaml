    prefix -> \")\n\tlog.Println(\"This is a log message\")\n\tlog.SetFlags(log.Lshortfile)\n\
    }\n```\n\n2021/02/08 19:30:34 This is a log message\nprefix -> 2021/02/08 19:30:34\
