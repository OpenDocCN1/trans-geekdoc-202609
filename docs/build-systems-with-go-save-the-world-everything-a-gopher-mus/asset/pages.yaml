  md: "large enough⁵.\n\n# 2.2.4 Enums\n\nEnums (enumerates) is a data type consisting\
    \ of constant values. Classic examples are the days of the week, the months of\
    \ the year, the states of a system, etc. Enums are intrinsically related to the\
    \ iota keyword.\n\n# Example 2.5: Enums declaration\n\n```\npackage main\n\nimport\
    \ \"fmt\"\n\ntype DayOfTheWeek uint8\n\nconst(\n\tMonday DayOfTheWeek = iota\n\
    \tTuesday\n\tWednesday\n\tThursday\n\tFriday\n\tSaturday\n\tSunday\n)\n\nfunc\
