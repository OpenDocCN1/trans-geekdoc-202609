  md: 'The Extensible Markup Language(XML) is a markup language developed by the W3C
    back in 1998. Like JSON, it is human-readable and easy to parse. However, it is
    very verbose which limits its applicability in certain scenarios. The package
    encoding/xml provides functions to work with this format. The package works similarly
    to the encoding/json package explained in the previous section. They share the
    same interfaces from the encoding package. However, there are certain limitations
    for XML we will explain in the examples below.


    Example 8.6 transforms variables into XML representation. The Marshal function
    returns a representation and an error if. The process is similar to the one described
    for the JSON format. A more detailed explanation about how the different types
    are converted into XML can be found in the package documentation 15.


    # Example 8.6: XML marshall.


    ```

    1 package main

    2 import (

    4 "encoding/xml"

    5 "fmt"

    6 )

    7 func main() {

    9 number, err := xml.Marshal(42)

    10 if err != nil {

    11 panic(err)

    12 }

    13 fmt.Println(string(number))

    14

    15 float, _ := xml.Marshal(3.14)

    16 fmt.Println(string(float))

    17

    18 msg, _ := xml.Marshal("This is a msg!!!")

    19 fmt.Println(string(msg))

    20

    21 numbers, _ := xml.Marshal([]int{1,2,2,3,5,8})

    22 fmt.Println(string(numbers))

    23

    24 aMap, err := xml.Marshal(map[string]int{"one":1,"two":2})\n25 fmt.Println(err)

    26 fmt.Println("-", string(aMap))

    27 }

    ```


    ```

    <int42</int>

    <float64>3.14</float64>

