    Send to %s\\n\", m.Note, target)\n}\n\n// Receive a message from a certain origin.\n\
    func (m *Msg) Receive(origin string) {\n\tfmt.Printf(\"Received from %s\\n\",\
    \ m.Note, origin)\n}\n```\n\nDocumented code can be processed with the go doc\
