    \ [counter=3] |\n| Client cookie [counter=4] |\n| Client cookie [counter=5] |\n\
    | Client cookie [counter=6] |\n\n# 9.4 MIDDLEWARE\n\nImagine an HTTP API that\
    \ requires users to be authenticated in the system. A simple approach is to implement\
    \ a basic authentication header checker to determine if a request must be processed\
    \ or not. Additionally, certain operations are restricted to user roles. These\
    \ operations have to be done in every request. From the point of view of the implementation,\
    \ this is a repetitive task that should be implemented once and utilized accordingly.\
    \ This is a clear example of middleware.\n\nThis middleware should run before\
    \ any handler is invoked to process the request. The net/http package does not\
    \ provide any tool to manage middleware solutions. However, this can be easily\
    \ done by implementing handlers. The idea is to concatenate specialized middleware\
    \ handlers that provide additional features."
