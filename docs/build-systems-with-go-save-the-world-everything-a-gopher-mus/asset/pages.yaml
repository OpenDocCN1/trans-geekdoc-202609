    \ ZEROLOG SETTINGS\n\nZerolog has an extensive set of configuration options. These\
    \ options can modify the message output format, where the output is set to define\
    \ subloggers, etc. In this Section, we explore some settings that a developer\
    \ may find useful when defining what and how to log in a project.\n\n# 16.3.1\
    \ Write logs to a file\n\nLogs in the standard output are not always the best\
    \ solution, especially in unsupervised scenarios. Writing logs to a file not permits\
    \ to a non-volatile version, it additionally facilitates concurrency and can be\
    \ used for feeding analytical systems. A file logger can be created using the\
    \ New function which receives an io.Writer. Example 16.9 creates a logger which\
    \ dumps all the messages to a temporary file.\n\nExample 16.9: Stack trace logging.\n\
    \n```\npackage main\n\nimport (\n\t\"io/ioutil\"\n\t\"os\"\n\t\"fmt\"\n\t\"github.com/rs/zerolog/log\"\
    \n\t\"github.com/rs/zerolog\"\n)\n\nfunc main() {\n\ttempFile, err := ioutil.TempFile(os.TempDir(),\"\
    deleteme\")\n\tif err != nil {\n\t\t// Can we log an error before we have our\
    \ logger? :)\n\t\tlog.Error().Err(err).\n\t\tMsg(\"there was an error creating\
    \ a temporary file for our log\")\n}\n```"
