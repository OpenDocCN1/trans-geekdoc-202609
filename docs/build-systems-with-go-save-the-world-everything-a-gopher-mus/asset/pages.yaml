  md: 'We mentioned that one restriction of using the export statement in Go is that
    no functions can be implemented in the C preamble. However, we have implemented
    CFunction how is that possible? This can be because the static inline embeds the
    given code and does not require additional function definitions. If this modifier
    is not used, the function must be defined in an external C file. When the program
    runs, we get the message from the C function followed by the message from Go.


    A static inline function permits the compiler to embed the content of the function.
    This is different from executing a call to the function itself. This technique
    is particularly useful to improve the performance of repetitive chunks of code.


    The extern modifier sets a function or variable to be visible from all the files.
    Its counterpart is static which makes a function or variable visible only to the
    current file. Some people consider the definition of extern to be a flaw of the
    language because default functions and variables are globally visible if not stated
    otherwise.


    # 13.5.2 Go functions with arguments


    Now that we have defined the methods to call Go functions from C, we can extend
    our solution to something more sophisticated. It is possible to pass arguments
    to a Go function from C. However, not all the types can be mapped. Check Table
    13.2 for some examples.


    ```

    Go type C type

    int32 int

    int Lengths may not match. Use C.int instead.

    structs Not supported. Use C structs.

    arrays Not supported. Use C pointer.

    ```


    Table 13.2: Type conversions when calling Go functions from C.


    In Example 13.14, we call a Go function that expects an integer value. The type
    of argument in Go is int32. We cannot use int because there is no automatic conversion
    type for Go int from C to Go. Remember, that sizes may not match in Go the size
    of the int type is platform dependant. Another plausible solution is to use c.int
    instead.'
