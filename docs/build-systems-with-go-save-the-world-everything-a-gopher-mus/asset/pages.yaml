    \ as Zerolog, take advantage of Go features to offer a modern and complete logging\
    \ solution. This Chapter exhaustively explores how to create logs in Go with special\
    \ attention to the Zerolog project.\n\n# 16.1 THE LOG PACKAGE\n\nGo provides a\
    \ basic logging solution in the log package. This package defines three types\
    \ of messages Fatal, Panic, and Println. The first two messages are equivalent\
