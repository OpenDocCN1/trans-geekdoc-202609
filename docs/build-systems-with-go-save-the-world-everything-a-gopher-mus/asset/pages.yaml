  md: 'function receives an empty interface by argument (typeof(i interface{})). However,
    we have already seen that print any type returned by this function like in the
    code below.


    ```

    var a int32 = 42

    fmt.Println(reflect.TypeOf(a)) // -> Prints int32

    ```


    How is this possible? Value a is stored into an empty interface before typeOf
    is called. A similar process is done with Valueof. The empty interface stores
    the underlying type and points to the corresponding value. That is why we can
    resolve the type or value.


    # 5.5.2 The second law of reflection


    Reflection goes from object to interface value.


    If the first line defines how we go from the interface to the value, the second
    law defines the inverse. For a value type we can get the original interface using
    func (v Value) Interface interface(). The code below will print 42.


    ```

    var a int32 = 42

    v := reflect.ValueOf(a)

    fmt.Println(v) // -> Prints 42

    fmt.Println(v.Interface()) // -> Prints 42

    ```


    What is the difference between v and v.Interface() if both outputs are the same?
    In the first case, we print a value. In the second case, we print the int32 variable.
    The reason why the first case is that println states that in the case of reflect.Value
    types the output is the concrete value that this type holds. Then, why v.Interface()?
    Simply because v is not the real value although some operations Println can reach
    it.


    # 5.5.3 The third law of reflection


    To modify an object, the value must be settable.


    The third law may sound evident, you cannot set something it is not settable.
    However, this is difficult to see. The example below tries to set an integer.


    ```

    var a int32 = 42

    v := reflect.ValueOf(a)

    v.SetInt(16) // <- panic

    ```


    The last instruction will panic. This is due to the settability of v. The value
    contained by v is not the original, it is a copy. Notice that reflect.ValueOf(a)
    uses a copy of a. The value does not point to the original place where the 42
    is stored, we need a pointer. However, the following will fail.


    ```

    var a int32 = 42

    v := reflect.ValueOf(a)

    v.SetInt(16) // -> panic

    ```'
