    \ 1.3: Passing arguments\n\n```\npackage main\n\nimport (\n\t\"fmt\"\n\t\"os\"\
    \n)\n\nfunc main() {\n\targsWithProg := os.Args\n\targsWithoutProg := os.Args[1:]\n\
    \n\targ := os.Args[3]\n\tfmt.Println(argsWithProg)\n\tfmt.Println(argsWithoutProg)\n\
