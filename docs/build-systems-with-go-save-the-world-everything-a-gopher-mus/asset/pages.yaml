  md: '# CHAPTER 14

    PROTOCOL BUFFERS


    Nowadays systems are mainly distributed. The distribution comes with major advantages
    such as redundancy, resiliency, or scalability. However, the components of any
    system are not isolated and have to talk to each other. This communication is
    usually carried out with messages, understanding by message piece of information
    exchanged between two speakers with some purpose.


    Messages must be platform and language agnostic so they can be used by the large
    number of solutions. Formats such as XML, JSON or YAML (see Chapter 8) are commonly
    used to exchange information because they are easy to parse and human friendly.
    However, they are not efficient solutions in terms of message size and serialization
    costs. To mitigate these problems, Google developed protocol buffers 32 as a language-neutral
    and platform-neutral serialization mechanism. Protocol buffers is available for
    various languages including Go.


    This Chapter introduces protocol buffers, explains what they are, how they are
    built, and how they help us define a common exchanging framework between applications
    and systems.


    # 14.1 THE PROTO FILE


    The definition of messages in protocol buffers (PB from now on) is independent
    of the programming language. The protocol file manages the definition of exchangeable
    entities in PB. This file is interpreted by the protoc tool which generates the
    code required to marshal and unmarshal (see Chapter 8.) these entities. A single
    protocol file can be used to generate the corresponding code for every supported
    language. This is an abstraction mechanism that releases the developer from the
    complexities of defining low level data transfer mechanisms.'
