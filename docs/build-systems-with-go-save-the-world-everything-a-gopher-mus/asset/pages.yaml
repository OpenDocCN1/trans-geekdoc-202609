    # 11.5 PROFILING


    Getting high performance and finding potential optimizations in your code is not
    an easy task. Profiling is a complex task that requires a deep understanding of
    code and the underlying language. Go provides the runtime/pprof package with functions
    to define profiling entities. Fortately, profiling functions are ready-to-use
    with benchmarks that facilitates the exploration of CPU and memory consumption
    in our code.


    Profiling can be generated by launching benchmarks like described in this chapter.
