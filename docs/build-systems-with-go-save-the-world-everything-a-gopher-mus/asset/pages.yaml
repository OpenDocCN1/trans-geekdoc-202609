    # 15.6 TRANSCODING


    gRPC works on top of the HTTP/2 transfer protocol offering full-duplex communication,
    high performance, among other features. Unfortunately, HTTP/2 is not available
    in every scenario and sometimes can become a drawback. Many servers are behind
    load balancers and/or proxies that do not support HTTP/2. In other scenarios,
    remote clients cannot work with gRPC due to other limitations simply because they
    cannot easily adopt this technology.


    Transcoding permits gRPC to emulate REST APIs (HTTP + JSON). This can be done
    using annotations in the .proto file. Using the grpc-gateway, the protoc program
    can generate reverse proxies transcoding HTTP requests to the corresponding gRPC
    handler. Figure 15.5 shows a schema of HTTP transcoding to gRPC where a HTTP client
    sends a GET request to a remote server. This request travels through the Internet
    and may traverse different load balancers or service providers. Finally, the request
    reaches the target HTTP server. The incoming request is transformed into a gRPC
    compatible request and sent to the corresponding gRPC server.'
