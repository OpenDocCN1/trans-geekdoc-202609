    \ and pointer receivers.\n\n```\npackage main\n\nimport \"fmt\"\n\ntype Rectangle\
    \ struct{\n\tHeight int\n\tWidth int\n}\n\nfunc (r Rectangle) Enlarge(factor int)\
    \ {\n\tr.Height = r.Height * factor\n\tr.Width = r.Width * factor\n}\n\nfunc (r\
    \ *Rectangle) EnlargeP(factor int) {\n\tr.Height = r.Height * factor\n\tr.Width\
    \ = r.Width * factor\n}\n\nfunc main() {\n\trect := Rectangle{2,2}\n\tfmt.Println(rect)\n\
    \n\trect.Enlarge(2)\n\tfmt.Println(rect)\n\n\trect.EnlargeP(2)\n\tfmt.Println(rect)\n\
    }\n```\n\n> In Example 4.7, the Enlarge method requires a pointer. However, invoke\
    \ the method with rect.EnlargeP(2) and rect is not a pointer. This is possible\
    \ because the Go interpreter translates this into (&rect).EnlargeP(2).\n\n> If\
    \ a method can have value or pointer receivers, which one should you use? Generally,\
    \ using pointers is more efficient because it reduces the number of copies. However,\
    \ in some situations you may be more comfortable with value receivers. In any\
    \ case, you should be consistent and do not mix them."
