    # 16.3.4 Sub-logger


    By Zerolog, loggers are extensible. This makes it possible to create new loggers
    enhancing the existing configuration and extend the context. In Example 16.12
    we create a new logger from mainLogger with additional context indicating the
    current context. Check the output from the sub-logger maintains the same configuration
    from the main logger with the additional context without additional info.


    **Example 16.12: Extensible logging using sub-loggers.**


    ```

    1 package main

    2

    3 import (

    4 "os"

    5  "github.com/rs/zerolog"

    6 )

    7

    8 func main() {

    9  mainLogger := zerolog.New(os.Stdout).With().Logger()

    10 mainLogger.Info().Msg("This is the main logger")

    11

    12 sublogger := mainLogger.With("component", "componentA").Logger()

    13 sublogger.Info().Msg("This is the sub-logger")

    14 }

    ```


    ```

    {"level":"info","message":"This is the main logger"}

    {"level":"info","component":"componentA","message":"This is the sub-logger"}

    ```


    # 16.4 ZEROLOG ADVANCED SETTINGS


    This section covers the current overview of Zerolog features and customization
    by explaining examples of additional solutions for specific scenarios.


    # 16.4.1 Hooks


    Hooks are executed every time a logger is invoked. The Hook interface defines
    the Run method that gives access to the arguments of a log message. The Example
    16.13 uses a Hook to add the component name to the context of debug message. Additionally,
    a second hook adds a random number to the context. Both hooks are added to the
    same logger modifying the final behaviour of the logger. Observe that only, the
    debug message contains the component string in the context.


    **Example 16.13: Extensible logging using sub-loggers.**'
