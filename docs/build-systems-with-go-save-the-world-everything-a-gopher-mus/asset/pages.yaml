    #  6.2.4 Channels direction


    The data flow direction in a channel can be specified.


    ```

    ch := make(chan int) // sender and receiver

    ch := make<-(chan int) // receiver

    ch := make(chan int) // sender

    ```


    This provides better type-safety and permits better utilization of channels. In
    Example 6.8, we define sender and receiver functions to send and receive values
    respectively. Because channel directions are set, if receiver tries to send data
    using the channel an error at compilation time will appear. And similarly, sender
    cannot read data from the channel.


