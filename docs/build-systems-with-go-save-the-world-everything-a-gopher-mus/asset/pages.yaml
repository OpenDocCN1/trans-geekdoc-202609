    \ following rules:\n\n+   - Comments before package declaration are considered\
    \ to be a package comment.\n- Every package should have a comment. With multiple\
    \ files, the package comment only needs to be present in one file.\n- Every exported\
    \ name should have a comment.\n- Every exported item begins with the name of the\
    \ item describes.\n\nExample 12.2 documents a piece of code following the mentioned\
    \ conventions. It is important to note that every comment starts with the name\
    \ of the commented item. For explanations, in particular, those containing the\
    \ /* */ comment marks can be used.\n\n# Example 12.2: Program documentation.\n\
    \n```\n// Package example_01 contains a documentation example.\npackage example_01\n\
    \nimport \"fmt\"\n\n// Msg represents a message.\ntype Msg struct{\n\tNote //\
    \ Note is the note to be sent with the message.\n\tote string\n}\n\n// Send a\
