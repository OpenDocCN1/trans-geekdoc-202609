  md: "# CHAPTER 8\nENCODINGS\n\nWe can find popular formats such as CSV, JSON, XML\
    \ or YAML that are used to represent data from a byte level to a human-readable\
    \ format. Other formats such as base64 or PEM serialization are oriented to facilitate\
    \ machine interaction. In Go, the package encoding offers a set of subpackages\
    \ that facilitate the conversion from Go to these formats and the other way around.\
    \ Many concepts explained in this Chapter were already introduced in Chapter 7\
    \ when we explained readers and writers. In this Chapter, we explore CSV, JSON,\
    \ and XML manipulation techniques. Additionally, we present how to work with YAML\
    \ using the Go-yaml third-party package.\n\n# 8.1 CSV\n\nComma Separated Values\
    \ [9] (CSV) is a widely used format to represent tabular data. Go provides CSV\
    \ read/write operators in the package encoding/csv. Every line from a CSV is defined\
    \ as a CSV record and contains every items separated by commas.\n\nIn order to\
    \ use CSV we use a Reader type that converts CSV lines into CSV records. Example\
    \ 8.1 shows how a csv Reader processes a string with CSV content. Notice that\
    \ CSV is partially tied and in the case of strings they have quoted in variable\
    \ in. The Read method returns the next CSV record or error if any. Like any other\
    \ Reader EOF is reached when no more records are available. Every record is represented\
    \ using []string.\n\nExample 8.1: CSV reading.\n\n```\npackage main\n\nimport\
    \ (\n\t\"encoding/csv\"\n\t\"fmt\"\n\t\"io\"\n\t\"log\"\n\t\"strings\"\n)\n\n\
    func main() {\n\t := := \"user_id,score,password\"\n\t\"Gopher\",1000,\"admin\"\
    \n\t\"Big!\",10234\"\n\t\"GGoom\",1111\"\n\n\tr := csv.NewReader(strings.NewReader(in))\n\
    \nfor {\n\trecord, err := r.Read()\n```"
