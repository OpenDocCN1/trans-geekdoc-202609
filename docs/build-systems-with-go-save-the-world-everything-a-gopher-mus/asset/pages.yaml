  md: "PB permits defining messages with their fields and corresponding types. This\
    \ definition is done in a file with the .proto suffix. The PB version is set with\
    \ the syntax statement. PB entities are organized into packages that can be imported\
    \ from other proto files. In our example, we work with package user. PB permits\
    \ the definition of various options that may help the generation of code for certain\
    \ languages. The go_package option indicates the path of the package where the\
    \ Generated code will be saved. This package must be imported into our code.\n\
    \nAny message is composed of fields and every field has a name, and a field type\
