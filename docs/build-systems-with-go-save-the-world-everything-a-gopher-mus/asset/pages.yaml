    # 15.5 STREAMING


    HTTP/2 permits full-duplex communication between client and server. This makes
    it possible to establish a streaming channel between both ends. The channel can
    be reused to reduce the overhead and latency of networked operations in the channel
    negotiation process. gRPC leverages this HTTP/2 feature to offer procedures that
    receive or return data inside streams. Next, we explain how to work with streaming
    for servers and clients in one direction or bidirectional flows.


    # 15.5.1 Server streaming


