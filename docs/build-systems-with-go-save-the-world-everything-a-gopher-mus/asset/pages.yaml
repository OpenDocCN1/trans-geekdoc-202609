    The required modules are downloaded into the GOPATH folder as usual. However,
    we may need to store them in a vendor folder. This is not the recommended way,
    but if we still need to do it running go mod vendor stores the required modules
    into the vendor folder.


    > When sharing our modules with others privately or in a public platform such
    as Github, be sure that do not use a vendor folder. If you so, you will ruin all
    the benefits of Go modules. Furthermore, you will replicate large pieces of code
    that are intended to be maintained by others.


    > Go modules is the default dependency manager in Go since 1.16. You may find
    projects and modules using other solutions such as go dep. Be careful when importing
    these modules to your code, and be sure they are compatible with your Go modules.


    # 12.1.1 Working with versions


    We assume the reader to be familiar with versions, in particular semantic versioning
    [14]. If so, you must understand that it usually occurs for the same project,
    different versions may lead to incompatibilities and undesired behaviours. By
    default, Go modules check for the latest'
