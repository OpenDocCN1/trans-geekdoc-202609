  md: "Log levels help identify the severity of messages and can be set on the fly\
    \ using the global level variable. Example 16.4 changes the global level from\
    \ Debug to Info. Notice that after setting the info level, debug messages are\
    \ discarded.\n\n# Example 16.4: Set global level zerolog.\n\n```\npackage main\n\
    \nimport (\n\t\"github.com/rs/zerolog/log\"\n\t\"github.com/rs/zerolog\"\n)\n\n\
    func main() {\n\tzerolog.SetGlobalLevel(zerolog.DebugLevel)\n\tlog.Debug().Msg(\"\
    Debug message is displayed\")\n\tlog.Info().Msg(\"Info message is displayed\"\
    )\n\n\tzerolog.SetGlobalLevel(zerolog.InfoLevel)\n\tlog.Debug().Msg(\"Debug message\
    \ is no longer displayed\")\n\tlog.Info().Msg(\"Info message is displayed\")\n\
    }\n```\n\n```\n{\"level\":\"Debug\",\"time\":\"2021-02-08T12:56:01.000Z\",\"message\"\
    :\"Debug message is displayed\"}\n{\"level\":\"info\",\"time\":\"2021-02-08T12:56:01.000Z\"\
    ,\"message\":\"Info message is displayed\"}\n{\"level\":\"info\",\"time\":\"2021-02-08T12:56:01.000Z\"\
    ,\"message\":\"Info message is displayed\"}\n```\n\nZerolog provides messages\
    \ within a context. This context has zero or more variables accompanying the logging\
    \ message. Variables are typed and can be added on the fly as like shown in Example\
    \ 16.5. A complete list of available types can be found at the official documentation\
    \ 45.\n\n# Example 16.5: Set message context.\n\n```\npackage main\n\nimport(\n\
    \t\"github.com/rs/zerolog/log\"\n)\n\nfunc main() {\n\tlog.Info().Str(\"mystr\"\
    ,\"this is a string\").Msg(\"\")\n\tlog.Info().Int(\"myint\",1234).Msg(\"\")\n\
    \tlog.Info().Int(\"myint\",1234).Str(\"str\",\"some string\").Msg(\"And a regular\
    \ message\")\n}\n```"
