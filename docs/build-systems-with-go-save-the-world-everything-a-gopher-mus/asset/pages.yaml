    # 5.6 SUMMARY


    In this Chapter, we explored how to use reflection in Go and how to use types,
    values, and tags. We enumerated the three laws of reflection and showed examples
    for each of the rules. Reflection is a powerful tool in advanced programming projects
    and will appear in different Chapters of this book. However, the developer must
    consider that code introspection comes with a cost in terms of performance, code
    readability, and maintenance. Is for this reason, that reflection is expected
    to be used in certain scenarios where it is the only solution for a given problem.'
