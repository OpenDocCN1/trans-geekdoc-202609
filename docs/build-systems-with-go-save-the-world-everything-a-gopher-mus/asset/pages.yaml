    # 16.3.2 Output customization\n\nWe have already mentioned that Zerolog is designed\
    \ to use JSON. However, JSON may not be the most user-friendly format, especially\
    \ if we print logs to a console. The console gets rid of colons, brackets, and\
    \ quotation marks from the JSON syntax and permits us to easily define our output\
    \ format. Example 16.10 customizes a ConsoleWriter to define new formats for the\
    \ level, message, field, name and return value. Every item can be redefined using\
    \ a function that receives an interface and returns a string. See in example,\
    \ the field is surrounded by square brackets or how the log level is always fixed\
    \ to a six characters string.\n\nExample 16.10: Customized output with ConsoleWriter\n\
    \n```\npackage main\n\nimport (\n\t\"os\"\n\t\"strings\"\n\t\"time\"\n\t\"fmt\"\
    \n\t\"github.com/rs/zerolog\"\n)\n\nfunc main() {\n\toutput := zerolog.ConsoleWriter(out:\
    \ os.Stdout, Time: time.RFC3339)\n\toutput.FormatLevel = func(i interface{}) string\
    \ {\n\t\treturn strings.ToUpper(fmt.Sprintf(\"%%-%s\", i))\n\t}\n\toutput.FormatMessage\
    \ = func(i interface{}) string {\n\t\treturn fmt.Sprintf(\">>>%s<<\", i)\n\t}\n\
    \toutput.FormatFieldName = func(i interface{}) string {\n\t\treturn fmt.Sprintf(\"\
    %%%s\", i)\n\t}\n\toutput.FormatFieldValue = func(i interface{}) string {\n\t\t\
    return strings.ToUpper(fmt.Sprintf(\"%%%s\", i))\n\t}\n\n\tlog := zerolog.New(output).With(time.Timestamp()).Logger()\n\
    \tlog.Info().Str(\"foo\", \"bar\").Msg(\"Save the world with Go!\")\n}\n```"
