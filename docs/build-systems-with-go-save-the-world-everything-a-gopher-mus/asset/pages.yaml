    # 3.1 ARRAYS


    By definition, an array is an indexed sequence of elements with a given length.
    Like any other Go variable, arrays are typed and their size is fixed


    Example 3.1 shows different ways to declare arrays. A variable a (line 7) declares
    an array of integers of size 5. By default, this array is filled with zeros. Notice
    that printing the array returns the sequence of numbers between brackets. We can
    assign to the array in a single line in the case of b. Similarly, c is declared
    as a 5 integers array with only three values assigned.


    # Example 3.1: Arrays declaration


