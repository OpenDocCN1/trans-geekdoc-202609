    \ or the commands below if you use a Unix-like environment.\n\nNow we have seen\
    \ how to define a middleware handler practical question is how to easily concatenate\
    \ all the middleware. This is an interesting question because we can expect to\
    \ deal with several handlers and sophisticated configurations. The main idea is\
    \ to replace AuthMiddleware(&targetHandler) for something that can be programmatically\
    \ executed.\n\n9.10 defines a type Middleware and the ApplyMiddleware function\
    \ to help the concatenation of multiple handlers. The idea is that ApplyMiddleware\
    \ returns a handler that results from applying a collection of middlewares to\
    \ the handler passed by argument. When registering handlers for our server, we\
    \ simply invoke the final handler and the middleware items. In our case, we register\
    \ /three and /one URIs that we apply once and three times the SimpleMiddleware.\
    \ This middleware checks the simple header and adds a tick. The number of ticks\
    \ in the response header will be some of these middlewares executed when serving\
    \ the request.\n\nExample 9.10: Concatenation of several middleware handlers."
