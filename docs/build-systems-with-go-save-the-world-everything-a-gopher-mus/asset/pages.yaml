  md: '+   Chapter 4: Structs, methods, and interfaces

    This Chapter describes how Go defines advanced data structures, their associated
    methods, and interfaces.


    +   Chapter 5: Reflection

    By exploring Go reflection, the reader can understand the many possibilities of
    manipulating in-memory data structures.


    +   Chapter 6: Concurrency

    Concurrency is not an easy topic. However, this Chapter demonstrates how Go help
    developers to design complex solutions effortlessly. This Chapter covers goroutines,
    channels, concurrency contexts, and more.


    +   Chapter 7: Input/Output

    Any program requires to write or read data to from different sources. This Chapter
    explains how Go provides I/O support.


    +   Chapter 8: Encodings

    The Go standard library offers by default to work with encodings such as CSV,
    JSON or XML. This Chapter explains how to use these encodings and others are not
    available by default.


    +   Chapter 9: HTTP

    This Chapter explains how we can implement any HTTP clients and servers, and how
    to deal with requests, cookies, headers or middleware.


    +   Chapter 10: Templates

    Templates are pieces of data than can be filled programmatically. This Chapter
    explains how to define, customize, and use them.


    +   Chapter 11: Testing

    This Chapter will show the reader how simple it is to executing routines and benchmarks
    in Go. Additionally, it will introduce the reader how to run coverage tests and
    execution profiles.


    +   Chapter 12: Modules and documentation

    This Chapter explains how to manage dependencies in Go and how to document code.


    +   Chapter 13: Cgo

    Go can operate with structs and functions using Cgo. This Chapter describes how
    Go program can use C code and how we can execute Go functions from any program
    written in C.


    +   Part II: Building systems

    The second part of the book is oriented to readers who feel comfortable with the
    language and want to explore solutions from the Go ecosystem that can be built
    sophisticated systems.


    +   Chapter 14: Protocol buffers

    This Chapter reviews what is the protocol buffer serialization format and how
    to use it with Go.


    +   Chapter 15: gRPC

    Read this Chapter if you need a fast, modular, and easy-to-deploy message protocol
    in your system. This Chapter explains how to define services, servers, clients,
    streaming, and interceptors.


    +   Chapter 16: Logging with Zerolog

    This Chapter shows the reader how to log a program using the powerful Zerolog
    library.'
