    \ not worry, this is explained in Chapter 3) containing all the arguments passed\
    \ to the program including the name of the executable file. The variable argsWithoutProg\
    \ has our input message (Save the world with Go). We removed the name of the program\
    \ with the index os.Args[1:]. As mentioned before, this will be explained in"
