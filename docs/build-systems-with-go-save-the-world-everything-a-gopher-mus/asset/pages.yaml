    \ the number of messages to be committed.\n\nRemember that manual committing is\
    \ only required when the auto-commit configuration parameter in the Kafka brokers\
    \ is disabled.\n\n# 20.4 USING THE KAFKA REST API\n\nWe have explored in the previous\
    \ sections how to produce and consume messages from Kafka using the official Confluent\
    \ Segmentio solutions. Kafka defines its own protocol over TCP [3] that is implemented\
    \ by the library librdkafka making all the Kafka functionalities available. The\
    \ Confluent client is a wrapper around this library. Unfortunately, this may not\
    \ be a"
