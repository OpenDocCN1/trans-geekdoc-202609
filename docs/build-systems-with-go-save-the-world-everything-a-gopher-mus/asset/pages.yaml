  md: "# CHAPTER 11\nTESTING\n\nTesting is one of the most important tasks to develop\
    \ a successful project. Unfortunately, testing is usually postponed or not seriously\
    \ taken into consideration by developers. Testing can be repetitive and sometimes\
    \ even convoluted. Frankly, Go defines tests in a simple manner that reduces adoption\
    \ and helps developers to focus more on the test and less on language constructions.\
    \ This Chapter explores testing, benchmarking and profiling.\n\n# 11.1 TESTS\n\
    \nGo provides an integrated solution for testing. Actually, any function with\
    \ signature TestXXX(*testing.T) is interpreted as a testing function. Example\
    \ 11.1 is a naive demonstration of how to check the correctness of a 2+2 operation.\
    \ In this case, no error is going to occur. However, if any error is found, the\
    \ t argument provides access to the Error function that sets this test to be failed.\n\
    \nExample 11.1: Simple test.\n\n```\npackage example_01\n\nimport \"testing\"\n\
    \nfunc TestMe(t *testing.T) {\n\tr := 2 + 2\n\tif r != 4 {\n\tt.Error(\"expected\
    \ 2 got\", r)\n}\n}\n```\n\nTests are thought to be used in the go test tool.\
    \ For the example we can run the test as follows:\n\n```\ngo test\nPASS\nok github.com/juanmuel-tirado/SaveTheWorldWithGo/go_10_testing/testing/example_01.341s\n\
    >>> go test -v\n=== RUN TestMe (0.00s)\n- PASS TestMe (0.00s)\nok github.com/juanmuel-tirado/SaveTheWorldWithGo/go_10_testing/testing/example_01.090s\n\
    ```\n\nThe basic output from go test is the final status of the testing (ok) and\
    \ the elapsed time. When using the verbose flag (-v) this information is printed\
