  md: "# 9.3.1 CookieJar\n\nThe previous example is a basic description of how to\
    \ manipulate cookies. One drawback of the example is that we have to manually\
    \ set the new cookie for future requests. This could be easily done considering\
    \ that we only have one cookie. However, when interacting with web applications\
    \ it is common to use many and it would be more efficient to have a non-supervised\
    \ approach to update these cookies.\n\nThe 21 package net/http/cookiejar implements\
    \ an in-memory storage solution for cookies that follow the cookiejar interface\
    \ from net/http. Example 9.8 extends Example 9.7 with a client using a CookieJar.\
    \ The SetCookies method associate an array of cookies with a URL. Now every time\
    \ the client uses CookieJar, the CookieJar will update the corresponding cookies.\
    \ This enhancement is only required at the client side. Finally, we iteratively\
    \ send requests to the server which without the CookieJar we would have to manually\
    \ update the cookie for the next request.\n\nThis can be done adding the cookies\
    \ to the CookieJar (jar.SetCookies) and setting the jar field in the http.client.\
    \ After every request cookies are automatically updated and we can check their\
    \ values.\n\n# Example 9.8: Use of CookieJar to set cookie values.\n\n```\npackage\
    \ main\n\nimport (\n\t\"fmt\"\n\t\"net/http\"\n\t\"net/http/cookiejar\"\n\t\"\
    url\"\n\t\"strconv\"\n)\n\nfunc setCookie(w http.ResponseWriter, r *http.Request)\
    \ {\n\tcounter, err := r.Cookie(\"counter\")\n\tif err != nil {\n\t\tw.WriteHeader(http.StatusInternalServerError)\n\
    \t\treturn\n\t}\n\n\tvalue, err := strconv.Atoi(counter.Value)\n\tif err != nil\
    \ {\n\t\tw.WriteHeader(http.StatusInternalServerError)\n\t\treturn\n\t}\n\n\t\
    value = value + 1\n\tnewCookie := http.Cookie{\n\t\tName: \"counter\",\n\t\tValue:\
    \ strconv.Itoa(value),\n\t}\n\thttp.SetCookie(w, &newCookie)\n```"
