    \ USING THE CONFLUENT CLIENT\n\nThe confluent-kafka-go75 is a wrapper around the\
    \ librkafka library. This wrapper defines a Kafka client with a producer and a\
    \ consumer types. Examples 20.1 and 20.2 show standard implementations for a producer\
    \ and a consumer respectively.\n\n# 20.2.1 Synchronous producer\n\nThe Producer\
    \ type is instantiated using a ConfigMap which contains key-pairs with all the\
    \ required configuration for the connection72. The Producer holds a connection\
    \ that has to be released with Close(). For this Example, we send events to the\
    \ topic named helloTopic. Events are defined by the Message type described below.\n\
    \n```\ntype Message struct {\n  TopicPartition TopicPartition\n  Value       \
    \   [byte]\n  Key            [byte]\n  Timestamp      time.Time\n  TimestampType\
    \  TimestampType\n  Opaque         interface{}\n  Headers        []Header\n}\n\
    ```\n\nThe most important field is value which contains the message content in\
    \ a raw byte slice. Key can be used for additional control inside the topic as\
    \ mentioned above. Opaque can be used to pass arbitrary data to the corresponding\
    \ event handler.\n\nThe producer shown in Example 20.1 passes a message to the\
    \ Produce method indicating the partition and message value. Note that we target\
    \ the partition set by Kafka using the PartitionKey policy. Produce function receives\
    \ a chan event to handle the production of events. Messages are sent to the librkafka\
    \ which has its own queue of messages. To avoid an overflow, we can wait until\
    \ the message is sent using the deliveryChan. This is not the most efficient approach\
    \ as the production of messages is stopped until a message is processed. Flush\
    \ function waits for a given time in milliseconds until all messages have been\
    \ sent. In the Example it is commented because we are waiting for every message\
    \ submission.\n\n**Example 20.1:** Confluent Kafka synchronous producer."
