    \n# 8.2 JSON\n\nThe JavaScript Object Notation [4] (JSON) is a light-weight data\
    \ interchange format defined by ECMA in 1999. It has turned extremely popular\
    \ because it is human readable and easy to parse. JSON processing operators are\
    \ available at encoding/json. This package provides Marshal and Unmarshal functions\
    \ that convert types to a JSON representation in []byte, and vice versa."
