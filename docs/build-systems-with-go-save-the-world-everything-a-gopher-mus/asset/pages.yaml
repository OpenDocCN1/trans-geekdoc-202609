    # 6.4 WAITGROUP


    Normally, when working with goroutines we have to wait until their completion.
    In order to facilitate this, Go offers the WaitGroup type in the sync package.
    This type has three methods Add, Done, and Wait. A WaitGroup works like a counter
    with the number of goroutines we are waiting to be finished. Every time a goroutine
    finishes, the Done method decreases the counter. The Wait method blocks the execution
    until the counter reaches zero.


    Example 6.12 defines an example of consumer/producer with a function generating
    tasks (random numbers) that are consumed by other goroutines. The WaitGroup variable
    is instantiated and increments to 3 elements wg.Add(3). Notifying wg about completion
    is up to the goroutines. For this, we pass the wg by reference so they can notify
    their completion. Note that this is done with wg.Done(). Finally, wg.Wait() waits
    until all the goroutines are finished.


