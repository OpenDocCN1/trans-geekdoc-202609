- pgno: 304
  md: "convenient solution for all scenarios. On the other hand, the Segmentio client\
    \ or other implementations may not cover all the Kafka functionalities or simply\
    \ their approach does not fulfil your requirements. In other scenarios, the utilization\
    \ of pure TCP traffic may be limited or restricted.\n\nA potential solution is\
    \ to use the REST API offered by Kafka 29. By exposing Kafka functionalities through\
    \ an API REST, any HTTP client can produce and consume messages. In this Section,\
    \ we explore how to produce and consume messages from Kafka interacting with the\
    \ REST API using the standard `net/http` package.\n\nThe examples from this Section\
    \ assume the Kafka API is available at localhost:8082. If you are not familiar\
    \ with HTTP clients in Go, review Chapter 9.\n\n# 20.4.1 Producer\n\nFirst, we\
    \ have to find out that we use the POST method for message publishing. After checking\
    \ the API specification, /topics/<name>/partitions/<number>. Where <name> and\
    \ <number> are the topic name and the corresponding partition respectively. The\
    \ message must be attached to the body request. This method expects the encoding\
    \ format to be specified in the request-Type header. The API data encoding in\
    \ JSON, Avro, binary, and Protobuf formats. In these examples, we use JSON encoding\
    \ with the value application/vnd.kafka.json.v2+json for our header. How to specify\
    \ other formats see the official documentation. The following object contains\
