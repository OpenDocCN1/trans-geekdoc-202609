    For the structs above, we defined the tag key pretty, with values upper or lower
    that transform a string into uppercase or lowercase respectively. Our encoding
    is defined as follows:


    +   1. Unexported fields such as password are ignored.

    2. Only lower and upper are valid tag values.

    3. Only strings are candidates to be encoded.

    4. Every field is identified by its field name, and separated from the new value
    by a colon.

    5. The fields are surrounded by brackets.

    6. No recursion, or collections will be encoded.


