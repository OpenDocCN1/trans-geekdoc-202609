  md: '# 16.4.3 Integration with HTTP Handlers


    A common scenario for logging messages is HTTP handlers. Zerolog provides additional
    tools to integrate with http.Handler types^47 The hlog.NewHandler returns a function
    that receives http.Handler and returns another. The concatenation of handlers
    is possible and their integration with them however. Some logging functions are
    already available^48 to extend the message context adding information from the
    requests.


    In Example 16.16, we create a simple HTTP Server that returns a predefined message
    for every request. We use our logger hlog with additional context from HTTP requests.
    We add the IP address, the handler, and RequestIDHandler respectively. The concatenation
    of the loggers with our handler creates a middleware of loggers that is available
    for every request. Because hlog works as a contextual logger, we invoke hlog.FromRequest
    to get a logger with the contextual information (line 17). In the final output
    the message from the hlog logger contains additional context from the incoming
    request without any additional intervention.


