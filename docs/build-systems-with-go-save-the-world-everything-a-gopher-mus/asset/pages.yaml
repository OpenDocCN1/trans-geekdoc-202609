  md: "```\npackage main\n\nimport \"net/http\"\n\ntype MyHandler struct{}\n\nfunc\
    \ (mh *MyHandler) ServeHTTP(w http.ResponseWriter, r *http.Request) {\n\tw.WriteHeader(http.StatusOK)\n\
    \tw.Write([]byte(\"Perfect!!!\"))\n\treturn\n}\n\ntype Middleware func(http.Handler)\
    \ http.Handler\n\nfunc ApplyMiddleware(h http.Handler, middleware ...Middleware)\
    \ http.Handler {\n\tfor _, next := range middleware {\n\t\th = next(h)\n\t}\n\t\
    return h\n}\n\nfunc SimpleMiddleware(next http.Handler) http.Handler {\n\treturn\
    \ http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\tvalue :=\
    \ w.Header().Get(\"simple\")\n\tif value == \"\" {\n\t\tvalue = \"X\"\n\t} else\
    \ {\n\t\tvalue = value + \"X\"\n\t}\n\t\tw.Header().Set(\"simple\", value)\n\t\
    \tnext.ServeHTTP(w, r)\n\t})\n}\n\nfunc main() {\n\th := &MyHandler{}\n\nhttp.Handle(\"\
    /three\", ApplyMiddleware(h, SimpleMiddleware, SimpleMiddleware, SimpleMiddleware))\n\
    \nhttp.Handle(\"/one\", ApplyMiddleware(h, SimpleMiddleware))\n\npanic(http.ListenAndServe(\"\
    :8080\", nil))\n}\n```\n\nUsing curl we can see how /three returns the header\
    \ Simple: XXX while /one returns Simple: X. Obviously these middleware function\
    \ only has demonstration purposes. However, applying other more realistic or sophisticated\
    \ solutions can use exactly the same ideas.\n\n>>> curl :8080/three -i"
