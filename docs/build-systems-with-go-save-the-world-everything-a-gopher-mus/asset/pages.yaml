  md: "# 15.5.3 Bidirectional streaming\n\nWe have already mentioned that gRPC provides\
    \ full-duplex communication using HTTP/2. This makes it possible to use bidirectional\
    \ streaming between client and server. Bidirectional streaming may be particularly\
    \ suitable for scenarios where data may arise on the fly or even to define your\
    \ protocols on top of gRPC.\n\nIn Example 15.11, we define a chat service that\
    \ sends back to the user data consumption stats. In a chat service, client and\
    \ server are expected to send data asynchronously. The client can send text messages\
    \ to the server at any moment. On the other side, the server periodically sends\
    \ stats to the user with some periodicity that may vary. Observe the remote method\
    \ SendTxt sets the argument and responds to the streams.\n\n# Example 15.11: Definition\
    \ of a bidirectional streaming method.\n\n```\nsyntax = \"proto3\"\npackage numbers;\n\
    \noption go_package=\"https://github.com/juannanuel-tirado/savetheworldwithgo/13_grpc/streaming/example_03/chat\"\
    ;n\nmessage ChatRequest {\n  int64 id = 1;\n  int64 to = 2;\n  string txt = 3;\n\
    }\n\nmessage StatsResponse {\n  int64 total_char = 1;\n}\n\nservice ChatService\
    \ {\n  rpc SendTxt(stream ChatRequest) returns (stream StatsResponse);\n}\n```\n\
    \nFigure 15.4 depicts this communication scenario. The client starts the communication\
    \ by establishing a new stream with the server. Both ends listen to the stream\
    \ for any incoming message. Finally, both the client or server can close the connection\
    \ at any moment. In our case, it is the client who finishes the communication."
