- pgno: 128
  md: "```\nfunc Middleware(next http.Handler) http.Handler {\n\treturn http.HandlerFunc(func(w\
    \ http.ResponseWriter, r *http.Request) {\n\t// Do something before the next handler\
    \ is invoked\n\tnext.ServeHTTP(w, r)\n\t// Do something when the next handler\
    \ has finished\n\t})\n}\n// / ...\nhttp.ListenAndServe(\":8080\", Middleware(Middleware(Handler)))\n\
    ```\n\nThe code above summarizes the definition of a middleware handler. This\
    \ handler receives another handler that has to be invoked with the same Request\
    \ and ResponseWriter. This handler can modify both elements depending on its logic\
    \ and before the next handler is invoked. To apply the middleware to every request,\
    \ we concatenate it with next handlers. Because the middleware returns a Handler\
    \ we can concatenate multiple middlewares until finally invoke the target with\
    \ the expected logic.\n\n9.9 implements a basic authorization mechanism for a\
    \ server. Basic authorization is based on a header Authorization: Basic credential\
    \ where credentials is a string encoded in base64. The AuthMiddleware function\
    \ checks if this header exists, decodes and authorizes the request if it matches\
    \ Open Sesame. If any of the steps fails, the middleware sets the request as non\
    \ authorized (error 401) and returns.\n\n# 9.9: Basic authorization middleware\
    \ handler.\n\n```\n1 package name\n2\n3 import (\n4\t\"encoding/base64\"\n5\t\"\
    net/http\"\n6\t\"strings\"\n7\t\"fmt\"\n8 \\)\n9\n10 type MyHandler struct {\n\
    11\n12 func (mh *MyHandler) ServeHTTP(w http.ResponseWriter, r *http.Request)\
    \ {\n13\tw.WriteHeader(http.StatusOK)\n14\tw.Write([]byte(\"Perfect!!\"))\n15\t\
    return\n16 }\n17\n18\n19 func AuthMiddleware(next http.Handler) http.Handler {\n\
    20\treturn http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n21\t\
    header := r.Header.Get(\"Authorization\")\n22\tif header == \"\" {\n23\t\tw.WriteHeader(http.StatusUnauthorized)\n\
    24\t\treturn\n25\t}\n26\n27\tauthType := strings.Split(header,\" \")\n```"
