  md: '# CHAPTER 20

    KAFKA


    It is common for a distributed system to have a large number of services designed
    to consume information in real-time. As the number of services grows, ensuring
    the scalability and availability of data becomes a challenge. Traditionally, the
    publish/subscribe pattern has been used to delegate the consumption and publication
    of data to a third service in charge of ensuring this data is consumed by the
    corresponding subscribers as possible. Apache Kafka is a widely adopted publish/subscribe
    event platform that ensures the scalability and availability of messages for large
    scale systems. This Chapter explores how to use Go to produce and consume data
    from Kafka using third-party clients and to write our own HTTP clients.


    # 20.1 THE BASICS


    Apache Kafka is designed as a distributed platform that can span multiple data
    centres and cloud regions. Kafka brokers are accessed by clients to publish new
    data or consume it. Kafka producers and consumers work around the concept of events.
    An event is a record or message containing a key, a value, a timestamp, and optionally
    some metadata. These events are organized into topics. Topics are a logical organization
    of events. Every event is stored into a topic, in this sense, topics work like
    folders. Events are stored in the system until they reach the expiration time.


    Topics are partitioned across brokers. By replicating events that belong to the
    same topic into several partitions, Kafka ensures fault tolerance and improves
    availability and throughput. Figure 20.1 shows a topic split into four partitions.
    Every square inside the partitions (P0, P1, P2, and P3) is an event which colour
    corresponds to a different key. Depending on the replication policy, events can
    be replicated across different partitions. Normally there are three replicas of
    every event. Events with the same key are stored in the same partition and Kafka
    guarantees they are consumed in the same order they were written.'
