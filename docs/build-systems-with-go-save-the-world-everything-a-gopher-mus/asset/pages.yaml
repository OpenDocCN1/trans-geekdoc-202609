    # 15.7 INTERCEPTORS


    Interceptors are the name for middleware components in gRPC. Operations such as
    user authentication, message tracing, request validation, etc. can be done with
    interceptors. Interceptors are allocated between the client and the server data
    flow like in Figure 15.6. When an interceptor is introduced into the data flow,
    this is executed for every message and has access to all the communication elements.
    An interceptor can manipulate message metadata, for adding example authentication
    headers on the client-side, or annotating additional information about IP addresses,
    client time zone, etc.


    ![](img/c7dcb4df7215ed1d3fb76d25373be6c7_218_0.png)


    Figure 15.6: Data flow from client to server using interceptors.


    Interceptors are thought to be used for common tasks and can be reused in several
    solutions. The gRPC-ecosystem has an available collection of interceptors to be
    used42. However, the exact interceptor required for your problem may not be available.
    Fortunately, gRPC facilitates the implementation of four types of interceptors
    depending on if they are on the client or server-side and if they are designed
    for unary or streaming requests. In this section we explore and describe client
    interceptors for unary requests. Streaming versions of these interceptors are
    very similar and can be easily implemented starting from unary request versions.


    # 15.7.1 Server interceptors


    gRPC servers are instantiated with the grpc.NewServer function that receives arguments
    of type ServerOption. We can build types that implement the ServerOption to work
    as interceptors. The following lines sketch the elements required to build a server
    interceptor.'
