    A special case to consider is strings manipulation. Strings in C are usually represented
    by an array of chars terminated with the end of string character (zero). The pseudopackage
    c offers three functions to manipulate strings between C and Go.


    | C.Cstring(str) | Returns the pointer to the first character from str |

    | C.GoString(c_str) | Transforms a char* into a Go string. |

