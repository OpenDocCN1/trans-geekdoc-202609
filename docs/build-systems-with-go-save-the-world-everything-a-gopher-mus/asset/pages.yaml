  md: "```\nmessage UserRequest {\n  string user_id = 1;\n}\n\nservice UserService\
    \ {\n  rpc Get(UserRequest) returns (User) {\n    option(google.api.http) = {\n\
    \      get: \"/v1/user/{user_id}\"\n    }\n  }\n  rpc Create (User) returns (User)\
    \ {\n    option(google.api.http) = {\n      post: \"/v1/user\"\n    }\n  }\n}\n\
    ```\n\nFor every RPC method we want to expose through HTTP we must define the\
    \ path and the required HTTP method. The method Get will be served at /v1/user/{user_id},\
    \ where `user_id` corresponds to the field with the same name from the corresponding\
    \ input message. In this case, this will fill the unique field from the UserRequest\
    \ message to be sent into the body of the HTTP request. By setting body=\"*\"\
    , we indicate that a User message will be filled with all the available data from\
    \ the body. If required, single fields can be specified, for example, body=\"\
    email\" will only expect the body to contain the email field.\n\n> Remember that\
    \ the URL of a remote procedure should not be changed unilaterally once this function\
    \ is consumed by others. There are some good practices to be followed indicating\
    \ the API version in the URL. In other cases, you can define additional bindings\
    \ for the same procedure.\n\n```\nGet (UserRequest) returns (User) {\n  option(google.api.http)\
    \ = {\n    get: \"/v1/user/{user_id}\"\n    additional_bindings {\n      get:\
    \ \"/v2/user/{user_id}\"\n    }\n  }\n}\n```\n\nBefore running protoc, we must\
