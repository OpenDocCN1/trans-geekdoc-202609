  md: "Errors are very important in logs. Understanding where errors occur in a program\
    \ runtime is a crucial task for any developer. The error type is available as\
    \ a context type like shown in Example 16.7.\n\n# Example 16.7: Single error logging.\n\
    \n```\npackage main\n\nimport (\n    \"errors\"\n    \"github.com/rs/zerolog/log\"\
    \n)\n\nfunc main() {\n    err := errors.New(\"there is an error\")\n    log.Error(err).Msg(\"\
    this is the way to log errors\")\n}\n```\n\nThe point in the code where an error\
    \ occurred may not always be enough. Errors can be triggered by the propagation\
    \ of previous mistakes. In these cases, the full stack trace can be more useful\
    \ to detect where errors come from. The stack trace can be obtained as shown in\
    \ Example 16.8. Setting the ErrorStackMarshaler to the implementation offered\
    \ at pkggerrors permits the context stack() to capture complete execution stack.\
    \ The log output contains the list of invoked functions until the error was found.\n\
    \n# Example 16.8: Stack trace logging.\n\n```\npackage main\n\nimport (\n    \"\
    github.com/pkg/errors\"\n    \"github.com/rs/zerolog/log\"\n    \"github.com/rs/zerolog\"\
    \n    \"github.com/rs/zerolog/pkggerrors\"\n)\n\nfunc failA(err error) error {\n\
    \    return failB(err)\n}\n\nfunc failB(err error) error {\n    return failC(err)\n\
    }\n```"
