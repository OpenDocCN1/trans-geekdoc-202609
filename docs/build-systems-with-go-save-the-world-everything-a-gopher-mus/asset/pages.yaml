  md: "# 3.3.1 Iteration\n\nTo iterate a map we would require the collection of keys.\
    \ Fortunately, the range built-in function offers a simple solution to iterate\
    \ through all the key-value pair of any map. The rules explained for slices apply\
    \ in the case of maps. For every iteration range returns the current key and value.\n\
    \nExample 3.8: map iteration using range.\n\n```\npackage main\n\nimport \"fmt\"\
    \n\nfunc main() {\n\tsales := map[string]int{\n\t\"Jan\": 34345,\n\t\"Feb\": 11823,\n\
    \t\"Mar\": 8838,\n\t\"Apr\": 32,\n}\n\n\tfmt.Println(\"Month\\tSales\")\n\tfor\
    \ month, sale := range sales {\n\tfmt.Printf(\"%s\\t%d\\n\", month, sale)\n}\n\
    }\n```\n\n> The function range does not guarantee the same order for consecutive\
    \ iterations.\n\n# 3.4 SUMMARY\n\nThis Chapter shows how to declare, manipulate,\
    \ and iterate through arrays, slices, and maps. These three native structures\
