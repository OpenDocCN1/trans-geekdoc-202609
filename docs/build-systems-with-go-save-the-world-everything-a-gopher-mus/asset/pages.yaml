  md: '# CHAPTER 19

    NOSQL DATABASES


    The adoption of big data solutions accelerated the exploration of new database
    models. This exploration exposed the limitations of classic relational databases
    and proposed new models beyond the Standard Query Language and the entity-relationship
    model. The Apache Cassandra database is one of the most widely adopted NoSQL databases.
    Although may not seem to be the most common language to develop solutions using
    this database, this Chapter shows that Go is a perfect candidate for any project
    based on Cassandra.


    # 19.1 CASSANDRA AND GOQL


    The Apache Cassandra database is a NoSQL distributed database solution. It has
    been adopted in scenarios demanding high performance and availability, and it
    has demonstrated scalability while ensuring fault tolerance. It is not the purpose
    of this Chapter to explain how Cassandra works. In the case the reader is not
    familiar with Cassandra at all, let these lines illustrate the main differences
    between this database and classic relational databases such as MySQL or PostgreSQL.


    # 19.1.1 A brief introduction to Cassandra


    In general terms, Cassandra uses terminology we can find in classic databases.
    However, due to its idiosyncrasy Cassandra extends this terminology with additional
    concepts the reader may not be to.


    +   * Keyspaces contain tables and define several properties such as replication
    policies.

    * Tables in SQL databases, store collections of entries. However, conceptually
    a table only defines the schema to be stored. This is due to the fact that a table
    is instantiated across physical nodes with several partitions.

    * Primary key in SQL databases is a unique field that differentiates a table entry
    from the other entries. However, primary keys are specially important in Cassandra
    because they are used to define where a table has to be stored. It can be composed
    of a partition key and a clustering key.

    * Partition key defines the mandatory part of the primary key all rows must have.

    * Clustering key defines how data is sorted in a node according to one or more
    columns.

    * Rows in SQL databases are a collection of columns identified by a unique primary
    key.

    * Column is a type data that belongs to row and is defined by the schema of a
    table.


    Figure 19.1 illustrates how keys are used to distribute and sort content. The
    example table contains historic information of warning levels per user at different
    times of the day. The primary key is composed of the user_id and the time columns.
    It makes it possible to store several rows for the same user at different times.
    Moreover, we define user_id to be the partition key for this table. Cassandra
    will use the values from this column to determine what physical node must store
    this row.'
