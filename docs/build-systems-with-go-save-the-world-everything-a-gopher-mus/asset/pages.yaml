  md: "available version of module. However, our code may not use that version or\
    \ could be incompatibilities with indirect dependencies.\n\nGo uses an algorithm\
    \ called Minimal Versions Selection (MVS) to select the module to be used when\
    \ building a module [13]. This algorithm builds a dependency graph which is explored\
    \ to find the list of most recent versions that satisfies all modules' requirements.\
    \ This algorithm is used by go to fulfill the go.mod file. However, this automatic\
    \ process may not return the correct versions for your solution. In certain scenarios,\
    \ it may be required to downgrade or to keep older versions for different reasons.\
    \ Go has a list of directives that may help you to manage these situations.\n\n\
    +   - require\n\nAs mentioned above, the require directive declares a module with\
    \ a given version. If not version is set, the last one is taken. The //indirect\
    \ comment is automatically added for transitive dependencies found during the\
    \ analysis.\n\n```\nrequire golang.org/x/net v1.2.3\nrequire (\n github.com/rs/zerolog\
    \ v1.28.0 //indirect\n)\n```\n\n+   - exclude\n\nThis directive prevents a module\
    \ version from being loaded.\n\n```\nexclude golang.org/x/net v1.2.3\nexclude\
    \ (\n github.com/rs/zerolog v1.28.0\n)\n```\n\n+   - replace\n\nUsing this directive\
    \ the contents of a module can be changed by (/ or ../), this is interpreted to\
    \ be a local file. This is a good solution when we need to use modules not exposed\
    \ through the Internet.\n\n```\nreplace golang.org/x/net v1.2.3 => something.com/x/net\
    \ v1.2.3\nreplace (\n github.com/rs/zerolog v1.28.0 => example.com/rs/zerolog\
    \ v1.28.0\ngoogle.golang.org/grpc v1.35.0 => ../grpc v1.35.0\n)\n```\n\n+   -\
    \ retract\n\nThis directive indicates a version or versions of this module that\
    \ must not be used in go.mod. This may occur for example if a version has been\
    \ prematurely released or if it contains security issues.\n\n```\nretract(\nv1.2.3\n\
    ```"
