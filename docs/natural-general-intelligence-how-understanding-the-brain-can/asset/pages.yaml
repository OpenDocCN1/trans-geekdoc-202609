  md: '# Playing Lego with concepts 105


    For humans, reasoning from means to end is a basic requirement for tackling the
    complex puzzles that life throws up. How do I put up this shelf or bake that cake?
    How do I build this canoe to float, or carve that boat to shoot long and true?
    How do I express this idea clearly or solve that calculation problem? How do I
    decide where to live, whom to marry, or how to spend my Sunday afternoon?


    Recalling the definition of intelligence given by Legg and Hutter, human generality
    is expressed in an ability to solve a multitude of different problems—from baking
    a cake to winning at chess. According to this view, thus, it is by reasoning—applying
    mental processes to plan over states and outcomes—that we can consider what will
    follow from observables, such as the fact that there are eggs in the fridge or
    that the opponent has lost her queen. Reasoning about states of the world allows
    humans to devise creative solutions to stubborn problems, imagine counterfactual
    outcomes, or antici-nipate important events, even if they are unlikely or far
    into the future. Indeed, from an empirical standpoint, people who do well on lab-based
    tests that involve reasoning about verbal propositions, space, or numbers tend
    also to flourish in the real world—succeeding in school and college and at work.
    No wonder, then, that we lionize the genius of von Neumann, who could think around
    mathematical corners, or the of grandmasters of strategic games as Go and chess,
    who can anticipate the consequences of a move dozens into the future.'
