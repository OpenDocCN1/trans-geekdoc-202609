  md: 'chased to gain points. To make things even more complicated, the visual appearance
    and the functionality of the game objects change systematically over time. The
    Ms. Pac-Man is pink in levels 1 and 2, but cycles through blue and brown on subsequent
    levels, continuing to vary deep into the game. The power pellet gradually works
    for shorter and shorter periods and eventually becomes ineffective. Thus, a policy
    that is optimal early in the game will not be advantageous later.


    Deep neural networks are parametric learning systems, because they store memories
    in the model weights (or parameters), which are incrementally adjusted until convergence.
    Non-stationary environments pose a basic computational problem for parametric
    learning systems, called the *stability-plasticity dilemma*. If parameters are
    changed in tiny steps, the system will adapt slowly to change. However, if parameters
    are changed in large jumps, the system will adjust excessively—so that weights
    provoke getting of past learning (to plastic). Learning systems then need to learn
    in ways that admit retrieval of effective policies both now and in the unknown
    future.


    Imagine you are headed to the beach for a week of holiday. You might pick your
    suitcase with swimsuit, towel, and snorkel. However, if you subsequently decide
    to spend an extra week in the mountains, you will have to throw your boots, binoculars
    and raincoat on top of your already packed beachwear. This means when you arrive
    at the beach, it will be troublesome to retrieve your swimming trunks from your
    luggage—because they are buried your warm clothes. This is the basic problem that
    besets vanilla networks when they encounter tasks sequentially. When learning
    task A, it lays down memories in neural connection weights without concern for
    what might be learnt near. On later encountering task B, new learning is layered
    on top of the old—potentially rendering the original policy that solves task A
    inaccessible and jeopardizing performance. Thus, in Ms. Pac-Man, learning to approach
    ghosts after swallowing the power pellet has the potential to undo learning about
    how to avoid the ghosts in the default case. In machine learning research, this
    overwriting is called catastrophic interference. It occurs in a parametric system
    where there are many distinct minima in weight space that can potentially solve
    either task A or task B, or both tasks A and B. If task A has been learned and
    B is trained, the network has no incentive to learn a minimum for B that also
    solves, the original learning is overwritten. Over multiple task cycles, learning
    in the network oscillates from one task to the other, never mastering both—in
    a fruitless tug-of-war process (Figure 7.3).'
