    Inside Out is a whimsical film, but it raises a serious question: who controls
    the controller? The characters inside Riley’s head experience their own emotions
    and make their own voluntary choices, according to the film’s logic, they also
    have controllers in their head, who, in turn, need controllers—leading to an infinite
    regress. Similarly, PFC function to control processes has long been critiqued
    for succumbing to the homunculus fallacy—a theoretical sleight of hand whereby
    complex decision-making is ascribed to ‘little person’ (or homunculus) who enjoys
    executive powers, without providing a clear, mechanical account of how decisions
    are made.74In the world of Tom Hazy, Michael Frank, and Randy O’Reilly in a seminal
    article from 2005, we need banish the homunculus—and describe how memory and cognitive
    control actually work at the computational level.75


    Consider a popular assay of frontal lobe function called the 1-2-AX task.76 Participants
    view a sequence of numbers and letters, and the rules for responding sequential
    pairs are modified by the occurrence of numbers. For example, following a 1, participants
    must respond to any X preceded by an A; whereas in the Koechlin paradigm, actions
    must be selected after combining information from an (shorter) inner loop (was
    the last letter A or B?) and a (longer) outer loop (was the last digit 1 or 2?).
    This paradigm matches our conception of task as a hierarchical selection problem
    that unfolds in time.


    A natural choice of computational tool for solving this type of problem is the
    recurrent neural network. In fact, although an RNN can learn to solve the 1-2-AX
    task by multiplexing information about the last letter and the last in the recurrent
    weights, training can be slow and unreliable. A more effective solution would
    associate each state with an action (via the readout weights), but also with internal
    operations that allow it to be written to (encoded), or read from (retrieved),
    a separate memory store.


