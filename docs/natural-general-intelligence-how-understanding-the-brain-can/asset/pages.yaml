    # 2.2 Lab smarts and street smarts


    In 1904, a year after von Neumann was born, the British psychologist Charles Spearman—fresh
    from his doctoral training with Wilhelm Wundt in Leipzig—set out to study the
    structure of human mental ability. He was equipped with newly minted statistical
    tools for assessing the strength of correlation among variables and quantifying
    the latent structure of data. Assembling cohorts of schoolchildren from the local
    village, he first obtained estimates of their ''cleverness in school'' and ''common
    sense out of school'' via a series of (rather questionable) interviews. Next,
    he subjected the children to some homegrown psychophysical measurement, testing
    their sensitivity to changes in pitch, brightness, and weight. The remarkable
    result—replicated ad nauseam in the intervening century with a wide range of standard
    cognitive variables—is that measures (cleverness, common sense, and perceptual
    sensitivity) were all positively correlated with one another—they lay on what
    he called ‘positive manifold’. Spearman realized that this implies the existence
    of a single factor for characterizing human abilities. He called this factor g
    and argued that it constituted a measurement of general intelligence.


    Spearman''s positive manifold implies something fundamental about the human mind:
    if you are at good one thing (such as alpha), then you are


