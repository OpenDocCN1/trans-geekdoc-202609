    But of course, AlphaGo is merely a machine, and its choice of move is based on
    a probability calculation. AlphaGo and DQN master their respective domains using
    powerful computational tools engineered by AI researchers.


    When we examine Atari, we find that they are very different. Atari is hard because
    of the dimensionality of the sensory signals (input complexity), whereas Go is
    hard because of the rich, latent structure of the game (strategic complexity).
    As we discuss below, the natural world exhibits both sorts of complexity, and
    an intelligent agent needs to be better at both challenges. This remains a long-term
    ambition for AI.


    Like other video games, Atari requires to be rapidly coordinated high-dimensional
    visual inputs (in its native form, the game controller executes a strategy of
    210 × 160 pixels that run at 60 Hz—a very high throughput signal). Even when downsampled,
    the world of Atari is complex and fast-moving, and many games require an Atari
    to be nimble manipulated to dodge monsters, harvest treasure, or fire lasers at
    enemies. The AI has to process the game states—a vector of pixel values—into objects
    and background, static and dynamic entities, self and friend and foe. It has to
    anticipate how near-future events (shooting an alien or losing a life) will impact
    the game score it is trained to maximize. While Atari has high levels of input
    complexity, it does not really have much in the way of strategic complexity. For
    the most part, the policies that lead to success do not rely on calibrated tactics
