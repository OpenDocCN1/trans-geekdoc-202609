  md: '# Perceptrons in space 115


    The perceptron is a model of a neuron, not of an entire brain. It embodies a very
    simple idea: that outputs should be a linear weighted sum of inputs. Imagine you
    are faced with a tricky decision choosing a rental apartment based on various
    attributes: square footage, distance to the city centre, and monthly rent. Depending
    on your preferences, some factors might carry more weight than others. For example,
    if you are on a tight budget, cost is the most critical variable. A sensible way
    to make your choice is to add up the factors, weighted by their relative importance
    to you, and compare the result to a numerical criterion (accept vs reject). In
    linear algebra, this is achieved by taking the (inner) product of an input vector
    x and a weighting vector w, before binarizing the output according to a threshold.
    This is exactly what a perceptron performs.


    Rosenblatt had two seminal intuitions. The first was about how the perceptron
    weights could be adjusted by experience, permitting the network to learn by itself.
    Rosenblatt used the relationship between a desired and an observed output to adjust
    the weights w fractionally in proportion to the inputs x, which repeated in small
    increments, led the network to converge towards a desired outcome.¹¹ For example,
    imagine that you show a list of apartments (observations), along with your decision
    to rent or not (supervision signals). With enough examples, should be able to
    infer the relative weights you place on size, location, and region. This allows
    me to make a good stab at predicting whether you will like any future apartment
    or not.


    The second was that many perceptrons could be wired together in series, like banks
    of neurons are connected in the brain, to solve complex problems. Rosenblatt speculated
    that whilst the perceptron was simple, its potential was huge—because it was able
    to learn entirely by itself and there was virtually no limit to what it could
    do if sufficiently scaled up. Perhaps unwisely, he enthoused about his far-flung
    hopes to journalists of The New York Times, blasted into space and to explore
    other planets in our stead.¹² The hype that accompanied his claims has so greatly
    undermined Rosenblatt’s credibility, although it is clear that he was actually
    more interested in building a model of biological intelligence with AI.¹³


    +   ¹¹ In fact, unlike other methods, Rosenblatt''s approach did not have convergence
