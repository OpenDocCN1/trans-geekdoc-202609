    Rosenblatt''s ambitions for the perceptron were misplaced. Whether he was wrong
    about the principle—that learning systems can be scaled towards superintelligence—is
    still controversial. But everyone agrees he was wrong in practice, because the
    perceptron suffers from a fundamental limitation. Its integration rule is linear
    (the output is a weighted sum of inputs), and the network is limited to learning
    mappings between inputs and outputs. This grossly limits the range of problems
    it can solve.


    To understand why, consider a perceptron that receives a scalar input. This might
    denote, for example, the size of an object compared to a standard. If the task
    is to decide whether the object size is *greater* than the standard, then this
    can trivially be solved by a linear network, which simply has to threshold the
    value after appropriate weighting.¹ However, if the objective is to indicate whether
    the object is *more similar to the standard* than some criterion, then the perceptron
    will fail. Because this similarity is a non-linear (quadratic) function of the
    input value that exceeds the standard becomes small again.¹⁵ Thus, there exists
    no weight that will allow a linear mapping from input to output. The implications
    of this tiny example hold in the more general case. Unfortunately, most of the
    problems that Rosenblatt imagined a neural network would be able to solve—such
    as labelling objects or translating between the world''s languages—involve non-linear
    mappings, which cannot be learned by his perceptron.


