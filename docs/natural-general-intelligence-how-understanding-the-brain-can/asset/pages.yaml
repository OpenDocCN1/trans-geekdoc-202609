    # 1.3 Mercurial optimism


    The serious academic pursuit of the thinking machine began in universities and
    corporations in the 1940s and 1950s. Just as Turing was writing his seminal paper,
    mathematicians, statisticians, and a new breed of scientists were beginning to
    exchange ideas with physiologists and psychologists about the principles of intelligent
    thought and behaviour. Looking back now, from the vantage point of the twenty-first
    century, we can see that the history of AI research is one of mercurial optimism.
    Giddy excitement about the prospect of thinking machines has arisen in multiple
    waves since this initial era, each falling deflated as reality failed to live
    up to its most exotic promises.


