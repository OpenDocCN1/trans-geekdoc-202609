  md: '# 1 Turing’s question


    > > I propose to consider the question, ‘Can machines think?’ This should begin
    with definitions of the meaning of the terms ‘machine’ and ‘think’.

    > Turing 1950


    #  1.1 The ghost in the machine


    One day in 1809, Napoleon Bonaparte—Emperor of France and one of the greatest
    military commanders in history—lost a game of chess. According to eyewitness accounts,
    he was not pleased. Tipping over his king, he swept the chess pieces to the floor
    and marched out of the room in Schönbrunn Palace, Vienna, where the contest was
    being held. Despite his undisputed prowess on the battlefield, Bonaparte was actually
    a rather mediocre chess player. His frustration was perhaps understandable. It
    was the third game in a row he had lost—and his opponent was not even human¹


    Bonaparte had just been bounced by the Mechanical Turk—a chess-playing automaton
    that toured Europe in the late eighteenth and nineteenth century, chalking up
    victories against nobility, statesmen, and asserted sexophiles. The Turk prompted
    wild speculation among Europe’s intelligentsia as to how a machine could possibly
    have mastered the game of chess. On a later visit to North America, it was witnessed
    by the writer Edgar Allan Poe, who claimed that:²


    Perhaps no exhibition of the kind has ever solicited so general attention as the
    Chess-Player [...] We find every where men of mechanical genius, of great general
    acuteness, and discriminative understanding, who make no scruple in pronouncing
    the Automaton a *pure machine*.


    However, the Turk was not a pure machine. Only humans played truly expert chess
    until the 1990s, when computers approached and surpassed


    ¹ See (Levitt 2006) and (Winter 1998).

    ² See (Poe 1836).'
