    Consider the Atari game of Pong. Playing in 2D, two opponents control a paddle,
    each trying to bounce a ball past the other. Obeying the physics of the game,
    the ball flies in a straight line between the sides of the screen. Imagine trying
    to predict where the ball will land from a short segment of game play. If the
    duration of the glimpse is a single frame, the ball is frozen in time, and you
    can''t know where it will land—or even which it is headed. With two successive
    frames, you can make a rough and guess as to move the paddle. However, for a precise
    estimate of where the ball will end up, you need to see several frames in series
    and to integrate these observations to estimate its trajectory. This benefit of
    integration over time is greater in the real world where sensory signals are highly
    noisy—subject to random variation too complex to be modelled. For example, the
    behaviour of B. F. Skinner famously taught pigeons to play a real-world version
    of Pong by shaping them gradually with rewards (Figure 7.7). In Skinner''s version,
    the ball can move in unpredictable ways due to the unevenness of the table surface,
    or buffeting by a gust of light or wind that was invisibly applied by a devious
    pigeon opponent. When a signal is noisy, it can be encoded more precisely by sampling
    and averaging independent estimates.^45


    If DQN learned to map single frames of Pong onto actions, it would probably flourished,
    because each frame carries virtually no information about the direction, in which
    the ball is headed. In practice, however, DQN was able to achieve 132% of human
    expert performance. This is because each timestep, the researchers fetched the
