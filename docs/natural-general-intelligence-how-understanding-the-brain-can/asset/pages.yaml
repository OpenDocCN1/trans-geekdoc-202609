    The second property of hierarchical task representations is their potential for
    composition. Composition means tasks that are composed of subtasks that can be
    completed independently, and often in order. For example, when arranging a short
    break in a foreign city, you can book transport before searching for a hotel,
    or vice versa. When making a baked Alaska, you can prepare the ice cream and sponge
    cake in one order, as long as they are both ready in time to coat with stiffly
    whipped meringue before popping your masterpiece in the freezer. Composition is
    important because it allows new tasks to be solved on the basis of existing skills.
    For example, if I know how to ride a bicycle with no hands and I know how to play
    the trumpet, I might be able to do both at once—even if I have never practised.
    It is our ability to compose new actions from existing building blocks that us
    to generate entirely new news every time we open our mouth. In the words of Wilhelm
    von Humboldt, composition allows us to make infinite use of finite means.⁶⁴


