    Go is hard for precisely opaque reasons: its immense strategic complexity. It
    is true that the game is deemed hard to solve because the number of possible board
    states—a whopping 3⁶¹—but the environment itself is actually quite simple, with
    highly constrained semantics. It has low-input complexity. Each position on the
    19 × 19 grid is associated with one of just three possible states (occupied by
    white or black, or empty). It is so simple that if we were ever be visited by
    intelligent life from elsewhere in the galaxy, we might well be able to play Go
    with—as they would in all likelihood discovered it. 53 In fact, the environment
    is itself simple that the planning algorithm—MCTS—was able to operate over a model
    of the world, one for which the consequences of each move could be flawlessly
    imagined all the way to the end of the game. This feat would be wholly impossible
    at Atari. Instead, of course, Go is hard—fiendish hard—because each move can have
    subtle consequences that ripple down the game, determining the outcome of future
    territorial battles. These consequences are very hard to foresee, and yet often
    decisive for victory, meaning that (unlike Atari) each move demands extremely
    careful long-term planning. Thus Go has great strategic complexity.


    Both Atari and Go were first solved with a class of machine learning method known
    as reinforcement learning (or RL). In RL, the agent learns to behave in a way
    that maximizes an externally administered reward signal, such as the number of
    points achieved in a game. However, because they present different sorts of challenges,
    Atari and Go require quite different computational solutions.54


    DQN uses model-free RL, by learning from pixels to value in its neural network
    parameters. The output of this mapping is a representation of how good or bad
    each action might be, given the current state. This is called a ‘Q function and
    is a central object for RL methods. DQN was remarkable because it was the first
    time a deep neural network had been successfully used to learn a Q function for
    complex behaviour. Using a neural network to learn the Q function allows the network
    to exhibit reward-maximizing behaviours in environments with high input complexity,
    such as Atari, because the neural network can map onto board classes of inputs
    (e.g. monster on the left) (flee to the right). However,


