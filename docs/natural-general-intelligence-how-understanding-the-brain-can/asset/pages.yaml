    in the London borough of Richmond (Figure 6.1). Its gardens contain a famous trapezoidal
    hedge maze that has delighted and frustrated royalty and commoners for more than
    300 years. When it was planted in 1700, the maze included a radical orientation:
    paths that branch off confusingly towards ends, so that the goal is only reached
    by making the correct turn at each fork⁷ Solving Hampton Court maze is precisely
    the sort of problem that RL agents are able to tackle. Imagine that I tasked you
