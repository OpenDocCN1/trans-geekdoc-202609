  md: '# The key to exploration 203


    a probability of $1–\epsilon$, and otherwise takes a random action. It might seem
    strange to deliberately bake randomness into the agent policy. However, the reciprocity
    between actions and observations in an MDP means that it is essential for an RL
    agent to be able to explore (gather information), as well as to exploit (harvest
    rewards). Exploration allows it to learn about different states than it would
    never encounter by exploiting rewards. Conversely, consider a greedy agent that
    slavishly exploits the action with the highest expected return. If deterministic
    pursuing a greedy policy yields the value function unchanged, the agent will get
    stuck in an infinite loop, endlessly producing the same fixed action. To maximize
    reward, an RL agent needs to trade off exploration and exploitation.


    In biology, proneness to exploring the environment is a ubiquitous phenomenon.
    Even the bacterium—a single-celled organism—switches between two behavioural modes
    that resemble exploiting and exploring. Bouts of chemotaxis, during which it swims
    upwards towards preferred chemical conditions, are interspersed with phases of
    tumbling, in which their behaviour is erratic and prone to randomly changing direction—a
    bit like an RL agent displaying an $\epsilon$-greedy policy. Similarly, in the
    tiny nematode Caen elegans, the spatial scale of the random foraging is adapted
    optimally to the concentration of resources so that if no food is found on a local
    search, the animal switches to a more global exploration strategy encompassing
    a wider area. Recall that in Thorndike’s puzzle boxes, the cat did not sit quietly
    and wait for release—it flailed around with frenetic energy satisfying a drive
    to explore every possible means of escape from the device. Exploration is evidently
    critical to organisms of many different shapes and sizes.$36}$


    For animals with larger brains, exploration policies can be quite sophisticated.
    In laboratory studies, the mechanisms by which exploration is traded off exploitation
    have been extensively studied using a simple paradigm, called a multi-armed bandit
    problem, in which players choose two or more stimuli or actions that pay reward
    with an unknown probability.$37$ When the payout probability is unknown, participants
    are obliged to trade off the reward harvesting against gathering of information
    about the alternate option. Otherwise, they get stuck with a policy of drawing
    rewards from the suboptimal alternative. This risk grows if the rewards are non-stationary,
    with probabilities that drift or jump over time.


