    a shortcut sometimes known as wireheading in the AI community.^55 When animals
    are given the opportunity to wirehead, they tend to lose all interest in everything
    else. This was the case for the rats in Olds and Milner’s experiments, which ignored
    offers of chow and water spent all day tirelessly pressing the pleasure button.
    Humans have invented ways of wireheading too, using drugs of abuse to directly
