    that grandmasters display when competing for world titles in StarCraft or Go.
    This is the bewildering paradox at the heart of AI research: that many humans
    find impossibly hard to be relatively simple to solve with enough computation,
    whereas the basics—performing mundane chores and dispensing common sense advice—are
    beyond the reach of even our most sophisticated current AI systems.


    Since the 1950s, the vision for general AI has ebbed and flowed. In each era,
    the force was an implicit theory of the computational process that makes people
    smart. In the age of classical AI, research was framed by the positives of victorious
    philosophy, in which the critical human faculty was the ability to use formal
    systems to work out what was true. The early pioneers fashioned AI in the image
    of early-century luminaries like Russell and Frege, who sought to rebuild systems
    of thought in the language of logic. By the 1970s, it began to dawn that most
    humans are, in fact, quite unreliable logicians.\¹ Instead, the focus shifted
    to our privileged ability to communicate in natural language—a highly structured,
    generative, opened system for sharing ideas. Over the next decades, many AI researchers
    instead tried to ground intelligence in the human capacity for drawing inferences
    using semantic knowledge. Serious attempts were made to build systems with hard-coded
    facts and inference engines, or clearer heuristics that make planning tractable
    in very large search spaces. This led to the advent of expert systems and the
    de\u00e9s ofign of algorithms such alpha-beta search, which drove the success
    of Deep Blue at the end of the twentieth century.


    In the modern era, deep learning has come to the fore. Deep neural learns complex
    discriminative or generative functions from training data and transfer performance
    to novel settings. With the rise of learning, the focus has shifted. Deep learning
    models melt computation and memory, so that the power of their inference is enmeshed
    with their knowledge of the world. To handle novel settings, neural networks need
    to grasp information in the most general way, which means presenting maximally
    invariant concepts. Thus, the prevailing vision of human intelligence has turned
    again on its axis, and now it seems that the signature human mental ability is
