  md: '# 8.2 Inductive biases


    AI researchers and cognitive scientists continue to be divided by the question
    of whether knowledge obtained from the study of natural intelligence is relevant
    for building AGI. This issue and the clash of views it provokes have been discussed
    across this book. Should the computations in our AI systems be hand-engineered
    by the researcher or learn from experience? Should we populate the minds of our
    agents with dedicated constraints (or *inductive biases*) that are tailored to
    solve the problems that the agent is likely to encounter? Alternatively, should
    we take simplicity as our mantra and search for a single, undifferentiated principle
    or algorithm that can be scaled to massive proportions with galaxies of parameters
    and gallons of computation? In the modern era, the neurosymbolic architectures
    that IBM has used to compete in college debating championships and TV shows are
    most emblematic of the former approach. The giant foundation models for natural
    language and image processing—in which a single computational tool, the transformer,
    is replicated millions of times—are the epitome of the latter.


    As we saw, AI research was conceived in the former tradition, but history has
    gravitated towards the latter. Over the past 10 years, the ethical winds have
    blown powerfully towards systems, with minimal inductive biases. We want AI systems
    that learn about verbs and faces, but the prevailing view is we should not build
    modules that are wired to process the structure of sentences or arrangements of
    anatomical features. Instead, it is claimed, we need maximally generic algorithms
    that allow agents to acquire computation for themselves by learning from data.
    Knowledge about faces and verbs *emerge* during training, but so could know tools
    about adjectives and or about buildings and declensions. These unstructured systems
    offer not only the virtue of simplicity, but also the promise of maximally general
    solutions. This promise has paid off in practice. For example, after eye-popping
    successes in the domain of NLP, the transformer was rapidly generalized to multimodal
    data (mapping from text to image, and back again). By contrast, IBM’s DeepQA system
    will never do more than answer questions—because it is tailored exclusively to
    that task. This motivates the pursuit of maximally neat, simple, and general solutions
    espoused by Sutton’s bitter lesson.


