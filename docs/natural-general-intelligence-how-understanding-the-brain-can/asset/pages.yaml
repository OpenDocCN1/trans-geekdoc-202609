  md: '# The eligibility of experience 219


    In this chapter, we will consider how memory systems contribute to intelligence.
    In biological agents, and especially in humans, memory has a complex, modular
    structure. As we shall see, different memory processes have evolved to solve specific
    computational problems that are posed by natural environments. Building on the
    RL paradigm, we will show how the elaboration of memory systems in deep RL agents
    can allow them to solve the same problems. We focus on three well-known computational
    challenges.


    The first is the problem of data efficiency. Deep RL agents are very inefficient.
    For example, DQN was trained with 50 million frames of each game, equivalent to
    38 days of continuous play in the real world. The authors of a landmark paper
    discussing DQN''s significance for biology point out that it is possible for a
    human to approximate the level achieved by the expert baseline with 5 to 10-minute
    practice, highlighting the remarkable disparity in sample efficiency between humans
    and deep learning agents. Understanding how to build agents that learn efficiently—including
    that learn effectively from single experiences (one-shot learning)—remains a key
    outstanding problem for the field.


    The second is the problem of lifelong learning. In 2015, news outlets around the
    world reported that a female pupil named Penelope Sitenei was attending the local
    school in the Rift Valley, Kenya, hoping to read and write. Nothing unusual about—except
    that this remarkable student was 90 years of age, and six of her classmates were
    her great-grandchildren. The case of Ms Sitenei reminds us that humans are able
    to learn continuously over the lifespan, from our earliest months right through
    to a venerable old age. Unfortunately, the same is not true of deep neural networks.
    When coming across a novel task or context, deep networks learn in ways that catastrophically
    overwrite the knowledge they have learned previously. It is as if you learn to
    cook lasagna, you suddenly forget how to speak French, or when learning to play
    tennis, you forget how to dance the tango.


    For this reason, although in the original paper, there was one DQN architecture,
    there was a different model for each game. The model trained on Pong was unable
    to play Breakout—the authors were obliged to reinitialize DQN''s weights for each
    game. Effectively, the agent had the luxury


