  md: '# Maps in the mind 127


    This physical resemblance is not always expressed at the level of local patches
    of pixels—for example, if viewed through a small aperture, roses, daisies, and
    spaniels all seem quite different. However, natural scenes are themselves hierarchically
    structured. Shapes are made of lines and edges, objects are ensembles of shapes,
    and scenes are arrays of objects.${34}$The natural sensory hierarchy affords many
    levels at which images can resemble one another. After accounting for the high-level
    interactions among features, such as the common juxtaposition of stem and petals,
    roses are more similar to daisies to spaniels.${35}$We can see this by looking
    at the RDM computed from patterns of activation in the deeper layers, which is
    structured in a semantically coherent way, even before the network has been trained.
    By wiring up the network to gradually expose these interactions through successive
    computation, activity in deeper processing units reflects the similarity among
    higher-level concepts such as flowers and dogs.


    In both brains and CNNs, how much of the connectivity needed to achieve this is
    present at birth. Biological sensory systems start in life with a hierarchical
    wiring diagram created by the genes, which mandates that coding for an adjacent
    reality territory project to common neural targets in the subsequent layer. Thus,
    neurons in the reaches of the visual system have a wider view of the visual field
    by virtue of all the lower neurons that project to them, just like a general has
    the broadest overview of the battlefield from the information that percolates
    up the military hierarchy, bypatchespatches colonels, majors, and captains. In
    CNNs, a similar pattern of converging connectivity (and expanding reactivity)
    is also crafted directly into the network by the researcher. It is a core architectural
    motif that each layer receives inputs from subset of units in the layer below
    adjacent local receptivity, so that like biological systems, a CNN represents
    a spatial hierarchy of filters.


    For systems wired up in this way, visual recognition resembles a well-known parable
    in which blindfolded men attempt to recognize an elephant. Each man receives information
    about a distinct body part—the trunk, the ear, the leg, or the flank—and confidently
    (but wrongly) infers that the object is a snake, a fan, a tree trunk, or a wall.
    The representations of early visual neurons are like the reports of these men:
    they signal the parts of an object but fail to grasp the whole.


    In fact, early models imagined vision literally constructing mental objects from
    geometric primitives (Biederman 1987), like proponents of symbolic AI believed
    that reality was built from AND, OR, and NOT.


    Except perhaps when viewed from a very unusual angle. Images with unusual data
    sets might not be the case for connectionist models, in which the inputs *rose,
    daisy,* and *spaniel* are orthogonal (non-overlapping) one-hot vectors, so they
    were all equally unlike, obliging the network to learn structure from supervision,
    and not the inputs.'
