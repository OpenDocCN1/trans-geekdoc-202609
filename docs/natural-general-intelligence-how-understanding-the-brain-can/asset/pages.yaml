  md: '# 20 Turing''s question


    Image classification, speech recognition, and machine translation are important
    domains with considerable commercial application, but they are all narrow problems.
    In order to build an agent with general capabilities, we need to use neural networks
    to grandeur problems—those the pioneers of AI research in the 1950s had in mind.
    We can teach a neural network to talk to us in natural language, like Turing imagined?
    Can we build a general problem solver that learns without any human intervention,
    and can be applied to multiple domains—the dream of early AI researchers?


    In the next sections, we discuss some such systems—and ask whether, by Sutskever
