- pgno: 22
  md: '# 10 Turing''s question


    optimized to match the recorded behaviour of humans or experimental animals as
    closely as possible. Psychological models are thus constantly reethered to empirical
    data by this fitting process.^17 Turning around our bandit task example, the model
    learns from the feedback (reward) given to observed choices, irrespective of which
    bandit it would have chosen. By contrast, in AI research, it is neither possible
    nor desirable to provide guards for agent behaviour using empirical data, and
    so agents are unrolled in the environment—they are left to their own devices,
    suffering the consequences or reaping the benefits of their own actions. This
    makes the challenge of modelling and understanding behaviour much harder.


    These three challenges—end-to-end learning, scale, and untethering—highlight the
    divergent goals of the two fields. AI researchers typically seek to meet a performance
    goal, such as reaching state-of-the-art performance on a benchmark challenge,
    whereasscientists are typically concerned with enhancing the goodness of fit of
    their model to human or animal data. Paradoxically, the pursuit of building agents
    that can learn for themselves in complex, naturalistic environments, without the
    constant guiding hand of the researcher, is leading to the beginnings of an integrated
    theory in AI research where the ingredients take the form of specifications for
    memory architectures, attentional constraints, perceptual priors, compression
    principles, and planning algorithms.


    One example is a class of agent that benefits from a world model for perception
    and memory, as well as a separate module for control. For example, in one agent,
    a self-supervised deep neural network learns to extract high-level features from
    quasi-naturalistic high-dimensional data such as a video, a recurrent neural network
    learns to predict the future in the latent space of abstract representations,
    and a controller learns a policy using tools from RL. This type of architecture
    rises to the thorny challenge of fitting the components of a brain together into
    a single, integrated system for neural computation. Figure 1.3 shows the architecture
