    or even slower marathon runner. We can think of a compositional theory of thought
    as forming concepts from the ground up, similar to a car or a spaceship that might
    be built from a simple set of tiles, plates, and bricks in a construction toy
    like Lego. Compositionality is a powerful principle with the potential to endow
    computation with great versatility, flexibility, and expressiveness.


