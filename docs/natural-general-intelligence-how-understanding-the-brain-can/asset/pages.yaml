    The theme de Waal''s book is that every animal displays its own unique form of
    intelligence, adapted to its goals and environment. Humans are blind to the intelligence
    that other animals display. With typical human exceptionalism, we tend to recognize
    animals as smart only when this claim fits with our own anthropocentric vision
    of what intelligence entails. We struggle to understand the politics that unfold
    in a community of orangutans, we are perplexed by the way dolphins play while
    hunting, and we cannot fathom the principles of collective organization that allow
    a colony of termites to build megastructures a thousand times their height. Thus,
    psychologists are skeptical that animals can form abstract concepts, and whether
    they strategize, plan, or think creatively—because they assume that animals equipped
    with these skills will display them in the exact same way that people do.


    We fail to recognize the intelligence of other species because we do not share
    their umwelt. The concept of the umwelt was developed by the biologist Jakob von
    Uexkill in the twentieth century. It refers to the internal model by which an
    animal understands the world. An animal depends on its environment, its embodied
    form, its desires and goals, and its interactions with consciousness. Agents with
    different bodies, habitats, and social structures struggle to understand one another.
    This is why your cat looks at you with disdain, why you probably haven''t persuaded
    your dog to play hide-and-seek, and why zoo animals occasionally eat their keeper.
    It is also the base of the philosophical argument that we cannot understand what
    it is like to be a bat, or if a lion could speak, we would not be able to understand
    it..40 Even humans from different societies struggle to understand each other,
    which is, of course, why Western psychologists have historically demeaned the
    intelligence of cultural groups living outside of their own WEIRD enclave.


    If we ever build AI, it will have its own umwelt. This umwelt will be moulded
    by the information provided to its sensors, its action space, the structure of
    its world knowledge, the organization of its memory, the nature of its goals,
    and how it is motivated to act. For AI researchers, there are a vast number of
    ways in which these variables can be specified. One important consideration is
    that we are not attempting to build AGI just to satisfy our scientific curiosity.
