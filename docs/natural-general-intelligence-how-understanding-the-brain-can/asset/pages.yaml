    Build machines with their own motivations, AI researchers have borrowed a concept
    from control theory known as the *Markov decision process* (or MDP).⁶ An MDP is
    a mathematical tool for quickly specifying the dynamics link an environment, an
    agent, and an objective. In the context of RL, it provides the minimum information
    needed to unambiguously specify how an agent could and act, via four mathematical
    objects, denoted by the states S, actions A, transition function P, and reward
    function R. The states, actions, and transition function specify the scope of
    the agent''s behaviour and how it affects the world. The reward function describes
    the agent''s objective, in the form of numerical rewards received for achieving
    certain states. Adopting this framework allows us to cleanly specify a goal for
    the AI researcher: to train the agent to maximize rewards—and to meet the objective
    specified by the environment.


