    memories, that both tasks can be retrieved in tandem—learning a minimum in weight
    space that satisfies both objectives. Understanding how to achieve this is a whole
    subfield within machine learning, referred to as the domain of continual learning.
    It asks how we can build agents that learn continually across their lifespan,
    like the admirable Ms Sitienei was able to.


    The problem of continual learning has inspired many creative solutions in AI research.^29
    Focus on how to allocate new memories to network weights in a way that minimizes
