    *Trainspotting* knows, this rarely ends. On the other hand, a completely fixed
    intrinsic reward function being restrictive, unless it happens to be tailored
    to demands of the environment. In the natural world, it seems probable that intrinsic
    reward functions are prescribed, but partly malleable—leaving room for us to learn
    what we like. Presumably, this is why temperaments, proclivities, and preferences
    are, at least, shared within socially defined groups, and why we can acquire new
    tastes across the lifespan, like learning in adulthood to enjoy dissonant music
    or the bitter taste of marmalade.


    Finally, intrinsic rewards might be specific or generic. For example, humans have
    evolved some biases towards intrinsic rewards that are tailored to the requirements
    of our evolutionary history as foraging primates: children, for example, we have
    a strong tendency to accept sweet-tasting foods and reject bitter ones, and we
    tend to find hairy spiders scary and koala bears cute. Monkeys who have never
    seen a snake before are nevertheless terrified of wriggly animals with swarthy
    skin, and cats leap in terror on seeing a roughly snake-shaped object such as
    a cucumber, to the amusement of millions of YouTube viewers. The most useful intrinsic
    reward functions are those—like a thirst for knowledge, an imperative for control,
    or a drive to explore—which are not tied to specific sensory states.


    As humans, many facets of our behaviour betray the ways in which intrinsic rewards
    are computed. For example, we engage enthusiastically in activities that can be
