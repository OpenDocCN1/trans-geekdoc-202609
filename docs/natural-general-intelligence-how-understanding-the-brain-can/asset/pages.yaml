  md: '# The structure of knowledge


    from the retina,³¹ where neurons respond preferentially to basic elements of a
    scene, as oriented edges or texture primitives, within a tightly confined spatial
    window. Then, one might fire to a contour tilted at 45° in its preferred aperture,
    and but not to a vertical edge, whereas another neuron might respond in a converse
    fashion. At subsequent stages of processing, neurons prefer simple shapes and
    rudimentary objects; delving deeper into the temporal lobe, they fire to complex
    stimuli such as cars, faces, animals, or entire natural scenes, irrespective of
    where they occur in the visual field. These are the temporal lobe regions where
    intracranial stimulation provokes mindbending hallucinations of people and places
    that materialize from nowhere in the middle of the operating room.


    The coding patterns formed in deep CNNs to label images obey a similar principle.
    Early layers fire for tilt and spatial frequency, akin to those in V1, deeper
    in the network, we observe units that code for high-level categories and concepts—just
    like in the primate stream. For example, reverse engineering the selectivity of
    CNN neurons identifies that prefer faces, or alphanumeric characters, even though
    these labels are not in the ImageNet dataset on which they were trained.³² means
    that CNNs learn, from natural scenes alone, a hierarchy of generality allows them
    to make both coarse and fine distinctions, acquiring visual cues that allow them
    to lump and split the world according to semantic necessity—just like biological.


