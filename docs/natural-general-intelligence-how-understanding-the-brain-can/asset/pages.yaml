  md: '# The value of action


    designing an agent that could reliably find its way to the exit—one that could
    solve Hampton Court maze. How would you begin?


    AI researchers would answer that you need to formulate the problem as an MDP,
    and then apply one of the many computational solutions to RL problems developed
    over recent decades. To specify the maze as an MDP, we need to define states,
    actions, transitions and rewards. The states are the locations that make up the
    environment. We might define these as discrete positions in the maze, for example
    in allocentric coordinates. The actions constrain the scope of agent behaviour.
    For simplicity, we might assume that our maze-solver move forward, backward, and
    turn left or right. Finally, the transition function determines the consequences
    of action. In a navigation task, if I move forward, advance; if I move backward,
    I retreat. At a T-junction, a leftover move takes down one branch, and a rightward
    move down the other. The transition function takes a state and action as inputs
    and returns the next state that will be observed. Combining these elements, the
    MDP is a dynamic process that unfolds in discrete time. In each step, it controls
    the interaction between agent and environment—the agent observes a state and chooses
    an action; transition function dictates its consequences, and thus the next state
    experienced by the agent.


    To finalize the problem specification, however, we need to define the objective.
    In an MDP, this is the province of the reward function, which provides positive
    or negative reinforcement upon attainment of designated states. If the goal is
    to exit the maze as quickly as possible—like a tourist in desperate need of a
    cup of tea—then we might (for example) specify a reward of 100 for reaching the
    exit, and a penalty of –1 elsewhere. The goal of the agent is to learn a policy
    that maximizes the reward obtained from this function. the best policy is to minimize
    the number of steps (each incurring a penalty of –1) prior to reaching the exit—in
    order words, to leave the maze the shortest path. We might say such a policy solves
    MDP.


    The basic objective needed to solve an MDP is known as a value function. The value
    function is the subjective counterpart to the reward function. The reward function
    is given by the environment; the value function is computed by the agent. The
    reward function lives in the world; the value function lives in the brain. The
    reward function is part of the problem; the value function is part of the solution.
    The value function encodes the subjective worth of each state in the environment
    (or state–action pair). How good is it


