    knowledge.


    Pylyshyn’s proposal is that a proper project of cognitive science is the study
    of these two processes. Intelligent agents should both know and think. Humans,
    for example, in infancy by forming internal representations of things that exist
    in the external world, and continuing generalizable knowledge about objects, categories,
    and concepts across the lifespan. As we mature, we acquire the ability to reason
    and plan by manipulating these representations through inference and mental simulation.
    As adults, we can combine these two processes and are able to think about things.


    Pylyshyn is also presently, gesturing to the central problem in AI research today,
