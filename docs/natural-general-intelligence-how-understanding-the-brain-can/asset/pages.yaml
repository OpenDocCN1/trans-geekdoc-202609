  md: '# The polymathic principle 37


    However, this approach has an important limitation and it is one that cuts right
    to the heart of our psychological theories of intelligence. Imagine defining a
    generality factor—let us call it $k$—that indexes how many distinct tasks an agent
    can solve. We deem a narrow AI system like Deep Blue to have $k=1$, whereas AlphaZero
    can play expert Chess, and Shogi has $k=3$. Naively, we might even choose a threshold
    of generality that approaches the number of tasks a human can perform, as $k=1000$,
    and deem AGI reached when that number has been attained. Thus, if our testing
    is sufficiently comprehensive, we might claim that our mission is accomplished
    when a single agent can read the master fulgum of tasks.


    However, the notion of general intelligence implied here is very unsatisfactory.
    Critically, it offers no guarantees that an agent will also solve tasks lying
    outside the horizon given by $k-k+1$. If I had access to all measures of computation,
    I could even build a ''general'' system by chaining $k$-specific (narrow) architectures
    and training a simple controller to switch between them (or otherwise tailoring
    the training regime to meet the exact demands of the $k$ tasks in the suite).
    Nobody is particularly interested in building such a system, which would not be
    of much at solving anything beyond the test suite that was designed to measure
    its prowess.


    This problem is well known in machine learning research. It is related to a fundamental
    indeterminacy principle, often known as Goodhart''s law—that when a measure becomes
    a target, it ceases to be a good measure. Even if as a field—we were to agree
    upon a definitive set of tests for AI—researchers would immediately focus their
    energies on solving those specific problems, rather than building an agent whose
    generality extends further, to the open-ended, real-world settings where AGI might
    day be deployed. In other words, any benchmark test diverts attention away from
    what we have called the ''meta-task'' that an agent ultimately needs to solve.


    Disparate prognoses for the future of AI research—ranging from optimistic to indignant
