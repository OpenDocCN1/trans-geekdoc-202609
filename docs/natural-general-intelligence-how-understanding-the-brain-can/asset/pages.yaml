    it is rewarded for production and penalized for spiralling costs. Flying a glider,
    it is rewarded for staying aloft. But what is the reward function for natural
    agents going about their everyday lives, and who or what is the external entity
    that specifies it?


    In the natural world, rewards do not arrive via a dedicated sensory input channel.
    In fact, they are not bequathed by the environment at all.¹⁷ Instead, they are
    the results of a subjective internal process by which we evaluate the world in
    the context of our need to survive and reproduce. Food, warmth, and sex are not
    intrinsically rewarding but instead bring pleasure when we are hungry, cold, or
    aroused. Rewards are made in the mind, not given by the world. This simple intuition
    has far-reaching consequences for understanding motivated behaviour as well as
