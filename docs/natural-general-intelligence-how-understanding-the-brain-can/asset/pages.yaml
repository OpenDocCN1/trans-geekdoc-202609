    # Concepts and programs


    Eratosthenes of Cyrene was the John von Neumann of the third century BC. Many
    of his contributions to mathematics, astronomy, and geography have been handed
    down to the modern era. He is credited with computing the circumference of the
    Earth with less than 2% error, a remarkable feat for an era when uncertainty distances
    were still measured by professional pacers with constant stride length. He also
    invented the Sieve of Eratosthenes, a tool for discovering prime numbers. It works
    by gradually eliminating multiples of successive integers starting from 2, forming
    a sort of numerical colander that catches the composites and allows the primes
    to fall through. His algorithm is used to this day in number theory.


    We marvel at the creative mind that solved these problems more than two millennia
    ago. But there are at least two lenses through which to view Eratosthenes'' feat.
    Through one, we see a triumph of reasoning. Primes are not composites; composites
    are multiple integers; thus, successfully remove these multiples and primes remain.
    Through the other, we see a masterful feat abstraction. The sieve, a basic tool
    which may be as old as agriculture itself, sifts the fine grains from coarse;
    Eratosthenes transfers this knowledge to invent a mathematical sieve, which separates
    desired from undesired numbers.


    ³⁶ To achieve this, he used visions of reasoning: he measured the distance between
    two cities on the same meridian, and the angles of the shadows cast at noon on
    the solstice, and combed them using the newly discovered trigonometric theory
    about how to combine the arc and chord of a circle.'
