    Writing in the nineteenth century, the philosopher Charles Sanders Peirce founded
    the modern field of semotics by prescribing three ways in which signs relate to
    their referents. He called these relations *iconic*, *indexical*, and *symbolic*.
    Iconic relations are likenesses: a photograph is an iconic representation of the
    scene it portrays. Indexical relations are those that arise when a shared context
    is created between sign and reference. This can be through an overt act (like
    when I point to something, or otherwise signal it out) passively (as when a murderer,
    victim, and witness mutually index one another in the context of a crime). Symbolic
    relations denote otherwise arbitrary links which are agreed by convention, as
    that between an object and a verbal label. The word ''cat'' is an arbitrary symbol
    that we use to refer to domestic felines.


    Peirce was writing long before the advent of cognitive science, but his theory
    can be usefully repurposed to consider how mental representations are grounded.
    Some are grounded in physical likeness. The activation of an mental representation
    depends on physical similarity. For example, a neuron that responds to a cricket
    ball must also activate to a Gala apple, because they are approximately the same
    size, shape, and colour. Other representations are grounded by indexicality: the
    association between a cricket ball and bat is not forged by resemblance, but by
    the fact that in the natural world, they are linked by a shared context in space
    and time—they are found together in the kit bag. Finally, some representations
    are grounded in shared convention or culture. A cricket ball and a snowboard rarely
    occur, as one is used on a well-tended lawn in summer, and the other on the ski
    slopes in winter. They are grounded in a category that humans agree to denote
    as *sport*—they both have the latent (or unobservable) property of being items
    of sporting equipment.24 As we see, the human brain forms representations that
    are grounded in all of these ways, as well as learning more exotic classes of
    concept.


    Early adopters trained neural networks on arbitrary mappings between verbal labels.
    Networks learnt to encode the hierarchical structure that relates denoting objects
    (rose), categories (flower), and properties (has petals). In fact, it is a poorly
    kept secret that pioneers of connection used the same sleight of hand as proponents
    of symbolic AI: input and output patterns were non-overlapping (one-hot vectors),25
    so that patterns for


    24 One property has been deemed so significant that it forms the basis for a wholefield
    in machine learning. This property is a proxy for the survival value of the agent
    experiencing an event or acquiring an object, and is usually *reward*. The framework
    of RL assumes that learning to maximize reward is a necessity, or even sufficient,
    condition for intelligent behaviour. It is discussed in Chapter 6.


    25 In a one-hot vector, one unit has a value of 1 and others have a value of zero.
    If each input is denoted by a unique one-hot vector, then all inputs are equally
