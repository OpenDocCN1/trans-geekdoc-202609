    about the world: the capitals of Portugal, Norway, and Austria; the dates of Columbus''
    arrival in Hispaniola, the French Revolution, and the Indian partition; the names
    of various species of trees, birds, and flowers. Other aspects of your knowledge
    are pragmatic. You might know how to make a perfect béchamel sauce, ice skateboards,
    play the xylophone, or perform a Maori greeting. Finally, you know a lot of stuff
    that is hard to verbalize. You might recall a trip to Niagara Falls in winter
    and bring to mind a view of the great cataract shrouded in ice. You can imagine
    the face of a long-lost schoolfriend or replay the tune of a favourite Christmas
