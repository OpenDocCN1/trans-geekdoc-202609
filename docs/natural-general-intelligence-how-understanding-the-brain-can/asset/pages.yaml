    sensory inputs, without a helping hand that encourages computation to focus on
    those parts of the structure that are relevant to intelligent behaviour. Neural
    networks start to succeed when researchers equip them with computational tools
    that are honed to account for the world''s non-accidental properties. Unsurprisingly,
    these are the same computational tools that millions of years of evolution have
    provided for biological neural networks: local receptivity, convergent connectivity,
    divisive normalization, sparsification, predictive coding, orthogonalization,
    dimensionality reduction, spatial attention, and object-based relational composition.⁷7
    In the relentless pursuit of neatness, some AI researchers forget that the world
    itself is not neat, and the path to AGI, the road taken by natural general intelligence,
    will inevitably be more than a little bit scruffy.


