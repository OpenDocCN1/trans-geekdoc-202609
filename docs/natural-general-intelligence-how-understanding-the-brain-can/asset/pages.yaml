    Thorndike recognized several aspects of his data were incompatible with this connect-dots
    view of learning. Firstly, his animals learnt gradually. Performance improved
    incrementally, by trial, as if patterns of behaviour were widely stamped in time,
    rather than grasped in a flash of insight. Secondly, over time, behaviour became
    highly automated. A cat trained to pull a wire loop to escape continued to claw
    at the air, even in its absence. The animals learned fixed habits, not reasoning
    about the puzzle. Finally, the voluntary initiation of action was essential for
    learning to occur. Even after Thorndike had thoughtfully applied the cat’s paw
