    # 3.7 Your brain as a statistician


    The world is a confusing and ambiguous place. Uncertainty pervades every aspect
    of our lives, from the banal to the profound. Was that sneeze the first sign of
    a nasty bout of flu? Will it rain tomorrow? Does person like me? Did I study hard
    enough to pass the exam? Who will win the next football match or election? For
    the post-war pioneers of AI research, who lived under the shadow of nuclear annihilation,
    and for today''s generation, who are faced with a global climate emergency, even
    the very continuation of life as we know it remains in doubt. In order to reason,
    forge plans, and share information, our mental states encode beliefs about the
    world. Where states are uncertain, these beliefs can be graded and expressed as
    probabilities you might deem the odds of political change at the next election
    to be 50:50, or grumble that it is likely, but not certain, that it will rain
    for your birthday tomorrow.


    Systems designed in hard-and-fast logic are ill-suited to handling uncertainty.
    We have seen Cyc, when asked whether Fred in the desert, can only answer yes or
    no. A better answer would be that it is possible that Inhab lives in a nice, moist
    forest by a pond. Beginning in the 1990s, a major new current of thought emerged
    in psychology, neuroscience, and AI research, based around the idea that thinking
    is grounded in probabilistic inference. This sparked two decades of debate about
    whether people are capable or clueless when it comes to making inferences in an
    uncertain world.


    If the weather forecast tells you that there is a 70% chance of rain tomorrow,
    you know exactly what that means. Surprisingly, just 400 years ago, neither mathematicians
    nor lay people understood that events could be assigned numerical probabilities
    of occurrence. Before the Enlightenment, the predominant view among European thinkers
