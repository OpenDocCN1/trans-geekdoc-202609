    In 2017, two machine learning papers published more or less simultaneously a solution
    to continuous learning that drew heavily on neurobiological insights. The idea
    was to estimate the importance of each weight in the network to past learning,
    and to penalize new changes in proportion to this measure. This penalty regularizes
    learning towards the old, minimizing forgetting of past tasks. The method proved
    successful in using the same deep network model to run randomly chosen Atari games,
    as well navigate non-stationary problems in a supervised learning paradigm.32


    However many other approaches to continuous learning implicitly invoke a modular
    memory system. The stability–plasticity dilemma can be circumvented by a two-speed
    memory system, with one module learns fast (allowing plasticity) and another that
    learns slowly (allowing stability).33 Of the human brain has evolved a highly
    structured memory system that retains information over multiple intervals—from
    milliseconds (iconic memory) to seconds (working memory) to years (episodic, semantic,
    and procedural forms of long-term memory). One possibility is that two-speed learning
    relies on the distinction highlighted by the neocortex and the hippocampus. There
    is powerful evidence that the neocortex allows learning of the structure of the
    world via a parametric model, whereas the hippocampus and adjacent structures
    retain information rapidly in a sparse (non-overlapping) neural code, more akin
    to a non-parametric model. By working together, these two systems furnish a solution
    to the intertwined problems of continual and one-shot learning.


