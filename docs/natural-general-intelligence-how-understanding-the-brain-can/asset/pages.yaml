    # 5.1 Molecular metaphors


    In 1876, the German chemist Hermann Kopp was having a torrid time in the laboratory—his
    experiments were refusing to work. To allay his frustration, he sat down to write
    an unusual book.¹ Entitled *Aus der Molecular-Welt*,² describes a fantastical
    kingdom inhabited by atoms and molecules with wildly varying character and physiognomy.
    Hydroxyl is arrogant, and chlorine is a real sourpours. The chemicals—like young
    children—hold hands for comfort. They pass the time dancing: partner dances for
    couples or Allemande à trois, quadrilles of the court ball or a rambunctous Scottish
    jig. There is jealousy when partners are exchanged. Six carbon atoms dance ring-roses,
    giving two hands to one and the other, with their last hand reserved to drag a
    hydrogen atom behind them—forming the famous structure of benzene, proposed by
    August Kekulé 20 years earlier.³ Molecular structure is complex, and chemical
    bonds are invisible to the naked eye, but Kopp brings the tiny universe of molecules
    to life, forging analogies with physical and social relations in the macroscopic
    world. Once discovered, *Aus der Molecular-Welt* became an instant classic.⁴


