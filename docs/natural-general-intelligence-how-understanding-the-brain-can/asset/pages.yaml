  md: 'The butcher on the bus 221


    # 7.2 The butcher on the bus


    Édouard Claparède a Swiss neurologist with a mischievous streak. In 1907, he published
    a report of a patient suffering from anterograde amnesia brought on by Korsakoff''s
    syndrome. Anterograde amnesia spares most past learning but precludes the formation
    of new memories, usually without incurring a more generalized loss of cognitive
    function.7 His patient retained learning that had occurred before the illness
    onset, and, for example, was able to recite the capitals of European countries
    and perform mental arithmetic. She was able to learn some new skills, such as
    finding her way to the bathroom in the hospital where she was in. However, her
    amnesia left her unable to recognize the faces of medical staff that she had seen
    every day for five years—including Claparède, whom he met for regular appointments.
    Frankly, on one visit, he secreted a sharp pin in his hand, which pricked her
    painfully when they greeted. On the next visit, the patient once again failed
    to recognize Claparède, but refused to shake hands—without explaining to why.


    This anticipated the seminal study of Henry Molaison (H.M.) by Milner in the 1950s,
    on which modern understanding of the human memory system is founded.8 Like Claparède''s
    unnamed patient, H.M. was able to slowly acquire motor skills, such as drawing
    in a mirror, and became gradually familiar with his environment through laborious
    interaction. However, new facts and events systematically failed to lodge in his
    mind. The site of the damage to the brain of Claparède''s patient is unknown,
    but H.M.''s lesion, which has been mapped in detail with structural MRI, encompasses
    the hippocampus and adjoining structures in the MTL.9


    The study of H.M. offered an early inkling of how the brain divides labour between
    the neocortex and the hippocampus. Hippocampal patients are unable to encode specific
    instances into memory but remain familiar with previously facts and events. This
    dissociation implies the need for a


