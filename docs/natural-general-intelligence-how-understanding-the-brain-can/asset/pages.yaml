    # 7.3 The problem of a changing world


    When a motion picture is being produced, individual shots are edited into scenes.
    Each scene is a segment of the film that takes place in continuous time in roughly
    the same location. In the natural world, ongoing experience is structured in a
    similar way. We experience life as a series of scenes (or contexts) which are
    defined by consistent sensory signals and common objectives to fulfil.²⁶ Imagine
    you are leaving the office after a long day at work. As you grab your coat and
    head for the door, you leave behind the desks and computers, strip lighting, hushed
    tones, and the toned-down attire of your colleagues. If you are heading to a bar
    or a restaurant, the context will probably be entirely different: noisy, colorful,
    and crowded, full of unfamiliar people who may be eating, drinking, or dancing.¹⁷
    The way you expect to comport yourself in these settings is quite different. If
    you push back your chair and open a beer whilst cheering a work meeting, your
    colleagues might look agh. But your friends may be just as outraged if you use
    your laptop and start reply to e-mails whilst popping up the bar. We may say that
    the optimal policy thus varies from context to context, along with your sensory
    signals.


    In AI, research with slowly changing signals and objectives is referred to as
    non-stationary. Taken as a whole, the ALE is non-stationary, because every game
    is different. Some games oblige you to drive a submarine, or others to accurately
    roll a bowling ball to down nine. In the Atari environment tends to be non-stationary
    even when individual game, have engineered the games so that different policies
    are needed for each stage or level. This is one of the key reasons why deep learning
    for RL remains a significant challenge.


    Take the popular game Ms. Pac-Man. For most of the time, players are tenaciously
    chased by scary ghosts with collision costs a life. However, after munching on
    the power pellet, the ghosts suddenly morph from predators into prey. The optimal
    policy thus reverses from one moment to the next: whereas before, the ghosts were
    best away, now they should be


