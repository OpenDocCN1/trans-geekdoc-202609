    colour (i.e. position in latent space).⁴⁰ It can be used to generate new apple
    varieties that do not exist—deep fake apples, if you like.


    One successful tool for generative modelling is known as a variational autoencoder
    (VAE). An autoencoder is a class of generative model that learns to reconstruct
    the very data that it receives as inputs, in a process called self-supervision.¹¹
    At first glance, this sounds nonsensical—if the inputs are already available,
    then what is to be gained by reproducing them? The secret, however, is that the
    network encodes the signals onto a bottleneck layer with reduced capacity (ewer
    processing units). For example, if a VAE were trained on images of apples with
    two bottleneck units, it might learn to embed each image in a space whose axes
    are size and colour. This encourages the network to reconstruct images that live
    within the space of small-to-large and that the network has experienced—to learn
    a good compression of the data. In a VAE, the semantic interpretability of the
    concepts is learned because the network is additionally encouraged to form latent
    factors which are as unrelated as possible, through a separate cost term for disentanglement.¹²
    One variant of this architecture known as β-VAE, has been used to learn human-interpretable
    factors from natural images, such as data sets of features, vehicles, or cars.
    For example, when trained to reconstruct face images, it acquires latent units
    (those in the bottleneck layer) that code for age, gender, hairstyle, and affective
    expressions such as happiness (smiling or frowning) (Figure 4.3).¹³


    To probe the latent variables the network has learnt, we can intervene virtually,
    by setting the latent units to values of our choosing and running the model in
    reverse (to generate) predicted signals. For example, we can systematically map
    a single latent unit to a series of continuous values, and thus generate a sweep
    of imagined face images that vary on a single latent dimension, such as young
    to old, fringe to bald, or happy to sad. The factors can also be recomposed in
    interesting ways for imagination


