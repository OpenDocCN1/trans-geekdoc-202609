    Whilst the nature of the intrinsic reward is unknown, there are at least three
    principles that may be helpful for cognitive scientists and computer scientists
    alike to consider:⁵³, motivation can be homeostatic or heterostatic. Homeostasis
    is the computational principle by which a system attempts to keep some quantity
    in equilibrium. For example, a mechanic maintains the levels of oil, fuel, and
    water within a desired range in an engine, and a thermostat keeps your house at
    a comfortable temperature. In biology, motivation for basic needs is readily described
    by a homeostatic motivational system. When we are hungry, we eat until satisfied,
    and when we are thirsty, we drink until hydrated. Then, a homeostatic intrinsic
    reward function will return negative values when various environmental states
    (e.g. levels of food or liquid) fall below certain levels, encouraging the agent
    to take action to meet the relevant need. The idea that biological behaviour obeys
    that satisfy needs dates back to the theories of the psychologist Clark Hull in
    the 1940s.


    By contrast, the intrinsic rewards provided in RL studies are heterostatic. A
    heterostatic reward function is one in which the organism is encouraged to self-perturb
    out of its equilibrium, for example by reaping extreme quantities of a given asset.
    In Atari, this works fine, because attaining a tantalizing superlative score is
    precisely the goal. A third, but in the natural world, heterostatic reward functions
