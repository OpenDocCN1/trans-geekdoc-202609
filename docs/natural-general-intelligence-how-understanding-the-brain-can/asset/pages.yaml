    Cognitive psychology is concerned with two types of questions: What do we know?
    And how do we acquire and use this knowledge?


    Pylshyn''s first question refers to the problem of representation learning: how
    we know things. His second question concerns the mental operations (computations)
    that we perform on knowledge: how we think.²


    Let''s begin by clarifying this distinction between thinking and knowing through
    the lens of a paradigmatic challenge for early AI research: how to build a computer
    that wins at chess. To find the best route to checkmate, the computer first needs
    to represent the board state (the position of all the pieces of each player).
    This task of representation formation is a memory process, in which the observable
