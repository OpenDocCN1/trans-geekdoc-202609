    # 7.7 Learning simple programs


    The celebrated anthropologist Jared Diamond trained as a medical student before
    gravitating to the field of ornithology. It was the study of birds first took
    him to Papua New Guinea, where he met people whose culture was radically different
    from his own—and strangely familiar too. As he recounts in his bestselling book
    The World Until Yesterday, many of the New Guinea Highlander practices that initially
    seem unfathomable—their taboos about relationships, featuring rituals, marriage
    practices, or trade systems—have recognizable counterparts in the Western world.
    For example, if one native hurts another in an accident, a formalized ceremony
    involving the affected parties allowed for compensation to be paid and relationships
    to be re-established. This practice can help forestall a costly feud between indignant
    parties, much as the Western courtroom trial is an act of theatre geared at providing
    the aggrieved with justice and bringing closure to an event.⁰


    Thus, whilst situations Diamond encountered were alien to them, they involved
    familiar concepts as bartering, greeting, featuring, and warfare. Even if the
    native people behaved in unexpected ways, their activities shared a common structure
    and purpose with those in the West. Diamond was able to reuse task knowledge on
    the streets of their native downtown Los Angeles to adapt to life in the highlands
    of Papua New Guinea. This ability to perform tasks in new environments by recycling
    knowledge about how to achieve goals is a critical component for any general AI
    research. And yet, it is in an area where AI research has so far made limited
    progress.


    As we have seen, recurrence and gating in memory systems allow agents to learn
    sophisticated control policies. How, then, do intertwined memory and control processes
    allow agents to adapt rapidly to new tasks? In recent years, machine learning
    researchers have tackled this challenge by building deep networks that are able
    to learn how to learn.


    Recall that Harlow''s monkeys were able to learn each bandit task faster than
    the last, even though they involved entirely new objects.¹ The rapid progress
    that monkeys made on each new bandit problem—with performance eventually plateauing
    after just a single trial—is in sharp contrast to that deep networks, which are
    bedevilled by sluggish learning and a hunger for data. Harlow conjectured that
    with repeated exposure to many tasks with similar structure, the monkeys had learnt
    how to learn.² Recent work has


    ⁰ See (Diamond 2012).


    ¹ See Chapter 4.


    ² Harlow called it learning.'
