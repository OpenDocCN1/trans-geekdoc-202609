- pgno: 18
  md: '# 6 Turing''s question


    already been powerfully shaped by advances in machine learning and AI research,
    and there is much more yet to learn.


    This symbiosis between neuroscience, cognitive science, and AI research began
    decades ago. Important examples include neuroscientists'' excitement with reinforcement
    learning (RL) architectures as theories of motivated choice, or more recently
    with deep neural networks as theories of perception and memory.¹ But AI has a
    great deal to offer the sciences of the brain and mind. This is because AI researchers
    now routinely tackle a problem that most neuroscientists consider too ambitious
    to contemplate: modelling the behaviour of large-scale, integrated architectures
    in dynamic, naturalistic environments. AI researchers model complex behaviour
    holistically, rather than dissecting it with the scalpel of experimental control.
    This opens the door to many ways of thinking about intelligent behaviour and its
    underpinnings in biology, and offers opportunities for new synergies among researchers
    wishing to build and understand brains.


    Neuroscientists have discovered a great deal about brain function over the last
    century, but for the most part, this knowledge remains fragmentary. It is modish
    to lament how we actually understand how the mind works. Indeed, brains are famously
    complex, and the field has a divide-and-conquer approach—individual research groups
    focus narrowly on a specific aspect of brain function, using a limited set of
    methods, often in a single species. For example, a typical lab in systems neuroscience
    might focus on understanding how olfaction works in flies, rodents navigating,
    or how humans make social choices. We have learned a great deal from focal research
    programmes such as these, but it is notable that the field has not yet been successful
    in identifying large-scale principles for intelligent behaviour.


    Behaviour is often easier to study brain activity. Measurements are simpler to
    carry out, analyze, and interpret. In neuroscience''s sister discipline of psychology,
    many experiments involve button presses and reaction times,² rather than charting
    the activity of hundreds of neurons with millisecond precision. The lower complexity
    of the recorded signals allows research to progress at pace, making it easier
    to build theoretically diverse search programs. It is thus perhaps unsurprisingly
    that psychologists have been more prone to formulate theories with broad explanatory
    reach. The history of experimental psychology is punctuated by the rise and fall
    of large-scale frameworks, such as those that rely on reward-based trial-and-error
    learning


    > ¹ See, for example, (Saxe et al. 2021) and (Botvinnik et 2009).


    > ² Notwithstanding excellent work on saccadic control, skilled motor action,
    locomotion, etc.'
