  md: '# Turing question


    advances in AI have profound implications for how we live our lives, both as individuals
    and a society. However, they are not the focus of this book.


    Instead, I will start by examining the other, more ambitious goal of AI research:
    to build what is often called artificial intelligence (or AGI). As we shall discuss,
    the field currently lacks a crisp definition of what building AI might entail.
    However, the goal is roughly to build an artificial system that behaves with the
    same or greater intelligence than a healthy, educated adult human, and can then
    be deployed to automate complex tasks and to solve currently intractable problems.
    This sort of general intelligence is, of course, exactly what Turing had in mind
    when he talked of a ‘thinking machine.’⁷ Over the decades since 1950, the prospect
    of a general AGI has gone from respectability to illute and back again. Just a
    decade ago, discussions of general intelligence—and the coming ‘Singularity,’
    when machines rise and act like humans—were largely taboo among AI researchers,
    being associated with the wilder eccentricities of parallel interests in transhumanism
    and intergalactic colonization. Today, however, a small army of research companies
    have been founded with the express of building general AI. Prominent among them
    are DeepMind in London and OpenAI in San Francisco, which collectively have contributed
    many of the more jaw-dropping leaps in recent AI progress, and whose weal we shall
    consider in some detail below.⁸ As often envisaged—that is, as a general system
    capable of solving complex, currently elusive problems—an AGI would be the most
    significant and valuable technology that humanity has ever built. It is ayrıca
    surprising, that advancing progress in AI has attracted an exuberant interest
    from investors, journalists, and politicians.


    However, there is also a great deal of uncertainty: Much of this comes from within
    the AI research community itself, where there is significant disagreement about
    what, how, about when, and about and why. AI researchers disagree about what they
    are building—should an AI be physically embodied, negotiating the real world,
    or instantiated as a computer program that dispenses wisdom from the relatively
    safe confines of the internet? They disagree about how AI should be built—should
    designers draw upon our human knowledge of the world and raise their agent to
    imitate human-like behaviours—or they build AI from a clean slate, with statistical
    principles as their guide? Researchers—including philosophers and


