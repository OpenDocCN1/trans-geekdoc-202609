    This trichotomy also coher with a general organizing principle for brain circuits,
    which has windows of temporal integration as one moves anteriorly across the neocortex.
    This principle was originally proposed by Fuster, who argued that the basic function
    of the brain is to bridge the gap between perception and action at multiple levels
    of temporal scale.¹¹ In 2008, a clever experiment mapped this temporal hierarchy
    onto different regions of the human brain by showing participants in the fMRI
    scanner excerpts of classic silent movies directed by Buster Keaton and Charlie
    Chaplin. Movies were scrambled at different timescales, so that at the least scale,
    long segments of narrative (of more than half a minute, such as when the drunken
    millionaire is saved for in City Lights) remained intact, whereas at shorter scales
    (scrambled segments of 4 seconds or less) the event sequence of individual scenes
    became nonsensical. The authors measured the correlation in BOLD signals across
    two presentations of a scrambled film.


    The logic of this experiment was that brain regions with short time constants
    of integration should be relatively immune to scrambling, as their dynamics carry
    no memory beyond a few seconds, and should correct across presentations even at
    shorter scales. However, correlations for brain regions that integrated information
    over longer time periods should only resist when scrambling for prolonged segments.
    The authors observed hierarchy temporal receptive fields that unfolded along the
    posterior-anterior axis, from the earliest visual cortical regions with rapid
    decay constants to the PFC in which longer narrative segments were integrated
    and understood.


    This finding echoes the detailed study of intrinsic timescales (autocorrelations
    in neuronal fluctuation) data from several research groups (26 monkeys in total).
    Intrinsic timescales for different regions were remarkably conserved across different
    groups and studies, ranging from 50 ms in the visual cortex to 200 ms in the PFC,
    with even longer integration windows in the orbitofrontal cortex, at the anterior
    pole of the frontal cortex. Building a hierarchical RNN model that is constrained
    to respect these time constants, one report simulated a response to a pulsed visual
    input, finding that it recreated the idiosyncratic patterns of dynamic activity
