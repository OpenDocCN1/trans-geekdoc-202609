  md: '# The control of memory


    is shared between two adjacent time points: the current and immediately preceding
    steps. Memory systems, however, allow agents to share information across broader
    spans of time. This is particularly helpful in naturalistic environments, where
    events depend on variables which were signaled in the past but are latent and
    unobservable in the present. For example, on the first level of Montezuma''s Revenge,
    to know that you can open the door, you need to remember that you previously retrieved
    the key.


    A simple form of memory in the RL methods toolkit is called an eligibility trace.
    In tabular RL, an eligibility trace is a scalar memory for state visitation recency.
    If we return for a moment to the state of navigating Hampton Court maze, you might
    recall that TD learning allows an agent to back up value of the exit state (+100)
    to the next-to-exit state. Why not back up further? Eligibility trace tags each
    state as fully ‘eligible’ when visited and decays the eligibility of all other
    states incrementally towards zero on every step. When stumbling across the goal
    for the first time, those states that have been recently visited—in the run to
    the exit—will carry eligibility. In a class of method known as TD(λ), an eligibility
    trace is used to share the backed-up value simultaneously with all eligible states,
    which greatly accelerates learning.


    In biological brains, memories are formed through the adjustment of synaptic connections.
    When one neuron stimulates others, their shared synapse is strengthened in a process
    known as long-term potentiation (LTP). When LTP is produced in the lab, for example
    artificial stimulation in slices of tissue, it occurs in two stages: a short-duration
    phase in which the cell is tagged as having recently active, and a sustained phase
    in which new proteins are synthesized to produce lasting change. These later plastic
    changes only occur in the presence of the tag, creating a mechanism by which credit
    can be assigned on the basis of eligibility. In the context of RL, this mechanism
    could allow dopamine to selectively strengthen tagged synapses for the learning
    of associations between stimuli and actions or outcomes, allowing for neural implementation
    of an eligibility trace. Indeed, humans seem to be able to back up a reward by
    completion of a sequence of actions in a single shot, and reward prediction errors
    measured in pupil dilation signals obey the predictions of a TD-learning model
    equipped with eligibility traces.


    +   2 The parameter λ dictates the decay rate for state eligibility.


    +   3 For synaptic tagging (the hippocampus), see (Frey & Morris 1997). For a
    review on eligibility traces in biology and human experiment with eligibility
    traces, see (Gerstner al. 2018) and (Lehmann al. 2019).'
