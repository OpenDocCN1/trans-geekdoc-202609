- pgno: 15
  md: '# The ghost in the machine 3


    Machine Stops, E. M. Forster envisages a machine that takes the form of a vast,
    sentient communications network and enslaved the humans that built it—confining
    them to a solitary, subterranean existence. By the mid-twentieth century, however,
    these dreams of mechanical slaves and android overlords had begun to give to the
    serious series of constructing intelligent machines using the formal languages
    of logic and mathematics.


    The publication of Alan Turing''s seminal paper *Computer Machinery and Intelligence*
    in 1950 is often said to mark this turning point. In the paper, Turing asks: could
    a digital machine think? In posing this question, Turing is not inviting us to
    an exercise in philosophy of mind. He is not asking whether a machine can think
    in principle. Rather, he is asking a practical question: does digital computation
    permit us to build a machine that think in ways indistinguishable from a human?
    If so, how would this be possible? 70 years later, artificial intelligence (AI)
    research is advancing at a dizzying pace. However, Turing''s question remains
    unanswered and seemed more urgent.


    This book is written at a time of both great excitement and considerable uncertainty
    about progress in AI research. There is no doubt that deployment of new AI technologies
    is already reshaping society around us. This immediate impact is simple, but powerful,
    machine learning systems are relentlessly insinuating themselves into every aspect
    of our daily lives. Ever-greater fraction of the information we consume, and the
    decisions we make, occur through a digital interface, such as a phone, tablet,
    or computer. Algorithms embedded in websites and applications recommend consumer
    products and new social contacts, curate news and other online content for us,
    and increasingly growing our interactions with the wider society, including institutions
    providing education, health, or justice. Commentators have noted that Forster''s
    vision of *The Machine* seems weirdly prescient of AI-mediated online existence.
    Meanwhile, behind the scenes, tools from machine learning are accelerating innovation
    in science and technology. For example, in late 2020, a deep neural network used
    to solve one of the most significant problems in structural biology—how a protein
    will fold from its amino acid sequence—with potentially far-reaching implications
    for drug discovery and environmental sustainability.⁶ Collectively, we


