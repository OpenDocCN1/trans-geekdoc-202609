    These observations tell us that the neural wiring diagram in both biological and
    artificial systems is pre-engineered to encode information in a well-organized
    fashion, in particular by capitalizing on an input structure. Returning to the
    warehouse example, if imports arriving from the four points of the compass are
    housed in corresponding storage zones located in the north, south, east, and west
    of the warehouse, then it will be easier to sort them for distribution. Even more
    wisely, if patterns of imports that tend to arrive at once—chassis from the United
    States, tyres from Italy, and engines from France—are stored in the same place,
    then it is easier to ship them together. The way the switches are set help memory
