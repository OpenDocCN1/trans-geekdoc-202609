    is that we should do away with the concept of reward altogether.⁵⁶ In many ways,
    this is the opposite to the reward hypothesis: it claims that rewards are just
    a convenient label for states that emerge as a by-product of belief formation.
    The claim comes in various forms, but the shared theme is that organisms are guided
    by a cost function that is minimized when the world is predictable, controllable,
    or orderly. In one version of this theory, known as active inference, actions
    are selected to make the world as predictable as possible. In another, known as
    empowerment, the consequence of maximizing this intrinsic reward is that it furnishes
    preparedness, by maximizing the future degrees of freedom available for an agent
    to act in the world.


    Unsurprisingly, these ideas were controversial. The idea that people strive for
    orderliness in perception and cognition falls within a long psychological tradition
    dating back to Festinger’s Theory of Cognitive Dissonance in the 1950s. Festinger
    argued that we seek to minimize inconsistency in our beliefs and values. His work
    was partly based on interviews with people holding strange or apocalyptic beliefs,
    such as a Chicago-based group who believed they would be rescued from Earth by
    UFOs on Christmas Eve in 1954. Festinger studied the mental stresses that the
    group experienced and the coping mechanisms they adopted, when reality not line
    up with their predictions. He concluded that people are motivated to seek psychological
    consistency between their expectations and their observations of the world—to
    minimize cognitive dissonance.


