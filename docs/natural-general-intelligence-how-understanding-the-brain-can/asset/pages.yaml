    category of animal by a physical medium—a pulse of or or a scratch on a page—that
    does not bear any iconic (or-like) resemblance to actual birds.47 This arbitrariness
    means that denoting other concepts that share features with birds (like bats)
    are no more similar to the bird symbol than those different concepts entirely
    (like bricks). This characteristic of symbolic representations means that they
    necessarily discard information about the concept they denote. For example, ''birds''
    of many different shapes and sizes can all be denoted by a single symbol, so that
    the symbol sheds about specific features, identities, or contexts that may be
    important for behaviour (such as whether its referent is a starling or a penguin).


    AI systems perform mental operations on knowledge. The representations that they
    process bear an arbitrary relationship to the objects and events to they refer.
    Unlike neural networks (and biological brains), the meaning of items in memory
