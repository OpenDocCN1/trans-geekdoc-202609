    the natural space of tasks, given the way sensory data, time, space, objects,
    rela-tions, and rewards are organized in the natural world. This work is the modern-day
    descendant of the earliest approaches to AI that were based on symbolic computation
    and highly constrained logical inference. However, unlike the classic approaches,
    in which these operations were endowed by hand, in many modern systems, they are
    partly or wholly learnt from experience.


    As always, researchers have to decide how to trade off the generality and data
    efficiency of their systems. Bayesian approaches to this problem usually involve
    a hand-engineered state space or specific assumptions about the prior, which can
    limit their generality. By contrast, connectionist approaches are more flexible,
    but often hungry for data. The highly structured patterns of computation that
    are observed in the PFC and hippocampus of humans and other primates seem to imply
    that natural intelligence has settled on a good compromise, involving a minimal
    set of maximally general constraints on control processes. Meta-RL similarly offers
    a promising compromise, but via a different approach. It eschews handicraft but
    instead uses curriculum learning—control over the set of tasks encountered during
    training—and as such, it evokes a principle observed in the natural world, whereby
    young members of a species are raised in highly stereotyped conditions that shepherd
    their learning in directions that are favourable for the adult environment. For
    humans, this prominently includes the fact that, where possible, we send our children
    to school.


    By generalizing both programs and concepts, intelligent agents can use both thinking
    and knowing to solve new problems. Where one route fails, the other can take up
    the slack. It is interesting to observe that many of the oft-quoted feats of extraordinary
    human abstraction—from Eratosthenes devising his sieve for prime numbers to Bohr
    seeing the analogy between atoms and the solar system—seem to involve exceptional,
    once-in-a-generation geniuses whose flashes of creative insight reshaped the course
