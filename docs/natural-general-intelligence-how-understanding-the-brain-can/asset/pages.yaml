    # 6.5 Is reward enough?


    You probably know the story of King Midas. Recounted by Ovid in his epic narrative
    poem Metamorphoses, it tells the tale of Midas of Phrygia, who tends patiently
    to the hoary old Saturnus after he pours drunk in a rose garden. As a reward for
    his kindness, Silenus'' foster father—the wine god Dionysus—grants Midas any of
    his own choosing. Foolishly, Midas asks that everything turns to gold. Of course,
    Midas realizes his terrible mistake—he has turned his bed, and his daughter to
    cold, hard metal before Dionysus consents to reverse the spell.


    The Midas myth is a classic fable of reward function misspecification Midas knew
    that gold was valuable, and thus thought to obtain as much of it as possible.
    Unfortunately, however, relentlessly seeking to maximize a single, monolithic
    objective can have catastrophic effects. In his book Superintelligence, Nick Bostrom
    imagines a powerful AI system that is an innocuous objective—to make as many paperclips
    as possible. His worry is that a superintelligent AI given this simple objective
    will make paperclips at all cost—even if it involves diverting all the world''s
    resources and eliminating all the world''s population in the process.


    Bostrom''s thought experiment is commonly quoted to motivate research into AI
    safety. It also serves to highlight a serious translation gap for contemporary
    AI research. RL agents are mostly developed and road-tested in environments with
    universally agreed, clearly defined objectives: board games like Chess where the
    goal is to win, or video games such as Atari which provide a metric of success.
    However, in the messy real world, there are no points to be earned for a life
    well lived. What does a success at life look like? No doubt everyone from Donald
    Trump to the Dalai Lama has a different answer. In the natural world, nobody keeps
    score (or counting paperclips).


    The RL paradigm is presented on what is known as the reward hypothesis. One version
    of this hypothesis states that:50


