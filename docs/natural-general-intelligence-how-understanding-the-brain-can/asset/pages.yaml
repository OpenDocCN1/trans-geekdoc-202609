    AlphaGo combines a new method deep reinforcement learning with a planning algorithm
    called Monte Carlo tree search (MCTS) to identify the most likely path to victory.
    Its powerful deep neural network was trained on an online database of Human games—more
    than 30 million expert moves, with training lasting up to 3 weeks—to predict the
    most likely next move given the board state, and the probability of winning given
    a move. AlphaGo harnesses the power of deep learning to identify a limited set
    of promising moves, which allows it to explore mainly those plans that are most
    likely to pay off—reducing the eyewatering size of the search space (there are
    more possible Go boards than atoms in the universe)—Alpha beat Sedol 4-1, and
    in 2017, it challenged a 3-0 defeat of the Chinese rising star Ke Jie, who then
    ranked 1 among all human Go players in the world. It also joined an unbroken run
    in 60 games against other elite players, managing to win one game against Aga
    Hua—a key move of the AlphaGo team who was also responsible for realizing its
    moves on the physical board—made a rare error in stone placement. AlphaGo’s value
    estimate (its internal calculation of win probability) immediately dropped through
    the floor then started to climb slowly, move by move, until it was once certain
    of victory.


    Next, let’s dial the clock yet further—to 2013, when a nuclear DeepMind team were
    preoccupied with a different problem. Their goal was to train an AI system using
    RL to play a suite of Atari 2600 video games—from Asteroids to Frog—using only
    the screen pixels and score, and the joystick controls as outputs. They had left
    their latest agent—the Deep Q Network (or DQN)—training for several days on the
    game Breakout, in which the player moves a paddle to bounce a ball against a wall
    of bricks, losing a life if the ball hits the ground. Stopping to check how it,
    they were astonished—DQN learned to carefully angle the paddle so that the ball
    cut a tunnel through the bricks on one side of the screen, allowing it to become
    trapped *above* the bricks and bounce endlessly, with the score ticking up rapidly,
    without the agent having to lift a virtual finger. Version of DQN went to master
    29 Atari games at 75% of the level of a human professional tester, a landmark
