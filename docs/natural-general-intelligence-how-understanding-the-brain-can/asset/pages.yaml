    Humans are much less prone to catastrophic forgetting than neural networks. Of
    course, anecdotally, we know that people can remain intellectually well into old
    age. But humans seem to have evolved mechanisms that protect learning from interference.
    A classic demonstration of the resilience of human memory to interference dates
    back to the 1980s.²Human participants and neural networks first learnt to associate
    a series of words, such as apple-bicycle (task A), before learning new overlapping
    associations, such as apple-sofa (task B). In neural networks, performance on
    probed recall of task A associations (apple, ____) fell rapidly due to change
    during learning of task B, indicative of dramatic catastrophic interference (Figure
    7.4). Interestingly, humans faced with the same task remembered for task A associations
    while learning task B, suggesting that biological brains have evolved mechanisms
    that protect old learning during new learning. Perhaps this should be obvious.
    Learning to drive a car does not eradicate your ability to ride a bicycle. Mastering
    Space Invaders does not overwrite your skill at Frogger. In fact, there are numerous
    settings where humans seem to benefit from encountering tasks in a highly structured
    sequence. This is presumably why school timetables usually schedule Spanish and
    French classes in different slots, rather than teaching them both together in
