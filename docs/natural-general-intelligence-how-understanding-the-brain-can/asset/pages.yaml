    his ill-gotten gains and begins ransacking hisatial mansion Xanadu. But when his
    glance falls on a snow globe that he used to own as a boy, he suddenly recollects
    the innocence of youth. He remembers playing in the snow with his beloved Rosebud,
    before his descent into the corrupt world of money and politics. For a moment,
    he is mentally transported back the decades, and his whole world turns on its
    axis. This recollection him to finally die in peace, with the Rosebud on his lips.


    Times move forward. In the natural world, its passage is marked by the ticking
    of the clock and the slow rotation of the seasons. For an RL agent in a dynamic
    environment, times move forward—timelessly met out by the cycle of observation,
    action, and reward. As time advances, the past recedes behind us. But evolution
    has endowed biological agents with a means to travel back through time and visit
    the past—like Citizen Kane on his deathbed, who is transported back to his youthful
    self frolicking. For intelligent agents, remembering what occurred in the past
    can be useful. The world is structured in time, so what the past remains is relevant
    to the future and can be leveraged to make better decisions.


