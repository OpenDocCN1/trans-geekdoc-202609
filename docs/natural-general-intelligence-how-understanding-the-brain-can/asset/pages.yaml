    The intellectual ancestry of the neural network can be traced back to work in
    the 1940s by Walter Pitts and Warren McCulloch, who were curious about how networks
    of neurons could implement primitive forms of logical calculus.^28 But the field
    had to wait another 30 years for the arrival of deep learning, when researchers
    stumbled upon a computational trick (known as backpropagation) that allowed multilayer
    networks to be trained. The magic is that a sufficiently large network, trained
    with enough data, can in theory be used to implement any static mapping function.^29
    By gradually adjusting the weights from feedback, the network effectively acquires
    a set of representations (or filters) that are useful for enchanting the instructed
    span. So, a deep network can learn to implement the equation $x=\sin(y^2)+\cos(4y)+1$
    or learn to map the vector of pixel values in an image of a face or handwritten
    character onto a prediction numerically labeled coding (''Mary'' or ''4''). Critically,
    it can perform these tasks without ever being told about sinusoids, faces, or
    numbers. Alternatively—and much more controversially—a deep neural network can
    be trained to map a representation of the information on your Facebook account
    onto your ethnicity, religion, sexual orientation, or political views. This was
    the functionality that the shady outfit Cambridge Analytica allegedly exploited
    to allow the microtargeting of voters with political misinformation in the run-up
    to the 2016 US presidential election and UK Brexit vote.^30


    Throughout the 1980s and 1990s, neural networks were largely explored by psychologists
    as theories of human learning and development. So, despite their architectural
    simplicity, neural networks can learn in complex, stereotypical ways—for example,
    like humans, they tend to progress in days and starts, with performance increasing
    rapidly before plateauing for prolonged periods. Networks display similar patterns
    of overgeneralization early in training, for example reporting that worms have
    bones because they are animals. But until a decade ago, few machine learning researchers
    seriously believed that neural networks could be used for complex, natural tasks
    such as image or speech recognition. It was widely held that learning the relevant
    features with hand-engineered prior knowledge was going to be impossible.^31


