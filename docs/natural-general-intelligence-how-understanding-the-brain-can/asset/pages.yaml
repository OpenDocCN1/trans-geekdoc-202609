    Peruvian Andes, miles from help. His right leg was badly broken, robbing him of
    any chance of climbing out. He knew that his climbing partner Simon Yates believed
    he was dead and had already headed back to base camp. With all other options exhausted,
    Simpson decided to lower himself deeper into the unknown darkness of the crevices.
    His rope was long enough to drop him on another precarious ledge, from where,
    to his astonishment and delight, he saw a shaft of sunlight. It was streaming
    through the snow-hole from which he would eventually escape. In the book describing
    his adventures called Touching the Void, Simpson describes this effect on his
    mental state:


    > The change in me was astonishing. I felt invigorated, full of energy and optimism.
