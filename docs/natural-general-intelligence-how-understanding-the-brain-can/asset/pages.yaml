  md: '# Preface


    Artificial intelligence (AI) research is progressing at blistering pace. Over
    the past 10 years, many significant milestones have been reached. AI systems have
    been able to surpass human expertise in playing strategic games, to produce quite
    plausible natural language, and even to assist in making groundbreaking scientific
    discoveries. These advances have become possible through dramatic gains in the
    availability of powerful computation. However, they have also been driven by innovation
    in the algorithms and architectures from which AI systems are built.


    Over the same period, cognitive scientists and neuroscientists have been busy
    developing new tools and theories for understanding the brain and behaviour in
    humans and other animals. Their ultimate goal is to understand the principles
    that make natural intelligence possible, by describing computational mechanisms,
    defining cognitive systems, and examining their neural implementation.


    These two researchers—those concerned with building and understanding brains—have
    long regarded each with mutual curiosity. Cognitive scientists and neuroscientists
    are excited by the opportunities opened up by progress in AI research. What are
    the algorithms and architectures driving progress in AI? How do they resemble,
    or differ from, those in biological brains? At the same time, many computer scientists
    are fascinated by natural intelligence—how the brain works in humans and other
    animal species. What is there to learn from nature’s solution for generally intelligent
    agents? Should we adopt the principles of natural intelligence for building AI?
    Now, more than ever, there is an opportunity for the exchange of ideas between
    those who study brains and attempting to build them. Unfortunately, however, this
    endeavour can be held back because terminology, concepts, and theories used in
    one discipline are often opaque to researchers in the other, their goals and approach
    are different, and researchers in the two domains have limited opportunities to
    interact and share ideas.


    The purpose of this book is to try to bridge this divide. Its focus is on the
    points of connection between the fields of cognitive science, neuroscience, machine
    learning, and AI research. Its goal is to describe advances in AI research in
    the language of psychology and biology, and to map theories of'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# vi Preface


    brain and cognition onto algorithmic and architectural innovation in computer
    science. Along the way, the book tackles long-standing questions about intelligent
    systems that are relevant to neuroscientists and AI researchers. What does it
    mean for an agent to be intelligent, and what are the cognitive and computational
    ingredients of intelligence? Should we study the human mind to build artificial
    brains? Why is it that AI systems are often good at what appear to be hard tasks,
    flounder when asked to do simple things? What is it that makes the human mind
    so versatile—but also prone to error? What is the outlook for the future—are we
    generally intelligent agents around the corner, or are we still light years away?


    Many of these issues have become controversial. In particular, the question of
    natural intelligence is a viable pathway to building AI as becomes a focus of
    debate. At times, it feels like a minor war is well up in the field, with some
    researchers stridently arguing that the study of natural intelligence, and others
    claiming that the limitations of current systems could be overcome if we only
    looked to biology for computational solutions. In tackling these questions, I
    hope to give both sides of the argument the deep consideration they deserve.


    I felt qualified to write this book despite having trained as a psychologist and
    cognitive scientist, I have been involved for more than 10 years with the AI research
    company DeepMind. As part of my role, I have had the privilege of following developments
    in AI research alongside some of the world’s foremost practitioners. Readers with
    expertise in machine learning may find the coverage of current work in AI research
    whatpartial and incomplete. One manifestation of this is a bias to describe current
    work conducted at DeepMind. This is not because of a wish to promote or organize
    any institution with which I have a personal connection. It is simply a reflection
    of my greater familiarity with work being conducted. Neuroscientists may notice
    that there are several topics that I overlook. They might complain that my portrait
    of natural intelligence described here privileges vision over the others, lacks
    any coherent account of affective processing (emotion), gives short shift to the
    psychological study of language, and sticking to a long and venerable tradition
    in cognitive neuroscience mentions the cerebellum. For these omissions, I apologize.


    I began to work in spring of 2021 and finished some 10 months later. However,
    AI research is moving at speed. For example, when I first put to


