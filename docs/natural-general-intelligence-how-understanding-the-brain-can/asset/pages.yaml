  md: '# Concepts and programs 295


    apprehend complex problems with a single take or to spot deep relational patterns
    at a single glance, so we have to fall back on other means.


    Fortunately, another route exists. We can generalize an ability to deploy mental
    operations—or transfer programs—to devise new solutions on the fly. Thus, where
    falling short, thinking steps up. By generalizing programs for control, we can
    rapidly adapt to new settings. Thus, whilst most people''s capacity for zero-shot
    far transfer is limited, we can solve complex tasks by rapidly composing new policies
    out of a handful of primitive building blocks, just as meta-RL agents redeploy
    the task solutions acquired during meta training. When asked to tidy a room, items
    of different shapes and sizes might be strewn in random positions, but you apply
    a structure program for gathering, sorting, shelving, and discarding the various
    items. If you are finding your way through a new city, you can apply a program
    that follows major thoroughfares, keeping track of landmarks, or marking directions.
    For course, language—the substrate we use to both communicate and to order our
    thoughts—is fundamentally compositional in nature. Thus, whilst you have never
    imagined an elephant playing a trumpet riding a bicycle, before you can so now
    you have read those words. The ability to think compositionally is at the heart
    of natural intelligence.


    Composition promotes representational efficiency, by allowing infinite productivity
    from finite means. Thus, natural systems have evolved a bias to learn neural programs
    that facilitate the on-the-fly composition of ad solutions to novel problems.
    This is presumably how we all become cotidian polymaths: we learn to think. The
    immense complexity of the natural world and the limits that physics and biology
    place on the time and capacity for information processing that we all come to
    rely on a minimal set of mental operations. These biases include explore the world
    in ways that facilitate this very process, by seeking out information, satisfying
    curiosity, exerting control, and meeting self-generated objectives. In other words,
    natural intelligence learns to learn over multiple timescales, from the cradle
    to the grave. It seems likely that building systems that learn increasingly sophisticated
    forms of structured computation—that learn to generate and compose more versatile
    programs over longer timescales—is going to be an important way forward for AGI
    research.


    This leaves one final question. What is the outlook for AGI? Is it plausible that
    we will ever actually build a general intelligence—an AI system whose intellectual
    versatility rivals our own?'
