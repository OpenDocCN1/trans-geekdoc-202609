  md: '# 14 Turing question


    far-sighted planning—all the ingredients, one might say, of a great intellect.
    Chess seems to embody, in just 64 chequered squares, an abstraction of the most
    fiendish problems that the natural world could throw at a thinking agent. As such,
    in the 1950s, it was widely believed that if a machine were able to play chess
    at superhuman level, AI would have effectively been solved.¹²


    This landmark was eventually reached in game against Kasparov 40 years later,
    and today the chess engine in a $100 smartphone easily outclasses the best human
    masters. But nobody now thinks this that AI has been ''solved''. In fact, we can''t
    build brains that display the intellectual versatility of a hamster, let alone
    Magnus Carlsen, whose peak ELO rating of 2882 makes him the highest rated player
    of all time. Systems that play chess at expert level do that and alone—play chess.
    They are tools that are honed to solve a specific problem, like a fishing rod,
    or a slide rule, the single particular vote. They are not intelligent—they are
    just good at chess. So, what is going on?


    Philosophers and computer scientists have traditionally found it useful to distinguish
    between narrow and general AI. Narrow AI has been built to solve specific tasks.
    A self-driving vehicle—even if it can autonomously negotiate the chaos of rush
    hour without moving pedestrians—is an example of narrow AI. Deep Blue is also
    narrow AI, as it is good at chess and chess alone. General AI is different. It
    is an AGI—should one ever exist—would be a device with superlative flexibility,
    theoretically capable of mastering any task, just like your daughter might grow
    up to become a hockey player, or an astronaut, or both—without needing to grow
    a totally different sort of brain for each task.


    As we have seen in the chess example above, however, the goalposts of machine
    intelligence have a habit of moving over time. As the philosopher Pamela McCorduck
    put it:


    > It''s part of the history of the field of artificial intelligence that every
    somebody figured out how to make a computer something—play good checkers, solve
    simple but relatively informal problems—there was a chorus of critics to say—that''s
    not thinking.


    This has been called the AI effect.¹¹² As soon as a long-coveted milestone is
    reached, we no longer think of it as a steppingstone to general AI—it just becomes
    another instance of narrow AI.'
