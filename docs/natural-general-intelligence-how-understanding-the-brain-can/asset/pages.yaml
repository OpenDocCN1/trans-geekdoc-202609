    imaging (MRI) scan revealed an unusual pattern of brain damage: symmetric, bilateral
    lesions to the posterior parietal cortex (PPC) (Figure 4.6). The PPC lies at the
    back of the brain, just above the visual cortex, and is thought to be involved
    in selective attention, sensorimotor integration, and control of eye movements.
    At first, it was not clear what R.M.’s difficulties might be. He felt within the
    normal range on standard tests of visual function, such as those quantifying acuity,
    contrast sensitivity, colour and shape perception, and ability to segment figures
    from the background. R.M. had some unusual deficits. If you showed him an object,
    he could name it. But if you showed him objects, he seemed to be unsure what they
    were—or even there were two of them. He could read single faces well but was confused
    by a crowd. His depth perception was poor; he was unable to tell you how away
    an object might be or which of two objects was nearer. Most aspects of his language
    and cognition were normal, but he was very disoriented and needed help getting
    to the hospital for his regular check-ups at the neurology clinic.


    Patient R.M. had a rare neurological disorder known as Bál’s syndrome. One of
    the cardinal symptoms is simultagnosia, which is an inability to perceive more
    than one object at a time. If you showed R.M. an image of a cat, he could tell
    you it was a cat. But if you showed him a cat and a dog, he could not tell you
    which was which. Nor could he tell you which was larger or how many animals there
    were on the screen. The existence of patients with Bál’s syndrome tells us something
    remarkable: the brain has evolved specific regions that help us understand how
    objects relate to each other in visual space.


