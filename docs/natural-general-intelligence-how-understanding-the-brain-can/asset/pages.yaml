    # 1.5 Shaking your foundations


    Building a machine that can convert fluently with humans has long been touted
    as the greatest of grand challenges for AI research. It is formalized in a benchmark
    test that carries Turing''s name. There are three parties: a human interrogator,
    a computer, and a human competitor, with the latter two striving to convince the
    former that they are the real human. This famous test—Turing called it the *Imitation
    Game*—is pleasingly legible (everyone can understand it) and comfortably democratic
    (anyone could play the role of interrogator or competitor). However, as a benchmark
    for strong AI, it also suffers from a number of drawbacks. Foremost among these
    is the unfortunate tendency of human conversation itself to be confused and inaccurate,
    and the test does not specify who the human opponent is. Until recently, the more
    successful contestants in official competitions (such as the Loebner prize) have
    been using repetitive conversational motifs that deliberately ape the intentions
    of human discourse⁴ or pretend to have psychiatric disorders (or, like one challenger,
    to be a teenager from Odessa) than engaging seriously with the challenge of conversing
    in a thematically coherent manner in natural language.


    Until recently, the tectonic plates of AI shifted dramatically in early 2019,
    with the release of a natural language processing (NLP) system that could, for
    the first time, compose long, fluent paragraphs of text that exhibited a surprising
    degree of thematic coherence. It was the Generative Pretrained Transformer 3 (GPT-3)
    and was built by the company OpenAI. Most contemporary NLP systems are deep neural
