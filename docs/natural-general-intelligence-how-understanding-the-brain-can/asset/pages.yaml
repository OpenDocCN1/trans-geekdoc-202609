    However, this class of computation alone is not sufficient for intelligence. Learning
    abstract patterns in data is undoubtedly an important part of what makes natural
    intelligence special. However, intelligent agents also need to act. Taking actions
    engaging in a reciprocal cycle of interaction with the world, governed by a control
    policy. To date, RL is the most promising framework for describing how this happens,
    as demonstrated by the many recent successes in training agents to master complex
    tasks, as MuZero. However, it seems unlikely—despite what some have argued—that
    ‘RL is enough.’ The RL framework is very well suited to problems (like board and
    video games) that have simple objectives, like winning or maximizing score. But
    life is not a game. Life is an open-ended problem with unclear objectives. Living
    long and well requires agents to optimize over homeostatic goals (such as hunger
    and thirst) as much as heterostatic goals (obtaining as much of one thing as possible).
    Thus, it seems very likely that we will need to make significant changes in understanding
    intrinsic rewards—the way in which motivated behaviour is structured towards self-generated
    goals—before RL are viable across a wide range of unrealistic settings.


    One of the most important innovations of recent years is the development of complex
    memory systems for RL agents. Memory systems untether RL agents from the present,
    and allow them to learn sophisticated, controlled policies that depend on past
    information. Memory is not just a temporary store for data. Memory systems allow
    agents to acquire highly structured control policies that can be reused in new
    situations. For example, meta-RL can be used to train agents to rapidly adapt
    to new tasks. Thus, whereas generative models allow us to transfer abstract concepts,
    sophisticated RL systems are beginning to allow us to generalize structured programs.
    This means that in addition to recognizing new patterns in data—to rapidly make
    sense of new experiences—intelligent agents are beginning to be able to generalize
    control policy tasks, to grapple strategically with unknown tasks and achieve
    goals.


    Both cognitive scientists and AI researchers have attempted to discover the primitive
    mental operations from tasks which the real world needs to be composed. For example,
    neural networks or probabilistic programs have been equipped with operations like
    gating, recursion, or branching; or the computation of conjunctive (AND) and disjunction
    (NOT) operations for program induction. This is a very fundamental project to
