- pgno: 313
  md: '# Artificial intelligibility 301


    selected for their availability and convenience, they often make decisions which
    are unfair, opaque, or illogical. This is because these data are not curated to
    align their decisions with those that humans might make.


    The argument made here is that AI systems without human intelligence risk being
    either useless or unsafe. This further motivates the argument that when building
    AI, we should study and learn from natural intelligence. David Marr—bequeathed
    to the pioneer of theoretical neuroscience who died tragically young—a tripartite
    structure for describing a computational system. The highest level defines its
    computational goals, the intermediate level describes the algorithms developed
    to meet those goals, and the lowest level specifies the substrate in which those
    algorithms are implemented.⁴⁴ When I say that we should emulate nature, I do not
    mean that we should slavly try to mimic our neurons produce action potentials
    or mimic the varieties of transmitters and peptides for signalling. The utility
    of studying natural intelligence is at the computational and algorithmic levels.


    It remains to be seen whether we ever build systems with human-like general intelligence.
    But if we want any systems to be safe, and if we wish to employ them to make the
    world a better place, we should think carefully about the way in which evolution
    has given rise to natural general intelligence.


    ⁴⁴ Other terminology that has been used to make this distinction includes ''semantic,
    syntactic, and physical'', or ''content, form, and medium''. See (Glass et al.
    1979) and (Pylyshyn 1989).'
