  md: '# 8


    # A picture of the mind


    # 8.1 Where is my mind?


    One of A. A. Milne’s much-loved stories about Winnie the Pooh begins with Christopher
    Robin announcing that the friends are going on an ‘expedition’ to find the North
    Pole. They round up the other animals and set off, and after some distance has
    been travelled, their provisions have been eaten, and nasty thistle narrowly avoided
    (except by the morose donkey Eeyore), the story continues:


    Rabbit and Christopher Robin wandered a little way up the stream to have a private
    conversation, because Christopher Robin is not entirely sure what a North Pole
    would look like if you were standing right in front of one, and he wants to ask
    Rabbit’s advice. They both say that they used to know, although now they’ve forgotten,
    but then they decide that it must be just a pole stuck in the ground, and hence
    the name.


    The problem that the animals face is a familiar one. When setting out to find
    something, it is important to know what you are looking for.


    AI researchers hope to discover how to build AGI. The problem is that nobody really
    knows exactly what an AGI would look like. What would it be to do? What purpose
    would it have? What form would it take, and under what constraints would it operate?
    Is the goal build something that lives on your phone and does outset in natural
    language? Is it an embedded robot that is able to do your laundry and walk the
    dog? Or is it an algorithm embedded in our societal infrastructure to solve complex
    optimization problems, such as coordinating a fleet of autonomous vehicles, running
    a scientific laboratory, or stabilizing the economy by holding the reins of macroeconomic
    policy? Should we aim to build a single agent that can do all of these things,
    or a suite of more narrow technologies, each tailored for a single problem?


    Lacking a singular vision for the Singularity, AI researchers have instead turned
    to human generality as a blueprint. Humans are not constrained to perform a single,
    narrow task. A human could give sensible advice to her sister'
