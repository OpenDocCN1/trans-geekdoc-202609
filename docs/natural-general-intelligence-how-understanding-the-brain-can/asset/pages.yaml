  md: '# 300 A picture of the mind


    presumably not want to occupy the same place in society as humans do. Thus, it
    seems quite unlikely that any system we build will ever share our Umwelt. However,
    it is incumbent upon us, as we build stronger systems, to consider the extent
    to which their intelligence is intelligible to us. This project has already begun,
    with an upswing of interest in the ethics and safety of machine learning research
    and the foregrounding of human value alignment as a primary desideratum for AI.


    Across this book, we discussed the question: should try to build AI systems that
    emulate the structure and function of the human mind? In the AI community, some
    people advocate strongly against this. The prevailing view among many researchers—those
    who chose the bitter lesson—is that to mimic the ways humans learn, or to copy
    the way biological brains have evolved, is to lead astray in our pursuit of general
    intelligence. Instead, we argue that we should allow structured computation to
    emerge by itself, fostered by the twin engines of powerful optimization and massive
    computation.


    The use of self-play to solve board games—a method that allows for the development
    of new strategies, beyond those that humans have discovered—is emblematic of this.
    For example, AlphaZero played against instances of themselves to gradually learn
    from scratch, to becomes the strongest player of Chess, Shogi, and Go—even beating
    variants of itself that had been trained directly on human data. The resulting
    policies were, in some cases, unrecognizable to other human players. For example,
    in Shogi, AlphaZero was prone to moving its King to the centre of the board, defying
    conventional wisdom. In chess, a whole book was written discussing the merits
    of its unconventional play.


    The fact that AlphaZero made discoveries that enlarged human knowledge of chess
    and Go is remarkable. Adversarial games are special in that they entail a strictly
    defined goal. As we move out of the sandbox and into the real world, the risk
    is that allowing AI systems to learn in ways that are untethered to human knowledge
    and thought will encourage systems to spiral off into modes of thinking and patterns
    of behaviour that are unintelligible to people. If AI systems learn sophisticated
    policies that are divorced from human goals or concerns, or free mental states
    that we do not agree with or understand, their utility to us will be limited.
    We can already begin to see what happens when the data on which AI systems are
    trained are chosen indiscriminately. When supervised models learn from large-scale
    digital data


    > 42 See (Silver et al. 2018).

    43 See (Sadler & Regan 2019).'
