    In the 1970s and 1980s, whilst neural network researchers were working out the
    mathematics of backpropagation, the pioneers of RL were developing a suite of
    tools that allowed the Bellman equation to be solved by sheer tint of experience
    alone.${14}$ In fact, as early neural networks were proposed as models of human
    cognition, the first RL algorithms were advanced as computational accounts of
    classical conditioning in experimental animals.$^{15}$ In the early 1980s, a major
    breakthrough arrived in the form of temporal difference (TD) learning. TD learning
    capitalizes on the basic learning mechanism that underpins conditioning: it assumes
    that value is shared between temporally adjacent states. With repeated experience,
    value estimates gradually backwards through time and states until the optimal
    value function is learnt.


    To illustrate, consider an agent that is lost in Hampton maze. With no idea where
    to go, first it moves randomly. Eventually, it stumbles by chance on the exit
    and under our reward function, receives a large positive reinforcement. TD learning
    assumes that it then travels back in time to update the value of the immediately
    preceding state. The update $\Delta v$ is proportional to the temporal difference—the
    discrepancy between the value of the preceding state $v(s)$, and the (discounted)
    value of the current state $\gamma v(s_{t+1})$, plus the reward $r_{t+1}$ obtained
    by visiting it. Because this reward is 100 points, there is a large update to
    the getting (next-to-exit) state. On its next random sweep through the maze, the
    next-to-exit state is more valuable, so when reached, its value will flow back
    to the next-to-exit state.$^{16}$ Importantly, this backup of value does not require
    either of the states to be rewarded. Over repeated samples of experience, TD learning
    allows value to diffuse from rewarded states to those that predict them. This
    is exactly what happens in classical conditioning: for Pavlov''s dogs, the reward
    of food becomes attached to the metronome, and in the sea anemones, the aversive
    response occasioned by the shock infuses the light flash. TD learning provides
    an elegant theory of secondary reinforcement, and its discovery fired the starting
    gun on several decades of fertile conversation about reward learning betweenscientists
    and AI researchers.


    14 In fact, Paul Werbos contributed to both endeavours.


    15 See (Barto & Sutton 1982).


    16 Because $\gamma v(s_{t+1})$ is now large, thanks to learning on the previous
    trial.'
