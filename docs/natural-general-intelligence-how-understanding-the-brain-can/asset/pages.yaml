  md: '# Is reward enough? 213


    biological systems seek to control their observations to minimize surprise (or
    proxies).57 Surprise is a measure of how much a model of the world needs to be
    updated in order to account for new observations. The FEP proposes that agents
    use a principle of active inference to choose actions that will render sensory
    signals as predictable as possible. An implementational scheme based on predictive
    coding has been proposed, and the FEP claims to explain canonical morphological
    and physiological features of the primate brain, such as neural responses to prediction
    errors, recurrent connectivity, and gain control.58


    Is it plausible that our ultimate goal is for sensation to be as predictable as
    possible? Philosophers and cognitive scientists disagree sharply on this point.59
    One common critique of the FEP is that it seems to imply that people will strive
    to be left alone—in a ''dark room'' with minimal sensory stimulation. This seems
    out of kilter with our irresistible wave of rock music, carnivals, and rollerasters.
    More conceptually, the FEP collapses desires (I want an apple) entirely into beliefs
    (I want to satisfy the prediction that I will eat an apple when hungry, and so
    do I), which, for all its theoretical elegance, seems rather inconsistent with
    the quotidian experience of munching on a piece of fruit.


    For AI research, the proof of any intrinsic motivation is in the empirical pudding.
    Is it possible to train an agent to display intelligent behaviours without extrinsic
    reward, and with the goal of attempting to minimize its own surprise? Recently,
    a group led by the computer scientist Sergey Levine has begun to put this question
    to the test, using a paradigm self-supervised RL—where the agent is trained with
    intrinsic rewards.60 They find that an agent that models a partially observable
