  md: '# AI as neural theory 9


    agent''s brain by hand, allowing learning to proceed as value estimates of each
    state and action are updated according to a preferred learning rule.¹15


    By contrast, an AI system, for example one that solves the task directly from
    the screen pixels, has to learn a set of internal representations that allows
    it to maximize reward from scratch. In other words, it has to learn that the slot
    machines are the things that matter in the first place. This means that AI researchers,
    rather than neuroscientists, have led the charge in trying to understand principles
    of representation learning, that is how neural codes form as a function of experience—or
    specifically, as a function of its objective or cost function. Recently, neuroscientists
    have caught up, by copying the way that is conducted in AI research. For example,
    it is now popular to use benchmark machine learning problems as for experimentation,
    in an attempt to study how representations are formed in biology. This is a good
    start, but to make significant progress, we need learning paradigms that more
    closely resemble the problems that biological agents evolved to.


    Secondly, the challenges that AI researchers themselves are greater in scale.
    They come much closer to mirroring the mind-boggling complexity of the natural
    world. Neuroscience studies typically privilege experimental control over ecological
    validity, using home-grown, artificial stimuli and simple, stylized tasks, such
    as those that involve detecting whether a grating appears on the left or right
    of the screen.¹6 By contrast, AI researchers also draw their stimuli from external
    sources—they label photos that have been uploaded to the internet, download Wikipedia
    for language modelling, or scrape billions of board games from online servers
    to train their agents. Neuroscientists mostly ignore the question of whether the
    findings they obtain in simple settings will scale up to more realistic environments.
    For example, a typical model of the bandit task referred to above might comprise
    a handful of states and two or three free parameters, such as the learning rate
    or slope of the choice function. By contrast, even a simple network model will
    have hundreds of units (allowing an almost limitless number of possible states),
    and thousands of tunable synaptic weights (parameters). For AI researchers, questions
    of scalability are always central to the research program. If your algorithm doesn''t
    scale, it''s not worth pursuing.


    Finally, the agents built by AI researchers today actually have to behave. This
    is not usually the case for biological simulations, where models are instead'
