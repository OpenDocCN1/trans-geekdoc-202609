  md: '# 124 The structure of knowledge


    Powered by modern computers, deep networks today can process data from the ground
    up. In each processing cycle, hundreds, or even thousands, of pixel values from
    a photograph or video stream are fed directly to highimensional input layers.
    This allows neural networks to learn and generalize representations from naturalistic
    sensory data, and thus to solve realworld challenges, such as biometric facial
    identification or automated vehicle plate recognition. This opens the door to
    representations that are grounded in physical likeness (iconic concepts), spatiotemporal
    contingency (indexical concepts), or arbitrary categories trained with supervision
    (symbolic concepts). It also raises the empirical question of how representations
    in deep networks are formed in practice, and the normative question of which constraints
    will allow rich conceptual knowledge to emerge. How can we build AI systems that
    can grasp abstractions that only humans currently understand?


    The first forays into these questions began in the early 2000s, when deep networks
    started to show leaps and bounds on supervised classification of handwritten characters
    (such as MNIST²²) and natural objects (ImageNet). This invited researchers to
    dig into their hidden layers and perform the sort of experiments familiar to neuroscientists:
    to probe the inner workings of their brains by measuring their representational
    properties. This naturally led to the question of whether these neural code resemble
    those in biological systems. We treat deep networks not just as tools for engineering
    accurate predictions, but also as generalized theories of representation learning
    for the neural theory?


    Intriguingly, the brains of humans and deep networks exhibit striking similarities.
    When trained with supervision on benchmark tasks, such as ImageNet, supervised
    deep convolutional neural networks (CNNs) form visual representations that resemble
    those in neural data recorded from humans and other primates. This result is obtained
    in various ways, but perhaps the most compelling is the comparison between RDMs
    from neural activity patterns in the visual cortex⁹ The primate and network RDMs—viewed
    side by side—show striking similarities. In fact, some researchers have set sooner
    tests of this correspondence, by using advanced deep learning methods to predict
    how neurons should respond to unusual stimuli, or using networks to estimate how
    long it take a monkey to classify an image with a potentially ambiguous class.³
    This suggests that there are overlapping principles by


