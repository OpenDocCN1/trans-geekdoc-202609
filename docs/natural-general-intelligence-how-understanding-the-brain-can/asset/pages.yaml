    Fortunately, since the 1950s, we have known how to compute the optimal value function
    for any finite state MDP. The secret, which we owe to the mathematician Richard
    Bellman, is that the optimal value of any given state v''(s) is equal to any reward
    obtained in that state, plus the discounted value of the next state. The discount
    is a multiplier that downweights future value—it can be thought of as an impatience
    parameter, reflecting the heightened value of instant pleasure over delayed gratification.¹⁰
    An agent that makes choices that respect the optimal value function will also
    maximize reward over the maze. It is important to note that the optimal value
    function does not simply reduce to the reward function; for, in Hampton Court
    maze, it is better to be two steps from the exit than twenty steps away—even even
    if the expected reward obtained is -1 in cases. This is because the expected discounted
    return from the latter—the reward we expect in the near future—is higher in the
    2-step than in 20-step.¹¹ The Bellman explains why we favour positive experiences—such
    as when a child is excited on the eve of her birthday, even though presents and
    cake have to arrive.


    RL dramatically ups the theoretical ante for AI research. It opens a Pandora''s
