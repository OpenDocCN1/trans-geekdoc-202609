    in which monkeys learn to respond to the net direction of motion in a field of
    randomly moving dots by directing their gaze towards one of two targets. The animals
    are rewarded for making the correct choice, and learn slowly by instrumental conditioning.
    After training is complete, LIP signals code in advance for the decision that
    the monkey will make. The now canonical finding is that during stimulus,, the
    firing rates of LIP neurons ramp up or down with the momentary evidence that the
    saccade should be made to a target in their response field. This means each neuron’s
    instantaneous firing rate depends on its inputs and recurrent excitation from
    other neurons which shares a response field. During decision-making, two populations
    with recurrent excitation—each coding for a different target—mutually inhibit
    each other, creating a balanced dynamic system that competes to drive the monkey’s
    response. This model, first described by Xiao-Jing Wang in 2001, can explain the
    firing patterns of individual neurons (which build up towards an attractor state,
