- pgno: 27
  md: '# Mercurial optimism 15


    The AI effect happens because of the indeterminacy of what general AI really means.
    Narrow AI problems are ends in themselves. If we wish to build a system that can
    win at chess, or drive safely across London at night, then it is deemed successful
    when it can meet exactly those goals. But when it comes to general AI, the tasks
    we set our agents are not ends in themselves. Rather, these tasks are *proxies*
    for a loftier aim—a sort of meta-goal—is to endow the agent with the ability to
    solve new, unspecified, and different complex tasks that it has not encountered—or
    that have not been dreamed up yet. The challenge of choosing the right set of
    challenges to raise an agent to display this sort of general ability is sometimes
    called ‘the problem problem.’^{23}


    The AI effect arises when we confuse the goal (solving a narrow task) and the
    meta-goal (acquiring the knowledge and skills needed for general purpose intelligence).
    The conundrum, as we discuss, is that the meta-goal is ill-posed. What are new
    and different tasks that our agent should be able to solve? Is there a definitive
    list of knowledge or skills that an AGI should display? Unfortunately, a list
    does not exist. We lack a universally agreed criterion for general intelligence.
    So will we ever know when general AI has solved? Will it be a machine can converse
    fluently with us in all the world’s 7000 languages? When can it make a documentary
    film about the history of medicine, or canoe across the Atlantic? Or when all
    human labour is automated, ushering us towards a torpid life of ease? What is
    our success criterion?


    This fundamental indeterminacy also means that it is possible for the most experts
    to disagree violently about the outlook for building general intelligence, despite
    being exposed to exactly the same evidence. For example, in his 2014 book *Superintelligence*,
    the philosopher Nick Bostrom warns portously the most prominent prospect of strong
    AI:


    is quite possibly the most important and daunting challenge humanity has ever
    faced. Andwhether we succeed or fail—it is probably the last challenge we will
    ever face.


    Whilst his Oxford college Luciano Floridi—who is one of contrasting the optimism
    of the Singulatarians^{24} with the pessimism of the AI-theists (among whose number
    he counts himself)—cheerfully counters:


