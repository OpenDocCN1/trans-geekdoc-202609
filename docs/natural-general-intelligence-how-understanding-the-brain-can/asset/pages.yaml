    The problem of abstraction is to learn representations of the relations that exist
    in data. By learning relational abstractions, we can understand what concepts
    like same, more, or cyclic mean in ways that go beyond the sensory inputs. For
    instance, two horses can be faster than the other, but so can one be more delicious
    than another. A circus ring allows a performing horse to trot and around; the
    hypothetical Wheel of Fortune, which raises King Lear’s hopes and up down again,
    turns inevitably in a similar fashion. An explicit representation of an abstraction
    occurs when a neural population displays these sorts of invariances, coding for
    sameness, magnitude, or cyclicity (rather than horses, political views, or circuses).
    We could build machines that understand the meaning in these patterns, perhaps
    they would have the imaginative insight and gift for creative expressions that
    are currently reserved for humans.


    Even the more constrained problem of analogical reasoning remains unsolved in
    AI research. The work above is emblematic of the challenges that researchers face.
    Advanced network architectures, as relation nets, can explicitly segment object
    arrays into their elements and compute spatial relations between them. When the
    domain of the relation is similar—required generalization from colour to colour,
    or shape to shape—the network can transfer the relational functions g(o, o) to
    pairs of objects o, o. But the network never learns more abstract relational concepts,
