  md: '# AI as neural theory


    associated futurists—disagree about when we can expect the first glimmers of general
    intelligence in our artificial systems—with optimists forecasting the Singularity
    within decades or less, pessimists dismissing AI altogether as a quixotic fantasy.
    And finally, and most significantly, there is insufficient discussion of why general
    AI should be built. What is AI for, and what will it do? Companies such DeepMind
    and OpenAI promise to build AI for general human benefit—a well-intentioned, if
    somewhat vague, commitment—but whether this is possible remains to be. With every
    powerful new technology, there is ample scope for AI to be catastrophically misused.


    # AI as neural theory


    Naively posed, Turing''s question has a trivial answer. Machines that can think
    already exist. They are called brains and there are many trillions of them on
    this planet. You have one yourself, hewn by the deep time of evolution and tuned
    by years in the school of life. While AI remains a dense, NGI—natural general
    intelligence—is an ever-present reality. The thesis of this book is that in the
    attempt to build AI, we pay attention to how evolution solved natural intelligence.
    Biology provides us with a reassuring proof for thinking machines. But, I will
    argue, it does more than that. It gives us a sense of the set of problems that
    intelligent systems evolved to solve, and a rough guide to the solution concepts
    nature has devised. I would argue that we can think of natural intelligence as
    a blueprint for AI.¹10


    Understanding natural intelligence is the province of researchers in the cognitive
    and natural sciences. This group includes computational and systems neuroscientists,
    who conduct research by manipulating and recording from neural circuits, and modelling
    brain activity, as well as psychologists and cognitive scientists, who to reverse
    infer how brains work by examining the structure of behaviour, from both a normative
    standpoint (how people behave?) and a descriptive standpoint (how do people behave
    in practice?). Whilst the question of evolution''s recipe for intelligence will
    prove a fruitful inspiration for AI research, the converse is less controversial.
    Psychology and neuroscience have


