    breathing human rivals—against which to pit their systems. Games like checkers
    (draughts), backgammon, and Connect Four, which are relatively simple from a computational
    standpoint, were all effectively solved by computer systems by the end of the
    twentieth century. It is perhaps no coincidence that DeepMind has focused on board
