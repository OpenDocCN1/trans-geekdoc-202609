    In Adams'' comedy Hitchhiker''s Guide to the Galaxy, a hapless Englishman called
    Arthur Dent narrowly escapes the destruction of planet Earth and is forced against
    his will into an intergalactic adventure, clad only in a shabby dressing gown.
    As the story unfolds, Dent is, in turn, bewildered, daunted, and exacerbated by
    a series of alien concepts: that a towel is essential for space travel, and Vogon
    poetry is a form of torture, that the Earth was a supercomputer run by mice, and
    to understand foreign languages, you need to insert a small fish in your ear.
    Adrift in the far reaches of the universe, Dent never really grasps the basics
