    Questions of abstract representation are haunted by concerns over grounding. What
    is the sensory information that allows us to grasp the connection between a tricorn
    hat, the Holy Trinity, and Pascal''s triangle—when the physical embodiment and
    semantic context of these three concepts are so radically different? This question
    remains unsolved, but a venerable theory in psychology, dating back to the 1930s,
    offers some tantalizing hints. The idea is that affordances might be grounded
    in actions or, more precisely, the affordances exhibited by objects and locations.


    We owe the term affordance to husband-wife team J. J. and E. J. Gibson, who collectively
    pioneered what became known as the ecological approach to visual perception. J.
    J. Gibson defined the term as follows:¹


    The affordances of the environment are what it offers the animal, what it provides
    or furnishes, either for good or ill. The verb to afford is found in the dictionary,
    the noun afford is not. I have not made it up. I mean by it something that refers
    to both the environment and the animal in a way that no existing term does. It
    implies the complementarity of the animal and the environment.


    A chair affords sitting, a button pressing, and a mailbox affords posting. Affordances
    are the actions that an object invites by virtue of its physical form and habitual
    uses.


    What does it mean to say that abstractions are grounded in affordances? Recall
    that neural codes in the dorsal stream strip away the details by which an object
    might be recognized or discriminated, and instead signal the spatial target of
    the action it invites. In others, they code for affordances. For a hungry diner,
    a knife and fork on the table afford grasping and gripping, but a similar neural
    code would represent the anticipated movement towards a hammer and chisel on the
    workbench. For a birdwatcher, a sudden flash of colour above the trees affords
    a saccadic eye movement and pursuit with the gaze to identify a potentially rare
    species, but the same neural code would be used if the sudden colours in the sky
    were fireworks ushering in the New Year.


    > ¹ Gibson first defined the term in his 1966 book The Senses Considered as Perceptual
    Systems, but this quote is from his classic The Ecological Approach to Visual
    Perception (1979).'
