  md: '# Inductive biases 273


    In psychology, exactly the same debate between advocates of nativist empiricist
    theories of the mind has played out across the history of the discipline. These
    opposing views have risen and fallen from vogue in predictable alternation. The
    empiricist tradition, which dates back to Locke, sees the neonatal brain as a
    blank slate, ready to take its shape from the impress of the world. It found its
    radical expression in the behaviourist movement of the early twentieth century,
    when psychologists conceived of behaviour as driven entirely by learning reward.
    The later rise of cognition, in the era of Chomsky, Marr and Fodor, unseated this
    with a nativist rallying cry that emphasized the inevitability of language development,
    the hardened structure of information processing, and the modularity of the mind.
    However, empiricism resurged in the 1980s, when connectionist modelled argued
    that the brain is initialized tabula rasa, allowing a maximally general set of
    skills and knowledge to be acquired over the training provided by the lifespan.
    The turn towards Bayesian models of perception and cognition in the early 2000s
    caused a path back to nativism, by focusing on rational inference without large-scale
    parameter estimation. Thus, for a century or more, psychology has danced a theoretical
    jig from one to the other of the nativist-empiricist debate.


    Today, the nativist–empiricist view of fortune is turning again in psychology
    and neuroscience. The renaissance of connectionism in the form of powerful deep
    learning has piqued biologists'' interest in undifferentiated processing systems.
    Biological brains are multibillion neural networks, which display simple, endlessly
    duplicated motifs, such as the canonical microcircuit in the mammalian neocortex.
    Should we also see biological brains as monolithic processing architectures? Has
    evolution itself cleaved to the warning of the better lesson?


    A resurgent idea is that our neurobiological theories are convenient fiction that
