    ²⁶ In fact, if life does not have its structure objectively, we mentally experienced
    it as a sequence of distinct, discernible boundaries, akin to the scenes in a
    film (Kurby & Zacks 2008).


    ¹⁷ This is assuming the reader has a more vibrant social life than the author.'
