    reasoning from this shortcoming, by allowing beliefs to be computed by continuously
    varying probabilities.


    However, symbolic approaches to computation have a crucial advantage: they allow
    for limitless productivity from a limited number of mental primitives. Thus, symbolic
    representations of complex concepts (like second cousin once removed or faster
    sprinter or majority of delegates) need not each rely on a bespoke mental representation.
    Rather, elaborate can be composed from simpler building blocks using a set of
    formal rules. For example, rules describing family relations (cousins like a grandparent;
    second cousin a great-grandparent; the ''removal'' to generational difference)
    allows us to understand and express any concept of the form nth cousin k times
