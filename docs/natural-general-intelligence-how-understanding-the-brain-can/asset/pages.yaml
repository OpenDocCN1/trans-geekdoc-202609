- pgno: 227
  md: '# Is reward enough? 215


    Cast in the language of information theory, the concept of empowerment formalizes
    the degree of influence that an agent has over its future environment. Those actions
    with the highest empowerment are those that allow the greatest variety of subsequent
    observations to be experienced.63 If I am a cat in a cage, I will be determined
    to escape, to see the world beyond its bars. If I lack a corkscrew, I will search
    for, so I can sample the fine wine my friend just gave me. If I am in a lowly
    professional role, I will seek promotion, so that I can have greater influence
    over the actions of my colleagues and the policies of my organization.


    In AI research, empowerment can be estimated using an approach known as variational
    inference, and has proved to be a useful concept for skill learning in unsupervised
    RL. For example, empowerment has been used to discover options within the framework
    as hierarchical RL, where the agent learns multi-step macro-actions, the completion
    of which is (pseudo-) rewarded, leading to improved performance in studies requiring
    agents to navigate environments with bottleneck states (i.e. doors) or to push
    blocks around to reach a goal, or learn complex motor skills in the MujCo physics
    environment.64


    In sum, biological systems are powerfully motivated to activate their own interests.
    If we could understand the principles that animate natural behaviour and recreate
    them in AI, then this would be an important brick in the road towards intelligence.
    Of course, in the natural world, organisms universally evolved to maximize reproductive
    fitness. But given the difficulty of working out which actions will increase or
    decrease their fitness, animals have evolved proxies—internal and external variables
    that they seek to maximize or minimize instead. Hedonic reward—the pleasurable
    sensations that are evoked by consumatory behaviors—is one variable. The demand
    to explore the world, finding out what is around the next corner, over the next
    hill, or written on the next page, is another major impetus. The desire for order
    and control—to exert influence over others, to solve a puzzle, to live in a tidy
    house and an orderly society, and to control their sensations, health, and mind—is
    another. It seems likely finding the right mix of extrinsic and intrinsic variables
    for RL in AI research is the most significant outstanding challenges today.


