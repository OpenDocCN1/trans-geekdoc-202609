    In previous chapters, we argued that the natural world is highly structured, and
    advances in AI systems could capitalize on that structure to build stronger agents.
    Here, the same argument is made. In this case, the structure is in time: it is
    given by the autocorrelation of sensory inputs and task-objects in a dynamic RL
    environment. Biological agents have evolved complex memory systems to handle the
    dependencies that exist between different moments in time. As we will see, those
    relations are idiosyncratic, which is why our memory system has a complex modular
    structure. To build advanced systems for RL in the real world, our agents will
    need to account for the temporal structure of natural experience.


    # 7.4 Finding Structure in time


    Memory systems allow agents to share information with themselves across time.
    So far, we have highlighted a single computational principle for memory: the experience-dependent
    modification of synaptic weights. This is the mechanism by which feedforward deep
    networks like AlexNet or DQN slowly learn a function that maps image pixels onto
    outputs. This is how the neocortex learns stable, generalizable representations
    from long-term averages of experience, and is also the base for fast plastic changes
    in the hippocampus that permit immediate storage of salient events. We have seen
    that when the world is structured in time, learning with synaptic memory alone
    can be challenging for deep RL agents such as DQN. Correlations in observations
    and rewards inflate the variance of gradients calculated optimization, creating
    unstable learning dynamics, and expose the network to catastrophic forgetting.


    However, this is a paradoxical claim. Structure in time should help—not hurt—learning
    in neural networks. Networks should be able to harness structure to make predictions
    about the future. In the 1980s, researchers began to realize this. A paper published
    by the cognitive scientist Jeffrey Elman with the title *Finding Structure in
    Time* provided an early demonstration of how neural networks can use activation
    memory (recurrence) to maintain information without synaptic change, with applications
    in sequence'
