  md: '# When there is no there, there 147


    The streams of data that we access through the senses contain information about
    how the world is structured. However, sensory signals are variable, noisy, multidimensional,
    non-linear, composite, cluttered, complex, and confusing. Excavating meaning from
    sensory throughput is a daunting task, even for powerful networks equipped with
    millions of parameters and trained on millions of images. Upon useful knowledge
    is intricately entangled and hopelessly undecipherable. Because training data
    are finite, and the problem is Herculean, machine learning researchers have turned
    to architectural priors—inductive biases—that are built in knowledge of how the
    world is organized. The world has a *non-accidental* structure, that is, there
    are deep regularities in how sensory signals are constituted. Consider three examples:
    the world being *clumpy*, the world being *smooth*, and the world being *friable*.


    The world being clumpy means that there are clusters of similar objects that physically
    resemble one another (such as birds) but are different from other objects (such
    as toasters). This means that CNNs, like AlexNet, use local receptivity and layerwise
    image transformations that are geared to disentangle patterns of features, and
    group them into distinct classes. clumps are position- and context-invariant,
    so the networks can learn filters that are automatically shared across space—allowing
    it to intuit that a bird at a kitchen counter is still a bird, and a toaster in
    a tree is still a toaster. The world being smooth means that high-dimensional
    sensory signals can be compactly described by a small number of latent factors.
    This means that models, such as a VAE, can extract knowledge of the axes on which
    faces, trees, or cars vary smoothly, allowing the network to make predictions
    by interpolating or extrapolating in this latent space. Finally, the world being
    *friable* (or *''crumby''*) means that it is divided into discrete entities (objects)
    which are broken off from a larger whole (the background). A kitchen counter is
    stacked with plates; a lawn is littered with leaves. This means that Relation
    Networks can learn and generalize a canonical set of relational properties, such
    as encoding what it means for two adjacent objects to be perched on a larger object—and
    thus to understand the structural commonality between kittens on a labrador and
    a family on a motorbike.


    AI researchers often strive to eliminate human assumptions about how intelligence
    works through the technologies they build. Luminaries such as Rich


