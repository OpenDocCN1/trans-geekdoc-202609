  md: '# 7.5 Mental gymnastics


    With 19 gold medals in world championship competitions, Simone Biles is the most
    decorated gymnast of all time. She took a historic four gold medals in the 2016
    Summer Olympic Games in Rio de Janeiro, including the individual all-round artistic
    event, which requires athletes to excel at the vault, uneven bars, balance beam,
    and floor exercise. Each of these four exercises demands a finely choreographed
    routine with several elements. For example, on the balance beam, gymnasts mount
    a 5 metre-long beam of wood that is suspended no than a metre off the ground,
    and perform a sequence of dance moves, twirls, jumps, and handstands, before leaping
    acrobatically to the ground. In the women''s final, Biles awarded the highest
    scores on all four exercises. Each component of each exercise is itself minutes
    scripted and practised to perfection. For example, Biles'' dismount from the balance
    beam began with a back handspring, launching her high into the air from the edge
    of the beam, allowing time for a somersault with full lateral rotation and a second
    somersault on the descent, culminating in a flawless landing (Figure 7.9). She
    was the only female competitor to score over 15 points on this exercise in 2016.


    Intelligence is often defined as the ability to perform a diversity of tasks.
    In English, the word task refers to a unit of purposeful behaviour: a task is
    defined by an objective that we wish to satisfy in a given context, and the rules
    that constrain how it might be achieved. Thus, in the modern, developed world,
    we find ourselves tackling tasks such as assembling a flat-pack chest of drawers,
    booking a city break in Prague, solving a long division problem alongside a confused
    child, or preparing a baked Alaska for a special dessert. For Simon Biles, there
    was a more daunting task to be solved in summer of 2016—how to handle this challenge
    and how it was met, as it gives us a window into how tasks are represented in
    the brain, and how control processes can be deployed to allow the execution of
    complex behaviors.


    Tasks can be represented hierarchically. Most tasks contain subtasks, which may
    themselves be composed of smaller units of purpose.³⁶ For Biles and her fellow
