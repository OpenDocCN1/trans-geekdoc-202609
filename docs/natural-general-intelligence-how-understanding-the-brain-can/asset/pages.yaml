  md: '# The structure of knowledge


    discusss the nature of human knowledge, and ask how it might be possible to build
    AI systems that learn a, conceptual model of the world like humans do. We will
    consider the promise and pitfalls of building machines that know.


    Our knowledge is who we are. From the moment we are born, great waves of sensory
    data wash relentlessly over us. Much of this information is encoded—laid down
    as memory traces in neural circuits. These memories are layered one on top of
    the other, and are gradually smoothed, sifted, and calcified, until they form
    the hard contours of what we know. All mental and physical acts—all of our thoughts
    and behaviour—are filtered through this knowledge of the world. When our knowledge
    is erased, when dementia creeps upon us of older age, it is catastrophic—lose
    our entire identity. The Greek philosopher Socrates famously boasted about his
    ignorance—he claimed his true knowledge was how little he knew. However, as a
    distinguished soldier, landowner, and philosopher, who (like other wealthy Athenians)
    enjoyed a gilded education in music, poetry, gymnastics, and law, it is likely
    that he was selling himself short. Socrates knew a lot of stuff.


    The capacity of human memory is very hard to estimate, but it is undoubtedly large.
    In a classic experiment in 1973, the psychologist Standing showed groups of participants
    large numbers of photographic slides, each for a few seconds, and requested that
    they remember as many as possible for a later test. One group of five participants
    were subjected to a particularly gruelling learning phase during which they viewed
    10,000 images—totalling more than 15 hours of study. Two days later, they were
    tested on their recognition memory by being asked to discriminate a subset of
    ''old'' items (those from the training set) by ''new'' (those that were not).
    Extrapolating from their accuracy back up to the full image set, Standing estimated
    that in the group who had the 10,000 photographs, nearly 7000 had been successfully
    encoded. By far, the most remarkable finding, was that his observation of successfully
    recognized items continued to scale lawfully with the size of the training set
    (Figure 4.1). In other words, the more data we are, the more we remember. This
    suggests that, in effect, the capacity of human memory is theoretically limitless.


