    of memory in the neocortex remained a mystery. In 1950, Karl Lashley had published
    a report documenting his search for the engram—the elusive trace of memory in
    the brain—by lesioning increasingly portions of rat neocortex. Lashley''s findings
    implied that lesion location mattered less than lesion volume—larger lesions invariably
    provoking greater impairment. concluded that memory was distributed widely across
    the brain, a principle he called mass action.54


    Fuster was inspired by experiments conducted at Yale University in the 1930s.
    In series of Carlyle Jacobsen measured the effect of lesions in the vicinity of
    the sulcus principalis, the major fissure that divides the dorsolateral from the
    ventrolateral PFC, in the maybe monkey. In one test, food was hidden under one
    of two cups in full view of the monkey, but the animal was only allowed to retrieve
    a morsel after a delay period lasting up to a few minutes. Jacobsen describes
    the results as follows:


    The tests of delayed response, however, revealed a profound deficit in what may
