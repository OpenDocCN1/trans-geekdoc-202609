    End-to-end learning means that an agent acquires the building blocks of intelligence
    by experience, with minimal researcher intervention (Figure 1.2). In the era of
    modern AI research, powered by deep networks, end-to-end learning has become the
    norm. This contrasts with standard practice in cognitive science, where the relevant
    input states, and the computations upon them, tend to be hand-designed by the
    researcher. For example, in one popular paradigm that we shall encounter in Chapter
