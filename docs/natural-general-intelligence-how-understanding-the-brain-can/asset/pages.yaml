    Understanding how to build AI systems that generalize effectively to novel tasks
    remains a frontier in AI research. Similarly, Breakout and Pong both involve the
    use of a paddle, a tool that can be moved horizontally or vertically in both games,
    and thus incurring a negative outcome. However, despite the near-identical game
    logic implied by the use of a paddle in both games, DQN had to learn a unique
