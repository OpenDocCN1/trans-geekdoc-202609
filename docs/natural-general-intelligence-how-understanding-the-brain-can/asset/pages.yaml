  md: '# The structure of knowledge


    The idea that the natural world offers up its abstractions from sensory data alone
    echoes a long-standing theme in developmental psychology. Even before they learn
    language, children seem to understand what objects are. They sense how objects
    interact physically and know how they can be grouped. Infants as young as 12 weeks
    can perceive object boundaries, in occluded parts, and predict when objects move
    or come to rest.46 They can also discriminate basic visual categories, such as
    shapes (squares and triangles) and animals (birds and dogs).47


    Recently, researchers have started to gather large-scale data sets documenting
    the visual experience of human infants, by embedding a camera in a beanie that
    is constantly worn as the babies about their daily lives.48 Capitalizing on such
    data comprising tens of thousands of head images, a team of researchers at New
    York University asked whether a generative model in principle allowed the formation
    of high-level object categories from naturalistic sensory experience. After training,
    the representations learned by the model could be mapped linearly onto high-level
    categories from a labelled set focusing on toys49 (such as car, spoon, helicopter).
    This implies that self-super is, in theory, sufficient to allow for the formation
    of high-level concepts, even when explicit object labels are unavailable.


