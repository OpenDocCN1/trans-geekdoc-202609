    Eratosthenes might be using Hebb''s intelligence A, by thinking logically about
    sequences of integers; or he could be drawn on Hebb''s intelligence B, by generalizing
    his world knowledge from the kitchen cupboard to the number theory. These are
    the two routes to intelligence—thinking and knowing—that have been woven across
    the pages of this book to tell a story about natural intelligence.


    The natural world is infinitely restless, and each experience is at least partly
    novel. This means that intelligent agents are obliged to generalize. The problem
    that agents face—the meta-task for natural intelligence—is to learn about the
    environment in a way that prepares for an unspecified transfer problem in an uncertain
    world. The most general forms of understanding, and the strongest forms of generalization,
    occur when agents acquire abstract concepts. In psychology and neuroscience, a
    great deal of research has been directed to studying how humans acquire the knowledge
    that permeates their mental landscape—including semantic knowledge about people
    and places, and even more abstract relational knowledge as the fact that trees
    and biological taxa share a common hierarchical structure. As we have seen, the
    world has a stereotyped structure, so agents that learn and develop in ways that
    prepare for that structure will be maximally adapted to solve the meta-task.


    We typically think of generalization as relying on neural codes for perceptual,
    semantic, or relational information in memory. For a vanilla deep learning system,
    such as a convolutional neural network to recognize natural scenes, the formation
    of abstractions allows sophisticated forms of pattern recognition. For example,
    we have seen that deep networks trained on ImageNet learn neural codes that signal
    both objects and high-level categories. When we use multimodal input signals that
    mix language and visual information—as in foundation models—deep networks can
    even learn highly abstract semantic categories, such as Christmas and African.
    In this class of model, in which mappings are learnt among iconic representations
    (e.g. images) and symbolic representations (e.g. words), concepts act like keys
    that automatically unlock meaning. Thus, the concept of a cat automatically links
