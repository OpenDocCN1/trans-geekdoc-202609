- pgno: 19
  md: '# AI as neural theory 7


    (behaviourism), learning in neural networks (connectionism), or decisions made
    by probabilistic inference (Bayesianism), as well as theories that emphasize structured
    forms of information processing (cognitivism).


    However, each of these frameworks suffers from important limitations.¹³nBehaviourism
    struggles to explain forms of learning that rely on imitation or instruction and
    cannot account for the complex structure of language or memory systems. Bayesianism
    places poor constraints on representation learning and suffers from issues of
    computational tractability and falsifiability. Connectionism fails to explain
    how old knowledge and new knowledge are combined, and overlooks the native structure
    given to the mind at birth. Cognitivism is more like a jumbled set of constraints
    on information processing than a coherent computational framework, and tends to
    bound behavioural predictions only loosely. Each of these approaches has ultimately
    fallen short. Today, there is no single prevailing theory of how behaviour is
    structured, and no overarching account of the computational origins of intelligence.


    Thus, neither psychology nor neuroscience has provided us with something resembling
    a standard model.¹⁴ In this sense, they differ from adjacent disciplines, as physics
    or evolutionary biology, where research is scaffolded around unified theoretical
    frameworks that provide fundamental forces or principles for natural selection.
    The science of brain function lacks general theories. We might say that is *nomothetically*
    impoverished.


    Notably, however, general theories of brain function are starting to emerge in
    computer science departments and AI research institutes. This is because the brain
    modelling challenge for AI researchers is fundamentally different in nature and
    scope from that tackled in neuroscience. Notably, it does not afford the soft
    option of dividing and conquering, because the agent will fail if any of its component
    functions (e.g. perception, memory, or decision-making) is not to scratch. Moreover,
    there are at least three challenges for modelling intelligence that AI researchers
    routinely tackle, neuroscientists have mostly ignored this favor. To describe
    these challenges, I use the terms *end-to-learning*, scale, and *untethering*.
    By addressing these challenges, scientists might begin to open the door to broader
    theories of intelligent brain function.


    ¹³ These arguments are expanded later in the book.


    ¹⁴ Occasionally, neuroscientists have claimed to offer general theories.*Predictive
    coding* and the closely related *Free Energy Principle* have been proposed—by
    the irreplaceable Karl Friston—as a general principle for brain function, and
    indeed for biology itself (Friston 2010). But I think it is probably fair to say
    that whilst these theories have provided useful explanations of existing data,
    they have not yet been shown to have strong predictive power.'
