- raw: "*   If you want to achieve better results, look for the on-line documentation\
    \ of the command before using it. \n\n*   Look at your data maybe your data is\
    \ not what you have thought \n\n*   Look at the structure of the code.\n\nA common\
    \ problem is variable definition in the workspace and the variable define in local\
    \ space may have the same names. This can be illustrated with the help of R code:\n\
    \n\\> data(trees); str(trees)\n\n\\`data.frame': 31 obs. of 3 variables:\n\n$\
    \ Girth : num 8.3 8.6 8.8 10.5 10.7 10.8 11 11 11.1 ...\n\n$ Height: num 70 65\
    \ 63 72 81 83 66 75 80 75 ...\n\n$ Volume: num 10.3 10.3 10.2 16.4 18.8 19.7 15.6\
    \ 18.2 ...\n\n\\> (Volume <- sample(1:31))\n\n\\[1\\] 6 7 3 21 22 1 24 9 11 14\
    \ 19 13 20 8 5 30 29 31  \n\n\\[19\\] 18 10 23 15 12 27 16 2 26 17 28 4 25\n\n\
    \\> attach(trees)\n\n\\> cor(Volume, Girth)\n\n\\[1\\] 0.30725\n\nNow this is\
    \ not the expected value. \n\nIt is very low, and we know that a tree’s volume\
    \ should be fairly well correlated with its girth. What is wrong? Listing the\
    \ workspace gives a clue:\n\n\\> ls()\n\n\\[1\\] \"Volume\" \"trees\"  \n\n >\
    \ cor(trees$Volume, Girth)\n\n\\[1\\] 0.96712\n\n\\> rm(Volume)\n\n\\> cor(Volume,\
    \ Girth)\n\n\\[1\\] 0.96712\n\nOpening the Black Box\n\nNow is the time to get\
    \ more into this R language. In this section we will test a variety of techniques.\n\
    \nThe Dataset\n\nIn this dataset section we will use wine dataset form UCI repository.\
    \ Our Goal is to predict best quality of wine of which there are seven values\
    \ in total (integers 3-9). We will turn our dataset in binary classification task\
    \ to predict whether the quality of wine is good or not, which is arbitrarily\
    \ chosen as 6 or higher. There is one thing that we need to remember that there\
    \ are very few 3s or 9s so we really have to work with 5 values only, but aside\
    \ from quality of wine there it also contains predictors such as sugar, alcohol\
    \ content, and acidity or other features of wine. \n\nThe original wine dataset\
    \ from UCI repository is divided into white and red sets. We have combined these\
    \ sets and add additional variables; color and its numeric version white indicating\
    \ white or red, and good, indicating scores greater than or equal to 6 (denoted\
    \ as ’Good’).\n\nwine = read.csv(\"http://www.nd.edu/~mclark19/learn/data/goodwine.csv\"\
    )\n\nsummary(wine)\n\nR Implementation\n\nBefore doing this, we will have to install\
    \ and load the caret package in R. This package is very helpful in implementing\
    \ of validation, data partitioning, performance assessment of the given dataset,\
    \ and predictions about the data once it’s trained. Once the package is installed\
    \ it is a very genuine approach to use your computer resources as much possible\
    \ as you can because some of these procedures takes more time, and more with the\
    \ type of data you have. If you have more data it will take more time and it you\
    \ have less data it will take less time. For example, if your computer is quad\
    \ core that means your processor has four cores that independently acting as CPUs.\
    \ You can set up R for parallel processing with the code given below, this will\
    \ allow the newly installed package caret to assign task to three cores simultaneously.\
    \ \n\nlibrary(doSNOW) \n\nregisterDoSNOW(makeCluster(3, type = \"SOCK\"))\n\n\
    Feature Selection & the Data Partition \n\nTo leave a holdout sample this data\
    \ set is large enough, and this data set allows us to search for the best given\
    \ modelling approach initially, over a grid of tuning parameters specific to the\
    \ technique. In this we don’t want the test performance to be contaminated with\
    \ the tuning process to iterate previous discussion. With the best model at t\
    \ tuning parameter(s), performance will be asses with the prediction on holdout\
    \ set. To deal with notably collinearity in the data I have made some decisions,\
    \ which can severely hamper some methods. To deal with let’s have a look at the\
    \ simple correlation matrix:\n\nlibrary(corrplot) \n\ncorrplot(cor(wine\\[, -c(13,\
    \ 15)\\]), method = \"number\", tl.cex = 0.5)\n\n![](images/00013.jpeg)\n\nRegression\
    \ analysis is running all over the data to examine the r-squared for each predictor\
    \ in a model as they were dependent variable predicted by other input variable.\
    \ Density was the highest at over 96%, and further investigation reveals that\
    \ color and either sulfur dioxide is captured by other variables, well these will\
    \ not be included in the following models. \n\nThe purpose of using caret package\
    \ is that it has his own partitioning function which we can use to separate our\
    \ data into training and test data. The total number of the observations are 6497\
    \ out of them I will put 80% into the training set. The function createDataPartition\
    \ will produce indices that will use as training set. Once this is done we will\
    \ normalize the continuous variable to \\[0, 1\\]. Training of data set will be\
    \ done as training process so that all the subsets under consideration are scaled\
    \ properly, but for the set of tests set we will do it now.\n\nlibrary(caret)\
    \ \n\nset.seed(1234) #so that the indices will be the same when re-run trainIndices\
    \ = createDataPartition(wine$good, p = 0.8, list = F) \n\nwine\\_train = wine\\\
    [trainIndices, -c(6, 8, 12:14)\\] #remove quality and color, as well as density\
    \ and others \n\nwine\\_test = wine\\[!1:nrow(wine) %in% trainIndices, -c(6, 8,\
    \ 12:14)\\] \n\n\\# prep\\_test = preProcess(wine\\_test\\[,-10\\], method='range')\
    \ wine\\_test = \n\n\\# data.frame(predict(prep\\_test, wine\\_test\\[,-10\\]),\
    \ good=wine\\_test\\[ ,10\\])\n\nwine\\_trainplot = predict(preProcess(wine\\\
    _train\\[, -10\\], method = \"range\"), wine\\_train\\[, -10\\]) \n\nfeaturePlot(wine\\\
    _trainplot, wine\\_train$good, \"box\")\n\n![](images/00014.jpeg)\n\nK-nearest\
    \ Neighbors\n\nTo choose something like Euclidean distance as a metric, then each\
    \ point in the matrix says about the value of how far observation is from some\
    \ other point, and on a set of variables respective values are given. This approach\
    \ is commonly used because it will exploit this information for predictive purpose.\
    \ To illustrate this, we will take a classification example, suppose k=5 neighbors. \
    \ Let say we have a given observation x(i), now based on predictive variables\
    \ find 5 closet k neighbor in terms of Euclidean distance. To obtain the continuous\
    \ outcome we might take, mean of those neighbors as a prediction.\n\nIn this algorithm\
    \ caret package provide different methods for validation some of them are listed\
    \ as k-fold, bootstrap, leave-one-out and others. For this we will use 10-fold\
    \ cross validation.   \n\n#set.seed(1234)\n\ncv\\_opts = trainControl(method=\"\
    cv\", number=10)\n\nknn\\_opts = data.frame(.k=c(seq(3, 11, 2), 25, 51, 101))\
    \ #odd to avoid ties\n\nresults\\_knn = train(good~., data=wine\\_train, method=\"\
    knn\",\n\npreProcess=\"range\", trControl=cv\\_opts,\n\ntuneGrid = knn\\_opts)\n\
    \nresults\\_knn\n\nStrengths \n\n*   Our approach is Intuitive\n\n*   Robust to\
    \ outliers on the predictors\n\nWeaknesses\n\n*   Susceptible to irrelevant features.\
    \ \n\n*   Susceptible to correlated inputs. \n\n*   Ability to handle data of\
    \ mixed types. \n\n*   Big data. Though approaches are available that help in\
    \ this regard.\n\nNeural Networks\n\nNeural networks have been implemented for\
    \ so long as a core concept of artificial intelligence and even as a machine learning\
    \ algorithm and it works well in this case as well. In most of the case, these\
    \ networks are considered as a nonlinear regression. Basically, visually we can\
    \ seem them as a bunch of layers of inputs and outputs. The inputs that are created\
    \ as weighted combination and pass through some method and this method will generate\
    \ a new layer of input. The new layer is passed through another function to create\
    \ one more layer or we can predict the output, which will be the final layer.\
    \ All layers that are between input layer and output layer are names as hidden\
    \ layer. Now in the case neural networks if there is no hidden layer then this\
    \ network is considered as a standard regression problem. \n\n![](images/00015.jpeg)"
