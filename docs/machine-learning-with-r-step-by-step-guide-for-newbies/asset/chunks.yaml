    \ `library(e1071)` 即可。有一点你需要记住：你只需要安装一次包，但每次启动 R 时都必须加载它。\n\n# 运行代码\n你可以通过简单在命令行中输入不同类型的命令来在\
    \ R 中运行任何类型的代码，但这不允许你保存代码或重复运行它，甚至不允许分享你的代码。与其如此，不如点击顶部菜单上的“File”（文件）并点击“New script”（新建脚本）。现在会打开一个新窗口，你可以在其中轻松地保存\
    \ R 文件。现在，如果你想执行在该窗口中编写的代码，只需高亮你想要运行的代码段，然后在 PC 上按 `Ctrl-R` 或在 MAC 上按 `Command-Enter`\
    \ 即可。如果你想运行在新窗口中编写的整个脚本，只需确保你的脚本窗口在所有其他窗口的上方，然后点击“Edit”（编辑）并点击“Run all”（运行所有）。所有运行的行都会以红色出现在命令提示符中。\n\
    \n# R 中的帮助\nR 中的所有函数都有非常详尽的文档，以防你想研究相应函数的细节。为此，如果你需要查找任何特定函数的文档，只需在命令提示符中输入 `?`\
    \ 后直接跟上函数名。例如：`?FunctionName`。\n\n"
