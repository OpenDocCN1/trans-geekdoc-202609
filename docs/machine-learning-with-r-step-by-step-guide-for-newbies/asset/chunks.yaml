- raw: "I hoped that this book shed some light on the topics that might be unfamiliar\
    \ to some applied researchers. The field of machine learning has rapidly evolved\
    \ over the past few decades with probability and statistics as its core part.\
    \ In data analysis regression is an important problem, and this is not extensively\
    \ dealt with Machine learning community. So, in this book we have discussed a\
    \ system that is capable of learning regression rules. Regression models that\
    \ are built by R have a benefit of achieving better prediction accuracy, when\
    \ compared to other model approaches. In this book we have also discussed that\
    \ our model compares to other machine learning algorithm, implemented in R outperforms\
    \ them on some data sets. However, in most of the cases due to the large size\
    \ of the data sets many differences are not statistically significant. We have\
    \ also discussed how to improve the performance and efficiency of R code using\
    \ Rccp package. In Future our aim is to explore new techniques that will enable\
    \ our systems to deal with large scale domains. To deal with large scale domain\
    \ methods like sampling and iterative regression modeling will help to overcome\
    \ these problems. \n\nThank you ! \n\nThank you for buying this book! It is intended\
    \ to help you understanding machine learning using R. If you enjoyed this book\
