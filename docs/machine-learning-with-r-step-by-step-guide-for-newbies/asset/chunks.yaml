    # MACHINE LEARNING WITH R

    ## Step By Step Guide For Newbies


    Dominic Lordy


    ![C:\\Users\\CHADAD\\Downloads\\intelligent.png](images/00001.jpeg)


    ## How to contact us


    If you find any damage, editing issues or any other issues in this book contain
    please immediately notify our customer service by email at:


    [contact@aisciences.com](mailto:contact@aisciences.com)


    Our goal is to provide high-quality books for your technical learning in computer
    science subjects.


    Thank you so much for buying this book.


    ![C:\\Users\\CHADAD\\Downloads\\intelligent.png](images/00002.jpeg)


    ## Preface


    “Some people call this artificial intelligence, but the reality is this technology
    will enhance us. So instead of artificial intelligence, I think we''ll augment
    our intelligence.”


    ―—Ginni Rometty


    The main purpose of this book is to provide the reader with the most fundamental
    knowledge of machine learning with `R` so that they can understand what these
    are all about.


    ### Book Objectives


    This book will help you:

    * Have an appreciation for machine learning and an understanding of their fundamental
    principles.

    * Have an elementary grasp of machine learning concepts and algorithms.

    * Have achieved a technical background in machine learning and also deep learning


    ### Target Users


    The book designed for a variety of target audiences. The most suitable users would
    include:

    * Newbies in computer science techniques and machine learning

    * Professionals in machine learning and social sciences

    * Professors, lecturers or tutors who are looking to find better ways to explain
    the content to their students in the simplest and easiest way

    * Students and academicians, especially those focusing on machine learning practical
    guide using `R`


    ### Is this book for me?


    If you want to smash machine learning from scratch, this book is for you. Little
    programming experience is required. If you already wrote a few lines of code and
    recognize basic programming statements, you’ll be OK.


