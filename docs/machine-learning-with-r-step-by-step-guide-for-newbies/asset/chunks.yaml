    \n#### set the working directory\n```r\nsetwd(\"C:/STAT 897D data mining\")\n\
    ```\n\n#### comma delimited data and no header for each variable\n```r\nRawData\
    \ <- read.table(\"diabetes.data\",sep = \",\",header=FALSE)\nresponseY <- RawData[,dim(RawData)[2]]\n\
    predictorX <- RawData[,1:(dim(RawData)[2]-1)]\npca <- princomp(predictorX, cor=T)\
    \ # principal components analysis using correlation matrix\npc.comp <- pca$scores\n\
    pc.comp1 <- -1*pc.comp[,1] # principal component 1 scores (negated for convenience)\n\
    pc.comp2 <- -1*pc.comp[,2] # principal component 2 scores (negated for convenience)\n\
    X <- cbind(pc.comp1, pc.comp2)\ncl <- kmeans(X,13)\ncl$cluster\nplot(pc.comp1,\
    \ pc.comp2,col=cl$cluster)\npoints(cl$centers, pch=16)\n```\n```r\nlibrary(knn)\n\
    x <- cbind(x_train,y_train)\n# Fitting model\nfit <-knn(y_train ~ ., data = x,k=5)\n\
    summary(fit)\n#Predict Output\npredicted= predict(fit,x_test)\n```\n\nNow to generate\
    \ K-means clustering models for characterization use `h2o.kmeans()`. On dependent\
    \ variable this algorithm dose not rely.\n\nExample\n```r\nh2o.kmeans(training_frame\
    \ = iris.hex, k = 3, x = 4)\n```\n\nModel Details:\nH2OClusteringModel: kmeans\n\
    Model ID: kmeans_model_R_1441892043830\nModel Summary:\nnumber_of_rows: 150\n\
    number_of_clusters: 3\ncategorical_columns: 0\nnumber_of_iterations: 10\ncluster_sum_of_squares:\
    \ 139.092\ntotal_sum_of_squares: 456.008\nH2OClusteringMetrics: kmeans **Reported\
    \ on training data.**\nTotal SS: 139.092\nBetween SS: 456.008\nTotal SS: 596\n\
    Centroid Statistics:\ncentroid size: 1\nwithin_cluster_of_squares: 44.674\n\n\
    # AdaBoost\n\nThere are various numbers of the boosting functions in R language.\
    \ Given below is the one example in which implementation is done using decision\
    \ trees as a base classifier. For this we have to install and load `rpart` package.\
    \ Also, the boosting function `ada` is in `ada` package. Suppose, `x` be the matrix\
    \ of features and `labels` be a vector of 0-1 class labels. The command is:\n\n\
    ```r\nboost_model <- ada(x=X, y=labels)\n```\n```r\nrequire(caret)\nx <- cbind(x_train,y_train)\n\
    # Fitting model\nTrainControl <- trainControl( method = \"repeatedcv\", number\
    \ = 10, repeats = 4)\nmodel<- train(y ~ ., data = x, method = \"xgbLinear\", trControl\
    \ = TrainControl,verbose = FALSE)\n```\nOR\n```r\nmodel<- train(y ~ ., data =\
    \ x, method = \"xgbTree\", trControl = TrainControl,verbose = FALSE)\n```\n```r\n\
    predicted <- predict(model, x_test)\n```\n\n# Naive Bayes\n\nTo run this algorithm,\
    \ you must have to install and load `e1071` package.\n\n```r\nnB_model <- naiveBayes(y\
    \ ∼ x1 + x2, data=as.data.frame(cbind(y,x1,x2)))\n```\n```r\nlibrary(e1071)\n\
    x <- cbind(x_train,y_train)\n# Fitting model\nfit <-naiveBayes(y_train ~ ., data\
    \ = x)\nsummary(fit)\n#Predict Output\npredicted= predict(fit,x_test)\n```\n\n\
    # Generalized Liner Model (GLM)\n\nBasically, these types of models are used generally\
    \ for many types of data analysis use cases. Most of the time some data can be\
    \ analyzed by using this model, but there is an issue with these models in their\
    \ results cannot be as accurate if the variables are complex. For instance, if\
    \ the dependent variable has non-continuous distribution, if the effect of the\
    \ predictor is not linear, so in both cases generalized linear model can produce\
    \ better accuracy results as compared to general linear model.\n\nThe core concept\
    \ behind these models is that they estimate regression models for the outcomes\
    \ followed by the exponential distribution in general. They also include Poisson,\
    \ binomial, gamma, tweedie distribution along with Gaussian distribution, so depending\
    \ on the distribution and link function choice each depends on the different purpose\
    \ either for prediction or classification. For developing linear model we have\
    \ to generate generalized linear model using exponential distribution `h2o.glm()`.\n\
    \nExample\n```r\nprostate.hex <- h2o.importFile(path = \"https://raw.github.com/h2oai/h2o/master/smalldata/logreg/prostate.csv\"\
    , destination_frame = \"prostate.hex\")\n```\n```r\nprostate.glm<-h2o.glm(y =\
    \ \"CAPSULE\", x = c(\"AGE\",\"RACE\",\"PSA\",\"DCAPS\"), training_frame = prostate.hex,\
    \ family = \"binomial\", nfolds = 10, alpha = 0.5)\n```\n```r\nprostate.glm@model$cross_validation\n\
    H2OBinomMetrics: glm **Reported on cross-validation data.**\nDescription: 10-fold\
    \ cross-validation\nMSE: 0.2093902\nR^2: 0.129427\nLogLoss: 0.6095525\nAUC: 0.690996\n\
    Gini: 0.381993\nNull Deviance: 513.8229\nResidual Deviance: 463.2599\nAIC: 473.2599\n\
    Confusion Matrix for F1-optimal threshold:\n01 Error Rate\n0 122 105 0.462555=227\n\
    1 41 112 0.267974=153\nTotals 163 217 0.384211=380\nMaximum Metrics:\nmetric threshold\
    \ value idx\n1 max f1 0.312978 0.605405 216\n2 max f2 0.138305 0.772727 377\n\
    3 max f0.5 0.400689 0.628141 110\n4 max accuracy 0.400689 0.700000 110\n5 max\
    \ precision 0.998848 1.000000 0\n6 max absolute_MCC 0.400689 0.357638 110\n```\n\
    \n# Data with R\n\n## Objects\n\nTill now we have seen that R works with the objects\
    \ that are characterized by their names and their content. R also works with the\
    \ objects that have attributes which specify the kind of data represented by an\
    \ object. In order to have a better understanding of these objects consider the\
    \ variable having value 1, 2, 3: but this variable could be integer variable or\
    \ it would be coding of categorical variables.\n"
  trans: "\n下面的示例将解释如何将此算法应用于蘑菇数据集。在应用此算法之前，请注意数据集必须是二值发生矩阵；且它们的列名必须对应于构成“交易”的“项目”。一旦你运行了以下命令，将显示结果的摘要和生成的规则列表：\n\
    \n```r\ndataset <- read.csv(\"C:\\\\\\\\Datasets\\\\\\\\mushroom.csv\", header\
    \ = TRUE) \nmushroom_rules <- apriori(as.matrix(dataset), parameter = list(supp\
    \ = 0.8, conf = 0.9)) \nsummary(mushroom_rules)\ninspect(mushroom_rules)\n```\n\
    \n# 逻辑回归\n\n在 R 语言中运行此算法，你不需要安装额外的包。\n\n```r\nglm_mod <-glm(y ∼ x1+x2, family=binomial(link=\"\
    logit\"), data=as.data.frame(cbind(y,x1,x2)))\n```\n\n## 该算法在数据集上的逐步实现。\n\n####\
    \ 加载数据\n```r\ndata <- read.csv(\"data.csv\")\n```\n\n#### 创建图表\n```r\nplot(data$score.1,data$score.2,col=as.factor(data$label),xlab=\"\
    Score-1\",ylab=\"Score-2\")\n```\n\n#### 预测变量\n```r\nX <- as.matrix(data[,c(1,2)]\
    \ )\n```\n\n####为 X 添加全 1 列\n```r\nX <- cbind(rep(1,nrow(X)),X)\n```\n\n#### 响应变量\n\
    ```r\nY <- as.matrix(data$label)\n```\n\n#### Sigmoid 函数\n```r\nsigmoid <- function(z)\n\
    {\n  g <- 1/(1+exp(-z))\n  return(g)\n}\n```\n\n#### 代价函数\n```r\ncost <- function(theta)\n\
    {\n  m <- nrow(X)\n  g <- sigmoid(X%*%theta)\n  J <- (1/m)*sum((-Y*log(g)) - ((1-Y)*log(1-g)))\n\
    \  return(J)\n}\n```\n\n#### 初始 theta\n```r\ninitial_theta <- rep(0,ncol(X))\n\
    ```\n\n#### 初始 theta 处的代价\n```r\ncost(initial_theta)\n```\n\n#### 使用 optim 函数通过梯度下降推导\
    \ theta\n```r\ntheta_optim <- optim(par=initial_theta,fn=cost)\n```\n\n#### 设置\
    \ theta\n```r\ntheta <- theta_optim$par\n```\n\n#### theta 优值的代价\n```r\ntheta_optim$value\n\
    ```\n\n#### 学生的录取概率\n```r\nprob <- sigmoid(t(c(1,45,85))%*%theta)\n```\n```r\n\
    x <- cbind(x_train,y_train)\n```\n\n#### 使用训练集训练模型并检查得分\n```r\nlogistic <- glm(y_train\
    \ ~ ., data = x,family='binomial')\nsummary(logistic)\n```\n\n#### 预测输出\n```r\n\
    predicted= predict(logistic,x_test)\n```\n\n# K-Means 聚类\n\n要实现此算法，如果 x 是数据矩阵且\
    \ m 是聚类数，你也不需要安装额外的包，你的命令行命令将是：\n\n```r\nkmeans_model <- kmeans(x=X, centers=m)\n\
    ```\n\n#### 设置工作目录\n```r\nsetwd(\"C:/STAT 897D data mining\")\n```\n\n#### 逗号分隔数据且每个变量无标题\n\
    ```r\nRawData <- read.table(\"diabetes.data\",sep = \",\",header=FALSE)\nresponseY\
    \ <- RawData[,dim(RawData)[2]]\npredictorX <- RawData[,1:(dim(RawData)[2]-1)]\n\
    pca <- princomp(predictorX, cor=T) # 使用相关矩阵进行主成分分析\npc.comp <- pca$scores\npc.comp1\
    \ <- -1*pc.comp[,1] # 主成分 1（为了方便起）\npc.comp2 <- -1*pc.comp[,2] # 主成分 2（为了方便起）\n\
    X <- cbind(pc.comp1, pc.comp2)\ncl <- kmeans(X,13)\ncl$cluster\nplot(pc.comp1,\
    \ pc.comp2,col=cl$cluster)\npoints(cl$centers, pch=16)\n```r\nlibrary(knn)\nx\
    \ <- cbind(x_train,y_train)\n# 拟合模型\nfit <-knn(y_train ~ ., data = x,k=5)\nsummary(fit)\n\
    # 预测输出\npredicted= predict(fit,x_test)\n```\n\n现在使用 `h2o.kmeans()` 为表征生成 K-means\
    \ 聚类模型。对于依赖变量，该算法有效。\n示例\n```r\nh2o.kmeans(training_frame = iris.hex, k = 3, x\
    \ = 4)\n```\n\n模型详情：\nH2O ClusteringModel: kmeans\nModel ID: kmeans_model_R14419204380\n\
    Model Summary:\nnumber_of_rows: 150\nnumber_of_clusters: 3\ncategorical_columns:\
    \ 0\nnumber_of_iterations: 10\ncluster_sum_of_squares: 139.092\ntotal_sum_of_squares:\
    \ 456.008\nH2O ClusteringMetrics 基于交叉验证数据的报告：\nTotal SS: 139.092\nBetween SS:\
    \ 456.008\nTotal SS: 596\nCentroid Statistics:\ncentroid size: 1\nwithin_cluster_of_squares:\
    \ 44.674\n\n# AdaBoost\n\nR 语言中有许多种 boosting 函数。下面是一个使用决策树实现的示例。为此，我们需要安装并加载 `rpart`\
    \ 包。此外，boosting 函数 `ada` 位于 `ada` 包中。假设 `x` 是特征矩阵，`labels` 是 0-1 类标签。命令是：\n\n\
    ```r\nboost_model <- ada(x=X, y=labels)\n```\n```r\nrequire(caret)\nx <- cbind(x_train,y_train)\n\
    # 拟合模型\nTrainControl <- trainControl(method = \"repeatedcv\", number = 10, repeats\
    \ = 4)\nmodel<- train(y ~ ., data = x, method = \"xgbLinear\", trControl = TrainControl,verbose\
    \ = FALSE)\n```\n或者\n```r\nmodel<- train(y ~ ., data = x, method = \"xgbTree\"\
    , trControl = TrainControl,verbose = FALSE)\n```\n```r\npredicted <- predict(model,\
    \ x_test)\n```\n\n# 朴贝叶斯\n\n要运行此算法，你必须安装并加载 `e1071` 包。\n\n```r\nnB_model <- naiveBayes(y\
    \ ∼ x1 + x2, data=as.data.frame(cbind(y,x1,x2)))\n```\n```r\nlibrary(e1071)\n\
    x <- cbind(x_train,y_train)\n# 拟合模型\nfit <-naiveBayes(y_train ~ ., data = x)\n\
    summary(fit)\n# 预测输出\npredicted= predict(fit,x_test)\n```\n\n# 广义线性模型 (GLM)\n\n\
    基本上，这类模型通常用于许多数据分析场景。大多数情况下可以使用此模型分析数据，但如果变量复杂，这些模型的结果可能不够准确。例如，如果因变量是非连续分布，如果预测变量的影响是非线性的，在这两种情况下，广义线性模型比普通线性模型产生更准确的结果。这些模型的核心概念是它们估计结果通常为指数分布的回归模型。它们还包括泊松、二项、伽马、tweedie\
    \ 分布以及高斯分布，因此分布和链接函数的选择取决于预测或分类的不同目的。为了开发线性模型，我们需要使用指数分布生成广义线性模型 `h2o.glm()`。\n\
    \n示例\n```r\nprostate.hex <- h2o.importFile(path = \"https://raw.github.com/h2oai/h2o/master/smalldata/logreg/prostate.csv\"\
    , destination_frame = \"prostate.hex\")\n```\n```r\nprostate.glm<-h2o.glm(y =\
    \ \"CAPSULE\", x = c(\"AGE\",\"RACE\",\"PSA\",\"DCAPS\"), training_frame = prostate.hex,\
    \ family = \"binomial\", nfolds = 10, alpha = 0.5)\n```\n```r\nprostate.glm@model$cross_validation\n\
    H2OBinomMetrics: glm 基于交叉验证数据的报告：\nDescription: 10 折交叉验证\nMSE: 0.2093902\nR²:\
    \ 0.129427\nLogLoss: 0.6095525\nAUC: 0.690996\nGini: 0.381993\nNull Deviance:\
    \ 513.8229\nResidual Deviance: 463.2599\nAIC: 473.2599\nF1 最佳阈值的混淆矩阵：\n01 错误率\n\
    0 122 105 0.462555=227\n1 41 112 0.267974=153\nTotals 163 217 0.384211=380\n最大指标：\n\
    metric threshold value idx\n1 max f1 0.312978 0.605405 216\n2 max f2 0.138305\
    \ 0.772727 377\n3 max f0.5 0.400689 0.628141 110\n4 max accuracy 0.400689 0.700000\
    \ 110\n5 max precision 0.998848 1.000000 0\n6 max absolute_MCC 0.400689 0.357638\
    \ 110\n```\n"
