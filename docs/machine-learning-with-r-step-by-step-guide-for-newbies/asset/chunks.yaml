  fmt: "\nThe main problem with neural networks is to determine how many hidden layers\
    \ are there and how many hidden units in a layer. The neural network will face\
    \ a variance problem if the network is very complex and less generalized, this\
    \ will also happen if there is less relevant information in the training data.\
    \ The executing of neural network might slow down your pc if your pc doesn’t have\
    \ multiple processors. You can replace the method with `nnet` and shorten the\
    \ `tuneLength` to 3 which will be faster without much loss of accuracy.\n\n```\n\
    results_nnet = train(good~., data=wine_train, method=\"avNNet\", trControl=cv_opts,\
    \ preProcess=\"range\", tuneLength=5, trace=F, maxit=1000) \nresults_nnet\n```\n\
    \nWith the help of this we can clearly see that our best model has 9 hidden layer\
    \ nodes and decay parameter of 0. Now the first thought that came to your mind\
    \ is how many hidden units you want to examine in terms of the amount of data\
    \ you have, and in our case, we have a very decent amount. In our case we have\
    \ to start with a broad range of the values for the number of inputs and then\
    \ we have to narrow our focus, but we some of the weight decay, we must be able\
    \ to avoid overfitting. The accuracy is increased up-to 1.5% by using up-to 50\
    \ hidden units.\n\n```\npreds_nnet = predict(results_nnet, wine_test[,-10]) \n\
    confusionMatrix(preds_nnet, wine_test[,10], positive='Good')\n```\n\n### Strengths\n\
    - Good prediction generally\n- Incorporating the predictive power of different\
    \ combinations of inputs\n- Some tolerance to correlated inputs\n\n### Weaknesses\n\
    - Susceptible to irrelevant features\n- Not robust to outliers\n- Big data with\
    \ complex models\n\n### Trees and Forests\nThere is a different approach to prediction\
    \ that are provided by classification and regression trees. Suppose we have two\
    \ input variable one is single input and other is binary independent. We have\
    \ done this because we have to find a point where if we partition the data at\
    \ that point we will get a best classification accuracy and for that we have to\
    \ search all the values of the input. For example, there is a single variable\
    \ whose range might be from 1 to 10, we find that a cut at 5.75 is the best classification\
    \ result if all the observation that we have are greater than, or equal to 5.75\
    \ are considered as best positive result and rest as negative. So basically, the\
    \ purpose for explaining this is that this approach is easy to learn or grasp\
    \ and that is the main reason tree approaches are appealing.\n\n![](images/00016.jpeg)\n\
    \nNow on a range from 1 to 10 add a second input. With the help of this input\
    \ we might get a better classification results, if we are only looking upon the\
    \ data regarding those greater and equal to 5.75 which we have already classified\
    \ as positive result even if they are less than 3 on the second input variable.\n\
    \nThe example tree given above is based on wine training data set. The `Tree`\
    \ is interpreted as follows: wine is classified as good if the alcohol content\
    \ is greater than 10.63%, if alcohol content is less than 10.63% but its volatile\
    \ acidity is also less than .25 in that case wine will also be classified as good,\
    \ and for the other observations, we have if the percentage is least more than\
    \ 9.85% it is also classified as good, other than this all the remaining observations\
    \ are classified as bad wine.\n\n```\nset.seed(1234)\nrf_opts = data.frame(.mtry=c(2:6))\n\
    results_rf = train(good~., data=wine_train, method=\"rf\",\npreProcess='range',trControl=cv_opts,\
    \ tuneGrid=rf_opts,\nn.tree=1000)\nresults_rf\n```\n\n- 5199 samples\n- 9 predictors\n\
    - 2 classes: 'Bad', 'Good'\n- Pre-processing: re-scaling to [0, 1]\n- Resampling:\
    \ Cross-Validation (10 fold)\n- Summary of sample sizes: 4679, 4679, 4680, 4679,\
    \ 4679, 4679, ...\n- Resampling results across tuning parameters:\n\n| mtry |\
    \ Accuracy | Kappa | Accuracy SD | Kappa SD |\n|---|---|---|---|---|\n| 2 | 0.8\
    \ | 0.6 | 0.02 | 0.04 |\n| 3 | 0.8 | 0.6 | 0.02 | 0.04 |\n| 4 | 0.8 | 0.6 | 0.02\
    \ | 0.04 |\n| 5 | 0.8 | 0.6 | 0.02 | 0.04 |\n| 6 | 0.8 | 0.6 | 0.02 | 0.04 |\n\
    \nAccuracy was used to select the optimal model using the largest value. The final\
    \ value used for the model was `mtry = 2`. The initial results look promising\
    \ with `mtry = 2` producing the best result. Now for application to the test set.\n\
    \n```\npreds_rf = predict(results_rf, wine_test[,-10])\nconfusionMatrix(preds_rf,\
    \ wine_test[,10], positive='Good')\n```\n\n| Prediction | Bad | Good |\n|---|---|---|\n\
    | Bad | 335 | 91 |\n| Good | 141 | 731 |\n\n- Accuracy: 0.821\n- 95% CI: (0.799,\
    \ 0.842)\n- No Information Rate: 0.633\n- P-Value [Acc > NIR]: < 2e-16\n- Kappa:\
    \ 0.606\n- McNemar's Test P-Value: 0.0013\n- Sensitivity: 0.889\n- Specificity:\
    \ 0.704\n- Pos Pred Value: 0.838\n- Neg Pred Value: 0.786\n- Prevalence: 0.633\n\
    - Detection Rate: 0.563\n- Detection Prevalence: 0.672\n- 'Positive' Class: Good\n\
    \n```\nlibrary(rpart)\nx <- cbind(x_train,y_train)\nfit <- rpart(y_train ~ .,\
    \ x,method=\"class\")\nsummary(fit)\npredicted= predict(fit,x_test)\n```\nOur\
    \ best result so far with the accuracy of 82.31%.\n\n```\nlibrary(randomForest)\n\
    x <- cbind(x_train,y_train)\nfit <- randomForest(Species ~ ., x,ntree=500)\nsummary(fit)\n\
    predicted= predict(fit,x_test)\n```\n\n### Support Vector Machines\nIn this section\
    \ discussion on Support vector machine will be our last example, because it is\
    \ perhaps the least intuitive. Basically, the working of `SVM` is as follows,\
    \ it seeks to map input space via kernel to a higher dimension, meanwhile this\
    \ process transformed feature space, find a hyperplane that will result in maximal\
    \ separation of the data. To have a better understanding of this procedure is\
    \ the figure given above which have two inputs `x` and `y`. No separation between\
    \ classes is shown by cursory. However, to find a clearer separation in the following\
    \ figure we must have to map data to higher dimensions. But at this point there\
    \ is a point to remember that there are a number of choices in regard to kernel\
    \ function that performs the mapping, but in our case in higher dimension, a decision\
    \ boundary is chosen in order to get maximum distance between the classes.\n\n\
    ```\nset.seed(1234)\nresults_svm = train(good~., data=wine_train, method=\"svmLinear\"\
    ,\npreProcess=\"range\", trControl=cv_opts, tuneLength=5)\nresults_svm\n```\n\n\
    - 5199 samples\n- 9 predictors\n- 2 classes: 'Bad', 'Good'\n- Pre-processing:\
    \ re-scaling to [0, 1]\n- Resampling: Cross-Validation (10 fold)\n- Summary of\
    \ sample sizes: 4679, 4679, 4680, 4679, 4679, 4679, ...\n- Resampling results\
    \ across tuning parameters:\n\n| C | Accuracy | Kappa | Accuracy SD | Kappa SD\
    \ |\n|---|---|---|---|---|\n| 0.2 | 0.7 | 0.4 | 0.02 | 0.05 |\n| 0.5 | 0.7 | 0.4\
    \ | 0.02 | 0.05 |\n| 1 | 0.7 | 0.4 | 0.02 | 0.05 |\n| 2 | 0.7 | 0.4 | 0.02 | 0.04\
    \ |\n| 4 | 0.7 | 0.4 | 0.02 | 0.05 |\n\nAccuracy was used to select the optimal\
    \ model using the largest value. The final value used for the model was `C = 0.5`.\n\
    \n```\nclass1\nclass2\nclass1\nclass2\npreds_svm = predict(results_svm, wine_test[,-10])\n\
    confusionMatrix(preds_svm, wine_test[,10], positive='Good')\n```\n\n| Prediction\
    \ | Bad | Good |\n|---|---|---|\n| Bad | 268 | 123 |\n| Good | 208 | 699 |\n\n\
    - Accuracy: 0.745\n- 95% CI: (0.72, 0.769)\n- No Information Rate: 0.633\n- P-Value\
    \ [Acc > NIR]: < 2e-16\n- Kappa: 0.43\n- McNemar's Test P-Value: 3.89e-06\n- Sensitivity:\
    \ 0.850\n- Specificity: 0.563\n- Pos Pred Value: 0.771\n- Neg Pred Value: 0.685\n\
    - Prevalence: 0.633\n- Detection Rate: 0.539\n- Detection Prevalence: 0.699\n\
    - 'Positive' Class: Good\n\n![](images/00017.jpeg)\n\n```\nset.seed(3233)\nsvm_Radial\
    \ <- train(V14 ~., data = training, method = \"svmRadial\",\ntrControl=trctrl,\n\
    preProcess = c(\"center\", \"scale\"),\ntuneLength = 10)\nsvm_Radial\n```\nSupport\
    \ Vector Machines with Radial Basis Function Kernel\n- 210 samples\n- 13 predictor\n\
    - 2 classes: '0', '1'\n"
  trans: "\n神经网络的主要问题在于确定有多少个隐藏层以及每层中有多少个隐藏单元单元。如果网络非常复杂且泛化能力差，神经网络将面临方差问题，如果训练数据中的相关信息较少，也会发生这种情况。如果你的电脑没有多处理器，运行神经网络可能会减慢你的电脑速度。你可以将方法替换为\
    \ `nnet` 并将 `tuneLength` 缩短为 3，这样在不损失太多精度的情况下速度会更快。\n\n```\nresults_nnet = train(good~.,\
    \ data=wine_train, method=\"avNNet\", trControl=cv_opts, preProcess=\"range\"\
    , tuneLength=5, trace=F, maxit=1000) \nresults_nnet\n```\n\n通过此，我们可以清楚地看到我们的最佳模型具有\
    \ 9 个隐藏层节点和衰减参数 0。现在你脑海中出现的第一个想法是，根据你拥有的数据量想要检查多少个隐藏单元，而在我们的案例中，数据量是非常充足的。在这种情况下，我们必须从输入数量的宽范围开始，然后缩小关注范围，但通过一些权重衰减，我们能够避免过拟合。通过使用多达\
    \ 50 个隐藏单元，准确率提升了 1.5%。\n\n```\npreds_nnet = predict(results_nnet, wine_test[,-10])\
    \ \nconfusionMatrix(preds_nnet, wine_test[,10], positive='Good')\n```\n\n### 优点\n\
    - 通常情况下预测效果良好\n- 结合了不同输入组合的预测能力\n- 对相关输入具有一定的容忍度\n\n### 缺点\n- 易受到无关特征的影响\n- 对离群值不稳健\n\
    - 大数据配合复杂模型\n\n### 树与森林\n分类和回归树提供了一种不同的预测方法。假设我们有两个输入变量，一个是单输入，另一个是二值独立变量。我们这样做是因为我们必须找到一个点，如果我们在该点划分数据，我们将获得最佳的分类准确率，为此我们必须搜索输入的所有值。例如，有一个单变量的范围可能从\
    \ 1 到 10，我们发现如果在 5.75 处进行切割是最佳分类结果，如果我们拥有的所有大于或等于 5.75 的观测值都被视为最佳正结果，其余视为负结果。所以基本上，解释这一点的目的是这种方法易于学习或理解，这是树方法具有吸引力的主要原因。\n\
    \n![](img/00016.jpeg)\n\n现在在 1 到 10 的范围内添加第二个输入。在这个输入的帮助下，我们可能会获得更好的分类结果，如果我们只看那些大于并等于\
    \ 5.75 的数据（我们已经将它们分类为正结果，即使它们在第二个输入变量上小于 3）。\n\n上面的示例树是基于葡萄酒训练数据集。`Tree` 的解释如下：如果酒精含量大于\
    \ 10.63%，则葡萄酒被归类为好酒；如果酒精含量小于 10.63% 但其挥发性酸也小于 .25，在这种情况下葡萄酒也将分类为好酒；对于其他观测值，如果百分比至少大于\
    \ 9.85%，则也被分类为好酒，其余观测值都被分类为坏酒。\n\n```\nset.seed(1234)\nrf_opts = data.frame(mtry=c(2:6))\n\
    results_rf = train(good~., data=wine_train, method=\"rf\",\npreProcess='range',trControl=cv_opts,\
    \ tuneGrid=rf_opts,\nn.tree=1000)\nresults_rf\n```\n\n- 5199 个样本\n- 9 个预测变量\n\
    - 2 类：'Bad', 'Good'\n- 预处理：缩缩到 [0, 1]\n- 重采样：交叉验证 (10 折)\n- 样本量摘要：4679, 4679,\
    \ 4680, 4679, 4679, 4679, ...\n- 调优参数的重采样结果：\n\n| mtry | Accuracy | Kappa | Accuracy\
    \ SD | Kappa SD |\n|---|---|---|---|---|\n| 2 | 0.8 | 0.6 | 0.02 | 0.04 |\n| 3\
    \ | 0.8 | 0.6 | 0.02 | 0.04 |\n| 4 | 0.8 | 0.6 | 0.02 | 0.04 |\n| 5 | 0.8 | 0.6\
    \ | 0.02 | 0.04 |\n| 6 | 0.8 | 0.6 | 0.02 | 0.04 |\n\n使用最大值通过 Accuracy 来选择最优模型。最终使用的值是\
    \ `mtry = 2`。初始结果 `mtry = 2` 看起来很有前景。现在应用于测试集。\n\n```\npreds_rf = predict(results_rf,\
    \ wine_test[,-10])\nconfusionMatrix(preds_rf, wine_test[,10], positive='Good')\n\
    ```\n\n| Prediction | Bad | Good |\n|---|---|---|\n| Bad | 335 | 91 |\n| Good\
    \ | 141 | 731 |\n\n- 率：0.821\n- 95% CI: (0.799, 0.442)\n- 无信息率：0.633\n- P 值 [Acc\
    \ > NIR]: < 2e-16\n- Kappa: 0.606\n- McNemar 检验 P 值: 0.0013\n- 灵敏度 (Sensitivity):\
    \ 0.889\n- 特异性 (Specificity): 0.704\n- 正预测值 (Pos Pred Value): 0.838\n- 负预测值 (Neg\
    \ Pred Value): 0.786\n- 流行率 (Prevalence): 0.633\n- 检测率 (Detection Rate): 0.563\n\
    - 检测流行率 (Detection Prevalence): 0.672\n- 'Positive' 类：Good\n\n```\nlibrary(rpart)\n\
    x <- cbind(x_train,y_train)\nfit <- rpart(y_train ~ ., x,method=\"class\")\nsummary(fit)\n\
    predicted= predict(fit,x_test)\n```\n到目前我们的最佳结果准确率为 82.31%。\n\n```\nlibrary(randomForest)\n\
    x <- cbind(x_train,y_train)\nfit <- randomForest(Species ~ ., x,ntree=500)\nsummary(fit)\n\
    predicted= predict(fit,x_test)\n```\n\n### 支持机\n本节关于支持机将是最后一个示例，因为它可能是最不直观的。基本上，`SVM`\
    \ 的工作如下：它试图通过核将输入空间映射到高维，同时这个过程转换了特征空间，找到一个导致数据最大分离的超平面。为了更好地理解这个过程，见上面的图，它有两个输入\
    \ `x` 和 `y`。粗略显示类别之间没有分离。然而，要在图中找到更清晰的分离，我们必须将数据映射到更高维。但在这一点需要记住，执行映射的核函数有很多选择，但在我们的案例中，在高维中选择了一个决策边界以获得类别之间的最大距离。\n\
    \n```\nset.seed(1234)\nresults_svm = train(good~., data=wine_train, method=\"\
    svmLinear\",\npreProcess=\"range\", trControl=cv_opts, tuneLength=5)\nresults_svm\n\
    ```\n\n- 5199 个样本\n- 9 个预测变量\n- 2 类：'Bad', 'Good'\n- 预处理：缩放到 [0, 1]\n- 重采样：交叉验证\
    \ (10 折)\n- 样本量摘要：4679, 4679, 4680, 4679, 4679, 4679, ...\n- 调优参数的重采样结果：\n\n|\
    \ C | Accuracy | Kappa | Accuracy SD | Kappa SD |\n|---|---|---|---|---|\n| 0.2\
    \ | 0.7 | 0.4 | 0.02 | 0.05 |\n| 0.5 | 0.7 | 0.4 | 0.02 | 0.05 |\n| 1 | 0.7 |\
    \ 0.4 | 0.02 | 0.05 |\n| 2 | 0.7 | 0.4 | 0.02 | 0.04 |\n| 4 | 0.7 | 0.4 | 0.02\
    \ | 0.05 |\n\n使用最大值通过 Accuracy 选择最优模型。最终使用的值是 `C = 0.5`。\n\n```\nclass1\nclass2\n\
    class1\nclass2\npreds_svm = predict(results_svm, wine_test[,-10])\nconfusionMatrix(preds_svm,\
    \ wine_test[,10], positive='Good')\n```\n\n| Prediction | Bad | Good |\n|---|---|---|\n\
    | Bad | 268 | 123 |\n| Good | 208 | 699 |\n\n- 准确：0.745\n- 95% CI: (0.72, 0.769)\n\
    - 无信息率：0.633\n- P 值 [Acc > NIR]: < 2e-16\n- Kappa: 0.43\n- McNemar 检验 P 值: 3.89e-06\n\
    - 灵敏度 (Sensitivity): 0.850\n- 特异性 (Specificity): 0.563\n- 正预测值 (Pos Pred Value):\
    \ 0.771\n- 负预测值 (Neg Pred Value): 0.685\n- 流行率 (Prevalence): 0.633\n- 检测率 (Detection\
    \ Rate): 0.539\n- 检测流行率 (Detection Prevalence): 0.699\n- 'Positive' 类：Good\n\n\
    ![](img/00017.jpeg)\n\n```\nset.seed(3233)\nsvm_Radial <- train(V14 ~., data =\
    \ training, method = \"svmRadial\",\ntrControl=trctrl,\npreProcess = c(\"center\"\
    , \"scale\"),\ntuneLength = 10)\nsvm_Radial\n```\n带有径向基核的支持机\n- 210 个样本\n- 13\
    \ 个预测变量\n- 2 类：'0', '1'\n"
