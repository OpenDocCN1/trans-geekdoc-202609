  trans: "\n因此，从上述语句可以明显看出在 `R` 中对该变量进行统计分析在两种情况下将是不相同的。所以，属性告诉了我们关于对象的重要信息。简单来说，函数对对象的操作取决于后者的属性。\n\
    \n我们拥的所有对象都包含两个属性：`mode`（模式）和 `length`（长度）。模式有四类型，它是对象的要素元素，类型为 `numeric`（数值）、`logical`（逻辑）、`complex`（复数）和\
    \ `character`（字符）。还有其他类型的模式，但它们并不代表数据，例如函数和表达式。另一个属性 `length` 定义了对象的元素数量。因此，要显示这两个属性，我们可以使用\
    \ `mode` 和 `length` 函数。\n\n```r\nx <- 1\nmode(x)\n[1] \"numeric\"\nlength(x)\n\
    [1] 1\n\nA <- \"Gomphotherium\"; compar <- TRUE; z <- 1i\nmode(A); mode(compar);\
    \ mode(z)\n[1] \"character\"\n[1] \"logical\"\n[1] \"complex\"\n```\n\n无论模式是什么，缺失数据都用\
    \ `NA`（不可用）表示。\n\n非常大的数值可以使用指数计数法来指定：\n\n```r\nN <- 2.1e23\nN\n[1] 2.1e+23\n```\n\
    \nR 正确地表示非有限数值：\n\n```r\nx <- 5/0\nx\n[1] Inf\nexp(x)\n[1] Inf\nexp(-x)\n[1] 0\n\
