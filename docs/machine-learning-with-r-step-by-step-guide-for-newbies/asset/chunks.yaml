    \  header = TRUE,\n    sep = \"\\\\t\",\n    quote = \"\\\\\"\")\n```\n\n## Have\
    \ a look at the first row of your file\n\n```r\nhead(vehicle)\n```\n\n## Loading\
    \ the dplyr library\n\n```r\nlibrary(dplyr)\n```\n\n## Select a subset of columns\n\
    \n```r\ntemp.subset <- select(\n    .data = vehicle, \n    Transmission,\n   \
    \ Cylinders,\n    Fuel.Economy)\n```\n\n## Inspect the results\n\n```r\nhead(temp.subset)\n\
    ```\n\n## Filter a subset of rows\n\n```r\ntemp.subset <- filter(\n    .data =\
    \ temp.subset, \n    Transmission == \"Automatic\")\n```\n\n## Inspecting the\
    \ results\n\n```r\nhead(temp.subset)\n```\n\n## Compute a new column\n\n```r\n\
    temp.subset <- mutate(\n    .data = temp.subset, \n    Consumption = Fuel.Economy\
    \ * 0.425)\n```\n\n## Inspect the results\n\n```r\nhead(temp.subset)\n```\n\n\
    ## Group by a column\n\n```r\ntemp.subset <- group_by(\n    .data = temp.subset,\
    \ \n    Cylinders)\n```\n\n## Inspect the results\n\n```r\nhead(temp.subset)\n\
    ```\n\n## Aggregate based on groups\n\n```r\ntemp.subset <- summarize(\n    .data\
    \ = temp.subset, \n    Avg.Consumption = mean(Consumption))\n```\n\n## Inspect\
    \ the results\n\n```r\nhead(temp.subset)\n```\n\n## Arrange the rows in descending\
    \ order\n\n```r\ntemp.subset <- arrange(\n    .data = temp.subset, \n    desc(Avg.Consumption))\n\
    ```\n\n## Inspect the results\n\n```r\nhead(temp.subset)\n```\n\n## Convert to\
    \ data frame\n\n```r\nefficiency <- as.data.frame(temp.subset)\n```\n\n## Inspect\
    \ the results\n\n```r\nprint(efficiency)\n```\n\n## Chain methods together\n\n\
    ```r\nefficiency <- vehicle %>%\n    select(Fuel.Economy, Cylinders, Transmission)\
    \ %>%\n    filter(Transmission == \"Automatic\") %>%\n    mutate(Consumption =\
    \ Fuel.Economy * 0.425) %>%\n    group_by(Cylinders) %>%\n    summarize(Avg.Consumption\
    \ = mean(Consumption)) %>%\n    arrange(desc(Avg.Consumption)) %>%\n    as.data.frame()\n\
    ```\n\n## Inspect the results\n\n```r\nprint(efficiency)\n```\n\n## Save the results\
    \ to a CSV file\n\n```r\nwrite.csv(\n    x = efficiency,\n    file = \"Fuel Efficiency.csv\"\
    ,\n    row.names = FALSE)\n```\n\n# Frequently Asked Questions\n\n## Help! I got\
    \ an error, what did I do wrong?\n\nWhenever you any error while doing in code\
    \ always read the error very carefully. Error often says exactly what is wrong\
    \ with the piece of the code. For example, let see this code given below:\n\n\
    > `x <- rnorm(100)`\n> `summary(X)`\n\n`Error in summary(X) : Object \"X\" not\
    \ found`\n\nNow it is very clear from the error if you read it carefully that\
    \ there is no object named `X` found in a workspace nor there is any object in\
    \ data frames, so when R try to execute the code it will not find any object `X`.\
    \ So, in this case the solution is very simple the variable `X` is upper case\
    \ not lower-case `x`.\n\n> `summary(x)`\n`Min. 1st Qu. Median Mean 3rd Qu. Max.`\n\
    `-2.750 -0.561 -0.070 -0.014 0.745 2.350`\n\nNow there are other error of directory\
    \ if your command involves the external file other than from R directory, then\
    \ you must have to include this file in R directory to give the full path name\
    \ of the file in R command\n\n> `dlv <- read.csv(\"dlv.csv\")`\n\n`Error in file(file,\
    \ \"r\") : unable to open connection`\n\nIn addition: Warning message:\n`cannot\
    \ open file`\n\nThe “unable to open connection” message means that the file could\
    \ not found. Check the current directory with the `getwd()` method, and see if\
    \ the file is there with the `list.files()` method (or, you could look for the\
    \ file in Explorer):\n\n> `getwd()`\n`[some path]`\n\n> `list.files(pattern=\"\
    dlv.csv\")`\n`character(0)`\n\nSo, the file is in another directory one way is\
    \ to give the full path name of the file in R command another way is to change\
    \ the working directory with the `setwd()` method:\n\n> `setwd(\"some path\")`\n\
    `[some path]`\n\n> `dlv <- read.csv(\"dlv.csv\")`\n\n"
  trans: "\n还有许多其他方法可以理解观测值和特征之间的结构。在大多数方法中，著名的是流行的网络分析，在这种类网络中，我们获得不同观测值之间的相似性，然后直观地检查数据点的结构；为了这一点，我们将性质上相似的观测值放在一起。简单来说，我们对结构并不感兴趣，因为我们关注的是对关系进行建模并根据输入的相关性进行预测。\n\
    \n![](img/00021.jpeg)\n\n# 文本分析\n\n在处理机器学习问题时，大多数数据并不是以典型的形式存在，而是文本内容。在这种情况下，我们必须在准备数据时做更多工作，在这种情况下，准备数据意味着在我们开始分析数据之前，很少有文本数据。最终目标可能包括使用词汇的使用情况来预测结果，也许对特定术语的使用进行建模，或者像网络模型那样通过图形方式检查术语的使用结构。此外，我们还可以将机器学习方法应用于声音，以从声音中识别语音特征和其他有用信息。\n\
    \n# 使用 R 进行分类\n\n以下示例假设我们有一个存储的 `Vehicles.txt` 文件。\n\n## 设置工作目录\n\n```r\nsetwd(\"\
    C:/Data\")\n```\n\n## 读取制表符分隔的数据文件\n\n```r\nvehicle <- read.table(\n    file =\
    \ \"Vehicles.txt\",\n    header = TRUE,\n    sep = \"\\\\t\",\n    quote = \"\\\
    \\\"\")\n```\n\n## 查看文件的第一行\n\n```r\nhead(vehicle)\n```\n\n## 加载 dplyr 库\n\n```r\n\
    library(dplyr)\n```\n\n## 选择列子集\n\n```r\ntemp.subset <- select(\n    .data = vehicle,\
    \ \n    Transmission,\n    Cylinders,\n    Fuel.Economy)\n```\n\n## 检查结果\n\n```r\n\
    head(temp.subset)\n```\n\n## 过滤行子集\n\n```r\ntemp.subset <- filter(\n    .data\
    \ = temp.subset, \n    Transmission == \"Automatic\")\n```\n\n## 检查结果\n\n```r\n\
    head(temp.subset)\n```\n\n## 计算新列\n\n```r\ntemp.subset <- mutate(\n    .data =\
    \ temp.subset, \n    Consumption = Fuel.Economy * 0.425)\n```\n\n## 检查结果\n\n```r\n\
    head(temp.subset)\n```\n\n## 按列分组\n\n```r\ntemp.subset <- group_by(\n    .data\
    \ = temp.subset, \n    Cylinders)\n```\n\n## 检查结果\n\n```r\nhead(temp.subset)\n\
    ```\n\n## 根据分组聚合\n\n```r\ntemp.subset <- summarize(\n    .data = temp.subset,\
    \ \n    Avg.Consumption = mean(Consumption))\n```\n\n## 检查结果\n\n```r\nhead(temp.subset)\n\
    ```\n\n## 按降序排列行\n\n```r\ntemp.subset <- arrange(\n    .data = temp.subset, \n\
    \    desc(Avg.Consumption))\n```\n\n## 检查结果\n\n```r\nhead(temp.subset)\n```\n\n\
    ## 转换为数据框\n\n```r\nefficiency <- as.data.frame(temp.subset)\n```\n\n## 检查结果\n\n\
    ```r\nprint(efficiency)\n```\n\n## 链式方法\n\n```r\nefficiency <- vehicle %>%\n \
    \   select(Fuel.Economy, Cylinders, Transmission) %>%\n    filter(Transmission\
    \ == \"Automatic\") %>%\n    mutate(Consumption = Fuel.Economy * 0.425) %>%\n\
    \    group_by(Cylinders) %>%\n    summarize(Avg.Consumption = mean(Consumption))\
    \ %>%\n    arrange(desc(Avg.Consumption)) %>%\n    as.data.frame()\n```\n\n##\
    \ 检查结果\n\n```r\nprint(efficiency)\n```\n\n## 将结果保存为 CSV 文件\n\n```r\nwrite.csv(\n\
    \    x = efficiency,\n    file = \"Fuel Efficiency.csv\",\n    row.names = FALSE)\n\
    ```\n\n# 常见问题\n\n## 救命！我遇到了错误，我做错了？\n\n当你在编写代码时遇到任何错误，请务必仔细阅读错误。错误通常会准确说明代码部分出了什么问题。例如，看看下面的代码：\n\
    \n> `x <- rnorm(100)`\n> `summary(X)`\n\n`Error in summary(X) : Object \"X\" not\
    \ found`\n\n现在如果你仔细阅读，从错误中可以清楚地看出工作区中没有找到名为 `X` 的对象，数据框中也没有任何对象，因此当 R 尝试执行代码时找不到任何对象\
    \ `X`。所以，在这种情况下，解决方案非常简单：变量 `X` 是大写的，而不是小写的 `x`。\n\n> `summary(x)`\n`Min. 1st\
    \ Qu. Median Mean 3rd Qu. Max.`\n`-2.750 -0.561 -0.070 -0.014 0.745 2.350`\n\n\
    现在，如果你的命令涉及 R 目录以外的外部文件，还有其他目录错误，你必须将此文件包含在 R 目录中，或者在 R 命令中提供完整路径\n\n> `dlv <-\
    \ read.csv(\"dlv.csv\")`\n\n`Error in file(file, \"r\") : unable to open connection`\n\
    \n此外：警告信息：\n`cannot open file`\n\n“无法打开连接”信息意味着没有找到文件。使用 `getwd()` 方法检查当前目录，并使用\
    \ `list.files()` 方法查看文件是否在那里（或者，你可以在资源管理器中查找文件）：\n\n> `getwd()`\n`[some path]`\n\
    \n> `list.files(pattern=\"dlv.csv\")`\n`character(0)`\n\n所以，文件在另一个目录中，一种方法是在 R\
    \ 命令中提供文件的完整路径，另一种方法是使用 `setwd()` 方法更改工作目录：\n\n> `setwd(\"some path\")`\n`[some\
    \ path]`\n\n> `dlv <- read.csv(\"dlv.csv\")`\n\n"
