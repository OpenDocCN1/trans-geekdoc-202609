  trans: "\n\n*   如果你想获得更好的结果，请在使用 `command` 之前，请查找其在线文档。\n*   查看你的数据，也许你的数据并非你想象的那样。\n\
    *   查看代码结构。\n\n一个常见问题是工作区定义的变量与局部空间定义的变量可能具有相同的名称。可以通过 R 代码来说明这一点：\n\n```\ndata(trees);\
    \ str(trees)\n'data.frame': 31 obs. of 3 variables:\n$ Girth : num 8.3 8.6 8.8\
    \ 10.5 10.7 10.8 11 11 11.1 ...\n$ Height: num 70 65 63 72 81 83 66 75 80 75 ...\n\
    $ Volume: num 10.3 10.3 10.2 16.4 18.8 19.7 15.6 18.2 ...\n\n(Volume <- sample(1:31))\n\
    [1] 6 7 3 21 22 1 24 9 11 14 19 13 20 8 5 30 29 31  \n[19] 18 10 23 15 12 27 16\
    \ 2 26 17 28 4 25\n\nattach(trees)\ncor(Volume, Girth)\n[1] 0.30725\n```\n\n现在这不是预期的值。它非常低，而我们知道树的体积与其胸围之间应该有很好的相关性。哪里出了问题？列出工作区可以提供线索：\n\
    \n```\nls()\n[1] \"Volume\" \"trees\" \n\ncor(trees$Volume, Girth)\n[1] 0.96712\n\
    \nrm(Volume)\ncor(Volume, Girth)\n[1] 0.96712\n```\n\n## 打开黑盒\n\n现在是时候深入学习 R 语言了。在本节中，我们将测试各种技术。\n\
    \n### 数据集\n\n在数据集部分，我们将使用来自 UCI 仓库的葡萄酒数据集。我们的目标是预测葡萄酒的最佳质量，总共有七个值（整数 3-9）。我们将数据集转换为二分类任务，以预测葡萄酒质量是否良好（我们将其任意设定为\
    \ 6 或更高）。我们需要记住的一点是，3 或 9 的非常少，所以我们实际上只需要处理 5 个值，但除了葡萄酒质量外，它还包含了许多预测因子，如糖分、酒精含量和酸度，或葡萄酒的其他特征。\n\
    \n来自 UCI 仓库的原始葡萄酒数据集被分为白酒和红酒集合。我们合并了这些集合，并添加了额外的变量：颜色及其数值版本（white 表示白色或红色），以及\
    \ good（表示大于或等于 6 的分值，标记为“Good”）。\n\n```\nwine = read.csv(\"http://www.nd.edu/~mclark19/learn/data/goodwine.csv\"\
    )\nsummary(wine)\n```\n\n### R 实现\n\n在在此之前，我们必须在 R 中安装并加载 `caret` 包。该包对于实现给定数据集的验证、数据划分、性能评估以及训练后的数据预测非常有帮助。一旦安装了该包，尽可能利用你的计算机资源是一个非常正宗的方法，因为其中某些过程需要更长时间，而且取决于你拥有的数据类型。如果你有更多，所需的时间越长；如果数据较少，所需的时间越短。例如，如果你的电脑是四核的，这意味着你的处理器有四个独立运行的内核。你可以使用下面的代码设置\
    \ R 的并行处理，这将允许新安装的 `caret` 包同时向三个核心分配任务。\n\n```\nlibrary(doSNOW) \nregisterDoSNOW(makeCluster(3,\
    \ type = \"SOCK\"))\n```\n\n### 特征选择与数据划分\n\n为了留出保留样本（holdout sample），该数据集足够大，而且它允许我们最初针对特定技术的调优参数网格搜索最佳建模方法。在此过程中，我们不希望测试性能受到调优过程的影响（以反复之前的讨论）。在最优调优参数获得最佳模型后，将通过对保留集进行预测来评估性能。为了处理数据中显著的共线性问题，我做了一些决策，这可能会严重影响某些方法。为了解决这个问题，让我们来看简单的相关矩阵：\n\
    \n```\nlibrary(corrplot) \ncorrplot(cor(wine[, -c(13, 15)]), method = \"number\"\
    , tl.cex = 0.5)\n```\n\n![](img/00013.jpeg)\n\n回归分析贯穿所有数据，以检查模型中每个预测因子的 R 方（r-squared），因为它们是由其他输入变量预测的因变量。密度最高超过了\
    \ 96%，进一步调查发现颜色和二氧化硫被其他变量捕获，这些将不再被包含在后续模型中。\n\n使用 `caret` 包的目的是它有自己的划分函数，我们可以用它将数据分为训练数据和测试数据。观测总数为\
    \ 6497 个，其中我将 80% 放入训练集。`createDataPartition` 函数将产生...\n\n"
