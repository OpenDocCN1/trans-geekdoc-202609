    \n# 入门\n第一步是从 R 网站下载包，链接为 [`www.r-project.org/`](http://www.r-project.org/)。一旦打开了该网站，菜单在左侧，你必须点击\
    \ `CRAN` 来“下载包”。之后，选择一个离你近的地方。在 MIT，你可以选择加拿下的多伦多大学。这将引导你了解为 Linux、Mac 或 Windows\
    \ 下载 R 的最佳方法。\n\n现在一旦打开了 R，如果你想查看当前目录，你必须输入\n\n`getwd()` \n\n如果你想更改目录，请使用 `setwd()`。有一点你必须注意：`C:`\
