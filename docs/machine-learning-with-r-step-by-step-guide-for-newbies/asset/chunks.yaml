    \ FPR=specificity\n\nprf <- performance(pr, measure = \"tpr\", x.measure = \"\
    fpr\")\n\nplot(prf)\n\nauc <- performance(pr, measure = \"auc\")\n\nauc <- auc@y.values\\\
    [\\[1\\]\\]\n\nauc\n\n![](images/00019.jpeg)\n\nUnsupervised Learning\n\nIn this\
