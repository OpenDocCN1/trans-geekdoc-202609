- raw: "From the beginning you have been working with external datasets, you will\
    \ definitely need a function that will read in a data tables from a text file.\
    \ For example, if you want to read in the Haberman’s Survival dataset (from the\
    \ UCI Repository). Use the read.table function: dataset \n\n<-read.table(\"C:\\\
    \\\\\\Datasets\\\\\\\\haberman.csv\", header=FALSE, sep=\",\")\n\nThe first argument\
    \ in this defines the location (full path) of the file. Now if the first row the\
    \ data contains the columns names, then the second argument must be header = true\
    \ otherwise it will be header = false. The argument of this function is a delimiter.\
    \ For example if the data is separated by spaces of tabs, then the argument will\
    \ be sep = ““ and  sep = “\\\\t” respectively. \n\ndataset <- read.csv(\"C:\\\\\
    \\\\Datasets\\\\\\\\haberman.csv\", header=FALSE)\n\nIf you want to write a table\
    \ to the file use write.table. Type? write.table to see details about this function.\n\
    \nSampling\n\nIn R language there are number of the functions for sampling from\
    \ probability distributions. For example, there are several commands that will\
    \ generate random vectors of the user specified length n from distributions. The\
    \ common function in R (normal, exponential, poisson, uniform, binomial) with\
    \ user-specified parameters. Apart from these there are other distributions as\
    \ well. \n\n\\> norm\\_vec <- rnorm(n=10, mean=5, sd=2)\n\n > exp\\_vec <- rexp(n=100,\
    \ rate=3)\n\n > pois\\_vec <- rpois(n=50, lambda=6) \n\n\\> unif\\_vec <- runif(n=20,\
    \ min=1, max=9)\n\n > bin\\_vec <- rbinom(n=20, size=1000, prob=0.7)\n\n > Sample\
    \ (v, size=25, replace=FALSE)\n\nNow if want to sample with the replacement set\
    \ the replace argument with True value. There is another function to generate\
    \ same random vector each time you can call one of the random functions listed\
    \ below pick a “seed” for the random number generator using set.seed, for example\
    \ set.seed(100).\n\nAnalyzing Data\n\nNow if you want to analyze the data suppose\
    \ you want to compute the mean, variance, standard deviation, and minimum, maximum,\
    \ and sum of a set of numbers, you can use mean, var, sd, min, max, and sum. There\
    \ two more functions to analyze the date for example rowSum and colSum to find\
    \ the row and column sums of the matrix.  Now if you want to compute the absolute\
    \ value and square root of the given numbers use abs and sqrt. \n\nIn R like other\
    \ programing languages you can also write if and else statements, and for and\
    \ while loops. For example, given below there is example that will show the even\
    \ numbers between 1 and 10\n\n\\> for (i in 1:10){\n\n + if (i %% 2 == 0){ \n\n\
    \\+ cat(paste(i, \"is even.\\\\n\", sep=\" \"))\n\n # use paste to concatenate\
    \ strings + } + } \n\n\\> which(v >= 0) \n\nv > v\\[which(v >= 0)\\] \n\nPlotting\
    \ Data\n\nTo demonstrate the plotting functions, we will use Haberman’s Survival\
    \ data. In this data set each row represents the patients who had a surgery for\
    \ breast cancer. The main three features of this datasets are: at the time of\
    \ the surgery what is the age of patient, the year of the surgery and the number\
    \ of the positive auxiliary node that are detected. Here we will plot: \n\n* \
    \  Scatterplot of the first and third features\n\n*   Histogram of the second\
    \ feature\n\n*   Boxplot of the first feature\n\n\\> plot(dataset\\[,1\\], dataset\\\
    [,3\\], main=\"Scatterplot\", xlab=\"Age\", ylab=\"Number of Nodes\", pch=20)\
    \ \n\n\\> hist(dataset\\[,2\\], main=\"Histogram\", xlab=\"Year\", ylab=\"Count\"\
    )\n\n > boxplot(dataset\\[,1\\], main=\"Boxplot\", xlab=\"Age\")\n\n![](images/00004.jpeg)\n\
    \nFormulas\n\nTo express the form of a model there are certain functions that\
    \ have formulas as part of their argument. This is explained with the help of\
    \ the simple example.  Suppose there is a response variable y and you have three\
    \ independent variable x1, x2 and x3. If you want to show that y depends linearly\
    \ on x1, x2 and x3 you would use y ∼ x1 + x2 + x3, where y, x1, x2, and x3 are\
    \ also column names in your data matrix. If you want to know the details of how\
    \ to capture nonlinear models type? Formula. \n\nLinear Regression\n\nThe most\
    \ common approach in a statistical learning that everyone uses is linear regressions.\
    \ In R we use lm functions to generate these models. The general form of linear\
    \ regression model in R is given below:\n\nY = β0 + β1X1 + β2X2 + ··· + βkXk +\
    \ ε,\n\nwhere ε is mostly distributed with zero mean and some variance σ2.\n\n\
    \\> lm\\_model <- lm(y ∼ x1 + x2, data=as.data.frame(cbind(y,x1,x2))) \n\n\\>\
    \ summary(lm\\_model)\n\nMachine Learning Algorithms\n\nThere are lots of machine\
    \ learning algorithm that can be implemented in R but in this section, we have\
    \ covered the most commonly used ones. The list of these algorithms are given\
    \ below:\n\n*   Prediction\n\n*   Apriori\n\n*   Logistic Regression\n\n*   K-Means\
    \ Clustering\n\n*   AdaBoost\n\n*   Naive Bayes\n\nPrediction\n\nThe basic approach\
    \ we will use to implement this algorithm is that first we will generate the model\
    \ using training data and then predict values for test data. In R if we want to\
    \ make predictions we use predict function. If you want to see the documentation\
    \ of this function go to the help pages for algorithm and then scroll through\
    \ the content menu on the left side on help page to find corresponding predict\
    \ function. Or simply type? predict.name, where name is the function corresponding\
    \ to the algorithm. Basically, in this the first argument is the variable in we\
    \ have saved our model and the second argument represents matrix or data frame\
    \ of test data. Before making any prediction about the date we must examine the\
    \ date first, by examining the data our aims are getting inside the data that\
    \ means discovering the structure of data, behaviors of data, patterns in data,\
    \ outliers and other information to help us choosing a forecasting model. A key\
    \ assumption of time series prediction is that the data is Stationary. In stationary\
    \ process joint probability distribution does not change over time. The tools\
    \ to determine the stationarity of data include calculating the Auto-correlation\
    \ of the data or using the [Augmented Dickey–Fuller test](http://ml.sun.ac.za/wiki/Augmented_Dickey%E2%80%93Fuller_test).\
    \ Another important factor in data which is to explore is to determine if our\
    \ data follow a trend or contains a seasonal behavior. Some models that we have\
    \ are not capable enough to accurately predict on the data which contains a trend\
    \ or periodic pattern and thus one will typically remove these behaviorS through\
    \ transforming the data.\n\nThere is one important point to remember when you\
    \ call the function you can just type predict instead of predict.name. The example\
    \ is given below: \n\n\\> predicted\\_values <- predict(lm\\_model, newdata=as.data.frame(cbind(x1\\\
    _test, x2\\_test)))\n\nApriori\n\nThe basic purpose of using the Apriori algorithm\
    \ is that it provides level wise search for frequent datasets. This algorithm\
    \ is commonly used in machine learning as it used to find the associations between\
    \ many variables. Mainly it is used by grocery stores, retailers or anyone else\
    \ with large transactional database. You cannot run this algorithm directly in\
    \ R you must have to install the arules package and load it. You can see the above\
    \ section on how to install and load packages. \n\nThe function Apriori() will\
    \ produce the best set of the rules for given transactional data. It also shows\
    \ the support, confidence and lift of those rules. These three measures can be\
    \ used to decide the relative strength of the rules. So here are the set of the\
    \ formulas to generate these: \n\nSupport=Number of transactions with both A and BTotal number of transactions=P(A∩B)Support=Number of transactions with both A and BTotal number of transactions=P(A∩B)\n\
    \nConfidence=Number of transactions with both A and BTotal number of transactions with A=P(A∩B)P(A)Confidence=Number of transactions with both A and BTotal number of transactions with A=P(A∩B)P(A)\n\
    \nExpectedConfidence=Number of transactions with BTotal number of transactions=P(B)ExpectedConfidence=Number of transactions with BTotal number of transactions=P(B)\
    \  \n\nLift=ConfidenceExpected Confidence=P(A∩B)P(A).P(B)"
