- raw: "There are lots of other ways to understand structure among the observations\
    \ and features. Among most of the approaches the famous one is a popular network\
    \ analysis, in this type of network we get the similarities among different observations\
    \ and after that we examine the structure of the data points visually, for this\
    \ we placed the observations close together those which are similar in nature.\
    \ In simple words we are not interested in the structure because we are focusing\
    \ on modeling the relationships and making the predictions from the correlations\
    \ of inputs. \n\n![](images/00021.jpeg)\n\nTextual Analysis\n\nMost of the time\
    \ when we deal with the machine learning problem, most of the times data is not\
    \ in its typical forms, it is in textual content. In this situation we will have\
    \ to do more work while preparing the data, by preparing data in this case we\
    \ mean that there is rarely a text data before we start analyzing our data. The\
    \ eventual goals may include using the word usage in the prediction of an outcome,\
    \ perhaps modeling the use of select terms, or examining the structure of the\
    \ term usage graphically as in a network model. Further, we can also apply machine\
    \ learning methods to the sounds to discern the speech characteristics and other\
    \ useful information from the sound.\n\nClassification using R\n\nThe following\
    \ example considers that we have a file Vehicles.txt that store. \n\n\\# Set the\
    \ working directory\n\nsetwd(\"C:/Data\")\n\n\\# Read a tab-delimited data file\n\
    \nvehicle <- read.table(\n\n    file = \"Vehicles.txt\",\n\n    header = TRUE,\n\
    \n    sep = \"\\\\t\",\n\n    quote = \"\\\\\"\")\n\n\\# Have a look at the first\
    \ row of your file\n\nhead(vehicle)\n\n\\# Loading the dplyr library\n\nlibrary(dplyr)\n\
    \n\\# Select a subset of columns\n\ntemp.subset <- select(\n\n    .data = vehicle,\
    \ \n\n    Transmission,\n\n    Cylinders,\n\n    Fuel.Economy)\n\n\\# Inspect\
    \ the results\n\nhead(temp.subset)\n\n\\# Filter a subset of rows\n\ntemp.subset\
    \ <- filter(\n\n    .data = temp.subset, \n\n    Transmission == \"Automatic\"\
    )\n\n\\# Inspecting the results\n\nhead(temp.subset)\n\n\\# Compute a new column\n\
    \ntemp.subset <- mutate(\n\n    .data = temp.subset, \n\n    Consumption = Fuel.Economy\
    \ \\* 0.425)\n\n\\# Inspect the results\n\nhead(temp.subset)\n\n\\# Group by a\
    \ column\n\ntemp.subset <- group\\_by(\n\n    .data = temp.subset,  \n\n    Cylinders)\n\
    \n\\# Inspect the results\n\nhead(temp.subset)\n\n\\# Aggregate based on groups\n\
    \ntemp.subset <- summarize(\n\n    .data = temp.subset, \n\n    Avg.Consumption\
    \ = mean(Consumption))\n\n\\# Inspect the results\n\nhead(temp.subset)\n\n\\#\
    \ Arrange the rows in descending order\n\ntemp.subset <- arrange(\n\n    .data\
    \ = temp.subset, \n\n    desc(Avg.Consumption))\n\n\\# Inspect the results\n\n\
    head(temp.subset)\n\n\\# Convert to data frame\n\nefficiency <- as.data.frame(temp.subset)\n\
    \n\\# Inspect the results\n\nprint(efficiency)\n\n\\# Chain methods together\n\
    \nefficiency <- vehicle %>%\n\n    select(Fuel.Economy, Cylinders, Transmission)\
    \ %>%\n\n    filter(Transmission == \"Automatic\") %>%\n\n    mutate(Consumption\
    \ = Fuel.Economy \\* 0.425) %>%\n\n    group\\_by(Cylinders) %>%\n\n    summarize(Avg.Consumption\
    \ = mean(Consumption)) %>%\n\n    arrange(desc(Avg.Consumption)) %>%\n\n    as.data.frame()\n\
    \n\\# Inspect the results\n\nprint(efficiency)\n\n\\# Save the results to a CSV\
    \ file\n\nwrite.csv(\n\n    x = efficiency,\n\n    file = \"Fuel Efficiency.csv\"\
    ,\n\n    row.names = FALSE)\n\nFrequently Asked Questions\n\nHelp! I got an error,\
    \ what did I do wrong?\n\nWhenever you any error while doing in code always read\
    \ the error very carefully. Error often says exactly what is wrong with the piece\
    \ of the code. For example, let see this code given below:\n\n\\> x <- rnorm(100)\n\
    \n\\> summary(X)\n\nError in summary(X) : Object \"X\" not found\n\nNow it is\
    \ very clear from the error if you read it carefully that there is no object named\
    \ X found in a workspace nor there is any object in data frames, so when R try\
    \ to execute the code it will not find any object X. So, in this case the solution\
    \ is very simple the variable X is upper case not lower-case x.\n\n\\> summary(x)\n\
    \nMin. 1st Qu. Median Mean 3rd Qu. Max.\n\n\\-2.750 -0.561 -0.070 -0.014 0.745\
    \ 2.350\n\nNow there are other error of directory if your command involves the\
    \ external file other than from R directory, then you must have to include this\
    \ file in R directory to give the full path name of the file in R command\n\n\\\
    > dlv <- read.csv(\"dlv.csv\")\n\nError in file(file, \"r\") : unable to open\
    \ connection\n\nIn addition: Warning message:\n\ncannot open file 'dlv.csv'\n\n\
    The “unable to open connection” message means that the file could\n\nnot be found.\n\
    \nCheck the current working directory with the getwd method, and see\n\nif the\
    \ file is there with the list.files method (or, you could look\n\nfor the file\
    \ in Windows Explorer):\n\n\\> getwd()\n\n\\[1\\] \"/Users/rossiter/ds/DavisGeostats\"\
    \n\n\\> list.files(pattern=\"dlv.csv\")\n\ncharacter(0)\n\nSo, the file is in\
    \ another directory one way is to give the full path name of the file and another\
    \ way is to copy the file in R Directory.\n\n\\> dlv <- read.csv(\"/Users/rossiter/ds/DLV/dlv.csv\"\
    )\n\n\\> dim(dlv)\n\n\\[1\\] 88 33\n\nAnother way is to change the working directory\
    \ with the setwd method:\n\n\\> setwd(\"/Users/rossiter/ds/DLV\")\n\n\\> getwd()\n\
    \n\\[1\\] \"/Users/rossiter/ds/DLV\"\n\n\\> dlv <- read.csv(\"dlv.csv\")\n\n\\\
    > dim(dlv)\n\n\\[1\\] 88 33\n\nNow another common error that we do in R, is to\
    \ make an attempt to use a method that is in unloaded package. \n\nFor example,\
    \ suppose we try to run a resistant regression with the\n\nlqs method:\n\n\\>\
    \ lqs(lead ~ om, data=meuse)\n\nError: couldn't find function \"lqs\"  \n\nNow\
    \ the error is because of two problems either there is no such method in R, or\
    \ the method you are trying to use is in unloaded package, so to solve this problem\
    \ we have a solution:\n\n\\> help.search(\"lqs\")  \n\n\\> library(MASS)\n\n\\\
    > lqs(lead ~ om, data=meuse)\n\nCoefficients:\n\n(Intercept) om\n\n\\-19.9 15.4\n\
    \nScale estimates 46.9 45.9\n\nIf there is any command that produces the error\
    \ compound simply break down the commands into smaller pieces. If you still find\
    \ an error about your command, go and check the full documentation of the command,\
    \ in documentation they may have explains why an error is produced. For example,\
    \ if we try to compute the non-parametric correlation between lead and organic\
    \ matter in the Meuse data set, we get an error:\n\n\\> library(gstat); data(meuse)\n\
    \n\\> cor(meuse$lead, meuse$om, method=\"spearman\")\n\nError in cor(lead, om)\
    \ : missing observations in cov/cor\n\n\\> ?cor\n\nWe can check for these with\
    \ the is.na method:\n\n\\> sum(is.na(lead)); sum(is.na(om))\n\n\\[1\\] 0\n\n\\\
    [1\\] 2\n\nThere are two missing values of organic matter (but none of lead).\n\
    \nThen we must decide how to deal with them; one way is to compute\n\nthe correlation\
    \ without the missing cases:\n\n\\> cor(lead, om, method=\"spearman\", use=\"\
    complete\")\n\n\\[1\\] 0.59759  \n\nStill if you find any error go to stack overflow\
    \ type all the problem from beginning that you have with the piece of code you\
    \ have, there you will find plenty of answer from the online community members.\
    \ If not, there are so many Facebook pages and groups for developers, go post\
    \ your problem and get the desired solution. \n\nConclusion"
