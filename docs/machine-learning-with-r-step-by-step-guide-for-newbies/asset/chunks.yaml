  fmt: "\nIn R, if we want to improve the presentation of the graphics, there are\
    \ list of graphical parameters that are used for this purpose. These parameters\
    \ can be used as an option or if you want to change the graphical presentation\
    \ permanently this can be done with the help of this function `par`. Let illustrate\
    \ this with the help of the example.\n\n```r\npar(bg=\"yellow\")\n```\n\nOnce\
    \ this command is executed all the graphs that are plotted their background turns\
    \ yellow. There are almost 73 graphical parameters in R but we have shown some\
    \ of them in the table given below because these parameters are used on frequent\
    \ bases.\n\n![](images/00012.jpeg)\n\n## Programming with R in Practice\n\nNow\
    \ in both sections above we have discussed a lot about R functionalities now it’s\
    \ time to implement some basic R code. Now let’s talk about language and programming.\n\
    \n### Loops and Vectorization\n\nLike all other programming language R also has\
    \ a control structure which are not dissimilar to those of C programming language.\
    \ Let’s start with a simple piece of code in R, for example: we have a vector\
    \ `x` and for each element of `x` with value `b` we want to assign the value `1`\
    \ to another variable `y` otherwise `0`. To write this problem code in R we first\
    \ have to create the same length of vector `y` as of `x`.\n\n```r\ny <- numeric(length(x))\n\
    for (i in 1:length(x)) if (x[i] == b) y[i] <- 0 else y[i] <- 1\n```\n\nSeveral\
    \ instructions can be executed if they are placed within braces:\n\n```r\nfor\
    \ (i in 1:length(x)) {\n  y[i] <- 0\n  ...\n}\n\nif (x[i] == b) {\n  y[i] <- 0\n\
    \  ...\n}\n```\n\nAnother possible situation is to execute an instruction as long\
    \ as a condition is true:\n\n```r\nwhile (myfun > minimum) {\n  ...\n}\n```\n\n\
    In most of the cases we can avoid loops and control structures, thanks to R for\
    \ this wonderful feature, Vectorization. The purpose of vectorization is to make\
    \ loops implicit in expressions, and we have seen many cases of this. To have\
    \ a better understanding of this let us consider the addition of two vectors.\n\
    \n```r\nz <- x + y\n```\n\nThis addition could be written with a loop, as this\
    \ is done in most languages:\n\n```r\nz <- numeric(length(x))\nfor (i in 1:length(z))\
    \ z[i] <- x[i] + y[i]\n```\n\nIn This case because of the indexing system problem\
    \ it is important to create vector `z`. Now we can see this explicit loop will\
    \ work only if `x` and `y` vector are of same lengths.\n\n```r\ny[x == b] <- 0\n\
    y[x != b] <- 1\n```\n\nIn simple words vectored expression is computationally\
    \ more efficient as compared to loops, particularly with a large set of data.\n\
    \n```r\nx <- rnorm(10, -5, 0.1)\ny <- rnorm(10, 5, 2)\nX <- cbind(x, y) # the\
    \ columns of X keep the names \"x\" and \"y\"\napply(X, 2, mean)\n```\nx y\n-4.975132\
    \ 4.932979\n\n```r\napply(X, 2, sd)\n```\nx y\n0.0755153 2.138807\n\n`lapply()`\
    \ acts on a list: its syntax is similar to `apply` and returns a list.\n\n```r\n\
    forms <- list(y ~ x, y ~ poly(x, 2))\nlapply(forms, lm)\n```\n[1]\nCall: FUN(formula\
    \ = X[1])\nCoefficients:\n(Intercept) x\n31.683 5.377\n[2]\nCall: FUN(formula\
    \ = X[2])\nCoefficients:\n(Intercept) x\n4.9330 1.2181 -0.6037\n\nNow the functions\
    \ we used, `sapply()` is a flexible variant of `lapply()`, which can take a vector\
    \ or matrix as the main argument.\n\n### Writing a program in R\n\nBasically the\
    \ R program in writing in a file, which is saved in ASCII format with extension\
    \ `.R`. It is a typical way in programming to use the several programs for typical\
    \ situations. In our first program we will plot data of three different species\
    \ of birds, so our data must be in different files. In order to deal with this\
    \ we will proceed step by step and see different ways of handling this.\n\n```r\n\
    layout(matrix(1:3, 3, 1)) # partition the graphics\ndata <- read.table(\"Swal.dat\"\
    ) # read the data\nplot(data$V1, type=\"l\")\ndata <- read.table(\"Wren.dat\"\
    )\nplot(data$V1, type=\"l\")\ndata <- read.table(\"Dunn.dat\")\nplot(data$V1,\
    \ type=\"l\")\n```\n\nThe character that we use in above code `#` is used to add\
    \ comments in a program and R moves to next line. Now the problem with the above\
    \ code we have written is that it might get long if we want to add more species\
    \ so we have to make this program generic.\n\n```r\nlayout(matrix(1:3, 3, 1))\
    \ \nspecies <- c(\"swallow\", \"wren\", \"dunnock\")\nfile <- c(\"Swal.dat\",\
    \ \"Wren.dat\", \"Dunn.dat\")\nfor(i in 1:length(species)) {\n  data <- read.table(file[i])\
    \ # read the data\n  plot(data$V1, type=\"l\")\n  title(species[i]) # add a title\n\
    }\n```\n\nNow our program is more efficient, we can add more species since the\
    \ vector containing the species list and file name is at the beginning of the\
    \ code. The above program will execute perfectly if data files `.dat` are located\
    \ in R directory, if code does not work user might change the directory or specify\
    \ the path of the data files. If the program is written to the file `Mybirds.R`,\
    \ it will be called by typing:\n\n`source(\"Mybirds.R\")````\n\n### Writing your\
    \ own Function\n\nIn the above R codes, we have clearly seen that most of the\
    \ R work is done with the functions, which arguments are given in parenthesis.\
    \ In this topic as user write our own function which will have the same properties\
    \ like other functions in R. The basic aim of writing our own function is to make\
    \ an efficient, rational and flexible use of R. Now let’s quickly come back to\
    \ example of reading data by plotting a graph.\n\n```r\nmyfun <- function(S, F)\
    \ {\n  data <- read.table(F)\n  plot(data$V1, type=\"l\")\n  title(S)\n}\n```\n\
    \nTo execute this function, it must be loaded in memory and it can be done in\
    \ several ways. The lines of function can be directly typed from the keyboard\
    \ or copy and paste from the editor. If a function is saved in the file it can\
    \ be loaded by using `source()` like another program. If user wants to load the\
    \ program each time when it starts R, then the user can save the program in `RData`\
    \ which will be loaded in memory if it is in the working directory. Another possibility\
    \ is to configure the file `.Rprofile` or `Rprofile`. Finally, we can create packages\
    \ as well, but it cannot be discussed here.\n\n```r\nlayout(matrix(1:3, 3, 1))\n\
    myfun(\"swallow\", \"Swal.dat\")\nmyfun(\"wren\", \"Wrenn.dat\")\nmyfun(\"dunnock\"\
    , \"Dunn.dat\")\n```\n\nWe may also use `sapply()` leading to a fourth version\
    \ of our program:\n\n```r\nlayout(matrix(1:3, 3, 1))\nspecies <- c(\"swallow\"\
    , \"wren\", \"dunnock\")\nfile <- c(\"Swal.dat\", \"Wren.dat\", \"Dunn.dat\")\n\
    sapply(species, myfun, file)\n```\n\nIn R it is not necessary to declare variables\
    \ used within the functions, when the function will execute there is a rule in\
    \ R called lexical scoping, R decides itself whether the object is local to the\
    \ function or global. To have a better understanding of this let us explain this\
    \ with the help of the example given below:\n\n```r\nfoo <- function() print(x)\n\
    x <- 1\nfoo()\n[1] 1\nx <- 1\nfoo2 <- function() { x <- 2; print(x) }\nfoo2()\n\
    [1] 2\nx\n[1] 1\n```\n\nNow let’s do the numerical analysis of Ricker’s model.\
    \ The model can be explained with the help of the mathematical formula:\n\n$N_{t+1}\
    \ = N_t \\exp(r(1 - N_t/K))$\n\n```r\nricker <- function(nzero, r, K=1, time=100,\
    \ from=0, to=time) {\n  N <- numeric(time+1)\n  N[1] <- nzero\n  for (i in 1:time)\
    \ N[i+1] <- N[i]*exp(r*(1 - N[i]/K))\n  Time <- 0:time\n  plot(Time, N, type=\"\
    l\", xlim=c(from, to))\n}\n```\n\n### Why didn’t my command(s) do what I expected?\n\
    \nThis is the common problem that we face in every programming language. Basically,\
    \ R will do what you said, not what you just meant. So here are some tips to remember\
    \ if you really want the commands to work exactly as you want them to do:\n\n\
    - Before executing any command in your code look for the examples of that command\
    \ and follow them.\n- If you have too many commands to write simply break down\
    \ the commands in to smaller part and check each part is working propely or not.\n\
    - Experiment with the test data\n"
  trans: "\n\n在 R 语言中，如果我们想改进图形的呈现，有一系列图形参数可用于此目的。这些参数可以作为选项使用，如果你想永久地更改图形显示，可以通过函数\
    \ `par`来实现。让我们通过示例来阐明这一点。\n\n```r\npar(bg=\"yellow\")\n```\n\n一旦执行了此命令，所有绘制的图表背景都会变成黄色。R\
    \ 中几乎有 73 种图形参数，但我们在下表中展示了其中一些，因为这些参数被频繁使用的频率非常高。\n\n![](img/00012.jpeg)\n\n##\
    \ 实践中的 R 编程\n\n现在在上面的两个部分中，我们已经讨论了许多 R 的功能，现在是时候实现一些基础 R 代码了。让我们聊聊语言和编程。\n\n###\
    \ 循环与向量化\n\n与所有其他编程语言一样，R 也有与 C 语言的控制结构并不相似的控制结构。让我们从一段简单的 R 代码开始，例如：我们有一个向量 `x`，对于\
    \ `x` 的每个值为 `b` 的元素，我们想给另一个变量 `y` 赋值为 `1`，否则为 `0`。要在 R 中编写这段代码，我们必须首先创建一个与 `x`\
    \ 长度相同的向量 `y`。\n\n```r\ny <- numeric(length(x))\nfor (i in 1:length(x)) if (x[i]\
    \ == b) y[i] <- 0 else y[i] <- 1\n```\n\n如果放在大括号内，可以执行多条指令：\n\n```r\nfor (i in\
    \ 1:length(x)) {\n  y[i] <- 0\n  ...\n}\n\nif (x[i] == b) {\n  y[i] <- 0\n  ...\n\
    }\n```\n\n另一种情况是只要条件为真就执行指令：\n\n```r\nwhile (myfun > minimum) {\n  ...\n}\n```\n\
    \n在大多数情况下，得益于 R 的这一精彩特性——**向量化**，我们可以避免循环和控制结构。向量化的目的是让循环在表达式中隐式化，我们见过很多这种情况。为了更好地理解这一点，让我们考虑两个向量的相加。\n\
    \n```r\nz <- x + y\n```\n\n这种加法可以用循环来实现，就像在大多数语言中那样：\n\n```r\nz <- numeric(length(x))\n\
    for (i in 1:length(z)) z[i] <- x[i] + y[i]\n```\n\n在这种情况下，由于索引系统的问题，创建向量 `z` 是重要的。现在我们可以看到，显式循环只有在\
    \ `x` 和 `y` 向量长度相同时才会起。\n\n```r\ny[x == b] <- 0\ny[x != b] <- 1\n```\n\n简单来说，与循环相比，向量表达式在计算上更高效，特别是在处理大型数据集时。\n\
    \n```r\nx <- rnorm(10, -5, 0.1)\ny <- rnorm(10, 5, 2)\nX <- cbind(x, y) # X 的列保留名称\
    \ \"x\" 和 \"y\"\napply(X, 2, mean)\n```\nx y\n-4.975132 4.932979\n\n```r\napply(X,\
    \ 2, sd)\n```\nx y\n0.0755153 2.138807\n\n`lapply()` 作用于列表：其语法与 `apply` 相似并返回一个列表。\n\
    \n```r\nforms <- list(y ~ x, y ~ poly(x, 2))\nlapply(forms, lm)\n```\n[1]\nCall:\
    \ FUN(formula = X[1])\nCoefficients:\n(Intercept) x\n31.683 5.377\n[2]\nCall:\
    \ FUN(formula = X[2])\nCoefficients:\n(Intercept) x\n4.9330 1.2181 -0.6037\n\n\
    现在使用的 `sapply()` 是 `lapply()` 的灵活变体，它可以接受向量或矩阵作为主参数。\n\n### 在 R 中编写程序\n\n基本上，在\
    \ R 中编写程序是以 ASCII 格式保存的扩展名为 `.R` 的文件。在编程中，使用多个程序是种典型方法。在我们的第一个程序中，我们将绘制三种不同鸟的数据，所以我们的数据必须在不同的文件中。为了处理这个问题，我们将逐步进行并查看不同的处理方法。\n\
    \n```r\nlayout(matrix(1:3, 3)) # 分割图形\ndata <- read.table(\"Swal.dat\") # 读取数据\n\
    plot(data$V1, type=\"l\")\ndata <- read.table(\"Wren.dat\")\nplot(data$V1, type=\"\
    l\")\ndata <- read.table(\"Dunn.dat\")\nplot(data$V1, type=\"l\")\n```\n\n在上述代码中使用\
    \ `#` 字符用于在程序中添加注释并移动到下一行。现在上述代码的问题是，如果我们想添加更多物种，程序可能会变得很长。\n\n```r\nlayout(matrix(1:3,\
    \ 3)) \nspecies <- c(\"swallow\", \"wren\", \"dunn\")\nfile <- c(\"Swal.dat\"\
    , \"Wren.dat\", \"Dunn.dat\")\nfor(i in 1:length(species)) {\n  data <- read.table(file[i])\
    \ # 读取数据\n  plot(data$V1, type=\"l\")\n}\n```\n\n现在我们的程序更高效了，因为包含物种的列表和文件名位于代码的开头。如果\
    \ `.dat` 数据文件位于 R 目录，上述程序将完美执行；用户可能会更改目录或指定数据文件的路径。如果程序写入 `Mybirds.R`，将通过输入 `source(\"\
    Mybirds.R\")` 来调用。\n\n### 编写自己的函数\n\n在上面的 R 代码中，我们清楚看到大多数 R 工作是通过函数完成的，参数在括号中。在这个主题中，编写自己的函数将具有与\
    \ R 其他函数相同的属性。编写自己的函数的基本目标是高效、理性灵活地使用 R。现在让我们快速回到绘图数据的示例。\n\n```r\nmyfun <- function(S,\
    \ F) {\n  data <- read.table(F)\n  plot(data$V1, type=\"l\")\n  title(S)\n}\n\
    ```\n\n要执行此函数，必须将其加载到内存中，可以通过几种方式实现。函数可以直接从键盘输入或从编辑器粘贴。如果函数保存在文件中，可以使用 `source()`\
    \ 像加载程序一样加载。如果用户希望每次启动 R 时加载程序，可以将程序保存为 `RData`，如果它在工作目录中就会加载到内存中。另一种可能性是配置 `.Rprofile`\
    \ 或 `Rprofile` 文件。最后，我们还可以创建包，但这里不进行讨论。\n\n```r\nlayout(matrix(1:3, 3))\nmyfun(\"\
    swallow\", \"Swal.dat\")\nmyfun(\"wren\", \"Wrenn.dat\")\nmyfun(\"dunnock\", \"\
    Dunn.dat\")\n```\n\n我们也可以使用 `sapply()` 得到程序的第四种版本：\n\n```r\nlayout(matrix(1:3,\
    \ 3))\nspecies <- c(\"swallow\", \"wren\", \"dunnock\")\nfile <- c(\"Swal.dat\"\
    , \"Wren.dat\", \"Dunn.dat\")\nsapply(species, myfun, file)\n```\n\n在 R 中，不需要声明函数内部使用的变量，当函数执行时，R\
    \ 有一种称为词法作用域的规则，R 会自己决定对象是函数局部的还是全局的。为了更好地理解这一点，让我们通过下面的示例来解释：\n\n```r\nfoo <-\
    \ function() print(x)\nx <- 1\nfoo()\n[1] 1\nx <- 1\nfoo2 <- function() { x <-\
    \ 2; print(x) }\nfoo2()\n[1] 2\nx\n[1] 1\n```\n\n现在让我们对 Ricker 模型进行数值分析。该模型可以通过数学公式解释：\n\
    \n$N_{t+1} = N_t \\exp(r(1 - N_t/K))$\n\n```r\nricker <- function(nzero, r, K=1,\
    \ time=100, from=0, to=time) {\n  N <- numeric(time+1)\n  N[1] <- nzero\n  for\
    \ (i in 1:time) N[i+1] <- N[i]*exp(r*(1 - N[i]/K))\n  Time <- 0:time\n  plot(Time,\
    \ N, type=\"l\", xlim=c(from, to))\n}\n```\n\n### 为什么我的命令没有按照我预期的执行？\n\n这是我们在每种编程语言中都会遇到的的问题。基本上，R\
    \ 会执行你所说的，而不是你想的。所以，如果你真的想让命令完全按照你想要运行，这里有一些提示要记住：\n\n- 在代码中执行任何命令之前，查找该命令的示例并遵循它们。\n\
    - 如果你有太多的命令要写，只需将命令拆分成较小的部分，并检查每个部分是否正常工作。\n- 使用测试数据进行实验\n\n"
