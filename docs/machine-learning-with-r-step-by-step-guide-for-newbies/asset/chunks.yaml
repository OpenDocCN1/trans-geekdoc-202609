    \n# 安装和加载包\n在 R 中，几乎所有的函数都分组在包（packages）中，当你启动 R 时，大多数包会被会自动加载。常用的包有 `base`、`utils`、`graphics`\
    \ 和 `stats`。一旦安装了包，大多数核心和频繁使用的函数都会随这些包一起安装。如果你想使用 R 语言的其他有用方法，你必须下载并安装额外的包。为了让你更好地理解，让我用一个例子来解释这一点：一种重要的分类方法支持向量机包含在一个名为\
    \ `e1071` 的包中。要安装此包，有一个简单的步骤：点击顶部菜单中的“Packages”（包），然后点击“Install package(s)...”（安装包...）。当被要求选择\
    \ CRAN 镜像时，你需要选择一个离你近的地方，例如“Canada (ON)”。最后，最后一步是选择 `e1071`。现在你必须加载这个包，有一个非常简单的方法：只需在命令提示符处输入\
    \ `library(e1071)` 即可。有一点你需要记住：你只需要安装一次包，但每次启动 R 时都必须加载它。\n\n# 运行代码\n你可以通过简单在命令行中输入不同类型的命令来在\
    \ R 中运行任何类型的代码，但这不允许你保存代码或重复运行它，甚至不允许分享你的代码。与其如此，不如点击顶部菜单上的“File”（文件）并点击“New script”（新建脚本）。现在会打开一个新窗口，你可以在其中轻松地保存\
