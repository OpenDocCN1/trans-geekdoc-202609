- raw: "In R if we want to improve the presentation of the graphics there are list\
    \ of graphical parameters that are used for this purpose. These parameters can\
    \ be used as an option or if you want to change the graphical presentation permanently\
    \ this can be done with the help of this function par. Let illustrate this with\
    \ the help of the example. \n\n\\> par(bg=\"yellow\")\n\nOnce this command is\
    \ executed all the graphs that are plotted their background turns yellow. There\
    \ are almost 73 graphical parameters in R but we have shown some of them in the\
    \ table given below because these parameters are used on frequent bases. \n\n\
    ![](images/00012.jpeg)\n\nProgramming with R in Practice\n\nNow in both sections\
    \ above we have discussed a lot about R functionalities now it’s time to implement\
    \ some basic R code. Now let’s talk about language and programming. \n\nLoops\
    \ and Vectorization\n\nLike all other programming language R also has a control\
    \ structure which are not dissimilar to those of C programming language. Let’s\
    \ start with a simple piece of code in R, for example: we have a vector x and\
    \ for each element of x with value b we want to assign the value 1 to another\
    \ variable y otherwise 0. To write this problem code in R we first have to create\
    \ the same length of vector y as of x. \n\ny <- numeric(length(x))\n\nfor (i in\
    \ 1:length(x)) if (x\\[i\\] == b) y\\[i\\] <- 0 else y\\[i\\] <- 1\n\nSeveral\
    \ instructions can be executed if they are placed within braces:\n\nfor (i in\
    \ 1:length(x)) {\n\ny\\[i\\] <- 0\n\n...\n\n}\n\nif (x\\[i\\] == b) {\n\ny\\[i\\\
    ] <- 0\n\n...\n\n}\n\nAnother possible situation is to execute an instruction\
    \ as long as a condition is true:\n\nwhile (myfun > minimum) {\n\n...\n\n}\n\n\
    In most of the cases we can avoid loops and control structures, thanks to R for\
    \ this wonderful feature, Vectorization. The purpose of vectorization is to make\
    \ loops implicit in expressions, and we have seen many cases of this. To have\
    \ a better understanding of this let us consider the addition of two vectors.\
    \ \n\n\\> z <- x + y\n\nThis addition could be written with a loop, as this is\
    \ done in most languages:\n\n\\> z <- numeric(length(x))\n\n\\> for (i in 1:length(z))\
    \ z\\[i\\] <- x\\[i\\] + y\\[i\\]\n\nIn This case because of the indexing system\
    \ problem it is important to create vector z. Now we can see this explicit loop\
    \ will work only if x and y vector are of same lengths. \n\n\\> y\\[x == b\\]\
    \ <- 0 \n\n\\> y\\[x != b\\] <- 1\n\nIn simple words vectored expression is computationally\
    \ more efficient as compared to loops, particularly with a large set of data.\n\
    \n\\> x <- rnorm(10, -5, 0.1)\n\n\\> y <- rnorm(10, 5, 2)\n\n\\> X <- cbind(x,\
    \ y) # the columns of X keep the names \"x\" and \"y\"\n\n\\> apply(X, 2, mean)\n\
    \nx y\n\n\\-4.975132 4.932979\n\n\\> apply(X, 2, sd)\n\nx y\n\n0.0755153 2.1388071\n\
    \nlapply() acts on a list: its syntax is similar to apply and it returns a list.\n\
    \n\\> forms <- list(y ~ x, y ~ poly(x, 2))\n\n\\> lapply(forms, lm)\n\n\\[\\[1\\\
    ]\\]\n\nCall:\n\nFUN(formula = X\\[\\[1\\]\\])\n\nCoefficients:  \n\n (Intercept)\
    \ x\n\n31.683 5.377\n\n\\[\\[2\\]\\]\n\nCall:\n\nFUN(formula = X\\[\\[2\\]\\])\n\
    \nCoefficients:\n\n(Intercept) poly(x, 2)1 poly(x, 2)2\n\n4.9330 1.2181 -0.6037\n\
    \nNow the functions we have used, sapply () is a flexible variant of lapply(),\
    \ which can take a vector or matrix as the main argument.\n\nWriting a program\
    \ in R\n\nBasically the R program in writing in a file, which is saved in ASCII\
    \ format with the extension ‘.R’. It is a typical way in programming to use the\
    \ several programs for typical situations. In our first program we will plot data\
    \ of three different species of birds, so our data must be in three different\
    \ files. In order to deal with this problem, we will proceed step by step and\
    \ see different ways of handling this problem.\n\nlayout(matrix(1:3, 3, 1)) #\
    \ partition the graphics\n\ndata <- read.table(\"Swal.dat\") # read the data\n\
    \nplot(data$V1, data$V2, type=\"l\")\n\ntitle(\"swallow\") # add a title\n\ndata\
    \ <- read.table(\"Wren.dat\")\n\nplot(data$V1, data$V2, type=\"l\")\n\ntitle(\"\
    wren\")\n\ndata <- read.table(\"Dunn.dat\")\n\nplot(data$V1, data$V2, type=\"\
    l\")\n\ntitle(\"dunnock\")\n\nThe character that we use in above given code, #\
