    或 `demo(persp)`，但无法详细讨论 R 中的图形，因为它是一个完整且庞大的学科，但我们将涵盖一些基础函数。在 R 中，每个图形函数都有大量的选项，使得图形的制作非常灵活。


    现在回到主题，图形方法的结果不能赋值给 R 中的对象，相反，它将发送到图形设备（graphic device），我们所说的图形设备是指图形窗口或文件。让我们从基础开始，R
    中有两种类型的图形函数：创建新图的高级绘图函数，另一类是低级绘图函数，其目的是向现有图添加元素。R 图形是根据它们的图形参数生成的，这些参数是默认定义的，并可以根据我们的使用进行修改。因此，在本节后面，我们将首先介绍如何管理图形和图形设备。之后将讨论一些重要的图形函数和参数。


    ## 管理图形


    在 R 中，当你执行任何图形函数且没有打开任何图形设备时，R 本身会打开一个窗口并显示图形。在 R 中打开图形设备可以使用适当的函数。这取决于你的操作系统可提供何种类型的图形设备。在
