    \ this algorithm is that first we will generate the model using training data\
    \ and then predict. In R if we want to make we use `predict` function. If you\
    \ want to see the documentation of this function go to the help pages for algorithm.\
    \ Basically, in this the first argument is the saved model and the second argument\
    \ represents data frame of test data. Before making any prediction about the date\
    \ we must examine the data first. A key assumption of time series is that the\
    \ data is Stationary. In stationary process joint distribution does not change\
    \ over time. The tools to determine stationarity of data include calculating the\
    \ Auto-correlation of data or using the [Augmented Dickey–Fuller test](https://en.wikipedia.org/wiki/Augmented_Dickey%E2%93Fuller_test).\
    \ Another important factor in data is to explore if our data follow a trend or\
    \ contains seasonal behavior. Some models that we have are not capable to accurately\
    \ predict on the data which contains a trend and thus one will typically remove\
    \ these behavior through transforming the data.\n\nThere is one important point\
    \ to remember when you call the function you can just type `predict` instead of\
    \ `predict.name`. The example is given below:\n\n```r\npredicted_values <- predict(lm_model,\
    \ newdata=as.data.frame(x1_test, x2_test))\n```\n\n## Apriori\n\nThe basic purpose\
    \ of using the Apriori algorithm is that it provides level wise search for frequent\
    \ datasets. This algorithm is commonly used in machine learning as it used to\
    \ find associations between many variables. Mainly it is used by grocery stores,\
    \ retailers or anyone else with large transactional database. You cannot run this\
    \ algorithm directly in R you must have to install the `arules` package and load\
    \ it. You can see the above section on how to install and load packages.\n\nThe\
    \ function `Apriori()` will produce the best set of the rules for given transactional\
    \ data. It also shows the `support`, `confidence` and `lift` of those rules. These\
    \ three measures can be used to decide the relative strength of the rules. So\
    \ here are the set of the formulas to generate these:\n\nSupport=$\\frac{\\text{Number\
    \ of transactions with both } A \\text{ and } B}{\\text{Total number of transactions}}\
    \ = P(A \\cap B)$\n\nConfidence=$\\frac{\\text{Number of transactions with both\
    \ } A \\text{ and } B}{\\text{Total number of transactions with } A} = \\frac{P(A\
    \ \\cap B)}{P(A)}$\n\nLift=$\\frac{Confidence}{Expected\\ Confidence} = \\frac{P(A\
    \ \\cap B)}{P(A) \\cdot P(B)}$\n"
  trans: "\n从一开始开始，你一直在与外部数据集打交道，你绝对会需要一个函数来从文本文件中读取数据表。例如，如果你想读取 Haberman 存活数据集（来自\
    \ UCI 存储库），可以使用 `read.table` 函数：\n\n```\ndataset <- read.table(\"C:\\\\\\\\Datasets\\\
    \\\\\\haberman.csv\", header=FALSE, sep=\",\")\n```\n\n其中第一个参数定义了文件的位置（完整路径）。现在，如果数据的第一行包含列名，那么第二个参数必须是\
    \ `header = true`，否则它将是 `header = false`。该函数的参数是分隔符。例如，如果数据由空格或制表符分隔，则参数将分别为 `sep\
    \ = \"\"` 和 `sep = \"\\t\"`。\n\n```r\ndataset <- read.csv(\"C:\\\\\\\\Datasets\\\
    \\\\\\haberman.csv\", header=FALSE)\n```\n\n如果你想将表格写入文件，请使用 `write.table`。输入 `write.table`\
    \ 可以查看该函数的详情。\n\n## 采样\n\n在 R 语言中，有许多从概率分布中采样的函数。例如，有几个命令可以根据用户指定的长度 `n` 从分布中生成随机向量。R\
    \ 中常用的函数（正态、指数、泊松、均匀、二项分布）允许用户指定参数。除了这些，还有其他分布。\n\n```r\nnorm_vec <- rnorm(n=10,\
    \ mean=5, sd=2)\nexp_vec <- rexp(n=100, rate=3)\npois_vec <- rpois(n=50, lambda=6)\n\
    unif_vec <- runif(n=20, min=1, max=9)\nbin_vec <- rbinom(n=20, size=1000, prob=0.7)\n\
    Sample(v, size=25, replace=FALSE)\n```\n\n现在，如果你想进行有回采样，请将 `replace` 参数设置为 True\
    \ 值。另一个每次都生成相同随机向量的函数是你可以调用下面列出的随机函数之一，使用 `set.seed` 为随机数生成器选择一个“种子”，例如 `set.seed(100)`。\n\
    \n## 数据分析\n\n现在如果你想分析数据，假设你想计算一组数字的平均值、方差、标准差、最小值、最大值和和，你可以使用 `mean`、`var`、`sd`、`min`、`max`\
    \ 和 `sum`。还有两个用于分析数据的函数，例如 `rowSum` 和 `colSum`，用于找到矩阵的行和和列和。如果你想计算给定数字的绝对值和平方根，使用\
    \ `abs` 和 `sqrt`。\n\n与其他编程语言一样，在 R 中编写 `if` 和 `else` 语句，以及 `for` 和 `while` 循环。例如，下面的示例将显示\
    \ 1 到 10 之间的偶数：\n\n```r\nfor (i in 1:10){\n  if (i %% 2 == 0){\n    cat(paste(i,\
    \ \"is even.\\n\", sep=\" \"))\n    # 使用 paste 拼接字符串\n  }\n}\n```\n\n```r\nwhich(v\
    \ >= 0)\nv > v[which(v >= 0)]\n```\n\n## 数据绘图\n\n为了演示绘图函数，我们将使用 Haberman 存活数据。在这个数据集中，每行代表一个接受乳腺癌手术的患者。该数据集的主要三个特征是：手术时患者的年龄、手术年份以及检测到的阳性淋结数量。在这里我们将绘制：\n\
    \n*   第一和第三个特征的散点图\n*   第二个特征的直方图\n*   第一个特征的箱线图\n\n```r\nplot(dataset[,1], dataset[,3],\
    \ main=\"Scatterplot\", xlab=\"Age\", ylab=\"Number of Nodes\", pch=20)\nhist(dataset[,2],\
    \ main=\"Histogram\", xlab=\"Year\", ylab=\"Count\")\nboxplot(dataset[,1], main=\"\
    Boxplot\", xlab=\"Age\")\n```\n\n![](img/00004.jpeg)\n\n## 公式\n\n为了表示模型的形式，某些函数将公式作为参数的一部分。通过一个简单的示例可以解释。假设有一个响应变量\
    \ `y`，你有三个独立变量 `x1`、`x2` 和 `x3`。如果你想显示 `y` 线性依赖于 `x1`、`x2` 和 `x3`，你会使用 `y ~ x1\
    \ + x2 + x3`。\n\n## 线性回归\n\n统计学习中大家常用的常用方法是线性回归。在 R 中，我们使用 `lm` 来生成这些模型。线性回归的一般形式如下：\n\
    \n$Y = \\beta_0 + \\beta_1X_1 + \\beta_2X_2 + \\dots + \\beta_kX_k + \\epsilon$\n\
    \n其中 $\\epsilon$ 通常服从 0 分布。\n\n```r\nlm_model <- lm(y ~ x1 + x2)\nsummary(lm_model)\n\
    ```\n\n## 机器学习算法\n\nR 中可以实现许多机器学习算法，在本节中我们涵盖了最常用的算法。列表如下：\n\n*   预测\n*   逻辑回归\n\
    *   K-Means 聚类\n*   朴叶贝斯\n\n我们实现这些算法的基本方法是：首先使用训练数据生成模型，然后进行预测。在 R 中，如果我们想进行，使用\
    \ `predict` 函数。如果你想查看此函数的文档，请访问算法的帮助页面。基本上，这里的第一个参数是保存的模型，第二个参数代表测试数据的数据框。在对数据进行任何预测之前，我们必须先检查数据。时间序列的一个关键假设是数据是平稳的（Stationary）。在平稳过程中，联合分布不随时间改变。确定数据平稳性的工具包括计算数据的自相关性或使用[增广迪基-富勒检验](https://en.wikipedia.org/wiki/Augmented_Dickey%E2%93Fuller_test)。数据中的另一个重要因素是探索数据是否遵循趋势或包含季节性行为。我们拥有的一些模型无法准确预测包含趋势的数据，因此通常通过转换数据来消除这些行为。\n\
    \n调用函数时有一个重要的点记住，你可以直接输入 `predict` 而不是 `predict.name`。示例所示：\n\n```r\npredicted_values\
    \ <- predict(lm_model, newdata=as.data.frame(x1_test, x2_test))\n```\n\n## Apriori\n\
    \n使用 Apriori 算法的基本目的是为频繁数据集提供分层搜索。该算法在机器学习中常用，因为它用于发现许多变量之间的关联。主要由杂货店、零售商或任何拥有大型交易数据库的人使用。你不能在\
    \ R 中直接运行此算法，必须安装 `arules` 包并加载它。你可以查看上面关于安装和加载包的部分。\n\n`Apriori()` 函数将为给定的交易数据产生最佳规则。它还会显示这些规则的\
    \ `support`（支持度）、`confidence`（置信度）和 `lift`（提升度）。这三个指标可以用于判断规则的相对强度。以下是生成这些指标的公式集合：\n\
    \nSupport=$\\frac{\\text{包含 A \\text{ 和 B 的交易数量}}{\\text{总交易数}} = P(A \\cap B)$\n\
    \nConfidence=$\\frac{\\text{包含 A \\text{ 和 B 的交易数量}}{\\text{包含 A 的总交易数}} = \\\
    frac{P(A \\cap B)}{P(A)}$\n\nLift=$\\frac{Confidence}{Expected\\ Confidence} =\
    \ \\frac{P(A \\cap B)}{P(A) \\cdot P(B)}$\n\n"
