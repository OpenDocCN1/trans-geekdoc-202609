    给我的父母：David 和 Maria，我爱你们。


    ## 作者简介


    Dominic 是一位计算机科学家，`R` 基金会的成员。他构建了 `ML` 包。他对 `Python` 等其他数据科学语言也有浓厚兴趣。现在他是一位作家和教育工作者。他还推广一些机器学习应用。


