- raw: "The example given below will explain how to apply this algorithm on mushroom\
    \ datasets. Before applying this algorithm, note that dataset must be binary incidence\
    \ matrix; and their columns name must correspond to “items” that make up the “transactions”.\
    \ Once you run the following commands summary of the results and a list of the\
    \ generated rules will be shown:\n\n\\> dataset <- read.csv(\"C:\\\\\\\\Datasets\\\
    \\\\\\mushroom.csv\", header = TRUE) \n\n\\> mushroom\\_rules <- apriori(as.matrix(dataset),\
    \ parameter = list(supp = 0.8, conf = 0.9)) \n\n\\> summary(mushroom\\_rules)\
    \ > inspect(mushroom\\_rules)\n\nLogistic Regression\n\nTo run this algorithm\
    \ in R language you don’t have to install extra packages. \n\n\\> glm\\_mod <-glm(y\
    \ ∼ x1+x2, family=binomial(link=\"logit\"), data=as.data.frame(cbind(y,x1,x2)))\n\
    \nStep by Step implementation of this algorithm on a dataset.\n\n#Load data\n\n\
    data <- read.csv(\"data.csv\")\n\n#Create plot\n\nplot(data$score.1,data$score.2,col=as.factor(data$label),xlab=\"\
    Score-1\",ylab=\"Score-2\")\n\n#Predictor variables\n\nX <- as.matrix(data\\[,c(1,2)\\\
    ])\n\n#Add ones to X\n\nX <- cbind(rep(1,nrow(X)),X)\n\n#Response variable\n\n\
    Y <- as.matrix(data$label)\n\n#Sigmoid function\n\nsigmoid <- function(z)\n\n\
    {\n\ng <- 1/(1+exp(-z))\n\nreturn(g)\n\n}\n\n#Cost Function\n\ncost <- function(theta)\n\
    \n{\n\nm <- nrow(X)\n\ng <- sigmoid(X%\\*%theta)\n\nJ <- (1/m)\\*sum((-Y\\*log(g))\
    \ - ((1-Y)\\*log(1-g)))\n\nreturn(J)\n\n}\n\n#Intial theta\n\ninitial\\_theta\
    \ <- rep(0,ncol(X))\n\n#Cost at inital theta\n\ncost(initial\\_theta)\n\n\\# Derive\
    \ theta using gradient descent using optim function\n\ntheta\\_optim <- optim(par=initial\\\
    _theta,fn=cost)\n\n#set theta\n\ntheta <- theta\\_optim$par\n\n#cost at optimal\
    \ value of the theta\n\ntheta\\_optim$value\n\n\\# probability of admission for\
    \ student\n\nprob <- sigmoid(t(c(1,45,85))%\\*%theta)\n\nx <- cbind(x\\_train,y\\\
    _train)\n\n\\# Train the model using the training sets and check score\n\nlogistic\
    \ <- glm(y\\_train ~ ., data = x,family='binomial')\n\nsummary(logistic)\n\n#Predict\
    \ Output\n\npredicted= predict(logistic,x\\_test)\n\nK-Means Clustering\n\nTo\
    \ implement this algorithm, you also don’t have to install extra packages if x\
    \ is the data matrix and m is the number of clusters then your command on command\
    \ line will be:\n\n\\> kmeans\\_model <- kmeans(x=X, centers=m)\n\n\\# set the\
    \ working directory  \n\nsetwd(\"C:/STAT 897D data mining\")  \n\n\\# comma delimited\
    \ data and no header for each variable  \n\nRawData <- read.table(\"diabetes.data\"\
    ,sep = \",\",header=FALSE)\n\nresponseY <- RawData\\[,dim(RawData)\\[2\\]\\] \
    \ \n\npredictorX <- RawData\\[,1:(dim(RawData)\\[2\\]-1)\\]\n\npca <- princomp(predictorX,\
    \ cor=T) # principal components analysis using correlation matrix  \n\npc.comp\
    \ <- pca$scores  \n\npc.comp1 <- -1\\*pc.comp\\[,1\\] # principal component 1\
    \ scores (negated for convenience)  \n\npc.comp2 <- -1\\*pc.comp\\[,2\\] # principal\
    \ component 2 scores (negated for convenience)\n\nX <- cbind(pc.comp1, pc.comp2)\
    \  \n\ncl <- kmeans(X,13)  \n\ncl$cluster  \n\nplot(pc.comp1, pc.comp2,col=cl$cluster)\
    \  \n\npoints(cl$centers, pch=16)\n\nlibrary(knn)\n\nx <- cbind(x\\_train,y\\\
    _train)\n\n\\# Fitting model\n\nfit <-knn(y\\_train ~ ., data = x,k=5)\n\nsummary(fit)\n\
    \n#Predict Output \n\npredicted= predict(fit,x\\_test)\n\n![](images/00005.jpeg)\n\
    \nNow to generate K-means clustering models for data characterization use h20.kmeans().\
    \ On dependent variable this algorithm dose not rely. \n\nExample \n\n1 > h2o.kmeans(training\\\
    _frame = iris.hex, k = 3, x =\n\n1:4)\n\n2 Model Details:\n\n3 ==============\n\
    \n4 H2OClusteringModel: kmeans\n\n5 Model ID: K-means\\_model\\_R\\_1441989204383\\\
    _30\n\n6 Model Summary:\n\n7 number\\_of\\_rows number\\_of\\_clusters number\\\
    _of\\_\n\ncategorical\\_columns number\\_of\\_iterations within\\_\n\ncluster\\\
    _sum\\_of\\_squares\n\n8 1 150 3\n\n0 8\n\n139.09920\n\n9 total\\_sum\\_of\\_squares\
    \ between\\_cluster\\_sum\\_of\\_squares\n\n10 1 596.00000 456.90080\n\n11 H2OClusteringMetrics:\
    \ kmeans\n\n12 \\*\\* Reported on training data. \\*\\*\n\n13 Total Within SS:\
    \ 139.0992\n\n14 Between SS: 456.9008\n\n15 Total SS: 596\n\n16 Centroid Statistics:\n\
    \n17 centroid size within\\_cluster\\_sum\\_of\\_squares\n\n18 1 1 44.00000 43.34674\n\
    \n19 2 2 50.00000 47.35062\n\n20 3 3 56.00000 48.40184\n\nAdaBoost\n\nThere are\
    \ various numbers of the boosting functions in R language. Given below is the\
    \ one example in which implementation is done using decision trees as a base classifier.\
    \ For this we have to install and load the rpart package. Aslo, the boosting the\
    \ function ada is in the ada package. Suppose, x be the matrix of the features\
    \ and labels be a vector of 0-1 class labels. The command is: \n\n\\> boost\\\
    _model <- ada(x=X, y=labels)\n\nrequire(caret)\n\nx <- cbind(x\\_train,y\\_train)\n\
    \n\\# Fitting model\n\nTrainControl <- trainControl( method = \"repeatedcv\",\
    \ number = 10, repeats = 4)\n\nmodel<- train(y ~ ., data = x, method = \"xgbLinear\"\
    , trControl = TrainControl,verbose = FALSE)\n\nOR \n\nmodel<- train(y ~ ., data\
    \ = x, method = \"xgbTree\", trControl = TrainControl,verbose = FALSE)\n\npredicted\
    \ <- predict(model, x\\_test)\n\nNaive Bayes\n\nTo run this algorithm, you must\
    \ have to install and load e1071 package. \n\n\\> nB\\_model <- naiveBayes(y ∼\
    \ x1 + x2, data=as.data.frame(cbind(y,x1,x2)))\n\nlibrary(e1071)\n\nx <- cbind(x\\\
    _train,y\\_train)\n\n\\# Fitting model\n\nfit <-naiveBayes(y\\_train ~ ., data\
    \ = x)\n\nsummary(fit)\n\n#Predict Output \n\npredicted= predict(fit,x\\_test)\n\
    \nGeneralized Liner Model (GLM)\n\nBasically, these types of models are used generally\
    \ for many types of data analysis use cases. Most of the time some data can be\
    \ analyzed by using this model, but there is an issue with these models in their\
    \ results cannot be as accurate if the variables are complex. For instance, if\
    \ the dependent variable has non-continuous distribution, if the effect of the\
    \ predictor is not linear, so in both cases generalized linear model can produce\
    \ better accuracy results as compared to general linear model. \n\nThe core concept\
    \ behind these models is that they estimate regression models for the outcomes\
    \ followed by the exponential distribution in general. They also include Poisson,\
    \ binomial, gamma, tweedie distribution along with Gaussian distribution, so depending\
    \ on the distribution and link function choice each depends on the different purpose\
    \ either for prediction or classification. For developing linear model we have\
    \ to generate generalized linear model using exponential distribution h20.glm().\
    \ \n\nExample \n\n1 > prostate.hex <- h2o.importFile(path = \"https://raw.\n\n\
    github.com/h2oai/h2o/master/smalldata/logreg/\n\nprostate.csv\" , destination\\\
    _frame = \"prostate.hex\"\n\n)\n\n2\n\n3 > prostate.glm<-h2o.glm(y = \"CAPSULE\"\
    , x = c(\"AGE\",\"\n\nRACE\",\"PSA\",\"DCAPS\"), training\\_frame = prostate.\n\
    \nhex, family = \"binomial\", nfolds = 10, alpha =\n\n0.5)\n\n4 > prostate.glm@model$cross\\\
    _validation\\_metrics\n\n5 H2OBinomialMetrics: glm\n\n6 \\*\\* Reported on cross-validation\
    \ data. \\*\\*\n\n7 Description: 10-fold cross-validation on training data\n\n\
    8 MSE: 0.2093902\n\n9 Rˆ2: 0.1294247\n\n10 LogLoss: 0.6095525\n\n11 AUC: 0.6909965\n\
    \n12 Gini: 0.381993\n\n13 Null Deviance: 513.8229\n\n14 Residual Deviance: 463.2599\n\
    \n15 AIC: 473.2599\n\n16 Confusion Matrix for F1-optimal threshold:\n\n17 0 1\
    \ Error Rate\n\n18 0 122 105 0.462555 =105/227\n\n19 1 41 112 0.267974 =41/153\n\
    \n20 Totals 163 217 0.384211 =146/380\n\n21 Maximum Metrics:\n\n22 metric threshold\
    \ value idx\n\n23 1 max f1 0.312978 0.605405 216\n\n24 2 max f2 0.138305 0.772727\
    \ 377\n\n25 3 max f0point5 0.400689 0.628141 110\n\n26 4 max accuracy 0.400689\
    \ 0.700000 110\n\n5 max precision 0.998848 1.000000 0\n\n28 6 max absolute\\_MCC\
    \ 0.400689 0.357638 110\n\nData with R\n\nObjects\n\nTill now we have seen that\
    \ R works with the objects that are characterized by their names and their content.\
    \ R also works with the objects that have attributes which specify the kind of\
    \ data represented by an object. In order to have a better understanding of these\
    \ objects consider the variable having value 1, 2, 3: but this variable could\
    \ be integer variable or it would be coding of categorical variables. "
