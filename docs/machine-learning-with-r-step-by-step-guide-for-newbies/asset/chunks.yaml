- raw: "The main problem with neural networks is to determine how many hidden layers\
    \ are there and how many hidden units in a layer. The neural network will face\
    \ a variance problem if the network is very complex and less generalized, this\
    \ will also happen if there is less relevant information in the training data.\
    \ The executing of neural network might slow down your pc if your pc doesn’t have\
    \ multiple processors. You can replace the method with “nnet” and shorten the\
    \ tuneLength to 3 which will be faster without much loss of accuracy.\n\nresults\\\
    _nnet = train(good~., data=wine\\_train, method=\"avNNet\", trControl=cv\\_opts,\
    \ preProcess=\"range\", tuneLength=5, trace=F, maxit=1000) \n\nresults\\_nnet\n\
    \nWith the help of this we can clearly see that our best model has 9 hidden layer\
    \ nodes and decay parameter of 0. Now the first thought that came to your mind\
    \ is how many hidden units you want to examine in terms of the amount of data\
    \ you have, and in our case, we have a very decent amount. In our case we have\
    \ to start with a broad range of the values for the number of inputs and then\
    \ we have to narrow our focus, but we some of the weight decay, we must be able\
    \ to avoid overfitting. The accuracy is increased up-to 1.5% by using up-to 50\
    \ hidden units. \n\npreds\\_nnet = predict(results\\_nnet, wine\\_test\\[,-10\\\
    ]) \n\nconfusionMatrix(preds\\_nnet, wine\\_test\\[,10\\], positive='Good')\n\n\
    Strengths \n\n*   Good prediction generally\n\n*   Incorporating the predictive\
    \ power of different combinations of inputs\n\n*   Some tolerance to correlated\
    \ inputs\n\nWeaknesses\n\n*   Susceptible to irrelevant features\n\n*   Not robust\
    \ to outliers\n\n*   Big data with complex models\n\nTrees and Forests \n\nThere\
    \ is a different approach to prediction that are provided by classification and\
    \ regression trees. Suppose we have two input variable one is single input and\
    \ other is binary independent. We have done this because we have to find a point\
    \ where if we partition the data at that point we will get a best classification\
    \ accuracy and for that we have to search all the values of the input. For example,\
    \ there is a single variable whose range might be from 1 to 10, we find that a\
    \ cut at 5.75 is the best classification result if all the observation that we\
    \ have are greater than, or equal to 5.75 are considered as best positive result\
    \ and rest as negative. So basically, the purpose for explaining this is that\
    \ this approach is easy to learn or grasp and that is the main reason tree approaches\
    \ are appealing. \n\n![](images/00016.jpeg)\n\nNow on a range from 1 to 10 add\
    \ a second input. With the help of this input we might get a better classification\
    \ results, if we are only looking upon the data regarding those greater and equal\
    \ to 5.75 which we have already classified as positive result even if they are\
    \ less than 3 on the second input variable. \n\nThe example tree given above is\
    \ based on wine training data set. The Tree is interpreted as follows: wine is\
    \ classified as good if the alcohol content is greater than 10.63%, if alcohol\
    \ content is less than 10.63% but its volatile acidity is also less than .25 in\
    \ that case wine will also be classified as good, and for the other observations,\
    \ we have if the percentage is least more than 9.85% it is also classified as\
    \ good, other than this all the remaining observations are classified as bad wine.\
    \ \n\nset.seed(1234)\n\nrf\\_opts = data.frame(.mtry=c(2:6))\n\nresults\\_rf =\
    \ train(good~., data=wine\\_train, method=\"rf\",\n\npreProcess='range',trControl=cv\\\
    _opts, tuneGrid=rf\\_opts,\n\nn.tree=1000)\n\nresults\\_rf\n\n\\## 5199 samples\n\
    \n\\## 9 predictors\n\n\\## 2 classes: 'Bad', 'Good'\n\n##\n\n\\## Pre-processing:\
    \ re-scaling to \\[0, 1\\]\n\n\\## Resampling: Cross-Validation (10 fold)\n\n\
    ##\n\n\\## Summary of sample sizes: 4679, 4679, 4680, 4679, 4679, 4679, ...\n\n\
    ##\n\n\\## Resampling results across tuning parameters:\n\n##\n\n\\## mtry Accuracy\
    \ Kappa Accuracy SD Kappa SD\n\n\\## 2 0.8 0.6 0.02 0.04\n\n\\## 3 0.8 0.6 0.02\
    \ 0.04\n\n\\## 4 0.8 0.6 0.02 0.04\n\n\\## 5 0.8 0.6 0.02 0.04\n\n\\## 6 0.8 0.6\
    \ 0.02 0.04\n\n##\n\n\\## Accuracy was used to select the optimal model using\
    \ the largest value.\n\n\\## The final value used for the model was mtry = 2.\n\
    \nThe initial results look promising with mtry = 2 producing the best\n\ninitial\
    \ result. Now for application to the test set.\n\npreds\\_rf = predict(results\\\
    _rf, wine\\_test\\[,-10\\])\n\nconfusionMatrix(preds\\_rf, wine\\_test\\[,10\\\
    ], positive='Good')\n\n\\## Confusion Matrix and Statistics\n\n##\n\n\\## Reference\n\
    \n\\## Prediction Bad Good\n\n\\## Bad 335 91\n\n\\## Good 141 731\n\n##\n\n\\\
    ## Accuracy : 0.821\n\n\\## 95% CI : (0.799, 0.842)\n\n\\## No Information Rate\
    \ : 0.633\n\n\\## P-Value \\[Acc > NIR\\] : <2e-16\n\n##\n\n\\## Kappa : 0.606\n\
    \n\\## Mcnemar's Test P-Value : 0.0013\n\n##\n\n\\## Sensitivity : 0.889\n\n\\\
    ## Specificity : 0.704\n\n\\## Pos Pred Value : 0.838\n\n\\## Neg Pred Value :\
    \ 0.786\n\n\\## Prevalence : 0.633\n\n\\## Detection Rate : 0.563\n\n\\## Detection\
    \ Prevalence : 0.672\n\n##\n\n\\## 'Positive' Class : Good\n\n##\n\nlibrary(rpart)\n\
    \nx <- cbind(x\\_train,y\\_train)\n\n\\# grow tree \n\nfit <- rpart(y\\_train\
    \ ~ ., data = x,method=\"class\")\n\nsummary(fit)\n\n#Predict Output \n\npredicted=\
    \ predict(fit,x\\_test)\n\nOur best result so far with the accuracy of 82.31%.\
    \ \n\nlibrary(randomForest)\n\nx <- cbind(x\\_train,y\\_train)\n\n\\# Fitting\
    \ model\n\nfit <- randomForest(Species ~ ., x,ntree=500)\n\nsummary(fit)\n\n#Predict\
    \ Output \n\npredicted= predict(fit,x\\_test)\n\nSupport Vector Machines \n\n\
    In this section discussion on Support vector machine will be our last example,\
    \ because it is perhaps the least intuitive. Basically, the working of SVM is\
    \ as follows, it seeks to map input space via kernel function to a higher dimension,\
    \ meanwhile between this process it transformed feature space, find a hyperplane\
    \ that will result in maximal separation of the data. \n\nTo have a better understanding\
    \ of this procedure there is the figure given above which have two inputs x and\
    \ y. No separation between classes is shown by cursory intersection. However,\
    \ to find a clearer separation in the following figure we must have to map data\
    \ to higher dimensions. But at this point there is a point to remember that there\
    \ are a number of choices in regard to kernel function that performs the mapping,\
    \ but in our case in higher dimension, a decision boundary is chosen in order\
    \ to get maximum distance between the classes. \n\nset.seed(1234)\n\nresults\\\
    _svm = train(good~., data=wine\\_train, method=\"svmLinear\",\n\npreProcess=\"\
    range\", trControl=cv\\_opts, tuneLength=5)\n\nresults\\_svm\n\n\\## 5199 samples\n\
    \n\\## 9 predictors\n\n\\## 2 classes: 'Bad', 'Good'\n\n##\n\n\\## Pre-processing:\
    \ re-scaling to \\[0, 1\\]\n\n\\## Resampling: Cross-Validation (10 fold)\n\n\
    ##\n\n\\## Summary of sample sizes: 4679, 4679, 4680, 4679, 4679, 4679, ...\n\n\
    ##\n\n\\## Resampling results across tuning parameters:\n\n##\n\n\\## C Accuracy\
    \ Kappa Accuracy SD Kappa SD\n\n\\## 0.2 0.7 0.4 0.02 0.05\n\n\\## 0.5 0.7 0.4\
    \ 0.02 0.05\n\n\\## 1 0.7 0.4 0.02 0.05\n\n\\## 2 0.7 0.4 0.02 0.04\n\n\\## 4\
    \ 0.7 0.4 0.02 0.05\n\n##\n\n\\## Accuracy was used to select the optimal model\
    \ using the largest value.\n\n\\## The final value used for the model was C =\
    \ 0.5.\n\nclass1\n\nclass2\n\nclass1\n\nclass2\n\npreds\\_svm = predict(results\\\
    _svm, wine\\_test\\[,-10\\])\n\nconfusionMatrix(preds\\_svm, wine\\_test\\[,10\\\
    ], positive='Good')\n\n\\## Confusion Matrix and Statistics\n\n##\n\n\\## Reference\n\
    \n\\## Prediction Bad Good\n\n\\## Bad 268 123\n\n\\## Good 208 699\n\n##\n\n\\\
    ## Accuracy : 0.745\n\n\\## 95% CI : (0.72, 0.769)\n\n\\## No Information Rate\
    \ : 0.633\n\n\\## P-Value \\[Acc > NIR\\] : < 2e-16\n\n##\n\n\\## Kappa : 0.43\n\
