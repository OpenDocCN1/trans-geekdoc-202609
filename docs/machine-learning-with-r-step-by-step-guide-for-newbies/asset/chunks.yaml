    ## Graphical functions


    The basic high-level graphical function in R are listed below with the help of
    table. The details of each function are given in front of it. The purpose of sharing
    this list is that you can use any function according to your use.


    ![](images/00010.jpeg)


    For each function if you need any help on-line help is available in R.


    *   `add=FALSE` if TRUE superposes the plot on the previous one (if it exists)

    *   `axes=TRUE` if FALSE does not draw the axes and the box

    *   `type="p"` specifies the type of plot, `"p"` points, `"l"` lines, `"b"` points
    connected by lines, `"o"` but the lines are over the points, `"h"` vertical lines,
    `"s"` steps, the data are represented by the top of the vertical lines, `"S"`
    But the data are represented by the bottom of the vertical lines

    *   `xlim=`, `ylim=` specifies the lower and upper limits of the axes, for example
