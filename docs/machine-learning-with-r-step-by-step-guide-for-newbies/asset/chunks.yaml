    \n![](images/00018.jpeg)\n\nThis is an example script of SVM perform on iris data\
    \ set.\n\nlibrary(e1071)\n\nx <- cbind(x\\_train,y\\_train)\n\n\\# Fitting model\n\
    \nfit <-svm(y\\_train ~ ., data = x)\n\nsummary(fit)\n\n#Predict Output \n\npredicted=\
    \ predict(fit,x\\_test)\n\nTool you Already Have\n\nBefore getting started you\
    \ should keep one thing is your mind that standard techniques are still available,\
    \ but in this book, we might tweak them or do something different with them. So\
    \ before getting started machine learning in R you have a better knowledge of\
    \ statistics that is all required. \n\nStandard Linear Model\n\nThe knowledge\
    \ of the statistics is important because this will cover the main topic, linear\
    \ regression in detail. Linear regression can be served as the starting point\
    \ while learning machine learning. We can also describe it in the terms of matrix\
    \ notations as follows:\n\ny = N(µ, σ 2 ) \n\nµ = Xβ\n\nIn above given equation\
    \ y is referred as normally distributed vector responses with mean u and constant\
    \ variance σ 2. X in this above equation is typically model matrix, it is a matrix\
    \ of predictor variables and first column in this describes vector of ones for\
    \ the intercept, while on the other hand beta is vector of coefficients corresponding\
    \ to the intercept and predictors in the model. So, in applied courses less focus\
    \ is given to the tool whether it will or not be the best tool for the job or\
    \ even applicable in the form it is presented. Because of this problem many applied\
    \ researchers are still hammering screws with it, even after the discovery of\
    \ the statistical methods during the past quarter century, has rendered obsolete\
    \ many current introductory statistical texts that are written for disciplines.\
    \ So, the concepts that you once gain while learning the standard linear model\
    \ are generalized and few modifications are made, but still maintain the basic\
    \ design, can render it still very effective in situations where it is appropriate.\n\
    \nLogistic Regression\n\nAfter the complete examination of the data, if the response\
    \ is in categorical form we used logistic regression, most of the time with binary\
    \ outcome in which some event occurs and some event or not. Even at this point\
    \ once could use standard linear model, but you could end up with nonsensical\
    \ predictions that fall outside the 0-1 range regarding the probability of the\
    \ event occurring, to go along with other shortcomings. Using logistic regression\
    \ over linear probability model no more effort is required. It is also important\
    \ to keep logistics regression in mind when we discuss other classification techniques.\
    \ \n\nModel fitting\n\nWe split the data into two chunks: training and testing\
    \ set. The training set will be used to fit our model which we will be testing\
    \ over the testing set.\n\n\\# Train test splitting\n\ntrain <- data\\[1:800,\\\
    ]\n\ntest <- data\\[801:889,\\]\n\n\\# Model fitting\n\nmodel <- glm(Survived\
    \ ~.,family=binomial(link='logit'),data=train)\n\nsummary(model)\n\n\\# Analysis\
    \ of deviance\n\nanova(model,test=\"Chisq\")\n\n\\# McFadden R^2\n\nlibrary(pscl)\n\
    \npR2(model)\n\n\\# MEASURING THE PREDICTIVE ABILITY OF THE MODEL\n\n\\# If prob\
