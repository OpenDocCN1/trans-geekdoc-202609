    ## Graphics with R


    In this section we will discuss about the amazing feature of R, that how R deals
    with graphics. Basically, R offers a huge variety of graphics. In order to get
    an idea how it really works one can simply type a command `demo(graphics)` or
    `demo(persp)`, but it is not possible to discuss in details about the graphics
    in R because it is one complete vast subject but we will cover some basic functions.
    In R each graphical function has a large number of options, making the productions
    of graphics very flexible.


    Now coming to the topic, the result of the graphical method cannot be assigned
    to an object in R but on contrary, it will send to graphic device, by graphic
    device we mean a graphics window or a file. Let’s start with the basic there are
    two types of graphical functions in R: the high-level plotting functions which
    create a new graph and on the other hand low level plotting function, whose purpose
    is to add elements to an existing graph. R graphs are produced with respect to
    their graphical parameters which are defined by default and can be modified according
    to our use. So, in this section later will be covering first time how to manage
    graphics and graphical devices. After will be discussing some important graphical
    functions and parameters.


    ## Managing Graphics


    In R when you execute any graphical function and haven’t open any graphical device
    R itself opens a window and displays the graphs. To open a graphical device in
    R we may use appropriate functions. It depends on your operating system what type
    of graphical devices are available for you. The graphical windows are called X11
    under Unix/Linux and windows under Windows. In all cases, one can open a graphical
    window with the command `x11()` which also works under Windows. To open a graphical
    device which is a file it totally depends on format, `postscript()`, `png()`,
    So in order to find the list of available graphical device there is a command
    in R that `?device`. All subsequent graphs are displayed on the last open graphical
    device.


    ```

    dev.list()

    ```

    In order to obtain the list of last open graphical devices, there is a function
    in R `dev.list()`.


    ```

    x11();

    pdf();

    dev.list()

    ```

    X11 X11 pdf 2 3 4 The figures displayed are the device numbers which must be used
    to change the active device. Now to know what an active device is type this command
    in R:


    ```

    dev.cur()

    ```

    and to change the active device:


    ```

    dev.set(3)

    ```

    The function `dev.off()` closes a device: by default the active device is closed,
    otherwise this is the one which is given as an argument to the function. R then
    displays the number of the new active device:


    ```

    dev.off(2)

    ```

    In order to partition the graphical devices in R we use the following function:


    ```

    split.screen(c(1, 2))

    ```

    Once this command is executed it divides the screen in two parts `screen(1)` and
    `screen(2)`. In order to delete the last shown graph `erase.screen()`. If you
    are using multiple graphical devices, then these functions are incompatible. They
    have limited use for example to explore the graphical data. In order to partition
    the active window into several parts we use layout functions. The main argument
    of this `layout` method is a matrix indicating the integer number of sub-windows.
    For example, in order to divide the window in four parts:


    ```

    layout(matrix(1:4, 2, 2))

    ```

    ```

    mat <- matrix(1:4, 2, 2)

    ```

    mat

    [1,] 1 2

    [2,] 3 4

    ```

    layout(mat)

    ```

    Now if you want to see the layout partitioning you can use R command


    ```

    layout.show(4)

    ```

    ```

    layout(matrix(1:6, 3, 2))

    ```

    ```

    layout.show(6)

    ```

    ```

    layout(matrix(1:6, 2, 3))

    ```

    ```

    layout.show(6)

    ```

    ```

    m <- matrix(c(1:3, 3), 2, 2)

    ```

    ```

    layout(m)

    ```

    ```

    layout.show(3)

    ```

    The results of the above codes are given below:


    ![](images/00008.jpeg)


    All examples of partitioning the windows we have discussed above haven’t used
    `byrow` of `matrix()`, the purpose of this command is to number sub windows column
    wise. There is another command `matrix(..., byrow=TRUE)` this command makes the
    sub windows numbered row wise. We will see this with the help of the example `matrix(c(2,
