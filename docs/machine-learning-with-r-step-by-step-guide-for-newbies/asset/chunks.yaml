    \n3 60 300 Male\n\n4 80 300 Male\n\n5 60 100 Female\n\n6 80 100 Female\n\n7 60\
    \ 300 Female\n\n8 80 300 Female\n\n![](images/00007.jpeg)\n\nIn statistics is\
    \ easy to generate random data and R can provide the functionality. These functions\
    \ are of the form rfunc(n, p1, p2, ...), where func indicates the probability\
    \ distribution, n the number of data generated, and p1, p2, . . . are the values\
    \ of the parameters of the distribution. The above table gives the details for\
    \ each distribution, and the possible default values (if none default value is\
    \ indicated, this means that the parameter must be specified by the user). Most\
    \ of these functions have counterparts obtained by replacing the letter r with\
    \ d, p or q to get, respectively, the probability density (dfunc(x, ...)), the\
    \ cumulative probability density (pfunc(x, ...)), and the value of quantile (qfunc(p,\
    \ ...), with 0 < p < 1). The last two series of functions can be used to find\
    \ critical values or P-values of statistical tests. For instance, the critical\
    \ values for a two-tailed test following a normal distribution at the 5% threshold\
    \ are:\n\n\\> qnorm(0.025)\n\n\\[1\\] -1.959964\n\n\\> qnorm(0.975)\n\n\\[1\\\
    ] 1.959964\n\nFor the one-tailed version of the same test, either qnorm(0.05)\
    \ or 1 - qnorm(0.95) will be used depending on the form of the alternative hypothesis.\n\
    \nThe P-value of a test, say χ\n\n2 = 3.84 with df = 1, is:\n\n\\> 1 - pchisq(3.84,\
    \ 1)\n\n\\[1\\] 0.05004352\n\nGraphics with R\n\nIn this section we will discuss\
    \ about the amazing feature of R, that how R deals with graphics. Basically, R\
    \ offers a huge variety of graphics. In order to get an idea how it really works\
    \ one can simply type a command demo(graphics) or demo(persp), but it is not possible\
    \ to discuss in details about the graphics in R because it is one complete vast\
    \ subject but we will cover some basic functions. In R each graphical function\
    \ has a large number of the options, making the productions of graphics very flexible.\
    \ \n\nNow coming to the topic, the result of the graphical method cannot be assigned\
    \ to an object in R but on contrary, it will send to graphic device, by graphic\
    \ device we mean a graphics window or a file. \n\nLet’s start with the basic there\
    \ are two types of graphical functions in R. the high-level plotting functions\
    \ which create a new graph and on the other hand low level plotting function,\
    \ whose purpose is to add elements to an existing graph. In R graphs are produced\
    \ with respect to their graphical parameters which are defined by default and\
    \ can be modified according to our use. \n\nSo, in this section later we will\
    \ be covering first time how to manage graphics and graphical devices in R. After\
    \ we will be discussing some important graphical functions and parameters. \n\n\
    Managing Graphics\n\nIn R when we execute any graphical function and we haven’t\
    \ open any graphical device R itself opens a graphical window and displays the\
    \ graphs. To open a graphical device in R we may use appropriate functions. It\
    \ depends on your operating system what type of graphical devices are available\
    \ for you. The graphical windows are called X11 under Unix/Linux and windows under\
    \ Windows. In all cases, one can open a graphical window with the command x11()\
    \ which also works under Windows because of an alias towards the command windows().\
    \ To open a graphical device which is a file it totally depends on function format,\
    \ postscript(), pdf(), png(),, So in order to find the list of available graphical\
    \ device there is a command in R that is ?device.\n\nAll subsequent graphs are\
    \ displayed on last open active graphical device. In order to obtain the list\
    \ of last active open graphical devices, there is a function in R dev.list().\n\
    \n\\> x11(); x11(); pdf() \n\n\\> dev.list()\n\nX11 X11 pdf\n\n2 3 4\n\nThe figures\
    \ displayed are the device numbers which must be used to change the active device.\
    \ Now to know what an active device is type this command in R:\n\n\\> dev.cur()\n\
    \npdf\n\n4\n\nand to change the active device:\n\n\\> dev.set(3)\n\nX11\n\n3\n\
    \nThe function dev.off() closes a device: by default the active device is closed,\
    \ otherwise this is the one which number is given as an argument to the function.\
    \ R then displays the number of the new active device:\n\n\\> dev.off(2)\n\nX11\n\
