- pgno: 213
  md: '5. **Proper erasing of data before switching to a new device**: Before recycling,
    donating or even reselling the mobile device, erasing the data efficiently from
    the old device helps to protect its privacy and security. For this purpose, certain
    devices, as well as software applications, are available that ensure satisfactory
    deletion of old data.


    6. **Installing tracking apps on the device**: Modern mobile devices are equipped
    with remote tracking, locking and even data wiping features. Multiple unsuccessful
    login attempts can lead to self-destruction of stored data on the device. Several
    applications are now also available to provide these features.


    # 12.7.2 Against SMiShing Attacks


    As discussed earlier, SMiShing attacks act as bait for mobile users who are potential
    targets for exploitation by cyber criminals. Generally, SMiShing attempts are
    social engineering attacks embedded in text or phone call formats to prompt the
    victim to naively attempt the security violation of their device. But following
    precautions can save the mobile users from SMiShing attacks to a great extent.


    1. **Never click on a suspicious link or number**: On receiving a text message
    or phone call with a suspicious content or from an unknown source prompting to
    perform a specific action by clicking on a link or dialing a given number, the
    user must never perform the suggested action. This inactivity will automatically
    disarm the thrown bait of the remote fraudster or cyber criminal.


    Even if such a message prompts in a prohibitive way like to stop receiving such
    messages in the future, click the NO button at the bottom or if you do not wish
    to receive such messages in the future, simply respond by texting “NO”; the user
    must avoid performing the suggested negative action, as it might lead to the same
    consequential exploits mentioned above.


    2. **Confirm the validity of the source**: On receiving such doubtful communication,
    the target user should always try to ensure its originating source or sender.
    This search for its source can be done on search engines or address directories
    over the web.


    3. **In case of imposters, confirm from the original authorities**: If a doubtful
    message or call pretending to be from one of the known sources, prompts the user
    for certain action, it is better to contact the original authority to confirm
    the message. For example, if a user receives a message from his bank such as “Your
    policy reward points are about to lapse in 2 days, click on the link to claim
    your points.” Here, instead of clicking on the link, and possibly surrendering
    their financial information, the user should contact their bank directly to confirm
    the validity of the message.


    4. **Never provide any personal or sensitive information**: The scope of personal
    or sensitive information ranges from financial details, one time passwords (OTP),
    user account details to even name and address of the target user. SMiShing links
    commonly threaten the target mobile users with blocking or disruption of a specific
    service such as blocking of account or credit card penalties. Surrendering any
    such information may lead to serious consequences against the security of linked
    data. Instead, the users must remember that any authorities of any legitimate
    service will never ask them about their sensitive information. In case of persisting
    doubt, the users must themselves contact the authorized personnel of the service.'
  merge: -1
