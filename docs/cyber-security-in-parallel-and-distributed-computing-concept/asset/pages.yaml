  md: '# SECURITY IN HEALTHCARE APPLICATIONS BASED ON FOG AND CLOUD COMPUTING


    ROJALINA PRIYADARSHINI¹, MOHIT RANJAN PANDA ², BROJO KISHORE MISHRA¹


