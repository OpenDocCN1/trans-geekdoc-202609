    levels for objects and subjects. It is based on information flow between subjects
    and objects. A subject may access an object if the security level of a subject
    is the same or higher than that of the object. It incorporates multilevel and
    multilateral security.


    # 1.7 Computer Forensics


    Cybercrimes know no bounds and can range from basic data theft to cyberstalking.
    Forensic science involves the use of specific techniques with respect to criminal
    justice and highlights the collection, scrutiny and analysis of physical evidence.
    In computer forensics, there is investigation and analysis in order to garner
    and conserve physical evidence (*to avoid tampering*), such that it can be presentable
    in a court of law. A documented chain of evidence is maintained which specifies
    the issue with the computing device. Locard’s exchange principle states that the
    entity responsible for crime will bring something to the crime scene and will
    also leave the crime scene with something [10]. This could be used as a forensic
    evidence.The investigators performing forensic analysis follow specific procedures
    to conduct forensics and make sure that the device is isolated so that it cannot
    be contaminated anymore. They also make a digital copy of the data encompassed
    in the device, so that if the procedure affects the device, the backup data is
    still available to retrieve evidence. A number of techniques are deployed by forensic
    experts to perform the analysis. They may seek hidden files and folders, or try
    to retrieve deleted, encrypted and damaged data. The evidence found, if any, is
    documented accordingly. Thus, conducting forensic analysis is a step-by-step procedure.
    The following steps are adopted for the same:


    +   1. **Policy Procedure and Development**: Forensic data can be very sensitive.
    If not handled with utmost care, this data may be easily compromised. Thus, a
    set of policies and guidelines must be referred to in order to carry out forensic
    investigations. This may include information about storage, retrieval, authenticity
    and documentation of the forensic device. The policies may also adhere to certain
    laws pertaining to enforcement agencies since they involve investigative protocols
    for carrying out the forensic process. It is also important to handle the evidence
    properly once information'
