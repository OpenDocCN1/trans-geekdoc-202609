    # 15.4 Emerging Threats in Cloud- and Fog-Based Healthcare System


    This section discusses some of the emerging threats which are found in the healthcare
    system, which are discussed below.


    # 15.4.1 Software Supply Chain Attacks


    A supply chain attack mainly targets the supplier of an organization. Here, the
    targets of the attackers are the business associates and partners, especially
    in relation to healthcare providers. A attacker always tries to find a backdoor
    entry, which is through the people who are connected with an organization or those
    who provide its software. These entryways are built on the supply chains. Recently,
    in January 2018, Hancock Health was hit by SamSam ransomware, where the hackers
    were able to penetrate the hospital’s data center through a backdoor entry with
    the help of a hardware vendor of the backup system [38].


    # 15.4.2 Ransomware Attacks


    Ransomware was a main concern in 2017 throughout the entire public and private
    sectors. Some examples of high-profile and high-impact attacks are WannaCry and
    Petya/NotPetya. But when the attack victim is the healthcare system, the reaction
    is different from other sectors. For example, when Hancock Health was attacked
    by SamSam ransomware, it fixed the ransom at $55,000 approx. The ransom amounts
    in the healthcare sector are much higher than in other sectors [39].


    # 15.4.3 Crypto-Mining and Crypto-Jacking Malware


    This malware is basically used by hackers to try to overwhelm the organizations
    computing resources to process and verify the truncations made on bitcoins or
    any other cryptocurrency. e-Healthcare systems require more availability [40].'
  merge: -1
  img_proc: true
