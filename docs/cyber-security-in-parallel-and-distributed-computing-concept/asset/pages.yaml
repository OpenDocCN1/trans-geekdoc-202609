- pgno: 207
  md: 'The attempt to approach a potential victim when executed via an SMS message
    instead of a phone call constitutes the next class of mobile phishing attacks
    called SMiShing. SMiShing attacks prompt the user to unknowingly download and
    install a malware onto their mobile device by clicking on a deceptive text link.
    Usually, instead of a clear sender phone number, SMiShing messages are received
    from a number “3949” like the source. Such messages, instead of a genuine smartphone
    number, are sent via an email address to hide the identity of the attacker. Often
    such messages contain a URL or phone number linked to an automated voice response
    system. These systems ask users about their sensitive user data that requires
    their immediate attention. Instead of immediate disruption of services, the aim
    of SMiShing is to track the user or steal sensitive user information by downloading
    malware [12, 13].


    A hybrid format of phishing attacks are lottery scams or advance fee frauds that
    are delivered by emails or text messages to the target user. The content of such
    attack messages displays catchy lines like “your credit is waiting,” “claim your
    trip to Australia” or “you have won,” and so on. Lottery scam attacks trick the
    victim into believing that they have won a large sum of money, which will be accessible
    after handing over their sensitive information or paying a hefty sum of money.


    Because the nature of phishing attacks make them difficult to recognize, the best
    possible strategies to prevent them are to scan the addresses and names of every
    digital content, read every SMS and email carefully to ensure its origin, check
    for grammatical errors and totally avoid opening any attachments linked to the
    message [14].


    **Mobile Espionage:** Espionage refers to silent spying or monitoring of individuals
    or groups to obtain confidential data without the owner’s consent and knowledge.
    But espionage via mobile devices can be considered as a mobile and more elaborate
    version of the same. Modern mobile devices are equipped with high computational
    capacities, huge memory banks, movement tracking GPS, good resolution camera and
    accessories like the microphone to enhance user experience. With these capabilities,
    a mobile device becomes an attractive tool for hackers and cyber criminals to
    execute espionage. Besides these features, the sensitive data shared by users
    in real time build a sufficient reason for the growing concern of governments
    and organizations for their data security. The advent of monitoring apps like
    Mobistealth [11] that exploit aforesaid capacities of a mobile device, raised
    red flags over the possible exploitation of such features by attackers for cyber
    espionage. For competitors, unfiltered discussions about strategic plans, innovations,
    financial information, legal discussions, and more highly desirable business information
    can be made available through espionage. Espionage is a potential tool for nations
    for silent monitoring of its citizens’ activities and foreign rivals to ensure
    safety and security. Gathering conversational data, verbal commands and requests
    and pairing these with location data provide powerful profiling information desired
    by advertisers. Swept up in this information gathering may be sensitive corporate
    or client information. For malicious actors like hackers and cyber criminals,
    motivated by a variety of reasons, including economic, political, social or personal,
    smartphones serve as a potential attack vector.


    # 12.5 Types of Mobile Fraud


    Frauds committed using mobile devices comprise a wide range of cheats and tricks
    to motivate the potential target to surrender to the malicious intent of the hackers
    or criminals. Here, the malicious intent may include to influence the victim to
    purchase substandard, overpriced or non-existent products or services, to make
    phone calls or send text messages'
