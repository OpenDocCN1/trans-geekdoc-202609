  md: 'is not a kind of PLC. As PLC is a proprietary machine-language-based device,
    the virus initially captures the system running the PLC. Then it infects Siemens
    SIMATIC WinCC¹, a supervisory control and data acquisition (SCADA) and human-machine
    interface (HMI) system. As these program the PLC, infecting them destroys the
    proper programming of PLC. This results in an improper automation process by PLC,
    disrupting the industrial process on a large scale. Stuxnet initially spreads
    in three systems, each of which has the capability of infecting another three
    and so on.


    Stuxnet has a record of causing substantial damage to Iran’s nuclear program.
    The worm can be wiped out by a suitable anti-virus program.


    Once Stuxnet reached its supremacy, a so-called extended version of Stuxnet was
    developed, not with the same notion of destroying industrial control systems,
    but with the aim of gaining information from and deleting recent information in
    those systems [7]. The attack was created by Unit 8200 of the Israeli Intelligence
    Corps in 2009. The unit captures sensitive information that is encrypted and transferred
    as signals.


    The worm creates a file, with a prefix ~DQ, in the infected system. Hence, the
    model is named Duqu. Duqu also targeted the Iran nuclear deal, but with the goal
    of gathering sensitive information, instead of demolishing it. Unlike Stuxnet,
    the worm is very difficult to predict because of its passive nature. This behavior
    let it prevail in Kaspersky Lab for a long time without being detected. Once the
    threat was discovered in 2010, the worm program codes were kept and added in antivirus
    software.


    The recent attackers started concentrating on espionage rather than sabotage.
    The result was the development of a modular computer worm named Flame [7] in 2012.
    The worm, also known as Skywiper, has the ability to wipe away the contents in
    the infected system. Kaspersky Lab² and CrySyS Lab³ called it the most tedious
    malware they had ever seen. The wiper acquires the system in a similar way as
    its ancestors, Stuxnet and Duqu, by affecting the rootkit functionality. Flame
    is capable of spreading over a LAN or via a USB stick. It can capture user activities
    by recording audio and capturing screenshots, keystrokes and network traffic.
    Skype conversations also find a place on the list. The collected data and other
    files can be sent to the control server for analysis by attackers. The worm targeted
    sources in Iran, Syria and Israel. Kaspersky entered into a program with its competitors
    as yet another precaution against the espionage worm.


    # 5.2 Ransomware Attacks


    Ransomware continues to be the most threatening form of modern cybercrime [8].
    Ransomware acquires data from an entire computer through email attachments, drive-by
    downloads, malicious pdfs and exploit kits, and then openly blackmails the owners
    by asking them to pay to restore the computer to its original state. The malware
    may be locker, where the entire system is locked and not able to be used, or it
    may be crypto, where some dedicated, sensitive files are locked and access is
    denied. The lock or access denial is released only after the demand is met for
    mammoth amounts of bitcoins to be transferred to the hackers as a fine, owing
    to the innocence of the owner. Also, ransomware makes no assertions that the key
    will decrypt the lock on files or the system even after the fine is


