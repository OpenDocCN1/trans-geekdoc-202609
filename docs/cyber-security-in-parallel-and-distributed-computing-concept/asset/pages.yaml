  md: '+   - *Other detection techniques*: Several processes and procedures may be
    tested to detect malicious behavior in a system.


    4. **Respond**: In the case of cyber incidents occurring, organizations must be
    able to contain the impact. Chalking out response plans, establishing communication
    lines, and collecting and analyzing information are several response strategies.
    We look at a few categories.


    +   - *Response planning*: Execution of processes and procedures to detect cybersecurity
    events.

    +   - *Communication*: Information and response activities across the organization
    can be coordinated if communicated properly.

    +   - *Analysis*: Analyzing data ensures proper response and recovery.

    +   - *Mitigation*: Several events which have the potential to cause security
    issues in the system must be mitigated. The cyber incidents and their aftereffects
    must be mitigated.

    +   - *Improvement*: Analyzing the current and previous detection-response activities
    can greatly enhance future response activities.


    5. **Recover**: Cybersecurity events have the potential to affect services and
    capabilities of systems. Therefore, organizations must introduce effective strategies
    or recovery plans to restore the system. Following are some categories that do
    the same:


    +   - *Recovery planning*: Execution of recovery processes and procedures and
    maintenance leads to timely restoration of systems affected by malicious events.

    +   - *Improvements*: Upgradation of current processes and procedures leads to
    improvement in future systems for recovery.

    +   - *Communications*: Communication within an organization ensures coordination
    of restoration activities.


    # 1.4 Cybersecurity Roles


    As discussed in the previous sections, we know that cybersecurity spans a vast
    domain. In order to secure an organizational infrastructure, checkpoints are introduced
    at every step, thereby making security a significant element throughout the organization.
    Since security in an organization is introduced from top to bottom, there are
    several roles and responsibilities that are undertaken by cybersecurity professionals.
    In this section we will take a look at all the roles that are a part of cybersecurity.
    For that we must categorize the specific operations that take place in a cyber
    infrastructure. We will further specify the important fields that are a part of
    the operations involved. Based on the fields we will highlight the corresponding
    roles [5]. The cybersecurity operations that take place in a cyber infracture
    are presented below.


    **Secure provisioning**: Involved in the process of secure provisioning are secure
    configuration, deployment and management of the incorporated resources. Following
    are some specialty areas for secure provisioning in cybersecurity:


    +   1. **Risk management**: The risk management process is used to identify threats
    and vulnerabilities, so that specific solutions may be adopted to secure a system.
    The roles pertaining to this specialization are:'
