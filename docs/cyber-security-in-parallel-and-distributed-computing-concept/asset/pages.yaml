- pgno: 64
  md: '**Theorem 2.1** A hidden schema is called safe if Kullback-Leibler differential
    between probability distribution function of $P_C$ and $P_S$ in (1) equals 0.


    $$D_{KL}(P_C||P_S)=\sum_{C\in\mathcal{C}}P_C(C)\log\frac{P_C(C)}{P_S(C)}$$ (2.1)


    when $D_{KL}(P_C||P_S)<\epsilon$, the hidden schema is $\epsilon$ secure, where
    $\epsilon$ is a positive real number sufficiently small.


    This concept is from a theoretical standpoint, which is very difficult to implement
    in practice because the image space is too large (*infinite*). On the other hand,
    a hidden schema to ensure $D_{KL}(P_C||P_S)=0$ is not possible because this means
    there are no changes in the original image, i.e., $P_C=P_S$ (the *basic lemma
    in Theory information*). Thus, people often hide information in order to achieve
    secure $\epsilon$, ensuring that the change on the image is the smallest and barely
    visible to the human eye.


    # 2.2.2  Peak Signal-to-Noise Ratio


    Another method for post-processing an image after concealing information is based
    on the peak signal-to-noise ratio (PSNR) of the image before and after hiding
    information. PSNR is a method of assessing safety based on a subjective approach.
    According to this approach, human feelings are divided into five different levels.
    On each level, the quality of the image will be calculated by the PSNR, then depending
    on the calculated value the image will be judged as to which threshold it belongs
    to.


    The PSNR quality is mapped according to the mean opinion score (MOS), as shown
    in Table 2.1. There are many stego schemes [2-20] that primarily measure human
    sensibility based on PSNR.


    **Table 2.1** Relationship between PSNR and MOS values.


    | PSNR [dB] | MOS |

    |---|---|

    | > 37 | 5 (Very good) |

    | 31-37 | 4 (Good) |

    | 25-31 | 3 (Medium) |

    | 20-25 | 2 (Bad) |

    | < 20 | 1 (Very bad) |


    # 2.3  Steganalysis


    Steganalysis can be defined as a classification problem based on statistical hypothesis
    testing. This depends on our understanding of the hidden schema; thus, steganalysis
    is spoken of either as a simple hypothesis test or composite hypothesis test problem.


    If we do not have any information about the hidden schema, the stego method is
    called blind steganalysis. The classification problem can be expressed based on
    the composite hypothesis test as:


    +   - $H_0$: X is derived from the probability distribution function $P_S$.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '+   - H₁: X is not derived from the probability distribution function P_S.


    Where X is the sample image data to be considered.


    In a case in which information about the hidden schema is known, the stega method
    is called constraint steganalysis. Assuming we know the probability distribution
    of the P_C, the hidden schema (S_E, S_X) and the distribution of the information
    of M, we can calculate the P_S. From this we can provide a method of detection
    based on a simple hypothesis test as:


    +   - H₀: X has a probability distribution of P_S.

    +   - H₁: X has a probability distribution of P_C.


    To solve the statistical hypothesis test, we need to find a conditional domain
    or features to classify so that the error rate is minimal.


    There are many ways to do this division. But the problem is that any division
    leads to two errors that are:


    +   - Type I error with probability α(0 < α < 1) (false positive).

    +   - Type II error with probability β(0 < β < 1) (false negative).


    The probability α and β with the detector F can be expressed mathematically as
    follows:


    α = P(F(X) = 1|X P_C) = ∫_ω P_C(X)dx  (2.2)


    β = P(F(X) = 0|X P_S) = ∫_{Ω\ω} P_S(X)dx  (2.3)


    A detector is acceptable if satisfied (2.4)


    (1 − α)log(1 − α)/β + αlog α/(1 − β) ≤ D_KL(P_C||P_S)  (2.4)


    There are no division algorithms that minimize both error types.


    As mentioned above, steganalysis research methods focus on two main directions:


    +   - The first direction tries to build blind detection for any steganography
    techniques.

    +   - The second direction tries to detect stego images when knowing the steganography
    technique.


    Many authors have investigated blind steganalysis for hidden images on LSBs and
    constraint steganalysis for some known hiding techniques. Now we will summarize
    the published research in the two directions mentioned above.


    # 2.3.1 Blind Detection Based on LSB


    There are many approaches to blind steganalysis for LSB such as in the spatial
    domain [21-25] and the frequency domain [26], for hidden images using SS technology
    [27], QIM (quantization index modulation) factor [28-30] or blind detecting of
    JPEG images [31].


    Authors have also proposed four blind steganalysis techniques for hidden images
    on the LSB, three of which are are in the spatial domain and include standard
    deviation analysis [37], the statistical method χ² with a degree of freedom (χ₁²)
    [34], the estimating method of information concealed in the image [38]; and a
    technique in the frequency domain by gray-scale analysis [33]. The specific methods
    are as follows:'
