  md: 'In 1988, an experiment conducted by Robert Tappan Morris from Cornell University
    to determine the size of the Internet led to the creation of the first worm distributed
    over the Internet. The worm was released from MIT as an experiment. Once downloaded
    into a system, the worm infected the system by slowing it down. The actual exertion
    of determining internetgauge changed to a virus affecting system because of the
    nature, the Morris worm [3] spread over the systems. The worm is more likely to
    be run in the same system many times, slowing it down every time and finally making
    it unusable. Hence, self-replicating worms are more harmful even today. The unintended
    results of the graduate student’s experiment was responsible for about $10 million
    of damage, as stated by the U.S. Government Accountability Office.


    The worm was washed out by Clifford Stall, whose survey noted that the Morris
    worm infected about two thousand computers in just fifteen hours. He also stated
    that the disinfection took about two days. Colleagues of Morris stated that the
    survey was cooked up. Robert Morris was sentenced to three years probation and
    fined $10,500 plus the cost of his supervision. The Morris worm was actually the
    impetus for security personnel to concentrate on Internet security


    With the slow relief from the accidental worm of Morris in the Internet, there
    entered an intentional injection of a worm named Michelangelo [4] in 1991. The
    attacker was Roger Riordan, an anti-virus expert from Australia. Although the
    impact of the Michelangelo virus was expected to be great, in reality only a few
    thousand computers were found to be infected by it. Yet another boot sector virus,
    it actually did little harm to the systems.


    Michelangelo has been considered one of the threatening viruses of the 1990s mainly
    because of its media hype. The Michelangelo virus works by infecting the first
    17 sectors of every track in the infected hard disk on March 6th of each year.
    As seen so far, boot sector viruses seem to be more threatening. A boot sector
    virus affects the master boot sector (MBR), which runs every time the computer
    starts. The MBR controls the boot sequence and also determines the partition in
    which the computer boots into. Once the virus can successfully infect the MBR,
    then the computer boot will fail and the contents inside the memory will be lost.
    Boot sector viruses are hard to remove; hence, the better solution is to prevent
    them by appropriate verification of external drives for viruses before being injected
    into the system. Good anti-virus software does the job.


    After a decade of Michalangelo’s hype, in January 2003, a huge computer worm threatening
    the internet world by causing a denial-of-service attack was discovered. The attack
    requires prerequisite knowledge of the loophole in ancient Microsoft SQL. IP address
    spoofing over a particular UDP port can cause buffer overflow and destruct normal
    service of the SQL server [5]. David Litchfield from Microsoft conducted a proof
    of concept and fixed the issue of this SQL Slammer attack. The issue was submitted
    to the Microsoft Security Response Center and a patch was developed to counterfeit
    it. In the next Black Hat, Microsoft released the patch and requested every SQL
    user to add the patch for security. The POC was studied by researcher Michael
    Bacarella released publicly during Black Hat. The attacker implemented it and
    released it over the Internet. About 75,000 servers that were not patched were
    affected in just 10 minutes. It was thought that the victims did not report the
    virus attack because it resulted from their mistake of not adding the patch.


    After the era of using viruses to threaten and demolish computers passed, the
    era of destroying targeted computer sources using viruses evolved. The dot product
    was named Stuxnet [6], which has the capability of attacking the programmable
    logic controller (PLC) of industrial control systems. The PLC is responsible for
    making logical decisions by monitoring input and producing appropriate output
    in an automated machine. Stuxnet was born in 2009 at Kaspersky Lab. Stuxnet attacks
    systems running Windows, which actually'
