  md: 'been hidden in the image. However, in reality we do not have the original image,
    so we have to build an image to make a “landmark,” so that we can estimate the
    information hidden in any image by the theory of coincidence built from the case
    having an original image to compare. Based on empirical estimates, the “matched”
    estimation method can estimate the information on the image equivalent to other
    estimation approaches such as RS and DI [32], but better in terms of time taken.


    # 2.3.2 Constraint Steganalysis


    Along with constraint steganalysis, there are some public steganographic programs
    such as OutGuess [40], Attack F5 [13], Attack HKC [42], Attack RCM [43], Attack
    MBNS [44].


    Contributing to this research, the author has proposed four constraint steganalysis
    techniques for hidden images using known hiding techniques.


    # 2.3.2.1 HKC Hiding Technique


    This hiding technique is based on shifting pixel frequency columns. The shifting
    creates an abnormal signal around the frequency band with the greatest value of
    the pixel frequency graph, so Wen-Chung Kuo and Yan-Hung Lin provide a method
    of detection [42] based on the relationship between the maximum frequency column
    called Peak and the four adjacent frequency bands of Peak to detect hidden images
    using the HKC technique. However, Kuo and Lin’s detection techniques are not effective
    in the case of low or hidden bits, so the authors propose Kuo and Lin’s advanced
    method for higher reliability [39]. The thesis also builds a generally simpler
    taxonomy than that of Kuo and Lin. Based on this new expression, we can estimate
    the information hidden in the image using the HKC technique.


    # 2.3.2.2 DIH Technique


    This technique is based on the coefficient of difference of the image. This technique
    loses the naturalness of the histogram of different coefficients d_ij, which in
    an unhidden image that is distributed according to the Gaussian histogram but
    in a hidden image does not have this distribution. This is the main reason why
    the author proposes a method for detecting hidden images using the DIH technique
    [35].


    # 2.3.2.3 IWH Hiding Technique


    This is a reverse hiding technique based on shifting the frequency columns of
    the wavelet frequency histogram of LL, LH, HL bands. This is a unique case of
    the LSB hiding technique, but the amount of hidden message with the highest hiding
    ability may still be very low compared to the conventional LSB technique. Using
    blind steganalysis on LSB of wavelet frequency domain (χ²_n [13], “gray scale”
    of the thesis) usually results in low classification.


    However, when analyzing the wavelet frequency histogram, we get the abnormal state
    of the histogram when we hide the information. Thus, the author gives the corresponding
    detection method and that can approximate the bit rate of information concealed
    in the image [35].


    # 2.3.2.4 RVH Hiding Technique (Hiding in Two Phases)


    This technique uses multiple concealment strategies to improve image quality and
    hiding capacity. Information to hide M is classified into M₁ and M₂. The hiding
    process consists of two main phases: a horizontal hiding phase to hide M₁ and
    a vertical hiding phase to hide M₂. This is a unique case of LSB hiding technique,
    but this method can be by'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'detecting with some statistical detecting methods such as χ₁², “standard deviation,”
    LLRT, etc. Because of using two-phases to hide information, it avoids balancing
    the pairs of value (PoV) that are normally caused by LSB technique.


    Therefore, to detect hidden information, the author analyzes the frequency of
    bit “0” and bit “1” of the LSB on the pixel columns in even positions or on the
    pixel rows at the odd position of the image vector. With unhidden images, the
    frequency of bit 0 and bit 1 are approximately equal, but after hiding the message
    using RVH this rule is broken. The author has built up the expression of calculating
    the probability of bits 0 and 1 after each concealed phase of RVH so that the
    above statement can be verified. Then, we provide an algorithm for detecting and
    estimating the approximate number of bits of information for hidden images using
    the RVH hiding technique [36].


    # 2.4 Conclusion


    Steganography is still an urgent problem in the field of information protection
    in general, and security, politics and defense in particular. Steganography requires
    a comprehensive study of problems of hidden information in the image. Continuing
    research in this area is not only scientifically significant; it is also significant
    in promoting the development of the information security field.


    New techniques for steganography are constantly being introduced. Each new technique
    has many advantages and is more difficult to detect. Analyzing and finding out
    the distinctive features of the image before and after hiding a message are important
    for the technique to detect hidden images using this technique. In this direction,
    in the future, we will continue to study the following issues:


    +   - Improve algorithm to increase the accuracy of existing detection techniques.

    +   - Provide a method of extracting information.

    +   - Find a detection method for the m LSBs domain.

    +   - Study methods of detecting hidden information in other multimedia environment
    such as video, audio, etc.


