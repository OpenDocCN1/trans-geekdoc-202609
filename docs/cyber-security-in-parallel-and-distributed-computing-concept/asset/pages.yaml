    # 12.6.2 Data Theft by Applications


    Parallel to malicious mobile applications, in recent times some genuine applications
    have also been found to be continuously stealing data related to user communications
    and preferences. Such information is collected from data audio codecs of the call,
    duration of user calls, timestamps of user activities, frequently accessed contacts
    and far more. A similar case of data theft by a genuine chat application called
    “WhatsApp” was brought to light by researchers at the University of New Haven
    [27, 30].


    The information stolen in real time was noted to be transferred to the official
    servers of WhatsApp¹. The researchers created some experimental participant users
    to conduct the experiment and tested the hypothesis of data theft by the app.
    After that, the users were authenticated by making calls on WhatsApp via a communication
    channel created by Opus codec at 8 and 16 KHz frequencies. Later, upon analyzing
    the destination IP addresses and relay servers for the calls, the experiment revealed
    that the application was stealing sensitive user data like call’s audio codec,
    phone numbers and timestamps of calls. The analysis of message exchange mechanism
    between the relay servers of the app and an Android version of the app also exposed
    the collection of data accumulation pattern of WhatsApp via FunXMPP² internet
    protocol. After this experimental case study of WhatsApp, it can be concluded
    that leakage, theft or silent monitoring of user information is also possible
    via even the most trusted and safe-looking mobile applications.


    # 12.6.3 SIM Card Fraud


    One of the most sophisticated and unusual techniques of mobile fraud that leads
    the criminals to access victim’s financial details is SIM card fraud. A combination
    of social engineering and exhaustive surveys paves the way for attackers to smoothly
    conduct this attack.


    To start with, loosely handled, stolen or misplaced bank account statements of
    a potential target provide the access to bank details to attackers. After locating
    a potential target, the attackers conduct exhaustive social engineering and survey
    to collect and assemble sufficient personal information about the target from
    their social media account profiles including the details of their contact number
    and service provider. This survey enables the attackers to answer basic security
    questions to be asked by the mobile service provider of the target user.


    Now the attackers call the target, convincing them to shut down their phone temporarily,
    either by repeatedly making blank calls or posing as a call for an upgrade from
    the mobile service provider. During the period when the phone of the target user
    is shut down, the attackers call the service provider of the target, pretending
    to be the target user and claim that their phone is damaged or lost. In such situations,
    the service provider company asks basic security questions which are successfully
    answered by the attacker, confirming'
