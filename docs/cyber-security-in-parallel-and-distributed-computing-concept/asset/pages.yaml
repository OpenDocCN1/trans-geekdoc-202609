- pgno: 175
  md: '# CHAPTER 11


    # CYBERSECURITY AT ORGANIZATIONS: A DELPHI PILOT STUDY OF EXPERT OPINIONS ABOUT
    POLICY AND PROTECTION


    HOLLY REITMEIER¹, JOLANDA TROMP², JOHN BOTTOMS³

    ¹ State University of New York at Oswego, Oswego, New York, USA

    ² Duy Tan University, Danang, Vietnam

    ³ FirstStar Systems, USA

    Emails: holly.reitmeier@oswego.edu, jolanda.tromp@duytan.edu.vn, john@firststarsystems.com


    # Abstract


    Cybercrime is becoming more and more prevalent in today’s society and attackers
    are continuously discovering new methods to hack systems. Monitoring and maintaining
    computer network security is a complex process that presents unique challenges.
    If security is not constantly strengthened, cyber threats have the potential to
    affect millions of systems, all of which share similar vulnerabilities.


    The issues surrounding cybercrimes are exponentially different than other types
    of crimes carried out in society. Therefore, federal law enforcement agencies
    are faced with the difficult task of generating new approaches to combat them.
    This chapter explores the concepts of cybercrime and cybersecurity, presents the
    statistical impact it is having on organizations, and demonstrates the importance
    of an effective cybersecurity policy manual. It also describes the methodology
    used for this research, analyzes the data provided by expert testimonials, and
    introduces the development of a new innovative technological method (Blockchain)
    to minimize the risk of the cyber world. The analyses cover the extent to which
    Blockchain applications could help strengthen cybersecurity and protect organizations
    against cyberattacks, and what kind of research directions are essential for the
    future.


    **Keywords**: Cybercrime, cybersecurity, cyber world, Blockchain, Delphi'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# 11.1 Introduction


    This chapter is focused on cybersecurity policies and prevention. Cybercrimes
    are becoming more prevalent in cyberspace, and organizations must take proactive
    measures to minimize the risk of a breach of sensitive information. In order to
    elicit the perceptions of cyber-security experts and gain an understanding of
    the industry, we collected their expert opinion about Blockchain technology and
    the extent to which may be a viable cybersecurity method of protection. The data
    was collected using the Delphi Method, which is a systematic interactive way of
    gaining opinions/forecasts from a panel of independent experts. The anonymous
    gathering of information through surveys across a diverse population provided
    a more accurate and meaningful response. The Delphi method was especially useful
    in reducing ambiguity through the use of experts and analyzing relevant and timely
    issues facing the cybersecurity industry. In essence, the Delphi method has potential
    to provide both rigor and relevance to. The methods of analysis will be explained
    in-depth in the context of the report and detailed descriptions of the research
    tools can be found in [16]. The potential contribution of this work is that it
    is a pilot study, with guidelines to perform a similar study on a much larger
    scale.


    # 11.1.1 What is Cybercrime?


    Computers and Information Technology (IT) first emerged into the business world
    in the 1960s. Since then, cybercrime has steadily been on the rise. The cyber-security
    community and major news media have largely concurred on the prediction that,
    “Cybercrime damages will cost the world $6 trillion annually by 2021. This is
    up from $3 trillion just a year ago [12].” The rapidly evolving phenomenon, the
    Internet of Things (IoT) has dramatically changed the way business is conducted.
    Organizations must acknowledge that the use of these new digital assets and devices
    for accessing them present ongoing threats to the security of critical business
    information. “Internet of Things refers to things having identities and virtual
    personalities operating in smart spaces using intelligent interfaces to connect
    and communicate within social, environmental, and user contexts [15].” The IoT
    is widening the sphere of physical security of cybersecurity, as smart devices
    connected to business systems via the Internet may be located outside of established
    secure perimeters. As a result, this is a leading factor as to why corporate data
    is becoming increasingly harder to protect. IoT devices may be hacked remotely
    or through hardware changes if the device can be accessed, such as is the case
    for large exterior complexes such as chemical plants. Both the operating system
    and application vulnerabilities leave organizations open to attack.


    Organizations today are able to spread information quicker than ever before. However,
    the tools and platforms that allow companies to instantaneously connect internally
    and externally with customers, suppliers and partners are subject to the serious
    risk of exposure. Not only does cybercrime significantly hinder business functions,
    but it can also result in serious reputational damage when not handled properly.
    According to a report by Forbes Insight and IBM, 46 percent of companies have
    suffered reputational damage due to a data breach [10]. The stakes are clearly
    high when it comes to data breaches.


    Therefore, it is vital to the success of an organization that it takes a proactive
    stance when it comes to preventing and combating cybercrime.'
