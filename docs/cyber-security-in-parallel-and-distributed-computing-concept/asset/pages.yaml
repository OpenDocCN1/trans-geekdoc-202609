  md: '+   7. Online shopping can be done in less time compared to shopping physically.
    For example, if someone from India wants a product from Africa, they need not
    go to Africa, which is more time consuming, but rather can get the product within
    one or two weeks online.


    +   8. No need to carry money all the time, which is quite risky. The user can
    pay online.


    # ### 3.1.2  Business Revolution


    Prior to e-business, people used several marketing approaches, to sell their products
    and services such as sales promotions, brochures, etc. The general business approach
    is described as follows:


    The first category of business involves direct transactions from manufacturer
    to consumer or employer to workers. Here the business is small enough that the
    number of employees in the total business was no larger than a family and the
    manufacturer and the seller was the same person.


    In the second category of business, there is one seller between the manufacturer
    and the consumer. The job of manufacturer is to produce the products whereas sellers
    deal directly with the customers. Also, in this process the business is a small-scale
    business and the manufacturer is barely able to satisfy a small number of customers.


    The concept of wholesaler and retailer are involved in the third category of business.
    The manufacturer produced the products and sold it to the wholesaler. The wholesaler
    then sell the products to the retailers, the retailers sell their products to
    the sellers, and finally the sellers deal with the customer. Next, the distributor
    came into existence, who only carries the non-competing goods.


    This type of business is not applicable to the modern era where there is increasing
    demand for a variety of products. The customers want speedy delivery of goods
    to their doorsteps; low (*reliable*) price across the globe; good product; good
    customer support. The manufacturers also use much more money to sustain an advantage
    in the marketplace due to their many competitors. A complex business process is
    one, which includes manufacturing the products, market research, promotion of
    the products in print and online media, etc. The business structure must be scalable
    and reliable in order to satisfy customers.


    A schematic diagram of traditional business structure is shown in Figure 3.1.


    ![](img/57d9c6707468cbe6ea69c555dd9498fc_74_0.png)


    **Figure 3.1**  Product flow structure in traditional business.


    e-Business is the common mode of business nowadays. Though the traditional approach
    exists, in this digitized era, the system of business is almost automated through
    internet. Customers can choose products online from any business store like Amazon
    or Flipkart. The price of the product is also paid online by using online banking,
    debit card, credit'
