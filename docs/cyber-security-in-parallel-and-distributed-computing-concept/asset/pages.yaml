  md: '# Question #2: What should be done to encourage and/or mandate organizations
    to create and implement an effective cyber incident response plan?


    Three themes developed from this question, and are presented below:


    +   1. Maintain relationships with key external stakeholders, such as law enforcement.

    +   2. Enact legislation that establishes a new cybersecurity assessment model.

    +   3. It needs to be a cooperative effort to increase the awareness of the seriousness
    of cybercrimes and the potential they have to impact organizations.


    Survey respondent Z is quoted as saying “Professional associations should be encouraged
    to develop approaches that are beneficial to all members. This would reduce costs
    and aggregate risk analysis across the group.”


    # Question #3: What measures should be taken by federal governments to improve
    cybersecurity standards?


    Three themes developed in response from the experts in relation to the third question.


    +   1. New communication protocols need to be established and enforced such as
    encryption of communication devices.

    +   2. The SIPRnet approach needs to be modified and adapted for use within the
    U.S.

    +   3. Current commerce functions and future systems (such as VR) need to be modified
    by government authorities.


    Two of the experts summarized the scope of the question copiously. The responses
    mentioned that the Department of Homeland Security has to become more involved
    and should be encouraged to work with industry to develop robust approaches to
    corporate security.


    # Question #4: Please provide justification as to why you believe or do not believe
    the use of Blockchain applications would help to strengthen the cybersecurity
    policy at an organization.


    Five major themes developed from the final question.


    +   1. Blockchain technologies do have many important advantages. These include
    efficiency, transparency, reliability, and quick detection of attempted hack.

    +   2. More research and testing is necessary.

    +   3. The existing Internet commerce mechanism will need either major modification
    or replacement to take advantage of Blockchain features.

    +   4. Currently, there are no standards for cryptocurrency.

    +   5. Governments worldwide are in the process of creating regulatory policies
    for the application.


    # 11.6.3 Discussion and Limitations Based on the Results


    Reflecting on these themes, it is evident that measures need to be taken to address
    the fact that many organizations in today’s business world are vastly underprepared
    when it comes to their cybersecurity policy manual. Cybersecurity policies has
    been sidelined in'
