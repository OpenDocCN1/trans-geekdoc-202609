- pgno: 62
  md: '# 2.1 Introduction


    Hiding information refers to the problem of hiding important information in other
    objects. History shows that hiding information began thousands of years ago. From
    stories of the ancient Greeks, we know that they devised a way to exchange information
    between allies by shaving the heads of slaves, carving secret information into
    their scalps, waiting for their hair to grow back and sending them to meet allies.
    We also know of a method of writing secret information with animal milk, fresh
    lemon juice or vinegar on white paper; after the ink dries no trace of the script
    is seen on the paper but when heated over a flame, the letters are readable. In
    China, people thought of a way to carve secret information on the inside of an
    egg or on a wooden board, which was then waxed to hide the inscription. In addition,
    watermarks on foreign currency are also a form of hiding information to prevent
    money from being counterfeited.


    Nowadays, as science and technology are rapidly developing and the internet is
    growing globally, hidden information is also being digitized for use in areas
    of modern life. Digital information is divided into two main groups for the following
    purposes:


    +   - *Steganography*: This is a form of hiding confidential information on another
    object for the purpose of exchanging it between allies.

    +   - *Watermarking*: This is a form of embedding important information into an
    object to protect the object by marking it as license, copyright, fake, etc.


    In principle, hiding information in multimedia data or digital image data is not
    much different. But as hiding information in pictures is easier, more information
    is being hidden in that way. The use of digital pictures is quite popular on the
    Internet today, with the technique of hiding information in images accounting
    for the largest proportion of multimedia data types, with 56.1% images, 14.8%
    audio and 2.8% video [1].


    ![](img/57d9c6707468cbe6ea69c555dd9498fc_62_0.png)


    Figure 2.1 Classification of Steganography.


    Cryptography hides messages by converting them into hidden texts. On the other
    hand, cryptanalysis uses developed cryptographic techniques in order to decipher
    the ciphertext obtained to understand original content of the ciphertext. In contrast
    to steganography, which hides information in various types of files, image steganalysis
    is a technique that detects any images that have hidden information. Other than
    the scientific sense, the research'
