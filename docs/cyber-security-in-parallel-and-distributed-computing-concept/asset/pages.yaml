    # 3.2 Security Issues in e-Business


    There are four types of business systems: B2B (business-to-business), B2C (business-to-consumer),
    C2B (consumer-to-business), C2C (consumer-to-consumer), C2G (consumer to consumer).
    These e-business systems have common components like consumer, payment option,
    system information, customer information, product information, etc. The business
    system must provide security for each of its components. There are two types of
    security issues present in the business system such as security threats and vulnerabilities.


    Data mining is the key area in the 21st century, which is applied in almost every
    field of the technology. According to Steve Morgan [6], there is more investment
    in cybersecurity than health care. It is the case that health care providers are
    more careful about protecting patient data. Similarly, in e-business the data
    repository must be safe, because data sometimes much more precious than economy.


    According to Richardson [6] attacks by means of bots, DNS attack, password sniffing,
    and data stolen from mobile devices are increasing tremendously. Denial of service,
    financial fraud, and malware threats constantly exist in the network. According
    to Identity Theft Resource Center (ITRC) [7], data breaches increased by 45% from
    2016 to 2017, which is more than in any previous years.


    e-Business has some strategies and processes [2] which relate to the transmission
    of goods and services from supplier to consumer via internet. There are many threats
    like disclosure of confidential information to modify the information, which results
    in loss of data and economy. The malicious user always tries to find new methods
    to bypass the security and privacy of the e-business system.


    For example, when a consumer buys a product from store “S” and tries to pay for
    it, some inauthentic person collects the debit card or credit card information
    of the consumer. Now the inauthentic person can use the consumer data for personal
    use.


    Similarly, there are many threats to the e-business system, which are described
    below.


