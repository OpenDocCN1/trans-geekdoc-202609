    # 1.5.3 Combating Crimes


    In the previous subsection we have familiarized ourselves with several cybercrimes.
    We now know that cybercrimes are a result of vandalizing the system and can be
    performed by gaining unauthorized access into them using viruses, worms, frauds,
    data breaches, spams and scams. Different cybercrimes have different prevention
    and detection techniques. We have already discussed how timestamps and logs collectively
    provide information about unauthorized access. In this section we will focus on
    ways to combat cybercrimes. Following are some effective ways of doing this.


    # 1.5.3.1 Securing Networks


    Network security is the biggest concern when combating cybercrimes. The network
    may be part of a small enterprise or may be robust enough to span multiple organizations.
    It may be simply wired or wireless; either way it is vulnerable to cybercrimes.
    The easiest way to secure networks would be hardening the systems such that firewalls
    are installed or unnecessary ports are blocked. The firewall should be stable
    enough to protect services in the demilitarized zone as well as different critical
    servers. The wireless networks must ensure encrypted access points along with
    the service set identifier (SSID) being hidden or changed to a less suspicious
    name. Other security measures available for securing the network are in form of
    intrusion detection systems (IDS) and intrusion prevention systems (IPS), which
    can work collaboratively to ensure greater security. They can identify potential
    threats to the network by constantly monitoring and identifying events to log
    information about them. This information may be sent to the management.


    # 1.5.3.2 Incident Response Team


    The incident response team is concerned with combating cybercrimes in the sense
    that they receive information about data leakage, analyze the events and respond
    accordingly. The team may consist of security professionals like incident handlers,
    vulnerability handlers, penetration testers, reverse engineers, etc., who perform
    security operations. The cybercrimes usually handled by the incident response
    team mainly revolve around viruses, worms, unauthorized access, denial-of-service
    attacks, etc.


    # 1.5.3.3 Detecting Malware


    Malware works by using the principle of getting installed into a system and then
    enabling a backdoor so that confidential information may be retrieved. It is important
    that a malware is detected before a system is infected. Several malware classification
    techniques are adopted for the same. Network-based malware prevention technique
    analyzes the network traffic and blocks any malware that is found. Endpoint-based
    malware prevention technique has endpoint software that analyzes the traffic moving
    into and from the machine. It detects the malware and also any application that
    runs it.


    # 1.5.3.4 Authentication and Authorization


    Identity theft is one of the most common cybercrimes. The process of authentication
    may be used to validate the identity of a user. The process of authentication
    relies on what we know (something like a PIN or a password), what we have (like
    an access card) and what we are (biometrics). Authentication may be single factor
    or multifactor, keeping in'
  merge: -1
  img_proc: true
