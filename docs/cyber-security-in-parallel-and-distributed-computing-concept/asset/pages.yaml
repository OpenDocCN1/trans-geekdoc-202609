    In a world ruled by speed and perfection, technology relies primarily on computer
    science. Be it a simple act of sending an email or a critical act of conveying
    billions of dollars, almost everything is merely a click away. The world of computer
    science keeps people engaged in activities like gaming, website surfing, social
    media, banking, digital citizenship, etc., with a grip spanning many domains such
    as hardware, software, network, data, etc. Because so many activities rely on
    computers, they attract criminals, which ultimately leads to cybercrime, which
    could be as elementary as basic hacking or as elaborate as ransomware attacks
    or financial cybercrimes. The consequences may vary from loss of personal or sensitive
    information to massive amounts of money. Thus, the need to ensure cybersecurity
    is paramount. In this chapter, we will take a look at the concept of cybersecurity,
    its causes, consequences and principles. The idea of cybersecurity is not only
    limited to small firms and educational institutions, but also spreads across various
    industries and governments, making it one of the most significant areas of study.
    In the past, certain objectives have been proposed to safeguard such critical
    cyber infrastructures. Certain standards, guidelines and practices have found
    their place in cybersecurity frameworks to ensure that the cyber infrastructure
    and architecture is secure. Since the operations are multiple as well as insightful,
    they must be carried out by accountable personnel who are usually given roles
    in the cyber infrastructure depending on their nature of their work such as the
    security administrator or the incident response team. We will look forward to
    some of the roles in this chapter. The nature of cybercrimes over the last few
    years has changed drastically owing to the change in motive behind the crimes,
    tools and techniques involved and the overall consequences. We observe the contrast
    between traditional computer crimes and contemporary computer crimes over the
    last few years. General evolution of cybercrimes has led to internet based risks
    affecting businesses, organizations etc. which have the potential to harm liability
    and properties. Therefore, cyber insurance is discussed in this chapter, which
    is a recent concept that promises coverage when organizations suffer internet-based
    risks. Later on in the chapter, security policies and various security models
    that enforce them are explained. A few security models, such as the Bell-LaPadula
    and Biba models, will be discussed in this section. Furthermore, the reader will
    become acquainted with the concepts of network neutrality and human rights, as
    they go hand in hand. Keeping in mind the risks and aftereffects of cybercrimes,
    we also explore the legal aspects of cybercrimes by analyzing the concept of computer
    forensics. Some best practices pertaining to countermeasures for information warfare
    are also discussed.'
