  md: '# CHAPTER


    # 6


    # Introduction to Blockchain Technology


    ISHAANI PRIYADARSHINI


    University of Delaware, Newark, Delaware, USA


    Email: IshaaniPriyadarshini@udel.edu


    # Abstract


    Data is one of the most valuable assets. With cyber criminals becoming increasingly
    skillful in their attempts to steal valuable data, cybersecurity tends to be one
    of the greatest global concerns, making cyber defense mandatory. In the past,
    various techniques have been proposed owing to the security needs of various institutions;
    however, security assaults know no bounds, hence resulting in either the techniques
    being weakened or futile. The latest approach to protect valuable data is blockchain
    technology. In this chapter we will be taking a look at the concept of blockchain
    technology and how it is crucial to the security industry. As we delve a bit more
    into the details, we will be taking a look at the characteristics of blockchain
    technology, its structure, types, architecture and workings. Since Bitcoin is
    one of the most widespread applications of blockchain technology, this chapter
    also highlights the workings of bitcoins. Later on, we discuss a few of the challenges
    faced by this technology and its scope in the future.


    **Keywords**: Blockchain, Bitcoin, cybersecurity'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# 6.1 Introduction


    One of the biggest cybersecurity issues faced by individual computer users as
    well as corporate firms is data theft, not only because it threatens an individual’s
    privacy, but also because it defeats one of the primary purposes of cybersecurity,
    i.e., confidentiality. Over the last few decades, several techniques have been
    proposed to deal with the issue, and many of them have been short lived, the reason
    being highly skilled cyber criminals. The latest addition is blockchain technology.
    Data dispersed over the network is prone to pilferage and plagiarism and often
    it is impossible to trace back to the cyber criminal. Blockchain technology eliminates
    the issue on many levels. A blockchain may be defined as a distributed database
    incorporating information or a book that marks all the events and transactions,
    executed and shared among concerned parties. The transactions are verified and
    information entered can never be erased. Every transaction made has a verifiable
    record. Blockchain technology finds its use in financial as well as non-financial
    sectors.


    Blockchains are public registers such that all transactions are accumulated in
    a list of blocks [1]. When several blocks keep being added on, it leads to a chain-like
    formation. Blockchain technology is primarily based on the concepts of cryptography
    and distributed systems. Encryption techniques have been known to obscure content,
    such that it is available only to the intended users. But certain information
    needs to be available to specific groups of people, and it invites additional
    risk of the information getting manipulated. Blockchains tackle the issue. When
    data is accessed and updated, any change made is recorded and verified. Thereafter,
    it is encrypted so that further changes cannot be made. These changes are then
    updated into the main records. It is a repetitive process and every time a change
    is made, the information is preserved in a new block. It is fascinating to note
    that the first version of the information is well connected to the latest one.
    Thus, the changes made could be seen by everyone, but only the latest block can
    be modified. Blockchain imitates a distributed database by incorporating information
    duplicated across the network in real time. This means that the database has multiple
    locations and the records are public and easily verifiable. Since there is not
    a centralized version, data corruption is futile. Modifying records is tedious,
    thus making it easier to detect if someone is trying to do so. Thus, a blockchain
    could be thought of as a piece of data that has the following properties:


    +   1. It is constantly updated. This makes it easier for the users to access
    and modify data anytime.

    +   2. It is a distributed system in the sense that duplicated copies of data
    are stored and span the network. Updating one record updates every other copy
    in real time.

    +   3. It has verified data. When data is modified, it has to be verified by users
    using cryptographic techniques.

    +   4. The data is secure because cryptographic techniques and distributed systems
    do not allow tampering of data and security techniques.


    One way of classifying blockchains is as permissionless blockchains and permissioned
    blockchains. Permissionless blockchains are open, they can be connected and abandoned
    by any peer as a reader or writer. They are decentralized and the information
    is readable by users. Permissioned blockchains authorize limited readers and writers.
    They are managed by a central entity which decides which individuals can read
    or write [2].'
