  md: '# 1.6 Security Models


    Security models are based on the concept of confidentiality, integrity and availability.
    Different security models tend to different concepts and describe how security
    must be implemented. They also take into account what subjects can access a particular
    object or what objects could be accessed by subjects. Since different models have
    different capabilities, they could be applied to any system, keeping in mind the
    requirements and functioning of the system. In this section we will describe several
    security models [9]. They are as follows:


    1. **State Machine Model:** This is the basic security model which captures the
    functioning of the finite state machine. The number of states, the transactions
    involved and the actions taken are observed by this model. The idea is to monitor
    the status of the system so that it does not transit to an insecure state. A particular
    state will have the permission of all the subjects accessing the objects. The
    security feature preserves is integrity. This is ensured by the fact that each
    state transition function is tested to verify that the current state will not
    be compromised in order to maintain the integrity of the system.


    2. **Information Flow Model:** The state machine model extends to the information
    flow model and further to the Bell-LaPadula and Biba models. The model incorporates
    objects, transition and lattice states. This model is adopted to prevent any unauthorized
    information flow, thereby preserving the security feature availability. The model
    is capable of blocking restricted information flow between subjects and objects.
    However, information flow in the same classification level is highly encouraged.


    3. **Non-Interference Model:** Proposed by Goguen and Meseguer, per its name,
    the non-interference model ensures that subjects and objects at different classifying
    levels do not interfere with each other (higher or lower). It is impossible for
    data to cross security boundaries, i.e., if a subject at higher level performs
    an action, the state of the subject at lower level cannot be changed. An interference
    attack takes place when an entity has the potential to retrieve information and
    is capable of inferring information it is not entitled to based on the clearance
    level.


    4. **Bell-LaPadula Model:** It is a mathematical model that follows multilevel
    security policy using the mandatory access control and promotes confidentiality.
    Different subjects may have different classification levels like top secret, secret
    and confidential. The subjects must be authenticated with respect to their security
    clearances to access an object that lies at a different classification level.
    The Bell-LaPadula model follows certain rules, which are as follows:


    +   - Simple Security Property, wherein a subject that belongs to a particular
    level of confidentiality cannot read information pertaining to a higher level
    of confidentiality, often referred to as “no read up.”

    +   - Star * Security Property wherein a subject belonging to a particular level
    of confidentiality cannot write information pertaining to a lower level of confidentiality,
    often being termed as “no write down.”

    +   - Strong Star * Property, wherein subject may not be allowed to read/write
    to an object pertaining to higher/lower sensitivity.'
