- pgno: 126
  md: '# 7.1 Introduction


    Distributed computing is a more generic term than parallel computation. More often
    than not, both terms are used interchangeably. Unlike parallel computing where
    concurrent execution of tasks is the working principle, distributed computing
    deals with additional capabilities like consistency, partition tolerance and availability.


    A system like Hadoop or Spark is an example of distributed computing system that
    is highly robust and reliable in the sense that it can handle node and network
    failures. Such systems achieve data loss prevention through data replication over
    multiple nodes in the network. However, both systems are also designed to perform
    parallel computing. Unlike HPC systems like MPI, these new kinds of systems are
    able to continue with a massive calculation even if one of the computational nodes
    fail.


    # 7.1.1 Primary Characteristics of a Distributed System


    A distribution middleware connecting a network of autonomous computers is known
    as a distributed system. Any typical arrangement of a distributed system enables
    users to share different resources and capabilities with a solo and integrated
    consistent network.


    +   - *Concurrency:* Enabling sharing of resources by various nodes in a distributed
    setup at the same time is the concept behind concurrency.

    +   - *Transparency:* The perception of the system as a single unit instead of
    an assembly of autonomous components is the main idea behind transparency. The
    aim of a distributed system designer is to hide the complexity of the same as
    much as possible. Transparency parameters can be usage permissions, relocation,
    concurrency, breakdown, diligence and user resources.

    +   - *Openness:* The objective of openness is to design the network in a way
    that can be easily configured and/or modified. Developers often require adding
    new features or modify/replace any existing feature in any distributed node, which
    is easily facilitated if there is proper support for interoperability based on
    some standard protocols. Also, well-defined interfaces smoothen the process [1].

    +   - *Reliability:* Distributed systems are capable of being highly resistant
    to failures, secure and more consistent when compared to a single system.

    +   - *Performance:* Performance wise, a distributed system also outperforms an
    autonomous system by a huge margin by enabling maximum utilization of resources.

    +   - *Scalability:* Any distributed system must be designed keeping in mind that
    it may have to be extended or what we call scaling based on future requirement
    or increasing demand. A system may demand scaling on parameters like geography,
    size or administration [1].

    +   - *Fault Tolerance:* Fault tolerance and reliability of a system can be considered
    close neighbors. A fault-tolerant system is one that provides high reliability
    even in the toughest of scenarios, be it subsystem failures, network failures,
    etc. Providing security to the system in various ways possible, like increasing
    redundancy of data, preventing denial-of-service (DoS) attacks, upgrading the
    level of resilience of the system, etc., makes a system a fault-tolerant one.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# 7.1.2 Major Challenges for Distributed Systems


    The challenges of a distributed system is shown in Figure 7.1.


    ![](img/57d9c6707468cbe6ea69c555dd9498fc_127_0.png)


    Figure 7.1 Challenges of a distributed system.


    **Heterogeneity:** Services and applications spanning a varied group of computers
    and networks can be used, run, and accessed by users over the Internet.. Hardware
    devices of different variants (*PC, tablets, etc.*) running various operating
    systems (*Windows, iOS, etc.*) may need to exchange information or communicate
    among themselves to serve a particular purpose. Programs written in unlike languages
    will be able to converse with one another only when these dissimilarities are
    dealt with. For this to take place, like the Internet protocols, agreed upon standards
    also need to be required and accepted [3]. The word middleware applies to a software
    layer that provides a programming abstraction in addition to masquerading the
    heterogeneity of the core networks, programming languages and operating systems
    hardware.


    A program code that can be relocated from one computer to a different one and
    executed at the destination is referred to as a mobile code. One such example
    of a mobile code is Java applet.


    **Security:** While using public networks, security becomes a huge concern with
    respect to distributed environment. Security, which can be described in broad
    terms as confidentiality (*protection against revelation to illegitimate persons*),
    integrity (*protection against modification or dishonesty*) and availability (*protection
    against meddling with ways to use resources*), must be provided in DSS. Encryption
    procedures can be used to fight these concerns, such as those of cryptography,
    but they are still not infallible. Denial-of-service (DoS) attacks can still take
    place, where a server or service is showered with fake requests, usually by botnets
    (*zombie computers*). The possible threats are data leakage, integrity infringement,
    denial-of-service (DoS) and illegal handling.


    **Fault Tolerance and Handling:** Fault tolerance becomes more complicated when
    some unreliable components become an integral part of the distributed system.
    Distributed systems require the fault tolerating ability of a system and function
    normally. Failures are unavoidable in any system; some subsystems may stop functioning
    whereas others go on running fine. So as you would expect, we require a means
    to detect failures (*by employing several techniques like issuing checksums*),
    mask failures (*by retransmitting upon failure to obtain acknowledgement*), recover
    from failures (*by rolling back to a previous safe state if a server crashes*),
    and build redundancy (*by replicating data to prevent data loss in case a particular
    system in the network crashes*).


    **Concurrency:** Numerous clients trying to ask for a shared resource at the same
    moment may lead to concurrency issues. This is critical as the results of any
    such information may depend on the completion order and so synchronization is
    needed. Moreover, distributed'
  merge: -1
  img_proc: true
