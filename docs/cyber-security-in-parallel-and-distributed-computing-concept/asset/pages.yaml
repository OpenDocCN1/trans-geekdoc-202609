    A distributed system represents a network which comprises of various autonomous
    computers interconnected through a distribution middleware. In this system, sharing
    of various resources occur. In other words, a distributed system is that system
    which is designed to assist in the development of various applications as well
    as services that can makes use of a physical architecture consisting of multiple,
    processing elements that are autonomous and which do not share primary memory,
    which, however, cooperate through transferring asynchronous messages over a communication
    network of interest. The main motto of using distributed systems is: resource
    sharing, scalability, extensibility, etc. A schematic of information exchange
    in distributed systems is as shown in Figure 14.3.


    ![](img/57d9c6707468cbe6ea69c555dd9498fc_234_0.png)


    As shown in the Figure 14.3, all the systems are interconnected through a local
    area network (LAN). A gateway is present that connects one network to another.
    In this chapter, we put focus on several mechanisms which are normally integrated
    into distributed systems for assisting security. Fundamentally, security in distributed
    systems can be divided into two parts: the first part is concerned with the communication
    between users or processes, which dwell on distinct machines. The primary technique
    for making sure such communication is secure is using a secure channel.


    In the coming sections, we will discuss message confidentiality, message authentication
    and message integrity. The second part concentrates on authorization that deals
    with making sure that a process attains access rights to those resources in a
    distributed system for'
