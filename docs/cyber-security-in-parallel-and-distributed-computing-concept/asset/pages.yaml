    the purchaser, a merchant, and the purchaser’s bank in a way that ensures privacy
    and confidentiality [15].


    12. Data Encryption: Encryption is defined as the procedure of encoding the information
    so that the information cannot be read by normal means. Encryption will also change
    the data on the information that will be hard to read and also time-consuming
    if the encryption result data decoded without using any special rules or codes
    [16].


