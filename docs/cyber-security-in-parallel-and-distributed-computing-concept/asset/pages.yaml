    segment can be considered to be in conjunction of rising in the smartphone usage
    and internet penetration in the nation. The authors also stated that demonetisation
    in India has also proved to be a lucrative opportunity for m-wallet players in
    India. It led to the flooding of the m-wallet companies’ will millions of transactions
    and double the number of users. The paper also tries to explain the categories
    of in which the m-wallets are divided and also explains the various operational
    features available in these e-wallets. The various operational features mentioned
    in this paper are entities which are allowed to operate like banks, NBFCs (Non
    Banking Financial Companies), and various other entities, KYC requirement weather
    it is required or not etc. It also shared the amount which can be stored in the
    PPI by the card holder like for example INR 10,000 can be stored in the closed
    wallets and an amount of 10,000 can be stored, in Semi-closed PPI without KYC
    while an amount of 50,000 can be stored in the same with KYC.


    Pandy et al. [22] wrote a definition of mobile wallets and for this paper the
    mobile wallet can be defined as “a digital container accessed by a mobile device
    (i.e., Smartphone) that stores wallet applications, payment credentials, loyalty
    cards, and coupons, and is used to make proximity and remote mobile payments”.
    The author wrote about the various technological features available in e-wallets
    and these include NFC (Near Field Communication), cloud based card-on file (CoF)
    and merchant or financial institution (FI) QR code closed wallets. The FRBB wallet
    team field-tested all the wallet models. They also tested the NFC Pay wallets
    with the device-specific mobile operating systems like the Apple iOS and Android
    KitKat (4.4 or higher). The various cloud-based mobile wallets, such as PayPal,
    master pass, pay with Amazon, visa checkout, chase pay, and walmart pay, are also
    device-agnostic, although some only function in the remote payments environment
    (Amazon⁵) or the POS environment (Walmart Pay⁶). They also discussed the various
    security controls for the mobile wallets which secures the mobile wallet payment
    method. These are payment tokenization, one-time password (OTP) protection etc.


