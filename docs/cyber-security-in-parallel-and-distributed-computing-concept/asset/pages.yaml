- pgno: 59
  md: 'Hence, the United States Constitution does not allow the right to privacy pertaining
    to cybersecurity.


    4. Freedom of Association: This is the right of individuals to come together to
    form societies, clubs and other groups to meet other individuals such that they
    are not interrupted by the government. They may express, promote and defend ideas
    forming unions. Over the internet, people sign petitions, join social media, etc.,
    and form associations. As long as it does not abuse public interest, this human
    right is acceptable.


    Technological development is always ahead of human rights laws, and poses a challenge
    to several institutions which have fewer protections in law. Technology also provides
    the platform to broadcast human rights. It can bring people together, encourage
    freedom of expression and increase access to information over the network. Keeping
    in mind the human aspects, it is important that human rights and technology go
    hand in hand.


    # 1.9 Future of Cybersecurity


    As we know, cybersecurity happens to be one of the biggest global challenges.
    Recent trends have highlighted how attacks are becoming more and more sophisticated
    with the growth of technology. Vandalizing systems and patching them are red team-blue
    team exercises which go hand in hand. There is no way to attain 100 percent security.
    However, it is possible to prevent security issues to a certain extent and recover
    the lost data. Most of the patchwork methods proposed in the past have been degraded
    by further advanced attacks. Be it the physical systems, or the networks, the
    cloud infrastructure, cybersecurity finds its use in almost all the domains. Several
    concepts like machine learning, artificial intelligence and cyberpsychology are
    the latest additions to cybersecurity. All the stated concepts are prone to cyberattacks,
    thus making cybersecurity an enormous issue. Another concept which is relevant
    to the future of cybersecurity is the concept of blockchain, which we will be
    taking a look at in a later chapter.


    # 1.10 Conclusion


    In conclusion, we have taken a look at the concept of cybersecurity at a fairly
    deep level. We have addressed the objectives, infrastructure and architecture
    pertaining to cybersecurity. Along with that, we have acquainted ourselves with
    the idea of various roles in the field of cybersecurity. The need for cybersecurity
    has arisen due to an increase in cybercrimes. We have discussed traditional and
    contemporary cybercrimes and also specified the ways to deal with those crimes.
    To ensure cybersecurity in an organization, security models must be followed.
    We have discussed several security models, their advantages and disadvantages.
    Other cybersecurity concepts, like computer forensics, digital citizenship and
    cyber insurance, have also been introduced in this chapter. Furthermore, we imparted
    knowledge about network neutrality and information warfare. The good practices
    and policies that play a major role in securing an enterprise have been highlighted.
    Since cybersecurity deals with certain aspects like freedom of expression, opinions,
    etc., the idea of human rights expression, opinions, has also been considered.'
  merge: -1
  img_proc: true
