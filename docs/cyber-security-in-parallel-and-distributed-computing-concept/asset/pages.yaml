  md: 'and get access to victim’s accounts, possibly leading to unauthorized charges
    on credit cards or a siphoning of bank accounts.


    5. **Terrorist Uses of Smartphone**: Similar to criminals, terrorists have also
    worked up elaborate mechanisms to fraudulently acquire random cell phone numbers
    and devices under unsuspecting victims’ names. For extremely low prices, numbers
    and devices are accessible to terrorists for exploitation in their malicious objectives.
    Some such issues are presented below.


    6. **Burner Phones**: A burner phone is an inexpensive and mostly refurbished
    mobile phone [18] designed for temporary use, after which it may be discarded.
    Burner phones are mostly purchased with prepaid minutes and without a contract.
    Using phones and increasing balances purchased with cash rather than a credit
    card and having no contract with a service provider clearly imply that no record
    of the user connected to the phone number can’t be traced. If the user suspects
    that the number has been traced or compromised, they can just dump the phone and
    purchase a new one, which would have a totally new number. Today, a large civil
    population uses smartphones, and smartphone numbers are increasingly being used
    as unique profile identifiers that connect user data across multiple databases.
    Moreover, phone numbers aren’t subject to privacy requirements like credit card
    details and social security numbers and thus are shared frequently. As a result,
    mobile number privacy is a growing security issue. An easy method of increasing
    mobile security is the use of burner phone mobile apps or services rather than
    using an actual device, which provides a temporary phone number that can be provided
    instead of the user’s actual cell number. One such application is the Burner mobile
    app [19] service, that has numbers that usually expire after a certain time period.
    These numbers can be used by paying for them with in-app purchases. If they lapse,
    they’re burned. The premium subscription gives the user a permanent second number.
    When a user calls via Burner, it actually calls Burner, which in turn replaces
    a relay call to the number you want to reach. Details of the Paris terror attacks
    [20] reveal that instead of encryption, consistent use of prepaid burner phones
    helped the terrorists to remain off the radar of the intelligence services. The
    three terrorist teams in Paris used only new phones, activated minutes before
    the attacks and discarded after use. Later, the investigators found a Samsung
    phone in a dustbin near a theater. The phone had a Belgian SIM card used only
    since the day before the attack. The phone was used to call just one other unidentified
    number in Belgium. As police pieced together the movements of the attackers, they
    found yet more burner phones.


    7. **Smartphone Bomb**: Generally, two smartphones are used in the bomb-making
    process; one to call the other, which then transmits a signal to a circuit board
    and triggers the explosion [21]. Smartphones are basically small and sophisticated
    radio devices that translate a radio signal into an equivalent electrical pulse
    and convert that current into sound. If a smartphone is integrated with a bomb
    as a triggering device, the electrical impulse generated by the smartphone is
    adequate to create a detonation charge to trigger the main explosive compound
    of the bomb. Crafting a mobile phone into a remotely detonable bomb trigger is
    very easy and cheap due to the availability of online information and spare parts.
    Exploding such bombs also simply requires dialing the mobile number of the SIM
    in the phone connected to the detonator. The 28-year-old terrorist, Ahmad Khan
    Rahami, the suspect in twin bombings at locations in New Jersey and New York,
    admitted the use of smartphones [22] to detonate his homemade'
