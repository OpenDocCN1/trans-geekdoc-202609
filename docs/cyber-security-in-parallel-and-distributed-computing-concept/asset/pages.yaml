- pgno: 206
  md: '**Mobile Malware Dissemination:** After the era of desktop and laptop targeted
    malware applications, new malware threats are constantly evolving along with the
    improving architectures of mobile devices. Malware, including Trojan, worm, virus,
    ransomware and spyware, can rigorously damage normal functionalities of mobile
    devices. Also, malware infected mobile devices also pose a high risk of infecting
    other connected devices in their networks [3, 28].


    **Mobile Phishing:** To a certain extent, risk of malware propagation can be encountered
    by using updated anti-virus software products. But another class of social engineering-based
    attacks that trick the users of mobile devices to fall prey to malicious exploits,
    is phishing attacks. Phishing attacks can trick a victim mobile user to naively
    handover their user details, login credentials, financial information, browsing
    history or download malware on their mobile device [29]. To execute these attacks,
    a sufficiently harmless and reasonable looking link to a website is sent to the
    victim’s mobile device by the cyber criminals. The link can be embedded into a
    webpage, a text message or an application-specific message such as WhatsApp, etc.
    The formal and sophisticated language of the approach of such links generally
    makes even the experienced user believe the context and click on them. After clicking
    the link, malicious applications or processes, crafted specifically for target
    devices, are triggered to execute in the background of the mobile device. After
    execution, such attacks are capable of stealing sensitive data or even damaging
    the normal functioning of the device. Phishing attacks via mobile phones can be
    further elaborated into the following categories [7, 8]:


    **Vishing:** The act of scamming or tricking a mobile user by making use of telephonic
    conversation to unknowingly surrender his sensitive information to be exploited
    for identity theft is known as vishing [12]. Generally, in vishing attack, the
    attacker impersonates a worker or official of a genuine business group and tricks
    the user by threatening service disruption, official penalty or promising a significant
    profit.


    ![](img/57d9c6707468cbe6ea69c555dd9498fc_206_0.png)


    **Figure 12.3** The schematic sequence of a SMiShing attack.'
