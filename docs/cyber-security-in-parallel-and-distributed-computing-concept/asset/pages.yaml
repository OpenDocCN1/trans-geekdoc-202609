- pgno: 239
  md: '# 14.4 Globus Security Architecture


    The idea of security policy and the mode that security mechanisms contribute in
    distributed systems for enforcement of such types of policies are best established
    by considering an example. Let us discuss the security policy involved for the
    Globus wide-area system [3]. Basically, Globus is a system that supports large-scale
    distributed computations where many hosts, files, and other resources are concurrently
    employed for carrying out a computation. These environments are also referred
    to as computational grids. Furthermore, many times resources in these grids are
    located in distinct domains of administration which may be positioned in several
    parts of the world.


    The security policy for Globus includes the following statements:


    +   - The environment consists of a number of administrative domains.

    +   - Local operations: It represents the operations which are conducted only
    within a single domain. These are merely subjected to a local domain security
    policy.

    +   - Global operations: This represents the operations concerning several domains
    that require the concerned initiator to be known in every domain wherever the
    operation is being conducted.

    +   - Operations between entities in distinct domains need mutual authentication.

    +   - Local authentication is replaced by Global authentication.

    +   - Controlling access to the resources is mainly merely subjected to local
    security.

    +   - Users can delegate the right to the processes.

    +   - Credentials can be shared among processes in the same domain.


    It is assumed that the environment consists of number of administrative domains,
    such that every domain possesses its policy for local security. It is further
    understood that local policies cannot be altered since the domain takes part in
    Globus. Subsequently, security in Globus prohibits itself from operating, which
    can hamper several domains relevant to this issue. Furthermore, Globus assumes
    that operations which are completely local to a domain are subject only to the
    concerned domain’s security policy. The Globus security policy means that various
    requests for operations can be initiated either locally or globally. The initiator
    can be a user or process acting on behalf of a user, and must be locally known
    within each domain.


    Once a user or a process acting on behalf of a user gets authenticated, it becomes
    essential to verify the exact access rights with respect to resources. For example,
    a user wishing to update a file will first have to be authenticated; afterwards,
    it can be verified whether or not the concerned user is practically permitted
    to update the file. The Globus security policy depicts that the access control
    decisions are framed completely locally within the domain of the location of the
    accessed resource. Furthermore, Globus focuses on security threats involving multiple
    domains. Specifically, the security policy demonstrates that the crucial design
    issues involve the representation of a user in any remote domain, as well as the
    allocation of resources from a remote domain to a user or his representative.
    The architecture of the Globus security policy is as shown in the Figure 14.6.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '![](img/57d9c6707468cbe6ea69c555dd9498fc_240_0.png)


    Figure 14.6 Globus security policy architecture.


    # 14.5 Distribution of Security Mechanism


    The dependency existing among services concerning trust gives rise to the notion
    of a Trusted Computing Base (TCB). A TCB represents a set of all security mechanisms
    in a distributed computer system that are necessary for ensuring a security policy,
    and which are required to be trusted. The smaller the TCB is, the better it will
    be. Furthermore, TCB in a distributed system can incorporate the local operating
    systems at several hosts. A file server in a distributed file system might need
    to to be believed on the several protection mechanisms afforded by corresponding
    local operating system. Moreover, middleware-based distributed systems need to
    trust in the existing local operating systems. If no trust exists, then part of
    the functionality of the local operating systems has to be incorporated into the
    distributed system itself.'
  merge: -1
  img_proc: true
