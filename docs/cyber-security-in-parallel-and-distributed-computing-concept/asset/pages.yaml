- pgno: 36
  md: '**Oversee and govern**: The process of overseeing and governing assists in
    providing leadership, development, management and advocacy (*law and order*) for
    proper working of an organization. Some of the specialized fields and their corresponding
    roles are described as follows:


    1. **Cyber law and advocacy**: This deals with all the legal procedures in order
    to provide consultancy on specific information technology-based issues and acts.
    The laws and policies have a direct impact on human rights and may also address
    cybercrimes. The roles that are specific to cyber law and advocacy are as follows:


    +   - *Cyber legal advisor*: Is responsible for providing legal advice and solutions
    to issues that pertain to cyber law.

    +   - *Privacy compliance manager*: Develops privacy compliance programs which
    highlight privacy issues.


    2. **Training and education**: With cyberattacks growing rampantly, securing data
    and infrastructure requires highly trained professionals who must be academically
    and technically sound. The roles that form a part of this field are as follows:


    +   - *Cybersecurity curriculum developer*: Chalks out and evaluates cybersecurity
    training and education courses and techniques.

    +   - *Cybersecurity instructor*: Conducts classroom training and education of
    people who require cybersecurity knowledge and skills.


    3. **Cybersecurity management**: This refers to procedures, operations and functions
    undertaken by an organization to ensure security in its infrastructure. It is
    used for thwarting issues like cyberattacks, intrusions, data breaches and malware.
    The roles belonging to this field are as follows:


    +   - *Information systems security manager*: Ensures security of a program or
    organization.

    +   - *COMSEC manager*: Communications security (COMSEC) resources of an organization
    is taken care of by COMSEC manager.


    4. **Policy making**: The process of policy making ensures that a system is properly
    placed such that it can guard against critical attacks. This is done by implementing
    procedures and guidelines in order to protect a system as well as identify threats.
    The responsibilities of those taking on this role are as follows:


    +   - *Cyber workforce developer and manager*: Develops plans and strategies to
    support the education and training required for staff and professionals. Those
    in this role can also perform changes to existing policies.

    +   - *Cyber policy planner*: Develops and plans cybersecurity policies that align
    with the needs of security infrastructure.


    5. **Cyber leadership**: The aim of cybersecurity project management is to direct
    to cybersecurity activities [6]. The following role belongs to this field:


    +   - *Executive cyber leadership*: These officials are responsible for conducting
    decision-making and directing the operations for an organization''s security.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '6. **Project management**: The aim of cybersecurity project management is to
    direct security projects with respect to an organization’s needs and goals. The
    role taken up for this field are as follows:


    +   - *Program manager*: Plays a lead role in coordinating, communicating and
    integrating the program and is accountable for it.

    +   - *Project manager*: Manages the product throughout its life cycle.

    +   - *Product support manager*: Ensures that the functionalities are embedded
    into the system and that the system is operationally capable.

    +   - *Investment manager*: Manages a portfolio that highlights the details of
    the system capabilities and ensures that the needs are met.

    +   - *Program auditor*: Takes care of evaluations of the system and its individual
    components to ensure that the system is updated.


    # Protect and Defend


    The protection and defense approach in cybersecurity is concerned with identifying
    and analyzing a system for threats and vulnerabilities in order to mitigate them.
    Following are a few areas and roles concerned with this specialization:


    1. **Defense analysis**: The idea of defense analysis is based on the use of defensive
    tools and techniques in order to identify, analyze and report issues in a system
    that might potentially serve to corrupt information or system. The responsibility
