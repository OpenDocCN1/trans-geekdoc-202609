- pgno: 178
  md: 'The literature on the subject points out that too few individuals are employed
    at organizations to prevent and handle breaches [12]. What separates a secure
    organization from the rest is one that has developed methods to detect attacks
    as soon as they happen, and one that has the ability to respond immediately to
    any incidents that occur. Cybersecurity is explained in terms of three triads
    that describe the objectives of security professionals and their methods [2].
    They are:


    +   1. Prevent, Detect and Respond

    +   2. People, Processes, Technology

    +   3. Confidentiality, Integrity, Availability


    These nine terms represent the common goals and methods common to both technology
    management and to cybersecurity management as a specialized field.


    IT is continuously changing and hackers are constantly discovering new ways to
    breach defenses and exploit system weaknesses. Therefore, organizations need to
    understand that they have to allocate personnel to stay informed of each new potential
    weakness. Federal governments and business entities are having an incredibly difficult
    time combating economic crime. Therefore, regulations and standards need to be
    created and modified to assist with this. It is virtually impossible for an organization
    to completely eliminate the vulnerabilities contained in its computer system.
    Therefore, they need to have an effective cybersecurity policy manual and incident
    response plan in place. However, it has been found that many are substantially
    underprepared to handle cyber threats. Additionally, studies show that many CEOs
    are not even fully aware of the International Organization for Standardization
    (ISO) policies and standards that pertain to their organizations and are crucial
    for effective IT governance [11].


    # 11.2 Shocking Statistics of Cybercrime


    Business organizations are being exposed to more threats than ever and the data
    shows that cybercrimes are continuing to intensify. The 2016 Internet Crime Report
    [8] produced by the United States Federal Bureau of Investigation presents valuable
    information for organizations and cybersecurity professionals. Additionally, the
    2016 Global Economic Crime Survey prepared by PricewaterhouseCoopers [3] highlights
    the fundamentally flawed incident response plans the majority of business organizations
    currently have in place.


    # 11.2.1 Role of the Internet Crime Complaint Center


    Internet crime is unlike any other type of crime and presents unique challenges
    that are difficult to detect and deter. Therefore, the Internet Crime Complaint
    Center (IC3), a multi-agency task force, was developed. It includes members from
    the Federal Bureau of Investigation (FBI), the National White Collar Crime Center
    (NW3C), and the Bureau of Justice Assistance (BJA). The IC3’s role in helping
    to prevent Internet crime is best described as an intricate puzzle. Each piece
    is intended to fit together to effectively address the serious risk cybercrime
    poses to global organizations [8]. The nine pieces of the puzzle are:


    +   1. Detection: evidence of fraud, presence of fraud, attempt of fraud.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '+   2. Complaint: statement of distress filed by either actual victim or third
    party.

    +   3. Mitigation: effort to stop fraud, reduce losses, and attempt recovery.

    +   4. Liaison: collaboration with all levels of Law Enforcement.

    +   5. Analysis: data that has been assessed or is available for assessment.

    +   6. Deterrence: action or events to prevent fraud through instilling fear of
    consequences.

    +   7. Investigation: gathering of information and conducting interviews to obtain
    evidence.

    +   8. Prosecution: legal action brought against the perpetrator.

    +   9. Prevention: measures to stop fraud from occurring.


    In 2016, there were nearly 300,000 complaints received that included over $1.33
    billion in losses [8]. Comparing these figures to those from the 2015 report [8],
    these figures have increased by approximately five-percent from just the previous
    year. Additionally, the IC3’s Public Value Graph (see Figure 11.1) illustrates
    that losses in monetary amounts were under $1 billion just seven years ago in
    2010, and now have surpassed that mark. The bar graph shows the total number of
    complaints and overall victim losses for the years 2010 to 2016.


    ![](img/57d9c6707468cbe6ea69c555dd9498fc_179_0.png)


    Figure 11.1 Internet Crime Complaint Center( IC3) public value of overall statistics
    2016.


    Subsequent sections of the IC3 report more specifically pertain to the purpose
    of this study, as they present the figures in terms of the various cybercrime
    types. In 2016, there were nearly 3,500 reports of a corporate data breach, almost
    20,000 phishing scheme reports, and approximately 2,000 issues regarding currency
    exchange [8]. In comparison, there were almost 1,000 more corporate data breach
    reports in 2016 than in 2015 [8]. These numbers corroborate the findings that
    cybercrime is continuing to escalate.'
