- pgno: 243
  md: '# 15.1 Introduction


    Recent years have have seen a rise in the use of electronic equipment, such as
    sensors, for developing digital healthcare solutions. Nowadays, healthcare applications
    are not limited to digital record keeping of various clinical data generated from
    patients, doctors, etc. Current healthcare applications focus on telemonitoring
    patients, tracking their mobility, and giving early notifications to doctors and
    relatives in case of critical situations. This is possible due to the emergence
    of Internet of Things (IoT) devices and the use of embedded sensors in a patient’s
    body. The general architecture of the healthcare monitoring system is depicted
    in Figure 15.1. Reliable communication, handling and mobility, latency control
    and energy-efficient routing are some of the issues which need to be addressed.
    Due to the digital transformation, there has been a staggering quantity of unstructured
    data like video and images generated in the healthcare field. The healthcare field
    has produced a virtual and connected world of clinical devices which continuously
    send out unstructured, and potentially unsecured data, which is vulnerable to
    attack. These data need to be transmitted in a channel, which may not also be
    secured. But, the physiological data of an individual contain highly personal
    and sensitive information. So, security is a predominant need of healthcare applications,
    especially if the solutions use IoT devices equipped with sensors or body area
    networks.


    ![](img/57d9c6707468cbe6ea69c555dd9498fc_243_0.png)


    Figure 15.1 General architecture of healthcare monitoring systems.


    But, when the healthcare solutions are deployed in cloud and fog environment,
    the security concerns are doubled due to the following reasons:'
  merge: -1
  img_proc: true
- pgno: 244
  md: '+   - Fog and Cloud are deployed on top of the traditional network computing
    so they are vulnerable to all kinds of security threats suffered by traditional
    networks.

    +   - Personal human health-related data are captured from ubiquitous wearable
    sensors deployed in IoT devices, which are highly scalable and dynamic in nature.

    +   - In most of the cases the communication medium through which the data transmits
    is wireless and lacks security.

    +   - The captured data from an IP-enabled user device transmitted to the desired
    site may be routed through an unsecured network infrastructure [46].


    # 15.2 Security Needs of Healthcare Sector


    Security and privacy in healthcare solutions is of prime concern, especially when
    it is deployed in a virtual computing environment. In these cases, authentication
    and authorization of both users and service providers must be ensured [1]. So,
    in order to have a secure and foolproof cloud-baed healthcare system, the desirable
    characteristics must include the following security requirements:


    # 15.2.1 Data Integrity


    Data integrity is required to ensure that the patient data transmitted to the
    service provider is not changed by any means during the transition. In the fog-based
    healthcare system, most of the communication is wireless. So, there is a risk
    of integrity loss during transmission. The data integrity can be maintained by
    adding a cyclic redundancy check (CRC) to the data packets which can detect erroneous
    packets. Otherwise, message authentication code (MAC) protocols are also used
    to maintain data integrity [2].


    # 15.2.2 Data Confidentiality


    All the relevant health-related sensitive data and personal information are transmitted
    over a communication network between the user and service provider. To preserve
    the data in their original form and to prevent them from leakage and middleman
    attack, the confidentiality of the data is required to be preserved. This could
    be possible by imposing strong encryption and decryption mechanisms. By the use
    of encryption and decryption mechanisms, the eavesdropping can be controlled and
    no middleman can get the access to the data.


    # 15.2.3 Authentication and Authorization


    Authentication and authorization are required to validate the identity of the
    sender and receiver of the health data packets. Any unauthorized access to private
    medical information can spoil the entire mechanism. Unauthorized access to private
    data may cause the injection of some invalid spurious data which may damage the
    system. This can be avoided by using MAC protocols.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# 15.2.4 Availability


    Availability ensures that the health services enabled through the fog-based system
    are uninterruptedly available to the authorized users as and when required. There
    may be a chance that the data and service will be unavailable at the time of need
    due to denial-of-service (DoS) attacks. DoS attacks can consume network bandwidth,
    kill response time, causes network traffic congestion. Availability can be defined
    by the policies and principles of a system and resources to be accessible, usable
    and available when there is a demand by one legitimate users [3, 4] anytime and
    anywhere in the healthcare system. Ensuring availability prevents service disruptions
    caused by hardware failures, power failure, maintenance work and system upgradation.


    # 15.2.5 Access Control


    This is the capacity to provide controlled access to various resources by authorized
    users [5]. It involves three different security and privacy requirements: identification,
    authentication, and authorization. Identification is all about how to identify
    users. Though it is not a clear goal of security, it can be used to influence
    the manner in which a user is authenticated. Authentication, in turn, gives a
    surety that the requested data access is genuine. It also provides a surety that
    the communication is happening with an authorized party on the other side. Eventually,
    the authorization process decides which portion of data can be restricted to an
    outside requester based on some security policy. It is to be noted that an appropriate
    access control mechanism could ensure secure patient privacy and also could offer
    a good balance between availability and confidentiality [6, 7] types of security
    goals.


    # 15.2.6 Dependability


    Dependability guarantees easy recovery and retrieval of medical data at any time,
    irrespective of the presence of some threats caused by the network dynamic or
    failure node [8, 9]. Normally, in most medical cases, inability to retrieve accurate
    data is due to threats caused by the network dynamics, which can threaten the
    patient’s life. Fault tolerance is an essential requisite for dependability.


    # 15.2.7 Flexibility


    Flexibility enables an unauthorized participant who is not on the permission list
    to access specific data in an emergency case to save the patient’s life. Inability
    or prevention the access rules may threaten a patients life [10].


    # 15.3 Solutions to Probable Attacks in e-Healthcare


    There are several points in fog environment where patient health-related information
    containing confidential data can be compromised; for example, by exploiting any
    system and application vulnerability, unauthorized third-party data access from
    a data store or during data transmission, malicious insider threat and when the
    data is shared among some other systems [11]. The data capturing sensors are continuously
    forwarding data to cloud environment via wired or wireless connection mediums.
    So, there is a high risk of compromising data privacy, data integrity, and system
    availability. The reason behind this is that'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'any point, the sensors and capturing devices can be exploited along with the
    underlying communication network and the data can be forged. The IoT environment
    usually works in open, unattended and hostile environments. This ease-of-access
    to data can lead to increase the chances of attacks like DoS, Masquerade, and
    selective forwarding attacks [12]. In addition, if the fog node manages sensitive
    data and is lacking in better access control mechanisms, it might suffer from
    information leakage due to account hijacking, unauthorized access, and other vulnerable
    points of entry [13]. The attacks in the healthcare system can be broadly categorized
    into three types, which are depicted in Figure 15.2.


    ![](img/57d9c6707468cbe6ea69c555dd9498fc_246_0.png)


    **Figure 15.2**  Categorization of attacks in healthcare system.


    # 15.3.1  Jamming Attack


    In a jamming attack, the antagonist tampers with the content of the original message
    by transporting radio frequency signals inside the network or by blocking the
    message and, as a result, it cannot reach the intended receiver. Radio interference
    attacks are very difficult to be addressed by conventional security methods. An
    attacker can cause the attack simply by disregarding the medium access protocol
    and continually sending on a wireless network. A jamming attack can happen in
    two ways. Either it could be an external threat model in which jammer is not part
    of network; or it could be an internal threat model in which jammer belongs to
    the underlying network. A jamming attack may happen in healthcare applications
    by interference of the attacker’s radio signal with frequencies of the BAN (body
    area networks) [14].


    # 15.3.2  Data Collision Attack


    A data collision attack takes place when two or more nodes attempt to transmit
    simultaneously. It is a form of jamming attack where an intruder may strategically
    produce extra collisions by sending repeated messages on the channel [15, 16].
    When the frame header is changed due to a collision, the error checking mechanism
    at the receiving end detects an error and rejects the received data. Thus, a change
    in the data frame header is a threat to data availability in the BAN [17].


    # 15.3.3  Desynchronization Attack


    In this type of attack, the attacker tampers with the message transmitted between
    sensor nodes by copying it many times by imposing a fake sequence number to one
    or both endpoints in an active connection; which leads to WBAN (wireless body
    area networks) overwhelming the network resources and energy, thereby causing
    the sensor nodes to transfer the message repeatedly [15, 18].'
