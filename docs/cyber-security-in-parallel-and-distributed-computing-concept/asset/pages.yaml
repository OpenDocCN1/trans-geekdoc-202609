  md: '# 3.1 Introduction to e-Business


    As the engineering for information and communication technology (ICT) develops,
    the requirement of more sophisticated business environment is needed. The revolution
    in traditional business methods has resulted in e-business. Traditional business
    is concerned with buying and selling of goods by direct mode only, but later on,
    the labor and effort involved in the customer going to the shop was increasingly
    no longer required, simultaneously enhancing the business process. e-Business
    is the process of buying or selling goods and services electronically. The clients
    no longer need to go to the shop to purchase items physically, rather they can
    browse many items from different shops worldwide using their fingertips. There
    are different types of markets like stock market, capital market, money market
    etc.; but all these markets have some similarities in their business process,
    as they have some sellers and some buyers.


    Most of the e-business is carried out via internet nowadays. e-Business is a more
    generic term as compared to e-commerce. It refers not only to information exchanges
    related to buying and selling but also to servicing customers; and collaborating
    with business partners, distributors and suppliers [4]. e-Business can have different
    subcategories such as e-learning, e-commerce, e-banking, e-governance. e-Business
    encompasses sophisticated business-to-business interactions and collaboration
    activities at a level of enterprise applications and business processes. e-Business
    processes are integrated end-to-end across the company with key partners, suppliers
    and customers and can respond with flexibility and speed to customer demands and
    market opportunities.


    # 3.1.1 Benefits of e-Business


    Sometimes the user wants a product which is at some far distance apart. Consider,
    for example, a consumer and product which are in different countries. In this
    case, the user has to go abroad to purchase the particular product, which is a
    time-consuming job, which also requires a lot of money and a lot of strength.
    This problem is resolved by e-business. The major benefits of e-business are:


    +   1. Maintaining the consumer data is easier. This data can be used to enhance
    the business process by using data mining.

    +   2. Shopping malls can use consumer demands and habits, to rearrange the products
    inside the shopping mall by using association mining technique.

    +   3. Globalization of goods and services is possible. The user can get the goods
    or services across the world apart from the location.

    +   4. Time is saved compared to visiting shops door to door, and simultaneously
    surfing for the product and service is possible from various parts of the globe.

    +   5. Users can compare prices for the same product from various locations at
    the same time.

    +   6. Users have more options when choosing a product or service. In traditional
    business the user has a limited choice of some hundred to thousand products; but
    in the e-business system, user can choose among some thousands to millions products
    worldwide. This is known as "surf more, choose one."'
  merge: -1
  img_proc: true
