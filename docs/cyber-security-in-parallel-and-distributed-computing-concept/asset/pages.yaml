    # Abstract


    This chapter includes various types of models operating in the e-commerce/e-business
    domains in India. In addition, the chapter also presents the mapping of e-wallets
    and its features. It is observed that the features such as digital only, text
    based etc are common to all types of wallets and the features like one touch,
    CoF etc are specific to open wallets only. This chapter tries to give a brief
    insight of the various technological, operational, legal and also security features
    available in different types of e-Wallets. It can also be concluded from the paper
    that all the three wallets have the same security features which includes: Anti-fraud,
    3D SET or SSL, P2P, data encryption and one-time password (OTP).


    **Keywords**: e-Commerce, e-Wallets, OTP, security'
