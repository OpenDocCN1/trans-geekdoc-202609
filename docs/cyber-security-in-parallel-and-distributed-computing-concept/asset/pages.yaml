  md: '# 16.1 Introduction


    # 16.1.1 e-Wallet


    E-wallet can be defined as a type of electronic card which can be used for transactions
    made online through a computer or a Smartphone. It can also be said that its utility
    is same as that of a credit or debit card. An E-wallet must be linked with the
    individual’s bank account for the purpose of making payments [59].


    The mobile wallet, which can also be called as m-Wallet, digital wallet, or e-Wallet,
    defines a mobile technology which can be used similarly to a real wallet. The
    Mobile Wallet also provides a very convenient solution for any business which
    is looking forward to allow its customers to purchase their products online with
    greater ease, therefore driving sales [60].


    A mobile wallet is a technique to carry your credit card or debit card information
    in a digital form on our mobile device. Instead of using our physical plastic
    card to make the required purchases, we can also pay with our Smartphone’s, tablets,
    or smart watch. Heres an overview of the various benefits of the mobile wallets
    and also how mobile wallet services generally work [61].


    A mobile wallet is a replica of a type of physical wallet. Customers can add credit
    and debit cards, as well as prepaid cards, gift cards and rewards cards. Mobile
    wallet’s also allow users to store and carry an endless amount of cards in their
    phone. This use case not only replaces the physical plastic of cards, but allows
    those cards to be enhanced by value added services [62].


    As reported in the literature CY 2016 (Annual) Edition the year growth of e-wallets
    from the Year 2013 to 2015 is 332% i.e. from $0.2 Billion to $2.6 Billion and
    the growth from the year 2015 to 2016 is 123% i.e. $2.6 Billion to $5.8 Billion.
    The e-wallet is one of the most popular instrument in India having approximately
    $9 Billion mobile wallet transactions in April, 2017 versus 1 billion 2 years
    ago6 .Morgan Stanley estimates that Indias addressable digital consumer payment
    market to be worth $350-400 billion in 2017 which is however lower than a year
    ago [6].


    Out of the many technological advancement or innovations e-wallets based SSL (Secure
    Socket Layer) and SET (Secure Electronic Transaction) for security of Online Systems
    [5]. The various other technologies include NFC (Near Field Communication), Bluetooth,
    QR Codes, Mobile Web payments, Bluetooth and even Biometrics [7], anti-fraud and
