    \ from specific cyberattacks.\n+   \n+   4. **Prepare for contingencies:** The\
    \ idea of contingency planning is basically preparedness for cyberattacks. It\
    \ may contain policies, best practices, procedures and recovery plans.\n+   \n\
    +   5. **Allocation of information:** The information that is supposed to be circulated\
    \ in the entire system must be effective. Cyber threats, vulnerabilities and incidents\
    \ could be reported by issuing alerts. The information may be successfully distributed\
    \ among several platforms.\n+   \n+   6. **Specialized security training:** The\
    \ workforce must be equipped with specialized security training. The information\
    \ and services must be provided to the joint federal partners so that the workforce\
    \ is strong enough during cyber incidents.\n+   \n+   7. **Strengthen system fault\
    \ tolerance:** Fault tolerance of a system may be computed by performing vulnerability\
    \ assessment. High-assurance systems may possibly withstand cyberattacks.\n+ \
    \  \n+   8. **Reduce vulnerabilities:** Several security practices assist in reducing\
    \ vulnerabilities. Patching, use of firewalls and using strong passwords can prevent\
    \ malicious access to the systems.\n+   \n+   9. **Improve usability:** The term\
