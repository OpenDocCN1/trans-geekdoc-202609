- pgno: 183
  md: 'and externally, have value. These need to be protected, just like every other
    asset at the organization [11]. In the survey conducted by PwC, it was found that
    40 percent of CEOs are not worried about cybersecurity, and do not even consider
    security standards in these areas [3]. When it comes to the cybersecurity of an
    organization, there is no such thing as being over-prepared.


    # 11.3.1 Classification of Cybersecurity at an Organization


    It is helpful to consider the three-levels of security classification regarding
    the evaluation and monitoring of a system. There are levels A, B and C, of security
    evaluations. These levels are identified by their security as follows:


    +   - A: System that is mathematically proven to be secure.

    +   - B: System that has been evaluated for secure policies against best practices.

    +   - C: System that has not been evaluated.


    It is inexcusable for any company or organization in today’s society to fall under
    a C classification with all the information available regarding the seriousness
    of cybercrime [5].


    # 11.3.2 Pyramid of Cybersecurity


    Cybersecurity can be represented as a pyramid illustrating the persistent problems
    with IT security, data protection and the complexity of the industry. See Figure
    11.2 showing the IT and non-IT environment. At the base of pyramid are the Three
    Laws of Information and Communication Technology (ICT) Security, the middle sections
    are Testing source code and creating a Reliable login, and at the top is Critical
    Data.


    ![](img/57d9c6707468cbe6ea69c555dd9498fc_183_0.png)


    Figure 11.2 Pyramid of cybersecurity 2017.


    The Three Laws of Cybersecurity set rules to prevent editing files by a virus
    or hackers. The Three Laws of Cybersecurity, are [13]:


    +   1. The checksum of the file on the user’s device must always be the same as
    the checksum of the same file by the author SW,'
