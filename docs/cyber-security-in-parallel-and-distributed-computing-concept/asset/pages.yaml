- pgno: 137
  md: '# 7.4.2.2 Forensics


    Forensics plays a very important role in covering many investigations. Internet
    security teams are regularly asked at some point in an investigation what took
    place, when it occurred and/or whether it should have taken place or not. Log
    files are very vital with respect to carrying out a forensics inquiry without
    which the inquiry usually results in failure.


    Therefore, SLAs with respect to forensics can consist of:


    +   - Duration of time held on to before being overwritten.

    +   - Proxy logs, firewall logs, server logs, syslogs, DHCP logs, and client logs.

    +   - Setting the threshold required to move the logs to any central logging server,
    portable media, offsite information storage, etc.


    # 7.4.2.3 Managing Records/Documents


    More often than not, an efficient IT firm will usually be associated with a properly
    managed information protection plan. In addition to this, the Internet technology
    groups should have the suitable abilities, good records of internet technology
    processes, gears and assets, which must be kept up-to-date for a suitable execution
    of an Internet security agenda. A well-documented network topology is essential
    while conducting risk evaluations, network scanning or responding to possibilities
    or analytical requirements, etc. Service Level Agreement related to network topology
    may address points like updating the network topology on a monthly basis by respective
    Internet technology groups.


    Points that may be kept in mind while preparing SLAs related to document management
    are:


    +   - Alterations in settings

    +   - Modifications in network infrastructure

    +   - Alterations in API

    +   - System failure logs and relevant crisis resolution

    +   - Rate of recurrence of records assessment

    +   - Thorough task explanation

    +   - Accountable persons for every file on paper service and preservation contracts


    # 7.4.2.4 Backing Up Data


    The basis of any strong Internet security program is data backup. Data backups
    allow an organization to recover its data either fully or from some recognized
    baseline or checkpoints in case of some unpleasant occurrence. Some fundamental
    issues that need to be considered when preparing a SLA include:


    +   - Theoretical support records.

    +   - Substantiation of the information on support for soundness.

    +   - Credentials of which server or application are backed-up and the specific
    program.

    +   - Validation of reinstatement by a planned test on a regular basis.

    +   - Label of an offsite storage place and the pickup and/or dropoff schedule.'
