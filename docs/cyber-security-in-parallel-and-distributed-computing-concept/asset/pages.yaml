- pgno: 208
  md: 'to links of such products, to unknowingly subscribe the expensive subscriptions
    of these services or in worst case, to surrender their sensitive data, such as
    financial details, etc., to the criminals. For a user with fair experience of
    desktop computing and email communication, figuring out a malicious email from
    its awkward language, misspelt words or poor graphics is not a very tough task.
    In most cases, the users simply delete such spam emails without even opening them.
    But the same is not the case with mobile fraud [8, 9]. A reason for this is that
    because till now, mobile fraud is less widespread as compared to junk email. SMS
    messages also have much higher delivery and open rates relative to emails. Besides
    this, a single and comprehensive SMS spam filtering mechanism is far from evolving.
    In this section, we will discuss various mobile-based frauds.


    # Missed Call Scams


    Generally, every mobile phone user receives missed calls on their device. But
    in the case of a missed call scam, a missed call may be of a very short duration
    from an unknown number usually from a foreign location. As the targeted victim
    is unable to recognize the calling number, they simply call back. This call from
    victim’s device may get redirected to a premium rate service, costing them an
    unexpected money charge or even more.


    ![](img/57d9c6707468cbe6ea69c555dd9498fc_208_0.png)


    Figure 12.4 Types of mobile frauds.


    # Recorded Message Scam


    In this format of mobile fraud, the user is prompted by a recorded message played
    on a phone call to call back on another number telling him that he has won a prize,
    and must call on the next number to claim it. But the next provided number may
    be the premium rate service number, as discusses in the missed call scam section,
    resulting in the user incurring a hefty call charge. In addition to this, the
    above-mentioned prize may also be another fraudulent ringtone or caller tune subscription
    service, causing further loss to the victim.


    # Text Message Scams


    The user receives an SMS text message from an unknown sender containing a very
    friendly language, like “Hey, it’s Mike. I’m back New Jersey! When can we catch
    up and hang out?” Assuming such message to be from the wrong sender, the user
    naively calls back on the number, just to confirm that it’s a wrong number. But
    in the case of a text message scam, the victim again is charged with a hefty premium
    rate for the call or a high rate lengthy SMS exchange similar to above formats
    of mobile fraud.


    # Ringtone Scams


    Ringtone scams prompt the target mobile user with an offer to download or subscribe
    to a very cheap or even free ringtone. On accepting such offer, the victim user
    mistakenly subscribes to another costly fraudulent service that keeps on sending
    more ringtones and continues charging high premium rates for them. A basic difference
    among such fraudsters and legitimate ringtone selling companies is that, unlike
    genuine ringtone'
