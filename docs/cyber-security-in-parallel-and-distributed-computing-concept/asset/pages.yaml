- pgno: 114
  md: '# 6.4 Types of Blockchains


    In the previous sections, we have taken a look at the “permissioned” and “permissionless”
    blockchains. However, there is another way to classify blockchains. This classification
    is done on the basis of blockchain networks. Blockchains have been known to be
    of three types, which are defined as follows:


    +   1. Public Blockchains: These blockchains are open and transparent, implying
    that anyone can read, write or audit these. They can be reviewed by anyone at
    any given point of time. The decentralized consensus mechanism is responsible
    for decision-making since no one is in charge. The proof of work (POW) and proof
    of stake (POS) are taken into account when making decisions. These have no access
    restrictions and anyone can participate in transactions and validations. Some
    common public blockchains are Ethereum and Bitcoin [4].

    +   2. Private Blockchains: These blockchains are confined to an individual or
    organization. An authority is responsible for read-write operations. This authority
    is also responsible for selectively giving read-write access to users. The mining
    rights may also be given selectively, thus making it similar to a centralized
    system, although it is cryptographically secured and also cost-effective. In this
    blockchain, not everyone can read, write, audit or make transactions. They are
    permissioned blockchains. A bankchain is a typical example of a private blockchain.

    +   3. Consortium or Federated Blockchains: These blockchains have one or more
    in charges for decision-making. They are semi-permissioned and are represented
    by a group of companies or individuals. This leads to faster transactions and
    offers multiple points of failure, thereby preserving data. The members are responsible
    for making transactions/decisions. They can read, write, audit and mine data.
    Common examples of consortium blockchains are R3 and EWF (Energy Web Foundation).


    # 6.5 The Architecture of Blockchain Technology


    The single version of truth provided by blockchain makes use of digitally signed
    blocks and algorithms to carry out quick and real-time transactions and documentations,
    which are further encrypted. The idea was proposed by Satoshi Nakamoto, who wanted
    to create a cryptocurrency (Bitcoin) that does not rely on centralized architecture
    and intermediaries. Blockchains incorporate blocks which are based on pointers
    that connect data from previous blocks. These blocks may not be altered easily,
    thereby ensuring security. New block validations also rely on consensus algorithms.


    The end-to-end transaction of blockchain follows certain mechanism. In this section
    we will take a look at the architecture of blockchain technology responsible for
    its functioning. The blockchain technology architecture is based on the following
    components [9]:


    +   1. Blockchain Platform: The blockchain may be defined as an application that
    runs on a distributed network. It is a decentralized transaction system which
    is transparent in the sense that any node handling a blockchain software is capable
    of handling the entire blockchain. The corresponding data is stored in either
    a flat file or a relational database. Google’s LevelDB is accountable for storing
    metadata. The installed application gets synced from server to nodes. The servers
    encompass transaction records'
