    security. This attack represents the interception of data by ensnaring the network
    traffic by employing a sniffer.

    +     - The term sniffer refers to an application aimed at capturing the network
    packets.

    +     - Whenever, the data are transferred across the network, if the packets
    of the data are not at all encrypted, a sniffer is employed at that time to read
    the data packets.

    +     - The attacker can analyze the network and gain information to eventually
    cause the concerned network to become corrupted.

    +     - Otherwise, it can read the communications prevailing throughout the network.

    +   - Spoofing

    +     - Spoofing refers to the process of impersonating the machine that is authorized
    in the information interchange with the victim.

    +     - The frequent spoofing example is IP spoofing. Basically, IP spoofing is
    a technique that is aimed at gaining access to the machines in which an attacker
    impersonates any other machining by manipulating the IP packets.

    +     - It involves modifying the packet header with a forged or spoofed IP address,
    checksum as well as other values.

    +   - Smurfing

    +     - Smurfing is defined as the process of getting access to a secret account
    that is different from the main document under consideration such that an user
    can do anything without being detected by anyone.

    +     - Smurfing is the phenomenon of impersonating any sort of victim in communication
    with remaining machines.

    +   - Landing

    +     - It is defined as the phenomenon of defrauding the victim while in communication
    with them.

    +     - Various attacks on machines and processes come under such type of attacks.

    +   - Information Theft

    +     - This involves the process of taking over the necessary information from
    various machines.

    +     - In recent years there has been a huge amount of information concerning
    thefts, such as credit card number theft, ATM spoofing, electronic cash theft,
    database theft, etc.

    +   - Denial-of-Service (DoS)

