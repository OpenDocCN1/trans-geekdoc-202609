    # 5.2.1 Petya


    One of the family members of encrypting ransomware is Petya. The malware was discovered
    in March 2016. Petya infects the master boot record (MBR) of Windows-based systems.
    The propagation is via email attachments to victims. Once Petya corrupts the MBR,
    it prompts a restart of the system. Upon restart, the corrupted boot sector encrypts
    the Master File Table of the computer. Petya then bids for a fine amount that
    must be paid as bitcoins to get back the old state of the system (Figure 5.2 shows
    a screenshot of the ransom note left on an infected system). Several patches came
    from Microsoft for the victims’ sake. But the overfitting, makes the next worm
    version cleverer. The new version of Petya, named NotPetya [8] by Kaspersky, pretended
    to be a Ukraine tax software update and infected thousands of systems throughout
    around 100 countries. Pharmaceutical giant Merck paid a ransom of $300 million
    to NotPetya for its information.


    ![](img/57d9c6707468cbe6ea69c555dd9498fc_102_0.png)


    Figure 5.2 Petya ransomware.


    # 5.2.2 WannaCry


    Undisputably, the most devastating attack in history, which infected several thousand
    banking, law and government agencies, was perpetrated by WannaCry ransomware in
    May 2017 [8, 9]. The attack exploited a vulnerability in Microsoft’s implementation
    of the Server Message Block (SMB) protocol. The SMB, which is responsible for
    authentic interprocess communications and message transfer, was developed by the
    U.S. National Security Agency. The loopholes in the protocol were released as
    EternalBlue by some brokers. This led to the implementation of WannaCry (WannaCrypt).
    Once WannaCry reaches a computer, it searches for the kill switch if not found.
    This option is used to shut down the computer immediately, if it is not possible
    to do so in the usual way. Then it encrypts the computer in its usual fashion,
    as was done in Petya.


    WannaCry also attempts to exploit the SMB vulnerability to spread to random systems
    on the internet. The modern versions, instead of encrypting computers as a whole,
    encrypt dedicated files and then demand bitcoins for a decryption key. The demand
    proposed is $300 in bitcoins within 3 days or $600 in bitcoins within 7 days.
    A screenshot of the ransom note left on an infected system is shown in Figure
    5.3.'
