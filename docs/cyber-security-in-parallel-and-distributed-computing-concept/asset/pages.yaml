    # 15.3.6 Denial-of-Service (DoS) Attack


    A fog platform is highly vulnerable and more prone to DoS attack [26]. The FC
    (fog computing) platform runs in a distributed environment, where the data centers
    work in a cooperative way. So it is very difficult to identify the roots of the
    attack. To protect against DoS attack, network monitoring is often done. Intrusion
    detection systems (IDS) are used to guard network behavior and to monitor access
    control policies [27].


    DoS attacks on a Fog platform, either from end-users or external systems, can
    prevent legitimate service use as the network becomes saturated. In addition,
    all communication is wireless and hence susceptible to impersonation, message
    replay, and message distortion issues. Protection from these attacks is significant
    as human life is involved. The most common way of eliminating such issues is by
    implementing strong authentication, encrypted communication, key management service,
    perform regular auditing, and implement private network and secure routing [41].
    Figure 15.4 presents a snapshot of a DoS attack.'
