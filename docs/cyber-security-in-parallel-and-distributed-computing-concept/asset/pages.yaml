    \ duplication [36], in spite of using secure encryption methods. They suggested\
    \ client-side and server-side deduplications based on a random threshold. But\
    \ the feasibility of using this in a FC platform is yet to be tested. So a proper\
    \ lightweight network monitoring system is required to avoid these attacks in\
    \ a hostile environment like fog [37].\n\nFrom the above discussion the noticeable\
    \ key points which can be drawn regarding security requirement in healthcare security\
    \ protocols can be summarized as follows:\n\n+   (i) Fog/Cloud nodes have limited\
