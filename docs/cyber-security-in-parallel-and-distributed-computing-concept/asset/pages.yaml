- pgno: 186
  md: 'One of the unique values of the Delphi method is that it facilitates a dialog
    that shares knowledge and considerations among participants as they work toward
    a collaborative response to the questions. The net result of this is that that
    in the majority of uses of the Delphi method, the group’s results are better than
    that of most participants. Therefore, it is believed that as knowledge engineering
    systems evolve which are used in global collaborative projects, the Delphi style
    survey will play an important part of working towards consensus. It is used in
    this Cybersecurity Pilot Study to collect and analyze the opinions of cybersecurity
    experts using a survey interspersed with feedback.


    # 11.5.2 Design of the Study


    The design of this study is based on deductive reasoning. A deductive approach
    is applied, which means that a hypothesis was developed from an existing proposition
    and then a research strategy was designed to test the hypothesis. Information
    is collected from cybersecurity experts regarding the following hypothesis:


    H1: Use of Blockchain applications will help to strengthen cybersecurity and protect
    organizations against cyberattacks.


    The target population of this research is comprised of cybersecurity experts,
    which is defined as individuals who work(ed) in cybersecurity or a related IT
    field for a minimum of three years. This information was part of the Screening
    Questions, as listed in Expert Respondent Sufficiency & Qualifications [16]. The
    sample consists of professionals that work in the industry with jobs relating
    to cybersecurity policy initiatives, and developing technologies available to
    protect organizations from cyber threats. Ten potential respondents recruited
    from networking events, university connections and LinkedIn were approached via
    a carefully crafted email (see [16] for the survey invitation). At the end of
    the invitation, participants who wished to have the results of the pilot study
    shared with them had the option to provide an email address. Prior to participating
    in the Online Cybersecurity Survey, the eight respondents were ensured of their
    complete anonymity.


    # 11.5.3 Selection of the Delphi Method


    The original Delphi method was developed by Norman Dalkey of the RAND Corporation
    in the 1950s for a U.S. sponsored military project. The method entails a group
    of experts who anonymously reply to surveys and subsequently receive feedback
    in the form of a statistical representation of the “group response,” after which
    the process repeats itself [17]. The goal for this pilot study is to reduce the
    range of responses and arrive at something closer to expert consensus. It was
    chosen as an effective methodology for this query of experts and stakeholders
    because of the following reasons:


    +   1. The complexity of the cybersecurity industry requires knowledge from individuals
    who understand the different economic, social and political implications.

    +   2. It does not require the experts to be present physically, which would have
    been impractical for this study.

    +   3. The Delphi method size requirements are modest. The method can be utilized
    with as few as two respondents [14].


    The sample size of this study contained eight expert respondents. Within the scope
    and time limitations of this pilot study, this sample size was considered commendable.
    It is'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'important to bear in mind that this is a pilot study; the aim is to test the
    format and provide the feasibility for a much larger version.


    # 11.5.4 Procedure of Utilization of the Delphi Method


    The procedure undertaken by the researcher involves three general steps:


    +   1. Brainstorming of related questions.

    +   2. Distributing a series of quantitative and qualitative questions to qualified
    experts.

    +   3. Narrowing in on the scope and quality of the responses by means of second
    round open-ended questions.


    The Delphi survey was created using the Google Forms online survey application
    that is directly accessible via a one-click link shared by email. This has the
    added benefit that the data is directly collected and stored in digital format,
    thus saving the researcher time and resources. Furthermore, it reduces the chance
    of transcription errors that are common to collecting data with the traditional
    pen and paper format. Another added benefit of this delivery method is that the
    respondents were free to use whichever response platform was most convenient,
    such as laptop, IPad/tablet or smartphone, thus reducing obstacles in answering
    the survey. And finally, another advantage of this is that it speeds up the turnaround
    time between iterations of the Delphi Method. This is an important success factor
    in terms of scalability of this study, i.e., so that the study can be performed
    with a larger number of respondents in the future.


    In terms of this pilot study, the purpose of the first round is to gain a basic
    understanding of the respondents’ perceptions of cybersecurity practices at organizations
    through multiple quantitative and qualitative survey questions. In the second
    round, each Delphi participant receives another series of open-ended questions
    to respond to and is asked to review the key findings summarized by the researcher
    based on the information provided in the first round. After this is completed,
    a general inductive approach is taken by the researcher. The objectives are to
    establish a link between the research proposition and the findings provided by
    the respondents, and to condense the qualitative data into a brief summary format.
    In response to this challenge, the researcher categorizes and codes the qualitative
    data to hopefully achieve the desired level of consensus. It is important to note
    that theoretically the Delphi process can be continuously iterated when it is
    determined that additional iterations beyond three are needed or valuable, given
    more time and resources. For this study, three rounds was considered sufficient
    for a pilot, as proof-of concept, given the time limitations. The specific information
    pertaining to each round is provided below.


    # 11.5.5 Delphi Activities (Iteration Rounds) of This Pilot Study


    +   1. **Round #1: Initial collection.** The first survey is distributed on the
    same day that the expert agrees to serve as a respondent to the survey. The survey
    contains a series of varying complexity level questions, each corresponding to
    the research proposition. The researcher requests permission to collect richer
    data by means of second round open-ended follow-up questions. After gaining approval,
    this leads to the second round of the Delphi Method.

    +   2. **Round #2: Richer data collection.** The Delphi study is flexible in its
    design, which allows for the second round of follow-up questions in this study.
    The goal is to understand the importance and narrow in on the scope of the responses
    based on the'
