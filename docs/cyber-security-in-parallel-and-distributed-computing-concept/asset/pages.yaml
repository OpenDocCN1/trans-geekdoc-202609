  md: '+   - **Supply Chain Management:** The supply chain management (SCM) workflow
    consists of a number of services ranging from manufacturing, storage, production,
    etc., to delivery and consumption. It involves multiple writers and the data that
    must be stored is huge. When a product moves from one hand to another, the transactions
    will be recorded, thereby reducing time delays and eliminating human error. Orders,
    receipts, shipment notifications, etc., could be tracked down easily. Physical
    goods could be linked to serial numbers, barcodes, digital tags, etc. Moreover,
    information can be shared between vendors and suppliers.

    +   - **Interbank and International Financial Transactions:** Blockchain technology
    is being adopted by financial institutions for several reasons. Cross-border transactions
    become a lot more quicker and cheaper. Better trade accuracy along with shorter
    settlement process is the key to share trading. Smart contracts in the form of
    commercial transactions and agreements can be ensured. It strengthens identity
    management, which is required for banking. Since the transactions are transparent
    and traceable, it leads to better loyalty programs and rewards, thereby enhancing
    the overall performance.

    +   - **Decentralized Autonomous Organization (DAO):** A DAO relies on smart cards
    for functioning. There is no central management, although there are rules specified
    in the smart contracts, which define how the organization should behave. The organizations
    must be managed in a decentralized manner, hence creating the demand for permissionless
    blockchains. Sometimes, dedicated permissionless blockchains may also be required.
    These systems are usually built on top of an existing blockchain technology with
    its own currency.

    +   - **Land Registry:** The data pertaining to land registry may be moved to
    safe and transparent infrastructure secured using cryptographic protocols. South
    African startup by the name of ChromaWay is already working on the same [8].

    +   - **Proof of Ownership:** One of the most common case studies for blockchain
    technology is proof of ownership of intellectual property. A public blockchain
    at the time of stamping could be used to manifest ownership at a later time. The
    digital object along with the identity of the owner could be committed using a
    hash to provide sufficient evidence of ownership.

    +   - **e-Voting:** One of the most important public demands for e-voting is privacy,
    since votes must be anonymous to avoid any sort of intimidation. However, there
    must also be public verifiability, so as to preserve integrity of the votes. Since
    a lot of parties are involved in voting who do not trust each other, one of the
    reasonable solutions is the use of blockchain technology.


