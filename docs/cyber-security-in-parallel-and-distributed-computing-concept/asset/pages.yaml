    # 3.6 Conclusion


    Though e-business has the ability to digitize the payment and communication system,
    which is quite easy and speedy, it still has some flaws. Security must be maintained
    in the communication system as well as the standalone system. Precautions and
    safety measures need to be maintained in order to maintain security. Even though
    there is a lot of ongoing research to detect malware threats and mitigate vulnerabilities
    in the communication system, it is still considered to be an NP-hard problem.
    Data mining and machine learning methods have proven to be successful in handling
    the e-business system. But the business system is not still fully automated, but
    should be fully automated in the future.


