- pgno: 214
  md: '# 12.7.3  Against App-Based Attacks


    +   1. **Download from trusted application platforms only:** Try to always download
    a mobile application from trusted mobile app download platforms like “*Google
    Play Store*”^3 for Android device and “*iTunes*”^4 for Apple devices. Applications
    loaded on these platforms are thoroughly tested and confirmed for their behavior
    and security by the authorities to maintain the trust and repute of the hosting
    companies. Apps downloaded from unknown or untrusted platforms may carry malware
    or spyware that can risk the security of the user data and device [29].


    +   2. **Exhaustively examine the details of the app before downloading:** Ratings
    provided by users, history and reviews about the authors and update history of
    the app must be carefully examined before installation of any app even from the
    most trusted sources mentioned above. This check can save the user from any unexpected
    loss or damage due to the app, previously experienced by other users.


    +   3. **Check the app permissions before installation:** The user must cautiously
    read and then grant permissions to the new app for accessing the device data and
    services. This scrutiny is extremely important for any app to know its intended
    future behavior after installation on the device. Any unexpected demand for access
    permission like access to the camera for a gaming app must be reported accordingly.


    +   4. **Checking phone bill:** In cases of abnormal data exchange, sudden deprecated
    battery life or heating of the device, do check the bill incurred due to the device.
    The bill may project unexpected rises due to suspicious calling charges or unexpected
    text message exchanges.


    +   5. **Install security app:** The users must install a security application
    that scans the behavior of every app installed on the device. In case of any spyware
    or malware, the security app will alarm the user of the abnormal behavior of the
    app.


    # 12.7.4  Against Identity Theft and SIM Card Fraud


    To protect cell phone number, there are certainly some actions that the users
    can take to protect themselves from falling victim to cell phone number identity
    theft.


    +   1. **Staying vigilant:** The users must get in the habit of checking their
    bank and phone accounts frequently to make sure there’s no suspicious activity.
    Staying up-to-date with any attacks that have hit companies they shop with will
    make sure that they aren’t among the victims.


    +   2. **Utilizing the safeguards provided by companies:** The email based or
    one-time password (OTP)-based authentications can certainly be exploited by criminals.
    But their utter absence can expose the user against higher proximity of attacks.


    +   3. **Creating a PIN number for mobile phone accounts:** Creation of PIN for
    mobile services is an optional security process provided by the services providers.
    But a PIN-based access creates an extra layer of security for the user’s account
    by enforcing a 4 or 6 digit access restriction prior to performing any crucial
    account changes.'
