  md: 'mind the required security level. Authorization specifies the privileges or
    access rights of an individual for system resources. cybercrimes that involve
    masquerading or unauthorized access of data may be combatted using these techniques.


    # 1.5.3.5 Filtering


    The internet is full of malicious content ranging from websites to emails. Web
    filtering is important to prevent users from clicking into websites that contain
    malicious content or inadvertently enter their personal information. Phishing
    and spamming emails often have malware incorporated in them, which when downloaded
    can sabotage a system. Spam and email filtering can prevent such crimes.


    # 1.5.3.6 Best Practices


    In order to combat cybercrimes, certain best practices must be adopted. They ensure
    that crimes are not only detected but also prevent them to some extent. Some of
    the best practices are as follows:


    +   - Updating the current version of software. This process leads to elimination
    of bugs present in the code and performs the required patchwork.

    +   - Using antivirus blacklisting and malware based on signature detection technique.

    +   - Updating the password once every few months, but not very frequently. The
    idea is that an attacker may hack into a system, hash the password and perform
    a brute-force attack to gain access to the system and install a backdoor.

    +   - Not using the same password across multiple platforms. Many applications
    are connected these days. Using the same password can encourage a hacker to break
    into all the applications that share the same password and gain important information
    like banking details.

    +   - Using a virtual private network to ensure encrypted content.

    +   - Backing up your data can ensure that even if malware like ransomware is
    launched, the data is safe. However, it is important to ensure that the data is
    encrypted and protected.

    +   - Using the principle of least privileges allows every new account to have
    least privileges, which may be escalated as desired. The idea is to not allow
    too many privileged users to access data. It may not only lead to insider threats
    but also external threats in case the account of an employee is compromised externally.

    +   - Using multi-factor authentication based on using a combination of authentication
    techniques, which is difficult to crack and provides an additional layer of security.

    +   - Cybersecurity awareness about untrustworthy websites, social engineering,
    malicious links and spams.

    +   - Using passwords that contain uppercase, lowercase and special characters,
    which makes exhaustive search difficult.


    We have observed the diverse nature of cybercrimes. Hence, it is difficult to
    say which method could be prioritized over the other. To ensure security, collaboration
    of different techniques is encouraged. Security techniques along with best practices
    can ensure system security and detect potential threats.'
