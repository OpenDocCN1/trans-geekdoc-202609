    # 7.3.2 Message Integrity and Confidentiality


    Besides authentication, a safe medium must also pledge confidentiality and integrity.
    Information truthfulness states that there should be no modification in the message
    during transmission of the same from the sender to the recipient. Confidentiality
    ensures that messages reach the intended receiver and not to any eavesdropper.
    Message encryption helps us achieve confidentiality. Cryptography can be carried
    out by using a shared secret key with the recipient or by means of the public
    key of the recipient [8, 9].


    # 7.3.2.1 Digital Signatures


    A digital signature can be thought of as the digital counterpart of a handwritten
    signature or printed seal that offers better security than conventional signatures.
    A computerized signature guarantees approval of confirmation and respectability
    of any message or electronic report. Uneven cryptography, which is a sort of open
    key cryptography, frames the premise of advanced marks. By the utilization of
    an open key calculation, for example, RSA, two keys can be created, one private
    and one open. To make an advanced mark, marking programming, such as an email
    program, makes a restricted hash of the electronic information to be agreed upon.
    The private key is then used to encode the hash.


    The encrypted hash along with other data, such as the hashing algorithm is the
    digital signature. The purpose behind encoding the hash rather than the whole
    message or report is that a hash capacity can change over a discretionary contribution
    to a settled length hash esteem, which is generally substantially shorter, in
    this manner sparing time as hashing is considerably quicker than marking. Each
    piece of hashed information creates an interesting code. Any adjustments to the
    information brings about an alternate esteem. This encourages us to approve the
    integrity of the information by utilizing the endorser’s open key to unscramble
    the hash. In the event that the unscrambled hash coordinates a moment of processed
    hash of similar information, it demonstrates that the information hasn’t changed
    since it was agreed upon. On the off chance that the two hashes don’t coordinate,
    the information can be thought of as being endangered. As it were, the information
    has either been altered somehow (honesty) or the mark was made with a private
    key that doesn’t compare to the general population key displayed by the endorser
