  md: 'an online system which is overwhelmed with traffic from multiple sources. In
    this type of attack a botnet is formed in which multiple devices are connected
    online; these devices tend to generate fake traffic flooding the target system,
    which results in the service being denied to legitimate customers. This attack
    affects not only the target site but also creates a congestion problem over the
    entire network (Internet), as shown in Figure 4.3.


    It becomes difficult to control or stop the attack as one cannot differentiate
    between genuine traffic and attack traffic. An attacker may restrain you from
    getting your hands on email, websites, and online accounts that the affected computer
    depends on [10].


    A DDoS attack consists of four elements [11]:


    +   - *Victim:* The target host who is going to deal with the burden of the attack.

    +   - *Attack daemon agent:* This is an agent program that performs the attack
    on the victim. It is set up mostly on the host computer but tends to affect both
    host and target computer. These daemons tend to gain access and infiltrate the
    host computer.

    +   - *Control master program:* Coordinates the attack.

    +   - *Real attacker:* Although being the mastermind of the attack, it stays in
    the background by using the control master program.


    **SQL Injection:** As the name of the attack suggests, there must be an SQL query
    which has been inserted while the user inputs the data; as the query gets executed
    at the client end, the attack comes into operation. This is one of the most common
    web hacking techniques in which code is injected that might create havoc in the
    database, as shown in Figure 4.4.


    The causes of SQL injection are as follows [12]:


    +   - Running of software applications that welcome data from inauthentic internet
    users.

    +   - Unable to validate the data.

    +   - This data is further used in dynamic SQL query to database backing the application.


    SQL injection results in: in identity spoofing, alteration of existing data, revealing
    all the data on the system, making data unavailable by destroying the data.


    ![](img/57d9c6707468cbe6ea69c555dd9498fc_90_0.png)


    Figure 4.4 SQL injection attack.'
  merge: -1
  img_proc: true
