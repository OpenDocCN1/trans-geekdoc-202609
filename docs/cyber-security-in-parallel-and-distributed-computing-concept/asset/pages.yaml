  md: 'bombing devices. The Nokia 105 smartphone is a favorite device among ISIS fighters
    [23]. The cheap, durable and long battery life Nokia 105 phone is the most popular
    remote bomb-triggering device among ISIS organizations for detonating bombs. ISIS
    has assembled and deployed improvised explosive devices across the battlefield
