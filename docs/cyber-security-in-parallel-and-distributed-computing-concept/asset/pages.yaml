    into a course to avoid any occurrence in the future. To automate the network scanning
    practice, different firms use various commercial tools. One such tool is ISS Internet
    Scanner, which, if used, can document vulnerabilities grouped into categories
    of High Risk, Medium Risk and Low Risk. Following are various risk levels defined
    in the Help Index of ISS Internet Scanner:


    +   - High: This refers to any susceptibility that allows an intruder to gain
    immediate admittance into a system such as gaining superuser entry and access
    permissions or finding a way around a firewall. For example, a susceptible Sendmail
    8.6.5 version permits a fraud to carry out instructions on mail servers, installations
    of BackOrifice, NetBus or an Admin account devoid of any password.

    +   - Medium: Medium susceptibility may refer to intrusions providing confidential
    data, slowing down performance or having a high prospective of giving system admittance
    to an impostor. For example, recognition of active modems on the network, zone
    transfers, and writable FTP directories.

    +   - Low: Low susceptibility may refer to network breaches providing confidential
    data that could eventually lead to a compromise. For example, all users can access
    Floppy Drives, limited SSL validation may be performed by IE, not enabling logon
