  md: '# 15.5 Conclusion


    Many security lapses are still present in e-healthcare solutions based on cloud.
    There are certain points which should be taken into consideration when looking
    at the security requirements in cloud. The ubiquitous devices used in wearables
    rely on battery for power, so any security solution used should not consume large
    amounts of energy. The computational intensive algorithms cannot be used in these
    scenarios, because they may increase the communication latency and delay. With
    the growth of sophisticated adversaries, some emerging threats are affecting the
    healthcare system which need to be addressed. Standardized protocols and business
    policies need to be developed for seamless use of e-healthcare services.


