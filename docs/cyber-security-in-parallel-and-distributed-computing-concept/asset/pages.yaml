  md: '3. Education & Policy Enforcement: the creation of policies and plans that
    constitute the cybersecurity framework, such as written security policies, incident
    response plan, and disaster recovery plan.


    4. Continual Assessment & Improvement: ongoing process for the testing. of new
    attack vectors, the effectiveness of the CS framework, and testing for weaknesses
    in the approach.


    Creating and carrying out policies at an organization is highly complex. Therefore,
    there are people and companies that solely focus on selling handbooks that contain
    policy manual templates and consulting services to assist with this. At the basic
    level, these handbooks recommend defining the goals of the organization, defining
    roles and responsibilities, establishing an incident response plan, and developing
    and conducting continual education to reinforce the policies and controls in place
    [6]. See [16] to review a sample Applications Security and Operations Cybersecurity
    policy manual table of contents template.


    There are various elements that must be adequately addressed for an organization
    to effectively prevent and protect itself from cyber threats. These include components
    such as:


    +   - Creating a systems access policy.

    +   - Vendor compliance policy.

    +   - System management policy.

    +   - Email policy.

    +   - Encryption policy.

    +   - Password management policy.

    +   - Backup and recovery policy.


    In today’s business world that has been radically transformed by the IoT, it is
    vital to an organization’s security over cyberspace to develop an effective policy
    manual. Organizations should consider hiring cybersecurity experts to offer their
    recommendations on how to create or improve their policy manuals. Whether the
    policy manual is written internally or with the help of a third party security
    company it should be written with several goals. These include:


    +   - It should define how information (and knowledge) security is accomplished
    within a company or enterprise, including who is responsible for what.

    +   - It should inform the users that they are a part of that secure system, and
    that involves responsibilities on their part.

    +   - The policy manual should clearly describe what is expected of them, and
    the consequences of allowing breaches to the system.


    It is also important to stress that while the goals include halting the leak of
    information it also includes the forensic of incidents. This means that when a
    security leak occurs one of the products of the investigation is a set of “Principled
    documents” that form the basis for litigation. All forms of personal information
    and Internet correspondence, both internally'
