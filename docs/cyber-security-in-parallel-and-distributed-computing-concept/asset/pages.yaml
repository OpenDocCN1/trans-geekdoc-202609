    # 15.3.7 Insider Attack


    In a fog platform the insider attacks may be caused due to injecting malicious
    code into the stored data. Intrusion detection systems (IDS) can be used to handle
    these problems, but they face more challenges in fog environment because high
    power consumption and intensive computing are not feasible in fog environment.
    Lee et al. [27] introduced a hybrid intrusion detection system which uses a signature-based
    engine. Here, anomaly detection happens at cloud end whereas a signature of identified
    anomaly is produced and saved in local fog server. Dsouza et al. [28] proposed
    a policy-driven security management framework which employs an attribute-based
    authentication scheme, in which all users and associated devices are substantiated
    on the basis of a set of attributes which are the representative attributes. They
    have employed eXtensible Access Control Markup Language (XACML) to specify operational
    security, and network policy monitoring in the framework. These security policies
    are structurally modular in design where each security policy module could be
    plugged and played in real-time upon particular applications and devices so well-suited
    for fog platform. Shi and colleagues [29] suggested a cloudlet mesh architecture
    based on a collaboration of the cloudlet members inspecting and detecting malware,
    malicious attacks, and other threats. This type of collaborative intrusion-detection
    technique is well-suited for fog environment, and could be used among fog nodes
    to observe IoT environmental components.


    # 15.3.8 Masquerade Attack


    A masquerade attack happens when a malicious fog node pretends to be a legitimate
    one to exchange and collect the data generated by other IoT devices for any ill
    intention. These types of nodes are said to be rogue nodes [30]. Ma et al. [32]
    introduced a hybrid framework [31] that can sense the rogue access points in WiFi-based
    access networks. Their proposal was meant to provide protection to the networks
    from rogue access points, and also in situations where the attacker uses customized
    equipment. A rogue fog node is vulnerable to data integrity and possesses the
    ability to interpret user data or provide unadulterated data to neighboring nodes.
    These issues are difficult to handle in IoT and fog environment due to the complexity
    in trust management in various schemes. A schematic diagram of a masquerade attack
    is depicted in Figure 15.5.'
