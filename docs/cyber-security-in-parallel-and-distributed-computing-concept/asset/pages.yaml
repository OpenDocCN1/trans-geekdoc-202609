- pgno: 150
  md: 'Nam and Lysecky [31] have presented a security awareness in multi-objective
    optimization model for distributed reconfigurable embedded systems. They have
    designed a model and optimization framework by considering asymmetric multicore
    processor, single core processor, FPGAs and heterogeneous resources. They have
    used a dataflow model which integrates power, latency (*computation and communication*)
    and security level models. They have considered a multi-objective algorithm to
    improve security and energy. They have evaluated the presented work using an application,
    called video-based object detection and tracking.


    Fog computing is a distributed computing paradigm which acts as a mediator between
    data centers and devices [32]. It provides various facilities, such as storage,
    management, control, measurement and networking, to the cloud-based services.
    As a result, the latency, and bandwidth limitation problems faced by cloud computing
    can be easily solved using fog computing. However, it faces a lot of security
    and trust issues due to a large number of end users, which are as follows:


    +   1. In fog computing, each node is connected to all other nodes and they are
    dependent on each other [33]. If a fog node fails then it may result in a trust
    problem. Note that the nodes are communicated through the process of message passing.

    +   2. A security issue may arise in fog computing due to topological rebuilding
    process. When an old fog node quits, and a new fog node is introduced, which may
    not be able to adopt the existing topology, it results in a topological disorder
    problem.

    +   3. While collaborating with other fog nodes, if one of the fog nodes is stormed
    by a malicious attack and the corresponding node gets infected, then the infected
    node may attack the other running nodes. As a result, it leads to a trust crisis
    and security issue among the fog nodes.


    Zhang *et al.* [34] have categorized security and trust issues in Fog computing
    into six types, namely attack, authentication and access control, privacy, secure
    communication, trust and others. They have discussed several open research issues
    on trusted execution environment, fog orchestration, access control, collusion
    attack, context-aware security and service trust.


    Elmisery *et al.* [35] have offered an algorithm to calculate the approximate
    interpersonal trust between the cloud and the fog node using middleware agent.
    Here, the agent generally calculates the trust in a decentralized way and is done
    with the help of entropy. The user privacy is achieved by implementing the local
    concealment process. However, the fog nodes contain only global concealment agent.
    These two concealment processes are hidden from the cloud-based services and released
    when they are shared. Sun and Zhang [36] have introduced a model based on the
    characteristics of the human nervous system to address the special security issues
    in the fog architecture. They have modeled an evolutionary game-based security
    mechanism. They have introduced a strategy, called credible third-party dynamics
    penalty, which sets the attack cost spent by the malicious users higher than the
    profit. As a result, the malicious user is forced to stop attacking the system.
    They have recommended a credible third party to cope with the bandwidth and the
    behavior of the user. They have conducted the simulation test using MATLAB.'
