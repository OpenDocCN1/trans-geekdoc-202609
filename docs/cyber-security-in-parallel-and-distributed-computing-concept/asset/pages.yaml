  md: '# 1.8.2 Information Warfare and Its Countermeasures


    Also referred to as cyberwarfare, electronic warfare and cyberterrorism , information
    warfare is the act of causing devastation by distorting computer systems involved
    in significant processes like stock exchange, defense operations, telecommunications,
    air traffic control etc. Information warfare aims at vandalizing government organizations
    rather than private firms or individuals. It may also involve worms, viruses and
    cyberattacks as a part of the mission. Cyber warriors use skills, strategies and
    tactics to gain sensitive information or control over computer systems. Information
    warfare could be launched using three techniques:


    +   1. Gaining unauthorized access into systems to access confidential information.

    +   2. Deploy viruses, worms and malware to perpetuate a cyber attack.

    +   3. Considering loopholes in a network and exploiting them.


    Information warfare is the new battlefield may lead to jamming or hijacking of
    broadcast media like television, radio and internet. In the past, the results
    have also been in the form of networks being disabled or spoofed and stock markets
    being sabotaged. With the emerging technology of drones, surveillance has become
    quite easy.


    Information warfare incorporates a series of events that take place to cause cyberattacks.
    The sequence of the step-by-step procedure follows [18]:


    +   1. Step1 Gathering information: The primary step to conduct information warfare
    lies in the process of gathering information about the system and the technologies
    involved and provides a precise model of warfare. It acts as a deciding factor
    since by gathering information about the target systems, cyber warriors can measure
    the advantages, disadvantages and outcomes of the launched attack. It also gives
    a rough idea about the strength and position of warriors and highlights the skills
    and technologies needed to hammer the target system. It is usually done by surveillance
    and use of sensors.

    +   2. Step 2 Information transport: Once enough information has been collected
    about the target system, the next step is to transfer this information to persons
    who need it in a timely manner. The communication infrastructure which supports
    a large number of different components plays an important role here and ensures
    that the information is transported in real time.

    +   3. Step 3 Information protection: The information captured must be protected.
    This involves two aspects of security, i.e., the physical security and the cybersecurity.
    Physical security ensures that the information is secured physically using bulletproof
    cases and locks. The idea is to prevent physical destruction or interception.
    The cybersecurity aspect aspect deals with protecting the information using computer
    technologies like passwords and encryption.

    +   4. Step 4 Manipulating the information: Even though multiple security layers
    are applied to sensitive information, there may still be a slight chance that
    an adversary may access the information. Thus, the collected information is often
    manipulated. The idea is that even if the information is somehow accessed by the
    adversary, it will be impossible to decode the original contents of the information.
    Several software programs can be used to manipulate text, pictures, video, audio
    and other information.'
