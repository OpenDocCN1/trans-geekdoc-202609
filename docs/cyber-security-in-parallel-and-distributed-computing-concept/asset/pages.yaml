  md: '# CHAPTER


    # Cyberwar is Coming


    T. MANIKANDAN¹, B. BALAMURUGAN², C. SENTHILKUMAR¹, R. RAJESH ALIAS HARINARAYAN³,
    R. RAJA SUBRAMANIAN³


    ¹ APCSE, CSE Department, Thiagarajar College of Engineering, Madurai, Tamil Nadu,
    India


    ² PCSE, Galgotias University, Uttar Pradesh, India


    ³ Research Scholar, CSE Department, Thiagarajar College of Engineering, Madurai,
    Tamil Nadu, India


    Email: tmcse@tce.edu


    # Abstract


    “War” is the most dangerous game played by humans when their resources are threat,
    which has then continuously evolved throughout history due to greed. After the
    huge losses incurred in the world wars, humanity was restored with diplomacy.
    War is initiated when emotions like fear and greed encroach upon the minds of
    people in a society. Basically, fear is triggered due to the lack of resources
    necessary for living a peaceful life, and questions begin to arise in the minds
    of people as to what would happen if these resources were to be threatened by
    those of a faster-growing society with more money and arms which might be used
    to enslave their own society. Greed happens after a nation reaches a stable state
    and wants to to become. Armed warfare in today’s world has been reduced due to
    diplomatic efforts, but the fear of reduced resources and greed for money are
    still visible, and the resources are now becoming digital all over the world with
    the development of technologies like 5G, the internet of things, smartphones,
    smarter cities, etc., but so are cyberattacks with ransomware such as WannaCry,
    NotPetya, BadRabbit, etc. With everything connected to the Internet, it has become
    a battlefield connected to the civilians of all nations, placing them on the battlefield
    unknowingly. This connectivity is a bigger threat as it can cause massive devastation
    in rising digital economies and in everyone and everything, even our brains, which,
    along with the internet’s ever-encroaching war on people’s emotions, is evidence
    that a war is coming-a cyber war!


    Keywords: Cyberwar, ransomware'
