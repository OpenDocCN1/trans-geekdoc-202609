    # 7.6.2 Searching and Seizing


    As data and interchanging innovations have entered regular day-to-day existence,
    PC-related unlawful activity has drastically expanded. As PCs or other information
    stockpiling gadgets can provide methods for carrying out wrongdoing or be a vault
    of electronic data that is confirmation of a wrongdoing, the utilization of warrants
    to scan for and seize such gadgets is given increasing significance. The pursuit
    and seizure of electronic proof is in many regards the same as some other inquiry
    and seizure. For example, as with some other inquiry and seizure, the pursuit
    and seizure of PCs or other electronic stockpiling media must be conducted pursuant
    to a warrant which is issued by a district court if there is probable cause to
    believe that they contain evidence of a crime [20].


    Realizing that criminals have not missed out on the PC revolution, the United
    States Department of Justice has published a manual committed solely to the laws
    of searching for and seizing PCs and electronic surveillance of the Internet.
    This record was composed with an end goal to help law enforcement organizations
    the nation over in getting electronic proof in criminal investigations.


    According to James K. Robinson, Assistant Attorney General of the Criminal Division,
    this manual was essential for law enforcement operators and prosecutors, as well
    as for any American who utilizes a PC. He further stated that electronic security
    is essential to all of us, and the department needs everybody to recognize what
    their rights are. Entitled, “Searching and Seizing Computers and Obtaining Electronic
    Evidence in Criminal Investigations,” the Criminal Division’s Computer Crime and
    Intellectual Property Section (CCIPS) made this report. The psychological distress
    caused by PC-related crime requires prosecutors and law enforcement specialists
    to see how to get electronic confirmation put into PCs. Electronic records, for
    example, PC arrange logs, messages, word handling documents, and “.jpg” picture
    records, have progressively given the legislature vital confirmation in criminal
    cases.


    The manual provides government law enforcement operators and prosecutors with
    a methodical process that can enable them to comprehend the legitimate issues
    that emerge when they look for electronic proof in criminal investigations. The
    manual diagrams how electronic observation laws apply to the Internet, and also
    how the courts have connected the Fourth Amendment to PCs.


    This manual replaces Federal Guidelines for Searching and Seizing Computers (1994),
    and also the 1997 and 1999 supplements. Despite the fact that organizations getting
    together and making a game plan accomplished the objective of giving efficient
    control to every government specialist and lawyer in the field of PC investigation
    and arrest, intervening changes in the law and the rapid development of the Internet
    since 1994 has cultivated the need for a fresh direction. This manual is intended
    as an updated version of the recommended rules on seeking and seizing PCs with
    direction on the statutes referring to acquiring electronic confirmation in cases
    involving PC systems and the Internet. The manual offers help, and is not a specialist.
    Its examination and conclusions ponder current troublesome areas of the law, and
    doesn’t speak to the official position of the Justice Department or other offices.
    It has no administrative impact.'
