  md: 'The law overseeing electronic confirmation in criminal investigations has two
    essential sources: the Fourth Amendment to the U.S. Constitution, and the statutory
    security laws arranged at 18 U.S.C. 2510-22, 18 U.S.C. 2701-11, and 18 U.S.C.
    3121-27. Although other established and statutory issues are covered now and again,
    most circumstances exhibit either a sacred issue under the Fourth Amendment or
    a statutory issue under these three statutes. The association of this handbook
    mirrors that division: session 1 and session 2 address the Fourth Amendment law
    of hunt and seizure, and session 3 and session 4 center around the statutory issues,
    which emerge generally in cases including PC systems and the Internet [19].


    # 7.7 Conclusion


    This chapter focused on various cybersecurity techniques meant for parallel as
    well as distributed computing environment. The distributed systems basically are
    candidates for giving increased performance, extensibility, increased availability,
    and resource sharing. The necessities like multiuser configuration, resource sharing,
    and some form of communication between the workstations have created a new set
    of problems with respect to privacy, security, and protection of the system as
    well as the user and data. So, new age cybersecurity techniques to combat cybercrimes
    and protect data breaches are the need of the hour. The chapter also focused on
    the need for service level agreements (SLA) that prevail between a service provider
    and a client relating to certain aspects of the service such as quality, availability,
    and responsibilities. The Cuckoo’s Egg lessons on cybersecurity by Clifford Stoll
    as well as various amendments to curb fraud, data breaches, dishonesty, deceit
    and such other cybercrimes have also been thoroughly discussed here.


