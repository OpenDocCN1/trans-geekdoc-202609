  md: 'message or information received by the receiver is the original message that
    was actually sent by the sender and no sort of modification or alteration of the
    actual message was done during the message transmission. Availability is an assurance
    of the trustworthiness of the data used by authentic people.


    There are other factors besides the CIA triad which have grown in importance in
    recent years, such as Possession or Control, Authenticity, and Non-Repudiation.


    # 7.3 Popular security mechanisms in Distributed Systems


    # 7.3.1 Secure Communication


    Suitable adjustments are made to provide a safe medium of communication amid clients
    and servers so that the CIA factors are preserved. Secure channel provides a safe
    way of communication between a client and a receiver, preventing any intrusion
    of a third party from happening so that the confidentiality and/or integrity and/or
    authentication is not compromised. There are several protocols by which we achieve
    this purpose. Here we will discuss a few of the protocols that help preserve the
    authentication factor [5].


    # 7.3.1.1 Authentication


    Authentication and integrity are interdependent. For instance, consider a disseminated
    framework that supports verification in aid of a relationship, but does not provide
    rules for guaranteeing the integrity of the information. Alternatively, a framework
    that just ensures data truthfulness, while not measuring for validation. This
    is why the information authentication and truthfulness must be as one. In numerous
    conventions, this mix functions admirably. To guarantee truthfulness of information
    once it is exchanged subsequent to the right verification, we make use of special
    keys encrypted by the session keys. The session key, which is a shared secret
    key, applies to the encryption of information truthfulness (integrity) and discretion
    (confidentiality). Such a key is usable while, the set up channel exists. At the
    point when the channel is shut, the session key is lost. Here we will talk about
    the verification strategies in view of the session key [6, 7].


    # 7.3.1.2 Shared Keys Authorship-Based Authentication


    Figure 7.2 depicts an authentication protocol based on shared keys. If a person,
    say X, wishes to build a communication channel with another person, say Y, their
    communication is facilitated by sending a request message (say `message1`) by
    X to Y.


    ![](img/57d9c6707468cbe6ea69c555dd9498fc_129_0.png)


    Figure 7.2 Shared secret key-based authentication.'
