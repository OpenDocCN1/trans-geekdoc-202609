  md: '# 1.8.4 Good Practices and Policies


    Information technology has brought about certain changes. The age of digital transformation
    ensures convenience but also invites several security risks. These security risks
    have the potential to harm organizations both at the highest as well as the lowest
    levels. Thus, it is mandatory that organizations introduce certain good practices
    and policies to ensure security in the work environment. Over the years a lot
    of good practices and policies have proven to be beneficial. Some of the good
    practices are as follows:


    +   1. Preparedness, prevention, detection and correction should be the security
    goals of any organization.

    +   2. Run security strategies from time to time, so that it is easier to choose
    tools when required.

    +   3. Introduce access controls for data throughout the organization, to offer
    selective privileges to employees for data access. This could prevent insider
    attacks.

    +   4. Monitoring activities (*network traffic, resources consumption and usage*)
    leads to transparency in an organization. Firewalls, intrusion prevention systems
    and intrusion detection systems may prove to be highly beneficial. They not only
    raise alerts but also function accordingly.

    +   5. Always have backup. A distributed environment, ensures replicated data
    so that affecting one of the data centers does not mean that data is lost. In
    a situation when malware like Ransomware strike, it may be difficult to recover
    data, hence backup is a must.

    +   6. Cybersecurity Awareness and Training should be encouraged in organizations.
    People who may not be aware of the consequences cyberattacks, may fall victim
    to attacks like social engineering.

    +   7. Automating of systems should be done whenever updates are required. The
    updates should not depend on the approval of the user.

    +   8. Organizations should have their sites protected using Secure Sockets Layer
    certificates and Hypertext Transfer Protocol Secure (HTTPS).

    +   9. Insider threats should be investigated as soon as possible. Checking data
    logs is one way to do that.

    +   10. Information assets should be physically secure and not only in the form
    of replicated data over the systems and network.

    +   11. Using multi-factor authentication to access a particular account confirms
    the identity of the person. A combination of what we have, what we are and what
    we know could prevent a lot of security issues.

    +   12. Incident response plans should be devised for all organizations. In the
    case of security breaches, organizations can rely on these plans to detect, respond
    and restrict the repercussions of the cyber incidents.


    Cybersecurity policies are designed to protect the physical and technology assets
    of an organization. Some of the cybersecurity policies highlighted in the last
    decade are as follows:'
