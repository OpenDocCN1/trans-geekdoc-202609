    The network operator is responsible for transporting information securely.


    +   - **DoS:** Whenever hackers launch a denial-of-service attack, it turns out
    to be one of the most bothersome security issues faced by e-business today. It
    is characterized as a categorical effort by attackers to prevent users from using
    an e-business system.


    +   - **Session interception and message modification:** The attacker can transmit
    altered messages by hijacking a session. They can also add a malicious host between
    client host and server host, which is popularly known as man-in-the-middle. In
    this case, data communication passes through the attackers’ host.


    +   - **Firewall loophole:** A firewall is a software or hardware device installed
    between back-end server and corporate network. It is usually implemented at network
    protocol layer and fails to protect the system at higher protocols. Hackers sense
    unfixed firewall loopholes and try to access price lists, email lists, catalogs,
    etc.


    # 4.6 Security Threats in e-Commerce


    e-Commerce has a tendency to be at a higher stratum for risk and attacks. In e-commerce,
    data are the key to track consumer shopping behavior to personalize offers, which
    are collected over time using consumer browsing and transactional points [9].
    Server level is the physical place where all of these transactions happen. The
    server is regarded as the central repository for one’s e-commerce business above
    that entails a definite website which displays one’s products and services, the
    database of the customer and the mechanism of payment. If any attack takes place
    on the server, then it proves to be a huge setback as there is a potential of
    losing everything. Thus, taking the initiative when it comes to security should
    be done to a much greater extent. Now, let us discuss various e-commerce security
    threats in detail [9].


    ![](img/57d9c6707468cbe6ea69c555dd9498fc_89_0.png)


    **Distributed Denial-of-Service (DDoS):** In this type of attack the availability
    of a target system (e-commerce) comes into question, as millions of customers
    are unable to access'
