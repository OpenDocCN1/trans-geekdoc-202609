  md: '# 4.3.3 Advantages and Disadvantages of e-Commerce


    We have discussed many of the characteristics of e-commerce in the section above.
    The internet aids in forming virtual communities, which are basically groups of
    people having common interests. These virtual communities become ideal target
    markets. There are various advantages of performing business online from the perspective
    of different stakeholders, as shown in Table 4.1.


    Table 4.1 Advantages of e-commerce.


    | S.No | e-Commerce Stakeholders | Advantages |

    |------|------------------------|------------|

    | 1 | Organization | Low cost<br>Fewer employees involved<br>Global reach, even
    to remote areas<br>Easier management of inventory |

    | 2 | Client/Customer | Customized experience<br>Can compare prices easily of
    same products/services<br>Products/Services available at a mouse click<br>Wider
    range of choices available |

    | 3 | Society | Promotes cashless economy, which in turn curbs black money<br>Provides
    online services in various sectors<br>Prices of products are kept in check as
    no middlemen, such as wholesalers, retailers, etc., are involved. |


    If we look at e-commerce operations from the point of view of various stakeholders,
    there are many drawbacks associated with them, as shown in Table 4.2.


    Table 4.2 Disadvantages of e-commerce


    | S.No | e-Commerce Stakeholders | Disadvantages |

    |------|------------------------|---------------|

    | 1 | Organization | Data privacy issues<br>Not everything can be sold, such as
    perishable products or, expensive luxury items<br>Highly competitive<br>Problem
    of adherence to legal standards |

    | 2 | Client/Customer | Look and feel not available before buying<br>Internet
    connectivity required<br>Product delivery not instantaneous<br>Products not available
    when server is down<br>When delivered, product may not be as expected |

    | 3 | Society | Security of data like leakage of data<br>Knowledge of using internet
    is limited |'
