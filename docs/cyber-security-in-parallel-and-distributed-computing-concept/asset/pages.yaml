  md: '**Price Manipulation:** As the name suggests, the original price is manipulated
    to different value. This type of attack, which is depicted in Figure 4.5, is very
    common in online shopping cart platforms and payment gateways. In this attack
    the final payable price is manipulated by the attacker at will. In coding, the
    programmer makes use of hidden fields in order to store value of total item cost;
    a hacker can tamper with a value stored on their browser, thus the total amount
    that is payable is modified by the attacker. Supposedly, the value of an item
    is modified from Rs.2000/- to Rs.200/-, then it becomes exciting for the customer
    but unfortunate for the seller.


    ![](img/57d9c6707468cbe6ea69c555dd9498fc_91_0.png)


    Figure 4.5 Price manipulation.


    **Session Hijacking:** A session is a sequence of interactions maintained over
    a single connection between two nodes or end points, as shown in Figure 4.6. As
    the name of the attack suggests, the session control is taken over by the hijacker
    as they steal a valid session ID which allows them to enter or keep an eye on
    data or extract it. By changing the route of packets with their system an attacker
    can take part in the conversation of other users [14]. It is a combination of
    sniffing and spoofing.


    ![](img/57d9c6707468cbe6ea69c555dd9498fc_91_1.png)


    Figure 4.6 Session hijacking attack.


    **Cross-Site Scripting (XSS):** In this type of attack a malicious script is attached
    to trusted websites from a compromised site. On adding malicious script the attacker
    gains access to sensitive information, session cookies, etc. It is a special case
    of code injection. Here, the end user’s browser has no clue whether it is a trustworthy
    script or not. Thus, it goes goes ahead and executes this script. These scripts
    change and rewrite the HTML page content. This process is schematically shown
    in Figure 4.7.'
