  md: '# 4.4 Security Overview in e-Commerce


    Security is the need of the hour when operating online, as the network’s vulnerability
    to attack is manifold. Information is one of the most vital enterprise assets.
    For any organization, information should be valued and suitably secured [18].
    Hence, we will discuss the purpose of security in e-commerce and different levels
    of the system where security is a prerequisite.


    # 4.4.1 Purpose of Security in e-Commerce


    +   1. *Authentication:* This ensures that only the right user has access to data
    [6].

    +   2. *Non-repudiation:* This is a form of confirmation from the user that they
    have indeed performed an action, so that they have cannot deny performing that
    action in the future.

    +   3. *Privacy:* This gives control to the user on how much of their data can
    be given/distributed to third parties.

    +   4. *Confidentiality:* This is the state of keeping data private so that it
    cannot be accessed by any unauthorized person/party.

    +   5. *Availability:* This means that all the data is available to a user that
    they are entitled to or have the right to access.

    +   6. *Integrity:* This ensures that data received by a user is the same that
    was transmitted by sender, that is, no change or manipulation of data has occurred
    while transmitting data.

    +   7. *Encryption:* This means encoding data in such a way that it cannot be
    understood directly by reading it.


    # 4.4.2 Security Element at Different Levels of e-Commerce System


    Security of the e-commerce system is of immense significance, thus it must be
    ensured at various component levels, i.e., hardware, software and environment.
    The pervasiveness of computing systems has placed computer devices everywhere,
    and they have become so prevalent as to blend into the background. They are also
    part of the emerging wireless environment [11].


    # 4.4.2.1 Hardware


    The devices that make up the system, such as web servers, network devices, and
    database servers, are critical points of the system and are susceptible to various
    network attacks. Thus, measures like a properly configured firewall must be taken.
    Web servers and database servers should be insulated from various other networks
    by using DMZ (*demilitarized zone*), which is a network that stands between a
    protected network and an external network. Thus, an additional layer of security
    is introduced in the network.


    # 4.4.2.2 Software


    The smooth operation of an e-commerce software security system requires a security
    OS, web server software, database software and web browser. The operating system
    should be configured properly, as it is quite vulnerable. In order to fix holes
    in security, there should be a regular updating of software and routinely released
    patches.


    # 4.4.2.3 Environment


    Environmental security refers to securing physical access to the network by using
    a manual guard, CCTV, various logs or other methods.'
  merge: -1
  img_proc: true
