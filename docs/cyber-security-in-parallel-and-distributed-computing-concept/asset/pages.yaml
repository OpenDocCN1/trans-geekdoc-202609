  md: '# CHAPTER


    # Security Threats and Vulnerabilities in E-business


    SATYA NARAYAN TRIPATHY, SISIRA KUMAR KAPAT, SUSANTA KUMAR DAS


    Department of Computer Science, Berhampur University, Odisha, India


    Email: snt.cs@buodisha.edu.in, skk.rs.cs@buodisha.edu.in, skd.cs@buodisha.edu.in


    # Abstract


    The explosive growth of business, science and other areas has lead to abundant
    data. We are drowning in data, but starving for knowledge, which has brought about
    the concept known as data mining. Data mining is extraction of implicit, potentially
    useful and unknown knowledge from huge amount of data. Data mining techniques
    can be very effectively used used for security applications. The permission to
    access data may cause a threat to the privacy and security of user’s information.
    This chapter deeply focuses on the security aspects of data mining and possible
    solution techniques. Moreover, we also highlight some privacy issues due to data
    mining, like intrusion detection.


    Keywords: Security threat, e-business, malware analysis, vulnerability, e-business
    attacks'
  merge: -1
  img_proc: true
