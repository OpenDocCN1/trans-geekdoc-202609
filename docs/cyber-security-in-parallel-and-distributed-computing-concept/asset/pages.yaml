- pgno: 199
  md: '# 12.1 Introduction


    Today mobile phones have almost replaced personal computers and laptops by merging
    a combination of technologies, to fulfil the basic computational and communication
    necessities of today’s generation. The evolution of mobile devices with constantly
    growing processing power and larger storage memories, matching the potential of
    desktop computers can be considered as a true revolution in the world of information
    technology. This revolutionary growth in complexity and portability has placed
    mobile devices as extensions of our personality. These extensions store and manage
    our contacts, messages and emails, track our current location, remember our preferences
    and appointments and even follow us everywhere.


    Due to their portability and versatility of applications, smartphones and tablets
    are fast becoming the preferred tools for internet browsing, online transactions,
    auctions and purchases and so on. The ease of interface access for every mobile
    application has rendered skills and underlying technologies as almost meaningless
    constraints for the use of these devices. Similar to every technology that created
    a radical impact in the life of the common masses, and was later exploited for
    misuse, mobile technology is also under the same spectrum. As the evolution of
    mobile phones constructed a thriving path for the growth of civil society, it
    also raised possibilities for cyber criminals to exploit mobile devices as a channel
    or medium of attack and exploitation.


    # 12.2 Classification of Mobile Security Threats


    The wide range of security threats that can attack or exploit mobile computing
    devices can be categorized into the following categories, which are discussed
    ahead in this section.


    ![](img/57d9c6707468cbe6ea69c555dd9498fc_199_0.png)


    **Figure 12.1** Classification of mobile security threats.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# 12.2.1 Physical Threats


    Mobile devices have become common for computing and communication requirements
    among people because of their portable dimensions and high computing potentials.
    Due to these features, these gadgets are valuable and demand precautions for their
    physical security. In addition to the costly hardware that can be resold on the
    black market of gadgets, the information relevant to a user or organization can
    also be highly sensitive and worth far more. Due to these factors, stolen and
    lost mobile devices are one of those most frightening security threats. In terms
    of threats to physical security, mobile devices such as smartphones, tablets,
    PDAs, etc., without authentication check mechanisms like passwords, screen locks
    or fingerprint scans are at high risk [1, 2]. Such undefended devices always remain
    vulnerable to loss and compromise the stored sensitive information. In the worst
    case of loss or theft, the hackers or cyber criminals find one mechanism or another
    to bypass any form of authentication check and gain access to user sensitive information
    stored on the device.


    # 12.2.2 Web-Based Threats


    Modern mobile devices are designed to be persistently connected to WiFi networks
    or packet data internet to access web services. A major threat to the security
    of mobile devices arises through these networks. To execute web-based threats
    on a mobile device, its user must be prompted to visit an unsafe site and naively
    trigger a malicious process. Web-based threats can be classified into the following
    classes.


    Applications such as email, messaging, Facebook, WhatsApp and Twitter are commonly
    used to spread links of malicious websites designed to scam the receiving users.
    Such scams are known as phishing scams [2]. Upon accessing such websites, the
    user is tricked into feeding his sensitive information like passwords or account
    numbers, which is captured by criminals for later exploit. The next level of possible
    threat connected to malicious links is drive-by downloads which automatically
    download a malicious application on user’s mobile device as they access such links.
    Some of such malicious apps prompt the user to click on or open the download for
    execution, while other apps can even start automatic execution. Another class
    of threats is known as browser exploit that utilizes the vulnerabilities present
    in the web browser installed on the mobile device or applications connected to
    it such as PDF file reader, flash player, shockwave file player or even image
    viewer, to damage the normal functionality of the device.


    # 12.2.3 Application-Based Threats


    Malicious mobile applications are often connected to websites with acceptable
    looks and behavior. As discussed in web-based threats, such malicious applications
    present a wide range of security threats to a mobile device. In continuation to
    this sequence, even legitimate software applications can also be exploited for
    deceitful purposes.


    Application-based threats fit into one or more of the following classes. The first
    class of application-based threats is malware. Malware is an intentionally written
    piece of code to perform malicious actions on a target device [3]. Modern malware
    applications are capable of adding charges to a user’s phone bill, sending unwanted
    messages to contacts, accessing user’s private data or even hand over the control
    of the mobile device to a remote hacker without the knowledge of the user.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'The next class of threatening applications for a mobile device is spyware.
    Spyware is a malicious application similar to malware, only it does not cause
    any visible harm to the normal functioning of the mobile device. Instead, a spyware
    silently collects user’s private data without their knowledge or consent. Text
    messages, phone call history logs, geographical location, browser history, contact
    list, private photos, contact lists and emails are some of the user data, which
    are generally targeted by spyware applications. Such data collected by spyware
    is exploited for financial fraud, blackmailing and even espionage cause a deep
    risk of privacy threats to the mobile device user. Another type of application-based
    threat is caused by vulnerable applications that contain faults exploitable for
    malicious intentions [28]. Such applications are generally legitimate ones with
    weaknesses due to improper designs or insufficient testing. Vulnerable applications
    allow access to sensitive user data for a criminal intent, execute fraudulent
    activities, disrupt the normal functioning of a service or even allow downloads
    of other similar malicious applications on the user’s device.


    # 12.2.4 Network-Based Threats


    Modern mobile devices are designed to ensure connectivity to local wireless networks
    (WiFi, Bluetooth) as well as cellular packet data networks to access web-based
    services. Threats from such networks are classified under network-based threats.
    Network exploits utilize flaws present in mobile operating systems or even the
    platform software on which the wireless or cellular networks function. On connecting
    to the user’s mobile device, these threats can provide the channel to an application
    or web-based threats [4].


    WiFi sniffing is a common class of network threat that captures user data traveling
    through the network between the device and the network access points. Sending
    unencrypted data such as usernames, passwords or financial details via websites
    or applications lacking any security measures puts to privacy and security of
    user data at potential risk.


    The next form of network threat to mobile devices is known as WiFi spoofing, which
    is executed by hackers by creating bogus WiFi access points for web access generally
    by using malicious WiFi routers. These WiFi points appear to be freely available
    public WiFi networks at public places, such as hotels, libraries, airports, railway
    stations or even coffee shops or hotels, with sufficiently familiar names like
    “Coffehouse Freenet” or “Airport Free WiFi” to attract users to connect to them.
    In worst cases, such malicious services prompt the user to create a user account
    with a username and password to access the free services. A large number of naive
    or ignorant users create accounts on such access points by using the same combination
    of email or username and password, that they use for many other services. This
    allows hackers to capture the victim’s sensitive user information and exploit
    it for malicious intent. Hence, extreme precaution must be taken while connecting
    to any new WiFi access point at any public place. In addition to this, users must
    never use personal details and regular account details to create accounts on such
    services. Instead, they should always use a unique combination of username and
    password to create a login on any new service. Compared to random or anonymous
    WiFi access spots with minimum or no security features, the paid wireless networks
    controlled by business groups with much more protected and controlled access should
    be preferred. Analysis of network traffic between router and mobile device of
    a victim user is known as session hijacking in cybersecurity terms.


    In the case of mobile devices, a network attack known as sidejacking is employed
    to capture data from vulnerable data traffic. For this purpose, hackers use various
    tools to automate session hijacking via sidejacking attack [24]. A similar tool
    of this class has been developed by Mozilla as a plugin for Firefox web browser
    known as “Firesheep.” Firesheep'
  merge: -1
  img_proc: true
- pgno: 202
  md: '[31] automates sidejacking between vulnerable WiFi networks and victim mobile
    devices to capture and exploit data traffic using a packet sniffer. Risk of compromise
    of wireless networks and mobile hotspots can be minimized by disabling automated
    search and by using secure wireless networks.


    # 12.2.5 Data Transfer-Based Threats


    Use of weak encryption algorithms or improper implementation of strong encryption
    techniques by the application developers can lead to cracked encryption threats.
    In the first case, many times developers use fragile encryption algorithms with
    well-known vulnerabilities only to speed up the development process [3, 5]. Such
    fragility attracts attackers to crack the applications and capture sensitive user
    data. In the later case, back doors or deficiencies are left open by developers
    while working with strong encryption techniques, which can also lead to the same
    impact on the privacy or security of user data. For example, multiple messaging
    applications provide encryption of user data only at sender and receiver ends.
    This leaves sufficient space for attackers in intermediate networks to capture
    the data and exploit it for malicious intent without any requirement of user details
    and passwords. Satisfactory enforcement of encryption practices through the network
    only practices encountering data transfer-based threats.


    # 12.2.6 Improper Session Management-Based Threats


    Many applications make use of runtime-generated access tokens to enable network
    access to connected devices. These access tokens also facilitate connectivity
    between the network and devices without repeated re-authentication for a predefined
    time limit. Applications with sufficient security features, generate new and confidential
    access tokens to enable network access for every session. Improper handling of
    session variables like access tokens, by the application, can naively leak them
    to malicious actors, risking the entire communication to illegitimate exploits.


    # 12.2.7 Bluetooth-Based Threats


    Bluetooth technology allows mobile devices to wirelessly exchange data among devices
    as well as connect peripherals like mouse and keyboards. But mobile devices with
    Bluetooth in the activated mode, set to be discoverable for other devices, are
    exposed to attacks such as blue snarfing, blue jacking and blue juggling discussed
    below [5]. Theft of private and sensitive user data, such as phone call logs,
    browsing history, GPS details, contacts, email communications and text messages,
    can be executed by using malicious software applications via Bluetooth. This theft
    of user data via Bluetooth is referred to as a Bluesnar fing attack. Hackers execute
    Bluesnar fing attacks by scanning for nearby devices with enabled Bluetooth via
    their smartphone or laptop. Applications used for bluesnar fing can steal data
    from victim’s mobile device in silent and undetectable mode. The worst aspect
    of bluesnar fing attack is that turning off Bluetooth on the device cannot guarantee
    security. This is because a mobile device with enabled but hidden Bluetooth can
    also be discovered and exploited by making a guess of its MAC address through
    brute force attack [25].


    A Bluesnar fing attack causes theft of user data from the device, while a Bluebugging
    attack leads to the silent broadcast of anonymous and unwanted messages to other
    Bluetooth-enabled devices without the victim’s consent and knowledge. A Bluejacking
    attack is executed by backdoor bypassing of victim’s mobile device access leading
    to silent com-'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'promise of control of their device. A bluejacking attack is capable of creating
    new entries in the address book, typing and transmitting new text messages and
    even transferring files via Bluetooth.


    # 12.2.8 Application Platform-Based Threats


    Despite thorough scanning, every mobile application submitted even to trusted
    online download platforms like Apple''s iTunes and Android Play Store cannot be
    guaranteed to be genuine and safe in all terms. Some suspicious applications may
    lead to unauthorized access to user credentials, siphoning of internet data or
    even make silent unapproved purchases from the user''s account. In the year 2010,
    a Vietnamese app developer was blacklisted from iTunes store by Apple Inc. The
    reason for this penalty was that he apparently charged users for books which they
    never purchased via his app. The developer committed this fraud only to boost
    his rating in the iTunes store and improve his ratings. To prevent such exploits,
    the users should try to install and use mobile apps of only trusted vendors and
    developers [26]. In a case where it is required to install an app from a new developer,
    a thorough study of app details like developer name, affiliations, user ratings
    and permissions required by an app, must be done.


    A major category of such suspicious apps is free mobile apps, like games or utility
    apps, are more likely to exploit device features and compromise user data. They
    are usually capable of accessing the internet, tracking user location and even
    accessing sensitive data. For example, 94% of gambling mobile games provided as
    free apps demand a user''s permission to send text messages, use the phone camera
    and even to make outgoing phone calls [26]. The users must be alert and substantiate
    the intent of such a free gaming app asking for access to these features.


    But parallel to genuine application platforms mentioned above, there are also
    third-party application stores that provide alternative apps for users. Downloading
    and installing apps from these unauthorized platforms on a device can be very
    hazardous for the end user. Such application stores always remain at high risk
    of being run by cyber criminals by hosting fake copies of legitimate applications
    altered to execute fraudulent activities.


    # 12.3 Smartphones as a Tool of Crime


    The vulnerabilities of mobile computing infrastructures exist in device hardware,
    application designs, coding standards, wireless connectivity and even in data
    transfer protocols. Such vulnerabilities always risk the profits of mobile computing
    at the cost of cybersecurity threats. The increasing attention of cyber criminals
    on the mobile sector is a matter of serious concern for everyone. High prices,
    portability and immense computing potential of mobile devices make them a focus
    of criminal exploits [6]. But above all, the extensive dependence of common folks
    on their mobile devices for every little thing they require makes these machines
    a lucrative target for cyber criminals. In this scenario, user data like contacts,
    emails, bank details, and passwords are at stake.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# 12.4 Types of Mobile Phone-Related Crimes


    Activities associated with criminal usage of mobile phones can be considered as
    mobile crimes. Such activities make use of one or more potential uses of mobile
    devices to commit crimes. Here we discuss various types of mobile crimes.


    **Physical Theft:** The ease of carrying mobile devices make them highly susceptible
    to physical theft. Criminals are able to demand an attractive price for stolen
    mobile devices on the black market due to their pricey hardware. But for a user,
    who is a victim of mobile theft or physical loss, the damage extends to the loss
    of the sensitive and private user information stored on the device [7]. Modern
    mobile devices are well equipped with character- or sequence-based passwords,
    biometric access restrictions [19], user data encryption and data erasing mechanisms
    to minimize the information loss. Also, regular and automatic backup of user data
    on cloud-based locations can almost neutralize the damage of data loss due to
    physical theft of a mobile device.


    ![](img/57d9c6707468cbe6ea69c555dd9498fc_204_0.png)


    Figure 12.2 Various mobile phone-related crimes.


    **Mobile Hacking:** Any illegitimate intrusion into a computing device and/or
    network without the consent of its owner can be termed as hacking or, more specifically,
    cracking. This definition also covers the acts breaching the security of mobile
    devices, communication systems and/or networks [8]. To implement mobile hacking,
    intentionally written scripts or malicious applications are utilized by hackers
    to target mobile devices and systems connected to them.


    **Mobile Cyber Defamation:** Transfer or broadcast of intentionally written derogatory,
    humiliating and obscene information, offensive to the reputation and/or survival
    of a person or organization, causing them physical and/or financial loss is referred
    to as defamation [8]. Use of mobile applications, such as SMS, emails or phone
    calls, to commit acts of defamation can be classified as mobile defamation.'
  merge: -1
  img_proc: true
