    # Abstract


    The last few years have been remarkable advancements in the e-healthcare system.
    This is due to the growth of digitization in the healthcare sector, especially
    the use of wearable devices equipped with sensors, IoT devices and body area network.
    e-Healthcare is not only limited to storing clinical data. Sophisticated digital
    applications able to be designed and developed which cater to an array of varied
    health-related services. Some examples are telemonitoring of elderly persons,
    tracking mobility of patients, monitoring sugar levels and blood pressure, and
    giving early notifications in case of emergencies. This has brought about a revolution
    in e-healthcare. At the same time, these applications are challenged by different
    security issues. The security challenges are multi-fold when these solutions are
    built on a virtual environment like cloud or fog. In this chapter we have tried
    to accumulate some of the security issues which arise in the healthcare sector.
    The chapter also discusses existing solutions and emerging threats.


    # Keywords


    e-Healthcare, confidentiality, integrity, availability, threats, vulnerabilities'
  merge: -1
