- pgno: 194
  md: 'the rush to gain market share and a competitive advantage over rival organizations.
    As noted above, it needs to be a cooperative effort to increase the awareness
    of the seriousness of cybercrimes and the potential they have to impact organizations.


    The most common finding in this pilot study is that the majority of organizations
    do not have an effective cybersecurity policy manual to refer to. Furthermore,
    the ones that do, are not properly enforcing it. It is crucial that an organization
    monitors its network security system on a daily basis, to not only reduce vulnerabilities,
    but also to minimize the threat of being hacked. Ongoing cybersecurity training
    is vital to the success of an organization. It allows for all employees to be
    up-to-date on the current policies in place and their role and responsibility
    if an incident does occur.


    There is a tendency at organizations to suggest solutions that do not consider
    the complexity of the issue of cybercrime in its entirety. However, technologies
    are emerging that have a broad potential future and which do not require organizations
    to build their own system in house, such as Blockchain. Blockchain applications
    offer interesting tools to facilitate the process of transferring sensitive information.
    The Blockchain design is cryptographically secure, extremely hard to change without
    permitted access, and updatable only with consensus among all parties in the chain.
    Those organizations that have realized they need to take their cybersecurity policies
    seriously have taken an interest in the technology and are investing in its R&D
    and testing. Blockchain may possess the ability to radically change and enhance
    the business world at a fundamental level because every 10 minutes, all transactions
    conducted are verified, cleared, and stored in a block.


    There were some issues raised in this pilot study that were unexpected. Although
    this pilot study reached its aims, there were some unavoidable limitations and
    shortcomings. First of all, the research was conducted in a one month period.
    Four weeks is not enough to do justice to and fully understand cybersecurity experts’
    perceptions, opinions, beliefs and attitudes towards cybersecurity policies at
    organizations. The results would have been more conclusive if the method had been
    applied over a longer timeframe.


    Second, the sample size of the respondent group is small. Only eight respondents
    might not represent the majority of the experts in the cybersecurity industry.
    Additionally, the first round initial survey, was designed to gain a basic understanding
    of cybersecurity policies and protection mechanisms at organizations. However,
    it seemed to not provide enough evidence of the impact cybercrimes are having
    on organizations. In addition to this, two of the eight respondents dropped out
    after the first round. This hinders the Delphi Method process, and reduced the
    sample size of the second round collection of richer data. The intent of the Delphi
    Method is to properly analyze the experts’ statements regarding cybersecurity.
    Therefore, the results are more reliable if multiple iterations are able to be
    conducted. Despite these limitations, the pilot study research presented key insights
    into cybersecurity policies and the future of Blockchain technology. A recommendation
    for a larger scale study of this type is to offer an incentive for respondents
    who are willing and able to participate in every iteration round. Doing so, would
    potentially attract the attention of more experts and increase the likelihood
    that respondents don’t drop out.


    Ultimately, there are new technologies becoming available that offer the ability
    to strengthen the cybersecurity policy at an organization. The experts in this
    study concurred that, currently, too many organizations do not have an effective
    or validated cybersecurity policy manual. Data is the critical dependency of organizations
    worldwide, and protecting the integrity of it needs to be of top priority. There
    is no advantage to waiting for the government to take action, it is the responsibility
    of the organization to strengthen its cybersecurity policies. There is an endless
    stream of practical benefits that flow from Blockchain'
