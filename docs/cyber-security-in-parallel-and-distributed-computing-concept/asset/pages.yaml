  md: 'systems do not have a global clock, hence the need for synchronization becomes
    more evident for proper functioning of all components in the network.


    **Scalability:** Scalability issues arise when a system is not well equipped to
    handle a sudden boost of any number of resources or number of users or both. The
    architecture and algorithms must be efficiently used in this situation. Scalability
    can be thought of comprising primarily three dimensions:


    +   - **Size:** Size represents the number of users and resources to be processed.
    Difficulty that arises in this scenario is overloading.

    +   - **Geography:** Geography represents the distance linking users and resources.
    The difficulty that arises in this scenario is communication reliability.

    +   - **Administration:** As the dimension of distributed systems grows, many
    of the nodes need to be controlled. The difficulty that arises in this scenario
    administrative chaos [3].


    **Openness and Extensibility:** Interfaces should be alienated and openly obtainable
    to facilitate trouble-free additions to existing components and those components
    that are freshly put in [2]. If the well-defined interfaces for a system are available,
    it is easier for developers to insert fresh features or substitute components
    in the future. Openness issues become serious when an already published content
    is suddenly taken back or reversed. Besides, often than not there is no central
    authority in open distributed systems, as dissimilar systems may have their personal
    mediator. For example, organizations like Facebook, Twitter, etc., allow developers
    to build their own software interactively through their API [2].


    **Migration and Load Balancing:** Some sense of independency must exist among
    tasks and users or applications so that when certain tasks are required to move
    within the system, other tasks of users or applications are not affected and in
    order to get to get a better performance out of the system, the load must be distributed
    among the available resources.


    # 7.2 Identifying Cyber Requirements


    Before putting ourselves into the world of the Internet, a few things need to
    be very clear in our minds if we need to distance ourselves from cyberbullies
    or prevent any privacy breach of our personal data. As a matter of fact, having
    answers to a few layman’s questions would really come in handy before we start
    our journey in this cyber world.


    +   - Who has a certified way in? (*Would address issues related to confidentiality*).

    +   - Who is allowed to craft alterations to the information? (*Would address
    issues related to integrity*).

    +   - When is there a need to access the data? (*Would address issues related
    to availability*) [4].


    Confidentiality, integrity and availability, also known as the CIA triad, is a
    framework of standards to provide data security to a company. It is also called
    the AIC triad in order to avoid any confusion with the Central Intelligence Agency.


    In this context, confidentiality ensures that the information is received by the
    correct person for whom the information was actually intended by the sender. Integrity
    ensures the'
