    # Figure 9.12 Simulink model for partial covering with snow


    bypass these cells preventing their overheating or damaging. The modified model
    is given in Figure 9.12. The model has as inputs the solar irradiation and temperature
    and these are feed from the real data sources. As we can see the model considers
    three bypass diodes, one for each three groups of 20 PV cells (for a total of
    60 PV cells per panel). Partial covering of the PV panel with snow is simulated
    by modifying the irradiation of the corresponding group of cells. Data for solar
    irradiation and temperature are input in the model using the signal builder block
    that takes data provided in csv files. For the PV cells considered covered with
    snow, an attenuation factor was used taking into account that snow has a high
    albedo (usually between 70% and 90%). Things are more complex as in [34] is shown
    that snow albedo can change not only with temperature increase that result in
    snow grains getting bigger, but also with the level of cloudiness and presence
    of other particles (dust, soot). Further researches will try to establish if a
    more precise modeling is necessary, for example taking into account also a snow
    melting model such as in [29].


    Figure 9.13 presents data collected from weather ministrations (irradiation, temperature
    and precipitation) that are used to feed the model of PV panels partially covered
    with snow.'
