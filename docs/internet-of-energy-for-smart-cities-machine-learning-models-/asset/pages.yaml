    # 7.2.2.4 Reinforcement Learning Model


    Reinforcement learning is a class of ML algorithm which allows the software agents
    and machines to automatically determine the ideal behavior with a specific context
    to maximize its performance. These learning models interact with both the environments
    and the learning agents. The learning agent leverages two mechanisms namely, explantation
    and exploitation. When learning agent acts as “trial and error” basis it is termed
    as exploration, and when it acts on the knowledge gained based on the environment
    it is referred to as exploitation. The environment rewards the agent for the correct
    actions and the agent improves the environment knowledge to select the next action
    [9].


    In Figure 7.17, if the machine is confused about whether the fruit is an apple
    or not; then the machine is trained using a reinforcement learning algorithm.
    If the system makes the correct decision it gets a reward point for it and in
    the case of a wrong decision, it gets a penalty. Once the training is done, the
    machine can easily identify which one of them is an apple.


    The applications for reinforcement machine learning algorithms are given below.


    Banking Sector: In the banking sector, reinforcement learning is used to create
    the next best offer model for a call center by building a predictive model that
    learns over time as users accept and reject offers made by the sales staff. Healthcare
    Sector: In the healthcare sector, it is used to allocate the scars medical resources
    to handle different types of ER cases by building a mark of the decision process
    that learns treatment strategy for each type of ER cases.'
