    The use of advanced signal processing techniques, artificial intelligence, big
    data, and other types of computational analysis, is a good opportunity to overcome
    the obstacles presented, together with driving technologies that become powerful
    in these aspects.


    Finally, interruption events caused by network incidents or even natural catastrophes,
    are undesirable and become a challenge for the current electrical system and society
    as a whole. This type of event should be viewed more carefully.'
