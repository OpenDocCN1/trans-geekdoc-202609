    A lot of data is generated by different constituents of an IoE that need big data
    analytics and cloud computing for its processing [4, 40]. A computing platform
    for IoE using big data analytics and cloud computing is described in [20]. In
    case of Internet Data Centers (IDC), optimization of the energy consumption is
    a challenging task [2, 7]. The data centers that are geographically far apart
    may communicate about their energy demands using a data network and the loads
    of data centers can be transferred to one another for the purpose of load balancing.
    A scheme for managing energy in data centers based on workload optimization and
    CCHP is described in [42]. IDCs need to be equipped with energy storage devices
    for uninterrupted operation in case of emergencies. A description of the requirements
    and standards for storage of energy in data centers is provided in [3, 6, 36,
    71]. It is discussed that energy storage devices should also draw energy from
    renewable energy sources.


    There is a trend to reduce air pollution using renewable energy systems. An IoE
    makes the use of renewable energy systems easy and viable. It helps in reducing
    the air pollution using IoT enabled devices. Conversely, the use of IoE helps
    in improving the quality of air in a smart city. The impact of proliferation of
    IoE on the quality of air in China is evaluated in [41] using a spatial regression
    model in a smart city. An analysis of correlation between urban development and
    energy development is carried out in [13] to predict the development of clean
    and green energy in cities.


    In a smart city, corporations that are responsible for power supply and consumer
    sites are connected through an IoE. There are many advantages of IoE in a smart
    city. For example, faults at consumer sites can be detected and remedial actions
    can be taken as soon as possible. The demands of energy for different constituents
    of a smart city can be estimated and a provision of a supply of an equivalent
    amount of energy can be made through an IoE. The demands in peak hours can be
    estimated and the pricing of energy can be determined to optimize the revenues
    generated by power supply corporations.'
