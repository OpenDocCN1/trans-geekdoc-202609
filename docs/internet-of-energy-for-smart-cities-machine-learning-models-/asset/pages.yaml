    # 9.2 SOLAR PANEL MONITORING


    Today PV parks are complex systems based on advanced technologies that support
    not only solar energy conversion, interaction with load, storage systems and network
    grid but also generation of useful information which is communicated via communication
    channels to be used for monitoring, sustain of their daily system operation and
    interaction with the working environment and human personnel.


    As shown in Figure 9.1 the PV panel monitoring systems monitor the PV panels in
    their environment, perform continuous assessment of their physical and functional
    integrity (remote monitoring) and gather data from different sources in order
    to analyze system’s behavior and to improve operational performance.


    The aim of PV monitoring system is to improve system operational conditions and
    functionality, as well as to ensure system safe and secure interaction with other
    systems. Beside, in the case of PV parks it is useful to continuous monitor the
    large number of PV panels as it constitutes a real support also for maintenance
    teams.


    The devices that are generating data used for processing by the monitoring system
    can be part of the PV system or can be distributed in the local or enlarged environment
    (defining thus an intelligence at an environmental level). In this respect, a
    minimal list of characteristics that the monitoring system must implement includes
    compatibility with PV control systems, local and wide area connectivity, accuracy
    of collected data and security, all these in a frame of low power consumption.


    The many possibilities of monitoring systems include:


    Normal operation recognition (availability of sun radiation, identifying the good
    tilting angle, possibility of either consuming or storing the generated energy).'
