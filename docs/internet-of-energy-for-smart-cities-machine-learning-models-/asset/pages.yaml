    # 5.5 CONCLUSION


    The requirement of smart services in increasing day by day because of the numerous
    projects towards improving the infrastructure and smart tools and techniques.
    Cities are facing a number of energy related challenges, including the data security
    and privacy, infrastructure, cost and legislation. Each one of these must be taken-up
