    # Figure 7.5 Simple linear regression model


    **Linear Regression:** Linear regression is a statistical model used to predict
    the relationship between independence and dependent variables by examining two
    factors. The first one is to examine which variables, in particular, are significant
    predictors of the outcomes variables, and the second important judgment is how
    significant is the regression line to make predictions with the highest possible
    accuracy.


    As linear regression is drawing a line between variables, the simplest form of
    a simple linear regression equation with one dependent and one independent variable
    represented by:


    ```

    y = m * x + c

    ```


    +   - y is the dependent variable

    +   - x is the independent variable

    +   - m is the slope of the line; m = (y2-y1)/(x2-x1)

    +   - c is the coefficient of the line


    Suppose we are going to plot the amount of crop yield based on the amount of rainfall.
    As we cannot change the rainfall, so this is considered as independent variable
    x. On the other hand, the amount of crop growing is dependent on rainfall, hence,
    crop yield is considered as dependent variable y. We can take this and draw a
    line in the middle of data, we find the regression line that is seen in Figure
    7.5 where we can easily predict the amount of crop production with the amount
    of rainfall.


    If there are more than one independent variables, then the equation for multiple
    linear regression changes to:


    ```

    y = m_1 * x_1 + m_2 * x_2 + .... + m_n * x_n + c

    ```'
