    # 9.7.3 WEATHER STATION PROTOTYPE


    Though some PV systems can include different sensors that collect data which are
    used in the control algorithms of sun tracking systems and conversion devices,
    these are not available to the user of the system. Therefore, in order to collect
    data local to PV panels, to be used in monitoring PV park operation, a weather
    station (WS) was developed. The WS which is described in [9] was developed based
    on a 32-bit microcontroller development board and includes sensors for temperature,
    humidity, thermal radiation, pressure, storm lightning activity and modules for
    wireless communication and GPS localization.


    Data collected from different sensor can be displayed locally using an OLED display
    and can also be stored on an SD memory. The software for the station prototype
    was developed using the Arduino development environment. Figure 9.8 shows a picture
    of the WS prototype.


    # 9.7.4 DATA SOURCES


    # 9.7.4.1 Data from PV System


    Data from PV system are collected using the MATE device (part of the PV panels
    control system) that can provide real-time data about system status, battery status,
    and configuration data for the managed inverters and charge controllers. Data
    can be'
