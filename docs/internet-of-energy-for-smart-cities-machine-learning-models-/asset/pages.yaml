    future of power systems. In this way, the technologies and the electrical network
    itself will be able to deal with the technical and multidisciplinary challenges
    in a more efficient and comprehensive method, in addition to having the possibility
    of being centered on human development. Figure 3.9 summarizes the framework of
    the approach.


