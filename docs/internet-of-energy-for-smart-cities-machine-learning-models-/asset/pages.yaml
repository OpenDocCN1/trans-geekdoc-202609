    # 4.2 CONSTITUENTS OF SMART CITIES


    A smart city provides an adequate quality of life to its inhabitants and makes
    the life of its citizen easy and livable. Figure 4.1 shows the constituents of
    a smart city such as residential buildings, transport system, markets, education
    system, water supply system, food supply system, transport system, energy supply
    system, healthcare system, sanitation system, banking system, industries and security
    and policing, etc. All these systems exist to help the inhabitants of a city for
    making their life easy to live. Many researchers have focused on smart cities
    from different perspectives. A description of the characteristics and components
    of a smart city is presented in [46]. There are six key components of a smart
    city namely people, economy, governance, technology, living, and environment.
    Therein, a seventh component called built environment is added to the list of
    key components of a smart city. It has been discussed that too much emphasis on
    Information Communication Technology (ICT) and business led models may have an
    adverse effect on interface dynamics of a smart city. A consideration of the built
    environment reveals that there should be a balance between the existing and arising
    infrastructures for a feasible development of a smart city. Geospatial data may
    help in planning, designing, and operation of a smart city. A survey of research
    related to an improvement of services in smart cities using spatial computing
    is described in [67]. It is discussed that a Geographical Information'
