  md: '# 9.7.5.2 Data Preprocessing


    In order to ensure data quality and taking into account that data is collected
    from different sources, a pre-processing step was performed with the following
    objectives:


    +   - handling missing data due to communication errors or small periods of interrupted
    communication between the collecting system and data sources;

    +   - size reduction of data set;

    +   - aligning data to a unique daily timestamp frame as data collection or recording
    can be affected by the server executing other tasks;

    +   - synchronization of different data sources taking into account different
    frequencies used for measurement or publishing data;

    +   - elimination of time frames outside the interest range (e.g. night time);

    +   - filtering the measurement noise;

    +   - encoding variables.


    # 9.7.5.3 Model Selection


    The research presented in this chapter extends the results given in [17] where
    the PV panels have been observed with respect to their coverage with snow in the
    period December 2018 and January 2019. The ML techniques are applied in order
    to predict status (covered or not) of panels in a PV park based on data collected
    from the three different sources presented in Data Collection section. In our
    work we have tested different classification techniques i.e. logistic regression
    (LR), k near neighbors (KNN), support vector machine (SVM) and random forest (RF).
    We have applied these techniques on the same set of data, using the same training/test
    split percentage and compared the accuracy of prediction of the trained models
    when applied to the test set.


    # 9.7.5.4 Feature Selection


    By accessing the control and conversion system of the PV panels using the MATE
    devices we can read more than 35 parameters corresponding to instantaneous values
    of currents and voltages in different circuits of the conversion system, generated
    power and accumulated values of current or flowing energy through the system.
    In addition, we can collect system status data such as “Charging”, “Inverting”,
    “AC Use”, “AC Drop” etc. Studies in literature and work in [17] shows that prediction
    is improved if we can select a good set of parameters to be used in the training
    process. Table 9.4, reproduced in this work from [17] for comparison purposes,
    shows the result for selecting different parameter set.


    # 9.7.5.5 Training and Validation


    Training and validation of the model was performed using Python and machine learning
    algorithms implemented in the sklearn library [36]. The development environment
    used to code the ML algorithm was the Python Notebook.'
