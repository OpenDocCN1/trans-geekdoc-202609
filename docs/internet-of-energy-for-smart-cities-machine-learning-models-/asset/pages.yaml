    # ## 2.6 CHALLENGES OF IMPLEMENTING SMART GRID


    To design a smart grid is not free from challenges like other technologies as
    it includes technical, social, and economic constraints. Technical challenges
    are generally considered to integrate several distributed generators including
    renewable and non-renewable with the grid where social acceptance is also becoming
    an important issue. Sometimes money/funds are considered the most important barrier
    to design a smart grid. The details of all three challenges are given below:


    # ### 2.6.1 TECHNICAL CHALLENGES


    Inadequacies in framework foundation: In most creating nations, the network framework
    isn''t sufficiently adequate to oblige the upcoming needs of the smart grid [32].
    Several challenges may arise in the design, erection, operation, and maintenance.
    Some grids are not possible to convert from the old grid to the modern smart grid
    as there is less opportunity to do so due to space facilities. The re-installation
    of the plant is somehow mandatory and proper relocation of the heavy types of
    equipment needs healthy cost and time.


    Cyber security: To connect the grid into a cyber network caused the number of
    challenges in the system specially due to security and communication issue. In
    the research paper [32], the authors mainly addressed and discussed three major
    issues, i.e. availability, integrity, and confidentiality. Availability implies
    dependable and ideal access to the database and other data. Integrity alludes
    to insurance from inappropriate organization of data, though, confidentiality
    incorporates giving security from unapproved access to the data. Cyber-security
    is viewed as one of the huge issues for the grid operation as if any hack has
    happened is becomes a matter of disaster for the utilities as well as for the
    consumers. There are some common cyber threats are hackers, zero-day, malware,
    etc. These challenges are not easy to handle if they are applied to the grid.
    A smart grid consists of a multilayer of structure and'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'each layer is defined for specific security concerns. The cyber threats are
    not limited to a certain type of number therefore, it is required to build-up
    higher technology to provide good protection against these threats [36].


    Storage concerns: The smart grid is incorporated with renewable energy sources
    and as renewable energy is not uniform i.e. its output power as well as voltage
    or frequency has a varying characteristic, it needs to store in a storage device
    like battery, however, the life cycle of battery is limited maximum 4-5 years.
    There are some other storage technologies like flywheels, thermal storage, hydrogen
    storage, etc. are also available. Some country prefers to use pumped storage technique
    which has efficiency in the range of 70-85%. However, the main problem of the
    pumped storage method is that it requires a large area as reservoirs which are
    normally available only in the mountain-side. Generating electricity from offshore
    and onshore are becoming popular in recent time as wind turbines are capable to
    extract a huge amount of energy from wind. However, to store this energy sometimes
    become challenging. To absorb and deliver energy quickly into the grid, many researchers
    suggested flywheel technology, however, it is not stable for a longer duration.
    Batteries are mostly used to store energy and it is considered the most common
    traditional method as batteries are portable, however, they suffer from low energy
    density, high weight, and size. Additionally, batteries need to maintain manually
    on a regular basis. To increase the efficiency and reduce the cost of the battery
    is mandatory because battery storage technologies are expensive. For a large scale
    of storage, Advanced Lead Acid Batteries, Flow Batteries, and Lithium-Ion Batteries
    are the other options but they are expensive also [43].


    Data management: Real-time meters, sensors, and controllers are used to make the
    grid smart in collaboration with the information source such as security cameras,
    weather forecasts, etc. that can successively increase the capacity of the operators
    [6].


    By the precise examination of the information, breakdown or damage could be maintained
    before occurrence. Also, this large information can be utilized for framework
    activity, alerts, forecasting demand, generation, cost, and so forth. The data
    is huge, for example, the meter that traditionally billed once in a month, the
    meter of the smart grid takes the reading after 15 minutes increased the number
    of data approximately 300 times. In the grid, although the huge amount of data
    is not too much problem to collect and store but to process the data it is becoming
    challenging, therefore, database supervision is a vibrant issue in SG. The overall
    process of the smart grid may slow down to handle and process large amounts of
    data and define the standers. In this scenario, cloud-based technology may be
    helpful to process big data.


    Communication issues: Although, with the wide range of communication technologies
    available to the growth of the smart grid, each and every technology suffers from
    certain limitations. Some are suffering from limited bandwidth while others are
    suffering from higher data loss and lesser'
  merge: -1
  img_proc: true
