- pgno: 231
  md: 'In the following example, we want to apply the same operation to all the samples
    in an N samples dataset. In this case, N is four. If it takes T time units to
    perform this operation on each sample, then sequential processing the time to
    apply that operation to all samples, is N times T. If we have a cluster of four
    processors, we can distribute the data across the four processors. Each process
    operates on the dataset subset of N over four samples. The processing of the four
    subsets of the data is done in parallel. That is, the subsets are processed at
    the same time. The distributed approach’s processing time is approximately N over
    four times T plus any overhead required to merge the subset results and maybe
    shuffle them (Figure 8.5). This is a speedup of nearly four times over the sequential
    approach [13].


    +   - Time to execute operation – T

    +   - N:T-Sequential execution

    +   - Overhead to merge subset results - O

    +   - N / 4 + O: Parallel execution


    ![](img/617e854c2620a5a4bed0116cef33155a_231_0.png)


    # Figure 8.5 Speed up four times by dividing data into four subsets


    A distributed computing platform such as Spark or Hadoop, scalable machine learning
    algorithms, uses the same scale-out approach. Data is distributed across different
    processors, which operate on the data subsets in parallel using map-reduce, and
    other distributed parallel transformations. This allows for machine learning techniques
    to be applied to large volumes of data. The Spark and its scalable machine learning
    library, MLF, provides a way to apply machine learning to big data. This is the
    processing of machine learning, where the data resides. Furthermore, it is called
    the Big Data Approach. However, it is also possible to scale up the machine learning
    algorithms by paralyzing such algorithms and using big data processing synchronically
    [14].'
