    # 8.5.1 MODEL PERFORMANCE ANALYSIS (ERROR)


    The errors in machine learning models are defined depending on which type of problem
    it tries to answer. Simply, the error is when predicted values or classes are
    different from the true ones. The measurement or criteria for calculating error
    in classification and regression algorithms are discussed in the following.


    There most common metrics to calculate model performance for regression algorithms
    are mean square error (MSE), root mean square error (RMSE), and mean absolute
    percentage error (MAPE). In many cases, root mean square error is favorable to
    use since taking root of the error is proportional to the variable''s units and
    gives us a better understanding of its range. There is also an R-squared error
    measurement to see how correlated the prediction values are with the actual values.
    It ranges between 0 and 1, and higher values mean the trained model has been fitted
    on data with better accuracy. In the classification algorithms, the precision
    of models defines as if predicted labels are the same as the actual ones there
    is no error. Otherwise, if the predicted class is different from true class, there
    is an error. In this case, the total error is calculated on how many classes are
    mispredicted over the entire dataset as a percentage.'
  merge: -1
  img_proc: true
