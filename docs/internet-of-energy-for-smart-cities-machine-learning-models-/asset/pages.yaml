    center. The home sensor network (HSN) is acting as a user interface, which is
    responsible of energy flow control, sensing, and monitoring. Home gateway and
    control center (HGCC) is acting as an interfacing device between the service provider
    and the customer to provide intelligence energy management operations.


    ![](img/617e854c2620a5a4bed0116cef33155a_169_0.png)


