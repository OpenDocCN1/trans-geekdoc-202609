    x be the input and y is the output; we can write a function like y = f(x). The
    goal is to do a mapping so well that whenever it has a new input data x it could
    predict the output of y.


    In other words, supervised ML methods, where each instance of a training data
    set is composed of different input attributes and an extracted output. The input
