    # 3.3.1 THE COMMUNICATION STRUCTURE AND TECHNOLOGIES


    The ICTs have already been presented as one of the major drivers for the development
    of SGs. The trend of electric power systems is to present communication at all
    levels of the network, in addition to the present one with high performance in
    the generation, transmission, and mainly in distribution. These technologies assist
    in the coordination of network systems, providing an exchange of bidirectional
    information, facilitating management, and facilitating data exchange between agents
    and various equipment [33]. In the context of distributed generation and the greater
    need to manage the generation resources that are also present in distribution,
    the key role of this type of technology is more evident.


    In terms of communication, the electrical networks are based on the Wide Area
    Network (WAN), consisting of central control systems that facilitate the operation
    and traffic of information. With the advances in ICTs and the emergence of other
    concepts in the energy supply chain, other forms of communication have been adapted
    or incorporated.


    In this way, the communication systems of the electric grid can be used in two
    more ways, the Neighborhood Area Networks (NAN) and the Home Area Networks (HAN).
    These network expansions are mainly linked to the new structure with distributed
    resources and consumer participation, in addition to a bidirectional flow of information
    and energy. Figure 3.10 shows the communication infrastructure of the SGs.


    The main difference between these networks is in the coverage and transmission
    rate. HAN operates for residential or small applications with low data transmission
    (bps). Already, NAN operated in a larger amplitude covering distribution areas
    serviced by a substation for example, with a higher transmission rate (Kbps).
    Finally, WAN covers kilometers in length and has a higher transmission rate (Gbps).
    Moreover, the communication of all SG’s components including operator control
    center, main and renewable energy generation, transmission and distribution, is
    based on WAN [34]. Table 3.3 shows the main technologies used in each sub-network.'
