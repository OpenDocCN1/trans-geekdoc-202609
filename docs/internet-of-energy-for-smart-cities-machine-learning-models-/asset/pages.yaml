  md: 'available historical data. The quantity and quality of data are equally important
    for obtaining an accurate model.


    +   2. Data preparation. Data can come from different sources with different characteristics
    (frequency, accuracy, range etc). Data must be put together and sometimes must
    be anonymized. Another important part of data preparation related to its split
    in two parts, the training set and the evaluation set. A typical split of the
    data is the one where training set is 80% and the evaluation set is 20% of the
    data set.


    +   3. Choosing a model. Machine learning is an old but also hot topic; therefore,
    many models have been created to suit for different types of data such as text,
    images, sounds, sequences, numerical data and so on. It is important to choose
    the right model for available data. Sometimes is good to test different models
    and some techniques are based on combining several models.


    +   4. Training. It is the step where the model is trained based on the training
    set. A better training increases the ability of the model to predict the result.
    A better training can mean using a larger training set but also using a more accurate
    labeling of the training set.


    +   5. Evaluation. It is the step when the trained model is evaluated by testing
    it against the evaluation set.


    +   6. Parameter tuning. Models have parameters that can be adjusted resulting
    in an improvement of the performance. Sometimes even small parameter tuning can
    result in a significant increase of performance.


    +   7. Prediction. The last step is the one when the developed model is put to
    work and used to make predictions.


    # 9.7 CASE STUDY OF SYSTEM FOR PV PANEL MONITORING


    # 9.7.1 PHOTOVOLTAIC SYSTEMS IN ROMANIA


    In Romania there have been started many solar park projects since 2005. The installation
    of photovoltaic parks has seen an irregular development with, for example, year
    2019 reporting zero MW capacity installation. Even so, Romania is positioned slightly
    above the middle of the EU countries ranking in terms of installed solar photovoltaic
    capacity and also when considering electricity production from solar photovoltaic
    systems. The last Photovoltaic Barometer published by EUROBSERV’ER in April 2020
    [14] shows that Romania has a cumulated solar capacity of 1385.8 MW. Given that
    Romania is part of the U.E. each kW of green energy is paid for by the government
    with green certificates, an additional reason not to miss this opportunity. In
    addition, the return on investment is estimated at 4–5 years, depending on the
    area, and the guarantee of solar panels (not taking into account as a calculation
    the rest of the equipment) is 20 years and increases with the improvement of the
    manufacturing process and the materials used.


    The existent solar parks differ not only is sizes and generation capacities but
    also in types of solar panels installed and type of usage of produced energy.
    The average area of the solar parks is between 20 and 50 ha. Actually around 5000
    ha'
