  md: 'One of the important conditions that a photovoltaic panel must meet to ensure
    maximum efficiency is to capture the maximum amount of incident solar radiation
    to be converted into electricity inside photovoltaic cells. The fulfillment of
    this condition is influenced by several factors, among which we mention the positioning
    of the panel, the lack of obstacles in the path of radiation from sun to the PV
    cell, the radiation transmission coefficient from the incident surface through
    the protective layers to the semiconductor junctions where the conversion takes
    place.


    The reduction in the amount of radiation received by photovoltaic cells can be
    caused by shading, by the obstruction of cells by materials (water, snow, dust,
    sand, mud) or objects of different sizes (vegetation in form of hay, leaves or
    tree branches, plastic films, other garbage) or due to the decrease in the transparency
    of the protective layers. These changes are directly reflected in the operation
    of the panels whose performance decreases, numerous studies being conducted to
    identify as accurately as possible these negative effects [3, 8, 26].


    In order to remove negative effects as soon as possible, the defective operation
    status of the PV panels must be detected at an early stage and properly identified
    to initiate the appropriate maintenance actions.


    The rapidity of identification depends on the location and size of the PV park,
    methods used (visual inspection which depends on visibility and weather conditions
    and experience of inspection person or other automated methods which can use system
    local or global information).


    Correct prediction of the occurrence of a defective situation can help in taking
    preventive action in advance, limiting the decrease in PV panel efficiency and
    therefore of its output. Recently, machine learning techniques have gained attention
    and started to be used in different aspects related to PV panels.


    In [39] the authors are presenting a research in which the Gaussian process is
    used in computing panels maximum power point (MPP) when there is a variation of
    the environment parameters. As the output of the PV panels depends on the amount
    of solar radiation, estimating the Daily Mean Solar power can be used to predict
    the resulting generated power.


    Machine learning techniques can be very efficient also for classification purposes
    [4, 20, 22]. In the area of PV applications, these techniques have been used for
    classification of events occurring in networks that include PV systems [33], classification
    of defective operation of solar panels caused by breaks, dust, snow or weeds [6,
    35]. If such events result in reduction of stability and controllability of the
    system, it is important to detect them as soon as possible and take rapid measures
    to correct the situation. Different models have been proposed and studied, the
    use of tensor flow [15] and artificial neural networks [19] resulted to have given
    the best results.


    Machine learning techniques can be applied if there is a lot of data that can
    be used to train and validate a model that can then be used for prediction [28].
    In the case of PV systems, the advance of technology allows on one side the embedding
    or addition of relevant sensors and on the other side, the provision of data from
    the conversion and controlling devices of the system. In addition, as environment
    plays an'
