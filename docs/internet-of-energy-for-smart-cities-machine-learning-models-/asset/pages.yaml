  md: 'be carried out. The pricing of energy can be based on the processing of the
    data collected and its analysis. For that purpose, the energy meters installed
    at homes, buildings, departments, and offices in a smart city should have sensors
    to collect data and forward it to control stations for further processing. Alternatively,
    the old energy meters should be phased out or upgraded to add the desired functionality.


    Industries should be encouraged to use energy-efficient machines for producing
    their items. The companies making electrical and electronic devices should be
    encouraged to produce energy-efficient and cost-effective devices and equipment
    such as home appliances, fans, geysers, refrigerators, washing machines, dish
    washers, cooking ovens, computers, mobile phones, space heaters, and air conditioners.


    All lights on streets and roads should draw energy from solar panels. However,
    after the depletion of solar energies, they should switch to draw the energy from
    the smart grid. Old lights on streets and roads should be phased out and should
    be replaced with the latest cost-effective and energy-efficient lights. Consumers
    should be encouraged to produce and use energy from renewable resources such as
    solar power. Incentives should be provided for production of solar energy at consumer
    premises and its transfer to the smart grid.


    Battery chargeable electric vehicles such as bikes, auto rickshaws, cars, and
    buses should be proliferated and encouraged to be used. In each smart city, there
    should be proper public transport system and its use should be encouraged. At
    peak hours when the demand of energy is high, either the generation of power should
    be increased or consumers should reduce their loads. Alternatively, incentives
    should be provided to consumers to use appliances requiring more power in non-peak
    hours. The incentives can be in various forms e.g. in terms of reduced rates in
    off-peak hours.


