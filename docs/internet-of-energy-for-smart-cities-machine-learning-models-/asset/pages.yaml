    An energy management system (EMS) refers to the power grid control center, which
    takes charge of monitoring and mission management, beside of its important role
    in power system operation’s safety and stability, it represent a core factor in
    development of IoE architecture [11]. The EMS-based architecture in (E. Hossain,
    2012), developed an EMS system based on home sensor and actuator network (HSANET)
    installed at a customer location [12]. At service provider location data and service
    center (DSC) is installed.


    Major structure components employed by EMS are shown in Figure 6.3, where basic
    information infrastructure is represented by the HSANET which include a'
