    # 6.7 CONCLUSION


    The emerging adoption of IoT technology in energy systems and applications is
    referred to by IoE, which involves an integration of information communication
    technology with different energy or power systems components from generation,
    transformation, storage, distribution, and end-devices consumption. Figure 6.16
    shows the IoE design layers and architecture at the different levels of energy
    network. Development in ICT is rapidly growth and features are introducing consequently,
    cloud computing, fog or edge computing, and blockchain are modern solutions for
    internet-based applications. Those ICT technologies can introduce an efficient,
    reliable, secure, and flexible infrastructure for IoE real-world implementations,
    which defines the IoE architecture. Standards, recommendations, and best practices
    are the important documents required for optimal and efficient design and deployments
    of modern technology applications in various perspectives such as interoperability,
    scalability, security and privacy. That standards are introduced by an international
    associations and institutes.'
