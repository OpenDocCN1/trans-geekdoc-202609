    # 1.2 SMART ENERGY DISTRIBUTION


    Among the various forms of energy flowing in a network, electricity has been identified
    to play a prominent role owing to its central role in modern life, and increasing
    contribution in the total energy use, popularly known as electrification of the
    society. Consequently, the electric grid is undergoing a shift in generation mix
    with increased integration of RES in the electrical power system. Due to the continuously
    increasing loads, the electric grid is constantly stressed while trying to meet
    the generation-load balance at all times. The electrical power transmission infrastructure,
    in its present form, in most parts of the world, has been in existence for decades.
    Consequently, a significant portion of the transmission infrastructure is faced
    with the challenge of accelerated aging due to higher loads for increased duration.
    This poses greater risks of equipment failures, and their cascaded effects may
    eventually leads to brownouts and blackouts. While this raises concerns over energy
    security and access, augmenting the transmission infrastructure is a highly capital-intensive
    task.


    Rising average and elevated peaks in a load-duration curve correspond to adverse
    effects on the power system. These include higher losses, congestion, capacity
    challenges and operating limit violations. Network losses are inevitable and are
    governed by the Joule effect, represented by ohmic (I^2R) loss. It is, thus, evident
    that ohmic losses are higher in distribution systems which have higher R/X ratio,
    as compared to transmission networks which have lower values of the R/X ratio.
    It is estimated that distribution system line losses constitute 13% of total power
    generation [40]. This highlights the fact that management of power flow in a distribution
    network is imminent for achieving favorable network performance, with lower losses,
    higher reliability of power and improved energy security without having the need
    for huge capital investments for transmission network augmentation.'
