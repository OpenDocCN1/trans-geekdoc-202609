  md: '# ## 10.3 METHODOLOGY


    This project aims to control the electrical appliances like fans and LEDs inside
    the lab/room/office considering the problem of access control and it''s solutions.
    Before getting into the implementation details, let''s ponder into the details
    of the components used.


    Raspberry Pi - It is a very basic and cost-effective computer that runs on Linux
    OS, and provides a set of GPIO (general purpose input/output) pins that allows
    one to control electronic components for physical computing, and explore the Internet
    of Things (IoT).


    Relay Module - It is a separate hardware device used for remote device switching.
    It helps to remotely control devices over a network or the Internet. Devices can
    be remotely powered ON or OFF with commands coming from the raspberry pi. It helps
    to control computers, peripherals or other powered devices from across the office
    or across the world.


    ![](img/617e854c2620a5a4bed0116cef33155a_289_0.png)


    Figure 10.1 Privileged access control


    # ## 10.3.1 PRIVILEGED ACCESS


    If any user having the application can control any of the appliances remotely
    of the lab/room/office, it might cause a nuisance if the user misuses it. To overcome'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'this problem, the project has a privileged access control system. The approach
    is to grant and revoke access permissions to only selected users by the user of
    higher privilege level (here, Admins) as and when needed. Django Rest Framework
    is used in the prototype to implement a multi-user hierarchy and permissions are
    managed according to the requirements, via the mobile application. Figure 10.1
    shows the privileged access control mechanism.


    ![](img/617e854c2620a5a4bed0116cef33155a_290_0.png)


