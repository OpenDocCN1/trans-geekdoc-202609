    # 4.7 INFRASTRUCTURE REQUIRED FOR IOE


    In a smart city, collection of data about consumption of energy by homes, industrial
    units, offices, departments, hotels, academic units, etc., should be automated.
    Also, collection of data about generation of energy by all these units should
    also be automated to compute the effective energy requirements of a smart city.
    An analysis of energy consumption such as maximum, minimum, and average energy
    consumption during a day, a month, and a year should be carried out. Such an analysis
    can help in estimating the requirements of energy and detecting anomalous behavior
    or possibility of a fault so that appropriate actions can be taken in a timely
    manner.


    Similarly, an analysis of energy generated by resources within the smart city
    should be carried out. An analysis of losses of energy in distribution should
    also'
