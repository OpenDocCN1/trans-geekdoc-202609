    (in the mountains, in sheepfolds or in the fields), to produce energy for their
    own consumption or using solar energy to pump water for the irrigation systems.


    Other farmers solved their electricity supply problems by developing a parallel
    business from the sale of surplus produced energy, something that farmers in Western
