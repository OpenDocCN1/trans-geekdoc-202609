    # ## 4.1 INTRODUCTION


    A smart city provides an adequate quality of life to its inhabitants using technological
    advancements. The data collected by different constituent departments and organizations
    of a smart city can be processed to improve the quality of services provided to
    its people. A smart city makes the life of its citizens easy and livable. A smart
    city should have necessary amenities for its inhabitants. For example, a smart
    city should have adequate water supply, energy supply, transport, schools, hospitals,
    etc. Out of these amenities, proper management of energy supply is crucial as
    it is required in all walks of life of the inhabitants of a smart city [5, 29,
    30].


    Application of networking to manage generation and consumption of energy for its
    effective utilization is called Internet of Energy (IoE). An IoE enables to enhance
    the utilization of energy and helps to mitigate the losses. It provides an infrastructure
    for communication of demands and supply of energy among producer and consumer
    sites. An IoE is perceived as a web enabled smart grid in [10]. An IoE enables
    to improve the quality of services provided to end users and optimize the revenues
    generated by energy providers. A description of preliminary concepts about IoE'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'emphasizing its impact on electric mobility is provided in [63]. In [28], an
    IoE is perceived as an infrastructure that consists of smart sensor networks with
    schemes to manage the huge amount of data for smart grids [33]. Therein, different
    applications of smart sensor networks in case of smart grids are described. The
    role of IoE in different sections of smart power systems is studied in [58]. The
    supply and demand side sections of energy considered are renewable energy, bulk
    energy storage, power plant, and operation. Therein, the energy management in
    case of microgrids, vehicles to grid, and smart buildings is also considered.


    Many researchers have focused on IoE from different perspectives [32]. A survey
    of IoT solutions for energy management in buildings that are part of a smart city
    is presented in [38]. A survey of research from the point of view of operation
    and planning of IoE is presented in [11]. It contains a description of an integrated
    energy system that consists of power systems and other related systems such as
    cooling & heating, natural gas, and traffic systems. Also, it contains a description
    of Combined Cooling & Heating Power (CCHP) system. A survey of IoE from the view
    point of its architecture and techniques is presented in [64]. Monitoring and
    control of energy requirements of buildings is carried out using Building Energy
    Management Systems (BEMS). There are buildings that consume as well as generate
    energy. The buildings where the effective energy consumption is zero or negligible
    are called net Zero Energy Buildings (nZEB). A survey of issues involved in IoE
    based BEMS is described in [22] taking into account nZEBs.


    An overview of IoE based BEMS is presented in [49]. To solve the problems of energy
    data loss and overloading, a BEM is proposed. A survey of research describing
    the role of battery energy storage stations in IoE is carried out in [66]. It
    contains a description of the characteristics and key technologies for battery
    energy storage at power stations. A review of applications of Internet of Things
    (IoT) in case of energy sector with an emphasis on smart grids is presented in
    [48]. It contains a description of challenges in deploying IoT pertaining to security
    and their possible solutions using blockchain technology. Table 4.1 presents a
    summary of research surveys related to IoE.


    An analysis of indices to evaluate energy efficiency in case of IoE is carried
    out in [59] based on the principles of thermodynamics. The indices evaluated are
    related to different sections of energy such as generation, transmission, conversion,
    storage, and consumption. These indices may help in the design and optimization
    of an IoE. The effect of different modes of energy utilization in regional IoEs
    is described in [74]. The modes of a regional IoE studied for utilizing energy
    are centralized, distributed, and mixed. Also, a comparison of the characteristics
    and applications of these modes is provided. A reference model for IoE called
    Open System Interconnection for Energy (OSI-E) is presented in [73]. It consists
    of the following five layers: access, transmission, distribution & control, strategy,
    and application. The accommodation of renewable energy in IoE is described in
    [72]. It contains a description of the key factors affecting the inclusion of
    renewable energy together with technologies such as optimal dispatch, integrated
    energy system and consumption of energy at customer sites. The use of IoE networks
    as a potential technology of future to manage energy with important lessons is
    described in [35].'
