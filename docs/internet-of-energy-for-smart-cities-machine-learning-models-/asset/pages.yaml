  md: '# 10.1 INTRODUCTION


    The concept of the Internet of Energy (IoE) [1] is derived from the concept of
    the Internet of Things (IoT) [2, 3], which uses the Internet to access and connect
    appliances. The concept behind the term IoE was to create more efficient and automatic
    systems that specifically dealt with appliances like bulbs, fans, and other energy
    appliances which when connected using a system, and developed using principles
    of IoE helps in minimizing energy consumption and wastage of energy using the
    systematic infrastructure of appliances. IoE based infrastructures mainly have
    generation, transmission, and efficient usage of energy.


    Energy consumption in heating, ventilation and air conditioning (HVAC) typically
    accounts for half of energy consumption in buildings [4]. If we could think of
    some way, using which we can minimize the energy that gets wasted in our daily
    routine activities then, we can individually save an ample amount of energy on
    a daily basis. This could not only save the light units but also lead to taking
    a step towards finding innovative and efficient solutions for harvesting energy
    for our own good.


    IoT has played a multidisciplinary role in the development of smart devices and
    control systems substituting the use of wired systems with the computer interfaced
    system alternatives in many industries. Home Automation [5, 6] is an excellent
    example of the ubiquitous nature of the application of IoT where interfaces like
    buttons and switches in normal houses are substituted by a central control system
    allowing easy access of devices with smartphones. IoT can be regarded as a system
    constituting devices in the real world, and sensors [7] attached or combined to
    these devices and connected to the Internet via wired and wireless network structure.
    Several types of connections and standards can be used for IoT sensors like Bluetooth,
    Wi-Fi, and ZigBee with technologies like GSM, GPRS, 3G, and LTE to provide wide
    area connectivity [8, 9].


    Computer Vision is another interdisciplinary scientific field that adds intelligence
    to such control systems. It relates to providing computers with an understanding
    of digital images or videos.


    We can utilize the power of these technologies by combining them together to have
    complete control over the connected appliances and minimize the power consumption
    by detecting the presence of people and turning ON or OFF the appliances accordingly.
    One important question that could arise while managing the appliances remotely
    is managing the access to those appliances when implementing in a building or
    an organization, where a large number of people are involved and many of them
    could have access to many locations within the organization.


    Providing privileged access to each user on the basis of his/her privilege level
    is the call. This project provides the prototype solution for implementing remote
    access with privileged access-rights along with automatic control. The users can
    have access with the help of the mobile application where manual control has the
    priority over automatic control.


    The mobile application for our prototype is developed using the Flutter framework
    so as to have cross-platform support and have applications for both Android as
    well as iOS. The prototype is built taking into consideration the scenario of
    a'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'college/university with three privilege levels as:


    *Super-admin:* has privilege to create or delete users and locations,


    *Admins:* can manage permissions to allotted locations by granting and revoking
    ac-cess to and from the Students (or employees in an organization).


    *Students (or employees in an organization):* can only access appliances of locations
    he/she is permitted to by Admin(s).


    The higher class has all the privileges as its lower class but not vice versa.
    The users can check the *live* status of the appliances at permitted locations.
    This is how strict monitoring and managing permissions can be done in a big organization
    (here, a college/university) and it can also avoid any misbehavior. Most importantly,
    it would result in an effective minimization of the power consumption that usually
    occurs due to the appliances left ON until someone encounters this and turns it
    OFF. It can also turn out to be helpful when one wishes to put ON appliances such
    as an air conditioner a few minutes before going to that location by remotely
    accessing from where he/she is.


    # 10.2 RELATED WORK


    Wireless Home Automation System (WHAS) involves communications, control, and information
    processing across various systems all done over the internet using IoT. To control
    basic home appliances remotely via computer or mobile devices, home automation
    systems using ZigBee use wireless sensors between the controller and user section
    [10]. The transmission process involves the input fed from mobile or PC through
    a web application and the receiver section ZigBee RX receiving the information
    processes the required output. The microcontroller is implemented in WHAS and
    once the wireless connection is created, the system implements a transmitter-receiver
    to establish a ZigBee connection.


    Controlling raspberry pi GPIO wirelessly [12] can be done using Bluetooth or a
    web server. But connecting it with Bluetooth creates a problem (an issue) to control
    the device remotely, thus to make a connection remote, one can create their own
    web server, which will control the GPIO with the help of HTTP requests. The simplest
    way to create a web server is to use the Flask library. So, whenever a request
    is made, a block of code is executed, and that block contains the code to control
    the specific GPIO pin to control it remotely.


    An IoT based surveillance and control system for devices using ESP module and
    Wi-Fi [13] can be used to continuously track the state, i.e. ON or OFF, and working
    condition of electrical devices by operating them from a central remote location.
    It grants access and manages both indoor and outdoor lighting. It checks for defects
    in the devices using sensors and sends an alert using analog signals, on encountering
    a defect to make the system more efficient. In order to reduce or minimize the'
  merge: -1
  img_proc: true
