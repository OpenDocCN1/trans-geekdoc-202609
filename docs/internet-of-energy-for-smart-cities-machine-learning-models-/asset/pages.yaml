  md: '# ## 9.5.1.4 Cloud Services


    Possessing accurate weather information at the right time has become a necessity
    for many businesses that get impacted more frequently by the recent climate changes
    and increase in the extreme meteorological phenomena [1]. Energy generation is
    one of the sectors that can be affected by weather events and renewable systems
    are among the most sensitive part of the energy segment.


    The increasing amount of collected meteorological data and better accuracy of
    weather forecasts based on this data has increased users confidence in using this
    kind of data for analysis and making predictions important for different activities.


    In the case of monitoring PV parks operation, meteorological data can be used
    to prevent damages of PV panels due to extreme phenomena, identification of long
    periods of non friendly conditions of operation, identification of disturbing
    transitory conditions, all that can result in a degrading capacity of PV panels
    operation.


    Meteorological data are available now via different services, many of them accessible
    via Internet. From the existent sources, we have considered the ones that are
    freely available and those which provide an easy access to the data via a dedicated
    API.


    Among the services we have analyzed we can mention AccuWeather, OpenWeatherMap
    (openweathermap.org), DarkSky (darksky.net), Troposphere (troposphere.io). The
    free versions of data access are limited to a certain number of data per day,
    the frequency of the data and the length of historical data that can be retrieved
    from their databases.


    # ## 9.5.1.5 Alerting Systems


    As presented in section 1, PV can be damaged by extreme weather events. Therefore,
    in their monitoring process it is useful to take into account this type of events
    that may take place in the area where these panels are located, to be predicted,
    to be detected and to take appropriate measures.


    These kinds of events are requiring special attention not only because they can
    cause material damages to the PV panels, but in some cases they can result also
    in loss of human lives.


    Alerting systems have been developed by many countries and they provide useful
    information to administration bodies at different territorial levels, to state
    or private companies and even to individual persons. In recent years, there have
    been put into action programs such as the Severe Weather Information Centre of
    World Meteorological Organization, World Meteorological Organization’s World Weather
    & Climate Extremes Archive from Arizona State University and others that integrate
    national or regional systems at a continental or even a global level. These systems
    allow the identification of extreme phenomena and their global alertness, because
    their effects can span (directly or indirectly) over large geographical areas,
    exceeding the boarders of a single country.


    European National Meteorological Services have grouped together in the EU-METNET
    network which aims to provide a functional structure that can organize in'
