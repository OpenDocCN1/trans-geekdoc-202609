  md: '# Table 3.1

    Power Quality Issues Associated with SGs


    | Quality Issue | Short Definition | Example |

    |---|---|---|

    | Overvoltage | An increased in the effective voltage greater than 1.1 pu for
    a period greater than 1 min (1.1 pu to 1.2 pu). | Solar panels connected to low-voltage
    networks result in over-voltages. |

    | Voltage Fluctuations | A series of voltage changes or a cyclical variation of
    the voltage envelope. | Caused by wind turbines and photovoltaic generators due
    to the fluctuations in wind speed and solar radiation. |

    | Harmonics | Harmonics are sinusoidal voltages or currents with frequencies that
    are integer multiples of the frequency at which the supply system was designed
    to operate (called the fundamental 50 Hz or 60 Hz). | Even more harmonic emission
    from electronic inverters/converters, EV Chargers, etc. |

    | Interharmonics | A frequency component of a periodic quantity that is not an
    integer multiple of the frequency at which the supply system is operating (e.g.
    50 Hz, 60 Hz). | Wind generators converters also emit interharmonics. |

    | Supraharmonics | High-frequency components in 2-150 kHz range. | High switching
    PV inverters emit this type of disturbance. |

    | Flicker | The subjective impression of the floating luminance caused by voltage
    fluctuations. | Repeated start-up of heat pumps may result in visible light flicker.
    |


    Source: Definitions from “IEEE Recommended Practice for Monitoring Electric Power
    Quality” in IEEE Std 1159-2019, vol., no. (2019): 1-98.


    Note: Listed are the most common phenomena that are associated with Smart Grids.'
  merge: -1
