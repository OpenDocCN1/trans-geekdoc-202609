    # 2.1 INTRODUCTION


    The journey of electricity begins with human civilization and it is considered
    one of the most important innovations in the civilized world as the fire was that
    of ancient times. Electricity is one of our lifeline items and it can be very
    hard for us to live in a modern society with electricity. Therefore, there is
    no other option that we cannot ignore the need for electricity and its importance
    in our daily life. We are used to electricity in such a way that without it, even
    a day, it becomes quite impossible for us to stay and lead our life. In the 19th
    century, the energy was generally cultivated from coal, furnish oil, gas, and
    various types of fossil fuel which was sufficient at that time. However, with
    the increasing world population, it will significantly increase the demand for
    electricity and fossil fuel. If this trend of high consumption of fuel continues
    in the next decade the world will face a huge shortage of fossil fuel. Therefore,
    with the increasing demand for electricity in recent years, it is quite impossible
    to meet up the demand with the traditional grid system [13].


    In this context, the fast exhaustion of petroleum product assets and ecological
    concern has given a consciousness of the generation of renewable energy resources.
    Therefore, many researchers suggested cultivating more and more energy from green
    sources for example solar, wind, and biogas.


