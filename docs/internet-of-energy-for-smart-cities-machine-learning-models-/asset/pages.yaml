    In 1960, Supervisory Control And Data Acquisition (SCADA) framework, which appeared
    in Figure 2.4, is utilized to improve reliability and make the distribution framework
    partially automated. In spite of the fact that SCADA is not a particular innovation
    yet but is utilized for the modern procedure. The essential design of the SCADA
    framework is given in Figure 2.4 and basic components are discussed below.


    Remote telemetry units (RTUs): The system is liable for interacting with sensors
    and it collects the sensed data into standard form and finally sends data to the
    monitoring station.


    Programmable logic controller (PLCs): This device is used for control and automation,
    for example, the operation of circuit breakers are maintained by PLC.


    Master station: It is utilized to gather information from RTUs and examination
    it at that point sends commands to the PLCs.


    Database: It is used to store data for further analysis and to make a prediction
    in the future.


    Human Machine Interfaces (HMIs): After analyzing the data, it makes a simplified
    model to easily understand for the operator, hence, it helps to make a supervisory
    decision. A communication infrastructure connects the HMI with other SCADA components.


    This SCADA system was installed in every substation and transmission network to
    connect the remote station with the grid [4]. With the updating technology, most
    vendors updated and added more features with the SCADA and provided the opportunity
    to better control and protect the power grid, for example, Modbus [44], IEC 61850
    [12]. The architecture of SCADA was developed overtime to interconnect more SCADA
    through a wide area network [40]. However, the system is not suitable for implementing
    the fully automated next-generation power system.


    In the traditional power system, it provides less information to the utility grid
    and has a few control from the generating terminal. Here, the transmission line
    is carefully monitored and a real-time monitoring system is not occurring, however,
    only some metering system is limitedly applied to the distribution grids to observe
    the supplied voltage and other parameters. Some generating stations can control
    some parameters like voltage and frequency remotely, however, most of the utilities
    use some remote equipment that can only sense voltage and other parameters and
    generate power from the predefined value.


    Due to limited metering and communications from a substation and feeder point,
    it provides less information on line loss, voltage sag, transformer loading to
    the generating station. Additionally, traditional grid face challenge to integrate
    several renewable energy sources such as solar energy, wind energy, etc. due to
    lack of communication and remote control from the utility grid. The increasing
    number of electric vehicles also limits the capacity of the traditional grid.'
