  md: '# 11.3 ROLES OF BIG DATA AND CONTEXT-SPECIFIC LEARNING IN FUTURE IOE


    In future IoE it is expected that machine-to-machine and human-to-machine communications
    will significantly dominate the conventional human-to-human interaction via communication
    networks. This also implies that, much data needs to be communicated and processed
    by the machines for close-to-human ability of decision making. Thus, big data
    communication, storage, and processing/analytics will play major role [88]. The
    following two subsections highlight context-specific roles, challenges, and the
    new paradigm of data-driven optimization strategies. While there are multitude
    of evolving gadgets in future IoE, a few example IoT applications are highlighted
    that are expected to have large-scale impact in future smart cities.


    # 11.3.1 ROLES AND CHALLENGES OF BIG DATA


    To illustrate the roles and challenges of big data, we first consider two typical
    modern IoT applications. In smart grid data communication from PMUs to PDC, while
    frequent sampling and real-time data reporting facilitate in timely control actions
    for preserving grid stability, high volume of data for communication bandwidth
    and storage needs [43, 51]. For instance, a study in [66] has noted that data
    transmitted from 100 PMUs at 30 samples/s to a PDC is over 50 GB data per day.
    A related big data handling application has been smart meter based fast monitoring
    of power consumption of appliances. Millions of smart meters that are being installed
    across the world for commercial and domestic power consumption monitoring purposes
    generate large volume of data. As noted in [6]. The accumulated volume is expected
    to be up to the order of hundreds of terabytes per year in near future. Considering
    practical examples, it was recently shown in [106, 113] that, although at the
    individual level a smart meter may generate about 5 kB of data in every 15 minutes,
    collective volume from a hundred million of such devices can be as high as 2920
    TB in a year. Usually these IoT devices sample at high rate and report the whole
    data to the cloud. In this process large amount of energy is consumed at the IoT
    node for transmission of the data, large bandwidth is used for transmission over
    the Internet, and also storage requirement to save this enormous data is very
    high. However, resource-efficient communication and storage of this vast data
    remain a challenging task. From the perspectives of the Internet service providers''
    bandwidth consumption as well as storage cost, loading the network unnecessarily
    is undesirable [102, 105, 106, 113].


    A similar case of data explosion arises from wireless IoT sensor networks from
    multitudes of applications, namely, environmental monitoring, industrial process
    monitoring, smart home, smart agriculture, smart wearables, remote healthcare,
    city and remote area surveillance, etc. Typically, a node has multiple sensing
    parameters, the sensors (such as the electro-chemical reaction or thermal heating
    based pollution sensors) could be individually energy hungry [36], and there could
    be correlation among data collected by the different sensing elements [37]. Depending
    on the application context, data sampling rate could be high, on the order of
    once in'
  merge: -1
  img_proc: true
