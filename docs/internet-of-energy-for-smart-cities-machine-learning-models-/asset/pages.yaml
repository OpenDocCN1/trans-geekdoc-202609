    # 11.2.4 SMART GRID MONITORING


    Power grid connectivity classically serves the electrical power needs for household,
    office, and industrial energy demands. Conventional power generation sources are
    dedicated thermal and hydro power stations. Although the power generation stations
    have predictable rate of generation, the power consumption patterns are somewhat
    unpredictable. Therefore, even in the conventional power transmission and distribution
    systems, there are chances of generation versus consumption imbalance that may
    lead to instability of power grid. Stress on power grid causes frequent occurrences
    of failure events, raising questions on safe and reliable grid operation. Hence,
    for uninterrupted power supply there is a need for monitoring the disturbances
    in power line. The parameters of power grid health monitoring interest include
    phase voltages and currents, their phasor values, and the powerline frequency.
    Intuitively, imparting intelligence, automation, and control to the traditional
    power grid can enhance its load handling capabilities. An old system for power
    grid monitoring is by using supervisory control and data acquisition (SCADA).
    In the modern smart grid this is being replaced by a more network connectivity
    friendly monitoring modules, known as phase monitoring units (PMUs). PMUs periodically
    sample the state of power system and send their data to a remotely located phasor
    data concentrator (PDC) in a control center over a communication network [35].
    An example of PMU placement across the smart grid network in a wide area monitoring
    and control system (WAMCS) is depicted in Figure 11.4.


    As the modern day power grid is more and more connected to renewable energy sources,
    such as solar and wind energy, the power generation is no longer predictable because
    of dynamic stochastic nature of the renewable energy resources. Further, with
    the advent of massive IoT deployment in smart cities and increased demand for
    self-sustainable wireless services, commercial as well as domestic service points,
    which used to be conventionally solely the electricity consumers, are also stating
    to generate renewable energy. Energy demands of these isolated wireless stations
    as well as microgrids with renewable energy sources as well as their energy surpluses
    are sporadic. The surplus energy is fed back to the macro-grid [120]. With the
    distributed power generation into the power grid and sporadic demand from increased
    IoT service nodes, unpredictability of power generation and load further in-'
