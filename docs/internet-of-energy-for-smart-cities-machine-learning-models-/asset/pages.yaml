    Figure 1.4 Illustration of centralized optimization, decomposition, networked
    optimization and non-cooperative optimization [41]


    illustrated in Figure 1.4. Decomposition refers to breakdown of a complex objective
    into multiple smaller problems that are individually solved. Networked optimization
    includes systems where each agent can communicate only with the immediate neighbors.
    This requires optimization algorithms wherein the communication structure is included
    in the model. Non-cooperative games include problems where the agents do not coordinate
    with each other, thus eliminating the requirement for complex coordination protocols
    and communication infrastructure.


    Owing to the specific characteristics of distributed control approaches, the requirements
    of optimization algorithms for these models can be categorized into the following
    two types.


    +   1. Lagrangian decomposition based methods, which include dual decomposition
    and alternating direction method of multipliers.

    +   2. Methods based on Karush–Kuhn–Tucker necessary conditions.


    The various applications of smart power systems which require decentralized control
    are distribution system operations including optimal power flow, demand side management,
    peer-to-peer energy trading, demand response and stability studies. The various
    features of distributed control which favors their application in smart energy
    systems are listed as follows.


    +   1. Computational burden is distributed over a number of agents. This results
    in multiple parallel processes, thereby, reducing the computation time.

    +   2. The networks are immune to single point of failure, and hence have higher
    reliability.

    +   3. An important characteristic of smart energy systems is its modularity,
    which is well supported by distributed control.

    +   4. Distributed control systems support dynamic network topology which is required
    by several transactive energy frameworks.'
