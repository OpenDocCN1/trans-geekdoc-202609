  md: '# ## 2.3 BENEFITS OF SMART GRID SYSTEM


    Traditional power grids face a lot of challenges in managing power system especially
    in the generation, transmission, and distribution. Most of the problems of the
    traditional grid are possible to solve by the concept of the smart grid [49, 28].
    The smart grid offers benefits to both customers and stakeholders for efficient
    operation and management of electricity. Additionally, it increases more reliability
    and continuity of supply by connecting the whole system in communication mode
    [8].


    # ### 2.3.1 TECHNOLOGICAL BENEFITS


    The technological benefits related to smart grid innovation are given as follow:


    *Efficient power transmission:* The main advantage of the smart grid is that it
    ensures efficient power transmission over the long transmission line. Voltage
    parameters can be easily measured remotely by using different sensors and proper
    actions can also be taken to ensure the quality of power.


    *Quicker restoration:* In case of any disturbance, the smart grid is capable of
    quick restoration compared to the conventional grid. Additionally, several minor
    faults can also be cleared automatically and maintain stability with the help
    of an Artificial Intelligence (AI) automated sensor system.


    *Reduced cost:* Smart grid offers lower operation and the executive costs for
    utilities as well as lower power costs for consumers. In the smart grid, the devices
    are connected with each other in a cloud-based environment. Therefore, the task
    like follow up procedure and general data collection become easy and it will significantly
    reduce operational and maintenance cost.


    *Reduced peak demand:* The smart grid provides a wide range of opportunities to
    communicate with smart devices including loads and generators in real-time. In
    peak time when the electric demands increase gradually, the user plays a vital
    role to reduce the peak demand to avoid higher electric tariffs which likewise
    helps to reduce peak power demands [30].


    *Increased use of renewable sources:* The smart grid is an integrated platform
    that generates power from different sources including renewables. Therefore, depending
    upon the load conditions, power plants can extract maximum power from the renewables
    that significantly increase the huge scope to utilize the sustainable power source
    frameworks.


    *Good integration of customers and energy providers:* A good bond between the
    consumers and energy providers are building up as the customers are directly involved
    with the smart grid and ensure both way communication frameworks.'
