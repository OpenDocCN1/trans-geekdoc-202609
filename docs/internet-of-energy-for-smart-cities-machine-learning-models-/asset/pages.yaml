    # 6.6.2 IOE HARDWARE SECURITY


    For some specified hardware components, there is an identified standard recommendation
    introduces by IEEE. Such recommendations like IEEE 1686 [41] which introduces
    the intelligent electronic devices (IEDs) features and functions to be provided
    and accommodate CIP programs are also introduced in this standard. It also addresses
    security procedures related the access, operation, configuration, firmware revision
    and data retrieval from an IED. But communications for the objective of power
    system protection (PSP) referred to by tele-protection are not addressed in this
    standard. IEEE 1689 defines general requirements to protect serial supervisory
    control and data acquisition (SCADA) and communications to maintenance ports of
    remote terminal units or intelligent electronic devices.


    In addition, IEEE 1689 outlines requirements to retrofit legacy control systems
    with security that minimizes needed changes. IEEE P1711 is a trial-use standard
    for a cryptographic protocol for electric sector substation communications using
    serial links [42]. This standard applies to SCADA systems and, in particular,
    the communications between the SCADA master and the intelligent electronic devices
    (IED). The IEEE 1402 guide identifies and discusses security issues related to
    human intervention during the construction, operation (except for natural disasters),
    and'
