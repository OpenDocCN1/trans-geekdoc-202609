    \ Various software platforms are available for formulating smart contracts, such\
    \ as Ethereum Blockchain and Hyperledger Project.\n\nThe three main characteristics\
    \ of a blockchain are decentralization, transparency and immutability. The important\
    \ features of a blockchain which make it suitable for real-time transative operations\
    \ are as follows [22].\n\n+   1. Consensus mechanism which allows necessary agreement\
    \ of all the participant nodes on each operation ensures the integrity of data\
    \ stored in the blockchain.\n+   \n+   2. Communication requirements are minimized\
    \ since each node directly communicates only with the blockchain.\n+   \n+   3.\
    \ It is a completely distributed framework which does not require the involvement\
