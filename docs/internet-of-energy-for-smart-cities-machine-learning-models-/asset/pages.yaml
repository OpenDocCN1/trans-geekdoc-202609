  md: '# 3.2 DESIGN CHALLENGES AND PHILOSOPHICAL CONSIDERATIONS


    This section aims to present the technical and system challenges in the SGs design.
    For this, the main technical barriers are raised to provide an overview that implementations
    and projects must have as a premise to find solutions. To complement this approach
    to the technical aspects of the grid, a holistic debate of the new context in
    which SGs are inserted, looking for highlight the impacts and how these changes
    relate to other systems and stakeholders.


    # 3.2.1 CHALLENGES AND TECHNICAL BARRIERS


    # 3.2.1.1 Renewable Generation Sources


    Several electric grid operators face this new challenge of integrating renewable
    sources into the grid, combined with the characteristic of distributed generation
    [9, 10]. The penetration of these sources has increase each year, in an impressive
    way, which makes the energy distribution and transmission systems need adaptations
    to host this new way of generating energy. The latest report [11] by the International
    Renewable Energy Agency (IRENA) with capacity statistics, confirms this growth.
    Figure 3.1 shows this statistics on the capacity of renewable energy capacity
    in the world.


    ![](img/617e854c2620a5a4bed0116cef33155a_92_0.png)


    Figure 3.1 Total renewable energy world''s capacity


    A very significant feature of this type of generation is the intermittency of
    most sources. With an emphasis on solar PV and wind generation, which stand out
    in the distributed generation market and are widely used in various networks,
    including own use by the end consumer. Thus, with this immense number of generating
    units based on RES in the grid, there is a concern with the degradation of energy
    quality when adding this complexity. Figure 3.2 shows the percentage of growth
    of Wind and Solar PV generation in relation to the total capacity.


    Another issue of concern regarding this large penetration of distributed generation
    is the injection of active energy at the level of medium voltage (MV) and low'
  merge: -1
  img_proc: true
