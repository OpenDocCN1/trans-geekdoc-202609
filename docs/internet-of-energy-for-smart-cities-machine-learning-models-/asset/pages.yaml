    # 5.2 ENERGY CHALLENGES IN IOE


    With the increasing use of social economy the cities and countries have brought
    forth

    many concerns regarding the traffic congestion, severe environmental based green-

    house gas, consumption of energy, extreme expansion of the population,

    and other issues [11]. Even though cities cover-up about 3% of the earth''s

    surface, they consume 75% of the energy resources and produce nearly 80% of

    greenhouse gas [12]. These issues are acutely obstructing the rapid developments
    of

    modern society and metropolitan area. There is the great requirement to control
    the

    energy consumption intelligently and efficiently by the use of effective energy
    consumption

    reduction policies and smart technologies. Therefore, the smart cities must

    be planned by analyzing the various scenarios and strategically taking-up the
    energy

    issues. This become the greatest significance with amalgamate of social resources,

    endorsing industrialized development, and increasing speed of commercial and prof-

    itable transformation [13]. Smart city uses a number of information & communication

    technologies and these technologies, when efficiently used can lead to smart city

    life with low carbon economy and reducing the ecological impact, while improving

    the delivery of services. Additionally, these smart applications and technologies
    with

    the integrations of tools and techniques offer cost-effective and inventive solutions

    to the growing various challenges faced by modern society and metropolitan area

    [13]. However, regardless of the numerous benefits of smart city development plans,

    number of energy based challenges remains when it move towards the deployment

    because of exclusive and sustainable city requirements and contrary interpretations

    of deployment notions. There are a number of energy based challenges faced by
    the

    smart cities, in the present scenario:


    # 5.2.1 RELIABILITY AND SCALABILITY


    A reliable Internet of Energy (IoE) based energy management system can focus for

    the end user''s attention, accordingly, can make sure the accomplishment of the
    sus-

    tainable development objective. Incorrect information, design and decision in
    IoE

    based energy management system has become a major issue in the modern society

    and smart cities that can cause increased disorder and given up for lost and dam-

    age [3]. Additionally, the energy generation level diverges depending on the weather'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'stipulation, and offered power network system ensures from unpredictability
    and unreliability due to the lack of fault analysis, efficient monitoring, and
    maintenance system [14]. Though, the power supply to the end user of smart city
    wants to be secure and reliable with satisfactory power supply. An efficient energy
    storage system with renewable sources can supply continuous power to the consignment
    with balancing power by grid and maintenance the power quality unaffected [15].
    Consequently, selection of substance into the energy storage system, intellectual
    power infrastructure, monitoring and control system for the IoE structural design
    can speed up the growth of an efficient energy management system. Scalability
    signifies the system stability when latest applications, services, or devices
    are attached to the accessible system [16]. The power quality of the system should
    be ensured to handle all worst conditions. Also, the users would like to attain
    latest services consistently; hence the IoE based energy management system of
    smart cities should be very much scalable to support the future enhancement.


    # 5.2.2 SECURITY AND PRIVACY INTENDED FOR DATA ACCESS


    Data collection and analysis is a basic component of the energy management system
    of the smart city. In this point, different types of data, for example perpetuation
    or alternative plans of the utensils, human resource modifications, billing information,
    meter data, and spending of the energy consumption are collected frequently. This
    data is subsequently used to recognize the energy efficient buildings in energy
    management system like: cooling, heating, and lighting. Currently, a lot of data
    is generated from the sub-meters, smart meters, and sensors deployed to evaluate
    the performance of smart cities building. Therefore, selection of tools, classification
    of circuit, equipment assignment, verification of data and metering equipment
    should be reliable enough to support the efficient metering system. There is no
    common security standard specifically designed for IoE (in cooperation of wired
    and wireless network) based energy management system [17]. At this time, there
    is the requirement of advanced security to make sure that this system bring together
    a lot of information and utilizes several keys for user name and passwords [18].
    In accordance with verification and validation, privacy, integrity, reliable and
    unaffected data recording and tracking, save and replace without missing data
    are the requirements of security in support of the application [17, 19]. Furthermore,
    the use of Internet through smart grid can enhance the incidence of a cyber-attacks
    and this can become a major threat to nationalized security [20]. Consequently,
    developments on privacy and security [21], in support of IoE based energy management
    system of smart city can be the excellent increment in economy to extend the quality
    of life of smart cities.


    # 5.2.3 COST AND EXPENDITURE


    The costs of IoE based energy management system of smart city consist of the costs
    of energy, operations, smart appliances, materials of energy storage system, building
    or reconstruction costs, along with the technological and maintenance costs. Earlier
    research of the amalgamation of renewable sources signified that the integration
    costs'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'of solar energy diverge from medium to high [22], though the wind integration
    [23], and geothermal energy costs [24], are still high. Therefore, the technologies
    cost has a tough cause on IoE based energy management system. Additionally, the
    low cost of materials of energy storage system designed for storing the energy
    of renewable sources to make sure the accessibility can be a good option in support
    of the system [25]. Hence, an appropriate stability between the costs of IoE based
    energy management system and greenhouse gas emission should be maintained to make
    certain an efficient energy management to make the sustainable smart city [25].
    Consequently, accomplishing the sustainable and cost-effective IoE based energy
    management system with the amalgamation of renewable sources is a challenging
    issue in support of further advancement of this technology [26]. Community instruction
    and advance research on ecological factors can transform the tendency in this
    regard [27].


    # 5.2.4 CLIMATE CONDITIONS


    Weather and geological location are the most susceptible challenge into the IoE
    based energy management system of smart cities [28]. Cooling and heating, Internet
    supply, telecommunications, ventilation, GHG emission, and thermal comfort-ability
    are considerably persuaded via the climate change [28]. When temperature differs,
    then energy consumption based on the load also differs. Thus, climate is becoming
    a significant determinant in support of planning an efficient energy management
    system for smart city [29]. Also, the wireless devices possibly will not work
    proficiently in insensitive atmosphere. Wind velocity and solar radiation also
    differ quickly that can be vital in support of power supply of the smart city
    systems. Consequently, energy efficient and climate sensitive energy management
    system of smart city is still a major challenge for upcoming augmentation.


    # 5.2.5 LEGISLATION


    Legislators or representatives face some significant issues including verdict
    workable strategies regulating stakeholders, to set free financial growth and
    sustaining reimbursement in support of the city''s population and authorizing
