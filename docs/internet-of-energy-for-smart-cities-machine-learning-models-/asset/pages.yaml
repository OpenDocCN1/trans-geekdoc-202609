    # Figure 2.2 An illustration of islanded microgrid scheme


    A few decades back, the integration with renewable energy with the existing traditional
    grid was not an easy task as the power that is generated from renewable suffer
    from stability problems [10, 7]. For instance, the intensity of the sun varies
    within a day that can produce variable DC power only; whereas, the flow of wind
    also fluctuates in nature and is unpredictable. Therefore, the generated power
    is variable, and it needs to be stabilized before connecting the load. Many researchers
    suggested that to use storage devices (battery) to store the energy. After that
    energy can be converted from DC to AC using inverter to supply to the grid. This
    method of power generation is expensive due to the costs of battery and inverter
    circuits. In some remote areas, where the grid connection is difficult to reach,
    a direct DC power system is used in residential houses for operating light loads
    such as fans and lights. From this, the concept of microgrid is induced.


    The microgrid is a localized and isolated grid that can operate in a small zone
    and used for the electricity supply which is generated by the near-source. However,
    the idea and definition of microgrid are expanded and updated with the need for
    the power grid. Microgrid can be connected with the main grid via point of common
    coupling (PPC) and can receive or deliver power when needed. Therefore, microgrid
    with distributed generation (DG) is considered as an alternative for supplying
    uninterrupted power to the load. The microgrid provides higher efficiency, energy
    security, reliability, economics saving, and sustainability [14]. The microgrid
    system is of interest to researchers because of its ability to run independently
    [14]. The block diagram of a microgrid system is shown in Figure 2.2.


    The microgrid consists of generators such as wind, photovoltaic panel, PCC, energy
    storage element, and controllable loads. The contemplated process of microgrid
    follows two operation conditions. First one is a grid-connected technique and
    the second one is a standalone technique [38].'
