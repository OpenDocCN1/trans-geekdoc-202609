  md: '# 6.4 IOE STANDARDS


    Technical instructions and specification of most ICT applications are standardized
    by Institute of Electronics and Electrical Engineering (IEEE), International Electrotechnical
    Commission (IEC), etc. [46]. To grant demands and reliability of renewable energy,
    IEEE has established multiple standards and guideline to cover ICT aspects across
    many geographic and standards development organization (SDO) boundaries for smart
    energy systems which are summarized in Table 6.1 which illustrates the main IEEE
    standards for smart energy systems.


    # Table 6.1 Main IEEE Standard for Smart Energy Systems


    | Standard Series | Name | Description |

    |---|---|---|

    | IEEE 2030 | Smart Grid Interoperability | Defines data flows in electric power.
    Reliable and secure bidirectional flow. Identifies the necessary communication
    infrastructure for electric vehicles. |

    | IEEE 1901 | Networking and Communications | Addresses broadband/narrowband over
    power line. Addresses many other aspects of networking. |

    | IEEE 1686, IEEE C37.240, and IEEE 17111 series | Cyber Security for Smart Grid
    | Addressing cyber security for intelligent electronic devices and substation
    automation. |

    | IEEE 170X, IEEE 1377, IEEE 2030.5, and IEEE 1901 series | Smart Metering and
    Demand Response | Addresses smart grids communication and protocols. Provides
    smart energy profiles for smart metering functionality. |

    | IEEE 1815 (DNP3), IEC/IEEE 61850-9-3, IEEE C37.238, IEEE C37.118 series | Substation
    Automation | Provides:

    Time protocol.

    Synchronization work.

    Electric power system communication. |

    | IEEE 2030.1.1 | Electric Vehicle Charging | Specify:

    The design interface of electric vehicles.

    Direct current and bidirectional chargers that utilize battery electric vehicles
    as power storage devices. |'
  merge: -1
  img_proc: true
