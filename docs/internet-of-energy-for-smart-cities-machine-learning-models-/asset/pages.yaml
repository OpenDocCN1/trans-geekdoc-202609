    # 1.2.1 DEMAND RESPONSE


    The fundamental goal of every power system is to continuously minimize the generation-load
    imbalance, in order to meet the system loads at an acceptable reliability level
    while ensuring system security and several operational constraints of the various
    power system components [3, 5]. Traditionally, the operation of large interconnected
    power systems was driven by the need to satisfy loads, commonly referred to as
    “load-following” mode of operation. The generation and load control decisions
    in any operating power system is obtained as an instruction by a system operator,
    at different timescales of operation. However, load control decision by the system
    operator traditionally pertained to complete shut-down of aggregated load at the
    substation-level. This type of load control, however, is forced upon and does
    not impart an active role to the users.


    With the development of advanced controllability at the appliance level and adequate
    communication infrastructure, the demand-side has been identified as a potential
    active resource for the power system. Increased penetration of DER, controllable
    loads and energy storage systems enable the customers to respond to grid requirements
    by optimally managing the power flow at the distribution end [17]. Accordingly,
    the operational philosophy of the power system has gradually modified from being
    “generation follows load” to “load follows supply”. This philosophy has been facilitated
    by the emergence of smart energy systems wherein the *plug-and-play* feature and
    *load responsiveness* are important system characteristics. This has led to the
    appropriate coining of the terms *demand response* and *demand side management*,
    which have emerged as the focus of power system planners and operators throughout
    the world.


    The Northwest Power and Conservation Council defines demand response (DR) as “a
    non-persistent intentional change in net electricity usage by end-use customers
    from normal consumptive patterns in response to a request on behalf of, or by,
    a power and/or distribution/transmission system operator. This change is driven
    by an agreement, potentially financial, or tariff between two or more participating
    parties”. In simpler words, demand response refers to strategic actions by distribution
    companies to motivate users to reduce or shift their energy consumption from peak
    to'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'off-peak hours. It is generally a pre-arranged arrangement between the distribution
    company or system operator and load-aggregators or consumers. It provides users
    with an opportunity to manage their power consumption and reshape their load profiles
    in response to varying electricity prices or incentives offered by the operator.


    Around the world, several independent system operators (ISO) and utilities are
    operating DR programs, which include California ISO, New England ISO, Pennsylvania-New
    Jersey-Maryland and Pacific Gas & Electric and Southern California Edison. The
    two major types of DR programs in practice are price-based and incentive-based
    DR programs, which have been discussed below [43].


    +   1. Price-based DR: also known as market-led (economic) DR, refers to programs
    in which users vary their loads in response to fluctuating electricity prices.
    The various time-varying prices which may be offered are defined as follows:


    +   a. Time-of-use (TOU) price: is the electricity pricing mechanism which offers
    different unit prices at different time blocks. Common TOU rates are peak/off-peak
    electricity prices which vary according to time of the day, or seasonal price
    variations.


    +   b. Real-time price (RTP): refers to a dynamic pricing mechanism wherein the
    electricity prices are updated at smaller time intervals such as 1 hour or 15
    minutes. This reflects marginal variations in the cost of electricity production
    during the corresponding time interval.


    +   c. Critical peak price (CPP): is a special pricing mechanism that is designed
    with an objective to balance demand and supply on certain critical load days.
    Thus, during normal periods while TOU is in effect, during certain constrained
    days (critical peak days) the user may either reduce energy consumption or pay
    the critical peak day rates.


    +   2. Incentive-based DR: also known as system-led (emergency/reliability), DR
    refers to programs wherein customers reduce their demand during emergency events,
    such as when the system stability is jeopardized or during the period of price
    spikes.


    +   a. Direct load control (DLC): refers to DR programs in which the operator
    remotely controls user loads and performs direct and complete shut down of the
    loads.


    +   b. Interruptible/curtailable DR: refers to the type of DR programs where users
    volunteer for load reduction during system contingencies in exchange for discounted
    electricity price or bill credit.


    +   c. Demand bidding/buyback (DB): refers to the DR mechanism that imparts an
    active role to users in the competitive electricity market by offering opportunities
    to obtain financial incentives for modifying electricity consumption though bidding.'
