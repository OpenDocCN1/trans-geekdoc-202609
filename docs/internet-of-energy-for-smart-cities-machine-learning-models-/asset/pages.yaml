  md: '_Error rate:_ similarly, the summation of the off-diagonal values divided by
    the total number of predictions.


    The confusion matrix provides very important information regarding a classifier’s
    performance by that it is easily understood the misclassifications’ kinds that
    the model is making by looking at it. For example, when classifying the true negative
    or positive labels is problematic for the model. To sum up, the confusion matrix
    summarizes the various classification error types in a table, in which the diagonal
    and off-diagonal values are used to calculate different performance metrics and
    evaluate a classifier’s overall performance of a learning model. Moreover, it
    represents which type of misclassifications are the most problematic for a classification
    model.


    # 8.5.3.2 Regression Metrics


    The regression evaluation metrics are slightly different from the classification
    metrics because regression learnings output continuous values within a given range.
    The different metrics used to evaluate the regression’s performance include Mean
    Squared Error (MSE), Root-Mean-Squared-Error (RMSE), Mean-Absolute-Error (MAE),
    Mean absolute percentage error (MAPE), and _R_<sup>2</sup> or Coefficient of Determination.


    Mean Square Error (MSE) is widely used to evaluate regression learning results
    since it is differentiable and can be optimized easier. It is defined as the average
    of the squared difference between the actual values and predicted values, as presented
    in equation below, where n is total prediction number. Due to the squares of the
    differences, it considers even a small error and punishes a model for overestimating
    how bad a learning performance is.


    \( MSE = \frac{1}{n} \sum (y - \hat{y})^2 \quad \text{(8.5)} \)


    Root Mean Squared Error (RMSE) is the utmost broadly used metric to evaluate the
    regression’s performance. It is the square root of the average of the squared
    difference between the actual values and predicted values, equation below. It
    is the most preferred metric since it highly penalizes large errors, mostly harming
    a model performance. Thus, RMSE is used when large errors are seriously taken
    into account and are undesired.


    \( RMSE = \sqrt{\frac{1}{n} \sum (y - \hat{y})^2} \quad \text{(8.6)} \)


    Mean Absolute Error (MAE) is the average of the absolute difference between the
    actual value and predicted one, equation below. This metric, which is robust to
    outlier and high error values, unlike the MSE, does not penalize errors extremely.
    Since MAE is a linear score, meaning that all difference has the same weight in
    the metric, it is not proper for applications when the outliers are critical.


    \( MAE = \frac{1}{n} \sum |y - \hat{y}| \quad \text{(8.7)} \)'
