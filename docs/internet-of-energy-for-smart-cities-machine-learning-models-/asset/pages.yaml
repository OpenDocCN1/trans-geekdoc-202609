  md: 'the most common phenomena of this kind we mention:


    +   hail storms;

    +   dust storms;

    +   ice storms;

    +   strong winds;

    +   tornados;

    +   storms with electrical discharges.


    Heavy rain with hail can result in glass broken modules which evidently have important
    loss in power and yield. The problem is that modules that seem to look good, often
    have small damages most of the time invisible to the human eye, which cause them
    also significant loss in power.


    PV panels and parks that face the power of tornados are usually severely damaged
    at panel, panel support and even PV park infrastructure level. Because these are
    evidently highly impacting phenomena, inspection and evaluation of the damages
    are mandatory.


    Lightning strikes, whether direct or indirect, can result in both down time and
    expenses in identifying and replacing damaged parts [7].


    Direct strikes, (rare), would destroy (melt) panels, inverters, etc.


    If panels are not protected, lightning can produce damages whether it strikes
    directly the PV panels or in their nearby [7]. Such an event can produce damages
    both in the electrical circuit of PV system or in its structure. Any of this kind
    of damage will affect PV system operation generating loses due to down time needed
    to identify and fix the problem and replacement costs of damaged parts or entire
    PV panel.


    # 9.4 PREVENTING MEASURES


    In order to prevent or limit the effect of extreme events, it is important to
    obtain useful information about them (possibility of occurrence, moment of occurrence
    or impact, intensity, other characteristics) before their occurrence. This information
    may come from the park’s own monitoring system or from other available sources
    of information.


    Having such information available, various proactive measures can be taken to
    ensure the proper functioning of the system and the prevention of undesirable
    effects such as energy theft [23, 24].


    # 9.5 REAL-TIME DATA ACQUISITION AND ANALYTICS


    # 9.5.1 DATA SOURCES


    Machine learning makes no exception when it comes to photovoltaic systems. In
    order to obtain the best possible models, a large volume of data is needed to
    be used for training the model and to validate it. With respect to PV systems,
    taking into account its highly interaction with the environment, there are numerous
    sources that'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'can be used. In our study we have identified different categories of data sources
    as we can see below:


    data received from sensors placed within the PV park. They can be mounted on the
    PV panels providing information on solar radiation, tilt angle, temperature, humidity,
    shocks, or they can be placed on other components of the photovoltaic park;

    data received from PV panels and their control devices such as inverters, storage
    battery packs, power distributors, power lines, grid connectors etc;

    data collected from small weather stations located in the PV park or in the region
    where the park is located;

    data published by meteorological services that can be accessed from internet using
    dedicated application programming interfaces (APIs);

    data from services computing or collecting astronomical data (in the case of PV
    parks we can be interested in data related to sun position, sunrise, sunset).
    More sophisticated studies can make use of data regarding cloud movement, storm
    or other extreme weather predictions;

    data from cloud services where historical data are stored, integrated, processed
    and where real-time data can be processed, displayed and stored for future use;

    data from geopositioning services that are useful for locating a specific PV park,
    PV panel or data sources (weather stations), for mapping them or for annotating
    data with geographic information;

    data from alert systems provide information not only about severe weather phenomena
    but also about events that can affect PV park operation or can put them in danger.


    # 9.5.1.1 Local Data Acquisition Systems


    Local data acquisition system are relying on a set of sensors which are either
    embedded or mounted on the PV panel with the purpose of acquiring real-time local
    data to be used in controlling algorithms or monitoring system status. They are
    sometimes called weather stations because they measure temperature, pressure,
    dew point, wind direction and strength, level of illumination etc. They work in
    conjunction with gateways which allow them to connect to Internet and send acquired
    data to data centers or cloud services where data is analyzed, stored, process
    and displayed in order to support decision elaboration.


    Usually controlled by a microcontroller, these systems can be extended to also
    collect information related to panel orientation with respect to solar radiation
    (the case of PV panels which include tracking position systems), can perform detection
    of a storm in the near region of the station providing also an estimation of its
    distance, speed, direction of movement and its evolving strength.'
