    consumption of energy, it provides central control over the electrical appliances
    for street lighting systems.


    The electrical appliances at home can be connected to Internet Controlled Switch
    Box [14] to enable controlling them remotely at any time. The smart switch box
    integrates the power supply unit, Wi-Fi switch, relay, two-way switch, and an
    Android application on the mobile device. ESP8266 chip acts as the Wi-Fi device
    with a web socket implemented in it which connects the smart switch box with the
    mobile phone in the same Wi-Fi environment. To turn an appliance ON or OFF, connected
    with the smart box, the design chooses ESP8266 as the main control chip to control
    the relay. Table 10.1 shows the comparison between different wireless technologies
    used to implement smart systems.


    The electrical appliances connected with a remote server can be controlled from
    a remote location using Computer Interfacing [15] by logging in to the server
    PC. To log in, a web page is created where real IP is used or Microsoft remote
    assistance system where virtual IP is used. Once logged in, the client or end-user
    can view the live status of any connected appliance as well as get status updates
    for those appliances via the developed application [16]. The data, consisting
    of the id number of the client PC shows the status of the electrical appliance
    within an instant, is accepted by TCP/IP listener, and then sent to a specific
    port of the desired address over the internet by using the device.


    The REST architecture style was designed specifically for working with components
    such as media components, files, or even objects on a particular hardware device.
    A restful service [17] would use the normal HTTP verbs of get, post, put, and
    delete for working with the required components. Get request is used for retrieving
    the data, post request is used to insert data whereas put request is used to insert
    and update data, and delete request is used for deleting the data respectively.
    REST permits different data formats such as Plain text, HTML, XML, JSON, etc.
    of which the most preferred format for transferring data is JSON.


    Haar cascade [18] is a sequence of square shaped functions which forms a family
    of wavelets or base. Model is trained on positive and negative dataset. Then the
    features are identified by the haar cascades. Features are identified by reiterating
    features over an Image. Here, a large amount of computation, power and time is
    consumed.'
