    huge data can be stolen and modification can also be done by the cyber-attack.
    Therefore, to maintain the faith of the customers, the utility grid needs to provide
    security against all kinds of threats.


    Fear of obsolescence: Day by day, with the development of new technology, old
    products are gradually omitted, however, this is not like that the new product
