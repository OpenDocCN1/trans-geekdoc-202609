    # 2.3.2 BENEFITS TO CUSTOMERS


    The smart grid offers many benefits to consumers, including the following:


    Real-time update on energy usage: The customers can monitor their individual energy
    consumption on a continuous and real-time basis. Therefore, the customers also
    limit their high energy consumption to avoid the high charge of the electric bill.
    Additionally, consumers can easily predict their monthly electric bill, and a
    clean environment is created between the suppliers and consumers.


    Various pricing models: The various pricing models and different tariff are characteristics
    of the smart grid. Therefore, it encourages the customers to use their heavy equipment’s
    operation during off-peak hours to minimize the electric bill. During the peak-hours,
    a high electric charge is imposed to discourage consumers from high consumption
    of energy.


    Proper utilization of off-peak hours: In the smart grid, smart devices such as
    electric cars can be charged during off-peak hours to enjoy reduced electric charge
    [27]. Consequently, that helps the easy grid operation and limits the peak demands
    of the plant.


    Energy contributors: The smart grid is a two-way communication that provides a
    good chance for their customers to become an energy contributor. For example,
    customers can produce energy at their roof-top by installing PV-plants or small
    wind turbines that can also couple with the main grid. Hence, customers can be
    able to provide energy into the main grid and get financial benefits.


    # 2.3.3 BENEFITS TO STAKEHOLDERS


    The smart grid system offers several benefits to stakeholders, including the following:


    Increased grid reliability: The smart grid offers more reliable and maintains
    continuity in grid operation compared to the conventional grid. The use of sensors
    in different devices increases better communication facilities and certainly,
    it accelerates the grid stability and reliability.'
