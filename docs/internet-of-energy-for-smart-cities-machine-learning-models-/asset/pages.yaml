    Solution of a two-stage robust optimization problem requires decomposition techniques
    which have been widely used in literature. These decomposition approaches such
    as Bender’s decomposition and Column and Constraint Generation have the advantages
    of higher computation efficiency and lower solution time. It is also noteworthy
