  md: 'efficiency with the increasing distance. Therefore, to develop a smart grid,
    communication sectors still suffer lots of challenges even most of the communication
    rules are not very much characterized in the SG network. Some technologies like
    GSM, GPRS, PLCC, 3G, ZigBee, Broadband over PLC, etc. GSM and GPRS have a coverage
    range of up to 10 km but they lack data rates. 3G involves the costlier spectrum,
    while ZigBee has approximately 30 m to 50 m coverage range. To solve the distance
    problem wired communication system like power line communication can be used,
    however, it also faces a problem of interferences. Some other researchers proposed
    optical fiber communication but again this is expensive. Another researcher proposed
    RF technology with router-based, however, it also suffers from performance issues
    [23].


    Stability concerns: Distributed generators (Renewable sources) and micro-grids
    are the parts of the smart grid on a large scale of power plants. Distributed
    sources cause bidirectional power flow. In terms of green and low-cost energy
    renewables and microgrid have some certain advantages over the coal or nuclear
    power plant [22]. However, as it has the property of bidirectional power flow,
    with the penetration of a large power plant, it may cause stability problems such
    as:


    +   - Angular dependability because of low inertia

    +   - Voltage stability because of low power-sharing assistance

    +   - Low-frequency power wavering

    +   - Worsening of SG transients profile during MG islanding

    +   - Inability to fill in as framework hold


    Energy management and electric vehicle: Nowadays, the number of electric vehicles
    is increasing and most of the user does not follow any restriction to charge its
    battery [37]. Smart grid influence the customer to charge it on an off-peak hour
    and can also be used as a source during peak hour [31]. That certainly reduces
    the electric bill for the customers and reduces the excessive presser on the grid.
    In this energy management, there is a certain lack to define proper standards
    including:


    +   - The flow of power from vehicle to grid (V2G),

    +   - grid to vehicle (G2V),

    +   - vehicle to vehicle (V2V).

    +   - Controlling of the reactive power

    +   - Controlling of the DC linked voltage

    +   - Supporting of the grid voltage


