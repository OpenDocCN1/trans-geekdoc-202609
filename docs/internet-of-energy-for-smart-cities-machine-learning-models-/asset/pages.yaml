  md: 'controllable energy storage systems, flexible loads, the dimensions of control
    variables are increasing. This significantly increases the complexity of an optimization
    or control model. This leads to very high computational time which is unsuited
    for real-time operations. Thus, for smart energy systems, centralized control
    doesn’t appear as a suitable technique due to the following major reasons.


    +   1. The computational burden increases with greater number of control variables.
    Additionally, the problem may become infeasible as the dimension increases.

    +   2. Transmission of information may become increasingly challenging as and
    when the area under control increases.

    +   3. Centralized control systems suffer from the problem of single point of
    failure, rendering this type of control unsuitable for larger control system where
    the number of entities affected from failure is high.

    +   4. The topology of such systems cannot be easily modified or expanded without
    affecting other system components, which is a basic requirement for modular microgrids.

    +   5. Centralized control of a system requires an extensive communication network
    to control system components.


    # 1.4.2 DECENTRALIZED CONTROL


    Decentralized control refers to the type of control systems where instead of a
    single central controller, multiple localized controllers perform decision making
    in an autonomous and independent manner. The local agents use localized information
    for decision making, and do not depend upon the central control entity. The decision
    of local agents depends upon local measurement of input variables, which minimizes
    the requirement for an extensive communication network, as required by centralized
    control. This also minimizes the risk of single point of failure, and interrupted
    system operation due to communication delays. However, this form of control does
    not guarantee global optima due to absence of communication and information exchange
    among agents. Thus, decentralized control is prone to risks of being trapped in
    local optima and giving sub-optimal solutions.


    # 1.4.3 DISTRIBUTED CONTROL


    Distributed control systems comprises of multiple localized agents which use local
    measurements and information shared by other agents for performing the decision
    making process. The ability to communicate and share information among agents
    guarantees a global optimum for system operation. However, this creates concerns
    for data privacy. A number of communication protocols with data privacy standards
    and encryption algorithms are being developed. Example of this type of control
    is the energy blockchain, discussed in the previous sections. Distributed systems
    may be categorized into three major types: (_i_) decomposition, (_ii_) networked
    optimization and (_iii_) non-cooperative games. A broad distinction between these
    types is'
