    # ### 3.5.1 DISTRIBUTED ENERGY RESOURCES MANAGEMENT


    The Distributed Energy Resources (DERs) management is a leading issue to guarantee
    reliability and quality in distribution systems. Due to the significant insertion
    of distributed renewable sources, coordination became more complex due to the
    intermittent nature of these sources, [54]. The widespread use of metering associated
    with communication technologies has become a great ally in this process, in addition
    to control strategies driven by key technologies.


    The energy concessionaire, Southern California Edison, has a project called Integrated
    Grid Project (IGP) [55], in California, United States of America (USA) whose main
    objective is to ensure effective management of the DERs. The company is one of
    the pioneers and encourages the use of clean energy to reduce CO2 emissions and
    presents several projects aimed at the broad use of advanced technologies in electric
    grids. It is also a goal of the project, to investigate potential architectures
    on the network, and to promote an optimal operation with a high level of penetration
    of distributed resources.


    The IGP is focused on optimizing all DERs assets of third parties or these owned
    by the utility. Thus, the project is organized into three sub-applications. The
    first one is the control of the DER systems, basically voltage control and power
    flow optimization. Another part of the project is focused on integrating the system
    via ICTs. Lastly, the project aims to aggregate participating users to hire their
    private distributed generation. Figure 3.18 shows the scope of project.'
