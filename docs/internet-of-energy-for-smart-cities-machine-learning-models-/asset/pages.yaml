    Figure 4.2 shows the operation of an IoE in a smart city. There are different
    types of major sources of energy or power stations such as nuclear, hydro, thermal,
    and solar power stations feeding a smart grid. There are different categories
    of consumers of energy in a smart city, for example, industries, big commercial
    houses, residential buildings, departments, educational institutes. Some of the
    consumers may also produce solar energy using roof top solar panels and the energy
    generated might be fed to the smart grid. The major steps from the generation
    till the consumption of power are as follows: (i) generation, (ii) transmission,
    (iii) distribution, and (iv) consumption.


    The power is generated at power plants at relatively low voltage ranging from
    2.3 kV to 30 kV that depends on the size of power generating units. It is fed
    to a step up transformer that converts it to high voltage power that is carried
    to distant places using transmission lines. The typical voltage levels for transmission
    are from 115 kV to 765 kV for AC depending on the transmission system and the
    region. Sometimes, lower voltage levels such as 66 kV and 33 kV are used for long
    distance transmission of relatively low power. For long distances, the transmission
    of power using Over Head Power (OHP) cables is preferred over under-ground cables
    due to ease of operation and maintenance. The high voltage transmission reduces
    the loss of energy due to the resistance that depends on the length of the transmission'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'line, conductor, and the amount of current. Specifically, the loss of energy
    during transmission is \( I^2R \) where \( I \) is the current and \( R \) is
    the resistance. Making the voltage high implies decreasing the current and consequently
    reducing the losses during transmission. Further, transmission of power at much
    higher voltage levels such as greater than or equal to 2000 kV is not recommended
    because the loss of energy due to corona effect overcomes the resistive loss.


    From the transmission lines, the power is fed to substations responsible for distributing
    it in a region. The distributing stations use step down transformers to decrease
    the voltage of the power. For distribution in a city or a region, the distribution
    lines use the voltage of 33 kV or less. From the substation, there are distribution
    lines that carry the power toward different types of customers in a locality.
    There are often pole mounted step down transformers that further decrease the
    voltage so that it can be used at the low voltage consumer sites or houses. For
    consumption in residential homes and buildings, the voltage levels are often 240
    V.


    The power stations, substations, and consumers generate a lot of data. This data
    is gathered by sensors and sent toward a computing station housing high computing
    servers and software. The data received by the computing station is processed
    using big data analytics techniques. The processed information is sent toward
    the grid manager that is responsible for sending control signals to different
    entities. Note that there can be more than one computing stations and grid managers
    in a smart city depending on the volume of data to be processed. All these computing
    stations and grid managers may communicate with one another and cooperate in performing
    their functions. Each computing element is responsible to process data gathered
    by sensors in its region. Similarly, each grid manager is responsible to take
    decisions and send control signals to entities in its region.


    A description of architectures and communication technologies for smart grids
    and their transition to IoE is provided in [34]. A software defined network (SDN)
    framework for communication in an IoE is proposed in [44]. The framework is hierarchical
    in nature and contains clusters of microgrids connected to a global grid. An architecture
    of an IoE containing a combination of energy management and control systems is
    proposed in [65]. The architecture contains four layers and the functions of each
    layer are analyzed. The architecture is adaptable, flexible, and comprehensive.
    Prospects of research related to virtual microgrids using IoE are described in
    [69]. It includes a description of the architecture, operation, and key mechanisms
    related to virtual microgrids or virtual power plants. An architecture for an
    IoE with an emphasis on communication in smart grid is presented in [56]. An H-infinity
    based min–max filter is presented to estimate the states of a microgrid. A fog-based
    architecture for IoE to manage the transactive energy is proposed in [47]. The
    architecture consists of home gateways to collect data about energy consumption,
    fog nodes at the network edge to act as retail energy servers, and cloud servers
    to provide high-speed computing and bulk data storage. A summary of research related
    to architectures of IoE is presented in Table 4.5.'
