    voltage (LV) level, this can result in overvoltage, especially when the R/X ratio
    is high as rural grids. Problems with unforeseen islanding and difficulty of protection
    systems to deal with this high number of generation units in the distribution
    network can also be a concern, because the design of previous grid was not foreseen
    for this size of insertion, which requires changes in strategies and infrastructure.
    In addition to these issues, the increasing use of renewable energies and associated
    electronic equipment can increase power quality problems, such as, for example,
    an increase in the harmonics emission and high-frequency emissions (2 – 150 kHz),
    called supra-harmonics.


    A very important point is the balance between load and generation, therefore,
    there is a warning about this high penetration that designs and implementations
    must take into account in order not to overload the system. Therefore, there are
    studies that seek to investigate this capacity of electrical systems to host a
    certain amount of renewable generation without compromising the structure, reliability,
    and security of the network.


    In transmission networks, this large number of new generation units may impact
    the creation of new power flows a concern due to the possibility of overload,
    already mentioned, and lack of operational reserves. As the function of the transmission
    system is to maintain excellent reliability, the aspects discussed in this section,
    such as generation uncertainty, an abrupt increase in generating sources, and
    changes in the operation profile can impair the performance of these networks.
    The Planning of the transmission system used to occur only for two extreme cases:
    maximum consumption and minimum consumption, in which the amount of production
    would change according to the amount of consumption [12]. According to this author,
    two more classes of operations appear that were missing previously, where extremes
    of consumption and generation are not found, further increasing the complexity
    of operations.'
