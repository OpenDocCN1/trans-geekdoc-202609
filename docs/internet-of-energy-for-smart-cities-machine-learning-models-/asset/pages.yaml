    in a reduction in the generated power. Depending of the PV panel internal architecture,
    bypass diodes can be provided for every cell or for a group of cells. In the second
    case, the shadowing effect of a single cell has a greater impact on the overall
    PV panel operation (an entire group of cells are bypassed) than in the first case
    [38].


    ![](img/617e854c2620a5a4bed0116cef33155a_255_0.png)


    # Figure 9.3 PV cells covered at certain degrees level with sand (a) and mud (b)


    This interposition can be temporarily or can be of long term like the deposition
    of dust to the surface of PV cells [10, 13]. Several studies show the negative
    effect of dust deposition and that composition, and therefore color, can impact
    differently the PV cell degradation [26].


    The reduction of PV panels'' efficiency can be produced also by the effect of
    the air, water, salt or other impurities specific to regions located near the
    sea or oceans [40]. The main effects of this exposure is on the optical characteristics
    of solar panels because, the shielding glass can change color or even have its
    structure damaged after a certain period of time.


    Some research has led to the development of additional devices that are attached
    to PV panels to remove impurities that can be deposited on the surface of the
    panels. These devices are based on various principles, the most common being those
    in which impurities are removed either with the help of air jets [41] or with
    the help of water jets. Other solutions consider the use of wiping or brushing
    systems, while another solution presented in [32] uses an electro dynamic screen.
    The cleaning systems can be individual, each panel having its own cleaning system
    or collective, in which case a single system is used, usually mobile, which performs
    the cleaning of several panels in a cleaning operation.


    Another category of phenomena that can have medium to high impact on PV panel
    operation and also on their integrity are the meteorological phenomena. Among'
