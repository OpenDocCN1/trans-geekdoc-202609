  md: '# 9.6 MACHINE LEARNING TECHNIQUES IN PV PANEL OPERATION MONITORING


    The increase of data available from energy source generation systems allows us
    to use machine learning techniques in order to find hidden although natural patterns
    in data that can provide a better insight of systems and processes helping one
    in making better decisions and predictions.


    The use of machine learning algorithms is based on availability of data from which,
    by using different computational methods we can learn relevant information about
    a process directly from data. There is no need to have a mathematical model or
    a set of equations from which to extract the information. The model is obtained
    by learning which subsequently is used for making predictions for newly incoming
    data.


    Based on different learning styles, machine learning algorithms can be divided
    in four different categories:


    Supervised learning: this method is based on a training process for obtaining
    the model. The training process uses data sets including both correct and wrong
    predictions. Corrections are applied to the model when those predictions are wrong.
    The training is an iteration process that ends when the model, using the training
    data, reaches an expected level of accuracy.


    Unsupervised learning: in this method datasets are not labeled, therefore, the
    model is obtained by first identifying existing patterns or structures in the
    input data. This can be obtained by reducing redundancy, by organizing data by
    similarity and extracting non visible rules.


    Semi-Supervised Learning: in this method models are obtained based on datasets
    that contain both labeled and non labeled data. Therefore, algorithms must correct
    the model based on good and wrong predictions but also must identify structures
    in the labeled and non labeled data.


    Reinforcement Learning: in this type of learning the machine is trained to make
    specific decisions. The training is based on a trial and error process in which
    data is feed continuously to the model. The machine is learning from the past
    datasets (experience) and adds knowledge that is used in making the best predictions
    in order to take the next best decisions.


    Another classification of machine learning techniques can be obtained based on
    the method used for solving the problem.


    A summary of machine learning techniques applied in PV system application found
    in literature is given in Table 9.2.


    Applying machine learning technologies can bring a lot of benefits if the techniques
    are well implemented. There are some steps that one can take in order to develop
    a correctly machine learning approach:


    +   1. Gathering data. This is the step of acquiring data or identifying already'
