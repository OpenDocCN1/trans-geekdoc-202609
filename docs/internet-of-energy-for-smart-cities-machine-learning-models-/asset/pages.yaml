    The introduction (Section 3.1) provides an overview and contextualization of the
    subject, presenting the main starting points so that there is an understanding
    of the content detailed in the chapter.


    The following section (Section 3.2), which addresses the main challenges for smart
    grid projects, details these challenges at different levels of the power systems
    of the future. Challenges inherent to the complexity of the electrical network
    in terms of the market, renewable integration sources, quality problems, and cybersecurity
