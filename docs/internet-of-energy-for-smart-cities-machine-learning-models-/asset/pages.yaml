  md: 'Mean absolute percentage error (MAPE) measures the accuracy as a percentage
    by calculating the average of the summation of all difference between the actual
    value and predicted value divided by the actual value. In other words, it is the
    average absolute percent error for each prediction. MAPE is commonly used for
    reporting the model’s performance, while there are not many zero values and no
    extremes to data.


    \( MAPE = \frac{1}{n} \sum \left| \frac{y - \hat{y}}{y} \right| \) (8.8)


    Coefficient of determination or R-squared (\(R^2\)) is the portion of the variance
    in the current model predictions performance from the constant baseline performance,
    presenting how much a model is better than the benchmark or other baseline model.
    The benchmark is chosen by taking the mean of the data and a line representing
    the mean. \(R^2\) is a scale-free metric, thus even the values are extremely low
    or high, this metric always is less or equal to 1.


    \( R^2 = 1 - \frac{\sum (y - \hat{y})}{\sum (y - \bar{y})^2} \) (8.9)


    # 8.5.4 MACHINE LEARNING ALGORITHMS


    As it is mentioned before, machine learning algorithms can also be categorized
    into classification, regression, clustering, and association analysis. In this
    section, the most common supervised learning algorithms, classification, and regression
    are introduced.


    # 8.5.4.1 Classification Algorithms


    There are several classification algorithms; the most commonly used ones are presented
    as follows [24–26]:


    **Logistic Regression:** Logistic regression is widely used for binary classification
    tasks where an output belongs to one class or another (0 or 1). In this algorithm,
    a threshold is defined to indicate examples will be labeled into which class using
    hypothesis and logistic function (usually sigmoid curve). The hypothesis determines
    the likelihood of events to generate data and fit them into the logarithm function
    that forms an S-shaped curve called sigmoid. Then, the logarithm function is used
    to predict the class of new inputs. Logistic regression is also applied to multiclass
    classification problems by applying the one versus all strategy, however, it has
    better performance on binary classification tasks.


    **K-nearest neighbors (KNN):** This algorithm is one the most basic yet broadly
    used classifier, which without making any assumptions on data distribution, finds
    the data with similar characteristics and group them in the'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'same class. The groups are constructed by considering the attributes of the
    neighboring samples. It is used in real-life problems in several applications
    such as data mining, pattern recognition, and invasion detection.


    Naive Bayes: This technique is one of the most potent classification algorithm
    based on an extension of Bayes theorem, assuming each feature is independent to
    capture input-output relationships. The Baye’s Theorem compares the probability
    of happening of an event to what has already happened, for example, the probability
    of having a fire (event A) while the weather is hot (event B, which is present)
    [27]. The naive algorithm is simple to implement and quick to predict labels of
    new inputs. Additionally, when a domain knowledge confirms the feature independence,
    with less data, it has a better performance than other classification algorithms
    such as logistic regression. On the other hand, in real life, it is not easy to
    have data with entirely independent features; moreover, when there is an input
    that was not follow up in the training phase, the algorithm assigns zero probability,
    and it does not classify this input in any group. Generally, this technique is
    used in various applications such as text classification, spam filtering and so
    on.


    Support Vector Machine (SVM): This algorithm is widely used in classification
    tasks while also applied for regression problems. SVM’s main idea is to transfer
    data to higher n-dimensional space to find and ideal hyperplane to differentiate
    classes. In simple words, these support vectors are coordinate of a new n-dimensional
    coordinate system. This method is common to use for binary classification, however,
    it is computationally expensive and slow in the big data domain.


    Decision Tree (DT): This algorithm is based on different hierarchical steps that
    lead to certain decisions. It applies a treelike structure to represent repetitive
    decision paths with induction and pruning steps. In the induction step, the tree
    structure is built, while, in the pruning step, the complexities of the tree are
    reduced. The inputs are mapped to outputs by traversing each path through different
    branches of the tree. DT is the powerful classification tool and simple to structure
    with quick performance. However, with even small variations in data, DT can become
    unstable. Furthermore, it can easily become overfitted, especially in a thorny
    tree with many branches and conditions, thus, do not generalize well on new inputs.
    Regularization, bagging, and boosting techniques are usually used to avoid overfitting
    problem in DT.


    Random Forest (RF): This classifier is very similar to the decision tree, which
    instead of having only one tree, it uses several decision trees. This technique
    can be applied in more massive data set in order to classify data or measure the
    importance of each feature in the final decision. In many applications, the random
    forest is preferred over the decision tree because it'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'can be more accurate and overcome DT''s overfitting problem. However, this
    technique is not easy to implement since it has a complex structure, and it is
    not recommended for real-time prediction purposes because, in general, it is the
    slower model.


    There are many other classification algorithms, but these are fundamental algorithms
    that are commonly used and form other algorithms for classification.


    # 8.5.4.2 Regression Algorithms


    There are several regression algorithms (numerical or continuous value prediction)
    [28. 29]; the most commonly used ones are as follow:


    **Linear Regression:** In simple words, this technique tries to find the fittest
    straight hyperplane to the data. It is commonly used when there are linear relationships
    between variables, and it can avoid overfitting by regularization techniques such
    as LASSO, Elastic-Net, and Ridge. However, it is not flexible in finding the best
    solution for non-linear relationships in variables and complex patterns.


    **Regression Tree:** This technique has the same hierarchical structure as the
    decision tree; instead, it takes the numerical values as an input. The branching
    procedure not only maximizes the learning gain but also learns non-linear relationships
    between variables. Even if this method is robust to outliers and easy to implement,
    it is prone to overfitting problems. In addition to the regression tree, Random
    Forests (RF) and Gradient Boosted Trees (GBM), which are commonly used Ensemble
    methods, are also applied in numerical predictions and have better performance
    concerning overfitting problem.


    **Deep neural network:** Deep neural network or multi-layer neural network is
    widely used in every domain since it can capture complex patterns, which can also
    be used as a classifier. The non-linear relationships between features are learned
    by non-linear activation functions and hidden layers between input and output.
    There are several techniques and methods to improve the neural network''s performance
    as well as different advanced neural network-based models such as Convolutional
    Neural Network (CNN) or Recurrent Neural Network (RNN). The learning engine in
    self-driving cars, speech recognition, computer vision, natural language processing,
    and disease diagnosis is the deep neural network. However, unless other algorithms,
    the intense knowledge in how to tune a neural network model is needed to have
    a perfect neural network model. Besides, neural network models work well in the
    big data domain, and usually, they are very computationally expensive methods.'
