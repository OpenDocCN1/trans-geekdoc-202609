    # 3.4 INTEROPERABILITY AND SCALABILITY


    # 3.4.1 MOVING FOR INTEROPERABILITY IN SMART GRIDS


    The evolution of the energy sector has the main characteristic of being digital.
    Changes in the way of generating, distributing, and consuming energy go through
    a modernization process that is made possible by the wide use of ICTs, applications
    are no longer limited to electrical networks, they are now connected to the consumer
    and to new models of the grid.


    A crucial point to make it increasingly possible to search for a digital electric
    sector is to move toward interoperability. It is the characteristic that allows
    two types of equipment or systems to operate together without any conflict of
    communication or compatibility. This is a very big challenge for power systems
    because each part of the energy supply chain has its standards, protocols, and
    culture to deal with its equipment operations. For this to occur, there must be
    a policy effort and convergence between institutional standards for the electricity
    sector.


    The benefits related to interoperability vary among stakeholders of SG design,
    but everyone benefits from better clarity between operations, greater affordability,
    among other advantages. In this process, there are some difficulties to be overcome,
    following a list of key issues for this process [47].


    +   1. The large number of stakeholders, different considerations, number and
    complexity of standards available (and missing) requires a more formal nationally
    driven governance structure;

    +   2. Since SG efforts are underway, and in some cases complete, standards adoption
    must consider work already completed and underway;

    +   3. Interoperability discussions and definitions should be expanded to focus
    on standards across systems (inter-system) rather than just within systems (intra-system);'
