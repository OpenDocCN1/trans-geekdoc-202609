- pgno: 239
  md: '# ### 8.5.3.1 Classification Metrics


    The model''s performance can be evaluated with different metrics. In classification
    algorithms, four various error types, reported in Table 8.1, are mainly used in
    evaluation metrics.


    Table 8.1


    Different Types of Error


    | True Label | Predicted Label | Error Type |

    | :--- | :--- | :--- |

    | Yes | Yes | True Positive (TP) |

    | No | No | True Negative (TN) |

    | No | Yes | False Positive (FP) |

    | Yes | No | False Negative (FN) |


    The accuracy rate is broadly used as the evaluation metric by dividing the number
    of the correct prediction by the whole number of predictions [21]. In the following
    formulas for the accuracy and error rates, TP, TN, FN, and FP are the summation
    of predictions in each category.


    ```

    Accuracy rate = \frac{\text{Number of correct predictions}}{\text{Total predictions}}
    = \frac{TP + TN}{TP + TN + FP + FN} \quad (8.1)

    ```


    ```

    Error rate = \frac{\text{Number of incorrect predictions}}{\text{Total predictions}}
    = \frac{FN + FP}{TP + TN + FP + FN} = 1 - Accuracrate

    ```


    Besides accuracy and error rate metrics, precision and recall metrics are also
    widely used when an imbalance class of prediction is concerned. The precision
    metric measures the exactness of prediction since it considers the percentage
    of predicted outputs as positive, as presented as follow:


    ```

    Precision = \frac{TP}{TP + FP} = \frac{\text{Positive samples correctly predicted}}{\text{All
    samples predicted as Positive}} \quad (8.2)

    ```


    On the other hand, the recall metric measures predictions'' completeness since
    it considers the percentage of predicted positive outputs that a model identified
    correctly, compare to all true positive. Which is defined as follow:


    ```

    Recall = \frac{TP}{TP + FN} = \frac{\text{Positive samples correctly predicted}}{\text{All
    samples with true label Positive}} \quad (8.3)

    ```


    Additionally, the F-measure is another metric, which is the combination of both
    precision and recall metrics. There are different F-measures types depends on
    the weight of the precision and recall values on its formula. The most common
    ones are reported below:'
  merge: -1
  img_proc: true
- pgno: 240
  md: '$F1 measure$: both precision and recall values have the same weighted average,
    which is presented in the following equation:


    $F1 = 2 \times \frac{\text{Precision} \times \text{Recall}}{\text{Precision} +
    \text{Recall}}$ (8.4)


    $F2 measure$: recall''s weight is higher than precision''s weight


    $F0.5 measure$: precision''s weight is higher than recall''s weight


    The value ranges from zero to one, with higher values giving better classification
    performance [22].


    A confusion matrix is a table to summarize the misclassification error. It is
    used to represent a classifier''s performance while the test dataset''s actual
    values are known [23]. It is relatively simple to understand, however, its terminology
    sometimes can be complicated to implement. Based on actual values and predicted
    ones, four different possibilities are explaining as follows:


    +   - The true positive (TP): this cell includes samples that are correctly predicted
    as positive.

    +   - The true negative (TN): this cell includes samples that are correctly predicted
    as negative.

    +   - The false positive (FP): this cell includes samples that are incorrectly
    predicted as positive.

    +   - The false negative (FN): this cell includes samples that are incorrectly
    predicted as negative.


    Each cell has the count, or percentage of samples, with each type of errors as
    reported in Table 8.2.


    Table 8.2


    **Confusion Matrix**


    | | Predicted Class Label | |

    |---|---|---|

    | | Yes | No |

    | True class label Yes | True Positive (TP) | False Negative (FN) |

    | No | False Positive (FP) | True Negative (TN) |


    In the confusion matrix, the true positive and true negative values, inputs with
    correct outputs predictions, are presented in the diagonal table. On the other
    hand, the off-diagonal values relate to misclassification outputs, inputs with
    incorrect outputs predictions. Therefore, the higher summation of diagonal values
    or the smaller summation of off-diagonal values indicates the better the classifier
    learning model''s overall performance. In the confusion matrix, the metrics are
    defined as follows:


    _Accuracy rate_: the summation of the diagonal values divided by the total number
    of predictions.'
