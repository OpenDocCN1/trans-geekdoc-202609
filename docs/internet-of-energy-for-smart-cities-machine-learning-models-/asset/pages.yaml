    concerns triggered the next major step in the evolution of the electric power
    system toward a flexible network or SG [17].


    As already mentioned in this chapter, the large insertion of RESS together with
    the widespread use of electronic equipment, such as PV inverters, cause impacts
    and power quality problems. In addition, demand side issues, poor resources coordination,
    and poor system integration can contribute to increase in network disturbance
    and problems at different voltage levels. Thus, it is possible to realize, to
    maintain high performance, SGs must present high performance on different sides
    of the operation. Table 3.1 details the quality problems, definitions, and relationship
    with the new network model.


    The table illustrates some quality problems, but the challenges are not limited
    to them. Problems in network operation, interruption, are also happening and can
    generally be associated with contextual changes for the SG.


    An important concept associated mainly with distributed generation is Hosting
    Capacity. This investigation aims to verify how much generation can be associate
    with the system without exceeding the acceptable deterioration limits. For the
    SGs design, this step is of paramount importance. Figure 3.5 illustrates the concept.
    When it comes to recent problems, such as suprarharmonics, greater care must be
