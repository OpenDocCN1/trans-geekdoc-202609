  md: 'Distribution system management has led to the emergence of the concept of *smaller
    energy systems* at different scales of sizes. These include local power distribution
    networks, in contrast to the large interconnected power system, which depending
    upon the system capacity may be categorized as minigrids, microgrids, nanogrids,
    picogrids, etc. [15]. Understandably, the categorization and sizing of smaller
    energy systems differ from country to country as there exists no standard uniformly
    accepted categorization. For instance, in India a minigrid is sized 10-200 kW,
    while a microgrid is smaller than 10 kW, and nanogrids and picogrids are even
    smaller networks. However, in practice, the term microgrid is generally used to
    refer all smaller energy systems despite the size categorization. There exists
    a general consensus over a few common definitions of microgrids which have been
    discussed below.


    # Microgrid Definitions


    **CIGRE C6.22 Working Group:** “A microgrid is a group of interconnected loads
    and distributed energy resources within clearly defined electrical boundaries
    that acts as a single controllable entity with respect to the grid. A microgrid
    can connect and disconnect from the grid to enable it to operate in both grid-connected
    or island-mode” [12].


    **U.S. Department of Energy Microgrid Exchange Group:** “A microgrid is a group
    of interconnected loads and distributed energy resources within clearly defined
    electrical boundaries that acts as a single controllable entity with respect to
    the grid. A microgrid can connect and disconnect from the grid to enable it to
    operate in both grid-connected or island-mode”[10].


    **World Bank:** “Isolated, small-scale distribution networks typically operating
    below 11 kilovolts (kV) that provide power to a localized group of customers and
    produce electricity from small generators, potentially coupled with energy storage
    system” [32].


    **Lawrence Berkeley National Laboratory:** “A small electrical domain connected
    to the grid of no greater than 100 kW and limited to a single building structure
    or primary load or a network of off-grid loads not exceeding 5 kW, both categories
    representing devices (such as DG, batteries, EVs [electric vehicles], and smart
    loads) capable of islanding and/or energy self-sufficiency through some level
    of intelligent DER management or controls”.


    In common practice, microgrids or other smaller energy systems consist of multiple
    distributed generation sources such as solar photovoltaic (PV) systems, wind turbine
    generators, fuel cells and diesel generators. These are also commonly referred
    to as distributed energy resources (DER). Additionally, microgrids may also consist
    of electrical energy storage systems such as battery banks and supercapacitors,
    which'
