    # ## 4.6 INTEGRATION OF ELECTRICAL VEHICLES TO IOE


    Petroleum is often used for transport, however, in oil exporting countries, it
    is also used to generate electricity. A lot of research is going on to use energy
    in transportation other than that provided by petroleum products so as to reduce
    the dependence on fossil fuels. For transport, a lot of research is being carried
    out for developing Electrical Vehicles (EV) such as Battery Electric Vehicles
    (BEV) and Hybrid Electrical Vehicles (HEV). In contrast to BEVs that are fully
    battery chargeable vehicles, HEVs have options for their batteries to be charged
    using both electricity and gasoline.


    A method for optimization of energy used by EVs in a smart city is described in
    [1, 8]. Vehicles and buildings communicate for sharing information about status
    of vehicle and road conditions. The information about the energy consumption along
    a specific road segment can be shared by EVs to a data base and can be used to
    manage energies of EVs planning to travel along the road segment. Artificial Intelligence
    (AI) techniques such as Support Vector Machine (SVM) can be used to classify vehicles
    based on recommendations of buildings about the positions of the vehicles.


    It has been pointed out in [26] that EVs can be charged using vehicle-to-grid
    (V2G) infrastructure. However, a large number of vehicles should not be charged
    simultaneously to avoid stress on the grid. The batteries of vehicles can be scheduled
    for charging in parking spaces. There can be both consumption of energy while
    charging using the grid and generation of energy while it is moving on the roads.
    The energy generated can be transferred from vehicles to the grid. In other words,
    there should be a smart charging infrastructure for charging vehicles at homes
    and places of work.'
