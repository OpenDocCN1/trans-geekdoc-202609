    system operations, this may be achieved by design of real-time system optimizers.
    In operations research, uncertainty handling has been discussed by a number of
    methods such as sensitivity analysis, robust optimization methods, chance-constraints
    and stochastic programming. Sensitivity analysis method is a post-optimality process
    and is, thus, unsuitable for online optimization. Another main distinction among
    uncertainty handling methods is based upon the type of information available about
    the uncertainty. In case the uncertain variables are observed to follow standard
    probability distribution functions, they are referred to as probabilistic uncertainties.
    However, it is more common in practical situations to have non-probabilistic uncertainties.
    In accordance, Bertsimas et al. presented the basic distinguishing feature between
    robust and stochastic optimization as follows. “In robust optimization the decision-maker
    constructs a solution that is feasible for any realization of the uncertainty
