    the Mobile application.


    ![](img/617e854c2620a5a4bed0116cef33155a_292_1.png)


    **Figure 10.5** Accessing LEDs via mobile application


    On an average, the energy consumption by a single 8W LED bulb is approximately
    8 Wh (0.008 KWh) and Corporate buildings or Educational buildings like schools
    or colleges, on average contain 10–12 LED bulbs per room. Assuming a room with
    12 such LED bulbs and all being in use, the energy consumed is approximately 100
    Wh (0.1 kWh).


    It often happens that a person entering the room turns all the appliances ON in
    the first go irrespective of the part of the room he/she is going to sit and work.
    In ideal conditions, only 1 or 2 LED bulbs (consuming ≈ 16 Wh energy) should be
    lit'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'for a single person, but in an actual scenario, all LED bulbs are lit. This
    leads to the unnecessary energy consumption of almost 80 W h (0.08 KWh) for the
    unnecessarily lit 10 LED bulbs.


    By using the proposed smart control system, the issue of energy consumption can
    be brought down to a minimum by intelligently controlling the number of LEDs or
    appliances that are turned ON. Using the computer vision module, the system will
    automatically detect the presence of people in that room and accordingly turn
    ON the appliances where the person is. Figure 10.6 shows the relation between
    Energy consumption with the number of people in the room by using the smart system.


    According to model training conducted on the Computer Vision Model of the prototype,
    the average accuracy of the Model is found to be about 50%. Using this data, we
    can predict that the energy consumption can be brought to a minimum by as much
    as 40 Wh.


    ![](img/617e854c2620a5a4bed0116cef33155a_293_0.png)


