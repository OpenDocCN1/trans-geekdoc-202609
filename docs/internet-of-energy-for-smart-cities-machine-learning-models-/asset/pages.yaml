    Improvement in EMS is emerging and reaches all energy grid operation levels from
    generation to distribution to enable optimal use of traditional or renewable energy
    sources as in decentralized generation, while maintaining system stability and
    service quality [13, 45]. The architecture above represent a basic form of EMS-based
    architecture of IoE that was more suitable with centralized energy management,
    while there were various developed relative architectures are introduced specially
    with growing of decentralized energy generation management as shown in Figure
    6.4.


    The advancement in EMS-based IoE architecture followed different paths in development,
    where an architecture in Figure 6.4 that presented by (Y. R. Kafle et al. 2016)
    involves an additional functionalities and features such as in different energy
    generation sources, energy storage, enhanced data center, and smart metering technology
    [2]. This type of architectures considers the decentralized energy generation
    and management that may include common renewable energy forms like solar and wind,
    in such architectures other forms are also usable such as hydroelectric, geothermal,
    biomass etc.


    Figure 6.4 above shows an advanced EMS based architecture shows more features
    and functions are enabled for both energy sources and load, including renewable
    energy sources, distributed energy storage, plug-in electric vehicles, domestic
    and industrial “prosumers”, etc. Prosumers concept introduced in this architecture
    refers to mixture of producer and consumer or as called an active consumer who
    would participate in energy production by their own [12, 13]. Such architecture
    mainly depends on internet for all operations required for control and monitoring.'
