    \ of blocks that store information about successive operations which take place.\
    \ It facilitates transparent operations without the involvement of intermediaries.\
    \ The security and autonomy of a blockchain are ensured by smart contracts and\
    \ consensus mechanism [1].\n\nIn the context of smart energy systems, blockchain\
    \ is referred to as energy blockchain, and is mainly used in the following applications,\
    \ namely peer-to-peer energy trading, microgrid operations and cyber physical\
