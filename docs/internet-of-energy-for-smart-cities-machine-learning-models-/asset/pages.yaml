    # 4.5 OPERATION OF IOE


    The electricity generated from different sources is added to the grid. A grid
    with computational and communication capabilities at the stations is often called
    a smart grid. An IoE is a network of end user devices and energy providers that
    are equipped with sensors to collect data and forward it using a communication
    network to control stations for further processing and decision making. A network
    of appliances such as refrigerators, washing machines, dish washers, television,
    chandeliers, microwave ovens, electric ovens, vacuum cleaners, water coolers,
    air conditioners, room heaters, etc., connected to the Internet is called an Internet
    of Things (IoT). In an IoE, all end user devices including energy meters are IoT
    enabled.


    In a smart city, the supply of energy comes from different sources through a smart
    grid. The sources can be nuclear reactors, thermal power stations, hydro power
    stations, solar parks, etc. All these energy providers might be at remote locations.
    At the consumer side, there can be industries, commercial places, academic institutions,
    municipal corporations, departments and offices, residential buildings and homes,
    etc. Some of the consumers might also be producing some forms of energy e.g. solar
    energy through roof top solar cells that needs to be added to the smart grid.
    The'
