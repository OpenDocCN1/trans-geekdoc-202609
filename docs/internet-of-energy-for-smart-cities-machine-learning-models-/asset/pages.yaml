    # ## 3.3.2 SMART METERING, MEASUREMENTS, CONTROL, AND AUTOMATION


    The evolution of the power grid is moving toward an advanced technological level
    when it comes to solutions for measurement and automation. Smart applications
    require an improvement in these aspects, for example, perhaps one of the main
    ones demand-side management requires a dynamic consumer measurement that meets
    the context of distributed generation. For this reason, it is extremely important
    to have an architecture with a high level of automation and with bridge measurement
    technologies, which is also linked to communication technologies.


    Traditional electric meters measure the total consumption of the end-user or are
    used to measure the amount of energy transported. Traditionally, accumulation
    meters are used, but in recent times, modernization has been adopted in this regard.
    Some modernizations were performed to allow users who had more control over their
    consumption and also to deal with different types of electric tariffs. These advances
    have allowed us to reach those known today as Smart Meters, which play a fundamental
    role in the formation of an SG.


    Smart meters are even more sophisticated as they have two-way communications and
    provide a real-time display of energy use and pricing information, dynamic tariffs
    and facilitate the automatic control of electrical appliances [35]. Through an
    Advanced Metering Infrastructure (AMI), it is possible to guarantee the widespread
    use of this technology. This infrastructure is based on the communication structure
    previously presented. The Smart Meter is at the HAN level installed at the consumer
    and follows the communication chain. This data from several meters are grouped
    by the Local Data Aggregator, which it collects through the NAN. In the WAN, the
    control operator has access to the data emitted by the advanced measurement applications.
    Figure 3.11 shows the AMI scheme.'
