  md: '# ## 1.4.4 MULTI-AGENT SYSTEMS


    Multi-timescale variation of power flows, RES intermittency and variability, network
    reconfiguration ability and plug-and-play characteristics highlight the dynamic
    nature of smart energy systems. Secure and reliable operation of these systems
    envisages the need of efficient computation and real-time control. Accordingly,
    AI has been identified as a suitable solution for online operations. Russell and
    Norving have introduced the concept of *agents*, and defined AI as “the study
    of agents that exist in an environment and perceive and act” [28]. Appropriately,
    agents may be thought of as intelligent entities, capable of performing autonomous
    actions under varying environmental conditions. Although agent-based technology
    has been in existence for many years, there lacks a uniformly accepted common
    definition. A common notion that has been identified as the main characteristic
    of agents is their autonomy and pro-activity. A widely used definition was proposed
    by Wooldridge and defines an agent as “a software (or hardware) entity that is
    situated in some environment and is able to autonomously react to changes in that
    environment” [38].


    The main force behind the development of agent-based technology is the fact that
    it supports distributed control architecture, necessary for most modern day problems.
    By definition, multi-agent systems consist of groups of agents that co-exist,
    communicate, and coordinate with each-other. Multi-agent systems enable multiple
    parallel processes by composing a complex objective into several simpler objectives,
    each assigned to an independent intelligent agent. This significantly reduces
    computational time and eliminates single point of failure, which are prerequisites
    for online control. Multi-agent systems differ from traditional AI techniques
    due to the fact that most conventional AI techniques are designed for static environments.
    This is due to the ease and simplicity of design that static environments offer,
    which enables easier mathematical formulation. However, smart energy systems are
    decentralized, market-oriented, multi-variable and complex. Further, the increasing
    number of online problems in modern distribution networks envisages the need to
    develop suitable control techniques such as multi-agent systems, which offer autonomous
    and proactive control in dynamic environments. This enables highly networked problems
    in smart energy systems, which are executed in real-time.


    # ## 1.5 CONCLUSION


    Owing to ever-increasing energy demands and rising concerns over global warming
    and climate change, urban settlements are undergoing rapid structural and technological
    changes, and popularly being referred to as smart cities. This has been accompanied
    by widespread integration of RES in the energy systems which are highly intermittent
    and necessitate the development of advanced controls. In order to impart flexibility
    to RES-penetrated energy systems, energy storage and flexible demand have been
    identified as potential solutions. Due to the diverse spatial distribution of
    generation, storage and load resources in the electrical distribution grid, distributed
    control architecture is required to ensure energy demand-supply balance at all
    times at an acceptable reliability level. Consequently, smaller and smarter distributed'
