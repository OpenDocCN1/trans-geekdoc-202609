  md: '# 8.4 DATA TERMINOLOGY


    # 8.4.1 DATA DEFINITIONS


    Sample, variable, and feature are the keywords in machine learning with the following
    definitions:


    Sample or observation, which is usually a row of datasets, is an instance of recording
    an entity. For example, if the weather information is recorded hourly, each hour’s
    information is considered an individual sample at each table’s row.


    Variables are values in each sample, consisting of different information to represent
    a record. For instance, at the weather dataset, a sample includes variables such
    as sample ID and date, temperature, wind, and humidity at that hour.


    Features, attributes, dimensions, which are generally presented in columns of
    datasets, are the values to describe variables’ characteristics. For example,
    wind in the weather dataset can be defined by its speed and direction.


    # 8.4.2 DATA TYPE


    The most typical data types are numeric and categorical data types, while others,
    such as time-series data and text, also exist in some literature. The most typical
    data types are numeric and categorical data types, while others, such as time-series
    data and text, also exist in some literature. Numeric or quantitative data are
    data points that take on exact numerical values. Numeric data that has a meaning
    as measurement can be categorized as continuous or discrete data. Continuous data
    can be any value within a range, while discrete data has distinct values. For
    example, the number of students, the number of transactions per hour, and the
    language are spoken discrete numerical data types; instead, the exam’s score,
    house price, temperature, and heights are continuous data types. Categorical,
    qualitative, or nominal data types refer to non-numeric values that represent
    some quality or characteristics of an entity, for instance, city names, soccer
    player’s positions, flower’s names, and clothes colors. The categorical data does
    not have any explicit mathematical meaning; therefore, we cannot add them together
    or take the average. Samples in real-world data are usually multidimensional,
    meaning that each sample in the dataset is associated with different variables
    and dimensions with different data types.


    # 8.4.3 DATASET IN MACHINE LEARNING


    Machine learning models need to have three different datasets in order to perform
    well:


    Training dataset: after setting the hyperparameters, it adjusts the model’s parameters
    so as to learn the input-output mapping; therefore, the most of the original dataset
    should be allocated in this part, usually 70–80% in average dataset size, if a
    problem is dealt with the very massive dataset this number'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'can be increased to 98%, for example when 10 million data is available for
    study.


    Validation dataset: this dataset is used to see how well a trained model is working
    and determine if a trained model is overfitted or not. In simple words, it evaluates
    the generalization performance of a trained model and provides valuable information
    on how it is possible to increase model accuracy and performance. The validation
    dataset is usually 20–25% of the original dataset, while the original dataset
    is considered as a massive dataset it would be 1% of the original size.


    Test dataset: this part of the dataset evaluates a model’s performance on a new
    unseen data. It usually is between 5% and 10% of the original dataset. However,
    in a problem with a very massive primary dataset, it could be 1%.


    It should be kept in mind that the test dataset should never be used in the training
    phase and used to tune the model. For example, in the cross-validation procedure
    to finish training. It should only be used on the trained model to make sure the
    model generalizes correctly.


    # 8.5 MACHINE LEARNING MODEL


    A machine learning model uses mathematical and statistical parameters and equations
    to discover the relationship between inputs and outputs. Figure 8.6 represents
    the model considering the input parameters, the equations that rework them, and
    the results (outputs).


    ![](img/617e854c2620a5a4bed0116cef33155a_233_0.png)


    Figure 8.6 Machine learning performance


    To put it another way, a machine learning model simply maps inputs to outputs
    by adjusting the mathematical parameters to improve the input-output mapping model’s
    accuracy. In general, building the machine learning models, includes two phases:


    +   Training phase: in this phase, the model adjusts the parameters considering
    the training data to minimize errors.

    +   Testing phase: the new unseen data test the learned model [16].


    The primary purpose of building a machine learning-based model is to have a model
    that works well on both training and test datasets as shown in Fig. 8.7 and 8.8
    [17].'
