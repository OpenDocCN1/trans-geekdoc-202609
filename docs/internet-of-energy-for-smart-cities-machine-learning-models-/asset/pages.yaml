  md: '# 3.2.1.2 Management and Market Complexity


    In this context of SGs, there is the integration of several elements including
    generation units distributed at different levels of the network, electric vehicles,
    energy storage, traditional network, microgrids, in addition to other elements
    related to the communication and information infrastructure. This complexity requires
    a more precise energy management that can present advanced solutions to deal with
    these different variables without losing efficiency. Figure 3.3 Illustrates this
    complexity of the SGs.


    ![](img/617e854c2620a5a4bed0116cef33155a_94_0.png)


    Figure 3.3 SGs elements and the management complexity


    One of the biggest challenges is to coordinate a strategy that integrates all
    network infrastructures, be it traditional network or the modern elements to maintain,
    and the modern elements that characterize SGs. The starting point is to maintain
    energy efficiency, avoiding losses and managing loads and generation correctly.
    These strategies must take into account the RES intermittency, network operating
    conditions, varied consumption, dynamic rates, among others. Energy efficiency
    is one of the main concern for sustainable development activities, because the
    increase in energy consumption usually implies on increase of CO2 emissions and
    lasting impact on global warming [13].


    It is important to emphasize that the communication systems are drivers for the
    integration of the different systems of SGs. Together with modern measuring equipment,
    such as smart devices and smart metering, they allow massive and bidirectional
    data transfer through wired and wireless communication protocols. Thus, the network
    as a whole becomes more capable to managing this range of information from many
    elements of generation, consumption, and operation. This challenge of dealing
    with all this complexity also involves data management, as many devices exchange
    information with an even greater participation by the end user in the operation.


    The fundamental control problem is managing resources in bulk energy system (e.g.
    power generation resources) and dispatchable DERs in a way that will not'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'compromise the operational requirements of grid, e.g. observing constraints
    on system frequency, voltages, and the operational limits of the grid components
    [14]. In this new grid format, this problem is increasingly aggravated by the
    characteristics mentioned above. Furthermore, the fact that distributed generation
    units are not, in most chaos, owned by the energy supply agency further complicates
    treatment energy traditional. The following is a list of the main challenges related
    to the new way of managing power systems.


    +   1. Add a wide range of subsystems and technologies (bulk generation, distributed
    generation, transmission, distribution, substations, communication, energy storage,
    etc.);

    +   2. Unpredictability of non-dispatchable energy sources, especially intermittent
    renewable sources;

    +   3. Coordinate a massive bidirectional data flow;

    +   4. System dynamics becoming faster and unexpected;

    +   5. Better to integrate consumers, agencies, and prosumers;

    +   6. Energy efficiency and reduction of CO2 emissions;

    +   7. Adapt and update the grids infrastructure;

    +   8. Need to mature the bidirectional energy flow;

    +   9. Reduce the peak load.


    The electricity market in the context of SGs will largely depend on the demand
    response and energy efficiency programs [15]. In addition to several changes in
    the operation of electrical power systems, the way the market will be adapting
    also changes. In this context of SGs, other agents become active in the electricity
    market, for example the prosumers, who are the consumers that also generate their
    energy and surpluses. The market need to take this phenomenon into account and
    adapt the regulatory processes for effective participation and fit the use of
    new technologies. Demand Response mechanisms and incentives characterize basic
    objectives for utilities, business, and residential customers to reduce energy
    use during periods of peak demand, be efficient when power reliability is at risk,
    optimize the balance of power supply, and demand regardless of the system size
    [16].


    This whole context addressed so far shows a change in the consumption profile
    and in the way the network operates to maintain efficiency and quality in energy
    supply. The market is challenged to face these transformations as an opportunity
    to employ new technology and approach. Perhaps the regulatory barriers are the
    most challenging in this process, as they need to break with rules that make the
    network work for a long time, but they are the most important for the development
    of a modern electrical grid. Figure 3.4 highlights the challenges inherent of
    the complexity of managing SGs.


    # 3.2.1.3 Power Quality Issues


    The term power quality is related to voltage quality and supply continuity. The
    increasing complexity of the electric power network and its management, growing
    demand and expectations of service quality such as greater reliability, efficiency,
    and security of grid as well as environmental and energy sustainability'
