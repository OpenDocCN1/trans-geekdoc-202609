    # 3.2.1.4 Cybersecurity


    The SG is a network of computers and power infrastructures that monitor and manage
    energy use [19]. Each application, equipment in operation, measuring devices spread
    by private and public entities, is integrated into the electrical information
    sharing system. This arrangement raises concerns about information security, privacy,
    and malicious activity on the system. In addition, there is still the possibility
    of fraud, leakage of private consumer information, changes in consumption data.


    Cyber security objectives can be classified into the following three categories
    [20, 21, 22]:


    +   1. **Integrity:** Protection against the unauthorized modification or destruction
    of information. Unauthorized access to information opens the door to misuse of
    information, leading to mismanagement or misuse of power.

    +   2. **Confidentiality:** Protect privacy and proprietary information by authorized
    restrictions on access and disclosure.

    +   3. **Availability:** Ensure timely and reliable access to information and
    services. Availability can be compromised by disrupting access to information
    that impairs the power supply.


    The proposed solutions include encryption, aggregation of data at high levels
    to mask individual user, limiting the amount of data to only the information needed
    for billing purposes and real-time monitoring of these networks [23, 24]. Still,
    malicious intruders can be sophisticated enough to circumvent security. Keeping
    the power grid and the information network secure should be a priority, as the
    way the system will integrate in the future makes it more vulnerable and susceptible
    to attacks. The use'
  merge: -1
  img_proc: true
