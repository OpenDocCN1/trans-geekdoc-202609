    **Figure 3.13** WAMS architecture


    Current Source Converters (CSC) are the main electronic interfaces for a renewable
    energy source, especially when we are talking about PV energy, it is also associated
    with the use of energy storage systems. Other components that play important roles
    are the Flexible AC Transmission Systems (FACTS), these are used to increase the
    power transfer capability of existing AC lines, to control steady-state and dynamic
    power flow through an AC circuit, to control reactive power and voltage and to
    enhance voltage and angle stability [43].


    Microgrid architectures can be classified into three groups: AC microgrid, DC
    microgrid, hybrid AC/DC microgrid. The AC microgrid has a common AC bus which
    is generally connected to mixed loads (DC and AC loads), distributed generations,
    energy storage devices [44]. This has great compatibility with traditional AC
    networks, in addition to having greater reliability and capacity. On the other
    hand, when it comes to DC loads and sources, the integration is done by DC/AC
    inverters, which reduces efficiency [45, 46]. Figure 3.14 shows an example of
    AC architecture scheme.


    In DC microgrid, common DC bus is used to connect to the grid through an AC/DC
    converter [44]. The DC microgrid has some advantages, one of which is to avoid
    losses due to energy conversion, it also has better integration with renewable
    energy sources. These also have greater stability. Finally, we have the hybrid
    AC/DC microgrid, which is the combination of the two architectures, presenting
    a sum of benefits and advantages in use. Figure 3.15 shows an example of DC architecture
    scheme.


    Energy storage plays a key role in microgrids. This technology can be used in
    different ways, one of which is to use a large capacity to support the microgrid
    in reducing fluctuations and improve stability. Energy Storage also performs some
    energy management functions, such as load leveling, peak shaving, and RES energy
    shifting.'
