  md: 'every few seconds. Further, Often, the nodes are densely-deployed, to ensure
    full area coverage and sufficient redundancy of data to account for the node failure
    as well as communication-related data loss. All these factors lead to the possibility
    of very high volume of data to be transmitted over a field node’s wireless interface
    (causing energy drainage), to be communicated over the network (causing high bandwidth
    consumption) and stored at a cloud repository (requiring large storage space and
    the associated cost) [23]. Since in most smart environment applications the IoT
    nodes are wirelessly connected to the Internet, dealing with high volume of data
    at the node level also raises the concern of node-level energy sustainability
    and uninterrupted network operation [38, 74].


    A related issue is dealing with large volume of data generated at the end nodes
    and making appropriate intelligence and timely actuation capability [2, 7, 49,
    52]. On one hand, carrying all data to the central cloud and relying on data analytics
    by powerful computation may be computation-resource-wise efficient, but may not
    be acceptable in some time-critical applications, such as tele-surgery, smart
    grid monitoring, etc., due to high network latency. Moreover, carrying all field
    sensing traffic without applying local intelligence on their usefulness may prove
    communication and energy resource-wise inefficient. On the other hand, applying
    intelligence at the sensing traffic generation process or pruning as an after-sensing
    exercise may be of interest from communication bandwidth and transmission energy
    efficiency perspectives. Additionally, having some intelligence at the node-level
    may be helpful in time-critical decision making. However, the processing overhead
    could be a bottleneck at the node with respect to its processing capability (equivalently,
    its cost) as well as processing energy requirement. With both the alternatives,
    the factor of data vulnerability and security at the processor level as well as
    at the network routing/switching level are important factors in deciding an option.
    Thus, an application context specific IoT node architecture design as well as
    network architecture design in deciding on distributing the intelligence is of
    interest [2, 7].


    # 11.3.2 NODE- AND NETWORK-LEVEL DATA-DRIVEN OPTIMIZATION


    As alluded in the previous subsection, dealing with big data in IoE requires proper
    understanding about the application context at hand and the constraints that are
    in place. Accordingly, the optimizations and solutions to the problems are expected
    to be different. It may be noted here that, commercially-available IoT hardware
    devices, namely, sensor hubs, smart-meters, phasor measurement units (PMUs), do
    not have the provision for data pruning at the field node. Likewise, the distribution
    of intelligence in the network for resource-optimized data handling is yet to
    be matured.


    We highlight two example application cases: one is on real-time application (smart
    grid monitoring); the other is on not-so-time-critical application (smart metering,
    wireless sensor networks), to discuss how the solution approaches evolve. The
    focus is given on intelligent data pruning at the end node for transmission energy,
    communication bandwidth, and cloud storage space optimization.


    **Smart grid monitoring:** On high-rate sampled PMU data handling for real-time
    smart grid monitoring, a few studies have explored stability prediction based
    on'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'reduced PMU data. In [14], autoregressive modelling of PMU data sequence is
    studied to identify stress signs from correlation between consecutive samples.
    Short-term prediction using state-space approach and basis function was studied
    in [22] to spot measurement errors. Dimensionality reduction of PMU data using
    linear principal component analysis were studied in [30, 115]. Discrete cosine
    transform [77], [69], compressive sampling [15], wavelet packet decomposition
    [26, 47], preprocessing and lossless encoding [101] (and the references therein)
    operate offline and also in real-time for data storage. A few related studies
    in context of cloud storage are optimal sensor selection [9], K-means clustering
    [65], use of support vector machine for stored data analysis [89]. It is notable
    that, other than [15], all prior approaches investigated data reduction at the
    PDC. However, although the objective in [15] has been communication bandwidth
    reduction, it does not deal with nonstationary nature of PMU data. Thus, in absence
    of continuous learning and adaptation, quality of compression and hence the quality
    of power system health monitoring is expected to degrade over time.


    In a recent study it was demonstrated that the PMU data on smart grid health is
    truly non-stationary in nature, which implies that classical theory of stochastic
    processes will lead to non-optimal solutions [104]. Hence, dynamic learning-based
    analysis for data pruning at the PMU is necessary. A learning-based framework
    based on \(\epsilon\)-support vector regression was proposed to dynamically prune
    the PMU data before transmission. In the proposed approach, learning parameters
    are dynamically updated as necessary to keep the error in data pruning within
    a specified error limit. Follow-up work in [107] further incorporated communication
    channel related uncertainties in deciding the optimal channel overhead required
    to be incorporated at the IoT data source node (PMU) to ensure that the pruned
    data content is successfully delivered. Besides a stochastic analysis based proposition,
    a learning-based channel overhead computation was also proposed to show the benefit
    on accurate overhead prediction – albeit at some cost of processing overhead.


    In the current state of the art, the PMU data is still used for aiding human intelligence
    in smart grid traffic load balancing decision making. The mechanical relays locally
    address the major faults in the transmission/distribution lines. To this end,
    some critical aspects of interest that require further studies are (i) understanding
    vulnerabilities in the smart grid network based on the PMU data, (ii) analysis
    of smart grid health based on multiple neighboring PMU data by exploiting the
    possible correlation, (iii) investigating on distributed intelligence placement
    for automated actionability on PMU data for actuation of energy traffic redistribution
    on real-time basis, (iv) studying the network routing and switching related nonidealities
    and their impact on PMU-PDC coordination. Although the above-mentioned directions
    of future research pertain to smart grid monitoring and control applications,
    the propositions would apply broadly to the other time-critical (ultra-low latency
    aware) and reliable IoT applications.


    **Smart metering:** A semi-real-time or delay-tolerant IoT application is smart
    metering, on which there have been recent efforts on data reduction without compromising
    on quality of information. Since smart metering is a less time-critical application,'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'pruning technique of high-rate sampled data at the source is compression-based.
    The conventional signal processing algorithms for data pruning are entropy coding
    [4], singular value decomposition [19], load features based compression [103],
    and dictionary learning and sparse encoding [112], that exploit the temporal and
    spatial attributes of the data streams from different sources collected at an
    aggregation point. These techniques do not address the issue of single time-series
    data reduction at the source, and thus are less useful in near-real time applications.
    A lossy compression method [24] produces piece-wise approximation of original
    data to control the smart meter data volume at the cost of accuracy. To address
    this, performance of four loss-less compression algorithms (adaptive trimmed Huffman,
    adaptive Markov chain Huffman, tiny Lempel Ziv Markov chain, and Lempel Ziv Markov
    chain Huffman) were investigated in [73, 116]. A resumable compression method
    [109] based on differential coding also proposes compression of data sampled at
    1 second interval for household level and 3 seconds interval for appliance level
    at the smart meter. It was observed that, although high granularity (on the order
    of seconds) is critical to attain substantial compressive gains, compression of
    high resolution household level data at the smart meter remains challenging owing
    to rapidly fluctuating load patterns. To this end, an adaptive data reduction
    scheme using compressive sampling was devised in [105], to operate at the source
    which achieves significant bandwidth saving in data transmission to the nearest
    collection center without any appreciable loss of information. Unlike other data
    compression algorithms, this compressive sampling based data reduction exploits
    the rapidly fluctuating nature of high resolution sensor data. It was observed
    that, although the data appears incoherent in time domain, it can actually be
    concisely represented in a sparsifying basis. Thus, adaptively choosing the sparsity
    over optimum batch size before data transmission can be utilized for substantial
    reduction in data volume.


    Data pruning in a more generalized scenario is of interest wherein the IoT node
    has multiple sensing elements which generate high-rate multiple time series of
    near-real-time data. Intuitively, extending the concept in [105] over each individual
    time-series data would help data reduction over the individual streams. Anticipating
    possible correlation among different measured variables, in a recent study [75]
    cross-correlation of the streams along with the temporal correlation on the individual
    time-series data were exploited to reduce the communication bandwidth as well
    as cloud storage requirements. For capturing distribution of the original data
    and comparing the quality of compression, joint distribution of multivariate data
    was obtained using Multivariate Normal Autoregressive Integrated Moving Average
    model. A multivariate data compression scheme was devised which exploits cross-correlation
    among different variables measured at an IoT node to reduce the transmitted data
    dimension. The scheme follows a two-step adaptive compression. In the first step
    dimensionality of data is reduced by applying Principal Component Analysis. In
    the second step, each of those selected components is further compressed temporally
    using Compressive Sampling on the reduced number of streams in the transformed
    domain. In principle, this data reduction technique is a powerful approach in
    any multivariate IoT sensing applications that is expected to yield significant
    gain in transmission'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'energy, bandwidth saving, as well as storage space requirements. The resultant
    pruned data from the field node is interpolated at the destination using a counterpart
    two-step decompression scheme. This process is expected to aid in mitigating the
    big data footprint in massive IoT communication scenario.


    An important aspect is incorporation of the dynamic data compression technique
    at the source, thereby developing advanced smart meters, in a cost-effective manner
    so as to ensure commercial viability of reduced data generation from such IoT
    nodes. While the compression principle remains the same, there may be vendor-specific
    different techniques of achieving the data pruning. Therefore, compatibility standard
    in terms of interfacing with the Internet, such as light-weight machine-to-machine
    (LW-M2M) interface, may be required to ensure equipment modularity.


    Wireless IoT based smart environments: While data handling in the above two applications
    (smart grid monitoring and smart metering) are focused on communication bandwidth
    saving and cloud storage saving, in other smart city IoT applications the data
    reduction is motivated by energy saving at the IoT nodes, especially because of
    their wireless connectivity and deployment in remote/hazardous locations [48].
    The other unique features and possible novel solutions include the following:
    (i) Data generated may be mostly telemetric, i.e. delay-tolerant. However, there
    may be applications, such as remote health, where the data priority may have to
    be dynamically adjusted depending on the instantaneous nature of data. (ii) Since
    sensing or sampling itself could be energy-hungry, such as in pollution monitoring,
    high-rate sampling and then data pruning before transmission may not be energy-efficient.
    Therefore, node-level [74] and network-level [37, 40] collaborative sensing techniques
    may be required to prune the data at the generation process itself. Depending
    on whether an IoT node has single parameter or multiple parameters of data to
    sense and its current energy availability, newer supervised (single/multi-parameter
    support vector machine) or unsupervised learning (reinforcement learning, context-aware
    bandit algorithms) techniques may be employed. Low-cost wakeup features for sensing
    as well as communication may be further explored to minimize energy consumption
    [45].


    Since the question of node-level energy sustainability as well as cost-affordability
    are of key importance, appropriate decision on where to incorporate the learning
    and processing intelligence is critical. This is clearly application and ownership
    context-specific. Distributing intelligence appropriately at the end (fog) nodes
    or at the immediate collection point (edge node) or at a higher level of network
    connectivity hierarchy is required. An evolving direction of research in this
    context is mobile edge computing [2, 7].


    # 11.4 ROLE AND CHALLENGES OF SMART GRID IN IOE ENERGY SUSTAINABILITY


    # 11.4.1 ENERGY SUSTAINABILITY


    While big data handling and edge computing address the resource efficiency (bandwidth,
    storage, energy), energy sustainability still requires major attention in order
    to'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'make IoE a mass reality. Without convenient recharging capability and low CAPEX
    and OPEX, large-scale adoption and deployment of IoT technologies may not happen
    [96]. Even for the IoT equipment that may be connected to the power grid supply,
    drawing power from ever-depleting fossil resources (coal, oil) are discouraged.
    Thus, powering devices and systems from ambient (green) resources, such as the
    energy from solar irradiance, wind, pressure, heat, water current, and ambient
    RF, has got significant traction in communication systems and networks research
    community [10, 12, 25, 41, 46, 54, 56, 60, 97]. Also, in situations where ambient
    energy resources may not be sufficient at times, convenient means of recharging
    of the IoT devices are of interest. Wireless energy transfer, in the form electromagnetic
    inductive coupling and RF radiation, are some competitive/complementary techniques
    that are being pursued [16, 34, 44, 50, 55, 56, 57, 93, 98, 99, 111, 114].


    **Green energy:** On the green energy sustainability solution solely from ambient
    sources, one aspect is to design the energy harvesting antenna and storage battery/super-capacitor
    dimensioning, as a CAPEX estimate [94, 95]. This, combined with the stochastic
    analysis of ambient energy availability, analysis of traffic variability and heterogeneity
    distribution, energy usage optimization (discussed in Section 11.3.2), and the
    user QoS/QoE support, decide the OPEX, and combined CAPEX-OPEX optimization is
    aimed [46, 97]. Ambient RF energy harvesting is another proposition, primarily
    in the mobile wireless research community, wherein the ambient RF energy is cognitively
    harvested by the same receiver antenna when either the node is not communicating
    but there is sufficient ambient RF energy available or energy harvesting is estimated
    to be more cost-effective than communication at that instant [60]. The RF energy
    could be available in-band (cellular or WiFi, over which the node also communicates
    when required), or it could be out of band, e.g. over digital television band
    – in which case additional tuning capability at the energy harvesting receiving
    node is required. Harvesting capability, sensing activity, and communication optimizations
    in this direction depend on the nature of traffic/data and QoS to be served.


    **Wireless recharging:** Wireless energy transfer is a complementary solution
    to recharge the wireless IoT nodes on-demand. Wherever ambient energy sources
    are insufficient and power grid connectivity is unavailable, robot-augmented wireless
    energy transfer is being explored for sustainable IoT network coverage and communication
    [16]. On one hand, beyond the commercial state-of-the-art (www.powercast.co) there
    has been systems-level studies to increase the RF energy transfer efficiency via
    novel multihop energy routing to the field IoT node [44, 46, 55, 56]. On the other
    hand, there are newer wireless RF charging strategies using mobile vehicles or
    robots or unmanned aerial vehicle (UAV) that are being explored, targeting various
    sensing applications, such as pollution monitoring in hazardous locations, smart
    agriculture, surveillance [16, 98]. Besides poor RF energy harvesting sensitivity
    and energy rectification efficiency, the other unique aspects of research interest
    here are: (i) mobile RF charging robot''s path planning for charging multiple
    field nodes with stochastic charging as well as discharging pattern, and (ii)
    nonidealities of system and charging environments.'
