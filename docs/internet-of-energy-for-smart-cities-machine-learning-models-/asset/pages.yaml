    # 6.4.4 THE 4TH G -BASED LOW POWER WIDE AREA (LPWA)


    Low power wide area networks are one of new networking solutions that developed
    to provide an alternative for traditional short-range wireless networks such as
    Wi-Fi. This is makes it a good communication technique for the future of IoE that
    by introducing low implementation costs and energy efficiency. Modern solutions
    of IoE in both residential and industrial areas require clean and efficient energy
    solutions which introduced by LPWA networks that enables wider coverage and longer
    battery life.


    Technically, there is two types of LPWA networks; licensed and unlicensed LPWA,
    unlicensed LPWA using unlicensed spectrum and it specified for customized applications.
    Licensed LPWA is more commercial and uses licensed spectrum as in Narrow Band
    Long-Term Evolution (NB-LTE) and LTE-M LPWA networks which are introduced within
    4thG or LTE the evolutionary cellular networks [30]. LPWAN is an emerging network
    technology for IoE and M2M applications which suitable for long-rang performance
    and cellular M2M networks.


    The integration of IoT and M2M devices connected by the LPWAN technologies will
    generate a global IoT in anywhere and anytime to interact with any kind'
  merge: -1
