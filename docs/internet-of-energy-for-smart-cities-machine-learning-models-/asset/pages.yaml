    PV park and the nearest five weather mini stations.


    As we can see there are differences between the set of data that are published
    by each station and also the frequency data are read and stored in the station
    database. When we are considering the use of these data, we must take into consideration
    the appropriateness of this data to the purpose of our collection. Some data from
    one station can be more relevant for our study while for other data, integration
    of data from different station could be more relevant.


    Data we are interested from the ministrations include temperature, humidity, precipitation
    level (hail and snow would receive a higher attention), solar radiation and pressure.


    Historical data can be retrieved from the web page of the ministrations, while
    realtime data is collected using the similar method as for collecting data from
    the PV panel systems. We use appropriate scripts that call *phantomjs* software
    to browse and collect data from the webpage. Data collection must be synchronized
    with the specific frequency of data measurements of the station.


    Care must be taken as the interface to the data can change and therefore data
    collecting process can be broken.


