    # 7.5 SMART CITY DESIGN CHALLENGES


    The design of a smart city involves several stages starting from sensors and IoT
    devices and up to cloud computing. The main obstacle to designing a smart city
    is to handle a huge amount of data that is produced from different IoT devices
    in real-time. Effective control and management of big data is important for an
    accurate and reliable system. The major challenges to designing a smart city are
    shown in Figure 7.22 and some of them are discussed below.


    # 7.5.1 TECHNICAL CHALLENGES


    Planning: To design a smart city, proper and appropriate planning is considered
    the most vital tasks. It also involves the infrastructural and architectural design
    of a city. By allocating space for all equipment and considering the other necessary
    factors in mind, we can overcome this problem. Cyber-security: Another important
    challenge for smart cities is cyber-security. If the hack has occurred, it becomes
    a matter of disaster for the whole city as the system is interlinked with one
    another. There are some common cyber threats are hackers, zero-day, malware, etc.
    These challenges are not easy to handle if they are applied to the system. The
    cyber threats are not limited to a certain type of number therefore, it is required
    to build-up higher technology to provide good protection against these threats.
    Data Management and Communications: Different types of meters, sensors, and controllers
    are used in various stages to communicate with one another in a smart city and
    they produce in real-time. That data needs to handle effectively for compiling
    and predict the decision. Otherwise, the system significantly slows down to handle
    the Big data and it may lose stability.'
  merge: -1
  img_proc: true
