    # ## 5.1 INTRODUCTION


    Modern developments in renewable energy systems, power control systems, telecommunication
    tools, storage techniques and tools, information systems, cyber security and Internet
    of Things (IoT) have led to the initiation of advance concept of Internet of Energy
    (IoE) [1]. This is referring to an integrated infrastructure of dynamic network
    built upon the inter-operable and standard communication protocols that interrelate
    the energy network through the Internet enabling energy units. In general, IoE
    signifies the standard shift of grid systems from centralized power generation
    and one-dimensional power flow into more reliable, secure, flexible, sustainable,
    and efficient energy networks [2]. The purpose of the IoE is to make sure that
    a robust system is designed for extensive intelligent monitoring and control of
    energy through the internet. All planners, developers, designers, and engineers
    are seeking applications of smart technologies to attain the objective of lowest
    feasible energy cost with zero environmental impact, with 100% renewable scheduled
    to build life'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'cycle [3]. A number of comprehensive applications for IoE based smart technologies
    have been presented in the Figure 5.1. Smart energy technologies are next generation
    technologies having a great future. IoE based building energy management system
    supports the reduction of CO2 and energy consumption by exchanging the information
    of energy supply and demand in support of sustainable intelligent buildings [4].
    The applications of IoE can transform the conventional cities into smart cites
    and conventional buildings into smart buildings, which are ecologically and financially
    feasible throughout the use of smart energy systems and technologies [5]. To attain
    sustainable energy future smart energy technologies include the renewable sources,
    PE converter, smart plug-and-play interfacing, Smart home appliance, smart metering
    technology, smart lighting, distributed generation, energy storage and net metering,
    smart building energy management system, smart energy router, smart grid and smart
    heating, ventilation and air conditioning (HVAC) technologies etc. Large scale
    implementation of the technologies can prevent the power blackouts in near future.


