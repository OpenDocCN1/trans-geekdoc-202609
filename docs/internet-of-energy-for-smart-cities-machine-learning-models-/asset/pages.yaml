    # 1.3.4 REAL-TIME OPTIMIZATION


    Real-time optimization refers to a set of optimization methods that include practical
    real-time inputs and state estimates in the mathematical optimization model to
    optimally execute real-time processes, while satisfying certain practical constraints.
    Small-timescale problems in energy systems such as optimal dispatch of generation
    sources and energy storage systems, demand response programs, load control and
    peer-to-peer energy sharing are some online operations which necessitate the development
    of real-time optimization models in smart energy systems. Real-time implementation
    of a model is faced with the challenge of uncertainties in measured inputs, and
    requires re-evaluation of optimum values after regular time intervals. It is often
    the case that input variables of the objective function and constraints of the
    optimization model, which is typically measured ahead of time, differ measurably
    from the forecast values at the actual time of occurrence. As a result, the outputs
    of the optimization model tend to be sub-optimal, rendering the model inaccurate.


    In microgrids, uncertainties arise mainly due to increased penetration of RES,
    dynamic user preferences and real-time tariff, among other factors. It is noteworthy
    that solar insolation is highly uncertain, which may result in fluctuation of
    PV output up to 15% of its rated capacity within 1 minute. Furthermore, wind speed
    suffers from high temporal variations, as a consequence of which they may rise
    to 2-3 times of their forecast values within a few seconds. This implies that
    wind power output may become 8-27 times within a period of a few seconds [29].
    Uncertainties in input data may lead to potential inaccuracies of the optimization
    models. Since, the continuous effort of a system operator is motivated at balancing
    load and generation, under - or overestimates of the forecasts are detrimental
    to system reliability. System operators are, thus, forced to curtail loads or
    pay penalties for the unmet demand due to the sub-optimal schedules.


    Smaller energy systems are greatly affected by uncertainties due to lower inertia
    and limited energy buffers. In case the system is grid-connected, the distribution
    network is increasingly stressed, while the unmet load increases in offgrid systems,
    leading to user-dissatisfaction. A prolonged mismatch in the generation and load
    may result in significant deterioration of system components due to sub-optimal
    operation under unforeseen circumstances. The power distribution network and associated
    assets such as distribution transformers may be subjected to significant overloads,
    which may accelerate equipment ageing, and incur higher investments due to earlier
    replacements. Additionally, from the user perspective, unforeseen generation shortfall
    results in reduced utility and comfort, and causes dissatisfaction to the consumer.
    Ensuring efficient system operation in such uncertain conditions requires updating
    the optimal schedules after regular time intervals to match the requirements of
    real-time optimization.'
