    actual occurrence of uncertainty. Accordingly, these variables are referred to
    as “here and now” decision variables. Upon occurrence of uncertainty $u$ during
    real-time operation, the second stage optimization is performed where the uncertainty
    scenarios are determined, each associated with an occurrence probability $\lambda$.
