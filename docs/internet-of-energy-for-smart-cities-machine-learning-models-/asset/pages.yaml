  md: '# 8.1 INTRODUCTION


    Nowadays, we hear more and more often about how our cities must evolve to become
    smart cities. To achieve this, however, it is necessary to collect and analyze
    an incredible amount of data in real-time. IoT platforms, created in some cases
    by the same players who installed other infrastructures in our cities, enable
    data collection; however, it is necessary to analyze this data to transform it
    into information.


    It is essential to set up this type of analysis based on historical data. However,
    the data cannot be analyzed in such a timely way to make our cities smarter. To
    do this, it is necessary to rely on machine learning and artificial intelligence
    systems to be able to use the collected data in real-time to allow actions that
    help citizens have a better experience within urban centers. To this end, machine
    learning algorithms have broad applications in smart cities. Figure 8.1 summarizes
    some of the standard applications briefly.


    ![](img/617e854c2620a5a4bed0116cef33155a_224_0.png)


    **Figure 8.1** Machine learning applications in smart cities


    Here are some areas where artificial intelligence could be used to improve response
    times and make our cities smarter:


    *Traffic analysis:* using artificial intelligence for image and video recognition
    applications, together with maps and/or navigation services, or together with
    the geolocation of smartphones, would allow providing even more precise traffic
    indications than the current ones do navigation systems. Furthermore, in the event
    of accidents, the call of emergency vehicles and/or law enforcement agencies could
    be automated, so as to reduce response times and improve the quality of interventions.


    *Intelligent temperature control in buildings:* buildings, especially older ones,
    are among the primary sources of pollution within urban centers. Using'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'artificial intelligence systems, together with suitable sensors, would allow,
    with a relatively low cost, to significantly improve the supply of air conditioning
    inside the buildings, simultaneously reducing the emissions of polluting substances
    and the costs of air conditioning for citizens, generating thus benefits both
    individuals and the community.


    Smart parking management: the use of sensors, together with the geolocation of
    citizens, could make it easier to identify the free parking spaces in the area
    of interest, allowing a significant saving of time and a better user experience.


    Sizing of available public transport: using artificial intelligence applications,
    through the use of images/videos and the geolocation data of users, allows planning
    the available means not based on standard planning but based on the actual flows
    of the passengers within the day.


    Building and infrastructure monitoring: artificial intelligence can be used to
    analyze the enormous amount of data that sensors are possibly used to monitor
    the status of buildings and infrastructures. For example, it can identify potentially
    dangerous patterns within the data to launch timely alarms in case of problems.
    The use of intelligent devices then (e.g. valves) could also significantly reduce
    any damage caused by problems (e.g. water leakage).


    These are just a few examples of how artificial intelligence could help us “create”
    real smart cities or make our cities smarter. Of course, there are potential problems
    related to the security and privacy of people. For this reason, the legislator
    must give clear guidelines on how these types of applications must be developed,
    immediately integrating ethics-by-design logic, then carefully monitoring that
    the applications manage the data correctly (e.g. correctly anonymize the information
    or keep it only for the purposes and within the established terms). Suppose there
    is no absolute certainty about the security of the applications, both from a technical
    point of view and from regulatory reinforcement, as well as on the impossibility
    of private subjects to take possession of the personal data relating to individual
    citizens. In that case, it will not be possible to spread this type of application
    effectively.


    # 8.2 ARTIFICIAL INTELLIGENCE AND THE SMART CITIES


    The issues concerning artificial intelligence applications are multiplying both
    in academic literature and in information in general. The concept of artificial
