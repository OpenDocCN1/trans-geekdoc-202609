    # ## 11.1 INTRODUCTION


    With the proliferation of miniature embedded intelligence, data-centric user applications
    as well as machine-type applications have been evolving at a fast pace. On one
    hand, the users’ data demand as well as volume of data generated through multimedia-centric,
    virtual-reality/augmented-reality applications are expected to'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'grow enormously. On the other hand, the interest of automated monitoring, control,
    and actuation of civic infrastructures and amenities is expected to cause a massive
    growth in deployment of telemetric devices. These trends have been pointing to
    new challenges, namely, (a) data handling capability of the communication networks
    [122], (b) imparting with appropriate intelligence at various stages of the network
    [5], and (c) green energy solutions and sustainability [38].


    Typically, the Internet of Things (IoT) devices do not have sufficient data processing
    intelligence, whereas with various system health monitoring and commercial objectives
    the sampling rates are high [39]. Though each of such devices generate data on
    the order of a few tens of kbps, the scale of deployment of such telemetric devices
    in smart city, manufacturing, and medical diagnostic related applications is expected
    to be very high. Therefore, the net impact of the data generated by such devices
    on the communication infrastructure for their transmission can be very high [122].
    Hence, application context aware processing of data at various stages of the network
    is imperative to keep the communication network from being overloaded. Heterogeneity
    of data, nonhomogeneous traffic load across the network, and non-ideal nature
    of communication channels and networks pose additional challenges. The real-life
    data being dynamic stochastic in nature and also the application contexts could
    widely vary [106]. These data context-driven features call for unique nature of
    learning based solutions.


    While node-level and network intelligence are critical for reducing the load on
    resources at the node-level as well as network-level, large-scale deployment of
    IoT nodes over large and potentially inaccessible areas for massive machine-type
    communications (mMTC) can be feasible if the energy needs are addressed via green
    and more cost-efficient solutions [38]. Towards green energy solutions it is expected
    that the usage of ambient energy resources, such as solar, wind, ambient radio
    frequency (RF), will be judiciously exploited even if the energy from power grid
    is available. The power grid connectivity to energy hungry wireless stations,
    such as the clusterheads or edge nodes that connect the field IoT devices for
    telemetric operations, the Wi-Fi access points that provide mostly fixed-wireless
    connectivity, the cellular base stations that serve predominantly for mobile wireless
    connectivity, will act as the resources for two-way energy supply. While the power
    grid energy supply acts as a backup for energy to the wireless nodes, whenever
    possible, these wireless nodes also supply their surplus energy to the grid, thereby
    acting as microgrid power generators. This two-way energy flow in the smart grid
    act as the basis of Internet of Everything (IoE) [17]. There are several design
    optimization aspects for cost, i.e. capital expenditure (CAPEX) and operational
    expenditure (OPEX), minimization from the wireless network operation perspectives
    [97]. There are also issues pertaining to power grid network stability that need
    attention in the IoE [27]. While the smart power grid acts as a facilitator for
    the communication networks, power-grid stability assessment through its monitoring
    is associated with big data handling requirements and network-level challenges
    [28, 29]. Its role on integrating renewable energy along with the conventional
    sources in supplying power to the communication and services infrastructure is
    crucial.'
