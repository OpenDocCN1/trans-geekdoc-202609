    # 7.2.2.3 Semi-Supervised Learning Models


    The semi-supervised learning model is a combination of supervised and unsupervised
    learning models. However, in semi-supervised learning models, datasets are divided
    into two parts: a labeled part and an unlabeled part. This technique is often
    used when labeling data or collecting tagged data is very difficult or expensive.
    The portion of tagged data may also be of low quality [25]. For example, if we
    do medical imaging for cancer, keeping doctors tagged in the datasets is very
    expensive to work on and also these doctors need to do more urgent work. The doctor
    has tagged one part of the dataset and left the other untagged. Finally, this
    machine learning technique has been shown to work well with good precision, even
    if the dataset is partially labeled. Additionally, unlabeled data is easily accessible
    and also available in large quantities.'
