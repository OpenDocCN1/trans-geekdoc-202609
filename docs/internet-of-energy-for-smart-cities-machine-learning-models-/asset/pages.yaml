    in every stage.


    # 7.5.2 SOCIAL CHALLENGES


    Approval: Approval of the smart city project plan from Government is one of the
    major challenges as it required lots of considerations. The governing body may
    not be motivated to convert conventional cities to smart cities as it needs a
    long time project plan and a high volume of capital investment.


    Citizen Engagement: The citizen may be discouraged with the project as they do
    not know the benefits of a smart city. However, they can be motivated with proper
    counseling and providing accurate information.


    Lack of Awareness: As the smart city is a new concept, many citizens may raise
    their voice against the smart city project as they are happy with their existing
    conventional city. Therefore, policymakers also need to consider this scenario
    and clarify the outcomes to the citizen. Additionally, some flexible offers for
    customers should be considered.


    Information Privacy: Privacy is important for both Government and citizen. This
    IoT system is highly porn to cyber-attack and within a second huge amount of data
    can be stolen. These data can also be possible to do modifications. Therefore,
    to maintain the faith of citizens, all kinds of threats should be protected.


    Radiofrequency (RF) signal and health issue: Some health-conscious people and
    medical experts claim that IoT devices emit high-frequency RF signals that can
    cause health problem in long term. This might be an obstacle to run the smart
    city project.


    # 7.5.3 ECONOMIC CHALLENGES


    High Capital Investment: The smart city project requires a high capital investment
    initially that may be a barrier to implement the project. Although, it can overcome
    with a long-term plan by applying a new but small amount of service charges to
    the citizen when they use different software related to this. In this way, both
    the government and citizens are benefited.


    Lack of Investor: Generally, as the smart city project is a government project,
    hence, there is less number of investors are found. The government should encourage
    more investors to invest money with this project with a lucrative profit.


    Cost of Operation: As a smart city concept involves several equipment and steps,
    it requires maintenance on a regular basis. Therefore, IT experts and professionals
    are required to run the project successfully.'
