    types of cyber attacks.


    # 2.8 CONCLUDING REMARKS


    In the 21st century, most of the grids try to convert traditional old age power
    grid into a smart grid for effective and efficient power control and to solve
    the challenges that are suffered by the traditional grid. However, conversion
    of the grid is not an easy task due to it requires lots of financial investments
    as well as research is also recommended before conversion. In this process, the
    grid needs to overcome certain challenges including technical and social problems
    that are also discussed in this chapter. Technical problems can be overcome by
    research and analysis by expertise hands however, to solve the social problem
    collaboration of the Governments with power companies as well as consumers are
    required to raise awareness among the people. Without understanding the benefits
    of the smart grid no one can be interested to invest resources to shift from the
    traditional grid to a smart grid. Therefore, proper counseling and seminars are
    also suggested to spread the knowledge of smart grid.


    The expectation from the smart grid is getting wider with the progress of communication
    and information technology, overcoming all the obstacles, it is expected that
    the evaluation of smart grid in 21st century will be a milestone for a digitizing
    power system. With the automation, all things are getting connected with one another
    provides the opportunity to centralized control and effective management of the
    devices. Additionally, sooner the grid will be considered as a “grid of things”
    with the availability of internet as like “Internet of everything”.


