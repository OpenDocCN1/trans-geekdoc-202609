    DR and DSM measures, as discussed above, may collectively be referred to as intelligent
    load management or load control techniques. Over the years, these have proven
    to be important tools in the operation of modern power systems. With the emergence
    of smart energy systems, these intelligent load management techniques have assisted
    in reliable and stable system operation by mitigating uncertainties which are
    inherent in high RES penetrated systems, improving load factor, imparting an active
    role to consumers by enabling load reduction for peer-to-peer transactions, facilitating
    energy trading within the system, as well as exporting power to the utility, reducing
    the overall energy consumption, providing ancillary services to the distribution
    networks, among other operations of the energy systems [17]. A detailed discussion
    of energy system operations in different timescales is presented in the following
    section.


    # ## 1.3 REAL-TIME GRID ANALYTICS AND DATA MANAGEMENT


    The modern energy systems are an amalgamation of multiple intermittent RES, smart
    devices and controls and storage technologies, interfaced with information and
    communication infrastructure. Owing to the extensive structural and operational
    modifications, the “smarter” energy systems are faced with challenges of bidirectional
    flow of power at multiple timescales. Coordinating the bidirectional power flow
    with temporally distributed power system operations, as well as spatially distributed
    generation of resources is a challenging task. Furthermore, the inherently intermittent
    and uncertain RES create real-time challenges owing to unforeseen variations in
    generation forecasts. Additionally, the smart energy system operations are associated
    with huge amount of data exchange among the various system participants. Large
    volumes of data, flowing at a high rate creates challenges of efficient data handling
    and storage. Accordingly, this section discusses in detail the real-time dynamics
    of energy system operations, high-volume data handling, and effective uncertainty
    mitigation through suitable real-time algorithms capable of small-lead time operation.


    # ## 1.3.1 ENERGY SYSTEM OPERATIONS


    Any power system, including the large interconnected systems or smaller energy
    systems such as microgrids, includes several layers over which the system is planned
    and operated in different timescales. An illustration representing the various
    layers of energy system operations is shown in Figure 1.2. As can be seen from
    the figure, the first layer refers to the planning process which identifies plans
    for integration of new system components such as capacitor banks and feeders,
    in view of the rising load and generation over a forecast duration, which might
    be a few months to several years. This is followed by scheduling which refers
    to short-term decision making such as unit commitment, economic dispatch and time-ahead
    DR. This process is usually dependent upon economic objectives, while several
    other types of'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'network-related objectives may also be used. The *optimal schedule* is computed
    over a period of few days to few hours/minutes, until *gate closure* of the utility.
    Depending upon the timescale of operation of the generators, distributed energy
    resources, energy storage systems and DR programs, the obtained schedule is applied
    and these components are controlled.


    | Timescale | Layer | |

    |---|---|---|

    | Years to Months | Planning | |

    | Weeks to Days | Day-Ahead Scheduling | |

    | Hours to Minutes | Intra-Day Scheduling | Advanced Control |

    | Minutes to Seconds | Real-Time Optimization | Regulatory Control |

    | < 1 Second | Safety Controls and Protection | |

    | < 1 Second | Measurements and Actuation | |

    | | Smart Energy Systems | |


    # Figure 1.2 Layers of energy system operations


    Accordingly, the system performance is essentially governed by two subsystems
    – a computational subsystem which is responsible for the decision-making process,
    and a control subsystem which is responsible for physical control and actuation
    based upon the optimal decisions. The computational subsystem may be composed
    of a computing platform such as a microcontroller, computer or a web application.
    This subsystem executes a program which is generally based upon optimization of
    an energy system operation, and computes an optimal decision. The optimal decision
    is communicated to the control hardware through fast and reliable communication
    infrastructure. The control hardware, upon receiving the optimal decision, generates
    control signals for actual control of the physical devices/equipment.


    The computational subsystem in the scheduling layer computes optimal decision
    in the period of few weeks to minutes which is obtained until the day of actual
    operation is referred to as “day-ahead scheduling”. Day-ahead scheduling is performed
    several times and the obtained schedules are updated until the day of actual operation.
    The scheduling process which is performed during the day of actual operation is
    referred to as “intra-day scheduling”. Intra-day'
  merge: -1
  img_proc: true
