    are known in literature, namely, (i) adaptation of process model, (ii) adaptation
    of optimization and (iii) direct input adaptation [11]. These methods are explained
    as follows:


    +   1. Adaptation of process model: Measurements can be used to refine the model,
    which implies that the mathematical expressions of the functions are updated in
    between consecutive optimization iterations. This adaptation is performed by means
    of the update of the model parameters. Examples include two-stage or multi-stage
    processes.


    +   2. Adaptation of optimization: Measurements can also be used to modify the
    optimization problem directly. With these methods, corrective terms for modifying
    the optimization model are determined. These terms are directly added to the mathematical
    expressions in the formulation, which are kept unchanged. Examples of this method
    are bias update and constraint adaptation.


    +   3. Direct input adaptation: This class of methods proposes direct modification
    of the inputs, in a control-inspired manner. However, the main difficulty in this
    method is to construct a control problem, which has the desired self-optimizing
    properties. Examples include tracking active constraints and extremum-seeking
    control.


    As discussed above, handling uncertainty occurrence in energy systems is imminent
