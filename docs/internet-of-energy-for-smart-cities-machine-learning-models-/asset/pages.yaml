  md: '# 1.1 INTRODUCTION


    Energy forms the basis for existence and sustenance of life. Interactions and
    dynamics of the ecosystem are attributed to a complex interplay of different forms
    of energy. Our dependence on energy is such that the growth and development of
    nations is evaluated based upon energy-derived indicators. These energy indicators
    enable policy-makers to assess growth and evolution and introduce reforms and
    directives to regulate the global energy sector. Among the major energy carriers,
    electricity is one of the most commonly and widely used forms of energy which
    is directly utilized by the end-users, including residential, commercial and industrial
    consumers. Over the years, the electrical power system has gradually and drastically
    evolved in terms of its structure, operation and control practices. The quantum
    of electrical energy in circulation in the power system has increased owing to
    technological developments, growing urbanization and modernization. It is estimated
    that every day humans consume more than a million terrajoules of energy, and this
    demand is expected to rise by 48% from 2012 to 2040 [9].


    Consistent efforts to ensure energy security and energy access require power generation
    to increase at the same rate of increase in demand. However, at present most of
    this energy is produced using fossil fuels in large scales. Rising and prolonged
    use of fossil fuels for global energy generation has emerged as the single largest
    contributor to greenhouse gases. As a consequence, the world’s five hottest years
    on record have occurred since 2015, thus, raising threats of climate change. The
    eventual threats to global weather patterns and awareness regarding high carbon
    footprints, along with the depleting levels of fossil fuels have led to the integration
    of renewable energy sources (RES) in the existing energy system. RES, in contrast
    to conventional sources of energy, are carbon-free energy sources which replenish
    themselves within the human time-frame, such as solar, wind, and biomass. Thus,
    RES integration has been widely identified as the way forward for the global energy
    scenario.


    In view of impending global issues, the United Nations (UN) designed the millennium
    development goals which are a set of eight time-bound international development
    goals established in the year 2000 [37]. These focused upon holistic global development
    with emphasis on pertinent issues such as poverty eradication, gender empowerment,
    health and education for all, with a 15-year deadline to achieve the set goals.
    While the millennium development goals proved to be successful and instrumental
    in combating several prominent issue, the need for effective handling of global
    warming and climate change was increasingly and unanimously realized worldwide.
    The experience and success of millennium development goals paved way for the adoption
    of a sustainable approach to global development, which led to the foundation of
    the sustainable development goals (SDGs) [35]. Thus, in the year 2015, the millennium
    development goals were superseded by the SDGs, which were designed as a “blueprint
    to achieve a better and more sustainable future for all”. Accordingly, 17 SDGs
    were set by the United Nations General Assembly in 2015 at the COP21 Paris Climate
    Conference [33]. The essence of the SDGs is the incorporation of efforts to reduce
    global carbon emissions and tackle the impending risks of climate change. The
    SDGs have been designed with an integrated approach which'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'recognizes that action in one area will affect outcomes in others, and that
    development must balance social, economic and environmental sustainability.


    Driven by the sustainable development goals (SDG), smart cities have been conceptualized
    which aim at the provision of urban ecosystems with adequate infrastructure for
    holistic development, and enhancing the quality of life of its individuals. To
    meet the increasing energy needs, nations are gradually moving toward adoption
    of cleaner energy sources with lower emissions to minimize carbon footprints,
    while improving the physical quality of life. Since smart cities focus on quantitative
    and qualitative metrics of development and quality of life, the concept is relative
    to the state of development of a geographical area and may vary as countries develop
    with time, and also may differ from country to country, or even within one country,
    from state to state, and city to city. The principle guidelines are, however,
    governed by the directives of SDG 11. What appears common to most of these definitions
    is the recognition of the need to consider an innovative and forward-looking use
    of the infrastructural systems, with positive outcomes on climate, environment,
    and social and economic conditions.


    # United Nations Sustainable Development Goal 11: Sustainable Cities and Communities


    SDG 11 is focused upon making cities inclusive, safe, resilient and sustainable.
    It was estimated that in 2018 nearly 4.2 billion people, which account for 55%
    of the global population lived in cities. This number is expected to grow to 5
    billion by 2030 owing to rapid urbanization and migration. This highlights the
    need to equip urban settlements with solutions to combat the major issues that
    humanity is faced. Among the pressing challenges faced by cities are the high
    levels of energy consumption. It has been estimated that cities occupy around
    3% of the Earth’s land, however, their energy consumption accounts for 60-80%
    of the total energy consumption, and contribute to 75% of the global carbon emissions.
    The United Nations has thus, identified that smart cities hold the key to sustainable
    development. Accordingly, smart cities and communities have been included among
    the 17 global goals set by the United Nations in 2015, which are intended to be
    achieved by 2030 [2, 34].


    Energy security and access are key aspects of a smart city. Globally 860 million
    people do not have access to electricity. Ensuring adequate supply of power to
    the global population would require increasing the generation at the same rate
    as demand, and suitable transmission resources. It is noteworthy that the existing
    electricity transmission infrastructure that transfers bulk power is gradually
    ageing and losing its reliability, and establishing a new transmission system
    is highly capital intensive. While meeting rising loads by increasing generation
    through fossil-fuel-based central power stations is constrained by high CO2 emissions
    and limited availability of fossil fuels, RES integration is faced with grid-integration
    challenges owing to specific peculiarities of these systems. RES are inherently
    intermittent and variable'
