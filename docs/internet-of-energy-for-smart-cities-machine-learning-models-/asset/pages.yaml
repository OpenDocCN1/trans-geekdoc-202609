- pgno: 314
  md: 'Smart grid connectivity: The third aspect of energy sustainability with possible
    green energy resources features an evolving scenario where the nodes have the
    ambient energy harvesting capability along with their power grid connectivity
    [54], [12]. A practical example is cellular BSs in semi-urban or rural areas in
    developing countries, where power from the grid connectivity is not always guaranteed.
    Even in smart city context, in a bid to green energy sustainability, the power-line
    connected wireless access points could be equipped with ambient energy harvesting
    capability. Having a dual power connectivity (e.g. solar energy and power grid)
    helps in design and dimensioning of solar panel and storage batteries without
    looking to factor the worst-case scenarios of traffic intensity and sustained
    nonavailability of solar energy. While solar (ambient) energy availability is
    stochastic, in most mobile communication as well as IoT sensing applications the
    traffic pattern that a node needs to handle is also dynamically varying. Thus,
    in the worse-case scenario, green energy resource dimensioning may be insufficient,
    requiring the node to draw power from the power grid. Conversely, in the best-case
    scenario the node may have sufficient surplus energy which may be transferred
    to the power grid. In a networked set of BSs or wireless access points, these
    situations of deficient or surplus power can be dealt with further efficiently,
    for cost optimization of the network service provider.


    A fallout of this two-way power flow between a wireless (IoT edge) node and power
    grid is that the edge nodes also act as energy supply points – though with sporadic
    nature, aiding to the power grid’s energy flexibility. In the next section we
    will discuss the additional challenges in power grid that are associated with
    the two-way energy flow.


    # 11.4.2 STABILITY AND CONTROLLABILITY OF POWER GRID


    Challenges and mitigation approaches: Conventional, old SCADA system that is being
    replaced by the PMUs in smart grid aim at timely reporting of impending instability
    and consequent blackout in power grid. This is caused by extreme imbalance between
    power load demand and supply. With the PMU-aided smart grid, real-time prediction
    and mitigation of blackout are possible through robust and secure extraction of
    stability information from the health parameters collected at the PMUs. One challenge
    is that, the power grid health anomaly data collected at a PMU does not necessarily
    imply it is caused the nearby disturbances. To make a better sense on the actual
    health status and the causes, it is important that the data from multiple PMUs
    are jointly analyzed. To explore joint data analysis, the data from multiple PMUs
    need to be studied at a collection point. To enable timely intervention for grid
    failure mitigation, appropriate clustering of PMUs for distributed data processing
    is required that can minimize communication and processing delay [59]. Adaptive
    corrective controller design for real-time response are necessary for automated
    response to the predicted instability.


    As noted in Section 11.2.4, while the PMUs capture the load fluctuation through
    line frequency variation and other phasor data, the major faults occurring in
    the grid are arrested by the mechanical relays. However, if the quantum of perturbation
    at'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'some points are below the circuit breaking sensitivity of the mechanical relays,
    such perturbations continue to propagate beyond the fault location region. It
    is important here to analyze how multiple neighboring PMUs capture such events.
    It is also important to investigate how fast and along which trajectory the perturbations
    propagate across the network. The information on disturbance propagation, if accurately
    extracted, can be used for isolating the faults, thereby avoiding costly cascaded
    failure of the power grid.


    In order to controllably handle big data issue, the works in [104, 107] have suggested
    to introduce data pruning. However, unless the network vulnerabilities are sufficiently
    addressed, data pruning may invite insufficient statistics of grid health data
    to reach at the PDC, which may trigger false actions. Security breaches at the
    node level or at the network may also wrongly let the systems manager take a wrong
    decision on power grid health. Therefore, data pruning technology needs to be
    accompanied by additional capabilities of robustness at the system level data
    transmission. Further, contemporary smart grids still do not have the automation
    feature. The data is merely used for human intelligence on load distribution through
    manual intervention. These are some of the aspects that need attention for fail-safe
    smart grid automation.


    **Modern-day power grid challenges:** While conventional power grid has its own
    issues of stability and predictable controllability, the introduction of two-way
    energy connectivity in smart city context adds to its further challenge [117].
    The additional power supply from microgrids act as distributed power generators,
    which is a major step forward to reducing the carbon footprint while directly/indirectly
    serving massive IoT connectivity. A challenge is also posed by intermittent islanding
    and resynchronization of the microgrids [33]. Since surplus power from the microgrids
    are from ambient sources, there is no inertia involved with power generation.
    Likewise, depending on the microgrid’s power requirement when it decides to isolate
    itself (through islanding) from the power grid, sudden change occurs in power
    supply/demand from the microgrid. Combinedly, random nature of supply-demand causes
    load fluctuation in the power grid, which is manifested in its change in line
    frequency. A high magnitude of change of load leads to a higher change of frequency,
    which may lead to instability in the power grid. To address the stability issue,
    a possible mitigation technique is to introduce a set of protocols at the islanding
    and resynchronization stages [76]. With the renewable energy which is already
    a DC signal and most of the IoT appliances operating with DC power, a DC power
    grid and its distributed control has evolved [58]. The nature of data pruning,
    associated with stochastic loss and delay behavior of smart grid data routing
    also add to the stability issue. Data compromise at the routing stage or spoofing
    the data transmitted over public network are some additional challenges that are
    of contemporary research interest.


    # 11.5 CONCLUDING REMARKS


    Through this chapter a paradigm shift associated with smart environments is highlighted.
    It has been demonstrated how the challenges of big data and'
