  md: 'energy sustainability are addressed via application-specific unique approaches.
    For example, the data-driven and network solutions for dealing with real-time
    (low-latency) traffic has been very different compared to those associated with
    not-so-time-critical but loss-intolerant traffic. Since each IoE application has
    the corresponding specialized features and device-level constraints, it has been
    shown that the network intelligence solutions need to be appropriately designed.
    Beyond energy/bandwidth/storage efficient optimization techniques, energy sustainability
    and green communication techniques have been presented. The research state-of-the-art
    and open issues on mitigating big data challenges and energy sustainability have
    been highlighted. Further, the role of smart grid on uninterrupted IoE operation,
    the benefits of distributed energy generation through IoE, and the newer challenges
    of power grid stability/controllability have also been discussed.


