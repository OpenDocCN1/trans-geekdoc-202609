    # 6.1 INTRODUCTION


    The term Internet of Energy (IoE) was firstly inspired in the third industrial
    revolution by (Jeremy Rifkin, 2008) [1], which refers to an electricity solution
    for power flow and bidirectional information in an internet-style, which is also
    known as energy internet and it is considered as a smart grid extension [2, 3].
    IoE has recently become an interesting field and attracts a lot of researchers
    and developers from almost all developing countries as in Europe, US, Germany,
    China, and Japan [4, 5]. IoE acts as a cloud network where power sources with
    embedded and distributed intelligence are interfaced to smart grid and mass of
    consumption devices like smart buildings, appliances, and electric vehicles.


    In fact, smart metering technology has a vital role in IoE [8]. In addition to
    its application in smart automation applications (see Figure 6.1), it enables
    the ability of consumption and energy sensing with either electronic or electromechanical
    components, that helps consumers in management and optimization of energy resources
    in both commercial and residential various applications [5]. This rapid increase
    of IoE application in modern life applications and industry led to innovation
    of IoE standards which will be discussed later in this chapter, in addition to
    IoE architectures, interoperability, privacy, and security.


    The need for continuous development in energy management has different factors
    indeed. Starting by development in energy generation techniques from traditional
    ways to modern renewable techniques. Then distribution and transformation development
    will be also required to compatible forms with that developed energy generation
    techniques. Also, the adoption of technology in various real live applications
    including civilian and manufacturing environments causes a massive increase in
    number of users and devices with numerous processes and services that consumes
    energy rabidly [6, 7]. This development introduces more challenges in centralized
    infrastructures of energy production and distribution and rises the need to develop
    modern and sophisticated solutions to meet both energy efficient and applications
    demands requirements.


    The negative environmental impacts of traditional energy systems such as fossil
    fuel energy generation turns the focus of energy producers to renewable energy
    as a promising way for green life applications and the best choice for business
    demands [8]. Moreover, the development of renewable energy techniques such as
    solar and wind energy are main factors to develop an integrated energy platform
    that has the decentralization ability and compatibility with current techniques
    in use.'
