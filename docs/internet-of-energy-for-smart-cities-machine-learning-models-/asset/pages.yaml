  md: '# 6.3 EMBEDDING INTELLIGENCE IN IOE DESIGN


    As development of emerging technology-based systems are rapidly growing, and adoption
    of its applications in various real-world fields, data analysis and storage platforms
    are also requiring a suitable and sophisticated framework to integrate that development
    and offer reliability and scalability of systems specially in real-time applications
    and such as required by IoE methodology. Computational environment and tools are
    found to meet that challenge by enabling more computation and storage capabilities
    that can affect system performance concurrently.


    Development in web-based applications represents the main factor behind computation
    tools development, but also finds its way in other applications such as networking,
    communication, healthcare, industry, energy, etc. As mentioned in previous sections
    IoE concept occurrence and architecture evolution is mainly depends on computational
    environment growth as in cloud computing, fog or edge computing, and latest emerging
    technology known as blockchain technology [30]. All of these technologies use
    a common principle which is the decentralization and distribution of service nodes
    somehow, but may differs in its locations, properties, and functionalities.


    # 6.3.1 CLOUD COMPUTING


    Cloud computing represents an evolutionary version of computational tools that
    consists an improved and reliable management platform for data warehousing, data
    analysis, and monitoring. Cloud computing providers promises to maintain data
    availability and reliability of all data related operations by providing an evolutionary
    infrastructure that includes multiple ways for data warehousing and data aggregation
    framework, in addition to modern developed functionalities that required for an
    emerging applications such as data monitoring and visualization, big data analysis,
    real-time and low latency processing, and diversity of computation resources [30].
    Cloud computing introduced various solutions for services provider by offering
    four main services are; infrastructure as a service (IaaS), platform as a service
    (Paas), software as a service (SaaS), and backend as a service (BaaS).


    Cloud computing upgraded traditional computation environment by enabling an on-demand
    and availability of data by distribution of services into multiple locations from
    central servers, here virtual machine (VM) had played the main role of enabling
    multiple and different computation capabilities on a single hardware, also software
    development plays an important role in building application programming interfaces
    (API) for data interaction and management. Additionally, cloud computing offered
    an excellent integration and compatibility with IoT applications and platforms
    by enabling multiplicity for various IoT platforms and higher system bandwidth
    capabilities as required by IoT applications.


    A typical Energy Internet architecture featuring integrated information and energy
    infrastructures highlighting the connectivity between energy routers and cloud-based
    data centers introduced by Huawei is shown in Figure 6.8. The application of cloud
    computing in IoE introduces more opportunity and solutions in today challenges'
  merge: -1
  img_proc: true
