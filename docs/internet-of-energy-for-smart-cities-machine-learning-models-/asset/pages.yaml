    # ## 1.4 INTELLIGENT CLOUD-BASED GRID APPLICATIONS


    Energy systems are composed of multiple controllable resources including distributed
    generation sources such as RES and fuel cells, energy storage systems such as
    batteries and supercapacitors, along with responsive loads. Energy system operations
    require several coordinated control actions which are governed by physical limitations
    on the system such as thermal limits of the lines and bus voltage limits, while
    ensuring real and reactive power balance at all buses. These control actions such
    as load scheduling, economic dispatch, fault clearing, re-synchronization and
    islanding are coordinated over different timescales, from a few seconds to hours.
    Further, energy and power trading in electrical networks spans over a long duration,
    starting with long-term contracts signed over a period of months to years, day-ahead
    markets which compute schedules up to the actual day of operation, intra-day trading,
    and finally real-time power exchanges.


    It is also noteworthy, that the agents engaged in these operations are spatially
    distributed and located at different locations in the energy systems. Further,
    the environment around each of these agents may be unique and dynamic, which might
    deviate from the design conditions of the controllers. It is, thus, evident that
    the planning, scheduling, operation and control processes in an energy system
    are spanned over the timescale of years to less than a second, over wide areas,
    and under varying conditions, thus, highlighting the need for temporal as well
    as spatial coordination framework. Accordingly, three major control strategies
    have been widely employed in the control of energy systems, namely, (a) centralized,
    (b) decentralized and (c) distributed control [31].


    # ## 1.4.1 CENTRALIZED CONTROL


    Centralized control refers to the control architecture where there is a single
    decision making entity. The different system components are controlled by a central
    controlling agent. This agent is responsible for monitoring, collecting and analyzing
    the data during real-time system operations. The centralized approach has been
    widely used in practice and has gradually evolved over the years. Common applications
    of centralized control in power systems are microgrid control, economic dispatch,
    unit commitment, wholesale electricity markets, energy management systems, etc.
    However, over the years, it has been realized that with gradual development of
    active distribution systems which are composed of distributed energy resources,'
