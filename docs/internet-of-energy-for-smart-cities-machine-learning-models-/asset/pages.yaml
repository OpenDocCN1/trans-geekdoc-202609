  md: '# 6.4.1 IEEE 2030 STANDARD


    IEEE 2030 standard is intended to but the roadmap to achieve smart grid interoperability,
    by establishing the smart grid interoperability reference model (SGIRM) that models
    the framework of engineering principles to apply smart grid interoperability upon
    all electrical power system components. These visions are looking beyond the year
    2030 and are predicting how the smart grid will evolve for each of these technology-focused
    areas [37]. The package of IEEE 2030 standard series includes many recommendations
    and guides for design, implementation, and evaluation sectors of smart grid systems
    as summarized in Table 6.2.


    # 6.4.2 IEEE 802.15.4G


    Design consideration of smart grid requires modern solutions for networking and
    communication operations, Wi-Fi and Zigbee wireless communication was the available
    suitable standards as also demonstrated with some basic smart grid applications,
    but more specifications and procedures are required, IEEE 802.15.4g standard is
    developed to meet that requirements. IEEE 802.15.4g describes the standard wireless
    communication platform for smart utility service, architecture of IEEE 802.15.4g
    communication platform as shown in Figure 6.11 [35]. Both orthogonal frequency
    division multiplexing (OFDM) and multi-regional frequency shift keying (MR-FSK)
    operating in sub-1GHz frequency are used in the physical layer. The selection
    of those PHYs depends on the types of applications, and both can be controlled
    by the MAC layer. The MAC layer can control both PHYs, we do not operate them
    simultaneously. Implementation of MAC hardware accelerator and the OFDM and MR-FSK
    modem is performed with an emerging FPGA technology [33, 35]. The FSK and OFDM
    RF blocks are both implemented in ASICs which are fabricated through CMOS 0.18um
    process [38]. The MAC and application software are running on a 32-bit microcontroller.


    # 6.4.3 IEEE 21450 AND IEEE 21451


    International organization for standardization, and the international electrotechnical
    commission (ISO/IEC/IEEE 21450) standard provides a common foundation for members
    of the (ISO/IEC/IEEE 21451) series of international standards to be able to exchange
    and make use of information. It realizes the functionalities that are to be performed
    by a transducer interface module (TIM) and the joint characteristics for all TIM
    based devices. It also defines the formats for transducer electronic data sheets
    (TEDS) and the set of commands to simplify the configuration and control of the
    TIM as well as reading and writing the data used by the system. To facilitate
    communications with the TIM and with applications, application programming interfaces
    (APIs) are defined [38].'
