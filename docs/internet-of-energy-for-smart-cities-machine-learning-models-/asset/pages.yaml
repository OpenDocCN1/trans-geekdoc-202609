    Also presented are the main architectures and the key technologies (Section 3.3)
    to achieve the Smart Grid model. This section discusses how these technologies
    are associated with new structure frameworks, which in turn go back to the new
    paradigms of power systems. This section is divided into three fields. These are
    communication structure, automation and metering, and microgrid and distributed
    generation.


    In the penultimate section (Section 3.4), the main aspects of interoperability
    and scalability for projects and smart grids, are addressed. At this point, the
    text points out the main standards that address these topics and evaluation aspects.


    Finally, some Smart Grid applications (Section 3.5) are presented, collected from
    real projects using technologies and concepts covered in the chapter. These projects
    are described and illustrated to contextualize the theory with applications already
    implemented.


