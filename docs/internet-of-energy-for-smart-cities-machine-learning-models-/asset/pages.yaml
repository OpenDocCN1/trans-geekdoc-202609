    of individual products and the assembly of systems, solutions, and architectures.
    Security in depth implies the realization that any security feature by itself
    is breakable with enough effort, and only multiple security controls layered in
    a concentric way around protected assets can provide a security superior to the
    sum of the individual parts [40]. And an End-to-end security is safeguarding information
    in an information system from point of origin to point of destination. Full end-to-end
    security, however, would require all endpoints to support a common control security
    mechanism.


    According to IEEE standard recommendation and standard, the IEEE 1686™, IEEE P37.240™,
    IEEE 1711™, IEEE 1402™, and IEC 62351 series are the best practice for cyber security
    introduced for IoE solutions. While the federal energy regulatory commission (FERC),
    recognizing the needs of energy sector, as identified in demand and response,
    wide area situational awareness, energy storage, electric transportation. Also,
    FERC identifies two cross-cutting priorities, namely, cyber security and communication
    and coordination, across inter-system data flows. Similarly, the department of
    energy (DoE) has identified that the smart grid should operate resiliently against
    physical and cyber-attacks and natural disasters.


