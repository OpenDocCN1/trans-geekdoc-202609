    # ## 3.2.2 HOLISTIC NORMATIVE ENGINEERING DESIGN FOR SMART GRIDS


    The great complexity of SGs requires several solutions to the challenges of system
    integration, in addition to dimensioning the impacts for different stakeholders.
    The propose of this approach is to draw attention to Normative Design Frameworks,
    which attempts to cover the complexity of the grid on the future taking into account
    the most important components and relationships in an integrated holistic way.


    The Philosophy of technology is like a mosaic of ideas and suggestions, but this
    should not minimize its relevance to engineering and technological developments
    [25]. The ongoing transformations of the network of the future, which are becoming
    increasingly intelligent, raise a number of technical, social, and economic issues
    that cannot be addressed separately. It is important that technological project
    developments are aligned with all the faces and impacts that the final deployment
    is influencing.


    The changing scenario has promoted the development of new concepts in which SGs
    have become the new design approach for the development of the future electric
    networks, allowing integrated and enhanced performance and diagnosis [26].


    In [27], the levels of complexity of SGs can be distinguished between three strongly
    intertwined categories: dimensional complexity, technological complexity, and
    stakeholders complexity. Figure 3.6 illustrates this division.


    ![](img/617e854c2620a5a4bed0116cef33155a_99_0.png)


    Figure 3.6 Framework of complexity in SGs'
  merge: -1
  img_proc: true
