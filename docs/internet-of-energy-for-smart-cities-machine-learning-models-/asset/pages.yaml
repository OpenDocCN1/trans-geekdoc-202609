  md: '# 10.5 DISCUSSION AND CONCLUSION


    Nowadays, the concept of minimization of consumption of energy is more important
    and getting more critical due to the lack of resources and an over-demand of energy.
    As a result, there is a surge in demand for energy, but only limited supply is
    possible due to limited resources.


    Also due to some limitations and inefficiency to manage the energy consumption,
    the conventional light control systems are not feasible for the long run and they
    can’t be successfully installed. The ease of access also plays a major factor
    in developing Smart Systems using which the consumers can easily access their
    appliances remotely.


    The proposed system minimizes energy consumption as well as gives the consumer
    remote access to their appliances. Energy is saved using the trained model of
    Computer Vision which accurately identifies how much light intensity is required
    in a particular room of the building and manages it automatically in order to
    save the energy with minimum interaction and also the system provides privilege
    access to its users, i.e. it provides the system the capability to allow different
    users to access same appliance where some users might have access to particular
    appliance temporarily while some may have it permanently. Thus, by using the system
    proposed, we can simultaneously achieve both the goals.


    # 10.6 LIMITATIONS


    The current prototype has some limitations which are now in the modification stage
    and are being worked upon for the development of the system. The primary limitation
    faced is that the HTTP response and request are slow when the internet connection
    is weak. This is due to the free version of RESTful APIs which has higher latency
    compared to paid APIs. Another issue faced is the presence detection of person(s)
    done using the Computer Vision module which is moderately accurate. A proper dataset
    to train the model of Computer Vision is not available, so a dataset is being
    developed using which more accurate and efficient model can be made and the main
    purpose of minimizing consumption of energy can be achieved as predicted theoretically
    while prototyping the system. The prototype is limited to light appliances only.


    # 10.7 FUTURE ENHANCEMENTS


    The system is under development using the customized dataset developed. Therefore,
    the proposed model is to develop a system more efficient than the current prototype
    which has an accuracy of around 50% only for the presence detection of person(s)
    in a room. Therefore, the Computer Vision module can be made more efficient by
    using better algorithms for presence detection in a room that is cost-efficient
    to optimize the consumption of energy.'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'The system facing the issue of high latency in HTTP requests and responses
    can be resolved by developing more efficient APIs. The system can be made compatible
    with more electrical appliances unlike the prototype currently compatible only
    with light appliances. The application of the system can be made available for
    both iOS and Android platforms with complete integration of all modules with higher
    efficiency.


