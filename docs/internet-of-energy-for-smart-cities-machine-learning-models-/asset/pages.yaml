  md: '# 1.2.2 DEMAND SIDE MANAGEMENT


    While DR refers to short-term variations in electricity consumption which are
    induced by the system operator, long-term interventions to achieve reduction in
    energy demand are referred to as demand side management (DSM) techniques. Essentially,
    DSM is the co-ordination of loads on the demand side, and set of activities that
    helps utility and its customers to modify the shape, and reduce peak to flatten
    the load curve [21, 24]. It is used to control the way consumers use electricity
    to achieve energy savings with higher efficiency in energy use. By the use of
    DSM, improved transmission and distribution grid efficiency can be achieved, while
    promoting effective utilization of RES, and refine stability and efficiency of
    the electric grid. The field of DSM encompasses varied techniques and algorithms.
    An illustration of load shapes with application of DSM techniques is given in
    Figure 1.1. There are six main DSM techniques, namely, load shifting, peak clipping,
    conservation, load building, valley filling, and flexible load shape [25, 26].


    ![](img/617e854c2620a5a4bed0116cef33155a_32_0.png)


    Figure 1.1 Various DSM techniques


    Load shifting technique shifts deferrable loads from peak hours to off-peak hours
    resulting in lower peak and flatter curve. In peak clipping, load from peak hours
    is reduced by encouraging consumers to decrease their power consumption. It is
    a direct load control technique. Conservation refers to continuous reduction in
    power consumption by users. Consequently, reduction in complete load curve is
    achieved by motivating consumers to use more energy efficient appliances. Valley
    filling includes increase in loads during off-peak hours to a achieve flatter
    load curve. It is done by increase in energy consumption. This technique may be
    required when the average price is lower than the cost of load building in the
    off-peak hours. Load building technique is used in case of increased demand in
    electricity to optimize daily responses beyond valley filling. It is required
    in case of surplus energy production.'
  merge: -1
  img_proc: true
