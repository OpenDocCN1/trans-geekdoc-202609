    # 7.4 SMART CITY DESIGN INFRASTRUCTURE


    This section briefly describes the application of ML for smart cities. The concept
    of ML applications in smart cities is illustrated in Figure 7.21. One can observe
    that this framework consisting of three levels, namely, IoT devices, fog computing,
    and cloud computing [22]. The devices/sensors of the smart city are controlled
    by intelligent software that is correlated with the fog or cloud. Raw data that
    is generated from various sensor devices in a typical smart city can be sent to
    the fog and then to the cloud for storage and processing for performance prediction.
    For example, street lights can automatically be turned off or turned on based
    on weather conditions.


    The inspiration behind this architecture is that as data travels through the smart
    city infrastructure, images from the deeper levels of data abstraction and knowledge
    presentation can be encapsulated. At the highest level, city-wide abstraction
    is required to manage the city’s resources and services over the long term. At
    the lowest level, the data generated by sensors and smart objects are used to
    manage resources and services in the short term. Additionally, fog-based analytics
    support local activities in predefined contexts, but cloud-based analytics can
    cover larger geographic regions in different contexts.


    The level of IoT infrastructure where sensors and devices with limited resources
    perceive the environment. The resource limitations of these devices make it difficult
    to implement large and complex learning models. Instead, multiple shallow machine
    learning methods can be applied to make them smarter in the context of devices,
    including ineffective and semi-supervised methods (for example, closest K neighbors,
    support vector machines, etc.). However, modern and advanced learning models,
    such as deep learning, should be used to bring analysis and intelligence closer
    to data sources (for example, end-users, IoT devices with limited resources).
    A postgraduate research pathway transcends resource limitations to allow deep
    neural network models of these devices to use them. In recent years, various methods
    have been proposed to compress or cut deep neural networks so that they can be
    loaded into devices'
