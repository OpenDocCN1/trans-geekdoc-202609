    # 1.3.4.2 Stochastic Programming with Recourse


    Stochastic programming is the field of operations research that assumes probability
    distributions can be estimated for the uncertain variables in the optimization
    model. These probability distribution functions are then employed to generate
    random scenario occurrences, and an expected value of the objective is optimized.
    While robust optimization deals with hard constraint satisfaction, stochastic
    programming is generally used for problems with soft constraints, which are expected
    to yield good results on average. The stochastic programming with recourse is
    essentially a two-stage problem which performs the first stage optimization in
    the absence of uncertainties, and delays the second stage decision to a later
    time when uncertainties are actually present or a precise information is available
    for the uncertain variables.


    Let us consider an energy system operation where certain information is available
