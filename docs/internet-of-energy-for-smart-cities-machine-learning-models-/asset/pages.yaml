  md: 'For all methods, the third feature set is the set that gives the best results,
    followed closely by the first feature set. Future work will seek to apply the
    methods for an extended data set where a good candidate for a relevant (for snow
    coverage) feature would be the information about the level of precipitation.


    The main purpose of this research was to start the initial development of a monitoring
    system and a method to be used in this system for the identification of possible
    degradation of PV panel operation based on machine learning (ML) techniques.


    The results presented in this study are influenced by several factors among we
    can mention the fact that for the moment the PV park is not working at it full
    capacity and its connection to the grid is not finalized. The PV park has a small
    load consisting in an architectural lighting system that is connected only during
    the night time.


    Further research will seek to extend the method to production PV parks and using
    data sets closer to a real situation.


    # 9.8 CONCLUSIONS


    In this work we have presented a method for monitoring and identifying the situation
    when solar panels in a PV platform are in a reduced operation status. This can
    be the result of coverage of the PV panel surface with different substances such
    snow, mud or sand. The use case presented takes into consideration coverage with
    snow, but the method can be easily extended to the case of other materials.


    These particular conditions are specific to certain geographical locations (proximity
    to deserts, seas, or oceans), to some periods of the year (heavy storms, fog,
    snowing) or to specific temporary conditions of the PV system location (period
    of expansion of residential or industrial constructions or execution of heavy
    infrastructure works).


    For developing this method we have applied some well known classification algorithms
    on a common dataset created with data collected from the Enered PV platform (which
    is part of a larger research project that deals with improvement of energy generation
    and consumption), weather mini stations and astronomical data calculators.


    Early identification of situations when PV panels operation is degraded is aimed
    to be part of a monitoring system that can alert and are can promptly trigger
    the appropriate activities needed to remove the negative effects and to restore
    operational parameters to their typical values.


