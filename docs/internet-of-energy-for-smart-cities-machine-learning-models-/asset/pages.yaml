  md: '# 8.3.2 BIG DATA AND MACHINE LEARNING


    The massive amounts of data need to proceed for applications, such as drug effectiveness
    analysis, climate monitoring, website recommendations, etc. Thus, we need to be
    able to add scalability to machine learning techniques [12]. How do we apply machine
    learning at scale?


    One solution is to scale up by adding more processors, memory, and storage system
    so as to store and process massive amounts of data. It is also possible to utilize
    graphical processing units (GPUs) for analyzing datasets in machine learning tasks.
    Although it seems to be an acceptable approach, this solution cannot be used in
    all problems, and it is not considered a big data approach. The disadvantages
    of this approach are the cost of adding specialized hardware such as GPUs and
    reach the maximum capacity of storage and processing system at some point.


    An alternative method, the big data approach, is to scale out. This implies using
    as many as possible local distributed systems to handle the storage and processing
    limitations. In this method, the data is spread over systems to attain more power
    to speed up processing. As it is shown in Figure 8.4, the main idea is to split
    data into smaller sub-groups, and after processing each sub-group, the results
    are projected to the merging unit [13].


    ![](img/617e854c2620a5a4bed0116cef33155a_230_0.png)


    Figure 8.4 Divided data into subsets to speed up processing'
