  md: 'in nature. Interconnecting these sources to the main grid leads to issues of
    power quality, frequency and voltage regulation. However, being distributed in
    nature, energy from RES can be harnessed locally closer to the utilization end,
    thereby reducing transmission losses. Furthermore, utilization closer to the consumption
    point minimizes costs associated with power transmission and distribution. Additionally,
    interconnection issues at the distribution level are fairly small scale in comparison
    to grid-level issues, and can be mitigated with suitable distribution-level corrective
    techniques.


    Accordingly, continuous efforts are being made in smart cities for development
    of methods and technologies for harnessing energy through cleaner and sustainable
    sources [6, 23]. This has led to the emergence of smart energy systems which focus
    on integration of multiple energy-producing and energy-consuming sectors with
    an objective to identify and develop coherent sustainable and optimal solutions
    for future energy requirements. Incorporation of information and communication
    technology in smart energy systems enables suitable control of multiple generation,
    energy storage and load resources through generator control actions and demand-side
    control measures such as demand response and demand side management. Thus, smart
    energy systems essentially focus on identifying sub-sectoral synergies among electrical,
    thermal and gas systems, with an attempt to derive low-carbon and sustainable
    infrastructural designs, and operational strategies. Some prominent sub-sectoral
    synergies include the following:


    +   1. District heating and cooling offers significant energy savings which promotes
    development of electricity and heat-based technologies for space heating/cooling
    in buildings and microgrids.

    +   2. Waste heat emitted from industries and power plants can be used for space
    heating/cooling through district thermal distribution networks and heat pumps.

    +   3. Combined production of electricity and heat through combined heat and power
    (CHP) units improve utilization efficiencies of the generating system, which is
    otherwise very low since a significant amount of energy is lost in multiple conversion
    processes.

    +   4. Thermal energy storage, being cheaper and more efficient in comparison
    to electrical storage, enables flexible operation of space heating/cooling in
    buildings and microgrids.

    +   5. Thermal loads served by electricity may assist the electrical grid as balancing
    resources through demand response.

    +   6. Biofuel and biogas are clean fuels for CHP generation, thus, emerging as
    strategic energy players in rural areas where availability of biomass is abundant.

    +   7. Electric vehicles have emerged as clean alternatives to fuel in the transportation
    sector, while also providing grid-balancing services.


    In accordance to the form of primary energy flow in a network, the energy sector
    is broadly characterized into electricity, thermal and gas grids, discussed as
    follows.'
