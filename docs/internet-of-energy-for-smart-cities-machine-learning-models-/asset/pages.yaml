  md: '# 3.1 INTRODUCTION


    The Electrical Power Systems around the world are based on large-scale production
    and are mainly centralized. However, this is a changing reality. The systems are
    adapting to the growing spread of distributed generation. Thus, the bulk power
    generation is now complemented by a significant number of small scale power generation
    units and Microgrids. Another characteristic of this new generation context is
    the high penetration of renewable energy sources, which is explained by society’s
    greater concern with Global Warming and the reduction of CO2 emissions.


    Along with these transformations, the systems that make up the energy supply chain
    have acquired new complexities in the operation, carrying some issues, such as
    the insecurity of renewable generation, new problems of supply quality, new paradigms
    of the electric sector, and new demands. Thus, to deal with these issues, more
    robust solutions are required, in addition to the use of new technologies that
    make the grid become smarter. The relentless evolution of communication systems,
    in particular, has derived the development of advanced control and monitoring
    techniques to increase the reliability and quality of energy systems, in addition
    to making it more financially advantageous.


    Smart Grids (SG) proposes a structure with evolutionary features of the network
    to adapt to the new scenario with a wide use of information and communication
    technologies (ICTs), bidirectional flow of energy and data, use of artificial
    intelligence, among other aspects [1, 2]. This modern grid also promotes better
    integration between microgrids and large-scale systems. This will require a major
    change in the operational paradigm, evolving from an outdated passive perspective
    toward a future grid active management approach [3].


    This transition incorporates the large insertion of renewable sources, with an
    emphasis on solar and wind energy in the context of distributed generation. This
    aspect has several advantages when it is considered in regards to the consumer,
    who in this scenario becomes a prosumer, that is, one who can consume as well
    as produce energy. Looking at it this way, this agent now has more freedom to
    manage its energy balance. Another benefit is related to the use of clean energy
    which is not harmful to the environment and capable of reducing the carbon footprints
    through the use of electricity. On the other hand, the intermittent characteristics
    of these sources and their high penetration leads to many technical concerns,
    such as rapid voltage variations, reactive power control, harmonic distortions,
    quality issues.


    As a result of the various aspects mentioned, economic changes are also foreseen
    in the electricity sector, some of which already takes place to provide the benefits
    of SGs on time. Along with the technical challenges, new business models and new
    regulations are emerging to change the rules following the new scenario, without
    losing the previously established social welfare premises. Social and political
    considerations are discussed for new projects, since the affected stakeholders
    are quite varied. News in the consumer classes, transaction models, rate plans
    are examples that promote this adequacy, but that cannot fail to consider universal
    access to energy and the market peculiarities. The services provided change, for
    example, the reactive power control at distribution site to mitigate the effects
    of the massive use of photovoltaic (PV) inverters could be a new auxiliary service.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'Several applications appear in this context to characterize the SGs. Given
    the various variables that influence the systems, the load management techniques
    are increasingly improved to reduce costs and increase efficiency [4]. Internet-based
    applications become common place, looking for more participation by network users
    and also the development of large databases. Among these applications and others,
    the use of Artificial Intelligence (AI) becomes very common at different levels
    of network interaction. These techniques allow us to improve the existing services
    and also deal with the most modern technologies. Machine Learning, for example,
    is a technique with great potential for the operation and measurement of smart
    devices, such as Smart Meters, which is a disruptive technology in this evolution.


    Thus, the grids of the present are being transformed to become highly computed,
    with advanced applications and information technology to deal with the challenges
    of improving energy systems [5]. These characteristics make the power grid systems
    integrated to various applications in urban environments, forming part of so-called
    Smart Cities. Present common approaches on the use of technologies and applications
    focused on end-users, where information plays an important role through the large-scale
    use of communication systems. The proposal of these different levels of systems
    has objectives that aim to modernize spaces and the way people relate to each
    other, to create a more sustainable, intelligent, and safe society.


    The interaction of these various systems, equipment, and structures, requires
    special attention for the expected functioning of the grid. The lack of interoperability
    between the various elements is often the main obstacle to expand and transferring
    solutions that have been proven in a given network, city or system [6, 7, 8].


    Having presented this overview of what SGs are, it is important to highlight some
    practical details that contextualize the content, a list is shown below:


    +   1. Greater efficiency of transmission and distribution systems;

    +   2. Ability to meet growing demand without adding significant infrastructure;

    +   3. Ability to integrating better ideas and technologies;

    +   4. Lower peak demand and favor better electricity rates;

    +   5. Integration of customer-owner power generation units;

    +   6. Focus on quality to eliminate disturbances in the grid;

    +   7. Strong against attacks and natural disasters.


    These listed features are in line with the Smart Grid idea discussed. These points
    show that the new network model prioritizes energy efficiency and intelligent
    customer service, where there are incentives and technological adequacy for the
    new needs. Also, in summary, the focus on quality and reliability guarantee starts
    to increase also that operations are leaner even during unforeseen problems. Another
    point is the capacity of the network to adopt new technologies, mainly in this
    context of the era of communication and the internet of energy, which requires
    a constant modernization of power systems.'
  merge: -1
  img_proc: true
