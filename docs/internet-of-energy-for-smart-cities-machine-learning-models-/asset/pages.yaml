    # 2.7 OPEN RESEARCH QUESTIONS


    As the concept of smart grid is new, there are lots of wide opportunities for
    the researcher for its development [47. 18. 46. 15. 3]. The smart grid is the
    combination of power sectors, communication sectors, information technology (IT),
    and the internet of things (IoT). Therefore, to combine all these things in the
    same platform can be a big challenge. Some open research problems in smart grid
    design and implementation are highlighted below.


    Smart grids are dealing with the real-time monitoring system, therefore, the number
    of data increases dramatically. To handle this big data is becoming a challenging
    task and sometimes the overall system slows down and fails to operate. Hence,
    research is needed in this area to overcome this issue.


    New communication infrastructure is needed to develop to meet up the requirements
    and needs for self-healing grids. Development is required in this field to improve
    the reliability and power quality of the grid.


    Power flow optimization is one of the challenging fields of research. To integrate
    all parameters together and to generate is precise output is mandatory for the
    improvement in power flow.


    Renewable sources are interconnected with the smart grid and due to the non-linearity
    behavior of renewable energy, it is required to store the energy in EV battery
    and then connected with the grid. However, the batteries are expensive and the
    life cycle is minimum. Research is needed to prolong the battery life or what
    would be the replacement of the battery.


    The concept of cloud-based power control and management is new and lots of issues
    need handle and to manage a large number of data in the IoT server. Research is
    needed on how to handle the overall server effectively.


    Security is one of the vital aspects of research for both the consumers and utilities.
    As all the information will be stored and handled from the cloud server it will
    suffer the threat of cyber-attack and with a minor imbalance, the whole grid may
    be affected seriously and data can be stolen and moderated that would create extreme
    harm for the system. Therefore, it is vital to'
  merge: -1
  img_proc: true
