    # 9.1 INTRODUCTION


    Solar energy is one of renewable energy resources designed to replace more and
    more the energy produced with fossil fuels that have a negative impact on the
    environment. Photovoltaic systems, as one of the important alternatives for converting
    solar energy into electricity, are expected to provide solid support not only
    for a future sustainable development but also for the creation of new jobs, both
    at the place of production of these systems and at the sites where these systems
    are installed [5, 27].


    The current trend of migration of energy production from the field of classical
    resources to the field of renewable resources is confirmed by the increase in
    the number of installed photovoltaic panels worldwide [14]. The desire to reach
    a sustainable energy production system stimulates a whole series of researchers,
    companies, local or national authorities and also organizations at the transnational
    level, to make their creative contribution to the implementation of new renewable
    green technologies.


    There are two trends in the development of renewable resources [2, 18]. The first
    one involves the creation of large localized generation systems, usually outside
    cities. The second envision the installation of smaller power systems that can
    be distributed within the city, allowing the expansion of generation capacity
    through local generating systems. It must be kept in mind that technologies are
    changing at an accelerated pace, therefore, the selection of the right renewable
    generation technology to be used, that should stand a reasonable amount of time
    in order to obtain a return of investment, is not an easy task.


    Regarding the photovoltaic technologies, one development direction involves adapting
    house building to photovoltaic technology to use the energy generated by them
    [21]. Another direction tends to integrate new technologies in the house parts
    in such a way that when classic parts are replaced (e.g. roofs, walls) the look
    of the house remains merely the same. This solution also has consequences for
    the methods and technologies used in monitoring the photovoltaic systems which
    also must be made ubiquitous.


    From the point of view of energy generation conditions, production systems can
    be considered to fall into two categories: those in which the conditions are constant
    and those in which the conditions depend on the environment and, as a result,
    may undergo significant changes in longer or shorter intervals of time. Thermal
    power plants and hydropower plants are part of the first category, while photovoltaic
    panels and wind turbines are part of the second category.


    Due to the operation in the external environment, the photovoltaic panels are
    exposed to weather changes, changes that in some places and in certain periods
    can have extreme manifestations with a direct effect on the integrity or proper
    functioning of their components. In order to ensure the recovery of investments
    and even the obtaining of some benefits, the photovoltaic systems are designed
    to face these changes of the working conditions over long periods of time, but
    the part of their monitoring and maintenance, plays an equally important role.'
