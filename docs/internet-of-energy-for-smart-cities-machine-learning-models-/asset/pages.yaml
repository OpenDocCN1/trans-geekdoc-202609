    health, smart mobility, in a word SC is essential for our smart life. In the successful
    operation and management of SC, in every stage, IoT devices and technology are
    used to communicate with each device. The parameters of each device are unique.
    Therefore, to combine all these things in the same platform is a matter of challenge.
    Some open research problems are highlighted below.


    Real-time monitoring is the key feature of SC, hence, the number of data increases
    dramatically. Additionally, the overall system may also slow down. Therefore,
    handling big data becomes a matter of challenge, and research is needed to overcome
    this situation.


    New communication infrastructure is needed to develop to meet up the requirements
    of SC and to enhance reliability and sustainability.


    Information security is one of the biggest challenges as the IoT structure is
    a cyber-physical system and highly porn to cyber threats. The data can be modified
    and stolen if proper security is not developed and research is needed to make
    a robust multi-layer protection scheme.


    To make a city smarter, ML approaches are considered to predict unknown objects
