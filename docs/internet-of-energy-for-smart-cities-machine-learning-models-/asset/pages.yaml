    in modern life applications and industry technologies led to innovation of IoE
    standards which will be discussed later in this chapter, in addition to IoE architectures,
    interoperability, privacy, and security.


    # 6.2 IOE ARCHITECTURE MODELS


    Traditionally, energy systems deploy generation, transmission, and distribution.
    Then IoE is invented as an ICT solution to add a communication layer or functionality
    that integrates all system components together in end-to-end fashion, while providing
    other system services. This integration of IoE platform includes various sectors
    from system management to data security and development tools. By integration
    of in-'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'telligent end devices, networking, real-time capability, and integrated applications
    for business and mobile devices portal [10, 44]. Technically, in order to achieve
    such integration required by IoE platform proposal, the most practical suitable
    tactic is the well know service-oriented architectures (SOA), where networking
    communication protocols are used to provide service delivery between different
    system components. Figure 6.2, shows the SOA architecture-based IoE.


    SOA avoids point-to-point interfaces between single applications, by implementing
    one single interface for each application to the integrated platform, then it
    can be used to dynamically address usage to other application. Actually, this
    unique feature is pointed with a developed approach known as extended SOA introduced
    by (M. G. Keen, 2006) that must introduce more flexibility and scalability to
    the whole system by integrating the individual components to an intelligent end
    device as referred to by intelligent grid devices (IGD) [35].


    ![](img/617e854c2620a5a4bed0116cef33155a_168_0.png)


    Figure 6.2 IoE deployment sectors for SOA architecture [6]


