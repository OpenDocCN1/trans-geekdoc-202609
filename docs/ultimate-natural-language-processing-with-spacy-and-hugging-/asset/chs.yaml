  \n# 第 1 章\n\n## NLP 简介及核心库\n\n### 引言\n\n我们正处于一个计算机利用 `自然语言处理 (NLP)` 技术理解人类语言的时代。`NLP`\
  \ 是人工智能的一个分支。在本章中，我们将逐步理解 `NLP` 及其现实中的应用，从搜索引擎、聊天机器人到情感分析和机器翻译。我们将理解在解决 `NLP` 问题时，使用\
  \ `Python` 作为最重要的编程语言的意义。我们将学习文本处理的基础知识，如分词（tokenization）、词形还原（lemmatization）、词干提取（stemming）、停用词去除（stop\
  \ word removal）等。这些是处理文本和理解其意义的基本构建模块，例如，提取亚马逊产品评论的情感（积极、中性或消极），将主题分类为新闻、体育、商业等各种类别。最后，我们将简要探索相关的\
  \ `Python` 库，如 `Hugging Face Transformers` 和 `spaCy`，它们将支持我们构建现实世界的 `NLP` 应用。请做好准备，充分利用\
  \ `NLP` 来解决问题。\n\n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n* NLP 简介\n* 为什么用 Python 用于 NLP？\n\
  * NLP 基础知识\n    * 文本预处理\n* 核心 NLP 库\n    * `spaCy`\n    * `Hugging Face Transformers`\n\
  \    * `NLTK`\n* 项目与进一步探索\n\n### NLP 简介\n\n我们都熟悉 Siri、Cortana、Alexa 甚至 Jarvis（来自《钢铁侠》电影）。在准确回答问题方面，Siri、Cortana、Alexa\
  \ 和 Google Assistant 都是优秀的助手。`NLP` 是运行它们的技术。在传统时代，编程能力没有现在的 `NLP` 那么灵活。`NLP` 算法能够准确回答各种问题。\n\
  \n`NLP` 利用以下步骤从电子邮件、文档、社交媒体帖子等非结构化文本中理解并生成：\n\n1. **解码文本含义**：`NLP` 像人类一样理解句子，还可以分析上下文、语法和情感。\n\
  2. **将文本拆分为更小的块**：`NLP` 利用分词（tokenization）等技术将文本拆分为单词或句子，使计算机更容易进行处理。\n3. **识别关键元素**：`NLP`\
  \ 可以识别命名实体（例如人物、地点、组织）、词性（名词、动词、形容词、代词）以及词与词之间的关系，提供关于文本的价值信息。\n4. **生成通顺文本**：`NLP`\
  \ 进展在理解文本的基础上还可以生成文本。这有助于我们开发聊天机器人等应用，或根据需求生成文本。\n\n`NLP` 的各种应用帮助公司和个人改进业务并简化日常生活。其中一些包括：\n\
  \n* **信息检索**：搜索引擎利用 `NLP` 检测并理解各种用户查询，并提供准确的结果，使信息检索更快更高效。\n* **情感分析**：`NLP` 帮助分析文本数据的情感（如亚马逊产品评论、YouTube\
  \ 评论、Twitter 评论等），提供客户满意度的见解。\n* **机器翻译**：`NLP` 通过将一种语言翻译成另一种语言来消除语言障碍，从而改善跨文化的交流和理解（如\
  \ Google Translate、DeepL、Reverso 等）。还有专门的设备可以实时翻译原始语言到目标语言。\n* **聊天机器人和虚拟助手**：`NLP`\
  \ 用于开发理解用户意图并自然自然回答的聊天机器人（客服已通过聊天机器人高度自动化，人类不再从事与人交流和理解查询的机械工作；只有复杂的查询才会转交给人类）。\n\
  * **文本摘要**：`NLP` 可以生成大型文档的摘要，节省用户的时间精力，同时让用户获取文档最重要的主题。\n\n### Python 在 NLP 中的重要性\n\
  \n\n\n\n\n自然语言处理（NLP）是一个快速发展的领域，它使计算机能够理解人类语言并为人类简化任务。由于其支持的特性和环境，`Python` 是 NLP\
  \ 开发人员的理想编程语言。\n\n- 可读性与简单性：`Python` 的最大优势之一是其简单易于理解的语法。这让任何没有编程背景的人都能轻松学习。这种用户友好的特性让\
  \ NLP 从业者能够专注于构建语言处理应用程序，而不是纠结编程语言本身的复杂性。此外，`Python` 是一个免费工具，因此任何人都可以不费力地开始学习。\n\
  - 多样且强大的库：`Python` 拥有丰富的内置库，提供了大量的特性和功能。如 `spaCy` 等库具有强大的流水线，可用于命名实体识别（`NER`）以识别人物、地点、日期、组织等，以及词性标注（`POS`）以识别名词、代词、动词、形容词、连词等。还有自然语言工具包（`NLTK`）库，它构\
  \ NLP 的基础，提供了分词（tokenization）、词干提取（stemming）、还原（lemmatization）、停用词删除等功能。此外，还有 `Hugging\
  \ Face Transformers`，提供了先进的预训练模型，如 `BERT` 和 `GPT-3`，以及更新的文本生成模型，如 `MistralAI`、Meta\
  \ 的 `Llama3` 以及微软的 `Phi-3`。然而，`Hugging Face` 也包含计算机视觉、音频（文本转语音和语音转文本）、强化学习等模型分类。\n\
  - 更流畅的开发：基于上述各种强大的库，开发人员可以利用它们快速构建 NLP 应用程序、进行测试、添加功能、迭代和重复，而无需在后台编写大量代码。以最高的效率节省了大量的时间和精力。\n\
  - 无缝使用：用 `Python` 编写的 NLP 应用或模型可以轻松在 Linux 和 Mac 系统上运行和复用（如果在 Windows 操作系统上编写）。这种方式使得团队之间的协作变得流畅灵活且易于部署。\n\
  - 活跃的社区和丰富的资源：`Python` 拥有庞大且活跃的社区。截至 2024 年 2 月，估计全球 `Python` 编程语言社区有 820 万名开发者，占所有软件开发人员的\
  \ 44.6%。`Python` 是 `GitHub` 上使用最多的编程语言，2022 年有超过 400 万开发者在使用它。由于数据科学和机器学习的兴起，该语言的流行日益增长，并用于构建网站和软件、自动化任务以及进行数据分析。此外，还有各种在线资源、教程、课程、博客和书籍，对于解决基于\
  \ NLP 的问题非常有帮助。\n\n总的来说，`Python` 的易用性、开源工具属性、强大的库、流畅的开发、无缝使用的便利以及庞大的开发者社区，使其成为构建\
  \ NLP 模型和应用的开发人员的首选。从文本分析到根据查询生成文本，任何刚开始学习 NLP 的新手程序员或见多识广的资深开发者都可以使用 `Python`。\n\
  \n### NLP 基础\n\n本部分包含了文本分析的各种基础技术。分词（Tokenization）将文本分解为有意义的单元，如单词或句子。词干提取（Stemming）和还原（Lemmatization）将单词还原为基本形式，但两者存在关键区别。词干提取在不考虑语法语境的情况下切掉后缀，而还原则是根据语言模型的理解来识别字典形式（词元）。停用词删除消除了对自身意义较小的常用单词（例如，`the`、`a`），以使分析更高效、聚焦。\n\
  \n### 文本预处理\n\n在执行 NLP 时，机器必须理解原始文本数据并为下一步分析做好准备。这被称为文本预处理，涉及将文本分解成更小的块并移除无关信息。文本预处理包含几个重要步骤，这些是每个\
  \ NLP 从业者需要掌握的基础：分词、停用词删除、词干提取与还原以及（可选的）规范化。\n\n#### 分词\n\n句子的长短取决于单词数量。分词是将句子分为单词、标点符号、表情符号甚至短语。分词有不同的类型：\n\
  \n- 词分：将句子分成单词。\n- 句分：将一组句子分开。\n- N-gram 分词：创建连续单词的序列（例如二元组、三元组）。\n\n分词类型取决于具体任务。我们将看到使用\
  \ Python 中的 `spaCy` 库进行分的示例：\n\n```python\nimport spacy\nnlp = spacy.load(\"en_core_web_sm\"\
  )\ntext = \"The best video game is Call of Duty, World War 2.\"\ntokens = nlp(text)\n\
  for token in tokens:\n    print(token.text)\n```\n\n`spaCy` 是一个用于高级语言处理的库。它拥有 70\
  \ 多种语言的训练流水线。其中之一是 `en_core_web_sm`，它指的是特定的模型尺寸，其中 `sm` 表示较小、更快的模型。\n\n![](img/Figure-1.jpg)\n\
  \n图 1.1：分词结果\n\n上面的截图显示了分词的结果，包含了单词和标点。\n\n#### 词干提取与还原\n\n词干提取和还原都会单词还原为基本形式，但两者之间存在重要差异：\n\
  \n### 词干提取\n该过程将后缀还原为基本形式。例如，词干提取可以将 `running`、`runs` 和 `ran` 转换为共同的基础 `run`。可能会出现某些诸如\
  \ `universal`、`university` 和 `universe` 的单词被还原为同一个基词（通过 `nltk` 中的 `Porter Stemmer`\
  \ 算法），在这种情况下它是错误的，因为它们在语境上是完全不同的。这被称为过度剪枝（Overstemming）。在某些情况下，单词 `alumnus`、`alumnae`\
  \ 和 `alumni` 被还原为同一个词干，但它们应该是同义词。这被称为欠剪枝（Understemming）。\n\n\n\n\n\n```python\n\
  from nltk.stem import PorterStemmer\n\nstemmer = PorterStemmer()\n\n##### Example\
  \ words for stemming\nwords = [\"running\", \"jumps\", \"happily\", \"running\"\
  , \"happily\"]\n\n##### Apply stemming to each word\nstemmed_words = [stemmer.stem(word)\
  \ for word in words]\n\n##### Print the results\nprint(\"Original words:\", words)\n\
  print(\"Stemmed words:\", stemmed_words)\n```\n\n在上述代码中，我们使用 `nltk`（自然语言工具包）作为库，并将\
  \ `PorterStemmer` 作为函数。我们选择了一些单词来理解词干（stemming）过程。输出包含了原始单词和词干后的最终基础词。\n\n![](img/Figure-1.2.jpg)\n\
  \n**图 1.2: ** 词干结果\n\n从上述结果中我们可以看到，除了 happily 之外，所有情况下词干后的单词都是正确的。\n\n**词形还原 (Lemmatization):\
  \ ** 这一过程使用词典和形态分析来识别单词的字典形式（lemma）。因此，任何单词的基础形式都是有意义的。\n\n例如，词形还原可以正确地识别 `running`、`runs`\
  \ 和 `ran` 的 lemma 为 `run`。与词干相比，词形还原通常更准确，但计算成本更高。\n\n对于词形还原，我们将查看 Python 代码。\n\n\
  ```python\nimport nltk\nfrom nltk.stem import WordNetLemmatizer\nnltk.download('punkt')\n\
