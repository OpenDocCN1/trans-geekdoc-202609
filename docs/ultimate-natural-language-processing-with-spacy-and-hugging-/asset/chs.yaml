  )\n    # 创建年-月的新列\n    df[\"year_month\"] = df[date_col].dt.to_period(\"M\")\n \
  \   # 按年-月分组统计每月的文章数量\n    density = df.groupby(\"year_month\").size()\n    # 将密度绘制为柱状图\n\
  \    density.plot(kind=\"bar\", figsize=(10, 6), color=\"skyblue\")\n    plt.title(\"\
