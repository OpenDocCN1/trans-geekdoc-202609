  \n在上述代码中，我们使用了来自 `nltk` 库的 `WordNetLemmatizer` 函数。有一个名为 `punkt` 的资源包，在词形还原之前需要进行句子分词（sentence\
  \ tokenization）。我们从 `WordNetLemmatizer` 创建了一个 `lemmatizer` 对象，并对单词使用 `lemmatize()`\
  \ 函数。在最后一个例子中，我们使用了 `pos = \"a\"`（词性为形容词，因此结果将是主例的形容词形式）。\n\n![](img/Figure-1.3.jpg)\n\
