  \n**输出：**\n\n![](img/Figure-3.3.jpg)\n\n**图 3.3: 依存法解析器可视化**\n\n前面的图显示了句子的依存法分析。然而，由于空间限制，未显示整个图，我们可以在运行\
  \ Python 代码时进行检查。依存法解析为理解句子的语法结构提供了价值的工具，这与情感分析直接相关。可视化这些依赖关系可以更直观地理解句子不同部分是如何影响整体情感的。\n\
  \n#### 依存法分析的关键洞察\n\n**依存法解析**有助于识别主语、谓语、宾语之间的关系，并最终理解文本中隐藏的情感。它还提供了情感分析至关重要的上下文理解。\n\
  \n*   **主语-谓语-宾语关系：** 识别主、谓、宾语可以帮助确定被评估的实体及其情感。\n*   **修饰分析：** 理解形容词和副词如何修饰名词和动词可以为情感的强度和方向提供线索。\n\
  *   **否定处理：** 依存法解析可以帮助识别否定词（例如 `not`、`never`），这些词可以反转情感极性。\n*   **上下文理解：** 可视化依赖关系可以揭示句子内部单词之间的关系，为情感分析提供更丰富的上下文。\n\
  \n在下部分，我们将研究 `TextBlob` 库以了解情感分析的使用。`TextBlob` 是一个 Python 库，提供简单直观的接口来执行自然语言处理任务，包括情感分析。它简化了从文本数据中提取情感极性和主观性的过程。\n\
  \n### TextBlob 对情感分析的关键性\n\n`TextBlob` 是一个包含系列任务的库，从词性标记（POS tagging）、名词提取、情感分析、分词、词形还原等等。它使用\
  \ `NLTK` 来执行这些任务。\n\n*   **易用性：** `TextBlob` 提供了用户友好的 API，使初学者和丰富的 NLP 从业者都能轻松使用。\n\
  *   **情感极性和主观性：** 它提供了函数来直接计算给定文本的情感极性（积极、消极或中性）和主观性（文本的观点化程度）。\n*   **内置词典：** `TextBlob`\
  \ 自带一个预训练的情感词典，有助于确定单词和短语的情感。\n*   **自定义：** 你可以自定义情感词典或创建自己的词典，以针对特定领域或上下文定制分析。\n\
  *   **额外的 NLP 任务：** 除了情感分析，`TextBlob` 还可以用于词性标记、名词短语提取和翻译等任务。\n\n### 情感分析\n\n我们可以看到下面的代码，但在之前我们需要安装\
  \ `textblob`。\n\n```\nfrom textblob import TextBlob\n\nblob = TextBlob(example)\n\
  sentiment = blob.sentiment\n\nprint(sentiment.polarity)\nprint(sentiment.subjectivity)\n\
  ```\n\n**输出：**\n\n```\n0.2333333333333333\n0.43333333333333335\n```\n\n在前面的代码中，我们看到了评论的极性和主观性。**极性**和**主观性**是情感分析中两个关键指标，用于理解文本的情感倾向和观点性质。**极性**指的是文本的情感倾向，指示它是积极、消极还是中性的，有助于识别整体情感，并提供文本情感强度的量化标准。**主观性**衡量文本表达个人意见或信念而非客观事实的程度。它对于区分偏见或观点性内容很有用，也可以与极性结合来理解文本整体的情感基调和客观性。\n\
  \n在前面的评论示例中，我们的极性为 0.23，主观性为 0.43。我们可以如下评估这些数字：\n\n*   **极性：** 0.23 表示微积极的情感。值通常从\
  \ -1（非常消极）到 1（非常积极）。0.23 的值表明是微积极的情感。\n*   **主观性：** 0.43 表示文本具有中等主观性。范围从 0（客观）到\
  \ 1（高度主观）。0.43 的值表明文本包含客观和主观元素的混合。\n*   **综合解释：** 考虑到这些值，该文本可以解释为具有**微积极的情感**和**中等程度的主观性**。这意味着文本可能表达了积极观点，但也包含了一些事实或客观信息。\n\
  \n在下一节中，我们将使用 `nltk` 库（https://www.nltk.org/howto/sentiment.html）检查情感分析。我们将检查如下代码：\n\
  \n```\nimport nltk\nfrom nltk.sentiment.vader import SentimentIntensityAnalyzer\n\
  \nnltk.download('vader_lexicon')\nsid = SentimentIntensityAnalyzer()\n\ndef analyze_sentiment(text):\n\
  \    sentiment_scores = sid.polarity_scores(text)\n    compound_score = sentiment_scores[\"\
  compound\"]\n    if compound_score >= 0.05:\n        return \"Positive\"\n    elif\
  \ compound_score <= -0.05:\n        return \"Negative\"\n    else:\n        return\
  \ \"Neutral\"\n\n#### 示例\nsentiment = analyze_sentiment(example)\nprint(sentiment)\n\
  ```\n\n**输出：**\n\n```\n[nltk_data] Downloading package vader_lexicon to ...\n[nltk_data]\
  \ Package vader_lexicon is already up to date\nPositive\n```\n\n\n\n\n这段代码定义了一个函数\
  \ `sentiment_analysis_vader`，它接收文本作为输入并使用 VADER 返回情感得分。`sentiment_score` 将是一个包含以下键的字典：\n\
  \n* `neg`: 负面情感得分\n* `neu`: 中性情感得分\n* `pos`: 积极情感得分\n* `compound`: 总体复合得分（范围从 -1\
  \ 到 1）\n\n在在上述的结果中，`neu` 值为 `0.616`，`pos` 值为 `0.384`，这表明评论更倾向于中性范围，而非积极范围。这意味着该文本表达了积极的情感，并带有一些中性元素。它表明该文本可能在表达一种积极的观点或感受。\n\
  \n在`电子商务行业`的背景下，这种情感分析结果——即评论具有 `0.384 的积极得分`和 `0.616 的中性得分`——可以被解释为`中度满意的客户`。例如，客户可能准时收到了订单并发现产品可以接受，但产品本身并不出色。\n\
  \n这种反馈有助于电子商务企业`找出可以增加价值的领域`——也许是提高产品质量、包装或购买后的体验。通过对此类评论进行分类，平台可以识别出那些符合预期但未超出预期的产品，让他们专注于`改进产品列表、提供组合优惠或启动跟进活动`以提升满意度，并将中性积极客户转化为忠诚的拥护者。\n\
  \n#### 词云可视化\n\n现在我们将使用词云检查单词的可视化情况。词云是文本语料库中单词出现频率的视觉表示。通过可视化最常见的词汇，我们可以快速识别出评论中表达的关键主题、话题和情感。\n\
  \nPython 代码如下：\n\n```\nfrom wordcloud import WordCloud\nimport matplotlib.pyplot\
  \ as plt\n#### 将所有评论合并成一个字符串\ntext = \" \".join(amazon_df['cleaned_review'].astype(str))\n\
  wordcloud = WordCloud(width=800, height=400, background_color='white').generate(text)\n\
  #### 显示词云\nplt.figure(figsize=(10, 7))\nplt.imshow(wordcloud, interpolation='bilinear')\n\
  plt.axis('off')\nplt.show()\n```\n\n在前面的代码中，我们导入了 `WordCloud` 函数和 `matplotlib` 库。我们将数据框中的所有评论拼接并转换为字符串数据类型。然后，我们创建了具有白色背景以及定义的高度和宽的\
  \ `wordcloud` 变量。接着，我们使用 `matplotlib` 库将其显示为可视化图。词云如下：\n\n![](img/Figure-3.4.jpg)\n\
  \n图 3.4：亚马逊评论的词云\n\n在之前的词云中，我们看到 `mouse` 是最大的单词。此外还有像 `love, work, use, great, one`\
  \ 这样较大的词。这意味着该文本表达了积极的情感，并带有一些中性元素。它表明该文本可能在表达一种积极的观点或感受。（注：由于输入文本存在大量重复，我将按照提供的文本结构进行处理）。\n\
  \n\n\n\n```python\nX_train, X_test, y_train, y_test = train_test_split(amazon_df['processed_review'],\
  \ amazon_df['label'], test_size=0.2, random_state=42)\n```\n\n在前面的代码中，我们利用了 `nltk`\
  \ 和 `scikit-learn` 库。对于数据的预处理和清洗，我们对评论进行了分词（tokenized）并将其转换为小写。然后，我们使用初始化为 `lemmatizer`\
  \ 的 `WordNetLemmatizer()` 对象进行了词形还原处理。接着，我们移除了英语特定的停用词并合并了最终清洗后的标记。随后，应用上述函数来准备最终清洗后的评论文本。然后，我们使用\
  \ `LabelEncoder()` 对象对 `sentiments` 变量进行编码。接下来，我们将数据集划分为训练集（80%）和测试集（20%）。\n\n之后，我们使用\
  \ `CountVectorizer()` 对象进行 TF-IDF 向量化，该对象使用 `scikit-learn` 中的 `CountVectorizer`\
  \ 类执行特征提取过程。\n\n1. **实例化**：创建了一个 `CountVectorizer` 对象，用于将文本数据转换为数值特征。\n2. **拟合**：在训练数据\
  \ (`X_train`) 上应用 `fit_transform` 方法。这从训练数据构建构建词表，并将文本转换为数值矩阵（文档-项矩阵）。\n3. **转换**：在测试数据\
  \ (`X_test`) 上应用 `transform` 方法。这使用从训练数据中学到的词表将测试数据转换为数值特征。\n4. **打印形状**：打印转换后的训练数据和测试数据的形状，显示每个数据集中的样本数量和特征数量。\n\
  \n本质上，该代码使用词袋模型（bag-of-words）从文本数据中提取数值特征，特征矩阵的每一列代表词表中的一个唯一单词，而值表示该词在相应文档中的频率。\n\
  \n```python\nfrom sklearn.feature_extraction.text import CountVectorizer\nvect =\
  \ CountVectorizer() # 实例化一个向量器\nX_train_dtm = vect.fit_transform(X_train)# 使用它从训练数据中提取特征\n\
  #### 转换测试数据（使用训练数据的特征）\nX_test_dtm = vect.transform(X_test)\nprint(X_train_dtm.shape,\
  \ X_test_dtm.shape)\n```\n\n**输出**：\n`(13872, 7751) (3468, 7751)`\n\n在前面的代码中，我们得到了向量化后的训练集和测试集的结果。`X_train_dtm`\
  \ 是使用 `CountVectorizer` 从训练数据创建的 `document-term matrix`。\n\n我们将进行机器学习建模和评估，并测试三种机器学习算法：`Multinomial\
  \ Naïve Bayes`（多项朴素贝叶）、`Logistic Regression`（逻辑回归）和 `Linear SVC`（线性支持向量分类）。\n\n\
  `Multinomial Naïve Bayes` 的代码如下：\n\n```python\n#### 从 sklearn 导入分类器\nfrom sklearn.naive_bayes\
  \ import MultinomialNB\nfrom sklearn.linear_model import LogisticRegression\nfrom\
  \ sklearn.svm import LinearSVC\n#### 导入不同的指标来评估分类器\nfrom sklearn.metrics import\
  \ accuracy_score\n#### from sklearn.model_selection import train_test_split\nfrom\
  \ sklearn.metrics import confusion_matrix\nfrom sklearn import metrics\n#### 从 time\
  \ 导入 time 函数以跟踪训练时长\nfrom time import time\n\ndef plot_confusion_matrix(cm, classes,\
  \ normalize=False, title=\"Confusion matrix\", cmap=plt.cm.Blues):\n    \"\"\"\n\
  \    此函数打印并绘制混淆矩阵。\n    通过设置 normalize=True 可以应用归一化。\n    \"\"\"\n    if normalize:\n\
  \        cm = cm.astype(\"float\") / cm.sum(axis=1)[:, np.newaxis]\n    plt.imshow(cm,\
  \ interpolation=\"nearest\", cmap=cmap)\n    plt.title(title)\n    plt.colorbar()\n\
  \    tick_marks = np.arange(len(classes))\n    plt.xticks(tick_marks, classes, rotation=45)\n\
  \    plt.yticks(tick_marks, classes)\n    fmt = \".2f\" if normalize else \"d\"\n\
  \    thresh = cm.max() / 2.\n    for i, j in itertools.product(range(cm.shape[0]),\
  \ range(cm.shape[1])):\n        plt.text(j, i, format(cm[i, j], fmt), horizontalalignment=\"\
  center\", color=\"white\" if cm[i, j] > thresh else \"black\")\n    plt.tight_layout()\n\
  \    plt.ylabel(\"True label\",fontsize=15)\n    plt.xlabel(\"Predicted label\"\
  ,fontsize=15)\n\nnb = MultinomialNB() # 实例化多项朴素贝叶斯模型\n%time nb.fit(X_train_dtm,\
  \ y_train) # 训练模型（使用 IPython“魔法命令”计时）\ny_pred_class = nb.predict(X_test_dtm) # 对\
  \ X_test_dtm 进行类别预测\nprint(\"Accuracy: \", metrics.accuracy_score(y_test, y_pred_class))\n\
  ```\n\n\n\n\n\n我们的模型准确率为 70.84%。为了详细说明，我们将理解模型的混淆矩阵。\n\n![](img/Figure-3.6.jpg)\n\
  \n**图 3.6：** 多项朴素贝叶斯（Multinomial Naïve Bayes）混淆矩阵\n\n此图是 `MultinomialNB()` 模型的混淆矩阵。从混淆矩阵可以看出，负面（negative）情感的识别最为准确。只有\
  \ 37% 的正面情感被正确识别。然而，中性情感在 52% 的情况下被正确识别。在 52% 的情况下，正面情感被识别为中性情感，而 44% 的中性情感被识别为负面情感。\n\
  \n现在我们将使用逻辑回归（Logistic Regression）模型进行测试。代码如下：\n\n```python\nfrom sklearn.linear_model\
  \ import LogisticRegression # import the function\nlogreg = LogisticRegression(class_weight=\"\
  balanced\") # instantiate a logistic regression model\nlogreg.fit(X_train_dtm, y_train)\
  \ # fit the model with training data\n#### Make predictions on test data\ny_pred_class\
  \ = logreg.predict(X_test_dtm)\n# calculate evaluation measures:\nprint(\"Accuracy:\
  \ \", accuracy_score(y_test, y_pred_class))\ncnf_matrix = confusion_matrix(y_test,\
  \ y_pred_class)\nplt.figure(figsize=(8,6))\nplot_confusion_matrix(cnf_matrix, classes=['positive','neutral',\
  \ 'negative'],normalize=True, title=\"Confusion matrix with normalization\")\n```\n\
  \n**输出：**\n`Accuracy: 0.8558246828143022`\n\n代码解释如下：\n\n- `LogisticRegression`：这创建了一个逻辑回归模型对象。\n\
  - `class_weight=\"balanced\"`：该参数指定使用类别权重来解决训练数据中潜在的类别平衡问题。将其设置为 `balanced` 会自动计算与类别频率成反比的权重，为代表性较少的类别赋予更大的权重（例如，如果负面评论频率较低）。\n\
  \n代码中的训练、预测和混淆矩阵部分与 `MultinomialNB()` 相同。准确率为 85.58%。\n\n![](img/Figure-3.7.jpg)\n\
  \n**图 3.7：** 逻辑回归混淆矩阵\n\n负面情感的混淆矩阵保持在 89%，与 `MultinomialNB` 相同。然而，正面和中性情感被正确预测的比例分别为\
  \ 81% 和 82%。逻辑回归的表现优于 `MultinomialNB()` 模型。\n\n最后，我们使用 `LinearSVC()` 模型。代码如下：\n\n\
  ```python\nclassifier = LinearSVC(class_weight='balanced') # instantiate a logistic\
  \ regression model\nclassifier.fit(X_train_dtm, y_train) # fit the model with training\
  \ data\n#### Make predictions on test data\ny_pred_class = classifier.predict(X_test_dtm)\n\
  # calculate evaluation measures:\nprint(\"Accuracy: \", accuracy_score(y_test, y_pred_class))\n\
  #print(\"AUC: \", roc_auc_score(y_test, y_pred_prob))\ncnf_matrix = confusion_matrix(y_test,\
  \ y_pred_class)\nplt.figure(figsize=(8,6))\nplot_confusion_matrix(cnf_matrix, classes=['\
  \ 'positive','neutral', 'negative'],normalize=True, title='Confusion matrix with\
  \ normalization')\n```\n\n**输出：**\n`Accuracy: 0.8261245674740484`\n\n- `LinearSVC`：这创建了一个线性支持机分类器对象。它是一种特定的\
  \ SVM，使用线性决策边界分离类别。\n- `class_weight='balanced'`：与上一个示例中的逻辑回归一样，该参数指定类别权重以解决训练数据中潜在的类别平衡问题。将其设置为\
  \ `balanced` 会自动计算与类别频率成反比的权重，为代表性较少的类别赋予更大的权重（例如，如果负面评论频率较低）。\n\n代码的训练、预测和混淆矩阵部分与之前的两个模型\
  \ `MultinomialNB()` 和逻辑回归相同。准确率为 82.61%。Linear SVC 的表现优于 MultinomialNB，但不如逻辑回归。\n\
  \n![](img/Figure-3.8.jpg)\n\n**图 3.8：** Linear SVC 混淆矩阵\n\n负面情感的混淆矩阵仍然保持在 89%，与\
  \ `MultinomialNB` 和逻辑回归一致。对于中性情感，79% 被正确预测，62% 的正面情感被正确预测。然而，线性支持机分类器的性能不如逻辑回归。我们还可以尝试其他分类算法，例如\
  \ XGBoost、决策树、随机森林以及更复杂的深度学习模型。\n\n## 结论\n\n本章展示了 NLP 技术在从 Amazon 评论中提取有价值见解方面的强大。通过利用情感分析，我们成功地将评论分类为正面、负面和中性类别，提供了更深层次的理解。\n\
