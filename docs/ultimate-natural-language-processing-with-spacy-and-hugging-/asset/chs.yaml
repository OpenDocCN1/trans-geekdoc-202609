  \ `angry`。\n\n词干提取更快、更高效，但可能会受到欠词干（Understemming）、过度词干（Overstemming）以及无上下文词的影响。另一方面，词形还原更关注单词的语境；因此在执行时可以保持准确性。此外，它还能产生有意义的单词。然而，由于词形还原需要执行形态分析并从词典中提取词义，它比词干提取更耗时。\n\
  \n#### 停用词 (Stopwords)\n\n自然语言有很多常用词，如 `the`、`a`、`an`、`you`、`he`、`him`、`she`、`her`\
