  \n# 第 11 章\n\n# 微调 LLM 与构建文本驱动工具\n\n### 引言\n\n\n\n\n大型语言模型（LLMs）如 `GPT-4`、`LLaMA`、`DeepSeek`\
  \ 和 `Claude` 彻底改变了搜索、推理和人类级通信。虽然这些模型提供了强大的通用能力，但现实世界的应用大多需要`特定任务的定制化`。这就是`微调`大显用场的地方，可以将可以将预训练的\
  \ LLM 适配到专业领域`，如`医疗、法律、金融或客户支持`。微调通过在相关的精选数据集上对模型进行进一步训练，完善模型的知识和行为。\n\n本章将探索 LLM\
  \ 微调的完整生命周期，以及将其部署为实用的文本驱动工具。我们将学习如何`选择合适的模型、准备训练数据并使用 Hugging Face 库对模型进行微调`。我们还将深入研究`如\
  \ LoRA 和 prompt tuning 等参数高效方法`，这些方法使得在有限的硬件上实现定制成为可能。此外，我们将介绍 `AI Agents（智能代理）`——构建在\
  \ LLM 之上的自主系统，它们可以跨工具和 API 进行`推理、规划并采取行动`。这些代理将 LLM 的能力从文本生成扩展到实时决策和自动化。\n\n除了理论，本章还包含实操项目，例如构建`代码补全助手、创意文本生成器和特定领域的问答系统`。我们还介绍了`检索增强生成\
  \ (RAG)`，这是一种`将 LLM 与实时文档检索相结合以构建基于事实的应用的先进技术`。在本章结束时，我们将具备`创建强大的、领域感知的语言工具并将其部署到现实环境中的`的能力。无论我们是为`业务、研究还是开源创新`构建模型，本章都将引导你从模型定制过渡到实际部署。\n\
  \n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   理解 LLM 和微调\n    * 微调的类型\n    *   选择合适的模型和数据集\n\
  *   实践中的 LLM 微调\n    *   微调的环境搭建\n    *   微调步骤详解\n    *   案例研究：微调文本摘要器\n*   构建文本驱动工具\n\
  \    *   工具 1：代码补全助手\n    *   工具 2：文本生成系统\n*   检索增强生成 (RAG)\n    * 什么是 RAG 及其重要性\n\
  \    *   构建简单的 RAG 流线\n*   评估、优化和部署\n    * 评估微调后的模型\n    * 针对速度和成本进行优化\n\n# 理解 LLM\
  \ 和微调\n\n本章的这一主题涉及 LLM 微调，介绍了 `LoRA`、`Adapters（适配器）`和 `Prompt Tuning`，以及为构建选择合适的模型和数据集。\n\
  \n## 大型语言模型 (LLMs)\n\n`LLMs` 是先进的神经网络，能够思考、搜索、推理和与人类交流。它们在海量数据（如`网站、书籍和代码库`）上进行训练，以向用户提供正确的信息。然而，为了让\
  \ LLM 执行特定任务（如文本生成、代码生成、图像生成、文章或博客写作），需要对 LLM 进行微调，并利用合适的模型。Hugging Face 网站上有大量的模型，涵盖从文本到文本、文本到图像、图像到视频、问答、摘要和翻译等。\n\
  \n## LLM 微调\n\nLLM 的微调大体分类为两种方法：`全量微调`和`参数高效微调 (PEFT)`。\n\n*   **全量微调**：在这种方法中，预训练\
  \ LLM 的所有参数都会被更新。它能产生高性能，但计算开销大，且需要大量的标注数据和内存。它最适合在使用强大的 GPU 配置和大型特定任务数据集时使用。\n\n\
  *   **参数高效微调 (PEFT)**：PEFT 技术通过仅更新一小部分模型参数，帮助用极少的计算资源适配大模型。这对于无法使用昂贵基础设施的从业者来说特别有用。\n\
  \n一些流行的 PEFT 技术包括：\n\n*   **低秩自适应 (LoRA)**：在 transformer 的每一层中注入可训练的低秩矩阵，允许高效微调。\n\
  \n*   **Adapters（适配器）**：在 transformer 层之间添加小的瓶颈模块，在保持基础模型冻结的同时进行训练。\n\n*   **Prompt\
  \ Tuning / Prefix Tuning（前缀微调）**：不是更新模型权重，而是通过优化的 prompt tokens 或前缀对模型进行条件限制，以引导特定任务的输出。\n\
  \n这些方法不仅降低了训练成本，还提高了模型组件的模块化和重用性。\n\n# 选择合适的模型和数据集\n\n微调的成功主要取决于选择合适的模型以及构建或选择高质量的数据集。\n\
  \n*   **领域特定模型选择**：并非所有模型的构建方式都是相同的。对于医疗任务，`BioBERT`、`PubMedBERT` 或 `ClinicalBERT`\
  \ 等模型在`医学语料库`上进行了微调。对于代码生成，`CodeT5` 或 `StarCoder` 等模型更为合适。\n\n*   **精选微调数据集**：根据用例，我们需要任务相关的数据。以下是几种类型：\n\
  \n    *   **文本分类**：句子或段落配对标签（例如情感分析）。\n\n    *   **问答 (QA)**：包含上下文段落、问题和答案的数据集（例如\
  \ `SQuAD`、`BioASQ`）。\n\n    *   **摘要**：带有简洁参考摘要的文档（例如 `CNN/DailyMail`）。\n\n    *\
  \   **代码**：带有相应提示和补全的代码片段（例如 `HumanEval`、`CodeSearchNet`）。\n\n# 实践中的 LLM 微调\n\n\
  本主题将解释微调的环境搭建、需要安装的库，以及使用 Google Colab。接下来，我们将介绍微调的步骤，从加载数据集、分词和加载预训练模型开始。然后进行预处理、训练和评估。最后保存并部署模型。接下来，我们将构建一个文本摘要器并对其进行微调和评估。\n\
  \n# 微调步骤详解\n\n环境准备绪后，我们将使用 Hugging Face 工具开始微调并构建摘要器。\n\n## 第 1 ：加载数据集、分词器和模型\n\n\
  我们选择了与摘要任务相关的数据集。然后，加载了兼容的分词器和预训练模型。代码如下。\n\n```python\nfrom datasets import load_dataset\n\
  ```\n\n\n\n\n```\nfrom transformers import AutoTokenizer, AutoModelForSeq2SeqLM\n\
  dataset = load_dataset(\"cnn_dailymail\", \"3.0.0\")\ntokenizer = AutoTokenizer.from_pretrained(\"\
  facebook/bart-base\")\nmodel = AutoModelForSeq2SeqLM.from_pretrained(\"facebook/bart-base\"\
  )\n```\n\n`datasets` 库（来自 Hugging Face）导入了 `load_dataset` 函数。它可以帮助轻松地加载如 `cnn_dailymail`\
  \ 等现即用的数据集。`load_dataset()` 函数加载 `CNN/DailyMail 数据集`，这是一个用于`摘要式摘要（abstractive summarization）的流行数据集。\n\
  \n“3.0.0”版本使用了清洗和修正后的数据。\n\n数据集中的每个示例包含：\n* `article` – 完整的新闻文章文本。\n* `highlights`\
  \ – 对应的人工编写的摘要。\n\n它返回一个包含训练、测试和验证划分的字典。\n\n`dataset[\"train\"]`\n`dataset[\"validation\"\
  ]`\n`dataset[\"test\"]`\n\n`AutoTokenizer.from_pretrained()` 加载了 BART 模型的 `tokenizer`。`tokenizer`\
  \ 将文本转换为模型可以理解的输入 ID 和注意力掩码（attention masks）。`facebook/bart-base` 是一个针对摘要等序列到序列任务优化的预训练`编码器解码器模型（encoder-decoder\
  \ model）`。\n\n`AutoModelForSeq2SeqLM.from_pretrained()` 加载了为序列到序列学习预训练的 `BART 模型`（Seq2SeqLM\
  \ = 序列序列语言模型）。它擅长摘要、翻译和文本生成等任务。\n\nBART 使用：\n* 一个 `encoder`（编码器）理解输入（文章），\n* 一个\
  \ `decoder`（解码器）生成输出（摘要）。\n\n## 第 2 ：预处理数据\n\n我们必须对训练的输入和标签进行分词。代码如下。\n\n```python\n\
  def preprocess(example):\n    inputs = tokenizer(example[\"article\"], truncation=True,\
  \ padding=\"max_length\", max_length=512)\n    labels = tokenizer(example[\"highlights\"\
  ], truncation=True, padding=\"max_length\", max_length=128)\n    inputs[\"labels\"\
  ] = labels[\"input_ids\"]\n    return inputs\n\ntokenized_data = dataset.map(preprocess,\
  \ batched=True)\n```\n\n在前面的代码中，创建了 `preprocess` 函数并对 `\"article\"`（文本）和 `\"highlights\"\
  `（摘要）使用了 `tokenizer()` 函数。\n\n* `truncation=True`：如果文章超过 512 个 token，它将被`截断（cut）`。\n\
  * `padding=\"max_length\"`：如果文章少于 512 个 token，它将被`填充（padded）`到恰好 512 个 token。\n\
  * `max_length=512`：将最大输入长度设置为 512 个 token。\n\n目标是准备输入文本，使其符合模型的大小。`labels` 变量的 `truncation=True`\
  \ 和 `padding=\"max_length\"` 保持不变。由于摘要较短，`max_length=128` 表示只保留 128 个 token。在对文章（inputs）进行分词后，我们添加了一个名为\
  \ `labels` 的新键。它持有分词后的摘要。\n\n在训练期间：\n* 模型尝试根据 `inputs` `生成（generate）` `labels`。这把文章及其目标摘要连接在一起。\n\
  \n然后我们对整个数据集应用 `preprocess` 函数。\n* `batched=True`：一次处理多个示例（更快且更高效）。因此，`tokenized_data`\
  \ 将将每个示例转换为：\n* `input_ids`（针对文章），\n* `attention_mask`（针对填充），\n* `labels`（针对目标摘要）。\n\
  \n## 第 3 步：使用 Trainer API\n\n在此步中，我们将使用特定参数训练模型。代码如下。\n\n```python\nfrom transformers\
  \ import TrainingArguments, Trainer\n\nargs = TrainingArguments(\n    output_dir=\"\
  ./results\",\n    per_device_train_batch_size=4,\n    num_train_epochs=1,\n    logging_dir=\"\
  ./logs\",\n    save_total_limit=2,\n    logging_steps=10\n)\n\ntrainer = Trainer(\n\
  \    model=model,\n    args=args,\n    train_dataset=tokenized_data[\"train\"],\n\
  \    eval_dataset=tokenized_data[\"validation\"]\n)\n\ntrainer.train()\n```\n\n\
  代码解释如下：\n`from transformers import TrainingArguments, Trainer`\n* 从 Hugging Face\
  \ 的 Transformers 库中导入两个重要的类：\n    * `TrainingArguments`：帮助配置训练如何运行（批处理大小、轮数、保存位置等）。\n\
  \    * `Trainer`：一个高层 API，负责处理整个训练循环（训练、评估、检查点保存）。\n\n`args = TrainingArguments(...)`\
  \ 这创建了一个 `TrainingArguments` 对象，设置了训练设置。\n\n| 参数 | 目的 |\n| :--- | :--- |\n| `output_dir=\"\
  ./results\"` | 训练后保存模型检查点的地方。 |\n| `per_device_train_batch_size=4` | 批次大小：每个设备（GPU/CPU）一次处理\
  \ 4 个样本。 |\n| `num_train_epochs=1` | 仅遍历整个训练数据集一次。（我们稍后可以增加以获得更好的结果。） |\n| `logging_dir=\"\
  ./logs\"` | 保存训练日志的目录。 |\n| `save_total_limit=2` | 最多保存 2 个模型检查点。旧的检查点将被自动删除。 |\n\
  | `logging_steps=10` | 每 10 步记录一次日志。 |\n\n**表 11.1：训练参数**\n\n`trainer = Trainer(...)`\
  \ 现在我们创建一个 Trainer 实例将所有内容连接起来：\n\n| 参数 | 目的 |\n| :--- | :--- |\n| `model=model`\
  \ | 我们之前加载的模型。 |\n| `args=args` | 我们刚刚设置的所有训练参数。 |\n| `train_dataset=tokenized_data[\"\
  train\"]` | 训练数据集（分词后的文章和摘要）。 |\n| `eval_dataset=tokenized_data[\"validation\"]`\
  \ | 验证数据集（用于在训练期间监控）。 |\n\n**表 11.2：模型细节和训练设置**\n\nTrainer 将自动处理：\n* 数据加载\n* 正向和反向传播\n\
  * 损失计算\n* 优化\n* 训练期间的评估\n* 保存模型检查点\n\n`trainer.train()` 开始训练过程\n* Trainer：\n   \
  \ * 将批处理后的数据喂给模型\n    * 计算损失\n    * 更新模型权重\n    * 定期在验证集上进行评估\n    * 保存模型检查点\n\n\
  ![](img/Figure-11.1.jpg)\n\n**图 11.1：每 10 步的训练损失**\n\n在之前的截图中，我们看到训练损失每一步都在下降，并在第\
  \ 80 步之后趋于稳定。\n\n\n\n\n\n```python\nreference_summaries = [item for item in small_validation[\"\
  highlights\"]]\n```\n\n# 生成带有适当错误处理的摘要\n\n```python\ngenerated_summaries = []\n\
  for text in sample_texts:\n    try:\n        # 处理过长的文本\n        if len(text) > ١٠٢٤:\
  \  # 对非常长的文本进行简单截断\n            text = text[:١٠٢٤]\n        # 生成摘要并添加显式错误处理\n  \
  \      summary_output = summarizer(text, max_length=١٣٠, min_length=٣٠, do_sample=False)\n\
  \        # 检查输出是否有效\n        if summary_output and isinstance(summary_output, list)\
  \ and len(summary_output) > ٠:\n            summary = summary_output[٠][\"summary_text\"\
  ]\n            generated_summaries.append(summary)\n        else:\n            #\
  \ 如果摘要生成失败，使用备选方案\n            print(f\"Warning: Failed to generate summary, using\
  \ placeholder\")\n            generated_summaries.append(\"Summary generation failed.\"\
  )\n    except Exception as e:\n        print(f\"Error processing text: {e}\")\n\
  \        generated_summaries.append(\"Error in summary generation.\")\n# 确保生成的摘要和参考摘要的数量一致\n\
  assert len(generated_summaries) == len(reference_summaries), \"Mismatch in number\
  \ of summaries\"\n# 使用 ROUGE 进行评估\nrouge = evaluate.load(\"rouge\")\nresults = rouge.compute(predictions=generated_summaries,\
  \ references=reference_summaries)\n# 打印结果\nprint(\"ROUGE Evaluation:\")\nfor key,\
  \ value in results.items():\n    print(f\"{key}: {value:.4f}\")\n```\n\n## 输出：\n\
  \n```\nROUGE Evaluation:\nrouge1: 0.3325\nrouge2: 0.1358\nrougeL: 0.2286\nrougeLsum:\
  \ 0.2811\n```\n\n代码解释如下：\n\n### 导入与设置\n\n```python\nfrom transformers import pipeline,\
  \ AutoTokenizer, AutoModelForSeq2SeqLM\nimport evaluate\nfrom datasets import load_dataset\n\
  ```\n\n这导入了必要的库：\n\n* `transformers`: 用于预训练模型和分词器\n* `evaluate`: 用于如 `ROUGE` 等评估指标\n\
  * `datasets`: 用于加载基准数据集\n\n### 加载数据集\n\n```python\ndataset = load_dataset(\"cnn_dailymail\"\
  , \"3.0.0\")\n```\n\n* 这从 Hugging Face 的 datasets 库加载了 `CNN/DailyMail` 数据集（版本 3.0.0）。\n\
  * 该数据集包含新闻文章以及人工编写的摘要（称为 `highlights`）。\n\n### 模型和分词器初始化\n\n```python\nmodel_name\
  \ = \"facebook/bart-large-cnn\"\ntokenizer = AutoTokenizer.from_pretrained(model_name)\n\
  model = AutoModelForSeq2SeqLM.from_pretrained(model_name)\n```\n\n* 使用 `BART-large-CNN`\
  \ 模型，该模型专门针对 `CNN/DailyMail` 的摘要任务进行了微调。\n* `AutoTokenizer`: 加载将文本转换为模型可以理解的标记的分词器。\n\
  * `AutoModelForSeq2SeqLM`: 加载用于文本生成的序列到模型。\n\n### 创建流水线\n\n```python\nsummarizer\
  \ = pipeline(\"summarization\", model=model, tokenizer=tokenizer)\n```\n\n创建一个处理整个过程的摘要生成流水线：\n\
  * 对输入文本进行分词\n* 运行模型进行处理\n* 将输出标记解码回文本\n\n#### 数据准备\n\n```python\nsmall_validation\
  \ = dataset[\"validation\"].select(range(9))\nsample_texts = [item for item in small_validation[\"\
  article\"]]\nreference_summaries = [item for item in small_validation[\"highlights\"\
  ]]\n```\n\n使用 `select(range(9))` 从验证集中选取 9 个示例。将文章和参考摘要提取为 Python 列表，以便于处理。\n\n\
  ### 摘要生成\n\n```python\ngenerated_summaries = []\nfor text in sample_texts:\n   \
  \ try:\n        if len(text) > 1024:\n            text = text[:1024]\n        summary_output\
  \ = summarizer(text, max_length=130, min_length=30, do_sample=False)\n        if\
  \ summary_output and isinstance(summary_output, list) and len(summary_output) >\
  \ 0:\n            summary = summary_output[0][\"summary_text\"]\n            generated_summaries.append(summary)\n\
  \        else:\n            print(f\"Warning: Failed to generate summary, using\
  \ placeholder\")\n            generated_summaries.append(\"Summary generation failed.\"\
  )\n    except Exception as e:\n        print(f\"Error processing text: {e}\")\n\
  \        generated_summaries.append(\"Error in summary generation.\")\n```\n\n遍历每篇文章并带有以下设置生成摘要：\n\
  * 对于长文章将文本截断为 1024 个字符\n* 参数：`max_length=130` 和 `min_length=30` 用于控制摘要长度\n* `do_sample=False`\
  \ 用于确定性生成（不带随机性）\n包含了完善的错误处理：\n* 在提取摘要之前验证输出结构\n* 捕获任何异常并提供备用内容\n\n### 一致性检查\n\n\
  ```python\nassert len(generated_summaries) == len(reference_summaries), \"Mismatch\
  \ in number of summaries\"\n```\n\n确保我们生成的摘要和参考摘要数量相同，以便进行正确评估。\n\n### 评估\n\n```python\n\
  rouge = evaluate.load(\"rouge\")\nresults = rouge.compute(predictions=generated_summaries,\
  \ references=reference_summaries)\n```\n\n* 从 Hugging Face 的 `evaluate` 库加载 `ROUGE`\
  \ 指标。\n* 通过将生成的摘要与参考摘要对比来计算 `ROUGE` 分。\n\n这段代码演示了使用预训练模型进行文本摘要并评估其性能的完整工作流。我们收到的\
  \ ROUGE 分（`ROUGE-1: 0.3325`、`ROUGE-2: 0.1358`、`ROUGE-L: 0.2286`、`ROUGE-Lsum: 0.2811`）表明该系统在该数据集上的性能合理。这些分数代表了我们生成的摘要与参考摘要的匹配程度。让我们查看各项指标：\n\
  \n* `ROUGE-1: 0.3325 (33.25%)`: 这衡量了生成的摘要和参考摘要之间单字（单个单词）的重叠情况。33.25% 的得分意味着我们生成的摘要中约三分分之一的单个单词与参考摘要中的单词匹配。然而，对于摘要任务来说，这是一个合理的分数，表明处于中等水平。\n\
  * `ROUGE-2: 0.1358 (13.58%)`: 这衡量了生成的摘要和参考摘要之间双词（连续两个单词）的重叠情况。13.58% 的得分低于 `ROUGE-1`\
  \ 是预期的，因为匹配单词对比单个单词更困难。这个中等分数表明模型捕捉到了原始摘要的一些短语结构。\n* `ROUGE-L: 0.2286 (22.86%)`:\
  \ 这衡量了生成的摘要和参考摘要之间的最长公共序列。它通过寻找顺序匹配的单词（但不一定连续）来考虑结构。22.86% 的分数表明生成的摘要与参考摘要之间具有结构相似性。\n\
  * `ROUGE-Lsum: 0.2811 (28.11%)`: 这是 `ROUGE-L` 的变体，在摘要级别而非句子级别运行。它通常比 `ROUGE-L` 高，因为它允许跨句子匹配。28.11%\
  \ 的分数显示了不错的的摘要级结构相似性。\n\n### 总体评估\n\n这些分数代表了使用 `BART-large-CNN` 模型在 `CNN/DailyMail`\
  \ 数据集上的合理摘要性能。作为参考：\n\n* 顶级系统通常在该数据集上达到 40-45% 的 `ROUGE-1` 分\n* 我们的分数在预期范围内，但仍有改进空间\n\
  * `ROUGE-1` 和 `ROUGE-2` 分数之间的差距表明模型在捕捉单个单词方面优于维持短语结构。\n\n\n\n\n\n在本节中，我们将创建一个`代码补全工具`和一个`文本生成系统`。对于代码补全工具，它将作为一个`用于自动代码建议的\
  \ IDE 插件`，例如 `Microsoft Copilot`。`文本生成系统`将创建`短篇和长故事、编写博客文章以及诗歌`。\n\n# 工具 1：代码补全助手\n\
  \n`CodeSearchNet` 是一个来自 GitHub 的真实世界代码片段大型集合，涵盖了 `Python` 和 `Java` 等多种语言。它能帮助模型`学习编码模式、语法和结构`。在我们的案例中，我们使用了一个在相似高质量代码数据集上预训练过的模型，避免了全量重新训练。\n\
  \n我们选择了 `Salesforce/codegen-350M-multi` 模型，这是一个紧凑的、针对代码生成任务优化的多语言模型。它旨在跨多种编程语言`高效地理解和生成代码`。`StarCoder`\
  \ 是另一个替代方案，在更广泛、更大的代码数据集上进行了训练。这些模型可以处理`代码自动补全、错误修复和文档生成`等任务。\n\n该工具旨在`开发者在 IDE\
  \ 中输入代码时建议代码补全`，类似于 `GitHub Copilot`。模型根据`部分输入预测后续行，从而提高编码速度并减少重复输入`。虽然目前是基于脚本的，但该可以通过\
  \ API 或轻量级插件轻松集成到 IDE 中，以获得完整的交互体验。\n\n该工具的代码如下。\n\n```python\nfrom transformers\
  \ import AutoTokenizer, AutoModelForCausalLM\n\n# Model name\nmodel_name = \"Salesforce/codegen-350M-multi\"\
  \n\n# Load tokenizer\ntokenizer = AutoTokenizer.from_pretrained(model_name)\n\n\
  # Load model without warnings\nmodel = AutoModelForCausalLM.from_pretrained(\n \
  \   model_name,\n    trust_remote_code=True,\n    ignore_mismatched_sizes=True\n\
  )\n\n# Function to complete code\ndef complete_code(prompt, max_new_tokens=50):\n\
  \    inputs = tokenizer(prompt, return_tensors=\"pt\")\n    outputs = model.generate(\n\
  \        inputs,\n        max_new_tokens=max_new_tokens,\n        do_sample=True,\
  \             # enable sampling for creative suggestions\n        temperature=0.7,\
  \            # controls randomness (lower = more deterministic)\n        top_p=0.95,\
  \                 # nucleus sampling for quality\n        pad_token_id=tokenizer.eos_token_id\n\
  \    )\n    completion = tokenizer.decode(outputs[0], skip_special_tokens=True)\n\
  \    return completion\n\n# Example usage\nuser_prompt = \"def fibonacci(n):\"\n\
  completed_code = complete_code(user_prompt)\nprint(\"=== Completed Code ===\")\n\
  print(completed_code)\n```\n\n**输出：**\n\n```\n=== Completed Code ===\ndef fibonacci(n):\n\
  \    return fibonacci(n-1) + fibonacci(n-2)\nprint(fibonacci(6))\nprint(fibonacci(5))\n\
  ```\n\n代码解释如下。\n\n| 代码块 | 解释 |\n| --- | --- |\n| `from transformers import` `AutoTokenizer`,\
  \ `CodeGenForCausalLM` | 导入 Hugging Face 用于代码生成的分词器和模型类。 |\n| `model_name = \"Salesforce/codegen-350M-multi\"\
  ` | 指定预训练模型：一个在多种编程语言上训练的 350M 参数版本。 |\n| `tokenizer = AutoTokenizer.from_pretrained(model_name)`\
  \ | 加载分词器，将文本（此处为代码）分解为模型可以理解的标记。 |\n| `model = CodeGenForCausalLM.from_pretrained(model_name,\
  \ trust_remote_code=True)` | 加载用于因果语言建模（文本预测）的预训练 CodeGen 模型，并允许信任自定义模型代码。 |\n|\
  \ `prompt = \"def fibonacci(n):\"` | 提供起始代码或函数签名。这作为代码补全的种子。 |\n| `inputs = tokenizer(prompt,\
  \ return_tensors=\"pt\")` | 将输入文本转换为张量（PyTorch 格式），以便模型进行处理。 |\n| `outputs = model.generate(...)`\
  \ | 为输入代码生成续写：`max_new_tokens=50` 限制标记标记数量。`temperature=0.7` 让预测略具创造性。`do_sample=True`\
  \ 启用采样而非贪婪生成。`top_k=50` 将下一个 token 的选择限制在概率最高的 50 个 token 中。 |\n| `completed_code\
  \ = tokenizer.decode(outputs[0], skip_special_tokens=True)` | 将张量输出解码为人类可读文本。 |\n\
  | `print(completed_code)` | 显示完整输出。 |\n\n# 工具 2：文本生成系统\n\n`文本生成系统`使用 GPT-2 模型构建，它可以创建从诗歌到完整文章的输出。通过利用\
  \ GPT-2 的语言理解和创作能力，用户可以调输出以满足不同的语气、风格和深度。总体而言，该系统将手性的创意写作过程转化为由大规模语言模型驱动的更快速、更具创新性的体验。代码如下。\n\
  \n```python\nfrom transformers import AutoModelForCausalLM, AutoTokenizer, pipeline\n\
  import torch\n\n# Step 1: Load a powerful text generation model\nmodel_name = \"\
  gpt2\" \ntokenizer = AutoTokenizer.from_pretrained(model_name)\nmodel = AutoModelForCausalLM.from_pretrained(model_name)\n\
  \n# Step 2: Create a text generation pipeline\ntext_generator = pipeline(\n    \"\
  text-generation\",\n    model=model,\n    tokenizer=tokenizer,\n    device=0 if\
  \ torch.cuda.is_available() else -1 # Use GPU if available\n)\n\n# Step 3: Define\
  \ a function to generate content\ndef generate_content(prompt, content_type=\"short\"\
  ):\n    if content_type == \"short\":\n        max_length = 100  # Suitable for\
  \ poems, short posts\n    else:\n        max_length = 500  # Suitable for blogs,\
  \ articles\n    outputs = text_generator(\n        prompt,\n        max_length=max_length,\n\
  \        temperature=0.7,\n        top_p=0.9,\n        top_k=50,\n        num_return_sequences=1,\n\
  \        do_sample=True\n    )\n    return outputs[0][\"generated_text\"]\n\n# Step\
  \ 4: Example usages\n# Generate a poem\npoem = generate_content(\"Write a beautiful\
  \ poem about Paris\", content_type=\"short\")\nprint(\"\\nGenerated Poem:\\n\",\
  \ poem)\n\n# Generate a blog post\nblog = generate_content(\"Write a blog about\
  \ the future of AI in healthcare\", content_type=\"long\")\nprint(\"\\nGenerated\
  \ Blog:\\n\", blog)\n```\n\n**输出：**\n\n```\nGenerated Poem:\nWrite a beautiful poem\
  \ about Paris, The city of Paris is a beautiful place, and I am not going to try\
  \ to convince you otherwise. The city of Paris is beautiful in a way that no other\
  \ city can be. It is the center of the European Union, and it is the birthplace\
  \ of modern French literature. It is the home of the French National Theatre, and\
  \ it is the home of the Louvre Museum. And it is also the home\n\nGenerated Blog:\n\
  Write a blog about the future of AI in healthcare. What is AI? AI is an umbrella\
  \ term for any type of machine learning algorithm, which can be used to predict\
  \ how a computer will perform tasks and predict future events. It can be used to\
  \ help computers understand the world and act more like humans.\n```\n\n\n\n\n\n\
  例如，AI 可以帮助计算机理解物理世界，比如当要求计算机下国际棋时。它还可以帮助计算机理解世界的运行方式并预测事件，例如 AI 何时会承担新工作。\n\nAI\
  \ 并不是一项新技术。已知的首次应用出现于 20 世纪 60 年代，当时计算机下国际棋。\n\n# AI 的崛起\n\n随着越来越多的计算机被制造，更强大的 AI\
  \ 算法被开发出来。例如，能够击败人类选手的超级计算机 `IBM Watson` 开发于 20 世纪 90 年代。\n\nAI 算法已用于帮助提高医疗质量，例如使用人工智能来诊断和治疗疾病。\n\
  \n它还用于通过预测公司运营的未来来提高公司的效率。\n\nAI 也被用于提高业务效率。AI 可用于预测公司和企业的未来，例如公司何时会被收购或员工何时会离职。\n\
  \nAI 也被用于对未来进行预测。例如，当公司对员工的未来做出预测时，AI 算法可以帮助公司做出如何处理员工离职的决策。\n\n使用 Hugging Face\
  \ 和 PyTorch 构建文本生成系统的代码如下。\n\n## 导入与设置\n\n```python\nfrom transformers import AutoModelForCausalLM,\
  \ AutoTokenizer, pipeline\nimport torch\n```\n\n*   `AutoModelForCausalLM`：加载预训练的`causal\
  \ language model`（适用于文本生成，如 GPT）。\n*   `AutoTokenizer`：处理文本与标记之间的反向转换（对于处理 transformers\
  \ 至关重要）。\n*   `pipeline`：Hugging Face 的高级 API，用于快速构建文本生成等 NLP 工具。\n*   `torch`：用于检查\
  \ GPU 是否可用（为了更快的处理）。\n\n## 加载模型和分词器\n\n```python\nmodel_name = \"gpt2-large\"\n\
  tokenizer = AutoTokenizer.from_pretrained(model_name)\nmodel = AutoModelForCausalLM.from_pretrained(model_name)\n\
  ```\n\n*   加载 `GPT-2 Large`，这是一个训练用于预测句子中下一个词的生成模型。\n*   `AutoTokenizer` 为模型准备输入文本（分词化）。\n\
  *   `AutoModelForCausalLM` 加载用于文本生成的实际神经网络。\n\n## 创建文本生成流水线\n\n```python\ntext_generator\
  \ = pipeline(\n    \"text-generation\",\n    model=model,\n    tokenizer=tokenizer,\n\
  \    device=0 if torch.cuda.is_available() else -1\n)\n```\n\n*   使用模型 + 分词器创建一个`text\
  \ generation pipeline`。\n*   `device=0` 在可用时使用 GPU，否则在 CPU 上运行 (-1)。\n*   此流水线线简化了生成逻辑——我们不需要手动进行编码/解码。\n\
  \n## 定义内容生成器\n\n```python\ndef generate_content(prompt, content_type=\"short\"):\n\
  \    if content_type == \"short\":\n        max_length = 100\n    else:\n      \
  \  max_length = 500\n    \n    outputs = text_generator(\n        prompt,\n    \
  \    max_length=max_length,\n        temperature=0.7,\n        top_p=0.9,\n    \
  \    top_k=50,\n        num_return_sequences=1,\n        sample=True\n    )\n  \
  \  return outputs[0][\"generated_text\"]\n```\n\n*   一个处理 `short` 和 `long` 内容的函数。\n\
  *   `max_length` 控制模型生成的 token 数量。\n*   `outputs` 包含结果。\n\n```python\npoem = generate_content(\"\
  Write a beautiful poem about Paris\", content_type=\"short\")\nprint(\"\\nGenerated\
  \ Poem:\\n\", poem)\n\nblog = generate_content(\"Write a blog about the future of\
  \ AI\", content_type=\"long\")\nprint(\"\\nGenerated Blog:\\n\", blog)\n```\n\n\
  *   生成 `poem` 和 `blog`。\n*   `temperature`、`top_p`、`top_k`、`num_return_sequences`\
  \ 和 `sample` 控制生成的随机性。\n\n#### 总结\n\n该系统使用了：\n*   `GPT-2 Large` 进行生成。\n*   `AutoTokenizer`\
  \ 进行文本处理。\n*   `pipeline` 用于高级逻辑。\n*   `torch` 用于硬件加速。\n\n# 检索增强生成 (RAG)\n\n在本节中，我们将探讨\
  \ RAG 及其意义、构建一个 RAG 流水线并部署它。\n\n## 什么是 RAG，其意义何？\n\nRAG 的核心是一个简单而强大的思想：`用外部文档增强语言模型`。\n\
  \n典型的 RAG 架构涉及两个主要组件：\n\n*   **检索器 (Retriever)**：给定用户查询，检索器在大型语料库（文档、文章或任何知识库）中搜索并获取最相关的信息。检索器通常使用\
  \ `FAISS`、`Chroma` 或 `ElasticSearch` 等库通过稠密嵌入和相似性搜索。\n*   **生成器 (Generator)**：语言模型（如\
  \ `BERT`、`BART`、`GPT` 变体）结合`原始提示`和`检索到的文档`生成连贯的答案。\n\n这种设置允许模型在无需重新训练或微调的情况下补充其知识。\n\
  \nRAG 的主要优势是`减少幻觉`，这是大语言模型（LLMs）生成听起来相关但实际上错误或过时的信息的常见问题。由于 RAG 模型显式地检索外部文档：\n\n\
  *   **实时更新**：RAG 生成最新信息，无需等待下一次模型重训练周期。\n*   **领域适应性**：企业可以自定义检索语料库（例如医疗、法律和财务报告的内部知识库），以提供特定领域的知识。\n\
  *   **更高的准确性**：通过将答案建立在实际证据之上，RAG 模型提供了更具可验证性、更可靠的输出。\n\n例如，一个在 2023 年之前训练的传统 LLM\
  \ 可能不知道最新的科学发现。然而，RAG 模型可以检索 2025 年发表的文章并将其整合到生成的响应中，从而确保事实准确性。\n\n在实际应用中，RAG 驱动了：\n\
  \n*   **企业聊天机器人**，根据内部文档回答问题。\n*   **法律助手**，引用相关的法律或案例。\n*   **医疗顾问**从经过证实的临床文献中提取信息。\n\
  *   **学术搜索工具**，引用更新的研究成果。\n\n总之，`检索增强生成 (RAG)` 不仅扩展了大语言模型的寿命和可靠性，还使其能力更接近现实应用，使\
  \ AI 系统在处理关键任务时更加动态、自适应且值得信赖。\n\n\n\n\n\n构建检索增强生成（RAG）流水线涉及建立一个无缝工作流，其中文档被存储、检索，然后由大语言模型（LLM）用于生成答案。让我们拆解这些核心组件和方法。\n\
  \n# 向量数据库 (FAISS, Chroma)\n\nRAG 系统的第一步是以能够实现快速且有意义检索的方式存储文档。传统的关键词搜索对于细粒度的查询往往效率低下，因此我们使用向量数据库。\n\
  \n*   `Facebook AI Similarity Search (FAISS)`：一个极其高效的库，用于对稠密向量执行快速相似性搜索。使用 `Sentence\
  \ Transformers` 等模型将文档转换为嵌入（embeddings），然后 `FAISS` 根据向量距离（例如，`cosine similarity`）快速找到最相关的文档。\n\
  *   `Chroma`：一种专为 AI 应用设计的现代、轻量级向量数据库。它设置简单，与 Python 工作流集成良好良好，并支持在存储文档嵌入的同时存储元数据，以实现更丰富的搜索。\n\
  \n### 流程：\n\n1. 将文档转换为嵌入。\n2. 将嵌入存储在 `FAISS` 或 `Chroma` 中。\n3. 为给定的用户查询检索前 k 个相似的文档。\n\
  \n# 文档检索 (LangChain, Haystack)\n\n一旦文档以嵌入的形式存储，我们需要一种方法来编排检索和生成步骤。`LangChain` 和\
  \ `Haystack` 等框架可以提供帮助。\n\n*   `LangChain`：一个模块化框架，通过链起检索和生成步骤来构建由 LLM 驱动的应用。`LangChain`\
  \ 能够轻松集成 `FAISS` 或 `Chroma` 等向量数据库，并将检索到的文档输入到 LLM 提示词中。\n*   `Haystack`：一个开源的 NLP\
  \ 框架，专门为构建搜索系统、问答系统和 RAG 流水线而定制。它支持检索器（retrievers）、读者（readers）以及可以自定义或大规模部署的流水线。\n\
  \n### 典型的检索流：\n\n1. 用户发送查询。\n2. `Retriever` 在 `FAISS/Chroma` 中搜索相关文档。\n3. 将检索到的文档同查询一起发送给\
  \ LLM。\n4. LLM 生成一个经过检索知识增强的最终答案。\n\n# 使用来自 Hugging Face 的预训练 RAG 模型\n\n`Hugging\
  \ Face` 提供了预训练的 RAG 模型，结合了检索和生成以加速开发。\n\n*   诸如 `facebook/rag-token-nq` 或 `facebook/rag-sequence-nq`\
  \ 等模型经过训练可以检索段落并生成答案。\n*   它们内置了检索器（`DPR`：`Dense Passage Retrieval`），并根据需要可以在自定义数据上进行微调。\n\
  *   开发者可以使用 `Hugging Face transformers` 库快速加载并部署这些模型，而无需手动设置检索器。\n\n我们将构建一个简单的 RAG\
  \ 流水线，以为用户检索并提供准确的答案。代码如下：\n\n```python\nfrom langchain.document_loaders import\
  \ PyPDFLoader\nfrom langchain.text_splitter import RecursiveCharacterTextSplitter\n\
  from langchain.vectorstores import FAISS\nfrom langchain.embeddings import HuggingFaceEmbeddings\n\
  from transformers import pipeline\n\n# Step 1: Load PDF Document\nloader = PyPDFLoader(\"\
  HubSpots Guide to Data Analytics.pdf\")\ndocuments = loader.load()\n\n# Step 2:\
  \ 拆分为更小的块\nsplitter = RecursiveCharacterTextSplitter(chunk_size=700, chunk_overlap=150)\n\
  docs = splitter.split_documents(documents)\n\n# Step 3: 使用 HuggingFace 嵌入创建向量数据库\n\
  embedding = HuggingFaceEmbeddings()\nvectorstore = FAISS.from_documents(docs, embedding)\n\
  \n# Step 4: 检索前 k 个相关文档\nretriever = vectorstore.as_retriever(search_kwargs={\"\
  k\": 5})  # 增加 k 以获取更多上下文\nquery = \"什么是数据可视化 ?\"\nrelevant_docs = retriever.get_relevant_documents(query)\n\
  context = \" \".join([doc.page_content for doc in relevant_docs])\n\n# 如果上下文太长则截断\n\
  context = context[:2000]  # 限制以避免 max_length 截断\n\n# Step 5: 加载更好的生成式问答流水线\nmodel_name\
  \ = \"google/flan-t5-large\"\nqa_pipeline = pipeline(\n    \"text2text-generation\"\
  ,\n    model=model_name,\n    tokenizer=model_name,\n    max_length=300,  # 允许更长的响应\n\
  \    temperature=0.7,\n    top_k=50,\n    top_p=0.95,\n    repetition_penalty=1.2,\n\
  \    do_sample=True\n)\n\n# Step 6: 精炼提示词以鼓励更长、更清晰的答案\nprompt = f\"\"\"You are a\
  \ helpful assistant.\nBased on the following context, answer the question clearly\
  \ and in 2-4 informative sentences.\nContext: {context}\nQuestion: {query}\nAnswer:\"\
  \"\"\nresponse = qa_pipeline(prompt)[0][\"generated_text\"]\nprint(\"\\n Query:\"\
  , query)\nprint(\" Generated Answer:\\n\", response.strip())\n```\n\n**输出：**\n\n\
  ```text\nQuery: What is data visualization ?\nGenerated Answer:\n“数据可视化”一词是指如何将数字、统计数据和其他数据显示在图表或图中，使其更容易理解和展示。\n\
  ```\n\n以下是使用 `Hugging Face` 和 `LangChain` 通过检索增强生成（RAG）流水线来回答 PDF 问题的详细部分的说明：\n\n\
  ### 目标：\n\n创建一个这样一个系统：\n*   加载 PDF 文档\n*   使用向量搜索检索相关部分\n*   使用生成模型创建完整句子的信息答案\n\
  \n在进入代码细节之前，我们需要安装 `langchain`、`pypdf`、`sentence-transformers` 和 `faiss-cpu`。\n\n\
  ### 代码拆解：\n\nRAG 流水线的步骤代码如下：\n\n**加载 PDF 文档**\n`from langchain.document_loaders\
  \ import PyPDFLoader`\n`loader = PyPDFLoader(\"HubSpots Guide to Data Analytics.pdf\"\
  )`\n`documents = loader.load()`\n*   使用 `LangChain` 的 `PyPDFLoader` 加载多页 PDF。\n\
  *   提取为 Document 对象。\n\n**拆分为块**\n`from langchain.text_splitter import RecursiveCharacterTextSplitter`\n\
  `splitter = RecursiveCharacterTextSplitter(chunk_size=700, chunk_overlap=150)`\n\
  `docs = splitter.split_documents(documents)`\n*   将大型文档拆分为 700 字符的小块，重叠为 150 字符。\n\
  *   重叠有助于保留块之间的上下文。\n\n**创建向量数据库**\n`from langchain.vectorstores import FAISS`\n\
  `from langchain.embeddings import HuggingFaceEmbeddings`\n`embedding = HuggingFaceEmbeddings()`\n\
  `vectorstore = FAISS.from_documents(docs, embedding)`\n*   使用 `Hugging Face` 模型将每个块转换为向量（嵌入）。\n\
  *   使用 `FAISS` 存储和检索这些向量。\n\n**检索相关块**\n`retriever = vectorstore.as_retriever(search_kwargs={\"\
  k\": 5})`\n`query = \"什么是数据分析中的分类\"`\n`relevant_docs = retriever.get_relevant_documents(query)`\n\
  `context = \" \".join([doc.page_content for doc in relevant_docs])`\n`context =\
  \ context[:2000]`\n*   使用相似性查询检索前 5 个相关块。\n*   将它们合并为单个上下文字符串。\n*   将上下文截断为 2000\
  \ 个字符以避免模型过载。\n\n**加载文本生成模型**\n`from transformers import pipeline`\n`model_name\
  \ = \"google/flan-t5-large\"`\n`qa_pipeline = pipeline(`\n`\"text2text-generation\"\
  ,`\n`model=model_name,`\n`tokenizer=model_name,`\n`max_length=300,`\n`temperature=0.7,`\n\
  `top_k=50,`\n`top_p=0.95,`\n`repetition_penalty=1.2,`\n`do_sample=True`\n`)`\n\n\
  \n\n\n\n* 从 Hugging Face 加载 `pretrained generative model` (`Flan-T5`)，擅长于指令遵循。\n\
  * 关键生成参数：\n    * `max_length=300`：允许更长的回答\n    * `temperature=0.7, top_k=50, top_p=0.95`：控制创造力和多样性\n\
  \    * `repetition_penalty=1.2`：减少冗余输出\n\n## 创建 Prompt 并生成答案\n\n```python\nprompt\
  \ = f\"\"\"You are a helpful assistant.\nBased on the following context, answer\
  \ the question clearly and in 2-4 informative sentences.\nContext: {context}\nQuestion:\
  \ {query}\nAnswer:\"\"\"\n\nresponse = qa_pipeline(prompt)[0][\"generated_text\"\
  ]\n```\n\n1. 该 prompt 指导模型给出一个`信息量丰富、清晰的、多句句的回答`。\n2. 使用 `pipeline` 根据上下文和问题生成回复。\n\
  \n## 显示答案\n\n```python\nprint(\"\\n Query:\", query)\nprint(\" Generated Answer:\\\
  n\", response.strip())\n```\n\n1. 显示原始查询和模型生成的答案。\n\n#### 总结\n\n我们创建了一个`轻量级检索增强\
  \ QA 系统`，它：\n1. 使用 PDF 作为知识库\n2. 使用 `FAISS + Hugging Face embeddings` 检索相关内容\n3.\
  \ 使用 `T5-family model` 生成自然语言答案\n\n# 评估、优化与部署\n\n评估检索增强生成 (RAG) 流水线涉及评估`检索`和`生成`的质量。常见指标包括\
  \ `Precision@K`、`Recall@K` 和 `平均倒数排名 (MRR)`，用于评估检索器获取相关文档的性能。对于生成部分，使用 `ROUGE`、`BLEU`、`BERTScore`\
  \ 和 `METEOR` 等指标来衡量模型答案在`语义和结构`上与参考答案的对齐程度。\n\n`人工评估`也至关重要，关注答案的`相关性`、`事实性`、`流畅性`和`连贯性`，特别是当标准具有主观性或不可用时。\n\
  \n## 常见模型评估指标：\n\n* `Perplexity`（困惑度）：衡量语言模型预测序列的能力。困惑度越低表示语言建模效果越好。\n    * **用途**：文本生成、下一个词预测。\n\
  * `Accuracy`（准确率）：正确预测数数占总预测数的比例。\n    * **用途**：分类任务，如情感分析和意图检测。\n* `Bilingual Evaluation\
  \ Understudy (BLEU)`（双语评估辅助）：基于精确率指标，比较生成文本与参考文本之间的 n-gram 重叠度。\n    * **用途**：机器翻译、摘要。\n\
  * `Recall-Oriented Understudy for Gisting Evaluation (ROUGE)`（面向召回的摘要评估辅助）：衡量 n-gram\
  \ 重叠度（单字、双词）。\n    * **变体**：`ROUGE-1`、`ROUGE-2`、`ROUGE-L`。\n    * **用途**：摘要。\n*\
  \ `METEOR`：考虑词形、同义词和顺序。\n    * **用途**：翻译。\n* `BERTScore`：利用上下文嵌入来衡量相似性。\n    * **用途**：摘要。\n\
  * `CIDEr`：衡量所需的编辑次数（插入、删除、替换）。\n    * **用途**：图像描述生成。\n* `Negative Log Likelihood\
  \ (NLL)`（负对数似然）：评估序列的概率。\n    * **用途**：文本生成。\n* `Exact Match (EM)`（精确匹配）：检查预测是否与真实值匹配。\n\
  \    * **用途**：问答任务。\n* `Mean Reciprocal Rank (MRR)`（平均倒数排名）：衡量第一个相关文档的排名。\n    *\
  \ **用途**：检索\n\n# 人工评估与反馈循环\n\n人工评估是 RAG 的关键部分，特别是当自动化指标无法捕捉细微差别时。以下是关键评估维度：\n\n\
  * `Relevance`（相关性）：衡量响应回答用户查询的程度。通常采用李克特量表（例如 1–5 分）评分。\n* `Factual Accuracy`（事实准确性）：评估提供的信息是否符合事实并是否有源文档的支持。\n\
  * `Fluency and Coherence`（流畅性与连贯性）：确定生成的响应是否语法正确、逻辑结构且易于阅读。\n* `Trustworthiness`（可靠性）：关注输出的可信度。\n\
  * `Faithfulness to Context`（上下文忠实度）：评估生成的文本是否忠实于检索文档且未引入幻觉。\n* `Helpfulness`（帮助性）：关注答案对最终用户是否有实际用途。\n\
  * `Coverage`（覆盖率）：衡量答案是否涵盖了问题或主题的所有主要方面。\n\n## 人工评估实现方法：\n\n* `Pairwise Comparison`（两比较）：并排显示两个输出，让标注人员选择更好的一个。\n\
  * `Likert Scale Ratings`（李克特量表评分）：标注人员对每个质量维度进行量表评分。\n* `Open-ended Feedback`（开放式反馈）：允许评估者提供定性观察。\n\
  * `Crowdsourcing Tools`（众包工具）：如 `Amazon Mechanical Turk`、`Scale AI` 或 `Prolific`\
  \ 等平台可以高效扩展人工评估的规模。\n\n\n\n\n\n随着大语言模型（LLMs）和检索增强生成（RAG）系统变得复杂，部署成本和推理延迟成为关键关注问题。目前已有如\
  \ `quantization`（量化）、`distillation`（馏）和 `pruning`（裁剪）等优化技术，以及 `ONNX`、`DeepSpeed`\
  \ 和 `Optimum` 等工具，允许开发者实现更快、更廉且高效的模型性能，这在实时应用中尤为重要。\n\n# 优化技术\n\n## 量化\n* 在不降低性能的情况下降低模型权重的精度（例如从\
  \ 32 位浮点数转换为 8 位整数）。\n* **收益**：\n    * 模型尺寸更小\n    * 推理速度更快\n    * 内存占用更低\n* **类型**：\n\
  \    * 后训练量化 (PTQ)：在模型训练后完成。\n    * 量化感知训练 (QAT)：训练期间模拟量化以保留准确性。\n\n## 馏\n* 训练一个较小的模型来模仿大型高性能模型的行为，其优势是减小尺寸和计算负载。\n\
  * **收益**：\n    * 模型体积可缩小高达 90%，且性能下降极小\n    * 以更低的计算成本实现更快推理\n* **常见场景**：从 `BERT-large`\
  \ 训练 `TinyBERT` 或 `DistilBERT`\n\n## 模型裁剪\n* 从模型中移除冗余或不重要的权重或神经元。\n* **收益**：\n \
  \   * 降低模型复杂性和尺寸\n    * 加计算\n* **类型**：\n    * 结构化裁剪：移除整个层或注意力头\n    * 非结构化裁剪：稀疏地移除单个权重\n\
  \n## 优化工具\n\n### 开放神经网络交换 (ONNX)\n* 一种用于表示 ML 模型的开源格式，用于互操作性和硬件优化。\n* **特性**：\n\
  \    * 将 `PyTorch` 或 `TensorFlow` 模型转换为 `ONNX` 格式\n    * 使用 `ONNX Runtime` 运行模型，针对\
  \ CPU、GPU 或专用加速器进行了优化\n    * 支持量化和裁剪工作流\n\n### DeepSpeed（微软）\n* 一个为高效训练和推理超大模型深度学习优化库。\n\
  * **核心收益**：\n    * `ZeRO optimization`（零冗余优化器）减少了内存占用\n    * 用于高吞吐量、低延迟推理的引擎\n \
  \   * 带有自动损失缩放的混合精度训练\n* **适用模型**：如 `GPT-NeoX` 和 `BLOOM` 等模型\n\n### Optimum（Hugging\
  \ Face）\n* 一个将 Hugging Face Transformers 与性能工具（如 `ONNX`、`Intel OpenVINO` 和 `NVIDIA\
  \ TensorRT`）集成的库。\n* **能力**：\n    * 将模型导出为 `ONNX`\n    * 应用量化和馏\n    * 无缝微调并部署优化后的模型\n\
  \n## 结论\n本章探讨了 `LLMs` 与实用文本驱动工具的交叉领域。我们看到，微调是将通用 LLM 专门用于特定任务的关键过程，无论是通过全量微调还是通过更高效的方法（如带有\
  \ `LoRA` 的 `PEFT (参数高效微调)`）。在此基础之上，我们开发了诸如代码助手和文本摘要器等复杂工具。本章还介绍了 `检索增强生成 (RAG)`，这是一项强大的技术，可以将\
  \ LLM 植足于外部、最新的知识中，确保事实性和动态性。最后，我们强调了彻底评估、优化和负责任部署的重要性，以构建稳健且高效的文本驱动系统。\n\n在下一章中，我们将讨论\
