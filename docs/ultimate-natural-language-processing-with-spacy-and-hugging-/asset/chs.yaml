  \n\n\n\n\n# 用于语言模型训练的数据集\n\n语言模型的质量很大程度上取决于其训练时使用的数据。多个多样化的来源提供了丰富的文本数据：\n\n* `Wikipedia`：一个包含详细内容的大型且结构化的的数据集，对于训练具有事实性知识的模型非常有用。\n\
  * `新闻文章`：如 `BBC`、`CNN` 和 `Reuters` 等来源可以为模型提供真实事件和信息的背景知识。\n* `虚构与文学`：来自 `Project\
  \ Gutenberg` 等来源的书籍和故事有助于模型捕捉叙事风格、故事技巧和创意写作。\n* `诗歌与非正式文本`：如社交媒体（`Twitter`、`Reddit`\
  \ 等）以及诗歌数据集可以教会模型理解非正式、比喻性和情感化语言的细微差别。\n\n**选择合适的数据集：** 如果是为了学术研究训练模型，`Wikipedia`\
  \ 是一个很好的选择。对于聊天机器人，来自 `Reddit` 或 `Twitter` 的对话数据集更为合适。\n\n# 语言模型的类型\n\n* `GPT 风格自回归模型（文本生成）：`\
  \ **自回归模型**（如 `GPT-2` 和 `GPT-3`）通过一次预测一个单词来生成文本，并将之前的标记作为上下文。这些模型在创意写作、摘要生成和聊天机器人应用方面非常强大。\n\
  \    * **示例：** 给定“从前（Once upon a time）”，`GPT` 风格的模型可能会生成“汤姆发生了一场可怕的情况。”\n* `BERT\
  \ 风格掩码语言模型（上下文理解）：` 类似于 `BERT` 的模型预测句子中缺失的单词，使其能够学习深层次的上下文关系。这些模型是搜索引擎、文本分类和问答等应用的理想选择。\n\
  \    * **示例：** 如果给出“Delhi 是 [MASK] 的首都。”，`BERT` 将预测出“India”。\n\n# 微调预训练模型\n\n大多数\
  \ NLP 应用运行在微调预训练模型的基础上，而不是从零开始训练。微调涉及获取现有的语言模型（如 `BERT` 或 `GPT-3`），并在与特定任务相关的特定数据集上对其进一步训练。\n\
  \n**何时进行微调？**\n\n* 当 `数据有限` 且从零开始训练不实际时。\n* 当使用 `领域特定数据集`时（例如法律文件、医疗记录、财务数据等）。\n\
  * 当有必要将通用模型适配于 `特定的 NLP 任务`时（例如命名实体识别和情感分析）。\n\n# 从零开始训练模型\n\n从零开始构建模型涉及收集海量数据集并从头训练深度学习架构。这极度消耗资源，只有在为完全全新的语言或领域创建模型时才是必要的。\n\
  \n**何时从零开始训练？**\n\n* 当我们需要的 `语言或方言` 不存在预训练模型时。\n* 在具有独特词汇的`高度专业领域`工作时（例如量子物理、古代语言）。\n\
  * 在自定义硬件上优化模型以实现`极端效率`时。\n\n# 从零开始训练自定义语言模型\n\n当我们拥有原始数据并从开始学习表示时，从零开始训练自定义语言模型是关重要的。这在计算上非常贵，但我们可以根据需求拥有完整的架构和领域特定知识。\n\
  \n# 针对问答微调预训练模型\n\n在这个项目中，我们将针对特定类型（如`小说、诗歌或新闻文章`）训练语言模型，以生成该风格的文本。通过遵循这种结构化方法，我们将学习如何有效地`清洗、预处理、训练、微调和评估`语言模型。\n\
  \n在深入微调预训练模型的步骤之前，我们将讨论`BERT 模型的开发、训练和评估`。\n\n# 模型架构\n\n`BERT (Bidirectional Encoder\
  \ Representations from Transformers)` 非常适合问答任务，因为它能从两个方向理解上下文。对于问答，我们使用 `BERT for\
  \ Question Answering` 变体，它经过微调以预测：\n\n* 答案在段落中的`起始位置`\n* 答案的`结束位置`\n\n**准备数据集**\n\
  \n我们需要一个包含以下内容的数据集：\n* `上下文段落`（也称为 `paragraph` 或 `context`）\n* `问题`\n* `确切答案文本`\n\
  * 答案在上下文中的`起始索引`\n\n**示例（来自 SQuAD）：**\n\n* `Context`：“埃菲尔铁塔位于法国巴黎。”\n* `Question`：“埃菲尔铁塔位于哪里？”\n\
  * `Answer`：“法国巴黎”\n* `Start Index`： 311\n\n在预处理过程中，上下文和问题会被`共同分词（tokenized together）`。\n\
  \n# 微调 BERT\n\n使用以下步骤在问答数据集上对模型进行微调：\n1. 将 `[CLS] question [SEP]` 序列输入 `BERT`。\n\
  2. `BERT` 为每个标记（token）产生上下文嵌入。\n3. 在顶层添加两个线性层以预测：\n    * 起始索引\n    * 结束索引\n4. 使用预测的起始/结束位置与真实位置之间的`交叉熵损失`对模型进行训练。\n\
  \n**评估**\n\n训练完成后，根据特定的指标评估模型的有效性，这些指标衡量其生成正确答案的成功率。以下是两个广泛使用的指标：\n\n* `精确匹配 (EM)：`\
  \ 这决定了预测的响应与地面真值是否完全匹配。这是一个非常严格的指标；标点符号、大小写或部分重叠的任何变化都会被赋予 0 分。\n* `F1 分数：` 通过在标记级别比较预期响应和实际响应，这提供了一种更具适应性的评估。即使完整响应不匹配，它通过计算精确率和召回的调和平均数，为重叠单词提供部分分数。\n\
  \n# 数据集来源\n\n我们将使用 `Wikipedia` 作为数据集，针对特定类型训练自定义语言模型。`Wikipedia` `虚构以及非虚构作品中的`各种主题拥有详尽的信息。这为训练自定义语言模型提供了完美的资源。然而，也可以有其他开放资源，例如\
  \ `Project Gutenberg, Hugging Face datasets, CNN daily mail datasets, Reuters News\
  \ datasets, Kaggle poetry datasets, Hugging Face Openwebtexts` 等。\n\n\n\n\n我们将使用\
  \ `Hugging Face’s Wikipedia dataset` 来训练我们的自定义语言模型。Hugging Face 提供了一种简单的方法来访问维基百科最新文章快照。\n\
  \n```\nfrom datasets import load_dataset\ndataset = load_dataset(\"wikipedia\",\
  \ \"20220301.en\")\nprint(dataset[\"train\"][0][\"text\"])\n```\n\n### 数据集信息\n\n\
  *   `wikipedia`: 数据集名称。\n*   `\"20220301.en\"`：`2022 年 3 月`的英文维基百科快照。\n*   该数据集包含维基百科的`全文`，排除了用户编辑和元数据。\n\
  \n输出包含大量关于历史、地缘政治、地方政治、哲学等文本。\n每一行代表一篇维基百科文章。\n\n#### 特性：\n\n*   `id`: 唯一文章 ID。\n\
  *   `url`: 维基百科文章的链接。\n*   `title`: 文章标题。\n*   `text`: 文章完整内容。\n\n### 准备用于训练的维基百科数据\n\
  \n*   由于维基百科文章包含`参考文献、表格、引用和超链接`，我们需要在将数据输入模型之前对其进行`清洗和预处理`。\n\n### 数据清洗和分词的步骤\n\
  \n我们需要移除不需要的内容，例如参考文献（== References ==）、引用（[1], [2]）和 URL（https://…）等。\n\n我们可以使用正则表达式和文本预处理技术`移除`这些不需要的元素。\n\
  \n```python\nimport re\n\ndef clean_wikipedia_text(text):\n    # 移除如 [1], [2] 等参考文献\n\
  \    text = re.sub(r\"\\[\\d+\\]\", \"\", text)\n    # 移除 URL\n    text = re.sub(r\"\
  http\\S+|www.\\S+\", \"\", text)\n    # 移除额外的空格\n    text = re.sub(r\"\\s+\", \"\
  \ \", text).strip()\n    return text\n\n# 应用清洗函数\ndataset[\"train\"][0][\"text\"\
  ] = clean_wikipedia_text(dataset[\"train\"][0][\"text\"])\n```\n\n由于整个维基百科文本非常庞大，我们仅对部分文本应用清洗函数。\n\
  \n### 使用 Hugging Face Tokenizers 对文本进行分词\n\n分词是将文本拆分为更小的组件（如单词或子词）的过程。由于我们将使用 `GPT-2\
  \ or BERT` 来训练模型，我们将使用它们各自的分词器。代码如下所示。\n\n```python\nfrom transformers import AutoTokenizer\n\
  \n# 加载 GPT-2 分词器\ntokenizer = AutoTokenizer.from_pretrained(\"gpt2\")\n# 设置填充标记\n\
  tokenizer.pad_token = tokenizer.eos_token\n# 仅对第一个训练样本的清洗文本进行分词\ntokenized_text\
  \ = tokenizer(dataset[\"train\"][0][\"text\"], truncation=True, padding=\"max_length\"\
  , max_length=512, return_tensors=\"pt\") # 转换为 PyTorch 张\n# 打印分词输出\nprint(tokenized_text)\n\
  ```\n\n代码解释如下。\n\n#### 导入所需的分词器\n```python\nfrom transformers import AutoTokenizer\n\
  ```\n1.  我们从 Hugging Face 的 transformers 库中导入 `AutoTokenizer`。\n2.  该类会自动为任何预训练模型加载正确的分词器。\n\
  \n#### 加载 GPT-2 分词器\n```python\ntokenizer = AutoTokenizer.from_pretrained(\"gpt2\"\
  )\n```\n1.  我们正在加载用于 `GPT-2 model` 的分词器。\n2.  该分词器将文本转换为模型可以理解的数值表示（标记）。\n\n####\
  \ 设置填充标记\n```python\ntokenizer.pad_token = tokenizer.eos_token\n```\n*   我们将`序列结束标记\
  \ (eos_token)` 设置为填充标记 (`pad_token`)。\n*   `eos_token`：`<|endoftext|>`（GPT-2 用于标记句子或序列的结束）。\n\
  *   这确保了在处理不同长度的序列时能够正确处理填充。\n\n#### 对清洗后的维基百科文本进行分词\n```python\ntokenized_text\
  \ = tokenizer(dataset[\"train\"][0][\"text\"], truncation=True, padding=\"max_length\"\
  , max_length=512, return_tensors=\"pt\")\n```\n这一行对第一个训练样本（`dataset[\"train\"][0][\"\
  text\"]`）执行分词`。参数细节如下：\n*   `dataset[\"train\"][0][\"text\"]` - 将第一个清洗后的维基百科文本样本传递给分词器。\n\
  *   `truncation=True` - 确保长序列在`max_length=512` 个标记后`被截断`。\n*   `padding=\"max_length\"\
  ` - 如果文本少于 512 个标记，则`填充`到恰好 512 个标记。\n*   `max_length=512` - 序列中标记的最大数量。\n*   `return_tensors=\"\
  pt\"` - 转换为 PyTorch 张量。\n\n#### 打印分词输出\n```python\nprint(tokenized_text)\n```\n\
  输出包含：\n*   `input_ids`: 标记的数值表示。\n*   `attention_mask`: 用于区分真实标记 (1) 和填充 (0) 的掩码。\n\
  \n\n\n\n- 使用在斯坦福问答数据集（SQuAD 2.0）上训练的预训练 transformer 模型。\n- 如果需要，对模型进行特定领域的问答进行微调。\n\
  \n# 设置开发环境\n\n我们安装相关的库并导入必要的包。\n\n```\npip install transformers torch\n```\n\n```\n\
  import torch\n```\n\n```\nfrom transformers import AutoTokenizer, AutoModelForQuestionAnswering\n\
  ```\n\n在选择问答模型时，有多个模型可选，我们选择了 `deepset/roberta-base-squad2` 模型。`roberta-base` ([`huggingface.co/FacebookAI/roberta-base`](https://huggingface.co/FacebookAI/roberta-base))\
  \ 模型使用了 SQuAD2.0 ([`huggingface.co/datasets/rajpurkar/squad_v2`](https://huggingface.co/datasets/rajpurkar/squad_v2))\
  \ 数据集进行了微调。它已经在包含不可答问题在内的问答对上经过了训练，用于抽取式问答（Extractive Question Answering）。\n\n模型的截图所示。有大量的问答模型，但我们选择了\
  \ `roberta-base-squad2`，因为它比其他模型更准确。不过，我们也可以尝试如 `DistilBert` 等流行模型。\n\n图 9.3：问答模型列表。在左侧，我们看到在自然语言处理类别下，有各种任务，例如文本分类、标记分类、摘要、特征提取和问答等。还有计算机视觉、表格、强化学习和多模态等不同类别，每个类别下都有各种任务。\n\
  \n现在我们已经对问答任务和相关模型有了基本的了解，让我们来看执行该任务的函数。\n\n```\nimport torch\nfrom transformers\
  \ import AutoTokenizer, AutoModelForQuestionAnswering\n\n# 加载预训练模型和分词器\nmodel_name\
  \ = 'deepset/roberta-base-squad2'\ntokenizer = AutoTokenizer.from_pretrained(model_name)\n\
  model = AutoModelForQuestionAnswering.from_pretrained(model_name)\n\ndef get_answer(question,\
  \ context):\n    # 使用截断分词（处理长文本）\n    inputs = tokenizer(\n        question, context,\n\
  \        add_special_tokens=True,\n        return_tensors=\"pt\",\n        truncation=True,\n\
  \        max_length=512\n    )\n\n    # 获取模型预测\n    with torch.no_grad():  # 不计算梯度以加速推理\n\
  \        outputs = model(**inputs)\n        start_logits = outputs.start_logits\n\
  \        end_logits = outputs.end_logits\n\n    # 获取最佳起始和结束索引\n    start_index =\
  \ torch.argmax(start_logits)\n    end_index = torch.argmax(end_logits)\n\n    #\
  \ 确保答案范围有效\n    if start_index >= end_index:\n        return \"Answer not found\
  \ in the given context.\"\n\n    # 将标记转换为文本\n    answer = tokenizer.convert_tokens_to_string(\n\
  \        tokenizer.convert_ids_to_tokens(inputs[\"input_ids\"][0][start_index:end_index\
  \ + 1])\n    )\n    return answer\n\n# 示例段落\ncontext = \"Hugging Face is a company\
  \ that develops machine learning technologies, particularly in natural language\
  \ processing (NLP).\"\n\n# 示例问题\nquestion = \"What does Hugging Face specialize\
  \ in?\"\nanswer = get_answer(question, context)\nprint(\"Answer:\", answer)\n\n\
  # 输出：\n# Answer: natural language processing\n```\n\n其解释如下：\n\n### 加载预训练模型和分词器\n\
  \n```\nfrom transformers import AutoTokenizer, AutoModelForQuestionAnswering\n\n\
  # 加载预训练模型和分词器\nmodel_name = \"deepset/roberta-base-squad2\"\ntokenizer = AutoTokenizer.from_pretrained(model_name)\n\
  model = AutoModelForQuestionAnswering.from_pretrained(model_name)\n```\n\n我们使用 `Hugging\
  \ Face Transformers` 来加载一个预训练的问答模型（`deepset/roberta-base-squad2`）。我们加载了相同模型的 `tokenizer`，它将将文本转换为标记\
  \ ID。\n\n### 为什么使用 `deepset/roberta-base-squad2`？\n\n- 它在 SQuAD 2.0 数据集（一个用于问答任务的数据集）上进行了微调。\n\
  - 比起普通的 BERT，在提取精确答案方面更准确。\n\n### 对问题和上下文进行分词\n\n```python\n# 使用截断分词（处理长文本）\ninputs\
  \ = tokenizer(\n    question, context,\n    add_special_tokens=True,\n    return_tensors=\"\
  pt\",\n    truncation=True,\n    max_length=512\n)\n```\n\n在这里，我们使用 `context` 和\
  \ `question` 参数创建了 `get_answer` 函数。在此之下，第一个任务是对问题和上下文进行分词。正在执行的任务：\n- 将问题和上下文转换为模型理解的格式。\n\
  - `add_special_tokens=True`：添加 `[CLS]` 和 `[SEP]` 标记以符合正确的模型格式。\n- `return_tensors=\"\
  pt\"`：将输出转换为 PyTorch 张量（因为模型期望张量）。\n- `truncation=True, max_length=512`：如果上下文太长，将被截断为\
  \ 512 个标记（模型限制）。\n\n### 预测答案的起始和结束位置\n\n```python\n# 获取模型预测\nwith torch.no_grad():\
  \  # 不计算梯度以加速推理\n    outputs = model(**inputs)\n    start_logits = outputs.start_logits\n\
  \    end_logits = outputs.end_logits\n```\n\n在这里，执行了以下任务：\n- 将分词后的输入传入模型以获取预测。\n\
  - 模型输出答案起始和结束位置的 `logits`。\n- 使用 `torch.no_grad()` 禁止梯度计算，提高推理速度。\n\n### 提取最佳答案\n\
  \n```python\n# 获取最佳起始和结束索引\nstart_index = torch.argmax(start_logits)\nend_index\
  \ = torch.argmax(end_logits)\n```\n\n这段代码的作用是：\n- 找到概率最大的作为答案起始和结束的单词。\n- `torch.argmax(start_logits)`：找到答案开始处的单词索引。\n\
  - `torch.argmax(end_logits)`：找到答案结束处的单词索引。\n\n### 防止无效答案\n\n```python\n# 确保答案范围有效\n\
  if start_index >= end_index:\n    return \"Answer not found in the given context.\"\
  \n```\n\n- 有时模型会预测错误的索引（例如起始索引在结束索引之后）。\n- 此条件防止了无效输出。\n\n### 将标记转换为可读文本\n\n```python\n\
  # 将标记转换为文本\nanswer = tokenizer.convert_tokens_to_string(\n    tokenizer.convert_ids_to_tokens(inputs[\"\
  input_ids\"][0][start_index:end_index + 1])\n)\n```\n\n将标记索引转换回可读的文本。\n\n### 示例用法\n\
  \n```python\n# 示例段落\ncontext = \"Hugging Face is a company that develops machine\
  \ learning technologies, particularly in natural language processing (NLP).\"\n\n\
  # 示例问题\nquestion = \"What does Hugging Face specialize in?\"\nanswer = get_answer(question,\
  \ context)\nprint(\"Answer:\", answer)\n\n# 输出：\n# Answer: natural language processing\n\
  ```\n\n在这里，还尝试了上下文之外的问题，并返回“Answer not found in the given context”，以解决无效答案的问题。\n\
  \n```python\n# 示例问题\nquestion = \"What is the capital of France?\"\nanswer = get_answer(question,\
  \ context)\nprint(\"Answer:\", answer)\n\n# 输出：\n# Answer: Answer not found in the\
  \ given context.\n```\n\n以下是问答系统的关键特性。\n\n| 特性 | 解释 |\n| --- | --- |\n| 使用 `deepset/roberta-base-squad2`\
  \ | 在 SQuAD 2.0 数据集上微调的预训练模型。 |\n| 支持长文本 | 如果文本超过 512 个标记，则会被截断。 |\n\n\n\n\n\n|\
  \ 无梯度计算 | 使用 `torch.no_grad()` 加速推理。 |\n| 防止无效答案 | 确保 `start_index` < < `end_index`\
  \ 。 |\n| 提取准确答案 | 寻找概率最高的词汇位置 |\n\n**表 9.1：问答系统功能及代码等效解释**\n\n上述的问答系统帮助我们在所提供的上下文中回答问题。这可以进一步增强，以能够同时处理多个问题，并对医疗、金融、银行和法律文档等自定义数据进行微调。\n\
