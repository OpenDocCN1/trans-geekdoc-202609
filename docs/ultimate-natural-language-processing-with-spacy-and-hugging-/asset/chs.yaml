  \n# 第 5 章\n\n## CNN 的应用\n\n### 引言\n\n情感分析是自然语言处理的基石，旨在提取文本的情感基调。本章将探讨深度学习模型（特别是`卷积神经网络\
  \ (CNNs)`）在情感分析中的应用。通过实践项目，我们将探索这些模型的复杂性、优缺点，以及如何将它们有效地应用于现实世界的问题。\n\n通过理解 CNN 的架构、原理和应用，我们将全面掌握用于情感分析的深度学习。这些知识将使你能够构建复杂的模型，准确地将文本分类为积极、消极或中性。\n\
  \n### 结构\n\n在本章中涵盖以下主题：\n\n* 使用 CNN 进行情感分析\n* 数据理解与探索\n* CNN 模型的数据准备\n* CNN 模型的准备与训练\n\
  * 模型评估与可视化\n\n# 使用 CNN 进行情感分析\n\n情感分析旨在识别文本数据的情感基调，将其分类为积极、消极或中性。CNN 最初是为图像处理设计的，但由于其能够捕捉序列中的局部模式和依赖关系，它们在`文本分类任务`中被证明是有效的。我们将使用针对特定药物及相关疾病的患者评论数据集，其中包含反映患者总体满意度的\
  \ 10 星患者评分。\n\n# 数据理解与探索\n\n数据是通过通过爬取`在线药品评论网站`获得的。其意目的是研究：\n\n* 多个维度的药物体验情感分析，即在特定方面（如疗效和副作用）上学到的情感；\n\
  * 模型在不同领域（即疾病）之间的迁移性；\n* 模型在不同数据源之间的迁移性（参见`Drug Review Dataset (Druglib.com)`）。\n\
  \n[药物分类数据集 (https://archive.ics.uci.edu/dataset/462/drug+classification)](https://archive.ics.uci.edu/dataset/462/drug+classification)\n\
  \n# CNN 模型的数据准备\n\n现在我们将对文本进行一些预处理操作，例如删除（有的）HTML 标签、删除重音字符、转换为小写、删除标点符号和特殊字符以及删除停用词。\n\
  \n```python\nimport re\nimport nltk\nfrom nltk.corpus import stopwords\nfrom bs4\
  \ import BeautifulSoup\nimport unicodedata\nimport contractions\nimport string\n\
  \ndef preprocess_corpus(text):\n    \"\"\"\n    预处理文本。\n    Args:\n        text\
  \ (str): 输入文本。\n    Returns:\n        str: 预处理后的文本。\n    \"\"\"\n    # 删除 HTML 标签\n\
  \    soup = BeautifulSoup(text, \"html.parser\")\n    text = soup.get_text()\n\n\
  \    # 删除重音字符\n    text = unicodedata.normalize('NFKD', text).encode('ascii', 'ignore').decode('utf-8')\n\
  \n    # 转换为小写\n    text = text.lower()\n\n    # 删除标点符号和特殊字符\n    text = text.translate(str.maketrans('',\
  \ '', string.punctuation))\n\n    # 删除数字\n    text = re.sub(r'\\d+', '', text)\n\
  \n    # 删除停用词\n    stop_words = set(stopwords.words('english'))\n    words = [word\
  \ for word in text.split() if word not in stop_words]\n\n    # 将单词合并成句子\n    preprocessed_text\
  \ = ' '.join(words)\n    return preprocessed_text\n```\n\n数据被分为训练集（75%）和测试集（25%）。\n\
  \n```python\n# 加载和划分数据的示例\ndrugs_df_train = pd.read_csv('drugsComTrain_raw.tsv',\
  \ sep='\\t')\ndrugs_df_test = pd.read_csv('drugsComTest_raw.tsv', sep='\\t')\n\n\
  # 合并训练和测试数据以拆分\ncombined_df = pd.concat([drugs_df_train, drugs_df_test], ignore_index=True)\n\
  \n# 将合并后的数据分为新的训练集和验证集\ntrain_df_new, val_df = train_test_split(combined_df, test_size=0.2,\
  \ random_state=42)\n```\n\n\n\n\n在前面的代码中，我们合并了训练和测试数据框，并创建了一个新的合并数据框。随后，将合并后的数据框分为\
  \ 80%（`train`）和 20%（`test`）。最后我们得到了三个数据集：一个新的训练数据框（`train_df_new`）、验证数据（`val_df`）和测试数据（`drugs_df_test`）。\n\
  \n在下一步，我们将对 `train`、`test` 和 `validation` 数据使用 `preprocess` 函数。\n\n# 预处理文本\n\n```python\n\
  train_df_new['review'] = train_df_new['review'].apply(preprocess_corpus)\ndrugs_df_test['review']\
  \ = drugs_df_test['review'].apply(preprocess_corpus)\nval_df['review'] = val_df['review'].apply(preprocess_corpus)\n\
  ```\n\n在进入模型训练步骤之前，我们在所有数据集上使用了 `preprocess_corpus` 函数。下一步，我们将数据拆分为 `X_train`、`y_train`、`X_test`、`y_test`、`X_val`\
  \ 和 `y_val`。\n\n```python\nX_train = train_df_new['review'].values\ny_train = train_df_new['rating'].values\n\
  X_test = drugs_df_test['review'].values\ny_test = drugs_df_test['rating'].values\n\
  X_val = val_df['review'].values\ny_val = val_df['rating'].values\n```\n\n我们从训练、测试和验证数据中提取了评论和评分值。然后我们将对训练数据进行分词。\n\
  \n# 数据分词（评论）\n\n```python\nt = Tokenizer(oov_token='<UNK>')\n# 在训练文档上拟合分词器\nt.fit_on_texts(X_train)\n\
  t.word_index['<PAD>'] = 0\n```\n\nKeras 中的 `Tokenizer` 类用于将文本数据转换为机器学习模型可以处理的数值表示。\n\
  \n* `oov_token` 参数指定了一个用于词汇表中不存在的标记。\n* `fit_on_texts` 方法从训练数据中构建唯一单词词汇表，并为它们分配整数索引。\n\
  * 分词器的 `word_index` 属性包含一个将单词映射到相应索引的字典。\n* 添加填充标记 `<PAD>` 可确保所有序列具有相同的长度，这对于将数据输入到神经网络模型中是关重要的。\n\
  \n然后，我们将评论转换为序列。\n\n```python\nX_train = t.texts_to_sequences(X_train)\nX_test =\
  \ t.texts_to_sequences(X_test)\nX_val = t.texts_to_sequences(X_val)\n```\n\n* `t.texts_to_sequences()`：此方法来自\
  \ Keras `Tokenizer` 类，用于将文本数据转换为整数序列。每个整数代表分词器创建的词表中的唯一单词。因此，来自训练、测试和验证数据集的每个文本数据都被转换为数值序列。\n\
  \n我们将使用 matplotlib 可视化这些序列。\n\n# 绘制序列长度\n\n```python\nimport matplotlib.pyplot as\
  \ plt\n%matplotlib inline\ntrain_lens = [len(s) for s in X_train]\ntest_lens = [len(s)\
  \ for s in X_test]\nfig, ax = plt.subplots(1,2, figsize=(12, 6))\nh1 = ax[0].hist(train_lens)\n\
  h2 = ax[1].hist(test_lens)\n```\n\n* 代码首先计算训练集和测试集中每个序列的长度。\n* 然后，它创建了两个子图来可视化两个数据集中序列长度的分布。\n\
  * 直方图显示了每个集中不同序列长度的频率。\n\n![](img/Figure-5.2.jpg)\n\n**图 5.2**：训练和测试数据的序列直方图\n\n\
  训练数据序列向右偏，数据集中在左侧；测试数据序列几乎相同，右侧略有凸起。接下来，我们将对训练、测试和验证数据集进行序列归一化。序列归一化的目的是：\n\n* **确保一致**：序列归一化确保所有输入序列具有相同的长度。这对于包括神经网络在内的许多机器学习模型至关重要，因为它们需要固定长度的输入。\n\
  * **防止错误**：如果序列长度不同，可能需要填充或截断。错误的填充或截断会导致模型预测错误。\n\n序列归一化的代码如下。\n\n# 将数据集填充到最大评论单词长度\n\
  \n```python\nMAX_SEQUENCE_LENGTH = 40\nX_train = pad_sequences(X_train, maxlen=MAX_SEQUENCE_LENGTH)\n\
  X_test = pad_sequences(X_test, maxlen=MAX_SEQUENCE_LENGTH)\nX_val = pad_sequences(X_val,\
  \ maxlen=MAX_SEQUENCE_LENGTH)\n```\n\n我们添加了 40 的最大序列长度，序列将进行填充。接下来我们将进行标签编码。标签编码的目的是：\n\
  \n* **机器可读性**：将类别标签编码为数值。\n* **一致性**：它确保模型一致地处理类别。\n* **评估指标**：许多评估指标（如准确率、召回率）需要数值标签。\n\
  \n标签编码的代码如下。\n\n# 编码标签\n\n```python\nle = LabelEncoder()\ny_train = le.fit_transform(y_train)\n\
  y_test = le.transform(y_test)\ny_val = le.transform(y_val)\n```\n\n`LabelEncoder`\
  \ 类用于将类别数据编码为数值表示。\n\n* `fit_transform()` 方法用于训练标签以学习唯一类别并分配整数索引。\n* `transform()`\
  \ 方法使用从训练数据中学到的映射用于测试和验证标签。\n\n`rating` 列中有 10 个类别，从 1 到 10 开始，其中 10 是最高评分，1 是最低评分。\n\
  \n\n\n\n*   **词表大小 (Vocabulary Size)**：较大的词表大小允许模型捕捉文本数据中的更多细微差别。然而，非常大的词表也会增加模型的复杂性和计算资源的需求。\n\
  *   **嵌入大小 (Embedding Size)**：嵌入大小决定了词嵌入的维度。较高的嵌入大小可以捕捉词之间更复杂的语义关系，但也会增加模型的参数数量。\n\
  *   **早停 (Early Stopping)**：此回调函数对于防止过拟合至关重要。通过在模型在验证集上的性能不再提升时停止训练，它可以帮助找到最佳的轮数（epochs）并避免对训练数据的过拟合。\n\
  \n现在，我们将创建 CNN 模型。\n\n# 创建模型\n\n```python\nmodel = Sequential()\n\n# 嵌入层\nmodel.add(Embedding(VOCAB_SIZE,\
  \ EMBED_SIZE, input_length=MAX_SEQUENCE_LENGTH))\n\n# 第一层维卷积层 (32,4,same,relu)\n\
  model.add(Conv1D(filters=32, kernel_size=4, padding='same', activation='relu'))\n\
  model.add(Conv1D(filters=32, kernel_size=4, padding='same', activation='relu'))\n\
  \n# 第一层最大池化层 (2)\nmodel.add(MaxPooling1D(pool_size=2))\n\n# 第一层 Dropout 层 (10%)\n\
  model.add(Dropout(rate=0.10))\n\n# 第二层维卷积层 (32,4,same,relu)\nmodel.add(Conv1D(filters=64,\
  \ kernel_size=4, padding='same', activation='relu'))\nmodel.add(Conv1D(filters=64,\
  \ kernel_size=4, padding='same', activation='relu'))\n\n# 第二层最大池化层 (2)\nmodel.add(MaxPooling1D(pool_size=2))\n\
  \n# 第二层 Dropout 层 (10%)\nmodel.add(Dropout(rate=0.10))\n\n# 第三层维卷积层 (32,4,same,relu)\n\
  model.add(Conv1D(filters=64, kernel_size=4, padding='same', activation='relu'))\n\
  model.add(Conv1D(filters=64, kernel_size=4, padding='same', activation='relu'))\n\
  \n# 第三层最大池化层 (2)\nmodel.add(MaxPooling1D(pool_size=2))\n\n# 第三层 Dropout 层 (10%)\n\
  model.add(Dropout(rate=0.10))\n\n# 展平层\nmodel.add(Flatten())\n\n# 第一层全连接层 (256,relu)\n\
  model.add(Dense(256, activation='relu'))\n\n# 第二层全连接层/输出层 (10,softmax)\nmodel.add(Dense(10,\
  \ activation='softmax'))\n\n# 使用交叉熵损失函数、准确率和 Adam 优化器编译模型\nmodel.compile(loss='SparseicalCrossentropy',\
  \ optimizer=tf.keras.optimizers.Adam(1e-4), metrics=['accuracy'])\n\n# 显示模型架构\n\
  model.summary()\n```这段代码定义了一个用于文本分类的卷积神经网络 (CNN)。该模型旨在处理序列并将其分类为 10 类之一。\n\n## 创建顺序模型\n\
  \n*   `model = Sequential()`：初始化一个顺序模型，它是一个线性堆叠层。\n\n## 嵌入层\n\n*   `model.add(Embedding(VOCAB_SIZE,\
  \ EMBED_SIZE, input_length=MAX_SEQUENCE_LENGTH))`：添加嵌入层，将词索引转换为密集向量。\n    *   `VOCAB_SIZE`：词表大小。\n\
  \    *   `EMBED_SIZE`：词嵌入的维度。\n    *   `input_length`：序列长度。\n\n## 卷积层\n\n*   `model.add(Conv1D(filters=32,\
  \ kernel_size=4, padding='same', activation='relu'))`：添加一维卷积层，具有 32 个卷积滤波器、4 的卷积核大小、padding='same'\
  \ 以保持输入形状，以及 ReLU 激活函数。\n*   使用多个卷积层从输入序列中提取不同的特征。\n\n## 池化层\n\n*   `model.add(MaxPooling1D(pool_size=2))`：添加最大池化层对特征图进行采样，降低维度。\n\
  \n## Dropout 层\n\n*   `model.add(Dropout(rate=0.10))`：添加 Dropout 层，在训练期间随机丢弃单元以防止过拟合。\n\
  \n## 展平层\n\n*   `model.add(Flatten())`：将卷积层的输出展平为一维向量。\n\n#### 全连接层\n\n*   `model.add(Dense(256,\
  \ activation='relu'))`：添加一个具有 256 个单元和 ReLU 激活函数的全连接层。\n*   `model.add(Dense(10,\
  \ activation='softmax'))`：添加一个具有 10 个单元和 softmax 激活函数的全连接层。\n\n#### 编译模型\n\n*  \
  \ `model.compile(loss='SparseCategoricalCrossentropy', optimizer=tf.keras.optimizers.Adam(1e-4),\
  \ metrics=['accuracy'])`：使用 `SparseCategoricalCrossentropy` 作为损失函数，`accuracy` 作为指标，`Adam`\
  \ 作为优化器来编译模型。\n\n## 显示模型架构\n\n*   `model.summary()`：显示模型的架构。\n\n\n\n\n在下一步中，我们将跨训练轮次（epochs）视化训练损失和验证损失。代码如下：\n\
  \n```python\nimport matplotlib.pyplot as plt\n\n# 绘制训练和验证损失\nplt.plot(history1.history['loss'],\
  \ label='Training Loss')\nplt.plot(history1.history['val_loss'], label='Validation\
  \ Loss')\nplt.title('Training and Validation Loss')\nplt.xlabel('Epochs')\nplt.ylabel('Loss')\n\
  plt.legend()\nplt.show()\n```\n\n### 绘制训练和验证损失\n\n*   `plt.plot(history1.history['loss'],\
  \ label='Training Loss')`: 将从 `history1` 对象（由 `model.fit` 方法返回）提取的训练损失值绘制在折图中，并标记为‘Training\
  \ Loss’。模型训练步骤中的 `history1` 对象包含了有关训练过程的信息，包括每个轮次训练数据和验证数据的损失值。\n*   `plt.plot(history1.history['val_loss'],\
  \ label='Validation Loss')`: 同样，绘制验证损失值，并标记为‘Validation Loss’。\n\n### 添加标题和标签\n\n\
  *   `plt.title('Training and Validation Loss')`: 设置图表的标题。\n*   `plt.xlabel('Epochs')`:\
  \ 将 x 轴标记为‘Epochs’。\n*   `plt.ylabel('Loss')`: 将 y 轴标记为‘Loss’。\n\n### 图例和显示\n\n\
  *   `plt.legend()`: 给图中添加图例，以区分不同的线条。\n*   `plt.show()`: 显示生成的图表。\n\n生成的图表所示。\n\n\
