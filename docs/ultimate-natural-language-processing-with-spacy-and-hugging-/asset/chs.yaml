  M\")` 方法创建一个新列，按年和月对日期分组（例如 2022-07）。\n* **密度计算**：`groupby(\"year_month\").size()`\
  \ 方法统计每月发布的文章数量。\n* **柱状图**：使用 Matplotlib 将密度绘制为柱状图，并带有标签、标题和网格线。\n\n输出：\n\n```\n\
  Oldest Date: 2021-10-20\nNewest Date: 2024-12-03\n```\n\n![](img/Figure-7.2.jpg)\n\
  \n图 7.2：按月发布的文章频率\n\n数据集中的最早日期是 2021 年 10 月 20 日，最晚日期是 2024 年 12 月 3 日。从上面的柱状图中可以观察到，2023\
  \ 年 10 月的文章发布最多，其次是 2022 年 5 月。有 8 个月的每月文章数超过 35 篇。\n\n在接的步骤中，我们将根据日、月、年识别事件。代码如下：\n\
  \n```python\n# 条件\nyear_pattern = r'\\b([1-9][0-9]{3})\\b' # 匹配从 1000 起的任何四位年份\n\
  month_pattern = r'\\b(January|February|March|April|May|June|July|August|September|November|December)\\\
  b'\nday_pattern = r'\\b(Monday|Tuesday|Wednesday|Friday|Saturday|Sunday)\\b'\ncurrency_pattern\
  \ = r'[\\$\\€\\₹]\\d+|\\d+[\\$\\€\\₹]' # 匹配带有货币符号的数字\n\n# 过滤行的函数\ndef filter_rows(df,\
  \ column):\n    filtered_rows = df[column].apply(\n        lambda x: (\n       \
  \     bool(re.search(year_pattern, x)) or # 匹配年份\n            bool(re.search(month_pattern,\
  \ re.IGNORECASE)) or # 匹配月份\n            bool(re.search(day_pattern, x, re.IGNORECASE))\
  \ # 匹配日期\n        ) and not bool(re.search(currency_pattern, x)) # 排除货币相关的行\n  \
  \  )\n    return df[filtered_rows]\n\n# 应用过滤\nfiltered_df = filter_rows(df, \"description\"\
  )\nfiltered_df\n```\n\n代码解释如下：\n\n* **正则表达式**：\n    * `year_pattern`：该模式匹配从 1000\
  \ 开始的任何四位数字。\n    * `month_pattern`：匹配完整的月份名称（January、February 等），不区分大小写。\n    *\
  \ `day_pattern`：匹配完整的星期几名称（Monday、Tuesday 等），不区分大小写。\n    * `currency_pattern`：匹配前缀或后缀带有\
  \ $ 、₹ 或 € 的数字。\n* **过滤逻辑**：\n    * `bool(re.search(…))`：确保条件匹配（例如，年份、月份或日期）。\n\
  \    * `not bool(re.search(currency_pattern, x))`：确保排除包含货币相关数字的行。\n* **Apply 函数**：\n\
  \    * 使用 `.apply()` 函数检查 description 列中的每一行是否符合过滤逻辑。\n\n输出：\n\n![](img/Figure-7.3.jpg)\n\
  \n图 7.3：包含事件的过滤后的文章\n\n我们得到了包含 135 条记录的输出，这些记录按日、月或年记录了事件。\n\n例如，对于这条文章描述：\n\n*\
  \ \"AC 米兰自 2007 年夺冠以来首次进入欧冠赛半决赛，在一场激烈的比赛中击败了意甲死敌那波利，” 该文发布于 2023 年 4 月。\n\n2023-04\n\
  \n或者这条文章的描述：\n\n\"*威尔王子和凯特王妃听取了 NHS 成立后第一个出生者（ 1948 年）的故事，”* 该文发布于 2023 年 7 月。\n\
  \n通过这种方式，我们可以使用正则表达式来识别日期。\n\n\n\n\n在下一步中，我们将识别文章描述中的标签，例如 `GPE`（地缘实体）、`ORG`（组织）、`DATE`（日期事件）、`PERSON`（人物）和\
  \ `EVENT`（事件）。代码如下：\n\n```python\ndef extract_named_entities(text):\n    doc = nlp(text)\n\
  \    entities = [{\"entity\": ent.text, \"label\": ent.label_} for ent in doc.ents]\n\
  \    return entities\n\n# 将函数应用于 dataframe\ndf['named_entities'] = df['description'].apply(extract_named_entities)\n\
  df\n```\n\n代码解释如下：\n\n### NER 函数：\n- `extract_named_entities` 函数使用 spaCy 的 `nlp`\
  \ 模型处理每行文本。\n- 它遍历 `doc` 对象中的 `ents`（命名实体），创建一个包含 `entity`（文本内容）和 `label`（其实体类型）的字典列表。\n\
  \n### 应用函数：\n- 使用 pandas 的 `.apply()` 方法将 `extract_named_entities` 函数应用到新闻列的每一行。\n\
  - 创建一个新列 `named_entities`，用于存储提取的实体。\n\n**结果**：生成的 dataframe 包含原始新闻列和一个包含提取实体列表的新列\
  \ `named_entities`。\n\n**输出**：\n\n![](img/Figure-7.4.jpg)\n\n**图 7.4**：使用 spaCy\
  \ 提取的各种标签\n\n在上面的输出中，我们通过 spaCy 流水线从文章中提取了各种标签，如 `CARDINAL`、`EVENT`、`DATE`、`ORG`、`PERSON`、`GPE`\
  \ 等。例如，我们有这样一：\n\n“Carmelle Hepi 来自 Barnsley，她于周六前往伦敦参加派对，此后未再出现。”实体为：\n\n```python\n\
  [{'entity': 'Carmelle Hepi', 'label': 'ORG'}, {'entity': 'Barnsley', 'label': 'ORG'},\
  \ {'entity': 'London', 'label': 'GPE'}, {'entity': 'Saturday', 'label': 'DATE'}]\n\
  ```\n\n我们为上述文章提供了多种标签。Barnsley 和 Carmelle Hepi 这两个词没有被正确标记，因为 Carmelle 是一个 `PERSON`，而\
  \ Barnsley 是一个 `GPE`。然而，London 和 Saturday 的标记是正确的。\n\n我们可以检查这篇文章：\n\n“曼彻联在温布利球场的一场史诗级半决赛中，尽管浪费了面对冠军赛科文特的三球优势，仍通过点球大战进入足杯决赛。”\n\
  \n这是一条 2024 年 4 月的足球相关新闻。实体标签如下：\n\n```python\n[{'entity': 'Manchester United',\
  \ 'label': 'GPE'}, {'entity': 'the FA Cup', 'label': 'EVENT'}, {'entity': 'three',\
  \ 'label': 'CARDINAL'}, {'entity': 'Championship side Coventry', 'label': 'ORG'},\
  \ {'entity': 'Wembley', 'label': 'ORG'}]\n```\n\n曼联和科文特是足球俱乐部。Manchester 是地方，因此被标记为\
  \ `GPE`，但它应该是一个组织（Organization）。FA Cup 是一个事件（EVENT）。Three 是基数。Wembley 是被标记为组织的体育场。Coventry\
  \ 被正确地标记为组织。\n\n我们可以看到，在某些情况下，词汇没有被正确标记相应的实体。从 spaCy 和正则表达式得到的结果可以提取到 `.csv` 文件。\n\
  \n# 从业务邮件中提取客户和交易信息\n\n**问题描述**：业务邮件通常包含客户和交易信息，如客户姓名、日期、组织名称、事件和其他相关细节。手动提取这些信息非常耗时。使用\
  \ NLP (spaCy) 和正则表达式自动化该过程可以节省时间，并揭示有价值的见解。\n\n我们将使用 Enron 邮件数据集。Enron 邮件数据集包含大约\
  \ 500,000 封由 Enron 公司员工生成的邮件。它是由联邦能源监管委员会在调查 Enron 破产期间获取的。\n\n### 数据集加载与示例用法：\n\
  \n在这一步中，我们将以 dataframe 的形式加载数据集，并像之前提取事件和日期那样对数据进行抽样。代码如下：\n\n```python\ndata =\
  \ pd.read_csv('emails.csv')\ndata.shape\n```\n\n有 517401 行和 2 列。\n\n```python\n\
  # 为了方便分析，对数据进行采样\ndata = data.sample(n=1000).copy()\n```\n\n我们使用 1000 行数据作为样本。在下一步中，我们将使用正则表达式检索发件人邮件、收件人邮件、日期、事件和邮件主题。我们还将使用\
  \ NER spaCy 流水线提取 PERSON、GPE、EVENT、DATE 和 ORG。代码如下：\n\n```python\n#### 加载 spaCy\
  \ 模型\nnlp = spacy.load(\"en_core_web_sm\")\n# 提取相关细节的函数\ndef extract_email_details(email_text):\n\
  \    details = {}\n    # 提取发件人邮件\n    sender_match = re.search(r\"From: ([\\w\\\
  .-]+@[\\w\\.-]+)\", email_text)\n    details[\"Sender Email\"] = sender_match.group(1)\
  \ if sender_match else None\n    # 提取收件人邮件\n    recipient_match = re.search(r\"\
  To: ([\\w\\.-]+@[\\w\\.-]+)\", email_text)\n    details[\"Recipient Email\"] = recipient_match.group(1)\
  \ if recipient_match else None\n    # 提取主题\n    subject_match = re.search(r\"Subject:\
  \ (.+)\", email_text)\n    details[\"Subject\"] = subject_match.group(1).strip()\
  \ if subject_match else None\n    # 提取日期\n    date_match = re.search(r\"Date: (.+)\"\
  , email_text)\n    details[\"Date\"] = date_match.group(1).strip() if date_match\
  \ else None\n    # 解析文本以额外细节\n    doc = nlp(email_text)\n    # 从文本中提取姓名\n    names\
  \ = [ent.text for ent in doc.ents if ent.label_ == \"PERSON\"]\n    details[\"Names\
  \ in Text\"] = \", \".join(names)\n    # 从文本中提取日期\n    dates = [ent.text for ent\
  \ in doc.ents if ent.label_ == \"DATE\"]\n    details[\"Dates in Text\"] = \", \"\
  .join(dates)\n    # 从文本中提取地缘实体\n    geopolitical_entity = [ent.text for ent in doc.ents\
  \ if ent.label_ == \"GPE\"]\n    details[\"GPEs in Text\"] = \", \".join(geopolitical_entity)\n\
  \    # 从文本中提取组织\n    Organization = [ent.text for ent in doc.ents if ent.label_\
  \ == \"ORG\"]\n    details[\"ORGs in Text\"] = \", \".join(Organization)\n    #\
  \ 从文本中提取事件\n    Events = [ent.text for ent in doc.ents if ent.label_ == \"EVENT\"\
  ]\n    details[\"Events in Text\"] = \", \".join(Events)\n    return details\n#\
  \ 应用提取函数\ndata_extracted = data[\"message\"].apply(extract_email_details)\n# 转换为\
  \ DataFrame\ndata_extracted = pd.DataFrame(data_extracted.tolist())\n```\n\n在上面的函数中，我们使用正则表达式提取了发件人邮件、收件人邮件、邮件日期和主题。接下来，spaCy\
  \ 流水线提取了邮件正文人物、日期、地缘实体、组织和事件。该函数应用于 dataframe 中的 `message` 变量以检索上述记录。\n\n![](img/Figure-7.5.jpg)\n\
  \n**图 7.5**：通过 spaCy 提取的邮件和其他细节\n\n在上面的图中，我们提取了发件人邮件、收件人邮件、邮件主题和邮件日期。我们使用 spaCy\
  \ 从邮件正文中提取了姓名、电子邮件、地点等地缘实体、组织名称和事件。这样，我们可以创建一个自定义的流水线，来逐步使用 spaCy 执行操作。\n\n\n\n\n\
  \n# 数据集：我们将使用来自 Hugging Face 网站的法律合同数据集中的 `train_data`。\n\n数据已加载，包含 26539 行和 1 列。\n\
  \n```python\nlegal_data = pd.read_csv('train_data.csv')\nlegal_data.shape\n```\n\
  \n### 输出：\n```\n(26539, 1)\n```\n\n与之前的练习一样，我们随机抽取了 1000 行样本，以便于处理并节省时间。\n\n```python\n\
  # 抽取数据样本以便分析\nlegal_data = legal_data.sample(n=1000).copy()\n```\n\n接下来，我们将对数据进行预处理。\n\
  \n# 预处理文本\n\n```python\nlegal_data['cleaned_text'] = legal_data['text'].str.replace(r'\\\
  s+', ' ', regex=True).str.strip()\nlegal_data['cleaned_text'].head()\n```\n\n在前面的代码中，我们为预处理执行了以下操作：\n\
  - 删除了特殊字符、多余空格或无关的元数据。\n- 将文本拆分为段落或条款，以便于处理。\n\n接下来，我们将自定义 spaCy 流水线。\n\n### 法律实体的自定义实体识别\
  \ (NER)：我们将识别：\n\n- **当事人 (Parties)**：例如，“甲方”，“XYZ 公司”。\n- **日期 (Dates)**：例如，“2023\
  \ 年 1 月 1 日”。\n- **法律引用 (Legal References)**：例如，“第 3.1 节”，“第 5 条”。\n- **条款的基于规则的匹配**：使用模式提取结构化章节（例如“本协议受……约束”）。\n\
  - **关系的依存句法分析**：提取句法关系，如主语-谓词-宾语模式。\n\n```python\n# 为法律章节添加基于规则的匹配\nmatcher = Matcher(nlp.vocab)\n\
  patterns = [{\"label\": \"SECTION\", \"pattern\": [{\"LOWER\": \"section\"}, {\"\
  IS_DIGIT\": True}]}]\nfor pattern in patterns:\n    matcher.add(pattern[\"label\"\
  ], [pattern[\"pattern\"]])\n\ndef extract_entities(doc):\n    entities = {\"PARTIES\"\
  : [], \"DATES\": [], \"SECTIONS\": [], \"REFERENCES\": []}\n    for ent in doc.ents:\n\
  \        if ent.label_ == \"PERSON\":\n            entities[\"PARTIES\"].append(ent.text)\n\
  \        elif ent.label_ == \"DATE\":\n            entities[\"DATES\"].append(ent.text)\n\
  \        elif ent.label_ in [\"ORG\", \"LAW\"]:\n            entities[\"REFERENCES\"\
  ].append(ent.text)\n    matches = matcher(doc)\n    for match_id, start, end in\
  \ matches:\n        entities[\"SECTIONS\"].append(doc[start:end].text)\n    return\
  \ entities\n```\n\n代码解释如下。\n\n### 法律章节的基于规则的匹配：\nspaCy 中的 `Matcher` 类用于实现基于规则的匹配模式。这里的目标是识别与法律章节对应的文本模式（例如“第\
  \ 23 节”）：\n\n```python\nmatcher = Matcher(nlp.vocab)\n```\n\n`Matcher` 使用 `nlp.vocab`\
  \ 对象初始化，它是当前 spaCy 语言模型的词汇表。这使得匹配模式能够与处理过的 `Doc` 对象中的标记（tokens）无缝衔接。\n\n#### 定义模式：\n\
  ```python\npatterns = [{\"label\": \"SECTION\", \"pattern\": [{\"LOWER\": \"section\"\
  }, {\"IS_DIGIT\": True}]}]\n```\n- `\"label\": \"SECTION\"`：指定该模式的标签。它表示我们正在寻找文本中的章节。\n\
  - `\"pattern\": [{\"LOWER\": \"section\"}, {\"IS_DIGIT\": True}]` ：\n    - `{\"\
  LOWER\": \"section\"}` 不区分大小写地匹配单词“section”。\n    - `{\"IS_DIGIT\": True}` 匹配一个数字标记（例如“23”）。\n\
  该模式共同识别诸如“section 23”之类的短语。\n\n#### 将模式添加到 Matcher：\n```python\nfor pattern in patterns:\n\
  \    matcher.add(pattern[\"label\"], [pattern[\"pattern\"]])\n```\n对于 `patterns`\
  \ 列表中的每个模式，matcher 都配置为给定标签下识别指定的模式。\n\n### 提取实体\n`extract_entities` 函数处理给定的 `Doc`\
  \ 对象以提取各种类型的实体。\n\n```python\ndef extract_entities(doc):\n    entities = {\"PARTIES\"\
  : [], \"DATES\": [], \"SECTIONS\": [], \"REFERENCES\": []}\n```\n\n`entities` 字典：按类别存储提取的实体：\n\
  - `PARTIES`：涉及的个人或实体名称。\n- `DATES`：文档中提到的日期。\n- `SECTIONS`：由匹配识别的法律章节。\n- `REFERENCES`：对法律、组织等的引用。\n\
  \n#### 处理命名实体：\n```python\nfor ent in doc.ents:\n    if ent.label_ == \"PERSON\"\
  :\n        entities[\"PARTIES\"].append(ent.text)\n    elif ent.label_ == \"DATE\"\
  :\n        entities[\"DATES\"].append(ent.text)\n    elif ent.label_ in [\"ORG\"\
  , \"LAW\"]:\n        entities[\"REFERENCES\"].append(ent.text)\n```\n- `doc.ents`：这是由\
  \ spaCy 模型识别的实体列表。\n\n对于每个实体：\n- 如果实体标签（`ent.label_`）是“PERSON”，则将其加入“PARTIES”。\n\
  - 如果实体标签为“DATE”，则将其加入“DATES”。\n- 如果实体标签为 `ORG`（组织）或 `LAW`（法律引用），则将其加入“REFERENCES”。\n\
  \n#### 应用匹配器：\n```python\nmatches = matcher(doc)\n```\n`matcher(doc)`：将预定义的模式应用于文档。返回一个匹配列表，其中包含：\n\
  - `match_id`：匹配的 ID。\n- `start`：匹配范围的起始索引。\n- `end`：匹配范围的结束索引。\n\n#### 提取章节：\n```python\n\
  for match_id, start, end in matches:\n    entities[\"SECTIONS\"].append(doc[start:end].text)\n\
  ```\n对于每个匹配：\n- 从 `start` 到 `end` 的文本范围通过 `doc[start:end].text` 提取。\n- 该法律章节文本被添加到\
  \ `SECTIONS`。\n\n最后，我们使用 `extract_entities` 函数从清理后的文本中提取相关实体。\n\n```python\nlegal_data['entities']\
  \ = legal_data['cleaned_text'].apply(lambda x: extract_entities(nlp(x)))\nlegal_data[['cleaned_text',\
  \ 'entities']]\n```\n\n最后的 dataframe 如下。\n\n![](img/Figure-7.6.jpg)\n\n### 图 7.6：使用\
  \ spaCy 提取的实体\n在图 7.6 中，我们看到了针对 `SECTIONS`、`PARTIES`、`DATES` 和 `REFERENCES` 标签的提取实体。\n\
  \n\n\n\n然而，这只是一个简单的 `spaCy` 流线，没有针对法律文档分析进行任何复杂的自定义。已经有了诸如 `legal-NER` 等基于 `spaCy`\
  \ 构建的包。我们还有一个基于 `spaCy` 和其他 Python 库的文本检索库，专注于法律文档。我们还有一个针对罗马尼亚语法律领域的 `spaCy` 语言模型，该模型使用\
  \ `floret` 4-gram 到 5-gram 嵌入以及法律实体识别进行了训练。\n\n# 信息提取项目中的常见挑战\n\n在使用 `spaCy` 进行信息提取\
  \ (IE) 项目时，会产生各种影响模型准确性、可扩展性和适应性的挑战。以下是对关键挑战的详细讨论：\n\n## 数据质量问题\n\n数据质量显著影响信息提取系统的性能。常见的与数据相关的挑战包括：\n\
  \n* 噪声数据：来自扫描文档或格式不佳来源的文本通常包含 OCR 错误、格式不一致或信息缺失。 \n* 语言歧义：许多术语根据语境可能有多种含义，需要细致的预处理和语言学分析。\n\
  * 数据不完整：文本中缺失实体或引用会导致提取结果不完整或不准确，特别是在没有适当标注的数据集中。\n* 非结构化文本：许多法律或业务文档以自由文本的形式编写，使得在没有额外预处理的情况下很难检测实体。\n\
  * 缺乏标注：为训练自定义模型创建标注数据集是耗时且耗力的工作，对于特定领域的项目尤为如此。\n\n### 缓解策略\n\n* 应用文本清洗技术对数据进行预处理（例如，删除不必要的字符，处理编码问题）。\n\
  * 使用预训练模型，并通过微调使其适应特定领域。\n* 采用主动学习来迭代改进标注的数据集，以获得更可靠的结果。\n\n## 领域特定适配\n\n`spaCy`\
  \ 的开箱即用模型是在通用数据集上训练的，这些可能无法捕获法律、医疗或金融文本等专业领域的细微差别。这为准确识别和提取实体带来了挑战。\n\n* 领域特定语言：技术术语、缩写和领域特定语法可能无法被通用模型识别。\n\
  * 自定义实体：标准的命名实体识别 (NER) 模型可能不包含领域特定实体，如法律条款、合同义务或技术术语。\n* 复杂关系：提取实体之间的层级或嵌套关系通常需要自定义的流线组件或额外的解析。\n\
  \n### 缓解策略\n\n* 在标注的领域特定数据集上使用 `spaCy` 训练自定义 NER 模型。\n* 使用基于规则的匹配器扩展 `spaCy` 流线以匹配特定模式（例如法律章节\
  \ `Section 8` 和 `Section 280`）。\n* 引入外部知识库或本体以增强对上下文的理解。\n\n# 规模优化\n\n在扩展到处理大型数据集或高吞吐量应用时，可能会出现若干挑战：\n\
  \n* 性能瓶颈：实时处理大量文本可能会导致性能下降。\n* 并行处理：`spaCy` 的单线程流可能会变慢。\n* 模型大小和复杂度：较大的模型（如 transformers）计算开销很大。\n\
  * 集成：部署信息提取系统需要无缝集成。\n\n### 缓解策略\n\n* 使用 `spaCy.pipe()` 进行高效批处理。\n* 优化 GPU 等硬件资源。\n\
  \n## 结论\n\n本文概述了在法律文档分析中使用 `spaCy` 的各种挑战和缓解策略，重点关注数据质量、领域特定需求和可扩展性。\n\n\n\n\n\n\
