    \ 100 个属性，很难将所有的交叉点图挤到一个页面上。检查大量属性相关性的方法一种是计算属性对的皮尔逊相关系数，将这些相关性排列成矩阵，其中第 `ij`\
    \ 个元素是第 `ith` 个属性与第 `jth` 个属性之间的相关性，然后用热力图将其绘制出来。\n\n列表 2-10 提供了制作此图的代码。图 2-8\
