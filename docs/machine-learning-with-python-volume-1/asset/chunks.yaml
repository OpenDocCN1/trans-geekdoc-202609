    ```\n\n### 箱线图的替代方案\n\n作为统计摘要的替代方案，列表 2-11 为每个实值数据列生成了箱线图。其中第一个显示图 2-9。在图 2-9\
    \ 中，统计摘要由箱线图表示，箱线图也称为须线图。这些图显示了一个中间有一条红线的小矩形。红线标记了数据列的中位数（或第 50 百位数）。矩形的顶部和底部分别标记了第\
    \ 25 百位数和第 75 百位数。你可以通过打印摘要中的数字与箱线图中的水平来确认这一点。\n\n在箱子的上下，你会看到小的水平标记，即所谓的“须”。它们绘制在箱子上下四分位间距\
    \ 1.4 倍的高度处。四分位间距是第 75 百位数和第 25 百位数之间的差。换句话说，箱子顶部与上须之间的空间是箱子高度的 1.4 倍。须的 1.4 倍间距是可以调整的；请参见箱线图文档。你会注意到在某些情况下须比\
    \ 1.4 倍间距近。对于这些情况，数据值没有延伸到计算出的须的位置。在这些情况下，须放置在最极端的数据点。在其他情况下，数据在计算出的须的位置之外大幅延伸。这些点可以被视为异常值。\n\
    \n### 归一化\n\n列表 2-11 代码的最后部分在绘制箱线之前对所有数据列进行归一化。在这种情况下，归一化意味着对每列进行中心化和比例，使得属性 1\
    \ 的单位与属性 2 的单位具有相同的含义。数据科学中的许多算法和操作都需要这种归一化。例如，K-means 聚类根据数据行之间的向量距离构建聚类。距离是通过从一个点减去另一个点并平方来衡量的。如果单位不同，数值距离也不同。到杂货店的距离以里计算可能是\
    \ 1，如果以英尺计算则是 5280。\n\n列表 2-11 指出的归一化调整了变量，使其具有 0 均值和单位单位的标准差。这是一种非常常见的归一化。归一化的计算使用了由\
    \ `summary()` 函数生成的数字。结果绘制在图 2-11。\n\n### 回归问题的平行坐标图——可视化鲍鱼问题的变量关系\n\n下一步是获取属性之间以及属性与标签之间关系的想法。对于岩石与矿石数据，着色的平行坐标图以图形方式展示了这些关系。这种方法需要一些修改才能适用于鲍鱼问题。岩石与矿石是一个分类问题。该问题的平行坐标图根据真实分类对代表数据行的线进行着色。这有助于可视化预测与预测变量之间的关系。鲍鱼问题是一个回归问题，因此此示例中的着色需要对应于高或低目标值的颜色。为了给实值分配颜色深度，需要将实值压缩到\
    \ `[0.0, 1.0]` 区间内。列表 2-12 使用 Pandas 的 `summary()` 函数生成的 `min` 和 `max` 值来实现这一点。图\
    \ 2-12 显示了结果。\n\n### 列表 2-11：鲍鱼数据的平行坐标图\nabaloneParallelPlot.py\n\n"
