    # 《高维下监督学习的实证评估》

    作者：Rich Caruana, Nikos Karampatziakis 和 Ainur Yessenalina


    在这两篇论文中，作者选择了多种分类问题，并应用了多种不同的算法来构建预测模型。这些模型在未包含在训练中的测试数据上运行，然后根据算法在这些问题上的表现对研究中的算法进行排名。


    第一项研究比较了 11 种不同机器学习（二分类）问题上的 9 种不同基础算法。研究中使用的问题来自广泛的领域，包括人口统计数据、文本处理、模式识别、物理学和生物学。


    ## 分类问题与定义


    表 1-1 列出了研究中各个数据集，并使用了研究作者给出的名称。表格显示了每个数据集用于预测结果的可用属性数量，并显示了正样本占示例的百分比。


    分类问题中的 `positive example`（正样本）术语是指结果为正的实验（输入数据集中的某行数据）。例如，如果设计分类器的目的是判断雷达回波信号是否表明存在飞机，那么
    `positive example` 就是在雷达视野内实际上有飞机的回波。`positive` 一词源于这类两种结果代表“存在”或“不存在”的示例。其他示例还包括医学检测中疾病的存在否或纳税申报中是否存在作弊行为。


    并非所有分类问题都涉及存在或不存在。例如，通过机器读取文本或机器分析手写样本来确定作者的性别有两个类别——男性和女性——但从某种意义上来说，一种并不是另一种类的缺失。在这些情况下，分配
    `positive`（正）和 `negative`（负）标签具有某种任意性。`positive` 和 `negative` 的分配可以是任意的，但一旦选定，必须保持一致。


    ## 不平衡数据与属性


    第一项研究中的某些问题一类别的示例远多于另一类。这些问题被称为 `unbalanced`（不平衡）。例如，两个数据集 `Letter.p1` 和 `Letter.p2`
    在正确分类各种字体中的打印大写字母方面构成了密切相关的问题。


    `Letter.p1` 的任务是 ![](img/Image00004.jpg) 在标准字母混合中正确分类字母 O。`Letter.p2` 的任务是正确分类
    `A–M` 与 `N–Z`。表 1-1 中显示的正样本百分比反映了这种差异。


    表 1-1 还显示了每个数据集中的“属性”数量。`Attributes`（属性）是你可用于预测的变量。例如，为了预测飞机是否准时到达目的地，你可能会整合等属性，如航空公司名称、飞机型号和年份、目的地机场的降水水平、沿飞行路径的风速和方向等。


    拥有许多可以作为预测依据的属性既是祝福也是诅咒。与被预测结果直接相关的属性是祝福；与结果无关的属性则是诅咒。区分幸运和倒霉的属性需要数据。第 3 节“预测模型构建：平衡性能、复杂性与大数据”将更详细地讨论这一点。


    ### 表 1-1：机器学习比较研究中的问题概览


    | 数据集名称 | 属性数量 | 示例百分比 | 正样本属性 |

    | :--- | :--- | :--- | :--- |

    | Adult | 14 | 25 | 200 |

    | Bact | 11 | 69 | 16 |

    | Cod | 15 | 50 | 16 |

    | Calhous Cov\_Type | 9 | 52 | 63 |

    | HS | 54 | 36 | 124 |

    | Letter.p1 | 20 | 24 | 59 |

    | Letter.p2 | 16 | 3 | 50 |

    | Medis | 53 | | |

    | Mg | | | |

    | Slac | | | |


    ## 算法性能比较


    表 1-2 显示了本书涵盖的算法相对于研究中使用的其他算法的表现。表 1-2 显示了在表 1-1 中列出的每个问题中，哪些算法获得了前五名。


    本书涵盖的算法已列出（`boosted decision trees` 提升决策树、`Random Forests` 随机森林、`bagged decision
    trees` 装袋决策树和 `logistic regression` 逻辑回归）。这前三种都是集成方法。在研究进行时，正则化回归尚未完全开发，也没有被评估。`Logistic
    regression` 是一个近亲，用于衡量回归方法的成功率。


    研究中使用的 9 种算法每种都应用了 3 种不同的数据归约技术，共 27 种组合。前五名大约代表了性能得分的前 20%。`Covt` 表头旁边的行表示 `boosted
    decision trees` 算法在性能上排名第一和第二，`Random Forests` 算法排名第四和第五，而 `bagged decision trees`
    算法是第三 ![](img/Image00004.jpg)名。


    在本书未涵盖的算法进入前五的情况下，`Other`（其他）列中会出现条目。那里出现的算法有 `k nearest neighbors` (`KNNs` K
    近邻）、`artificial neural nets` (`ANNs` 人工神经网络）和 `support vector machines` (`SVMs`
    支持向量机）。


