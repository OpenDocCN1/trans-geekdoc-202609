    the points. Maybe they are too expensive to generate, like the genetic data mentioned
    earlier. There are enough humans available to isolate the gene that is the culprit;
    the problem is that you do not have gene sequences for many of them because of
    cost. To simulate this in the simple example, imagine that instead of six points
    you''re given only two of the six points. How would that change the nature of
    the line fit to those points? It would depend on which two points you happened
    to get. To see how much effect that would have, pick any two points from Figure
    1-1 and imagine a line through them. Figure 1-2 shows some of the possible lines
    through pairs of points from Figure 1-1. Notice how much the lines vary depending
    on the choice of points. ![](Image00007.jpg)The problem with having only two points
    to fit a line is that there is not enough data for the number of degrees of freedom.
    A line has two degrees of freedom. Having two degrees of freedom means that there
    are two parameters that determine a line. You can imagine grabbing hold of a line
    in the plane and sliding it up and down in the plane or twisting it to change
    its slope. So, vertical position and independent uniquely slope are independent.
    They can be changed separately, and together they completely specify a line. The
    degrees of freedom of a line can be expressed in several equivalent ways (where
    it intercepts the y‐axis and its slope, two points that are on the line, and so
    on). All of these representations of a line require two parameters to specify.
    When the number of degrees of freedom is equal to the number of points, the predictions
    are not very good. The lines hit the points used to draw them, but there is a
    lot of variation among lines drawn with different pairs of points. You cannot
    place much faith in a prediction that has as many degrees of freedom as the number
    of points in your data set. The plot in Figure 1-1 had six points and fit a line
    (two degrees of freedom) through them. That is six points and two degrees of freedom.
    The thought problem of determining the genes causing a heritable condition illustrated
    that having more genes to choose from makes it necessary to have more data in
    order to isolate a cause from among the 20,000 or so possible human genes. The
    20,000 different genes represent 20,000 degrees of freedom. Data from even 20,000
    different persons will not suffice to get a reliable answer, and in many cases,
    all that can be afforded within the scope of a reasonable study is a sample from
    500 or so persons. That is where penalized linear regression may be the best algorithm
    choice. Penalized linear regression provides a way to systematically reduce degrees
    of freedom to match the amount of data available and the complexity of the underlying
    phenomena. These methods have become very popular for problems with very many
    degrees of freedom. They are a favorite for genetic problems where the number
    of degrees of freedom (that is, the number of genes) can be several tens of thousands
    and for problems like text classification where the number of degrees of freedom
    ![](Image00004.jpg)can be more than a million. Section 4, “Penalized Linear Regression,”
    gives more detail on how these methods work and examples of the process for implementing
    machine learning using Python packages. What Are Ensemble Methods? The other family
    of algorithms covered in this book is ensemble methods. The basic idea with ensemble
    methods is to build a horde of different predictive models and then combine their
    outputs—by averaging the outputs or taking the majority answer (voting). The individual
    models are called base learners . Some results from computational learning theory
    show that if the base learners are just slightly better than random guessing,
    the performance of the ensemble can be very good if there is a sufficient number
    of independent models. One of the problems spurring the development of ensemble
    methods has been the observation that some particular machine learning algorithms
    exhibit instability. For example, the addition of fresh data to the data set might
    result in a radical change in the resulting model or its performance. Binary decision
    trees and traditional neural nets exhibit this sort of instability. This instability
    causes high variance in the performance of models, and averaging many models can
    be viewed as a way to reduce the variance. The trick is how to generate large
    numbers of independent models, particularly if they are all using the same base
    learner. Section 6, “Ensemble Methods,” will get into the details of how this
    is done. The techniques are ingenious, and it is relatively easy to understand
    their basic principles of operation. Here is a preview of what''s in store. The
    ensemble methods that enjoy the widest availability and usage incorporate binary
    decision trees as their base learners. Binary decision trees are often portrayed
    as shown in Figure 1-3. The tree in Figure 1-3 takes a real number, called x ,
    as input at the top, and then uses a series of binary (two‐valued) decisions to
    decide what value should be output in response to x . The first decision is whether
    x is less than 5. If the answer to that question is “no,” the binary decision
    tree outputs the value 4 indicated in the circle below the No leg of the upper
    decision box. Every possible value for x leads to some output y from the tree.
    Figure 1-4 plots the output (y ) as a function of the input to the tree (x ).
