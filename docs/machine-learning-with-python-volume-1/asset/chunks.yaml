    ones in Figure 1-1, but that ![](Image00004.jpg)you do not get to see all the
    points. Maybe they are too expensive to generate, like the genetic data mentioned
    earlier. There are enough humans available to isolate the gene that is the culprit;
    the problem is that you do not have gene sequences for many of them because of
    cost. To simulate this in the simple example, imagine that instead of six points
    you''re given only two of the six points. How would that change the nature of
    the line fit to those points? It would depend on which two points you happened
    to get.


    To see how much effect that would have, pick any two points from Figure 1-1 and
    imagine a line through them. Figure 1-2 shows some of the possible lines through
    pairs of points from Figure 1-1. Notice how much the lines vary depending on the
    choice of points. ![](Image00007.jpg)


    The problem with having only two points to fit a line is that there is not enough
    data for the number of degrees of freedom. A line has two degrees of freedom.
    Having two degrees of freedom means that there are two parameters that determine
    a line. You can imagine grabbing hold of a line in the plane and sliding it up
    and down in the plane or twisting it to change its slope. So, vertical position
    and independent uniquely slope are independent. They can be changed separately,
    and together they completely specify a line. The degrees of freedom of a line
    can be expressed in several equivalent ways (where it intercepts the y‐axis and
    its slope, two points that are on the line, and so on). All of these representations
    of a line require two parameters to specify.


    When the number of degrees of freedom is equal to the number of points, the predictions
    are not very good. The lines hit the points used to draw them, but there is a
    lot of variation among lines drawn with different pairs of points. You cannot
    place much faith in a prediction that has as many degrees of freedom as the number
    of points in your data set. The plot in Figure 1-1 had six points and fit a line
    (two degrees of freedom) through them. That is six points and two degrees of freedom.


    The thought problem of determining the genes causing a heritable condition illustrated
    that having more genes to choose from makes it necessary to have more data in
    order to isolate a cause from among the 20,000 or so possible human genes. The
    20,000 different genes represent 20,000 degrees of freedom. Data from even 20,000
    different persons will not suffice to get a reliable answer, and in many cases,
    all that can be afforded within the scope of a reasonable study is a sample from
    500 or so persons. That is where penalized linear regression may be the best algorithm
    choice. Penalized linear regression provides a way to systematically reduce degrees
    of freedom to match the amount of data available and the complexity of the underlying
    phenomena. These methods have become very popular for problems with very many
    degrees of freedom. They are a favorite for genetic problems where the number
    of degrees of freedom (that is, the number of genes) can be several tens of thousands
    and for problems like text classification where the number of degrees of freedom
    ![](Image00004.jpg)can be more than a million. Section 4, “Penalized Linear Regression,”
    gives more detail on how these methods work and examples of the process for implementing
    machine learning using Python packages.


    ## What Are Ensemble Methods?


    The other family of algorithms covered in this book is ensemble methods. The basic
    idea with ensemble methods is to build a horde of different predictive models
    and then combine their outputs—by averaging the outputs or taking the majority
    answer (voting). The individual models are called base learners. Some results
    from computational learning show that if base learners are just slightly better
    than random guessing, the performance of the ensemble can be very good if there
    is a sufficient number of independent models. One of the problems spurring development
    of ensemble methods has been the observation that some particular machine learning
    algorithms exhibit instability. For example, the addition of fresh data to the
    data set might result in a radical change in the resulting model or its performance.
    decision trees and traditional neural nets exhibit this sort of instability. This
    instability causes high variance in the performance of models, and averaging many
    models can be viewed as a way to reduce variance. The trick is how to generate
    large numbers of independent models, particularly if they all using the same base
    learner. Section 6, “Ensemble Methods,” will get into the details of how this
    is done. The techniques are ingenious, and relatively easy to understand their
    basic principles of operation. Here is a preview of what''s in. The ensemble methods
    that enjoy the widest availability and usage incorporate decision trees as their
    base learners. Binary decision trees are often portrayed as shown in Figure 1-3.


    The tree in Figure 1-3 takes a real number, called `x`, as input at the top, and
    then uses a series of binary (two-valued) decisions to decide what value should
    be output in response to `x`. The first decision is whether `x` is less than five.
    If the answer to that question is “no,” the decision tree outputs the value indicated
    below the upper decision. Every possible value for `x` leads to some output `y`
    from the tree. Figure 1-4 plots the output (`y`) as a function of the input to
    the tree (`x`). ![](Image00008.jpg ![](Image00004.jpg)!Image00009.jpg)This description
    raises the question of where the output values (in the circles at the bottom of
    the tree) come from. These values come from training the tree on the input data.
    The algorithm for doing that training is not difficult to understand and is covered
    in Section 6. The important thing to note at this point is that the values in
    the trained tree are fixed given the data. The process for generating the tree
    is deterministic. One way to get differing models is to take random samples of
    the training data and train on these subsets. That technique is called `Bagging`
    (short for bootstrap aggregating). It gives a way to generate a large number of
    slightly different decision trees which are then averaged (or voted for a classifier)
    to yield a final result. Section 6 describes in more detail this technique and
    other powerful ones.


    ## How to Decide Which Algorithm to Use


    Table 1-4 gives a sketch comparison of these two families of algorithms. Penalized
    linear methods have the advantage that they train very quickly. Training times
    on large data sets can extend to hours, days, or even weeks. Training usually
    needs to be done several times before a deployable solution is arrived at. Long
    training times can stall development and deployment on large problems. The rapid
    training time for penalized linear methods makes them useful for the obvious reason
    that shorter is better. Depending on the problem, these methods may suffer performance
    disadvantages relative to ensemble methods. Section 3 gives more insight into
    the types of problems where penalized regression might be a better choice and
    those where ensemble methods might be a better choice. Penalized linear methods
    can sometimes be a useful first step in your development process even in the circumstance
    where they yield inferior performance to ensemble methods. Early in development,
    a number of training iterations will be necessary for purposes of feature selection
    and feature engineering and for solidifying the mathematical problem statement.


    Deciding what you are going to use as input to your predictive model can take
    some time and thought. Sometimes that is obvious, but usually it requires some
    iteration. Throwing in everything you can find is not usually a good solution.
    Trial and error is typically required to determine the best inputs for a model.
    For example, if you''re trying to predict whether a visitor to your website will
    click a link for an ad, you might try using demographic data for the visitor.
    Maybe that does not give you the accuracy that you need, so you try incorporating
    data regarding the visitor''s past behavior on the site—what ad the visitor clicked
    during past site visits or what products the visitor has bought. ![](Image00004.jpg)the
    site the visitor was on before coming to your site would help. These questions
    lead to a series of experiments where you incorporate the new data and see whether
    it hurts or helps. This iteration is generally time‐consuming both for the data
    manipulations and for training your predictive model.


    Penalized linear regression will generally be faster than an ensemble method,
    and the time difference can be a material factor in the development process. For
    example, if the training set is on the order of a gigabyte, training times may
    be on the order of 30 minutes for penalized linear regression and 5 or 6 hours
    for an ensemble method. If the feature engineering process requires 10 iterations
    to select the best feature set, the computation time alone comes to the difference
    between taking a day or taking a week to accomplish feature engineering. A useful
    process, therefore, is to train a penalized linear model in the early stages of
    development, feature engineering, and so on. That gives the data scientist a feel
    for which variables are going to be useful and important as well as a baseline
    performance for comparison with other algorithms later in development.


    Besides enjoying a training time advantage, penalized linear methods generate
    predictions much faster than ensemble methods. Generating a prediction involves
    using the trained model. The trained model for penalized linear regression is
    simply a list of real numbers—one for each feature being used to make the predictions.
    The number of floating‐point operations involved is the number of variables being
    used to make predictions. For highly time‐sensitive predictions such as high‐speed
    trading or Internet ad insertions, computation time makes the difference between
    making money and losing money ![](Image00010.jpg)For some problems, linear methods
    may give equivalent or even better performance than ensemble methods. Some problems
    do not require complicated models. Section 3 goes into some detail about the nature
    of problem complexity and how the data scientist''s task is to balance problem
    complexity, predictive model complexity, and data set size to achieve the best
    deployable model. The basic idea is that on problems that are not complex and
    problems for which sufficient data are not available, linear methods may achieve
    better overall performance than more complicated ensemble methods. Genetic data
    provide a good illustration of this type of problem.

