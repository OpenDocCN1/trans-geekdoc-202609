    # “An Empirical Evaluation of Supervised Learning in High Dimensions”

    by Rich Caruana, Nikos Karampatziakis, and Ainur Yessenalina


    In those two papers, the authors chose a variety of classification problems and
    applied a variety of different algorithms to build predictive models. The models
    were run on test data that were not included in training the models, and then
    the algorithms included in the studies were ranked on the basis of their performance
    on the problems.


    The first study compared 9 different basic algorithms on 11 different machine
    learning (binary classification) problems. The problems used in the study came
    from a wide variety of areas, including demographic data, text processing, pattern
    recognition, physics, and biology.


    ## Classification Problems and Definitions


    Table 1-1 lists the data sets used in the study using the same names given by
    the study authors. The table shows how many attributes were available for predicting
    outcomes for each of the data sets, and it shows what percentage of the examples
    were positive.


    The term `positive example` in a classification problem means an experiment (a
    line of data from the input data set) in which the outcome is positive. For example,
    if the classifier is being designed to determine whether a radar return signal
    indicates the presence of an airplane, then the `positive example` would be those
    returns where there was actually an airplane in the radar''s field of view. The
    term `positive` comes from this sort of example where the two outcomes represent
    presence or absence. Other examples include presence or absence of disease in
    a medical test or presence or absence of cheating on a tax return.


    Not all classification problems deal with presence or absence. For example, determining
    the gender of an author by machine-reading their text or machine-analyzing a handwriting
    sample has two classes—male and female—but there''s no sense in which one is the
    absence of the other. In these cases, there''s some arbitrariness in the assignment
    of the designations `positive` and `negative`. The assignments of `positive` and
    `negative` can be arbitrary, but once chosen must be used consistently.


    ## Unbalanced Data and Attributes


    Some of the problems in the first study had many more examples of one class than
    the other. These are called `unbalanced`. For example, the two data sets `Letter.p1`
    and `Letter.p2` pose closely related problems in correctly classifying typed uppercase
    letters in a wide variety of fonts.


    The task with `Letter.p1` is to ![](Image00004.jpg)correctly classify the letter
    O in a standard mix of letters. The task with `Letter.p2` is to correctly classify
    `A–M` versus `N–Z`. The percentage of positives shown in Table 1-1 reflects this
    difference.


    Table 1-1 also shows the number of “attributes” in each of the data sets. `Attributes`
    are the variables you have available to base a prediction on. For example, to
    predict whether an airplane will arrive at its destination on time or not, you
    might incorporate attributes such as the name of the airline company, the make
    and year of the airplane, the level of precipitation at the destination airport,
    the wind speed and direction along the flight path, and so on.


    Having a lot of attributes upon which to base a prediction can be a blessing and
    a curse. Attributes that relate directly to the outcomes being predicted are a
    blessing. Attributes that are unrelated to the outcomes are a curse. Telling the
    difference between blessed and cursed attributes requires data. Section 3, “Predictive
    Model Building: Balancing Performance, Complexity, and Big Data,” goes into that
    in more detail.


    ### Table 1-1: Sketch of Problems in Machine Learning Comparison Study


    | Data Set Name | Number of Attributes | % of Examples | Attributes That Are Positive
    |

    | :--- | :--- | :--- | :--- |

    | Adult | 14 | 25 | 200 |

    | Bact | 11 | 69 | 16 |

    | Cod | 15 | 50 | 16 |

    | Calhous Cov\_Type | 9 | 52 | 63 |

    | HS | 54 | 36 | 124 |

    | Letter.p1 | 20 | 24 | 59 |

    | Letter.p2 | 16 | 3 | 50 |

    | Medis | 53 | | |

    | Mg | | | |

    | Slac | | | |


    ## Algorithm Performance Comparison


    Table 1-2 shows how the algorithms covered in this book fared relative to the
    other algorithms used in the study. Table 1-2 shows which algorithms showed the
    top five performance scores for each of the problems listed in Table 1-1.


    Algorithms covered in this book are spelled out (`boosted decision trees`, `Random
    Forests`, `bagged decision trees`, and `logistic regression`). The first three
    of these are ensemble methods. Penalized regression was not fully developed when
    the study was done and wasn''t evaluated. `Logistic regression` is a close relative
    and is used to gauge the success of regression methods.


    Each of the 9 algorithms used in the study had 3 different data reduction techniques
    applied, for a total of 27 combinations. The top five positions represent roughly
    the top 20 percent of performance scores. The row next to the heading `Covt` indicates
    that the `boosted decision trees` algorithm was the first and second best relative
    to performance, `Random Forests` algorithm was the fourth and fifth best, and
    `bagged decision trees` algorithm was the third ![](Image00004.jpg)best.


    In the cases where algorithms not covered here were in the top five, an entry
    appears in the `Other` column. The algorithms that show up there are `k nearest
    neighbors` (`KNNs`), `artificial neural nets` (`ANNs`), and `support vector machines`
    (`SVMs`).


    ### Table 1-2: How the Algorithms Covered in This Book Compare on Different Problems


    | Algorithm | Boosted Decision | Random Forests | Bagged Decision | Logistic Regression
    | Other |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | Covt | 1,2 | 4,5 | 3 | | |

    | Adult | 1,4 | 2 | 3,5 | | |

    | LTR.P1 | 1 | | | | SVM,KNN |

    | LTR.P2 | 1,2 | | 4,5 | | SVM |

    | MEDIS | 1,3 | | 5 | | ANN |

    | SLAC | 1,2,3 | 4,5 | | | |

