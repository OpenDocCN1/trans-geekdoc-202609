    What do you do with this information? Outliers may cause trouble either for model
    building or prediction. After you’ve trained a model on this data set, you can
    look at the errors your model makes and see whether the errors are correlated
    with these outliers. If they are, you can then take steps to correct them. For
    example, you can replicate the poor‐ performing examples to force them to be more
    heavily represented. You can segregate them out and train on them as a separate
    class. You can also edit them out of the data if they represent an abnormality
    that won’t be present in the data your model will see when deployed. A reasonable
    process for this might be to generate quartile boundaries during the exploration
    phase and note potential outliers to get a feel for how much of a problem you
    might (or might not) have with it. Then when you’re evaluating performance data,
    use quantile‐quantile (Q‐Q) plots to determine which points to call outliers for
    use in your error analysis.


    ## Statistical Characterization of Categorical Attributes


    The process just described applies to numeric attributes. But what about categorical
    attributes? You want to check to see how many categories they have and how many
    examples there are from each category. You want to learn these things for a couple
    of reasons. The gender attribute has two possible values (Male and Female), but
    if the attribute had been the state of the United States, there would have been
    50 possible categories. As the number of attributes grows, the complexity of dealing
    with them mounts. Most binary tree algorithms, which are the basis for ensemble
    methods, have a cutoff on how many categories they can handle. The popular `Random
    Forests` package written by Breiman and Cutler (the inventors of the algorithm)
    has a cutoff of 32 categories. If an attribute has more than 32 categories, you’ll
    need to aggregate them. You’ll see later that training involves taking a random
    subset of the data and training a series of models on it. Suppose, for instance,
    that the category is the state of the United States and that Idaho has only two
    examples. A random draw of training examples might not get any from Idaho. You
    need to see those kinds of problems before they occur so that you can address
    them. In the case of the two Idaho examples, you might merge them with Montana
    or Wyoming, you might duplicate them, or you might manage the random draw so that
    you ensure getting Idaho examples (a procedure called stratified sampling ).


    ## How to Use Python Pandas to Summarize the Rocks Versus Mines Data Set


    The Python package `Pandas` can help automate the process of data inspection and
    handling. It proves particularly useful for the early stages of data inspection
    and preprocessing. The `Pandas` package makes it possible to read data into a
    specialized data structure called a `data frame`. The `data frame` is modeled
    after the `CRAN‐R` data structure of the same name.![](Image00004.jpg)


    NOTE: The `Pandas` package can be difficult to install because it has a number
    of dependencies that need to be correctly versioned and each of those has to be
    correctly matched to one another (and so on). An easy way around this hurdle is
    to use the `Anaconda` Python distribution available for free download from Continuum
    Analytics ( http://continuum.io ). The installation procedures are easy to follow
    and result in compatible installations of a wide variety of packages for data
    analysis and machine learning. You can think of a `data frame` as a table or matrix‐like
    structure as in Table 2-1. The `data frame` is oriented with a row representing
    a single case (experiment, example, measurement) and columns representing particular
    attributes. The structure is matrix‐like, but not a matrix because the elements
    in various columns may be of different types. Formally, a matrix is defined over
    a field (like the real numbers, binary numbers, complex numbers), and all the
    entries in a matrix are elements from that field. For statistical problems, the
    matrix is too confining because statistical samples typically have a mix of different
    types. The simple example in Table 2-1 has real values in the `Attribute 1` column,
    categorical variables in the `Attribute 2` column, and integer variables in the
    `Attribute 3` column. Within a column, the entries are all the same type, but
    they differ from one column to the next. The `data frame` structure enables access
    to individual elements through an index roughly similar to addressing an entry
    in a `Python Numpy array` or a list of lists. Similarly, index slicing can be
    used to address an entire row or column from the array. In addition, the `Pandas`
    `data frame` enables addressing rows and columns by means of their names. This
    turns out to be very handy, particularly for a small to medium number of columns.
    (A search on “Pandas introduction” will give you a number of links that can guide
    you through the basics of using Pandas.)


    Listing 2-5 show how simple it is to read in the rocks versus mines CSV file from
    the UC Irvine Data Repository website. The output shown as part of the listing
