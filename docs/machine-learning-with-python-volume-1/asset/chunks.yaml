    \ from the rocks versus mines data set. The rocks versus mines attributes are\
    \ samples from sonar returns. The sonar signal is called a chirped waveform because\
    \ it’s a pulse that starts at low frequency and rises higher over the duration\
    \ of the pulse. The attributes in the rocks versus mines data set are time samples\
    \ of the sound waves that bounce off the rock or mine. These returned acoustic\
    \ signals bear the same relationship between time and frequency as the outgoing\
    \ transmission. The 60 attributes in the rocks versus mines data are samples of\
    \ the return taken at 60 different times (and therefore 60 different frequencies).\
    \ You’d expect that adjacent attributes would be more correlated than attributes\
    \ separated in time from one another because there’s not much difference in frequency\
    \ between adjacent time samples. This intuition is borne out in Figures 2-4 and\
    \ 2-5. The points in the scatter plot in Figure 2-4 are more closely grouped around\
    \ a straight line than those in Figure 2-5. If you want to develop your intuition\
    \ about the relation between numeric correlation and the shape of the scatter\
    \ plot, just search “correlation” and have a look at the Wikipedia page that comes\
    \ up. That shows some scatter plots and the associated numeric correlation. Basically,\
    \ if the points in the scatter plot lie along a thin straight line, the two variables\
    \ are highly correlated; if they form a ball of points, they’re uncorrelated.\
    \ You can apply the same principle to plotting the correlation between each of\
    \ the attributes and the target. For a problem where the targets are real numbers\
