    # Chapter


    This book focuses on the machine learning process and so covers just a few of
    the most effective and widely used algorithms. It does not provide a survey of
    machine learning techniques. Too many of the algorithms that might be included
    in a survey are not actively used by practitioners. This book deals with one class
    of machine learning problems, generally referred to as function approximation.
    Function approximation is a subset of problems that are called supervised learning
    problems. `Linear regression` and its classifier cousin, `logistic regression`,
    provide familiar examples of algorithms for function approximation problems. Function
    approximation problems include an enormous breadth of practical classification
    and regression problems in all sorts of arenas, including text classification,
    search responses, ad placements, spam filtering, predicting customer behavior,
    diagnostics, and so forth. The list is almost endless.


    Broadly speaking, this book covers two classes of algorithms for solving function
    approximation problems: penalized linear regression methods and ensemble methods.
    This Section introduces you to both of these algorithms, outlines some of their
    characteristics, and reviews the results of comparative studies of algorithm performance
    in order to demonstrate their consistent high performance. This Section then discusses
    the process of building predictive models. It describes the kinds of problems
    that you''ll be able to address with the tools covered here and the flexibilities
    that you have in how you set up your problem and define the features that you''ll
    use for making predictions. It describes process steps involved in building a
    predictive model and ![](Image00004.jpg) qualifying it for deployment.


    ## Why Are These Two Algorithms So Useful?


    Several factors make the penalized linear regression and ensemble methods a useful
    collection. Stated simply, they will provide optimum or near-optimum performance
    on the vast majority of predictive analytics (function approximation) problems
    encountered in practice, including big data sets, little data sets, wide data
    sets, tall skinny data sets, complicated problems, and simple problems. Evidence
    for this assertion can be found in two papers by Rich Caruana and his colleagues:

    - “An Empirical Comparison of Supervised Learning Algorithms,” by Rich Caruana
    and Alexandru Niculescu-Mizil

