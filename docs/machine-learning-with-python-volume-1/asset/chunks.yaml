    to a binary classification problem by the simple transformation of the labels.
    These are tradeoffs that you may might to make as part of your attack on a problem.
    For example, classification targets might better support a decision between two
    courses of action. The classification problem might also be simpler than the regression
    problem. Consider, for instance, the difference in complexity between a topographic
    map with a single contour line (say the 100‐foot contour line) and a topographic
    map with contour lines every 10 feet. The single contour divides the map into
    the areas that are higher than 100 feet and those that are lower and contains
    considerably less information than the more detailed contour map. A classifier
    is trying to compute a single dividing contour without regard for behavior distant
    from the decision boundary, whereas regression is trying to draw the whole map.
    Things to Notice about Your New Data Set You’ll want to ascertain a number of
