    ![](img/Image00013.jpg)!(Image00014.jpg)!(Image00015.jpg)一个新的数据集（问题）就像一份包装完好的礼物。它充满了希望，并让你对一旦解决了它后可能创造的奇迹充满期待。但在打开它之前，它仍然是一个谜。本节将关于打开你的新数据集，以便让你看到里面的内容，了解你将能用这些数据做什么，并开始思考如何使用它们来构建模型。本节有两个目的：其一是让你熟悉某些数据集，这些数据集稍后将作为不同类型问题的示例，并使用你将在第
    4 节“惩罚线性回归”和第 6 节“集成方法”中学习的算法来解决。另一个目的是演示 Python 中一些可用于数据探索的工具。本节使用一个简单的示例来回顾机器学习数据集的一些基本问题结构、术语和特征。本节介绍的语言将贯穿全书其余部分。在建立了一些通用语言后，本节将逐一介绍几种不同类型的函数近似问题。这些问题说明了机器学习问题的常见变体，以便你在看到它们时知道如何识别这些变体，并知道如何处理它们（且会有相应的代码示例）。


    ## 新问题的剖析

    ![](img/Image00004.jpg)

    本书涵盖的算法从一个填满 1 的矩阵（或表格）开始，它建立了一些术语，并在二维表格中表示了一个小型机器学习数据集。该表格将为你提供一个关于数据集的心理概念，使得对“对应属性的列”或“对应单个示例的行”的引用变得熟悉。在这个示例中，预测分析问题是预测个人在未来一年在线购买书籍预计将花费多少钱。数据按行和列排列。每行代表一个单独案例（也称为
    `instance`、`example` 或 `observation`）。表 2-1 中的列被赋予了特定的名称，用以指示它们在机器学习问题中将扮演的角色。被标记为
    `attributes`（属性）的列将用于预测在书上花费的金额。在被标记为 `labels`（标签）的列中，你将看到每个客户去年在书上花费了多少钱。


    **注意**：机器学习数据集最常见的排列是列对应单个属性，行对应单个观测值，但并非总是如此。例如，某些文本挖掘文献以相反的方式排列矩阵——列对应观测值，行对应属性。在表
    2-1 中，每一行代表一个单独的客户，行中的数据都属于该个人。第一列被称为 `UserID`，包含一个对于每行（案例）都是唯一的标识符。你的问题中可能存在唯一标识符，也可能不存在。例如，网站通常会为访问者标记一个
    `user ID`，该 ID 在其访问期间与之关联。如果用户没有在网站注册，则同一个用户每次访问都会获得一个不同的 `ID`。`ID` 通常分配给每个观测值，而该观测值将是你要构建的预测的主体。第
    2、3 和 4 列被称为 `Attributes`，而不是赋予像 `Height` 或 `Gender` 这样具体的名称。其目的是为了突出它们在预测过程中的作用。`Attributes`
    是关于该案例的可用 ![](img/Image00004.jpg)数据，将用于做出预测。`Labels`是你想要预测的内容。在这个示例中，`UserID`
    是一个数字，`Attribute 1` 是身高，`Attribute 2` 是性别，而 `Attribute 3` 是该人去年读了多少书。`labels`
    下方的列包含了该个人去年在线购买书籍时花费了多少钱。


    这些不同类别的数据将扮演什么角色？机器学习算法对 `user ID`、`attributes` 和 `labels` 有什么用？简短的回答是：你忽略 `user
    ID`。你使用 `attributes` 来预测 `labels`。`unique ID` 用于记录目的，并允许你引用特定案例可用的其他数据。通常，`unique
    ID` 不直接用于机器学习算法。`Attributes` 是你选择用于预测的事物。`Labels` 是机器学习算法将用于构建预测模型的观测结果。`User
    ID` 通常不用于预测，因为它太具有特殊性。它仅属于某一个示例。机器学习的诀窍在于构建一个可以泛化到新案例的模型（而不仅仅是记忆过去的案例）。为了实现这一点，必须推导出算法，使其被迫关注多于一行数据。排除
    `user ID` 的一个可能例外是：`user ID` 是数值并且是按照用户注册的顺序分配的。基本上，在这种情况下它指示了注册日期，并且是有用的，因为 ID
    接近的用户是在相似的时间段注册的，可以据此将他们视为一组。构建预测模型的过程被称为 `training`（训练）。过程如何进行取决于算法，稍后的章节将涵盖细节，但它通常是迭代的。算法假设
    `attributes` 和 `labels` 之间存在预测关系，观察它犯的错误并进行一些纠正，然后迭代该过程，直到获得良好的模型。许多技术细节将在稍后解决，但这就是基本思想
    ![](img/Image00004.jpg)!(Image00016.jpg)


    ## 不同类型的属性和标签驱动建模选择

    表 2-1 显示的属性分两种类型：`numeric variables`（数值变量）和 `categorical (or factor) variables`（分类变量）。`Attribute
    1`身高）是一个 `numeric variable`，是最常见的属性类型。`Attribute 2` 是性别，由条目 `Male` 表示。这种属性是 `categorical
    or factor variable`。分类变量的特性是值之间没有顺序关系。分类变量可以是二值的（如 `Male`），也可以是多值的。许多接受数值属性的机器学习算法也是如此的；它们无法处理
    `categorical variables`。惩罚回归算法只处理数值型。变量的性质将决定你的算法选择和开发预测模型的方向，因此当你面对新问题时，这是你需要注意的点之一。表
    2-1 中的标签是数值型的：去年的花费金额。但在其他问题中，标签也可能是分类的。例如，如果表 2-1 的任务是预测哪些个人明年将花费超过 200 元，问题就会改变，方法也会随之改变。预测哪些客户将花费超过
    200 元的新问题将新标签。新标签将取两个值之一。表 2-2 显示了 2-1 中的标签与基于命题 `Spending > $200` 的新标签之间的关系。2-2
    中的新标签取两个值之一——`True` 或 `False`![](00004.jpg


    当标签是数值时，问题被称为 `regression`。当标签是分类时，问题被称为 `classification`。如果分类目标只取两个值，问题被称为 `binary
    classification`。如果它超过两个值，问题被称为 `multiclass classification`。在许多情况下，问题类型的选择取决于设计者。你刚刚看到，通过标签的简单转换，这个示例问题可以从
    `regression` 转换为 `binary classification`。这些是在你处理问题时可能会做的权衡。例如，分类目标可能更好地支持两种行动之间的决策。分类问题可能比回归问题更简单。例如，考虑具有单条等高线（例如
    100 英尺等高线）的地图与每 10 英尺一条等高线的地图之间的复杂度差异。单条等高线将地图分为高于 100 英尺和低于区域，包含的信息比详细的等高线地图少得多。分类器试图计算一条划分等高线，而不考虑决策边界之外的行为，而回归则试图绘制整幅地图。


    ## 关于你的新数据集的注意事项

    在对数据进行初步检查时，你希望确定数据集的许多其他特征。以下是一个清单和一系列了解你数据集的方法，以便熟悉数据并制定你想要遵循的预测模型开发步骤。这些是需要检查的简单事项，并直接影响你的后续步骤。检查项目


    '
