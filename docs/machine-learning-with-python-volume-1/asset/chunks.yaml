    # 前言


    本书面向想要将机器学习加入自己技能库的 Python 程序员，无论是为了某个特定项目，还是为了保持自己的工具包与时俱进。也许工作中出现了需要机器学习的新问题。由于如今机器学习在新闻中被频繁提及，这在简历上是一项非常有用的技能。本书重点关注
    Python，是因为它兼顾了功能性和包含机器学习算法的专业包。Python 是一门经常使用的语言，以生成简洁、可读性的代码而闻名。这一事实导致许多领先公司采用
    Python 进行原型设计和部署。Python 开发者拥有庞大的开发者社区、开发工具、扩展等的支持。Python 也被广泛应用于工业应用和科学编程。它拥有许多支持像机器学习这样计算密集型应用程序的包，并且包含了许多领先的机器学习算法（因此你不需要自己编写这些代码）。Python
    是一种比 `R` 或 `SAS`（统计分析系统）等专门的统计语言更好的通用编程语言。它的机器学习算法集包含了许多顶尖算法并持续不断扩展。


    本书的重点在于介绍机器学习的核心含义以及在 Python 中实现机器学习。这是第一卷，第 2 卷和第 3 卷分别专注于两大类机器学习算法：惩罚线性回归（例如
    `Ridge` 和 `Lasso`）和集成方法（例如 `Random Forests` 和 `Gradient Boosting`）。这些族类均包含解决回归和分类问题的变体。


