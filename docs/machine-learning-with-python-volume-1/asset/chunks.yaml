    获取这些信息后该做什么？离群值可能会对模型构建或预测带来麻烦。在你在该数据集上训练好模型后，可以查看模型产生的错误，并观察这些错误是否与这些离群值相关。如果是，你就可以采取措施来纠正它们。例如，你可以复制性能较差的示例，以强制让它们占更高的权重。你也可以将它们分离出来，并作为一个单独的类别进行训练。如果它们代表了在模型部署后将看到的数据中不会出现的异常情况，你也可以从数据中删掉它们。一个合理的流程可能是：在探索阶段生成四分位数边界，并记录潜在的离群值，以便直观感受你可能会（或不会）遇到多大的问题。然后当你评估性能数据时，使用分位数-分位数图（Q-Q
    图）来确定哪些点可以作为离群值，以用于你的误差分析。


    ## 类别属性的统计特征


    上述描述的过程适用于数值属性。但类别属性又是呢？你想要检查它们包含多少个类别，以及每个类别有多少个示例。你想了解这些内容出于几个原因。性别属性有两个可能的值（男和女），但如果该属性是美国州份，那么会有
    50 个可能的类别。随着属性数量的增加，处理它们的复杂性也随之增加。大多数作为集成方法基础的二叉树算法对处理的类别数量都有限制。Breiman 和 Cutler（该算法的发明者）编写流行的
    `Random Forests` 包有 32 个类别的限制。如果一个属性具有超过 32 个类别，你就需要对它们进行聚合。稍后你会看到，训练涉及取数据的随机子集并在其上训练一系列模型。假设该类别是美国州份，而爱达荷州只有两个示例。随机抽取训练示例可能无法获得任何来自爱达荷州的样本。你需要在这些问题发生之前看到这类问题，以便进行处理。在爱达荷州只有两个示例的情况下，你可能会将它们与蒙大拿州或怀俄米州合并，可能会复制它们，也可能会管理随机抽取过程以确保获得爱达荷州的示例（这种过程被称为分层采样）。


    ## 如何使用 Python Pandas 汇总岩石与矿石数据集


    Python 包 `Pandas` 可以帮助自动化数据检查和处理过程。它在数据检查和预处理的早期阶段特别有用。`Pandas` 包使得将数据读入一种名为 `data
    frame`（数据帧）的特殊数据结构成为可能。`data frame` 是根据同样的 `CRAN-R` 数据结构建模的![](img/Image00004.jpg)


    注意：`Pandas` 包可能很难安装，因为它有很多需要正确配置版本的依赖项，且每个依赖项都必须彼此之间正确匹配（以此类推）。绕过这一障碍的简单方法是使用从
    Continuum Analytics 免费下载的 `Anaconda` Python 发行版 ( http://continuum.io )。安装步骤易于遵循，并可以产生各种数据分析和机器学习包的兼容性安装。你可以将
    `data frame` 视为如表 2-1 所示的表格或矩阵结构。`data frame` 是按行方向的，每一行代表单个案例（实验、示例、测量），列代表特定的属性。该结构是类矩阵的，但不是矩阵，因为不同列中的元素可能是不同类型。从形式上说，矩阵定义在域（如实数、二进制数、复数）上，矩阵中的所有条目都是该域的元素。对于统计问题，矩阵太局限了，因为统计样本通常混合了不同类型。表
    2-1 中的简单示例在 `Attribute 1` 列中有实值，在 `Attribute 2` 列中有类别变量。对于统计问题，矩阵太局限，因为统计样本通常混合了不同类型。`示例示例示例在
    `Attribute 1` 列是实值，`Attribute 2` 列是类别变量，`Attribute 3` 列是整数。在某一列中，条目是相同的。`data
    frame` 结构允许访问不同列中的元素，这 `data`````，访问一个 `Python` 数组。类似地，切片操作可以访问整行。此外，`Pandas`
    `data frame` 允许访问行和列。这结果变得非常有用，特别是对于中等数量。


