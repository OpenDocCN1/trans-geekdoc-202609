    惩罚化线性回归是普通最小二法（OLS）回归的派生方法——这种方法由高斯和勒让德在大约 200 年前开发。惩罚化回归方法的设计是为了克服 OLS 回归的一些基本局限性。OLS
    的基本问题是它有时会过拟合问题。将 OLS 想象为通过一组点的拟合线，如图 1-1 所示。这是一个简单的预测问题：在给定单个属性 `x` 的情况下预测目标值
    `y`。例如，问题可能是仅用身高来预测男性的工资。身高对男性的工资有轻微的预测性（但对女性没有）。这些点代表男性的工资与其身高的关系。图 1-1 中的直线代表了该预测问题的
    OLS 解决方案。在某种意义上，这条直线是给定身高时对男性工资的最佳预测模型。该数据集有六个点。假设该数据集只有两个点。想象有一群点，就像


