    # PREFACE


    This book is intended for Python programmers who want to add machine learning
    to their collection, either for a specific project or as part of keeping their
    toolkit relevant. Perhaps a new problem has come up at work that requires machine
    learning. With machine learning being covered so much in the news these days,
    it’s a useful skill to claim on a resume. This book focuses on Python because
    it offers a good blend of functionality and specialized packages containing machine
    learning algorithms. Python is an often-used language that is well known for producing
    compact, readable code. That fact has led a number of leading companies to adopt
    Python for prototyping and deployment. Python developers are supported by a large
    community of fellow developers, development tools, extensions, and so forth. Python
    is widely used in industrial applications and in scientific programming, as well.
    It has a number of packages that support computationally-intensive applications
    like machine learning, and it is a good collection of the leading machine learning
    algorithms (so you don’t have to code them yourself). Python is a better general-purpose
    programming language than specialized statistical languages such as `R` or `SAS`
    (Statistical Analysis System). Its collection of machine learning algorithms incorporates
    a number of top-flight algorithms and continues to expand.


    This book is focused on giving the main idea of what the machine learning means
    and the implementation of machine learning in Python. This is the first volume,
    volume 2 and 3 are more focused on two broad categories of machine learning algorithms:
    penalized linear regression (for example, `Ridge` and `Lasso`) and ensemble methods
    (for example, `Random Forests` and `Gradient Boosting`), respectively. Each of
    these families contains variants that will solve regression and classification
    problems.


