    \n### 列表 2-10：视觉化展示属性相关性—sampleCorrHeatMap.py\n\n```python\n__author__ = 'Himanshu_Mishra'\n\
    \nimport pandas as pd\nfrom pandas import DataFrame\nimport matplotlib.pyplot\
    \ as plot\n\ntarget_url = (\"https://archive.ics.uci.edu/ml/machine-learning-\"\
