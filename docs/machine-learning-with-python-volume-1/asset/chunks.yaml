    Section 3 explains the basic tradeoffs in machine learning and introduces several
    key concepts used throughout the book. One key concept is the mathematical description
    of predictive problems. The basic distinctions between classification and regression
    are shown. Section 3 also introduces the concept of using out‐of‐sample data for
    determining the performance. Out‐of‐sample data are data that have not been included
    in the training of the model. Good machine learning practice demands developer
    produce solid estimates of how model will perform when it is deployed. This requires
    excluding some data from the training set and using it. Another key concept is
    that there are numerous measures of performance. Section 3 outlines these methods
    and discusses tradeoffs between them. Readers who are already familiar with machine
    learning can browse this Section and scan the code instead of reading it carefully
    and running the code. Section 4 shows the core ideas for training regression models
    and explains several extensions to regression methods. Linear regression can be
    used only on problems where the predictors are real numbers; the quantities being
    used to make predictions have to be numeric. Many practical and important problems
    have variables like “categorical variables”, so means have been devised to convert
    categorical variables to real numbers. In addition, Section 4 also shows methods
    (called basis expansion) for getting nonlinear functions out of regression.


    ## 5

    Section 5 applies the penalized regression algorithms developed in Section 4 to
    a number of problems outlined in Section 2. The Section outlines the Python packages
    that implement regression methods and uses them to solve problems. The objective
    is to cover a wide variety of problems that practitioners can find close to the
    one they have in front of them to solve. Besides quantifying and comparing predictive
    performance, Section 5 looks at other properties of the trained algorithms. Variable
    selection and ranking are important to understand. This understanding will help
    speed development on new problems.


    ## 6

    Section 6 develops ensemble methods. Because ensemble methods are most frequently
    based on binary trees, the first step is to understand the principles of training
    and using them. Many of the properties of ensemble methods are ones they inherit
    directly from binary trees. With that understanding in place, the Section explains
    the principal ensemble methods covered in the book. The common names for these
    are Bagging, boosting, and Random Forest. For each of these, the principles of
    operation are outlined and the code for the core algorithm is developed so that
    you can understand the principles of operation. Section 7 uses ensemble methods
    to solve problems from Section 2 and then compares the various algorithms that
    have been developed. The comparison involves a number of elements. Predictive
    performance is one element of comparison. The time required for training and performance
    is another element. All the algorithms covered give variable importance ranking,
    and this information is compared on a given problem across several different algorithms.
    In my experience, teaching machine learning to programmers and computer scientists,
    I''ve learned that code examples work better than mathematics for some people.
    The approach taken here is to provide some mathematics, algorithm sketches, and
    code examples to illustrate the important points. Nearly all the methods that
    are discussed will be found in the code included in the book and on the website.
    The intent is to provide hackable code to help you get up and running on your
    own problems as quickly as possible.


    ## Summary of Section 1

    This Section has given a specification for the kinds of problems that you''ll
    be able to solve and a description of the process steps for building predictive
    models. The book concentrates on two algorithm families. Limiting the number of
    algorithms covered allows for a more thorough explanation of the background for
    these algorithms and of the mechanics of using them. This Section showed some
    comparative performance results to motivate the choice of these two particular
    families. The Section discussed the different strengths and characteristics of
    these two families and gave some description of the types of problems that would
    favor one or the other of the two. The Section also laid out the steps in the
    process of developing a predictive model and elaborated on the tradeoffs and outcomes
    for each step. The use of data not included in model training was suggested for
    generating performance estimates for predictive models. This book''s goal is to
    bring programmers with little or no machine learning experience to the point where
    they feel competent and comfortable incorporating machine learning into projects.
    The book does not survey a wide number of algorithms. Instead, it covers several
    best‐ in‐class algorithms that can offer you performance, flexibility, and clarity.
    Once you understand a little about how these work and have some experience using
    them, you''ll find them easy and quick to use.

    '
