    # BACT 2,5 1,3,4


    逻辑回归在表 1-2 中仅在一种情况下获得了前五名。原因在于这些数据集相对于样本（每个数据集 5,000 个）来说，属性很少（最多 200 个）。有足够的数据来解决具有如此少量属性的模型，而训练集又足够小，使得训练时间不会过长。


    注意：正如你在第 3 节、第 5 节“使用惩罚化线性方法构建预测模型”中的示例以及第 7 节“使用 Python 构建集成模型”中所示，当存在大量属性且没有足够的样本或时间来训练更复杂的集成模型时，惩罚回归方法的表现优于其他算法。


    许多领域的属性数量远多于第一项研究中的数据集。例如，基因组问题具有数万个属性（每个基因一个属性），而文本挖掘问题可能有数百万个属性（每个不同词或每对不同词一个属性）。表
    1-3 显示了线性回归和集成方法如何随属性数量的增加的表现。表 1-3 中的结果显示了第二项研究中所用算法的排名。表格显示了每个问题的单独性能，最右侧的一列显示了每个算法在所有问题上的平均分排名。


    ![](img/Image00004.jpg)


    研究中使用的算法分为两组。顶部的算法组是本书将涵盖的。底组将不会涵盖。表 1-3 所示的问题按属性数量排序，范围从 761 到 685,569 不等。线性（逻辑）回归在研究中使用的
    11 个测试用例中，有 5 个进入了前三。这些优异的分数集中在较大的数据集上。注意，在较大的数据集算法中，提升决策树（标记为 3）的性能仍然接近顶尖水平。它们在这些问题上的总分中位列第一和第二。


    本书涵盖的算法除了原始预测性能外，还有其他优势。此书所涵盖的惩罚化线性回归模型的一个重要优势是它们的训练速度快。在大规模问题上，训练速度可能会成为问题。在某些问题中，模型训练可能花费几天或几周。这个时间范围可能是一个无法接受的延迟，特别是在开发早期，需要通过迭代来确定最佳方法。除了训练非常快之外，训练完成后线性模型可以非常快地产生预测——快到足以用于高速交易或互联网广告投放。


    研究表明，惩罚化线性回归在许多情况下可以提供最佳答案，即使在它们不是最佳的情况下，也接近顶端。此外，这些算法相对易于使用。它们没有许多可调参数。它们具有定义良好且结构良好的输入类型。它们解决了回归和分类中的几类问题。在开始一个新问题的一两个小时内，安排输入数据并生成第一个训练模型和性能预测，并不罕见。


    ![](img/Image00004.jpg)


    它们最重要的特征之一是它们指示哪些输入变量对产生预测最重要。事实证明是机器学习算法中一个无价之的特征。开发预测模型中最耗时的步骤之一有时被称为特征选择或 `feature
    engineering`。这是数据科学家选择用于预测结果变量的过程。通过根据重要性对特征进行排序，本书涵盖的算法通过消除开发过程中的一些猜测并使过程更加确定，从而辅助了特征工程过程。


