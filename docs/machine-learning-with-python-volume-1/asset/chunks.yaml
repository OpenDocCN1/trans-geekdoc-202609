    \    labelColor = 1.0/(1.0 + exp(-normTarget))\n    dataRow.plot(color=plot.cm.RdYlBu(labelColor),\
    \ alpha=0.5)\n\nplot.xlabel(\"Attribute Index\")\nplot.ylabel((\"Attribute Values\"\
    ))\nplot.show()\n```\n![](img/Image00004.jpg)归一化后葡萄酒数据的图表更清晰地展示了所有坐标方向上与目标之间的相关性。图\
    \ 2-18 显示了几个属性之间明显的相关性。在图表的右侧，深蓝色线条（高口感评分）在高酒精含量值处聚集。在最左侧，深红色线条（低口感评分）在高挥发性酸含量值处聚集。这些是最为相关的属性。你将在第\
    \ 5 和第 7 节中看到的预测模型将根据属性在生成预测时的重要性对其进行排序。你将看到这些视觉观察是如何被预测模型支持的。图 2-19 显示了属性与其他属性之间以及属性与目标之间相关性的热图。在热力图中，热色对应于高水平（这与平行坐标图中使用的色标相反）。葡萄酒数据的热力图显示，口感（最后一列）与酒精（倒数第二列）之间存在较高的相关性，而其他几个属性（包括第一个属性：挥发性酸）的水平非常低（高相关性但符号为负值）。\n\
    \n![](img/Image00004.jpg)对葡萄酒数据集的探索是使用已经解释过的过的工具完成的。葡萄酒数据集展示了这些工具能够揭示的内容。平行坐标图和相关性热图都显示，高水平的酒精与高口感评分相关，而高水平的挥发性酸与低口感评分相关。你将在第\
    \ 5 和第 7 节看到，作为预测建模一部分变量重要性研究将呼应这些发现。葡萄酒数据提供了一个很好的例子，说明数据探索可以在多大程度上帮助你构建和验证预测模型。下一节将探索用于多分类问题的数据。\n\
    \n## 多分类问题：那是哪种玻璃？\n\n多分类与二分类相似，不同之处在于有多个可能的离散结果，而只有两个。回想一下，探测未爆炸地雷的问题涉及两个可能的结果：被声呐照明的物体是岩石还是地雷。从化学成分测量中确定葡萄酒口感的问题有几个可能的结果（3\
    \ 到 8 分的口感评分）。但在葡萄酒问题中，分数之间存在顺序关系。分数为 5 的葡萄酒比分数为 3 的要，但比分数为 8 的要差。在多分类问题中，结果之间不存在顺序感。\n\
    \n本节描述的玻璃问题提供了一个多分类问题的例子。在本节中，玻璃问题给出了各种类型玻璃的化学成分。。该问题的目标是确定玻璃的用途。可能的玻璃类型包括建筑窗玻璃、车辆窗玻璃、玻璃容器等。确定玻璃类型的动机是法医学。在事故或犯罪现场会有玻璃碎片，确定它们的来源可以帮助判断谁有责任或谁犯了罪。列表\
    \ 2-15 显示了生成玻璃数据集摘要的代码。图 2-20 显示了归一化数据上的箱线图。箱线图显示了相当数量极值。\n\n### 列表 2-15：玻璃数据集摘要\
    \ — glassSummary.py\n\n```python\n__author__ = 'Himanshu_Mishra'\n\nimport pandas\
    \ as pd\nfrom pandas import DataFrame\nfrom pylab import *\nimport matplotlib.pyplot\
    \ as plot\n\ntarget_url = (\"https://archive.ics.uci.edu/ml/machine-\" \"learning-databases/glass/glass.data\"\
    )\n\nglass = pd.read_csv(target_url,header=None, prefix=\"V\")\nglass.columns\
    \ = ['Id', 'RI', 'Na', 'Mg', 'Al', 'Si', 'K', 'Ca', 'Ba', 'Fe', 'Type']\n\nprint(glass.head())\n\
    \n#generate statistical summaries\nsummary = glass.describe()\nprint(summary)\n\
    \nncol1 = len(glass.columns)\nglassNormalized = glass.iloc[:, 1:ncol1]\nncol2\
    \ = len(glassNormalized.columns)\nsummary2 = glassNormalized.describe()\n\nfor\
    \ i in range(ncol2):\n    mean = summary2.iloc[1, i]\n    sd = summary2.iloc[2,\
    \ i]\n    glassNormalized.iloc[:,i:(i + 1)] = (glassNormalized.iloc[:,i:(i + 1)]\
    \ - mean) / sd\narray = glassNormalized.values\n\nboxplot(array)\nplot.xlabel(\"\
    Attribute Index\")\nplot.ylabel((\"Quartile Ranges - Normalized \"))\nshow()\n\
    ```\n输出：`[filename - ]`\n\n```\n玻璃数据属性的箱线图显示了数量大量的离群值——至少与一些其他示例问题相比，这一点非常显著。玻璃数据有两个可能驱动离群行为的因素。其之一是一个分类问题。属性值与类别成员身份之间不一定有任何连续性——没有理由预期跨类别的属性值是接近。玻璃数据的另一个独特特征是它是某种不平衡的。每个类别的示例数量从最多类的\
    \ 76 个到最少类的 9 个不等。平均统计可能会被多数类别的值主导，没有理由预期其他类别的成员具有相似的属性值。这种极端行为对于区分不同类别可能是一件好事，但它意味着预测方法必须能够追踪不同类别之间相当复杂的边界。你将在第\
    \ 3 节中学到，如果给予足够的数据，集成方法产生比惩罚线性回归能产生更复杂的决策边界，你将在第 5 和第 7 节中看到哪一类方法在该数据集上表现更好。\n\
    \n![](img/Image00004.jpg)平行坐标图可能对这些数据的行为提供更多线索。图 2-21 显示了平行坐标图。数据使用离散颜色对每个可能的输出进行绘图。图中的某些变量显示出相当不同的颜色路径。例如，深蓝色线条良好地聚集，并在许多属性上与其他类别良好地分离。深蓝色线条在几个属性上处于数据的边缘——也就是说，在这些属性上是离群值。浅蓝色线条比深蓝色少，并且处于与深蓝色某些相同属性的边缘，但并非所有相同属性。\n\
    \n中间的棕色线条也聚集在一起，但值处于中间范围。\n\n列表 2-16：玻璃数据的平行坐标图 — glassParallelPlot.py\n（注：提供的源文本列表中\
    \ 2-16 的代码被截断了）。\n\n"
