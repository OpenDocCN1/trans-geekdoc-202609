    extraction would be deciding what things will be used to predict prices. Past
    prices, prices of related securities, interest rates, and features extracted from
    news releases have all been incorporated into various trading systems that have
    been discussed publicly. In addition, securities prices have a number of engineered
    features with names like stochastic, MACD (moving average convergence divergence
    ), and RSI (relative strength index ) that are basically functions of past prices
    that their inventors believed to be useful in securities trading. After a reasonable
    set of features is developed, you can train a predictive model like the ones described
    in this book, assess its performance, and make a decision about deploying the
    model. Generally, you''ll want to make changes to the features used, if for no
    other reason than to confirm that your model''s performance is adequate. One way
    to determine which features to use is to try all combinations, but that can take
    a lot of time. Inevitably, you''ll face competing pressures to improve performance
    but also to get a trained model into use quickly. The algorithms discussed in
    this book have the beneficial property of providing metrics on the utility of
    each attribute in producing predictions. One training pass will generate rankings
