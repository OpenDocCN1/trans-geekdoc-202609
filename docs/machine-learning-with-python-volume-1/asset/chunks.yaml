    \ and number of unique values for each Missing values  \n\nSummary statistics\
    \ for attributes and labels One of the first things to check is the size and shape\
    \ of the data. Read the data into a list of lists; then the dimension of the outer\
    \ list is the number of rows, and the dimension of one of the inner lists is the\
    \ number of columns. The next section shows the concrete application of this to\
    \ one of the data sets that you’ll see used later to illustrate the properties\
    \ of an algorithm that will be developed. The next step in the process is to determine\
    \ how many missing values there are in each row. The reason for doing it on a\
    \ row‐by‐row basis is that the simplest way to deal with missing values is to\
    \ throw away instances that aren’t complete (examples with at least one missing\
    \ value). In many situations, this can bias the results, but just a few incomplete\
    \ examples will not make a material difference. By counting the rows with missing\
    \ data (in addition to the total number of missing entries), you’ll know how much\
    \ of the data set you have to discard if you use the easy method. If you have\
    \ a large number of rows, as you might if you’re collecting web data, the number\
    \ you’ll lose may be small compared to the number of rows of data you have available.\
    \ If you’re working on biological problems where the data are expensive and you\
    \ have many attributes, you might not be able to afford to throw data out. In\
    \ that case, you’ll have to figure out some ways to fill in the missing values\
    \ or use an algorithm that can deal with them. Filling them in is called imputation\
    \ . The easiest way to impute the missing data is to fill in the missing entries\
    \ using average values of the entries in each row. A more sophisticated method\
    \ is to use one of the predictive methods covered in Sections 4 and 6. To use\
    \ a predictive method, you treat a column of attributes with missing values as\
    \ though it were labels. Be sure to remove the original problem labels before\
    \ undertaking this process. The next several sections are going to go through\
    \ the process outlined here and will introduce some methods for characterizing\
    \ your data set to help you decide how to attack the modeling process. Classification\
    \ Problems: Detecting Unexploded Mines Using Sonar This section steps through\
    \ several checks that you might make on a classification problem as you begin\
    \ digging into it. It starts with simple measurements of size and shape, reporting\
    \ data types, counting missing values, and so forth. Then it moves on to statistical\
    \ properties of the data and interrelationships between attributes and between\
    \ attributes ![](Image00004.jpg)and the labels. The data set comes from the UC\
    \ Irvine Data Repository \\[Ref 1.\\]. The data result from some experiments to\
    \ determine if sonar can be used to detect unexploded mines left in harbors subsequent\
    \ to military actions. The sonar signal is what’s called a chirped signal . That\
    \ means that the signal rises (or falls) in frequency over the duration of the\
    \ sound pulse. The measurements in the data set represent the power measurements\
    \ collected in the sonar receiver at different points in the returned signal.\
    \ For roughly half of the examples, the sonar is illuminating a rock, and for\
