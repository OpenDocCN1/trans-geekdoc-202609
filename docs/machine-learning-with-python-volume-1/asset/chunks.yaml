    those that Jeremy Howard and I presented at Strata Conference in 2012. Jeremy
    took ensemble methods, and I took penalized linear regression. We had fun arguing
    about the relative merits of the two groups. In reality, however, those two cover
    something like 80 percent of the model building that I do, and there are good
    reasons for that. Section 3 goes into more detail about why one algorithm or another
    is a better choice.


    ### Process Steps for Building a Predictive Model


    The Process Steps for Building a Predictive Model Using machine learning requires
    several different skills. One is the required programming skill, which this book
    does not address. The other skills have to do with getting appropriate model trained
    and deployed. These other skills are what the book does address.


    What do these other skills include? Initially, problems are stated in somewhat
    vague language-based terms like “Show visitors links that they''re likely to click
    on.” To turn this into a working system requires restating the problem in concrete
    terms, finding data to base the prediction on, and then training a predictive
    model that will predict the likelihood of visitors clicking.


    How do you get started with a new problem? First, you look through the available
    data to determine which of the data might be of use. “Looking through the data”
    means running various statistical tests on the data to get a feel for what they
    reveal and how they relate to what''re trying to predict. Intuition can guide
    you to some extent. You can also quantify the outcomes and test the degree to
    which potential features correlate with these outcomes.


    By some means, you develop a set of features and start training the machine learning
    algorithm that you have selected. That produces a trained model and estimates
    its performance. Next, you want to consider making changes to the features set,
    including adding new ones or removing some that proved unhelpful, or perhaps changing
    to a different type of training objective (also called a target) to see whether
    it improves performance. You''ll iterate various design decisions to determine
    whether there''s a possibility of improving performance. You may pull out the
    examples that show the worst performance and then attempt to determine if there''s
    something that unites these examples. That may lead to another feature to add
    to the prediction process, or it might cause you to bifurcate the data and train
    different models on different populations.


    The goal of this book is to make these processes familiar enough to you that you
    can march through these development steps confidently. That requires your familiarity
    with the input data structures required by different algorithms as you frame the
    problem and begin extracting the data to be used in training and testing algorithms.
    The process usually includes several of the following steps:


    1. Extract and assemble features to be used for prediction.

    2. Develop targets for the training.

    3. Train a model.

    4. Assess performance on test data.

    '
