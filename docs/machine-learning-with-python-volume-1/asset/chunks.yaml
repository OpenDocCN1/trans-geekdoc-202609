- raw: '![](Image00013.jpg)![](Image00014.jpg)![](Image00015.jpg)A new data set (problem)
    is a wrapped gift. It’s full of promise and anticipation at the miracles you can
    wreak once you’ve solved it. But it remains a mystery until you’ve opened it.
    This Section is about opening up your new data set so you can see what’s inside,
    get an appreciation for what you’ll be able to do with the data, and start thinking
    about how you’ll approach model building with it. This Section has two purposes.
    One is to familiarize you with data sets that will be used later as examples of
    different types of problems to be solved using the algorithms you’ll learn in
    Section 4, “Penalized Linear Regression,” and Section 6, “Ensemble Methods.” The
    other purpose is to demonstrate some of the tools available in Python for data
    exploration. The Section uses a simple example to review some basic problem structure,
    nomenclature, and characteristics of a machine learning data set. The language
    introduced in this section will be used throughout the rest of the book. After
    establishing some common language, the Section goes one by one through several
    different types of function approximation problems. These problems illustrate
    common variations of machine learning problems so that you’ll know how to recognize
    the variants when you see them and will know how to handle them (and will have
    code examples for them). The Anatomy of a New Problem ![](Image00004.jpg)The algorithms
    covered in this book start with a matrix (or table) full of The algorithms covered
    in this book start with a matrix (or table) full of 1 establishes some nomenclature
    and represents a small machine learning data set in a two dimensional table. The
    table will give you a mental image of a data set so that references to “columns
    corresponding to attributes” or rows corresponding to individual examples will
    be familiar. In this example, the predictive analytics problem is to predict how
    much money individuals will spend buying books online over the next year. The
    data are arranged into rows and columns. Each row represents an individual case
    (also called an instance , example , or observation ). The columns in Table 2-1
    are given designations that indicate the roles they will play in the machine learning
    problem. The columns designated as attributes will be used to make predictions
    of the dollars spent on books. In the column designated as labels, you’ll see
    how much each customer spent last year on books. NOTE Machine learning data sets
    are most commonly arranged with columns corresponding to a single attribute and
    rows corresponding to a single observation, but not always. For example, some
    text mining literature arranges the matrix the other way around—with columns corresponding
    to an observation and rows corresponding to an attribute. In Table 2-1, a row
    represents an individual customer, and the data in the row all pertain to that
    individual. The first column is called UserID and contains an identifier that
    is unique for each row (case). A unique identifier may or may not be present in
    your problem. For instance, websites typically tag site visitors with a user ID
    that is associated with them for the duration of their visit. If a user does not
    register with the site, the same user gets a different ID with each visit. The
    ID is usually assigned to each observation, which will be the subject of the prediction
    you’re going to build. Columns 2, 3, and 4 are called Attributes instead of being
    given more specific names like Height or Gender. The point is to highlight their
    role in the prediction process. Attributes are data ![](Image00004.jpg)available
    about the case that will be used to make predictions. Labels are the things you
    want to predict. In this example, UserID is a simple number, Attribute 1 is height,
    Attribute 2 is gender, and Attribute 3 is how many books the person read last
    year. The column under labels contains how much money the individual spent on
    books online last year. What are the roles that these different categories of
    data will play? What use does a machine learning algorithm make of user ID, attributes,
    and labels? The short answer is this: You ignore the user ID. You use the attributes
    to predict the labels. The unique ID is for bookkeeping purposes and allows you
    to refer back to the other data available for the specific case. Generally, the
    unique ID does not get used directly in a machine learning algorithm. Attributes
    are the things that you’ve chosen to use for making predictions. Labels are observed
    outcomes that the machine learning algorithm will use to build a predictive model.
    User ID doesn’t usually get used for making predictions because it is too specific.
    It pertains to only a single example. The trick with machine learning is to build
    a model that generalizes to new cases (not merely memorizing past cases). To achieve
    that, the algorithm must be derived so that it is forced to pay attention to more
    than one row of data. One possible exception to excluding user ID is when the
    user ID is numeric and assigned in the order that users are signed up. Basically,
    it’s indicating signup date in that case and can be useful because users with
    close IDs signed up at similar times and can be considered as a group on that
    basis. The process of building a predictive model is called training . The way
    the process proceeds depends on the algorithm, and later Sections cover the details,
    but it is often iterative. The algorithm postulates a predictive relationship
    between the attributes and the labels, observes the mistakes that it makes, and
    makes some correction, and then iterates on that process until a sound model is
    achieved. A number of technicalities are addressed later, but that’s the basic
    idea. ![](Image00004.jpg)![](Image00016.jpg)Different Types of Attributes and
    Labels Drive Modelling Choices The attributes shown in Table 2-1 come in two different
    types: numeric variables and categorical (or factor) variables. Attribute 1 (height)
    is a numeric variable and is the most usual type of attribute. Attribute 2 is
    gender and is indicated by the entry Male or Female. This type of attribute is
    called a categorical or factor variable. Categorical variables have the property
    that there’s no order relation between the various values. There’s no sense to
    Male < Female (despite centuries of squabbling). Categorical variables can be
    two‐valued, like Male Female, or multivalued, like states (AL, AK, AR . . . WY).
    Other distinctions can be drawn regarding attributes (integer versus float, for
    example), but they do not have the same impact on machine learning algorithms.
    The reason for this is that many machine learning algorithms take numeric attributes
    only; they cannot handle categorical or factor variables. Penalized regression
    algorithms deal only with numeric attributes. The same is true for support vector
    machines, kernel methods, and K‐ nearest neighbors. Section 4 will cover methods
    for converting categorical variables to numeric variables. The nature of the variables
    will shape your algorithm choices and the direction you take in developing a predictive
    model, so it’s one of the things you need to pay attention to when you face a
    new problem. A similar dichotomy arises for the labels. The labels shown in Table
    2-1 are numeric: the amount of money that the individual spent on books online
    last year. In other problems, though, the labels may also be categorical. For
    example, if the job with Table 2-1 were to predict which individuals would spend
    more than $200 next year the problem would change, and the problem approach would
    change. The new problem of predicting which customers would spend more than $200
    would have new labels. The new labels would take one of two values. Table 2-2
    shows the relationship between the labels given in Table 2-1 and new labels based
    on the logical proposition Spending > $200. The new labels shown in Table 2-2
    take one of two values—True or False. ![](Image00004.jpg)When the labels are numeric,
    the problem is called a regression problem . When the labels are categorical,
    the problem is called a classification problem . If the categorical target takes
    only two values, the problem is called a binary classification problem . If it
    takes more than two values, the problem is called a multiclass classification
    problem . In many cases, the choice of problem type is up to the designer. You’ve
