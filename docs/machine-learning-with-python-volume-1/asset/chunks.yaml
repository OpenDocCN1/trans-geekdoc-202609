- raw: "The general perception is that there's an enormous amount of genetic ![](Image00004.jpg)data\
    \ around. Genetic data sets are indeed large when measured in bytes, but in terms\
    \ of generating accurate predictions, they aren't very large. To understand this\
    \ distinction, consider the following thought experiment. Suppose that you have\
    \ two people, one with a heritable condition and the other without. If you had\
    \ genetic sequences for the two people, could you determine which gene was responsible\
    \ for the condition? Obviously, that's not possible because many genes will differ\
    \ between the two persons. So how many people would it take? At a minimum, it\
    \ would take gene sequences for as many people as there are genes, and given any\
    \ noise in the measurements, it would take even more. Humans have roughly 20,000\
    \ genes, depending on your count. And each datum costs roughly $1,000. So having\
    \ just enough data to resolve the disease with perfect measurements would cost\
    \ $20 million. This situation is very similar to fitting a line to two points,\
    \ as discussed earlier in this Section. Models need to have fewer degrees of freedom\
    \ than the number of data points. The data set typically needs to be a multiple\
    \ of the degrees of freedom in the model. Because the data set size is fixed,\
    \ the degrees of freedom in the model need to be adjustable. The Sections dealing\
    \ with penalized linear regression will show you how the adjustability is built\
    \ into penalized linear regression and how to use it to achieve optimum performance.\
    \ NOTE The two broad categories of algorithms addressed in this book match those\
    \ that Jeremy Howard and I presented at Strata Conference in 2012. Jeremy took\
    \ ensemble methods, and I took penalized linear regression. We had fun arguing\
    \ about the relative merits of the two groups. In reality, however, those two\
    \ cover something like 80 percent of the model building that I do, and there are\
    \ good reasons for that. Section 3 goes into more detail about why one algorithm\
    \ or another is a better choice for a given problem. It has to do with the complexity\
    \ of the problem and the number of degrees of freedom inherent in the algorithms.\
    \ The linear models tend to train rapidly and often give equivalent performance\
    \ to nonlinear ensemble methods, especially if the data available are somewhat\
    \ constrained. Because they're so rapid to train, it is often convenient to train\
    \ linear models for early feature selection and to ballpark achievable performance\
    \ for a specific problem. The linear models considered in this book can give information\
    \ about variable importance to aid in the feature selection process. The ensemble\
    \ methods often give better performance if there are adequate data and also give\
    \ somewhat indirect measures of relative variable importance. ![](Image00004.jpg)The\
    \ Process Steps for Building a Predictive Model Using machine learning requires\
    \ several different skills. One is the required programming skill, which this\
    \ book does not address. The other skills have to do with getting an appropriate\
    \ model trained and deployed. These other skills are what the book does address.\
    \ What do these other skills include? Initially, problems are stated in somewhat\
    \ vague language‐based terms like “Show site visitors links that they're likely\
    \ to click on.” To turn this into a working system requires restating the problem\
    \ in concrete mathematical terms, finding data to base the prediction on, and\
    \ then training a predictive model that will predict the likelihood of site visitors\
    \ clicking the presentation. Stating the problem in assumptions about what features\
    \ will be extracted from the available data sources and how they will be structured.\
    \ How do you get started with a new problem? First, you look through the available\
    \ data to determine which of the data might be of use in prediction. “Looking\
    \ through the data” means running various statistical tests on the data to get\
    \ a feel for what they reveal and how they relate to what you're trying to predict.\
    \ Intuition can guide you to some extent. You can also quantify the outcomes and\
    \ test the degree to which potential prediction features correlate with these\
    \ outcomes. Section 2, “Understand the Problem by Understanding the Data,” goes\
    \ through this process for the data sets that are used to characterize and compare\
    \ the algorithms outlined in the rest of the book. By some means, you develop\
    \ a set of features and start training the machine learning algorithm that you\
    \ have selected. That produces a trained model and estimates its performance.\
    \ Next, you want to consider making changes to the features set, including adding\
    \ new ones or removing some that proved unhelpful, or perhaps changing to a different\
    \ type of training objective (also called a target ) to see whether it improves\
    \ performance. You'll iterate various design decisions to determine whether there's\
    \ a possibility of improving performance. You may pull out the examples that show\
    \ the worst performance and then attempt to determine if there's something that\
    \ unites these examples. That may lead to another feature to add to the prediction\
    \ process, or it might cause you to bifurcate the data and train different models\
    \ on different populations. The goal of this book is to make these processes familiar\
    \ enough to you that you can march through these development steps confidently.\
    \ That requires your familiarity with the input data structures required by different\
    \ algorithms as you frame the problem and begin extracting the data to be used\
    \ in training and testing algorithms. The process usually includes several of\
    \ the following steps: 1\\. Extract and assemble features to be used for prediction.\
    \  \n\n2\\. Develop targets for the training.  \n\n3\\. Train a model.  \n\n4\\\
    . Assess performance on test data.  "
