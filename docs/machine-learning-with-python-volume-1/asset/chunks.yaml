    plot.show()\n```\n\n属性之间的完全相关（`correlation = 1`）意味着你可能犯错了并包含了两次相同的内容。一组属性之间极高的相关性（`pairwise\
    \ correlations > 0.7`）被称为多重共线性，并可能导致估计不稳定。与目标的相关性则是另一回事。拥有与目标相关的属性通常表示存在预测关系。\n\
    \n## 总结理解岩石与矿石数据集的过程\n\n在理解岩石与矿石数据集的过程中，本节介绍了许多工具供你使用，以获得对数据集的理解和直觉。本节进行了详细说明，以使它们的推导和用法清晰可见。接下来的章节将使用这些相同的工具来检查书中将用于开发机器学习算法的其他数据集。由于你现在已经熟悉进行数据检查的工具，接下来的章节将仅在由于问题的性质不同而需要修改工具时对这些工具进行注释。\n\
    \n### 使用因子变量进行实值预测：鲍鱼有多大？\n\n你所见过的用于理解检测未爆炸地雷问题的大多数工具都可以应用于回归问题。在给定物理测量的情况下预测鲍鱼的年龄是此类问题的一个例子。鲍鱼属性还包含一个作为因子变量的属性，这将说明涉及因子变量的差异。\n\
    \n鲍鱼数据集提出了通过几项测量来预测鲍鱼年龄的问题。通过切开贝壳并数生长环，可以获得鲍鱼年龄的精确读数，就像通过数年轮来判断树的年龄一样。对于研究鲍鱼种群科学家来说，在显微镜下切开贝壳并数生长环既昂贵又耗时。如果能够进行长度、宽度、重量等简单的物理测量，然后使用预测模型处理这些测量值并准确地判断鲍鱼的年龄，将更加方便和经济。预测分析有无数科学应用，学习机器学习的益处之一就是能够为各种有趣的问题做出贡献。\n\
    \n该问题的数据可以通过 UC Irvine 数据库获取。该数据集的 URL 为 `http://archive.ics.uci.edu/ml/machine‐learning‐databases/abalone/abalone.data`。该数据集是以逗号分隔的文件形式，没有列标题。列名位于一个单独的文件中。\n\
    \n列表 2-11 将鲍鱼数据集读入 Pandas 数据框中，并运行了一些你在“分类问题：使用声呐探测未爆炸地雷”中看到过的一些相同分析。对于岩石与矿石数据集，由于数据的特性的，列名较为通用。对于鲍鱼数据集，不同的数据列具有含义，这些含义对于培养对模型进展的直观理解至关重要。由于由于原因，你将在代码中看到列名被复制到代码中并附加数据集，以帮助你理解后续机器学习算法正在执行的预测。用于构建预测模型的数据列有\
    \ `Sex`、`Length`、`Diameter`、`Height`、`Whole Weight`、`Shucked Weight`、`Viscera\
    \ Weight`、`Shell Weight` 和 `Rings`。最后一列 `Rings` 是通过锯开贝壳并在显微镜下计数的艰苦过程得出的。这是监督学习问题的典型安排。你拥有一个已知答案的特殊数据集，以便在答案未知时构建一个生成预测的模型。除了显示生成摘要的代码外，列表\
    \ 2-11 还显示了摘要的打印输出。第一部分打印数据集的头部和尾。为了节省空间，输出中只显示了头部。当你自己运行代码时，将看到两者。数据框大部分填充了浮点数。第一列包含动物的性别，包含字母\
    \ `M`（雄性）、`F`（雌性）和 `I`（不确定）。\n\n"
