    如图 1-1 所示，但通过 ![](img/Image00004.jpg)你无法看到所有的点。也许这些点的生成成本太高了，比如前面提到的遗传数据。虽然有足够的人类可以分离出那个罪祸首的基因，但问题在于由于成本原因，你没有其中许多人的基因序列。为了在这个简单的示例中模拟这种情况，想象给你的不是六个点，而是六个点中的两个。这将如何改变拟合这些点的直线的性质？这取决于你恰好得到了哪两个点。


    为了看到这种影响有多大，请从图 1-1 中任选两个点，并想象一条穿过它们的过线。图 1-2 显示了通过图 1-1 中点对的某些可能直线。注意这些直线如何根据点的选择而产生巨大变化![](img/Image00007.jpg)。


    仅用两个点来拟合直线的问题在于，数据量不足以提供自由度。一条直线有两个自由度。两个自由度意味着有两个参数来决定一条直线。你可以想象在平面上抓住一条直线，在平面内上下滑动它，或者旋转它来改变其斜率。因此，垂直位置和独立的斜率是相互独立的。它们可以被单独改变，共同完全确定一条直线。直线的自由度可以用几种等效方式表示（其与
    y 轴的截距和斜率、直线上的两点等）。所有这些直线的表示方法都需要两个参数来指定。


    当自由度等于点的数量时，预测效果并不理想。直线穿过了用于绘制它们的点，但用不同点对绘制的直线之间存在很大的差异。对于一个自由度与数据集中点数相等的预测，你不能寄予太大信任。图
    1-1 中的图表有六个点，并通过它们拟合了一条直线（两个自由度）。这就是六个点和两个自由度。


    确定导致遗传性疾病基因的思考题说明，可选的基因越多，就越需要更多数据，以便从 20,000 多个可能的人类基因中分离出原因。20,000 个不同的基因代表了
    20,000 个自由度。即使是来自 20,000 个不同人的数据也不足以获得可靠的答案，在许多情况下，在合理研究范围内负担得起的全部只是大约 500 个人的样本。这就是惩罚线性回归可能是最佳算法选择的地方。惩罚线性回归提供了一种系统减少自由度的方法，以匹配可用数据量和底层现象的复杂性。这些方法对于具有非常自由度的问题已变得非常流行。它们是遗传问题的宠儿，因为这类问题的自由度（即基因数量）可以达到数万，而且对于文本分类等问题，其自由度
    ![](img/Image00004.jpg)可以超过一百万。第 4 节“惩罚线性回归”详细介绍了这些方法的工作原理，并提供了使用 Python 包实现机器学习的流程示例。


    ## 什么是集成方法？


    书中涵盖的另一类算法是集成方法。集成方法的基本思想是构建大量的不同预测模型，然后组合它们的输出——通过平均输出或采取多数意见（投票）。单个模型被称为基学习器。计算学习的某些结果表明，如果基学习器仅略好于随机猜测，那么只要有足够的独立模型，集成方法的性能就可以非常好。促使集成方法发展的问题之一是观察到某些特定的机器学习算法表现出不稳定性。例如，向数据集中添加新数据可能会导致结果模型或性能的剧烈变化。


    用两个点来拟合直线的问题在于数据量不足以提供自由度。直线有两个自由度。两个自由度意味着有两个参数来决定一条直线。你可以想象在平面上抓住一条直线，在平面内上下滑动它，或者旋转它来改变其斜率。因此，垂直位置和独立的斜率是相互独立的。它们可以被单独改变，共同完全确定一条直线。直线的自由度可以用几种等效方式表示（其与
    y 轴的截距和斜率、直线上的两点等）。所有这些直线的表示方法都需要两个参数来指定。


    当自由度等于点的数量时，预测效果并不理想。直线穿过了用于绘制它们的点，但用不同点对绘制的直线之间存在很大差异。对于一个自由度与数据集中点数相等的预测，你不能寄予太大信任。图
    1-1 中的图表有六个点，并通过它们拟合了一条直线（两个自由度）。这就是六个点和两个自由度。


    确定导致遗传性疾病基因的思考题说明，可选的基因越多，就越需要更多数据，以便从 20,000 多个可能的人类基因中分离出原因。20,000 个不同的基因代表了
    20,000 个自由度。即使是来自 20,000 个不同人的数据也不足以获得可靠的答案，在许多情况下，在合理研究范围内负担得起的全部只是大约 500 个人的样本。这就是惩罚线性回归可能是最佳算法选择的地方。惩罚线性回归提供了一种系统减少自由度的方法，以匹配可用数据量和底层现象的复杂性。这些方法对于具有非常自由度的问题已变得非常流行。它们是遗传问题的宠儿，因为这类问题的自由度（即基因数量）可以达到数万，而且对于文本分类等问题，其自由度
    ![](img/Image00004.jpg)可以超过一百万。第 4 节“惩罚线性回归”详细介绍了这些方法的工作原理，并提供了使用 Python 包实现机器学习的流程示例。


    ## 什么是集成方法？


    书中涵盖的另一类算法是集成方法。集成方法的基本思想是构建大量的不同预测模型，然后组合它们的输出——通过平均输出或采取多数意见（投票）。单个模型被称为基学习器。计算学习的某些结果表明，如果基学习器仅略好于随机猜测，那么只要有足够的独立模型，集成方法的性能就可以非常好。促使集成方法发展的问题之一是观察到某些特定的机器学习算法表现出不稳定性。例如，向数据集中添加新数据可能会导致结果模型或性能的剧烈变化。


    （注：由于提供的文本后半部分存在大量重复和乱码，翻译已根据指令对有效逻辑部分进行了整合和翻译）

