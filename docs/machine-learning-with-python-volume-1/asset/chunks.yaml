    \ You’ll notice that in some cases the whiskers are closer than the 1.4x spacing.\
    \ For these cases the data values do not extend all the way to the calculated\
    \ whisker locations. In these cases, the whisker is placed at the most extreme\
    \ data point. In other cases, the data extend for a considerable distance beyond\
    \ the calculated whisker locations. These points can be considered outliers.\n\
    \n### Normalization\n\nThe last section of the code in Listing 2-11 normalizes\
    \ all the data columns before box plotting. Normalization in this case means centering\
    \ and scaling each column so that a unit of attribute number 1 means the same\
    \ thing as a unit of attribute number 2. A number of algorithms and operations\
    \ in data science require this type of normalization. For example, K‐means clustering\
    \ builds clusters based on vector distance between rows of data. Distance is measured\
    \ by subtracting one point from another and squaring. If the units are different,\
    \ the numeric distances are different. The distance to the grocery store can be\
    \ 1 if measured in miles or 5,280 if measured in feet.\n\nThe normalization indicated\
    \ in Listing 2-11 adjusts the variables so that they all have 0 mean and a standard\
    \ deviation of 1. This is a very common normalization. The calculations for the\
    \ normalization make use of the numbers generated by the `summary()` function.\
    \ The results are plotted in Figure 2-11.\n\n### Parallel Coordinates for Regression\
    \ Problems—Visualize Variable Relationships for Abalone Problem\n\nThe next step\
    \ is to get some ideas about the relationship among the attributes and between\
    \ attributes and labels. For the rocks versus mines data, the color-coded parallel\
    \ coordinates plot portrayed these relationships graphically. That approach needs\
    \ some modification to work for the abalone problem. Rocks versus mines was a\
    \ classifier problem. The parallel coordinates plot for that problem color‐coded\
    \ the lines representing rows of data according to their true classification.\
    \ That helps to visualize the relationship between prediction and predictors.\
    \ The abalone problem is a regression problem, so the color‐coding in this example\
    \ needs to be shades of color corresponding to higher or lower target values.\
    \ To assign shades of color to real values, the real values need to be compressed\
    \ into the interval `[0.0, 1.0]`. Listing 2-12 uses the `min` and `max` values\
    \ generated by the `summary()` function from Pandas to accomplish this. Figure\
    \ 2-12 shows the results.\n\n### Listing 2-11: Parallel Coordinate Plot for Abalone\
    \ Data\nabaloneParallelPlot.py\n"
  trans: "\n\n鲍鱼的性别在出生时并不是决定的，而是在发育一段时间后决定的。因此，年幼鲍鱼的性别是不确定的。鲍鱼的性别是一个三值的分类变量。分类属性需要特别注意。某些算法只处理实值属性（例如支持向量机、K-最近邻和在第\
