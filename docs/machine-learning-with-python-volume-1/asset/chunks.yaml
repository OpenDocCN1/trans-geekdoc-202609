    数学术语提供了可用链接，请**注意**：第一次尝试通常可以通过尝试不同的特征集、不同类型的目标等来改进。机器学习不仅仅需要熟悉几个包。它还需要理解并实践开发可部署模型时所涉及的过程。本书旨在让你获得这种理解。它假设你具备了本科水平的数学数学知识，并了解一些概率和统计的基本概念，但本书并不预设读者具有机器学习背景。同时，它意在为读者提供适用于广泛问题的最佳算法，而不一定旨在综述所有的机器学习算法或方法。有很多算法很有趣，但由于各种原因，它们并不经常被使用。例如，也许它们扩展性不好，也许它们无法提供关于内部运行机制的洞察，也许它们难以使用，等等。众所周知，例如，`Random
    Forests`（本文涵盖的算法之一）是在线机器学习竞赛中以巨大优势领先的冠军。某些算法之所以被实践者更频繁地使用是有充分的，如果你在读完本书后理解了这些原因，那么这本书就成功了。


    ## 机器学习问题的框架构建 (Framing a Machine Learning Problem)

    开始一项机器学习竞赛是对真实机器学习问题的模拟。竞赛会提供一个简要描述（例如，宣布一家保险公司希望更好地预测其汽车保单的理赔率）。作为竞争者，你的第一步是打开数据集，查看可用数据，并确定预测需要采取什么形式才有用。对数据的检查将让你直观地感受到数据代表什么，以及它们如何与眼前的预测任务相关。数据可以就方法方面提供洞察。图
    1-5 展示了从通用的语言陈述目标开始，转向可以作为机器学习算法输入的数据安排的过程。那个被夸张表述为“让我们获得更好的结果吧”的泛化陈述，首先必须转换为可以衡量和优化的特定目标。对于网站所有者来说，特定的性能提升可能是提高点击率或增加销售额（或增加贡献毛利）。下一步是汇集数据，这些数据可能使得预测给定客户点击各种链接或在线购买各种产品的概率成为可能。图
    1-5 将这些数据描属性矩阵。对于网站示例，这些属性可能包括访问者查看过的其他页面或访问者过去购买过的物品。除了用于预测的属性外，这类问题的机器学习算法还需要正确的答案来用于训练。这些答案在图
    1-5 中被标记为 `targets`（目标）。本书涵盖的算法通过检测过去行为中的模式来学习，但重要的是，它们不能仅仅是记忆过去的行为；毕竟，客户可能不会重复购买他昨天买过的东西。第
    3 节详细讨论了这种不带记忆的训练过程是如何运作的。通常，问题表述的几个方面可以用一种一种方式完成。这导致了构建问题、选择并训练模型以及产生性能估计之间进行某些迭代。图
    1-6 展示了这一过程。问题可能带有特定的定量训练目标，或者工作的一部分可能是提取这些数据（称为 `targets` 或 `labels` 标签）。例如，考虑构建一个自动交易证券的系统问题。要进行自动交易，第一步可能是预测证券价格的变化。价格很容易获得，因此使用历史数据来构建训练示例（即未来的价格变化是已知的）在概念上是简单的。但即使是这样也涉及选择和实验。未来的价格变化可以用几种不同的方法计算。变化可以是当前价格与
    10 分钟后价格之间的差值。也可以是当前价格与 10 天后价格之间的变化。还可以是当前价格与未来 10 分钟内最高/最低价格之间的差。价格的变化可以用一个二状态变量来表征，取决于
    10 分钟后价格是高是低取值为“较高”或“较低”。这些每一个选择将导致一个预测模型，预测结果将用于决定是否购买或卖该证券。需要一些实验来确定最佳选择。


    ## 特征提取与特征工程 (Feature Extraction and Feature Engineering)

    决定使用哪些变量进行预测可能也涉及实验。这个过程被称为特征提取和特征工程。特征提取是从自由格式安排（如文档或网页中的单词）中获取数据，并将其排列成数字行和列的过程。例如，垃圾邮件过滤问题始于电子邮件文本，可能会提取诸如文档中大写字母的数量、全大写单词的数量、“buy”一词在文档中出现的次数以及其他选定的以突出垃圾邮件与非垃圾邮件差异的数值特征。特征工程是操纵和组合特征以获得更具信息的特征的过程。构建证券交易系统涉及特征提取和特征工程。特征提取将是决定使用哪些内容来预测价格。过去的价格、相关证券的价格、利率以及从新闻稿中提取的特征都已整合到公开讨论的各种交易系统中。此外，证券价格还有许多工程化特征，名称如
    `stochastic`（随机）、`MACD`（移动平均收敛扩散）和 `RSI`（相对强度指数），它们基本上是过去价格的函数，其发明者认为这些在证券交易中是有用的。开发出一组合理的特征后，你可以训练像书中描述那样的预测模型，评估其性能，并对部署模型做出决策。通常，你会想要对使用的特征进行更改，即使不是为了其他原因，仅仅是为了确认你的模型性能足够。确定使用哪些特征的一种方法是尝试所有组合，但这可能花费大量时间。不可避免的是，你将面临提高性能与快速将训练好的模型投入使用的竞争压力。书中讨论的算法具有有利的属性，即提供每个属性在生成预测时的实用性指标。一次训练过程将生成特征排名，以指示它们的相对重要性。这些信息有助于加速特征工程过程。**注意**：数据准备和特征工程预计占了开发机器学习模型所需时间的
    80% 到 90%。模型训练过程从每次尝试基准特征集开始。


    ## 已训练模型的性能评估 (Determining Performance of a Trained Model)

    决定哪些变量用于预测可能也涉及实验。这个过程被称为特征提取和特征工程。特征提取是从从自由格式安排（如文档或网页中的单词）中获取数据，并将其排列成数字行和列的过程。例如，垃圾邮件过滤问题始于电子邮件文本，可能会提取诸如文档中大写字母的数量、全大写单词的数量、“buy”一词在文档中出现的次数以及其他选定的以突出垃圾邮件与非垃圾邮件差异的数值特征。特征工程是操纵和组合特征以获得更具信息的特征的过程。构建证券交易系统涉及特征提取和特征工程。特征提取将是决定使用哪些内容来预测价格。过去的价格、相关证券的价格、利率以及从新闻稿中提取的特征都已整合到公开讨论的各种交易系统中。此外，证券价格还有许多工程化特征，名称如
    `stochastic`（随机）、`MACD`（移动平均收敛扩散）和 `RSI`（相对强度指数），它们基本上是过去价格的函数，其发明者认为这些在证券交易中是有用的。开发出一组合理的特征后，你可以训练像书中描述那样的预测模型，评估其性能，并对部署模型做出决策。通常，你会想要对使用的特征进行更改，即使不是为了其他原因，仅仅是为了确认你的模型性能足够。确定使用哪些特征的一种方法是尝试所有组合，但这可能花费大量时间。不可避免的是，你将面临提高性能与快速将训练好的模型投入使用的竞争压力。书中讨论的算法具有有利的属性，即提供每个属性在生成预测时的实用性指标。一次训练过程将生成特征排名，以指示它们的相对重要性。这些信息有助于加速特征工程过程。**注意**：数据准备和特征工程预计占了开发机器学习模型所需时间的
    80% 到 90%。模型训练过程从每次尝试基准特征集开始。


