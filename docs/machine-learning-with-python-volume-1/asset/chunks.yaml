    # 章节


    本书关注机器学习过程，因此仅涵盖了少数最有效且应用广泛的算法。它并没有提供机器学习技术的综述。综述中可能包含的算法中很多并没有被实践者活跃使用。本书处理一类机器学习问题，通常称为函数近似。`Linear
    regression` 及其分类器表亲 `logistic regression` 为函数近似问题提供了熟悉的算法示例。函数近似问题涵盖了各种领域中广泛的实际分类和回归问题，包括文本分类、搜索响应、广告投放、垃圾邮件过滤、预测客户行为、诊断等。这个列表几乎是无止尽的。


    广而言之，本书涵盖了解决函数近似问题的两类算法：惩罚线性回归方法和集成方法。本节向你介绍了这两种算法，概述了它们的一些特征，并回顾了算法性能比较研究的结果，以证明它们持续的高性能。本节随后讨论了构建预测模型的过程。它描述了你将能够利用涵盖的工具解决的问题类型，以及在设置问题和定义用于预测的特征时所拥有的灵活性。它描述了构建预测模型涉及的步骤流程以及![](img/Image00004.jpg)使其符合部署条件。


    ## 为什么这两个算法如此有用？


    几个因素使得惩罚线性回归和集成方法成为一个非常有用的集合。简单来说，在实践中遇到的绝大多数预测分析（函数近似）问题上，它们将提供最优或接近最优的性能，包括大数据集、小数据集、宽数据集、高瘦数据集、复杂问题和简单问题。这一断言的证据可以在
    Rich Caruana 及其同事的论文中找到：

    - “监督学习算法的经验比较”，由 Rich Caruana 和 Alexandru Niculescu-Mizil 编写


