    \n现在，正如观察到的，你可以大致画一条线性线来分离正负样本，这意味着一维空间中的线性不可分问题在二维空间中变成了线性可分的！\n\n回顾多项式核表达式：\n\
    \n```\nK(xi˙→, xj˙→) = [xi˙→ ∙ xj˙→ + 2]²\n            = xi xj + 2²\n        \
    \    = 4 xi xj + xi² xj² + 4\n            = (2, xi, xi², 2) ⋅ (2, xj, xj², 2)\n\
    ```\n\n使用核函数计算变换后支持向量点积的神奇之处在于，我们实际上不需要变换每个单独的支持向量（例如从 `xi` 到 `(2, xi, xi², 2)`）然后计算它们的点积。我们只需将原始支持向量代入核函数（例如\
    \ `K(xi˙→, xj˙→) = [xi˙→ ∙ xj˙→ + 2]²`），因为这实际上等于变换后支持向量的点积（例如 `Öxi˙→ ∙ Öxj˙→ =\
    \ (2, xi, xi², 2) ⋅ (2, xj, xj², 2)`）。\n\n回顾在线性可分情况一节中，我们推导出了以下方程：\n\n```\n∑i\
    \ αi yi xi˙→ ⋅ u˙→ + b = 1  if u˙→ 是正支持向量\n∑i αi yi xi˙→ ⋅ u˙→ + b = -1 if u˙→\
    \ 是负支持向量\n超平面: ∑i αi yi xi˙→ ⋅ u˙→ + b = 0\n∑i αi yi = 0\n```\n\n如前所述，在线性不可分情况下，我们不再基于原始支持向量计算\
    \ `xi˙→ ⋅ u˙→`，而是基于变换后的支持向量计算 `Öxi˙→ ∙ Öu˙→`，这可以用核函数 `K(xi˙→, u˙→)` 表示。\n\n因此，上述\
    \ 4 个方程都需要相应更新：\n\n```\n∑i αi yi K(xi˙→, u˙→) + b = 1  if u˙→ 是正支持向量\n∑i αi yi\
    \ K(xi˙→, u˙→) + b = -1 if u˙→ 是负支持向量\n超平面: ∑i αi yi K(xi˙→, u˙→) + b = 0\n∑i\
    \ αi yi = 0\n```\n\n# 7.5 支持向量机数值示例与代码对比：使用多项式核的线性不可分情况\n\n在本节中，我们将使用上一节末尾所示的更新方程，配合多项式核来求解上述线性不可分数据集。数据点如图（**7.10**）和表\
    \ **7.3** 所示。\n\n![图 (7.10) 用于带多项式核 SVM 的一维空间线性不可分数据集绘图](img/9789815136982-C7-F10.jpg)\n\
    \n### 表 7.3 用于带多项式核 SVM 的线性不可分数据集\n\n| X | y |\n|---|---|\n| 1 | -1 |\n| 2 | -1\
    \ |\n| 0 | 1 |\n| 3 | 1 |\n\n```\n∑i αi yi K(xi˙→, u˙→) + b = 1  if u˙→ 是正支持向量\n\
    ∑i αi yi K(xi˙→, u˙→) + b = -1 if u˙→ 是负支持向量\n∑i αi yi = 0\n```\n\n现在，令 `âi =\
    \ αi yi`，然后展开方程：\n\n```\nâ1 K(x1˙→, x1˙→) + â2 K(x2˙→, x1˙→) + â3 K(x3˙→, x1˙→)\
    \ + â4 K(x4˙→, x1˙→) + b = -1  when u˙→ = x1˙→\nâ1 K(x1˙→, x2˙→) + â2 K(x2˙→,\
    \ x2˙→) + â3 K(x3˙→, x2˙→) + â4 K(x4˙→, x2˙→) + b = -1  when u˙→ = x2˙→\nâ1 K(x1˙→,\
    \ x3˙→) + â2 K(x2˙→, x3˙→) + â3 K(x3˙→, x3˙→) + â4 K(x4˙→, x3˙→) + b = 1   when\
    \ u˙→ = x3˙→\nâ1 K(x1˙→, x4˙→) + â2 K(x2˙→, x4˙→) + â3 K(x3˙→, x4˙→) + â4 K(x4˙→,\
    \ x4˙→) + b = 1   when u˙→ = x4˙→\nâ1 + â2 + â3 + â4 = 0\n```\n\n注意：由于它是一维的，`xi˙→\
    \ = xi`；`x1` 和 `x2` 是 2 个负样本；`x3` 和 `x4` 是 2 个正样本。\n\n多项式核函数：\n\n```\nK(xi˙→,\
    \ xj˙→) = [ã xi˙→ ∙ xj˙→ + r]^d\n```\n\n设 `ã = 1`，`r = 2`，`d = 2`，则：\n\n```\n\
    K(xi˙→, xj˙→) = [xi˙→ ∙ xj˙→ + 2]²\n```\n\n所以：\n\n```\nK(x1˙→, x1˙→) = [1∙1+2]²\
    \ = 9;   K(x2˙→, x1˙→) = [2∙1+2]² = 16\nK(x3˙→, x1˙→) = [0∙1+2]² = 4;   K(x4˙→,\
    \ x1˙→) = [3∙1+2]² = 25\n\nK(x1˙→, x2˙→) = [1∙2+2]² = 16;  K(x2˙→, x2˙→) = [2∙2+2]²\
    \ = 36\nK(x3˙→, x2˙→) = [0∙2+2]² = 4;   K(x4˙→, x2˙→) = [3∙2+2]² = 64\n\nK(x1˙→,\
    \ x3˙→) = [1∙0+2]² = 4;   K(x2˙→, x3˙→) = [2∙0+2]² = 4\nK(x3˙→, x3˙→) = [0∙0+2]²\
    \ = 4;   K(x4˙→, x3˙→) = [3∙0+2]² = 4\n\nK(x1˙→, x4˙→) = [1∙3+2]² = 25;  K(x2˙→,\
    \ x4˙→) = [2∙3+2]² = 64\nK(x3˙→, x4˙→) = [0∙3+2]² = 4;   K(x4˙→, x4˙→) = [3∙3+2]²\
    \ = 121\n```\n\n然后，将值代入方程：\n\n```\n9â1 + 16â2 + 4â3 + 25â4 + b = -1\n16â1 + 36â2\
    \ + 4â3 + 64â4 + b = -1\n4â1 + 4â2 + 4â3 + 4â4 + b = 1\n25â1 + 64â2 + 4â3 + 121â4\
    \ + b = 1\nâ1 + â2 + â3 + â4 = 0\n```\n\n求解这个线性方程组得到如下多组解：\n\n```\nâ1 = 2.375\
    \ - 3â3\nâ2 = -4 + 3â3\nâ3 是自由变量\nâ4 = 1.625 - â3\nb = 1\n```\n\n当取 `â3 = 1` 时：\n\
    \n```\nâ1 = -0.625\nâ2 = -1\nâ3 = 1\nâ4 = 0.625\nb = 1\n```\n\n超平面：`∑i αi yi K(xi˙→,\
    \ u˙→) + b = 0`\n\n```\n∴ â1 K(x1˙→, u˙→) + â2 K(x2˙→, u˙→) + â3 K(x3˙→, u˙→)\
    \ + â4 K(x4˙→, u˙→) + b = 0\n```\n\n我们已经找到 `â1, â2, â3, â4, b`，且 `x1˙→, x2˙→,\
    \ x3˙→, x4˙→` 已知。\n\n核函数 `K(xi˙→, xj˙→) = [xi˙→ ∙ xj˙→ + 2]²` 也已知。\n\n此外，由于一维，`u˙→\
    \ = u`。\n\n所以，超平面本质上是满足以下方程的那些 `u˙→`（一个易解的二次方程）：\n\n```\n-0.625[u+2]² - 1[u+2]²\
    \ + 4 + 0.625[3u+2]² + 1 = 0\n-0.625u² - 2.5u - 2.5 - 4u² - 8u - 4 + 4 + 5.625u²\
    \ + 7.5u + 2.5 + 1 = 0\n-0.625u² - 4u² + 5.625u² - 2.5u - 8u + 7.5u - 2.5 - 4\
    \ + 4 + 2.5 + 1 = 0\nu² - 3u + 1 = 0\n```\n\n```\nu = 0.382 或 2.618\n```\n\n有了这些，正负类别清晰可辨，如图（**7.11**）所示。\n\
    \n![图 (7.11) 由带多项式核的 SVM 在一维空间确定的超平面 (u=0.382 或 2.618) 示意图](img/9789815136982-C7-F11.jpg)\n\
    \n现在让我们将上述获得的结果与 `scikit-learn` 库提供的现成 SVM 分类器使用多项式核的结果进行比较。\n\n完整代码文件可以从我们的 Google\
    \ Drive 共享文件夹下载：\n\n[`drive.google.com/drive/folders/1FqJvo4ZPazNbEH_GlHFoodqvegnQmHcn?usp=share_link`](https://drive.google.com/drive/folders/1FqJvo4ZPazNbEH_GlHFoodqvegnQmHcn?usp=share_link)\n\
