    | ... | ... | ... | ... | ... |

    | 499,996 | 1.1466 | 0.7949 | 0.00004110 | 0.0636 |

    | 499,997 | 1.1466 | 0.7949 | 0.00003797 | 0.0636 |

    | 499,998 | 1.1466 | 0.7949 | 0.00003485 | 0.0636 |

    | 499,999 | 1.1466 | 0.7949 | 0.00003172 | 0.0636 |

    | 500,000 | 1.1466 | 0.7949 | 0.00002860 | 0.0636 |


    ![](Images/9789815136982-C3-F2.jpg)


    **Fig. 3.2** Mean squared error (MSE) *vs*. learning iteration for training the
    L1 regularized linear regression model.


    As can be seen from **Table 3.3** and **Fig. 3.2**, MSE finally stabilizes at
    0.0636, which suggests that we have trained a good linear regression model under
    L1 regularization. The final obtained bias and weights are `b=1.1466`, `w1=0.7949`
    and `w2=0.00002860`. One important highlight of L1 regularization is that it shrinks
    the weights of the features it deems less important, often to zero, effectively
    serving as a method for feature selection. However, it is worth noting that these
    "less important" features are determined by the model and data, and may or may
    not align with domain-specific knowledge or broader context. The resulting linear
    regression model can be written as:


    `Y = b + ∑(j=1 to 2) wj ⋅ normalized Xj`


    Here, `b=1.1466`, `w1=0.7949` and `w2=0.00002860`.


    As Max-min normalization was performed during the training process, it needs to
    be reflected in the final model as well. That is why `normalized Xj` is shown
    here.


    Now, we can use this trained linear regression model to make predictions for previously
    unseen data (*i.e.*, new data). For instance, there is a new house with 1200 sqft
    and 3 bedrooms. To predict the price of the house, normalization needs to be applied
    first using the maximum and minimum values of each respective feature from the
    training dataset. Recall that the maximum and minimum of `size_sqft` are 1600
    and 740; the maximum and minimum of `num_bedrooms` are 5 and 2. So, the `normalized
    X1` for `size_sqft` and `normalized X2` for `num_bedrooms` will be:


    `normalized X1 = (1200 - 740) / (1600 - 740) = 0.5349`


    `normalized X2 = (3 - 2) / (5 - 2) = 0.3333`


    Next, plug the normalized feature values into the equation of linear regression
    model:


    `Y = b + ∑(j=1 to 2) wj ⋅ normalized Xj = 1.1466 + 0.7949 × 0.5349 + 0.00002860
    × 0.3333 = 1.572`


    Therefore, for the house with 1200 sqft and 3 bedrooms, the sale price is predicted
    to be 1.572 million dollars.


