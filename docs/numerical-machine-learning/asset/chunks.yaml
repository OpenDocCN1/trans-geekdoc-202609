    # Introduction to Machine Learning


    **Zhiyuan Wang**, **Sayed Ameenuddin Irfan**, **Christopher Teoh**, **Priyanka
    Hriday Bhoyar**


    ## Abstract


    Machine learning, a rapidly growing subfield of computer science, has had a significant
    impact on many industries and our lives. This chapter discusses the brief history
    of machine learning, its widespread adoption as a de facto feature, and fundamental
    concepts such as supervised and unsupervised learning, regression and classification,
    and underfitting and overfitting. We also emphasize the importance of understanding
    machine learning through numerical examples, which can bridge the gap between
    abstract mathematical theories and practical applications of machine learning
    algorithms. By developing a strong foundation in machine learning, readers/students
    can harness its potential to address challenges and opportunities across diverse
    sectors.


    **Keywords:** Numerical Examples, Machine Learning History, Supervised Learning,
    Unsupervised Learning, Regression, Classification, Underfitting, Overfitting.


    ## 1.1 Brief History of Machine Learning


    Machine learning is a subfield of computer science that involves the creation
    of algorithms that can learn from data and make predictions. It has a long and
    rich history [[1]](#9789815136982-C1.html#r1), with roots dating back to the 1950s
    when the field of artificial intelligence was founded. This field focused on developing
    machines that could perform tasks that typically require human-like intelligence,
    such as recognizing patterns, learning from experience, and making decisions.
    The first machine learning algorithms were developed in the 1960s, including decision
    tree and nearest neighbor algorithms. The 1980s saw the rapid growth of the field
    with the development of algorithms such as artificial neural network and support
    vector machine. These algorithms were applied to a wide range of applications
    in the 1990s, including natural language processing, computer vision, and speech
    recognition. In the 2000s, the field continued to evolve with the development
    of new algorithms, such as gradient boosting, and the increasing use of machine
    learning in industries such as finance and healthcare. The 2010s saw the widespread
    adoption of machine learning, aided by the advent of big data and the development
    of powerful graphics processing units (GPU) that could be used to train large
    and complex machine learning models. The subfield of deep learning [[2]](#9789815136982-C1.html#r2),
    which typically involves the use of multi-layered neural networks, became particularly
    popular and found application across a diverse range of domains. Today, machine
    learning is a rapidly growing field that is currently being applied in various
    sectors. It has the potential to revolutionize many industries and has already
    had a significant societal impact.


    ## 1.2 Machine Learning as a De Facto Feature


    Machine learning is expected to be a transformative technology over the next two
    decades due to several factors. One key factor is the increasing availability
    of data, which is expected to continue to grow significantly in the coming years.
    As machine learning algorithms are particularly well suited for analyzing and
    making sense of large amounts of data, this will create new opportunities for
    their application in a variety of fields, including but not limited to healthcare,
    finance, transportation, education, manufacturing, and beyond. In these and other
    areas, machine learning has been adopted to automate some tasks that are currently
    performed by humans, freeing up humans to focus on more creative and high-level
    work [[3]](#9789815136982-C1.html#r3).

    '
