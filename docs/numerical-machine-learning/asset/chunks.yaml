    Take the input values of the third training sample and calculate the predicted
    yˆ3:


    yˆ3=b+∑j=1n  wjx3j=b+w1x31+w2x32=0.009320+0.006165×0+0.006560×0=0.009320


    Calculate the value of ∂L∂b:


    ∂L∂b=∑i=1m  2yi-yˆi(-1)


    \=2×(2.28-0.02205)×(-1)+2×(1.5-0.01699)×(-1)+2×(0.88-0.009320)×(-1)


    \=-9.2233


    Calculate the value of ∂L∂w1:


    ∂L∂w1=∑i=1m  2yi-yˆi(-1)xi1+2ëw1


    \=2×(2.28-0.02205)×(-1)×1+2×(1.5-0.01699)×(-1)×0.5349+2×(0.88-0.009320)×(-1)×0+2×0.1×0.006165


    \=-6.1012


    Calculate the value of ∂L∂w2:


    ∂L∂w2=∑i=1m  2yi-yˆi(-1)xi2+2ëw2


    \=2×(2.28-0.02205)×(-1)×1+2×(1.5-0.01699)×(-1)×0.6667+2×(0.88-0.009320)×(-1)×0+2×0.1×0.006560


    \=-6.4920


    Update the b value:


    bnew =bold -∂L∂b⋅á=0.009320-(-9.2233)×0.001=0.01854


    Update the w1 value:


    w1 new =w1 old -∂L∂w1⋅α=0.006165--6.1012×0.001=0.01227


    Update the w2 value:


    w2 new =w2 old -∂L∂w2⋅α=0.006560--6.4920×0.001=0.01305


    ### 3.6.4. End the Second Iteration of Learning


    At the end of the second iteration of learning with L2 regularization, we get
    a set of newly updated bias and weights, *i.e.*, b=0.01854,w1=0.01227 and w2=0.01305.
    With these, the latest MSE can be calculated, as follows:


    MSE=∑i=1m  yi-yˆi2m=\[2.28-(0.01854+0.01227×1+0.01305×1)\]23+\[1.5-(0.01854+0.01227×0.5349+0.01305×0.6667)\]23+\[0.88-(0.01854+0.01227×0+0.01305×0)\]23=2.6307


    Compared with the previous MSE=2.6853 after the first iteration, it is noticed
    that the MSE is reduced to 2.6307, indicating that the performance of the linear
    regression model has been improving, though slowly, due to the small learning
    rate.'
  fmt: "\nLet us use lowercase xi to denote the feature values of the ith sample (out\
    \ of the total m rows of samples from the training dataset), then xij will be\
    \ the value of the jth feature (out of the total n input features) at the ith\
    \ sample, as shown in [Fig. (3.1)](#9789815136982-C3.html#f3.1). Lowercase yi\
    \ is used to represent the known output value (*i.e.*, true output value) of the\
    \ ith sample, and y^i is used to denote the corresponding predicted output value\
    \ by the linear equation model. Equation (3.13) is then updated to Equation (3.14).\n\
    \n`y^i = b + ∑j=1n wj xij`   (3.14)\n\nHere,\n\n*   `i ∈ [1, m]`: `m` is the number\
    \ of training samples\n*   `xij`: value of the jth feature at the ith sample\n\
    *   `b`: bias\n*   `n`: number of input features\n*   `wj`: weight of the jth\
    \ feature\n*   `y^i`: predicted value for the ith sample\n\nUp to this step, everything\
    \ is the same as the original linear regression discussed in Chapter 2. The key\
    \ difference brought by L2 regularization is the introduction of the penalty term\
    \ `λ||W||²₂` (*i.e.*, penalty coefficient multiplies the squared L2 norm of weights)\
    \ to the loss function, as follows:\n\n`L = m⋅MSE + λ||W||²₂ = m⋅∑i=1m (yi - y^i)²/m\
    \ + λ||W||²₂ = ∑i=1m (yi - y^i)² + λ||W||²₂`   (3.15)\n\nHere,\n\n*   `L`: loss\
    \ between true and predicted outputs\n*   `m`: number of training samples\n* \
    \  `yi`: true value for the ith sample\n*   `y^i`: predicted value for the ith\
    \ sample\n*   `λ`: penalty coefficient\n*   `||W||²₂`: squared L2 norm of weights,\n\
    \    `||W||²₂ = ∑j=1n wj² = w1² + w2² + … + wn²`\n\nA gradient descent optimization\
    \ algorithm is utilized to find the optimal bias and weights by iteratively tweaking\
    \ their values a tiny bit at a time in the direction of reducing the loss. Before\
    \ that, we need to find the partial derivative of the mean loss (`L`) with respect\
    \ to the bias and weights, namely, `∂L/∂b` and `∂L/∂wj`, denoting the contribution\
    \ to the mean loss by the bias and each of the weights.\n\n```\n∂L/∂b = ∂∑i=1m\
    \ (yi - y^i)²/∂b + ∂λ||W||²₂/∂b\n      = ∂∑i=1m (yi - y^i)²/∂y^i ⋅ ∂y^i/∂b + 0\
    \          (3.16)\n```\n\n`∂y^i/∂b = 1`   (3.17)\n\n`∴ ∂L/∂b = ∑i=1m 2(yi - y^i)(-1)`  \
    \ (3.18)\n\n`∂y^i/∂wj = xij`   (3.19)\n\n```\n∂L/∂wj = ∂∑i=1m (yi - y^i)²/∂wj\
    \ + ∂λ||W||²₂/∂wj\n       = ∂∑i=1m (yi - y^i)²/∂y^i ⋅ ∂y^i/∂wj + ∂λ(w1²+w2²+…+wj²+…+wn²)/∂wj\n\
    \       = ∑i=1m 2(yi - y^i)(-1)xij + 2λwj                (3.20)\n```\n\nHere,\
    \ `j ∈ [1, n]` and `n` is the number of features.\n\nSubsequently, gradient descent\
    \ is used to update the bias, `b` (Equation 3.21) and the weights, `w` (Equation\
    \ 3.22).\n\n`b_new = b_old - ∂L/∂b ⋅ α`   (3.21)\n\n`wj_new = wj_old - ∂L/∂wj\
    \ ⋅ α`   (3.22)\n\nHere, `α` is the learning rate (typically a small value, *e.g.*,\
    \ 0.1, 0.01, 0.001).\n\n## 3.6. Numerical Example of L2 Regularization for Linear\
    \ Regression\n\nSame as the original linear regression discussed in Chapter 2\
    \ and the L1 regularized linear regression discussed in Section 3.3 of the current\
    \ chapter, we employ a small training dataset presented in (Table **3.1**) with\
    \ only 3 samples (*i.e.*, `m=3`), which pertains to the sale price of houses in\
    \ millions of dollars (abbreviated as `sale_price_million`) based on 2 input features\
    \ (*i.e.*, `n=2`), namely, the size of house in square feet (abbreviated as `size_sqft`)\
    \ and the total number of bedrooms in house (abbreviated as `num_bedrooms`). In\
    \ other words, for this example, `X` is `size_sqft` and `num_bedrooms`, and `Y`\
    \ is `sale_price_million`. Our task is to build a best-fit linear regression model\
    \ that maps the `X` and `Y` under L2 regularization.\n\nNext, normalize the feature\
    \ values (*i.e.*, the values of `size_sqft` and `num_bedrooms` columns) to bring\
    \ them to a common scale between 0 and 1, using Max-min normalization, as shown\
    \ in Equation (3.12). The small dataset after Max-min normalization on the features\
    \ is presented in (Table **3.2**).\n\nNow, let us start the machine learning process\
    \ to build a linear regression model with L2 regularization.\n\nInitialize the\
    \ bias:\n`b = 0`\n\nInitialize the weight for feature `size_sqft`:\n`w1 = 0`\n\
    \nInitialize the weight for feature `num_bedrooms`:\n`w2 = 0`\n\nSet the learning\
    \ rate:\n`α = 0.001`\n\nSet the penalty coefficient:\n`λ = 0.1`\n\nNote that for\
    \ simplicity of writing and expression, all the following `xij` refers to the\
    \ normalized `xij` by default, unless otherwise stated.\n\n### 3.6.1. Start the\
    \ First Iteration of Learning\n\nTake the input values of the first training sample\
    \ and calculate the predicted `y^1`:\n\n`y^1 = b + ∑j=1n wj x1j = b + w1 x11 +\
    \ w2 x12 = 0 + 0×1 + 0×1 = 0`\n\nTake the input values of the second training\
    \ sample and calculate the predicted `y^2`:\n\n`y^2 = b + ∑j=1n wj x2j = b + w1\
    \ x21 + w2 x22 = 0 + 0×0.5349 + 0×0.6667 = 0`\n\nTake the input values of the\
    \ third training sample and calculate the predicted `y^3`:\n\n`y^3 = b + ∑j=1n\
    \ wj x3j = b + w1 x31 + w2 x32 = 0 + 0×0 + 0×0 = 0`\n\nCalculate the value of\
    \ `∂L/∂b`:\n\n```\n∂L/∂b = ∑i=1m 2(yi - y^i)(-1)\n      = 2×(2.28-0)×(-1) + 2×(1.5-0)×(-1)\
    \ + 2×(0.88-0)×(-1)\n      = -9.3200\n```\n\nCalculate the value of `∂L/∂w1`:\n\
    \n```\n∂L/∂w1 = ∑i=1m 2(yi - y^i)(-1)xi1 + 2λw1\n       = 2×(2.28-0)×(-1)×1 +\
    \ 2×(1.5-0)×(-1)×0.5349 + 2×(0.88-0)×(-1)×0 + 2×0.1×0\n       = -6.1647\n```\n\
    \nCalculate the value of `∂L/∂w2`:\n\n```\n∂L/∂w2 = ∑i=1m 2(yi - y^i)(-1)xi2 +\
    \ 2λw2\n       = 2×(2.28-0)×(-1)×1 + 2×(1.5-0)×(-1)×0.6667 + 2×(0.88-0)×(-1)×0\
    \ + 2×0.1×0\n       = -6.5601\n```\n\nUpdate the `b` value:\n`b_new = b_old -\
    \ ∂L/∂b ⋅ α = 0 - (-9.3200)×0.001 = 0.009320`\n\nUpdate the `w1` value:\n`w1_new\
    \ = w1_old - ∂L/∂w1 ⋅ α = 0 - (-6.1647)×0.001 = 0.006165`\n\nUpdate the `w2` value:\n\
    `w2_new = w2_old - ∂L/∂w2 ⋅ α = 0 - (-6.5601)×0.001 = 0.006560`\n\n### 3.6.2.\
    \ End the First Iteration of Learning\n\nNow after the very first iteration of\
    \ learning, there is a set of newly updated bias and weights, *i.e.*, `b=0.009320`,\
    \ `w1=0.006165` and `w2=0.006560`. With these, the latest MSE can be calculated\
    \ as follows:\n\n```\nMSE = ∑i=1m (yi - y^i)²/m\n    = [2.28 - (0.009320 + 0.006165×1\
    \ + 0.006560×1)]²/3\n    + [1.5 - (0.009320 + 0.006165×0.5349 + 0.006560×0.6667)]²/3\n\
    \    + [0.88 - (0.009320 + 0.006165×0 + 0.006560×0)]²/3\n    = 2.6853\n```\n\n\
    So, the latest MSE after the first iteration of learning with L2 regularization\
    \ is 2.6853. Next, it will continue with the second iteration.\n\n### 3.6.3. Start\
    \ the Second Iteration of Learning\n\nTake the input values of the first training\
    \ sample and calculate the predicted `y^1`:\n\n`y^1 = b + ∑j=1n wj x1j = b + w1\
    \ x11 + w2 x12 = 0.009320 + 0.006165×1 + 0.006560×1 = 0.02205`\n\nTake the input\
    \ values of the second training sample and calculate the predicted `y^2`:\n\n\
    `y^2 = b + ∑j=1n wj x2j = b + w1 x21 + w2 x22 = 0.009320 + 0.006165×0.5349 + 0.006560×0.6667\
    \ = 0.01699`\n\nTake the input values of the third training sample and calculate\
    \ the predicted `y^3`:\n\n`y^3 = b + ∑j=1n wj x3j = b + w1 x31 + w2 x32 = 0.009320\
    \ + 0.006165×0 + 0.006560×0 = 0.009320`\n\nCalculate the value of `∂L/∂b`:\n\n\
    ```\n∂L/∂b = ∑i=1m 2(yi - y^i)(-1)\n      = 2×(2.28-0.02205)×(-1) + 2×(1.5-0.01699)×(-1)\
    \ + 2×(0.88-0.009320)×(-1)\n      = -9.2233\n```\n\nCalculate the value of `∂L/∂w1`:\n\
    \n```\n∂L/∂w1 = ∑i=1m 2(yi - y^i)(-1)xi1 + 2λw1\n       = 2×(2.28-0.02205)×(-1)×1\
    \ + 2×(1.5-0.01699)×(-1)×0.5349 + 2×(0.88-0.009320)×(-1)×0 + 2×0.1×0.006165\n\
    \       = -6.1012\n```\n\nCalculate the value of `∂L/∂w2`:\n\n```\n∂L/∂w2 = ∑i=1m\
    \ 2(yi - y^i)(-1)xi2 + 2λw2\n       = 2×(2.28-0.02205)×(-1)×1 + 2×(1.5-0.01699)×(-1)×0.6667\
    \ + 2×(0.88-0.009320)×(-1)×0 + 2×0.1×0.006560\n       = -6.4920\n```\n\nUpdate\
    \ the `b` value:\n`b_new = b_old - ∂L/∂b ⋅ α = 0.009320 - (-9.2233)×0.001 = 0.01854`\n\
    \nUpdate the `w1` value:\n`w1_new = w1_old - ∂L/∂w1 ⋅ α = 0.006165 - (-6.1012)×0.001\
    \ = 0.01227`\n\nUpdate the `w2` value:\n`w2_new = w2_old - ∂L/∂w2 ⋅ α = 0.006560\
    \ - (-6.4920)×0.001 = 0.01305`\n\n### 3.6.4. End the Second Iteration of Learning\n\
    \nAt the end of the second iteration of learning with L2 regularization, we get\
    \ a set of newly updated bias and weights, *i.e.*, `b=0.01854`, `w1=0.01227` and\
    \ `w2=0.01305`. With these, the latest MSE can be calculated, as follows:\n\n\
    ```\nMSE = ∑i=1m (yi - y^i)²/m\n    = [2.28 - (0.01854 + 0.01227×1 + 0.01305×1)]²/3\n\
    \    + [1.5 - (0.01854 + 0.01227×0.5349 + 0.01305×0.6667)]²/3\n    + [0.88 - (0.01854\
    \ + 0.01227×0 + 0.01305×0)]²/3\n    = 2.6307\n```\n\nCompared with the previous\
    \ MSE=2.6853 after the first iteration, it is noticed that the MSE is reduced\
    \ to 2.6307, indicating that the performance of the linear regression model has\
    \ been improving, though slowly, due to the small learning rate.\n"
  trans: "\n\n让我们用小写 xi 来表示第 i 个样本的特征值（来自训练数据集总共 m 行样本），那么 xij 将是第 i 个样本处第 j 个特征的值（来自总共\
    \ n 个输入特征），如 图 (3.1) 所示。小写 yi 用于表示第 i 个样本的已知输出值（即真实输出值），而 y^i 用于表示线性方程模型对应的预测输出值。因此，公式\
    \ (3.13) 更新为公式 (3.14)。\n\n`y^i = b + ∑j=1n wj xij`   (3.14)\n\n其中，\n\n*   `i ∈\
    \ [1, m]`：`m` 是训练样本的数量\n*   `xij`：第 i 个样本处第 j 个特征的值\n*   `b`：偏置\n*   `n`：输入特征的数量\n\
    *   `wj`：第 j 个特征的权重\n*   `y^i`：第 i 个样本的预测值\n\n到目前为止，一切与第 2 章讨论的原始线性回归相同。L2 正则化带来的关键差异是向损失函数引入了惩罚项\
    \ `λ||W||²₂`（即惩罚系数乘以权重的平方 L2 范数），如下所示：\n\n`L = m⋅MSE + λ||W||²₂ = m⋅∑i=1m (yi\
    \ - y^i)²/m + λ||W||²₂ = ∑i=1m (yi - y^i)² + λ||W||²₂`   (3.15)\n\n其中，\n\n*  \
    \ `L`：真实输出与预测输出之间的损失\n*   `m`：训练样本的数量\n*   `yi`：第 i 个样本的真实值\n*   `y^i`：第 i 个样本的预测值\n\
    *   `λ`：惩罚系数\n*   `||W||²₂`：权重的平方 L2 范数，\n    `||W||²₂ = ∑j=1n wj² = w1² + w2²\
    \ + … + wn²`\n\n利用梯度下降优化算法，通过沿着减少损失的方向每次微调极小的数值，迭代地寻找最优偏置和权重。在此之前，我们需要求出平均损失（`L`）关于偏置和权重的偏导数，即\
    \ `∂L/∂b` 和 `∂L/∂wj`，它们表示偏置和各个权重对平均损失的贡献。\n\n```\n∂L/∂b = ∂∑i=1m (yi - y^i)²/∂b\
    \ + ∂λ||W||²₂/∂b\n      = ∂∑i=1m (yi - y^i)²/∂y^i ⋅ ∂y^i/∂b + 0          (3.16)\n\
    ```\n\n`∂y^i/∂b = 1`   (3.17)\n\n`∴ ∂L/∂b = ∑i=1m 2(yi - y^i)(-1)`   (3.18)\n\n\
    `∂y^i/∂wj = xij`   (3.19)\n\n```\n∂L/∂wj = ∂∑i=1m (yi - y^i)²/∂wj + ∂λ||W||²₂/∂wj\n\
    \       = ∂∑i=1m (yi - y^i)²/∂y^i ⋅ ∂y^i/∂wj + ∂λ(w1²+w2²+…+wj²+…+wn²)/∂wj\n \
    \      = ∑i=1m 2(yi - y^i)(-1)xij + 2λwj                (3.20)\n```\n\n这里，`j ∈\
    \ [1, n]`，且 `n` 是特征的数量。\n\n随后，使用梯度下降来更新偏置 `b`（公式 3.21）和权重 `w`（公式 3.22）。\n\n`b_new\
    \ = b_old - ∂L/∂b ⋅ α`   (3.21)\n\n`wj_new = wj_old - ∂L/∂wj ⋅ α`   (3.22)\n\n\
    这里，`α` 是学习率（通常为较小的值，例如 0.1、0.01、0.001）。\n\n## 3.6. 线性回归 L2 正则化的数值示例\n\n与第 2 章讨论的原始线性回归以及本章\
    \ 3.3 节讨论的 L1 正则化线性回归一样，我们采用一个小型训练数据集，如（表 **3.1**）所示，仅包含 3 个样本（即 `m=3`），涉及以百万美元为单位的房屋销售价格（简写为\
    \ `sale_price_million`），基于 2 个输入特征（即 `n=2`），分别为房屋面积（平方英尺，简写为 `size_sqft`）和房屋卧室总数（简写为\
    \ `num_bedrooms`）。换句话说，对于这个例子，`X` 是 `size_sqft` 和 `num_bedrooms`，`Y` 是 `sale_price_million`。我们的任务是构建一个在\
    \ L2 正则化下将 `X` 和 `Y` 映射的最佳拟合线性回归模型。\n\n接下来，使用最大-最小归一化（如公式 (3.12) 所示）将特征值（即 `size_sqft`\
    \ 和 `num_bedrooms` 列的值）归一化，使它们处于 0 到 1 的通用尺度上。特征经过最大-最小归一化后的小型数据集如（表 **3.2**）所示。\n\
    \n现在，让我们开始机器学习过程，构建一个带有 L2 正则化的线性回归模型。\n\n初始化偏置：\n`b = 0`\n\n初始化特征 `size_sqft`\
    \ 的权重：\n`w1 = 0`\n\n初始化特征 `num_bedrooms` 的权重：\n`w2 = 0`\n\n设置学习率：\n`α = 0.001`\n\
    \n设置惩罚系数：\n`λ = 0.1`\n\n注意，为了书写和表达的简便，除非另有说明，以下所有 `xij` 默认均指归一化后的 `xij`。\n\n###\
    \ 3.6.1. 开始学习的第一次迭代\n\n取第一个训练样本的输入值并计算预测 `y¹`：\n\n`y¹ = b + ∑j=1n wj x1j = b +\
    \ w1 x11 + w2 x12 = 0 + 0×1 + 0×1 = 0`\n\n取第二个训练样本的输入值并计算预测 `y²`：\n\n`y² = b +\
    \ ∑j=1n wj x2j = b + w1 x21 + w2 x22 = 0 + 0×0.5349 + 0×0.6667 = 0`\n\n取第三个训练样本的输入值并计算预测\
    \ `y³`：\n\n`y³ = b + ∑j=1n wj x3j = b + w1 x31 + w2 x32 = 0 + 0×0 + 0×0 = 0`\n\
    \n计算 `∂L/∂b` 的值：\n\n```\n∂L/∂b = ∑i=1m 2(yi - y^i)(-1)\n      = 2×(2.28-0)×(-1)\
    \ + 2×(1.5-0)×(-1) + 2×(0.88-0)×(-1)\n      = -9.3200\n```\n\n计算 `∂L/∂w1` 的值：\n\
    \n```\n∂L/∂w1 = ∑i=1m 2(yi - y^i)(-1)xi1 + 2λw1\n       = 2×(2.28-0)×(-1)×1 +\
    \ 2×(1.5-0)×(-1)×0.5349 + 2×(0.88-0)×(-1)×0 + 2×0.1×0\n       = -6.1647\n```\n\
    \n计算 `∂L/∂w2` 的值：\n\n```\n∂L/∂w2 = ∑i=1m 2(yi - y^i)(-1)xi2 + 2λw2\n       = 2×(2.28-0)×(-1)×1\
    \ + 2×(1.5-0)×(-1)×0.6667 + 2×(0.88-0)×(-1)×0 + 2×0.1×0\n       = -6.5601\n```\n\
    \n更新 `b` 值：\n`b_new = b_old - ∂L/∂b ⋅ α = 0 - (-9.3200)×0.001 = 0.009320`\n\n\
    更新 `w1` 值：\n`w1_new = w1_old - ∂L/∂w1 ⋅ α = 0 - (-6.1647)×0.001 = 0.006165`\n\n\
    更新 `w2` 值：\n`w2_new = w2_old - ∂L/∂w2 ⋅ α = 0 - (-6.5601)×0.001 = 0.006560`\n\n\
    ### 3.6.2. 结束学习的第一次迭代\n\n现在，经过第一次学习迭代，我们得到一组新更新的偏置和权重，即 `b=0.009320`、`w1=0.006165`\
    \ 和 `w2=0.006560`。利用这些，可以计算最新的 MSE，如下所示：\n\n```\nMSE = ∑i=1m (yi - y^i)²/m\n \
    \   = [2.28 - (0.009320 + 0.006165×1 + 0.006560×1)]²/3\n    + [1.5 - (0.009320\
    \ + 0.006165×0.5349 + 0.006560×0.6667)]²/3\n    + [0.88 - (0.009320 + 0.006165×0\
    \ + 0.006560×0)]²/3\n    = 2.6853\n```\n\n因此，带有 L2 正则化的第一次学习迭代后的最新 MSE 为 2.6853。接下来将继续进行第二次迭代。\n\
    \n### 3.6.3. 开始学习的第二次迭代\n\n取第一个训练样本的输入值并计算预测 `y¹`：\n\n`y¹ = b + ∑j=1n wj x1j =\
    \ b + w1 x11 + w2 x12 = 0.009320 + 0.006165×1 + 0.006560×1 = 0.02205`\n\n取第二个训练样本的输入值并计算预测\
    \ `y²`：\n\n`y² = b + ∑j=1n wj x2j = b + w1 x21 + w2 x22 = 0.009320 + 0.006165×0.5349\
    \ + 0.006560×0.6667 = 0.01699`\n\n取第三个训练样本的输入值并计算预测 `y³`：\n\n`y³ = b + ∑j=1n wj\
    \ x3j = b + w1 x31 + w2 x32 = 0.009320 + 0.006165×0 + 0.006560×0 = 0.009320`\n\
    \n计算 `∂L/∂b` 的值：\n\n```\n∂L/∂b = ∑i=1m 2(yi - y^i)(-1)\n      = 2×(2.28-0.02205)×(-1)\
    \ + 2×(1.5-0.01699)×(-1) + 2×(0.88-0.009320)×(-1)\n      = -9.2233\n```\n\n计算\
    \ `∂L/∂w1` 的值：\n\n```\n∂L/∂w1 = ∑i=1m 2(yi - y^i)(-1)xi1 + 2λw1\n       = 2×(2.28-0.02205)×(-1)×1\
    \ + 2×(1.5-0.01699)×(-1)×0.5349 + 2×(0.88-0.009320)×(-1)×0 + 2×0.1×0.006165\n\
    \       = -6.1012\n```\n\n计算 `∂L/∂w2` 的值：\n\n```\n∂L/∂w2 = ∑i=1m 2(yi - y^i)(-1)xi2\
    \ + 2λw2\n       = 2×(2.28-0.02205)×(-1)×1 + 2×(1.5-0.01699)×(-1)×0.6667 + 2×(0.88-0.009320)×(-1)×0\
    \ + 2×0.1×0.006560\n       = -6.4920\n```\n\n更新 `b` 值：\n`b_new = b_old - ∂L/∂b\
    \ ⋅ α = 0.009320 - (-9.2233)×0.001 = 0.01854`\n\n更新 `w1` 值：\n`w1_new = w1_old\
    \ - ∂L/∂w1 ⋅ α = 0.006165 - (-6.1012)×0.001 = 0.01227`\n\n更新 `w2` 值：\n`w2_new\
    \ = w2_old - ∂L/∂w2 ⋅ α = 0.006560 - (-6.4920)×0.001 = 0.01305`\n\n### 3.6.4.\
    \ 结束学习的第二次迭代\n\n在带有 L2 正则化的第二次学习迭代结束时，我们得到一组新更新的偏置和权重，即 `b=0.01854`、`w1=0.01227`\
    \ 和 `w2=0.01305`。利用这些，可以计算最新的 MSE，如下所示：\n\n```\nMSE = ∑i=1m (yi - y^i)²/m\n  \
    \  = [2.28 - (0.01854 + 0.01227×1 + 0.01305×1)]²/3\n    + [1.5 - (0.01854 + 0.01227×0.5349\
    \ + 0.01305×0.6667)]²/3\n    + [0.88 - (0.01854 + 0.01227×0 + 0.01305×0)]²/3\n\
    \    = 2.6307\n```\n\n与第一次迭代后的 MSE=2.6853 相比，可以注意到 MSE 降低到了 2.6307，表明线性回归模型的性能正在提升，尽管由于较小的学习率，提升速度较慢。\n\
    \n"
