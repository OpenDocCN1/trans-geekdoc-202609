    ## 8.4. SAMPLE CODES AND COMPARISON


    Now, let us compare the results obtained above with that from the off-the-shelf
    K-means model offered by the scikit-learn library.


    The complete code file can be downloaded from our shared folder in Google Drive:


    [https://drive.google.com/drive/folders/1FqJvo4ZPazNbEH\_GlHFoodqvegnQmHcn?usp=share\_link](https://drive.google.com/drive/folders/1FqJvo4ZPazNbEH_GlHFoodqvegnQmHcn?usp=share_link)


