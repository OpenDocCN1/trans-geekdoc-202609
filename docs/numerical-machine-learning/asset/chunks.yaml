    \ the algorithm, and be well-prepared to apply it in their practical applications.\n\
    \n**Keywords:** Linearly Separable, Linearly Non-Separable, Numerical Example,\
    \ Polynomial Kernel, Radial Basis Function Kernel, Support Vector Machine, Small\
    \ Dataset, Scikit-Learn.  \n\n## 7.1. INTRODUCTION TO SUPPORT VECTOR MACHINE\n\
    \nSupport vector machine (abbreviated as SVM) is a powerful and widely applicable\
    \ machine learning algorithm that has been successfully employed across various\
    \ domains, such as image and speech recognition, natural language processing,\
    \ bioinformatics, and finance, to name a few. The goal of the SVM algorithm is\
    \ to determine, in the space of N dimensions (where N is the number of features),\
    \ a hyperplane that classifies the data points in a clearly distinguishable manner.\
    \ It is defined in such a way that the margin distance between data points from\
    \ different classes is maximized in the N-dimensional space \\[[1](#9789815136982-C7.html#r1),\
    \ [2](#9789815136982-C7.html#r2)\\]. If the margin distance is maximized, then\
    \ subsequent new data points (previously unseen) will be classified with greater\
    \ confidence. For the linearly non-separable dataset, SVM primarily employs a\
    \ kernel function to map the original data to a high-dimensional Hilbert Space\
    \ to achieve linear separability and thereby resolve the linear non-separable\
    \ problem \\[[3](#9789815136982-C7.html#r3)\\]. Besides, it is worth mentioning\
    \ that support vectors are just the training data points that are closer to the\
    \ hyperplane. These data points are more relevant and critical to constructing\
    \ an SVM model, as they help determine the equation of the separating hyperplane\
    \ \\[[4](#9789815136982-C7.html#r4)\\]. Fig. ([**7.1**](#9789815136982-C7.html#f7.1))\
