    # 梯度提升算法演示


    ## 第一棵决策树 (m=1)


    注意，之所以我们知道找到的是最小总损失而非最大总损失，是因为隐式地使用了二阶导数 `d2∑i=1n Lyi,ãdã2`，其值为正数 3。


    将计算出的 `F0xi` 和 `ri1` 值追加到原始表格中：


    | | **num_bedrooms (xi)** | **sale_price_million (yi)** | `F0xi` | `ri1` |

    |---|---|---|---|---|

    | i=1 | 5 | 2.28 | 1.553 | 0.727 |

    | i=2 | 4 | 1.5 | 1.553 | −0.053 |

    | i=3 | 2 | 0.88 | 1.553 | −0.673 |


    可以看到，有趣的是，`ã` 值仅仅是第一个叶节点上残差值的平均值（即 `(r21+r31)/2 = (-0.053)+(-0.673) / 2 = -0.363`）。之所以出现这种情况，是因为我们策略性地选择了损失函数。


    类似地，第 2 个叶节点遵循类似的计算：


    对于 `j=2`，即第 2 个叶节点，`ã21 = argminã ∑xi∈R21 L(yi, F0xi + ã)`，即寻找使 `∑xi∈R21 L(yi,
    F0xi + ã)` 最小化的 `ã`。


    ∵ 只有第 1 个样本 (`x1`) 被分配到第 2 个叶节点 (`R21`)。


    利用一阶导数寻找最小值：


    ```

    d∑xi∈R21 L(yi, F0xi + ã) / dã = 0

    0.727 - ã - 1 = 0

    ã = 0.727

    ```


    ∴ `ã21 = 0.727`


    同样，这里的 `ã` 值也可以看作是第二个叶节点上单个残差值的平均值（即 `r11 / 1 = 0.727 / 1 = 0.727`）。


    至此，我们完成了步骤 2 的第一棵决策树（即 `m=1`）。


    假设在这个简单的数值示例中，梯度提升模型总共要构建 2 棵决策树（即 `M=2`）。让我们继续进行第 2 棵决策树的计算。


    ## 第二棵决策树 (m=2)


    `squared_error`（平方误差）是衡量分裂质量/纯度的指标。分裂后子节点的最优值为 0（即最纯的子节点）。*例如*，对于右侧的叶节点（即第 2 个叶节点），计算如下：


    这里，`Rjm` 表示第 `m` 棵树的第 `j` 个叶节点。在第 2 棵决策树中（即 `m = 2`），如下所示，只有 2 个叶节点，`R12` 和 `R22`。


    或者，基于我们在第一次迭代中发现的规律，每个叶节点的 `ã` 值仅仅是该叶节点上残差值的平均值。我们可以直接应用这一关系来简化计算：


    注意到第二棵决策树之后的最终结果（即 `F2xi` 值）比 `F1xi` 值更接近真实的 `yi` 值，这表明梯度提升回归模型的性能正在提升，我们走在正确的道路上！


    至此，我们完成了步骤 2 的第二棵决策树（即 `m=2`）。由于在本例中我们假设梯度提升模型仅包含 2 棵决策树，因此我们已完成整个步骤 2。


    ## 模型构建


    回顾一下，当 `m=2` 时，我们在步骤 2(d) 中使用了以下表达式：


    `F2(xi) = F1(xi) + á(ãj2 | xi ∈ Rj2)`


    不要忘记，当 `m=1` 时，我们在步骤 2(d) 中应用了以下表达式：


    `F1(xi) = F0(xi) + á(ãj1 | xi ∈ Rj1)`


    如果将它们串联起来，可以得到以下表达式：


    `F2(xi) = F0(xi) + á(ãj1 | xi ∈ Rj1) + á(ãj2 | xi ∈ Rj2)`


    这将是我们针对这个简单示例训练出的梯度提升回归模型！


    这里，`(ãj1 | xi ∈ Rj1)` 和 `(ãj2 | xi ∈ Rj2)` 分别是我们可以从第一棵和第二棵决策树中找到的值。`á` 是学习率，在本例中我们将其设为
    `0.5`。


    直观上，模型如下所示：


    ## 步骤 3：输出 Fm(x)


    最后，我们来到算法的第 3 步，也是最后一步，使用训练好的梯度提升回归模型对先前未见过的数据（即新数据）进行预测。例如，如果有一栋有 3 间卧室的房子，模型预测的价格将是：


    `F2(x) = 1.553 + 0.5 × (-0.363) + 0.5 × (-0.492) = 1.126`


    因此，对于这栋有 3 间卧室的房子，预测售价为 112.6 万美元。正如预期的那样，此时预测效果并不理想，因为我们的模型仅包含 2 棵浅层决策树，且仅使用
    3 个训练样本构建，仅用于演示。然而，这为构建更复杂、更准确的模型铺平了道路！我们现在对梯度提升算法在回归任务中每一步的工作原理有了清晰得多的理解。


    现在，让我们将上述获得的结果与 `scikit-learn` 库提供的现成梯度提升回归器的结果进行比较。


    完整的代码文件可以从我们在 Google Drive 上的共享文件夹下载：


    <https://drive.google.com/drive/folders/1FqJvo4ZPazNbEH_GlHFoodqvegnQmHcn?usp=share_link>


    从 `scikit-learn` 梯度提升回归器的结果可以看出，与我们手动计算的结果相比，生成了相同的决策树，决策树所有节点的 `squared_error`
    相同，所有叶节点的 gamma 值也相同（注意 `scikit-learn` 在决策树图示中简单地用 "value" 来表示 "gamma value"）。此外，对于
    3 个训练样本获得了相同的预测结果（即 `x1` 为 2.04，`x2` 为 1.495，`x3` 为 1.126）。最后，对于先前未见过的 3 卧室房子，也获得了相同的预测结果（即
    1.126）。


    # 6.4. 分类梯度提升的数学原理


    要理解分类梯度提升，我们必须首先回顾两个基本的统计学术语，即概率和几率。概率 (`P`) 表示事件发生的机会。几率只是相对概率的一种表达，定义为事件发生的概率与事件不发生的概率之比（即
    `odds = P / (1 - P)`）。例如，假设有 2 个蓝球和 1 个红球，


    梯度提升分类的算法与梯度提升回归的算法相同，只是损失函数不同，如表 **6.3** 所示。


    **表 6.3：分类梯度提升的伪代码与数学原理。**


    乍一看，分类梯度提升采用的损失函数显得有些奇特。它本质上源自我们在第 4 章中见过的逻辑回归损失函数，即交叉熵损失函数！


    `L = -yi log(Pi) + (1 - yi) log(1 - Pi)`


    这里，`Pi` 是第 `i` 个样本的预测概率（∈ [0, 1]），`yi` 是第 `i` 个样本的真实标签（例如 0 或 1）。


    然后，对交叉熵损失函数进行一系列变换：


    我们设定 `Fxi = log(oddsi)` 来表示第 `i` 个样本在映射为预测概率之前的预测值，映射公式为：`P = 1 / (1 + e^(-log(odds)))
    = e^(log(odds)) / (1 + e^(log(odds)))`


    注：这个 `P = 1 / (1 + e^(-log(odds)))` 是否让你想起了第 4 章逻辑回归中使用的 Sigmoid 函数？


    最后，在损失函数中用 `Fxi` 替换所有的 `log(oddsi)`：


    `L = -yi F(xi) + log(1 + e^(F(xi)))`


    因此，`L` 变成了 `yi` 和 `Fxi` 的函数：


    `L(yi, F(xi)) = -yi F(xi) + log(1 + e^(F(xi)))`


    这里，`yi` 代表真实输出（例如 0 或 1）；`Fxi` 代表预测值（这不是 0 到 1 范围内的预测概率）。


