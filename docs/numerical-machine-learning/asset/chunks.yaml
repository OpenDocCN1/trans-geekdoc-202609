    # Unsupervised Learning Applications and K-means Clustering


    Unsupervised learning has a variety of applications, such as anomaly detection,
    clustering, and dimensionality reduction. For example, an unsupervised learning
    algorithm might be used to cluster customers based on their usage of electronic
    devices, with the goal of identifying potential users of blue light filter lenses.
    One cluster may consist of customers who spend a significant amount of time on
    screens and use multiple devices frequently, indicating that they may be potential
    users of blue light filter lenses. Another cluster may consist of customers who
    use electronic devices infrequently, indicating that they may not be interested
    in purchasing blue light filter lenses. The clustering information can provide
    valuable insights for marketing efforts and enable precise targeting of potential
    customers.


    There are numerous unsupervised machine learning algorithms available, including
    `K-means clustering`, principal component analysis, and hierarchical clustering.
    In this chapter, we will delve into the details of `K-means clustering`. Before
    using the `K-means clustering` algorithm, it is important to note that distance
    metrics are crucial for accurately measuring the distance between data points
    in two to n-dimensional space and forming appropriate clusters. There are four
    popular distance metrics, namely, Euclidean distance, Manhattan distance, Cosine
    similarity, and Chebyshev distance.


    ## 8.1 Distance Metrics


    ### 8.1.1 Euclidean Distance


    Euclidean distance is a commonly used distance metric that calculates the distance
    between two points by determining the shortest path between them. The formula
    for calculating Euclidean distance is the square root of the sum of the squared
    differences in the coordinates of the two points. This measure is useful for understanding
    the relationship between data points in a multi-dimensional space.


    Euclidean distance between points A and B is defined as:


    ```

    D_AB = sqrt((x2-x1)^2 + (y2-y1)^2 + ... + (z2-z1)^2)      (8.1)

    ```


    Here, the coordinate of point A is `x1, y1, ..., z1` and point B is `x2, y2, ...,
    z2`.


    ### 8.1.2 Manhattan Distance


    Manhattan distance, also known as the taxicab distance, is a distance metric that
    calculates the distance between two points by adding up the absolute differences
    in their coordinates. It is called the taxicab distance because it represents
    the distance that a taxicab would have to travel to get from one location to another
    if it could only move horizontally or vertically.


    Manhattan distance between points A and B is defined as:


    ```

    D_AB = |x2-x1| + |y2-y1| + ... + |z2-z1|      (8.2)

    ```


    Here, the coordinate of point A is `x1, y1, ..., z1` and point B is `x2, y2, ...,
    z2`.


    ### 8.1.3 Cosine Similarity


    The cosine similarity is a distance metric that determines how similar two vectors
    are to one another by computing the cosine of the angle that separates them.


    Cosine similarity between A and B is defined as:


    ```

    cos(θ) = (A ⋅ B) / (||A|| ||B||)      (8.3)

    ```


    Here, `θ` is the angle between the vectors A and B.


    `A ⋅ B` is the dot product of vectors A and B.


    `||A||` and `||B||` are L2 norm of the vectors A and B, respectively.


    ### 8.1.4 Chebyshev Distance


    Chebyshev distance, also known as the chessboard distance, is another metric that
    measures the distance between two vectors in a vector space. It is calculated
    by determining the greatest difference between the two vectors along any coordinate
    dimension.


    Chebyshev distance between points A and B is defined as:


    ```

    D_AB = max(|x2-x1|, |y2-y1|, ..., |z2-z1|)      (8.4)

    ```


    Here, the coordinate of point A is `x1, y1, ..., z1` and point B is `x2, y2, ...,
    z2`.


    ## 8.2 Algorithm of K-means Clustering


    `K-means clustering` was first developed by Stuart Lloyd at Bell Labs in 1957
    for pulse-code modulation. The idea was not publicly published outside of the
    company until 1982. The `K-means clustering` algorithm is also known as the Lloyd-Forgy
    algorithm due to the development of a nearly identical method by Edward W. Forgy
    in 1965 [[2]](#9789815136982-C8.html#r2). It has since become a widely used algorithm
    in the field of unsupervised machine learning for clustering data into groups
    with similar characteristics.


    Let us understand the working of the `K-means` algorithm and how it forms clusters.
    If we were given the centroids for an unlabeled dataset, it would be easy to label
    all the samples by assigning each of them to the cluster with the closest centroid.
    On the other hand, if we were provided with the labels for all the samples, we
    could easily find all the centroids by calculating the mean of the samples for
    each cluster. However, since neither the labels nor the centroids are given to
    us, it is unclear how to proceed. To get started, we can simply place the centroids
    randomly (e.g., by selecting `k` samples at random and using their positions as
    the initial centroids). The next step is to label the samples, then update the
    centroids, label the samples again, update the centroids again, and so on, until
    the centroids stop shifting. The method will not continue to oscillate indefinitely
    as it is designed to converge after a certain number of steps [[3]](#9789815136982-C8.html#r3).


    In a nutshell, the `K-means clustering` algorithm can be divided into the following
    6 steps [[4]](#9789815136982-C8.html#r4):


    1. Randomly initialize `k` centroids for `k` clusters (i.e., selecting `k` samples
    at random and using their positions as the initial centroids).

    2. Compute the Euclidean distance of each sample to these `k` centroids.

    3. Assign each sample in the dataset to the closest centroid.

    4. Calculate the mean of the samples in each cluster.

    5. Reassign the centroids to the mean of the samples in each cluster.

    6. Repeat step 2 to 5 till there is convergence (i.e., the `k` centroids no longer
    move or until a predetermined number of iterations is reached). The final clusters
    and centroids represent the output of the `K-means` algorithm.


    A key challenge in applying the `K-means clustering` algorithm is selecting an
    appropriate value for the number of centroids, `k`. The elbow method can be used
    to determine the optimal value of `k`. It does this by fitting the model for a
    range of values for `k` and selecting the `k` that results in the lowest Within-Cluster
    Sum of Squares (WCSS). WCSS measures the sum of the squared distance between each
    sample in a cluster and the centroid of that cluster. A lower WCSS indicates a
    better fit, as it means that the samples are closer to their centroids. As shown
    in [Fig. 8.1](#9789815136982-C8.html#f8.1) for a sample plot, the elbow point
    corresponds to the value of `k` at which the WCSS begins to level off, indicating
    that adding additional clusters is not significantly improving the fit; and this
    point is then selected as the optimal value of `k`. For the numerical example
    in Section 8.3, we will use `k = 3` to demonstrate the 6 steps of the `K-means
    clustering` algorithm. In Section 8.4, we will explain why `k = 3` was chosen
    for this dataset.


    ![Fig. 8.1](Images/9789815136982-C8-F1.jpg)


    **Fig. 8.1** Sample plot of Within-Cluster Sum of Squares (WCSS) vs. Number of
    clusters.


    ## 8.3 Numerical Example of K-means Clustering


    As shown in Table 8.1, a small dataset contains the marks of 6 students, S1 to
    S6, for two subjects, namely, Math and Science. Our task is to cluster these students
    based on their marks into different groups using the `K-means clustering` algorithm.


    **Table 8.1** The small dataset for K-means Clustering.


    | Student No. | Math Marks | Science Marks |

    | :--- | :---: | :---: |

    | S1 | 40 | 45 |

    | S2 | 60 | 75 |

    | S3 | 65 | 70 |

    | S4 | 90 | 90 |

    | S5 | 100 | 95 |

    | S6 | 45 | 35 |


    In the first iteration, randomly take the marks of students S6, S2, and S3 as
    the centroids of the initial 3 clusters (i.e., `k = 3`). Denote the 3 centroids
    as `C1 (45, 35)`, `C2 (60, 75)`, and `C3 (65, 70)`, respectively. We will then
    calculate the Euclidean distance from each of the samples to the centroids.


    Calculate the distance from `C1` to all the 6 samples:


    ```

    Distance from C1 to S1 = sqrt((45-40)^2 + (35-45)^2) = 11.18

    ```

