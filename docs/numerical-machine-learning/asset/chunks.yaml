    \ in chemical engineering. *Comput. Chem. Eng.* 2022, 165, 107945. doi: 10.1016/j.compchemeng.2022.107945\
    \ |\n| [2] | Geron A.. *Hands-on machine learning with scikit-learn, keras, and\
    \ tensorflow*. 3rd ed. O'Reilly Media, 2022. |\n| [3] | Vapnik V.N.. *Statistical\
    \ learning theory*. Nashville, TN: John Wiley & Sons, 1998. |\n| [4] | Raschka\
    \ S.. *Python Machine Learning*. Birmingham, England: Packt Publishing, 2015.\
    \ |\n\n# K-means Clustering\n\n**Zhiyuan Wang**, **Sayed Ameenuddin Irfan**, **Christopher\
    \ Teoh**, **Priyanka Hriday Bhoyar**\n\n## Abstract\n\nIn this chapter, we explore\
    \ the K-means clustering algorithm, emphasizing an accessible approach by minimizing\
    \ abstract mathematical theories. We present a concrete numerical example with\
    \ a small dataset to illustrate how clusters can be formed using the K-means clustering\
    \ algorithm. Additionally, we provide sample codes and comparisons with the K-means\
    \ model available in the `scikit-learn` library. Upon completing this chapter,\
    \ readers will gain a comprehensive understanding of the mechanics behind K-means\
    \ clustering, its connection to the implementation and performance of the algorithm,\
    \ and be well-prepared to apply it in practical use.\n\n**Keywords:** K-Means\
    \ Clustering, Distance Metrics, Numerical Example, Small Dataset, Scikit-Learn.\n\
    \n## 8.1. INTRODUCTION TO CLUSTERING AND DISTANCE METRICS\n\nIn unsupervised learning,\
    \ the algorithm is not provided with labeled training data. Instead, it is only\
    \ given a set of input examples, and the primary objective of unsupervised learning\
    \ is to uncover the inherent structure or patterns within the data, enabling the\
    \ algorithm to make predictions, decisions, or recommendations based on these\
    \ discovered patterns [[1]](#9789815136982-C8.html#r1). This contrasts with supervised\
    \ learning, where the algorithm is given both input examples and corresponding\
    \ labeled outputs and can learn by making predictions and comparing them to the\
    \ true labels. The ability of unsupervised learning algorithms to discover hidden\
    \ structures and relationships in the data without relying on labeled examples\
    \ makes them particularly valuable in situations where obtaining labeled data\
    \ is challenging, time-consuming, or expensive.\n"
