    \n![](Images/9789815136982-C3-E12.jpg)\n\n### 3.3.2. End the First Iteration of\
    \ Learning\n\n![](Images/9789815136982-C3-E13.jpg)\n\nSo, the latest MSE after\
    \ the first iteration of learning with L1 regularization is 2.7320. Next, let\
    \ us continue with the second iteration with the updated bias and weights determined\
    \ above.\n\n### 3.3.3. Start the Second Iteration of Learning\n\n![](Images/9789815136982-C3-E14.jpg)\n\
    \n![](Images/9789815136982-C3-E15.jpg)\n\n### 3.3.4. End the Second Iteration\
    \ of Learning\n\n![](Images/9789815136982-C3-E16.jpg)\n\nTable 3.3 **The bias,\
    \ weights and MSE values for the first and last five iterations for training the\
    \ L1 regularized linear regression model.**  \n\n| **Iteration** || ***b*** ||\
    \ ***w[1]*** || ***w[2]*** || ***MSE*** |\n\n| --- | --- | --- | --- | --- |\n\
    \n| 1 || 0.001553 || 0.0009274 || 0.0009933 || 2.7320 |\n\n| --- | --- | --- |\
    \ --- | --- |\n\n| 2 || 0.003104 || 0.001853 || 0.001985 || 2.7232 |\n\n| 3 ||\
