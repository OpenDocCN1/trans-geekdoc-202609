    ## 7.1 支持向量机简介


    支持向量机（缩写为 `SVM`）是一种强大且广泛适用的机器学习算法，已成功应用于各个领域，如图像和语音识别、自然语言处理、生物信息学和金融等。`SVM` 算法的目标是在
    N 维空间（其中 N 是特征数量）中确定一个超平面，以清晰可辨的方式对数据点进行分类。其定义方式使得 N 维空间中不同类别数据点之间的边距距离最大化 [[1]](#9789815136982-C7.html#r1)[[2]](#9789815136982-C7.html#r2)。如果边距距离最大化，那么后续的新数据点（先前未见过的）将以更大的信心被分类。对于线性不可分数据集，`SVM`
    主要采用核函数将原始数据映射到高维希尔伯特空间以实现线性可分，从而解决线性不可分问题 [[3]](#9789815136982-C7.html#r3)。此外，值得一提的是，支持向量只是更接近超平面的训练数据点。这些数据点对于构建
    `SVM` 模型更为相关和关键，因为它们有助于确定分离超平面的方程 [[4]](#9789815136982-C7.html#r4)。图（[**7.1**](#9789815136982-C7.html#f7.1)）说明了


    使用来自 2 个类别（即正类（+）和负类（-））的 10 个样本的数据集，说明了超平面、支持向量和边距。


    ![](Images/9789815136982-C7-F1.jpg)

    **图 (7.1)**


    SVM 超平面、支持向量和边距的示意图。


    ## 7.2 支持向量机的数学原理：线性可分情况


    图（[**7.1**](#9789815136982-C7.html#f7.1)）中使用的数据集已简化以降低复杂性。因此，现在只有 2 个属于正类（+）的数据点，和
    2 个属于负类（-）的数据点，如图（[**7.2**](#9789815136982-C7.html#f7.2)）所示。目标是找到与最大边距相关的超平面。接下来，我们绘制一个向量
    `w→`（任意长度），它从原点开始并垂直于假设的超平面。此外，假设我们还有先前未见过的数据 `u→`，我们想要预测 `u→` 的类别，无论它是 + 类还是
    - 类。


    ![](Images/9789815136982-C7-F2.jpg)

    **图 (7.2)**


    2 个 + 类数据点、2 个 - 类数据点、垂直于假设边距的 `w→` 和先前未见过的 `u→` 的示意图。


    将 `u→` 投影到垂直于边距的向量（即 `w→`）上，如果该投影大于或等于（≥）某个常数 `c`，该常数穿过中线，那么它必须是正（+）数据点。这可以用数学方式表示为：


    `w→⋅u→≥c`，则 `u→` 标记为 +


    执行简单变换：


    `w→⋅u→-c≥0`


    `w→⋅u→+bt≥0`，其中 `bt=-c`


    边距的中线：


    `w→⋅u→+bt=0`


    边距的边缘线（靠近 +）：


    `w→⋅u→+bt=ä`


    此处，`ä` 为正常数


    两边同时除以 `ä`：


    `w→/ä⋅u→+bt/ä=1`


    令 `W→=w→/ä` 和 `b=bt/ä`，


    边距的边缘线（靠近 +）更新为：


    `W→⋅u→+b=1`


    边距的中线更新为：


    `W→⋅u→+b=0`


    对称地，如图（[**7.3**](#9789815136982-C7.html#f7.3)）所示，边距的边缘线（靠近 -）更新为：


    ![](Images/9789815136982-C7-F3.jpg)

    **图 (7.3)**


    超平面、边缘线（靠近 +）和边缘线（靠近 -）的通用方程示意图。


    `W→⋅u→+b=-1`

