    \ || 0.003963 || 2.7055 |\n\n| 5 || 0.007741 || 0.004621 || 0.004949 || 2.6967\
    \ |\n\n| ... || ... || ... || ... || ... |\n\n| 499,996 || 1.1466 || 0.7949 ||\
    \ 0.00004110 || 0.0636 |\n\n| 499,997 || 1.1466 || 0.7949 || 0.00003797 || 0.0636\
    \ |\n\n| 499,998 || 1.1466 || 0.7949 || 0.00003485 || 0.0636 |\n\n| 499,999 ||\
    \ 1.1466 || 0.7949 || 0.00003172 || 0.0636 |\n\n| 500,000 || 1.1466 || 0.7949\
    \ || 0.00002860 || 0.0636 |\n\n![](Images/9789815136982-C3-F2.jpg)**Fig. (3.2))**\
    \  \n\nMean squared error (MSE) *vs*. learning iteration for training the L1 regularized\
    \ linear regression model.\n\nAs can be seen from (Table **3.3**) and [Fig. (**3.2**)](#9789815136982-C3.html#f3.2),\
    \ MSE finally stabilizes at 0.0636, which suggests that we have trained a good\
    \ linear regression model under L1 regularization. The final obtained bias and\
    \ weights are b=1.1466, w1=0.7949 and w2=0.00002860. One important highlight of\
    \ L1 regularization is that it shrinks the weights of the features it deems less\
    \ important, often to zero, effectively serving as a method for feature selection.\
    \ However, it is worth noting that these “less important” features are determined\
    \ by the model and data, and may or may not align with domain-specific knowledge\
    \ or broader context. The resulting linear regression model can be written as:\n\
    \nY=b+∑j=12 wj⋅normalized Xj\n\nHere, b=1.1466, w1=0.7949 and w2=0.00002860.\n\
    \nAs Max-min normalization was performed during the training process, it needs\
    \ to be reflected in the final model as well. That is why normalized Xj is shown\
    \ here.\n\nNow, we can use this trained linear regression model to make predictions\
    \ for previously unseen data (*i.e.*, new data). For instance, there is a new\
    \ house with 1200 sqft and 3 bedrooms. To predict the price of the house, normalization\
    \ needs to be applied first using the maximum and minimum values of each respective\
    \ feature from the training dataset. Recall that the maximum and minimum of size\\\
    _sqft are 1600 and 740; the maximum and minimum of num\\_bedrooms are 5 and 2.\
    \ So, the normalized X1 for size\\_sqft and normalized X2 for num\\_bedrooms will\
    \ be:\n\nnormalized X1=1200-7401600-740=0.5349\n\nnormalized X2=3-25-2=0.3333\n\
    \nNext, plug the normalized feature values into the equation of linear regression\
    \ model:\n\nY=b+∑j=12 wj⋅ normalized Xj=1.1466+0.7949×0.5349+0.00002860×0.3333=1.572\n\
    \nTherefore, for the house with 1200 sqft and 3 bedrooms, the sale price is predicted\
    \ to be 1.572 million dollars.\n\n## 3.4. SAMPLE CODES AND COMPARISON OF L1 REGULARIZATION\
    \ FOR LINEAR REGRESSION\n\nFollowing the mathematics and numerical example discussed\
    \ in Sections 3.2 and 3.3, we have implemented the L1 regularized linear regression\
    \ machine learning model with the aforementioned small dataset from scratch in\
    \ Python. The code is similar to that of the original linear regression discussed\
    \ in Chapter 2. The difference lies in the function, update\\_bias\\_weights,\
    \ because of the addition of the L1 regularization term (*i.e.*, ëW1) to the loss\
    \ function. Readers are encouraged to have their Jupyter Notebook (or other Python\
    \ IDE) ready and try the codes along with reading. The complete code file can\
    \ be downloaded from our shared folder in Google Drive:\n\n[https://drive.google.com/drive/folders/1FqJvo4ZPazNbEH\\\
    _GlHFoodqvegnQmHcn?usp=share\\_link](https://drive.google.com/drive/folders/1FqJvo4ZPazNbEH_GlHFoodqvegnQmHcn?usp=share_link)\n\
    \nFirstly, only the pandas and numpy libraries are imported.\n\n![](Images/9789815136982-C3-E21.jpg)\n\
    \nSecondly, a **loss\\_MSE** function is created for calculating the MSE between\
    \ the known true output values and predicted output values by the linear regression\
    \ model. See the docstring of the loss\\_MSE function to understand its usage.\n\
    \n![](Images/9789815136982-C3-E22.jpg)\n\nThirdly, an **update\\_bias\\_weights**\
    \ is created to update the values of bias and weights based on the gradient descent\
    \ optimization algorithm. The equations (3.4) to (3.11), which we derived in Section\
    \ 3.2, are well translated into Python codes in this function. See the docstring\
    \ of the update\\_bias\\_weights function to understand its usage.\n\n![](Images/9789815136982-C3-E23.jpg)\n\
    \nFourthly, a **train** function is created to oversee the training process for\
    \ specific iterations and write the log of loss/MSE history. See the docstring\
    \ of the train function to understand its usage.\n\n![](Images/9789815136982-C3-E24.jpg)\n\
    \nFifthly, a **max\\_min\\_norm** function is created to normalize the values\
    \ of input features (*i.e.*, X). See the docstring of the max\\_min\\_norm function\
    \ to understand its usage.\n\n![](Images/9789815136982-C3-E25.jpg)\n\nSixthly,\
    \ we store the small dataset as a numpy array, invoke the max\\_min\\_norm function\
    \ for normalization, initialize bias and weights, set learning rate, iterations\
    \ and penalty coefficient that multiplies the L1 regularization term, then invoke\
    \ the train function to start building our first L1 regularized linear regression\
    \ model, after decomposing and fully understanding every single step of the process.\n\
    \n![](Images/9789815136982-C3-E26.jpg)\n\n![](Images/9789815136982-C3-E27.jpg)\n\
    \nFinally, the trained linear regression model is utilized to predict the price\
    \ of the house (new data) with 1200 sqft and 3 bedrooms:\n\n![](Images/9789815136982-C3-E28.jpg)\n\
    \nWe then compare the above results with those from the off-the-shelf L1 regularized\
    \ linear regression model (*i.e.*, Lasso) offered by the scikit-learn library.\
    \ These include the final bias and weights after training, the final MSE, and\
    \ the predicted price for the house (new data) with 1200 sqft and 3 bedrooms.\
    \ The codes are as follows:\n\n![](Images/9789815136982-C3-E29.jpg)\n\n![](Images/9789815136982-C3-E30.jpg)\n\
    \nAs can be seen from the results using the scikit-learn L1 regularized linear\
    \ regression model (*i.e.*, Lasso), the final bias, weights, and MSE values are\
    \ the same as or extremely close to those given by our own L1 regularized linear\
    \ regression model (*i.e.*, b=1.1466, w1=0.7949, w2=0.00002860, and MSE=0.0636).\
    \ Furthermore, the predicted price for the previously unseen house with 1200 sqft\
    \ and 3 bedrooms is also the same as that produced by our own model (*i.e.*, 1.572\
    \ million).\n\n## 3.5. MATHEMATICS OF L2 REGULARIZATION FOR LINEAR REGRESSION\n\
    \nThe L2 regularized linear regression starts again with the general equation\
    \ of linear regression when having more than one independent variable X (*i.e.*,\
    \ input feature), as follows:\n\nY=b+∑j=1n wjXj   (3.13)\n\nHere,\n\nY is the\
    \ output b is the bias n is the number of input features wj is the weight of the\
    \ jth feature Xj is input value of the jth feature"
