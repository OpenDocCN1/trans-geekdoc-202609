    ## 决策树模型构建与编码示例


    输入特征和输出标签均使用数值 0、1、2 等进行编码。例如，在 `Outlook` 列中，0 代表阴天，1 代表雨天，2 代表晴天。同理，在 `Temperature`
    列中，0 代表凉爽，1 代表炎热。在 `Play_Tennis` 列中，0 代表否，1 代表是。这种编码是必要的，因为决策树要求输入为数值型而非分类型。编码后的更新数据集见表
    5.2。


    **表 5.2 决策树编码后的小型数据集**


    | 样本 | Outlook | Temperature | Play_Tennis |

    | --- | --- | --- | --- |

    | 第 1 个样本 | 1 | 1 | 0 |

    | 第 2 个样本 | 1 | 0 | 1 |

    | 第 3 个样本 | 0 | 0 | 1 |

    | 第 4 个样本 | 2 | 1 | 1 |

    | 第 5 个样本 | 2 | 0 | 1 |


    ### 构建决策树模型


    首先，我们需要使用公式 (5.1) 计算包含所有 5 个训练样本的根节点的熵。从表 5.2 可知，5 个训练样本中有 4 个属于类别 1（即 yes），因此
    $P_1 = 4/5$；有 1 个属于类别 0（即 no），因此 $P_0 = 1/5$。


    ![根节点熵计算](Images/9789815136982-C5-EE1.jpg)


    其次，将每个特征及其每个可能的值视为候选分裂点，目标是找到产生最大信息增益的最优分裂。共有 2 个输入特征：`Outlook` 和 `Temperature`。


    #### 特征 Outlook 的分裂分析


    先考虑 `Outlook`，它包含 3 个唯一值：0、1、2（即阴天、雨天、晴天）。


    **分裂 1：`Outlook ≤ 0.5`**

    可在 0 和 1 之间进行公平分裂。满足条件的样本（阴天）分入左子节点，其余（雨天或晴天）分入右子节点。


    ![Outlook ≤ 0.5 分裂示意](Images/9789815136982-C5-C1.jpg)


    仅第 3 个样本满足 `Outlook ≤ 0.5`，构成左子节点，其熵计算如下：


    ![左子节点熵计算](Images/9789815136982-C5-EE2.jpg)


    其余 4 个样本构成右子节点，其熵计算如下：


    ![右子节点熵计算](Images/9789815136982-C5-EE3.jpg)


    使用条件 `Outlook ≤ 0.5` 的信息增益 (IG) 计算如下：


    ![IG 计算](Images/9789815136982-C5-EE4.jpg)


    **分裂 2：`Outlook ≤ 1.5`**

    可在 1 和 2 之间进行公平分裂。满足条件的样本（阴天或雨天）分入左子节点，其余（晴天）分入右子节点。


    ![Outlook ≤ 1.5 分裂示意](Images/9789815136982-C5-C2.jpg)


    第 1、2、3 个样本满足 `Outlook ≤ 1.5`，构成左子节点，其熵计算如下：


    ![左子节点熵计算](Images/9789815136982-C5-EE5.jpg)


    其余 2 个样本构成右子节点，其熵计算如下：


    ![右子节点熵计算](Images/9789815136982-C5-EE6.jpg)


    使用条件 `Outlook ≤ 1.5` 的信息增益 (IG) 计算如下：


    ![IG 计算](Images/9789815136982-C5-EE7.jpg)


    > **注意**：不考虑 `Outlook ≤ 0` 或 `Outlook ≤ 2` 等条件，因为这些条件无法将 5 个样本分成独立的组，所有样本将保留在同一组中。


    #### 特征 Temperature 的分裂分析


    再考虑 `Temperature`，它包含 2 个唯一值：0 和 1（即凉爽和炎热）。


    **分裂：`Temperature ≤ 0.5`**

    可在 0 和 1 之间进行公平分裂。温度为凉爽的样本分入左子节点，温度为炎热的样本分入右子节点。


    ![Temperature ≤ 0.5 分裂示意](Images/9789815136982-C5-C3.jpg)


    第 2、3、5 个样本满足 `Temperature ≤ 0.5`，构成左子节点，其熵计算如下：


    ![左子节点熵计算](Images/9789815136982-C5-EE8.jpg)


    其余 2 个样本构成右子节点，其熵计算如下：


    ![右子节点熵计算](Images/9789815136982-C5-EE9.jpg)


    使用条件 `Temperature ≤ 0.5` 的信息增益 (IG) 计算如下：


    ![IG 计算](Images/9789815136982-C5-EE10.jpg)


    ### 选择最优分裂


    经过所有计算，`IG (Temperature ≤ 0.5)` 相比 `IG (Outlook ≤ 0.5)` 和 `IG (Outlook ≤ 1.5)`
    提供了最大的信息增益。因此，使用分裂条件 `Temperature ≤ 0.5` 来分裂包含所有 5 个样本的根节点：


    ![根节点分裂结果](Images/9789815136982-C5-C4.jpg)


    值得注意的是，右子节点包含来自 2 个类别的样本（即表 5.2 中的第 1 个和第 4 个样本）。默认情况下，决策树构建算法不会在此停止，而是继续分裂该节点。此时仅有一个可能的候选分裂：针对特征
    `Outlook` 在 1（雨天）和 2（晴天）之间分裂，因为这两个样本的 `Temperature` 值均为 1（炎热）。更新后的分裂可视化如下：


