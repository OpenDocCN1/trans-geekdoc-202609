    In this chapter, we explore the concept of decision trees, prioritizing accessibility
    by minimizing abstract mathematical theories. We examine a concrete numerical
    example using a small dataset to predict the suitability of playing tennis based
    on weather conditions, guiding readers through the process step-by-step. Moreover,
    we provide sample codes and compare them with the decision tree classification
    model found in the `scikit-learn` library. Upon completing this chapter, readers
    will have gained a comprehensive understanding of the inner workings of decision
    tree machine learning, the relationship between the underlying principles, and
    the implementation and performance of the algorithm, preparing them to apply their
    knowledge to practical scenarios.


    **Keywords:** Decision Tree, Classification, Numerical Example, Small Dataset,
    Scikit-Learn.


    ## 5.1 Introduction to Decision Tree


    A decision tree is a diagrammatic representation of a set of choices and the results
    of those choices [[1]](#9789815136982-C5.html#r1). Decision tree algorithms have
    become a popular choice for both classification and regression tasks in machine
    learning due to their inherent advantages. These include their ease of interpretability,
    as the decision-making process is explicitly laid out in the tree structure, and
    their efficient training process. Decision trees can handle missing values, automatically
    select relevant features, and easily manage both numerical and categorical data.
    Furthermore, they are robust to outliers and noise in the data. Some of the common
    applications of decision trees include customer segmentation, fraud detection,
    medical diagnosis, and risk management. Due to their comprehensible nature and
    ability to visualize complex decision-making processes, decision trees have found
    widespread adoption in various industries and research fields. A decision tree
    is a diagram showing the several paths to reach a choice under specific constraints.
    Each branch symbolizes the decision space, and its leaf nodes are the outcomes.
    One node, called the root node, is the starting point for the decision tree, and
    many more branches, including decision nodes and leaf nodes.


    For example, as shown in [Fig. (5.1)](#9789815136982-C5.html#f5.1), consider a
    situation where one needs to decide whether to go to outdoor sports. The decision
    tree for this problem may look like this:


    ![](Images/9789815136982-C5-F1.jpg)


    **Fig. (5.1)** A simple decision tree example.


    Root node: "Should I go to outdoor sports?"


    Decision node: "Is weather good to support outdoor sports?"


    If yes, leaf node: "Go to play"


    If no, leaf node: "Do not go to play"


    In this example, the decision node represents the weather condition outside. If
    the condition is met (i.e., the weather is good), the tree leads to the outcome
    of going to play. If the condition is not met (i.e., the weather is not good),
    the tree leads to the outcome of not going to play.


    Now the question might be how to decide which leaf node to select as the root
    node and decision node. For better decision-making, we use Hunt''s algorithm,
    which helps to give a clear understanding of splitting and choosing the important
    parameter for root nodes.


    ## 5.2 Algorithm of Decision Tree


    In the context of decision tree learning, a heuristic known as Hunt''s algorithm
    is utilized to determine the optimal split for each node in the tree [[2]](#9789815136982-C5.html#r2).
    It is a procedure that iteratively analyzes each feature and the possible value
    of the feature as a candidate split. Then it chooses the one that yields the most
    significant increase in information gain (discussed later).


    Here is the general process of the Hunt algorithm:


    * Calculate the entropy of the current node. Entropy is a measure of the impurity
    or uncertainty of the data at the node. It is calculated based on the frequencies
    of the different classes in the data.

    * Consider each feature and each possible value of that feature as a candidate
    split. Calculate the information gain of each candidate split by comparing the
    entropy of the current node to the entropy of the child nodes that would result
    from the split.

    * Select the split that results in the greatest information gain.

    * Repeat the process for each child node, until the desired depth of the tree
    is reached, or all nodes are pure (i.e., contain only data belonging to a single
    class).


    Hunt''s algorithm is a popular choice for decision tree learning due to its simplicity
    and efficiency in constructing a decision tree from a dataset. Hunt''s algorithm
    has also served as a foundation for the development of other decision tree algorithms
    [[3]](#9789815136982-C5.html#r3), such as `ID3` (Iterative Dichotomiser 3), `C4.5`
    (an extension of ID3 that can handle continuous attributes, missing values, and
    pruning), and `CART` (Classification and Regression Trees).


    As aforementioned, the impurity of a node in a decision tree can be measured using
    entropy, shown in Equation (5.1). Entropy is calculated based on the frequencies
    of the different classes in the data. If the data at a node is completely pure,
    with all data belonging to a single class, then the entropy is zero. On the other
    hand, if the data is equally divided among all classes, then the entropy is at
    its maximum.


    | ![](Images/9789815136982-C5-E1.jpg) | | (1) |


    | --- | --- |


    Here, `Pi` is the proportion of class *i* in the node.


    Hunt''s algorithm recursively splits the data into smaller and smaller subsets
    until each subset contains data belonging to a single class. At each split, the
    algorithm considers every feature and every possible value of that feature as
    a candidate split and selects the split that results in the greatest information
    gain. Once the tree has been built, it can be used to make predictions by following
    the splits in the tree to arrive at a leaf node, which represents a class prediction.


    In decision tree learning, information gain (IG) is a measure that determines
    how well a given feature splits the training samples. It is used to decide which
    feature to split on at each step in building the tree. The metric that is commonly
    used to calculate information gain is entropy, which is a measure of the "disordered"
    or "random" nature of a group of samples. Equation (5.2) shows the mathematical
    formulation for information gain.


    **Information Gain = Entropy(parent) - Weighted sum of Entropy(children)** (5.2)


    Here, the `Entropy_parent` for parent node, calculated using Equation (5.1), is
    the entropy of the set of samples before the split, and the `Entropy_children`,
    calculated using Equation (5.1), for child nodes are the entropies of the two
    groups of samples created by the split. The weight assigned to each child node
    is simply the ratio of ![](Images/9789815136982-C5-IE1.jpg).


    A decision tree has several advantages [[4]](#9789815136982-C5.html#r4), including
    interpretability, as the decision-making process is explicitly laid out in the
    tree structure, efficient training, and the ability to handle missing values and
    automatically select relevant features, which is why it is a popular machine learning
    algorithm in practice.


    ## 5.3 Numerical Example of Decision Tree


    Let us consider a small categorical dataset with 5 training samples that contain
    weather outlook and temperature as input features, and an output label indicating
    whether it is appropriate to play tennis given these conditions. The dataset is
    presented in Table **5.1**.


    **Table 5.1** The small dataset for the decision tree.


    | | **Outlook** | **Temperature** | **Play_Tennis** |

    | --- | --- | --- | --- |

    | 1st sample | rainy | hot | no |

    | 2nd sample | rainy | cool | yes |

    | 3rd sample | overcast | cool | yes |

    | 4th sample | sunny | hot | yes |

    | 5th sample | sunny | cool | yes |

