    \ |\n|---|\n| ![](img/9789815136982-C7-EQ11.jpg) |\n|---|\n| ![](img/9789815136982-C7-EQ2.jpg)\
    \ |\n\n从使用多项式核的 `scikit-learn` SVM 分类器的结果可以看出，与我们手动计算的结果相比，获得了相同的支持向量对偶系数（即 `â1\
    \ = -0.625`，`â2 = -1`，`â3 = 1`，`â4 = 0.625`），相同的截距值（即 `b = 1`），以及相同的决策面（即超平面 `u\
    \ = 0.382` 或 `2.618`）。\n\n# 7.6 支持向量机数值示例与代码对比：使用径向基函数核的线性不可分情况\n\n使用径向基函数（RBF）核的概念与多项式核相同，只是用于将低维输入空间变换到高维空间的函数不同。\n\
    \n对于多项式核，它使用此函数：\n\n```\nK(xi˙→, xj˙→) = [ã xi˙→ ∙ xj˙→ + r]^d\n```\n\n然而，对于 RBF\
    \ 核，函数将是：\n\n```\nK(xi˙→, xj˙→) = e^(-ã ||xi˙→ - xj˙→||²)\n```\n\n这里，`ã` 是核系数；`xi˙→`\
    \ 和 `xj˙→` 是支持向量。\n\n下表 **7.4** 和图（**7.12**）展示了另一个线性不可分数据集；让我们应用带 RBF 核的 SVM 来分离这\
    \ 2 个类别。\n\n"
