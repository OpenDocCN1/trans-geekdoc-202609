    \n## 摘要\n\n在本章中，我们探讨 K 均值聚类算法，强调通过将抽象数学理论降至最低来采用易懂的方法。我们展示了一个使用小数据集的具体数值示例，说明如何使用\
    \ K 均值聚类算法形成簇。此外，我们提供了示例代码，并与 `scikit-learn` 库中可用的 K 均值模型进行了比较。完成本章后，读者将全面了解 K\
    \ 均值聚类背后的机制、其与算法实现和性能的联系，并做好在实际应用中使用它的准备。\n\n**关键词：** K-Means Clustering, Distance\
    \ Metrics, Numerical Example, Small Dataset, Scikit-Learn.\n\n## 8.1. 聚类与距离度量简介\n\
    \n在无监督学习中，算法不提供带标签的训练数据。相反，它仅获得一组输入示例，无监督学习的主要目标是发掘数据中固有的结构或模式，使算法能够基于这些发现的模式进行预测、决策或推荐\
    \ [[1]](#9789815136982-C8.html#r1)。这与有监督学习形成对比，在有监督学习中，算法同时获得输入示例和相应的带标签输出，并能通过进行预测并将其与真实标签比较来学习。无监督学习算法无需依赖带标签示例即可发现数据中隐藏的结构和关系，这使得它们在获取带标签数据具有挑战性、耗时或昂贵的情况下特别有价值。\n\
    \n"
