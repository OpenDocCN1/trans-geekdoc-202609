    #### 特征 Temperature 的分裂分析


    再考虑 `Temperature`，它包含 2 个唯一值：0 和 1（即凉爽和炎热）。


    **分裂：`Temperature ≤ 0.5`**

    可在 0 和 1 之间进行公平分裂。温度为凉爽的样本分入左子节点，温度为炎热的样本分入右子节点。


