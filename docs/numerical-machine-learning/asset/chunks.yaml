    ## 梯度下降优化


    接下来，使用梯度下降优化算法，通过沿着减少损失的方向，每次微调偏置和权重的值，来寻找最优偏置和权重。


    为了进行优化，我们首先需要求出平均损失 (`L`) 关于偏置和权重的偏导数，即 `∂L/∂b` 和 `∂L/∂wj`，它们表示偏置和各个权重对平均损失的贡献。这可以通过应用链式法则来完成，如公式
    (2.5) 至 (2.9) 所示。


    ![](img/9789815136982-C2-Eq5-9.jpg)


    此处，`j ∈ [1, n]`，且 `n` 是特征的数量。


    随后，使用梯度下降来更新偏置 `b`（公式 2.10）和权重 `w`（公式 2.11）。


    ![](img/9789815136982-C2-Eq10.jpg)


    ![](img/9789815136982-C2-Eq11.jpg)


    此处，`α` 是学习率（通常为较小值，*例如* 0.1、0.01、0.001）。


