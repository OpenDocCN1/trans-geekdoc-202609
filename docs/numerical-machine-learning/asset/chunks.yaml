    ## Conclusion


    In this chapter, we discussed the concept of linear regression, a popular machine
    learning algorithm used for predicting numerical values. To make the material
    more accessible, we kept abstract mathematical theories to a minimum. Instead,
    we focused on a concrete numerical example with a small dataset for predicting
    the sale price of houses, walking through it step by step. We also provided sample
    codes and a comparison with the linear regression model from the off-the-shelf
    library, scikit-learn. By the end of the chapter, readers should have a well-rounded
    understanding of how linear regression machine learning works behind the scenes,
    how the mathematics relates to the implementation and performance of the algorithm,
    and be better equipped to apply it in their projects.


