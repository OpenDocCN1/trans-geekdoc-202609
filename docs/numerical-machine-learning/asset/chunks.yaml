    \ = log(odds)\n∴ F0(x) = initial log(odds) = 0.693, which is a constant value\
    \ for all samples initially.\n```\n\nHence,\n\n```\nF0(x1) = initial log(odds1)\
    \ = 0.693\nF0(x2) = initial log(odds2) = 0.693\nF0(x3) = initial log(odds3) =\
    \ 0.693\n```\n\nFind the predicted probability `Pi` based on the computed initial\
    \ `log(odds_i)`:\n\n```\n∵ Pi = e^log(odds_i) / (1 + e^log(odds_i))\n\n∴ P1 =\
    \ e^0.693 / (1 + e^0.693) = 0.667\nP2 = e^0.693 / (1 + e^0.693) = 0.667\nP3 =\
    \ e^0.693 / (1 + e^0.693) = 0.667\n```\n\nAppend the `F0(x) = initial log(odds)`\
    \ and `Pi` to the table:\n\n![](Images/9789815136982-C6-P18.jpg)\n\nHere, `m`\
    \ is the index of decision tree; `rim` is the residual of the ith sample in the\
    \ mth decision tree.\n\n```\n∵ ∂L(yi, F(xi)) / ∂F(xi) = -yi + Pi\n∴ -∂L(yi, F(xi))\
    \ / ∂F(xi) = yi - Pi\n```\n\nWhen `m=1` (i.e., the first decision tree):\n\n```\n\
    ri1 = yi - Pi\n```\n\nHere, the `Pi` must be corresponding to `F0(xi)` since dealing\
    \ with the first decision tree.\n\nBy plugging in all the `Pi` values identified\
    \ from Step 1:\n\n```\nr11 = y1 - P1 = 1 - 0.667 = 0.333\nr21 = y2 - P2 = 0 -\
    \ 0.667 = -0.667\nr31 = y3 - P3 = 1 - 0.667 = 0.333\n```\n\n![](Images/9789815136982-C6-P19.jpg)\n\
    \n`squared_error` is used as the measure of the quality/purity of the split. The\
    \ optimal value of the child node after split is 0 (i.e., the purest child node),\
    \ e.g., for the leaf node on the right (i.e., the 2nd leaf node), it is calculated\
    \ as follows:\n\n```\nmean = (0.333 + (-0.667)) / 2 = -0.167\n\nsquared_error\
    \ = ((0.333 - (-0.167))^2 + (-0.667 - (-0.167))^2) / 2 = 0.25\n```\n\nNext, before\
    \ diving into **Step 2(c)**, let us quickly review the Taylor series.\n\n```\n\
    f(x) = f(a) + f'(a)/1! (x-a) + f''(a)/2! (x-a)^2 + f'''(a)/3! (x-a)^3 + …\n```\n\
    \nHere, `a` is a constant number, and `x` represents the independent variable.\n\
    \nTake a simple function, `f(x) = e^x`, for demonstration:\n\n```\nf'(x) = e^x\n\
    f''(x) = e^x\nf'''(x) = e^x\n```\n\nLet `a=0`, then `f(a)=1`, `f'(a)=1`, `f''(a)=1`,\
    \ `f'''(a)=1`.\n\nApply the Taylor series formula:\n\n```\n∴ f(x) = 1 + 1/1! x\
    \ + 1/2! x^2 + 1/3! x^3 + …\n```\n\nA quick validation can be conducted for the\
    \ Taylor series expansion. If using the original function `f(x)=e^x`, when `x=0.5`,\
    \ `e^0.5=1.649`. If using the Taylor Series expansion:\n\n```\n1 + 1/1! x + 1/2!\
    \ x^2 + 1/3! x^3 = 1 + 0.5 + 1/2(0.5^2) + 1/6(0.5^3) = 1.646\n```\n\nAs can be\
    \ seen, a good approximation is obtained when using Taylor Series.\n\nNow, let\
    \ us continue with the **Step 2(c)** of the gradient boosting classification.\n\
    \n![](Images/9789815136982-C6-P20.jpg)\n\nHere, `Rjm` denotes the jth leaf node\
    \ of the mth tree. In the first decision tree (i.e., `m = 1`), there are only\
    \ 2 leaf nodes, `R11` and `R21` as shown below.\n\n![](Images/9789815136982-C6-P21.jpg)\n\
    \nTo find the minimum using the first-order derivative:\n\n```\ndL(y3, F0(x3)\
    \ + ã) / dã = 0\n\nL'(y3, F0(x3)) + L''(y3, F0(x3)) * ã = 0\n\nã = -L'(y3, F0(x3))\
    \ / L''(y3, F0(x3))\n```\n\nAs derived previously, the first-order differentiation\
    \ of the loss function:\n\n```\n∵ ∂L(yi, F(xi)) / ∂F(xi) = -yi + Pi\n∴ L'(yi,\
    \ F(xi)) = -yi + Pi\n∴ L'(yi, F0(xi)) = -yi + Pi = -ri1\n```\n\nHere, the `Pi`\
    \ must be corresponding to `F0(xi)` since dealing with the first decision tree.\n\
    \n```\nL'(y3, F0(x3)) = -y3 + P3 = -r31\n-L'(y3, F0(x3)) = y3 - P3 = r31\n```\n\
    \nSecond-order differentiation is nothing but the first-order differentiation\
    \ of the first-order derivative. Besides, always bear in mind that `Pi = e^log(odds_i)\
    \ / (1 + e^log(odds_i))` and `F(xi) = log(odds_i)` when reading this section of\
    \ gradient boosting classification. So, the differentiation with respect to `F(xi)`\
    \ is the same as the differentiation with respect to `log(odds_i)`.\n\n![](Images/9789815136982-C6-P22.jpg)\n\
    \nDo not forget the first order differentiation derived above:\n\n```\nL'(yi,\
    \ F0(xi)) = -yi + Pi = -ri1\n```\n\nSo, finally gamma value for the 1st leaf `R11`:\n\
    \n```\nã = -L'(y3, F0(x3)) / L''(y3, F0(x3)) = r31 / (P3(1-P3)) = 0.333 / (0.667(1-0.667))\
    \ = 1.5\n```\n\n∴ `ã11 = 1.5`\n\n![](Images/9789815136982-C6-P23.jpg)\n\nLet us\
    \ summarize our findings and simplify the calculations of the `ã` value for each\
    \ leaf node. As observed from the final `ã` expression right above, the numerator\
    \ is just the sum of residuals of the samples allocated to the leaf node (e.g.,\
    \ `r11 + r21`), and the denominator is just the sum of `Pi(1-Pi)` of the samples\
    \ allocated to the leaf node (e.g., `P1(1-P1) + P2(1-P2)`). We can straightway\
    \ apply these relationships directly from the next decision tree onwards.\n\n\
    ![](Images/9789815136982-C6-P24.jpg)\n\nBy now, we have finished the first decision\
    \ tree (i.e., `m=1`) of Step 2.\n\nAssume a total of 2 decision trees (i.e., `M=2`)\
    \ are to be built for the gradient boosting model in this simple numerical example.\
    \ Let’s continue the computation for the 2nd decision tree.\n\n![](Images/9789815136982-C6-P26.jpg)\n\
    ![](Images/9789815136982-C6-P27.jpg)\n![](Images/9789815136982-C6-P28.jpg)\n\n\
    Since we assumed the gradient boosting classifier comprises 2 decision trees only\
    \ in this example, we have completed the whole Step 2 and the model training.\
    \ Then, in the end, the calculated probability needs to be mapped to class/label\
    \ (i.e., 0 or 1). Similar to Chapter 4 for logistic regression, the default threshold\
    \ of 0.5 is then employed. If `P ≥ 0.5`, it will be rounded up to 1 and predicted\
    \ as class 1; whereas, if `P < 0.5`, it will be rounded down to 0 and predicted\
    \ as class 0.\n\n![](Images/9789815136982-C6-P29.jpg)\n![](Images/9789815136982-C6-P30.jpg)\n\
    \nLooking back, we used the following expression in Step 2(d) when `m=2`:\n\n\
    ```\nF2(xi) = F1(xi) + á(ãj2 | xi ∈ Rj2)\n```\n\nDo not forget that we applied\
    \ this expression in Step 2(d) when `m=1`:\n\n```\nF1(xi) = F0(xi) + á(ãj1 | xi\
    \ ∈ Rj1)\n```\n\nIf concatenating them together, we can get this expression:\n\
    \n```\nF2(xi) = F0(xi) + á(ãj1 | xi ∈ Rj1) + á(ãj2 | xi ∈ Rj2)\n```\n\nThen, converting\
    \ `F2(xi)` to predicted probability by:\n\n```\nPi = e^log(odds_i) / (1 + e^log(odds_i))\
    \ = e^F2(xi) / (1 + e^F2(xi))\n```\n\nThis will be our trained gradient boosting\
    \ classification model for this simple example!\n\nHere, `(ãj1 | xi ∈ Rj1)` and\
    \ `(ãj2 | xi ∈ Rj2)` are the values we can find from the first and second decision\
    \ trees, respectively. `á` is the learning rate, and we set it as 0.5 in this\
    \ example.\n\nVisually, the model is like this:\n\n**Step 3. Output Fm(x)**\n\n\
    ![](Images/9789815136982-C6-P31.jpg)\n\nFinally, we come to the 3rd and last step\
    \ of the algorithm, making predictions for previously unseen data (i.e., new data)\
    \ using the trained gradient boosting classification model. For instance, if there\
    \ is a house with 3 bedrooms, the predicted class by the model will be:\n\n```\n\
    0.693 + 0.5 * 1.5 + 0.5 * -0.973 = 0.9565\n\nP = e^0.9565 / (1 + e^0.9565) = 0.7224\n\
    ```\n\nSince `P ≥ 0.5`, the predicted class will be 1, which means it is easy\
    \ to sell this house with 3 bedrooms.\n"
  trans: "\n\n## 6.5. 梯度提升分类的数值示例与代码对比\n\n接下来，根据梯度提升算法的输入步骤，我们必须检查损失函数是否可对 `F(xi)`\
    \ 求导：\n\n```\n∂L(yi, F(xi)) / ∂F(xi) = -yi + (1 / (1 + e^F(xi))) * e^F(xi)\n \
    \                       = -yi + e^F(xi) / (1 + e^F(xi))\n                    \
    \    = -yi + e^log(odds_i) / (1 + e^log(odds_i))\n                        = -yi\
    \ + Pi\n```\n\n阅读本节梯度提升分类内容时，请始终牢记 `P = e^log(odds) / (1 + e^log(odds))`。\n\n\
    从 `L(yi, F(xi))` 对 `F(xi)` 的一阶导数可以看出，它最终得出一个非常简洁的表达式（即 `-yi + Pi`），其中 `Pi` 是第\
    \ i 个样本的预测概率（∈ [0, 1]），`yi` 是第 i 个样本的真实输出（0 或 1）。\n\n假设我们有一个如**表 6.4**所示的小型训练数据集，仅包含\
    \ 3 个样本（即 n=3），该数据集有一个特征，即房屋的卧室总数（简写为 `num_bedrooms`），以及一个输出，即房屋在房地产市场上是否容易出售（简写为\
    \ `is_easy_sell`）。输出是二分的，只有两种可能的输出（即 0 和 1），其中 0 表示否（不容易出售），1 表示是（容易出售）。换句话说，对于这个例子，`X`\
    \ 是 `num_bedrooms`，`Y` 是 `is_easy_sell`。我们的任务是构建一个梯度提升分类模型，将 `X` 映射到 `Y`。\n\n\
    **表 6.4 梯度提升分类的小型数据集。**\n\n| ![](img/9789815136982-C6-T4.jpg) |\n\n使用这个小型训练数据集，我们将把伪代码分解成小块并逐步执行。\n\
    \n![](img/9789815136982-C6-P17.jpg)\n\n利用一阶导数寻找最小值：\n\n```\nd(∑(i=1 to n) L(yi,\
    \ ã)) / dã = 0\n\n∴ -y1 + e^ã/(1+e^ã) - y2 + e^ã/(1+e^ã) - y3 + e^ã/(1+e^ã) =\
    \ 0\n\n3 * e^ã/(1+e^ã) = y1 + y2 + y3\n\ne^ã/(1+e^ã) = (y1+y2+y3)/3 = (1+0+1)/3\
    \ = 2/3\n\n3e^ã = 2(1+e^ã)\n\ne^ã = 2\n\nã = log(2) = 0.693\n```\n\n请记住，`F0(x)`\
    \ 是使总损失最小化的 `ã` 值，因此初始 `F0(x) = ã = 0.693`。\n\n```\n∵ F(x) = log(odds)\n∴ F0(x)\
    \ = 初始 log(odds) = 0.693，这是最初所有样本的常数值。\n```\n\n因此，\n\n```\nF0(x1) = 初始 log(odds1)\
    \ = 0.693\nF0(x2) = 初始 log(odds2) = 0.693\nF0(x3) = 初始 log(odds3) = 0.693\n```\n\
    \n根据计算出的初始 `log(odds_i)` 求预测概率 `Pi`：\n\n```\n∵ Pi = e^log(odds_i) / (1 + e^log(odds_i))\n\
    \n∴ P1 = e⁰.693 / (1 + e⁰.693) = 0.667\nP2 = e⁰.693 / (1 + e⁰.693) = 0.667\nP3\
    \ = e⁰.693 / (1 + e⁰.693) = 0.667\n```\n\n将 `F0(x) = 初始 log(odds)` 和 `Pi` 追加到表中：\n\
    \n![](img/9789815136982-C6-P18.jpg)\n\n这里，`m` 是决策树的索引；`rim` 是第 m 棵决策树中第 i 个样本的残差。\n\
    \n```\n∵ ∂L(yi, F(xi)) / ∂F(xi) = -yi + Pi\n∴ -∂L(yi, F(xi)) / ∂F(xi) = yi - Pi\n\
    ```\n\n当 `m=1` 时（即第一棵决策树）：\n\n```\nri1 = yi - Pi\n```\n\n这里，`Pi` 必须对应 `F0(xi)`，因为我们正在处理第一棵决策树。\n\
    \n代入步骤 1 中确定的所有 `Pi` 值：\n\n```\nr11 = y1 - P1 = 1 - 0.667 = 0.333\nr21 = y2 -\
    \ P2 = 0 - 0.667 = -0.667\nr31 = y3 - P3 = 1 - 0.667 = 0.333\n```\n\n![](img/9789815136982-C6-P19.jpg)\n\
    \n`squared_error`（平方误差）被用作分裂质量/纯度的度量。分裂后子节点的最优值为 0（即最纯的子节点），例如，对于右侧的叶节点（即第 2 个叶节点），计算如下：\n\
    \n```\nmean = (0.333 + (-0.667)) / 2 = -0.167\n\nsquared_error = ((0.333 - (-0.167))²\
    \ + (-0.667 - (-0.167))²) / 2 = 0.25\n```\n\n接下来，在深入**步骤 2(c)** 之前，让我们快速回顾一下泰勒级数。\n\
    \n```\nf(x) = f(a) + f'(a)/1! (x-a) + f''(a)/2! (x-a)² + f'''(a)/3! (x-a)³ + …\n\
    ```\n\n这里，`a` 是一个常数，`x` 代表自变量。\n\n以简单函数 `f(x) = e^x` 为例进行演示：\n\n```\nf'(x) = e^x\n\
    f''(x) = e^x\nf'''(x) = e^x\n```\n\n令 `a=0`，则 `f(a)=1`，`f'(a)=1`，`f''(a)=1`，`f'''(a)=1`。\n\
    \n应用泰勒级数公式：\n\n```\n∴ f(x) = 1 + 1/1! x + 1/2! x² + 1/3! x³ + …\n```\n\n可以对泰勒级数展开进行快速验证。如果使用原函数\
    \ `f(x)=e^x`，当 `x=0.5` 时，`e⁰.5=1.649`。如果使用泰勒级数展开：\n\n```\n1 + 1/1! x + 1/2! x²\
    \ + 1/3! x³ = 1 + 0.5 + 1/2(0.5²) + 1/6(0.5³) = 1.646\n```\n\n可以看出，使用泰勒级数可以获得良好的近似。\n\
    \n现在，让我们继续进行梯度提升分类的**步骤 2(c)**。\n\n![](img/9789815136982-C6-P20.jpg)\n\n这里，`Rjm`\
    \ 表示第 m 棵树的第 j 个叶节点。在第一棵决策树中（即 `m = 1`），只有 2 个叶节点，如下所示的 `R11` 和 `R21`。\n\n![](img/9789815136982-C6-P21.jpg)\n\
    \n利用一阶导数寻找最小值：\n\n```\ndL(y3, F0(x3) + ã) / dã = 0\n\nL'(y3, F0(x3)) + L''(y3,\
    \ F0(x3)) * ã = 0\n\nã = -L'(y3, F0(x3)) / L''(y3, F0(x3))\n```\n\n如前所述，损失函数的一阶导数：\n\
    \n```\n∵ ∂L(yi, F(xi)) / ∂F(xi) = -yi + Pi\n∴ L'(yi, F(xi)) = -yi + Pi\n∴ L'(yi,\
    \ F0(xi)) = -yi + Pi = -ri1\n```\n\n这里，`Pi` 必须对应 `F0(xi)`，因为我们正在处理第一棵决策树。\n\n\
    ```\nL'(y3, F0(x3)) = -y3 + P3 = -r31\n-L'(y3, F0(x3)) = y3 - P3 = r31\n```\n\n\
    二阶导数无非是一阶导数的一阶导数。此外，阅读本节梯度提升分类内容时，请始终牢记 `Pi = e^log(odds_i) / (1 + e^log(odds_i))`\
    \ 和 `F(xi) = log(odds_i)`。因此，对 `F(xi)` 求导等同于对 `log(odds_i)` 求导。\n\n![](img/9789815136982-C6-P22.jpg)\n\
    \n不要忘记上面推导出的一阶导数：\n\n```\nL'(yi, F0(xi)) = -yi + Pi = -ri1\n```\n\n因此，第 1 个叶节点\
    \ `R11` 的 gamma 值最终为：\n\n```\nã = -L'(y3, F0(x3)) / L''(y3, F0(x3)) = r31 / (P3(1-P3))\
    \ = 0.333 / (0.667(1-0.667)) = 1.5\n```\n\n∴ `ã11 = 1.5`\n\n![](img/9789815136982-C6-P23.jpg)\n\
    \n让我们总结一下发现，并简化每个叶节点 `ã` 值的计算。从上面最终的 `ã` 表达式可以看出，分子只是分配给该叶节点的样本残差之和（例如 `r11 +\
    \ r21`），分母只是分配给该叶节点的样本的 `Pi(1-Pi)` 之和（例如 `P1(1-P1) + P2(1-P2)`）。从下一棵决策树开始，我们可以直接应用这些关系。\n\
    \n![](img/9789815136982-C6-P24.jpg)\n\n到目前为止，我们已经完成了步骤 2 的第一棵决策树（即 `m=1`）。\n\n\
    假设在这个简单的数值示例中，梯度提升模型总共要构建 2 棵决策树（即 `M=2`）。让我们继续进行第 2 棵决策树的计算。\n\n![](img/9789815136982-C6-P26.jpg)\n\
    ![](img/9789815136982-C6-P27.jpg)\n![](img/9789815136982-C6-P28.jpg)\n\n既然在这个例子中我们假设梯度提升分类器仅包含\
    \ 2 棵决策树，那么我们就完成了整个步骤 2 和模型训练。最后，计算出的概率需要映射到类别/标签（即 0 或 1）。类似于第 4 章的逻辑回归，采用默认阈值\
    \ 0.5。如果 `P ≥ 0.5`，则向上取整为 1 并预测为类别 1；而如果 `P < 0.5`，则向下取整为 0 并预测为类别 0。\n\n![](img/9789815136982-C6-P29.jpg)\n\
    ![](img/9789815136982-C6-P30.jpg)\n\n回顾一下，我们在 `m=2` 的步骤 2(d) 中使用了以下表达式：\n\n```\n\
    F2(xi) = F1(xi) + á(ãj2 | xi ∈ Rj2)\n```\n\n不要忘记我们在 `m=1` 的步骤 2(d) 中应用了这个表达式：\n\
    \n```\nF1(xi) = F0(xi) + á(ãj1 | xi ∈ Rj1)\n```\n\n如果将它们串联起来，可以得到这个表达式：\n\n```\n\
    F2(xi) = F0(xi) + á(ãj1 | xi ∈ Rj1) + á(ãj2 | xi ∈ Rj2)\n```\n\n然后，通过以下方式将 `F2(xi)`\
    \ 转换为预测概率：\n\n```\nPi = e^log(odds_i) / (1 + e^log(odds_i)) = e^F2(xi) / (1 +\
    \ e^F2(xi))\n```\n\n这将成为我们针对这个简单示例训练好的梯度提升分类模型！\n\n这里，`(ãj1 | xi ∈ Rj1)` 和 `(ãj2\
    \ | xi ∈ Rj2)` 是我们可以从第一棵和第二棵决策树中找到的值。`á` 是学习率，在本例中我们将其设为 0.5。\n\n直观上，模型如下所示：\n\
    \n**步骤 3. 输出 Fm(x)**\n\n![](img/9789815136982-C6-P31.jpg)\n\n最后，我们来到算法的第 3 步，也就是最后一步：使用训练好的梯度提升分类模型对先前未见过的数据（即新数据）进行预测。例如，如果有一栋有\
    \ 3 间卧室的房子，模型预测的类别将是：\n\n```\n0.693 + 0.5 * 1.5 + 0.5 * -0.973 = 0.9565\n\nP =\
    \ e⁰.9565 / (1 + e⁰.9565) = 0.7224\n```\n\n因为 `P ≥ 0.5`，预测类别将为 1，这意味着这栋有 3 间卧室的房子容易出售。\n\
    \n"
