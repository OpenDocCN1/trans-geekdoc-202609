    # Linear Regression


    ## Notation


    - `n` is the number of input features

    - `wj` is the weight of the jth feature

    - `y^i` is the predicted value for the ith sample


    ## Mean Squared Error (MSE)


    The Mean Squared Error (MSE) function (Equation 2.4) is commonly employed to quantify
    the mean loss (`L`) of the predicted output value against the true output value.
    In layman''s terms, it is an indication of how well the model''s prediction is.


    ![](Images/9789815136982-C2-Eq4.jpg)


    Where:


    - `L` is the mean loss

    - `m` is the number of training samples

    - `yi` is the true value for the ith sample

    - `y^i` is the predicted value for the ith sample


    ## Gradient Descent Optimization


    Next, the Gradient Descent optimization algorithm is used to find the optimal
    bias and weights by iteratively tweaking their values a tiny bit at a time in
    the direction of reducing the loss.


    In order to carry out the optimization, we first need to find the partial derivative
    of the mean loss (`L`) with respect to the bias and weights, namely, `∂L/∂b` and
    `∂L/∂wj`, denoting the contribution to the mean loss by the bias and each of the
    weights. This can be done by applying the chain rule, shown in Equations (2.5)
    to (2.9).


    ![](Images/9789815136982-C2-Eq5-9.jpg)


    Here, `j ∈ [1, n]` and `n` is the number of features.


    Subsequently, gradient descent is used to update the bias, `b` (Equation 2.10)
    and the weights, `w` (Equation 2.11).


    ![](Images/9789815136982-C2-Eq10.jpg)


    ![](Images/9789815136982-C2-Eq11.jpg)


    Here, `α` is the learning rate (typically a small value, *e.g.,* 0.1, 0.01, 0.001).


    > **Note:** The mathematical notations and Python codes in this chapter are somewhat
    similar to those in Chapters 3 and 4 of this book [[5]](#9789815136982-C2.html#r5),
    [[6]](#9789815136982-C2.html#r6). However, the focuses of Chapters 3 and 4 are
    on regularization and logistic regression, respectively, whereas the focus of
    this chapter is on linear regression.


    ## 2.3. Numerical Example of Linear Regression


    Suppose we have a small training dataset (presented in Table 2.1) with only 3
    samples (*i.e.,* `m=3`), which pertains to the sale price of houses in millions
    of dollars (abbreviated as `sale_price_million`) based on 2 input features (*i.e.,*
    `n=2`), namely, the size of a house in square feet (abbreviated as `size_sqft`)
    and the total number of bedrooms in a house (abbreviated as `num_bedrooms`). In
    other words, for this example, `X` is `size_sqft` and `num_bedrooms`, and `Y`
    is `sale_price_million`. Our task is to build a best-fit linear regression model
    that maps `X` and `Y`.


    **Table 2.1: The small dataset for linear regression.**


    | `size_sqft` | `num_bedrooms` | `sale_price_million` |

    | :--- | :--- | :--- |

    | 1600 | 5 | 2.28 |

    | 1200 | 4 | 1.5 |

    | 740 | 2 | 0.88 |


    Next, normalize the feature values (*i.e.,* the values of `size_sqft` and `num_bedrooms`
    columns) to bring them to a common scale between 0 and 1, using Max-min normalization,
    as shown in Equation (2.12). Without normalization, some feature(s) might dominate
    the machine learning process.


    ![](Images/9789815136982-C2-Eq12.jpg)


    The maximum and minimum of `size_sqft` are 1600 and 740, respectively. Likewise,
    the maximum and minimum of `num_bedrooms` are 5 and 2, respectively. The output
    values (*i.e.,* `sale_price_million`) are left as they are, without any normalization.
    The small dataset after Max-min normalization on the features is presented in
    Table 2.2.


    **Table 2.2: The small dataset after Max-min normalization for linear regression.**


    | `size_sqft` | `num_bedrooms` | `sale_price_million` |

    | :--- | :--- | :--- |

    | 1 | 1 | 2.28 |

    | 0.5349 | 0.6667 | 1.5 |

    | 0 | 0 | 0.88 |


    Now, let us start the machine learning process to build a linear regression model.


    Initialize the bias:

    ```

    b = 0

    ```


    Initialize the weight for feature `size_sqft`:

    ```

    w1 = 0

    ```


    Initialize the weight for feature `num_bedrooms`:

    ```

    w2 = 0

    ```


    Set the learning rate:

    ```

    α = 0.01

    ```


    > **Note:** For simplicity of writing and expression, all the following `xij`
    refers to the normalized `xij` by default, unless otherwise stated.


    ### 2.3.1. Start the First Iteration of Learning


    Take the input values of the first training sample and calculate the predicted
    `ŷ1`:


    ![](Images/9789815136982-C2-a.jpg)


    ![](Images/9789815136982-C2-b.jpg)


    ![](Images/9789815136982-C2-c.jpg)


    ![](Images/9789815136982-C2-d.jpg)


    Compared with the previous MSE = 2.5576 after the first iteration, it is noticed
    that the MSE is now reduced to 2.3865, indicating that the performance of the
    linear regression model has been improving!


    Further, the same learning process is set to repeat a total of 500,000 times to
    keep updating the bias and weights until the mean loss between the true and predicted
    output values stabilizes and reaches its minimum; only then are the optimal bias
    and weights said to be obtained. For conciseness, we will not present the detailed
    calculations from the third iteration onwards in the chapter, but tabulate the
    bias, weights and MSE for the first and last five iterations in Table 2.3. If
    necessary, readers are encouraged to try several more iterations following the
    detailed calculations above to have a deeper understanding about the process of
    training a linear regression model. Besides, Figure 2.3 depicts that MSE decreases
    with the increase of learning iterations and finally stabilizes.


    **Table 2.3: The bias, weights and MSE values for the first and last five iterations.**


    | Iteration | `b` | `w1` | `w2` | MSE |

    | :--- | :--- | :--- | :--- | :--- |

    | 1 | 0.03107 | 0.02055 | 0.02187 | 2.5576 |

