    \ Kutner M.H., Neter J., Nachtsheim C.J., Wasserman W.. , . Applied linear statistical\
    \ models (int’l ed). 4th ed. Maidenhead; England: 2004. |\n\n| \\[5\\] || Wang\
    \ Z., Irfan S.A., Teoh C., Bhoyar P.H.. , . Regularization” in Numerical Machine\
    \ Learning.. Bentham Science; 2023. |\n\n| \\[6\\] || Wang Z., Irfan S.A., Teoh\
    \ C., Bhoyar P.H.. , . Logistic Regression” in Numerical Machine Learning.. Bentham\
    \ Science; 2023. |\n\n# 正则化\n\n**Zhiyuan Wang**, **Sayed Ameenuddin Irfan**, **Christopher\
    \ Teoh**, **Priyanka Hriday Bhoyar**  \n\n## 摘要\n\n本章深入探讨了线性回归背景下的 L1 和 L2 正则化技术，重点在于将过拟合风险降至最低，同时简明扼要地阐述数学理论。我们通过一个预测房屋销售价格的小型数据集具体数值示例来探讨这些技术，并提供分步演示。为进一步加深理解，我们提供了示例代码，并与\
    \ `scikit-learn` 库中实现的 Lasso 和 Ridge 模型进行了对比。读完本章后，读者将全面理解线性回归背景下的 L1 和 L2 正则化、它们对模型实现和性能的影响，并掌握在实际应用中使用这些方法的知识。\n\
    \n**关键词：** L1 正则化，L2 正则化，线性回归，数值示例，小型数据集，房价预测，Scikit-Learn，Lasso，Ridge。  \n\n\
    ## 3.1. L1 和 L2 正则化简介\n\n正则化是指通过给权重值较大的更复杂模型增加额外惩罚项来防止过拟合的过程。过拟合是指机器学习模型专门针对训练数据集进行建模，导致其无法很好地泛化到先前未见过的数据集的问题。将正则化技术引入机器学习模型对于实现更好的泛化能力和在新数据上的性能提升至关重要。通过惩罚过于复杂的模型，正则化有助于得出更准确、更稳定的预测。常见的正则化方法包括\
    \ L1 和 L2 正则化，它们惩罚模型复杂度的方式不同。正则化已被证明是开发稳健可靠模型的关键组成部分，特别是在处理高维数据或含噪数据集时。它使从业者能够构建更高效的模型，这些模型能够适应新的多样化情况，同时降低过拟合风险并保持可解释性。\n\
    \n本章重点介绍 L1 和 L2 正则化，通过对第 2 章讨论的原始线性回归模型进行必要修改来详细演示。但请记住，L1 和 L2 正则化也可应用于其他机器学习模型（如逻辑回归）以及深度学习神经网络。\n\
    \nL1 和 L2 正则化的名称源自权重向量 `W` 对应的 L1 和 L2 范数。\n\nL1 范数定义为：\n\n![](img/9789815136982-C3-E1.jpg)\n\
    \n带有 L1 正则化的线性回归模型称为 Lasso（最小绝对收缩和选择算子）回归 \\[1, 2\\]，而带有 L2 正则化的线性回归模型称为 Ridge（岭）回归\
    \ \\[3, 4\\]。\n\n## 3.2. 线性回归 L1 正则化的数学原理\n\n如果有一个以上的自变量 `X`（即输入特征），线性回归的通用方程如下：\n\
    \n![](img/9789815136982-C3-E2.jpg)\n\n线性回归的目标是找到一个最佳拟合线性方程模型，该模型以公式 (3.1) 的形式映射输入\
    \ `X` 和输出 `Y` 之间的关系，具有最优的权重和偏置，使得已知真实输出 `Y` 值与模型预测输出 `Y` 值之间的误差（在机器学习中同义称为损失）最小。\n\
    \n![](img/9789815136982-C3-E3.jpg)\n\n![](img/9789815136982-C3-F1.jpg)**图 (3.1)**\
    \  \n\n使用示例训练数据集的符号说明。\n\n![](img/9789815136982-C3-E4.jpg)\n\n![](img/9789815136982-C3-E5.jpg)\n\
    \n![](img/9789815136982-C3-E6.jpg)\n\n接下来，使用梯度下降优化算法，通过沿着减少损失的方向迭代地微调偏置和权重的值，来寻找最优偏置和权重。为了进行优化，我们首先需要求出平均损失（`L`）关于偏置和权重的偏导数，即\
    \ `∂L/∂b` 和 `∂L/∂wj`，它们分别表示偏置和各个权重对平均损失的贡献。这可以通过应用链式法则来完成，如公式 (3.4) 至 (3.9) 所示。\n\
    \n![](img/9789815136982-C3-E7.jpg)\n\n![](img/9789815136982-C3-E8.jpg)\n\n值得注意的是，本章中的数学符号和\
    \ Python 代码与本书第 2 章和第 4 章 \\[5, 6\\] 有些相似。然而，第 2 章和第 4 章的重点分别在于线性回归和逻辑回归，而本章的重点在于正则化。\n\
    \n## 3.3. 线性回归 L1 正则化的数值示例\n\n同第 2 章讨论的原始线性回归一样，假设我们有一个如（表 **3.1**）所示的小型训练数据集，仅包含\
    \ 3 个样本（即 `m=3`），涉及基于 2 个输入特征（即 `n=2`）的房屋销售价格（以百万美元为单位，缩写为 `sale_price_million`），分别为：房屋面积（平方英尺，缩写为\
    \ `size_sqft`）和房屋卧室总数（缩写为 `num_bedrooms`）。换句话说，对于本示例，`X` 为 `size_sqft` 和 `num_bedrooms`，`Y`\
    \ 为 `sale_price_million`。我们的任务是构建一个在 L1 正则化下映射 `X` 和 `Y` 的最佳拟合线性回归模型。\n\n表 3.1\
    \ **正则化下线性回归的小型数据集。**  \n\n| **size_sqft** || **num_bedrooms** || **sale_price_million**\
    \ |\n\n| --- | --- | --- |\n\n| 1600 || 5 || 2.28 |\n\n| --- | --- | --- |\n\n\
    | 1200 || 4 || 1.5 |\n\n| 740 || 2 || 0.88 |\n\n接下来，使用最大-最小归一化（如公式 (3.12) 所示）将特征值（即\
    \ `size_sqft` 和 `num_bedrooms` 列的值）归一化到 0 到 1 的通用尺度。如果不进行归一化，某些特征可能会主导机器学习过程。\n\
    \n![](img/9789815136982-C3-E9.jpg)\n\n`size_sqft` 的最大值和最小值分别为 1600 和 740。同理，`num_bedrooms`\
    \ 的最大值和最小值分别为 5 和 2。输出值（即 `sale_price_million`）保持原样，不进行任何归一化。对特征进行最大-最小归一化后的小型数据集如（表\
    \ **3.2**）所示。\n\n表 3.2 **正则化下线性回归的最大-最小归一化后的小型数据集。**  \n\n| **size_sqft** || **num_bedrooms**\
    \ || **sale_price_million** |\n\n| --- | --- | --- |\n\n| 1 || 1 || 2.28 |\n\n\
    | --- | --- | --- |\n\n| 0.5349 || 0.6667 || 1.5 |\n\n| 0 || 0 || 0.88 |\n\n![](img/9789815136982-C3-E10.jpg)\n\
    \n"
