    # 无监督学习应用与 K-means 聚类


    无监督学习有多种应用，例如异常检测、聚类和降维。例如，无监督学习算法可用于根据客户对电子设备的使用情况对其进行聚类，目的是识别蓝光过滤镜片的潜在用户。一类客户可能在屏幕上花费大量时间并频繁使用多种设备，表明他们可能是蓝光过滤镜片的潜在用户。另一类客户可能很少使用电子设备，表明他们可能对购买蓝光过滤镜片不感兴趣。聚类信息可为营销工作提供有价值的见解，并实现对潜在客户的精准定位。


    有许多无监督机器学习算法可用，包括 `K-means clustering`（K-means 聚类）、主成分分析和层次聚类。在本章中，我们将深入探讨 `K-means
    clustering` 的细节。在使用 `K-means clustering` 算法之前，重要的是要注意，距离度量对于准确测量二维到 n 维空间中数据点之间的距离并形成适当的聚类至关重要。有四种流行的距离度量，即欧几里得距离、曼哈顿距离、余弦相似度和切比雪夫距离。


    ## 8.1 距离度量


    ### 8.1.1 欧几里得距离


    欧几里得距离是一种常用的距离度量，通过确定两点之间的最短路径来计算它们之间的距离。计算欧几里得距离的公式是两点坐标平方差之和的平方根。该度量有助于理解多维空间中数据点之间的关系。


    点 A 和点 B 之间的欧几里得距离定义为：


    ```

    D_AB = sqrt((x2-x1)² + (y2-y1)² + ... + (z2-z1)²)      (8.1)

    ```


    此处，点 A 的坐标为 `x1, y1, ..., z1`，点 B 的坐标为 `x2, y2, ..., z2`。


    ### 8.1.2 曼哈顿距离


    曼哈顿距离，也称为出租车距离，是一种通过将坐标的绝对差值相加来计算两点之间距离的距离度量。之所以称之为出租车距离，是因为它代表了出租车从一个地点行驶到另一个地点所需的距离，前提是它只能水平或垂直移动。


    点 A 和点 B 之间的曼哈顿距离定义为：


    ```

    D_AB = |x2-x1| + |y2-y1| + ... + |z2-z1|      (8.2)

    ```


    此处，点 A 的坐标为 `x1, y1, ..., z1`，点 B 的坐标为 `x2, y2, ..., z2`。


    ### 8.1.3 余弦相似度


    余弦相似度是一种距离度量，通过计算两个向量夹角的余弦值来确定它们的相似程度。


    向量 A 和 B 之间的余弦相似度定义为：


    ```

    cos(θ) = (A ⋅ B) / (||A|| ||B||)      (8.3)

    ```


    此处，`θ` 是向量 A 和 B 之间的夹角。


    `A ⋅ B` 是向量 A 和 B 的点积。


    `||A||` 和 `||B||` 分别是向量 A 和 B 的 L2 范数。


    ### 8.1.4 切比雪夫距离


    切比雪夫距离，也称为棋盘距离，是另一种度量向量空间中两个向量之间距离的指标。它通过确定两个向量在任意坐标维度上的最大差值来计算。


    点 A 和点 B 之间的切比雪夫距离定义为：


    ```

    D_AB = max(|x2-x1|, |y2-y1|, ..., |z2-z1|)      (8.4)

    ```


    此处，点 A 的坐标为 `x1, y1, ..., z1`，点 B 的坐标为 `x2, y2, ..., z2`。


    ## 8.2 K-means 聚类算法


    `K-means clustering` 由 Stuart Lloyd 于 1957 年在贝尔实验室首创，用于脉冲编码调制。该想法直到 1982 年才在公司外部公开发表。由于
    Edward W. Forgy 于 1965 年开发了一种几乎相同的方法，`K-means clustering` 算法也被称为 Lloyd-Forgy 算法
    [[2]](#9789815136982-C8.html#r2)。此后，它已成为无监督机器学习领域中一种广泛使用的算法，用于将数据聚类为具有相似特征的组。


    让我们了解 `K-means` 算法的工作原理及其形成聚类的方式。如果我们获得了一个无标签数据集的质心，则可以通过将每个样本分配给最近质心的聚类来轻松标记所有样本。另一方面，如果我们获得了所有样本的标签，则可以通过计算每个聚类中样本的均值来轻松找到所有质心。然而，由于标签和质心均未给出，我们不清楚如何着手。为了开始，我们可以简单地随机放置质心（例如，随机选择
    `k` 个样本并使用它们的位置作为初始质心）。下一步是标记样本，然后更新质心，再次标记样本，再次更新质心，以此类推，直到质心不再移动。该方法不会无限期地继续振荡，因为它被设计为在一定步数后收敛
    [[3]](#9789815136982-C8.html#r3)。


    简而言之，`K-means clustering` 算法可分为以下 6 个步骤 [[4]](#9789815136982-C8.html#r4)：


    1. 为 `k` 个聚类随机初始化 `k` 个质心（即随机选择 `k` 个样本并使用它们的位置作为初始质心）。

    2. 计算每个样本到这 `k` 个质心的欧几里得距离。

    3. 将数据集中的每个样本分配给最近的质心。

    4. 计算每个聚类中样本的均值。

    5. 将质心重新分配为每个聚类中样本的均值。

    6. 重复步骤 2 到 5，直到收敛（即 `k` 个质心不再移动或直到达到预定的迭代次数）。最终的聚类和质心代表 `K-means` 算法的输出。


    应用 `K-means clustering` 算法的一个关键挑战是为质心数量 `k` 选择一个合适的值。可以使用肘部法来确定 `k` 的最优值。它通过为一系列
    `k` 值拟合模型，并选择导致最低聚类内平方和 (WCSS) 的 `k` 来实现这一点。WCSS 测量聚类中每个样本到该聚类质心的平方距离之和。较低的 WCSS
    表示更好的拟合，因为这意味着样本更接近其质心。如 图 8.1 所示的示例图表，肘部点对应于 WCSS 开始趋于平稳时的 `k` 值，表明增加额外的聚类不会显著改善拟合；该点随后被选为
    `k` 的最优值。对于第 8.3 节的数值示例，我们将使用 `k = 3` 来演示 `K-means clustering` 算法的 6 个步骤。在第 8.4
    节中，我们将解释为何为该数据集选择 `k = 3`。


    ![图 8.1](img/9789815136982-C8-F1.jpg)


    **图 8.1** 聚类内平方和 (WCSS) 与聚类数量的示例图表。


    ## 8.3 K-means 聚类的数值示例


    如表 8.1 所示，一个小型数据集包含 6 名学生 S1 至 S6 在数学和科学两门学科上的分数。我们的任务是使用 `K-means clustering`
    算法根据他们的分数将这些学生聚类为不同的组。


    **表 8.1** K-means 聚类的小型数据集。


    | 学生编号 | 数学分数 | 科学分数 |

    | :--- | :---: | :---: |

    | S1 | 40 | 45 |

    | S2 | 60 | 75 |

    | S3 | 65 | 70 |

    | S4 | 90 | 90 |

    | S5 | 100 | 95 |

    | S6 | 45 | 35 |


    在第一次迭代中，随机选取学生 S6、S2 和 S3 的分数作为初始 3 个聚类的质心（即 `k = 3`）。将这 3 个质心分别表示为 `C1 (45, 35)`、`C2
    (60, 75)` 和 `C3 (65, 70)`。然后我们将计算每个样本到质心的欧几里得距离。


    计算 `C1` 到所有 6 个样本的距离：


    ```

    Distance from C1 to S1 = sqrt((45-40)² + (35-45)²) = 11.18

    ```

