- raw: "Now let us compare the results obtained above with that from the off-the-shelf\
    \ gradient boosting classifier offered by the scikit-learn library.\n\nThe complete\
    \ code file can be downloaded from our shared folder in Google Drive:\n\n[https://drive.google.com/drive/folders/1FqJvo4ZPazNbEH\\\
    _GlHFoodqvegnQmHcn?usp=share\\_link](https://drive.google.com/drive/folders/1FqJvo4ZPazNbEH_GlHFoodqvegnQmHcn?usp=share_link)\n\
    \n![](Images/9789815136982-C6-B4.jpg)\n\n![](Images/9789815136982-C6-B5.jpg)\n\
    \n![](Images/9789815136982-C6-B6.jpg)\n\n![](Images/9789815136982-C6-B7.jpg)\n\
    \nAs can be seen from the results of scikit-learn gradient boosting classifier\
    \ and compared with our manually calculated results, the same decision trees are\
    \ generated, with the same squared\\_error for all the nodes of the decision trees,\
    \ and the same gamma values for all the leaf nodes of the decision trees (note\
