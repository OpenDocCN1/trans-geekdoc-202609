    # 进一步训练与结果


    此外，将相同的学习过程设置为总共重复 500,000 次，以便在 L2 正则化下持续更新偏置和权重，直到真实输出值与预测输出值之间的平均损失稳定下来；只有到那时，才说获得了最优的偏置和权重。为求简洁，本章将不再展示从第三次迭代开始的详细计算，而是在**表
