    \ = 0.382` 或 `2.618`）。\n\n# 7.6 支持向量机数值示例与代码对比：使用径向基函数核的线性不可分情况\n\n使用径向基函数（RBF）核的概念与多项式核相同，只是用于将低维输入空间变换到高维空间的函数不同。\n\
