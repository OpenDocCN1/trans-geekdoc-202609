    So now, it can be expressed as:


    $\vec{W} \cdot \vec{u} + b \ge 1$ for $+$ data points


    $\vec{W} \cdot \vec{u} + b \le -1$ for $-$ data points


    For the target output $y_i$, use $+1$ to denote the data point in the positive
    ($+$) class, and $-1$ to denote the data point in the negative ($-$) class:


    $y_i = +1$ for $+$ data points


    $y_i = -1$ for $-$ data points


    Therefore, with these, we can get:


    $y_i(\vec{W} \cdot \vec{u} + b) \ge 1$ for all data points.


    $y_i(\vec{W} \cdot \vec{u} + b) = 1$ for data points on the edge lines *(i.e.,*
    the support vectors).


    Next, to express the margin, take 2 support vectors $\vec{x_+}$ from the $+$ class
    and $\vec{x_-}$ from the $-$ class, and the difference of these 2 vectors will
    be $\vec{x_+} - \vec{x_-}$, as shown in Fig. ([**7.4**](#9789815136982-C7.html#f7.4)).
    Recall that we have a normal vector $\vec{W}$ that is perpendicular to the margin.
    The corresponding unit normal vector is $\frac{\vec{W}}{|\vec{W}|}$, where the
    denominator $|\vec{W}|$ is the magnitude of $\vec{W}$. Thus, the margin can be
    expressed as:


    ![](Images/9789815136982-C7-F4.jpg)

    **Fig. (7.4)**


    Illustration of support vectors $\vec{x_+}$ from positive class and $\vec{x_-}$
    from negative class, and their difference $\vec{x_+} - \vec{x_-}$.


    $\text{margin} = \frac{(\vec{x_+} - \vec{x_-}) \cdot \vec{W}}{|\vec{W}|}$


    Do not forget the constraint derived for all support vectors previously:


    $y_i(\vec{W} \cdot \vec{u} + b) = 1$


    Hence, for $\vec{x_+}$, it will be:


    $1(\vec{W} \cdot \vec{x_+} + b) = 1$


    $\vec{W} \cdot \vec{x_+} = 1 - b$


    For $\vec{x_-}$, it will be:


    $-1(\vec{W} \cdot \vec{x_-} + b) = 1$


    $-\vec{W} \cdot \vec{x_-} = 1 + b$


    The expression for margin is updated:


    $\text{margin} = \frac{\vec{x_+} - \vec{x_-} \cdot \vec{W}}{|\vec{W}|} = \frac{\vec{W}
    \cdot \vec{x_+} - \vec{W} \cdot \vec{x_-}}{|\vec{W}|} = \frac{1 - b + 1 + b}{|\vec{W}|}
    = \frac{2}{|\vec{W}|}$


    Bear in mind that the objective is to find a hyperplane that is tied to the maximum
    margin.


    $\text{margin} = \frac{2}{|\vec{W}|}$, for maximization


    $\to$ equivalent to minimize the denominator $|\vec{W}|$


    $\to$ equivalent to minimize $\frac{1}{2}|\vec{W}|^2$


    The reason for this transformation is purely for mathematical convenience in the
    following derivations.


    Therefore, a single objective optimization (SOO) problem has been formulated,
    as follows:


    minimize $f = \frac{1}{2}|\vec{W}|^2$


    subject to the following constraint:


    $g_i = y_i(\vec{W} \cdot \vec{x_i} + b) - 1 = 0$ for all support vectors $\vec{x_i}$


    This SOO problem with equality constraint can be easily solved by the method of
    Lagrange Multipliers, which is defined as:


    $L = f - \sum_i \alpha_i g_i$


    $L$ is Lagrangian


    $f$ is optimization function


    $\alpha$ is Lagrange multiplier


    $g$ is equality constraint


    So, for our SOO problem, using the method of Lagrange Multipliers:


    $L = \frac{1}{2}|\vec{W}|^2 - \sum_i \alpha_i [y_i(\vec{W} \cdot \vec{x_i} + b)
    - 1]$


    $\frac{\partial L}{\partial \vec{W}} = \vec{W} - \sum_i \alpha_i y_i \vec{x_i}
    = 0$


    $\therefore \vec{W} = \sum_i \alpha_i y_i \vec{x_i}$


    $\frac{\partial L}{\partial b} = -\sum_i \alpha_i y_i = 0$


    $\therefore \sum_i \alpha_i y_i = 0$


    Then, substitute the latest expression found for $\vec{W} = \sum_i \alpha_i y_i
    \vec{x_i}$ back to the median line of the margin ($\vec{W} \cdot \vec{u} + b =
    0$):


    $\sum_i \alpha_i y_i \vec{x_i} \cdot \vec{u} + b = 0$


    Similarly, the 2 edge lines ($\vec{W} \cdot \vec{u} + b = 1$; $\vec{W} \cdot \vec{u}
    + b = -1$) of the margin can also be updated as:


    $\sum_i \alpha_i y_i \vec{x_i} \cdot \vec{u} + b = 1$ if $\vec{u}$ is $+$ve support
    vector


    $\sum_i \alpha_i y_i \vec{x_i} \cdot \vec{u} + b = -1$ if $\vec{u}$ is $-$ve support
    vector


    All the essential mathematical equations for SVM have now been derived.


    ## 7.3. NUMERICAL EXAMPLE AND CODE COMPARISON OF SUPPORT VECTOR MACHINE: LINEARLY
    SEPARABLE CASE


    As presented in Table **[7.1](#9789815136982-C7.html#t7.1)** and Fig. ([**7.5**](#9789815136982-C7.html#f7.5)),
    suppose we have a small training dataset with only 4 samples (data points). The
    first 2 samples belong to the negative ($-$) class and the last 2 samples belong
    to the positive ($+$) class. Our task is to build an SVM classifier that can clearly
    distinguish the 2 classes.


    ![](Images/9789815136982-C7-F5.jpg)

    **Fig. (7.5)**


    Illustration of the 4 samples from the small training dataset and the support
    vectors.


    **Table 7.1** The small linearly separable dataset for support vector machine.


    | X | y |

    | --- | --- |

    | (1, 2) | -1 |

    | (2, 1) | -1 |

    | (4, 4) | 1 |

    | (5, 5) | 1 |


    We have derived the following 3 equations from the previous section:


    $\sum_i \alpha_i y_i \vec{x_i} \cdot \vec{u} + b = 1$ if $\vec{u}$ is $+$ve support
    vector


    $\sum_i \alpha_i y_i \vec{x_i} \cdot \vec{u} + b = -1$ if $\vec{u}$ is $-$ve support
    vector


    $\sum_i \alpha_i y_i = 0$


    Now, let $\hat{a}_i = \alpha_i y_i$, and then expand the equations:


    $\hat{a}_1 \vec{x_1} \cdot \vec{x_1} + \hat{a}_2 \vec{x_2} \cdot \vec{x_1} + \hat{a}_3
    \vec{x_3} \cdot \vec{x_1} + b = -1$ when $\vec{u} = \vec{x_1}$


    $\hat{a}_1 \vec{x_1} \cdot \vec{x_2} + \hat{a}_2 \vec{x_2} \cdot \vec{x_2} + \hat{a}_3
    \vec{x_3} \cdot \vec{x_2} + b = -1$ when $\vec{u} = \vec{x_2}$


    $\hat{a}_1 \vec{x_1} \cdot \vec{x_3} + \hat{a}_2 \vec{x_2} \cdot \vec{x_3} + \hat{a}_3
    \vec{x_3} \cdot \vec{x_3} + b = 1$ when $\vec{u} = \vec{x_3}$


    $\hat{a}_1 + \hat{a}_2 + \hat{a}_3 = 0$


    As can be seen, the solution depends only on the dot product of pairs of support
    vectors. Then, calculate all the dot products of pairs of the support vectors:


    $\vec{x_1} \cdot \vec{x_1} = (1, 2) \cdot (1, 2) = 1 \cdot 1 + 2 \cdot 2 = 5$


    $\vec{x_2} \cdot \vec{x_1} = (2, 1) \cdot (1, 2) = 2 \cdot 1 + 1 \cdot 2 = 4$


    $\vec{x_3} \cdot \vec{x_1} = (4, 4) \cdot (1, 2) = 4 \cdot 1 + 4 \cdot 2 = 12$


    $\vec{x_1} \cdot \vec{x_2} = (1, 2) \cdot (2, 1) = 1 \cdot 2 + 2 \cdot 1 = 4$


    $\vec{x_2} \cdot \vec{x_2} = (2, 1) \cdot (2, 1) = 2 \cdot 2 + 1 \cdot 1 = 5$


    $\vec{x_3} \cdot \vec{x_2} = (4, 4) \cdot (2, 1) = 4 \cdot 2 + 4 \cdot 1 = 12$


    $\vec{x_1} \cdot \vec{x_3} = (1, 2) \cdot (4, 4) = 1 \cdot 4 + 2 \cdot 4 = 12$


    $\vec{x_2} \cdot \vec{x_3} = (2, 1) \cdot (4, 4) = 2 \cdot 4 + 1 \cdot 4 = 12$


    $\vec{x_3} \cdot \vec{x_3} = (4, 4) \cdot (4, 4) = 4 \cdot 4 + 4 \cdot 4 = 32$


    Then, plug the values into the equations:


    $5\hat{a}_1 + 4\hat{a}_2 + 12\hat{a}_3 + b = -1$


    $4\hat{a}_1 + 5\hat{a}_2 + 12\hat{a}_3 + b = -1$


    $12\hat{a}_1 + 12\hat{a}_2 + 32\hat{a}_3 + b = 1$


    $\hat{a}_1 + \hat{a}_2 + \hat{a}_3 = 0$


    After solving the system of linear equations, $\hat{a}_1, \hat{a}_2, \hat{a}_3$,
    and $b$ are found to be:


    $\hat{a}_1 = -0.08, \hat{a}_2 = -0.08, \hat{a}_3 = 0.16, b = -2.2$


    Utilize the solved $\hat{a}_1, \hat{a}_2, \hat{a}_3$ values to find $\vec{W}$:


    $\vec{W} = \sum_i \alpha_i y_i \vec{x_i} = \sum_i \hat{a}_i \vec{x_i} = -0.08(1,
    2) - 0.08(2, 1) + 0.16(4, 4) = (0.4, 0.4)$


    Update the median line of the margin *(i.e.,* hyperplane, $\vec{W} \cdot \vec{u}
    + b = 0$):


    $(0.4, 0.4) \cdot \vec{u} - 2.2 = 0$


    So, a hyperplane is essentially those $\vec{u}$ vectors that satisfy the equation
    above. Let us represent the vector $\vec{u}$ as coordinate $(u_1, u_2)$ in the
    two-dimensional space, where $u_1$ is the scalar/magnitude in the horizontal axis
    and $u_2$ is the scalar/magnitude in the vertical axis, as shown in Fig. ([**7.6**](#9789815136982-C7.html#f7.6)).


    ![](Images/9789815136982-C7-F6.jpg)

    **Fig. (7.6)**


    Illustration of calculated equations for the optimal hyperplane, edge line (near
    $+$), and edge line (near $-$), respectively.


    $(0.4, 0.4) \cdot (u_1, u_2) - 2.2 = 0$


    $0.4 \cdot u_1 + 0.4 \cdot u_2 = 2.2$


    $u_1 + u_2 = 5.5$


    Similarly, for the edge line (near $+$) of the margin ($\vec{W} \cdot \vec{u}
    + b = 1$):


    $(0.4, 0.4) \cdot (u_1, u_2) - 2.2 = 1$


    $u_1 + u_2 = 8$


    For the edge line (near $-$) of the margin ($\vec{W} \cdot \vec{u} + b = -1$):


    $(0.4, 0.4) \cdot (u_1, u_2) - 2.2 = -1$


    $u_1 + u_2 = 3$


    Now let us compare the results obtained above with that from the off-the-shelf
    SVM classifier offered by the `scikit-learn` library.


    The complete code file can be downloaded from our shared folder in Google Drive:


    [https://drive.google.com/drive/folders/1FqJvo4ZPazNbEH_GlHFoodqvegnQmHcn?usp=share_link](https://drive.google.com/drive/folders/1FqJvo4ZPazNbEH_GlHFoodqvegnQmHcn?usp=share_link)


