    \ S.. Python Machine Learning.Birmingham, EnglandPackt Publishing2015 |\n\n# K-means\
    \ Clustering\n\n**Zhiyuan Wang****,** **Sayed Ameenuddin Irfan****,** **Christopher\
    \ Teoh****,** **Priyanka Hriday Bhoyar**  \n\n## Abstract\n\nIn this chapter,\
    \ we explore the K-means clustering algorithm, emphasizing an accessible approach\
    \ by minimizing abstract mathematical theories. We present a concrete numerical\
    \ example with a small dataset to illustrate how clusters can be formed using\
    \ the K-means clustering algorithm. Additionally, we provide sample codes and\
    \ comparisons with the K-means model available in the scikit-learn library. Upon\
    \ completing this chapter, readers will gain a comprehensive understanding of\
    \ the mechanics behind K-means clustering, and its connection to the implementation\
    \ and performance of the algorithm, and be well-prepared to apply it in practical\
    \ use.\n\n**Keywords:** K-Means Clustering, Distance Metrics, Numerical Example,\
    \ Small Dataset, Scikit-Learn.  \n\n## 8.1. INTRODUCTION TO CLUSTERING AND DISTANCE\
    \ METRICS\n\nIn unsupervised learning, the algorithm is not provided with labeled\
    \ training data. Instead, it is only given a set of input examples, and the primary\
    \ objective of unsupervised learning is to uncover the inherent structure or patterns\
    \ within the data, enabling the algorithm to make predictions, decisions, or recommendations\
    \ based on these discovered patterns \\[[1](#9789815136982-C8.html#r1)\\]. This\
    \ contrasts with supervised learning, where the algorithm is given both input\
    \ examples and corresponding labeled outputs and can learn by making predictions\
    \ and comparing them to the true labels. The ability of unsupervised learning\
    \ algorithms to discover hidden structures and relationships in the data without\
    \ relying on labeled examples makes them particularly valuable in situations where\
    \ obtaining labeled data is challenging, time-consuming, or expensive."
  fmt: "\n# SVM with RBF Kernel: Numerical Example\n\n**Fig. 7.12**  \nPlot of the\
    \ linearly non-separable dataset for SVM with RBF kernel.\n\n**Table 7.4** The\
    \ linearly non-separable dataset for SVM with RBF kernel.\n\n| X | y |\n| ---\
    \ | --- |\n| (1, 2) | -1 |\n| (5, 5) | -1 |\n| (2, 1) | 1 |\n| (4, 4) | 1 |\n\n\
    Note that `x1→` and `x2→` are the 2 negative samples; `x3→` and `x4→` are the\
    \ 2 positive samples.\n\n```\n∑i αi yi K(xi→, u→) + b = 1  if u→ is +ve support\
    \ vector\n∑i αi yi K(xi→, u→) + b = -1 if u→ is -ve support vector\n∑i αi yi =\
    \ 0\n```\n\nNow, let `âi = αi yi`, and then expanding:\n\n```\nâ1 K(x1→, x1→)\
    \ + â2 K(x2→, x1→) + â3 K(x3→, x1→) + â4 K(x4→, x1→) + b = -1  when u→ = x1→\n\
    â1 K(x1→, x2→) + â2 K(x2→, x2→) + â3 K(x3→, x2→) + â4 K(x4→, x2→) + b = -1  when\
    \ u→ = x2→\nâ1 K(x1→, x3→) + â2 K(x2→, x3→) + â3 K(x3→, x3→) + â4 K(x4→, x3→)\
    \ + b = 1   when u→ = x3→\nâ1 K(x1→, x4→) + â2 K(x2→, x4→) + â3 K(x3→, x4→) +\
    \ â4 K(x4→, x4→) + b = 1   when u→ = x4→\nâ1 + â2 + â3 + â4 = 0\n```\n\n**RBF\
    \ Kernel function:**\n\n```\nK(xi→, xj→) = e^(-γ ||xi→ - xj→||^2)\n```\n\nLet\
    \ `γ = 0.2`, then:\n\n```\nK(xi→, xj→) = e^(-0.2 ||xi→ - xj→||^2)\n```\n\nSo,\n\
    \n```\nK(x1→, x1→) = e^(-0.2 ||(1, 2) - (1, 2)||^2) = e^(-0.2 * 0) = e^0 = 1\n\
    K(x2→, x1→) = e^(-0.2 ||(5, 5) - (1, 2)||^2) = e^(-0.2 * 25) = e^(-5)\nK(x3→,\
    \ x1→) = e^(-0.2 ||(2, 1) - (1, 2)||^2) = e^(-0.2 * 2) = e^(-0.4)\nK(x4→, x1→)\
    \ = e^(-0.2 ||(4, 4) - (1, 2)||^2) = e^(-0.2 * 13) = e^(-2.6)\n\nK(x1→, x2→) =\
    \ e^(-0.2 ||(1, 2) - (5, 5)||^2) = e^(-5)\nK(x2→, x2→) = e^(-0.2 ||(5, 5) - (5,\
    \ 5)||^2) = 1\nK(x3→, x2→) = e^(-0.2 ||(2, 1) - (5, 5)||^2) = e^(-5)\nK(x4→, x2→)\
    \ = e^(-0.2 ||(4, 4) - (5, 5)||^2) = e^(-0.4)\n\nK(x1→, x3→) = e^(-0.2 ||(1, 2)\
    \ - (2, 1)||^2) = e^(-0.4)\nK(x2→, x3→) = e^(-0.2 ||(5, 5) - (2, 1)||^2) = e^(-5)\n\
    K(x3→, x3→) = e^(-0.2 ||(2, 1) - (2, 1)||^2) = 1\nK(x4→, x3→) = e^(-0.2 ||(4,\
    \ 4) - (2, 1)||^2) = e^(-2.6)\n\nK(x1→, x4→) = e^(-0.2 ||(1, 2) - (4, 4)||^2)\
    \ = e^(-2.6)\nK(x2→, x4→) = e^(-0.2 ||(5, 5) - (4, 4)||^2) = e^(-0.4)\nK(x3→,\
    \ x4→) = e^(-0.2 ||(2, 1) - (4, 4)||^2) = e^(-2.6)\nK(x4→, x4→) = e^(-0.2 ||(4,\
    \ 4) - (4, 4)||^2) = 1\n```\n\nThen, plug the values into the equations:\n\n```\n\
    â1 + e^(-5)â2 + e^(-0.4)â3 + e^(-2.6)â4 + b = -1\ne^(-5)â1 + â2 + e^(-5)â3 + e^(-0.4)â4\
    \ + b = -1\ne^(-0.4)â1 + e^(-5)â2 + â3 + e^(-2.6)â4 + b = 1\ne^(-2.6)â1 + e^(-0.4)â2\
    \ + e^(-2.6)â3 + â4 + b = 1\nâ1 + â2 + â3 + â4 = 0\n```\n\nSolving this system\
    \ of linear equations gives a unique solution as follows:\n\n```\nâ1 = -3, â2\
    \ = -3, â3 = 3, â4 = 3, b = -0.1\n```\n\n**Hyperplane:** `∑i αi yi K(xi→, u→)\
    \ + b = 0`\n\n```\n∴ â1 K(x1→, u→) + â2 K(x2→, u→) + â3 K(x3→, u→) + â4 K(x4→,\
    \ u→) + b = 0\n```\n\nWe have found `â1, â2, â3, â4, b`, and `x1→, x2→, x3→, x4→`\
    \ are given. RBF kernel function `K(xi→, xj→) = e^(-0.2 ||xi→ - xj→||^2)` is also\
    \ known.\n\nSo, hyperplane is essentially those `u→` that satisfy the following\
    \ equation:\n\n```\n-3 K(x1→, u→) - 3 K(x2→, u→) + 3 K(x3→, u→) + 3 K(x4→, u→)\
    \ - 0.1 = 0\n```\n\nDivide both sides by 3:\n\n```\n-K(x1→, u→) - K(x2→, u→) +\
    \ K(x3→, u→) + K(x4→, u→) - 0.033 = 0\n```\n\nSo, `âi` and `b` values in the simplest\
    \ form that can represent the hyperplane are:\n\n```\nâ1 = -1\nâ2 = -1\nâ3 = 1\n\
    â4 = 1\nb = -0.033\n```\n\nLet us represent the vector `u→` as `(u1, u2)` in the\
    \ two-dimensional space, where `u1` is the scalar/magnitude in the horizontal\
    \ axis and `u2` is the scalar/magnitude in the vertical axis.\n\n```\nK(x1→, u→)\
    \ = e^(-0.2 ||(1, 2) - (u1, u2)||^2) = e^(-0.2 [(1-u1)^2 + (2-u2)^2])\nK(x2→,\
    \ u→) = e^(-0.2 ||(5, 5) - (u1, u2)||^2) = e^(-0.2 [(5-u1)^2 + (5-u2)^2])\nK(x3→,\
    \ u→) = e^(-0.2 ||(2, 1) - (u1, u2)||^2) = e^(-0.2 [(2-u1)^2 + (1-u2)^2])\nK(x4→,\
    \ u→) = e^(-0.2 ||(4, 4) - (u1, u2)||^2) = e^(-0.2 [(4-u1)^2 + (4-u2)^2])\n```\n\
    \nThen,\n\n```\n-e^(-0.2 [(1-u1)^2 + (2-u2)^2]) - e^(-0.2 [(5-u1)^2 + (5-u2)^2])\
    \ + e^(-0.2 [(2-u1)^2 + (1-u2)^2]) + e^(-0.2 [(4-u1)^2 + (4-u2)^2]) - 0.033 =\
    \ 0\n```\n\nThe plot of this equation is shown in **Fig. 7.13** as the curved\
    \ line for separating the positive and negative classes.\n\n**Fig. 7.13.** Illustration\
    \ of the determined hyperplane (curved line) by SVM with RBF kernel on two-dimensional\
    \ space.\n\nNow let us compare the results obtained above with that from the off-the-shelf\
    \ SVM classifier using RBF kernel offered by `scikit-learn` library.\n\nThe complete\
    \ code file can be downloaded from our shared folder in Google Drive:\n\n[https://drive.google.com/drive/folders/1FqJvo4ZPazNbEH_GlHFoodqvegnQmHcn?usp=share_link](https://drive.google.com/drive/folders/1FqJvo4ZPazNbEH_GlHFoodqvegnQmHcn?usp=share_link)\n\
    \n| ![](Images/9789815136982-C7-EQ4.jpg) |\n| --- |\n| ![](Images/9789815136982-C7-EQ5.jpg)\
    \ |\n| ![](Images/9789815136982-C7-EQ3.jpg) |\n\nAs can be seen from the results\
    \ of `scikit-learn` SVM classifier using RBF kernel and compared with our manually\
    \ calculated results, the same dual coefficients of support vector (i.e., `â1\
    \ = -1, â2 = -1, â3 = 1, â4 = 1`), the same intercept value (i.e., `b = -0.033`),\
    \ and the same decision surface (i.e., hyperplane) are obtained.\n\n## CONCLUSION\n\
    \nIn this chapter, we discussed the concept of SVM for both linearly separable\
    \ and linearly non-separable cases. To make the material more accessible, we kept\
    \ abstract mathematical theories to a minimum. Instead, we focused on concrete\
    \ numerical examples with small datasets, walking through them step by step. We\
    \ also provided sample codes and comparisons with the SVM model from the off-the-shelf\
    \ library, `scikit-learn`. By the end of the chapter, readers should have a well-rounded\
    \ understanding of how SVM machine learning works behind the scenes, how the mathematics\
    \ relates to the implementation and performance of the algorithm, and be better\
    \ equipped to apply it in their projects.\n\n## REFERENCES\n\n| | |\n| --- | ---\
    \ |\n| [1] | Wang Z., Li J., Rangaiah G.P., Wu Z.. Machine learning aided multi-objective\
