- raw: 'In addition to automation, machine learning algorithms can be used to improve
    decision-making by analyzing large amounts of data and making predictions or recommendations
    based on that data. This can be particularly useful in fields such as finance,
    where machine learning can be used to identify patterns and trends that can inform
    investment decisions, or in healthcare, where machine learning can be used to
    predict patient outcomes and identify potential health risks, or in semiconductor
    manufacturing, where machine learning can be employed to detect defects and analyze
    their causes in real-time. By providing valuable insights and recommendations
    based on data analysis, machine learning has the potential to enhance the efficiency
    and effectiveness of decision-making in a wide range of fields.


    Another key benefit of machine learning is its ability to enhance personalization
    by tailoring products and services to individual preferences and behaviors. For
    example, machine learning can be used to recommend products or content to users
    based on their past behavior, or to tailor advertising to specific audiences.
    By providing personalized experiences, machine learning has the potential to improve
    customer satisfaction and engagement.


    Overall, machine learning is expected to have a significant impact in a wide range
    of fields over the next two decades, influencing many aspects of our lives. Its
    ability to automate tasks, improve decision-making, and enhance personalization
    make it a technology with the potential to revolutionize industries and change
    the way we live and work.


    ## 1.3. SUPERVISED AND UNSUPERVISED


    Supervised and unsupervised learning are two prominent types of algorithms in
    machine learning \[[4](#9789815136982-C1.html#r4)\]. In supervised learning, a
    model is trained using labeled data, which includes the correct output for each
    instance in the training set. The model generates predictions based on this labeled
    data, enabling it to make accurate predictions for new, previously unseen examples.
    Some common supervised learning tasks include regression, which aims to predict
    a continuous value, and classification, which focuses on predicting a categorical
    label. Conversely, unsupervised learning involves training a model with unlabeled
    data, meaning the correct output is not provided. In this case, the model must
    independently identify patterns and relationships within the data. Examples of
    unsupervised learning tasks encompass clustering, where the objective is to group
    similar examples, and dimensionality reduction, where the goal is to decrease
    the number of features in the data while preserving as much relevant information
    as possible.


    ## 1.4. REGRESSION AND CLASSIFICATION


    In machine learning, regression and classification are two types of supervised
    learning, in which a model is trained on labeled data to make predictions about
    new, unseen examples. In regression, the model is used to predict a continuous
    value, such as a price or probability. For example, a regression model might be
    used to predict the price of a house based on features such as its size, number
    of bedrooms, and location. On the other hand, classification involves predicting
    a categorical value, such as a class label. For example, a classification model
    might be used to predict whether an email is spam or not, or to recognize the
    type of object in an image.


    Both regression and classification are widely used in many fields and have a broad
    range of applications. In addition to the examples mentioned earlier, regression
    can be applied in finance to predict stock prices, in healthcare to predict patient
    outcomes, in meteorology to predict weather patterns, and in electric vehicle
    industry to predict charging demand \[[5](#9789815136982-C1.html#r5)\]. Classification,
    on the other hand, is used in a wide range of applications, such as natural language
    processing, where it is used to classify text into different categories, and fraud
    detection, where it is used to classify transactions as legitimate or fraudulent.
    Despite their differences, regression and classification share many similarities
    and are both essential tools in the field of machine learning. By understanding
    both, we can select the most appropriate method for a specific problem and achieve
    more accurate predictions.


    ## 1.5. UNDERFITTING AND OVERFITTING


    While training machine learning models, it is common to encounter issues such
    as underfitting and overfitting \[[6](#9789815136982-C1.html#r6)\]. Underfitting
    occurs when a model is too simple to accurately capture the underlying patterns
    in the data, leading to poor performance on both the training data and new, unseen
    examples. On the other hand, overfitting occurs when a model is too complex and
    tries to fit the noise or random fluctuations in the training data rather than
    generalizing the underlying patterns, resulting in a good performance on the training
    data but poor performance on new, unseen examples. To avoid these issues, it is
    important to find the right balance between model complexity and the amount of
    training data available. This can often be achieved through techniques such as
    cross-validation and regularization.


    ## 1.6. THE IMPORTANCE OF UNDERSTANDING MACHINE LEARNING THROUGH NUMERICAL EXAMPLE


    From our experiences teaching machine learning using various textbooks, we have
    noticed that there tends to be a strong emphasis on abstract mathematics when
    discussing the theories of machine learning algorithms. On the other hand, in
    the application of machine learning, it usually straightaway goes to import off-the-shelf
    libraries such as scikit-learn, TensorFlow, Keras, and PyTorch. The disconnect
    between abstract mathematical theories and practical application creates a gap
    in understanding. This book bridges the gap using numerical examples with small
    datasets and simple Python codes to provide a complete walkthrough of the underlying
    mathematical steps of machine learning algorithms. There are several benefits
    to understanding machine learning through numerical examples. For one, it allows
    readers to see how the algorithms work in practice, which can help readers better
    understand the concepts and ideas behind them. Additionally, working through numerical
    examples can help readers develop intuition about how the algorithms behave under
    different circumstances and how input parameters can affect the output. This can
    be especially useful for developing problem-solving skills, as machine learning
    often involves finding the best solution to a problem given a dataset. By working
    through numerical examples, readers can learn to approach different types of problems
    in a systematic way. Furthermore, seeing how machine learning algorithms behave
    on actual data can help readers identify common pitfalls and avoid them in their
    works. Overall, working through numerical examples can be an effective way to
    learn about machine learning and develop the necessary skills and knowledge to
    apply it. By following a step-by-step process through numerical examples, readers/students
    can gain a tangible understanding of the algorithms, see how the mathematics relates
    to their implementation and performance, and be better equipped to apply them
    to practical problems.


    ## CONCLUSION'
