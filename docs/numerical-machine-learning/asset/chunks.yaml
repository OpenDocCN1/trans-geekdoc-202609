    # Further Training and Results


    Further, the same learning process is set to repeat a total of 500,000 times to
    keep updating the bias and weights under the L2 regularization, until the mean
    loss between the true and predicted output values stabilizes; only then are the
    optimal bias and weights said to be obtained. For conciseness, we will not present
    the detailed calculations from the third iteration onwards in the chapter, but
    tabulate the bias, weights and MSE for the first and last five iterations in **Table
    3.4**. If necessary, readers are encouraged to try several more iterations to
    have a deeper understanding of the process of training a linear regression model
    with L2 regularization. Besides, **Fig. 3.3** depicts that MSE decreases with
    the increase of learning iterations and finally stabilizes.


    > **Figure 3.3:** Mean squared error (MSE) vs. learning iteration for training
    the L2 regularized linear regression model.


    **Table 3.4:** The bias, weights and MSE values for the first and last five iterations
    for training the L2 regularized linear regression model.


    | Iteration | b | w[1] | w[2] | MSE |

    | --- | --- | --- | --- | --- |

    | 1 | 0.009320 | 0.006165 | 0.006560 | 2.6853 |

    | 2 | 0.01854 | 0.01227 | 0.01305 | 2.6307 |

    | 3 | 0.02767 | 0.01830 | 0.01948 | 2.5773 |

    | 4 | 0.03670 | 0.02428 | 0.02583 | 2.5250 |

    | 5 | 0.04564 | 0.03019 | 0.03213 | 2.4737 |

    | ... | ... | ... | ... | ... |

    | 499,996 | 0.8907 | 0.7100 | 0.5390 | 0.01222 |

    | 499,997 | 0.8907 | 0.7100 | 0.5390 | 0.01222 |

    | 499,998 | 0.8907 | 0.7100 | 0.5390 | 0.01222 |

    | 499,999 | 0.8907 | 0.7100 | 0.5390 | 0.01222 |

    | 500,000 | 0.8907 | 0.7100 | 0.5390 | 0.01222 |


    As can be seen from **Table 3.4** and **Fig. 3.3**, MSE finally stabilizes at
    a small value, 0.01222, suggesting that we have trained a good linear regression
    model with L2 regularization, in which the optimal bias and weights are `b=0.8907`,
    `w1=0.71` and `w2=0.539`. The resulting linear regression model can be written
    as:


    `Y = b + ∑(j=1 to 2) wj ⋅ normalized Xj`


    Here, `b=0.8907`, `w1=0.71` and `w2=0.539`.


    As Max-min normalization was performed during the training process, it needs to
    be reflected in the final model as well. That is why `normalized Xj` is shown
    here.


    Now, we can use this trained linear regression model to make predictions for previously
    unseen data (i.e., new data). For instance, there is a new house with 1200 sqft
    and 3 bedrooms. To predict the price of the house, normalization needs to be applied
    first using the maximum and minimum values of each respective feature from the
    training dataset. Recall that the maximum and minimum of `size_sqft` are 1600
    and 740; the maximum and minimum of `num_bedrooms` are 5 and 2. So, the normalized
    `X1` for `size_sqft` and normalized `X2` for `num_bedrooms` will be:


    `normalized X1 = (1200 - 740) / (1600 - 740) = 0.5349`


    `normalized X2 = (3 - 2) / (5 - 2) = 0.3333`


    Next, plug the normalized feature values into the equation of the linear regression
    model:


    `Y = b + ∑(j=1 to 2) wj ⋅ normalized Xj = 0.8907 + 0.71 × 0.5349 + 0.539 × 0.3333
    = 1.45`


    Therefore, for the house with 1200 sqft and 3 bedrooms, the sale price is predicted
    to be 1.45 million dollars.


    # 3.7. Sample Codes and Comparison of L2 Regularization for Linear Regression


    Following the mathematics and numerical example discussed in Sections 3.5 and
    3.6, we have implemented the L2 regularized linear regression machine learning
    model with the aforementioned small dataset from scratch in Python. The code is
    similar to that of the original linear regression discussed in Chapter 2. The
    difference lies in the function `update_bias_weights()`, because of the addition
    of the L2 regularization term (i.e., `λW²/2`) to the loss function. Readers are
    encouraged to have their Jupyter Notebook (or other Python IDE) ready and try
    the codes along with reading. The complete code file can be downloaded from our
    shared folder in Google Drive:


    <https://drive.google.com/drive/folders/1FqJvo4ZPazNbEH_GlHFoodqvegnQmHcn?usp=share_link>


    Firstly, only the `pandas` and `numpy` libraries are imported.


    ![Images/9789815136982-C3-E31.jpg](Images/9789815136982-C3-E31.jpg)


    Secondly, a `loss_MSE()` function is created for calculating the MSE between the
    known true output values and predicted output values by the linear regression
    model. See the docstring of the `loss_MSE()` function to understand its usage.


    ![Images/9789815136982-C3-E32.jpg](Images/9789815136982-C3-E32.jpg)


    Thirdly, an `update_bias_weights()` function is created to update the values of
    bias and weights based on gradient descent optimization algorithm. Equations (3.16)
    to (3.22), which we derived in Section 3.5, are well translated into Python codes
    in this function. See the docstring of the `update_bias_weights()` function to
    understand its usage.


    ![Images/9789815136982-C3-E33.jpg](Images/9789815136982-C3-E33.jpg)


    Fourthly, a `train()` function is created to oversee the training process for
    specific iterations and write the log of loss/MSE history. See the docstring of
    the `train()` function to understand its usage.


    ![Images/9789815136982-C3-E34.jpg](Images/9789815136982-C3-E34.jpg)


    Fifthly, a `max_min_norm()` function is created to normalize the values of input
    features (i.e., `X`). See the docstring of the `max_min_norm()` function to understand
    its usage.


    ![Images/9789815136982-C3-E35.jpg](Images/9789815136982-C3-E35.jpg)


    Sixthly, we store the small dataset as a numpy array, invoke the `max_min_norm()`
    function for normalization, initialize bias and weights, set learning rate, iterations
    and penalty coefficient that multiplies the L2 regularization term, then invoke
    the `train()` function to start building our first L2 regularized linear regression
    model, after decomposing and fully understanding every single step of the process.


    ![Images/9789815136982-C3-E36.jpg](Images/9789815136982-C3-E36.jpg)


    ![Images/9789815136982-C3-E37.jpg](Images/9789815136982-C3-E37.jpg)


    We then compare the above results with those from the off-the-shelf L2 regularized
    linear regression model (i.e., `Ridge`) offered by the `scikit-learn` library.
    These include the final bias and weights after training, the final MSE, and the
    predicted price for the house (new data) with 1200 sqft and 3 bedrooms. The codes
    are as follows:


    ![Images/9789815136982-C3-E38.jpg](Images/9789815136982-C3-E38.jpg)


    ![Images/9789815136982-C3-E39.jpg](Images/9789815136982-C3-E39.jpg)


    As can be seen from the results using `scikit-learn` L2 regularized linear regression
    model (i.e., `Ridge`), the final bias, weights, and MSE values are the same as
    those given by our own L2 regularized linear regression model (i.e., `b=0.8907`,
    `w1=0.71` and `w2=0.539`, and `MSE=0.01222`). Furthermore, the predicted price
    for the previously unseen house with 1200 sqft and 3 bedrooms is also the same
    as that produced by our own model (i.e., 1.45 million).


    # Conclusion


    In this chapter, we discussed the concepts of L1 and L2 regularization in the
    context of linear regression. To make the material more accessible, we kept abstract
    mathematical theories to a minimum. Instead, we focused on a concrete numerical
    example with a small dataset for predicting the sale price of houses, walking
    through it step by step. We also provided sample codes and comparisons with the
    `Lasso` and `Ridge` models from the off-the-shelf library `scikit-learn`. By the
    end of the chapter, readers should have a well-rounded understanding of how L1
    and L2 regularization works behind the scenes in preventing the risk of overfitting,
    how the mathematics relates to the implementation and performance of the techniques,
    and be better equipped to apply them in their projects.


    # References


    | | |

    | --- | --- |

    | [1] | Tibshirani R. Regression shrinkage and selection via the lasso. *J. R.
    Stat. Soc. B* 1996;58(1):267–288. doi:10.1111/j.2517-6161.1996.tb02080.x |

    | [2] | James G., Witten D., Hastie T., Tibshirani R. *An introduction to statistical
    learning: With applications in R*. 1st ed. New York, NY: Springer; 2013. doi:10.1007/978-1-4614-7138-7
    |

    | [3] | Gruber M.H.J. *Improving efficiency by shrinkage: The James-stein and
    ridge regression estimators*. Routledge; 2017. doi:10.1201/9780203751220 |

