    # 逻辑回归中的梯度下降优化


    梯度下降优化算法被用于通过迭代地朝着减小损失的方向微调偏置和权重的值，从而找到最优的偏置和权重。在此之前，我们需要求出平均损失（`L`）关于偏置和权重的偏导数，即
    `∂L/∂b` 和 `∂L/∂wj`，它们分别表示偏置和各个权重对平均损失的贡献。这可以通过应用链式法则来完成，如公式 (4.7) 至 (4.12) 所示：


    ![](img/9789815136982-C4-Eq7.jpg)

    ![](img/9789815136982-C4-Eq8.jpg)

    ![](img/9789815136982-C4-Eq9.jpg)

    ![](img/9789815136982-C4-Eq10.jpg)

    ![](img/9789815136982-C4-Eq11.jpg)

    ![](img/9789815136982-C4-Eq12.jpg)


    此处，`j ∈ [1, n]`，且 `n` 为特征数量。


    随后，利用梯度下降来更新偏置 `b`（公式 4.13）和权重 `w`（公式 4.14）。


    ![](img/9789815136982-C4-Eq13.jpg)

    ![](img/9789815136982-C4-Eq14.jpg)


    此处，`α` 为学习率（通常为较小值，*例如* `0.1`、`0.01`、`0.001`）。


    值得注意的是，本章中的数学符号和 Python 代码与本书第 2 章和第 3 章 [[5]](#9789815136982-C4.html#r5)、[[6]](#9789815136982-C4.html#r6)
    中的有些相似。然而，第 2 章和第 3 章的重点分别在于线性回归和正则化，而本章的重点在于逻辑回归。


    ## 4.3. 逻辑回归的数值示例


    假设我们有一个如表 **1** 所示的小型训练数据集，仅包含 3 个样本（*即* `m=3`），拥有两个特征，分别为房屋面积（平方英尺，缩写为 `size_sqft`）和房屋卧室总数（缩写为
    `num_bedrooms`），以及一个关于房屋在房地产市场上是否容易出售（缩写为 `is_easy_sell`）的输出。该输出为二分类，仅有两个可能的值/类别/标签（*即*
    `0` 和 `1`），其中 `0` 表示否（不容易出售），`1` 表示是（容易出售）。换句话说，对于本示例，`X` 为 `size_sqft` 和 `num_bedrooms`，`Y`
    为 `is_easy_sell`。我们的任务是构建一个将 `X` 映射到 `Y` 的逻辑回归模型。


    **表 1：用于逻辑回归的小型数据集。**


    | **size_sqft** | **num_bedrooms** | **is_easy_sell** |

    | --- | --- | --- |

    | 1600 | 5 | 1 |

    | 1200 | 4 | 1 |

    | 740 | 2 | 0 |


    接下来，使用最大-最小归一化（如公式 4.15 所示）将特征值（*即* `size_sqft` 和 `num_bedrooms` 列的值）归一化，使其处于
    0 到 1 的同一尺度上。若不进行归一化，某些特征可能会主导机器学习过程。


    ![](img/9789815136982-C4-Eq15.jpg)


    `size_sqft` 的最大值和最小值分别为 `1600` 和 `740`。同理，`num_bedrooms` 的最大值和最小值分别为 `5` 和 `2`。输出标签（*即*
    `is_easy_sell`）保持原样，不进行任何归一化。对特征进行最大-最小归一化后的小型数据集如表 **2** 所示。


    **表 2：逻辑回归最大-最小归一化后的小型数据集。**


    | **size_sqft** | **num_bedrooms** | **is_easy_sell** |

    | --- | --- | --- |

    | 1 | 1 | 1 |

    | 0.5349 | 0.6667 | 1 |

    | 0 | 0 | 0 |


    现在，让我们开始机器学习过程以构建逻辑回归模型。


    初始化偏置：

    ```

    b = 0

    ```


    初始化特征 `size_sqft` 的权重：

    ```

    w1 = 0

    ```


    初始化特征 `num_bedrooms` 的权重：

    ```

    w2 = 0

    ```


    设置学习率：

    ```

    α = 0.1

    ```


    请注意，为便于书写和表达，除非另有说明，以下所有 `xij` 默认均指归一化后的 `xij`。


    ### 4.3.1. 开始学习的第一次迭代


    取第一个训练样本的输入值并计算预测值 `ŷ1`：


    ![](img/9789815136982-C4-B1.jpg)


    取第二个训练样本的输入值并计算预测值 `ŷ2`：


    ![](img/9789815136982-C4-B2.jpg)


    取第三个训练样本的输入值并计算预测值 `ŷ3`：


    ![](img/9789815136982-C4-B3.jpg)


    计算 `∂L/∂b` 的值：


    ![](img/9789815136982-C4-B4.jpg)


    计算 `∂L/∂w1` 的值：


    ![](img/9789815136982-C4-B5.jpg)


    计算 `∂L/∂w2` 的值：


    ![](img/9789815136982-C4-B6.jpg)


    更新 `b` 值：


    ![](img/9789815136982-C4-B7.jpg)


    更新 `w1` 值：


    ![](img/9789815136982-C4-B8.jpg)


    更新 `w2` 值：


    ![](img/9789815136982-C4-B9.jpg)


    ### 4.3.2. 结束学习的第一次迭代


    现在，在第一次学习迭代之后，我们得到了一组新更新的偏置和权重，*即* `b=0.01667`、`w1=0.02558` 和 `w2=0.02778`。利用这些值，可以计算最新的交叉熵损失，如下所示：


    ![](img/9789815136982-C4-B10.jpg)

    ![](img/9789815136982-C4-B11.jpg)

    ![](img/9789815136982-C4-B12.jpg)

    ![](img/9789815136982-C4-B13.jpg)

    ![](img/9789815136982-C4-B14.jpg)


    因此，第一次学习迭代后的最新交叉熵损失为 `0.6764`。接下来，让我们利用上述确定的更新后的偏置和权重继续进行第二次迭代。


    ### 4.3.3. 开始学习的第二次迭代


    取第一个训练样本的输入值并计算预测值 `ŷ1`：


    ![](img/9789815136982-C4-B15.jpg)


    取第二个训练样本的输入值并计算预测值 `ŷ2`：


    ![](img/9789815136982-C4-B16.jpg)


    取第三个训练样本的输入值并计算预测值 `ŷ3`：


    ![](img/9789815136982-C4-B17.jpg)


    计算 `∂L/∂b` 的值：


    ![](img/9789815136982-C4-B18.jpg)


    计算 `∂L/∂w1` 的值：


    ![](img/9789815136982-C4-B19.jpg)


    计算 `∂L/∂w2` 的值：


    ![](img/9789815136982-C4-B20.jpg)


    ### 4.3.4. 结束学习的第二次迭代


    在第二次学习迭代结束时，我们得到一组新更新的偏置和权重，*即* `b=0.03221`、`w1=0.05036` 和 `w2=0.05470`。利用这些值，可以计算最新的交叉熵损失，如下所示：


    ![](img/9789815136982-C4-B21.jpg)

    ![](img/9789815136982-C4-B22.jpg)


    与第一次迭代后的交叉熵损失 `=0.6764` 相比，可以注意到损失现已降低至 `0.6609`，表明逻辑回归模型的性能正在提升！


    此外，同一学习过程将重复总共 `500,000` 次，以持续更新偏置和权重，直到真实输出值与预测输出值之间的交叉熵损失稳定并达到最小值；只有那时，才说获得了最优偏置和权重。为简洁起见，本章将不再展示第三次迭代及之后的详细计算，而是在表
    **3** 中列出前五次和最后五次迭代的偏置、权重及交叉熵损失。如有必要，建议读者尝试按照上述详细计算再进行几次迭代，以更深入地理解训练逻辑回归模型的过程。此外，**图
    (3)** 描绘了交叉熵损失随学习迭代次数增加而减少并最终稳定的情况。


    ![](img/9789815136982-C4-F3.jpg)


    **图 (3)：交叉熵损失 vs. 学习迭代次数。**


    **表 3：前五次和最后五次迭代的偏置、权重及交叉熵损失值。**


    | **迭代次数** | **b** | **w[1]** | **w[2]** | **损失** |

    | --- | --- | --- | --- | --- |

    | 1 | 0.01667 | 0.02558 | 0.02778 | 0.6764 |

    | 2 | 0.03221 | 0.05036 | 0.05470 | 0.6609 |

    | 3 | 0.04666 | 0.07438 | 0.08081 | 0.6465 |

    | 4 | 0.06010 | 0.09766 | 0.10613 | 0.6331 |

    | 5 | 0.07256 | 0.12024 | 0.13071 | 0.6206 |

    | ... | ... | ... | ... | ... |

