    将 `u→` 投影到垂直于边距的向量（即 `w→`）上，如果该投影大于或等于（≥）某个常数 `c`，该常数穿过中线，那么它必须是正（+）数据点。这可以用数学方式表示为：


    `w→⋅u→≥c`，则 `u→` 标记为 +


    执行简单变换：


    `w→⋅u→-c≥0`


    `w→⋅u→+bt≥0`，其中 `bt=-c`


    边距的中线：


    `w→⋅u→+bt=0`


    边距的边缘线（靠近 +）：


    `w→⋅u→+bt=ä`


    此处，`ä` 为正常数


    两边同时除以 `ä`：


    `w→/ä⋅u→+bt/ä=1`


    令 `W→=w→/ä` 和 `b=bt/ä`，


    边距的边缘线（靠近 +）更新为：


    `W→⋅u→+b=1`


    边距的中线更新为：


    `W→⋅u→+b=0`


    对称地，如图（**7.3**）所示，边距的边缘线（靠近 -）更新为：


    ![](img/9789815136982-C7-F3.jpg)

    **图 (7.3)**


    超平面、边缘线（靠近 +）和边缘线（靠近 -）的通用方程示意图。


    `W→⋅u→+b=-1`

