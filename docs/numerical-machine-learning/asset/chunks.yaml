    \  \n\n## Abstract\n\nIn this chapter, we investigate Support Vector Machines\
    \ (SVM) for both linearly separable and linearly non-separable cases, emphasizing\
    \ accessibility by minimizing abstract mathematical theories. We present concrete\
    \ numerical examples with small datasets and provide a step-by-step walkthrough,\
    \ illustrating the inner workings of SVM. Additionally, we offer sample codes\
