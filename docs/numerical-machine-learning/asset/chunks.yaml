    ## 7.4. MATHEMATICS OF SUPPORT VECTOR MACHINE: LINEARLY NON-SEPARABLE CASE


    In the previous 2 sections, the discussion is all about the SVM for linearly separable
    cases. What if the problem is not linearly separable? *e.g.,* as shown in Fig.
    ([**7.7**](#9789815136982-C7.html#f7.7)), where 2 samples belong to the positive
    ($+$) class and 2 samples belong to the negative ($-$) class in one-dimensional
    space. It is clear we cannot draw a single linear line to separate the 2 classes
    in this case.


    ![](Images/9789815136982-C7-F7.jpg)

    **Fig. (7.7)**


    Illustration of 2 data points of $+$ class and 2 data points of $-$ class in one-dimensional
    space.


    This is where the very powerful idea, kernel, comes into play. A kernel takes
    a low-dimensional input space and transforms it into a higher-dimensional space,
    as shown in Fig. ([**7.8**](#9789815136982-C7.html#f7.8)). In other words, we
    can say that it converts non-separable problems to separable problems by adding
    more dimension(s) to it.


    ![](Images/9789815136982-C7-F8.jpg)

    **Fig. (7.8)**


    Illustration of transforming low-dimensional input space into higher-dimensional
    space.


    From the previous 2 sections, we have understood that the solution for SVM depends
    only on the dot product of pairs of the support vectors. However, now with the
    support vectors in original form, it is not linearly separable. We need to transform
    these support vectors accordingly.

    '
  trans: '

    因此，现在可以将其表示为：


    $\vec{W} \cdot \vec{u} + b \ge 1$ 适用于 $+$ 类数据点


    $\vec{W} \cdot \vec{u} + b \le -1$ 适用于 $-$ 类数据点


    对于目标输出 $y_i$，用 $+1$ 表示正类（$+$）数据点，用 $-1$ 表示负类（$-$）数据点：


    $y_i = +1$ 适用于 $+$ 类数据点


    $y_i = -1$ 适用于 $-$ 类数据点


    因此，利用这些条件，我们可以得到：


    $y_i(\vec{W} \cdot \vec{u} + b) \ge 1$ 适用于所有数据点。


    $y_i(\vec{W} \cdot \vec{u} + b) = 1$ 适用于边界线上的数据点*（即，* 支持向量）。


    接下来，为了表示间隔，取 2 个支持向量：来自 $+$ 类的 $\vec{x_+}$ 和来自 $-$ 类的 $\vec{x_-}$，这两个向量的差为 $\vec{x_+}
    - \vec{x_-}$，如图（**7.4**）所示。回顾一下，我们有一个法向量 $\vec{W}$，它垂直于间隔。对应的单位法向量为 $\frac{\vec{W}}{|\vec{W}|}$，其中分母
    $|\vec{W}|$ 是 $\vec{W}$ 的模。因此，间隔可以表示为：


    ![](img/9789815136982-C7-F4.jpg)

    **图 (7.4)**


    正类支持向量 $\vec{x_+}$、负类支持向量 $\vec{x_-}$ 及其差值 $\vec{x_+} - \vec{x_-}$ 的示意图。


    $\text{间隔} = \frac{(\vec{x_+} - \vec{x_-}) \cdot \vec{W}}{|\vec{W}|}$


    不要忘记之前为所有支持向量推导出的约束条件：


    $y_i(\vec{W} \cdot \vec{u} + b) = 1$


    因此，对于 $\vec{x_+}$，将会是：


    $1(\vec{W} \cdot \vec{x_+} + b) = 1$


    $\vec{W} \cdot \vec{x_+} = 1 - b$


    对于 $\vec{x_-}$，将会是：


    $-1(\vec{W} \cdot \vec{x_-} + b) = 1$


    $-\vec{W} \cdot \vec{x_-} = 1 + b$


    间隔的表达式更新为：


    $\text{间隔} = \frac{\vec{x_+} - \vec{x_-} \cdot \vec{W}}{|\vec{W}|} = \frac{\vec{W}
    \cdot \vec{x_+} - \vec{W} \cdot \vec{x_-}}{|\vec{W}|} = \frac{1 - b + 1 + b}{|\vec{W}|}
    = \frac{2}{|\vec{W}|}$


    请记住，目标是找到一个与最大间隔相关联的超平面。


    $\text{间隔} = \frac{2}{|\vec{W}|}$，用于最大化


    $\to$ 等价于最小化分母 $|\vec{W}|$


    $\to$ 等价于最小化 $\frac{1}{2}|\vec{W}|²$


    进行这种转换的原因纯粹是为了在后续推导中获得数学上的便利。


    因此，单目标优化（SOO）问题已构建完成，如下所示：


    最小化 $f = \frac{1}{2}|\vec{W}|²$


    受以下约束条件限制：


    $g_i = y_i(\vec{W} \cdot \vec{x_i} + b) - 1 = 0$ 适用于所有支持向量 $\vec{x_i}$


    这个带有等式约束的 SOO 问题可以通过拉格朗日乘数法轻松求解，其定义为：


    $L = f - \sum_i \alpha_i g_i$


    $L$ 是拉格朗日函数


    $f$ 是优化函数


    $\alpha$ 是拉格朗日乘子


    $g$ 是等式约束


    所以，对于我们的 SOO 问题，使用拉格朗日乘数法：


    $L = \frac{1}{2}|\vec{W}|² - \sum_i \alpha_i [y_i(\vec{W} \cdot \vec{x_i} + b)
    - 1]$


    $\frac{\partial L}{\partial \vec{W}} = \vec{W} - \sum_i \alpha_i y_i \vec{x_i}
    = 0$


    $\therefore \vec{W} = \sum_i \alpha_i y_i \vec{x_i}$


    $\frac{\partial L}{\partial b} = -\sum_i \alpha_i y_i = 0$


    $\therefore \sum_i \alpha_i y_i = 0$


    然后，将求得的最新 $\vec{W} = \sum_i \alpha_i y_i \vec{x_i}$ 表达式代回间隔的中线（$\vec{W} \cdot
    \vec{u} + b = 0$）：


    $\sum_i \alpha_i y_i \vec{x_i} \cdot \vec{u} + b = 0$


    同样，间隔的两条边界线（$\vec{W} \cdot \vec{u} + b = 1$；$\vec{W} \cdot \vec{u} + b = -1$）也可以更新为：


    $\sum_i \alpha_i y_i \vec{x_i} \cdot \vec{u} + b = 1$ 若 $\vec{u}$ 为 $+$ 类支持向量


    $\sum_i \alpha_i y_i \vec{x_i} \cdot \vec{u} + b = -1$ 若 $\vec{u}$ 为 $-$ 类支持向量


    SVM 的所有核心数学方程现已推导完毕。


    ## 7.3. 支持向量机的数值示例与代码对比：线性可分情况


    如表 **7.1** 和图（**7.5**）所示，假设我们有一个仅包含 4 个样本（数据点）的小型训练数据集。前 2 个样本属于负类（$-$），后 2 个样本属于正类（$+$）。我们的任务是构建一个能清晰区分这两个类别的
    SVM 分类器。


    ![](img/9789815136982-C7-F5.jpg)

    **图 (7.5)**


    小型训练数据集中 4 个样本及支持向量的示意图。


    **表 7.1** 用于支持向量机的小型线性可分数据集。


    | X | y |

    | --- | --- |

    | (1, 2) | -1 |

    | (2, 1) | -1 |

    | (4, 4) | 1 |

    | (5, 5) | 1 |


    从上一节我们推导出了以下 3 个方程：


    $\sum_i \alpha_i y_i \vec{x_i} \cdot \vec{u} + b = 1$ 若 $\vec{u}$ 为 $+$ 类支持向量


    $\sum_i \alpha_i y_i \vec{x_i} \cdot \vec{u} + b = -1$ 若 $\vec{u}$ 为 $-$ 类支持向量


    $\sum_i \alpha_i y_i = 0$


    现在，令 $\hat{a}_i = \alpha_i y_i$，然后展开方程：


    $\hat{a}_1 \vec{x_1} \cdot \vec{x_1} + \hat{a}_2 \vec{x_2} \cdot \vec{x_1} + \hat{a}_3
    \vec{x_3} \cdot \vec{x_1} + b = -1$ 当 $\vec{u} = \vec{x_1}$ 时


    $\hat{a}_1 \vec{x_1} \cdot \vec{x_2} + \hat{a}_2 \vec{x_2} \cdot \vec{x_2} + \hat{a}_3
    \vec{x_3} \cdot \vec{x_2} + b = -1$ 当 $\vec{u} = \vec{x_2}$ 时


    $\hat{a}_1 \vec{x_1} \cdot \vec{x_3} + \hat{a}_2 \vec{x_2} \cdot \vec{x_3} + \hat{a}_3
    \vec{x_3} \cdot \vec{x_3} + b = 1$ 当 $\vec{u} = \vec{x_3}$ 时


    $\hat{a}_1 + \hat{a}_2 + \hat{a}_3 = 0$


    可以看出，解仅依赖于支持向量对的点积。然后，计算所有支持向量对的点积：


    $\vec{x_1} \cdot \vec{x_1} = (1, 2) \cdot (1, 2) = 1 \cdot 1 + 2 \cdot 2 = 5$


    $\vec{x_2} \cdot \vec{x_1} = (2, 1) \cdot (1, 2) = 2 \cdot 1 + 1 \cdot 2 = 4$


    $\vec{x_3} \cdot \vec{x_1} = (4, 4) \cdot (1, 2) = 4 \cdot 1 + 4 \cdot 2 = 12$


    $\vec{x_1} \cdot \vec{x_2} = (1, 2) \cdot (2, 1) = 1 \cdot 2 + 2 \cdot 1 = 4$


    $\vec{x_2} \cdot \vec{x_2} = (2, 1) \cdot (2, 1) = 2 \cdot 2 + 1 \cdot 1 = 5$


    $\vec{x_3} \cdot \vec{x_2} = (4, 4) \cdot (2, 1) = 4 \cdot 2 + 4 \cdot 1 = 12$


    $\vec{x_1} \cdot \vec{x_3} = (1, 2) \cdot (4, 4) = 1 \cdot 4 + 2 \cdot 4 = 12$


    $\vec{x_2} \cdot \vec{x_3} = (2, 1) \cdot (4, 4) = 2 \cdot 4 + 1 \cdot 4 = 12$


    $\vec{x_3} \cdot \vec{x_3} = (4, 4) \cdot (4, 4) = 4 \cdot 4 + 4 \cdot 4 = 32$


    然后，将数值代入方程：


    $5\hat{a}_1 + 4\hat{a}_2 + 12\hat{a}_3 + b = -1$


    $4\hat{a}_1 + 5\hat{a}_2 + 12\hat{a}_3 + b = -1$


    $12\hat{a}_1 + 12\hat{a}_2 + 32\hat{a}_3 + b = 1$


    $\hat{a}_1 + \hat{a}_2 + \hat{a}_3 = 0$


    求解该线性方程组后，得到 $\hat{a}_1, \hat{a}_2, \hat{a}_3$ 和 $b$ 为：


    $\hat{a}_1 = -0.08, \hat{a}_2 = -0.08, \hat{a}_3 = 0.16, b = -2.2$


    利用求得的 $\hat{a}_1, \hat{a}_2, \hat{a}_3$ 值来求 $\vec{W}$：


    $\vec{W} = \sum_i \alpha_i y_i \vec{x_i} = \sum_i \hat{a}_i \vec{x_i} = -0.08(1,
    2) - 0.08(2, 1) + 0.16(4, 4) = (0.4, 0.4)$


    更新间隔的中线*（即，* 超平面，$\vec{W} \cdot \vec{u} + b = 0$）：


    $(0.4, 0.4) \cdot \vec{u} - 2.2 = 0$


    因此，超平面本质上是满足上述方程的那些 $\vec{u}$ 向量。让我们将向量 $\vec{u}$ 表示为二维空间中的坐标 $(u_1, u_2)$，其中
    $u_1$ 是水平轴上的标量/大小，$u_2$ 是垂直轴上的标量/大小，如图（**7.6**）所示。


    ![](img/9789815136982-C7-F6.jpg)

    **图 (7.6)**


    最优超平面、边界线（靠近 $+$）和边界线（靠近 $-$）的计算方程示意图。


    $(0.4, 0.4) \cdot (u_1, u_2) - 2.2 = 0$


    $0.4 \cdot u_1 + 0.4 \cdot u_2 = 2.2$


    $u_1 + u_2 = 5.5$


    同样地，对于间隔的边界线（靠近 $+$）（$\vec{W} \cdot \vec{u} + b = 1$）：


    $(0.4, 0.4) \cdot (u_1, u_2) - 2.2 = 1$


    $u_1 + u_2 = 8$


    对于间隔的边界线（靠近 $-$）（$\vec{W} \cdot \vec{u} + b = -1$）：


    $(0.4, 0.4) \cdot (u_1, u_2) - 2.2 = -1$


    $u_1 + u_2 = 3$


    现在让我们将上述获得的结果与 `scikit-learn` 库提供的现成 SVM 分类器的结果进行比较。


