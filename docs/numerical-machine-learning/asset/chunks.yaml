    \ Linear Regression, Numerical Example, Small Dataset, Housing Price Prediction,\
    \ Scikit-Learn, Lasso, Ridge.  \n\n## 3.1. INTRODUCTION TO L1 AND L2 REGULARIZATION\n\
    \nRegularization is the process of adding an extra penalty to a more complicated\
    \ model with larger values of weights to prevent overfitting. A problem known\
    \ as overfitting happens when a machine learning model is made specifically for\
    \ training datasets and is unable to generalize well to previously unseen datasets.\
    \ Introducing regularization techniques into machine learning models is essential\
    \ for achieving better generalization and improved performance on new data. By\
    \ penalizing overly complex models, regularization helps lead to more accurate\
    \ and stable predictions. Some popular regularization methods include L1 and L2\
    \ regularization, which differ in the way they penalize the model's complexity.\
    \ Regularization has proven to be a critical component in the development of robust\
    \ and reliable models, particularly when dealing with high-dimensional data or\
    \ noisy datasets. It enables practitioners to build more efficient models, capable\
    \ of adapting to new and diverse situations while reducing the risk of overfitting\
    \ and maintaining interpretability.\n\nThis chapter focuses on L1 and L2 regularization,\
    \ which are demonstrated in detail by making necessary changes from the original\
    \ linear regression model discussed in Chapter 2. Bear in mind, however, that\
    \ L1 and L2 regularization can also be applied to other machine learning models\
    \ (*e.g.*, logistic regression), as well as deep learning neural networks.\n\n\
    The names of L1 and L2 regularization come from the corresponding L1 and L2 norms\
    \ of the weight vector W.\n\nThe L1 norm is defined as:\n\n![](Images/9789815136982-C3-E1.jpg)\n\
    \nA linear regression model with the L1 regularization is known as Lasso (least\
    \ absolute shrinkage and selection operator) regression \\[[1](#9789815136982-C3.html#r1),\
    \ [2](#9789815136982-C3.html#r2)\\], whereas a linear regression model with the\
    \ L2 regularization is called Ridge regression \\[[3](#9789815136982-C3.html#r3),\
    \ [4](#9789815136982-C3.html#r4)\\].\n\n## 3.2. MATHEMATICS OF L1 REGULARIZATION\
    \ FOR LINEAR REGRESSION\n\nThe general equation of linear regression if having\
    \ more than one independent variable X (*i.e.*, input feature) is as follows:\n\
    \n![](Images/9789815136982-C3-E2.jpg)\n\nThe goal of linear regression is to find\
    \ the best-fit linear equation model that maps the relationship between input\
    \ X and output Y, in the form of Equation (3.1) with the optimal weights and bias,\
    \ which produces the least error (synonymously known as loss in machine learning)\
    \ between the known true output Y values and predicted output Y values by the\
    \ model.\n\n![](Images/9789815136982-C3-E3.jpg)\n\n![](Images/9789815136982-C3-F1.jpg)**Fig.\
    \ (3.1))**  \n\nIllustration of notations using an exemplary training dataset.\
    \ \n\n![](Images/9789815136982-C3-E4.jpg)\n\n![](Images/9789815136982-C3-E5.jpg)\n\
    \n![](Images/9789815136982-C3-E6.jpg)\n\nNext, the Gradient Descent optimization\
    \ algorithm is used to find the optimal bias and weights by iteratively tweaking\
    \ their values a tiny bit at a time in the direction of reducing the loss. In\
    \ order to carry out the optimization, we first need to find the partial derivative\
    \ of the mean loss (L) with respect to the bias and weights, namely, ∂L∂b and\
    \ ∂L∂wj, denoting the contribution to the mean loss by the bias and each of the\
    \ weights. This can be done by applying the chain rule, shown in Equations (3.4)\
    \ to (3.9).\n\n![](Images/9789815136982-C3-E7.jpg)\n\n![](Images/9789815136982-C3-E8.jpg)\n\
    \nIt is worth noting that the mathematical notations and Python codes in this\
