    As can be seen from the results of the scikit-learn K-means model and compared
    with our manually calculated results, the same clusters and final centroids are
    obtained, *i.e.,* (42.5, 40), (62.5, 72.5), and (95, 92.5). Additionally, the
    within-cluster sum of squares (WCSS) is used to determine the optimal number of
    clusters. Here, we chose 3 clusters because WCSS does not significantly decrease
    beyond this point.


    ## CONCLUSION


    In this chapter, we discussed the concept of the K-means clustering algorithm.
    To make the material more accessible, we kept abstract mathematical theories to
    a minimum. Instead, we focused on a concrete numerical example with a small dataset
    to show how the clusters can be formed using the K-means clustering algorithm.
    We also provided sample codes and comparisons with the K-means model from the
    off-the-shelf library, scikit-learn. By the end of the chapter, readers should
    have a well-rounded understanding of how K-means clustering works behind the scenes,
    how the mathematics relates to the implementation and performance of the algorithm,
    and be better equipped to apply it in their projects.


