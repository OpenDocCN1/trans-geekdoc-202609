    # Gradient Boosting


    ## Abstract


    In this chapter, we explore gradient boosting, a powerful ensemble machine learning
    method, for both regression and classification tasks. With a focus on accessibility,
    we minimize abstract mathematical theories and instead emphasize two concrete
    numerical examples with small datasets related to predicting house sale prices
    and ease of selling houses in the property market. By providing a step-by-step
    walkthrough, we illuminate the inner workings of gradient boosting and offer sample
    codes and comparisons to the gradient boosting models available in the `scikit-learn`
    library. Upon completing this chapter, readers will possess a comprehensive understanding
    of gradient boosting''s mechanics, its connection to the implementation and performance
    of the algorithm, and be well-prepared to apply it in real-world projects.


    **Keywords:** Gradient Boosting, Ensemble Learning, Regression, Classification,
    Numerical Example, Small Dataset, Scikit-Learn.


    ## 6.1 Introduction to Gradient Boosting


    Gradient boosting is a robust ensemble machine learning model that sequentially
    trains a spate of weak learners to produce a more accurate model at the end [[1]](#9789815136982-C6.html#r1)[[2]](#9789815136982-C6.html#r2).
    A weak learner, generally a rather simple decision tree, is a rudimentary machine
    learning model with low prediction accuracy but still better than random guessing.
    As demonstrated in [Fig. (6.1)](#9789815136982-C6.html#f6.1), the prediction error
    of the ensemble model is reduced with each new decision tree added and integrated
    with all the prior decision trees [[3]](#9789815136982-C6.html#r3). Gradient boosting
    is an efficient and accurate algorithm that has been applied to regression and
    classification problems in many fields, including engineering, healthcare, natural
    language processing, and computer vision, among others. One of the key strengths
    of gradient boosting is its ability to leverage the collective knowledge of multiple
    weak learners, ultimately generating a more robust and accurate model. This is
    achieved by iteratively focusing on the areas where previous weak learners have
    failed to make accurate predictions and subsequently improving upon those areas.
    As a result, gradient boosting has become a popular choice for tackling complex
    problems and achieving state-of-the-art performance in various applications, even
    outperforming other ensemble methods, such as random forests in certain contexts.
    Its versatility and adaptability make gradient boosting a valuable tool in the
    arsenal of machine learning practitioners and researchers alike.


    ![Fig. (6.1) Illustration of gradient boosting.](Images/9789815136982-C6-F1.jpg)


    The rest of this chapter is organized as follows. Section 6.2 presents the mathematics
    of gradient boosting for regression, followed by the demonstration of a numerical
    example in detail and code comparison in Section 6.3. Analogously, Section 6.4
    presents the mathematics of gradient boosting for classification, followed by
    the demonstration of a numerical example in detail and code comparison in Section
    6.5.


    ## 6.2 Mathematics of Gradient Boosting for Regression


    The basic idea of gradient boosting is to iteratively improve the overall model
    by fitting the weak learners to the residuals or gradient of the loss function
    with respect to the previous model''s predictions. This process can be viewed
    as a numerical optimization technique that minimizes the loss function over the
    training dataset. The algorithm starts by initializing the model with a constant
    value. The main loop of the algorithm iterates for a predetermined number of iterations
    (`M`), and in each iteration, the following four steps are performed. Firstly,
    the pseudo-residuals are computed by taking the negative gradient of the loss
    function with respect to the current model''s predictions. These pseudo-residuals
    represent the direction in which the model needs to move to minimize the loss
    function. Secondly, a weak learner, typically a decision tree, is fit to the pseudo-residuals.
    The tree is constructed by splitting the input feature space into regions and
    learning the optimal value for each region to minimize the loss function. Thirdly,
    the optimal values, denoted by `ã`, are computed for each region by minimizing
    the loss function with respect to the previous model''s predictions plus the new
    weak learner''s output. Fourthly, the model is updated by adding the weighted
    output of the new weak learner to the previous model''s predictions; the weight
    here, denoted by `á`, is a shrinkage parameter that controls the learning rate
    of gradient boosting. Finally, these four steps are repeated for `M` iterations,
    and the final model is a combination of weak learners that can make accurate predictions
    by collectively minimizing the loss function. Together with the generic pseudocode
    [[4]](#9789815136982-C6.html#r4), the mathematics used in gradient boosting for
    regression is presented in Table 6.1. Common symbols used throughout the chapter
    are `xi`, denoting the feature values of the `i`th sample (out of the total `n`
    samples from training dataset); `yi` and `Fxi`, representing the true and predicted
    output for the `i`th sample, respectively; `m` and `M`, denoting the index of
    a decision tree and the total number of decision trees in the gradient boosting
    model; `rim`, representing the residual of the `i`th sample in the `m`th decision
    tree; `Rjm`, denoting the `j`th leaf node of the `m`th decision tree; `á`, referring
    to the learning rate when building the model.


    Table 6.1 **Pseudocode and mathematics of gradient boosting for regression.**


    | ![](Images/9789815136982-C6-T1.jpg) |

    | --- |


    ## 6.3 Numerical Example and Code Comparison of Gradient Boosting for Regression


    Suppose we have a small training dataset presented in Table 6.2 with only 3 samples
    (*i.e*., `n=3`), which pertains to the sale price of houses in millions of dollars
    (abbreviated as `sale_price_million`) based on 1 input features, the total number
    of bedrooms in the house (abbreviated as `num_bedrooms`). In other words, for
    this example, the independent variable `X` is `num_bedrooms`, and the dependent
    variable `Y` is `sale_price_million`. Our task is to build a gradient boosting
    regression model that maps the `X` and `Y`.


    Table 6.2 **The small dataset for gradient boosting regression.**


    | | `num_bedrooms` (`xi`) | `sale_price_million` (`yi`) |

    | --- | --- | --- |

