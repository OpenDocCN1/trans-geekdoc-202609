    \ `âi` 和 `b` 值为：\n\n```\nâ1 = -1\nâ2 = -1\nâ3 = 1\nâ4 = 1\nb = -0.033\n```\n\n\
    设向量 `u→` 在二维空间中表示为 `(u1, u2)`，其中 `u1` 是水平轴上的标量/大小，`u2` 是垂直轴上的标量/大小。\n\n```\nK(x1→,\
