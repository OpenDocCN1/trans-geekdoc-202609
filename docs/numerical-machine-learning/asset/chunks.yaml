    #### 特征 Outlook 的分裂分析


    先考虑 `Outlook`，它包含 3 个唯一值：0、1、2（即阴天、雨天、晴天）。


    **分裂 1：`Outlook ≤ 0.5`**

    可在 0 和 1 之间进行公平分裂。满足条件的样本（阴天）分入左子节点，其余（雨天或晴天）分入右子节点。


