    unseen house with 1200 sqft and 3 bedrooms is also the same as that produced by
    our own model.


    ## CONCLUSION


    In this chapter, we discussed the concept of logistic regression, a popular machine
    learning algorithm used for classification tasks. To make the material more accessible,
    we kept abstract mathematical theories to a minimum. Instead, we focused on a
    concrete numerical example with a small dataset to predict whether it is easy
    to sell houses in the property market, walking through it step by step. We also
    provided sample codes and a comparison with the logistic regression model from
    the off-the-shelf library, `scikit-learn`. By the end of the chapter, readers
    should have a well-rounded understanding of how logistic regression machine learning
    works behind the scenes, how the mathematics relates to the implementation and
    performance of the algorithm, and be better equipped to apply it in their projects.


