    ![右子节点熵计算](img/9789815136982-C5-EE3.jpg)


    使用条件 `Outlook ≤ 0.5` 的信息增益 (IG) 计算如下：


    ![IG 计算](img/9789815136982-C5-EE4.jpg)


    **分裂 2：`Outlook ≤ 1.5`**

    可在 1 和 2 之间进行公平分裂。满足条件的样本（阴天或雨天）分入左子节点，其余（晴天）分入右子节点。


