    \ neural networks.\n\nThe names of L1 and L2 regularization come from the corresponding\
    \ L1 and L2 norms of the weight vector `W`.\n\nThe L1 norm is defined as:\n\n\
    ![](Images/9789815136982-C3-E1.jpg)\n\nA linear regression model with the L1 regularization\
    \ is known as Lasso (least absolute shrinkage and selection operator) regression\
    \ \\[[1](#9789815136982-C3.html#r1), [2](#9789815136982-C3.html#r2)\\], whereas\
    \ a linear regression model with the L2 regularization is called Ridge regression\
    \ \\[[3](#9789815136982-C3.html#r3), [4](#9789815136982-C3.html#r4)\\].\n\n##\
    \ 3.2. MATHEMATICS OF L1 REGULARIZATION FOR LINEAR REGRESSION\n\nThe general equation\
    \ of linear regression if having more than one independent variable `X` (i.e.,\
    \ input feature) is as follows:\n\n![](Images/9789815136982-C3-E2.jpg)\n\nThe\
    \ goal of linear regression is to find the best-fit linear equation model that\
    \ maps the relationship between input `X` and output `Y`, in the form of Equation\
    \ (3.1) with the optimal weights and bias, which produces the least error (synonymously\
    \ known as loss in machine learning) between the known true output `Y` values\
    \ and predicted output `Y` values by the model.\n\n![](Images/9789815136982-C3-E3.jpg)\n\
    \n![](Images/9789815136982-C3-F1.jpg)**Fig. (3.1))**  \n\nIllustration of notations\
    \ using an exemplary training dataset. \n\n![](Images/9789815136982-C3-E4.jpg)\n\
    \n![](Images/9789815136982-C3-E5.jpg)\n\n![](Images/9789815136982-C3-E6.jpg)\n\
    \nNext, the Gradient Descent optimization algorithm is used to find the optimal\
    \ bias and weights by iteratively tweaking their values a tiny bit at a time in\
    \ the direction of reducing the loss. In order to carry out the optimization,\
    \ we first need to find the partial derivative of the mean loss (`L`) with respect\
    \ to the bias and weights, namely, `∂L/∂b` and `∂L/∂wj`, denoting the contribution\
    \ to the mean loss by the bias and each of the weights. This can be done by applying\
    \ the chain rule, shown in Equations (3.4) to (3.9).\n\n![](Images/9789815136982-C3-E7.jpg)\n\
    \n![](Images/9789815136982-C3-E8.jpg)\n\nIt is worth noting that the mathematical\
    \ notations and Python codes in this chapter are somewhat similar to those in\
    \ Chapters 2 and 4 of this book \\[[5](#9789815136982-C3.html#r5), [6](#9789815136982-C3.html#r6)\\\
    ]. However, the focuses of Chapters 2 and 4 are on linear regression and logistic\
    \ regression, respectively, whereas the focus of this chapter is on regularization.\n\
    \n## 3.3. NUMERICAL EXAMPLE OF L1 REGULARIZATION FOR LINEAR REGRESSION\n\nSame\
    \ as the original linear regression discussed in Chapter 2, suppose we have a\
    \ small training dataset presented in (Table **3.1**) with only 3 samples (i.e.,\
    \ `m=3`), which pertains to the sale price of houses in millions of dollars (abbreviated\
    \ as `sale_price_million`) based on 2 input features (i.e., `n=2`), namely, the\
    \ size of a house in square feet (abbreviated as `size_sqft`) and the total number\
    \ of bedrooms in the house (abbreviated as `num_bedrooms`). In other words, for\
    \ this example, `X` is `size_sqft` and `num_bedrooms`, and `Y` is `sale_price_million`.\
    \ Our task is to build a best-fit linear regression model that maps the `X` and\
    \ `Y` under L1 regularization.\n\nTable 3.1 **The small dataset for linear regression\
    \ under regularization.**  \n\n| **size_sqft** || **num_bedrooms** || **sale_price_million**\
    \ |\n\n| --- | --- | --- |\n\n| 1600 || 5 || 2.28 |\n\n| --- | --- | --- |\n\n\
    | 1200 || 4 || 1.5 |\n\n| 740 || 2 || 0.88 |\n\nNext, normalize the feature values\
    \ (i.e., the values of `size_sqft` and `num_bedrooms` columns) to bring them to\
    \ a common scale between 0 and 1, using Max-min normalization, as shown in Equation\
    \ (3.12). Without normalization, some feature(s) might dominate the machine learning\
    \ process.\n\n![](Images/9789815136982-C3-E9.jpg)\n\nThe maximum and minimum of\
    \ `size_sqft` are 1600 and 740, respectively. Likewise, the maximum and minimum\
    \ of `num_bedrooms` are 5 and 2, respectively. The output values (i.e., `sale_price_million`)\
    \ are left as they are, without any normalization. The small dataset after Max-min\
    \ normalization on the features is presented in (Table **3.2**).\n\nTable 3.2\
    \ **The small dataset after Max-min normalization for linear regression under\
    \ regularization.**  \n\n| **size_sqft** || **num_bedrooms** || **sale_price_million**\
    \ |\n\n| --- | --- | --- |\n\n| 1 || 1 || 2.28 |\n\n| --- | --- | --- |\n\n| 0.5349\
    \ || 0.6667 || 1.5 |\n\n| 0 || 0 || 0.88 |\n\n![](Images/9789815136982-C3-E10.jpg)\n"
