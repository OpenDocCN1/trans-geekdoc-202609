    # Gradient Descent Optimization in Logistic Regression


    Gradient descent optimization algorithm is utilized to find the optimal bias and
    weights by iteratively tweaking their values a tiny bit at a time in the direction
    of reducing the loss. Before that, we need to find the partial derivative of the
    mean loss (`L`) with respect to the bias and weights, namely, `∂L/∂b` and `∂L/∂wj`,
    denoting the contribution to the mean loss by the bias and each of the weights.
    This can be done by applying the chain rule, shown in Equations (4.7) to (4.12):


    ![](Images/9789815136982-C4-Eq7.jpg)

    ![](Images/9789815136982-C4-Eq8.jpg)

    ![](Images/9789815136982-C4-Eq9.jpg)

    ![](Images/9789815136982-C4-Eq10.jpg)

    ![](Images/9789815136982-C4-Eq11.jpg)

    ![](Images/9789815136982-C4-Eq12.jpg)


    Here, `j ∈ [1, n]` and `n` is the number of features.


    Subsequently, gradient descent is used to update the bias, `b` (Equation 4.13)
    and the weights, `w` (Equation 4.14).


    ![](Images/9789815136982-C4-Eq13.jpg)

    ![](Images/9789815136982-C4-Eq14.jpg)


    Here, `α` is the learning rate (typically a small value, *e.g*., `0.1`, `0.01`,
    `0.001`).


    It is worth noting that the mathematical notations and Python codes in this chapter
    are somewhat similar to those in Chapters 2 and 3 of this book [[5]](#9789815136982-C4.html#r5),
    [[6]](#9789815136982-C4.html#r6). However, the focuses of Chapters 2 and 3 are
    on linear regression and regularization, respectively, whereas the focus of this
    chapter is on logistic regression.


    ## 4.3. Numerical Example of Logistic Regression


    Suppose we have a small training dataset presented in Table **[1](#9789815136982-C4.html#t1)**
    with only 3 samples (*i.e.,* `m=3`), which has two features, namely, the size
    of a house in square feet (abbreviated as `size_sqft`) and the total number of
    bedrooms in the house (abbreviated as `num_bedrooms`), as well as one output about
    whether it is easy to sell the house (abbreviated as `is_easy_sell`) in the property
    market. The output is dichotomous with only two possible values/classes/labels
    (*i.e.,* `0` and `1`), where `0` means No (not easy to sell) and `1` means Yes
    (easy to sell). In other words, for this example, `X` is `size_sqft` and `num_bedrooms`,
    and `Y` is `is_easy_sell`. Our task is to build a logistic regression model that
    maps the `X` and `Y`.


    **Table 1: The small dataset for logistic regression.**


    | **size_sqft** | **num_bedrooms** | **is_easy_sell** |

    | --- | --- | --- |

    | 1600 | 5 | 1 |

    | 1200 | 4 | 1 |

    | 740 | 2 | 0 |


    Next, normalize the feature values (*i.e.,* the values of `size_sqft` and `num_bedrooms`
    columns) to bring them to a common scale between 0 and 1, using Max-min normalization,
    as shown in Equation (4.15). Without normalization, some feature(s) might dominate
    the machine learning process.


    ![](Images/9789815136982-C4-Eq15.jpg)


    The maximum and minimum of `size_sqft` are `1600` and `740`, respectively. Likewise,
    the maximum and minimum of `num_bedrooms` are `5` and `2`, respectively. The output
    labels (*i.e.,* `is_easy_sell`) are left as they are, without any normalization.
    The small dataset after Max-min normalization on the features is presented in
