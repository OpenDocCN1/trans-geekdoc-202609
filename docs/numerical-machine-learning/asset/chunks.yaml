    # 机器学习导论


    **Zhiyuan Wang**, **Sayed Ameenuddin Irfan**, **Christopher Teoh**, **Priyanka
    Hriday Bhoyar**


    ## 摘要


    机器学习作为计算机科学的一个快速发展的分支领域，已对许多行业和我们的生活产生了重大影响。本章讨论了机器学习的简要历史、其作为既定功能的广泛采用，以及监督学习与无监督学习、回归与分类、欠拟合与过拟合等基本概念。我们还强调了通过数值示例理解机器学习的重要性，这能够弥合抽象数学理论与机器学习算法实际应用之间的鸿沟。通过建立扎实的机器学习基础，读者/学生可以利用其潜力，应对各个不同领域的挑战与机遇。


    **关键词：** 数值示例，机器学习历史，监督学习，无监督学习，回归，分类，欠拟合，过拟合。


    ## 1.1 机器学习简史


    机器学习是计算机科学的一个子领域，涉及创建能够从数据中学习并进行预测的算法。它拥有悠久而丰富的历史 [[1]](#9789815136982-C1.html#r1)，其渊源可追溯至
    20 世纪 50 年代人工智能领域的建立。该领域专注于开发能够执行通常需要类人智能的任务的机器，例如识别模式、从经验中学习和做出决策。首批机器学习算法开发于
    20 世纪 60 年代，包括决策树和最近邻算法。20 世纪 80 年代，随着人工神经网络和支持向量机等算法的开发，该领域迎来了快速增长。这些算法在 20 世纪
    90 年代被应用于广泛的应用场景，包括自然语言处理、计算机视觉和语音识别。2000 年代，随着梯度提升等新算法的开发，以及机器学习在金融和医疗等行业中的使用日益增加，该领域持续演变。2010
    年代见证了机器学习的广泛采用，这得益于大数据的出现以及可用于训练大型复杂机器学习模型的强大图形处理单元（GPU）的开发。深度学习 [[2]](#9789815136982-C1.html#r2)
    这一子领域（通常涉及多层神经网络的使用）变得尤为流行，并在多个不同领域找到了应用。如今，机器学习是一个快速发展的领域，目前正应用于各个行业。它有潜力彻底改变许多行业，并已产生了重大的社会影响。


    ## 1.2 机器学习作为既定功能


    由于多种因素，预计机器学习将在未来二十年成为一项变革性技术。一个关键因素是数据可用性的不断增加，预计未来几年将继续大幅增长。由于机器学习算法特别适合分析和理解大量数据，这将为其在医疗、金融、交通、教育、制造等各个领域（不仅限于此）的应用创造新机遇。在这些及其他领域，机器学习已被采用来自动化一些目前由人类执行的任务，从而释放人力专注于更具创造性和高层次的工作
    [[3]](#9789815136982-C1.html#r3)。


    '
