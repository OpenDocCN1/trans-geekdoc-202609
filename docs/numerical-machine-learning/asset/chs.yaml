  ）。此外，对于 3 个训练样本获得了相同的预测结果（即 `x1` 为 2.04，`x2` 为 1.495，`x3` 为 1.126）。最后，对于先前未见过的 3\
  \ 卧室房子，也获得了相同的预测结果（即 1.126）。\n\n# 6.4. 分类梯度提升的数学原理\n\n要理解分类梯度提升，我们必须首先回顾两个基本的统计学术语，即概率和几率。概率\
  \ (`P`) 表示事件发生的机会。几率只是相对概率的一种表达，定义为事件发生的概率与事件不发生的概率之比（即 `odds = P / (1 - P)`）。例如，假设有\
  \ 2 个蓝球和 1 个红球，\n\n梯度提升分类的算法与梯度提升回归的算法相同，只是损失函数不同，如表 **6.3** 所示。\n\n**表 6.3：分类梯度提升的伪代码与数学原理。**\n\
  \n乍一看，分类梯度提升采用的损失函数显得有些奇特。它本质上源自我们在第 4 章中见过的逻辑回归损失函数，即交叉熵损失函数！\n\n`L = -yi log(Pi)\
  \ + (1 - yi) log(1 - Pi)`\n\n这里，`Pi` 是第 `i` 个样本的预测概率（∈ [0, 1]），`yi` 是第 `i` 个样本的真实标签（例如\
  \ 0 或 1）。\n\n然后，对交叉熵损失函数进行一系列变换：\n\n我们设定 `Fxi = log(oddsi)` 来表示第 `i` 个样本在映射为预测概率之前的预测值，映射公式为：`P\
  \ = 1 / (1 + e^(-log(odds))) = e^(log(odds)) / (1 + e^(log(odds)))`\n\n注：这个 `P =\
  \ 1 / (1 + e^(-log(odds)))` 是否让你想起了第 4 章逻辑回归中使用的 Sigmoid 函数？\n\n最后，在损失函数中用 `Fxi`\
  \ 替换所有的 `log(oddsi)`：\n\n`L = -yi F(xi) + log(1 + e^(F(xi)))`\n\n因此，`L` 变成了 `yi`\
  \ 和 `Fxi` 的函数：\n\n`L(yi, F(xi)) = -yi F(xi) + log(1 + e^(F(xi)))`\n\n这里，`yi` 代表真实输出（例如\
  \ 0 或 1）；`Fxi` 代表预测值（这不是 0 到 1 范围内的预测概率）。\n\n\n\n\n\n## 6.5. 梯度提升分类的数值示例与代码对比\n\n\
  接下来，根据梯度提升算法的输入步骤，我们必须检查损失函数是否可对 `F(xi)` 求导：\n\n```\n∂L(yi, F(xi)) / ∂F(xi) = -yi\
  \ + (1 / (1 + e^F(xi))) * e^F(xi)\n                        = -yi + e^F(xi) / (1\
  \ + e^F(xi))\n                        = -yi + e^log(odds_i) / (1 + e^log(odds_i))\n\
  \                        = -yi + Pi\n```\n\n阅读本节梯度提升分类内容时，请始终牢记 `P = e^log(odds)\
  \ / (1 + e^log(odds))`。\n\n从 `L(yi, F(xi))` 对 `F(xi)` 的一阶导数可以看出，它最终得出一个非常简洁的表达式（即\
  \ `-yi + Pi`），其中 `Pi` 是第 i 个样本的预测概率（∈ [0, 1]），`yi` 是第 i 个样本的真实输出（0 或 1）。\n\n假设我们有一个如**表\
  \ 6.4**所示的小型训练数据集，仅包含 3 个样本（即 n=3），该数据集有一个特征，即房屋的卧室总数（简写为 `num_bedrooms`），以及一个输出，即房屋在房地产市场上是否容易出售（简写为\
  \ `is_easy_sell`）。输出是二分的，只有两种可能的输出（即 0 和 1），其中 0 表示否（不容易出售），1 表示是（容易出售）。换句话说，对于这个例子，`X`\
  \ 是 `num_bedrooms`，`Y` 是 `is_easy_sell`。我们的任务是构建一个梯度提升分类模型，将 `X` 映射到 `Y`。\n\n**表\
  \ 6.4 梯度提升分类的小型数据集。**\n\n| ![](img/9789815136982-C6-T4.jpg) |\n\n使用这个小型训练数据集，我们将把伪代码分解成小块并逐步执行。\n\
  \n![](img/9789815136982-C6-P17.jpg)\n\n利用一阶导数寻找最小值：\n\n```\nd(∑(i=1 to n) L(yi,\
  \ ã)) / dã = 0\n\n∴ -y1 + e^ã/(1+e^ã) - y2 + e^ã/(1+e^ã) - y3 + e^ã/(1+e^ã) = 0\n\
  \n3 * e^ã/(1+e^ã) = y1 + y2 + y3\n\ne^ã/(1+e^ã) = (y1+y2+y3)/3 = (1+0+1)/3 = 2/3\n\
  \n3e^ã = 2(1+e^ã)\n\ne^ã = 2\n\nã = log(2) = 0.693\n```\n\n请记住，`F0(x)` 是使总损失最小化的\
  \ `ã` 值，因此初始 `F0(x) = ã = 0.693`。\n\n```\n∵ F(x) = log(odds)\n∴ F0(x) = 初始 log(odds)\
  \ = 0.693，这是最初所有样本的常数值。\n```\n\n因此，\n\n```\nF0(x1) = 初始 log(odds1) = 0.693\nF0(x2)\
  \ = 初始 log(odds2) = 0.693\nF0(x3) = 初始 log(odds3) = 0.693\n```\n\n根据计算出的初始 `log(odds_i)`\
  \ 求预测概率 `Pi`：\n\n```\n∵ Pi = e^log(odds_i) / (1 + e^log(odds_i))\n\n∴ P1 = e⁰.693\
  \ / (1 + e⁰.693) = 0.667\nP2 = e⁰.693 / (1 + e⁰.693) = 0.667\nP3 = e⁰.693 / (1 +\
  \ e⁰.693) = 0.667\n```\n\n将 `F0(x) = 初始 log(odds)` 和 `Pi` 追加到表中：\n\n![](img/9789815136982-C6-P18.jpg)\n\
  \n这里，`m` 是决策树的索引；`rim` 是第 m 棵决策树中第 i 个样本的残差。\n\n```\n∵ ∂L(yi, F(xi)) / ∂F(xi) =\
  \ -yi + Pi\n∴ -∂L(yi, F(xi)) / ∂F(xi) = yi - Pi\n```\n\n当 `m=1` 时（即第一棵决策树）：\n\n\
  ```\nri1 = yi - Pi\n```\n\n这里，`Pi` 必须对应 `F0(xi)`，因为我们正在处理第一棵决策树。\n\n代入步骤 1 中确定的所有\
  \ `Pi` 值：\n\n```\nr11 = y1 - P1 = 1 - 0.667 = 0.333\nr21 = y2 - P2 = 0 - 0.667 =\
  \ -0.667\nr31 = y3 - P3 = 1 - 0.667 = 0.333\n```\n\n![](img/9789815136982-C6-P19.jpg)\n\
  \n`squared_error`（平方误差）被用作分裂质量/纯度的度量。分裂后子节点的最优值为 0（即最纯的子节点），例如，对于右侧的叶节点（即第 2 个叶节点），计算如下：\n\
  \n```\nmean = (0.333 + (-0.667)) / 2 = -0.167\n\nsquared_error = ((0.333 - (-0.167))²\
  \ + (-0.667 - (-0.167))²) / 2 = 0.25\n```\n\n接下来，在深入**步骤 2(c)** 之前，让我们快速回顾一下泰勒级数。\n\
  \n```\nf(x) = f(a) + f'(a)/1! (x-a) + f''(a)/2! (x-a)² + f'''(a)/3! (x-a)³ + …\n\
  ```\n\n这里，`a` 是一个常数，`x` 代表自变量。\n\n以简单函数 `f(x) = e^x` 为例进行演示：\n\n```\nf'(x) = e^x\n\
  f''(x) = e^x\nf'''(x) = e^x\n```\n\n令 `a=0`，则 `f(a)=1`，`f'(a)=1`，`f''(a)=1`，`f'''(a)=1`。\n\
  \n应用泰勒级数公式：\n\n```\n∴ f(x) = 1 + 1/1! x + 1/2! x² + 1/3! x³ + …\n```\n\n可以对泰勒级数展开进行快速验证。如果使用原函数\
  \ `f(x)=e^x`，当 `x=0.5` 时，`e⁰.5=1.649`。如果使用泰勒级数展开：\n\n```\n1 + 1/1! x + 1/2! x² +\
  \ 1/3! x³ = 1 + 0.5 + 1/2(0.5²) + 1/6(0.5³) = 1.646\n```\n\n可以看出，使用泰勒级数可以获得良好的近似。\n\
  \n现在，让我们继续进行梯度提升分类的**步骤 2(c)**。\n\n![](img/9789815136982-C6-P20.jpg)\n\n这里，`Rjm`\
  \ 表示第 m 棵树的第 j 个叶节点。在第一棵决策树中（即 `m = 1`），只有 2 个叶节点，如下所示的 `R11` 和 `R21`。\n\n![](img/9789815136982-C6-P21.jpg)\n\
  \n利用一阶导数寻找最小值：\n\n```\ndL(y3, F0(x3) + ã) / dã = 0\n\nL'(y3, F0(x3)) + L''(y3, F0(x3))\
  \ * ã = 0\n\nã = -L'(y3, F0(x3)) / L''(y3, F0(x3))\n```\n\n如前所述，损失函数的一阶导数：\n\n```\n\
  ∵ ∂L(yi, F(xi)) / ∂F(xi) = -yi + Pi\n∴ L'(yi, F(xi)) = -yi + Pi\n∴ L'(yi, F0(xi))\
  \ = -yi + Pi = -ri1\n```\n\n这里，`Pi` 必须对应 `F0(xi)`，因为我们正在处理第一棵决策树。\n\n```\nL'(y3,\
  \ F0(x3)) = -y3 + P3 = -r31\n-L'(y3, F0(x3)) = y3 - P3 = r31\n```\n\n二阶导数无非是一阶导数的一阶导数。此外，阅读本节梯度提升分类内容时，请始终牢记\
  \ `Pi = e^log(odds_i) / (1 + e^log(odds_i))` 和 `F(xi) = log(odds_i)`。因此，对 `F(xi)`\
  \ 求导等同于对 `log(odds_i)` 求导。\n\n![](img/9789815136982-C6-P22.jpg)\n\n不要忘记上面推导出的一阶导数：\n\
  \n```\nL'(yi, F0(xi)) = -yi + Pi = -ri1\n```\n\n因此，第 1 个叶节点 `R11` 的 gamma 值最终为：\n\
  \n```\nã = -L'(y3, F0(x3)) / L''(y3, F0(x3)) = r31 / (P3(1-P3)) = 0.333 / (0.667(1-0.667))\
  \ = 1.5\n```\n\n∴ `ã11 = 1.5`\n\n![](img/9789815136982-C6-P23.jpg)\n\n让我们总结一下发现，并简化每个叶节点\
  \ `ã` 值的计算。从上面最终的 `ã` 表达式可以看出，分子只是分配给该叶节点的样本残差之和（例如 `r11 + r21`），分母只是分配给该叶节点的样本的\
  \ `Pi(1-Pi)` 之和（例如 `P1(1-P1) + P2(1-P2)`）。从下一棵决策树开始，我们可以直接应用这些关系。\n\n![](img/9789815136982-C6-P24.jpg)\n\
  \n到目前为止，我们已经完成了步骤 2 的第一棵决策树（即 `m=1`）。\n\n假设在这个简单的数值示例中，梯度提升模型总共要构建 2 棵决策树（即 `M=2`）。让我们继续进行第\
  \ 2 棵决策树的计算。\n\n![](img/9789815136982-C6-P26.jpg)\n![](img/9789815136982-C6-P27.jpg)\n\
  ![](img/9789815136982-C6-P28.jpg)\n\n既然在这个例子中我们假设梯度提升分类器仅包含 2 棵决策树，那么我们就完成了整个步骤\
  \ 2 和模型训练。最后，计算出的概率需要映射到类别/标签（即 0 或 1）。类似于第 4 章的逻辑回归，采用默认阈值 0.5。如果 `P ≥ 0.5`，则向上取整为\
  \ 1 并预测为类别 1；而如果 `P < 0.5`，则向下取整为 0 并预测为类别 0。\n\n![](img/9789815136982-C6-P29.jpg)\n\
  ![](img/9789815136982-C6-P30.jpg)\n\n回顾一下，我们在 `m=2` 的步骤 2(d) 中使用了以下表达式：\n\n```\n\
  F2(xi) = F1(xi) + á(ãj2 | xi ∈ Rj2)\n```\n\n不要忘记我们在 `m=1` 的步骤 2(d) 中应用了这个表达式：\n\n\
  ```\nF1(xi) = F0(xi) + á(ãj1 | xi ∈ Rj1)\n```\n\n如果将它们串联起来，可以得到这个表达式：\n\n```\nF2(xi)\
  \ = F0(xi) + á(ãj1 | xi ∈ Rj1) + á(ãj2 | xi ∈ Rj2)\n```\n\n然后，通过以下方式将 `F2(xi)` 转换为预测概率：\n\
  \n```\nPi = e^log(odds_i) / (1 + e^log(odds_i)) = e^F2(xi) / (1 + e^F2(xi))\n```\n\
  \n这将成为我们针对这个简单示例训练好的梯度提升分类模型！\n\n这里，`(ãj1 | xi ∈ Rj1)` 和 `(ãj2 | xi ∈ Rj2)` 是我们可以从第一棵和第二棵决策树中找到的值。`á`\
  \ 是学习率，在本例中我们将其设为 0.5。\n\n直观上，模型如下所示：\n\n**步骤 3. 输出 Fm(x)**\n\n![](img/9789815136982-C6-P31.jpg)\n\
  \n最后，我们来到算法的第 3 步，也就是最后一步：使用训练好的梯度提升分类模型对先前未见过的数据（即新数据）进行预测。例如，如果有一栋有 3 间卧室的房子，模型预测的类别将是：\n\
  \n```\n0.693 + 0.5 * 1.5 + 0.5 * -0.973 = 0.9565\n\nP = e⁰.9565 / (1 + e⁰.9565)\
  \ = 0.7224\n```\n\n因为 `P ≥ 0.5`，预测类别将为 1，这意味着这栋有 3 间卧室的房子容易出售。\n\n\n\n\n# 比较结果\n\
