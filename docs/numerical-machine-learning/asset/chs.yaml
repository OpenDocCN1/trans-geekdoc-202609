  \ 间卧室的房子，其预测价格也与我们自己的模型产生的结果相同（即 157.2 万美元）。\n\n## 3.5. 线性回归 L2 正则化的数学原理\n\nL2 正则化线性回归再次从拥有多个自变量\
  \ `X`（即输入特征）时的线性回归通用方程开始，如下所示：\n\n`Y = b + ∑(j=1 to n) wj Xj` (3.13)\n\n此处，\n\n\
  - `Y` 是输出\n- `b` 是偏置\n- `n` 是输入特征的数量\n- `wj` 是第 `j` 个特征的权重\n- `Xj` 是第 `j` 个特征的输入值\n\
  \n\n\n\n\n让我们用小写 xi 来表示第 i 个样本的特征值（来自训练数据集总共 m 行样本），那么 xij 将是第 i 个样本处第 j 个特征的值（来自总共\
  \ n 个输入特征），如 图 (3.1) 所示。小写 yi 用于表示第 i 个样本的已知输出值（即真实输出值），而 y^i 用于表示线性方程模型对应的预测输出值。因此，公式\
  \ (3.13) 更新为公式 (3.14)。\n\n`y^i = b + ∑j=1n wj xij`   (3.14)\n\n其中，\n\n*   `i ∈ [1,\
  \ m]`：`m` 是训练样本的数量\n*   `xij`：第 i 个样本处第 j 个特征的值\n*   `b`：偏置\n*   `n`：输入特征的数量\n*\
  \   `wj`：第 j 个特征的权重\n*   `y^i`：第 i 个样本的预测值\n\n到目前为止，一切与第 2 章讨论的原始线性回归相同。L2 正则化带来的关键差异是向损失函数引入了惩罚项\
  \ `λ||W||²₂`（即惩罚系数乘以权重的平方 L2 范数），如下所示：\n\n`L = m⋅MSE + λ||W||²₂ = m⋅∑i=1m (yi -\
  \ y^i)²/m + λ||W||²₂ = ∑i=1m (yi - y^i)² + λ||W||²₂`   (3.15)\n\n其中，\n\n*   `L`：真实输出与预测输出之间的损失\n\
  *   `m`：训练样本的数量\n*   `yi`：第 i 个样本的真实值\n*   `y^i`：第 i 个样本的预测值\n*   `λ`：惩罚系数\n*  \
  \ `||W||²₂`：权重的平方 L2 范数，\n    `||W||²₂ = ∑j=1n wj² = w1² + w2² + … + wn²`\n\n利用梯度下降优化算法，通过沿着减少损失的方向每次微调极小的数值，迭代地寻找最优偏置和权重。在此之前，我们需要求出平均损失（`L`）关于偏置和权重的偏导数，即\
  \ `∂L/∂b` 和 `∂L/∂wj`，它们表示偏置和各个权重对平均损失的贡献。\n\n```\n∂L/∂b = ∂∑i=1m (yi - y^i)²/∂b\
  \ + ∂λ||W||²₂/∂b\n      = ∂∑i=1m (yi - y^i)²/∂y^i ⋅ ∂y^i/∂b + 0          (3.16)\n\
  ```\n\n`∂y^i/∂b = 1`   (3.17)\n\n`∴ ∂L/∂b = ∑i=1m 2(yi - y^i)(-1)`   (3.18)\n\n\
  `∂y^i/∂wj = xij`   (3.19)\n\n```\n∂L/∂wj = ∂∑i=1m (yi - y^i)²/∂wj + ∂λ||W||²₂/∂wj\n\
  \       = ∂∑i=1m (yi - y^i)²/∂y^i ⋅ ∂y^i/∂wj + ∂λ(w1²+w2²+…+wj²+…+wn²)/∂wj\n   \
  \    = ∑i=1m 2(yi - y^i)(-1)xij + 2λwj                (3.20)\n```\n\n这里，`j ∈ [1,\
  \ n]`，且 `n` 是特征的数量。\n\n随后，使用梯度下降来更新偏置 `b`（公式 3.21）和权重 `w`（公式 3.22）。\n\n`b_new =\
  \ b_old - ∂L/∂b ⋅ α`   (3.21)\n\n`wj_new = wj_old - ∂L/∂wj ⋅ α`   (3.22)\n\n这里，`α`\
  \ 是学习率（通常为较小的值，例如 0.1、0.01、0.001）。\n\n## 3.6. 线性回归 L2 正则化的数值示例\n\n与第 2 章讨论的原始线性回归以及本章\
  \ 3.3 节讨论的 L1 正则化线性回归一样，我们采用一个小型训练数据集，如（表 **3.1**）所示，仅包含 3 个样本（即 `m=3`），涉及以百万美元为单位的房屋销售价格（简写为\
  \ `sale_price_million`），基于 2 个输入特征（即 `n=2`），分别为房屋面积（平方英尺，简写为 `size_sqft`）和房屋卧室总数（简写为\
  \ `num_bedrooms`）。换句话说，对于这个例子，`X` 是 `size_sqft` 和 `num_bedrooms`，`Y` 是 `sale_price_million`。我们的任务是构建一个在\
  \ L2 正则化下将 `X` 和 `Y` 映射的最佳拟合线性回归模型。\n\n接下来，使用最大-最小归一化（如公式 (3.12) 所示）将特征值（即 `size_sqft`\
  \ 和 `num_bedrooms` 列的值）归一化，使它们处于 0 到 1 的通用尺度上。特征经过最大-最小归一化后的小型数据集如（表 **3.2**）所示。\n\
  \n现在，让我们开始机器学习过程，构建一个带有 L2 正则化的线性回归模型。\n\n初始化偏置：\n`b = 0`\n\n初始化特征 `size_sqft` 的权重：\n\
  `w1 = 0`\n\n初始化特征 `num_bedrooms` 的权重：\n`w2 = 0`\n\n设置学习率：\n`α = 0.001`\n\n设置惩罚系数：\n\
  `λ = 0.1`\n\n注意，为了书写和表达的简便，除非另有说明，以下所有 `xij` 默认均指归一化后的 `xij`。\n\n### 3.6.1. 开始学习的第一次迭代\n\
  \n取第一个训练样本的输入值并计算预测 `y¹`：\n\n`y¹ = b + ∑j=1n wj x1j = b + w1 x11 + w2 x12 = 0 +\
  \ 0×1 + 0×1 = 0`\n\n取第二个训练样本的输入值并计算预测 `y²`：\n\n`y² = b + ∑j=1n wj x2j = b + w1 x21\
  \ + w2 x22 = 0 + 0×0.5349 + 0×0.6667 = 0`\n\n取第三个训练样本的输入值并计算预测 `y³`：\n\n`y³ = b\
  \ + ∑j=1n wj x3j = b + w1 x31 + w2 x32 = 0 + 0×0 + 0×0 = 0`\n\n计算 `∂L/∂b` 的值：\n\n\
  ```\n∂L/∂b = ∑i=1m 2(yi - y^i)(-1)\n      = 2×(2.28-0)×(-1) + 2×(1.5-0)×(-1) + 2×(0.88-0)×(-1)\n\
  \      = -9.3200\n```\n\n计算 `∂L/∂w1` 的值：\n\n```\n∂L/∂w1 = ∑i=1m 2(yi - y^i)(-1)xi1\
  \ + 2λw1\n       = 2×(2.28-0)×(-1)×1 + 2×(1.5-0)×(-1)×0.5349 + 2×(0.88-0)×(-1)×0\
  \ + 2×0.1×0\n       = -6.1647\n```\n\n计算 `∂L/∂w2` 的值：\n\n```\n∂L/∂w2 = ∑i=1m 2(yi\
  \ - y^i)(-1)xi2 + 2λw2\n       = 2×(2.28-0)×(-1)×1 + 2×(1.5-0)×(-1)×0.6667 + 2×(0.88-0)×(-1)×0\
  \ + 2×0.1×0\n       = -6.5601\n```\n\n更新 `b` 值：\n`b_new = b_old - ∂L/∂b ⋅ α = 0\
  \ - (-9.3200)×0.001 = 0.009320`\n\n更新 `w1` 值：\n`w1_new = w1_old - ∂L/∂w1 ⋅ α = 0\
  \ - (-6.1647)×0.001 = 0.006165`\n\n更新 `w2` 值：\n`w2_new = w2_old - ∂L/∂w2 ⋅ α = 0\
  \ - (-6.5601)×0.001 = 0.006560`\n\n### 3.6.2. 结束学习的第一次迭代\n\n现在，经过第一次学习迭代，我们得到一组新更新的偏置和权重，即\
  \ `b=0.009320`、`w1=0.006165` 和 `w2=0.006560`。利用这些，可以计算最新的 MSE，如下所示：\n\n```\nMSE\
  \ = ∑i=1m (yi - y^i)²/m\n    = [2.28 - (0.009320 + 0.006165×1 + 0.006560×1)]²/3\n\
  \    + [1.5 - (0.009320 + 0.006165×0.5349 + 0.006560×0.6667)]²/3\n    + [0.88 -\
  \ (0.009320 + 0.006165×0 + 0.006560×0)]²/3\n    = 2.6853\n```\n\n因此，带有 L2 正则化的第一次学习迭代后的最新\
  \ MSE 为 2.6853。接下来将继续进行第二次迭代。\n\n### 3.6.3. 开始学习的第二次迭代\n\n取第一个训练样本的输入值并计算预测 `y¹`：\n\
  \n`y¹ = b + ∑j=1n wj x1j = b + w1 x11 + w2 x12 = 0.009320 + 0.006165×1 + 0.006560×1\
  \ = 0.02205`\n\n取第二个训练样本的输入值并计算预测 `y²`：\n\n`y² = b + ∑j=1n wj x2j = b + w1 x21 +\
  \ w2 x22 = 0.009320 + 0.006165×0.5349 + 0.006560×0.6667 = 0.01699`\n\n取第三个训练样本的输入值并计算预测\
  \ `y³`：\n\n`y³ = b + ∑j=1n wj x3j = b + w1 x31 + w2 x32 = 0.009320 + 0.006165×0\
  \ + 0.006560×0 = 0.009320`\n\n计算 `∂L/∂b` 的值：\n\n```\n∂L/∂b = ∑i=1m 2(yi - y^i)(-1)\n\
  \      = 2×(2.28-0.02205)×(-1) + 2×(1.5-0.01699)×(-1) + 2×(0.88-0.009320)×(-1)\n\
  \      = -9.2233\n```\n\n计算 `∂L/∂w1` 的值：\n\n```\n∂L/∂w1 = ∑i=1m 2(yi - y^i)(-1)xi1\
  \ + 2λw1\n       = 2×(2.28-0.02205)×(-1)×1 + 2×(1.5-0.01699)×(-1)×0.5349 + 2×(0.88-0.009320)×(-1)×0\
  \ + 2×0.1×0.006165\n       = -6.1012\n```\n\n计算 `∂L/∂w2` 的值：\n\n```\n∂L/∂w2 = ∑i=1m\
  \ 2(yi - y^i)(-1)xi2 + 2λw2\n       = 2×(2.28-0.02205)×(-1)×1 + 2×(1.5-0.01699)×(-1)×0.6667\
  \ + 2×(0.88-0.009320)×(-1)×0 + 2×0.1×0.006560\n       = -6.4920\n```\n\n更新 `b` 值：\n\
  `b_new = b_old - ∂L/∂b ⋅ α = 0.009320 - (-9.2233)×0.001 = 0.01854`\n\n更新 `w1` 值：\n\
  `w1_new = w1_old - ∂L/∂w1 ⋅ α = 0.006165 - (-6.1012)×0.001 = 0.01227`\n\n更新 `w2`\
  \ 值：\n`w2_new = w2_old - ∂L/∂w2 ⋅ α = 0.006560 - (-6.4920)×0.001 = 0.01305`\n\n\
  ### 3.6.4. 结束学习的第二次迭代\n\n在带有 L2 正则化的第二次学习迭代结束时，我们得到一组新更新的偏置和权重，即 `b=0.01854`、`w1=0.01227`\
  \ 和 `w2=0.01305`。利用这些，可以计算最新的 MSE，如下所示：\n\n```\nMSE = ∑i=1m (yi - y^i)²/m\n    =\
  \ [2.28 - (0.01854 + 0.01227×1 + 0.01305×1)]²/3\n    + [1.5 - (0.01854 + 0.01227×0.5349\
  \ + 0.01305×0.6667)]²/3\n    + [0.88 - (0.01854 + 0.01227×0 + 0.01305×0)]²/3\n \
  \   = 2.6307\n```\n\n与第一次迭代后的 MSE=2.6853 相比，可以注意到 MSE 降低到了 2.6307，表明线性回归模型的性能正在提升，尽管由于较小的学习率，提升速度较慢。\n\
  \n\n\n\n\n# 进一步训练与结果\n\n此外，将相同的学习过程设置为总共重复 500,000 次，以便在 L2 正则化下持续更新偏置和权重，直到真实输出值与预测输出值之间的平均损失稳定下来；只有到那时，才说获得了最优的偏置和权重。为求简洁，本章将不再展示从第三次迭代开始的详细计算，而是在**表\
  \ 3.4**中列出前五次和后五次迭代的偏置、权重和 MSE。如有必要，建议读者自行尝试更多次迭代，以更深入地理解带有 L2 正则化的线性回归模型训练过程。此外，**图\
  \ 3.3** 描绘了 MSE 随学习迭代次数的增加而减小并最终稳定的情况。\n\n> **图 3.3：** 训练 L2 正则化线性回归模型时的均方误差 (MSE)\
  \ 与学习迭代次数的关系。\n\n**表 3.4：** 训练 L2 正则化线性回归模型时前五次和后五次迭代的偏置、权重和 MSE 值。\n\n| 迭代次数 |\
  \ b | w[1] | w[2] | MSE |\n| --- | --- | --- | --- | --- |\n| 1 | 0.009320 | 0.006165\
  \ | 0.006560 | 2.6853 |\n| 2 | 0.01854 | 0.01227 | 0.01305 | 2.6307 |\n| 3 | 0.02767\
  \ | 0.01830 | 0.01948 | 2.5773 |\n| 4 | 0.03670 | 0.02428 | 0.02583 | 2.5250 |\n\
  | 5 | 0.04564 | 0.03019 | 0.03213 | 2.4737 |\n| ... | ... | ... | ... | ... |\n\
  | 499,996 | 0.8907 | 0.7100 | 0.5390 | 0.01222 |\n| 499,997 | 0.8907 | 0.7100 |\
  \ 0.5390 | 0.01222 |\n| 499,998 | 0.8907 | 0.7100 | 0.5390 | 0.01222 |\n| 499,999\
  \ | 0.8907 | 0.7100 | 0.5390 | 0.01222 |\n| 500,000 | 0.8907 | 0.7100 | 0.5390 |\
  \ 0.01222 |\n\n从**表 3.4**和**图 3.3**可以看出，MSE 最终稳定在一个较小的值 0.01222，这表明我们已经训练出了一个良好的带有\
  \ L2 正则化的线性回归模型，其中最优偏置和权重为 `b=0.8907`、`w1=0.71` 和 `w2=0.539`。由此得到的线性回归模型可表示为：\n\n\
  `Y = b + ∑(j=1 to 2) wj ⋅ normalized Xj`\n\n此处，`b=0.8907`、`w1=0.71` 和 `w2=0.539`。\n\
  \n由于在训练过程中执行了最大-最小归一化，因此最终模型也需要反映这一点。这就是此处显示 `normalized Xj` 的原因。\n\n现在，我们可以使用这个训练好的线性回归模型对先前未见过的数据（即新数据）进行预测。例如，有一栋面积为\
  \ 1200 平方英尺、拥有 3 间卧室的新房子。为了预测房价，首先需要使用训练数据集中各特征的最大值和最小值进行归一化。回顾一下，`size_sqft` 的最大值和最小值分别为\
  \ 1600 和 740；`num_bedrooms` 的最大值和最小值分别为 5 和 2。因此，`size_sqft` 对应的归一化 `X1` 和 `num_bedrooms`\
  \ 对应的归一化 `X2` 将为：\n\n`normalized X1 = (1200 - 740) / (1600 - 740) = 0.5349`\n\n\
  `normalized X2 = (3 - 2) / (5 - 2) = 0.3333`\n\n接下来，将归一化后的特征值代入线性回归模型方程：\n\n`Y =\
  \ b + ∑(j=1 to 2) wj ⋅ normalized Xj = 0.8907 + 0.71 × 0.5349 + 0.539 × 0.3333 =\
  \ 1.45`\n\n因此，对于这栋面积 1200 平方英尺、3 间卧室的房子，预测售价为 145 万美元。\n\n# 3.7. 线性回归 L2 正则化的示例代码与对比\n\
  \n根据第 3.5 节和第 3.6 节讨论的数学原理和数值示例，我们使用 Python 从头实现了带有上述小数据集的 L2 正则化线性回归机器学习模型。该代码与第\
  \ 2 章讨论的原始线性回归代码相似。区别在于 `update_bias_weights()` 函数，这是由于损失函数中增加了 L2 正则化项（即 `λW²/2`）。建议读者准备好\
  \ Jupyter Notebook（或其他 Python IDE），并在阅读时尝试运行代码。完整的代码文件可从我们的 Google Drive 共享文件夹下载：\n\
  \n<https://drive.google.com/drive/folders/1FqJvo4ZPazNbEH_GlHFoodqvegnQmHcn?usp=share_link>\n\
  \n首先，仅导入 `pandas` 和 `numpy` 库。\n\n![Images/9789815136982-C3-E31.jpg](img/9789815136982-C3-E31.jpg)\n\
  \n其次，创建 `loss_MSE()` 函数，用于计算线性回归模型的已知真实输出值与预测输出值之间的 MSE。请参阅 `loss_MSE()` 函数的文档字符串以了解其用法。\n\
  \n![Images/9789815136982-C3-E32.jpg](img/9789815136982-C3-E32.jpg)\n\n第三，创建 `update_bias_weights()`\
  \ 函数，用于根据梯度下降优化算法更新偏置和权重的值。我们在第 3.5 节推导的公式 (3.16) 至 (3.22) 在此函数中已被很好地转化为 Python\
  \ 代码。请参阅 `update_bias_weights()` 函数的文档字符串以了解其用法。\n\n![Images/9789815136982-C3-E33.jpg](img/9789815136982-C3-E33.jpg)\n\
  \n第四，创建 `train()` 函数，用于监督特定迭代次数的训练过程并记录损失/MSE 历史记录。请参阅 `train()` 函数的文档字符串以了解其用法。\n\
  \n![Images/9789815136982-C3-E34.jpg](img/9789815136982-C3-E34.jpg)\n\n第五，创建 `max_min_norm()`\
  \ 函数，用于归一化输入特征（即 `X`）的值。请参阅 `max_min_norm()` 函数的文档字符串以了解其用法。\n\n![Images/9789815136982-C3-E35.jpg](img/9789815136982-C3-E35.jpg)\n\
  \n第六，我们将小数据集存储为 numpy 数组，调用 `max_min_norm()` 函数进行归一化，初始化偏置和权重，设置学习率、迭代次数和乘以 L2 正则化项的惩罚系数，然后调用\
  \ `train()` 函数开始构建我们的第一个 L2 正则化线性回归模型，这需要在分解并完全理解每一个步骤的过程后进行。\n\n![Images/9789815136982-C3-E36.jpg](img/9789815136982-C3-E36.jpg)\n\
  \n![Images/9789815136982-C3-E37.jpg](img/9789815136982-C3-E37.jpg)\n\n然后，我们将上述结果与\
  \ `scikit-learn` 库提供的现成 L2 正则化线性回归模型（即 `Ridge`）的结果进行对比。这些对比包括训练后的最终偏置和权重、最终 MSE，以及对那栋面积\
  \ 1200 平方英尺、3 间卧室的房子（新数据）的预测价格。代码如下：\n\n![Images/9789815136982-C3-E38.jpg](img/9789815136982-C3-E38.jpg)\n\
  \n![Images/9789815136982-C3-E39.jpg](img/9789815136982-C3-E39.jpg)\n\n从使用 `scikit-learn`\
  \ L2 正则化线性回归模型（即 `Ridge`）的结果可以看出，最终的偏置、权重和 MSE 值与我们自己实现的 L2 正则化线性回归模型给出的值相同（即 `b=0.8907`、`w1=0.71`\
  \ 和 `w2=0.539`，以及 `MSE=0.01222`）。此外，对那栋先前未见过的、面积 1200 平方英尺、3 间卧室的房子的预测价格，也与我们自己模型产生的结果相同（即\
  \ 145 万美元）。\n\n## 结论\n\n在本章中，我们在线性回归的背景下讨论了 L1 和 L2 正则化的概念。为了使内容更易懂，我们将抽象的数学理论降至最低。相反，我们专注于一个使用小数据集预测房屋售价的具体数值示例，并逐步进行了讲解。我们还提供了示例代码，并与现成库\
  \ `scikit-learn` 中的 `Lasso` 和 `Ridge` 模型进行了对比。读完本章后，读者应能全面理解 L1 和 L2 正则化如何在幕后工作以防止过拟合风险，数学原理如何与技术的实现和性能相关联，并能更好地在项目中应用它们。\n\
