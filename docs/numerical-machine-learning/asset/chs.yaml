  **Zhiyuan Wang**, **Sayed Ameenuddin Irfan**, **Christopher Teoh**, **Priyanka Hriday\
  \ Bhoyar**\n\n## 摘要\n\n本章深入探讨了逻辑回归，这是一种广泛用于分类任务的机器学习算法，重点在于通过最小化抽象数学概念来保持易读性。我们提供了一个具体的数值示例，利用小型数据集预测房地产市场中房屋的销售难易度，引导读者完成每一个步骤。此外，我们还提供了示例代码，并将其与\
  \ `scikit-learn` 库中可用的逻辑回归模型进行了对比。读完本章后，读者将全面了解逻辑回归的内部运作机制、其与算法实现和性能的关系，以及将其应用于实际应用所需的知识。\n\
  \n**关键词：** 逻辑回归、分类、数值示例、小型数据集、Scikit-Learn。\n\n## 4.1. 逻辑回归简介\n\n逻辑回归是一种监督机器学习算法，用于在给定输入特征的情况下对离散输出的概率进行建模\
  \ [[1]](#9789815136982-C4.html#r1)，[[2]](#9789815136982-C4.html#r2)。尽管名字里带有“回归”，但逻辑回归更多的是一种分类模型而非回归模型。它通常用于对二分（二元）输出进行建模，*即*\
  \ 任何具有两个可能值/类别/标签的事物，例如真/假、是/否、1/0、开/关、好/坏、恶性/良性、通过/不通过等。逻辑回归的基础在于其利用逻辑函数（也称为 Sigmoid\
  \ 函数）来模拟输入特征与分类结果之间关系的能力。该函数确保预测概率位于 0 和 1 之间，使其适用于分类任务。由于其简单性、可解释性以及在各种实际应用中的高效性，逻辑回归获得了极大的普及。其中一些应用包括垃圾邮件过滤、客户流失预测、医学诊断和信用风险评估。\n\
  \n与线性回归不同，逻辑回归不要求自变量（`X`）和因变量（`Y`）之间存在线性关系的假设。此外，真实输出与预测输出之间的误差不需要符合正态分布。而且，误差的分布（即误差的方差）不必沿因变量的值保持恒定；也就是说，不要求同方差性。然而，逻辑回归仍有几个基本假设\
  \ [[3]](#9789815136982-C4.html#r3)，[[4]](#9789815136982-C4.html#r4)。首先，当存在多个自变量（`X`）时，要求自变量之间几乎没有或没有相关性（*即*\
  \ 几乎没有或没有多重共线性）。其次，它假设自变量与几率的对数存在线性关系；几率只是表达概率（`P`）的另一种方式，定义为事件发生的概率与事件不发生的概率之比（*即*\
  \ `P/(1-P)`）。第三，默认情况下，逻辑回归用于解决二分类问题，要求因变量（`Y`）是二分的。另一方面，值得注意的是，通过一些修改和改进（如一对其余 [OvR]\
  \ 方法），逻辑回归可以扩展用于解决多分类问题。然而，多分类不在本章范围内，因为本章专注于使用逻辑回归算法进行二分类。\n\n## 4.2. 逻辑回归的数学原理\n\
  \n从数学上讲，第 2 章讨论的线性回归在引入 Sigmoid 函数将线性输出映射为概率并采用不同的损失函数后，可以升级为逻辑回归。\n\n与第 2 章中线性回归的公式\
  \ (2.2) 相比，此处公式 (4.1) 唯一的变化是使用变量 `Z`（而不是 `Y`）来表示线性输出，这只是逻辑回归过程中的一个中间结果。\n\n```\n\
  Z = b + Σ(wj * Xj)  (j=1 to n)\n```\n\n其中，\n\n- `Z` 是中间线性输出\n- `b` 是偏置\n- `n` 是输入特征的数量\n\
  - `wj` 是第 j 个特征的权重\n- `Xj` 是第 j 个特征的输入值\n\n将中间线性输出映射为概率的 Sigmoid 函数定义为公式 (4.2)，并绘制在图\
  \ (1) 中。\n\n![Sigmoid 函数图。](img/9789815136982-C4-F1.jpg)\n\n```\nY = 1 / (1 + e^(-Z))\n\
  ```\n\n其中，\n\n- `Z` 是来自线性公式 (4.1) 的中间线性输出\n- `Y` 是映射后的概率\n\n从图 (1) 可以看出，Sigmoid\
  \ 函数将线性输出 `Z` 映射为范围在 0 到 1 之间的概率 `Y`。默认阈值为 0.5，意味着如果 `Y ≥ 0.5`，将向上取整为 1 并预测为类别 1；而如果\
  \ `Y < 0.5`，将向下取整为 0 并预测为类别 0。\n\n与第 2 章线性回归中使用的符号类似，小写 `xi` 用于表示第 i 个样本（来自训练数据集总共\
  \ `m` 行样本）的特征值，则 `xij` 将是第 i 个样本处第 j 个特征（来自总共 `n` 个输入特征）的值，如图 (2) 所示。小写 `yi` 用于表示第\
  \ i 个样本的已知输出（*即* 真实输出），`ŷi` 用于表示逻辑回归模型对应的预测输出（*即* 经过 Sigmoid 函数映射后的概率）。通用项公式 (4.1)\
  \ 和 (4.2) 分别更新为公式 (4.3) 和 (4.4)。\n\n![使用示例训练数据集的符号说明。](img/9789815136982-C4-F2.jpg)\n\
  \n```\nzi = b + Σ(wj * xij)  (j=1 to n)\n```\n\n其中，\n\n- `i ∈ [1, m]`；`m` 是训练样本的数量\n\
  - `xij` 是第 i 个样本处第 j 个特征的值\n- `b` 是偏置\n- `n` 是输入特征的数量\n- `wj` 是第 j 个特征的权重\n- `zi`\
  \ 是第 i 个样本的中间线性输出\n\n```\nŷi = 1 / (1 + e^(-zi))\n```\n\n其中，\n\n- `i ∈ [1, m]`；`m`\
  \ 是训练样本的数量\n- `zi` 是第 i 个样本的中间线性输出\n- `ŷi` 是第 i 个样本的预测输出（*即* 映射后的概率）\n\n交叉熵损失函数（也称为逻辑损失或对数损失函数）被用于逻辑回归中，以量化真实输出与预测输出之间的误差，其定义见公式\
  \ (4.5)。\n\n```\nLi = -[yi * log(ŷi) + (1 - yi) * log(1 - ŷi)]\n```\n\n其中，\n\n-\
  \ `i ∈ [1, m]`；`m` 是训练样本的数量\n- `Li` 是第 i 个样本的损失\n- `yi` 是第 i 个样本的真实输出\n- `ŷi` 是第\
  \ i 个样本的预测输出（*即* 映射后的概率）\n- 此处使用的 `log` 为自然对数（*即* 以 `e` 为底）\n\n所有样本的平均损失定义见公式 (4.6)。\n\
  \n```\nL = (1/m) * Σ(Li)  (i=1 to m)\n```\n\n其中，\n\n- `Li` 是第 i 个样本的损失\n- `L` 是平均损失\n\
  - `m` 是训练样本的数量\n\n\n\n\n# 逻辑回归中的梯度下降优化\n\n梯度下降优化算法被用于通过迭代地朝着减小损失的方向微调偏置和权重的值，从而找到最优的偏置和权重。在此之前，我们需要求出平均损失（`L`）关于偏置和权重的偏导数，即\
  \ `∂L/∂b` 和 `∂L/∂wj`，它们分别表示偏置和各个权重对平均损失的贡献。这可以通过应用链式法则来完成，如公式 (4.7) 至 (4.12) 所示：\n\
  \n![](img/9789815136982-C4-Eq7.jpg)\n![](img/9789815136982-C4-Eq8.jpg)\n![](img/9789815136982-C4-Eq9.jpg)\n\
  ![](img/9789815136982-C4-Eq10.jpg)\n![](img/9789815136982-C4-Eq11.jpg)\n![](img/9789815136982-C4-Eq12.jpg)\n\
  \n此处，`j ∈ [1, n]`，且 `n` 为特征数量。\n\n随后，利用梯度下降来更新偏置 `b`（公式 4.13）和权重 `w`（公式 4.14）。\n\
  \n![](img/9789815136982-C4-Eq13.jpg)\n![](img/9789815136982-C4-Eq14.jpg)\n\n此处，`α`\
  \ 为学习率（通常为较小值，*例如* `0.1`、`0.01`、`0.001`）。\n\n值得注意的是，本章中的数学符号和 Python 代码与本书第 2 章和第\
  \ 3 章 [[5]](#9789815136982-C4.html#r5)、[[6]](#9789815136982-C4.html#r6) 中的有些相似。然而，第\
  \ 2 章和第 3 章的重点分别在于线性回归和正则化，而本章的重点在于逻辑回归。\n\n## 4.3. 逻辑回归的数值示例\n\n假设我们有一个如表 **1**\
  \ 所示的小型训练数据集，仅包含 3 个样本（*即* `m=3`），拥有两个特征，分别为房屋面积（平方英尺，缩写为 `size_sqft`）和房屋卧室总数（缩写为\
  \ `num_bedrooms`），以及一个关于房屋在房地产市场上是否容易出售（缩写为 `is_easy_sell`）的输出。该输出为二分类，仅有两个可能的值/类别/标签（*即*\
  \ `0` 和 `1`），其中 `0` 表示否（不容易出售），`1` 表示是（容易出售）。换句话说，对于本示例，`X` 为 `size_sqft` 和 `num_bedrooms`，`Y`\
