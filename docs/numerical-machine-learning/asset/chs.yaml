- "## 数值机器学习\n\n\n\n\n# 前言\n\n近年来，机器学习变得日益流行和普及，其应用范围涵盖自动驾驶汽车、人脸识别、个性化网站推荐和股市预测等。数据的日益丰富和计算能力的进步使得将机器学习算法应用于各类问题并取得令人印象深刻的成果成为可能。机器学习目前广泛应用于银行、医疗、营销和制造等多个领域，预计未来将继续在新技术开发中发挥重要作用。因此，机器学习已成为对数据科学、人工智能及相关领域感兴趣人士的必修课程。随着机器学习的不断演进和应用范围的扩大，研究人员和从业者正持续开发新技术和算法，以应对特定挑战或改进现有方法。在这一瞬息万变的领域中，从业者必须紧跟最新进展和趋势。这不仅包括掌握基本概念和算法，还包括理解如何以新颖的方式调整和应用它们来解决现实问题。通过拥抱机器学习的跨学科本质，并与来自不同领域的专家合作，我们可以加速创新解决方案的开发，这些方案有潜力变革行业、提升生活质量，并为所有人创造一个更可持续的未来。\n\
  \n\n\n\n\n# 机器学习导论\n\n**Zhiyuan Wang**, **Sayed Ameenuddin Irfan**, **Christopher\
  \ Teoh**, **Priyanka Hriday Bhoyar**\n\n## 摘要\n\n机器学习作为计算机科学的一个快速发展的分支领域，已对许多行业和我们的生活产生了重大影响。本章讨论了机器学习的简要历史、其作为既定功能的广泛采用，以及监督学习与无监督学习、回归与分类、欠拟合与过拟合等基本概念。我们还强调了通过数值示例理解机器学习的重要性，这能够弥合抽象数学理论与机器学习算法实际应用之间的鸿沟。通过建立扎实的机器学习基础，读者/学生可以利用其潜力，应对各个不同领域的挑战与机遇。\n\
  \n**关键词：** 数值示例，机器学习历史，监督学习，无监督学习，回归，分类，欠拟合，过拟合。\n\n## 1.1 机器学习简史\n\n机器学习是计算机科学的一个子领域，涉及创建能够从数据中学习并进行预测的算法。它拥有悠久而丰富的历史\
  \ [[1]](#9789815136982-C1.html#r1)，其渊源可追溯至 20 世纪 50 年代人工智能领域的建立。该领域专注于开发能够执行通常需要类人智能的任务的机器，例如识别模式、从经验中学习和做出决策。首批机器学习算法开发于\
  \ 20 世纪 60 年代，包括决策树和最近邻算法。20 世纪 80 年代，随着人工神经网络和支持向量机等算法的开发，该领域迎来了快速增长。这些算法在 20 世纪\
  \ 90 年代被应用于广泛的应用场景，包括自然语言处理、计算机视觉和语音识别。2000 年代，随着梯度提升等新算法的开发，以及机器学习在金融和医疗等行业中的使用日益增加，该领域持续演变。2010\
  \ 年代见证了机器学习的广泛采用，这得益于大数据的出现以及可用于训练大型复杂机器学习模型的强大图形处理单元（GPU）的开发。深度学习 [[2]](#9789815136982-C1.html#r2)\
  \ 这一子领域（通常涉及多层神经网络的使用）变得尤为流行，并在多个不同领域找到了应用。如今，机器学习是一个快速发展的领域，目前正应用于各个行业。它有潜力彻底改变许多行业，并已产生了重大的社会影响。\n\
  \n## 1.2 机器学习作为既定功能\n\n由于多种因素，预计机器学习将在未来二十年成为一项变革性技术。一个关键因素是数据可用性的不断增加，预计未来几年将继续大幅增长。由于机器学习算法特别适合分析和理解大量数据，这将为其在医疗、金融、交通、教育、制造等各个领域（不仅限于此）的应用创造新机遇。在这些及其他领域，机器学习已被采用来自动化一些目前由人类执行的任务，从而释放人力专注于更具创造性和高层次的工作\
  \ [[3]](#9789815136982-C1.html#r3)。\n\n\n\n\n\n# 机器学习的优势与核心概念\n\n除了自动化之外，机器学习算法还可以通过分析大量数据并基于这些数据进行预测或推荐来改进决策。这在金融领域尤为有用，机器学习可用于识别模式和趋势以辅助投资决策；在医疗保健领域，可用于预测患者结果并识别潜在健康风险；在半导体制造领域，可用于实时检测缺陷并分析其成因。通过基于数据分析提供有价值的见解和建议，机器学习有潜力提高广泛领域中决策的效率和有效性。\n\
  \n机器学习的另一个关键优势是其增强个性化的能力，即根据个人偏好和行为定制产品和服务。例如，机器学习可用于根据用户的过往行为推荐产品或内容，或针对特定受众定制广告。通过提供个性化体验，机器学习有潜力提高客户满意度和参与度。\n\
  \n总体而言，在未来二十年里，机器学习有望在广泛领域产生重大影响，影响我们生活的许多方面。其自动化任务、改进决策和增强个性化的能力，使其成为一项有潜力彻底改变行业并改变我们生活和工作方式的技术。\n\
  \n## 1.3 监督学习与无监督学习\n\n监督学习和无监督学习是机器学习中两种主要的算法类型 [4]。\n\n在**监督学习**中，模型使用带标签的数据进行训练，训练集中的每个实例都包含正确的输出。模型基于这些带标签的数据生成预测，从而能够对新的、未见过的示例做出准确预测。常见的监督学习任务包括：\n\
  *   **回归**：旨在预测连续值。\n*   **分类**：侧重于预测分类标签。\n\n相反，**无监督学习**涉及使用无标签数据训练模型，即不提供正确的输出。在这种情况下，模型必须独立识别数据中的模式和关系。无监督学习任务的例子包括：\n\
  *   **聚类**：目标是将相似的示例分组。\n*   **降维**：目标是在保留尽可能多相关信息的同时减少数据中的特征数量。\n\n## 1.4 回归与分类\n\
  \n在机器学习中，**回归**和**分类**是两种监督学习类型，模型在带标签的数据上训练，以对新的、未见过的示例进行预测。\n\n*   **回归**：模型用于预测连续值，如价格或概率。例如，回归模型可用于根据大小、卧室数量和位置等特征预测房价。\n\
  *   **分类**：涉及预测分类值，如类别标签。例如，分类模型可用于预测邮件是否为垃圾邮件，或识别图像中的物体类型。\n\n回归和分类均广泛应用于许多领域，应用范围广泛。除上述示例外，回归还可应用于金融领域预测股票价格、医疗保健领域预测患者结果、气象学预测天气模式，以及电动汽车行业预测充电需求\
  \ [5]。另一方面，分类用于广泛的应用，如自然语言处理（将文本分类为不同类别）和欺诈检测（将交易分类为合法或欺诈）。尽管存在差异，回归和分类有许多相似之处，都是机器学习领域的重要工具。通过理解两者，我们可以为特定问题选择最合适的方法，从而实现更准确的预测。\n\
  \n## 1.5 欠拟合与过拟合\n\n在训练机器学习模型时，常会遇到**欠拟合**和**过拟合**等问题 [6]。\n\n*   **欠拟合**：当模型过于简单，无法准确捕捉数据中的潜在模式时发生，导致在训练数据和新的未见示例上表现均不佳。\n\
  *   **过拟合**：当模型过于复杂，试图拟合训练数据中的噪声或随机波动而非泛化潜在模式时发生，导致在训练数据上表现良好，但在新的未见示例上表现不佳。\n\n\
  为避免这些问题，关键在于在模型复杂度和可用训练数据量之间找到恰当的平衡。这通常可以通过**交叉验证**和**正则化**等技术来实现。\n\n## 1.6 通过数值示例理解机器学习的重要性\n\
  \n根据我们使用各种教材教授机器学习的经验，我们注意到在讨论机器学习算法理论时，往往过分强调抽象数学。而在机器学习的应用中，通常直接导入现成的库，如 `scikit-learn`、`TensorFlow`、`Keras`\
  \ 和 `PyTorch`。抽象数学理论与实际应用之间的脱节造成了理解上的鸿沟。本书通过使用小数据集的数值示例和简单的 `Python` 代码，提供机器学习算法底层数学步骤的完整演示，从而弥合这一鸿沟。\n\
  \n通过数值示例理解机器学习有几个好处：\n1.  它让读者看到算法在实践中如何工作，有助于更好地理解其背后的概念和思想。\n2.  通过演练数值示例，读者可以培养对算法在不同情况下行为表现的直觉，以及输入参数如何影响输出。\n\
  3.  这对于培养解决问题的技能特别有用，因为机器学习通常涉及在给定数据集的情况下寻找问题的最佳解决方案。通过演练数值示例，读者可以学会以系统的方式处理不同类型的问题。\n\
  4.  看到机器学习算法在实际数据上的表现，有助于读者识别常见陷阱并在工作中避免它们。\n\n总体而言，演练数值示例可以成为学习机器学习并开发应用所需技能和知识的有效途径。通过遵循数值示例的逐步过程，读者/学生可以获得对算法的切实理解，看到数学如何与实现和性能相关联，从而更好地装备自己将其应用于实际问题。\n\
  \n## 结论\n\n\n\n\n总之，机器学习是一个快速发展的领域，拥有丰富的历史，且在各行各业中的应用范围不断扩大。作为一种变革性技术，它有潜力彻底改变我们生活的许多方面。本书通过通俗易懂的数值示例和简单的\
  \ Python 代码，架起了抽象数学理论与机器学习实际应用之间的桥梁。这种方法有助于读者对机器学习算法建立更切实的理解，培养对其行为的直觉，并提升解决问题的能力。通过研习数值示例，读者/学生可以学会系统地处理各类问题，并更好地装备自己，将这些算法应用于现实世界的挑战中。\n\
  \n随着机器学习在未来几年持续进步并变得更加普及，从业者、研究人员和学生建立扎实的基础概念和技术功底至关重要。通过获取这些知识并在此基础上深造，他们将处于更有利的位置，为机器学习的持续增长和发展做出贡献，并利用其变革潜力应对各领域广泛的挑战与机遇。\n\
