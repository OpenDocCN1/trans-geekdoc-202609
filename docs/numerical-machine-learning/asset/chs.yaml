  \ Science; 2023. |\n\n# 决策树\n\n## 摘要\n\n\n\n\n在本章中，我们将探讨决策树的概念，通过尽量减少抽象数学理论来优先保证易读性。我们将利用一个小型数据集，通过一个具体的数值示例，根据天气状况预测打网球的适宜性，逐步引导读者完成整个过程。此外，我们还提供了示例代码，并将其与\
  \ `scikit-learn` 库中的决策树分类模型进行了对比。完成本章后，读者将全面了解决策树机器学习的内部运作机制、底层原理之间的关系，以及算法的实现与性能，从而做好将知识应用于实际场景的准备。\n\
  \n**关键词：** 决策树、分类、数值示例、小型数据集、Scikit-Learn。\n\n## 5.1 决策树简介\n\n决策树是一组选择及其结果的图示表示\
  \ [[1]](#9789815136982-C5.html#r1)。由于其固有的优势，决策树算法已成为机器学习中分类和回归任务的热门选择。这些优势包括：易于解释性，因为决策过程在树结构中显式呈现；以及高效的训练过程。决策树能够处理缺失值、自动选择相关特征，并轻松处理数值型和分类型数据。此外，它们对数据中的异常值和噪声具有鲁棒性。决策树的常见应用包括客户细分、欺诈检测、医学诊断和风险管理。由于其易于理解的特性以及可视化复杂决策过程的能力，决策树在各个行业和研究领域得到了广泛应用。决策树是一个图表，展示了在特定约束下做出选择的若干路径。每个分支象征着决策空间，其叶节点代表结果。一个称为根节点的节点是决策树的起点，随后延伸出更多分支，包括决策节点和叶节点。\n\
  \n例如，如图 5.1 所示，考虑一个需要决定是否去户外运动的情境。该问题的决策树可能如下所示：\n\n![](img/9789815136982-C5-F1.jpg)\n\
  \n**图 (5.1)** 简单决策树示例。\n\n根节点：“我应该去户外运动吗？”\n\n决策节点：“天气是否适合户外运动？”\n\n如果是，叶节点：“去玩”\n\
  \n如果否，叶节点：“不去玩”\n\n在该示例中，决策节点代表室外天气状况。如果满足条件（即天气好），树将引向“去玩”的结果。如果不满足条件（即天气不好），树将引向“不去玩”的结果。\n\
  \n现在的问题是如何决定选择哪个叶节点作为根节点和决策节点。为了做出更好的决策，我们使用 Hunt 算法，它有助于清晰地理解分裂以及为根节点选择重要参数。\n\n\
  ## 5.2 决策树算法\n\n在决策树学习的背景下，一种称为 Hunt 算法的启发式方法被用于确定树中每个节点的最佳分裂 [[2]](#9789815136982-C5.html#r2)。这是一个迭代分析每个特征及其可能值作为候选分裂点的过程。然后选择能产生最大信息增益（稍后讨论）的那个分裂点。\n\
  \n以下是 Hunt 算法的一般过程：\n\n* 计算当前节点的熵。熵是节点处数据不纯度或不确定性的度量。它基于数据中不同类别的频率计算。\n* 将每个特征及该特征的每个可能值视为候选分裂点。通过比较当前节点的熵与分裂产生的子节点的熵，计算每个候选分裂点的信息增益。\n\
  * 选择导致信息增益最大的分裂点。\n* 对每个子节点重复上述过程，直到达到期望的树深度，或所有节点均为纯净节点（即仅包含属于单一类别的数据）。\n\n由于构建决策树的简洁性和高效性，Hunt\
  \ 算法是决策树学习的热门选择。Hunt 算法还为其他决策树算法的发展奠定了基础 [[3]](#9789815136982-C5.html#r3)，例如 `ID3`（迭代二分法\
  \ 3）、`C4.5`（ID3 的扩展，可处理连续属性、缺失值和剪枝）以及 `CART`（分类与回归树）。\n\n如前所述，决策树中节点的不纯度可以用熵来衡量，如公式\
  \ (5.1) 所示。熵是基于数据中不同类别的频率计算的。如果某节点的数据完全纯净，即所有数据均属于单一类别，则熵为零。另一方面，如果数据在所有类别中均匀分布，则熵达到最大值。\n\
  \n| ![](img/9789815136982-C5-E1.jpg) | | (1) |\n\n| --- | --- |\n\n此处，`Pi` 为节点中类别\
  \ *i* 的比例。\n\nHunt 算法递归地将数据分割成越来越小的子集，直到每个子集仅包含属于单一类别的数据。在每次分裂时，算法将每个特征及其每个可能值视为候选分裂点，并选择产生最大信息增益的分裂点。树构建完成后，可通过遵循树中的分裂路径到达叶节点（代表类别预测）来进行预测。\n\
  \n在决策树学习中，信息增益 (IG) 是一种度量指标，用于确定给定特征对训练样本的分裂效果。它用于决定在构建树的每一步中选择哪个特征进行分裂。计算信息增益常用的指标是熵，它衡量一组样本的“混乱”或“随机”程度。公式\
  \ (5.2) 给出了信息增益的数学表达式。\n\n**信息增益 = 父节点熵 - 子节点熵的加权和** (5.2)\n\n此处，使用公式 (5.1) 计算的父节点\
  \ `Entropy_parent` 是分裂前样本集的熵，使用公式 (5.1) 计算的子节点 `Entropy_children` 是分裂产生的两组样本的熵。分配给每个子节点的权重仅为\
  \ ![](img/9789815136982-C5-IE1.jpg)。\n\n决策树具有多项优势 [[4]](#9789815136982-C5.html#r4)，包括可解释性（决策过程在树结构中显式呈现）、训练高效、能够处理缺失值并自动选择相关特征，这就是它成为实践中流行的机器学习算法的原因。\n\
  \n## 5.3 决策树数值示例\n\n让我们考虑一个包含 5 个训练样本的小型分类数据集，输入特征为天气展望和温度，输出标签指示在给定条件下是否适合打网球。数据集呈现于表\
  \ **5.1** 中。\n\n**表 5.1** 决策树用小型数据集。\n\n| | **展望** | **温度** | **打网球** |\n| --- |\
  \ --- | --- | --- |\n| 第 1 个样本 | 雨天 | 炎热 | 否 |\n| 第 2 个样本 | 雨天 | 凉爽 | 是 |\n| 第 3\
  \ 个样本 | 阴天 | 凉爽 | 是 |\n| 第 4 个样本 | 晴天 | 炎热 | 是 |\n| 第 5 个样本 | 晴天 | 凉爽 | 是 |\n\n\n\
  \n\n\n## 决策树模型构建与编码示例\n\n输入特征和输出标签均使用数值 0、1、2 等进行编码。例如，在 `Outlook` 列中，0 代表阴天，1 代表雨天，2\
  \ 代表晴天。同理，在 `Temperature` 列中，0 代表凉爽，1 代表炎热。在 `Play_Tennis` 列中，0 代表否，1 代表是。这种编码是必要的，因为决策树要求输入为数值型而非分类型。编码后的更新数据集见表\
  \ 5.2。\n\n**表 5.2 决策树编码后的小型数据集**\n\n| 样本 | Outlook | Temperature | Play_Tennis |\n\
  | --- | --- | --- | --- |\n| 第 1 个样本 | 1 | 1 | 0 |\n| 第 2 个样本 | 1 | 0 | 1 |\n| 第\
  \ 3 个样本 | 0 | 0 | 1 |\n| 第 4 个样本 | 2 | 1 | 1 |\n| 第 5 个样本 | 2 | 0 | 1 |\n\n### 构建决策树模型\n\
  \n首先，我们需要使用公式 (5.1) 计算包含所有 5 个训练样本的根节点的熵。从表 5.2 可知，5 个训练样本中有 4 个属于类别 1（即 yes），因此\
  \ $P_1 = 4/5$；有 1 个属于类别 0（即 no），因此 $P_0 = 1/5$。\n\n![根节点熵计算](img/9789815136982-C5-EE1.jpg)\n\
  \n其次，将每个特征及其每个可能的值视为候选分裂点，目标是找到产生最大信息增益的最优分裂。共有 2 个输入特征：`Outlook` 和 `Temperature`。\n\
  \n#### 特征 Outlook 的分裂分析\n\n先考虑 `Outlook`，它包含 3 个唯一值：0、1、2（即阴天、雨天、晴天）。\n\n**分裂 1：`Outlook\
  \ ≤ 0.5`**\n可在 0 和 1 之间进行公平分裂。满足条件的样本（阴天）分入左子节点，其余（雨天或晴天）分入右子节点。\n\n![Outlook ≤\
  \ 0.5 分裂示意](img/9789815136982-C5-C1.jpg)\n\n仅第 3 个样本满足 `Outlook ≤ 0.5`，构成左子节点，其熵计算如下：\n\
