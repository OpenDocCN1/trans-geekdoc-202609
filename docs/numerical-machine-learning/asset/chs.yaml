  \ Teoh**, **Priyanka Hriday Bhoyar**\n\n## 摘要\n\n在本章中，我们研究了线性可分和线性不可分情况下的支持向量机（SVM），通过最小化抽象数学理论来强调易懂性。我们提供了带有小数据集的具体数值示例，并提供逐步演示，说明\
  \ SVM 的内部工作原理。此外，我们提供了示例代码，并与 scikit-learn 库中可用的 SVM 模型进行了比较。完成本章后，读者将获得对 SVM 机制的全面理解，及其与算法实现和性能的联系，并做好充分准备将其应用于实际应用中。\n\
  \n**关键词：** 线性可分、线性不可分、数值示例、多项式核、径向基函数核、支持向量机、小数据集、Scikit-Learn。\n\n## 7.1 支持向量机简介\n\
  \n支持向量机（缩写为 `SVM`）是一种强大且广泛适用的机器学习算法，已成功应用于各个领域，如图像和语音识别、自然语言处理、生物信息学和金融等。`SVM` 算法的目标是在\
  \ N 维空间（其中 N 是特征数量）中确定一个超平面，以清晰可辨的方式对数据点进行分类。其定义方式使得 N 维空间中不同类别数据点之间的边距距离最大化 [[1]](#9789815136982-C7.html#r1)[[2]](#9789815136982-C7.html#r2)。如果边距距离最大化，那么后续的新数据点（先前未见过的）将以更大的信心被分类。对于线性不可分数据集，`SVM`\
  \ 主要采用核函数将原始数据映射到高维希尔伯特空间以实现线性可分，从而解决线性不可分问题 [[3]](#9789815136982-C7.html#r3)。此外，值得一提的是，支持向量只是更接近超平面的训练数据点。这些数据点对于构建\
  \ `SVM` 模型更为相关和关键，因为它们有助于确定分离超平面的方程 [[4]](#9789815136982-C7.html#r4)。图（**7.1**）说明了\n\
  \n使用来自 2 个类别（即正类（+）和负类（-））的 10 个样本的数据集，说明了超平面、支持向量和边距。\n\n![](img/9789815136982-C7-F1.jpg)\n\
  **图 (7.1)**\n\nSVM 超平面、支持向量和边距的示意图。\n\n## 7.2 支持向量机的数学原理：线性可分情况\n\n图（**7.1**）中使用的数据集已简化以降低复杂性。因此，现在只有\
  \ 2 个属于正类（+）的数据点，和 2 个属于负类（-）的数据点，如图（**7.2**）所示。目标是找到与最大边距相关的超平面。接下来，我们绘制一个向量 `w→`（任意长度），它从原点开始并垂直于假设的超平面。此外，假设我们还有先前未见过的数据\
  \ `u→`，我们想要预测 `u→` 的类别，无论它是 + 类还是 - 类。\n\n![](img/9789815136982-C7-F2.jpg)\n**图\
  \ (7.2)**\n\n2 个 + 类数据点、2 个 - 类数据点、垂直于假设边距的 `w→` 和先前未见过的 `u→` 的示意图。\n\n将 `u→` 投影到垂直于边距的向量（即\
  \ `w→`）上，如果该投影大于或等于（≥）某个常数 `c`，该常数穿过中线，那么它必须是正（+）数据点。这可以用数学方式表示为：\n\n`w→⋅u→≥c`，则\
  \ `u→` 标记为 +\n\n执行简单变换：\n\n`w→⋅u→-c≥0`\n\n`w→⋅u→+bt≥0`，其中 `bt=-c`\n\n边距的中线：\n\n\
  `w→⋅u→+bt=0`\n\n边距的边缘线（靠近 +）：\n\n`w→⋅u→+bt=ä`\n\n此处，`ä` 为正常数\n\n两边同时除以 `ä`：\n\n\
  `w→/ä⋅u→+bt/ä=1`\n\n令 `W→=w→/ä` 和 `b=bt/ä`，\n\n边距的边缘线（靠近 +）更新为：\n\n`W→⋅u→+b=1`\n\
  \n边距的中线更新为：\n\n`W→⋅u→+b=0`\n\n对称地，如图（**7.3**）所示，边距的边缘线（靠近 -）更新为：\n\n![](img/9789815136982-C7-F3.jpg)\n\
  **图 (7.3)**\n\n超平面、边缘线（靠近 +）和边缘线（靠近 -）的通用方程示意图。\n\n`W→⋅u→+b=-1`\n\n\n\n因此，现在可以将其表示为：\n\
  \n$\\vec{W} \\cdot \\vec{u} + b \\ge 1$ 适用于 $+$ 类数据点\n\n$\\vec{W} \\cdot \\vec{u}\
  \ + b \\le -1$ 适用于 $-$ 类数据点\n\n对于目标输出 $y_i$，用 $+1$ 表示正类（$+$）数据点，用 $-1$ 表示负类（$-$）数据点：\n\
  \n$y_i = +1$ 适用于 $+$ 类数据点\n\n$y_i = -1$ 适用于 $-$ 类数据点\n\n因此，利用这些条件，我们可以得到：\n\n$y_i(\\\
  vec{W} \\cdot \\vec{u} + b) \\ge 1$ 适用于所有数据点。\n\n$y_i(\\vec{W} \\cdot \\vec{u} +\
  \ b) = 1$ 适用于边界线上的数据点*（即，* 支持向量）。\n\n接下来，为了表示间隔，取 2 个支持向量：来自 $+$ 类的 $\\vec{x_+}$\
  \ 和来自 $-$ 类的 $\\vec{x_-}$，这两个向量的差为 $\\vec{x_+} - \\vec{x_-}$，如图（**7.4**）所示。回顾一下，我们有一个法向量\
  \ $\\vec{W}$，它垂直于间隔。对应的单位法向量为 $\\frac{\\vec{W}}{|\\vec{W}|}$，其中分母 $|\\vec{W}|$ 是\
  \ $\\vec{W}$ 的模。因此，间隔可以表示为：\n\n![](img/9789815136982-C7-F4.jpg)\n**图 (7.4)**\n\n\
  正类支持向量 $\\vec{x_+}$、负类支持向量 $\\vec{x_-}$ 及其差值 $\\vec{x_+} - \\vec{x_-}$ 的示意图。\n\n\
  $\\text{间隔} = \\frac{(\\vec{x_+} - \\vec{x_-}) \\cdot \\vec{W}}{|\\vec{W}|}$\n\n\
  不要忘记之前为所有支持向量推导出的约束条件：\n\n$y_i(\\vec{W} \\cdot \\vec{u} + b) = 1$\n\n因此，对于 $\\vec{x_+}$，将会是：\n\
  \n$1(\\vec{W} \\cdot \\vec{x_+} + b) = 1$\n\n$\\vec{W} \\cdot \\vec{x_+} = 1 - b$\n\
  \n对于 $\\vec{x_-}$，将会是：\n\n$-1(\\vec{W} \\cdot \\vec{x_-} + b) = 1$\n\n$-\\vec{W}\
  \ \\cdot \\vec{x_-} = 1 + b$\n\n间隔的表达式更新为：\n\n$\\text{间隔} = \\frac{\\vec{x_+} -\
  \ \\vec{x_-} \\cdot \\vec{W}}{|\\vec{W}|} = \\frac{\\vec{W} \\cdot \\vec{x_+} -\
  \ \\vec{W} \\cdot \\vec{x_-}}{|\\vec{W}|} = \\frac{1 - b + 1 + b}{|\\vec{W}|} =\
  \ \\frac{2}{|\\vec{W}|}$\n\n请记住，目标是找到一个与最大间隔相关联的超平面。\n\n$\\text{间隔} = \\frac{2}{|\\\
  vec{W}|}$，用于最大化\n\n$\\to$ 等价于最小化分母 $|\\vec{W}|$\n\n$\\to$ 等价于最小化 $\\frac{1}{2}|\\\
  vec{W}|²$\n\n进行这种转换的原因纯粹是为了在后续推导中获得数学上的便利。\n\n因此，单目标优化（SOO）问题已构建完成，如下所示：\n\n最小化\
  \ $f = \\frac{1}{2}|\\vec{W}|²$\n\n受以下约束条件限制：\n\n$g_i = y_i(\\vec{W} \\cdot \\vec{x_i}\
  \ + b) - 1 = 0$ 适用于所有支持向量 $\\vec{x_i}$\n\n这个带有等式约束的 SOO 问题可以通过拉格朗日乘数法轻松求解，其定义为：\n\
  \n$L = f - \\sum_i \\alpha_i g_i$\n\n$L$ 是拉格朗日函数\n\n$f$ 是优化函数\n\n$\\alpha$ 是拉格朗日乘子\n\
  \n$g$ 是等式约束\n\n所以，对于我们的 SOO 问题，使用拉格朗日乘数法：\n\n$L = \\frac{1}{2}|\\vec{W}|² - \\sum_i\
  \ \\alpha_i [y_i(\\vec{W} \\cdot \\vec{x_i} + b) - 1]$\n\n$\\frac{\\partial L}{\\\
  partial \\vec{W}} = \\vec{W} - \\sum_i \\alpha_i y_i \\vec{x_i} = 0$\n\n$\\therefore\
  \ \\vec{W} = \\sum_i \\alpha_i y_i \\vec{x_i}$\n\n$\\frac{\\partial L}{\\partial\
  \ b} = -\\sum_i \\alpha_i y_i = 0$\n\n$\\therefore \\sum_i \\alpha_i y_i = 0$\n\n\
  然后，将求得的最新 $\\vec{W} = \\sum_i \\alpha_i y_i \\vec{x_i}$ 表达式代回间隔的中线（$\\vec{W} \\\
  cdot \\vec{u} + b = 0$）：\n\n$\\sum_i \\alpha_i y_i \\vec{x_i} \\cdot \\vec{u} +\
  \ b = 0$\n\n同样，间隔的两条边界线（$\\vec{W} \\cdot \\vec{u} + b = 1$；$\\vec{W} \\cdot \\vec{u}\
  \ + b = -1$）也可以更新为：\n\n$\\sum_i \\alpha_i y_i \\vec{x_i} \\cdot \\vec{u} + b = 1$\
  \ 若 $\\vec{u}$ 为 $+$ 类支持向量\n\n$\\sum_i \\alpha_i y_i \\vec{x_i} \\cdot \\vec{u}\
  \ + b = -1$ 若 $\\vec{u}$ 为 $-$ 类支持向量\n\nSVM 的所有核心数学方程现已推导完毕。\n\n## 7.3. 支持向量机的数值示例与代码对比：线性可分情况\n\
  \n如表 **7.1** 和图（**7.5**）所示，假设我们有一个仅包含 4 个样本（数据点）的小型训练数据集。前 2 个样本属于负类（$-$），后 2 个样本属于正类（$+$）。我们的任务是构建一个能清晰区分这两个类别的\
  \ SVM 分类器。\n\n![](img/9789815136982-C7-F5.jpg)\n**图 (7.5)**\n\n小型训练数据集中 4 个样本及支持向量的示意图。\n\
  \n**表 7.1** 用于支持向量机的小型线性可分数据集。\n\n| X | y |\n| --- | --- |\n| (1, 2) | -1 |\n| (2,\
  \ 1) | -1 |\n| (4, 4) | 1 |\n| (5, 5) | 1 |\n\n从上一节我们推导出了以下 3 个方程：\n\n$\\sum_i \\\
  alpha_i y_i \\vec{x_i} \\cdot \\vec{u} + b = 1$ 若 $\\vec{u}$ 为 $+$ 类支持向量\n\n$\\\
  sum_i \\alpha_i y_i \\vec{x_i} \\cdot \\vec{u} + b = -1$ 若 $\\vec{u}$ 为 $-$ 类支持向量\n\
  \n$\\sum_i \\alpha_i y_i = 0$\n\n现在，令 $\\hat{a}_i = \\alpha_i y_i$，然后展开方程：\n\n$\\\
  hat{a}_1 \\vec{x_1} \\cdot \\vec{x_1} + \\hat{a}_2 \\vec{x_2} \\cdot \\vec{x_1}\
  \ + \\hat{a}_3 \\vec{x_3} \\cdot \\vec{x_1} + b = -1$ 当 $\\vec{u} = \\vec{x_1}$\
  \ 时\n\n$\\hat{a}_1 \\vec{x_1} \\cdot \\vec{x_2} + \\hat{a}_2 \\vec{x_2} \\cdot \\\
  vec{x_2} + \\hat{a}_3 \\vec{x_3} \\cdot \\vec{x_2} + b = -1$ 当 $\\vec{u} = \\vec{x_2}$\
  \ 时\n\n$\\hat{a}_1 \\vec{x_1} \\cdot \\vec{x_3} + \\hat{a}_2 \\vec{x_2} \\cdot \\\
  vec{x_3} + \\hat{a}_3 \\vec{x_3} \\cdot \\vec{x_3} + b = 1$ 当 $\\vec{u} = \\vec{x_3}$\
  \ 时\n\n$\\hat{a}_1 + \\hat{a}_2 + \\hat{a}_3 = 0$\n\n可以看出，解仅依赖于支持向量对的点积。然后，计算所有支持向量对的点积：\n\
  \n$\\vec{x_1} \\cdot \\vec{x_1} = (1, 2) \\cdot (1, 2) = 1 \\cdot 1 + 2 \\cdot 2\
  \ = 5$\n\n$\\vec{x_2} \\cdot \\vec{x_1} = (2, 1) \\cdot (1, 2) = 2 \\cdot 1 + 1\
  \ \\cdot 2 = 4$\n\n$\\vec{x_3} \\cdot \\vec{x_1} = (4, 4) \\cdot (1, 2) = 4 \\cdot\
  \ 1 + 4 \\cdot 2 = 12$\n\n$\\vec{x_1} \\cdot \\vec{x_2} = (1, 2) \\cdot (2, 1) =\
  \ 1 \\cdot 2 + 2 \\cdot 1 = 4$\n\n$\\vec{x_2} \\cdot \\vec{x_2} = (2, 1) \\cdot\
  \ (2, 1) = 2 \\cdot 2 + 1 \\cdot 1 = 5$\n\n$\\vec{x_3} \\cdot \\vec{x_2} = (4, 4)\
  \ \\cdot (2, 1) = 4 \\cdot 2 + 4 \\cdot 1 = 12$\n\n$\\vec{x_1} \\cdot \\vec{x_3}\
  \ = (1, 2) \\cdot (4, 4) = 1 \\cdot 4 + 2 \\cdot 4 = 12$\n\n$\\vec{x_2} \\cdot \\\
  vec{x_3} = (2, 1) \\cdot (4, 4) = 2 \\cdot 4 + 1 \\cdot 4 = 12$\n\n$\\vec{x_3} \\\
  cdot \\vec{x_3} = (4, 4) \\cdot (4, 4) = 4 \\cdot 4 + 4 \\cdot 4 = 32$\n\n然后，将数值代入方程：\n\
  \n$5\\hat{a}_1 + 4\\hat{a}_2 + 12\\hat{a}_3 + b = -1$\n\n$4\\hat{a}_1 + 5\\hat{a}_2\
  \ + 12\\hat{a}_3 + b = -1$\n\n$12\\hat{a}_1 + 12\\hat{a}_2 + 32\\hat{a}_3 + b =\
  \ 1$\n\n$\\hat{a}_1 + \\hat{a}_2 + \\hat{a}_3 = 0$\n\n求解该线性方程组后，得到 $\\hat{a}_1,\
  \ \\hat{a}_2, \\hat{a}_3$ 和 $b$ 为：\n\n$\\hat{a}_1 = -0.08, \\hat{a}_2 = -0.08, \\\
  hat{a}_3 = 0.16, b = -2.2$\n\n利用求得的 $\\hat{a}_1, \\hat{a}_2, \\hat{a}_3$ 值来求 $\\\
  vec{W}$：\n\n$\\vec{W} = \\sum_i \\alpha_i y_i \\vec{x_i} = \\sum_i \\hat{a}_i \\\
  vec{x_i} = -0.08(1, 2) - 0.08(2, 1) + 0.16(4, 4) = (0.4, 0.4)$\n\n更新间隔的中线*（即，* 超平面，$\\\
  vec{W} \\cdot \\vec{u} + b = 0$）：\n\n$(0.4, 0.4) \\cdot \\vec{u} - 2.2 = 0$\n\n\
  因此，超平面本质上是满足上述方程的那些 $\\vec{u}$ 向量。让我们将向量 $\\vec{u}$ 表示为二维空间中的坐标 $(u_1, u_2)$，其中\
  \ $u_1$ 是水平轴上的标量/大小，$u_2$ 是垂直轴上的标量/大小，如图（**7.6**）所示。\n\n![](img/9789815136982-C7-F6.jpg)\n\
  **图 (7.6)**\n\n最优超平面、边界线（靠近 $+$）和边界线（靠近 $-$）的计算方程示意图。\n\n$(0.4, 0.4) \\cdot (u_1,\
  \ u_2) - 2.2 = 0$\n\n$0.4 \\cdot u_1 + 0.4 \\cdot u_2 = 2.2$\n\n$u_1 + u_2 = 5.5$\n\
  \n同样地，对于间隔的边界线（靠近 $+$）（$\\vec{W} \\cdot \\vec{u} + b = 1$）：\n\n$(0.4, 0.4) \\cdot\
