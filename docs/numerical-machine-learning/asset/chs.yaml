  \ 到 S2 的距离 `=65-602+70-752=7.07`\n\nC3 到 S3 的距离 `=65-652+70-702=0`\n\nC3 到 S4 的距离\
  \ `=65-902+70-902=32.02`\n\nC3 到 S5 的距离 `=65-1002+70-952=43.01`\n\nC3 到 S6 的距离 `=65-452+70-352=40.31`\n\
  \nK-Means 算法第一次迭代中计算出的所有欧氏距离列于表 **8.2** 中。\n\n**表 8.2** K-Means 聚类第一次迭代中每个样本到 3\
  \ 个质心的计算欧氏距离。\n\n| **\\-** | **C1** | **C2** | **C3** |\n| --- | --- | --- | ---\
