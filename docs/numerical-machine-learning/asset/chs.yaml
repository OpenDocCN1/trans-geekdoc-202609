  K(x4→, u→) = e^(-0.2 ||(4, 4) - (u1, u2)||²) = e^(-0.2 [(4-u1)² + (4-u2)²])\n```\n\
  \n然后，\n\n```\n-e^(-0.2 [(1-u1)² + (2-u2)²]) - e^(-0.2 [(5-u1)² + (5-u2)²]) + e^(-0.2\
  \ [(2-u1)² + (1-u2)²]) + e^(-0.2 [(4-u1)² + (4-u2)²]) - 0.033 = 0\n```\n\n该方程的绘图如\
