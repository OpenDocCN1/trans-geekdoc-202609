  \ `size_sqft`）和房屋卧室总数（缩写为 `num_bedrooms`）。换句话说，对于本示例，`X` 为 `size_sqft` 和 `num_bedrooms`，`Y`\
  \ 为 `sale_price_million`。我们的任务是构建一个在 L1 正则化下映射 `X` 和 `Y` 的最佳拟合线性回归模型。\n\n表 3.1 **正则化下线性回归的小型数据集。**\
