  \ \\vec{u} + b = -1$）：\n\n$(0.4, 0.4) \\cdot (u_1, u_2) - 2.2 = -1$\n\n$u_1 + u_2\
  \ = 3$\n\n现在让我们将上述获得的结果与 `scikit-learn` 库提供的现成 SVM 分类器的结果进行比较。\n\n完整的代码文件可以从我们在\
