  \n**图 3.2** 训练 L1 正则化线性回归模型时的均方误差 (MSE) *对* 学习迭代次数。\n\n从**表 3.3**和**图 3.2**可以看出，MSE\
  \ 最终稳定在 0.0636，这表明我们已在 L1 正则化下训练出一个良好的线性回归模型。最终得到的偏置和权重为 `b=1.1466`、`w1=0.7949`\
  \ 和 `w2=0.00002860`。L1 正则化的一个重要亮点是，它会收缩模型认为不太重要的特征的权重，通常将其压缩为零，从而有效地充当特征选择的方法。然而，值得注意的是，这些“不太重要”的特征是由模型和数据决定的，可能与领域特定知识或更广泛的背景一致，也可能不一致。最终得到的线性回归模型可表示为：\n\
  \n`Y = b + ∑(j=1 to 2) wj ⋅ normalized Xj`\n\n此处，`b=1.1466`、`w1=0.7949` 和 `w2=0.00002860`。\n\
  \n由于在训练过程中执行了最大-最小归一化，因此最终模型中也需要体现这一点。这就是此处显示 `normalized Xj` 的原因。\n\n现在，我们可以使用这个训练好的线性回归模型对先前未见过的数据（即新数据）进行预测。例如，有一栋面积为\
  \ 1200 平方英尺、拥有 3 间卧室的新房子。为了预测房价，首先需要使用训练数据集中各自特征的最大值和最小值进行归一化。回顾一下，`size_sqft` 的最大值和最小值分别为\
  \ 1600 和 740；`num_bedrooms` 的最大值和最小值分别为 5 和 2。因此，`size_sqft` 的 `normalized X1` 和\
  \ `num_bedrooms` 的 `normalized X2` 将为：\n\n`normalized X1 = (1200 - 740) / (1600\
  \ - 740) = 0.5349`\n\n`normalized X2 = (3 - 2) / (5 - 2) = 0.3333`\n\n接下来，将归一化后的特征值代入线性回归模型方程：\n\
  \n`Y = b + ∑(j=1 to 2) wj ⋅ normalized Xj = 1.1466 + 0.7949 × 0.5349 + 0.00002860\
  \ × 0.3333 = 1.572`\n\n因此，对于面积 1200 平方英尺、3 间卧室的房子，预测售价为 157.2 万美元。\n\n## 3.4. 线性回归\
  \ L1 正则化的示例代码与对比\n\n继第 3.2 节和第 3.3 节讨论的数学原理和数值示例之后，我们已使用 Python 从头实现了前述小数据集的 L1\
  \ 正则化线性回归机器学习模型。该代码与第 2 章讨论的原始线性回归代码相似。区别在于 `update_bias_weights()` 函数，这是由于损失函数中增加了\
  \ L1 正则化项（即 `λW1`）。建议读者准备好 Jupyter Notebook（或其他 Python IDE），并在阅读时尝试运行代码。完整代码文件可从我们的\
