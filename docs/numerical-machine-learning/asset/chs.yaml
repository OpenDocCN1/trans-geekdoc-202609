  \ 1 |\n| 0 | 0 | 0 |\n\n现在，让我们开始机器学习过程以构建逻辑回归模型。\n\n初始化偏置：\n```\nb = 0\n```\n\n\
  初始化特征 `size_sqft` 的权重：\n```\nw1 = 0\n```\n\n初始化特征 `num_bedrooms` 的权重：\n```\nw2 =\
  \ 0\n```\n\n设置学习率：\n```\nα = 0.1\n```\n\n请注意，为便于书写和表达，除非另有说明，以下所有 `xij` 默认均指归一化后的\
  \ `xij`。\n\n### 4.3.1. 开始学习的第一次迭代\n\n取第一个训练样本的输入值并计算预测值 `ŷ1`：\n\n![](img/9789815136982-C4-B1.jpg)\n\
