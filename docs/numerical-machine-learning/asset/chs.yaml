  \ P2=0.4579，x3 的 P3=0.7224）。然后，相应地获得了相同的预测类别（即 x1 预测为类别 1，x2 预测为类别 0，x3 预测为类别 1）。最后，获得了相同的先前未见过的\
  \ 3 卧室房屋的预测概率和类别（即它属于类别 1 的概率是 0.7224，预测类别是 1）。\n\n## 结论\n\n在本章中，我们讨论了用于回归和分类的梯度提升概念。为了使材料更易懂，我们将抽象数学理论保持在最低限度。相反，我们专注于两个具体的数值示例，使用小数据集预测房屋销售价格和房屋在房地产市场是否容易出售，逐步演示它们。我们还提供了示例代码，并与现成库\
  \ scikit-learn 的梯度提升回归和分类模型进行了比较。在本章结束时，读者应该对梯度提升机器学习在幕后如何工作、数学如何与算法的实现和性能相关联有一个全面的理解，并能更好地将其应用于他们的项目中。\n\
