    \ entropy loss function is given by\n\n```\n$L(w) = \\sum_{k=1}^{N}\\sum_{t=1}^{K}\
    \ y_{kt} \\cdot \\log o_{kt}, \\quad (23.12)$\n```\n\n# 23.3 SPSA OPTIMIZER\n\n\
    Simultaneous Perturbation Stochastic Approximation (SPSA) optimizer performs stochastic\
    \ gradient approximation (https://www.jhuapl.edu/SPSA/), which requires only two\
    \ measurements of the loss function, regardless of the dimension of the optimization\
    \ problem [13]. The goal is to find\n\n```\n$w^{*} = \\arg_{w} \\min L(w) \\quad\
    \ (23.13)$\n```\n\nwith the gradient operator\n\n```\n$\\nabla = \\begin{bmatrix}\
    \ \\frac{\\partial}{\\partial w_{1}}, & \\frac{\\partial}{\\partial w_{2}}, &\
    \ \\dots, & \\frac{\\partial}{\\partial w_{D}} \\end{bmatrix}^{T}$\n```\n\n```\n\
    $g(w) = \\nabla L(w) = \\begin{bmatrix} \\frac{\\partial L}{\\partial w_{1}},\
    \ & \\frac{\\partial L}{\\partial w_{2}}, & \\dots, & \\frac{\\partial L}{\\partial\
    \ w_{D}} \\end{bmatrix}^{T}$\n```\n\nSPSA use the iterative process with $\tau$\
    \ indicating the iteration starting at $\\tau=1$ with\n\n```\n$w_{\tau+1} = w_{\t\
    au} - \\eta_{\tau} \\cdot \\hat{g}(w_{\tau}) \\quad (23.14)$\n```\n\nwith $\\\
    eta_{\tau}$ the learning rate that decreases with $\tau$ and $\\hat{g}(w_{\tau})$\
    \ estimation of the gradient $\\hat{g}(w_{\tau})$ with\n\n```\n$\\hat{g}_{\\tau}\
    \ = \\frac{L(w_{\tau} + c_{\tau} \\cdot \\Delta_{\tau}) - L(w_{\tau} - c_{\tau}\
    \ \\cdot \\Delta_{\tau})}{2c_{\tau} \\cdot \\Delta_{\tau}}} \\quad (23.15)$\n\
    ```\n\n$\\Delta_{\tau}$ is a random perturbation vector and $c_{\tau}$ is a small\
    \ positive number that decreases with $\\tau$. The number of loss function measurements\
    \ needed in the SPSA method for each is 2, independent of the dimension. SPSA\
    \ with the random search direction does not follow the gradient path but approximates\
    \ it. Using a variational classifier on 1 quantum classifier SPSA is the most\
    \ recommended choice it can be used in the presence of noise.\n\n# 23.4.1 Qiskit\
    \ Variational Quantum Classifier\n\nQisk implements the variational classifier\
    \ (VQC) that can be embedded in classical learning tasks. In this simple qiskit\
    \ example, we create 10 two-dimensional training data points and 5 testing data\
    \ points for two classes each. We use the same classification circuit as before.\
    \ We hot encode our labels, as required by the algorithm using cross entropy.\
    \ Then, we set up our classical optimizer and the VQC algorithm using the callback\
    \ function. We plot the cost function with respect to optimization step,"
