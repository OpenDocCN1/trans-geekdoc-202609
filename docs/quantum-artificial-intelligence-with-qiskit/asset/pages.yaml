  md: '# Quantum Production System


    A production system is a model of human problem solving. It is composed of long-term
    memory and working memory, which is also called the short-term memory. Problem-solving
    can be modeled by a production system that implements a search algorithm. The
    search defines a problem space and can be represented as a tree. Using Grover''s
    algorithm, we search through all possible paths and verify, for each path, whether
    it leads to the goal state.


    A pure production system has no mechanism for recovering from an impasse. We describe
    an example of a simple pure production systems for sorting of a string and indicate
    how to port this simple pure production systems into the quantum production system.
    We indicate that a quantum production system can be the basis of a unified theory
    of cognition.


    # 8.1 PURE PRODUCTION SYSTEMS


    The production system model has no mechanism for recovering from an impasse [80].
    The system halts if no production can be. It is composed of the productions L
    (the long-term memory) and control system C. A pure production system is a sextuple:


    ```

    (\Sigma, L, W, \gamma_i, \gamma_g, C) (8.1)

    ```


    with


    +   * S is a finite alphabet;


    +   * W is the working memory. It represents a state $\gamma \in \Sigma$.


    +   * L is the long-term memory. It is the set of $B$ productions. A production
    $p$ has the form (precondition, conclusion) $\in \Sigma$. The precondition is
    matched against the contents of the working memory. If the precondition is not
    met then the conclusion is preformed and changes the contents of the working memory;


    +   * $\gamma_i \in \Sigma$ is the initial state. The working memory is initialized
    with the initial state $\gamma_i$;


    +   * $\gamma_g \in \Sigma$ is the goal state;'
