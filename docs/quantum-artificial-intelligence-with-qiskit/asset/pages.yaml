    A periodic function can be represented in the frequency space. The frequency is
    the number of occurrences of a recurring event per unit of time. If something
    changes rapidly, then we say that it has a high frequency. If it does not change
    rapidly, it changes smoothly, so we say that it has a low frequency. The discrete
    Fourier transform converts time-based or space-based data into the frequency domain.


