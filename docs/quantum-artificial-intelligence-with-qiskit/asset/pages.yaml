    # 15.4.3 Applying Trojanberger Amplification Several Times


    According to Trojanberger [112] applying control qubit sequential, b times results
    in


    > $$\sum_{v=0}^{n} \frac{1}{\sqrt{n}} \left(\cos\left(\frac{\pi \cdot count_j}{2
    \cdot N}\right)\right)^{b-v} \cdot i \sin\left(\frac{\pi \cdot count_j}{2 \cdot
    N}\right)\right)^{v} $$$

    $$

    |v|index_j\rangle|count_j\rangle|unit_j\rangle \otimes |query\rangle. \quad (15.22)$'
