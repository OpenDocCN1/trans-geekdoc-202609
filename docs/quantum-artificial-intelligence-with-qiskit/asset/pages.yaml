    \ \\cdot \\left(\\frac{|0\\rangle - |1\\rangle}{\\sqrt{2}}\\right)$\n```\n\nWe\
    \ say that the value (phase) is being \"kicked back\" to the control register.\n\
    \n# 2.10 QUANTUM BOOLEAN GATES\n\nA reversible circuit that is composed of $m$\
    \ bits corresponds to a unitary mapping that represents a permutation on $m$ bits,\
    \ defining an injective mapping $\\mathbf{B}^m \\rightarrow \\mathbf{B}^m$. A\
    \ unitary permutation matrix can represent this unitary mapping. A more elegant\
    \ method is to map the reversible circuit into the quantum Boolean gates. Such\
    \ a mapping allows us to determine the complexity of the circuit by the number\
    \ of gates. The following quantum gates are Boolean gates: the identity gate $I$,\
    \ the not gate $X$ and the control gate $CX$. The essential fanout operation.\
    \ These operations can be represented by a reversible. A Toffoli gate $CCX$ is\
    \ a unitary quantum gate on three qubits and can be represented by a unitary matrix\
    \ $CCX$ in Hilbert space $H_8$.\n\n```\n$CCX = \\begin{pmatrix} 1 & 0 & 0 & 0\
