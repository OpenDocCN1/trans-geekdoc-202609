  md: "# 38 ■ Quantum Artificial Intelligence with Qiskit\n\nQuantum collapse during\
    \ measurement is a non-local force. A non-local interaction is not limited by\
    \ the speed of light, and its strength is not mediated by distance. This arrangement\
    \ conflicts with Einstein's theory of special relativity, which states that nothing\
    \ can travel faster than light. The conflict is resolved by the fact that one\
    \ cannot use an qubit to separate over a distance in two places, $A$ and $B$,\
    \ and there are no other means of communication, measuring the qubit on place\
    \ $A$ determines the outcome on $B$, but at place $B$, the outcome is unknown.\
    \ Measuring at place $B$ is a random process without the knowledge of the results\
    \ of place $A$. Also to perform teleportation we need a conventional channel to\
    \ map information to how the teleported qubit in a correct state.\n\n# 2.8 CLONING\n\
    \nA linear operation that would produce a copy of an arbitrary quantum state is\
    \ not possible. We cannot copy an unknown amplitude distribution of a state. This\
    \ has profound implications in the field of quantum computing, since we cannot\
    \ reuse an arbitrary quantum state.\n\nTo perform this we define a copy machine.\
    \ We use one orthonormal basis of the orthogonal space, for example $|x_1\rangle$\
    \ and define a unitary copy operator that copies $|x\rangle \\in H_n$ as\n\n```\n\
    $U_{copy}(|x\rangle, |x_1\rangle) = |x\rangle|x\rangle$.\n(2.38)\n```\n\nDoes\
    \ $U_{copy}$ exist? For basis states $U_{copy}$ is defined. It can be realized\
    \ for example $CX$ with $|x_1\rangle = |0\rangle$ and $|x_2\rangle = |1\rangle$,\n\
    \n```\n$U_{copy}(|x_1\rangle, |x_1\rangle) = |x_1\rangle|x_1\rangle$, $U_{copy}(|x_2\r\
    angle, |x_1\rangle) = |x_2\rangle|x_2\rangle$.\n```\n\nIf this is in a superposition\n\
