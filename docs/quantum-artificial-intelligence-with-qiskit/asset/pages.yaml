    QuantumCircuit(14.8) defines a quantum circuit with the name qc that uses 14 qubits
    and measures 8 qubits.


    # 9.2.1 Rules and Trace


    The if part of rules is implemented by the Toffoli gate, also called the ccX gate
    (CCNOT gate, controlled not gate), it recognizes the position of the empty space
    and identifies it by setting one of the four qubits 9 to 11 to one.


    ```

    #If part of rules marked in trace (empty state)

    qc.ccx(0,1,9)

    qc.ccx(2,3,10)

    qc.ccx(4,5,11)

    qc.ccx(6,7,12)

    ```


    The execution of the rules uses the Fredkin gate, also called controlled swap
    (SWAP) gate, using the trace information and the path descriptor setting the flag
    qubit (qubit 8) to indicate if the rule is going to be executed. The reset is
    performed by computing, repeating the operation to set the flag in the state zero.
    We change the path descriptor by the trace value; the gate and execute the second
    instantiation of the rule depending on the trace value; qc.barrier() will separate
    the representation in the circuit, resulting in the quantum circuit indicated
    in the Figure 9.4.


    ```

    #If then rule (1) for empty at 0, 1 -> 4 , 5 or 2, 3

    #Search empty state with the descriptor

    qc.ccx(9,13,8)

    #Execute 1st then part by moving the empty space clockwise

    qc.ccswap(8,0,4)

    qc.ccswap(8,1,5)

    #Sec then part with changed descriptor

    #Reset Flag

    qc.ccx(9,13,8)

    #Fetch second superposition

    qc.x(13)

    qc.ccx(9,13,8)

    #Execute 2th then part by moving the empty space anti-clockwise

    qc.ccswap(8,0,2)

    qc.ccswap(8,1,3)

    #Reset Flag

    qc.ccx(9,13,8)

    #Restore descriptor

    qc.x(13)

    qc.barrier()

    ```'
