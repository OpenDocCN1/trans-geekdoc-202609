  md: '# 22.3.3 Obtaining the Solution


    The solution to the problem


    $A = \left( \begin{array}{cc} 1 & -1/3 \ -1/3 & 1 \end{array} \right), \quad b
    = \left( \begin{array}{c} 1 \ 0 \end{array} \right).$


    is represented by


    $A^{-1} = \left( \begin{array}{cc} 3/5 & 1/5 \ 1/5 & 3/5 \ \end{array} \right),
    \quad x = \left( \begin{array}{c} 9/5 \ -3/5 \ \end{array} \right).$


    with the normalized vector being


    $\mathbf{x}_n = \frac{\mathbf{x}}{\|\mathbf{x}\|}} = \left( \begin{array}{c} 0.948683
    \ 0.316228 \ \end{array} \right).$


    The measured result of our HHL simulation is in the qubit 3 in the case the qubit
    0 is see **Figure 22.2 (b)**


    $x_m^2 = \frac{0.562 \cdot 0.062}{0.562 + 0.062}$


    with the measured value being


    $X_m = \left( \begin{array}{c} 0.948869 \ 0.31567 \ \end{array} \right) \approx
    X_n = \left( \begin{array}{c} 0.948683 \ 0.316228 \ \end{array} \right).$


    Obtaining the required coefficient $x_i$ from $|x\rangle$ would require at least
    $n$ measurements, so the complexity of the algorithm would be $O(n)$ which is
    problematic since the cost on a classical computer for an approximate solution
    for sparse matrix via conjugate gradient descent are equivalent. Many applications
    are interested in the global properties of $|x\rangle$ rather than the coefficients
    $x_i$. For example, we as well efficiently estimate if two solutions of different
    equations are the same or not [39].


    # 22.4 CONSTRAINTS


    In quantum we efficiently find the eigenvectors and eigenvalues by the Kitaev''s
    phase estimation algorithm [39]. We will compute


    $\mathbf{x} = A \cdot \mathbf{b} \qquad (22.38)$


    or


    $\mathbf{x} = A^{-1} \cdot \mathbf{b}. \qquad (22.39)$


    We assume $A$ is Hermitian. In the case $A$ is Hermitian, we define


    $A'' = \left( \begin{array}{cc} 0 & A \ A^* & 0 \ \end{array} \right), \quad \mathbf{b}''
    = \left( \begin{array}{c} 0 \ b \ \end{array} \right), \quad \mathbf{x}'' = \left(
    \begin{array}{c} x \ \end{array} \right). \qquad (22.40)$


    and


    $A'' \cdot \mathbf{x}'' = \mathbf{b}''. \qquad (22.41)$'
