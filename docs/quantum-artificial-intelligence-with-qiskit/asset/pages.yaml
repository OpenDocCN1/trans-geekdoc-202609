    \n```\nfrom qiskit_machine_learning.algorithms.classifiers import VQC\nlog = OptimizerLog()\n\
    vqc = VQC(feature_map=FEATURE_MAP,\nansatz=VAR_FORM,\nloss='entropy')\n```"
