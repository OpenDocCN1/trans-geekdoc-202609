  md: '# Quantum Artificial Intelligence with Qiskit


    vector has an odd number of. The m-variable parity function is the Boolean function
    $f \in \{0, 1\}$


    ```

    $f(q) = q_m q_{m-1} \cdots q_1 q_0 \quad$ (23.3)

    ```


    $\oplus$ denotes exclusive or. For each input data vector $x_k$ we determine the
    output $o_k \in [0, 1]$ estimating the probability distribution of odd number
    of ones in basis state $[q_m \cdots q_1 q_0]$. Alternatively we could use it to
    estimate the probability of $o_k$ by the inversion test


    ```

    $o_k = |(\phi(x)|\phi(y))|^2 = |(0^{\otimes m})U_{\phi(y)}U_{\phi(x)}(0^{\otimes
    m})|^2 \quad$ (23.4)

    ```


    Assuming two opposite classes $C_1$ and $C_2$, we can interpret the probability
    of class $C_1$ given the input


    ```

    $p(C_1|x_k) = o_k, p(C_2|x_k) = 1 - p(C_1|x_k). \quad$ (23.5)

    ```


    In the training phase, we''re trying to find the values for $w$ using an optimizer
    on a classical computer.


    # 23.1.1 Example


    We use the parameterized qiskit circuit over two qubits $U_{\phi(x)} = ZZFeatureMap
    [21]$ where two parameters are defined by the data $bind\parameters$ with the
    two-dimensional vector $x$. The variational circuit contains the free parameter
    $w$ that will adapt during training. The TwoLocal circuit is a parameterized circuit
    consisting of alternating rotation layers and entanglement layers. The rotation
    layers are single gate applied on all qubits. The entanglement layer uses two-qubit
    gates to affect the qubits according to the direction. In our example, we will
    use the rotation gates RX and R and the entanglement controlled Z, CZ, with two
    repetitions in 12 free parameters. The two-dimensional vector $w$ defines the
    parameters by the $bind\parameters$. After the operations, we measure the two
    qubits (see Figure 23.1)


