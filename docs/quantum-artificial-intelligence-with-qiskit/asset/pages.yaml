    # 1.3.2 Nearest Neighbor


    The Nearest Neighbors (NN) classifier works under the assumption that objects
    represented by a feature vector that share similar features will likely have the
    same class [09]. With that, if we represent every example as a feature vector,
    we can, instance, compute the Euclidean distance between a new example and some
    known training data to find out which previously examples are similar to the new
    one. We can then use information to perform classification.


    Let DB be a database of s objects represented by vectors of dimension $n$ in which
    the index $k$ is an explicit key identifying each object,


    ```

    ${X_k \in DB \mid k \in {1..s\}$

    ```


    with


    The NN-similarity is defined for one solution. For a query vector $y$ one vector
    $x_j$ is NN-similar to $y$ according to the distance function $d$ with


    ```

    $x_i = \min d(x_j, y)$. (1.3)

    ```


    Since in quantum computation we cannot simply compare vectors, the $\epsilon$-similarity
    is more useful. The $\epsilon$-similarity is defined for range queries. For a
    query vector $y$ all vectors $x_j$ are $\epsilon$-similar to $y$ according to
    the distance function $d$ with


    ```

    $d(x_j, y) < \epsilon$. (1.4)

    ```


    The search is sensitive to the value of $\epsilon$, too big $\epsilon$ results
    in the whole dataset, too small value in no object.


