    The value of $r$ depends on the relation of $n$ versus $k$, with $k$ being the
    number of solutions. When $r$ is unknown we can repeatedly choose $r$ randomly
    between 1 and $\frac{1}{\sqrt{2^m}}$. This simple strategy leads to success in
    $O(\sqrt{n}) = O(\sqrt{2^m})$ [82].


    A more advanced approach is the quantum counting algorithm with the complexity
    $O(\sqrt{n})$. Quantum counting is based on phase estimation algorithm and will
    be described later.


    #  8.3 COGNITIVE ARCHITECTURE


    A quantum production system is the basis of a unified theory of cognition. Unified
    theories of cognition is a theory that attempts to unify all of the theories of
    the mind in a single framework. Allen Newell proposed the SOAR cognitive architecture
    [55], [71], [31]. SOAR is an architecture of the mind: a fixed structure utilizing
    the flexible domain of cognitive processing as well as an architecture for intelligent
    agents. All problem solving is formulated as the selection and application of
    productions to achieve some goal. The decision takes place in the context of earlier
    decisions. Those decisions are rated utilizing preferences and added by chosen
    rules. Preferences are determined together with the rules by an observer knowing
    about a problem. SOAR models the psychological phenomena of chunking, the association
    of expressions, or symbols (chunks) into a new expression or symbol (chunk). Chunking
    represents a theory of learning. A chunk is a new rule (production) that describes
    the processing that was present due to lack of applicable'
