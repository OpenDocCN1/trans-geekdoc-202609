- pgno: 305
  md: '# Hybrid Approaches – Variational Classification


    Variational approaches are characterized using a classical optimization algorithm
    to iteratively update a parameterized quantum trial solution also called ansatz
    (from German Ansatz = approach). The parameterized quantum trial solution is defined
    by a parameterized quantum circuit like for example $ZZFeatureMap$. We indicate
    the basic principles of a variational classifier by a simple example. We then
    describe the cross entropy loss function and the Simultaneous Perturbation Approximation
    (SPSA). The optimizer performs stochastic gradient approximation, which requires
    only measurements of the loss function. Qiskit implements the variational quantum
    classifier (VQC) that can be embedded in classical machine learning tasks. We
    indicate a example of the VQC classifier whose learning is based on SPSA.


    # 23.1 VARIATIONAL CLASSIFICATION


    The variational quantum classifier for a binary classification problem, with input
    data vectors $\mathbf{x}_k$ of dimension $m$ and binary labels $t_k$ with a training
    set


    $D = \{(x_1, t_1), (x_2, t_2), \dots, (x_N, t_N)\}, t_k \ \in \{0, 1\}$.


    For each data vector $\mathbf{x}_k$ the quantum feature maps encodes classical
    data into quantum data via a parameterized quantum circuit [95], $U_{\phi(\mathbf{x}_k)}$
    with $m$ parameters


    ```

    $U_{\phi(\mathbf{x}_k)}(0)^{\otimes m} \quad (23.1)

    ```


    Additionally, we will use a variational quantum circuit that represents the free
    parameter $w$ that adapt during training


    ```

    $|psi(\mathbf{x}_k, w)\rangle = U_{W(w)} \cdot U_{\phi(\mathbf{x}_k)}(0)^{\otimes
    m} \quad (23.2)

    ```


    We measure the state $|psi(\mathbf{x}_k, w)\rangle$ with some basis state $|q_m
    \dots q_1\rangle$ representing a binary string. We define the output from the
    binary string by a parity function. A parity function is a Boolean function whose
    value is one if and only if the input'
