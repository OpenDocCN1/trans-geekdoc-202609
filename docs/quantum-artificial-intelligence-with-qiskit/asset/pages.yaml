    In the second step we apply the $U_f$, gate.


    ```

    $U_f \cdot |01\rangle = U_f \cdot \frac{1}{2}((00) - |01| + |10| - |11)) = \frac{1}{2}
    \cdot ((00) - |01| + U_f \cdot |10| - U_f \cdot |11|)).

    ```


    There are four possible outputs. For constant function


    ```

    $i) \frac{1}{2} \cdot ((00) - |01| + |10| - |11|) = \frac{|0\rangle+|1\rangle}{\sqrt{2}}
    \otimes \frac{|0\rangle-|1\rangle}{\sqrt{2}},$

    ```


    ```

    $ii) \frac{1}{2} \cdot (-(01) + |00| + |10])) = \frac{1}{2} \cdot ((-|01\rangle
    + |00\rangle + |10\rangle) + |11\rangle) = (-\frac{|0\rangle-|1\rangle}{\sqrt{2}})
    \otimes (\frac{|0\rangle-|1\rangle}{\sqrt{2}}) - (\frac{|0\rangle+|1\rangle}{\sqrt{2}})
    \otimes (\frac{|0\rangle-|1\rangle}{\sqrt{2}}).$

    ```


    and for non-constant function


    ```

    $iii) = \frac{1}{2} \cdot ((00) - |01| + |10| - |11|) = \frac{1}{2} \cdot ((00)
    - |01| + |10| + |11)).$

    ```'
