    \ \\cdot |100\rangle + \\sqrt{0.3} \\cdot |110\rangle + \\sqrt{0.1} \\cdot |111\r\
    angle$. The binary tree is represented by multi-control rotation gates, the multi-control\
    \ rotation gate are defined over the values indicated by the gray ellipsoids.\n\
    \n# 16.2 TOP-DOWN DIVISION STRATEGY\n\nWe build a top-down binary tree that divides\
    \ the probability of observing $|q_2\rangle$ on the first level, to the probability\
    \ of observing $|q_2q_1\rangle$ on the second level, and finally the probability\
    \ of observing $|q_2q_1q_0\rangle$ on the third level representing the required-position\
    \ $|psi\rangle$ [8]. The binary tree is represented by multi-control rotation\
    \ gates (see Figure 16.1) and requires $\\log_2 n$ qubits to represent a vector\
    \ of dimension $n$.\n\n# 16.2.1 Level\n\nThe probability of observing $q_2 = 0$\
    \ is $\\sqrt{0.3}$;\n\n```\n$$\\sqrt{0.03} \\cdot |000\\rangle + \\sqrt{0.07}\
    \ \\cdot |001\\rangle + \\sqrt{0.15} \\cdot |010\\rangle + \\sqrt{0.05} \\cdot\
    \ |011\\rangle$\n```\n\nand probability of observing $q_2 = 1$ is $\\sqrt{0.7}$.\n\
    \nWe use a parameterized RY gate\n\n```\n$R_Y(\\theta) = \\begin{pmatrix} \\cos(&\\\
    frac{\theta}{2}) & -sin(&\\frac{\theta}{2}) \\ \\sin(&\\frac{\theta}{2}) & \\\
    cos(&\\frac{\theta}{2}) \\end{pmatrix}$\n```\n\nto performs rotation of one qubit\
    \ along the y-axis by the rotation angle $\\theta$ (in radiants)\n\n```\n$$\\\
    theta_0 = 1.98231 = 2 \\cdot \\arccos(\\sqrt{0.3}) \\quad (16.2)$\n```\n\nwith\
    \ (see Figure 16.1)\n\n```\n$RY_{\\theta_0}|0\\rangle = \\sqrt{0.3} \\cdot |0\\\
    rangle + \\sqrt{0.7} \\cdot |1\\rangle \\quad (16.3)$\n```"
