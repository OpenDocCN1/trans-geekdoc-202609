  md: '# Preface


    Quantum artificial intelligence (QAI) is a new interdisciplinary research field
    that combines quantum computing with artificial intelligence (AI). It aims to
    use the unique properties of quantum computers, which leverage quantum mechanical
    effects (such as superposition and entanglement) to enhance the capabilities of
    AI systems. In QAI, progress is being made quickly. What was a scientific dream
    years ago is becoming more real, and now you (by reading this book) are at the
    forefront of the revolution QAI.


    Quantum algorithms for AI have been proposed, including a quantum tree search
    algorithm and a quantum production system that will be demonstrated by qiskit
    simulation by step. Qiskit is an open-source software development kit (SDK) for
    working with quantum computers at the level of circuits and algorithms [21], IBM
    Quantum, https://quantum-computing.ibm.com/. It provides tools for creating and
    manipulating quantum programs and running them on prototype quantum devices on
    IBM Quantum Experience or simulators on a local computer. It follows the quantum
    circuit model for universal quantum computing and can be used for any quantum
    hardware that follows this model. Qiskit is based on Python and you can find all
    information about it at https://qiskit.org.


    This book provides tools for creating and making quantum programs and running
    them on prototype quantum devices or simulators on a local computer, such as a
    simple laptop. It follows the quantum circuit model for universal quantum computing
    and can be used with any quantum hardware that follows this model. You can download
    all the examples (Jupyter notebooks) from the book https://github.com/andrejwieissert/qai.1


    In the book, we will introduce quantum computation and its application to AI AI
    can be divided into different areas: symbolic artificial intelligence and machine
    learning (ML), the same is true for QAI.


    # Artificial Intelligence – Chapter 1


    AI is a subfield of computer science that understands the mechanisms of human
    behavior. This approach is accomplished via simulation with the help of artificial
    artifacts, typically with quantum programs on a machine that performs calculations.
    However, the terms “intelligence” and “intelligent human behavior” are not well
    defined and understood. That is why over the years of AI


