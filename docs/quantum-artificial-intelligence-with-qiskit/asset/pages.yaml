  md: '# Grover''s Amplification


    We describe the Grover amplification algorithm. We represent $n$ state by a superposition,
    each state has the same real positive amplitude. A parallel computation is applied
    to all the $n$ states, and the state with the solution is marked by a minus sign,
    the amplitude is now negative. We then apply a linear operation that is based
    on Householder reflection, by the reflection the the value of the marked amplitude
    grows linearly. For dimensions higher than four, the operations of marking and
    Householder reflection must be repeated $\sqrt{n}$ times, at each step the amplitude
    only grows linearly. With $\sqrt{n}$ steps we measure the solution. The algorithm
    guarantees a quadratic speed up a classical computer that would require $n$ steps.
    Grover''s amplification algorithm is optimal, one can prove that a better algorithm
    cannot exist. We will demonstrate the principles of Grover''s amplification using
    quantum notation with a qubit $NumP_q$. Then we explain how to represent the algorithm
    with quantum answer representing eight states using one and two rotations.


    # 5.1 SEARCH AND QUANTUM ORACLE


    For a function $o(x)$


    ```

    $o(x) = \begin{cases} 1 & if \ x=\xi \ 0 & else \end{cases} \quad (5.1)$

    ```


    we want to find $x$ for $o(x)=1$, $x=\xi$. The task is equivalent to a decision
    problem with a binary answer $1$ yes and $0$ no and Grover''s amplification algorithm
    performs exhaustive search in $O(\sqrt{n})$ steps in $n$-dimensional Hilbert space
    $[35], [36], [37], [38], [35], [35]$. Hilbert extends the two- or dimensional
    Euclidean space into spaces that have any finite or infinite number of dimensions.
    Grover''s amplification algorithm is good as any possible quantum algorithm for
    exhaustive search due to the lower bound $O(\sqrt{n})$ $[2]$. The algorithm is
    based on the Householder reflection of $|x\rangle$ of $n$ qubits with $n=2^m$.
    Grover''s amplification algorithm is optimal, one can prove that a better algorithm
    cannot exist $[11], [14]$. It follows that using a quantum computer $NP-complete$
    problems remain $NP-complete$. The algorithm guarantees a quadratic speed up over
    a classical computer that would require $n$ steps.'
