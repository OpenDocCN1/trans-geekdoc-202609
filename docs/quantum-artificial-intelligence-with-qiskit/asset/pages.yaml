- pgno: 312
  md: '# Conclusion


    We conclude our journey with quantum artificial intelligence (QAI). A quantum
    computer is a computer that exploits quantum mechanical phenomena such as superposition
    and entanglement. The quantum advantage is based on two principles related to
    Grover''s algorithm and the phase estimation algorithm. Quantum computing is still
    in its early stages, and there are many technical challenges that must be overcome
    before it can be implemented QAI. However, for the quantum computing the race
    is on, what was a scientific dream some years ago, is becoming more real. You
    are now at the forefront of the research in quantum computing.


    # 24.1 EPILOGUE


    Quantum computation with the quantum gate model is based on principles to speed
    up the computation: that lead to quantum advantage


    +   - Grover''s algorithm can speed up the search quadratically for a given number
    of possible solutions.

    - The QFT can determine the period of a wave or be the basis of the phase estimation
    algorithm.

    - Variational Classifier can compute functions in extremely high dimensional space
    that cannot be easily solved by conventional computers.


    Most quantum machine learning algorithms suffer from the input destruction problem
    [1]. The efficient preparation of data is possible in part for sparse data [39].
    However, the input destruction problem has not yet been solved, and theoretical
    speeds are usually analyzed [94] by ignoring the input problem, which is the main
    bottleneck for data encoding. The costs of data preparation, in which data points
    must be read, and the query time are represented by two phases that are analyzed
    independently; the quantum computing approach has advantages in solving such problems.
    Linear algebra-based quantum machine learning is based on quantum gates that achieve
    theoretical exponential speed over their classical counterparts and are subroutines
    that can are essential for machine learning. Basic quantum linear algebra subroutines
    use a quantum


    DOI: 10.1201/9781003374404-24'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'coprocessor for extensive and nontrackable computation routines in machine
    learning. Such “mathematical” quantum coprocessors can be used on a conventional
    computer.


    Quantum supremacy means that programmable quantum devices can solve a problem
    that no classical computer can solve in any feasible amount of time. Quantum computers
    will dominate when enough qubits are available. Such gains in computing power
    could change every aspect of our lives in the future.


    Even without quantum supremacy, the quantum computing approach leads to easier
    formulation of certain algorithms, such as certain feature maps that are difficult
    to handle. Quantum computing creates a new way of thinking, making it possible
    to perform calculations that could not be considered before. The face of the world
    could be changed forever.


    # 24.2 FURTHER READING


    The most important books about quantum computing which you should not miss [72]
    and [47].


    For a brighter mathematical coverage and the description of the adiabatic quantum
    computation and quantum annealing, you can consult the book [119]. Adiabatic quantum
    computation is an alternative approach to quantum computation and is based on
    the time evolution of a quantum system and is a polynomial equivalent to the quantum
    gate model. Quantum annealing on the other hand solves optimization problems.


    Finally, if you are interested in the philosophical consequences and the interpretation
    of quantum physics itself motivated by the experiments that you performed on your
    computer, you would be maybe interested in my other book “Mind, Brain, Quantum
    AI, and the Multiverse” [120].'
