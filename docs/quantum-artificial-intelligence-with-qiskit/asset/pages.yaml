    # 2.1.1 Interpretations of Quantum Mechanics


    During observation (measurement by the observer, us), the wave collapses into
    one definite state with a certain probability. A quantum system that is perfectly
    maintains its wave representation, its coherence. If it is not isolated, during
    interaction with the environment the wave representation of an event is lost,
    this is called the quantum decoherence. Quantum decoherence happens during the
    environment. Quantum decoherence is universally viewed as the loss of information
    from a system into the environment. Quantum decoherence provides us only with
    a framework for apparent wave-function collapse and it does not explain the collapse.
    Since quantum systems are not isolated in the large scale (macro scale), the effects
    are mostly present at the scale of atoms and subatomic particles (micro scale).
    During the measurement true randomness is present, but after the measurement the
    physical system is in a definite state. Measurement does something to the wave
    function. This is something not explained by quantum theory, however there are
    two interpretations:


    +   - The most popular interpretation, the Copenhagen interpretation, claims that
    quantum mechanics is a mathematical tool that is used in the calculation of probabilities
