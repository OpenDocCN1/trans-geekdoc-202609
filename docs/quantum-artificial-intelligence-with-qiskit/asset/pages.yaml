    ```\nqc.barrier()\nqc.h(26)\nqc.barrier()\nqc.append(Grover(),range(26))\nprint(\"\
    nCircuit depth: \", qc.depth())\n```\n\n# 11.2 EXAMPLES\n\nOne solution is marked,\
    \ after one iteration of Grover's amplification, the probabilities of measuring\
    \ a state using the statevector simulator are indicated in the Figure 11.7. Three\
    \ marked states result in a solution after one iteration for the initial state\
    \ BC and A and the goal states AC and B, the probabilities of measuring a state\
    \ using the statevector simulator are indicated in the Figure 11.8.\n\n# 11.3\
    \ NUMBER OF ITERATIONS\n\nFor A, B, C blocks $B_{max} = 6, B_{min} = 1,$ and\n\
    \n> $B_{average} = \\frac{6 \\cdot 1 \\cdot 1 + 3 \\cdot 6}{13} = 2.30769.$\n\n\
    Naively, we would assume that the branching factor is reduced by Grover's amplification\
    \ to the number 8 represented by three qubits\n\n> $\\sqrt{8} = 2.82843$\n\nWith\
    \ growing value $m$, the branching factor is reduced by Grover's amplification\
    \ to\n\n> $B_{average} = \\sqrt{2.30769} = 1.51911.$\n\nFor $k$ solutions, the\
    \ probability of measuring a state that represents one solution of $k$ solutions\
    \ is related to the number $r$ of iterations of the Grover's operator. Simplified,\
    \ we can state that relates\n\n> $r = \\sqrt{\frac{(8)^m}{k}} = (11.4)$"
