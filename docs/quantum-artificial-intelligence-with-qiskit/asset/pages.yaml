    # 10.2 NUMBER OF ITERATIONS


    For 8-puzzle, $B_{max} = 4$, $B_{min} = 2$, and


    ```

    $B_{average} = \frac{4 \cdot 1 \cdot 2 \cdot 4 \cdot 3}{9} = 2.6667$.

    ```


    Naively, we would assume the branching factor is reduced by Grover''s amplification
    to


    ```

    $\sqrt{B_{max}} = \sqrt{4} = 2$

    ```


    However, this is not the case in our coding strategy. With growing $n$, the branching
    factor is reduced by Grover''s amplification to


    ```

    $\sqrt{B_{average}} = \sqrt{2.6667} = 1.6299$

    ```


    For $k$ solutions, the probability of measuring a state that represents one solution
    of $k$ solutions is related to the branching factor is reduced by Grover''s operator.
    The probability of seeking one solution should be as close as possible to 1, and
    the number of iterations $r$ should be nearly one, with $m$ being the number of
    qubits describing the path descriptor [45, 72]


    ```

    $r = \frac{\pi}{\sqrt{k}}\sqrt{\frac{2^m}{k}}$

    ```


    The number of iterations $r$ is the largest integer not greater than the computed
    value. Simplified, we can state that


    ```

    $r = \sqrt{\frac{(B_{max})^m}{k}}$

    ```


    The value of $r$ depends on the relation of $m$ versus $k$, and $k$ is bigger
    than one since we execute several rules that time. For the depth $m$, there are
    solutions with


    ```

    $k = \sqrt{\frac{B_{max}}{B_{average}}}^m$

    ```


    it follows


    and the branching factor is reduced by Grover''s amplification to $\sqrt{B_{average}}$


    ```

    $$\sqrt{B_{average}} = \sqrt{2.6667} = 1.6299$.

    ```'
