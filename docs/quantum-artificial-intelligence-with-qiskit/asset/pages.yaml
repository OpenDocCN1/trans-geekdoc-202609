  md: '# xvi Preface


    changed following the development of more powerful computers. For example, it
    is now common to identify AI with deep learning.


    We first get a short history of AI, and then we describe the principles of the
    two main branches of AI, symbolic AI and ML.


    # Quantum Physics and Quantum Computation - Chapter 2


    Statistical laws govern the totality of observations in physics. An object can
    be described in classical mechanics by a vector which describes the position and
    its momentum. Classical mechanics is usually valid at the macro scale. The changes
    in the position and momentum of the object over time are described by the Hamiltonian
    equation of motion. The state of object is described by the Hamiltonian function.
    At a micro scale the observations are described by quantum physics. Light appears
    only in chunks that can be quantized. An individual chunk is called quantum and
    quantum of light is called a photon [27]. Quantum theory gets its name from this
    property, which it attributes to all measurable physical quantities. A photon
    can be described by a wave function if it is isolated from its environment. The
    wave function in quantum mechanics, if unobserved, evolves into a smooth and continuous
    way according to the Schrödinger equation, which is related to the Hamiltonian
    equation of motion. This equation describes a linear superposition of states at
    time. During the observation (by the measurement, by us), the wave collapses into
    one definite state with a certain probability.


    The mathematical framework of quantum theory is based on linear algebra in Hilbert
    space. A two-state quantum system is described by a two-dimensional Hilbert space.
    Thus, a two-state quantum system corresponds to a qubit. A register is composed
    of several qubits and is defined by the tensor product. We describe the principles
    of computation with $n$ qubits and introduce the principles of entanglement, cloning,
    and the matrix representation of quantum Boolean gates, as well as an example
    of a simple quantum Boolean circuit.


    # Qiskit - Chapter 3


    We describe how to install qiskit and demonstrate the two main backend simulator
    functions we use. We demonstrate the working principles of the qiskit software
    kit on the simple example of a quantum coin. We indicate how to represent simple
    qubits by unitary matrices using the qiskit get unitary command. We indicate step
    by step how to define circuits on an example of a four-bit connection. The concept
    of un-computation is introduced since in quantum computing we cannot reset qubits
    to zero. The Deutsch algorithm determines if an unknown function $f:B^1 \rightarrow
    B^1: f(x)=y$ of one bit is constant or not by calling the function one time. The
    Deutsch algorithm was the first algorithm (1985) that demonstrated a quantum advantage:
    it is a proof of concept that, in certain settings, quantum computers are strictly
    more powerful than classical ones by reduction in query complexity'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'Preface ■ xvii


    compared to the classical case. Finally, we give an example how to run the Deutsch
    algorithm on a real small quantum computer.


    # Quantum Gates – Chapter 4


    Quantum gates are the building blocks of quantum circuits, like classical logic
    gates are for conventional digital circuits. Unlike classical logic gates, quantum
    logic gates are reversible and can be described by unitary matrices. Then, we
    introduce Boolean quantum gates that allow us to map any Boolean circuit in such
    a way that the circuit becomes reversible. Such a circuit represents a permutation
    in Hilbert space and can be represented by a permutation matrix composed of the
    unitary matrices representing the quantum gates. We describe Clifford gates as
    elements of the Clifford group and can efficiently simulated with a classical
    computer. Parameterized gate is a parameterized gate with the parameter being
    the amount of rotation to be performed over the three axes. We introduce the controlled-U
    gates and introduce the unitary decomposition and formulate the process of translation.
    Translation is a complex problem of finding an optimal decomposition into the
    present quantum gates for a quantum computer.


    # Grover’s Amplification – Chapter 5


    We describe the Grover’s amplification algorithm. We represent n state by superposition;
    each state has the same real positive amplitude. A parallel computation is applied
    to all n states, and the state is solved by a minus sign, and the amplitude is
    negative. We then apply a linear operation based on the Householder reflection,
    and by the reflection, the value of the amplitude grows linearly. For dimensions
    higher than four, the operations of marking and the Householder reflection must
    be repeated √n times, since at each step the amplitude grows linearly. After √n
    steps we measure the solution. The algorithm guarantees us a quadratic speed over
    a classical computer that would require n steps. The Grover’s amplification algorithm
    is optimal and one can prove that a better algorithm cannot exist. We will demonstrate
    the primitives of Grover’s amplification using the matrix notation NumPy. Then
    we explain how to represent the algorithm with quantum gates by a qiskit example
    of three qubits representing eight states using one


    # SAT Problem – Chapter 6


    The Boolean satisfiability problem (SAT problem) is the problem of determining
    whether there exists an interpretation that satisfies a given Boolean formula,
    whether the formula evaluates true [22]. Each variable of the formula can have
    the values true (one) or false (zero). We formulate the SAT satisfiability problem
    and indicate an example by step. Then we discuss the relation between the SAT
    problem and the time complexity. Computational complexity theory addresses questions
    regarding which problems can be solved in a finite amount of time on a computer.
    A decision'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'problem a computational problem with instances formulated as a question with
    a binary answer. An example is the question of whether a certain number n is a
    prime number. Most problems can be converted into a decision problem. The time
    complexity describes the amount of time it takes to run an algorithm. Time complexity
    is commonly estimated by counting the number of elementary operations performed
    by the algorithm. The amount of time taken is linearly related to the number of
    elementary operations performed by the algorithm. A problem is easy if an algorithm
    on a computer can determine the relations related to the input in polynomial time.
    Polynomial-time algorithms are said to be fast since they can be executed in an
    acceptable time on a computer. Otherwise, we state that the problem is hard, meaning
    the time required grows exponentially and cannot be executed in an acceptable
    time on a computer. We describe a SAT problem with a Boolean formula with three
    Boolean variables and indicate it by step using the qiskit framework of how to
    solve the problem using Grover''s amplification by a quantum algorithm.


    # Symbolic State Representation – Chapter 7


    An economic symbolic representation of objects and attributes that can represent
    a state during problem solving is introduced. This representation is motivated
    by the biological what principle and requires a low number of bits. Such an economical
    symbolic representation is ideal for the current generation of quantum computers.
    We describe the search tree on which problem solving is based. Nodes and edges
    represent a search tree. Each node represents a state, and each edge represents
    a transition from one state to the following. The path descriptors are the basis
    idea of quantum tree search. In a quantum search tree we represent all possible
    path descriptors simultaneously and can use Grover''s amplification algorithm
    to determine the solution.


    # Quantum Production System – Chapter 8


    A production system is a model of human problem solving. It is composed of long-term
    memory and working memory, which is also called the short-term memory. Problem-solving
    can be modeled by a production system that implements a search algorithm. The
    search defines a problem space and can be represented as a tree. Using Grover''s
    algorithm, we search through all possible paths and verify, for each path, whether
    it leads to the goal state.


    A pure production system has no mechanism for recovering from an impasse. We describe
    an example of a simple pure production system for sorting of a string and indicate
    how to port this simple production systems into the quantum production system.
    Then we indicate that a quantum production system can be the basis of a unified
    theory of cognition.


    # 3 Puzzle – Chapter 9


    We demonstrate the working principles of quantum production system and the quantum
    tree search by a qiskit implementation of a toy example from symbolic AI, the'
