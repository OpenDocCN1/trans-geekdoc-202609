    # 14.3 INPUT DESTRUCTION PROBLEM


    Most quantum machine learning algorithms including quantum associative memory
    suffer from the input destruction problem (ID problem) [3, 126, 1]:


    +   - The input (reading) problem: The amplitude distribution of a quantum state
    is initialized by reading data points. The existing quantum algorithm requires
    only $O(\sqrt{n})$ steps or less and is faster than the classical algorithms,
    $n$ data points must be read. Hence, the complexity of the algorithm does not
    improve and is $O(n) + O(\sqrt{n})$.


    +   - The destruction problem: A quantum associative memory [114, 115, 110], [111,
    112] for $n$ data points for dimension $m$ requires only $m \cdot \log(n)$ or
    fewer'
