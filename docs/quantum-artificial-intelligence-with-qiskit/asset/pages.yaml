  md: 'considerable. The upper bound for large $n$ is


    $I = n^2 \log 2 = n^2 \cdot 0.693$


    the asymptotic capacity is 69.311 percent per bit which is much higher than most
    associative memories. This capacity is only valid for sparse equally distributed
    ones [75]. The promise of Willshaw''s associative memory that it can store much
    more patterns than the number of units. The cost of loading $L = (ln 2)(n^2/k^2)$
    patterns in $n$ units with $k = \log_2(n/4)$ is $O(n^2)$. It is much lower than
    storing the $L$ patterns in a list of $L$ units $O(n \cdot L)$. This is because
    $L > n$, or


    ```

    $O\left(\frac{n^2}{\log(n^2)}\right) > O(n)$

    ```


    since

    $\sqrt{n} > \log(n)$.


    The Lernmatrix has a tremendous storage capacity [75, 42], it can store much more
    patterns than the number of units.


    The description of how to generated efficiently binary codes of visual patterns
    or other data structure is described in [122, 89, 90]. For example, real vector
    patterns have been binarized.


    # 15.2 MONTE CARLO LERNMATRIX


    The suggested probabilistic retrieval rule for the determination of the answer
    vector $\mathbf{y}$ for the query vector $\mathbf{x}$ is


    $p(y_i=1|\mathbf{x}) = \frac{1}{n}\left(\frac{net_i}{\sum_{v=1}^n net_v}\right)$


    and


    $p(y_i=0|\mathbf{x}) = \frac{1}{n}\left(1 - \frac{net_i}{\sum_{v=1}^n net_v}\right)$


    describing the probability of firing or not firing of one unit with


    sum_{i=1}^n p(y_i=1|\mathbf{x}) + p(y_i=0|\mathbf{x})$


    During the query operation unit is randomly sampled and either it fires or not
    according to the probability distribution. To determine the answer vector, we
    must sample the Monte Carlo Lernmatrix several times. For the reconstructed vector,
    three states will be present: 1 for fired units, 0 for not fired units, and *unknown*
    for silent units. The Monte Carlo Lernmatrix is a close description of the quantum
    Lernmatrix. In quantummatrix units are represented by quantum states, sampling
    corresponds to the measurement.'
