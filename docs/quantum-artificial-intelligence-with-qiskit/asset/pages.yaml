  md: '# 118 Quantum Artificial Intelligence with Qiskit


    knowledge [54], [71]. A lack of applicable knowledge is present if it cannot be
    decided rule to use or no rule can be applied for a certain mental state represented
    in the working memory.


    An extension of the proposed SOAR cognitive architecture by a quantum production
    system would lead to a hybrid architecture. The quantum production system would
    be invoked if an impasse were present. Such a hybrid approach would speed up the
    learning process without a need for domain-specific control knowledge. Quantum
    SOAR architecture described by a quantum computer would allow faster planning
    of actions, like for example flying a plane or support better face-to-face dialogues
    with humans.


    # 8.4 CONTROL FUNCTION


    In the following chapters 9-11 we will give examples how quantum production systems
    may be used to solve popular artificial intelligence applications and describe
    the implementation in more details. In these applications all productions cannot
    fire at the same time, instead several instantiations of productions can be executed.
    The control function determines if a production can fire or not. The preconditions
    are matched against the contents of the working memory. If the preconditions are
    met, then the productions can fire at the same time. All the productions that
    can fire are mapped in superposition and are instantiated. In the next step all
    instantiated productions fire and change the contents of the working memories
    in the superposition.'
