    # 2.2.2 Representation


    A quantum mechanical description of a physical system is related to a probabilistic
    representation; it is described by a vector in Hilbert space. This description
    extends the two- or three-dimensional Euclidean space into spaces that have finite
    or infinite number of dimensions. In such a space, the Euclidean norm is induced
    by the inner product


    ```

    $|x| = \sqrt{\langle x|x\rangle} (2.1)

    ```


    Without a scalar product there is no orthogonality. In a Hilbert space, two vectors
    are orthogonal if and only if the scalar product is zero. A basis of $n$ dimensional
    Hilbert space $\mathcal{H}_n$ is chosen. A 2-state system is described by a two-dimensional
    space $\mathcal{H}_2$. For the basis


    ```

    $e_1 = \left(\begin{pmatrix} 1 \ 0\end{pmatrix}\right), e_2 = \left(\begin{pmatrix}
    0 \ 1\end{pmatrix}\right) (2.2)

    ```


    the system is described by a vector x with complex numbers $\omega_1, \omega_2$
    that represent the amplitude of each dimension


    ```

    $x = \omega_1 \cdot e_1 + \omega_2 \cdot e_2 = \left(\begin{pmatrix} \omega_1
    \ \omega_2\end{pmatrix}\right) (2.3)

    ```


    The probabilities are real numbers between 0 and 1. The probability that the system
    is in $e_1$ and $e_2$ is $|\omega_1|^2$ and $|\omega_2|^2$. This is because the
    product of complex number with conjugate is always a real number


    ```

    $$\omega^* \cdot \omega = (x-y \cdot i) \cdot (x+y \cdot i) = x^2 + |\omega|^2
    (2.4)

    ```


    The vector representing a state is normalized. Its length is one. The amplitudes
    correspond to the probability with


    ```

    $|\omega_1|^2 + |\omega_2|^2 = 1.

    ```


    Paul Dirac introduced the following notation for a vector x describing a state


    ```

    $|x\rangle = |\omega_1 \cdot e_1\rangle + |\omega_2 \cdot e_2\rangle = |\omega_1
    |x\rangle + |\omega_2 |x\rangle = \left(\begin{pmatrix} \omega_1 \ \omega_2\end{pmatrix}\right)
    (2.5)

    ```


    with


    ```

    $|e_1\rangle = |x\rangle

    ```


    It is a shorthand notation for a column vector. Related to the scalar product
    $\langle x|x\rangle$ row vector are $|x|$ "bra" and column vectors are $|x\rangle$
    "ket" from bra(ket). A state vector is just a particular instance of a ket vector.
    It is specified by a particular choice of basis and refers to observable that
    can have some system properties.'
