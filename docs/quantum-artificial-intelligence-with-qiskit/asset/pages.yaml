  md: "# Quantum Artificial Intelligence with Qiskit\n\n+   - We redo the entanglement\
    \ of control qubit $c_1 = 1$ with the memory register $|ell|11\\dots1\rangle$.\n\
    \n+   - We redo the NOT gates operation to all memory registers.\n\n+   - We apply\
    \ the CNOT gate controlled by the load register ($pattern_p$) to the memory registers\
    \ of all the branches. As a result:\n  - The $pattern_p$ is represented in the\
    \ new memory registers of the memory branch and in the processing branch.\n  -\
    \ The memory registers of the already present memory branches are reconstructed\
    \ by the flip back operation of the CNOT gate.\n\n+   - We uncompute the memory\
    \ register of the processing branch ($c_2 = 1$) to the ground state $|00\\dots0\r\
    angle$ by the CCX gate.\n\n+   - We reset the load register to the ground state\n\
    \nNEXT\n\nWe convert the processing branch into a memory branch and store the\
    \ last pattern $pattern_j$ in its memory register. We reset the load register\
    \ to the ground state. As a result we represent the patterns in superposition\n\
