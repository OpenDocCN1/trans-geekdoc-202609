    # 9.3 SEARCH OF DEPTH TWO


    Grover''s amplification cannot be applied to fewer than four states. A search
    of depth one for the 3-puzzle results in two states and a search of depth in four
    states. The operator $L(2)$ that describes the search of depth is represented
    as


