    | $x_2$ | $w_{12}$ | $w_{22}$ | $w_{23}$ | $w_{m2}$ |

    | $x_n$ | $w_{1n}$ | $w_{2n}$ | $w_{3n}$ | $w_{mn}$ |

    | | $y_1$ | $y_2$ | $y_3$ | | $y_m$ |


