  md: "# 256 Quantum Artificial Intelligence with Qiskit\n\n```\n$= \\frac{1}{\\sqrt{n}}\
    \ \\cdot \\left(|0\\rangle + e^{2\\pi i \\cdot 0.2x_1} \\cdot |1\\rangle\\right)\
    \ \\otimes \\left(|0\\rangle + e^{2\\pi i \\cdot 0.2x_1} \\cdot |1\\rangle\\right)\
    \ \\otimes \\cdots \\\\n\\quad\\otimes \\left(|0\\rangle + e^{2\\pi i \\cdot x_m\
    \ \\cdots x_1} \\cdotcdot |1\\rangle\\right).$$\n```\n\nIf we set $\theta = 0.x_m\
    \ \\cdots x_1$, we can rewrite the equation as\n\n```\n$|y\\rangle = F_m \\cdot\
    \ |x\\rangle = \\frac{1}{\\sqrt{n}} \\sum_{y \\in B^m} e^{2\\pi i \\cdot y \\\
    cdot \\theta} \\cdot |y\\rangle = \\n= \\frac{1}{\\sqrt{n}} \\cdot \\left(|0\\\
    rangle + e^{2\\pi i \\cdot (\\theta^{m-1})} \\cdot |1\\rangle\\right) \\otimes\
    \ \\left(|0\\rangle + e^{2\\pi i \\cdot (\\theta^{m-2})} \\cdot |1\\rangle\\right)\
    \ \\otimes \\cdots \\\\n\\quad\\otimes \\left(|0\\rangle + e^{2\\pi i \\cdot (\\\
    theta^{2})} \\cdot |1\\rangle\\right).$$\n```\n\nFor m qubits, we define $C_{j+1}U^2$\
    \ in the following way. For $j \\in {0, 1, 2, \\cdots, m-1\\}$, the control qubit\
    \ $j+1$ of the $m$ qubits is set, $C_{j+1}U^2$ is applied to the target $|u\\\
    rangle$, otherwise not. The first step of the algorithm is\n\n```\n$|0^{\\otimes\
    \ m}\\rangle|u\\rangle$$\n```\n\nwith $|u\\rangle$ being the eigenvector of $U$.\
    \ In the first step of the algorithm we build a superposition of $m$ controls\n\
    \n```\n$H_m \\cdot |0^{\\otimes m}\\rangle|u\\rangle = \\frac{1}{\\sqrt{n}} \\\
    sum_{x \\in B^m} |x\\rangle|u\\rangle$$\n```\n\n```\n$= \\frac{1}{\\sqrt{n}} \\\
    cdot \\left(|0\\rangle + |1\\rangle\\right) \\otimes \\cdots \\otimes \\left(|0\\\
    rangle + |1\\rangle\\right) \\cdot |u\\rangle.$$$$\n```\n\nIn the second step\
    \ we apply $C_{j+1}U^2$ operators to the target $|u\\rangle$\n\n```\n$\\prod_{j=0}^{m-1}\
    \ C_{j+1}U^2 \\cdot \\frac{1}{\\sqrt{n}} \\cdot \\left(|0\\rangle + |1\\rangle\\\
    right) \\otimes \\left(|0\\rangle + |1\\rangle\\right) \\otimes \\cdots \\otimes\
    \ \\left(|0\\rangle + |1\\rangle\\right) \\cdot |u\\rangle = \\\\n= \\frac{1}{\\\
    sqrt{n}} \\cdot \\left(|0\\rangle + e^{2\\pi i \\cdot (\\theta^{m-1})} \\cdot\
    \ |1\\rangle\\right) \\otimes \\cdots \\\\n\\quad\\otimes \\left(|0\\rangle +\
    \ e^{2\\pi i \\cdot (\\theta^{2})} \\cdot |1\\rangle\\right) \\cdot |u\\rangle.$$$$\n\
    ```\n\nIn the third step we apply inverse QFT to the $m$ controls\n\n```\n$F_m\
    \ \\cdot \\frac{1}{\\sqrt{n}} \\sum_{y \\in B^m} e^{2\\pi i \\cdot y \\cdot \\\
    theta} \\cdot |y\\rangle = \\\\n= F_m \\cdot \\frac{1}{\\sqrt{n}} \\sum_{y \\\
    in B^m} e^{-2\\pi i \\cdot y \\cdot \\theta} \\cdot |y\\rangle = |x\\rangle|u\\\
    rangle.$$$$\n```\n\nIn the fourth step we measure the first register composed\
    \ of $m$ control qubits and estimate $\\theta$\n\n```\n$$\\theta = 0.x_m \\cdots\
    \ x_2x_1 = \\frac{x}{n}=\\frac{x}{2^m}.$$\n```"
