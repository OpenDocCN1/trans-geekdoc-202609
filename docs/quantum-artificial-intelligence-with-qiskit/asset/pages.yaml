  md: '# Five Pennies Nim Game


    Games involving two players represent one of the classic applications of symbolic
    problem solving. Starting with some initial game position, the algorithm explores
    the tree of all legal moves down to the requested depth. An example is the nim
    game in which two players take turn removing objects from distinct piles. A simplified
    version is the nim game with no piles, the five pennies nim game. Two players
    alternate remove one, two, or three pennies from a stack that initially contains
    five pennies. The player who pick up loses pennies. The five pennies nim game
    is a zero game where neither player has any legal options. The first player loses,
    and the second-player wins if correct moves are chosen.


    We indicate the architecture for the five pennies nim game and indicate that a
    quantum tree search cannot implement the minimax-algorithm. We can determine the
    search path, but we cannot model the behavior of the player that chooses the best
    move since we cannot compare different states that are described by different
    path descriptors.


    # 12.1 QUANTUM CIRCUIT


    In our implementation of the five pennies nim game we explore of legal moves to
    the depth of two [73]. In initial game the five pennies are represented by the
    qubits 0 to 4. Player A starts the game, he can remove one, two, or three pennies.
    The path descriptor is represented by two qubits 6 and 7. The qubit 5 is the flag
    that indicates the entanglement of a rule with the path descriptor. The first
    rule removes three pennies, the second pennies and the one penny. Since we have
    four possible paths, the three and four are identical. The player B has either
    a stack with three, four, or two pennies. Depending on the number of pennies,
    different rules can be executed, either the rule of type 1, type 2 or type 3.
    The correct type is identified and marked in the trace represented by the qubits
    8, 9, and 10, see Figure 12.1. Each of the rules is instantiated with the path
    descriptor and can be executed in parallel. The resulting states corresponding
    to one penny are marked by the oracle, see Figure 12.2. They correspond to the
    loss of player A, since the player who picks up the last loses pennies.'
