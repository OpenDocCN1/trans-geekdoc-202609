    # 5.5 DECOMPOSITION


    With the Grover''s amplification we have


    > $G_m = -(H_m \cdot \Lambda_m \cdot H_m)$


    How can we decompose $\Lambda_m$ by quantum gates? We know that for


    > $$\frac{1}{\sqrt{2}} \begin{pmatrix} 1 & 1 \ 1 & -1 \end{pmatrix} \cdot \frac{1}{\sqrt{2}}
    \begin{pmatrix} 1 & -1 \ 1 & 1 \end{pmatrix} = \begin{pmatrix} 1 & 0 \ 0 & -1
    \end{pmatrix}$


    and


    > $$\begin{pmatrix} 0 & 1 \ 1 & 0 \end{pmatrix} \cdot \frac{1}{\sqrt{2}} \begin{pmatrix}
    1 & 1 \ 1 & -1 \end{pmatrix} \cdot \frac{1}{\sqrt{2}} \begin{pmatrix} 1 & -1 \
    1 & 1 \end{pmatrix} = \begin{pmatrix} 0 & 1 \ 1 & 0 \end{pmatrix}$


    For three qubits we can define $\Lambda_3$ accordingly with


    > $X_3 = X \otimes X \otimes X$\n$H_0 = I \otimes I \otimes H$\n$\Lambda_3 = X_3
    \cdot H_0 \cdot CCX \cdot H_0 \cdot X_3$'
