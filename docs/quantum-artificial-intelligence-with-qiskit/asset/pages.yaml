    speed ups are analyzed [94] by ignoring the input problem, which is the main bottleneck
    for data encoding. We name the preparation of the input data the *sleep phase*.
    The query operation is extremely fast and will be called the *active phase*. The
    naming of the phases is in analogy to a living organism that prepares itself during
    the sleep for an active day. The advantage of quantum approach is present in the
