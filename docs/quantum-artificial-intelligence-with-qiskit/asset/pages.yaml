  md: '# Symbolic Representation ■ 103


    Objects cannot disappear or appear. A state is of object and attributes is described
    by fixed number bits that change its position, a rule corresponds to the permutation
    of bits. This kind of representation is related to the biological what principle.


    # 7.1.1 “What” and “Where”


    Gross and Misskin [34] suggested that the brain includes two mechanisms for visual
    categorization: one for the representation of the object and the other for the
    representation of localization [57, 52, 79]. The first mechanism is called the
    “what” pathway and is composed of the temporal lobe. The second mechanism is called
    the “where” pathway and is composed of the partial lobe [52, 79]. According to
    this division, the identity of a visual object can be coded apart from the location
    and the size of the object.


    # 7.2 TREE SEARCH AND PATH DESCRIPTORS


    Nodes and edges represent a search tree. Each node represents a state, and each
    edge represents a transition from one state to the following state. The initial
    state define the root of the tree. From each state, $B$ or $C$ states can be reached,
    or the state is a leaf. From a leaf, no other state can be reached, $B$ represents
    the branching factor of the node, the number of possible choices. A leaf represents
    either the goal of the computation or an impasse when there is no valid transition
    to a succeeding state. Every node beside the root has a unique node from which
    it was reached, which is called the parent. Each node and its parent are connected
    by an edge. Each parent has $B$ children, each has a reply of “yes” or “no” and
    can be represented by a bit (see Figure 7.1). The answers are represented by a
    binary number of length $m$. There are $n=2^m$ possible binary numbers of length
    $m$. Each binary number represents a path from the root to a leaf. For each goal,
    a certain binary number indicates the solution. For a constant branching factor
    $B>2$, each question has $B$ possible answers. The $m$ answers can be represented
    by $m$ digits. For example, with $B=8$, the number is represented by $2^3$ bits.
    These numbers represent all paths from the root to the leaves.


    # 7.3 QUANTUM TREE SEARCH


    In a quantum computation, we can simultaneously represent all possible path descriptors.
    This is one descriptor for each leaf of the search tree. Using Grover’s algorithm,
    we search through all paths and verify each path leads to the goal state. This
    type of procedure is a quantum tree search [107, 119]. For $n=B^m$ paths are (approximately)
    $\sqrt{n}$ (see Figure 7.2). A constraint of this approach is that we know the
    depth $m$ of the search tree in advance. The advantage can be overcome by iterative
    deepening in iterative deepening search. During the iterative deepening search,
    the states are generated multiple times [51, 87]. The time complexity of the iterative
    deepening search is of the same order of magnitude as a search to the maximum
    depth [51], as explained by Richard E. Korf: Since the number of nodes on a given
    level of the tree grows'
