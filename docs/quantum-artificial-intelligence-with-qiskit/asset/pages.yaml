  md: "# 284 Quantum Artificial Intelligence with Qiskit\n\nfrom qiskit.utils import\
    \ algorithm_globals\nalalgorithm_globals.random_seed = 3142\n\nimport numpy as\
    \ np\nnp.random.seed(algorithm_globals.random_seed)\n\nfrom qiskit_machine_learning.datasets\
    \ import ad_hoc_data\nTRAIN_DATA, TRAINING_LABELS, TEST_DATA, TEST_LABELS = (\n\
    ad_hoc_data(training_size=10,\ntest_size=5,\ngap=0.3,\nonehot=False)\n\nfrom qiskit.circuit.library\
    \ import ZZFeatureMap, TwoLocal\nFEATURE_MAP = ZZFeatureMap(feature_dimension=2,\
    \ reps=2)\nVAR_FORM = TwoLocal(2, ['rz', 'rz'], 'cz', reps=2)\nAD_HOC_CIRCUIT\
    \ = FEATURE_MAP.compose(VAR_FORM)\n\nfrom sklearn.preprocessing import OneHotEncoder\n\
    encoder = OneHotEncoder()\ntraining_labels_oh = encoder.transform(TRAIN_LABELS.reshape(-1,\
    \ 1),\n.toarray()\ntest_labels_oh = encoder.transform(TEST_LABELS.reshape(-1,\
    \ 1),\n.toarray())\n\nfrom qiskit.algorithms.optimizers import SPSA\n\n```\nclass\
    \ OptimizerLog:\n    \"\"\"to store optimizer's intermediate results\"\"\n   \
    \ def __init__(self):\n        self.evaluations = []\n        self.parameters\
    \ = []\n        self.costs = []\n    def update(self, evaluation, parameter, cost,\
    \ _stepsize, _accept):\n        \"\"\"Save intermediate results. Optimizer passes\
    \ five values\n        but we ignore the last two.\"\"\"\n        self.evaluations.append(evaluation)\n\
    \        self.parameters.append(parameter)\n        self.costs.append(cost)\n\
    ```\n\n```\n#initial_point = np.random.random(VAR_FORM.num_parameters)\ninitial_point\
    \ = np.array([0.3200227, 0.6506368, 0.55995053,\n0.96656228, 0.38243769, 0.94030904,\n\
