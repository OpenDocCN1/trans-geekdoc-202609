    #  15.4.1 Generalization


    We generalize the description of $n$ units. After the entanglement of index qubits
    in superposition with the weight vectors following the state is, the state $count_j$
    and $unit_j$ are represented by $[111]$, $[112]$,


    ```

    $$\frac{1}{\sqrt{n}} \left( \sum_{j=1}^{n} |index_j\rangle |unit_j\rangle \right)
    \otimes |query\rangle. \quad (15.18)$

    ```


    with the cost $O(n^2)$. We apply to the control qubit (ignoring the index qubits)


    ```

    $$\frac{1}{\sqrt{2}} (|0\rangle + |1\rangle) \otimes \left( \sum_{j=1}^{n} |count_j\rangle
    |unit_j\rangle \right) \otimes |query\rangle = $$

    $$\frac{1}{\sqrt{2} \cdot n} \cdot |0\rangle \left( \sum_{j=1}^{n} |count_j\rangle
    |unit_j\rangle \right) \otimes |query\rangle + $$

    $$\frac{1}{\sqrt{2} \cdot n} \cdot |1\rangle \left( \sum_{j=1}^{n} |count_j\rangle
    |unit_j\rangle \right) \otimes |query\rangle. \quad (15.19)$

    ```'
