  md: '# 44 Quantum Artificial Intelligence with Qiskit


    Another difference is present in the qiskit machine learning algorithms library.
    We will use one example in the chapter 23 where two different notebooks for the
    variational classifier are present.


    # 3.5 EXAMPLE: QUANTUM COIN


    We start with a very simple example, the quantum coin. The quantum coin is a system
    with two basis states 0 and 1 with


    ```

    $|0\rangle = \begin{pmatrix} 1 \ 0 \end{pmatrix}, |1\rangle = \begin{pmatrix}
    0 \ 1 \end{pmatrix}. \quad (3.1)$

    ```


    The mapping is represented as


    ```

    $|0\rangle \rightarrow \frac{1}{\sqrt{2}}|0\rangle + \frac{1}{\sqrt{2}}|1\rangle.
    \quad (3.2)$

    ```


    and


    ```

    $|1\rangle \rightarrow \frac{1}{\sqrt{2}}|0\rangle - \frac{1}{\sqrt{2}}|1\rangle.
    \quad (3.3)$

    ```


    The corresponding operator is indicated by the following unitary matrix,


    ```

    $W = \frac{1}{\sqrt{2}} \begin{pmatrix} 1 & 1 \ 1 & -1 \end{pmatrix} = \frac{1}{\sqrt{2}}
    \cdot \begin{pmatrix} 1 & 1 \ 1 & -1 \end{pmatrix}. \quad (3.4)$

    ```


    If the system starts in state |0⟩ and undergoes the time evolution, the probability
    of observing 0 or 1 is $|\frac{1}{\sqrt{2}}|^2=1/2$. If we do not perform a measurement
    and repeat the mapping, the probability of observing 0 becomes zero and observing
    1 becomes one. This is due to the fact, that the amplitudes of [1] cancel each
    other. This effect is due to destructive interference and cannot occur in the
    probability distribution since all coefficients are non-negative real numbers.


    Either start an Anaconda Navigator or the Visual Studio Code editor (or any other
    editor that supports Jupyter). New file, Jupyter Notebook, select the correct
    channel by indent the environment name. Hadamard matrix H is represented in qiskit
    by the Hadamard gate qc(qubit) where qc is a quantum circuit with the chosen name
    qc (you can choose as well as another name, through the book we use the name qc).
    The quantum coin is defined with the basis state as |0⟩


    ```

    $H|0\rangle = \frac{1}{\sqrt{2}}|0\rangle + \frac{1}{\sqrt{2}}|1\rangle. \quad
    (3.5)$

    ```


    We define a quantum circuit with one qubit by


    ```

    qc = QuantumCircuit(1)

    ```


    In a qiskit quantum circuit, all qubits are initialized with the state |0>. The
    Hadamard gate H acts on the qubit zero, the qubits in a circuit are numbered 0,
    1, .dots . In our circuit we have just one qubit.'
