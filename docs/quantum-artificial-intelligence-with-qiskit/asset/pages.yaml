  md: '# 232 Quantum Artificial Intelligence with Qiskit


    providing that the control qubit is in state $|1\rangle$ with


    ```

    $$\frac{1}{\sqrt{2}} \cdot (|0, x, y\rangle + |1, x, y\rangle) \rightarrow \frac{1}{\sqrt{2}}
    \cdot (|0, x, y\rangle + |1, y, x\rangle) \quad (16.18)$

    ```


    We apply another Hadamard gate on the control qubit


    ```

    $$(W \otimes I_m \otimes I_m) \cdot (\frac{1}{\sqrt{2}} \cdot (|0, x, y\rangle
    + |1, y, x\rangle)) =$\n$\frac{1}{2} \cdot |0\rangle \cdot (|x, y\rangle + |y,
    x\rangle) + \frac{1}{2} \cdot |1\rangle \cdot (|x, y\rangle - |y, x\rangle) \quad
    (16.19)$

    ```


    The probability of measuring the control qubit in state $|0\rangle$ is given by


    ```

    $p(0) = |\frac{1}{2} \cdot (|0\rangle) \cdot (|0, x, y\rangle + |1, x, y\rangle)
    + \frac{1}{2} \cdot (|0\rangle) \cdot (|0, y, x\rangle + |1, y, x\rangle)||^2$\n$\p(0)
    = |\frac{1}{4} \cdot (|x, y\rangle + |y, x\rangle)|^2$\nnp(0) = |\frac{1}{4} \cdot
    (\langle y|y\rangle\langle x|x\rangle\langle x|x\rangle\langle y|y\rangle + \langle
    x|y\rangle\langle y|x\rangle + \langle y|x\rangle\langle x|y\rangle)|$\n$\p(0)
    = |\frac{1}{4} \cdot (1 + \langle x|y\rangle\langle y|x\rangle + \langle y|x\rangle\langle
    x|y\rangle)|$\n$\p(0) = |\frac{1}{2} \cdot (\langle y|x\rangle\langle x|y\rangle
    + \langle x|y\rangle\langle y|x\rangle)|$\n$\p(0) = \frac{1}{2} + \frac{1}{2}|\langle
    x|y\rangle|^2 \quad (16.20)$$\n$\p(1) = \frac{1}{2} - \frac{1}{2}|\langle x|y\rangle|^2
    \quad (16.21)$

    ```


    and


    with


    ```

    $|\langle x|y\rangle| \approx \sqrt{2 \cdot p(0) - 1} = \sqrt{|1 - 2 \cdot p(0)}}
    \quad (16.22)$

    ```


    The probability $p(0) = 0.5$ means that the states $|x\rangle$ and $|y\rangle$
    are orthogonal, whereas the probability $p(0) = 1$ indicates that the states are
    identical. We have to perform several measurements to estimate $p(0)$ or $p(1)$.
    The estimated scalar product is positive and since the vectors are normalized
    the inner product corresponds to the angle $\varphi$ between the vectors


    ```

    $0 \le \cos\varphi = |\langle x|y\rangle| \le 1 \quad (16.23)$

    ```


    and is usually called the cosine similarity. We can estimate the Euclidean distance
    as well, since the distance for normalized vectors is constrained to a unit sphere
    with


    ```

    $0 \le ||\mathbf{x} - \mathbf{y}||_2 \le \sqrt{2}. \quad (16.24)$

    ```'
