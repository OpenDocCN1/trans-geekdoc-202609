- pgno: 89
  md: '# Quantum Gates


    Quantum gates are the building blocks of quantum circuits, like classical logic
    gates are for conventional digital circuits. Unlike classical logic gates, quantum
    logic gates are reversible and can be described by unitary matrices. First, we
    introduce Boolean quantum gates that allow us to map any Boolean circuit in such
    a way that the circuit becomes reversible. Such a circuit represents a permutation
    in Hilbert space and can be represented by a permutation matrix composed of the
    unitary matrices representing the quantum gates. We then describe quantum gates
    for one qubit, like Clifford elements of the Clifford group and can be efficiently
    simulated with a classical computer. Parameterized gates play an important role
    in quantum machine learning. A parameterized rotation gate is a parameterized
    gate with the parameter representing the amount of rotation to be performed around
    the three axes. We introduce the controlled-U gates and introduce the unitary
    decomposition of transpilation. Translation is a complex problem of finding an
    optimal decomposition into the present quantum gates for quantum computer.


    # 4.1 BOOLEAN ALGEBRA AND THE QUANTUM GATES


    The following quantum gates are quantum gates that allow us to map any Boolean
    circuit in such a way that the circuit becomes reversible. To make a circuit reversible,
    we must make each of the gates reversible. A necessary condition for a reversible
    gate is that of a bijective function with m inputs and m outputs. For each quantum
    Boolean AND, OR operation to be reversible an auxiliary qubit is required. The
    complexity of the circuit corresponds to the number of used quantum gates. A Boolean
    quantum circuit represents a permutation in Hilbert space and can be represented
    by a unitary permutation matrix composed of the unitary matrices representing
    the quantum gates. This mapping does not alter the distribution of the amplitudes;
    the distribution remains unchanged during the execution of the quantum gates.
    The probability of measuring certain states is the same before and after the computation.'
  merge: -1
  img_proc: true
