  md: '8 Quantum Artificial Intelligence with Qiskit


    # 1.2.3 Production Systems


    Problems in symbolic AI are often described by the representation of a problem
    space and a search procedure [73]. Problem-solving can be modeled by a production
    system that implements a search algorithm. The search defines a problem space
    and can be represented by a tree. The production system in the context of classical
    AI and Cognitive Psychology is one of the most successful computer models of human
    problem solving. The production system theory describes how to form a sequence
    of actions, which lead to a goal, and offers a computational theory of how humans
    solve problems [7].


    Production systems are composed of if-rules that are also called productions.
    A production system is composed of [17, 61]:


    +   - The long-term memory is modeled by a set of productions.

    - The short-term memory or working memory that represents the states. This memory
    contains a description of the state in a production process. The state is described
    by logically structured representation and is simply called a pattern. When a
    premise is true, the production (the rule) fires (is executed). It means that
    the conclusions of the productions changes the contents of the working memory.

    - The focus of attention, also called the recognize-act cycle. If several productions
    can be applied to the working memory, conflict resolution chooses a production
    from the conflict set for firing. There are different conflict resolution strategies,
    such as choosing a random production from the set, or selecting a production using
    some function.


    The computation is done in the following steps. The working memory is initialized
    with the initial state description. The patterns in working memory are matched
    against the premise of the production. The premise of the production that match
    the patterns in working memory produces a set, which is called the conflict set.
    One of the productions of this set is chosen using the conflict resolution and
    the resolution of the production changes the content of the working memory. This
    process is denoted as firing of the production. This cycle is repeated on the
    modified working memory until a goal is reached or no productions can. An example
    of such production is the 8-puzzle. The 8-puzzle is composed of eight movable
    tiles in a 3 x 3 frame. One cell of the frame is empty; as a result, tiles can
    be moved around to form different patterns. The goal is to find a series of moves
    off into the blank space that changes the board from the initial configuration
    to a goal configuration.


    The long-term memory is specified by four productions [61]:


    +   - If the empty cell is not on the top edge, then move the empty cell up;

    - If the empty cell is not on the left edge, then move the empty cell left;

    - If the empty cell is not on the right edge, then move the empty cell right;

    - If the empty cell is not on the bottom edge, then move the empty cell down.'
