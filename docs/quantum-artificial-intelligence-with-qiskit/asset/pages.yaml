- pgno: 208
  md: '# 13.4 COMPARISON


    The method developed by Ventura and Martinez [114, 115] leads to the superposition


    ```

    $|\psi\rangle = \left( \frac{1}{\sqrt{m}} \sum_{j=1}^{m} |pattern_j\rangle \otimes
    |0\cdots0; 0, 0\rangle \right)$

    ```


    while the entanglement of binary pattern vectors leads to the superposition


    ```

    $|\psi\rangle = \left( \frac{1}{\sqrt{m}} \sum_{j=1}^{m} |index_j\rangle|pattern_j\rangle
    \right)$

    ```


    The method of entanglement of binary pattern is easier to understand and implement
    allows us to address the patterns through the index. The same pattern can be represented
    several times with a different index, however the dimension of the vectors in
    superposition is $dim(n + \log_2(m))$ compared to the dimension $dim(n)$ of Ventura
    and Martinez method.'
