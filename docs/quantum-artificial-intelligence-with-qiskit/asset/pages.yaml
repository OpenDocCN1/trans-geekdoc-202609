- pgno: 221
  md: '# # Quantum Lernmatrix


    We introduce quantum Lernmatrix based on Lernmatrix where $n$ units are stored
    in the quantum superposition. Lernmatrix is an associative-memory-like architecture.
    During the retrieval phase quantum counting of ones based on Euler''s formula
    is used for the pattern recovery as proposed by Trugenberger. We demonstrate how
    to represent the quantum Lernmatrix by a quantum circuit and perform experiments
    using gostkit. We introduce a tree-like structure that increases the measured
    value of correct answers. During the active phase quantum Lernmatrices are queried
    and the results are estimated efficiently. The required time is much lower compared
    to the conventional approach or of Grover''s algorithm.


    # 15.1 LERNMATRIX


    Different associative memory models have been proposed over the years [5], [42,
    49], [6, 10]. The Hopfield model represents a recurrent model of the associative
    memory [5], [46], [44], it is a dynamical system that evolves until it has to
    a stable state. The Lernmatrix, or Wilhelm''s associative memory also simply called
    “associative memory” (if no confusion with other models is possible [6, 10]),
    it was developed by Steinbuch in 1958 as a biologically inspired model for the
    effort to explain the psychological phenomena of conditioning [103, 104]. The
    goal was to produce a network that could use a binary vector of vectors. Later
    this model was studied under biological and mathematical aspects by Wilhelm [124]
    and Palm [75, 76] and it was shown that this simple model has a tremendous storage
    capacity.


    Lernmatrix is composed of a cluster of units. Each unit represents a simple model
    of a biological neuron. Each unit is composed of binary vectors, which correspond
    to the synapses and dendrites in a real neuron (see Figure 15.1). They are described
    by $w_{ij} \in \{0,1\}$ in Figure 15.2. T is the threshold of the unit. The presence
    of a feature is indicated by a “one” component of the vector, its absence through
    a “zero” component of the vector. A pair of these vectors is associated and this
    process of association is called learning. The first of the two vectors is called
    the *query vector* and the second, the *answer vector*. After learning, the query
    vector is presented to the associative memory and the answer vector is determined
    by the retrieval rule.'
