    binary rather than decimal, and was designed to be stored-program computer [116],
    [9]. A digital computer is a device that processes information represented in
    discrete means as symbols. Unlike, the symbols are represented in binary form.
    In a digital circuit, the information is represented by binary digits. By a digital
    representation, the exact values of each computation can be reproduced since there
    are no external influences. The computation can be repeated, and the result remain
    the same. Binary digits are represented by the minimal unit of information, with
    the values 0 or 1. The binary information is manipulated by Boolean digital circuits.


    With the rise of digital computers, AI was founded as a distinct discipline at
