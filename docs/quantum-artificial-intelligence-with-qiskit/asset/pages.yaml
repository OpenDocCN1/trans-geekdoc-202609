    # Quantum Kernels – Chapter 17


    A quantum computer can estimate a quantum kernel, and the estimate can be used
    by a kernel method on a classical computer. This is because the exponential quantum
    advantage in evaluating inner products allows us to estimate the quantum kernel
    directly in the higher dimensional space. We give an example of quantum kernels
    and the swap test. We then describe quantum kernels and the inversion test. Quantum
    feature maps encode classical data into quantum data via a parametrized quantum
    circuit. Parameterized quantum kernels are based on superposition and entanglement.
    They are hard to simulate classically and could lead to an advantage over the
    classical ML approach. The inversion test is based on the usual use of estimating
    the fidelity (similarity) between two states. We describe an example using the
