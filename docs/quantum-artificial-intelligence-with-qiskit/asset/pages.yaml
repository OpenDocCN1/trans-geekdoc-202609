  md: "# 20.1.1 Example with $T$ Gate\n\nThe $T$ gate corresponds to the unitary matrix\n\
    \n```\n$T = \\begin{pmatrix} 1 & 0 \\ 0 & e^{i\\pi/4} \\end{pmatrix}$\n```\n\n\
    With the eigenvector $|1\\rangle$ and the eigenvalue $e^{2\\pi\\theta}$\n\n```\n\
    $U \\cdot |u\\rangle = T|u\\rangle = e^{2\\pi\\theta} \\cdot |u\\rangle = e^{2\\\
    pi\\theta} \\cdot |1\\rangle \\quad (20.9)$\n```\n\nwith the phase $\\theta=\f\
    rac{1}{8}$ since\n\n```\n$T|1\\rangle = e^{2\\pi\\theta} = e^{i\\pi/4} \\cdot\
    \ |1\\rangle = e^{2\\pi/4} \\cdot |1\\rangle$.\n```\n\nThe phase estimation algorithm\
    \ will write the phase of $T$ to $m$ qubits in our simple case $m=3$. The value\
    \ of $m$ determines the precision of the result.\n\n```\n$\\theta = x_0x_1x_2\
    \ = \\frac{x}{2^3}$\n```\n\nThe controlled $T$ gate is represented by the controlled\
    \ phase gate $CP(\\lambda)$ where $\\lambda=\\pi/4$. The circuit is composed of\
    \ 4 qubits, qubits 0, 1, 2 represent the 3 qubits in the control register. The\
    \ qubit 3 represents the eigenvector $|1\\rangle$. The control register is mapped\
    \ into superposition by Hadamard gates and the qubit 4 is initialized to the eigenvector\
    \ $|1\\rangle$ with the NOT gate. The control register controls the unitary operations\
    \ $T$ applied to the target eigenvector $|1\\rangle$ resulting in the Fourier\
    \ representation of the three control qubits. To estimate the phase $\\theta$,\
    \ we perform the inverse QFT to the 3 control qubits and measure the three quits\
    \ and estimate with $\\theta$\n\n```\n$x = |q_2q_1q_0\\rangle$\n```\n\nand\n\n\
    ```\n$\\theta = \\frac{x}{2^3}$\n```\n\nThe circuit is represented as (See Figure\
    \ 20.1)\n\n```\nimport np\nfrom qiskit import QuantumCircuit, Aer, execute\nfrom\
    \ qiskit.quantum_info import Statevector\nfrom qiskit.visualization import plot_histogram\n\
    from qiskit.circuit.library import MCXGate\nfrom math import pi\nfrom qiskit.circuit.library\
    \ import QFT\nqc = QuantumCircuit(4, 3)\nqc.h(0)\nqc.h(1)\nqc.h(2)\nqc.x(3)\n\
    qc.cp(lambda, control, target)\nqc.cp(pi/4, 0, 3)\n```"
