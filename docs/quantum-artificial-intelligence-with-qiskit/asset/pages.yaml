    [67]. This is called the McCulloch-Pitts model of a neuron. The percept algorithm
    was invented in 1957 by Frank Rosenblatt [86] and was inspired by the McCulloch-Pitts
    model of neuron. Perceptron describes a simple algorithm for supervised learning.
    In the 1960s, an active research program concerning ML with artificial neural
    networks was carried out by Rosenblatt.


    During the early analog computers were developed in the years 1930-1950. An analog
    computer represents information by analog means, such as voltage. And the algorithm
