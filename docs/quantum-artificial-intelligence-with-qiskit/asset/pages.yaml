  md: '# Quantum Lernmatrix 197


    This rule is called the binary Hebbian rule [75]. Every time a pair of vectors
    is stored, this rule is used.


    In the *one-step* retrieval phase of the associative memory, a fault tolerant
    answer-mechanism recalls the appropriate answer vector for a query vector x. The
    retrieval for the answer of vector y is:


    ```

    $net_i = \sum_{j=1}^{n} w_{ij}x_j,$

    ```


    ```

    $y_i = \begin{cases} 1 & \text{if } net \geq T \ 0 & \text{otherwise.} \end{cases}$

    ```


    where $T$ is the threshold of the output. The threshold $T$ is set to the number
    of "one" components in the query vector x, $T := |x|$. If the output of the unit
    is 1 we say that the units fires, for out the unit does not fire. The cost of
    the *one-step* retrieval is $O(n \cdot m)$. The retrieval is called:


    +   - association if both vectors are different $x \neq \mathbf{y}$,

    - association, if $x = \mathbf{y}$, the answer vector represents the reconstruction
    of the disturbed query vector.


    For simplicity we assume that the dimension of the query vector and the answer
    are the same, $n = m$.


    Example In Figure 15.3, the vector pair $\mathbf{x}_1 = (1, 0, 0, 0, 1)$ and $\mathbf{y}_1
    = (0, 1, 1, 1, 0)$ are learned. The corresponding binary weights of the associated
    pair are indicated by a black square. In the next step the vector pair $\mathbf{x}_0
    = (0, 1, 1, 0, 1)$ and $\mathbf{y}_2 = (1, 1, 0, 0, 1)$ are learned. The corresponding
    binary weights of the associated pair are indicated by a black circle. In third
    step the retrieval phase is performed (see Figure 15.4). The query vector $\mathbf{x}_q
    = (0, 1, 0, 0, 1)$ differs by one bit to the learned vector $\mathbf{x}_2 = (0,
    1, 1, 0, 1)$. The threshold $T$ is set to the number of "one" components in the
    query vector the retrieved vector $\mathbf{y}_2 = (1, 1, 0, 0, 1)$ that was stored.


    # 15.2 Storage Capacity


    We analyze the optimal costs of the Lernatrix. For an estimation of the asymptotic
    number $L$ of vector pairs $(x,y)$ that can be stored in an associative memory
    before it begins to make mistakes in the retrieval phase, it is assumed that both
    vectors have the same dimension $n$. each composed of $k$ ones, which are equally
    likely to be in any coordinate of the vector. In this case it was shown [75, 42,
    102] that the optimum value for $k$ is approximately


    ```

    $k \leq \log_2(n/4).$

    ```


    For example, for a vector of the dimension $n=1000000$ only $k=18$ ones should
    be used to code a pattern according to the Equation 15.3. For an optimal value
    for $k$ according'
