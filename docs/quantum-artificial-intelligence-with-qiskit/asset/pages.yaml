    256 states. With $k=1$ the maximal amplitude values is one, with $k=8$ the maximal
    amplitude values is $0.3535=\frac{1}{\sqrt{8}}$ also with a smaller period [121].


    # 5.3.2 Circuit Representation


    Grover’s amplification (for $m \geq 2$) is based on $G_m=-Q_z$. The unitary operator
    reverses the sign of $|0\rangle$


    > $$\Lambda_m \cdot |0\rangle = -|0\rangle$$


    and for $|x\rangle \neq |0\rangle$


    > $$\Lambda_m \cdot |x\rangle = -|x\rangle$$


    Then we can write


    > $G_m=-Q_z=-I_m+2 \cdot P_m=2 \cdot P_m-I_m=(H_m \cdot \Lambda_m \cdot H_m) \quad
    (5.17)$


    with


    > $H_m \cdot \Lambda_m \cdot H_m=\begin{pmatrix} 1-\frac{2}{n} & \dots & \dots
    & \dots \ \dots & \frac{2}{n} & \dots & \frac{2}{n} \ \dots & \dots & \dots &
    \dots \ \dots & \frac{2}{n} & \dots & 1-\frac{2}{n} \end{pmatrix} \quad (5.18)$


    # 5.4 NUMPY EXAMPLE WITH MATRIX NOTATION


    We demonstrate the principles of Grover’s amplification using the matrix notation
    before explaining how to represent the algorithm with quantum gates. We will use
    *Python* and the *NumPy* library that is a part of the *qiskit* installation.
    We will demonstrate the example of $m=3$, means $8=2^3$ different states. First
    we will built $H_3$ matrix by (tensor) Kronecker product operation $kron$ of $H$
    matrix.


