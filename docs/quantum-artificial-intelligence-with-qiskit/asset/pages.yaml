  md: '# Quantum Kernels


    A quantum computer can estimate a quantum kernel and the estimate can be used
    by a kernel method on a classical computer. This is because the exponential quantum
    advantage in evaluating inner products allows to estimate the quantum kernel directly
    in the higher-dimensional space. We give an example of quantum kernels and the
    swap test. Quantum feature maps encodes classical data into quantum data via a
    parametrized quantum circuit. Parameterized quantum circuits are based on superposition
    and entanglement. They are hard to simulate classically and could lead to an advantage
    over classical learning approach. The inversion test is based on the ideal usual
    of estimating the fidelity (similarity) between two states. We describe an example
    using qiskit command ZZFeatureMap. We then indicate how quantum kernel is plugged
    into classical kernel methods like support vector machines.


    # 17.1 QUANTUM KERNELS


    For a quantum state $|\phi(x)|$ and $|\phi(y)|$, the inner product of two states
    is called a quantum kernel


    ```

    $k(\mathbf{x}, \mathbf{y}) = \langle\phi(\mathbf{x})|\phi(\mathbf{y})\rangle$

    ```


    with an inner product


    ```

    $(\mathbf{x} \cdot \mathbf{y}) = \mathbf{x}^T \cdot \mathbf{y} . $

    ```


    The absolute value of the inner product can be estimated by the swap test [95].


    # 17.2 QUANTUM KERNELS AND SWAP TEST


    A quantum computer can estimate a quantum kernel and the estimate can be by a
    kernel method on a classical computer [95]. This is because the exponential quantum
    advantage in evaluating inner products allows to estimate the quantum kernel maps
    directly in the higher-dimensional space. If the result is impossible to be simulated
    on a classical computer, then the kernel is classically intractable [94]. We can
    map


    ```

    $|\phi(\mathbf{x})\rangle \rightarrow |\mathbf{x}\rangle \otimes \cdots \otimes
    |\mathbf{x}\rangle = |\mathbf{x}\rangle^{\otimes m}$

    ```'
