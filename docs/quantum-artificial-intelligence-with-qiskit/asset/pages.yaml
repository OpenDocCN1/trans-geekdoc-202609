    # 1.3.1 Vector Representation


    In ML a sub-symbolical or distributed representation is used. One form of distributed
    representation corresponds to vectors. A vector **x** of dimension $D$ is represented
    as


    ```

    \mathbf{x} = \begin{pmatrix} x_1 \ x_2 \ \vdots \ x_D \end{pmatrix} = (x_1, x_2,
    \dots, x_D)^T,$$

    ```


    with each dimension $x_i$ representing a value like for a real number. One can
    measure the distance between two $D$ dimensional vectors by a distance function
    like the Euclidean distance function


    ```

    $d(\mathbf{x}, \mathbf{y}) = ||\mathbf{x} - \mathbf{y}|| = \sqrt{|x_1 - y_1|^2
    + |x_2 - y_2|^2 + \dots + |x_D - y_D|^2},$

    ```


    or the Taxicab or Manhattan metric $d_1$


    ```

    $d_1(\mathbf{x}, \mathbf{y}) = ||\mathbf{x} - \mathbf{y}||_1 = |x_1 - y_1| + |x_2
    - y_2| + \dots + |x_D - y_D|.$ (1.2)

    ```


    The dot product or scalar product is represented as,


    ```

    $$\langle\mathbf{x}|\mathbf{y}\rangle = \sum_{i=1}^D y_j \cdot x_j.$

    ```


    The scalar product is commutative


    ```

    $$\langle\mathbf{x}|\mathbf{y}\rangle = \mathbf{x}^T \cdot \mathbf{y} = \mathbf{y}^T
    \cdot \mathbf{x} = \langle\mathbf{y}|\mathbf{x}\rangle.$

    ```


    However, matrix multiplication between vectors is not commutative,


    ```

    $$\mathbf{x}^T \cdot \langle\mathbf{x}|\mathbf{y}\rangle = \begin{pmatrix} y_0
    & y_1 \end{pmatrix} \cdot \begin{pmatrix} x_0 \ x_1 \end{pmatrix} = y_0 \cdot
    x_0 + y_1 \cdot x_1$$

    ```


    is different from


    ```

    $$\mathbf{x} \cdot \mathbf{y}^T = \langle\mathbf{y}|\mathbf{x}\rangle = \begin{pmatrix}
    y_0 \ y_1 \end{pmatrix} \cdot \begin{pmatrix} x_0 & x_1 \end{pmatrix} = \begin{pmatrix}
    y_0 \cdot x_0 & y_0 \cdot x_1 \ y_1 \cdot x_0 & y_1 \cdot x_1 \end{pmatrix}.$$

    ```


    In quantum physics, shorthand notation for a column vector and a vector is used
    which is less confusing. Related to the scalar product $\langle\mathbf{x}|\mathbf{y}\rangle$,
    row vectors $\mathbf{x}^T$ are $\langle\mathbf{x}|$ “bra” and column vectors $\mathbf{y}$
    are |kets” from bra(c)kets.'
