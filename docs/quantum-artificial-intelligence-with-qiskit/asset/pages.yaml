    You can find instruction for qiskit at the site:


    https://qiskit.org/documentation/getting_started.html.


    From there you have well access to online tutorials.


    Before installing qiskit you have to launch a prompt in Anaconda or a terminal.
    From there you can call conda. To install qiskit execute following commands, Create
    an environment with the name qiskit (or any other name you like)


    ```

    conda create -n qiskit python 3

    ```


    You can list all your environments with command


    ```

    conda-env list

    ```


    You activate the qiskit environment with the name ENV_NAME . Then you can activate
    it with the command


    ```

    conda activate ENV_NAME

    ```


    You start the installation with the


    ```

    pip install qiskit

    pip install qiskit[visualization]

    ```


    and for newer versions of macOS


    ```

    pip install ''qiskit[visualization]''

    ```


    We can check the installed qiskit version with (see Figure 3.1).


    ```

    import qiskit.tools.jupyter

    %qiskit_version_table

    %qiskit_copyright

    ```


    # 3.3 BACKEND SIMULATOR FUNCTIONS


    Qiskit provides different backend simulator functions by Aer package. We will
    use two simulators.


    +   The statevector simulator performs an ideal execution of qiskit circuits and
    returns the final state vector after application (all qubits). The state vector
    of the circuit can represent the probability values (probability in newer version)
    that correspond to the multiplication of the state vector by the unitary matrix
    that the statevector simulator will take longer than other simulation methods
    and requires more computer memory, since the state vector dimension grows exponentially
    with the number of qubits with n = 2^m (with m number of qubits).'
