  md: '# Qiskit


    We describe how to install qiskit and demonstrate the two main backend simulator
    functions that we will use. We demonstrate the working principles of qiskit software
    development kit on the simple example of a quantum coin. We indicate how to represent
    simple quantum circuits by unitary matrices and get unitary command. We indicate
    step by step to define quantum circuits on an example of four-bit conjunction.
    The concept of un-computation is introduced since in quantum computing we cannot
    reset qubits to zero. The Deutsch algorithm determines if an unknown function
    $f: B^1 \rightarrow B^1; f(x) = y$ of one bit is constant or not by calling the
    function once. Deutsch''s algorithm was the first (1985) that demonstrated a quantum
    advantage; it is a proof of that, in certain settings, quantum computers are strictly
    more powerful than classical ones by reduction in query complexity over the classical
    class. Finally, we give an example how to run Deutsch algorithm on a real small
    quantum computer.


    # 3.1 SOFTWARE DEVELOPMENT KIT


    Qiskit is an open-source software development kit (SDK) for working with quantum
    computers at the level of circuits and algorithms [21]. IBM Quantum, https://quantum-computing.ibm.com/.
    It provides tools for creating and manipulating quantum programs and running them
    on quantum devices or simulators on a local computer. It follows the quantum circuit
    model for universal quantum computation, and can be used for any quantum hardware
    that follows this model. Qiskit is based on Python, you can find all information
    about it at https://qiskit.org.


    # 3.2 INSTALLATION


    Before installing qiskit you should either install Anaconda, a cross-platform
    Python distribution for scientific computing that includes Jupyter. You can also
    install Miniconda, a free minimal installer for conda. It is a small, bootstrap
    version of Anaconda that includes only conda, Python, the packages they depend
    on, and a small


    > ^1The author acknowledges the use of IBM Quantum services for this work. The
    views expressed are those of the author, and do not reflect the official policy
    or position of IBM or the IBM Quantum team.


    DOI: 10.1201/9781003373404-3'
