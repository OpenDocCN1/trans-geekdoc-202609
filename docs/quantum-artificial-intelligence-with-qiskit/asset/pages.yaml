    its momentum. Classical mechanics is usually valid at the macro scale. The changes
    in the position and the momentum of the object over time are described by the
    Hamiltonian equation of motion. The state of the object is described by the Hamiltonian
    function. At micro scale the observations are described by quantum physics. Light
    appears in chunks that can be quantized. An individual chunk is called quantum,
    a quantum of light is called a photon [27]. Quantum theory gets its name from
    this property, which it attributes to all measurable physical quantities. A photon
    can be described by a wave function if it is isolated from its environment. The
    wave function in quantum mechanics, if unobserved, evolves in a smooth and continuous
    way according to the Schrödinger equation, which is related to the Hamiltonian
    equation of motion. This equation describes a linear superposition of different
