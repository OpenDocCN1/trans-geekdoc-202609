  md: 'There are two classes:


    +   * No permutation *i)* or permutation of all elements *ii)* indicates that
    the function is constant.


    +   * Permutation of two elements *iii)* indicates that the function is non-constant.


    The algorithm to determine if $f(x)$ is constant or not is composed of four steps.
    In the first step of the algorithm we build a superposition of two qubits


    ```

    $H_2 \cdot |01\rangle = H_1 \cdot |00\rangle \otimes |1\rangle = \frac{|0\rangle+|1\rangle}{\sqrt{2}}
    \otimes \frac{|0\rangle-|1\rangle}{\sqrt{2}} = \nH_2 \cdot |01\rangle = \frac{1}{2}
    \cdot ((00) - |01| + |10| - |11)).$.

    ```


    ```

