- pgno: 171
  md: '# Blocks World


    The blocks world is a planning domain in artificial intelligence [73]. The blocks
    can be placed at the table and picked up and set down on a table or another block,
    and the goal is to build one or more vertical stacks of blocks. Only one block
    may be moved at a time and any blocks that are under another block cannot be moved.
    There are three different types of blocks. They differ by attributes such as color
    (red, green, and blue) or marks, but not by form. In Artificial intelligence (AI),
    they are traditionally called A, B, and C blocks [6]. The simplicity of this toy
    problem allows to compare classical branching with quantum computing approach.
    We indicate how the binding of the stats is achieved through the entanglement.
    We indicate how to represent the states with a class descriptor and the position
    descriptor (adjective) and perform a search of depth. The A, B, and C planning
    problem results in a non-constant branching factor. We show again that the branching
    factor is reduced by Grover''s amplification to the square root of the average
    branching factor and not to the maximal branching factor.


    # 11.1 REPRESENTATION


    The class descriptor and the position descriptor (adjective) moves. It is reverse
    as in the puzzle examples, the reverse in this case is a more economic representation
    requiring 9 qubits, three qubits for each block (see Figures 11.1 and 11.2). The
    architecture uses 27 qubits, for representation of the state, 1 for flag and 13
    qubits to represent the 13 categories of rules. The path descriptor for the depth
    search is represented by three qubits, since the number of maximal instaurations
    is six.


    ```

    qc = QuantumCircuit(27)

    #State Preparation 0-8

    # Flag 9

    #1st Trace (ten) 10-22 Rule Classes

    #1Path descriptor represented by three qubit

    qc.h(23)

    qc.h(24)

    qc.h(25)

    #Preparation of Aux

    qc.x(26)

    ```'
