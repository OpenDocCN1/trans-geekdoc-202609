    # #12.2 LIMITATIONS OF QUANTUM TREE SEARCH


    In quantum tree search we cannot use the minimax-algorithm [125], [61]. We can
    determine the search path, but we cannot model the behavior of the player that
    chooses the best move, since we cannot compare different states described by different
    path descriptors. The comparison of alternative states is the basis of the minimax-algorithm.
    The minimax-algorithm explores the tree of all legal moves down to the requested
    depth. Scores associated with leaves of the tree are calculated using an evaluation
    function. A positive score indicates a good position for player A and a negative
    score indicates a good position for player B. For each player, the transition
    from one position to another is either maximized for player A or minimized for
    player B. By comparing the scores the players try to select the moves in a manner
    that will be most profitable for them.'
