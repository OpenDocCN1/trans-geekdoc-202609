    space. A 2-state quantum system is described by a two-dimensional Hilbert space.
    A 2-state quantum system corresponds to a qubit. A register is composed of several
    qubits and is defined by the tensor product. We describe the principles of computation
    with $n$ and $m$ qubits, introduces the principles of entanglement, cloning and
