  md: "can verify in polynomial time if one instance of many represents a solution,\
    \ but no algorithm on a conventional computer exists that determines the solution\
    \ efficiently in time. A problem is called $NP-complete$ if all instances must\
    \ be examined by the conventional computer. A conventional computer can only solve\
    \ a problem by checking all possible instances after the one other. No other algorithm\
    \ exists, we cannot speed up the computation. It was not obvious that an $NP-complete$\
    \ problem exists. Cook-Levin described the first example of an $NP-complete problem,\
    \ the SAT problem. Until, thousands of other problems are known to be $NP-complete$,\
    \ including the well-known traveling salesman and Hamiltonian cycle problem [2].\
    \ Clearly the class $P \\subseteq NP$ is known, and it follows that $NP \neq P$\
    \ or $NP = P$; however, other relationships are not. The class $NP-complete$ is\
    \ present if the problem is in $NP$ and every other problem in $NP$ can be reduced\
    \ to the class $NP-complete$.\n\nDespite the fault of Grover's algorithm is $O(\\\
    sqrt{n}) = O(2^{\\frac{n}{2}})$ compared to $O(n) = O(2^n)$ is huge, $NP-complete$\
    \ problems remain $NP-complete$ on a quantum computer.\n\n# 6.3 SAT PROBLEM AND\
    \ GROVER'S ALGORITHM\n\nIn the next step apply Grover's algorithm to a marked\
    \ state of three qubits. Our solution corresponds to the Boolean formula\n\n```\n\
    $$\\phi = (x_1 \\leftrightarrow x_2) \\wedge (x_1 \\wedge x_2) \\wedge x_3$$\n\
    ```\n\nthat evaluates true, which is case for $x_1 = 1, x_2 = 0$, and $x_3 = 0$.\
    \ In this case, the state determined by the oracle function with the solution\
    \ encoded by $(-1)^{o(x)}.$\n\n# 6.3.1 Quantum Boolean Circuit\n\nWe define the\
    \ oracle function using the quantum gates and six qubits with the Toffoli gates\
    \ and NOT gates and six qubits.\n\nThe operation $(x_1 \\wedge x_2)$ is represented\
    \ by the AND operation, the ancilla qubit 2 is set to 0, $x_1$ is represented\
    \ by qubit 0, and $x_2$ by qubit 1\n\n```\n$ccX(x_0, x_1, 0) = (x_0, x_2, x_1\
    \ \\wedge x_2)$\n```\n\nqc.ccx(0,1,2)\n\nand the result of the operation is represented\
    \ in the qubit 2. The operation $(x_1 \\leftrightarrow x_2)$ is represented by\
    \ the $XOR$ and $NOT$ operation, $x_1$ is set to 1 corresponding to the qubit\
    \ 3. The $XOR$ operation is executed\n\n```\n$ccX(1, x_2, x_3) = (1, x_2, x_2\
    \ \\oplus x_3)$\n```\n\nthe result of the $XOR$ operation is written in qubit\
    \ 1, then the $NOT$ operation is performed\n\n```\n$X(x_2 \\oplus x_3) = \\neg(x_2\
    \ \\oplus x_3)$\n```"
