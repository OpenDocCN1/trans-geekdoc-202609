    # 15.4.4 Tree-Like Structures


    We want to increase the probability of measuring the correct units representing
    the ones in the answer value and decrease the probability of measuring the zeros.
    For example, in a sparse code with $k$ nodes, $k$ measurements of different ones
    reconstruct the binary answer vector and we cannot use the idea of applying Trugen
    amplification several times indicated before. Instead we can increase the probability
    of measuring one by the introduced tree-like structure [91]. The tree-like hierarchical
    associative approach is based on aggregating neighboring units [91]. The aggregation
    is a Boolean OR based transform for two or three neighboring weights of units
    resulting in a more dense memory, see Figure 15.17. It was shown by computer experiments
    that the aggregation between two and three is optimal [92]. The more dense memory
    is copied on top or the original memory. Depending on the number of units we can
    repeat the process in which we aggregate groups of two to three neighboring groups
    of equal units. We continue the process until we arrive in different groups of
    different units, the number of possible different aggregated memories is logarithmic,
    with $\log(n-1)$. Since in our example only four units are present we aggregate
    two results in a memory of four described by 2 identical units.


    The query vector is composed of $\log(n-1)$ concatenated copies of the original


    ![](img/52faec2d621d75e53089d939bb234a82_244_0.png)


    Figure 15.17 a) In our example, we store three patterns $\mathbf{x}_1 = (1, 0,
    0, 1)$, $\mathbf{y}_1 = (1, 0, 0, 1)$; $\mathbf{x}_2 = (1, 0, 0, 0)$, $\mathbf{y}_2
    = (0, 1, 0, 0)$ and $\mathbf{x}_3 = (0, 0, 1, 0)$, $\mathbf{y}_3 = (0, 0, 1, 0)$
    and the query vector is $\mathbf{x}_q = (1, 0, 0, 1)$. (b) The aggregation is
    a Boolean OR based transform for two neighboring results of units resulting in
    a more dense memory with $\mathbf{x}_q = (1, 0, 0, 1, 1, 0, 0, 1)'
