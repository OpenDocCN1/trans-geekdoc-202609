    #  1.3.8 Deep Learning


    The limitations of a perceptron do not apply to feedforward networks with nonlinear
    units, also called multilayer perceptrons trained by the backpropagation learning
    algorithm. According to the universality theorem, a neural network with a single
    hidden layer trained by backpropagation is capable of approximating any continuous
    function. Attempting to build a network with only one layer to approximate complex
    functions often requires a very large number of nodes (“fat” neural networks).
    The immediate solution is to build networks with more hidden layers. Empirical
    experiments indicate that “deep” neural networks give better results than “fat”
    neural networks, see Figure 1.8. The term “Deep Learning” was introduced to the
    ML community by Rina Dechter in 1986 [25] and to artificial networks by Igor Aizenberg
    and colleagues in 2000 [4]. Deep artificial networks uses many hidden layers to
    increase the model’s power in statistical learning, see Figure 1.9.


    ![](img/52faec2d621d75e53089d939bb234a82_47_1.png)


    Figure 1.9 A feed forward network with hidden layers is called a deep network,
    in our example the network has five hidden layers. They are referred to as hidden
    layers because the outputs of the units in the hidden layer is not the output
    of the network. The input of the network is $x_1, x_2, \dots X_D$ and the output
    $y_1, y_2$, and $y_3$ that indicates a presence of a classified object.'
