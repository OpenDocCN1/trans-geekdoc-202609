  md: "# 114 Quantum Artificial Intelligence with Qiskit\n\nIn quantum computation\
    \ it is not possible to reset the information to the pattern representing the\
    \ initial state. Instead we un-compute the output back to the input before applying\
    \ the amplification step of Grover's algorithm. We use the qiskit inverse command\
    \ inverse() to define the inverse operation by a function.\n\n```\ndef rules_inv():\n\
    \    qc=rules()\n    qc_inv=qc.inverse()\n    qc_inv.name=\"RULES_INV\"\n    return\
    \ qc_inv\n```\n\nA search of depth two is described by a path descriptor of four\
    \ qubits, 11, 12, 13, and 14. The Grover amplification act on the qubits 13, 18,\
    \ and 23 that describe the path descriptor resulting in 16 states and we use the\
    \ qiskit def function.\n\n```\ndef Grover():\n    qc = QuantumCircuit(16)\n  \
    \  #Diffuser 11, 12, 13, 14\n    qc.h([11,12,13,14)\n    qc.x([11,12,13,14)\n\
