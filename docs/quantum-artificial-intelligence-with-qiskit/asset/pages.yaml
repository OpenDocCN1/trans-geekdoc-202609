- pgno: 1
  md: '# Quantum Artificial Intelligence with Qiskit


    Quantum Artificial Intelligence (QAI) is a new interdisciplinary research field
    that combines quantum computing with Artificial Intelligence (AI), aiming to use
    the unique properties of quantum computers to enhance the capabilities of AI systems.
    *Quantum Artificial Intelligence with Qiskit* provides a cohesive overview of
    the field of QAI, providing tools for readers to create and manipulate quantum
    programs on devices as accessible as laptop computers.


    Introducing symbolic quantum algorithms, sub-symbolical quantum algorithms, and
    quantum Machine Learning (ML) algorithms, this book explains each process step
    by step with as-associated Qiskit listings. All examples are additionally available
    for download at https://github.com/andrzejwichert/qai.


    Allowing readers to learn the basic concepts of quantum computing on their home
    computers, this book is accessible to both the general readership as well as students
    and instructors of courses relating to computer science and AI.'
