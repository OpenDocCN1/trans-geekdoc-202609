    # Phase Estimation – Chapter 20


    The Kitaev''s Phase Estimation Algorithm (also referred to as a quantum eigenvalue
    estimation algorithm), is a quantum algorithm to estimate the phase (or eigenvalue)
    of an eigenvector of a unitary operator. We explain the algorithm and indicate
    an example of the determination of eigenvalue of the $T$ gate. Then we introduce
    the quantum counting algorithm based on the quantum phase estimation algorithm
    and on Grover''s search algorithm. The quantum counting algorithm is a quantum
    algorithm for counting the number of solutions for a given search problem.


    # Quantum Perceptron – Chapter 21


    The classical perceptron describes an algorithm for supervised learning considers
    only linearly separable problems in which groups can be separated by a line or
    hyperplane. The quantum perceptron does not usually include learning, but instead
    computes the output of a binary unit (neuron) efficiently. It is based on the
    Kitaev''s phase estimation algorithm. A quantum perceptron can be used as a building
    block of larger systems and it can process any arbitrary number of input vectors
    in parallel. We present a simple example of the quantum perceptron for two-dimensional
    input.


    # HHL – Chapter 22


    The quantum algorithm for linear systems of equations is one of the fundamental
    algorithms expected to provide a speedup over their classical counterparts. In
    honor of its inventors Arrow Harrow, Avinatan Hassidim, and Seth Lloyd, it is
    called the HHL algorithm. HHL is going to be one of the useful subroutines for
    any quantum ML algorithm because almost all ML uses some form of a linear system
    of equations. For example, in support vector machines and quantum support vector
    machines, maximizing the objective function with the optimum values of the Lagrange
    multipliers are based on solving linear equations. We describe the HHL algorithm,
    give an example step by step using qiskit command HamiltonianGate, and indicate
    the constraints of the algorithm.'
