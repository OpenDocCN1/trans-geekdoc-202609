- pgno: 281
  md: "# # Phase Estimation\n\nThe Kitaev's Phase Estimation Algorithm (also referred\
    \ to as quantum eigenvalue estimation algorithm) is a quantum algorithm to estimate\
    \ the phase (or eigenvalue) of an eigenvector of a unitary operator. We explain\
    \ the algorithm and indicate an example of the determination of the eigenvalue\
    \ of the $T$ gate. Then we introduce the quantum counting algorithm that is based\
    \ on the quantum phase estimation algorithm and on the Grover's search algorithm.\
    \ Quantum counting algorithm is a quantum algorithm for counting the number of\
    \ solutions for a given search problem.\n\n# ## 20.1 KITEV'S PHASE ESTIMATION\
    \ ALGORITHM\n\nGiven a unitary operator $U$ on $m$ qubits with an eigenvector\
    \ $|u\rangle$ with an unknown eigenvalue $e^{2\\pi i\theta}$, we want to determine\
    \ the phase $\theta$ [48], [47]. If we apply $U$ to $|u\rangle$ we get\n\n```\n\
    $U|u\\rangle = e^{2\\pi i\\theta}|u\\rangle. \\eqquad (20.1)\n```\n\nif we apply\
    \ $U^w$ to $|u\rangle$ we get\n\n```\n$U^w|u\\rangle = U^{w-1}\\cdot(e^{2\\pi\
    \ i\\theta}|u\\rangle) = (e^{2\\pi i\\theta})^w \\cdot |u\\rangle = e^{2\\pi i\\\
    theta w}|u\\rangle. \\eqquad (20.2)\n```\n\nHowever, we will not gain any information\
    \ because $|u\rangle$ are equivalent states and they represent the same state\
    \ when a measurement is preformed. Instead of the unitary operator $U^w$, we use\
    \ the controlled $U^w$ operator $CU^w$. If the control qubit is then $U$ applied\
    \ to the target qubits, other $CU^w$ is reversible and defines an injective mapping\
    \ onto two qubits that is\n\n```\n$CU^w\\cdot|0]|u\\rangle = |0]|u\\rangle, CU^w\\\
    cdot|1]|u\\rangle = (e^{2\\pi i\\theta w})\\cdot |u\\rangle) = e^{2\\pi i\\theta\
    \ w}\\cdot |1]|u\\rangle$.\n```\n\nSo with $2^j$\n\n```\n$CU^2\\cdot|left(\\frac{|0|+|1|}{\\\
    sqrt{2}}\\right)|\\cdot|u\\rangle = \\left(\\frac{|0|+e^{2\\pi i\\theta 2}}{\\\
    sqrt{2}}\\right)|\\cdot|u\\rangle$.\n```\n\nThe QFT is represented as a tensor\
    \ product of single-qubit operations. The QFT can be factored into the tensor\
    \ product of $m$ single-qubit operations,\n\n```\n$|y\\rangle = F_m \\cdot |x\\\
    rangle = \\frac{1}{\\sqrt{2^m}} \\sum_{y\\in B^m} e^{2\\pi i y \\cdot x} \\cdot\
    \ |y\\rangle =$\n```"
  merge: -1
  img_proc: true
