  md: '# Quantum Fourier Transform


    A periodic function can be represented in the frequency space. The frequency is
    the number of occurrences of a repeating event per one unit of time. If something
    changes rapidly, then we say that it has a high frequency. If it does not change
    rapidly, i.e., it changes smoothly, we say that it has a low frequency. The discrete
    Fourier transform converts discrete time-based or space-based data into the frequency
    domain. We describe the DFT and indicate the relation to quantum Fourier transform
    (QFT). We indicate how the QFT can be factored into the tensor product of $m$
    single-qubit operations and implemented by basic quantum gates. We demonstrate
    examples of QFT for two, three, and four qubits. We then indicate that the circuit
    for $m$ qubits can be imported from the qiskit library. We analyze the QFT costs
    and give an simple example of its operation.


    #  19.1 DISCRETE FOURIER TRANSFORM


    The DFTs discrete time-based or space-based data into the frequency sequence-based
    data. Given a sequence


    $\alpha_t : [1, 2, \dots, n] \rightarrow C$.


    The DFT produces a sequence $\omega$:


    $\omega_f : [1, 2, \dots, n] \rightarrow C$.


    The DFT of $\alpha(t)$ is


    $\omega_f = \frac{1}{\sqrt{n}}\sum_{t=1}^{n} \alpha_t \cdot e^{-2\pi i(t-1) \frac{(f-1)}{n}}$


    its wave frequency is $\frac{(f-1)}{n}$ events per sample. The inverse DFT of
    $\omega_f$ is


    $\alpha_t = \frac{1}{\sqrt{n}}\sum_{f=1}^{n} \omega_f \cdot e^{2\pi i(t-1) \frac{(f-1)}{n}}$.'
