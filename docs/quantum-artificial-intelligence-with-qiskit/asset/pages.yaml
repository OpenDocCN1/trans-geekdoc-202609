    For example, it is now common to identify AI with deep learning.


    We divide the AI domain into two branches: symbolic AI and statistical machine
    learning (ML). Symbolic AI deals with symbolic representations and problem solving,
    and statistical (ML) is based on distributed representations.


    We give a short history of AI, and then we describe the principles of the two
    main branches of AI, symbolic AI and statistical ML.


