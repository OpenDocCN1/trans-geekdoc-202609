  md: "# Quantum Production System ■ 107\n\n+   - $\\delta$ is the control function\
    \ of the form $\\Sigma \rightarrow L \times \\Sigma \times h$. It chooses a production\n\
    and fires it or halts $h$.\n\nIf $C(\\gamma) = (p, \\gamma', h)$, then the working\
    \ memory symbol $\\gamma$. It is substituted by\na production $p$ by $\\gamma'$\
    \ or the computation halts $h$. The computation halts if the goal\n$\\gamma$ is\
    \ reached or an impasse is present, no production can be applied.\nProduction\
    \ systems are closely related to the approach of Markov algorithms [02];\nsimilar\
    \ these approaches, production systems are equivalent in power to a Turing\nmachine\
    \ [113]. A Turing machine can also be easily simulated by a production system;\n\
    thus, a production is a complete model of computation. The search represented\n\
    a search tree is performed from an initial state through the following states\
    \ until\na goal is attained.\n\n# 8.1.1 Quantum Production Systems\n\nQuantum\
    \ production systems are related to pure production systems since the com-\nputation\
    \ is not continued in the branch if an impasse is present, no backtracking to\n\
    a previous state. Unlike the pure production systems no control system\n$C$ exists\
    \ since all productions are executed simultaneously.\nQuantum production system\
    \ can operate independently of whether the computa-\nterminates; in case of non-termination,\
    \ the computation continues forever,\nand the iterations not terminate. The quantum\
    \ production system also provides\na maximal speed of $O(\\sqrt{n})$ the Turing\
    \ machine simulation allows $n$ multiple\ncomputational branches [108].\n\nA future\
    \ quantum computer based on a quantum production system will involve\nclassical\
    \ artificial-intelligence programming languages, such as OPS5 [17]. OPS5 pro-\n\
    grams are executed by matching the working memory elements with productions in\n\
    t long-term memory [30]. Thus, the programmer is not required to contend with\n\
    quantum gates, nor is he or she to address the principles of quantum compu-\n\
    t. It is equivalent to current programmers who specify their algorithms in high-\n\
    level languages, such as Java or Python, without the requirement of understanding\n\
    the nature of electronic circuits or semiconductor devices, such as a transistor.\n\
    \n# 8.2 EXAMPLE: SORTING A STRING\n\nWe demonstrate a pure production systems\
    \ for sorting of string with:\n\n+   - $\\Sigma: a, b, c, d$ composed of four\
    \ letters\n- $W$ is the working memory. It represents a state $\\gamma \\in \\\
    Sigma$ by a string of five letters\n- The long-term memory $L$, the set of $B\
    \ = 6$ productions\n\n+   1. $ab \rightarrow ba$\n2. $ac \rightarrow ca$\n3. $ad\
    \ \rightarrow da$"
