    # 3.4 COMPATIBILITY


    The presented quantum circuits in the book involve mostly simple quantum circuits
    using basic quantum gates that can be easily ported to other software development
    kits. You can download the examples (Jupyter notebooks) from the book from https://github.com/andrezweweigart/qai.


    The Qiskit software development kit (SDK) is in constant development and there
    are changes between different versions. The programs were tested with Qiskit 0.34.2
    version running on an older computer with 8 Gb and Qiskit 0.43.0 version running
    on a modern computer with 16 Gb. The main differences concerning the examples
    are the annotation on the legends of the histograms. In older version the histogram
    annotation on the left side is always "Probabilities". In newer version the annotation
    uses the used simulator. The statevector annotation is for the qasm simulator
    "Count". Quasi-probability concept is introduced in order to apply quantum corrections
    to classical statistical mechanic. Quasi-probability distribution does not satisfy
    all the properties of a conventional probability distribution, for example it
    can take negative values for states which have no classical model due to quantum-mechanical
    interference. However, the corresponding effects do not play any role in our simulations
    as described in this book.'
