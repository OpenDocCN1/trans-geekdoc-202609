  md: '# qRAM


    Quantum memory is proposed as an analogue to classical computer memory, like the
    random-access memory (RAM). RAM is a form of computer memory that can be read
    and changed in any order, typically used to store working data. In quantum machine
    learning domain, the usage of quantum random memory (qRAM) is proposed to avoid
    input destruction problem. We demonstrate the bucket brigade architecture of qRAM.
    The method of qRAM is related to the entanglement of the index qubits that are
    in the superposition with the patterns. We demonstrate an example of binary patterns
    and indicate why the representation of amplitude coding leads to the same complexity
    as a recall operation on a classical RAM.


    # 18.1 QUANTUM RANDOM ACCESS MEMORY


    In quantum machine learning domain, the usage of qRAM [32] is proposed to avoid
    input destruction problem (ID problem) [59], [39]. A qRAM copies basis states
    [32] and load the i-th binary pattern into the second register


    ```

    $|i\rangle \rightarrow |x^i\rangle$. (18.1)

    ```


    with $|x^i\rangle$ being a basis state representing a binary vector. Such an operation
    can be executed in parallel


    ```

    $\frac{1}{\sqrt{m}} \sum_{i=1}^m |i\rangle \rightarrow \frac{1}{\sqrt{m}} \sum_{i=1}^m
    |x^i\rangle$, (18.2)

    ```


    with time complexity increasing the preparation cost of query (due to the input
    problem) is $O(\log(m))$.


    # 18.1.1 The Bucket Brigade Architecture of qRAM


    The bucket brigade architecture of qRAM is inspired by the traditional RAM architecture
    and consists of three main parts:


    +   * Addressing qubits: Address for the memory cell we wish to read. In order
    to read a memory cell, the user must encode the address of memory cell to the
    addressing qubits. This address can be in superposition so that several patterns
    can be read in one step.'
