    # 16.5 SWAP TEST


    We cannot access the amplitudes that represent vectors, but we estimate (x|y)
    using the swap test. Each state represents a normalized vector for the dimension
    n represented by m = log2 n qubits. The quantum |x⟩ and |y⟩ are of length one
    in the l2 norm,


    > |x|y>|_2 = 1, |y>| = ||y||_2 = 1.


    The additional auxiliary qubit |0⟩ generates


    > |0⟩ ⊗ |x⟩|y> = |0, x⟩


    Apply Hadamard on the control qubit |0⟩,


    > (H ⊗ Im ⊗ Im) · 0|x,y> = 1/√2 · (|0, x,y> + |1, x,y>) (16.17)


    Apply controlled swap operator on |x⟩ and |y⟩ states that swaps |x⟩ and |y⟩


    > |x> → |y>|x⟩'
