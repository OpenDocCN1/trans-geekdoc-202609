  md: "# 5.1.1 Quantum Oracle\n\nWe represent $n$ states in a superposition, each\
    \ state has the same positive amplitude. A parallel computation is applied to\
    \ all the $n$ states, and the state with the solution $o(x) = 1$ is marked by\
    \ a minus sign, the amplitude is now negative. We then apply a linear operation\
    \ that is based on Householder reflection; by the reflection the value of the\
    \ marked amplitude grows linearly.\n\nFor the function $o(x)$, the solution is\
    \ encoded by $(-1)^{o(x)}$, the sign of the amplitude. To see why the solution\
    \ is encoded by $(-1)^{o(x)}$, we indicate the derivative. The unitary operator\
    \ $T$ represents the quantum oracle function $o(x)$ that determines if the configuration\
    \ is the goal\n\n```\n$T \\cdot |x\rangle|c\rangle = |x\rangle|o(x) \\oplus c\r\
    angle$\n```\n\nThe auxiliary qubit $c$ is set to zero, and the state is represented\
    \ by $m$ qubits $|0^m\rangle$. First, we set qubits representing the states and\
    \ the auxiliary qubit in superposition for $m+1$ qubits $H_{m+1}$, and then we\
    \ execute the Hadamard gate operator $T$\n\n```\n$T \\cdot H_{m+1} \\cdot |0^m\r\
    angle|1\rangle=\\\\frac{1}{\\sqrt{2^{m+1}}} \\cdot \\sum_{x \\in B^m} T \\cdot\
    \ |x\rangle|0\rangle - \\frac{1}{\\sqrt{2^{m+1}}} \\cdot \\sum_{x \\in B^m} |x\r\
    angle|o(x) \\oplus 1\rangle=\\\\frac{1}{\\sqrt{2^{m+1}}} \\cdot \\sum_{x \\in\
    \ B^m} |x\rangle|o(x) \\oplus 0\rangle - \\sum_{x \\in B^m} |x\rangle|o(x) \\\
    oplus 1\rangle \\quad (5.2)\n```\n\nThere are four possible cases with the state\
    \ $|\\xi\rangle$ being the solution:\n\n```\n$T \\cdot |x\rangle|0\rangle = |x\r\
    angle|o(x) \\oplus 0\rangle = |x\rangle,\\nT \\cdot |x\rangle|1\rangle = |x\r\
    angle|o(x) \\oplus 1\rangle = -|x\rangle,\\nT \\cdot |\\xi\rangle|0\rangle = |\\\
    xi\rangle|f(\\xi) \\oplus 0\rangle = |\\xi\rangle,\\nT \\cdot |\\xi\rangle|1\r\
    angle = |\\xi\rangle|f(\\xi) \\oplus 1\rangle = -|\\xi\rangle$.\n```\n\nIt follows\
    \ that\n\n```\n$$\\frac{1}{\\sqrt{2^{m+1}}} \\cdot \\left( \\sum_{x \\neq \\xi}\
    \ |x\\rangle|0| + |\\xi\\rangle - \\sum_{x \\neq \\xi} |x\\rangle|1| - |\\xi\\\
    rangle \\right)\\\\\\\\frac{1}{\\sqrt{2^m}} \\sum_{x \\in B^m} (-1)^{o(x)} \\\
    cdot |x\\rangle \\otimes \\sqrt{\\frac{(|0-|1|)}{\\sqrt{2}}} . \\quad (5.3)\n\
    ```\n\nThe value of the function $o(x)$ is encoded by $(-1)^{o(x)}$, the operation\
    \ is a phase kickback. We can set the auxiliary qubit $c = \\frac{|0-|1\\rangle}{\\\
    sqrt{2}}$ to zero by the Hadamard gate."
