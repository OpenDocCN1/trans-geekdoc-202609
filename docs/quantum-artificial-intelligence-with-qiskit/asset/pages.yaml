- pgno: 19
  md: 'Preface ■ xix


    3-puzzle. The goal is to find a series of moves that changes the board from the
    initial configuration to a desired configuration. We describe the representation
    of the rules (productions) of the long-term memory and describe the search of
    depth one, two and three. The search of depth three results in eight possible
    states. The solution is marked by an oracle and Grover''s amplification is applied
    once. To increase the probability value of the solution we will apply Grover''s
    amplification. The solution corresponds to the path descriptor that indicates
    the sequence of rules (productions) that changes the board from the initial configuration
    to a desired configuration.


    # 8 Puzzle - Chapter 10


    The n-puzzle is a classical problem for modeling algorithms. For n-puzzle there
    are n+1 objects: n cells and empty cell. Each object can be coded by $\rho = [log
    n+1]$ qubits and a configuration of $n+1$ objects can be represented by a register
    of $z := \rho \cdot (n+1)$. The function $g(x)$ is represented unitary operator
    $T$ acts on the $n+1$ cells $x \in B^2$ and $c \in B^1$.


    ```

    $T(x) = |x|f(x) \oplus c$.

    ```


    We indicate how to extend the 3-puzzle to the 8-puzzle resulting in a non-constant
    branching factor. We show that the branching factor is reduced by Grover''s amplification
    to the square root of the average branching factor and not to the maximum branching
    factor. Simple experiments of the search of the depth requires already 49 qubits.
    The experiments indicate that the presented methods can be extended to a search
    of any depth, given more qubits are present.


    # Blocks World - Chapter 11


    The blocks world is a popular domain in AI another [73]. The blocks can be placed
    on the table and picked up and set down on another table and the goal is to build
    one or more vertical stacks of blocks. Only one block may be moved at a time and
    any blocks that are under block cannot be moved. There are three types of blocks.
    They differ by attributes such as color (red, green, and blue) or marks, not by
    them. In AI, they are traditionally called A, B, C [61]. The simplicity of this
    problem allows to compare classical approach with quantum computing. We indicate
