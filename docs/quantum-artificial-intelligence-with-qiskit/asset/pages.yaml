  md: "# Basis Encoding of Binary Vectors\n\nQuantum encoding is a process to transform\
    \ classical information into quantum states. It plays a crucial role in using\
    \ quantum algorithm. Basis encoding is the most intuitive way to encode classical\
    \ binary vectors into a quantum state. It encodes $n$-dimensional binary vector\
    \ to an $n$-qubit quantum state represented computational basis state. We will\
    \ describe two possible approaches, a method that was developed by Ventura and\
    \ Martinez and the method of entanglement of binary patterns vectors with qubits\
    \ in superposition.\n\n# 13.1 BINARY VECTORS\n\nA set of binary vectors is represented\
    \ by the basis encoding. A uniform superposition of binary vectors can be easily\
    \ generated by Hadamard gates. For example, for two-dimensional binary vectors\
    \ we generate the uniform superposition by Hadamard gates:\n\n```\n$H_2|00\rangle\
    \ = H_1|0\rangle \\otimes H_1|0\rangle = \\frac{1}{\\sqrt{4}}\\sum_{x \\in B^2}\
    \ |x\rangle = \\frac{1}{2}(|00\rangle + |01\rangle + |10\rangle + |11\rangle)$\n\
    ```\n\nwith the amplitude representation\n\n```\n$\\alpha = \\begin{pmatrix} 0\
    \ \\ 1 \\ 2 \\ 3 \\end{pmatrix}$\n```\n\nBut how to generate the superposition\n\
    \n```\n$\\frac{1}{\\sqrt{3}}(|10\rangle + |01\rangle)$\n```\n\nwith the amplitude\
    \ representation\n\n```\n$\\alpha = \\begin{pmatrix} 0 \\ 1 \\ 2 \\ 3 \\ \\end{pmatrix}$\n\
    ```"
