  md: "# 4.1.1 Identity Gate – I\n\nqc.id(qubit)\n\n$|0\\rangle \rightarrow |0\\rangle\
    \ \\quad |1\\rangle \rightarrow |1\\rangle$\n\nThe identity gate defines a quantum\
    \ gate on one qubit and can be represented by a unitary matrix $I$ in Hilbert\
    \ space $\\mathcal{H2$\n\n$I = \\begin{pmatrix} 1 & 0 \\ 0 & 1 \\end{pmatrix}$\n\
