- pgno: 285
  md: "# 20.2 QUANTUM COUNTING\n\nGrover's amplification is based on the unitary operator\
    \ $G_m = 2P_m - I$ in the computational basis with $n=2^{m^*}$ states. (We use\
    \ the notation $m^*$ to indicate that the number of qubits used in Grover's amplification\
    \ and the number of the control qubits $m$ do not need to be equal.) The probability\
    \ of seeing one solution should be as close as possible to 1 and the number of\
    \ iterations. The number of iterations $r$ is the largest integer greater than\
    \ $t'$,\n\n```\n$r = \\left\\lfloor \\frac{n}{4} \\pi \\sqrt{\\frac{k}{n}} \\\
    right\\rfloor. \\quad (20.10)$\n```\n\nThe value of $r$ depends on the relation\
    \ of $n$ versus $k$, with $k$ being the number of solutions. We can estimate $k$\
    \ by quantum counting. In quantum counting, we simply use the quantum phase estimation\
    \ algorithm to find an eigenvalue of a Grover search iteration.\n\nOne can represent\
    \ the state $|t\rangle$ after $t$ Grover's amplification by two subspaces $|\t\
    au_{solution}\rangle$ and $|\tau_{nom}\rangle$ representing the solutions and\
    \ non-solutions with\n\n```\n$|t\\rangle = \\alpha_t |\\tau_{solution}\\rangle\
    \ + \\beta_t |\\tau_{nom}\\rangle. \\quad (20.11)$\n```\n\nQuantum counting algorithm\
    \ is based on the inverse QFT period to estimate the sine wave period represented\
    \ by the amplitude $\\alpha_t$ or $\beta_t$ [16], [15], [47] after $t$ iterations\
    \ (see Figure 20.2). After the amplification we get (see [119])\n\n```\n$\\sqrt{\\\
    frac{k}{n}} \\cdot |\\tau_{solution}\\rangle + \\sqrt{\\frac{n-k}{n}} \\cdot |\\\
    tau_{nom}\\rangle. \\quad (20.12)$\n```\n\n![](img/52faec2d621d75e53089d939bb234a82_285_0.png)\n\
    \n**Figure 20.2** The two-dimensional subspace of amplitude and time $t$ represents\
    \ a periodic curve described by $\\alpha_t$ (the dotted curve) and $\beta_t$ (the\
    \ continuous curve). The x-axis indicates $t$ and the y-axis is the amplitude.\
    \ The values are $n=256, k=1$, and $1 \\le t \\le 200$."
