    to iteratively update a parameterized quantum trial solution also called an ansatz
    (from the German Ansatz which means approach). The parameterized quantum solution
    is defined by a parameterized quantum circuit, for example, the ZZFeatureMap.
    We indicate the basic principles of a variational classifier by a simple example.
    We describe the cross entropy loss function and the Simultaneous Perturbation
    Stochastic Approximation (SPSA). The optimizer performs stochastic gradient approximation,
    which requires only two measurements of the loss function. Qiskit implements the
    variational quantum classifier (VQC) that can be embedded in classical ML tasks.
    We indicate a simple example of the VQC classifier whose learning is based on
    SPSA.


