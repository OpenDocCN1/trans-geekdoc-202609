- pgno: 145
  md: '# 3 Puzzle


    We demonstrate the working principles of quantum production system and the quantum
    tree search by a giskit implementation of a toy example from symbolic artificial
    intelligence, the 3-puzzle. The goal is to find a series of moves that changes
    the board from the initial configuration to a desired configuration. We describe
    the representation of the rules (productions) of the long-term memory and describe
    the search of depth one, two, and three results in eight possible sates. The solution
    is marked by an oracle and a Grover''s amplification is applied once. To increase
    the probability value of the solution we will apply two Grover''s amplification.
    The solution corresponds to the path descriptor that indicates the sequence of
    rules (productions) that changes the board from the initial configuration to a
    desired configuration.


    # 9.1 PUZZLE


    The 3-puzzle is composed of three numbered movable tiles in a 2×2 frame (see Figure
    9.1).


    One cell of the frame is empty, and because of this, tiles can be moved around
    to form different patterns [119]. The goal is to find a series of moves into the
    blank space that changes the board from the initial configuration to a desired
    configuration. There are 12 possible configurations (see Figure 9.2). For any
    of these configurations, only two movements are possible. The movement of the
    empty cell is either a clockwise or counter-clockwise movement.


    The 3-puzzle is tractable and requires fewer qubits to encode. There are four
    different objects: three cells and one empty cell. Each object can be coded by
    two qubits (²) and a configuration of the four objects can be represented by a
    register of eight qubits [x]. In this representation, position description (adjective)
    is fixed and the class descriptors moves. The control function of the quantum
    production system needs to fulfill two requirements [106]:


    +   - For a given board, configuration and a production rule determine the new
    board configuration.

    - To determine if the configuration is the goal configuration.'
