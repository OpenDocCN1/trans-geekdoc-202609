- pgno: 104
  md: "# 5.2 HOUSEHOLDER REFLECTION\n\nThe Householder reflection reflects one $|x\r\
    angle$ to its negative and leaves invariant the orthogonal complement of it. It\
    \ is described by the Householder matrix $Q_x$ with $||x|| = 1$ representing $m$\
    \ qubits with $n=2^m$ and the projection matrix $P$\n\n$P = |x\rangle\\langle\
    \ x|\n\nand\n\n$Q_x = I_m - 2 \\cdot P \\quad (5.4)$\n\nSuppose $P_m$ is generated\
    \ by the normalized vector $|x\rangle$ indicating the direction of the bisecting\
    \ line,\n\n$|x\rangle = \\frac{1}{\\sqrt{n}} \\cdot |x_1\rangle + \\frac{1}{\\\
    sqrt{n}} \\cdot |x_2\rangle + \\dots + \\frac{1}{\\sqrt{n}} \\cdot |x_n\rangle\
    \ = \\frac{1}{\\sqrt{n}} \\quad (5.5)$\n\nthen the projection matrix $P_m$ is\n\
    \n$P_m = |x\rangle\\langle x| = \\begin{pmatrix} 1 & 1 & \\dots & 1 \\ 1 & 1 &\
    \ \\dots & 1 \\ \\vdots & \\vdots & \\ddots & \\vdots \\ 1 & 1 & \\dots & 1 \\\
    end{pmatrix} \\quad (5.6)$\n\nThe projection matrix $P_m$ computes for each dimension\
    \ the mean value\n\n$\\begin{pmatrix} \\frac{x_1}{\\sqrt{n}} \\ \\frac{x_2}{\\\
    sqrt{n}} \\ \\vdots \\ \\frac{x_n}{\\sqrt{n}} \\end{pmatrix} = \\begin{pmatrix}\
    \ \\frac{1}{n} & \\frac{1}{n} & \\dots & \\frac{1}{n} \\ \\frac{1}{n} & \\frac{1}{n}\
    \ & \\dots & \\frac{1}{n} \\ \\vdots & \\vdots & \\ddots & \\vdots \\ \\frac{1}{n}\
    \ & \\frac{1}{n} & \\dots & \\frac{1}{n} \\end{pmatrix} \\begin{pmatrix} x_1 \\\
    \ x_2 \\ \\vdots \\ x_n \\end{pmatrix} \\ \\quad (5.7)$\n\nand the Householder\
    \ reflection\n\n$Q_x = I_m - 2 \\cdot P_m. \\quad (5.8)$\n\ncomputes the following\
    \ mapping,\n\n$x_i^{new} = x_i^{old} - 2 \\cdot \\frac{\\sum_{i=1}^n x_i^{old}}{n}\
    \ \\ \\quad (5.9)$\n\n# 5.3 GROVER's AMPLIFICATION\n\nGrover's amplification is\
    \ based on $-Q_x$. It is a unitary operator with\n\n$G_m := -Q_x - I_m + 2 \\\
    cdot P_m = 2 \\cdot P_m - I_m \\ \\quad (5.10)$"
