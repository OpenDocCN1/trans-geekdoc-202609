    AI, ML, and financial economics. From computer science, we adopt the principles
    of algorithm design and data structures that underpin the AI and ML models used.
    The principles of pattern recognition and learning systems from AI and ML inform
    the development and evaluation of these models. From financial economics, we draw
    on theories about market efficiency, asset pricing, and investor behaviour. This
    interdisciplinary approach provides a comprehensive framework for understanding
    the complex interplay between AI, ML, blockchain technology; and decentralized
    trading markets.


    ## 3.1.11 Contribution to the Field


    This research aims to add to the growing body of knowledge on the application
    of AI, ML, and blockchain technology in trading markets. By integrating these
    technological innovations into trading strategies in decentralized markets, it
    seeks to offer new insights into market efficiency, transparency, and security.
    This study’s results could inform the design of more sophisticated trading models
