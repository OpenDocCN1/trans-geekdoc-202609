    # 编辑者简介 IX


    与剑桥大学合作。在开放大学（OU）任期间，他是核心团队成员，参与开发了世界上首个数字新冠-19疫苗接种认证系统。


    他在2019年由Taylor & Francis 出版的《区块链、比特币与加密货币》一书，并编辑了另外两本书。他还在许多知名的期刊和会议上发表了大量研究文章。


    Chowdhury 博士在苏格兰格拉斯哥大学获得博士学位，曾是爱尔兰都柏林三一学院的爱尔兰政府奖学金获得者。他还获得了孟加拉国人民共和国总统总统颁发的金牌。


    Ganesh Chandra Deka 先生是印度政府技能发展与创业部 DGT 下属阿姆邦技能开发与创业局（RDSDE）的联合主任。


    他的研究领域包括区块链技术、大数据分析、NoSQL 数据库和物联网（IoT）。他关于云计算撰写了两本书（出版商为德国 LAP Lambert），并合著了五本教科书（其中包含四本《计算机科学基础》，一本《自由开源软件》）。


    Deka 先生编辑了29本关于大数据、NoSQL 数据库和区块链技术的书籍（美国 Global I 七本、美国 CRC Press 八本、Springer
    四本以及 Elsevier 十本）。他撰写了12个书籍章节，在各种知名期刊上发表了8篇论文（两篇 IEEE 期刊以及各种 IEEE 的约47篇研究论文，一篇
    Elsevier 以及其他五篇）。他曾担任四个索引国际期刊（SCOPUS & SCI 期刊）特刊的客座编辑。


    截至目前，他作为技术主席在印度组织了八场 IEEE 国际会议。他是各种期刊和国际会议的编辑委员会成员和审稿人，也是 IEEE、印度电子与电信工程师学会的成员，以及印度工程师学会的副级会员。


    # 贡献者


    Maruf Farhan 不仅对网络安全非常了解，而且对此充满热情。Maruf 通过在诺桑布里亚大学攻读网络安全硕士学位，展现了他对未来的严肃投入。他进一步深造业的动力显示了他对不断变化的网络安全行业的兴趣。


    Maruf 曾在2016年至2020年间在马来西亚卡巴巴斯实验室（Kaspersky Lab）担任安全支持专家。通过处理现实世界的安全问题，他得以磨炼了在该领域的专业知识。不久，他开始在一家本地
    IT 公司担任 IT 官员。Maruf 在 IT 行业工作了七年，并因其努力获得了来自 CompTIA 的各种认证，包括 Security+、A+、Python、C+
    以及区块链技术（以太坊区块链）。这些认证证明了他在 IT 安全这一至关重要领域的熟练程度。


    除了专业成就外，Maruf 还向学术界做出了贡献。他在两本国际同行评审期刊上发表了文章，而他的书籍章节将是他的处女作。他在网络安全方面做到了言行一致。Maruf
    想要过上学术生涯。区块链和反钓鱼是他的研究兴趣，他希望获得网络安全博士学位。他很有前瞻性，表现出对区块链技术、网络安全革命以及常见的网络威胁——钓鱼的兴趣。


