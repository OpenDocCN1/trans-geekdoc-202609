    ## 1.2.3 学习过程


    神经网络的学习涉及提高其更有效地执行分类或回归的能力。该过程围绕调整网络的权重（可选阈值）展开，以提高输出的准确性并减少错误。当额外数据不再显著降低误差率时，学习被认为完成，尽管它永远不会达到零。如果学习后误差率仍然高得不可接受，则必须重建网络。为了实现这一点，在学习过程中定期定义并评估代价函数。学习的目标是最小化所有观测数据的误差和
    [17]。


    学习率决定了模型针对每次观测错误所采取的纠正幅度。较高的学习率会缩短训练时间，但可能导致较低的整体准确率；较低的学习率会增加训练时间，但具有更高准确性的潜力。代价函数的选择取决于所需的特性（如凸性），或源自模型（例如使用基于模型后验概率的代价函数）。学习率对于防止模型陷入局部最小值并使其收敛到全局最小值至关重要
    [20]。


