    There''s no denying that artificial intelligence (AI) has risen to prominence
    in recent years and that there''s a great deal of interest in the field among
    academics and businesses. John McCarthy, an MIT computer science professor, created
    AI. He began groundbreaking work on AI by studying how computers could mimic human
    actions. McCarthy is often cited as one of the pioneers in AI because he popularized
    the phrase “artificial intelligence” in 1955. He demonstrated that machines could
    replace human labor and provided examples in his writings. McCarthy taught machines
    could acquire knowledge by observation and progress as time. He predicted that
    technology would one day replace humans in law enforcement and medicine Figure
    2.1. Since then, researchers have expanded the use of AI technologies across numerous
    industries, from healthcare to robots to banking, speech recognition, and beyond.
    Early in the 1960s, it became obvious that machines could learn and increase their
    abilities over time. AI is currently being hailed as one of the most revolutionary
    technologies in recent times, with the potential to alter how we live and work
    completely.


    AI refers to the capability of a machine or a computer program to perform tasks
    that would normally require human intelligence, such as visual perception, speech
    recognition, decision-making, and natural language processing (NLP) [1].


