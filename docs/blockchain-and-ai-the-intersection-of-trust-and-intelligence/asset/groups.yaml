    # Editor Biographies


    Dr Niaz Chowdhury is a scientist, educator, start-up co-founder, author, and grant
    winner from the United Kingdom working with technology-aided 21st-century education
    and disruptive technologies, including Blockchain and Artificial Intelligence.
    His experience spans over one and a half decades across three British and Irish
    nations in England, Scotland, and Ireland.


    Dr Chowdhury has co-founded two start-ups in the UK. One of them is the London
    Tech Lab, a deep tech research lab established in 2020 during the pandemic. The
    lab focuses on developing technologies related to Web3, AI, Internet of Things,
    Cybersecurity, and Fintech. Dr Chowdhury currently serves as the Chief Scientist
    at the lab. The other start-up is the London School of Leadership, Investment,
    and Technology (LSLIT), which was founded the following year. LSLIT is an EdTech
    institution providing executive education for professionals and lifelong learners.
    Dr Chowdhury holds the positions of Chairman and Director of Education at LSLIT.


    Previously, he held the position of AI Lead in the UK Government’s InnovateUK
    co-funded project SAM AI, where he was the P.I. winning the grant with Store Performance,
    the participating SME. He was also a researcher at Knowledge Media Institute (KMI),
    The Open University, UK, working with EUHorizon2020 projects QualiChain and DEL4ALL
    and Smart City project MK-Smart, collaborating'
