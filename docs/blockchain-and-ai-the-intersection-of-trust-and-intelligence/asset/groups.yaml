    # 4.1 Introduction


    The serial digital mutation of industries and society comprehended as the Fourth
    Industrial Revolution (4IR) is fueled by the fusion of cutting-edge technologies
    like artificial intelligence (AI), robots, the internet of things, blockchain,
    etc. (Turing, 2023). It shows a reinvigorated age of economic and social change
    and builds on earlier industrial processes that have happened since the late 18th
    century (Figure 4.1).


    The exponential rise of data, the outcome of progressive analytics and unintelligent
    intelligence, the composition of new business prototypes imaginable by digital
    technology, and the expanding


    ![](img/9ec7265fe90cfcff7aaed671ae7cfbe4_137_0.png)'
