    ## 开发交易策略


    ## 波动性 vs 流动性


    ![](img/9ec7265fe90cfcff7aaed671ae7cfbe4_103_0.png)


    **图 3.19** 波动性与流动性。


    波动性意味着价格发生显著变化，通常发生在短时间内，而低波动性资产倾向于具有更稳定的价格。波动性可能由多种因素引起，例如供需变化、经济和政治事件，甚至是恐惧和贪婪等人类情绪（图
    3.19）。


    另一方面，流动性是指资产在市场上被买卖的易易程度和速度，且不会对其价格产生显著影响。高流动性资产拥有许多买家和卖家，因此交易可以快速以公平的价格执行。相比之下，低流动性资产的买家和卖家可能有限，导致交易困难或以不利的价格执行交易。


    ### 3.10.7.2 成交量 vs 波动性

    在特定时间内，特定市场交换的股份或合约总数被称为“成交量”。较大的成交量通常意味着市场活跃度和对该品种的兴趣，这可能解释了为什么波动性较高（图 3.20）。


    换句话说，随着更多个人买卖某物品，该物品的价格可能会发生更大的变化。低波动性资产通常具有更稳定的价格，而高波动性资产经常在短时间内经历剧烈的价格波动（图 3.21）。


    ### 3.10.7.3 GDP vs 波动性

    强劲的 GDP 可能表明经济状况良好，这可能导致投资增加和对资产的需求提高，从而推动价格上涨并降低波动性。去中心化交易市场往往受到影响波动性的广泛其他因素，例如供需变化、监管或政策、新闻事件和技术发展。这些因素可能比
    GDP 的变化更直接地影响去中心化交易市场的行为（表 3.3–3.5）。


