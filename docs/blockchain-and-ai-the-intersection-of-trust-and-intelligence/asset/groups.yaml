    Secondly, blockchain technology also presents its own set of challenges. One of
    the main limitations is the scalability of the blockchain network, which can become
    congested and slow during periods of high transaction volume [61]. This can potentially
    impact the efficiency of trading strategies that rely on quick execution times.


