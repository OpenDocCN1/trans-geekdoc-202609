    ### 1.5.2.1 基于联邦学习的癌症患者辅助诊断模型


    该研究侧重于开发一种联邦学习系统，旨在诊断癌症复发并确定术后肿瘤位置。主要关注点在于术后肿瘤复发的概率，因此，预测复发时间对有效的患者治疗至关重要。此外，区分肿瘤是在原位重新出现还是发生了转移具有重要意义。


    为了实现这一目标，研究人员采用了卷积神经网络（CNN）作为本地学习模型。通过将这些本地学习器的权重和偏置传输到中央服务器来更新全局模型。为了保护患者数据的隐私，在用户端建立了本地差分隐私（Localized
    DP）机制。


    利用联邦学习模型，他们有效地解决了数据稀缺问题，提高了准确性。图 1.1 展示了他们的联邦学习架构结构。


    此外，图 1.2 提供了他们所提结构的清晰概述。


    此外，图 1.3 描述了他们所提系统的伪代码。


    ### 1.5.2.2 用于去中心化隐私临床机器学习的群学习


    该研究引入了一种名为“群学习”（Swarm learning）的新型分布式学习框架。与存在聚合点的联邦学习不同，群学习省略了中心聚合，促进节点之间的通信以共享其本地模型。在这种方法中，节点不再将权重和偏置上传到智能合约（SC），而是直接相互通信并更新本地权重。


    ![](img/9ec7265fe90cfcff7aaed671ae7cfbe4_32_0.png)


    图 1.1 联邦学习架构。


    ![](img/9ec7265fe90cfcff7aaed671ae7cfbe4_32_1.png)


    图 1.2 基于 CNN 的联邦学习架构。


    图 1.4 展示了该群学习框架与其他类型学习框架的结构。


    ### 1.5.2.3 健康领域的联邦学习应用


    我们还探索了三个不同的研究，这些研究在不同的健康相关领域利用联邦学习（FL），并结合了区块链技术以增强安全性和隐私。


    ## 算法 1 基于本地差分隐私的 CNN-FL 模型


    ```

    1 For Iteration t

    /* Service-Terminal: */ /

    2 $\omega_t = \sum_{q \in Q} \omega_q^t$;

    3 Send $\omega_t$ to each participant;

    /* participants: */ /

    4 for participant q do

    5 Do Localized differential privacy

    6 $\alpha_q^t = \omega_t$;

    7 Local Epoch e do

    8 $\alpha_q^e = \alpha_q^t - \eta \frac{\partial}{\partial \chi_q^e} Z \rho$

    9 End

    10 End

    11 End

    ```


    **图 1.3** CNN-FL 模型伪代码。


    ![](img/9ec7265fe90cfcff7aaed671ae7cfbe4_33_0.png)


    **图 1.4** 群学习框架架构。


    第一项研究侧重于全基因组关联研究，引入了基因组数据与区块链技术的独特结合。区块链被用于防止对敏感基因组信息的未经授权访问，使用智能合约维护授权用户列表以进行高效的身份验证。联邦学习用于在不共享原始数据的情况下训练机器学习模型，确保保护隐私。


    第二项研究探索了联邦学习在利用 CT 图像预测癌症方面的应用。隐私问题通过联邦学习方法得到，使得多家医疗机构能够协作并训练预测模型，而无需共享敏感的患者数据。虽然基因组数据不是这些研究的重点，但研究强调了深度学习技术已作为学习方法广泛应用于各种使用联邦学习的癌症诊断应用中。


    第三项研究采用联邦学习方法诊断帕金森病。训练数据包括断层扫描图像，输入 CNN 网络。全局模型存储在区块链上。与项项研究不同，全局模型由智能合约管理。


    总的来说，这些研究展示了联邦学习在医疗健康领域的巨大潜力。


    ## 结论


    本章探讨了联邦学习以及中心化的主要挑战。对区块链联邦学习的评估表明，它可以解决这些问题。然而，数据量、性能和开销等各种挑战仍然存在，需要进一步探索。


