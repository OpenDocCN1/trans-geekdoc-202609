  mdcn: "\n\n## 4.9 AI 与区块链的挑战：它们在教学学习中的局限\n\n尽管 AI 和区块链具有改变教学学习的潜力，但在教育中应用它们可能会产生某些负面影响。以下是区块链和\
    \ AI 在教育中的一些缺点：\n\n- 缺乏人为互动\n- 偏见与不平等\n- 成本\n- 数据隐私与安全\n- 复杂性\n\n教育提供者和教师对基于大语言模型（LLM）的\
    \ AI 工具已产生普遍担忧，这些工具可用于在评估、作业、任务等过程中进行作弊。甚至可以用于创作歌曲、诗歌、绘画和绘图等创意作品。它可以用于初级的灵感生成，但需要充分的研究、微调和深度理解，以避免改写错误和\
    \ AI 检测错误（IOE London Blog, 2023）。ChatGPT 可以针对不同类型的问题生成过于通化的答案，但这些答案并不总是正确的，也不符合高标准（图\
    \ 4.12）（Code Today, 2022）。\n\nGPT 和 LLM 模型能够更快地扩展解决策略，并以聊天的形式参与构思以缩小范围（Tsai et\
    \ al., 2023）。\n\n## 4.10 结论\n\n通过将区块链和 AI 集成到教学学习中，可以创建个性化、去中心化且安全的学习网络，这具有完全改变教育提供方式的潜力。虽然区块链凭证和认证可以提供学习者成就的透明且不可更改的记录，但\
    \ AI 驱动的个性化学习可以根据个人需求调整教育体验。而区块链可以更容易创建去中心化的学习网络，某些可以通过 AI 实现自动化。\n\n### 问题\n\n\
