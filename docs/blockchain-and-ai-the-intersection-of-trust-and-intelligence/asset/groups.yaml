    # BLOCKCHAIN EMPOWERED FEDERATED LEARNING 5


    However, utilizing blockchain for storing and updating the distributed learning
    model presents its own set of challenges. Data storage on the blockchain can be
    expensive, limiting the complexity of the federated learning model. Additionally,
    a robust mechanism is needed to validate incoming data streams to ensure consensus
    among nodes regarding data validity. Incentivizing participating nodes to perform
    costly computations during weight training is also crucial for successful implementation
    [10].


    Since Google introduced federated learning, extensive research has been conducted
    in this area. Previous studies by Bonawitz et al. and Kairouz et al explored the
    overall architecture and design of networks formed by IoT devices connected via
    the Internet, along with opportunities and threats associated with them [11,12].
    Similarly, blockchain technology has seen substantial progress and exploration
    in various application areas. However, the training of a distributed learning
    model on a blockchain with a rigorous data verification mechanism has received
    limited attention to date.


    Hence, the main focus of this chapter is to delve into the current state of research
    on blockchain-based federated learning and provide a proof of concept for such
    a distributed learning model. This includes the understanding of how blockchains
    can support federated learning, how models can be trained using the blockchain,
    and how IoT device data can be integrated into the federated learning model. Addressing
    common issues with traditional cloud-based ML models, such as data leakage, exposure,
    centralization, and trust issues, is a key objective of this research. Furthermore,
    this chapter emphasizes validation and verification of data sent by data sources,
    with a focus on smart contract (SC)-based verification [13].


    In modern distributed networks, federated learning has gained popularity by its
    ability to train statistical models directly on remote devices, reducing the need
    for centralized storage and ensuring privacy [14]. The process involves constructing
    a single global statistical model from data stored on numerous remote machines.
    Device-generated data are stored and processed locally, with only intermediate
    updates interacting with a central server regularly. At regular intervals, the
    devices load the current global model and train a local version of the model using
    their local data. These local models are then updated by the devices based on
    their'
  - '[PAGE 20]


    respective local data. Subsequently, the local models are sent back to the central
    server, where they are aggregated into one model, becoming the next iteration
    of the global model [15].


    Overall, this chapter promises to advance privacy-aware ML and explores the potential
    of blockchain-based federated learning, contributing to cutting-edge technologies
    and securing sensitive data in the age of IoT and distributed networks.


    # 2.2.1 Federated Learning Algorithm


    Google''s original federated learning algorithm [14] assumes experimental conditions
    where devices respond, and no malicious devices are present. The algorithm follows
    a synchronous update mechanism communicated in rounds, involving a collection
    of K clients, with its own local dataset. At the beginning of each round, a random
    percentage C of clients is chosen, and the server delivers the current global
    algorithm state to them, which represents the current global model [14].


    The optimization task in federated learning aims to minimize the overall error,
    which can be formulated as:


    > minimize f(w) = 1/n ∑ fi(w)


    fi(w) represents the loss function for a specific training sample (xi, yi) with
