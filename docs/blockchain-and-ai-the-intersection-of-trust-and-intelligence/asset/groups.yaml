    由于数据集中存在市场指标并且可以进行适当分析，我决定应用回归模型来预测成交量。这就是我选择回归模型的原因。这些模型包括线性回归、决策树回归、随机森林回归和
    XGBoost 回归。


    此外，线性回归模型是一种简单而强大的算法，它可以将线性方程拟合到数据中，并用于预测和推理。它是使用 sklearn-learn 库实现的。


    决策树回归是一种非参数模型，根据一组规则将数据划分，直到满足停止准则。它可以处理数值和分类数据，并能够对输入特征与输出变量之间的关系进行建模。使用 Scikit-Learn
    来实现决策树回归。


    为了提高性能并减少过拟合，随机森林回归是一个整合了各种决策树回归的集成模型。它通过随机选择特征和数据子集来构建单树，然后组合它们的预测结果来工作。随机森林回归是使用
    Scikit-Learn 库实现的。


    名为 XGBoost 回归的梯度提升模型采用一组决策树来提升性能。它结合多个弱模型的预测结果来创建一个强大的预测器。我使用 XGBoost 库实现了 XGBoost
    回归。


    ### 3.10.11 模型选择与训练


    使用赤池信息准 (AIC) 或贝叶斯信息准 (BIC) 等统计量是一种常用方法，数学模型如 [54]。这些指标评估了模型对数据集的拟合程度，同时对复杂度较高的模型进行惩罚。例如，AIC
    的计算公式为 AIC = 2k–2ln(L)，其中 k 是模型中的参数数量，L 是给定模型下数据的似然度。对数据的最佳拟合通常被认为是 AIC 值最低的模型。


    另一方面，使用交叉验证技术，将数据划分为训练集和测试集，并训练不同的模型


