    3.10.14.6 Sentiment Score The sentiment contains four scores: neg, neu, Pos, and
    compound (Table 3.8).


    +   - **Neg score:** The negative sentiment score ranges from 0 to 1, where 0
    means no negative sentiment and 1 means extremely negative sentiment.

    - **Neu score:** The neutral sentiment score ranges from 0 to 1, where 0 means
    no neutral sentiment and 1 means extremely neutral sentiment.

    - **Pos score:** The positive sentiment score ranges from 0 to 1, where 0 means
    no positive sentiment and 1 means extremely positive sentiment.

    - **Compound score:** The overall sentiment score ranges from -1 to 1, where -1
    means extremely negative sentiment, 0 means neutral sentiment, and 1 means extremely
    positive sentiment.'
