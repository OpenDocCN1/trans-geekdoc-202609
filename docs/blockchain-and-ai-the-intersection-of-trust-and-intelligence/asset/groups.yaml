    Diabetic retinopathy is a frequent complication of diabetes that can cause diabetic
    blindness if left untreated. Thus, the DeepHealth project developed an AI-powered
    platform to analyze medical imaging data to detect it. The system has a sensitivity
    of 96.1% and a specificity of 93.6% for detecting diabetic retinopathy from 10,000
    images of diabetic patients'' retinas [64].


    Let''s assume a diabetic visits an eye doctor for an annual exam. The ophthalmologist
    uses a retina camera to capture an image of the back of the patient''s eye. A
    crystal-clear picture of the retina is seen here. This is then uploaded to a service
    where AI examines it. The platform''s deep learning algorithms analyze the photo
    for symptoms of diabetic retinopathy.


    The platform may explain the diagnosis by, for instance, highlighting areas of
    the picture that exhibit evidence of diabetic retinopathy if the illness is detected.
    The ophthalmologist can examine the platform''s analysis of the patient''s condition
    to discover the cause of the problem and the best course of treatment.


    ## 2.8 A Comprehensive Assessment of the Positive and Negative Aspects of Implementation


    AI and blockchain technology are neat tools. To keep patient data secure and predict
    illnesses before they happen, these two technologies can help. However, there
    are some drawbacks and positive impacts of this technology.


    ### 2.8.1 Positive Impact


    - 1. **Improved Data Security and Privacy**: To lessen the likelihood of data
    breaches and unauthorized access, patient information might be stored and shared
    via a blockchain-based, decentralized platform [44,65].

    - 2. **Streamlined Administrative Processes**: Administrative tasks, including
    billing and claims processing, may be simplified and automated using blockchain
    technology, leading to fewer mistakes and greater productivity [66].

    - 3. **Personalized Medicine**: Through the analysis of patient data, AI can enable
    personalized medicine by allowing therapies to be adapted to the individual. The
    outcomes and costs of medical treatment may benefit from this [67].

    - 4. **Enhanced Predictive Analysis**: AI makes the capacity to intervene early
    in a disease''s progression possible [68].


    ### 2.8.2 Negative Impact


    - 1. **Workplace Displacement**: Some healthcare workers, especially those in
    administrative positions, may lose their jobs because of the widespread use of
    AI and blockchain technology in the healthcare industry [69].

    - 2. **Technical Limitations**: Implementing AI and blockchain in healthcare may
    be challenging due to technological challenges such as scale and the necessity
    for standardized data formats [70].

    - 3. **Scalability and Performance**: Using AI in conjunction with blockchain
    technology in healthcare might be challenging due to limitations in size and speed.
    Blockchain networks'' data processing speeds and accuracy are very variable depending
    on the consensus mechanisms employed. AI algorithms that require near-instantaneous
    responses might be slowed down as a result [71].


    ## 2.9 Open Challenges for AI and Blockchain Technologies for the Healthcare Sector


    Benefits do not come along without a cost. While the transformative effects of
    blockchain and AI technologies in the healthcare sector are undeniable, these
    advancements have come with a hefty initial investment and required substantial
    local data storage. Below are some statistics that provide a bird''s eye view
    of the problems that AI and Blockchain technology are now facing in the medical
    field.


    ### 2.9.1 Privacy Issues


    Protecting patients'' privacy is very important since their personal information
    is stored in healthcare databases. Privacy concerns arise when people share data
    on public blockchains. Because blockchain is decentralized and transparent, data
    protection has big risks. Different approaches, such as distributed consensus,
    have been established to deal with the privacy concerns highlighted by blockchain
    technology [72].


    ### 2.9.2 Resource Limitation, Capacity, and Storage of Data


    Blockchain and AI demand various data storage and capacity. Recent blockchain
    technology has a cap on the number of simultaneous network transactions. That
    means high consumption of power, which also leads to increased energy consumption,
    is required to process the transaction [72]. In contrast, AI-based systems require
    sophisticated hardware. Not only the hardware, but also it involves complex calculations
    with many algorithms that process amounts of data in every cycle (Figure 2.6).


    ### 2.9.3 Blockchain Security and Threats


    The weaknesses in blockchain’s security have been recently exposed in research.
    Attackers can readily uncover protocol problems in


    ![](img/9ec7265fe90cfcff7aaed671ae7cfbe4_63_0.png)


    Figure 2.6 Open challenges.


    blockchain systems because they haven''t improved much in recent years. Several
    potential risks are associated with blockchain technology, such as data tampering
    and theft. AI learning and model output can be impacted by malicious attackers
    injecting false data or sample inputs, which poses a risk to the health and safety
    of consumers. It has been discovered that blockchain technology is vulnerable
    to cyberattacks such as the DNS (Domain Name System) attack and mempool attacks
    [29].


    ### 2.9.4 Lack of Standards, Interoperability, and Regulations


    As we already know, there should be regulatory laws before implementing anything.
    Most AI and blockchain integration is still limited to academic research, and
    few applications have made it possible. One of the main challenges with adopting
    blockchain in healthcare is the question of who owns what. Since both public and
    private blockchains exist, one would reasonably wonder who is legally responsible
    for the information stored there. Many legal and regulatory problems arise when
    there is no central body to answer to the consequences of technological action
    [29].


    ## 2.10 Future Research Direction


    The model (AI and blockchain technology) requires more investigation because the
    field is rapidly evolving. The privacy and security of blockchain with AI still
    has a long way to go. Future studies can also focus on implementing modern hash
    algorithms and employing secure authorization systems. The advantages and disadvantages
    of implementing two-factor authentication are de-risked. To further improve the
    stability of the blockchain, many researchers have suggested Proof-of-Work and
    Proof-of-Stake. It is hypothesized that the time needed to calculate a block can
    be decreased by using cooperative computing instead of non-cooperative [73].


    ![](img/9ec7265fe90cfcff7aaed671ae7cfbe4_65_0.png)


    Figure 2.7 Open challenges. AI and blockchain


    ## 2.11 Conclusion


    This section provides an overview of how blockchain and AI are applied in medicine.
    There has been a lot of study during the COVID-19 era on the practical implications
    of these two. In 2022, the blockchain market was valued at over $500 million.
    In this chapter, we examine the potential of AI to protect EHRs and other confidential
    records. Data processing and scanning are two tasks that may be automated by combining
    AI with blockchain.

