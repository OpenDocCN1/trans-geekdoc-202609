    # AI 与区块链作为可持续教学 137


    - 互操作性：通过区块链技术（BCT）实现教育文的通用标准，许多机构和部门能够通过降低复杂性来轻松分发和认可文凭，这种兼容性可以降低不同系统之间传输证书的费用。


    教育领域有许多基于区块链的认证系统，例如麻省理工学院数字文凭（MIT Digital Diploma）项目，该项目使用区块链颁发并验证数字学位。同样，初创公司
    Learning Machine 创建了一个构建在区块链上的认证平台，使机构能够生成并发布学术成就的数字记录。


    ## 4.5 AI 驱动的评估与评价


    智能评估（通常称为 AI 驱动的评估）是一个新兴领域，它利用 AI 自动化并增强教育中的评估过程。可以利用机器学习（ML）和自然语言处理（NLP）算法分析海量数据，对学生学习提供更准确、更有用的分析。


    为了实现学生的个性化学习，应当重点关注教育自适应学习技术，该技术使用智能方法识别学生的知识缺口和认知缺陷，为学生诊断合格的步骤，并充分分析可以使用 AI 贝叶斯公式设计的
    (1) 和 (2) 数据。


    $$

    $P(A|B) = \frac{P(B|A) P(A)}{P(B)},

    $$


    $$

    $OP(B) = P(B|A) P(A) + P(B|A) P(A),$

    $$


    可以创建并设计学习者与课程教育行为之间的差异；例如，心率、脉搏和皮肤温度等学生的生理反应可以检测学生的学习行为，或者通过鼠标和键盘输入、眼动等等检测学生的注意力分布，并根据眼动追踪（如眨眼和瞳孔放大）判断学生的学习和交互数据。


    此外，还可以诊断学习者的状态并预测未来的发展，这可以通过以下公式导入：


    $$

    $L = \frac{1}{2}\sum_{i=1}^{n}(Y^{(K)} - T_i),$

    $$


    $$

    $(Y^{(K)} - T_i)^2 = \frac{1}{2}\sum_{i=1}^{MK}(\partial i)^2,$$

    $$


    其中 $\partial i = Y^{(K)} - T_i$ 代表任何向量中的第 $i$ 个元素与第 $i$ 个元素之间的差异。


    $$

    \frac{\partial L}{\partial W}= 0,

    $$


    $$

    $W - \frac{\partial l}{\partial w}= 1.

    $$


    $\partial i$ 是学生的学习率和权重的步长，$(\partial l/partial w)$ 是梯度；向量的第 $i$ 个元素；加上半值是为了使后续的推导计算更容易；在设计阶段，可以将学生的反应纳入回归方程以解决各种损失函数。此外，可以将权重
    $W$ 和 $W$ 纳入设计中，使得 $L$ 和 $W$ 的倒数为 0，如方程 (5) 和 (6) 所示。


    需要注意的是，准确收集学生的身体特征具有挑战性，因此在许多情况下有必要对它们进行估计。估计可以与似然性进行比较并纳入回归方程，例如，分析阅读过程中的字母发音以支持个性化学习。还可以使用平板电脑对写作有困难的孩子进行写作能力评估，让他们选择更合适的学习活动。AI
    可能会识别对学生更有效的教学技术和过程，根据反馈对作业进行分类，更多关注每个学生的独特需求，并检查趋势以培养学生的技能（Chen, 2022）。


    以下是 AI 驱动评估在课堂中的一些应用：


    - 自动评分：AI 驱动评估中最常见的用途之一。论文、作业和测试可以由 AI 算法进行分析，然后给学生提供即时反馈。这可以帮助教育者节省时间、减轻负担并提供更即时的反馈。


    # AI 与区块链作为可持续教学 139


    - 个性化学习：通过对学生数据分析并提供个性化的反馈和建议，AI 驱动的评估也可用于个性化学习。这些工具可以通过分析学生表现数据，识别学生的薄弱环节，并为他们提供定制的反馈和工具以帮助其发展（Ali
    and Ab-Haq, 2021）。

    - 自适应测试：创建自适应测试（即测试复杂度根据学生的水平进行调整）是 AI 驱动评估的另一种应用，有助于减轻考试焦虑。

    - 学习分析：由 AI 驱动的评估可以检查大量的学生数据，以为学习提供见解。教育者可能会发现增强教学和学习的趋势。

    - 课程设计：AI 可用于创建个人计划并根据每个学生的需求调整课程。这可能会带来更好的学习效果和更高的学生参与度。


    然而，在教育中整合 AI 驱动的评估并非没有困难，包括偏见、训练系统所需的高质量数据可用等。


    ## 4.5.1 抄袭检测


    AI 工具可以辅助检测作业中的抄袭。一种流行的策略是利用文本匹配算法，将提交的内容与大型现有文本数据库（包括其他学生的提交、学术期刊、书籍和网站）进行比较。这些算法检查提交作品与所用参考文献之间的相似程度。Turnitin、大语言模型（LLM）、NLP
    等方法也可用用于识别写作风格中的异常情况、可疑的模式或词汇的突然变化。在大量文本数据上训练过的 AI 系统可以识别可能是抄袭迹象的模式，例如从来源复制粘贴而未提供正确的引用或改写。一些
    AI 驱动的抄袭检测工具还使用机器学习算法来不断提高准确性。通过研究过去的抄袭案例，它们可以发现抄袭者使用的新模式或方法，从而随时间调整并改进其检测能力。


