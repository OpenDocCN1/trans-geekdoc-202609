    is mined. |

    | 2011 | Litecoin and Namecoin are new blockchains that slightly modify the Bitcoin
    blockchain system. |

    | 2014 | The Ethereum blockchain is introduced, offering a more versatile and
    programmable blockchain that allows for the creation of smart contracts and decentralized
    applications (DApps). |

    | 2015 | The Hyperledger project is a joint effort by the Linux Foundation and
    several industry partners to develop an open-source and enterprise-ready blockchain
    infrastructure. |

    | 2016 | To investigate the potential uses of blockchain technology in the financial
    sector, some 80 financial institutions banded together to form the R3 Consortium,
    the first public blockchain collaboration. |

    | 2017 | To raise capital, a growing number of companies are turning to initial
    coin offerings (ICOs) in the sale of cryptocurrency tokens. |

    | 2018 | The InterWork Alliance is a nonprofit organization creating universal
    blockchain protocols and specifications. |

    | 2020 | The Ethereum 2.0 upgrade has been joined, and its purpose is to increase
    the scalability, security, and durability of the Ethereum network.|


    Even though no one knows who Satoshi Nakamoto is, their work on the Bitcoin blockchain
    significantly impacted how blockchain technology developed.


    Table 2.2 shows a quick summary of how blockchain technology has changed over
    time.


    # 2.1.2 Blockchain Layered Technology


    2.1.2.1 Layers of Blockchain Technology A blockchain system has several interconnected
    layers to securely store information, reach consensus, and execute smart contracts.
    Blockchain layers often include the following:


    +   1. Application Layer: The application layer is a blockchain''s last and most
    complex part. It''s made up of apps that people use to communicate with the distributed
    ledger. Examples include wallets, user interfaces, and decentralized apps (DApps).
    Users can access the blockchain network and its features via the application layer
    [2].'
