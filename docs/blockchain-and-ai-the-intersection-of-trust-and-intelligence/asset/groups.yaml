    # 区块链赋能联邦学习 5


    然而，利用区块链来存储和更新分布式学习模型面临着一系列挑战。在区块链上存储数据的成本可能很高，这限制了联邦学习模型的复杂度。此外，还需要一种健壮的机制来验证输入的数据流，以确保节点之间对数据的有效性达成共识。在权重训练期间，激励参与的节点执行高昂的计算对于其实成功实施也至关重要
    [10]。


    自从 Google 引入联邦学习以来，该领域已经进行了广泛的研究。Bonawitz 等人与 Kairouz 等人之前的研究探索了通过互联网连接的物联网（IoT）设备构成的网络的整体架构和设计，以及与之相关的机遇与威胁
    [111, 12]。同样地，区块链技术在各种应用领域也取得了实质性的进展和探索。然而，直到为止，在具有严格数据验证机制的区块链上训练分布式学习模型的研究关注仍然有限。


    因此，本章的重点是深入研究基于区块链的联邦学习的现状，并为这种分布式学习模型提供概念证明。这包括理解区块链如何支持联邦学习、如何使用区块链训练模型，以及如何将物联网设备的数据集成到联邦学习模型中。解决传统云端机器学习模型的常见问题（如数据泄露、暴露、中心化和信任问题）是本研究的关键目标。此外，本章强调了对数据源发送的数据进行有效验证，重点关注基于智能合约（SC）的验证
    [13]。


    在现代分布式网络中，联邦学习因其直接在远程设备上训练统计模型的能力而流行，减少了对中心化存储的需求并确保了隐私 [14]。该过程涉及从存储在许多远程机器上的数据构建单一全局统计模型。设备生成的数据在本地存储和处理，只有中间更新定期与中央服务器进行交互。设备在定期的时间间隔内加载当前全局模型，并使用其本地数据训练本地模型。然后，设备根据各自的本地数据更新这些本地模型。随后，本地模型被发送回中央服务器，在那里它们被聚合为一个模型，成为全局模型的下一次迭代
    [15]。


    总体而言，本章有望推动隐私感知机器学习，并探索基于区块链的联邦学习的潜力，为物联网和分布式网络时代的尖端技术和敏感数据安全做出贡献。


    ## 2.2.1 联邦学习算法


    Google 的原始联邦学习算法 [14] 假设了实验条件，即设备做出响应且不存在恶意设备。该算法遵循以轮的形式通信的同步更新机制，涉及一组 K 个客户端，每个客户端都有自己的本地数据集。在每轮开始时，随机选择比例为
    C 的客户端，服务器将当前的全局算法状态传递给它们，该状态代表当前的全局模型 [14]。


    联邦学习中的优化任务旨在最小化整体误差，其可以表示为：


    > minimize f(w) = 1/n ∑ fi(w)


    fi(w) 代表特定训练样本 (xi, yi) 在当前权重 wi 下的损失函数。损失函数衡量了模型预测与真实输入数据之间的误差。目标是在训练期间最小化这种误差
    [14]。


    Google 的联邦学习方法建立在随机梯度下降（SGD）的基础上，SGD 是深度学习中广泛使用的优化算法。联邦优化使用了 SGD 的变体，在每轮中选择一个比例为
    C 的客户端，并在它们的本地数据上计算损失的梯度。C 决定了全局批处理大小大小，当 C = 1 时，该算法被称为联邦梯度下降（FedSGD）[14]。


    另一种称为联邦平均（FedAvg）的方法涉及每个客户端在对所有迭代进行平均并获得所有客户端更新的平均值之前，执行多次迭代以计算本地更新 [14]。


    总体而言，这项研究旨在解决联邦学习中与中心化、数据隐私、恶意和懒惰客户端相关的挑战，以开发出一种适用于现实用例的全面且高效的 FML 架构。提出的解决方案将有助于
    FML 在各个行业和应用中的广泛采用，确保模型训练的隐私、安全性和准确性。


    ## 1.2.2 神经网络组件


    人工神经元与生物神经元在功能和结构上具有相似性。它可以将其输出发送到多个其他人工神经元，接收外部数据样本的特征值或其他神经元的输出作为输入。每个神经元的输出都会计算所有输入的加权和，并考虑了连接该神经元的链路权重以及偏置项。这个加权总和被称为激活值，然后它通过一个激活函数（通常是非线性的）以产生神经元的最终输出。第一层神经元接收外部数据作为输入，而最终输出则实现了网络的分类或回归目标
    [16]。


    神经网络由连接组成，每条连接都作为另一个神经元的输入。每条连接都被分配有一个反映关系强度的权重。一个神经元可能有多个输入和输出连接 [17]。


    深度学习采用了前向传播，其中神经元的输入被计算为来自输入的加权和。输入乘以权重，并加上每一层的偏置。如果适用，则应用激活函数。此过程重复直到达到输出层 [18]。


    深度学习网络通常将神经元组织成多个层，形成复杂的结构。层中的神经元仅与其相邻的层元通信。输入层接收数据源的数据，输出层产生结果。它们之间可能有零或多个隐藏层。层之间可以建立各种连接模式，例如全连接网络，其中一层的每个神经元连接到下一层的每个神经元。或者，可能会发生池化，其中一组神经元连接到下一层的单个神经元，从而减少该层的神经元数量。这些连接模式在数学上被称为有向无环图
    [19]。


