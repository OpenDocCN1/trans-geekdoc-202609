    还拥有人工智能的硕士学位。在学术时期，他曾有密码学背景。


    此外，他在金融行业花费了大量时间。这段经历启发了他投身区块链技术。自2015年以来，他从理论和实践两方面一直参与区块链行业，一直是 IT 行业的专业人士。


    # 贡献者


    在过去的三年里，他一直参与区块链工作，目前正在开发人工智能（AI）以使其影响力最大化。


