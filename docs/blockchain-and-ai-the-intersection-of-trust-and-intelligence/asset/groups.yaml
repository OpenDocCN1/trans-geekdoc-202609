    IEEE、英国计算机学会、皇家统计学会和 STEMResearchAI 的成员。作为国际扶轮会等慈善机构的慈善家，他通过担任俱乐部主席、地区代表（DRR）和
    MDIO 秘书等职位，持续为社区发展做贡献。他的研究重点是人工智能（AI）、机器学习（ML）和教育技术。


