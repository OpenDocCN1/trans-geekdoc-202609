    # 人工与区块链作为可持续教学


    ![](img/9ec7265fe90cfcff7aaed671ae7cfbe4_159_0.png)


    教育图景中的**图 4.11**。


    AI 驱动的内容制作平台的能力可以帮助教师和教学设计人员制作更有效的教学材料。AI 驱动的内容创建的另一个优势是它能够根据特定学习者的需求和偏好定制内容。AI
    能够通过分析学习者行为和表现的数据，创建出适应每位学生个人需求的专业化学习材料。


    AI 生成的内容可能缺乏原创性和创造力。尽管 AI 能够快速高效地生成内容，但它可能无法以一种真正新颖或突破性的方式来实现。这在教室中可能是一个问题，因为学生可能会从接触新鲜、原创的想法中获益。AI
    驱动的策展利用算法和方法，根据用户的兴趣和行为自动对内容进行排序、安排和建议。这项技术可能会完全改变所选择和提供的学习资源。


    通过 AI 驱动的策展实现学习体验的个性化是其主要优势之一，因为 AI 算法可以通过检查行为和偏好数据，提供与学生的兴趣和学习目标相关的的内容建议。由于学生更有可能发现主题具有吸引力和价值，这有助于学生保持积极性和投入。


    # 区块链与人工智能


    AI 驱动的策展可以提供对学习者行为和表现的洞察，并发现学习者与策展内容交互的模式和趋势，这些趋势可以用于增强下一次策展计划的效力。


    扩展性是 AI 驱动的内容创建的关键优势之一。对于贫穷国家或无法获得高质量教育资源的学生来说，这可以增加教育的可负担性。使用 AI 进行内容创建可以提高教育资源的质量。例如，AI
    驱动的聊天机器人可以与学习者模拟讨论，帮助他们磨炼和练习语言能力。AI 驱动的虚拟现实（VR）设置可以给学生提供传统教学工具无法实现的动态、实践体验。


    对人类监督和参与的需求是另一个困难。算法产生的文本必须由人类专业人员进行审查和编辑。批评者担心，在教育中使用 AI 工具可能会降低学生在整个学习过程中批判性和分析性思维的能力；这些工具可能会在无意中抑制学生利用批判性思维，可能会抑制他们分析复杂问题、独立评估信息和产生原创解决方案的能力。为了给学生提供准备他们应对未来挑战的全面教育，有必要在开发批判性思维和使用
    AI 工具之间建立平衡。AI 驱动的材料策展为教师和学生节省时间是另一个主要优势。学习者可以依靠 AI 算法建议与其相关的顶级材料，而不是花费数小时寻找教育资源。教师可以利用
    AI 驱动的策展寻找与他们的学习目标兼容的资源，节省时间和精力。如果用于训练算法的数据在任何方面存在偏差，算法生成的建议可能会偏偏，这可能会学生接触到错误或偏见的信息。AI
    算法可能会提供有用的建议，但确保建议的资源是准确、相关并符合学习目标至关重要（Little One The Jaipuria Preschool, 2023）。


    教学设计、教学策略和教师培养的变化只是 AI 应用教育对教学产生巨大影响的方式之一。以下是 AI 可能影响教育的几个例子：


    - 个性化学习

    - 自适应学习

    - 数据驱动的教学

    - 自动评分

    - 智能辅导系统


    然而，AI 在教育中的应用确实带来了某些潜在的困难。例如：


    - 对偏见的担忧：AI 算法的质量取决于训练它们的数据。如果用于训练算法的数据在某些方面存在偏见，算法做出的建议或判断可能会偏颇。确保 AI 以公平、透明且尽可能减少偏见的方式进行应用是至关重要的。

    - 对教师培训的需求：教师必须具备特定的技术知识和技能才能在教室中部署 AI。为了成功将 AI 整合到他们的教学实践中，教师可能需要帮助和培训。

    - 去人性化的风险：教育中可以被 AI 自动化的方面包括评分和评估。虽然这样做可以节省精力和精力，但必须使用 AI 来补充而非取代人类的参与和教学。


    以下是 AI 可能会影响学习的一些方式：


    - 个性化学习

    - 自适应学习

    - 提高学生参与度

    - 可访问性

    - 实时反馈

    - 增强协作

    - 时间管理


    然而，在讨论上述所有内容之后，在教学中使用 AI 也存在一些问题和困难。


    - 偏见：由于 AI 算法具有偏见的潜力，不同的学生群体可能会经历不等的学习成果。

    - 对技术的依赖：学生对技术的过度依赖可能导致创造力和批判性思维能力的匮乏。

    - 隐私与安全：由于学生数据可能受到黑客和其他在线危险的影响，在教育中使用 AI 带来了隐私和安全担忧。

    - 实施：为了使 AI 教育成功，必须大量投入基础设施建设、支持和培训。

    - 职位淘汰：通过使用 AI 自动化某些职责，教育系统可能会失去平衡，教师可能会失去工作（Ahmed and Ganapathy, 2021）。


    # 4.8 案例研究：人工智能与区块链在教育中的应用及其对教学学习的影响


    以下是关于教育中使用区块链和 AI 的一些研究和说明：


    马尔他的智能学位：为了引入“智能学位”，马尔他政府与 BCT 业务 Learning Machine 合作。这种方法通过将学术证书存储在区块链上来保护学术证书，使其无法被篡改。在马尔他的多所大学实施了该系统，学生可以使用安全的钱包访问证书。


    卡内基梅大学的 AI 辅导：卡内基梅大学开发了一项可以为学习者提供个性化反馈和指导的 AI 教学系统。“ALEKS”系统适应学生的学习风格和速度（Koedinger
    et al., 1997）。巴林大学的区块链系统：巴林大学实施了一套区块链系统来存储和分发学生记录和学位。雇主和其他教育机构可以通过这种方法验证数据，使其无法被篡改（Jlbrel,
    2019）。


    此外，AI 对教学和学习的影响在以下案例研究中：


    Carnegie Learning：Carnegie Learning 利用 为学生提供个性化的学习机会。该技术适应学习者的风格和速度，利用机器学习算法发现他们需要更多帮助的地方。结果是学习成果显著提高；根据一项研究，使用
    Carnegie Learning 的学生在考试中的表现比使用传统方法的学生出 23%。Coursera：在线学习平台 Coursera 利用 AI 定制每个学生的教育体验。通过机器学习技术，系统评估学生的学术表现，然后对课程和资源提供建议。这提高了参与度和完成率；根据一项研究，使用
    Coursera 的学生完成课程的可能性比使用传统方法的学生出 21%。ML：使用 Learning Machine 的软件创建并发行基于区块链的数字证书麻省理工学院（MIT）是其客户之一，自
    2018 年以来一直使用 ML 技术为毕业生提供数字证书。


