    strive for excellence and maximize their potential returns.


    ## 1.2.5 Robustness in Federated Learning Systems


    Federated learning, a decentralized approach where local learning nodes update
    a central server without sharing raw data, offers significant privacy benefits.
    However, it introduces challenges, as deep neural networks are vulnerable to adversarial
    attacks. To address this, the “ZeKoC” strategy clusters weight updates in a zero-knowledge
    manner, enhancing robustness against malicious participants.


    Another research focuses on model poisoning attacks, where false data corrupts
    the model. Tactics like boosting malicious updates and parameter estimation for
    benign updates are explored to maximize attack effectiveness. “BLADE-FL” model,
    designed for IoT-based federated learning on a blockchain, mitigates the losses
    caused by lazy clients through zero-knowledge proofs.


    Trusted execution environments (TEEs) provide hardware and software isolation,
    ensuring privacy for ML applications. Integrating TEEs with deep neural networks,
    like Intel SGX, showcases their feasibility in privacy preservation. Blockchain
    technology incentivizes protocol compliance in federated learning, compensating
    participants with cryptocurrency.


    State channels enhance supervision in federated learning, creating sandboxes for
    trust supervision and data sharing. Various approaches, including ZeKoC, BLADE-FL,
    TEEs, and blockchain incentives, contribute to privacy, security, and integrity
    in federated learning systems. Researchers continuously explore novel solutions
    to tackle the distributed and privacy-sensitive challenges in federated learning.


    ## 1.2.6 Current Issues


    The field of FML holds tremendous potential, offering several benefits. However,
    its widespread adoption faces challenges that need to be addressed. This chapter
    aims to analyze and evaluate these issues to develop a comprehensive FML architecture.
    The primary challenges include:


    1. **Centralization**: In conventional FML, a Central Server cluster coordinates
    and aggregates data from clients. The presence of a central aggregator introduces
    a single point of failure, where any malicious activity or fault can disrupt the
    entire training process. Deciding on the aggregator’s role also presents a challenge.

    2. **Data Privacy**: While FML architectures protect client datasets from disclosure,
    research has demonstrated the possibility of reconstructing some of the original
    data points from proposed model updates using reverse engineering techniques.
    Preserving data privacy remains critical.

    3. **Malicious Updates**: In a distributed FML environment, malicious clients
    can intentionally submit incorrect or poisoned updates, potentially sabotaging
    the global model. This issue becomes especially pronounced in public scenarios
    where identifying honest and dishonest clients upfront is challenging.

    4. **Lazy Clients**: In decentralized FML frameworks, participants can copy the
    updates submitted by other clients, avoiding the effort of performing any work
    while still reaping the benefits of honest contributors.


    This chapter will delve into these challenges and explore potential solutions,
    with a focus on creating a robust FML architecture. It aims not only to address
    private scenarios where corporations or societies collaborate but also to cater
    to public scenarios where anyone interested in contributing to training ML models
    can participate (e.g., individuals with smartphones contributing to facial recognition
    software development while preserving their data privacy).


    By tackling centralization, ensuring data privacy, preventing malicious updates,
    and countering lazy client behavior, this chapter endeavors to foster the wide
    adoption of FML in real-world use cases, unlocking its full potential in various
    industries and applications.


    ## 1.3 Blockchain Technology


    Blockchain technology has witnessed significant growth across various fields,
    showcasing diverse applications, especially since the emergence of Bitcoin. Although
    the term “blockchain” gained popularity through Ethereum, it originally referred
    to the foundational infrastructure of the Bitcoin system.


    A blockchain is characterized by a decentralized and distributed ledger, where
    all nodes in a peer-to-peer network possess identical copies of transaction records.
    These transactions are grouped into blocks, sequentially linked, and undergo validation
    through consensus mechanisms like Proof of Work (PoW) or Proof of Stake (PoS).
    In the PoW consensus mechanism, exemplified in Bitcoin, a node initiates a transaction,
    and other nodes verify it. Miners compete to generate a new block containing validated
    transactions by finding a unique numerical value (nonce) that meets a specific
    target requirement. The successful miner receives transaction fees and newly created
    coins.


    Ethereum, with its SC functionality, facilitates the deployment of programmable
    contracts on its blockchain through the Ethereum Virtual Machine (EVM). Users
    interact with SCs by submitting transactions executing predetermined functions
    defined within the contract. The concept of gas holds high significance, representing
    the computational effort required for operations on the Ethereum network. Users
    pay transaction fees in gas, with the gas price determined in real time based
    on network congestion.


    To address Ethereum’s scaling issues and mitigate the impact of rising gas prices,
    Layer 2 solutions like rollups have emerged. Rollups consolidate multiple transactions
    into a single transaction on Layer 1, resulting in substantial fee reductions.
    Optimistic rollups presume transactions are valid unless proven otherwise, while
    zero-knowledge rollups offer validity proofs without optimistic assumptions. Furthermore,
    sidechains serve as an alternative scaling solution, operating in parallel with
    Ethereum, but independent of its security or data availability. Sidechains interact
    with Ethereum through communication bridges, involving certain trade-offs when
    compared to Layer 2 solutions.


    ### 1.3.1 Ethereum


    Ethereum introduced SCs and their deployment on its network, setting a trend for
    other blockchains to follow. This led to Solidity, Ethereum''s programming language,
    which is becoming the most widely used language for designing SCs. The major building
    blocks of the Ethereum blockchain include state, state transitions, accounts,
    messages, and transactions [21].


    Compared to the Bitcoin blockchain, Ethereum is more computationally capable.
    While Bitcoin only stores a copy of the transaction list and the most recent state,
    along with additional values such as block number and difficulty. The state transition
    function is integral to the block validation algorithm, which executes transaction
    code. Consequently, all nodes executing transaction verification code will also
    execute contract code as part of the state transition function in the block validation
    process.


    When a transaction is added to a new block (B), the code execution initiated by
    that transaction is executed by all nodes, both current and future, that download
    and validate block B [22].


