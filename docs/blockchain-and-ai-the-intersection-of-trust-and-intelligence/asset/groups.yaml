    revealing general statistics and behavioral patterns of the dataset''s population,
    without disclosing specific information about any single individual. The fundamental
    idea behind DP is to introduce random noise or substitutions to the data in a
    way that the overall impact on the population''s average behavior remains minimal,
    thereby ensuring privacy.


    An algorithm is considered differentially private if an observer examining its
    output cannot determine whether a particular individual''s data were used during
    the computation. In the context of this chapter, DP is employed as a means to
    prevent the reconstruction of original data points used in updating the model.
    This is achieved by injecting random noise into the datasets before the training
    process. When the noise level is appropriately set, it becomes highly challenging
    for an attacker to determine whether a specific data point from the target victim
    was used or not.


    However, it''s essential to be cautious while tuning the added noise, as it can
    impact the precision of the model update obtained.


    ## 1.5 Blockchain-Enabled Federated Learning


    The IoT has witnessed continuous growth, resulting in vast amounts of data that
    greatly contribute to the success of current AI systems. To optimize the utilization
    of these data, prevailing distributed learning systems traditionally train their
    models on a centralized cloud infrastructure with substantial computing capacity.


    Amidst the rising popularity of IoT networks, concerns regarding privacy and centralization
    have become prominent. Data generated by IoT devices often contain highly sensitive
    information, making it vulnerable during transmission or storage on cloud servers.
    In response to this, federated learning was introduced, preserving sensitive data
    on devices to enhance privacy.


    However, the concentration of cloud computing services limits options for IoT
    devices in federated learning, impacting the selection of suitable providers with
    necessary aggregation capabilities. Moreover, potential risks arise from cloud
    service providers engaging in fraudulent or malicious behavior, compounded by
    the lack of visibility in cloud-based training techniques. As a consequence, data
    providers remain unaware of the utilization of their data once the model is trained.


    To address the challenge of non-transparency, this chapter employs a blockchain-based
    federated learning paradigm. SCs deployed on the blockchain, with code linked
    to the contract''s address, ensure transparency for all training participants.
    Despite the advantages of blockchain-based federated learning, certain limitations
    persist in establishing the legitimacy and involvement of training participants.
    Dishest behavior to conserve computing resources is a concern. To counter this,
    this chapter proposes using zero-knowledge proofs to impose significant penalties
    for malicious behavior, encouraging greater honesty among participants.


    ### 1.5.1 Current Solutions


    In recent efforts to improve federated learning through blockchain integration,
    the focus is on enhancing decentralization and mitigating potential malicious
    behavior. Blockchain plays a key role in secure model parameter storage, auditing,
    and transparent exchange among participants. Zero-knowledge proofs are utilized
    to handle malicious activities seamlessly and securely.


    An alternative approach called on-device federated learning accumulates local
    model updates on the blockchain, aiming to address centralization and provide
    motivational incentives for participants. However, this chapter emphasizes a more
    purely decentralized approach with minimal compromises to ensure scalability.


    The main limitation of FML lies in centralization, prompting the emergence of
    decentralized solutions incorporating blockchain, a distributed ledger technology.
    Blockchain facilitates trustless and decentralized coordination through SCs, code
    executed automatically when specific conditions are met. While custom blockchain
    solutions offer communication efficiency and tailored solutions, they lack extensive
    testing compared to existing public blockchains, making the latter a preferable
    choice for achieving decentralization in FML.


    Frameworks using existing blockchains face challenges due to computation and storage
    limits of SC-executed code. To overcome this, some approaches implement chunking
    to divide the code into multiple SCs, yet this method leads to complexity and
    high transaction costs. To address these issues, the proposal suggests moving
    the FedAvg algorithm''s averaging part to the clients and using a decentralized
    storage solution for their model updates.


    Data privacy is addressed using DP, which adds random noise to datasets during
    training to safeguard against reverse engineering of updates. Although this slightly
    reduces model accuracy, it protects data privacy. To handle malicious updates,
    some solutions propose a common test for assessing update quality, but this approach
    results in significant performance overhead and risks misuse. An incentive system
    is considered more effective in discouraging malicious behavior.


