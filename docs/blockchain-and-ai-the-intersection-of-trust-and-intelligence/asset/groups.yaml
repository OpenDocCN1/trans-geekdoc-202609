    # 4.9 Challenges of AI and Blockchain: The Demerits of These in Teaching and Learning


    The use of AI and blockchain in education could have certain negative effects,
    even though they have the potential to change teaching and learning. The following
    are some drawbacks of blockchain and AI in education:


    +   * Lack of Human Interaction

    * Bias and Inequality

    * Cost

    * Data Privacy and Security

    * Complexity


    It has become a common concern for education providers and teachers regarding
    LLM-based AI tools which can be used for cheating in assessments, homework, assignments,
    etc. Even some creative works like writing songs, poems, paintings, and drawings.
    It can be used for primary-level idea generation but requires an adequate level
    of research, fine-tuning, and in-depth understanding to avoid paraphrasing and
    AI detection errors (IOE London Blog, 2023). ChatGPT can generate too generic
    answers to different types of questions but those are neither always correct nor
    high standards (Figure 4.12) (Code Today, 2022).


    GPT and LLM models scale up the problem-solving strategies faster and engage as
    a form of chat to formulate the ideas to narrow down (Tsai et al., 2023).


    # 4.10 Conclusion


    Personalized, decentralized, and secure learning networks can be created by integrating
    blockchain and AI into teaching and learning, which has the potential to completely
    change the way education is provided. While blockchain-based credentialing and
    certification can offer a transparent and unchanging record of learners’ accomplishments,
    AI-powered personalized learning can adapt educational experiences to individual
    needs. Whereas blockchain can make it easier to create decentralized learning
    networks, certain components of evaluation and content creation can be automated'
