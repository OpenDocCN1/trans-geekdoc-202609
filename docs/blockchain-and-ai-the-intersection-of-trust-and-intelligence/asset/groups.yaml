    PoW 共识机制中，节点发起交易，其他节点对其进行验证。矿工通过寻找符合特定目标要求的唯一数值（随机数/nonce）来竞争生成包含已验证交易的新区块。成功的矿工将获得交易手续费和新创建的代币。


    以太坊凭借其智能合约（SC）功能，便于通过以太坊虚拟机（EVM）在其区块链上部署可编程合约。用户通过提交执行合约内定义的预定义函数的交易来与智能合约交互。Gas（燃料费）的概念具有高度意义，代表了在以太坊网络上进行操作所需的计算量。用户用
