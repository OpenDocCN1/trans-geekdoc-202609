  - '[PAGE 144]


    Now, with a safe and open system for storing and exchanging educational data and
    certificates, blockchain technology (BCT) has the potential to revolutionize education.
    There are risks and issues with using blockchain in education.


    +   Secure and Immutable Records: A secure and tamper-proof solution for keeping
    educational documents, such as diplomas and transcripts, is provided by BCT. This
    will help to prevent fraud and ensure that academic credentials are authentic.


    +   Increased Data Privacy: BCT enables people to manage their own data and share
    it with others if they have a need to know, which can help preserve student privacy
    and lower the risk of data breaches.


    +   Decentralized Learning Networks: Building decentralized learning networks
    with the aid of BCT will allow students and instructors to communicate with each
    other directly and free of intermediaries. Learning networks might compromise
    efficiency and cost.


    +   Smart Contracts: Smart contracts directly encode the terms of the contract
    between the buyer and seller into lines of code, and these contracts carry out
    their own execution. They can be used in education to automate procedures like
    student registration, tuition payments, and the validation of academic credentials.


    +   Micro-Credentials: Micro-credentials can be made using BCT to acknowledge
    abilities or accomplishments. By sharing their credentials with potential employers
    and preserving them on the blockchain, people are now able to describe their skills
    and expertise in depth.


    +   Transparent and Trustworthy Learning Eystems: BCT can contribute to the development
    of trust and accountability among students, teachers, and institutions by establishing
    a transparent and reliable learning ecosystem and boosting overall educational
    standards (Figure 4.8) (Elayyan, 2021).'
