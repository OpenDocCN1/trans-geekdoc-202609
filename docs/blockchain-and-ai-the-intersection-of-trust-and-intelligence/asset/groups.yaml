    # 42 BLOCKCHAIN AND AI


    One notable example of the use of AI in medical record keeping is the partnership
    between Google and Ascension, a major healthcare provider in the United States.
    Google uses AI to sift through Ascension''s medical information in search of patterns
    that might inform future care decisions [50].


    Analyzing medical records can benefit from using NLP as both a framework and a
    tool. NLP is the languagecomprehension subfield of AI. NLP allows for analyzing
    medical records to discover patterns and trends that would be impossible to discover
    manually [51].


    The Medicalchain platform uses distributed ledger technology (blockchain) and
    AI. Patients are afforded the right to retain their medical records, control who
    has access to data, and obtain aid in identifying and fixing any errors that may
    have been made in those records [48]. Improved patient outcomes lower systemic
    costs are expected because of Medicalchain''s use of AI in tandem with blockchain
    technology [52].


    # 2.5.3 Drug Supply Chain Administration


    By increasing the transparency, authenticity, and traceability of pharmaceutical
    items, AI and Blockchain have the potential to significantly improve the management
    of the medication supply chain. They can improve the drug supply chain management
    and authenticity in several ways:


    +   1. **Tracking the Movement of Drugs:** Using blockchain technology, the distribution
    chain of drugs may be tracked from the manufacturer to the end user. This is useful
    for ensuring that medicines have not been altered or are genuine [44].

    2. **Ensuring Authenticity:** By providing an immutable record of the drug''s
    origin and distribution, blockchain technology can be implemented to ensure that
    the pharmaceuticals being sold are genuine [53].

    3. **Predicting Drug Demand:** The need for medications can be anticipated using
    AI by analyzing historical data and current factors such as shifting populations
    and disease outbreaks. This can help ensure that individuals access to medications
    at the times when they are required to take them (Figure 2.5) [54].'
