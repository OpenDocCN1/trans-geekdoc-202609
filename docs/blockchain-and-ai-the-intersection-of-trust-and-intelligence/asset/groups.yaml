    糖尿病视网膜病变是糖尿病常见的并发症，如果不治疗可能会导致糖尿病失明。因此，DeepHealth 项目开发了一个基于人工智能的平台，通过分析医学影像数据来检测该病变。通过对
    10,000 张糖尿病患者视网膜图像的检测，该系统对视网膜病变的敏感性为 96.1%，特异性为 93.6% [64]。


    假设一名糖尿病患者去看眼科医生进行年度检查。眼科医生使用眼底相机拍摄患者眼底图像。清晰的视网膜照片会被上传到一个由 AI 进行检查的服务。平台的深度学习算法会分析照片以寻找视网膜病变的症状。


    如果检测到疾病，平台可能会通过突出照片中显示视网膜病变证据的区域来解释诊断。眼科医生可以查看平台对患者状况的分析，发现问题的原因以及最佳治疗方案。


    ## 2.8 对实施正负影响的全面评估


    人工智能和区块链技术是非常出色的工具。为了确保患者数据安全并在疾病发生前进行预测，这两项技术可以提供帮助。然而，这项技术也存在一些缺点和积极影响。


    ### 2.8.1 积极影响


    - 1. **提高数据安全与隐私**：为了减少数据泄露和未经授权的可能，患者信息可以通过基于区块链的去中心化平台进行存储和共享 [44,65]。

    - 2. **简化管理流程**：使用区块链技术可以简化并自动化包括账单和理赔处理在内的管理任务，从而减少错误并提高生产力 [66]。

    - 3. **个性化医疗**：通过分析患者数据，AI 可以通过允许治疗方案适应个体，从而实现个性化医疗。医疗治疗的结果和成本可能会受益于此 [67]。

    - 4. **增强预测分析**：人工智能使得在疾病进展早期进行干预成为可能 [68]。


    ### 2.8.2 负面影响


    - 1. **职场取代**：由于人工智能和区块链技术在医疗行业的广泛使用，一些医疗工作人员（特别是行政职位的人员）可能会失去工作 [69]。

    - 2. **技术局限性**：由于规模和标准化数据格式的需求等技术挑战，在医疗领域实施人工智能和区块链可能面临困难 [70]。

    - 3. **可扩展性与性能**：在医疗保健中结合区块链技术使用人工智能可能由于尺寸和速度的限制而具有挑战性。区块链网络的数据处理速度和准确性取决于所采用的共识机制。需要近乎实时响应的
    AI 算法可能会因此变慢 [71]。


    ## 2.9 医疗领域人工智能与区块链技术面临的开放挑战


    收益不是免费的。虽然区块链和人工智能技术在医疗领域的转型效应是不争认的，但这些进步伴随着高昂的初始投资并需要大量的本地数据存储。以下是一些统计数据，提供了人工智能和区块链技术目前医疗领域面临的问题视角。


    ### 2.9.1 隐私问题


    保护患者隐私非常，因为他们的个人信息存储在医疗数据库中。当人们在公共区块链上共享数据时会产生隐私担忧。由于区块链是去中心化且透明的，数据保护存在巨大风险。已经建立了不同的方法（如分布式共识）来应对区块链技术强调的隐私问题
    [72]。


    ### 2.9.2 资源限制、能力与数据存储


    区块链和人工智能需要各种数据存储和容量。最近的区块链技术对同时网络交易的数量有限制。这意味着处理交易需要高能耗，这也导致了能源消耗增加 [72]。相比之下，基于
    AI 的系统需要复杂的硬件。不仅是硬件，它还涉及许多算法的复杂计算，这些算法在每个周期中处理大量数据（图 2.6）。


    ### 2.9.3 区块链安全与威胁


    区块链系统的安全性最近在研究中被暴露协议问题


    （img/9ec265fe90cfcff7aaed671ae7cfbe4_63_0.png）


    区块链技术与多种潜在风险相关。AI 学习和模型输出可能会受到攻击者注入虚假数据或样本的影响，这对消费者的健康安全构成威胁。已发现区块链技术极易受到 DNS（域名系统）攻击和内存池攻击等网络攻击。


    ### 2.9.4 缺乏标准、互操作性与法规


    正如我们所知，在实施任何操作之前应该有法规。大多数人工智能和区块链的整合仍限于学术研究，很少有应用实现了这一点。医疗领域采用区块链的主要挑战之一是所有权问题。由于存在公有链和私有链，人们会合理地怀疑谁对那里存储的信息负责。当没有中央机构来应对技术后果时，会产生许多法律和监管问题
    [29]。


    ## 2.10 未来研究方向


    该模型（人工智能和区块链技术）需要进一步研究，因为该领域正在快速发展。区块链与人工智能的隐私和安全性还有很长的路要走。未来的研究还可以关注实施现代哈希算法和安全的授权系统。实施双重认证的优缺点已得到缓解。为了进一步提高区块链的稳定性，许多研究人员建议使用协作计算而非非协作
    [73]。


    （img/9ec265fe90cfcff7aaed671ae7cfbe4_65_0.png）


    图 2.7 人工智能与区块链


    ## 2.11 结论


    本节概述了区块链和人工智能在医学中的应用。在新冠肺炎期间，对这两项技术的实际影响进行了大量研究。2022 年，区块链市场价值超过 5 亿美元。在本章中，我们探讨了人工智能保护电子健康记录（EHR）及其他机密记录的潜力。数据处理和扫描是结合人工智能与区块链可以自动化的两项任务。

