    ## 4.4 基于区块链的凭证与认证


    基于区块链的凭证是验证学术和职业凭证的一种突破性方法。它涉及利用区块链技术（BC）产生不可篡改的文档（Islam et al., 2022）。


    验证学术和职业资格通常是一个辛苦且复杂的过程。纸质证书和成绩单由教育机构和企业发布，但这些可能会损坏、丢失或被篡改，且需要手动验证。区块链凭证寻求通过创建去中心化的防破解方法来简化这一过程（图
    4.10）。


    区块链凭证的实施并非没有挑战。一个挑战是对统一性的需求。对于数字凭证，必须有一种被广泛认可的格式。隐私需求是另一个问题。尽管比传统方法更安全，但区块链凭证仍需隐私数据交换。


