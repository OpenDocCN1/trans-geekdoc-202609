    # 2.1.2 Blockchain Layered Technology


    2.1.2.1 Layers of Blockchain Technology A blockchain system has several interconnected
    layers to securely store information, reach consensus, and execute smart contracts.
    Blockchain layers often include the following:


    +   1. Application Layer: The application layer is a blockchain''s last and most
    complex part. It''s made up of apps that people use to communicate with the distributed
    ledger. Examples include wallets, user interfaces, and decentralized apps (DApps).
    Users can access the blockchain network and its features via the application layer
    [2].'
  merge: -1
  img_proc: true
- pgno: 41
  md: '2. Smart Contact Layer: This layer enforces and executes the blockchain network''s
    business logic and governing laws. “Smart contracts,” or contracts with pre-programmed
    triggers and responses, ensure their conditions are always carried out. They make
    building decentralized apps on the blockchain possible, facilitating tasks'' automation
    and simplifying financial transactions [1].


    3. Consensus Layer: This layer coordinates the consensus among blockchain nodes
    on the integrity and chronological order of transactions. Besides that, it guarantees
    that the network agrees on the blockchain''s current state. Proof-of-Work (PoW),
    Proof-of-Stake (PoS), and Practical Byzantine Fault Tolerance (BTFT) are just
    a few examples of consensus processes used to keep the network safe and secure
    [3].


    4. Network Layer: This layer handles the communication and connection to the blockchain
    network. It also ensures data transmission, messages, and transactions between
    nodes in a peer-to-peer manner [4]. The network layer establishes and maintains
    the network topology, manages node discovery, and handles data propagation across
    the blockchain network.


    5. Data Layer: This layer is used for storing and managing the data of the blockchain.
    In the distributed ledger, where the entire transaction history is saved, this
    layer consists of that ledger. It uses cryptographic techniques to integrate the
    data [5].


