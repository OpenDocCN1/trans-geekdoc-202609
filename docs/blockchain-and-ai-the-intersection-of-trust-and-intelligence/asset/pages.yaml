    Also, while the ML models used may predict certain market trends effectively,
    they may not account for all potential market movements due to the inherently
    unpredictable nature of financial markets. Moreover, the views expressed by the
    market participants and experts in the qualitative research component are subjective
    and may not encompass the broad spectrum of opinions within the field (Figure
    3.1).


