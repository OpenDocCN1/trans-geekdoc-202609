    # 3.7 ML in Trading Strategies


    # 3.7.1 Basics of ML for Trading Strategies


    Because it can analyse vast amounts of data and find patterns, ML has gained popularity
    in trading strategies. The fundamentals of ML for trading strategies, along with
    the pertinent mathematical terms, are as follows:


    **Supervised learning** is a type of ML in which the algorithm picks up knowledge
    from labelled data. This implies that the algorithm is trained using historical
    data with well-known results in the context of trading strategies. Decision trees,
    logistic regression, and linear regression are common supervised learning methods
    used in trading strategies.


    **Unsupervised learning** is a type of ML in which the algorithm picks up knowledge
    from unlabelled data. This means that in the context of trading strategies, the
    algorithm is used to find patterns in data without knowing the results in advance.
    Principal component analysis and clustering are two common unsupervised learning
    methods used in trading strategies.


    **Reinforcement learning** is a type of ML in which the algorithm picks up knowledge
    by making mistakes. This implies that the algorithm is trained to maximize a reward
    function based on its actions in the context of trading strategies. Q-learning
    and deep reinforcement learning are two common reinforcement learning methods
    used in trading strategies.


    A common issue in ML is **overfitting**, when the algorithm fits the training
    data too closely and is unable to generalize to new data. Poor performance in
    real-world situations may result from this. To avoid overfitting in trading strategies,
    regularization techniques like L1 and L2 regularization are frequently used.


    **Cross-validation** is a technique used to assess how well a ML algorithm performs
    on fresh data. To test an algorithm''s general-izability to new data, it is tested
    on a different dataset in the context of trading strategies. The K-fold cross-validation
    and leave-one-out'
