    # 1.2.2 Components of a Neural Network


    An artificial neural network''s neuron shares functional and structural similarities
    with a biological neuron. It can send its output to multiple other artificial
    neurons, receiving feature values from external data samples or the outputs of
    other neurons as inputs. The weighted sum of all inputs is computed for each neuron''s
    output, taking into account the weights of links connecting the neuron, along
    with a bias term. This weighted total, known as the activation, is then passed
    through an activation function, typically nonlinear, to produce the neuron''s
    final output. The first layer of neurons receives external data as inputs, while
    the final outputs achieve the network''s classification or regression goal [16].


    The neural network consists of connections, where each link serves as an input
    to another neuron. Each link is assigned a weight reflecting the strength of the
    relationship. A neuron may have multiple input and output connections [17].


    Forward propagation is employed in deep learning, where the input to a neuron
    is computed as a weighted sum of inputs from previous neurons. The inputs are
    multiplied by the weights of the next layer, and the bias of each layer is added.
    An activation function is applied if applicable. This process is repeated for
    each layer until the final output layer is reached [18].


    Deep learning networks typically organize neurons into multiple layers, forming
    complex structures. Neurons in a layer communicate only with neurons in the immediately
    preceding and succeeding layers. The input layer accepts data from external sources,
    and the output layer produces the final outcome. Between them, there may be zero
    or more hidden layers. Networks with a single layer or without hidden layers are
    also used. Various connection patterns can be established between two layers,
    such as fully connected neural'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 8 BLOCKCHAIN AND AI


    networks, where every neuron in one layer connects to each neuron in the following
    layer. Alternatively, pooling may occur, where a group of neurons in one layer
    connects to a single neuron in the next, reducing the number of neurons in that
    layer. These connection patterns form a directed acyclic graph known as a feedforward
    network in mathematics [19].


    # 1.2.3 Learning Process


    Learning in a neural network involves improving its ability to perform classification
    or regression more efficiently based on sample observations. The process revolves
    around adjusting the network''s weights (optional thresholds) to enhance the accuracy
    of its output and reduce otherwise mistakes. Learning is considered complete when
    additional data do not significantly reduce the error rate, though it never reaches
    zero. If the error rate remains unacceptably high after learning, the network
    must be rebuilt. To accomplish this, a cost function is defined and evaluated
    at regular intervals during the learning process. For classification tasks, the
    network''s output is mapped to specific classes, and a loss function computes
    the error between predicted and actual labels for input data. The objective of
    learning is to minimize the sum of errors across all observed data [17].


    The learning rate determines the magnitude of corrective steps the model takes
    for each observation''s mistakes. A higher learning rate reduces training time
    but may lead to lower overall accuracy, while a lower learning rate increases
    training time but has the potential for higher accuracy. The choice of a cost
    function is influenced by desired characteristics, such as convexity, or derived
    from the model, like using a cost function based on the model''s posterior probability.
    The learning rate is essential in preventing the model from getting stuck in local
    minima and instead converging toward a global minimum [20].


    During learning, backpropagation is a technique used to adjust the weights to
    account for each discovered mistake. It efficiently distributes the total number
    of errors across connected devices. Backpropagation calculates the gradient (derivative)
    of the cost function associated with a particular state, enabling weight updates.
    SGD is a commonly used method for updating the weights [18].'
