    The main limitation of FML lies in centralization, prompting the emergence of
    decentralized solutions incorporating blockchain, a distributed ledger technology.
    Blockchain facilitates trustless and decentralized coordination through SCs, code
    executed automatically when specific conditions are met. While custom blockchain
    solutions offer communication efficiency and tailored solutions, they lack extensive
    testing compared to existing public blockchains, making the latter a preferable
    choice for achieving decentralization in FML.


    Frameworks using existing blockchains face challenges due to computation and storage
