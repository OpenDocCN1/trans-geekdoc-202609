  md: '# 112 BLOCKCHAIN AND AI


    +   1. **Index**: This is a unique identifier for each block in the chain. It
    typically starts at 0 for the genesis block and increments by 1 for each new block.


    +   2. **Timestamp**: This is the time at which the block was created. It''s typically
    represented as the number of seconds since the Unix Epoch (00:00:00 UTC on 1 January
    1970).


    +   3. **Transaction**: This is a string representing the transactions that are
    included in the block. In a real blockchain, this would usually be a list of all
    transactions.


    +   4. **Previous Hash**: It is the hash of the previous block in the chain. It''s
    one of the key features of a blockchain that provides security and immutability.
    Any change in a block will change its hash, and since the hash is included in
    the next block, a change to any block would also change all subsequent blocks
    in the chain.


    +   5. **Nonce**: This is a number that has been found to make the hash of the
