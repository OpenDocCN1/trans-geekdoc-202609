    # 3.11.4 Challenges and Limitations of Using AI and Blockchain Technology in Trading
    Strategies


    First, one of the challenges is related to the accuracy and reliability of AI
    algorithms. According to Han et al. [59], while AI can provide valuable insights
    and predictions, it is not infallible and may make mistakes or produce inaccurate
    results. Additionally, AI algorithms require significant amounts of historical
    data to be trained properly, which can be a challenge for newer markets or assets
    with limited data available [60].


    Secondly, blockchain technology also presents its own set of challenges. One of
    the main limitations is the scalability of the blockchain network, which can become
    congested and slow during periods of high transaction volume [61]. This can potentially
    impact the efficiency of trading strategies that rely on quick execution times.


    Another challenge is the lack of regulation and oversight in the blockchain space,
    which can make it difficult to assess the credibility and legitimacy of certain
    blockchain-based trading platforms and assets [62]. Additionally, the decentralized
    nature of blockchain can also make it challenging to identify and address security
    vulnerabilities and risks.


    Eventually, the challenges and limitations of using AI and blockchain technology
    in trading strategies include the accuracy and reliability of AI algorithms, the
    scalability and regulation of blockchain technology, and potential security vulnerabilities.
    It is important for traders to carefully evaluate these factors when incorporating
    these technologies into their trading strategies [63].


    # 3.11.5 Future Research Directions and Opportunities


    There are several potential future research directions and opportunities for using
    ML, AI, and blockchain technology to predict trading'
