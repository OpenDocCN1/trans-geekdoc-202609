    # 3.10.12 Model Selection in Mathematical Context


    Using statistical measures like the Akaike Information Criterion (AIC) or the
    Bayesian Information Criterion (BIC) is a typical approach, claims the mathematical
    model [54]. These metrics assess how well a model fits the dataset while penalizing
    models with higher levels of complexity. For example, the AIC is calculated as
    AIC = 2k–2ln(L), where k is the number of parameters in the model and L is the
    likelihood of the data given in the model. The best fit for the data is generally
    regarded as being the model with the lowest AIC value.


