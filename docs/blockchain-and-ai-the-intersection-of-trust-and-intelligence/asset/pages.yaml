    # 1.5 Blockchain-Enabled Federated Learning


    The IoT has witnessed continuous growth, resulting in vast amounts of data that
    greatly contribute to the success of current AI systems. To optimize the utilization
    of these data, prevailing distributed learning systems traditionally train their
    models on a centralized cloud infrastructure with substantial computing capacity.


    Amidst the rising popularity of IoT networks, concerns regarding privacy and centralization
    have become prominent. Data generated by IoT devices often contain highly sensitive
    information, making it vulnerable during transmission or storage on cloud servers.
    In response to this, federated learning was introduced, preserving sensitive data
    on devices to enhance privacy.


    However, the concentration of cloud computing services limits options for IoT
    devices in federated learning, impacting the selection of suitable providers with
    necessary aggregation capabilities. Moreover, potential risks arise from cloud
    service providers engaging in fraudulent or malicious behavior, compounded by
    the lack of visibility in cloud-based training techniques. As a consequence, data
    providers remain unaware of the utilization of their data once the model is trained.


    To address the challenge of non-transparency, this chapter employs a blockchain-based
    federated learning paradigm. SCs deployed on the blockchain, with code linked
    to the contract''s address, ensure transparency for all training participants.
    Despite the advantages of blockchain-based federated learning, certain limitations
    persist in establishing the legitimacy and involvement of training participants.
    Dishest behavior to conserve computing resources is a concern. To counter this,
    this chapter proposes using zero-knowledge proofs to impose significant penalties
    for malicious behavior, encouraging greater honesty among participants.'
