    # 1.4 Privacy Preserving


    # 1.4.1 Zero Knowledge


    Zero-knowledge (ZK) proof is a method where a prover convinces a verifier that
    it possesses specific information (a secret) without revealing the actual information.
    The zero-knowledge proof must satisfy two crucial requirements: completeness,
    ensuring an honest verifier is convinced when the statement is true, and soundness,
    preventing a cheating prover from convincing an honest verifier of a false statement.


    For true zero-knowledge, the proof must achieve completeness and soundness without
    transmitting the secret information between the prover and verifier. This property
    makes zero-knowledge'
