- pgno: 27
  md: '# BLOCKCHAIN EMPOWERED FEDERATED LEARNING 13


    proofs useful for privacy-sensitive applications, like authentication systems,
    where credentials or identities can be verified without disclosing the actual
    details.


    There are two types of zero-knowledge proof approaches: zk-SNARK (Succinct Non-interactive
    ARgument of Knowledge) and zk-STARK (Succinct Transparent ARgument of Knowledge).
    zk-SNARKs are well-established and adopted, but they require a trusted setup,
    potentially leading to centralization issues.


    In contrast, zk-STARKs do not require a trusted setup, but their proofs are larger
    compared to zk-SNARKs. The main advantage of zk-STARKs is their transparency,
    while zk-SNARKs have computational soundness.


    1.4.1.1 Interactive Proofs Zero-knowledge proofs require interactive engagement
    between entities proving their identity and validators. The prover responds to
    challenges posed by the verifier, convincing the validity of a statement if the
    prover possesses the claimed knowledge. To avoid protocol replay attacks, the
    verifier should learn any additional information beyond the truth of the statement.
    Three essential properties of zero-knowledge proofs must be met:


    +   1. Completeness: An honest prover convinces an honest verifier if the statement
    is true.

    2. Soundness: No cheating prover can persuade an honest verifier that a false
    statement is true, except with an extremely small probability.

    3. Zero Knowledge: The verifier gains no extra information about the secret, apart
    from the statement’s truth.


    The third property distinguishes zero-knowledge proofs from regular mathematical
    proofs, making them probabilistic. Although there is a small chance of a soundness
    error, strategies can be employed to minimize this possibility to negligible levels.


    1.4.1.2 Non-Interactive Proofs In 1988, Blum, Feldman, and Mical demonstrated
    the possibility of achieving computational zero-knowledge without interaction
    by using a common reference string shared between the prover and the verifier.
    This breakthrough eliminated the need for back-and-forth communication. However,'
