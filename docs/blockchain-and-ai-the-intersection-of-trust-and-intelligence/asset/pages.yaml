- pgno: 15
  md: '# BLOCKCHAIN EMPOWERED FEDERATED LEARNING


    REZA NOURMOHAMMADI


    # 1.1 Introduction


    Over the past years, the field of Artificial Intelligence (AI) has piqued increasing
    interest, permeating various domains such as driverless cars, medical care, and
    finance. AI has also become an integral part of people''s daily lives through
    applications like recommender systems on social media and streaming services.
    In this chapter, our focus will be on one specific aspect of AI: machine learning
    (ML).


    As highlighted by Yang et al. [1], despite the substantial efforts made by researchers
    and industries to enhance ML algorithms, the true impediment to ML success lies
    in the scarcity of user data.


    In the big data era, one of the most critical intelligent applications is multiparty
    learning or federated learning. As institutions, companies, and smart devices
    collect vast amounts of data daily, the conventional approach of centralizing
    all data for learning becomes inefficient and insecure. In multiparty learning,
    the process is distributed, enabling each party to keep their data locally. Most
    existing multiparty learning systems focus on training a global model for all
    parties, neglecting the potential of utilizing local models already trained on
    individual datasets. Effectively utilizing these local models can substantially
    improve the training efficiency of multiparty learning. Some researchers have
    explored model averaging techniques to enhance performance and proposed methods
    resilient to Byzantine attacks.


    However, a challenge arises from assuming that local models at each party are
    homogeneous, which may not be practical. Some works attempt to address this by
    proposing methods to calibrate heterogeneous-local models in the system. Yet,
    these approaches often rely on a'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# 2 BLOCKCHAIN AND AI


    trusted central server to coordinate the distributed learning process, introducing
    a single point of failure and susceptibility to attacks. Only a few works have
    ventured into designing decentralized multiparty learning systems, with some focusing
    solely on linear models.


    Traditional ML approaches involve centralized data collection and training, raising
    significant challenges concerning data sensitivity, particularly with respect
    to privacy. For instance, in medical research involving multiple centers, sharing
    sensitive patient information for model training may not be feasible to privacy
    concerns. The same privacy issues apply to personal smartphones with vast amounts
    of data, such as search preferences, when centralized in data centers.


    To address these challenges, distributed ML has emerged as a potential solution.
    Leveraging the increasing computing power of user devices, distributed ML allows
    training models locally while exchanging only necessary information, preserving
    privacy and security. This approach represents a step toward overcoming the limitations
    of traditional centralized learning methods and presents an open and challenging
    problem for secure decentralized multiparty learning with heterogeneous models,
    requiring further research and innovative solutions.


    Federated machine learning (FML) operates by forming a Federation of clients that
    compute local model updates (i.e., training) based on their respective datasets.
    These updates are then averaged by a Central Coordinator Server to create a global
    model. This process is repeated for a certain number of communication rounds,
    and the algorithm used is called Federated Averaging (FedAvg). Thanks to FML,
    the benefits of obtaining a global model are retained, and participants’ data
    privacy is preserved as sensitive information is not disclosed.


    # Algorithm 1.1: Federated Averaging


    ```

    # Initialization

    Initialize global model parameters θ

    Initialize empty list of client datasets D = {D_1, D_2, ..., D_N}

    ```'
