  md: '# EMPOWERING HEALTHCARE 25


    With the term “Blockchain,” now we can imagine a world where contracts are written
    in some codes and keep secret in a database that gets protection from all sorts
    of tampering, deletion, or revision.


    # 2.1.1 Lets Help You Understand the Basic Concept of Blockchain with a Simple
    Example


    Consider a group of mates interested in keeping track of their joint spending.
    They could keep track of everything with a spreadsheet or other online spreadsheet
    document, but then someone would have to administer it and ensure the data are
    valid. They opt to employ a blockchain instead. A consensus protocol for adding
    new transactions to the blockchain was discussed, and it was stated that “each
    friend is going to have their copy of the blockchain.


    In this example, we will pretend that Alice owes Bob $10. Alice inserts this transaction
    into a new block, and her friends confirm that it is legitimate (i.e., she does
    owe Bob $10). After the transaction has been validated, a new hash is generated
    for the block, which is added to each friend’s copy of the chain.


    Let’s pretend that Bob has $5 and is interested in purchasing something from Charlie.
    Bob includes this transaction in a new block, and his pals check to ensure it’s
    legitimate before accepting it. An identical copy of the chain is constructed
    for each friend, and a new hash is generated for the newest block.


    The more transactions there are in a chain, the more secure and difficult to alter
    each block will become. This is because each block includes a distinct hash calculated
    from the block’s contents and the preceding block’s hash. All subsequent hashes
    would become invalid if a block was tampered with, sending a signal to the network
    that something was amiss.


    The above scenario demonstrates the basic idea of a blockchain. With the help
    of cryptography and a decentralized network (a network with no central authority
    or control), blockchain can provide a secure and transparent way for people to
    make financial transactions.


    Now let’s get back to the history of blockchain again. In 2008, a whitepaper called
    “Bitcoin: A Peer-to-Peer Electronic Cash System” by an anonymous person or group
    of people using the name “Satoshi Nakamoto” was the first time the blockchain
    was mentioned [3].'
