    \ transactions and read encrypted messages that are sent to them.\n\nIn Hyperledger\
    \ and Corda, identity is encoded in x.509 certificates, which includes the user’s\
    \ public key. In Corda, certificates can either be public, which means that they\
    \ are published to the blockchain, or confidential, meaning that they are only\
    \ shared with the parties that the owner performs transactions with.\n\n## Anonymity\
    \ in Blockchain\n\nAnonymity in blockchain is a crucial part of its success in\
    \ some applications. If individuals or organizations are performing transactions\
    \ on blockchain, they may not wish this to be public. Different blockchains have\
    \ different levels of anonymity and privacy built into the protocol. \n\nAs discussed\
    \ earlier, public key cryptography maintains identity on the blockchain, by using\
    \ a pair of public and private keys to make encryption and digital signatures\
    \ possible.\n\nAt this point, we need to take a look at the relationship between\
    \ a user’s keys and their actual identity. The first thing to note is that there\
    \ is nothing about a public key that ties to its corresponding private key. Since\
    \ private keys are secret, it cannot be possible for someone to determine a private\
    \ key from a public key, whereas you can calculate a public key from a private\
    \ key. The other thing to keep in mind is that private keys are just numbers and\
    \ cannot be tied to users actual identity. Identity on blockchain is just possession\
    \ of the relevant private key, and even if someone guesses or steals a private\
    \ key, they cannot learn its owner’s actual identity from the private key directly.\
    \ \n\nHence you cannot tie public keys to private keys or private keys to real-world\
    \ identities, which means that blockchain users have a limited amount of built-in\
    \ privacy. \n\nHowever, every transaction on blockchain is public and stored there\
    \ forever. This means that a lot of information about the users’ identity could\
    \ be learned through studying the data stored on the blockchain to obtain the\
    \ metadata. Based on the repeated transactions to places like a restaurant or\
    \ a coffee shop, someone could get an idea of where an individual lives and their\
    \ habits. For businesses, repeated transactions may indicate business relationships\
    \ that may lead to a loss of competitive advantage if leaked. \n\nOn basic blockchain,\
    \ anonymity goes only so far. The limited level of anonymity and privacy protections\
    \ available on the original blockchain have inspired enhancements that increase\
    \ privacy, while still allowing transactions to be verified and validated publicly\
    \ on the blockchain. \n\nSome of the mechanisms developed and implemented to increase\
    \ privacy protections are:\n\n*   Zero knowledge proofs – They use cryptographic\
    \ algorithms to allow a user to prove knowledge of a secret without revealing\
    \ the actual secret. The validator proves the knowledge of the secret without\
    \ actually revealing it. A common example includes a colorblind person and two\
    \ identical object except for color. The colorblind person shows one object to\
    \ the validator, conceals both objects, and the shows the one to the validator\
    \ again. The validator then verifies whether or not it is the same object, without\
    \ revealing the color of either object. \n\n*   Stealth approach – Stealth addresses\
    \ involve using one-time addresses to perform transactions on the blockchain.\
    \ A stealth address is just a one-time address that makes it impossible to link\
    \ a transaction to a known account. What it does is prevents the data mining attacks\
    \ on privacy of users.\n\n*   Ring signatures – Blockchain transactions are digitally\
    \ signed. With ring signatures, all that can be determined from a transaction\
    \ is that a member of the group signed it, but not the actual member.\n\n*   CoinJoin\
    \ – The ability to see who is performing the transactions with whom is dangerous\
    \ to user privacy and anonymity. CoinJoin mixes several transactions together\
    \ such that it is difficult to pair senders with recipients.\n\n*   Confidential\
    \ transactions – Confidential transactions take advantage of homomorphic encryption,\
    \ which makes it possible to perform mathematical operations on encrypted data.\
    \ This means that the data contained in a transaction can be hidden from the public,\
    \ while still allowing the network to validate the transaction.\n\nSpecific Anonymity\
    \ Implementations\n\n*   Ethereum – Ethereum is working on improving the zero-knowledge\
    \ proofs, mixing and DAPPS (applications developed to improve anonymity)  to strengthen\
    \ blockchain privacy. Also ConsesSys, the enterprise solution builder for Ethereum\
    \ introduced QUORUM, a fork of the Ethereum blockchain which enables users to\
    \ benefit from the public Ethereum blockchain while enjoying features from a private\
    \ network. Developed by JP Morgan, it is a permissioned implementation.\n\n* \
    \  Hyperledger \n\n    *   Channels – Subsections of the blockchain that make\
    \ the transactions visible only to the members.\n\n    *   Private transactions\
    \ – Hashes of private data are stored to publicly verify it on the blockchain.\n\
    \n    *   Zero-knowledge Proof – One can demonstrate the knowledge of a secret\
    \ without revealing the secret itself.\n\n*   Hyperledger Besu – Besu is an Ethereum\
    \ client that runs on the Ethereum public network, private networks, and test\
    \ networks such as Rinkeby, Ropsten, and Gorli. Hyperledger Besu includes several\
    \ consensus algorithms including PoW, PoA, and IBFT, and has comprehensive ‘permissioning’\
    \ schemes designed specifically for users in a consortium environment.\n\n*  \
    \ Corda – Party on the Corda network can be represented in one of the two ways:\
    \ Party – A public key name and; Anonymous party – Only a public key. \n\n# Blockchain\
    \ in Real World\n\nIn this chapter, we will discuss the real-world problems blockchain\
    \ can solve. We will discuss the concept of immutability and how the append only\
    \ blockchain brings new trust in shared information. Next, we will see how smart\
    \ contracts bring autonomy to the systems that previously required human interaction.\
    \ We will discuss how blockchain solves the double-spending issue. Next we will\
    \ provide a brief insight on popular cryptocurrencies and the new business trends\
    \ made possible by blockchain. Finally, we will discuss the emerging world of\
    \ non-fungible tokens (NFTs) and how they enable owning unique rights to everything\
    \ from music, sports, collectables and even photographs. \n\n## How Blockchain\
    \ solves real-world problems\n\nImmutability"
