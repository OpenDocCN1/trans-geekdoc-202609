    Blockchain platforms consist of a wide range of components, which enables enterprises
    to select the appropriate components for different kinds of capabilities.


    However, it useful to examine these four key features when evaluating blockchain
    platforms and components:


    - **Public (Open) or Private (Closed) Platform** – Whether a platform is open
    (that is, a public blockchain) or closed (a private blockchain) and how that affects
    speed and security. Anyone can join a public blockchain, which can make it easier
    to set up for small-business users, such as farmers. The downside is that public
    blockchains are not as fast. Also the private platforms provide more data security
    for organizations. Many of the blockchain code bases can be modified to be either
    open or closed.

    - **Consensus mechanism** – Whether the platform leverages `Proof-of-Work (PoW)`,
    `Proof-of-Stake (PoS)` or Byzantine fault tolerance as its consensus mechanism.
    `Proof-of-work` is the older mechanism used in `Bitcoin` and `Ethereum`, however
    its slower compared to `Proof-of-Stake`, which is newer and less proven but faster
    and more efficient.

    - **Ledger technology and how it records the transactions** – This relates to
    how the blockchain keeps track of information. Popular approaches include an account
    model and `UTXO`. An account model records the balance, whereas the `UTXO` model
    is analogous to cash with serial numbers in your wallet. The account model is
    used in the blockchain platforms `Ethereum`, `Stellar`, `Tron` and `EOSIO`. `IBM
    Blockchain`, `Hyperledger Fabric` and `Hyperledger Sawtooth` use `UTXO`.

    - **Programming language and functions** – Smart contract functions for capturing
    business logic on the blockchain. Popular programming languages include `Ethereum
    Solidity` for `Ethereum` blockchain, `WebAssembly` languages for `IBM`, and `Digital
    Asset Modeling Language`.


    The most popular blockchain platforms are as follows:


    ### 1. Ethereum

    Introduced in 2013, `Ethereum` is one of the oldest and most established blockchain
    platforms, which has been offering developers an open-source distributed computing
    platform where they can discover all the benefits of blockchain. `Ethereum` uses
    a peer-to-peer approach, where users can write codes to control digital values,
    runs exactly as programmed, and is accessible anywhere in the world.


    It provides a truly decentralized blockchain that is comparable to the `Bitcoin`
    blockchain network. It enables true decentralization with support for smart contracts.
    Besides its role as a blockchain platform that underpins enterprise applications,
    it has its own cryptocurrency called `Ether`.


    The `Ethereum` platform has seen widespread adoption by technologists who build
    decentralized applications, or `dApps`, on the `Ethereum` network. For example,
    there are numerous platforms and exchanges for nonfungible tokens (`NFTs`) --
    a type of digital asset that can be exchanged on a blockchain. It has a mature
    ecosystem of tools for writing smart contracts using the `Solidity` programming
    environment, which runs on the `Ethereum Virtual Machine`.


    However, its key weaknesses include slow processing times and higher transaction
    processing costs compared to other platforms. Alternative blockchain networks
    can process transactions much faster at potentially lower cost than `Ethereum`,
    though many observers expect this to change after `Ethereum` moves to `Proof-of-Stake`
    consensus mechanism, and adopts a more efficient security mechanism.


    ### 2. IBM Blockchain

    `IBM Blockchain` is a private, decentralized blockchain network that has been
    the most successful with enterprise clients who are less risk-averse. He sees
    the biggest opportunities in using it to link into enterprise cloud and legacy
    technologies more seamlessly than is possible in other decentralized networks.


    The `IBM Blockchain` developer tool was designed to be flexible, functional and
    customizable. IBM has also invested in creating a user-friendly interface to simplify
    critical tasks, such as setting up, testing and rapidly deploying smart contracts.


    `IBM blockchain` platform has seen significant adoption in financial services
    and banking, as well as supply chain. Some examples of successful blockchain apps
    include `IBM Food Trust`, which has completed more than 18 million transactions
    representing more than 17,000 products, and `Blockchain Community Initiative`
    in Thailand, which supports services like payment obligations and enterprise auctions
    for 22 Thai banks.


    ### 3. Hyperledger Fabric

    `Hyperledger Fabric` is a set of tools that help create blockchain applications
    championed by `IBM` and `The Linux Foundation`. It was built from the ground up
    with enterprise distributed ledger uses. It has a rich ecosystem of components
    that can be plugged into a modular architecture. It works well in closed blockchain
    deployments, which can improve security and speed. It also supports an open smart
    contract model that can support various data models, such as account and unspent
    transaction output, or `UTXO`, models.


    `Hyperledger Fabric` can also improve data privacy by isolating transactions in
    channels or enabling the sharing of private data on a need-to-know basis in private
    data collections. It also enables high-speed transactions with low latency of
    finality and confirmation, according to its proponents.


    The latest updates add support for an organization to join a channel without copying
    the whole history of the ledger. This enables a quicker startup process with less
    storage required. There is an active and diverse community around `Hyperledger
    Fabric` that is working on adding more features related to consensus algorithms,
    additional privacy options for GDPR compliance and operational improvements.


    ### 4. Hyperledger Sawtooth

    Another open source blockchain initiative hosted by `Hyperledger` and `The Linux
    Foundation`, `Hyperledger Sawtooth` uses a novel consensus mechanism called `Proof
    of Elapsed Time` that can integrate with hardware-based security technologies
    to allow "trusted execution environments" of program code to run in secure enclaves,
    which are protected areas of computer memory.


    The most common applications are for developing supply chain systems and customizing
    `Sawtooth` for specific purposes, such as novel consensus algorithms.


    Work has started on a `Sawtooth Library` that will enable developers of custom
    distributed ledgers to pick and choose which pieces of `Sawtooth` they use in
    their application. At the same time, `Sawtooth` is adopting `Splinter` for networking,
    which will provide dynamic private circuits (groups of nodes); `Hyperledger Transact`
    for transaction processing, which will extend smart contract capabilities; and
    `Augrim` for consensus, which will expand the number of supported algorithms.


    ### 5. R3 Corda

    There is some debate whether `R3 Corda` is technically a blockchain or an alternative
    type of distributed ledger. It uses a novel consensus mechanism in which transactions
    are cryptographically linked but does not periodically batch multiple transactions
    into a block. Even the official `Corda` site describes it as "both a blockchain
    and not a blockchain." One of the key benefits of this approach is that all transactions
    are processed in real time, which can improve performance compared to other types
    of blockchains.


    The `R3` consortium has a strong following in the financial industry, since `Corda`
    provides an attractive approach for financial transactions and smart contracts
    with strong security. Leading proponents include `Bank of America`, `HSBC`, `Intel`
    and `Microsoft`. It has a strong chance of becoming the de facto network of insurance-related
    transaction processing. However, it faces competition from other federated blockchain
    networks that can process transactions faster and cheaper.


    ### 6. Tezos

