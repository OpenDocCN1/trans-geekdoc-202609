  trans: '

    当两个同时提交到网络的区块发生相互竞争时，就会出现这种情况。在这种情况下，矿工会在这些区块之间进行随机选择。此外，如果该区块是孤儿区块或不在最长链中，矿工将无法获得利润。


    这种证明对于网络中的任何节点都是容易验证的，但生成过程极其耗时，因为对于安全的加密哈希值，矿工必须尝试许多不同的 `nonce` 值，直到某个结果小于难度目标。通过调整此难度目标，可以改变生成一个区块所需的工作量。每
    2,016 个区块（考虑到每个区块约 10 分钟，大约 14 天），节点会根据最近的区块生成率确定地调整难度目标，目标是将新区块之间的平均时间保持在十分钟。通过这种方式，系统能够自动适应网络上的总算力总量。


    工作量证明结合区块链，使得修改区块链变得极其困难，因为攻击者必须修改所有后续区块才能使某个区块的修改被接受。随着新区块的不断产生，随着时间的推移和后续区块数量（称为该区块的确认数）的增加，修改区块的难度也会随之增加。


    ### 挖矿激励


    区块链协议内的任何类型的激励机制都能将个人利润与整体利润相结合。网络中的每个矿工都试图使其利润的价值最大化。


    `Bitcoin Profit = 比特币收入 – 比特币成本`


    `Bitcoin Revenue = 区块奖励 + 交易手续费`


    `Bitcoin Cost = 固定成本 + 变动成本`


    - **区块奖励** – `Block Reward` 是比特币矿工最重要的收入来源。这是矿工在其区块被包含在最长链中后获得的奖励。


    由于比特币的最大数量为 2,100 万个，且大约每 10 分钟就会创建一个新区块，因此根据设计，每个区块铸造的比特币数量每隔 210,000 个区块（大约每四年一次）减少
    50%。在比特币最初建立时，`Block Reward` 为 50 个比特币，到 2020 年 5 月已减少到 6.25 个比特币。


    矿工会向自己发送一笔特殊的交易，即 `coinbase transaction`。它允许铸造比特币，并激励诚实的实参与者来验证区块。由于矿工会因添加新区块而获得奖励，因此他们有动力产生更多区块。


    - **交易手续费** – 每笔比特币交易都会花费 0 个或多个比特币发送给 0 个或多个接收者。花费金额与接收金额之间的差就是 `transaction
    fee`。比特币的设计让支付者能够轻松高效地指定支付多少手续费，而让接收者指定手续费则更困难且效率更低，因此根据惯例，支付者几乎独自负责支付所有的比特币交易手续费。当矿工创建一个区块时，他有权指定该区块中所有交易支付的手续应发送到何处。如果交易产生了有效区块并成为最长链的一部分，手续费收入将发送给指定的接收者。如果一个有效区块没有收集到所有可用手续费，未收集的部分将被永久销毁。


    - **固定成本** – 允许用户挖矿比特币的硬件成本是固定成本。有不同类型的硬件，从计算设备到各种计算设备。

    - **CPU (中央处理器)**: 第一类硬件。

    - **GPU (图形处理器)**: 第二类硬件。

    - **FPGA (现场可编程门阵列)**: 第三类硬件。

    - **ASICS (专用集成电路)**: 第四类硬件。


    - **运营成本** – 运营成本的主要部分是能源成本。能源有三种类型：隐含能、电力和冷却。此外，还有基础设施和开销，例如租金成本和员工工资。


    ### ASICS


    比特币挖矿使用的 `专用集成电路 (ASICs)` 是用于挖掘比特币的高度专业化且强大的计算机。如今，所有的标准矿矿场都由 `ASICs` 组成。否则，将永远无法盈利。


    ![](img/image0256.jpeg)


    比特币 ASIC 挖矿场；来源：Bitcoin.com


    上面的图片说明比特币挖矿已经变得非常工业化，以降低成本并增加利润。机架用于系统化地分配硬件，机架上方巨大的风扇用于冷却。冷却有两种方法：水冷和风冷。水冷成本更高，但对能提供更好的硬件维护。为了降低成本，矿工会选择气候寒冷且电费便宜的地方。


    最强大的比特币 `ASICS` 之一是 `Antminer S9`，其能力每秒高达 14 万亿哈希。其生产公司 `BITMAN` 声称 `Antminer
    S9` 提供了世界上约 70% 的算力。然而，即使使用如此强大的设备，找到一个区块也需要相当的时间。


    ### 矿池


    矿池是由加密货币矿工组成的联合小组，他们通过网络结合计算资源以增加发现区块的概率。因此，矿池允许这些矿工将算力结合在一起。如果矿池成功并获得奖励，该奖励将在矿池参与者之间分配。这些奖励通常根据每个矿工的处理能力或工作相对于整个小组的比例在贡献矿工之间分配。在某些情况下，个人矿工必须展示
    `PoW` 才能获得奖励。


    矿池由矿池经理运行，经理负责运行一个完整的比特币节点并将任务分发给矿工。矿池经理还会提取部分奖励作为补偿。这样一来，矿工甚至不需要自己存储区块链：他们将硬件的访问权交给矿池，以换取矿池利润的分红。

