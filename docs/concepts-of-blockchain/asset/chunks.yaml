    # 私有区块链


    私有区块链通常被称为“许可型”区块链。与公共区块链不同（任何人都可以下载软件、创建节点、查看账本并与区块链交互），私有区块链通常由单一实体（“受信任的中间机构”）运行和运营。由于受信任的中间机构负责运行区块链，它将控制谁可以访问，并控制每个用户拥有的访问权限类型。例如，某些参与者可能仅限于查看账本的（部分或全部）内容，而其他者可能还必须提交新交易进行记录。


    私有区块链已被提出用于商业领域。《计算机世界》将这种私有化的区块链称为“石油”；然而，也有人认为，许可型区块链如果设计得当，在实践中可能比无许可区块链更具去中心化，因此更加安全。私有区块链最常见的例子是
    RippleXRP 和 Hyperledger。


    # 比特币不是区块链


    很多人认为比特币和区块链是同一回事。它们并不是！比特币是一种利用了技术的加密货币。它是区块链最重要的用例之一。如果用户拥有 `internet` 连接和 `bitcoin`
    钱包，就可以接收和发送 `bitcoin`。


    # 区块链历史


    早期互联网始于 20 世纪 60 年，作为研究人员共享信息的一种。那个时代的计算机庞大且不可移动，为了利用存储在任何计算机中的信息，人们必须前往现场或通过传统的邮政系统发送。互联网形成的另一个催化剂是美苏之间的冷战。苏联发射史普号卫星促使美国国防部考虑在核攻击后信息如何仍能传播。这导致了
    `ARPANET`（高级研究计划网络）的形成，该网络最终演变成了我们现在所知的互联网。`ARPANET` 取得了巨大成功，但成员限于与国防部签合同的某些学术和研究机构。作为回应，创建了其他网络以提供信息共享。


    `ARPANET` 在 1970 年开始了 `DARPA`（国防高级计划局）在加州两个大学实验室之间的去中心化计算实验。1983 年，这种通信协议变成了 `TCP/IP`，这是网络协议的标准，也是当今互联网的骨干。在此之前，各种计算机网络没有标准的相互通信方式。`TCP/IP`
    让不同网络上的不同计算机可以相互“对话”。`ARPANET` 和国防数据网络在 1983 年正式更改为 `TCP/IP` 标准，导致了互联网的诞生。


    随着 `TCP/IP` 协议的建立，用户能够链接从任何节点或计算机访问的信息系统中的超文本文档。所有网络现在都可以通过通用语言连接。由此产生的信息系统变成了今天的万维网（`www`）。随着万维网的诞生，随着业务机会的扩大，托管和存储文档的
    Web 服务器以及帮助你查看链接文档的网页浏览器为这种新技术创造了家庭需求，导致了互联网革命的兴起。


    根据人们与互联网交互的方式，可以将互联网分为三个不同的部分：


    *   Web 1.0 – 连接互联网

    *   Web 2.0 – 信息互联网

    *   Web 3.0 – 价值互联网


    # Web 1.0 – 连接互联网


    Web 1.0 指万维网演进的第一个阶段。它是一个内容分发网络（`CDN`），能够在网站上展示信息片段。在 Web 1.0 中，只有少数内容创建者，绝大多数用户都是内容的消费者。个人网页很常见，主要由托管在
    ISP 运行的 Web 服务器或免费托管服务上的静态页面组成。


    网页是静态的，使用`服务器端包含`或`通用网关接口`（`CGI`）构建。`框架`和`表格`用于页面上元素的定位和对齐。内容从服务器的文件系统提供。对用户的成本是查看的页面数，并拥有允许用户检索特定特定信息的目录。


    Web 1.0 的基本特征是：


    *   开发了一系列 Web 应用程序，这促进了在线服务的发展，如电子邮件。

    *   来自管理员的内容

    *   由中央机构管理

    *   只读信息，向用户“推送”信息


    ![图 A: 典型的 Web 1.0 架构 B. Web 2.0 | 下载科学图表](img/image00230.jpeg)


    Web 1.0 架构；来源：researchgate.net


    电子邮件是 Web 1.0 上第一个被广泛的应用。计算机及其连接性开始成为必需品。计算机技术的进步带来了变化，软盘变成了硬盘，存储容量从 `MB` 增加到
    `GB` 再到 `TB`。互联网速度从每秒千比特（`Kbps`）增加到每秒兆字节（`Mbps`）再到每秒吉字节（`Gbps`），`RAM` 从 `KBs`
    增长到 `GBs`。


    Web 1.0 随着互联网泡沫的发展而结束。初创公司出现并利用这种新技术获利，最著名的是 Netscape，它开发了第一个商业网络浏览器。


    # Web 2.0 – 信息互联网


    Web 2.0 是 Web 1.0 的增强版本。它指的是强调用户生成内容、易用性和对终端用户可操作性的全球网站。Web 2.0 也称为参与式社交网络。它指的不是对任何技术规范的修改，而是对网页设计和使用方式的修改。


    Web 2.0 具有对用户输入响应的动态内容，相比之下，Web 1.0 是静态的。它实现了信息的自由排序，允许用户共同检索和分类信息。


    Web 2.0 通过评估和在线评论实现了网站所有者与网站用户之间的信息流。在虚拟社区中作为用户生成内容的创建者，社交媒体对话允许参与者之间的互动和协作。Web
    2.0 倾向于与终端用户进行更多交互。因此，终端用户不仅是应用程序的用户，通过下面提到的 8 个工具也是参与者：


    *   播客

    *   博客

    *   标签

    *   使用 `RSS` 采集

    *   社交书签

    *   社交网络

    *   社交媒体

    *   Web 内容投票


    Web 2.0 的基本特征是：


    *   用户生成内容

    *   读写能力，允许用户与信息交互

    *   信息变得孤化

    *   数据变成了商品


    ![](img/image0231.gif)


    Web 2.0 架构；来源：researchgate.net


