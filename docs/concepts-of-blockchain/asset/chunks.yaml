- fmt: '

    To understand cryptography in blockchain, we must be able to differentiate between
    different cryptographic techniques. There are four key methods by which blockchain
    leverages cryptography.


    ## Public Key Cryptography


    This encryption method uses a pair of keys: an encryption key and a decryption
    key, named as public key and private key respectively. The key pair generated
    by this algorithm consists of a private key and a unique public key that is generated
    using the same algorithm. A person’s address on the blockchain is their public
    key. The transactions on blockchain include their public key and are digitally
    signed with sender’s private key, to verify the authorization of the transaction.


    Suppose if you want to send me a digital file of your new book to review. I should
    not be able to tamper it and change the author to myself. Digital signature ensures
    prevention of such things and integrity of the original message. It has both public
    and private keys. Public key is the key you give to the public to communicate
    with you, and private key is the secret key that only you own and use to access
    your account. Digital signatures can easily be verified using the corresponding
    public key, which is included in the transaction using a simple 3 step process:


    * Condense the attached message using the same method as the sender

    * Raise the attached signature to the user’s public key

    * Verify that the results of the previous two steps are identical


    For example, Ethereum is a public blockchain where anyone can participate in.
    Here, a user’s identity is an address based on their public key. In comparison,
    Hyperledger is an enterprise blockchain (a private blockchain) where the participants
    must be granted access. Here, the identity is managed by `X.509` certificates,
    which are only shared with the parties involved in the transaction.


    Public key cryptography uses a pair of public key and private key to perform transactions.
    Public keys are widely distributed, whereas private keys are kept secret. Using
    someone’s public key, it is possible to encrypt the message such that the only
    person with the private key can decrypt and read it. Using a private key, a digital
    signature can be created such that anyone with the corresponding public key can
    verify that the message was created by the owner of the private key and has not
    been modified or tampered since.


    ![](Images/image00238.gif)


    ## Zero-Knowledge Proofs


    A new approach to protecting digital data that validates the knowledge of the
    information without reveling it.


    Zero-knowledge proofs authenticate the parties without the need to widely transmit
    private information online. A zero-knowledge proof (`ZKP`) is a cryptographic
    method that allows a party (the prover) to prove to another party (the verifier)
    that a given information is true, without conveying any additional information.


    For example, there are two blocks identical in size and shape, except one is red
    and the other is blue. Tom, who is color-blind, holds the blocks behind his back.
    Tom then shows one of the blocks to Alice. Tome then hides this block behind his
    back and shows Alice the other block. Alice can consistently detect the switch
    because the blocks are different colors, but she never has to reveal the actual
    color of the blocks to Tom in order to validate the secret.


    Zero-Knowledge Proofs are often called ‘zk-SNARKs’, meaning ‘Zero-Knowledge Succinct
    Non-Interactive Arguments of Knowledge’, or `zk-SNARKs` for short.


    A great example of the Zero-Knowledge Proof is the cave door analogy. Pretend
    that there is a circular cave, with only one entrance or exit and at the back
    of this circular cave there is a door which can be unlocked using a secret code
    entered into a keypad. If I want to prove to you that I know the unlock code without
    revealing that unlock code to you, all I need to show is that I can walk into
    one end of the cave, open the door, and come out of the other end. If I have successfully
    demonstrated that, then you would know that I have been able to unlock the door,
    however I would not have to reveal the unlock code to you. This simple cave door
    analogy is a Zero-Knowledge Proof.


    Now, in blockchain a user might make a request to send some money to another user.
    The blockchain would want to ensure that before the transaction is done, the user
    sending the money actually has that much money in his account. However, blockchain
    doesn’t need to know who is sending the money or how much money they have. It
    only needs to be able to answer the question “Does the user who is sending the
    money has at-least that much amount to send”, without revealing the sender or
    his total wealth.


    ## Cryptographic Hash Functions


    This type of encryption doesn’t make use of keys. It uses a cipher to generate
    a hash value of fixed length. The function converts plain text (irrespective of
    the size) into a hash of fixed size. It is nearly impossible for the contents
    of plain text to be recovered from the cipher text. For example, our fingerprint
    and our eye-scan uniquely represent our identity, however we cannot reverse our
    fingerprint to recreate us. Now suppose you take a flight from London to New York.
    At the New York airport, the immigration officer scans your fingerprint and your
    eye. For the person next to you in the queue this fingerprint and eye scan changes.
    It becomes your unique identifier, which is difficult to forge and tamper.


    The same concept applies in blockchain. Except instead of fingerprints and eye-scans,
    you can replace yourself with a meaningful information, and your fingerprint with
    some pseudorandom output (a same random output for a unique input). If we can
    design a way to generate fingerprints of our meaningful data, we can ensure the
    integrity of our information. This is achieved by cryptographic hash functions.


    A cryptographic hash function is a mathematical algorithm that takes an arbitrary
    amount of data input (consider yourself) and produces a fixed-size output of enciphered
    text called “hash” (consider your fingerprint). This hash can then be stored instead
    of the password itself, and later used to verify the user. A cryptographic hash
    function must be deterministic, meaning that the same message always results in
    the same hash.


    ![](Images/image00239.jpeg)


    A cryptographic hash function (specifically `SHA-1`) at work.


    A small change in the input (in the word "over") drastically changes the output
    (digest). This is also known as ‘Avalanche Effect’.


    Source - Wikipedia


    A cryptographic hash function has the following key properties:


    * Nonreversible – A good hash function should make it very hard to reconstruct
    the original password from the output or hash. This is achieved via ‘Preimage
    resistance’, which refers to the difficulty of finding an input given an output.
    Mathematically, given a hash value `H`, it should be difficult to find any message
    `x` such that `H = Hash(x)`.

    * Determinism – A given password must always generate the same hash value or enciphered
    text. This is achieved via the 2nd preimage resistance, which for any given input
    `x`, it should be computationally difficult to find a different input `y`, such
    that `Hash (x) = Hash (y)`.

    * Collision resistance – It should be hard to find two different passwords that
    hash to the same enciphered text. In mathematical terminology, for a given hash
    function `H`, it is computationally difficult to find two different inputs `x`
    and `y`, such that `H(x) = H(y)`.

    * Non predictable – The hash value should not be predictable from the password.

    * Diffusion (Avalanche effect) – When a password is changed slightly, the output
    of enciphered text should change significantly and unpredictably.

