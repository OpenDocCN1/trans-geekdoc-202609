- fmt: '

    Web 2.0 saw emerging marketplaces that brought together unrelated buyers and sellers
    in a seamless low-cost environment. Data became a commodity collected, siloed
    and sold, and consumers started giving up their information at a frenzied pace.
    Websites allowed users to generate content, and social media became part of their
    lives. The social media contained a number of online tools and platforms where
    people shared their perspectives, opinions, thoughts and experiences.


    ## Web 3.0 – Internet of Value


    Web 3.0 is a term that is used to describe many evolutions of web usage and interaction
    among several paths. It refers to the evolution of web utilization and interaction
    which includes altering web into a database. It enables the upgradation of the
    back-end of the web, after a long time of focus on the front-end. In Web 3.0,
    data isn’t owned but instead shared, where services show different views for the
    same web / the same data.


    The Semantic Web (3.0) promises to establish “the world’s information” in a more
    reasonable way than Google can ever attain with their existing engine schema.
    This is particularly true from the perspective of machine conception as opposed
    to human understanding.


    The essential characteristics of Web 3.0 were:


    * **Semantic Web** – The semantic web improves web technologies in demand to create,
    share and connect content through search and analysis based on the capability
    to comprehend the meaning of words, rather than on keywords or numbers.

    * **Artificial Intelligence** – Combining this capability with natural language
    processing, in Web 3.0, computers can distinguish information like humans in order
    to provide faster and more relevant results. They become more intelligent to fulfill
    the requirements of users.

    * **3D Graphics** – The three-dimensional design is being used widely in websites
    and services in Web 3.0. Museum guides, computer games, e-commerce, geospatial
    contexts, etc. are all examples that use 3D graphics.

    * **Connectivity** – With Web 3.0, information is more connected via semantic
    metadata. As a result, the user experience evolves to another level of connectivity
    that leverages all the available information.

    * **Ubiquity** – Content is accessible by multiple applications, every device
    is connected to the web, the services can be used everywhere.

    * **Data Independence** – Identity and information is held by the user, breaking
    data silos.


    As a result, Web 3.0 is more connected, open, and intelligent. It enables community
    interaction and usage of distributed ledgers or blockchain technology, smart contracts,
    machine learning, and artificial intelligence.


    Bitcoin has been the first widely accepted application of Web 3.0, just as email
    was the first big application of Web 1.0. Web 3.0 represents a world where value
    is exchanged at the speed in which information moves today. The new Web 3.0 browsers
    are being built to help users manage their cryptocurrencies, keys, passwords and
    other blockchain features.


    ![How Web 3.0 will impact higher education | Digital Communications team blog](Images/image00232.jpeg)


    ## Evolution of the web


    ### Key differences between Web 1.0, Web 2.0, and Web 3.0


    | Web 1.0 | Web 2.0 | Web 3.0 |

    | --- | --- | --- |

    | Read only | Read-write | Read-write-execute |

    | Company focus | Community focus | Individual focus |

    | Client server | Peer-to-Peer | Portable personal web |

    | Owning content | Sharing content | Consolidating |

    | Web pages | Interactive | Behavioral |

    | Static | Tagging | Engagement |

    | Directories | Blogs | Live |

    | Banner advertising | XML | RDF |

    | HTML | RSS | Smart applications |


    ### Blockchain History


    Cryptographer David Chaum first proposed a blockchain-like protocol in 1982. In
    1991, Stuart Haber and W. Scott Stornetta described a cryptographically secured
    chain where timestamps could not be tampered with. In 1992, they incorporated
    Merkle trees.


    However, it took another 13 years for the first decentralized blockchain to be
    conceptualized by a person (or group of people) known as Satoshi Nakamoto in 2008.
    Bitcoin made it the first digital currency to solve the double-spending problem
    without the need of a trusted authority or central server.


    The bitcoin blockchain records transactions and stores their history in an append-only
    ledger. It is implemented as a chain of blocks, each block containing a hash of
    the previous block up to the genesis block. In August 2014, the bitcoin blockchain
    file size, containing records of all transactions that have occurred on the network,
    reached 20 GB, and from January 2016 to January 2017, the bitcoin blockchain grew
    from 50 GB to 100 GB in size. The ledger size had exceeded 200 GB by early 2020.


    According to Accenture, an application of the diffusion of innovations theory
    suggests that blockchains attained a 13.5% adoption rate within financial services
    in 2016, therefore reaching the early adopters phase. Industry trade groups joined
    to create the Global Blockchain Forum in 2016, an initiative of the Chamber of
    Digital Commerce. The bitcoin design has inspired other applications and blockchains
    that are widely used.


    ### Blockchain Basics


    Hearing the world ‘Blockchain’ now is comparable to hearing the word ‘Internet’
    in the early 90s. It seemed elusive, like something that would not impact your
    daily life. But here we are, more than 25 years later, and internet has transformed
    businesses, commerce, communications, media and even how people connect with each
    other. We all carry internet in our pockets. We can transfer money, check weather,
    get directions, and even order food at the touch of a button.


    The next technology to have that kind of impact isn’t big data, artificial intelligence,
    or social media.


    It’s Blockchain!

