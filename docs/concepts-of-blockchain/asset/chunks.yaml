    \ digital art, or any other real-world items sold as a unique digital property.\
    \ \n\n*   Ethereum platform also offers other cryptocurrencies to operate as ERC-20\
    \ tokens on top of the Ethereum blockchain.\n\nEther, the native cryptocurrency\
    \ of the Ethereum platform, is second only to Bitcoin in market capitalization.\
    \ \n\n## Smart Contracts\n\nA “contract” is a written or spoken agreement that\
    \ is intended to be enforced by law. For a contract to be valid, it must be agreed\
    \ upon. Hence, a contract is in itself a consensus mechanism. Through consensus,\
    \ all the parties involved in the contract should be able to agree upon the contents\
    \ of the contract, as well as its execution.\n\nWhat makes a contract smart? \n\
    \nA smart contract is a self-executing contract with the terms of the agreement\
    \ between buyer and seller being directly written into lines of code. This code\
    \ facilitates, verifies, and enforces the execution of the contract. The code\
    \ and the agreements contained therein exist across a distributed, decentralized\
    \ blockchain network. The code controls the execution, and transactions are trackable\
    \ and irreversible."
