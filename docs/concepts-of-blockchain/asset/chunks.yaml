- fmt: "\n# Blockchain has the power to revolutionize how the businesses and people\
    \ connect. It will enable every kind of asset, from tickets – money - media, to\
    \ be stored, moved, exchanged, and transacted without an intermediary. These assets\
    \ will no longer be required to store in a central place, but distributed across\
    \ a global ledger, using the highest level of cryptography. When a transactions\
    \ happens, it would broadcast across thousands of computers around the globe and\
    \ recorded as blocks. There would no longer be a single point of failure, and\
    \ this is what makes blockchain infinitely more secure than what we have today.\n\
    \nBlockchain isn’t just for assets. It extends to contracts as well. These are\
    \ called `Smart Contracts`. A smart contract self-executed and handles enforcement,\
    \ management, and performance of agreements between people, like insurance policies,\
    \ loans, wills, records, and copyright content.\n\nThere are so many possible\
    \ use cases of blockchain; not just now, but in future as well – scenarios we\
    \ have not yet envisaged. \n\n# What is Blockchain?\n\nWhen you hear about blockchain,\
    \ you probably think of new, high-emerging technology. In reality, blockchain\
    \ is a combination of technologies that have existed for a long time. These technologies\
    \ are combined in a new and creative way to give us an amazing new platform to\
    \ build solutions.\n\nBlockchain is often referred to as digital centralized ledgers.\
    \ \n\nIn order to understand blockchain, imagine it as a simple numbered notebook.\
    \ The blocks would be pages of data in that notebook. \n\nWe fill up this page\
    \ with data, which is analogous to recording financial transactions or ledger\
    \ on the block. Like we can write anything on the paper, we can record anything\
    \ on the blockchain, like education degrees, certificates, contracts and agreements,\
    \ voting records, land titles, medical records, or even notes of a song. Like\
    \ all the pages on the notebook are numbered, so is the case of blockchain wherein\
    \ all the records are linked. If I tear any page of the notebook, it is very obvious\
    \ and easy to determine. Similarly, if I change data on any block, the links will\
    \ break in a very obvious way. This key property of blockchain gives it an enhanced\
    \ security and is known as ‘immutability`. \n\nBlockchain also gives us an incredible\
    \ technology called smart contracts, which allow us to programmatically define\
    \ the rules and steps to be performed whenever a certain type of event is recorded\
    \ in the blockchain.\n\n## Blockchain Features\n\nThere are seven key features\
    \ of blockchain that has made this technology so revolutionary and popular.\n\n\
    ### Distributed Ledgers\n\nA ledger is a collection of transactions. A ledger\
    \ will provide every information about a transaction and the participant. It’s\
    \ all out in the open, nowhere to hide. It is because with a digitally distributed\
    \ ledger, no one owns the ledger. It is distributed among participants in the\
    \ network, all running the same blockchain protocols. This distributes the computational\
    \ power across the computers to ensure a better outcome.\n\nThis is the reason\
    \ it’s considered one of the blockchain essential features. The result will always\
    \ be a higher efficient ledger system that can take on the traditional ones.\n\
    \n### Why it is one of the key Blockchain feature?\n\n* **No Malicious Changes**\
    \ – Distributed ledger responds well to any suspicious activity or tamper. As\
    \ no one can change the ledger and everything updates real fast, tracking what’s\
    \ happening in the ledger is quite easy with all these nodes.\n* **Ownership of\
    \ Verification** – The nodes act as verifiers of the ledger. If a user wants to\
    \ add a new block, other participants will have to verify the transaction and\
    \ then give the green signal.\n* **No Special Favors** – Everyone in the network.\n\
    * **Consensus** – All nodes must agree on the state of the ledger.\n* **Fast System**\
    \ – Traditional systems are slow; blockchain offers faster settlement.\n\n###\
    \ Decentralized Technology\n\nThe blockchain network is decentralized; it does\
    \ not have any authority, rather a group of nodes maintains it. All nodes on the\
    \ network follow the same protocols and share the data. A `lightweight node` or\
    \ `Simple Payment Verification (SPV)` node does not store the chain, but relies\
    \ on `full node` to provide the necessary information.\n\n### Why it is one of\
    \ the key Blockchain feature?\n\n* **Less Failure** – The system is fault-tolerant\
    \ and does not depend on human calculations.\n* **User Control** – Users have\
    \ control over their data without relying on 3rd parties.\n* **Less Prone to Breakdown**\
    \ – The decentralized nature makes it able to survive malicious attacks.\n\n##\
    \ Transparency\n\nBlockchain makes data transparent in a way that has not existed\
    \ in financial systems. How exactly is data made transparent on the blockchain?\
    \ Network participants can access transactions of public addresses using a `block\
    \ explorer`, and search the blocks of a blockchain, their contents, and their\
    \ relevant details.\n\nThe users can see all the transactions that have occurred\
    \ on the distributed ledger. A blockchain stores details of every transaction\
    \ that occurred since the first transaction. This first transaction is a part\
    \ of the first block of the blockchain and is known as `Genesis Block`. Since\
    \ every node shares a copy of the agreed-upon ledger, every user has the same\
    \ copy.\n"
