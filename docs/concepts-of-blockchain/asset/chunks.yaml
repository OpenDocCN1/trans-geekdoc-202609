- fmt: "\nThe first generation of blockchain platforms “Blockchain 1.0” network, were\
    \ capable of capturing and recording data, but not acting upon it. Bitcoin enabled\
    \ capturing and recording the transfer of Bitcoins from one owner to the next.\
    \ At that time, nobody envisioned blockchain as a platform on top of which applications\
    \ and solutions could be built. The release of Ethereum in 2015 changed this concept.\
    \ “Blockchain 2.0” was born, and now blockchain networks could not only capture\
    \ data, but they could act upon it as well. All of this was made possible by the\
    \ introduction of “Smart Contracts”, a computer code deployed to a blockchain\
    \ network. Users can transact with the smart contract just as they would with\
    \ another user, except that the rules of transacting with a smart contract are\
    \ defined in the code and are used to process that transaction. This enables blockchain\
    \ to manage and automate processes, and record their results on a permanent, immutable,\
    \ secure ledger shared with all relevant parties. \n\nLet’s take an example of\
    \ a used car. Alice lists her car for sale and offers a guarantee to any buyer\
    \ that the car will be issue-free for next 10,000 miles. Bob wants to purchase\
    \ this car and makes an offer of $5,000. Alice and Bob agree that Alice will take\
    \ half of the purchase price now ($2,500) and the other half if the car has no\
    \ major issue in the first 10,000 miles of Bob’s ownership. A smart contract could\
    \ be created Alice and Bob. This smart contract would hold the remaining $2,500\
    \ of the purchase price in an escrow account, and if Bob had an issue with the\
    \ car, he would report it to the smart contract. After 10,000 miles of Bob’s ownership,\
    \ the smart contract would determine how much of the remaining fund is due to\
    \ Alice and how much should be returned to Bob, using the rules Alice and Bob\
    \ initially agreed upon. All the details about the transaction would be recorded\
    \ on a permanent, decentralized ledger which could be used at any point in the\
    \ future to answer any questions about the transaction between Alice and Bob.\
    \ \n\nCurrently, the ‘smart’ contracts aren’t generally very smart. This is due\
    \ to the simple explanation that because these contracts are “if, then, else”\
    \ statements, they can vary in complexity based on how they are stacked. Currently,\
    \ they cannot make decisions without human intervention of AI. Companies are emerging\
    \ as reliable Oracles (a reliable source of information) that filter in real world\
    \ facts to the blockchain, and blockchain makes that information immutable. \n\
    \nAnyone can create their own smart contracts without a central authority giving\
    \ the right to do so. These contracts are executed without too much human intervention,\
    \ and they are stored on blockchain technology which provides a sense of permanence.\
    \ These are three of the main attributes that can bring more autonomy to exchanging\
    \ information between parties. Setting up a pre-agreed upon contract that is coded\
    \ into a blockchain and executes automatically when certain actions are taken\
    \ is one step in the direction of not only improving our autonomy as individuals\
    \ or companies, bust shifting resources that are redundant, towards more impactful\
    \ work. \n\n## Multi-Party Transactions (Wait, I see a typo in my thought process,\
    \ let me re-format)\n\n### Multi-Party Transactions\n\nIn traditional centralized\
    \ ledger systems, accuracy is dependent on intermediaries who can change details\
    \ of the centralized ledger. Data derived from the ledger can be siloed and misused.\
    \ Distributed decentralized ledgers are not dependent on intermediaries who can\
    \ manipulate the data. The data is secure and tamper resistant. \n\nIn the current\
    \ ecosystem of transactions, there is always a third party to assist in connecting\
    \ the sender to the receiver. This has always been the most efficient way to move\
    \ something from point A to point B. But with a third party making the connection\
    \ comes the need to trust that they will get whatever is being sent in an efficient,\
    \ economical, and effective way. This trust is open to human and process error.\
    \ Blockchain can enable removing the middlemen from a number of processes. There\
    \ is a long list of examples for middlemen currently being removed, such as:\n\
    \n*   Energy distributors\n*   Payment networks (Visa and Mastercard)\n*   Over\
    \ the top platforms and content distributors (YouTube, Facebook, Instagram, etc.)\n\
    *   Central exchanges (NYSE, NASDAQ, NSE, LSE, etc.)\n*   Cloud database providers\
    \ (AWS, Azure, etc.)\n\nOne example is cross-border payments. In sending money\
    \ from one country to another, the transactions end up stopping off at 7 – 10\
    \ different checkpoint banks (buyers – buyer’s bank – country ‘A’ federal bank\
    \ – country ‘A’ correspondent bank – country ‘B’ correspondent bank – country\
    \ ‘B’ federal bank – seller’s bank – seller). This constant stopping delays the\
    \ flow of money, makes its movement more expensive (as each bank takes a small\
    \ fee), and less reliable (increase in malicious attack due to number of checkpoints).\
    \ This type of transaction is heavily reliant upon third parties to facilitate\
    \ the movement of money. Now, if we replace this ecosystem with blockchain, the\
    \ trust is built via the consensus mechanism. This would incentivize all the participants\
    \ to help secure and validate the transaction throughout the network. With this\
    \ built-in “trustless” trust, we can remove the multiple intermediaries in this\
    \ transaction that provide no additional value, thereby speeding up the process,\
    \ optimizing the cost of transactions, and making the process more efficient.\
    \ \n\n## Double Spend\n\nBitcoin was not the first attempt to create a digital\
    \ currency, but the first which was able to solve a long-standing problem of “double\
    \ spend”. A double spending attack is an attack where a cryptocurrency can be\
    \ used more than once, by altering the blockchain network and inserting a special\
    \ one that allows the user to reacquire a cryptocurrency. \n\nFor example, Alice\
    \ owes a debt of $5 to both Bob and Carol. Alice’s total debt is $10. Let’s assume\
    \ that Alice only has $5 currently. If Alice’s transactions were recorded on two\
    \ separate ledgers, it is possible that one ledger would show she paid $5 to Bob,\
    \ while the second would show that she paid $5 to Carol. It would be impossible\
    \ to tell who actually got paid. This is the double spend problem. Hence, any\
    \ financial ledger must prevent Alice from spending her $5 more than once. \n\n\
    Digital assets are particularly more vulnerable to the double spend problem they\
    \ are designed to be easy to copy and distribute. For example, you took a picture\
    \ from your phone, it is easy to post one copy to Facebook, another to Instagram,\
    \ ‘wattsapp’ a copy to your friends, and email a copy to your parents. Hence,\
    \ we see that digital assets are easy to copy and distribute. However, a digital\
    \ currency should not be easy to copy and distribute. It was overcoming this technical\
    \ challenge that led to many failed attempts before Bitcoin like Digicash, Hashcash,\
    \ etc.\n\nBitcoin Technology solves these problems though two inherent concepts\n\
    \n1.  Blockchain network enabled the transactions to be validated and broadcasted\
    \ in the entire network using readily available software applications. When a\
    \ transaction occurred, the network nodes validated these transactions, added\
    \ them to their copy of the ledger, and then broadcasted these ledger additions\
    \ to other nodes. Once these transactions are accepted in the network, they became\
    \ a block. \n\n2.  Using the Proof-of-Work protocol, these blocks were added to\
    \ the blockchain, and quickly published to all nodes, without requiring central\
    \ oversight. This enables the network to determine when a particular bitcoin was\
    \ spent, which is needed to prevent double-spending. \n\nThese two concepts enable\
    \ anyone with access to internet join the Bitcoin network, verify and audit transaction\
    \ history on their own, as well as create Bitcoins through mining via Proof-of-Work.\n\
    \n## Cryptocurrencies\n\nA cryptocurrency is a tradable digital asset or digital\
    \ form of money, built on a blockchain.\n"
