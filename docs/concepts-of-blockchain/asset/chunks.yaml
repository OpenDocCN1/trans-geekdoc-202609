  trans: '


    -   闪电贷（Flash loans）——这些是在同笔交易中借入并偿还资金的加密货币贷款。借款人可以通过进入在以太坊区块链上编码的合约、执行交易并立即偿还贷款来盈利。如果交易无法执行或会导致亏损，资金将自动返回贷款人。如果你确实获得了利润，可以将其收入囊，扣除任何利息费用或费用。可以将闪电贷视为去中心化的套利。


    DeFi 的采用得于区块链无处不在的特性。一旦去中心化应用（dapp）在区块链上编码，它就可以在全球范围内可用。


    ## DeFi 的未来


    从消除中间人到将篮球片段变成具有货币价值的数字资产，DeFi 的未来看起来光明。投资者将拥有更多的独立性，这将允许他们以今天看来不可可能的创意方式部署资产。


    但尽管前景广，DeFi 还有很长的路要走，特别是在公众接受方面。


    ## 非同质化代币 (NFTs)


    你可能听说过一位 24 岁的艺术家通过出售其艺术品作为非同质化代币（NFT）赚了超过 30 万美元，或者罗布·格隆斯科斯基（Rob Gronkowski）出售他最精彩超级碗时刻的
    NFT。随着这些消息席卷社交媒体，NFT 成为最新的主流加密货币热潮并不为奇奇。


    非同质化代币（NFT）是存储在区块链上的不可互换数据单元。与加密货币不同，NFT 无法进行交易或交换，因为它们彼此并不相同。NFT 通常用于买卖数字物品，如数字文件、数字媒体、数字艺术、收藏品和虚拟房地产。一个
    NFT 可以与特定的数字资产（视频/照片/音频）或物理资产（实体文件/实体物体）以及用于特定用途该资产的许可关联。此 NFT（如果适用，以及相关的使用、复制或显示底层资产的许可）可以在数字市场上进行交易和出售。NFT
    使用数字账本提供公开的真实性证明或所有权证明，但并不限制底层数字文件的共享或复制，也不限制相同 NFT 的创建。


    NFT 的功能类似于加密代币，但与 `Bitcoin` 或 `Ethereum` 等加密货币不同，NFT 并不是相互互换的，因此不是同质化的。虽然所有的比特币都是平等的，但每个
    NFT 可能代表不同的底层资产，因此可能具有不同的价值。


    NFT 的创建是因为区块链将加密哈希记录（一组识别一组数据的字符集）连接到之前的记录上，从而创建了一个可识别数据块的链。这种加密交易过程通过提供一个用于跟踪
    NFT 所有权的数字签名，确保了每个数字文件的身份验证。然而，指向详细信息的链接（如艺术品存储位置）的数据链接可能会受到“链接失效”（link rot）的影响。


    NFT 的所有权并不固有赋予该代币所代表的任何数字资产的版权或知识产权。例如，虽然有人可能出售代表其作品的 NFT，但买家在 NFT 所有权变更时并不一定获得版权权限，因此原所有者被允许创建相同作品的更多
    NFT。在某种意义上，NFT 仅仅是与版权分离的所有权证明。


    NFT 已被用作投机性投资，并且它们在与验证区块链交易相关的能源成本和碳足迹，以及频繁用于艺术诈骗方面也遭到了了批评。


    ## NFT 是如何工作的？


    NFT 通常存储在 `Ethereum` 区块网上，尽管其他区块链也支持它们。NFT 是从代表实体和无形物品的数字对象创建或“铸造”的，包括艺术品、GIF、视频和体育集锦、收藏品、虚拟化身和视频游戏皮肤、设计师运动鞋和音乐。


    甚至推文也算。推特联合创始人杰克·多塞（Jack Dorsey）以超过 290 万美元的价格将其首条推文作为 NFT 出售。


    本质上说，NFT 就像实体收藏品，只是数字的。因此，买家得到的不是一幅挂在墙上的真实油画，而是得到一个数字文件。他们还获得了独占所有权，因为一个 NFT 一时间只能有一个所有者。NFT
    的独特数据使其易于验证所有权并在所有者之间传输代币。所有者或创建者还可以在其中存储特定信息。例如，艺术家可以通过 NFT 的元数据中包含签名来对他们的作品进行签名。


    ## NFT 的用途


    -   **数字文件**：NFT 已被用作链接数字文件的数字代币交换手段。NFT 的所有权通常与底层数字资产的使用许可相关，但通常不会赋予买家版权。某些协议仅授予个人非商业用途的许可，而其他许可允许对底层数字资产进行商业用途。

    -   **数字艺术**：数字艺术是 NFT 的常见用例。作为 NFT 的数字艺术高额拍卖引起了广泛的公众关注，艺术家 Pak 的作品《Merge》是最昂贵的
    NFT，价格为 9180 万美元；艺术家 Mike Winkelmann 的《Everydays: the First 5000 Days》是 2021 年第二昂贵的拍卖品，以
    6930 万美元的价格拍得出。

    -   **游戏**：NFT 可用于代表游戏内资产，例如数字土地，一些评论员将其描述为由“用户”控制的，而不是由游戏开发者控制的，因为它允许资产在不经游戏开发者许可的情况下在第三方市场上进行交易。`CryptoKitties`
    是一个早期的成功区块链在线游戏，玩家在其中领养和交易虚拟猫。游戏内 NFT 的货币化筹得了 1250 万美元的投资，某些猫的售价超过了 10 万美元。在成功之后，`CryptoKitties`
    被加入了 `ERC-721` 标准。


    2021 年 12 月，全球领先的游戏公司优锐 Ubisoft 宣布了 `Quartz`，“一项允许人们使用加密货币购买稀缺数字物品的 NFT 计划”。该公告引起了巨大的批评，其
    YouTube 发布视频的反对率达到 96%，该视频随后被下架。一些 Ubisoft 开发人员也对此公告表示了担忧。


    2021 年 2 月，据报道 NFT 在音乐行业产生了约 2500 万美元，艺术家将艺术品和音乐作为 NFT 代币出售。2021 年 2 月 28 日，电子舞音乐
    `3LAU` 出售 33 个 NFT，总价 1170 万美元，以纪念其专辑 `Ultraviolet` 三周年。

    -   **电影**：2018 年 5 月，20 世纪影业与 Atom Tickets 合作发布了限量版《疯狂销杀 2》数字海报以推广电影。它们可以在 `OpenSea`
    和 `GFT` 交易所获取。2021 年 3 月，Adam Benzine 的 2015 年纪录片《Claude Lanzmann: Spectres of
    the Shoah》成为第一个作为 NFT 拍卖的电影和纪录片。电影行业使用 NFT 的其他项目包括宣布将为《哥斯拉大战金刚》发布独家 NFT 艺术品，以及导演
    Kevin Smith 在 2021 年 4 月宣布其即将上映恐怖电影《Killroy Was Here》将作为 NFT 发布。2021 年由 Rick Dugdale
    执导、安东尼·霍普金斯主演的电影《Zero Contact》也作为 NFT 发布。2021 年 11 月，电影导演昆汀·塔伦蒂诺根据《低俗小说》的未剪辑片段发布了七个
    NFT。`Miramax` 随后提起了诉讼，指控其侵犯了电影权利。


