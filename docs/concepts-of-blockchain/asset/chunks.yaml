    Suppose you transfer the 5 Bitcoins to your friend, the history of this transaction
    needs to be stored in the network to confirm the amount of Bitcoin owned by you
    and your friend currently, and to validate future transactions. This information
    is saved in the Bitcoin’s distributed database – `Blockchain`. Bitcoin blockchain
    is implemented as a chain of blocks, each block containing a hash of the previous
    block up to the genesis block in the chain. A network of communicating nodes running
    Bitcoin software maintains the blockchain. Every person in the node owns the ledger,
    and has as much right to vote on the validity of this transaction as anyone else
    in the network. Once you have transferred the 5 Bitcoins to your friend, this
    transaction is validated by the network nodes, which add this transaction to their
    copy of the ledger. Then they broadcast these ledger additions to other nodes.
    At varying intervals of time averaging to every 10 minutes, a new group of accepted
    transactions, called a `block`, is created, added to the blockchain, and quickly
    published to all nodes, without requiring central oversight. By grouping data
    into blocks, the network is not strained as a result of updating every ledger
    after every transaction. Every block is an update, and a chain of block represent
    a history. The process is helpful for identifying discrepancies between different
    versions of the database, since every node can validate what actually happened
    in the ledger at any given time. Since every block is built off the previous one,
    it contains information about the previous block. If any block gets tampered,
    information within this block and all future blocks will change. This makes blockchain
    tamper evident, since tampering with a transaction from the past would invalidate
    any future blocks linking back to it.


    In Bitcoin, each transaction is an output from previous transactions and feeding
    into new transactions. Transactions contain the signature of the owner of the
    unspent funds. These unspent transactions are called `UTXOs`. So how do you spend
    your Bitcoin or `UTXOs`. For example, if you send me 1 Bitcoin, then in that transaction
    it is encoded that only 1 can redeem that `UTXO`, using a public key and a signature.


    In Bitcoin, a transaction has 3 main sections:


    - `Metadata` – Contains some housekeeping data, a unique transaction ID, `lock-time`,
    and `block size`

    - `Input` – Contains a list of previously created `UTXOs` as well as the proof
    that I am eligible of redeeming this money

    - `Output` – Contains a list of new `UTXOs` that will be sent to a new address.
    This new address is a `Bitcoin script` that locks the transaction and makes it
    redeemable only by the specific proof that I specified in this transaction.


    ![](Images/image00249.gif)


    ## Bitcoin Script


    Bitcoin Script is the language Bitcoin uses to do everything it can do, from processing
    financial transactions between two entities to more complex multi-signature transactions.
    In other words, `Bitcoin Script` refers to a simple programming language used
    in Bitcoin for the processing of transactions that is read from left to right.
    Rather than connecting the public keys together, connecting inputs and outputs
    through `Bitcoin scripts` allows for potentially complex transactions.


    The script language is stack-based, last-in-first-out (`LIFO`), and is intentionally
    not Full Turing, as this prevents infinite or endless looping and error execution.


    A `Bitcoin Script` is essentially a list of instructions recorded with each Bitcoin
    transaction, that describe how the next person wanting to spend the Bitcoins being
    transferred can gain access to them. The script for transferring a Bitcoin to
    a destination address ‘X’ loads the future spending of the bitcoins with two things,
    which the sender must provide:


    - A public key that, when hashed, yields destination address ‘X’ embedded in the
    script

    - A digital signature to prove ownership of the private key corresponding to the
    public key that the sender provided


    A transaction is valid if nothing in the combined script triggers failure and
    the top stack item is `True`(non-zero) when the script exits. The original sender
    of the Bitcoins which is now being spent dictates the script operations that will
    occur last to release them for another transaction. The current sender must provide
    the input to the previously recorded script that results in the combined script
    completing execution with a true value on the top of the stack.


    ### Operational Code (OP_CODE)


    In computing, an Operational Code or `OP_CODE` is a portion of a machine language
    instruction that specifies the operation to be performed.


    Generally this processing is done by the computer hardware (usually a `CPU`).
    But it can also be software specially prepared to emulate the operation of a `CPU`
    and process these instructions. In general, a complete machine language instruction
    contains an `OP_CODE`, on which the operation code must act.


    In Bitcoin, `OP_CODES` are the backbone of the system to program transaction instructions.
    `Bitcoin Script` is actually a programming language where instructions are given
    in `OP_CODES` that the Bitcoin network has defined beforehand for its operation.
    Bitcoin structure allows the possibility of defining 256 `OP_CODES`, different
    of which start from number 0 to 255. Of these 256 `OP_CODES`, currently 116 are
    active.


    These `OP_CODES` are the ones that allow you to carry out the different operations
    in Bitcoin and its transaction scheduling, such as data flow control, constant
    management, stack management, logical management, arithmetic, time lock, pseudo-words,
    cryptographic operations, and reserved words. The below table describes some of
    the key `OP_CODES` of Bitcoin:


    | Word | OP_CODE | Hex | Input | Output | Description |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | `OP_0` | 0 | `0*00` | Nothing | Empty | An empty array of bytes is pushed onto
    stack |

    | `OP_IF` | 99 | `0*63` | If | Then / Else | If the top stack value is not `False`,
    the statements are executed. The top stack value is removed. |

    | `OP_VERIFY` | 105 | `0*69` | True / False | Nothing / Fail | Marks transaction
    as invalid if top stack value is not true. |

    | `OP_EQUAL` | 135 | `0*87` | x1 | x2 | True / False | Returns 1 if the inputs
    are exactly equal, 0 otherwise |

    | `OP_ADD` | 147 | `0*93` | a | b | out | Adds a to b |

    | `OP_SUB` | 148 | `0*94` | a | b | out | Subtracts b from a |

    | `OP_NEGATE` | 143 | `0*8f` | in | out | The sign of the input is flipped |

    | `OP_ABS` | 144 | `0*90` | in | out | The input is made positive |

    | `OP_NOT` | 145 | `0*91` | in | out | If input is 0 or 1, it is flipped. Else
    output is 0 |

    | `OP_NUMEQUAL` | 156 | `0*9c` | a | b | out | Returns 1 if numbers are equal.
    Else 0 |

    | `OP_RIPEMD160` | 166 | `0*a6` | in | out | Hash | Input is hashed using RIPEMD-160
    |

    | `OP_SHA256` | 168 | `0*a8` | in | out | Hash | Input is hashed using SHA-256
    |

    | `OP_HASH160` | 169 | `0*a9` | in | out | Hash | Input is hashed twice. First
    with SHA-256, and then with RIPEMD-160 |

    | `OP_HASH256` | 170 | `0*aa` | in | out | Hash | Input is hashed twice with SHA-256
    |

    | `OP_CHECKLOCKTIMEVERIFY` | 177 | `0*b1` | X | X | X / Fail | Marks transaction
    as invalid if the top stack item > the transaction''s nLockTime field, otherwise
    script evaluation continues as though an OP_NOP was executed |

    | `OP_CHECKSEQUENCEVERIFY` | 178 | `0*b2` | X | X | X / Fail | Marks transaction
    as invalid if the relative lock time of the input is not equal to or longer than
    the value of the top stack item |


    Script Template


    Each Bitcoin Script is divided into two types of scripts to implement transactions:

