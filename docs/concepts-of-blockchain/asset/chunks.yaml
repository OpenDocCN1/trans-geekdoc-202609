    \ as intranet. On each of these networks there are nodes, which are put together\
    \ by a collection of protocols. Each blockchain has its own set of protocols that\
    \ defines not only the nodes, but how they communicate with each other. These\
    \ networks store the ledger, provide the updates, and effectively manage the ledger.\n\
    \nOn a public blockchain, anyone is allowed to join the network. On a private\
    \ blockchain, we can control who can join the network. In a blockchain network,\
    \ every user needs to have a unique identity. It is achieved by the use of PKI\
    \ to provide a ‘Public Key’, which represents the identity of the user. Each user\
    \ also have a ‘Private Key’ by which they can prove their identity. This private\
    \ key is stored in a wallet – collection of user credentials. \n\nIn order to\
    \ gain an insight into the blockchain ledger, let’s start with the history of\
    \ the ledger.\n\n*   Single Entry Ledger – Ledger first appeared around 3000 BC.\
    \ Chanakya, an Indian economist created the first documented single-entry ledgers.\
    \ They had only a single entry. \n\n*   Double Entry Ledger – Double entry ledgers\
    \ first appeared in the 14th century. They tracked debits and credits, and told\
    \ story of financial transactions from buyer’s as well as supplier’s point of\
    \ view. Luca Pacioli, known as the father of accounting, was the first person\
    \ to publish work on double-entry ledger, and introduce it in Italy.\n\n*   Triple\
    \ Entry Ledger – Triple entry ledger is an enhancement to the traditional double\
    \ entry system, in which all the accounting entries involving two parties are\
    \ cryptographically sealed by a third entity. It records all debits, credits as\
    \ well as an immutable link to all past debits and credits. Triple-entry ledger\
    \ first appeared in the Bitcoin whitepaper written by Satoshi Nakamoto in 2008.\
    \ The key features of triple-entry ledger include tamper-proof records, distributed\
    \ ledger, double-entry + cryptography, validated records, secure and private,\
    \ and digitally signed receipts.\n\n![Triple entry accounting : One of the greatest\
    \ inventions in the last few centuries in the world of accounting | by Spathion\
    \ | Medium](Images/image00233.jpeg)\n\nTriple entry ledger; Source: medium.com\n\
    \nDistributed Ledgers\n\nThe concept of distributed ledgers has been around for\
    \ hundreds of years. To understand the basics of blockchain, it’s important to\
    \ understand how distributed ledgers work.\n\nA distributed ledger is a collection\
    \ of data with no central administrator that has been agreed upon by consensus."
