  trans: "\n\n2019 年 9 月，洲际交易所（纽约证券交易所所有的所有者）在其名为`Bakkt`的交易所上开始交易比特币期货。2020 年 3 月\
    \ 13 日，由于 COVID-19 疫情的爆发，比特币价格从 2020 年 2 月超过 10,000 美元后的市场大抛售中跌至 4,000 美元以下，期间有\
    \ 28.1 万枚比特币被卖出，所有者持有时间仅为 30 天。2020 年 8 月，MicroStrategy 投资了 2.5 亿美元比特币作为财政储备资产。2020\
    \ 年 10 月，Square, Inc. 将总资产的约 1%（5000 万美元）投入了比特币。2020 年 11 月，PayPal 宣布美国用户可以购买、持有或出售比特币。2020\
    \ 年 12 月，马诸塞州人寿公司宣布购买了价值 1 亿美元的比特币，约占其普通投资账户的 0.04%。2021 年 2 月，特斯拉购买了 15 亿美元的比特币，并宣布计划接受比特币作为车辆支付方式。然而，在\
    \ 2021 年 5 月 12 日，特斯拉扭转了立场，表示他们将不再接受比特币，因为担心“挖矿”这种加密货币会增加化石燃料的消耗并导致气候变化。2020 年\
    \ 9 月，瑞士楚格州宣布将从 2021 年 2 月开始接受使用比特币缴纳税款。2021 年 6 月，萨尔瓦瓦立法会投票通过法律，使比特币成为萨尔瓦瓦的法定货币，使其成为首个正式引入比特币作为法定货币的国家。2021\
    \ 年 10 月，美国证券交易委员会（SEC）批准了 ProShares 比特币策略 ETF，这是一种现金结算的期货交易基金（ETF）。\n\n## 为什么比特币技术作为加密货币成功？\n\
    \n去中心化网络通常面临许多问题，例如没有中心实体来查询用户账户信息或识别恶意用户，这导致了用户与感染网络的恶意实体之间出现某些不一致，其中最流行的攻击是双重花费攻击。比特币技术通过两个核心概念解决了这些问题：\n\
    \n1. **区块链网络**，它允许使用现有的软件应用程序在整个网络中对交易进行验证和广播。当交易发生时，网络节点会验证这些交易，将它们添加到自己的账本副本中，然后将这些账本更新广播到其他节点。一旦这些交易被网络接受，它们就变成了一个区块。此后通过`Proof-of-Work`协议，这些区块被添加到区块链并快速发布到所有节点，无需中心监督。这使得网络能够确定特定的比特币何时被花费，这对防止双重花费是必要的。\n\
    \n2. **工作量证明（PoW）协议**。为了被网络其余接受，账本必须包含工作证明。`Proof-of-Work`要求比特币矿工解决一个任意数学难题，以找到一个名为`nonce`或“随机数”的数字，这是在认证协议中发布的随机任意数字，用于确保旧的通信不会被重放攻击利用。它在加密通信中只能使用一次，当区块内容与`nonce`一起进行哈希处理时，其结果在数值上小于网络难度目标。结果是会生成一个匹配当前区块目标哈希的新哈希值（一长串字符）。这个新区块被添加到网络并发布到所有节点，解决该问题的加密矿工将获得将该区块添加到区块链的权利并获得奖励。工作证明就是向加密货币的区块链添加新交易区块的一种形式。\n\
    \n这两个概念使得任何接入互联网的人都可以加入比特币网络，自行验证和审计交易历史，并通过`Proof-of-Work`通过挖掘来创建比特币。\n\n## 比特币身份\n\
    \n在金融领域，身份是一种验证手段，确保没有其他人在访问你的金融账户或进行交易时代表你采取行动。通过验证，人们可以访问自己的资金并进行金融交易。如果有人尝试冒充你的身份并从你的银行取款，你可以获得相关记录，获取试图冒充你的人的身份，将其封在网络之外并在未来消除此类恶意活动。\n\
    \n现在在比特币背景下，如果你想给朋友发送 1 个比特币，他不应该能够再加一个 0 使其变成 10 个比特币。他不应该能够复制你的签名。比特币通过数字签名确保此类此类发生及其网络完整性。它同时拥有公钥和私钥。公钥是你提供给公众与你通信的密钥，私钥是你唯一拥有并用于访问账户的秘密密钥。\n\
    \n![](img/image00238.gif)\n\n在比特币语境下，公钥可以被视为储物柜，而私钥可以被视为钥匙。公钥用于接收资金，私钥用于提取资金。其他用户将比特币发送到你的比特币地址，该地址是由你的公钥派生出来的。要生成身份，用户选择一个随机私钥，并使用数学函数从私钥生成公钥。公、私钥的概念确保了用户在比特币空间中的唯一身份及其身份验证。\n\
    \n## 比特币共识 \n\n由于区块链信息存储在网络中的每个人手中，因此需要一种共识来确保每个人对交易历史达成一致。不仅所有用户需要对任何交易更新达成一致，他们还需要对有效的交易更新达成一致，以确保网络不会获取损坏的信息。\n\
    \n比特币最独特的特征之一是它的共识算法，它为拜庭容错（BFT）点对点货币系统立了先例。拜庭容错是一种机制，它使得去中心化、无需信任的网络在存在故障或恶意节点的情况下也能正常运行。如果忠诚（非故障）的将军达成多数共识，就可以实现拜庭容错。\n\
    \n比特币共识算法最常见的定义是工作量证明（`PoW`），这是一种依赖参与者解决加密难题来验证新信息的共识机制。然而，PoW 是更大共识算法的一部分，通常被称为`Nakamoto\
    \ Consensus`（中本共识）。中本共识让比特币与之前的数字货币实现有所不同。\n\n`PoW`指的是一种依赖参与者能够解决计算难题以便在网络中拥有更高权益的加密机制。`PoW`本质上是参与者确定最有效区块的分布式方法。每个参与者都尝试找到一个哈希值，这是即将发生的交易区块的有效解决方案。找到符合哈希值的获胜者将提议区块添加到链并获得奖励。\n\
    \nHashcash 工作量证明使用了哈希算法`SHA-256`。这涉及找到一个值`x`，使得当`x`使用该算法进行哈希处理时，可以找到所需的值。这通常是一个迭代过程；在每一轮中，nonces（使用一次的数字）被添加到正在哈希处理的字符串末尾，直到给出所需的值。一旦参与者成功找到`PoW`的解决方案，他们就会将区块广播到网络的其他部分，如果其中没有任何交易已被花费，则该区块将获得批准。然后参与者将获得比特币奖励，以补偿他们为了验证下一区块交易而花费的计算能力。\n\
    \n"
- fmt: "\n# Mining in Bitcoin\n\nMining in Bitcoin is really the commitment of a certain\
    \ amount of computing resources to the sole purpose of solving computationally\
    \ hard problems and validating new blocks. The more computing power an individual\
    \ node has, the more likely it is to find a correct value for the `SHA-256` hash,\
    \ and thus solve the cryptographic hash associated with that block’s `PoW`.\n\n\
    `PoW` enables Bitcoin to be both fully decentralized and fully secure. Anyone\
    \ can participate in the mining process, without needing to own a certain number\
    \ of bitcoin beforehand in order to do so. In fact, it is completely unknown who\
    \ the winner of the next mining reward will be at any given point in time, with\
    \ additional computing power only serving to increase the probability that an\
    \ individual node will be successful. Furthermore, the mining process also incentivizes\
    \ nodes to act honestly because of the rewards associated with broadcasting the\
    \ correct block. This means that in order to take over the network, a malicious\
    \ attacker has to control over 51% of the computing/hashing power on the network\
    \ and prevent legitimate blocks from being validated. This is commonly known as\
    \ a “51% attack.” Due to the Bitcoin network’s current size, the economic cost\
    \ of accruing over 51% of the hashing power currently present in the network is\
    \ huge, and thus extremely difficult.\n\n## Nakamoto Consensus\n\nThe second part\
    \ of Nakamoto Consensus is what allowed Bitcoin to be the first scalable cryptocurrency\
    \ platform. Nakamoto Consensus places a large emphasis on the longest chain, arguing\
    \ that the longest chain that is also valid according to timestamps is the most\
    \ legitimate, as it had the largest amount of computational resources dedicated\
    \ to it. This introduces trust in an otherwise trustless system, thus allowing\
    \ the Bitcoin network to function without a centralized authority. For example,\
    \ if a participant has been inactive, or has newly joined, they can simply accept\
    \ the current longest chain as proof of what happened previously within the network.\
    \ They do not need to rely on a 3rd party; rather simply start build upon the\
    \ longest valid chain, thus gaining the ability to receive rewards by proposing\
    \ a computationally valid block. In fact, the “longest chain rule”, as it has\
    \ been dubbed by the cryptocurrency community, enabled Bitcoin to succeed where\
    \ previous `PoW` digital currencies had failed. It allowed participants to have\
    \ confidence in the network, as well as set a standard through which miners could\
    \ begin to join and leave at will without having to defer to an authority. The\
    \ longest chain rule has been adopted by numerous digital asset systems and blockchains\
    \ that came after Bitcoin.\n\nNakamoto Consensus ultimately revolutionized both\
    \ digital currency and modern cryptography solution that was scalable, thus allowing\
    \ Bitcoin to succeed as a trustless peer-to-peer transaction system. Specifically,\
    \ Nakamoto Consensus managed to create a standard of measurement for the blockchain’s\
    \ validity: the amount of computational resources spent on it. While the Nakamoto\
    \ Consensus model has seen its fair share of criticism, largely due to its tendency\
    \ to allow the chain to fork, it remains one of the most efficient and successful\
    \ consensus mechanisms among decentralized networks. By attaching a scarce resource\
    \ (computing power) to the blockchain, Nakamoto Consensus gives Bitcoin implicit\
    \ value, security, and trust over other currency systems.\n\n# Cryptographic Hash\
    \ Functions\n\nSuppose you take a flight from London to New York. At the New York\
    \ airport, the immigration officer scans your fingerprint and your eye. For the\
    \ person next to you in the queue this fingerprint and eye scan changes. It becomes\
    \ your unique identifier, which is difficult to forge and tamper.\n\nThe same\
    \ concept applies in Bitcoin. Except instead of fingerprints and eye-scans, you\
    \ can replace yourself with a meaningful information, and your fingerprint with\
    \ some pseudorandom output (a same random output for a unique input). If we can\
    \ design a way to generate fingerprints of our meaningful data, we can ensure\
    \ the integrity of our information. This is achieved by cryptographic hash functions.\n\
    \nA cryptographic hash function is a mathematical algorithm that takes an arbitrary\
    \ amount of data input (consider yourself) and produces a fixed-size output of\
    \ enciphered text called “hash” (consider your fingerprint). This hash can then\
    \ be stored instead of the password itself, and later used to verify the user.\
    \ A cryptographic hash function must be deterministic, meaning that the same message\
    \ always results in the same hash.\n\n![](Images/image00239.jpeg)\n\nA cryptographic\
    \ hash function (specifically `SHA-1`) at work.\n\nA small change in the input\
    \ (in the word \"over\") drastically changes the output (digest). This is also\
    \ known as ‘Avalanche Effect’. \n\nSource - Wikipedia\n\nA cryptographic hash\
    \ function has the following key properties:\n\n- **Nonreversible** – A good hash\
    \ function should make it very hard to reconstruct the original password from\
    \ the output or hash. This is achieved via ‘Preimage resistance’, which refers\
    \ to the difficulty of finding an input given an output. Mathematically, given\
    \ a hash value `H`, it should be difficult to find any message `x` such that `H\
    \ = Hash(x)`.\n- **Determinism** – A given password must always generate the same\
    \ hash value or enciphered text. This is achieved via the 2nd preimage resistance,\
    \ which for any given input `x`, it should be computationally difficult to find\
    \ a different input `y`, such that `Hash(x) = Hash(y)`.\n- **Collision resistance**\
    \ – It should be hard to find two different passwords that hash to the same enciphered\
    \ text. In mathematical terminology, for a given hash function `H`, it is computationally\
    \ difficult to find two different inputs `x` and `y`, such that `H(x) = H(y)`.\n\
    - **Non predictable** – The hash value should not be predictable from the password.\n\
    - **Diffusion (Avalanche effect)** – When a password is changed slightly, the\
    \ output of enciphered text should change significantly and unpredictably.\n\n\
    Informally, these properties mean that a malicious attacker cannot replace or\
    \ modify the input data without changing its digest. Thus, if two strings have\
    \ the same digest, one can be very confident that they are identical. Second pre-image\
    \ resistance prevents an attacker from crafting a document with the same hash\
    \ as a document the attacker cannot control. Collision resistance prevents an\
    \ attacker from creating two distinct documents with the same hash.\n\nAn illustration\
    \ of the potential use of a cryptographic hash is as follows: Suppose you give\
    \ me a tough computational problem to solve and claim that you have already solved\
    \ it. I want solve this problem, however I would like to ensure that you have\
    \ actually solved it as well. So, you would write down your solution, compute\
    \ its hash, and tell me the hash value (whilst keeping the solution secret). Let’s\
    \ assume that I solve this problem in a week. Now you can prove that you solved\
    \ it earlier by revealing the solution, which I can hash and validate with the\
    \ hash value you gave me before.\n\nAn important application of secure hashes\
    \ is the verification of message integrity. Comparing message digests (hash digests\
    \ over the message) calculated before, and after, transmission can determine whether\
    \ any changes have been made to the message. Using a cryptographic hash and a\
    \ chain of trust detects malicious changes to the file. Almost all digital signature\
    \ schemes require a cryptographic hash to be calculated over the message. This\
    \ allows the signature calculation to be performed on the relatively small, statically\
    \ sized hash digest. The message is considered authentic if the signature verification\
    \ succeeds given the signature and recalculated hash digest over the message.\
    \ So the message integrity property of the cryptographic hash is used to create\
    \ secure and efficient digital signature schemes.\n"
  raw: "Mining in Bitcoin is really the commitment of a certain amount of computing\
    \ resources to the sole purpose of solving computationally hard problems and validating\
    \ new blocks. The more computing power an individual node has, the more likely\
    \ it is to find a correct value for the SHA-256 hash, and thus solve the cryptographic\
    \ hash associated with that block’s PoW. \n\nPoW enables Bitcoin to be both fully\
    \ decentralized and fully secure. Anyone can participate in the mining process,\
    \ without needing to own a certain number of bitcoin beforehand in order to do\
    \ so. In fact, it is completely unknown who the winner of the next mining reward\
    \ will be at any given point in time, with additional computing power only serving\
    \ to increase the probability that an individual node will be successful. Furthermore,\
    \ the mining process also incentivizes nodes to act honestly because of the rewards\
    \ associated with broadcasting the correct block. This means that in order to\
    \ take over the network, a malicious attacker has to control over 51% of the computing/hashing\
    \ power on the network and prevent legitimate blocks from being validated. This\
    \ is commonly known as a “51% attack.” Due to the Bitcoin network’s current size,\
    \ the economic cost of accruing over 51% of the hashing power currently present\
    \ in the network is huge, and thus extremely difficult.\n\nThe second part of\
    \ Nakamoto Consensus is what allowed Bitcoin to be the first scalable cryptocurrency\
    \ platform. Nakamoto Consensus places a large emphasis on the longest chain, arguing\
    \ that the longest chain that is also valid according to timestamps is the most\
    \ legitimate, as it had the largest amount of computational resources dedicated\
    \ to it. This introduces trust in an otherwise trustless system, thus allowing\
    \ the Bitcoin network to function without a centralized authority. For example,\
    \ if a participant has been inactive, or has newly joined, they can simply accept\
    \ the current longest chain as proof of what happened previously within the network.\
    \ They do not need to rely on a 3rd party; rather simply start build upon the\
    \ longest valid chain, thus gaining the ability to receive rewards by proposing\
    \ a computationally valid block. In fact, the “longest chain rule”, as it has\
    \ been dubbed by the cryptocurrency community, enabled Bitcoin to succeed where\
    \ previous PoW digital currencies had failed. It allowed participants to have\
    \ confidence in the network, as well as set a standard through which miners could\
    \ begin to join and leave at will without having to defer to an authority. The\
    \ longest chain rule has been adopted by numerous digital asset systems and blockchains\
    \ that came after Bitcoin.\n\nNakamoto Consensus ultimately revolutionized both\
    \ digital currency and modern cryptography solution that was scalable, thus allowing\
    \ Bitcoin to succeed as a trustless peer-to-peer transaction system. Specifically,\
    \ Nakamoto Consensus managed to create a standard of measurement for the blockchain’s\
    \ validity: the amount of computational resources spent on it. While the Nakamoto\
    \ Consensus model has seen its fair share of criticism, largely due to its tendency\
    \ to allow the chain to fork, it remains one of the most efficient and successful\
    \ consensus mechanisms among decentralized networks. By attaching a scarce resource\
    \ (computing power) to the blockchain, Nakamoto Consensus gives Bitcoin implicit\
    \ value, security, and trust over other currency systems.\n\nCryptographic Hash\
    \ Functions\n\nSuppose you take a flight from London to New York. At the New York\
    \ airport, the immigration officer scans your fingerprint and your eye. For the\
    \ person next to you in the queue this fingerprint and eye scan changes. It becomes\
    \ your unique identifier, which is difficult to forge and tamper. \n\nThe same\
    \ concept applies in Bitcoin. Except instead of fingerprints and eye-scans, you\
    \ can replace yourself with a meaningful information, and your fingerprint with\
    \ some pseudorandom output (a same random output for a unique input). If we can\
    \ design a way to generate fingerprints of our meaningful data, we can ensure\
    \ the integrity of our information. This is achieved by cryptographic hash functions.\n\
    \nA cryptographic hash function is a mathematical algorithm that takes an arbitrary\
    \ amount of data input (consider yourself) and produces a fixed-size output of\
    \ enciphered text called “hash” (consider your fingerprint). This hash can then\
    \ be stored instead of the password itself, and later used to verify the user.\
    \ A cryptographic hash function must be deterministic, meaning that the same message\
    \ always results in the same hash.\n\n![](Images/image00239.jpeg)\n\nA cryptographic\
    \ hash function (specifically SHA-1) at work. \n\nA small change in the input\
    \ (in the word \"over\") drastically \n\nchanges the output (digest). This is\
    \ also known as \n\n‘Avalanche Effect’.\n\nSource - Wikipedia\n\nA cryptographic\
    \ hash function has the following key properties:\n\n*   Nonreversible – A good\
    \ hash function should make it very hard to reconstruct the original password\
    \ from the output or hash. This is achieved via ‘Preimage resistance’, which refers\
    \ to the difficulty of finding an input given an output. Mathematically, given\
    \ a hash value ‘H’, it should be difficult to find any message ‘x’ such that H\
    \ = Hash(x).\n\n*   Determinism – A given password must always generate the same\
    \ hash value or enciphered text. This is achieved via the 2nd preimage resistance,\
    \ which for any given input ‘x’, it should be computationally difficult to find\
    \ a different input ‘y’, such that Hash (x) = Hash (y).\n\n*   Collision resistance\
    \ – It should be hard to find two different passwords that hash to the same enciphered\
    \ text. In mathematical terminology, for a given hash function ‘H’, it is computationally\
    \ difficult to find two different inputs ‘x’ and ‘y’, such that H(x) = H(y).\n\
    \n*   Non predictable – The hash value should not be predictable from the password.\n\
    \n*   Diffusion (Avalanche effect) – When a password is changed slightly, the\
    \ output of enciphered text should change significantly and unpredictably.\n\n\
    Informally, these properties mean that a malicious attacker cannot replace or\
    \ modify the input data without changing its digest. Thus, if two strings have\
    \ the same digest, one can be very confident that they are identical. Second pre-image\
    \ resistance prevents an attacker from crafting a document with the same hash\
    \ as a document the attacker cannot control. Collision resistance prevents an\
    \ attacker from creating two distinct documents with the same hash.\n\nAn illustration\
    \ of the potential use of a cryptographic hash is as follows: Suppose you give\
    \ me a tough computational problem to solve and claim that you have already solved\
    \ it. I want to solve this problem, however I would like to ensure that you have\
    \ actually solved this problem as well. So, you would write down your solution,\
    \ compute its hash, and tell me the hash value (whilst keeping the solution secret).\
    \ Let’s assume that I solve this problem in a week. Now you can prove that you\
    \ solved it earlier by revealing the solution, which I can hash and validate with\
    \ the hash value you gave me before.\n\nAn important application of secure hashes\
    \ is the verification of message integrity. Comparing message digests (hash digests\
    \ over the message) calculated before, and after, transmission can determine whether\
    \ any changes have been made to the message or file. Using a cryptographic hash\
    \ and a chain of trust detects malicious changes to the file. Almost all digital\
    \ signature schemes require a cryptographic hash to be calculated over the message.\
    \ This allows the signature calculation to be performed on the relatively small,\
    \ statically sized hash digest. The message is considered authentic if the signature\
    \ verification succeeds given the signature and recalculated hash digest over\
    \ the message. So the message integrity property of the cryptographic hash is\
    \ used to create secure and efficient digital signature schemes."
