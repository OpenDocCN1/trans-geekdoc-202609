- fmt: '

    On-chain processes have been criticized as plutocratic because the amount of coins
    you hold determines the weight of your vote, which means whales often have disproportionate
    influence on the system. And critics worry that coin-rich whales will vote to
    make changes to the blockchain that are most profitable for them, instead of voting
    for what is best for the long-term health of the blockchain ecosystem. Likewise,
    despite having the option to vote, many token holders never participate in governance.


    *   **Off-chain governance**: Off-chain governance can be seen as decision making
    that first takes place on a social level and is later actively encoded into the
    protocol by the developers. For example, Bitcoin developers share their improvement
    proposals through a mailing list, which are then reviewed.


    Both Bitcoin and Ethereum utilize off-chain governance processes, as do most other
    Proof-of-Work blockchain systems. The core stakeholders of these blockchains are
    users, node operators, developers, and miners, and they all exert checks and balances
    on each other. Off-chain governance for a blockchain ecosystem functions when
    all stakeholders agree and make all relevant updates and implementations in unison.
    If consensus cannot be reached, the network is liable to fork, or split into two
    chains running different versions of the software, and the chain with the most
    transactional hashing power is considered to be the successor to the original
    chain.


    With an off-chain model, protocol development takes place at conferences, on online
    forums, and through mailing lists, among other means. You must use these channels
    to get involved. A brief examination of the history of Bitcoin’s block size debate
    reveals the informal, off-chain processes that determine whether changes are made
    and the complications that sometimes accompany those processes. The block size
    debate was a dispute within the Bitcoin community about whether the size of Bitcoin
    blocks should be increased to accommodate more transactions so as to scale Bitcoin’s
    transaction processing capacity. Throughout the off-chain process, the block size
    debate raged and ranged across a variety of off-chain platforms and events. Over
    several years, agreements were inked and broken, multiple conferences were called
    to host in-person discussions, and blockchain forks were threatened and eventually
    executed. Bitcoin Cash is the most notable example of a digital asset that lost
    consensus with the main Bitcoin blockchain, and now exists as a separate and distinct
    blockchain with nearly identical code. The protracted and inefficient debate over
    Bitcoin scaling reveals two downsides to off-chain governance: that it can be
    difficult to register your input as an individual user and that changes can take
    a long time to implement.


    ## Blockchain governance strategies


    Several blockchain governance strategies have been proposed and implemented for
    different blockchains. Let’s review some of those strategies sorted from the fewest
    to the most members directly involved in the decision, as discussed in “Blockchain
    Governance in a Nutshell” article by Demiro Massessi:


    *   **Benevolent dictator for life**: The original creator or the lead developer
    of the blockchain platform has the final say on all decisions.

    *   **Core development team**: A team of the most active developers decide what
    functionality should or should not be included in the blockchain platform. This
    strategy is commonly used in the open source programming projects, where the users
    are able to offer or request features, but the developers have the final say on
    what should or should not be included in the final release.

    *   **Open governance**: The team making governance decisions for the blockchain
    is chosen by the users of the blockchain (representative democracy). Some blockchains
    use the open governance method of handling governance.

    *   **On-chain governance**: The rules for how the blockchain operates are stored
    on-chain in smart contracts with built-in capability and procedures for modifications
    (direct democracy). A blockchain-specific governance strategy in on-chain governance.
    In this form of blockchain governance, the rules describing how the blockchain
    should operate are stored in the blockchain itself. These regulations typically
    are implemented as smart contracts on the blockchain with built-in methods for
    users to modify the rules based upon their needs and the needs of the blockchain.


    ## Bitcoin Governance


    Bitcoin uses Proof-of-Work (`PoW`) consensus model, which governs the operations
    of its blockchain. But what happens when changes need to be made, and how do they
    get implemented? The Bitcoin community consists of three main players: developers,
    miners, and users. None of these participants have the ability to make emergency
    decisions when unexpected situations occur. Bitcoin uses an off-chain governance
    model where the decisions are balanced by the developers, miners, and users. The
    developers must write the code to change the blockchain. Without the consent of
    the miners and users, the developers have no way of enforcing the change. Miners
    and users must choose to adopt the new software changes.


    When a change to the Bitcoin protocol is needed, developers will share the proposed
    change with other protocol developers. The improvement sharing could be in the
    form of an email to the `bitcoin-dev` mailing list, a formal white paper, and/or
    a Bitcoin Improvement Protocol (`BIP`). Code is written and tested that will enact
    the change. If developers approve the proposals and the resulting code, the proposal
    is put to a vote on the blockchain and the miners decide if the proposal is implemented.
    This occurs through a hard or soft fork.


    This system is not without faults, as can be seen with the `SegWit` improvement
    protocol which alters block size. The vision surrounding blockchain decentralization.
    By implementing the `SegWit` changes, a change in how the blockchain protocol
    operates, a central authority was responsible for enacting the change. To many
    in the community this decision went against the fundamental tenets of blockchain
    decentralized philosophy. As a result, the Bitcoin network split into two separate
    blockchains


    *   Bitcoin (`BTC`) – The original Bitcoin blockchain

    *   Bitcoin Cash (`BCH`) – The proposed hard fork from Bitcoin Core that proposed
    increasing the maximum size of transaction blocks. Despite the early successes,
    Bitcoin Classic has failed to be widely adopted by the bitcoin community and did
    not eventually materialize.


    ## Ethereum Governance


    Ethereum is based on the Bitcoin code, but includes a logic engine to execute
    smart contracts. By connecting computers using the Ethereum blockchain network,
    the computing power is aggregated creating the Ethereum Virtual Machine (`EVM`).
    Ethereum is not only a functioning blockchain with smart contract capabilities,
    but a platform for new blockchains to be built upon.


    Like Bitcoin, Ethreum’s three main players (developers, miners, and users) must
    update the code to improve on its functionality. Ethereum Improvement Proposals
    (`EIP`) are standards specifying potential new features for Ethereum blockchain.
    `EIPs` contain technical specifications for the proposed changes and act as the
    “source of truth” for the community. The Ethereum Request for Comment, `ERC-20`,
    introduced the standards for issuing utility tokens on blockchain based on Ethereum
    protocols. The Beacon Chain introduced the Proof-of-Stake (`PoS`) consensus model
    and the concept of ‘sharding’ – running parallel side chains to alleviate congestion
    of the network. The Berlin Hard Fork and the London Fork are improvements to stabilize
    the fees paid to the miners, such that it does not fluctuate with the price of
    Ether.

