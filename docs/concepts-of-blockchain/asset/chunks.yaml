    这些公司之一是 DigiCash，由大卫豪（David Chaum）于 1989 年创立的电子货币公司。DigiCash 交易的独特之处在于它是匿名性的，为进行数字交易的用户提供了完全的隐私保护，并包含了多种加密协议，防止政府和银行追踪个人交易。由于验证系统中每一处数字签名的负担过于沉重且成本高昂，DigiCash
    无法生存下去，并于 1998 年宣布破产，随后将其资产出售给另一家数字货币公司 eCash Technologies。


    1997 年，亚当·（Adam Back）提出了一种名为 Hashcash 的概念，并在 2002 年的论文《Hashcash - 拒绝服务攻击措施》中对其进行了更正式的描述。Hashcash
    使用工作量证明系统来限制垃圾邮件和拒绝服务攻击。为了发送电子邮件，用户必须解决一个加密哈希谜并提供工作量证明，同时在邮件头中添加 Hashcash 邮戳。这个
    Hashcash 邮戳会将邮件验证为真实而非垃圾。这种工作量证明后来成为了比特币的基础核心概念之一。


    同样在 1998 年，大卫钱（Wei Dai）发表了一篇名为《B-money：一种匿名、分布的电子现金系统》的论文。使用工作量证明函数来创建货币。每个人都维护一份数据库副本，并通过集体账本验证工作。所有交易通过集体记账完成，并通过加密哈希进行认证。这些思想后来影响了比特币的设计。


    ## 比特币的发明


    比特币采用了这些发明中的一些关键特征，并从它们的错误中汲了教训。2008 年，比特币成为第一个成功的加密货币技术。Bitcoin 一词是 bit（位）和 coin（币）的组合。域名
    `bitcoin.org` 于 2008 年 8 月 18 日注册。


    2008 年 10 月 31 日，一位名为中本聪（Satoshi Nakamoto）的匿名人士或团体发布了比特币白皮书。这份名为《比特币：点对点电子现金系统》的九页纸是对数字货币框架的提案，网络验证交易并存储整个交易历史，使用户无需依赖任何金融机构即可相互进行安全交易。这份白皮书构想了一种匿名、去信任、去中心化的加密货币，它不受任何审查或中心化的限制，从而赋予用户交易的自由同时保护了他们的隐私。


    比特币被设计为通缩性货币，这意味着存在的比特币总量是有限的，具体为 2100 万个。每位比特币矿工在发现区块后都会获得区块奖励，但这种奖励会随着时间的推移而减少。最终，当
    2100 万个比特币被挖完时，区块奖励将变为 0。


    ## 比特币早期时代


    比特币于 2009 年作为开源软件发布后开始使用。2009 年 1 月 3 日，当中本聪挖出链的起始区块（即创世区块）时，比特币网络诞生了。第一笔比特币交易的接收者是哈尔·芬尼（Hal
    Finney），他是首个可重用工作量证明系统的创建者，他从中本聪那里收到了 10 个比特币。2010 年，发生了第一笔已知的比特币商业交易，程序员拉斯洛·汉尼泽（Laszlo
    Hanyecz）从杰里米·图迪万特（Jeremy Turdivant）那里用 10000 个比特币购买了两个披萨王披萨。从此时起，比特币从一种无值的互联网货币变成了具有真实价值的加密货币。这次购买确证了比特币作为实际货币的用途。


    在早期的“概念验证”交易之后，比特币的首批主要用户是黑市，例如丝绸之路（Silk Road），它赢得了“毒品 eBay”的名声。丝绸之路利用名为 `Tor`
    的匿名网络协议，这使得用户的身份匿名化，并使用比特币进行交易。2013 年，丝绸之路被 FBI 关闭。同样，`mtgox.com` 作为早期最大的比特币交易所之一，曾被黑客抽走资金并遭遇了严重的安全泄露，到
    2014 年，它处理了全球超过 70%的比特币交易。然而，由于严重的安全泄露和丢失了约 100 万个客户的比特币，门头交易所暂停了交易，关闭了网站和交易所服务，并于
    2014 年向债权人申请破产保护。


    ## 比特币的崛起与主流采用


    2013 年至 2015 年间，比特币价格剧烈波动，从 2013 年的不足 14 美元飙升到 2014 年的 1000 美元以上，然后又下跌 90%跌至 100
    美元。这归因于两个因素——中国投资者作为投机性投资买卖比特币，以及门头交易所持续到 2014 年的自动交易。比特币基金会于 2012 年 9 月成立，旨在促进比特币的发展。此外，交易费用降低了。2013
    年，美国金融犯罪执法网络（`FinCEN`）为比特币等“去中心化虚拟货币”制定了监管指南，将出售比特币的美国矿工分类为货币服务业务（`MSBs`），他们必须履行注册或其他法律义务。同时，中国人民银行禁止中国金融机构使用比特币，这导致价格再次下跌。


    2014 年，一些商家开始接受比特币作为支付方式。加密交易所和钱包公司也相继出现，让用户可以买卖比特币，且商家接受比特币而无需亲自加入比特币网络。同年 9
    月，PayPal 与 Coinbase、`BitPay`和`GoCoin`达成了合作。


    2015 年，比特币软件的发布引入了共识库，让程序员能够轻松访问网络共识的规则。开发者现在可以添加一项新功能，允许交易在未来的特定时间之前无法花费。2016
    年 10 月，比特币发布了一项优化区块大小的新功能，这将降低交易费用并增加网络的最大交易处理能力。此后，2017 年 8 月的版本支持了闪电网络并改进了扩展性。


    2018 年，比特币价格受到多个加密货币交易所黑客攻击或盗窃的负面影响，包括 2018 年 1 月`Coincheck`、6 月`Bithumb`以及 7
    月`Bancor`的盗窃案。此外，由于区块时间和区块大小的限制，比特币正变得难以扩展，因为交易变得效率更低且耗时更长。2018 年 3 月，每 10 分钟创建一个比特币区块，只能容纳
    1MB 的交易数据，大约相当于 2000 笔交易~每秒 3 笔交易。交易量超过了比特币网络的容量，交易由于无法被区块中而处于未确认状态。在比特币历史上，人们对这一限制提出过各种增加。比特币现金的区块大小为
    32MB，因此吞吐量是比特币的 32 倍。比特币 SV 完全删除了区块大小限制。这导致了去中心化治理的另一个问题，因为比特币协议中没有包含变更机制。


