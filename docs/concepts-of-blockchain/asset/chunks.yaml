  trans: '

    以太坊在区块链治理中采用了“终身独裁者”模式。虽然以太坊欢迎用户和开发团队的投入，但关于以太坊决策的最终决定权掌握在其创始人 `Vitalik Buterin`
    手中。


    ## Hyperledger 治理


    Hyperledger 是作为一个由 `Linux Foundation` 批准的开源区块链项目引入的。它由 `Brian Behlendorf` 领导，使命是为社区提供工具和教育，以促进企业级分布式账本技术的发展。Hyperledger
    框架使用 `Open Governance` 模型来做出关于 Hyperledger 环境的技术决策。`Hyperledger 技术指导委员会 (TSC)`
    是 Hyperledger 技术决策的最终权威机构。每年，该委员会的成员将从 Hyperledger 的活跃贡献者和维护者中选出，他们自荐成为十五名额的潜在候选人，这些名额将根据同一组贡献者和维护者的投票产生产生。这种模式旨在让在
    Hyperledger 开发社区中发挥积极作用的人对 Hyperledger 的治理方式拥有发言权。


    ## Corda 治理


    Corda 是一个为业务设计的开源区块链项目。它由企业级区块链软件公司 `R3` 与 200 多个技术和行业合作伙伴合作开发。Corda 平台于 2017
    年开发。


    Corda 使用 `Open Governance` 模型做出关于其路线图的技术决策。`Corda 治理机构` 被选出代表 Corda 网络所有用户的利益。


    ## 区块链的身份


    在这里我们将讨论区块链上的身份。让我们先从理解为什么我们在区块链上需要身份开始。


    中心化系统可能会被其他形式的权威强制关闭其网络。


    以 `Napster` 为例。`Napster` 具有去中心化的网络架构，但他们维护着中心化的权威。因此，中心权威可能会受到攻击，通过移除中心权威，就可以有效控制
    `Napster`。这是因为 `Napster` 依赖于这种去中心化网络与中心化控制的。这影响了身份，因为你需要一个身份来进行控制。


    另一方面，Torrent（种子）的运行方式不同。它们提供了具有去中心化权威的去中心化网络。这允许节点以不同的方式管理身份。这也是尽管娱乐行业尽力阻止，Torrent
    在如今仍被使用的原因。Torrent 消除了中心权威。


    这就引出了问题：“为什么像 Torrent 这样的点点网络没有获得与区块链那样的赞誉？”因为无法保证节点会做正确的事。没有人能保证节点之间会合作。


    这引出了一个极其重要的问题：如何激励网络中的节点遵循规则？在 Torrent 系统中，任何人都可以下载和共享文件，但并没有真正的激励机制让某人在网络中成为良好的行为者。例如，当
    Torrent 网络上的人停止共享占用他们电脑空间的电影时，会发生什么？现在让我们将 Torrent 网络中的“电影”替换为银行网络中的“金钱”。在这种情况下，交易将无法可靠地处理。此外，由于匿名性，你将无法奖励或惩罚这些行为者。


    区块链通过 `crypto economics`（加密经济学）解决了这个问题，通过激励矿工去创建和维护一个去中心化的自包含网络。这与早期的点点网络不同，因为它为遵循规则的节点提供了
    `cryptocurrency` 形式的经济激励。节点如果篡改网络也会受到惩罚。


    ## 关键密码学与身份


    公钥加密是区块链上管理身份的方式。用户在区块链上的地址就是他们的公钥。这有几个非常有用的属性。用户不需要在区块链上透露自己的身份，但他们可以明确地识别自己，因为确定他们的私钥需要解决一个“难题”。

    '
- fmt: "\nAnyone can send a user an encrypted message, since they have easy access\
    \ to their public key. Users can verify the validity of these transactions using\
    \ their digital signatures. In `RSA`, anyone can send an encrypted message to\
    \ a user by converting it to a number, raising it to their public exponent, and\
    \ sending the result. The user’s public and private key are designed such that\
    \ the users can retrieve the original message by raising the received message\
    \ to their private component. `RSA` digital signature involves the opposite process.\
    \ Users writes a message and raises a condensed form of this message to the power\
    \ of their private exponent to create a signature, and then they publish this\
    \ signature. Their public key and the message are both published together. Anyone\
    \ can validate the signature using a simple three step process – condense the\
    \ attached message using the same method as the message writer, raising the attached\
    \ signature to the user’s public key, and verifying that the results of the previous\
    \ two steps are identical.\n\nDigital signature works for the same reason that\
    \ encryption works in `RSA`. An attacker needs to know the user’s private key\
    \ to perform either operation, and the algorithms are designed to make that process\
    \ nearly close to impossible.\n\nThis means that identity on the blockchain boils\
    \ down to the possession of a user’s private key. So its very important to keep\
    \ this private key safe.\n\nIn `Ethereum`, a user’s identity is managed using\
    \ a public key or address, the user can use the corresponding private key to sign\
    \ transactions and read encrypted messages that are sent to them.\n\nIn `Hyperledger`\
    \ and `Corda`, identity is encoded in `x.509` certificates, which includes the\
    \ user’s public key. In `Corda`, certificates can either be public, which means\
    \ that they are published to the blockchain, or confidential, meaning that they\
    \ are only shared with the parties that the owner performs transactions with.\n\
    \n# Anonymity in Blockchain\n\nAnonymity in blockchain is a crucial part of its\
    \ success in some applications. If individuals or organizations are performing\
    \ transactions on blockchain, they may not wish this to be public. Different blockchains\
    \ have different levels of anonymity and privacy built into the protocol.\n\n\
    As discussed earlier, public key cryptography maintains identity on the blockchain,\
    \ by using a pair of public and private keys to make encryption and digital signatures\
    \ possible.\n\nAt this point, we need to take a look at the relationship between\
    \ a user’s keys and their actual identity. The first thing to note is that there\
    \ is nothing about a public key that ties to its corresponding private key. Since\
    \ private keys are secret, it cannot be possible for someone to determine a private\
    \ key from a public key, whereas you can calculate a public key from a private\
    \ key. The other thing to keep in mind is that private keys are just numbers and\
    \ cannot be tied to users actual identity. Identity on blockchain is just possession\
    \ of the relevant private key, and even if someone guesses or steals a private\
    \ key, they cannot learn its owner’s actual identity from the private key directly.\n\
    \nHence you cannot tie public keys to private keys or private keys to real-world\
    \ identities, which means that blockchain users have a limited amount of built-in\
    \ privacy.\n\nHowever, every transaction on blockchain is public and stored there\
    \ forever. This means that a lot of information about the users’ identity could\
    \ be learned through studying the data stored on the blockchain to obtain the\
    \ metadata. Based on the repeated transactions to places like a restaurant or\
    \ a coffee shop, someone could get an idea of where an individual lives and their\
    \ habits. For businesses, repeated transactions may indicate business relationships\
    \ that may lead to a loss of competitive advantage if leaked.\n\nOn basic blockchain,\
    \ anonymity goes only so far. The limited level of anonymity and privacy protections\
    \ available on the original blockchain have inspired enhancements that increase\
    \ privacy, while still allowing transactions to be verified and validated publicly\
    \ on the blockchain.\n\nSome of the mechanisms developed and implemented to increase\
    \ privacy protections are:\n\n*   `Zero knowledge proofs` – They use cryptographic\
    \ algorithms to allow a user to prove knowledge of a secret without revealing\
    \ the actual secret. The validator proves the knowledge of the secret without\
    \ actually revealing it. A common example includes a colorblind person and two\
    \ identical object except for color. The colorblind person shows one object to\
    \ the validator, conceals both objects, and the shows the one to the validator\
    \ again. The validator then verifies whether or not it is the same object, without\
    \ revealing the color of either object.\n*   `Stealth approach` – Stealth addresses\
    \ involve using one-time addresses to perform transactions on the blockchain.\
    \ A stealth address is just a one-time address that makes it impossible to link\
    \ a transaction to a known account. What it does is prevents the data mining attacks\
    \ on privacy of users.\n*   `Ring signatures` – Blockchain transactions are digitally\
    \ signed. With ring signatures, all that can be determined from a transaction\
    \ is that a member of the group signed it, but not the actual member.\n*   `CoinJoin`\
    \ – The ability to see who is performing the transactions with whom is dangerous\
    \ to user privacy and anonymity. CoinJoin mixes several transactions together\
    \ such that it is difficult to pair senders with recipients.\n*   `Confidential\
    \ transactions` – Confidential transactions take advantage of homomorphic encryption,\
    \ which makes it possible to perform mathematical operations on encrypted data.\
    \ This means that the data contained in a transaction can be hidden from the public,\
    \ while still allowing the network to validate the transaction.\n\n## Specific\
    \ Anonymity Implementations\n\n*   `Ethereum` – `Ethereum` is working on improving\
    \ the zero-knowledge proofs, mixing and `DAPPS` (applications developed to improve\
    \ anonymity) to strengthen blockchain privacy. Also `ConsesSys`, the enterprise\
    \ solution builder for `Ethereum` introduced `QUORUM`, a fork of the Ethereum\
    \ blockchain which allows users to benefit from the public Ethereum blockchain\
    \ while enjoying features from a private network. Developed by `JP Morgan`, it\
    \ is a permissioned implementation.\n*   `Hyperledger`\n    *   `Channels` – Subsections\
    \ of the blockchain that make the transactions visible only to the members.\n\
    \    *   `Private transactions` – Hashes of private data are stored to publicly\
    \ verify it on the blockchain.\n    *   `Zero-knowledge Proof` – One can demonstrate\
    \ the knowledge of a secret without revealing the secret itself.\n*   `Hyperledger\
    \ Besu` – `Besu` is an Ethereum client that runs on the Ethereum public network,\
    \ private networks, and test networks such as `Rinkeby`, `Ropsten`, and `Gorli`.\
    \ `Hyperledger Besu` includes several consensus algorithms including `PoW`, `PoA`,\
    \ and `IBFT`, and has comprehensive ‘permissioning’ schemes designed specifically\
    \ for users in a consortium environment.\n*   `Corda` – Party on the `Corda` network\
    \ can be represented in one of the two ways: `Party` – A public key name and;\
    \ `Anonymous party` – Only a public key.\n"
