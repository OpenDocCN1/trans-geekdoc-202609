  trans: '

    1973 年，美国国家标准局（NBS）发布了一项公开征集公告，寻求一种加密算法以考虑作为新的加密标准。第二次征集于 1974 年发布，国际商业机器公司（IBM）提交了专利的“Lucifer
    算法”，该算法由该公司的一位研究员霍斯特·费斯泰尔（Horst Feistel）在几年前设计。Lucifer 算法在 NBS 与国家安全局（NSA）的秘密磋商中接受了评估。在对内部函数进行一些修改并将密钥长度从
    112 位缩短到 56 位后，将成为数据加密标准（DES）的算法完整细节于 1975 年发表在《联邦公报》上。


    DES 是一种分组密码算法，其中 16 次迭代的替换和置换过程级联在一起。分组大小为 64 位。控制变换的密钥也由 64 位组成；然而，用户只能选择其中的`56`位，这些才是真正的密钥位。剩余的
    8 位是奇偶位，因此完全是冗余的。在变换过程的每个中间阶段，前一个阶段的加密输出被分为左侧 32 位`Li`和右侧 32 位`Ri`。`Ri`被转置变为下一个更高级中间加密的左侧部分`Li
    + 1`。


    然而，下一个加密的右半部分`Ri + 1`是一个复杂的函数，它是密钥子集`Ki + 1`以及整个前一个中间加密的函数，`Li + f(Ri, Ki + 1)`。DES
    安全性的核心特征是“f”涉及一种非常特殊的非线性替换——即`f(A) + f(B) ≠ f(A + B)`——这由标准局通过称为 S 盒（S boxes）的表格函数指定。这一过程重复
    16 次。


    ![16 步数据加密标准（DES）操作流程图。](img/image00237.jpeg)


    16 步数据加密标准（DES）操作流程图


    来源：数据加密标准，FIPS Publ. no. 46，国家标准局，1977


    这种基本结构——在每次迭代中，将上一步的加密输出被分为两半，并将两部分转置，在右半部分执行一个由密钥控制的复杂函数，然后使用“异或”逻辑与左半部分结合以形成新的右半部分——被称为费斯泰尔密码（Feistel
    cipher），并被广泛应用于不仅限于 DES。费斯泰尔密码的优点之一（除了安全性之外）是，如果反向使用密钥子集，重复“加密”过程可以将密文解密并恢复明文。


    该标准于 1976 年底被采用，并于 1977 年初发布。规定 DES 必须用于未分类的美国政府应用，以保护在计算机系统和网络中传输和存储的二进制编码数据，并根据具体情况保护机密信息。


    所有美国政府涉及电子资金转账的金融交易都强制使用 DES 算法，包括由联邦储蓄系统成员银行进行的交易。随后，全球范围的标准组织相继采纳 DES，导致 DES
    成为业务和商业数据安全的事实上的国际标准。


    DES 的安全性并不高于其工作因子（即“搜索 256 个密钥所需的暴力破解工作量”）。在 1977 年，这被认为是一项不可能的计算任务。在 1997 年及后的几年里，DES
    被穷举搜索攻击破解。DES 的主要问题是加密密钥尺寸太小。随着计算能力的提高，暴力破解所有不同的密钥组合以获取可能的明文信息变得易容易。


    1997 年 1 月，美国国家标准与技术研究院（NIST）发布了公开请求，征集候选方案以取代老旧的 DES。这次收到了来自 12 国家的 15 份可行方案。2000
    年 10 月，NIST 宣布由两位比利时密码学家乔安·达门（Joan Daemen）和文森特·里曼（Vincent Rijmen）开发的程序 Rijndael
    接受为新标准，或“高级加密标准（AES）”。NBS 曾预计 DES 将在专用硬件中实现，因此对其在软件中（即使用通用微处理器）的有效实现较少或没有考虑。结果，DES
    未能利用 20 世纪最后二十年微处理器的快速发展。另一方面，AES 规范同样强调硬件和软件实现。在某种程度上，这承认了智能卡和其他销售终端设备的需求（这些设备通常计算能力非常有限），但更重要的是认识到了互联网和电子商务日益增长的需求。基于对
    DES 的经验（在，计算能力的提升直接超过了固定 56 位密钥的工作因子），NIST 对 AES 的规范也要求算法在必要时能够增加密钥长度。Rijndael
    证明自己既足够小，可以在智能卡上实现（代码少于 10000 字节），又足够灵活，允许更长的密钥。


    ## 加密学概念


    密码学是使区块链安全且不可篡改的关键技术之一。


    密码学被定义为在存在对手的情况下，从一方向另一方发送消息的科学。大多数加密函数都是双向函数，这意味着我们可以获取数据——对其加密——并发送给某人，然后在另一端使用相同的过程进行解密。密码学的关键组件包括：


    *   我们试图保护的数据或信息

    *   密钥，它是附加在试图保护的数据上的

    *   连接数据和密钥的函数，确保在参与者之间发送数据时不会被篡改

    *   密文，加密的消息，即使被对手拦截，他们也知道真实数据或如何将密文还原为原始


    加密哈希（Cryptographic hashing）是一类特殊的加密函数。这些是单向函数，意味着它们只能加密。如果我将数据放入加密哈希中，它会将数据和密钥结合为一个实体，这被称为哈希结果，一种基于数据的编码。这种哈希结果在数学上是不可逆工程的。如果你将任何数据放入加密哈希并将其传输给我，除了随机猜测并尝试重建原始数据外，我无法做其他事情。加密哈希用于我们希望在不实际共享数据的情况下验证数据的场景。例如——银行使用的密码管理系统，它们不存储在线银行注册用户的用户名或密码，只存储密码的哈希输出。


    让我们尝试使用一个简单的示例创建哈希函数


    *   数据：`Cryptographic hash makes blockchain secure and immutable`

    *   函数：根据密钥将数据中的每个字母替换为新字母

    *   密钥：`+3`

    *   密文：`Fubswrjudsklf kdvk pdnhv eorfnfkdlq vhfxuh dqg lppxwdele`


    ## 加密学类型

