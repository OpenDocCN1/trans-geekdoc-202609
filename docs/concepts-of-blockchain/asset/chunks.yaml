- fmt: '

    - **Other associated files**: Several internet memes have been associated with
    NFTs, which were minted and sold by their creators or by their subjects. For example,
    `Doge` wherein an image of a Shiba Inu dog whose NFT was sold for $4 million in
    June 2021.


    Some virtual worlds, often marketed as metaverses, have incorporated NFTs as a
    means of trading virtual items and virtual real estate. The 2018 virtual world
    `Decentraland` is one example.


    Tickets, for any type of event, have been suggested for sale as NFTs. Such proposals
    would enable event organizers or performers to garner royalties on resales.


    - **Collectibles**: In early 2020, the developer of `CryptoKitties`, `Dapper Labs`,
    released the beta version of `NBA TopShot`, a project to sell tokenized collectibles
    of NBA highlights. The project was built on top of `Flow`, a newer and more efficient
    blockchain compared to `Ethereum`. In 2019, Nike patented a system called `CryptoKicks`
    that would use NFTs to verify the authenticity of physical sneakers and give a
    virtual version of the shoe to the customer.


    - **Speculation**: NFTs representing certain digital collectables and artworks
    have seen considerable use as a speculative asset.


    - **Money laundering**: NFTs, as with other blockchain securities and traditional
    art sales, can potentially be utilized for money laundering.


    ## How Is an NFT Different from Cryptocurrency?


    NFT stands for non-fungible token. It’s generally built using the same kind of
    programming as cryptocurrency, like `Bitcoin` or `Ethereum`, but that’s where
    the similarity ends.


    Cryptocurrencies are “fungible,” meaning they can be traded or exchanged for one
    another. They’re also equal in value. For example, one `Bitcoin` is always equal
    to another `Bitcoin`. Crypto’s fungibility makes it a trusted means of conducting
    transactions on the blockchain.


    NFTs are different. Each has a digital signature that makes it impossible for
    NFTs to be exchanged for or equal to one another (hence, non-fungible). One `NBA
    Top Shot` clip, for example, is not equal to another `NBA Top Shot` clip, simply
    because they’re both NFTs.


    ## History of NFTs


    The first known NFT, `Quantum`, was created by Kevin McCoy and Anil Dash in May
    2014, consisting of a video clip made by McCoy''s wife Jennifer. McCoy registered
    the video on the `Namecoin` blockchain and sold it to Dash for $4, during a live
    presentation for the Seven on Seven conference at the New Museum in New York City.
    McCoy and Dash referred to the technology as "monetized graphics". A non-fungible,
    tradable blockchain marker was explicitly linked to a work of art, via on-chain
    metadata (enabled by `Namecoin`). This is in contrast to the multi-unit, fungible,
    metadata-less "colored coins" of other blockchains.


    In October 2015, the first NFT project, `Etheria`, was launched and demonstrated
    at `DEVCON 1` in London, `Ethereum`''s first developer conference, three months
    after the launch of the `Ethereum` blockchain. Most of `Etheria`''s 457 purchasable
    and tradable hexagonal tiles went unsold for more than five years until March
    13, 2021, when renewed interest in NFTs sparked a buying frenzy. Within 24 hours,
    all tiles of the current version and a prior version, each hardcoded to `1 ETH`
    ($0.43 at the time of launch), were sold for a total of $1.4 million.


    The term "NFT" only gained currency with the `ERC-721` standard, first proposed
    in 2017 via the `Ethereum GitHub`, following the launch of various NFT projects
    that year. These include `Curio Cards`, `CryptoPunks` and `Decentraland` platform.
    The 2017 online game `CryptoKitties` was monetized by selling tradable cat NFTs,
    and its success brought some public attention to NFTs.


    The NFT market experienced rapid growth during 2020, with its value tripling to
    $250 million. In the early months of 2021, interest in NFTs increased after a
    number of high-profile sales and art auctions. In the first three months of 2021,
    more than $200 million were spent on NFTs.


    ## What is the Future of NFTs?


    The future of any blockchain experiment is unknown. However, experts predict that
    NFTs are here to stay and will continue to grow beyond the art and gaming realm,
    especially if crypto enthusiasts and mainstream investors continue investing money.


    The growth of NFT can also be attributed to its features that can represent proof
    of ownership, provide social status, grant exclusive access, manage licensing,
    and certify authenticity. It allows you ownership of your products the way `Bitcoin`
    enables you to be your own banker.


    # Blockchain based cryptocurrency – Bitcoin


    In this chapter, we will discuss `Bitcoin` and how it uses blockchain technology
    for distributed ledgers and to conduct transactions. We will start with `Bitcoin`
    history, and why it succeeded as a cryptocurrency. Then we will explore `Bitcoin`
    identity and its consensus protocol. We will gain insight of cryptographic hash
    function and `merkle root`, and how they make `Bitcoin` tamper-proof. We will
    learn about `Bitcoin` transaction process, and how `Bitcoin` codes are written
    via `Bitcoin scripts`. We will then gain an insight on `Bitcoin` users and their
    wallets. We will learn on the `Bitcoin` mining process. Finally, we will learn
    about the `Bitcoin` governance mechanisms.


    ## Bitcoin History


    The origins of `Bitcoin` can be traced back to the `Cypherpunk` movement of the
    1970s and 80s. In the 1970s people were living in an analog world, and encryption
    was primarily used for the military purposes. Very few people had computers, and
    someone could hardly imagine of a technology that would connect almost every human
    being on the planet – the internet.


    Two publications brought cryptography into the open, “Data Encryption Standard”
    published by the US Government, and “New Directions in Cryptography” white paper
    published by Dr. Whitfield Diffie and Dr. Martin Hellman, published in 1976.


    In the 1980s, Dr. David Chaum started writing on topics such as anonymous digital
    cash and pseudonymous reputation systems. This was the first step toward the digital
    currencies we see today.


    It wasn’t until 1992 that a group of cryptographers started meeting up on a regular
    basis to discuss their work and related ideas. Besides their regular meetings,
    they also started the `Cypherpunk` mailing list in which they discussed many ideas.
    One of the idea was protection of privacy using cryptography, which led to the
    birth of `Bitcoin`.


    The `Cypherpunk` manifesto stated that “Privacy is necessary for an open society
    in an electronic age. Privacy is not secrecy. A private matter is something one
    does not want the whole world to know, but a secret matter is something one does
    not want anybody to know. Privacy is the power to selectively reveal oneself to
    the world.”


    `Cypherpunks` were not the only ones concerned about central entities becoming
    immensely powerful by accumulating unimaginable amount of data from millions of
    users. There was another group call `crypto-anarchists` who were concerned about
    the big banks and the governments diminishing the autonomy of average citizens,
    as well as influencing users’ psychology in unimaginable ways. Before the banking
    revolution, cash was anonymous and purely physical. However, as the banks became
    digital, they were able to track accounts balances and transactions of their users.
    So both these groups envisioned a need for an anonymous digital currency, giving
    their users the power to selectively reveal themselves to the world.


    Several different companies and researchers attempted to invent a decentralized
    currency, however all of them failed, due to the inconsistencies with removal
    of centralization, like `double spending attack` – ‘an attack where a cryptocurrency
    can be used more than once, by altering the blockchain network and inserting a
    special one that allows user to reacquire cryptocurrency’.

