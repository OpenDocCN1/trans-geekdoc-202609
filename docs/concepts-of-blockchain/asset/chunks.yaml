    5. 所有账本副本均已更新 – 该区块通过我们用于交易时使用的相同的点对点通信传播到整个网络。当区块操作者收到新区块的副本时，他们将其添加到自己的分布式账本副本中。这确保了对等网络中的所有成员都对区块链分布式账本的当前状态达成一致。


    6. 用户收到交易完成通知 – 用户的钱包会监控包含与用户相关交易的新区块的创建。当收到包含用户操作的完成代码的区块时，将创建一个事件来通知用户操作已完成。当包含
    Alicia 向 Billy 转账比特币的区块被添加到区块链中时，系统将向相关钱包发送警报，确认交易已获接受并完成。


    # 区块链共识


    由于区块链信息存储在网络中每个人手中，因此需要一种共识来确保所有人对交易历史达成一致。所有用户不仅需要对任何交易更新达成一致，还需要对一个有效的交易更新达成一致，以确保网络不会获取受损坏的信息。


    共识机制使得区块链能够从由单一实体维护账本的中心化系统转向去中心化系统，在该系统中，信任不再依赖于单一实体，而是取决于所有实体以及它们的共同决定。区块链是一个分布式且去中心化的系统，这意味着它需要一种跟踪系统官方当前状态的方法。由于区块链可能包含财务交易和业务协议，所有参与方在协议条款上保持同步至关重要。


    正如 Demiro Massessi 在文章《区块链共识与容错概述》中所述的：“区块链被设计为一个共享的、同步的历史账本，这意味着在某个时间点需要对应该包含和不应该包含在官方记录中的做出最终决定。由于区块链是去中心化的，没有更高的权威机构可以盖章批准并定稿区块链区块的内容。比特币网络创建者
    Satoshi Nakamoto 发明的实现共识的方法是基于稀缺性的。以某种方式或方式，区块链共识算法归结为某种投票，用户拥有的票数数量与其控制的有限资源数量挂钩。根据供需经济学法则，收集足够的资产以获得控制份额将推高资产价格，以至于达到那种控制水平的成本变得昂贵到无法负担”。


    为了确保没有人重复花费同一枚比特币，Satoshi Nakamoto 为比特币网络创建了一种名为工作量证明（`PoW`）的共识算法。


    从那时起根据用例的需求，又发明了其他几种共识算法。这些包括`权益证明`（`PoS`）、委托权益证明、实用拜占庭容错和和逝时间证明。


    最常用的共识算法是`工作量证明`（`PoW`）和`权益证明`（`PoS`）。


    ## 工作量证明 (PoW)


    `工作量证明`（`PoW`）是指一种加密机制，该机制依赖于参与者能够解决复杂的计算问题以获得网络中更高的权益。PoW 本质上是参与者确定最有效区块的一种分布式方法。每个参与者都尝试寻找一个哈希值，该值是即将到来的交易区块的有效解决方案。找到要求的哈希值的获胜者将提议区块添加到链并获得奖励。


    ### 通过工作量证明 (PoW) 的比特币共识机制


    比特币共识算法最常见的定义是工作量证明（`PoW`），这是一种依赖于参与者解决加密谜题来验证新信息的共识机制。然而，PoW 是一个更大的共识算法的一部分，通常被称为“中本共识”。中本共识使比特币与此之前的数字货币实现方式区别开来。


    比特币使用 `Hashcash Proof-of-Work` 来实现共识，使用了哈希算法 `SHA-256`。这涉及找到一个值 `x`，当 `x` 使用该算法进行哈希时，找到了所需的值。这通常是一个迭代过程；在每一轮中，都会将随机数（一次性数字）添加到被哈希的字符串末尾，直到得到所需的值。一旦参与者成功找到
    `PoW` 的解决方案，他们就会将其区块广播到网络的其他部分，如果根据时间戳其中没有交易已经被花费，则该区块将获得批准。然后参与者将获得比特币奖励，以补偿他们为验证下一个交易区块而花费的算力。


    比特币的挖矿实际上是将一定数量的计算资源专门用于解决计算困难的问题和验证新区块。单个节点拥有的算力越强，找到正确值的概率就越大，从而解决与该区块相关的 `SHA-256`
    哈希。PoW 使比特币既是完全去中心化的，又是完全安全的。任何人都可以参与挖矿过程，而不需要事先拥有规定数量的比特币。事实上，在任何给定时间，下一次挖矿奖励的获胜者是谁完全未知，额外的算力仅有助于增加单个节点成功的概率。此外，挖矿过程还激励节点诚实行为，因为有与广播正确区块相关的奖励。这意味着为了接管网络，恶意攻击者必须控制网络中超过
    51%的哈希算力并阻止合法区块通过验证。这被称为“51%攻击”。由于比特币网络目前的规模，获取网络中现有超过 51%哈希算力的经济成本是巨大的，因此极其困难。


    中本共识的第二部分使比特币成为第一个可扩展的加密货币平台。中本共识非常强调长链，认为根据时间戳有效的长链是最合法的，因为它投入了大量的计算资源。这在一个原本无信任的系统中引入了信任，从而允许比特币网络在没有中心化权威的情况下运行。例如，如果一个参与者处于不活跃状态或新加入，他们只需接受当前的最长链作为网络之前发生情况的证明。他们不需要依赖第三方；而是从最长有效链开始构建，从而获得通过提交计算有效区块获得奖励的能力。事实上，加密货币社区所说的“长链规则”使比特币在以往
    PoW 数字货币失败的地方取得了成功。它让参与者对网络充满信心，并设定了一个标准，让矿工可以自由地加入和离开，而无需服从于权威。长链规则已被比特币之后的许多数字资产系统和区块链采用。


    ## 权益证明 (PoS)


