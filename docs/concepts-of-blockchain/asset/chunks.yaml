- fmt: '

    ## Time-locks


    * Absolute time-lock specify an absolute point in future when the particular transaction
    becomes valid. This is done using a timestamp or block height.

    * Relative time-lock specify a block depth, or the number of blocks built on the
    top of the current one.


    Time-locks can be transaction level or script level.


    * A transaction level time-lock can impose time-lock on the transaction itself.
    This time-lock ensures that the transaction cannot be include in a valid block
    until a particular time in future.

    * A script level time-lock can impose time-locks on specific UTXO and are specified
    using Bitcoin scripts. This UTXO level time-lock specifies that a UTXO cannot
    be spent until the specified time. This ensures that the sender cannot override
    the transaction by sending the UTXO to another address before the time-lock is
    unlocked.


    ## Bitcoin Network


    Bitcoin is structured as a peer-to-peer (P2P) network architecture on top of the
    internet, meaning that the computers that participate in the Bitcoin network are
    all equal, that there are no “special” nodes, and that all nodes share the burden
    of providing network services. The network nodes interconnect in a mesh network
    with a “flat” topology. There is no server, no centralized service, and no hierarchy
    within the network. Nodes in a peer-to-peer network both provide and consume services
    at the same time with reciprocity acting as the incentive for participation. Peer-to-peer
    networks are inherently resilient, decentralized, and open.


    The term “Bitcoin Network” refers to the collection of nodes running the Bitcoin
    P2P protocol. In addition to the Bitcoin P2P protocol, there are other protocols
    such as `Stratum19`, which are used for mining and mobile wallets. These additional
    protocols are provided by gateway routing servers that access the bitcoin network
    using the bitcoin P2P protocol, and then extend that network to nodes running
    other protocols. Extended Bitcoin Network” refers to the overall network that
    includes the Bitcoin P2P protocol, pool-mining protocols, the `Stratum` protocol,
    and any other related protocols connecting the components of the bitcoin system.


    Although nodes in the bitcoin P2P network are equal, they may take on different
    roles depending on the functionality they are supporting. A bitcoin node is a
    collection of functions: Network Routing, Maintaining Blockchain Database, Mining,
    and Managing Wallet Services. A Full Node contains all these functions, and can
    autonomously and authoritatively verify any transaction without external reference.
    Some nodes maintain only a subset of the blockchain and verify transactions using
    a method called ‘Simplified Payment Verification’ (SPV) or Lightweight Nodes.
    Mining Nodes compete to create new blocks by running specialized hardware to solve
    the proof-of-work algorithm. Some mining nodes are Full Nodes, maintaining a full
    copy of the blockchain, while others are SPV participating in pool mining and
    depending on a pool server to maintain a full node.


    In addition to the main node types on the bitcoin P2P protocol, there are servers
    and nodes running other protocols, such as specialized mining pool protocols and
    lightweight client-access protocols.


    ![](Images/image00252.jpeg)


    ### Bitcoin Transfer via Bitcoin Network

    Source - Wikipedia


    ## Types of Bitcoin users


    There is plethora of different types of Bitcoin users, depending on how they interface
    with the Bitcoin network. The user experience in the Bitcoin network varies greatly
    depending if the user is a light user, owning a full node, solo miner, or running
    a mining farm. Not every user need to have the entire blockchain.


    There is a total of four functions in Bitcoin – Mining, Network routing, Maintaining
    blockchain, and wallet management, and the distinction between Bitcoin users is
    through these four functionalities.


    There are four type of Bitcoin users:


    * Light User – This type of user is the most common Bitcoin user. His focus on
    bitcoin’s potential as an investment, or a currency. He doesn’t need the entire
    copy of the blockchain. He primarily uses the Network Routing Node to send and
    receive Bitcoins with the rest of the network, and wallet functionality to help
    manage his keys.

    * Miner – This type of user is a computer programmer, and uses mining functionality
    and copy of the full Blockchain for solving hash puzzles in P-o-W protocol, and
    Network Routing Node functionality to broadcast to the entire network.

    * Full Node Owner – This user is responsible for owning the Bitcoin node, and
    uses Blockchain and Network Routing Node functionalities of the Bitcoin to validate
    transactions and check any anomaly in the network.

    * Running a mining farm – Such users are core to Bitcoin and use all the functionalities
    of the Bitcoin network.


    ## Bitcoin Wallets


    A Bitcoin wallet stores the information necessary to transact bitcoins. A Bitcoin
    wallet is defined as “something that stores the digital credentials for your bitcoin
    holdings" and allows you to access and spend them. Hence, it is a method of storing
    and accessing your private key, which then allows you to transact the corresponding
    Bitcoin. The primary function of Bitcoin wallet is to keep track of your identity.
    Bitcoin wallet software stores all relevant information about the blockchain.


    The first wallet program, simply named `Bitcoin`, and sometimes referred to as
    the `Satoshi client`, was released in 2009 by Satoshi Nakamoto as open-source
    software. After the release of version `0.9`, the software bundle was renamed
    `Bitcoin Core` to distinguish itself from the underlying network. `Bitcoin Core`
    is, perhaps, the best known implementation or client. Alternative clients exist,
    such as `Bitcoin XT`, `Bitcoin Unlimited`, and `Parity Bitcoin`.


    Bitcoin wallets are classified into 2 key categories based on their connectivity
    to the internet. Hot wallets are connected to the internet and Cold wallets are
    not.


    ### Hot Wallets


    Hot wallets are the Bitcoin wallets which are connected to the internet. They
    are connected to the Bitcoin network via Full Client or Lightweight Client.


    Some examples of Hot wallets are smartphone apps like `Mycelium` / `AirBitz`,
    online web wallets like `eToro.com` / `coinbase.com` / `blockchain.info`


    * Full Clients verify transactions directly by downloading a full copy of the
    blockchain. They are the most secure and reliable way of using the network, as
    trust in external parties is not required. Full clients check the validity of
    mined blocks, preventing them from transacting on a chain that breaks or alters
    network rules. However, because of the enormous size and complexity, downloading
    and verifying the entire blockchain is not suitable for all computing devices.

    * Lightweight Clients consult full nodes to send and receive transactions without
    requiring a local copy of the entire blockchain. This makes them much faster to
    set up and allows them to be used on low-power, low-bandwidth devices as smartphones.
    When using a Lightweight wallet, however, the user must trust full nodes, as it
    can report faulty values back to the user. Lightweight clients follow the longest
    blockchain and do not ensure it is valid, requiring trust in full nodes.

    * 3rd party internet services called online wallets or web wallets offer similar
    functionality but may be easier to use. The credentials to access funds are stored
    with the online wallet provider rather than on the user''s hardware. The user
    must have complete trust in the online wallet provider. A malicious provider or
    a breach in server security may cause entrusted bitcoins to be stolen, for example,
    the `Mt. Gox` security breach occurred in 2011.


    ### Cold Wallets


    Wallet software is targeted by hackers because of the lucrative potential for
    stealing bitcoins. A technique called "Cold Storage" keeps private keys out of
    reach of hackers; this is accomplished by always keeping private keys offline,
    by generating them on a device that is not connected to the internet.

