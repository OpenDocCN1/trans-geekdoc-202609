  trans: "\n\n以太坊通过构建一个本质上终极抽象基础层来实现这一点：一个内置图灵完备编程语言的区块链，允许任何人编写智能合约和去中心化应用，并让他们为所有权、交易格式和状态转换函数创建自己的任意规则。\n\
    \nNamecoin 的精简版本可以用两行代码编写，而像货币和声誉系统等协议可以在二十行代码内构建。\n\n智能合约是包含价值的加密“箱子”，只有在满足特定条件时才会解锁价值。智能合约也可以构建在平台之上，由于增加了图灵完备性、价值感知、区块链感知和状态能力，其提供的功能远超比特币脚本（Bitcoin\
    \ scripting）所提供的功能。\n\n## 以太坊账户\n\n在以太坊中，状态由称为“账户”的对象组成，每个账户都有一个 20 字节的地址，且状态转换是账户之间价值和信息的直接传输。\n\
    \n一个以太坊账户包含四个字段：\n\n*   `nonce`，一个计数器，用于确保每个交易只被处理一次\n*   账户当前的以太余额\n*   账户的合约代码（如果存在）\n\
    *   账户的存储（默认为空）\n\n通常，账户有两种类型：由私钥控制的外部拥有账户（EOA）和由其合约代码控制的合约账户（CA）。\n\n*   **外部拥有账户**\
    \ – 如其名，由以太坊网络之外的实体拥有。外部拥有账户使用一个地址让人们向其发送以太坊，并作为以太坊余额。此类账户可以发送交易来转移以太坊或触发合约代码。外部拥有账户没有代码，可以通过创建并签名交易从外部拥有账户发送消息\n\
    *   **合约账户** – 它们由智能合约拥有。它们包含一个地址、关联合约代码以及持久化存储。在合约账户中，每当合约账户接收到消息，其代码就会激活，允许它读写内部存储，并转而发送其他消息或创建合约。\n\
    \n注意，以太坊中的“合约”不应被视为应当被“履行”或“遵守”的东西；相反，它们更像是运行在以太坊执行环境中的“自主代理”，当被消息或交易“点拨”时始终执行一段特定的代码，并直接控制自己的以太坊余额和用于跟踪持久化变量的键值存储器。\n\
    \n## 交易\n\n以太坊中的“交易”（transaction）一词用于指代签名的数据包，其中存储了从外部拥有账户发送的消息。交易包含：\n\n*   消息的接收者\n\
    *   标识发送者的签名\n*   从发送者到接收者转移的以太坊数量\n*   一个可选的数据字段\n*   `STARTGAS` 值，代表交易执行可以采取的最大计算步骤数\n\
    *   `GASPRICE` 值，代表发送者为每个计算步骤支付的费用\n\n前三个是任何加密货币都预期的标准字段。数据字段默认没有功能，但虚拟机有一个 `OPCODE`，合约可以通过它访问数据；例如，如果一个合约充当链上域名注册服务运行，那么它可能希望将传递给它的数据解释为包含两个“字段”，第一个字段是待注册的域名，第二个字段是用于注册该域名的\
    \ IP 地址。合约将从消息数据中读取这些值并恰当地将它们存放在存储中。\n\n`STARTGAS` 和 `GASPRICE` 字段对于以太坊的抗拒绝服务（anti-DoS）模型至关重要。为了防止代码中意外或恶意的无限循环或其他计算浪费，每笔交易都被要求设置其代码执行可以使用的计算步骤限制。计算的基本单位是“gas”；通常一个计算步骤消耗\
    \ 1 个 `gas`，但某些操作因为计算开销更高，或者增加了必须作为状态部分存储的数据量，会消耗更高数量的 gas。\n\n此外，交易数据中的每个字节还有\
    \ 5 gas 的费用。该费用系统的意图是要求攻击者为其消耗的每种资源（包括计算、带宽和存储）支付比例相应的费用；因此，任何导致网络消耗某类资源增加较多的交易，其\
    \ gas 费用必须与增量大致成正比。\n\n## 消息\n\n合约有能力向其他合约发送“消息”的能力。消息是虚拟对象，它们从不被序列化，仅存在于以太坊执行环境中。一条消息包含：\n\
    \n*   消息的发送者（隐式）\n*   消息的接收者\n*   随消息一同转移的以太坊数量\n*   一个可选的数据字段\n*   `STARTGAS`\
    \ 值\n\n本质上，消息类似于交易，区别在于它是由合约而非外部参与者产生的。当一个正在执行代码的合约执行 `CALL OPCODE` 时，就会产生并执行一条消息。与交易一样，消息会导致接收者账户运行其代码。因此，合约可以像外部参与者一样与其他合约建立关系。\n\
    \n注意，交易或合约分配的 gas 额度适用于该交易及所有子执行消耗的总 gas。例如，如果外部参与者 A 向 B 发送一个带有 1000 gas 的交易，B\
    \ 在向 C 发送消息之前消耗了 600 gas，而 C 的内部执行在返回之前消耗了 300 gas，那么 B 在 gas 耗尽之前还可以再花费 100 gas。\n\
    \n## 以太坊状态转换函数\n\n以太坊状态转换函数 `APPLY(S,TX) -> S'` 可以按步骤定义：\n\n1.  检查交易格式是否正确（即值数量正确）、签名是否有效以及\
    \ nonce 是否匹配账户中的 nonce。如果不符合，返回错误。\n2.  计算交易费用为 `STARTGAS * GASPRICE`，并根据签名确定发送地址。从发送者账户扣除费用并增加发送者的\
    \ nonce。如果余额不足，返回错误。\n3.  初始化 `GAS = STARTGAS`，并扣除一定数量的 gas 以支付交易字节的费用。\n4.  将交易价值从发送者账户转移到接收者账户。如果接收账户不存在，则创建它。如果接收账户是合约，则运行合约代码直到完成或\
    \ gas 耗尽。\n5.  如果由于发送者资金不足导致价值转移失败，或代码执行耗尽 gas，回滚除费用外的所有状态更改，并将费用加入矿工账户。\n6. \
    \ 否则，将剩余 gas 的费用退还给发送者，并将消耗 gas 产生的费用发送给矿工。\n\n例如，假设合约代码为：\n\n```\nif !self.storage[calldataload(0)]:\n\
    \    self.storage[calldataload(0)] = calldataload(32)\n```\n\n假设合约存储初始为空，并发送了一笔带有\
    \ 10 以太价值、2000 gas、0.001 以太 GASPRICE 以及 64 字节数据的交易，其中 0-31 字节代表数字 2，32-63 字节代表字符串\
    \ CHARLIE。情况下状态转换函数的流程如下：\n\n1.  检查交易是否有效且格式正确。\n2.  检查交易发送者是否有足够的 2000 * 0.001\
    \ = 2 以太坊。如果是，则从发送者账户扣除 2 以太坊。\n\n"
- fmt: '

    3. Initialize `gas = 2000`; assuming the transaction is 170 bytes long and the
    byte-fee is 5, subtract 850 so that there is 1150 gas left.


    4. Subtract 10 more ether from the sender''s account, and add it to the contract''s
    account.


    5. Run the code. In this case, this is simple: it checks if the contract''s storage
    at index 2 is used, notices that it is not, and so it sets the storage at index
    2 to the value `CHARLIE`. Suppose this takes 187 gas, so the remaining amount
    of gas is `1150 - 187 = 963`


    6. Add `963 * 0.001 = 0.963` ether back to the sender''s account, and return the
    resulting state.


    ![Ether state transition](Images/image00260.jpeg)


    Ethereum State Transition Function example; Source – Ethereum.org/whitepaper/


    If there was no contract at the receiving end of the transaction, then the total
    transaction fee would simply be equal to the provided `GASPRICE` multiplied by
    the length of the transaction in bytes, and the data sent alongside the transaction
    would be irrelevant.


    The messages work equivalently to transactions in terms of reverts: if a message
    execution runs out of gas, then that message''s execution, and all other executions
    triggered by that execution, revert, but parent executions do not need to revert.
    This means that it is "safe" for a contract to call another contract, as if `A`
    calls `B` with `G` gas then `A`''s execution is guaranteed to lose at most `G`
    gas.


    Note that there is an `OPCODE`, `CREATE`, that creates a contract; its execution
    mechanics are generally similar to `CALL`, with the exception that the output
    of the execution determines the code of a newly created contract.


    ## Code Execution


    The code in Ethereum contracts is written in a low-level, stack-based bytecode
    language, referred to as "Ethereum virtual machine code" or "EVM code". The code
    consists of a series of bytes, where each byte represents an operation. In general,
    code execution is an infinite loop that consists of repeatedly carrying out the
    operation at the current program counter (which begins at zero) and then incrementing
    the program counter by one, until the end of the code is reached or an error or
    `STOP` or `RETURN` instruction is detected. The operations have access to three
    types of space in which to store data:


    *   The stack, a last-in-first-out (LIFO) container to which values can be pushed
    and popped

    *   Memory, an infinitely expandable byte array

    *   The contract''s long-term storage, a key/value store. Unlike stack and memory,
    which reset after computation ends, storage persists for the long term.


    The code can also access the value, sender and data of the incoming message, as
    well as block header data, and the code can also return a byte array of data as
    an output.


    ## Ethereum Mining


    ![Ethereum apply block diagram](Images/image00261.jpeg)

    Ethereum apply block diagram; Source – Ethereum.org/whitepaper/


    The Ethereum blockchain is in many ways similar to the Bitcoin blockchain, although
    it does have some differences. The main difference between Ethereum and Bitcoin
    with regard to the blockchain architecture is that, unlike Bitcoin, Ethereum blocks
    contain a copy of both the transaction list and the most recent state. Aside from
    that, two other values, the block number and the difficulty, are also stored in
    the block. The basic block validation algorithm in Ethereum is as follows:


    1.  Check if the previous block referenced exists and is valid.

    2.  Check that the timestamp of the block is greater than that of the referenced
    previous block and less than 15 minutes into the future.

    3.  Check that the block number, difficulty, transaction root, uncle root and
    gas limit are valid.

    4.  Check that the Proof-of-Work on the block is valid.

    5.  Let `S[0]` be the state at the end of the previous block.

    6.  Let `TX` be the block''s transaction list, with `n` transactions. For all
    `i` in `0...n-1`, set `S[i+1] = APPLY(S[i],TX[i])`. If any applications returns
    an error, or if the total gas consumed in the block up to this point exceeds the
    `GASLIMIT`, return an error.

    7.  Let `S_FINAL` be `S[n]`, but adding the block reward paid to the miner.

    8.  Check if the Merkle tree root of the state `S_FINAL` is equal to the final
    state root provided in the block header. If it is, the block is valid; otherwise,
    it is not valid.


    The state is stored in the tree structure, and after every block only a small
    part of the tree needs to be changed. Thus, in general, between two adjacent blocks
    most of the tree should be the same, and therefore the data can be stored once
    and referenced twice using pointers (ie. hashes of subtrees).


    A special kind of tree known as a "Patricia tree" is used to accomplish this,
    including a modification to the Merkle tree concept that allows for nodes to be
    inserted and deleted, and not just changed, efficiently. Additionally, because
    all the state information is part of the last block, there is no need to store
    the entire blockchain history - a strategy which, if it could be applied to Bitcoin,
    can be calculated to provide 5-20x savings in space.


    A commonly asked question is "where" contract code is executed, in terms of physical
    hardware. This has a simple answer: the process of executing contract code is
    part of the definition of the state transition function, which is part of the
    block validation algorithm, so if a transaction is added into block `B` the code
    execution spawned by that transaction will be executed.


    ## Ethash


    Ethash is the planned Proof-of-Work (`PoW`) algorithm for Ethereum. The general
    route that the algorithm takes is follows:


    1.  There exists a seed which can be computed for each block by scanning through
    the block headers up until that point.

    2.  From the seed, one can compute a 16 MB pseudorandom cache. Light clients store
    the cache.

    3.  From the cache, we can generate a 1 GB dataset, with the property that each
    item in the dataset depends on only a small number of items from the cache. Full
    clients and miners store the dataset. The dataset grows linearly with time.

    4.  Mining involves grabbing random slices of the dataset and hashing them together.
    Verification can be done with low memory using the cache to regenerate the specific
    pieces of the dataset you need, so you only need to store the cache.


    The large dataset is updated once every 3000 blocks, so the vast majority of a
    miner’s effort will be reading the dataset, not making changes to it. Ethash is
    memory bound and claims to be ASIC resistant.


    ## Ethereum Virtual Machine (EVM)


    Ethereum smart contracts are generally written in high level programming languages.
    The most popular is `Solidity`, which is a mix between `C++` and `JavaScript`.
    There is also `Vyper`, which is a newer language currently under development.
    Smart contract written in these high-level programming languages have to be compile
    down to the Ethereum Virtual Machine (`EVM`) code.


    ![](Images/image00262.gif)


    Hence, we go from a higher level, human readable language, and compile that down
    to an `EVM` code, which is a lower level, simpler language, and much easier for
    a machine to understand and execute.


    After this code is compiled into `EVM` code, every node in the Ethereum network
    executes it. All the nodes execute the code in the same way, so long as they have
    an up-to-date version of the `EVM` software. Nodes them come to consensus on the
    new system state, by executing the Proof-of-Work protocol. By tying the voting
    power to the computational power via PoW, Sybil attacks (an attack on a computer
    network in which an attacker subverts the service''s reputation system by creating
    a large number of pseudonymous identities and uses them to gain a disproportionately
    large influence) can be prevented. In Ethereum, block creation time is 15 seconds
    long, compared to 10 minutes in Bitcoin. This allows the execution of smart contracts
    to be done and finalized quickly.


    EVM Execution

