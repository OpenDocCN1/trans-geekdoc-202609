    \ network also makes it also possible to create and run decentralized applications\
    \ and execute “peer-to-peer” Smart Contracts. \n\nEthereum platform allows anyone\
    \ to deploy permanent and immutable decentralized applications onto it, with which\
    \ users can interact. \n\n*   This enables people to deploy Decentralized finance\
    \ (DeFi) applications onto the Ethereum platform and provide variety of financial\
    \ services without the need for intermediaries like brokerages, exchanges, or\
