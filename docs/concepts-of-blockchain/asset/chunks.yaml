  trans: '

    通俗地说，这些属性意味着恶意攻击者无法在不改变摘要的情况下替换或修改输入数据。因此，如果两个字符串具有相同的摘要，你就可以非常有心地它们是完全相同的。抗原像攻击性防止攻击者构造出一个与他们无法控制的文档具有相同哈希值的文档。抗碰撞性则防止攻击者创建两个具有相同哈希值的不同文档。


    加密哈希的潜在用途的一个示例如下：假设你交给我一个困难的计算问题由我解决，并声称你已经解决了它。我想解决这个问题，但我想确保你确实也解决了这个问题。因此，你写下你的解决方案，计算它的哈希值，并告诉我这个哈希值（同时对解决方案保密）。假设我花了一周时间解决了这个问题。现在你就可以通过公开解决方案来证明你更早解决了它，我可以对该解决方案进行哈希计算，并用你之前给我的哈希值进行验证。


    安全哈希的一个重要应用是消息完整性的验证。通过比较传输前后计算的消息明文（消息的哈希摘要），可以确定消息或文件是否在传输过程中发生了任何变化。使用加密哈希和信任链可以检测对文件的恶意篡改。几乎所有的数字签名方案都需要对消息计算加密哈希。这使得签名计算可以在相对较小的、静态大小的哈希摘要上进行。如果给定的签名和对消息重新计算的哈希摘要使签名验证成功，则该消息被认为是真实的。因此，加密哈希的消息完整性属性被用于创建安全高效的数字签名方案。


    比特币使用哈希函数 `Security Hash Algorithm-256 (SHA-256)` 来验证其网络中的工作量证明（PoW）协议。`SHA-256`
    最初由美国国家安全局（NSA）设计。`SHA-256` 是 `SHA2` 加密哈希函数家族的一。它接受小于 `2⁶⁴` 位的输入，并产生 `256` 位的固定大小输出。比特币在某些情况下使用
    `SHA-256d`，这意味着连续使用了两次 `SHA-256`，一次针对原始待哈希消息，再次针对 `1st` 哈希的输出。


    该系统使用部分哈希反转来证明工作的完成，从而解锁比特币的挖掘奖励，并作为 Hash-cash 中发送电子邮件的一种诚意代币。发送者需要找到一个哈希值以特定数量零位开头的消息。发送者找到有效消息所需的平均工作量与哈希值中所需的零位数量呈指数级关系，而接收者可以通过执行单个哈希函数来验证消息的有效性。


    ## 梅尔克树 (Merkle Trees)


    一种数据存储技术，通过压缩数据来存储区块链，并内置防篡改组件。梅尔克树基于哈希原理，每个哈希都成为下一个哈希的一部分，从而开发出抗篡改的数据存储模型。


    在计算机科学术语中，树是一种具有根节点和子节点的数据结构，这些子节点也可以其他树的根。二叉树是每个节点都有两个子节点的树，如下所示。


    ![](img/image00240.gif)


    `Merkle Tree` 是 `Binary Tree` 的一种非常特殊的版本，其中每个“孩子”（节点）都标记有数据块的加密哈希，而每个不是“孩子”的节点都标记有其子节点标签的加密哈希。哈希树允许对大型数据结构的内容进行高效且安全的验证。哈希树的概念以
    Ralph Merkle 的名字命名，他在 1979 年获得了该专利。


    一个树要成为一个 `Merkle Tree`，需要满足以下条件：


    * 最底层的子节点数量是 2 的幂

    * 最低层由汇总信息的哈希组成


    `Merkle Tree` 的构建由经过验证的数据区块（Data Blocks）组成。每个区块都经过哈希处理以得到一层哈希。然后将 `2` 个区块配对并进行哈希，形成一个数量减半的新层。这个过程一直持续，直到顶部只剩下一个哈希。顶部的哈希被称为
    `Merkle Root`（梅尔克根）。通过这种方式，在提交 `Merkle Root` 后，可以检测到任何交易更改。


    ![](img/image00241.gif)


    假设 `Block 3` 被更改，那么它的哈希值也会发生改变。由于由于，上面的哈希值也会改变，一直传播到 `Merkle Root`。因此，如果任何交易被更改，相应的
    `Merkle Root` 也会受到影响。


    我们只需要每一层的一条信息就可以验证任何交易。例如，我们可以通过 `Hash 0` 验证 `Block 1`。随着树的变得越来越大，这使得网络变得越来越高效。


    如果 `Merkle Root` 意外被篡改，它会改变区块头。这反过来会改变下一个区块的 `previous block hash`（上一个区块哈希），这将影响后续所有的区块哈希。网络的其他部分将拒绝该区块链提出的历史，因为它们不会同意。


    ## 去中介化效应 (Disintermediation Effect)


    现在我们已经理解了账本和加密学如何协同工作创建一个信任层，让我们讨论区块链如何具有强大的去中介化效应。


    开发者可以在区块链上创建分布式账本，并使用加密学为人们在该账本上提供安全空间，使人们能够拥有自己的数据。你可能会问——“这与传统技术有什么不同？”今天，机构使用
    `/ store / exchange / sell` 我们的数据。区块链真正赋予了用户数据所有权，他们可以只分享自己想要的信息。它还允许用户进行点对点交易。例如，假设你去餐厅用餐并用信用卡支付，你并没有直接给餐厅；相反，你在银行的数据库记录被扣款，餐厅的银行账户记录被记入。在这里，数据库中的价值和数据属于中介，而不是你或餐厅。你依赖信用卡公司和银行来保障并验证交易，这使得权力转移给了这些中介。但在区块链世界中，每个个人都有自己的账本记录以及访问它的安全密钥，从而消除了对中介的需求。因此，交易简单地从你的记录中扣款，并直接记入餐厅的记录。区块链让你有权控制不仅是金融交易的内容，例如——智能合约。而且通过区块链，你可以决定谁可以访问这些记录。


    在之前的章节中，我们讨论了协作和加密学如何建立信任。现在，让我们检查点对点交易如何创建透明度，从而导致了区块链的另一个信任层，并能够遏制腐败以及优化成本。

    '
- fmt: '

    With blockchain, these malicious actors would have to identify and target numerous
    points of failure until they control more than 51% of the network, which is known
    as consensus. It is nearly an insurmountable task.


    Centralized databases need to constantly update and synchronize data, leading
    to high costs and vulnerability to bad actors. Hence, blockchain creates trust
    and offers financial benefits through transparency, immutability, and accessibility
    through ownership.


    ## Transparency


    The blockchain is designed such that its entire history is visible and unchangeable.
    Transactions in blockchain cannot be modified after creation, and their complete
    history is publicly visible. This means that the blockchain is a completely transparent
    data structure with a useful property that the integrity of blockchain can easily
    be verified by any user.


    One of the big benefits of blockchain, public or private, is `transparency`. In
    a public blockchain like `Bitcoin` or `Ethereum`, because they are anonymous and
    there in in no concept of identity, there is no way of treating users differently.
    Hence, the data on a public blockchain is transparent and visible to all the participants.
    It adds a lot of value from the perspective of exchanging currency, because as
    long as the anonymity of the participants is protected, anybody is able to validate
    the details of any transaction on a ledger that is immutable, permanent, cannot
    changed, and offers a high degree of trust. This also has a lot of potential use
    cases for public blockchain like voting, voter registration and tracking election
    results. On public blockchains, there is another kind of transparency, `full transparency`
    into the smart contracts that execute on a blockchain. These smart contracts have
    the potential of working with other people’s money, and if you are going to entrust
    your money into someone else’s smart contract, you should have the ability to
    review the source code of that smart contract, to ensure that it is written fair,
    there are no security vulnerabilities, and that it does what it claims to do.


    On the private blockchain, what we have is `permissioning`, and we can control
    how much data to share. We still have a lot of benefits of being able to share
    data in a shared infrastructure that a private blockchain creates. There are a
    lot of business networks and value chain relationships where the participants
    would be able to share more data and more information with consumers about business
    processes and service delivery. While technically conventional technology may
    be able to address these concerns, it is often seen that people are not able to
    come to consensus on questions of who owns the platform, who builds the platform,
    and who maintains the platform. If the participants leave the ecosystem, do they
    take all or part of the platform with them. Using private blockchain solutions
    like `Hyperledger`, many of these concerns can be alleviated and a truly shared
    technical infrastructure between organizations is enabled. This allows participants
    to track data as well as share data about creation, consumption and delivery of
    goods. It is estimated that over 1/3 of the food produced is wasted, as there
    is no clarity into its supply chain. For example, if a meat gets recalled due
    to contamination, a huge amount of perfectly good meat is discarded. Whereas if
    we had a greater visibility into where the product originated and how it went
    from production to purchase, then more accurate recalls can be enabled which will
    help reduce waste. Similarly if you are manufacturing and distributing clothing,
    and can demonstrate to the users that all clothing was sourced from places with
    fair labor practices, consumer will have more trust on your brand. So, these kind
    of transparency solutions are one of the biggest benefits of blockchain and one
    of the areas being most explored, because right now there are a lot of consumers
    who would want more visibility into the products and service the.


    ## Immutability


    One of the big benefits of blockchain is `immutability`. In a traditional database,
    we can create, edit, and delete. However in blockchain, there are only 2 possible
    operations: create a new record, and read existing. This immutability is what
    make blockchain a secure and trustless solution, meaning that I do not have to
    trust anybody that I am interacting with.


    The way immutability work in the blockchain is very inefficient. We are asking
    a large number of nodes on the network to perform exactly the same operation as
    every other node, resulting in duplication of work over and again. The reason
    to do this is, because it ensures that the only way to change data on the blockchain
    is by changing that data on 51% or more of the nodes. One important point to note
    is that blockchain does not do anything to validate that the information written
    on it is correct. It only validates that the information has not changes since
    it was originally written.


    The immutability that blockchain provides is that data has not changed since it
    was originally written. Another part of this immutability is cryptographic hashing,
    and the way all the blocks are chained together. The blockchain is designed such
    that immutability is cumulative; each node is linked to every other node, creating
    a cohesive whole that becomes more difficult to tamper or alter. If I ever go
    back and try to change any information or prior transaction on the blockchain,
    I would break the chain in a very obvious way that anyone would immediately spot
    that data has been altered on the blockchain.


    *   At the bottom level, transactions are digitally signed by their creators.
    An attacker cannot forge a transaction unless they steal a private key

    *   A block structure is predefined. Attackers cannot modify it

    *   Each block includes the hash of the previous block, creating a chain between
    each block in the blockchain, which will break if tampered

    *   Each block is digitally signed by its creator. The creator is selected through
    blockchain consensus protocol, making it difficult for an attacker to be a legitimate
    creator


    # Blockchain Functions


    In this chapter, we will focus on the blockchain functions. First, we will discuss
    smart contracts, how blockchain have the ability to store and run applications
    that can execute the terms of an agreement. These digital agreements stored and
    executed on the blockchains remove intermediaries and ambiguity, thereby reducing
    conflicts.


    We will discuss how blockchain secure information and how the techniques differ
    from the traditional database security. Next, we will discuss different types
    of blockchains (public, private, and hybrid) and design principles for blockchain
    development. We will examine steps in a basic blockchain transaction from start
    to finish.

    '
