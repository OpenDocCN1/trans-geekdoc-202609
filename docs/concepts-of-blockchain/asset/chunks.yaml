    假设你向朋友转了 5 个比特币，这笔交易的历史需要存储在网络中，以确认你和朋友目前拥有的比特币数量，并验证未来的交易。这些信息保存在比特币的分布式数据库——`Blockchain`中。比特币区块链是以一系列区块的形式实现的，每个区块包含前一个区块的哈希值，直到链中的原始区块。运行比特币软件的通信节点网络维护着区块链。节点中的每个人都拥有账本，并且对该交易的有效性拥有与网络其他人相同的投票权。一旦你向朋友转了
    5 个比特币，网络节点会对这笔交易进行验证，并将此交易添加到它们的账本副本中。然后它们将这些账本更新广播到其他节点。在平均每 10 分钟的时间间隔内，会创建一个新的被接受交易组，称为`block`，添加到区块链中并快速发布到所有节点，无需中央监督。通过将数据分组为区块，网络就不会因为每笔交易后都更新账本而产生压力。每个区块都是一次更新，区块链代表一段历史。这个过程有助于识别不同版本数据库之间的差异，因为每个节点都可以验证在任何时间账本中实际发生了什么。由于每个区块都是基于前一个区块构建的，它包含了前一个区块的信息。如果任何区块被篡改，该区块以及所有未来区块的信息都会发生变化。这使得篡改变得显而易见，因为篡改过去的交易会导致任何回溯到它的未来区块失效。


    在比特币中，每笔交易都是之前交易的输出，并输入新的交易。交易包含未花费资金所有者的签名。这些未花费的交易被称为`UTXOs`。那么你是如何花费你的比特币或`UTXOs`的呢？例如，如果你给我
    1 个比特币，那么在那笔交易中会编码为只有通过公钥和签名才能兑换那个`UTXO` 的金额。


    在比特币中，一笔交易有 3 个主要部分：


    - `Metadata` – 包含一些管理数据、唯一的交易 ID、`lock-time` 和 `block size`

    - `Input` – 包含之前创建的 `UTXOs` 列表，以及我有权兑换这笔钱的证明

    - `Output` – 包含将发送到新地址的新的 `UTXOs` 列表。这个新地址是一个`Bitcoin script`，它锁定交易，并使其仅由我在此交易中指定的特定证明进行兑换。


