    区块链平台由各种组件组成，使企业能够根据不同的需求选择合适的组件。


    然而，在评估区块链平台和组件时，检查以下四个关键特征是非常有用的：


    - **公共（开放）或私有（封闭）平台** – 平台是开放的（即公共区块链）还是封闭的（即私有区块链），以及这如何影响速度和安全性。任何人都可以加入公共区块链，这使得像农户这样的小企业用户能够更容易搭建。缺点是公共区块链的速度不够够快。此外，私有平台为机构提供了更高的数据安全性。许多区块链代码库可以被修改为开放或封闭。

    - **共识机制** – 平台是否利用`工作量证明 (PoW)`、`权益证明 (PoS)` 或拜占庭容错作为其共识机制。`工作量证明` 是 `Bitcoin`
    和 `Ethereum` 使用的旧机制，但与`权益证明` 相比，它的速度较慢；后者较新且经过验证较少，但速度更快、更高效。

    - **账本技术及其如何记录交易** – 这涉及到区块链如何跟踪信息。流行的方法包括账户模型和 `UTXO`。账户模型记录余额，而 `UTXO` 模型类似于钱包中带有序列号的现金。账户模型用于区块链平台
    `Ethereum`、`Stellar`、`Tron` 和 `EOSIO`。`IBM Blockchain`、`Hyperledger Fabric` 和
    `Hyperledger Sawtooth` 则使用 `UTXO`。

    - **编程语言和函数** – 用于在区块链上捕捉业务逻辑的智能合约函数。流行的编程语言包括 `Ethereum` 区块链的 `Ethereum Solidity`、`IBM`
    的 `WebAssembly` 语言以及数字资产建模语言。


    最流行的区块链平台如下：


    ### 1. Ethereum

    `Ethereum` 于 2013 年推出，是最古老且最成熟的区块链平台之一，它为开发者提供了一个开源的分布式计算平台，开发者可以在那里发现区块链的所有优势。`Ethereum`
    使用点对点的方法，用户可以编写代码来控制数字价值，这些代码完全按照程序设定运行，并且可以在世界上任何地方访问。


    它提供了一个真正的去中心化区块链，可以与 `Bitcoin` 区块网络相比。它通过支持智能合约实现了真正的去中心化。除了作为支撑企业应用的区块链平台外，它自己还有一种名为
    `Ether` 的加密货币。


    `Ethereum` 平台已被在 `Ethereum` 网络上构建去中心化应用（或 `dApps`）的技术人员广泛采用。例如，有很多用于非同质化标记（`NFTs`）的平台和交易所——一种可以在区块链上交易的数字资产。它拥有一个成熟的工具生态系统，可以使用
    `Solidity` 编程环境编写智能合约，该环境运行在以太坊虚拟机上。


    然而，与其他平台相比，它的主要缺点包括处理时间慢和交易处理成本较高。其他区块链网络可以比 `Ethereum` 更快且更便宜地处理交易，尽管许多观察者预计在
    `Ethereum` 迁移到 `权益证明` 共识机制并采用更高效的安全机制后，这种情况将发生变化。


    ### 2. IBM Blockchain

    `IBM Blockchain` 是一个私有的去中心化区块链网络，在风险意识较低的企业客户中最为成功。他认为最大的机会在于利用它连接到企业云和遗留技术，这比在其他去中心化网络中更加无缝。


    `IBM Blockchain` 开发者工具的设计灵活、功能强大且可定制。IBM 还投资创建了用户友好的界面，以简化关键任务，如设置、测试和快速部署智能合约。


    `IBM blockchain` 平台在金融服务、银行以及供应链领域得到了显著采用。成功的区块链应用示例包括 `IBM Food Trust`，它已完成超过
    1800 万次交易，涉及 17000 多种产品；以及泰国的 `区块链社区倡议`，它为 22 家泰国银行提供支付义务和企业拍卖等服务支持。


    ### 3. Hyperledger Fabric

    `Hyperledger Fabric` 是由 `IBM` 和 Linux 基金会倡导的一组帮助创建区块链应用的工具集。它从底层开始就为企业分布式账本用途而构建。它拥有丰富的组件生态系统，可以插入模块化架构中。它在封闭区块链部署中运行良好，可以提高安全速度。它还支持开放的智能合约模型，可以支持各种数据模型，例如账户和未花费交易输出（或
    `UTXO` 模型）。


    `Hyperledger Fabric` 还可以通过在通道中隔离交易或在私有数据集合中根据需要共享私有数据来提高数据隐私。根据其支持者的说法，它还能实现低最终性性和确认延迟的高速交易。


    最新的更新支持组织在不复制整个账本历史的情况下加入通道。这使得启动过程更快，且所需的存储更少。`Hyperledger Fabric` 周围有一个活跃且多样化的社区，致力于添加更多与共识算法相关的功能、用于
    GDPR 合规的额外隐私选项以及运营改进。


    ### 4. Hyperledger Sawtooth

    `Hyperledger Sawtooth` 是由 `Hyperledger` 和 Linux 基金会托管的另一个开源区块链计划，它使用了一种名为“时间证明”（Proof
    of Elapsed Time）的新颖共识机制，该机制可以与基于硬件的安全技术集成，允许程序代码的“信任执行环境”运行在安全内存（计算机内存保护区域）中。


    最常见的应用程序是开发供应链系统以及为特定目的定制 `Sawtooth`（例如新颖共识算法）。


    `Sawtooth Library` 的工作已经开始，它将允许自定义分布式账本的开发者选择在应用程序中使用 `Sawtooth` 的哪些部分。同时，`Sawtooth`
    正在采用 `Splinter` 进行网络，这将提供动态私有电路（节点组）；采用 `Hyperledger Transact` 进行交易处理，这将扩展智能合约能力；以及采用
    `Augrim` 进行共识，这将扩展支持的算法数量。


    ### 5. R3 Corda

    关于 `R3 Corda` 在技术上是区块链还是另一种类型的分布式账本存在争议。它使用了一种新颖的共识机制，其中交易通过加密方式链接，但不会定期将多个交易打包成区块。即使是官方
    `Corda` 网站也将其描述为“既是区块链不是区块链”。这种方法的主要优势之一是所有交易都是实时处理的，与其他类型的区块链相比，可以提高性能。


    `R3` 联盟在金融行业拥有强大的追随者，因为 `Corda` 为具有强性的金融交易和智能合约提供了一种吸引的方法。领先的支持者包括美国银行、汇丰、英特尔和微软。它很有可能成为保险相关交易处理的标准网络。然而，它面临来自其他联邦区块链网络的竞争，这些网络可以更快、更便宜地处理交易。


