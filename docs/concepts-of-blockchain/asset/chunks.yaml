    通过区块链，这些恶意行为者必须识别并针对许多故障点，直到他们控制了网络 51% 以上的内容，这被称为“共识”。这是一项几乎无法完成的任务。


    中心化数据库需要不断更新和同步数据，这导致了高昂，并容易受到恶意行为者的攻击。因此，区块链通过透明性、不可篡改性和通过所有权实现的访问性建立了信任，并提供了财务收益。


    ## 透明性


    区块链的设计使得其整个历史都是可见且不可更改的。区块链中的交易在创建后无法被修改，其完整历史对公可见。这意味着区块链是一个完全透明的数据结构，具有一个非常有用的属性：任何用户都可以轻松验证区块链的完整性。


    区块链（无论是公链还是私有链）的主要优势之一是`透明性`。在 `Bitcoin` 或 `Ethereum` 这样的公链中，由于它们是匿名性的且没有身份的概念，因此无法以不同的方式对待用户。因此，公链上的数据对所有参与者都是透明且可见的。从货币交换的角度来看，这增加了很多价值，因为只要参与者的匿名性得到保护，任何人都可以验证账本上任何交易的细节，而该账本是不可变、永久的、不可更改且提供高度信任的。这为公链提供了许多潜在的用例，例如投票、选民注册和选举结果跟踪。在公链上，还有另一种类型的透明性，即对在区块链上执行的智能合约的`完全透明`。这些智能合约具有处理他人资金的潜力，如果你打算将钱托付给他人的智能合约，你应该有能力审查该智能合约的源代码，以确保它的编写是公平的，没有安全漏洞，并且执行了它所声称的功能。


    在私有链上，我们拥有的是`权限管理`，我们可以控制共享多少数据。我们仍然可以从私有链创建的共享基础设施中共享数据的许多优势。在许多业务网络和价值链关系中，参与者可以与消费者共享更多关于业务流程和服务交付的数据和信息。虽然技术上传统技术可能解决这些问题，但通常认为人们无法在谁拥有平台、谁构建平台以及谁维护平台的问题上达成共识。如果参与者离开生态系统，他们会带走平台的全部或部分吗？使用如
    `Hyperledger` 等私有区块链解决方案可以缓解许多此类担忧，并实现组织之间真正共享的技术基础设施。这允许参与者跟踪数据，并共享关于货物创建、消费和交付的数据。据估计，超过
    1/3 的食物被浪费了，因为其供应链缺乏透明度。例如，如果肉类因污染而被召回，大量完好的肉类就会被丢弃。如果我们能对产品源地以及它如何从生产到购买的过程有更高的可见性，就可以实现更准确的召回，这将有助于减少浪费。同样，如果你在制造和分销服装，并能向用户证明所有服装都源自具有公平劳工实践的地方，消费者将对你的品牌有更多信任。因此，这类透明性解决方案是区块链最大的优势之一，也是探索最充分的领域之一，因为现在有很多消费者希望对产品和服务有更高的透明度。


    ## 不可篡改性


    区块链的主要优势之一是`不可篡改性`。在传统数据库中，我们可以创建、编辑和删除。但在区块链中，只有 2 种可能的操作：创建新记录和读取现有记录。这种不可篡改性使得区块链成为安全且无需信任的解决方案，这意味着我不需要信任与之交互的任何人。


    区块链中不可篡改性的工作方式非常低效。我们要求网络上的大量节点执行与其他每个节点完全相同的操作，导致了工作的反复重复。这样做的原因是，它确保了更改区块链上数据的唯一方法是通过更改
    51% 或更多节点上的该数据。需要注意的一个重要点是，区块链并不会采取操作来验证写入其上的信息是否正确。它只验证信息自原始写入以来没有发生变化。


    区块链提供的不可篡改性是指数据自原始写入以来没有发生过变化。这种不可篡改性的另一个部分是密码哈希，以及所有区块链链在一起的方式。区块链的设计使得不可篡改性是累积的；每个节点都与其他所有节点连接，形成了一个凝聚的整体，这个整体变得越来越难以篡改或更改。如果我回溯并尝试更改区块链上的任何信息或先前的交易，我将以一种非常明显的方式破坏链，任何人都会立即发现区块链上的数据已被更改。


    *   在底层，交易由创建者进行数字签名。除非攻击者窃取私钥，否则他们无法伪造交易

    *   区块结构是预定义的。攻击者无法修改它

    *   每个区块都包含前一个区块的哈希值，在区块链的每个区块之间创建了链，如果被篡改，链就会断裂

    *   每个区块都由创建者进行数字签名。创建者通过区块链共识协议选择，这使得攻击者很难成为合法的创建者


    # 区块链功能


    在本章中，我们将关注区块链的功能。首先，我们将讨论智能合约，区块链具有存储和运行可以执行协议条款应用程序的能力。这些存储并执行在区块链上的数字协议消除了中间环节和歧义，从而减少了冲突。


    我们将讨论区块链如何保护信息，以及这些技术与传统数据库安全的不同之处。接下来，我们将讨论不同类型的区块链（公链、私有链和混合链）以及区块链开发的原则。我们将检查基础区块链交易从开始到结束的步骤。

    '
- fmt: '

    Finally, we will discuss blockchain consensus mechanisms and why they are backbone
    to the blockchain operations. We will compare `Proof-of-Work` (`PoW`) and `Proof-of-Stake`
    (`PoS`) consensus models, and discuss the differences and considerations. We will
    further discuss private blockchains and how ‘permissioning’ mechanisms are the
    basis for their ConsenSys models.


    ## Smart Contracts


    When we make a transaction on blockchain, there are only 3 types of transactions
    we can make. It can be referred to as Onion model.


    Let’s start with the outermost layer of this onion. This layer is used to do transactions
    of the blockchain, like trade cryptocurrencies back and forth. For example, I
    paid you 10 Bitcoins to purchase your home, and we use blockchain to conduct and
    record this transaction. This is the model that many of us start off with in blockchain
    and the one that is most familiar.


    Now, if we peel the outer layer, and take away the idea of monetary transaction
    or exchange, we are left with 2 or more parties using the blockchain to record
    an event or an agreement. For example, I go to my doctor for health checkup and
    he prescribes me a new medicine. Suppose we are keeping our medical information
    on the blockchain, and so both my doctor and I agree to put this new prescription
    on the blockchain. In this case, we still need 2 or more parties, because it is
    very important that I, as a patient, do not have the ability to update and alter
    my medical record without a licensed medical professional involved. Similarly,
    my doctor should not be able to alter my medical record without my consent. So,
    here 2 or more parties are involve to record a data point, without the exchange
    of any monetary value.


    Now, if we peel away this layer, we get the innermost layer wherein we can take
    away the idea of having 2 or more parties. We are left with just a single party
    announcing an event. This is the simples type of blockchain transaction, and also
    the most powerful. For example, in a supply chain scenario, we might have a producer
    of organic food announce a record to the blockchain that they have planted a crop.
    Now this is a single entity making a record on the blockchain., and here is where
    the smart contracts come in.


    These smart contracts are just computer code that we can use to respond to any
    kind of event that gets captured on the blockchain. For example, in the previous
    example, if I need to notify someone that the new produce has been treated with
    organic pesticides, I can record that transaction on the blockchain and create
    traceability for the end consumer. Here I can use a smart contract that manages
    and defines the rules and steps that gets taken when that particular type of event
    occurs. This is where smart contracts come into play.


    There is often a misconception when people hear the word contract that they think
    it is a legally binding agreement between 2 or more parties. It is not necessary
    the case. Smart contracts do not have to be legally binding and they do not have
    to involve multiple parties.


    You can think of smart contracts as a set of rules that get executed every time
    a certain type of event occurs. And this is where the real power of blockchain
    comes in that not only we have a permanent, unchangeable record of all the events
    that have occurred, we can also write computer codes to define exactly how the
    process is going to be managed and what steps need to be taken when that particular
    event occurs. This allows us to ensure process consistency.


    So, when you hear smart contracts, just think of it as a computer code that you
    write to respond to different types of significant events. In computer language,
    you can also think of smart contract as a workflow tool, with the ability to work
    with money. These smart contracts are just a way for us to put our logic into
    the blockchain solutions to ensure consistency of execution.


    Some key characteristics of smart contracts are:


    * Smart contracts are computer programs that can execute an action based on terms
    and conditions

    * Smart contracts have terms recorded in a computer language instead of legal
    language.

    * Smart contracts are not necessarily legal binding and do not need multiple participants

    * Each step of the smart contract can only be implemented after the execution
    of the immediate previous step

    * Once executed, the information in the smart contract is stored on the blockchain
    and cannot be altered

    * In the Ethereum platform, smart contracts are written in `Solidity` programming
    language designed for developing smart contracts that run on Ethereum Virtual
    Machine (`EVM`)

    * Smart contracts act as a foundation to build decentralized applications (`DApps`)


    Some key benefits of smart contracts are as follows:


    * Accuracy – Replacing human intermediaries with executable code removes any human
    error and ensures the accuracy of the process

    * Cost savings – Replacing intermediaries reduces operational costs

    * Efficiency – Removing intermediaries reduces redundant process steps as well
    as automates processes, resulting in significant process efficiency gains

    * Backup – A blockchain and smart contract deployed to it can provide a permanent
    record, allowing for auditing, insight, and traceability, even if the creator
    is no longer in business

    * Autonomy – Smart contracts can be developed by anyone. There is no need for
    intermediaries such as lawyers, brokers, or auditors


    A use case of the smart contract can be for funding a startup. Let’s say that
    I have started up a new company and you intend to invest $ 1 million in my startup.
    Let’s say instead of investing $ 1 million directly, you write a smart contract
    on the blockchain to manage this investment, and you put $ 1 million into this
    smart contract. This smart contract has been programmed with the terms and conditions
    under which it releases $ 100,000 initially and then the next $ 100,000 on achievement
    of a milestone, like product go-live, and then the next $ 300,000 on another milestone,
    like hitting 10,000 customers, and then the final $ 500,000 on expanding to a
    new geography. This would put a lot of power in your hand and would keep me accountable
    for achieving the milestones that I promised in my startup pitch to raise funds.
    While such things are also possible with traditional technology, they are not
    very practical or feasible. In this case, blockchain based smart contracts puts
    the power back in the hands of the investors and has the potential to reform the
    startup funding ecosystem.


    ## Blockchain Security


    Blockchain is commonly called the future of computing. It takes a very different
    approach to data storage and processing and requires a very different perspective
    for security. In this section, we will discuss some of the ways in which blockchain
    security differs from traditional security.


    In a traditional cybersecurity, we are very perimeter focused that we put trusted
    data and asset behind a strict perimeter. We assume that anyone we let inside
    that perimeter is trusted, either partially or fully, to see the data and access
    the resources inside that perimeter. The emphasis is on making sure that only
    authorized users get into the perimeter, and prevent any attacker or stranger
    from breaching the perimeter and accessing the data stored in it.


    In blockchain its very different, as it runs on a massively decentralized peer-to-peer
    global network. Since there is no perimeter on blockchain, the security has to
    come from somewhere else. The security on blockchain comes from incredible amount
    of repetition. In blockchain, every node keeps the same copy of the ledger and
    periodically has to reach majority consensus, on what the data on the ledger should
    be. Hence, the amount of work an attacker would have to do in order to change,
    alter, or hack the ledger is practically impossible.

    '
