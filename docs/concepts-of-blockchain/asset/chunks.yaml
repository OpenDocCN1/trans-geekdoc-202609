- fmt: "\nEthereum does this by building what is essentially the ultimate abstract\
    \ foundational layer: a blockchain with a built-in Turing-complete programming\
    \ language, allowing anyone to write smart contracts and decentralized applications\
    \ where they can create their own arbitrary rules for ownership, transaction formats\
    \ and state transition functions.\n\nA bare-bones version of Namecoin can be written\
    \ in two lines of code, and other protocols like currencies and reputation systems\
    \ can be built in under twenty.\n\nSmart contracts, cryptographic \"boxes\" that\
    \ contain value and only unlock it if certain conditions are met, can also be\
    \ built on top of the platform, with vastly more power than that offered by Bitcoin\
    \ scripting because of the added powers of Turing-completeness, value-awareness,\
    \ blockchain-awareness and state.\n\n## Ethereum Accounts\n\nIn Ethereum, the\
    \ state is made up of objects called \"accounts\", with each account having a\
    \ 20-byte address and state transitions being direct transfers of value and information\
    \ between accounts. \n\nAn Ethereum account contains four fields:\n\n*   The `nonce`,\
    \ a counter used to make sure each transaction can only be processed once\n* \
    \  The account's current Ether balance\n*   The account's contract code, if present\n\
    *   The account's storage (empty by default)\n\nIn general, there are two types\
    \ of accounts: externally owned accounts, controlled by private keys, and contract\
    \ accounts, controlled by their contract code. \n\n*   **Externally owned accounts**\
    \ – As their name suggest, owned by an external entity, outside the Ethereum network.\
    \ Externally owned accounts use an address that they use to let people send them\
    \ Ether, and also as a balance of Ether. This type of account can send transactions\
    \ to transfer Ether or to trigger contract code. An externally owned account has\
    \ no code, and one can send messages from an externally owned account by creating\
    \ and signing a transaction\n*   **Contract accounts** – They are owned by smart\
    \ contracts. They contain an address, associated contract code, and also persistent\
    \ storage. In a contract account, every time the contract account receives a message\
    \ its code activates, allowing it to read and write to internal storage and send\
    \ other messages or create contracts in turn. \n\nNote that \"contracts\" in Ethereum\
    \ should not be seen as something that should be \"fulfilled\" or \"complied with\"\
    ; rather, they are more like \"autonomous agents\" that live inside of the Ethereum\
    \ execution environment, always executing a specific piece of code when \"poked\"\
    \ by a message or transaction, and having direct control over their own Ether\
    \ balance and their own key/value store to keep track of persistent variables.\n\
    \n## Transactions\n\nThe term \"transaction\" is used in Ethereum to refer to\
    \ the signed data package that stores a message to be sent from an externally\
    \ owned account. Transactions contain:\n\n*   The recipient of the message\n*\
    \   A signature identifying the sender\n*   The amount of Ether to transfer from\
    \ the sender to the recipient\n*   An optional data field\n*   A `STARTGAS` value,\
    \ representing the maximum number of computational steps the transaction execution\
    \ can take\n*   A `GASPRICE` value, representing the fee the sender pays per computational\
    \ step\n\nThe first three are standard fields expected in any cryptocurrency.\
    \ The data field has no function by default, but the virtual machine has an `OPCODE`\
    \ using which a contract can access the data; for example, if a contract is functioning\
    \ as an on-blockchain domain registration service, then it may wish to interpret\
    \ the data being passed to it as containing two \"fields\", the first field being\
    \ a domain to register and the second field being the IP address to register it\
    \ to. The contract would read these values from the message data and appropriately\
    \ place them in storage.\n\nThe `STARTGAS` and `GASPRICE` fields are crucial for\
    \ Ethereum's anti-denial of service model. In order to prevent accidental or hostile\
    \ infinite loops or other computational wastage in code, each transaction is required\
    \ to set a limit to how many computational steps of code execution it can use.\
    \ The fundamental unit of computation is \"gas\"; usually, a computational step\
    \ costs 1 `gas`, but some operations cost higher amounts of gas because they are\
    \ more computationally expensive, or increase the amount of data that must be\
    \ stored as part of the state. \n\nThere is also a fee of 5 gas for every byte\
    \ in the transaction data. The intent of the fee system is to require an attacker\
    \ to pay proportionately for every resource that they consume, including computation,\
    \ bandwidth and storage; hence, any transaction that leads to the network consuming\
    \ a greater amount of any of these resources must have a gas fee roughly proportional\
    \ to the increment.\n\n## Messages\n\nContracts have the ability to send \"messages\"\
    \ to other contracts. Messages are virtual objects that are never serialized and\
    \ exist only in the Ethereum execution environment. A message contains:\n\n* \
    \  The sender of the message (implicit)\n*   The recipient of the message\n* \
    \  The amount of ether to transfer alongside the message\n*   An optional data\
    \ field\n*   A `STARTGAS` value\n\nEssentially, a message is like a transaction,\
    \ except it is produced by a contract and not an external actor. A message is\
    \ produced when a contract currently executing code executes the `CALL OPCODE`,\
    \ which produces and executes a message. Like a transaction, a message leads to\
    \ the recipient account running its code. Thus, contracts can have relationships\
    \ with other contracts in the same way that external actors can.\n\nNote that\
    \ the gas allowance assigned by a transaction or contract applies to the total\
    \ gas consumed by that transaction and all sub-executions. For example, if an\
    \ external actor A sends a transaction to B with 1000 gas, and B consumes 600\
    \ gas before sending a message to C, and the internal execution of C consumes\
    \ 300 gas before returning, then B can spend another 100 gas before running out\
    \ of gas.\n\n## Ethereum State Transition Function\n\nThe Ethereum state transition\
    \ function, `APPLY(S,TX) -> S'` can be defined in the following steps:\n\n1. \
    \ Check if the transaction is well-formed (ie. has the right number of values),\
    \ the signature is valid, and the nonce matches the nonce in the sender's account.\
    \ If not, return an error.\n2.  Calculate the transaction fee as `STARTGAS * GASPRICE`,\
    \ and determine the sending address from the signature. Subtract the fee from\
    \ the sender's account and increment the sender's nonce. If there is not enough\
    \ balance to spend, return an error.\n3.  Initialize `GAS = STARTGAS`, and take\
    \ off a certain quantity of gas to pay for the bytes in the transaction.\n4. \
    \ Transfer the transaction value from the sender's account to the receiving account.\
    \ If the receiving account does not yet exist, create it. If the receiving account\
    \ is a contract, run the contract's code either to completion or until the execution\
    \ runs out of gas.\n5.  If the value transfer failed because the sender did not\
    \ have enough money, or the code execution ran out of gas, revert all state changes\
    \ except the payment of the fees, and add the fees to the miner's account.\n6.\
    \  Otherwise, refund the fees for all remaining gas to the sender, and send the\
    \ fees paid for gas consumed to the miner.\n\nFor example, suppose that the contract's\
    \ code is:\n\n```\nif !self.storage[calldataload(0)]:\n    self.storage[calldataload(0)]\
    \ = calldataload(32)\n```\n\nSuppose that the contract's storage starts off empty,\
    \ and a transaction is sent with 10 Ether value, 2000 gas, 0.001 Ether GASPRICE,\
    \ and 64 bytes of data, with bytes 0-31 representing the number 2 and bytes 32-63\
    \ representing the string CHARLIE. The process for the state transition function\
    \ in this case is as follows:\n\n1.  Check that the transaction is valid and well\
    \ formed.\n2.  Check that the transaction sender has at least 2000 * 0.001 = 2\
    \ ether. If it is, then subtract 2 ether from the sender's account.\n"
  raw: "Ethereum does this by building what is essentially the ultimate abstract foundational\
    \ layer: a blockchain with a built-in Turing-complete programming language, allowing\
    \ anyone to write smart contracts and decentralized applications where they can\
    \ create their own arbitrary rules for ownership, transaction formats and state\
    \ transition functions. \n\nA bare-bones version of Namecoin can be written in\
    \ two lines of code, and other protocols like currencies and reputation systems\
    \ can be built in under twenty. \n\nSmart contracts, cryptographic \"boxes\" that\
    \ contain value and only unlock it if certain conditions are met, can also be\
    \ built on top of the platform, with vastly more power than that offered by Bitcoin\
    \ scripting because of the added powers of Turing-completeness, value-awareness,\
    \ blockchain-awareness and state.\n\nEthereum Accounts\n\nIn Ethereum, the state\
    \ is made up of objects called \"accounts\", with each account having a 20-byte\
    \ address and state transitions being direct transfers of value and information\
    \ between accounts. \n\nAn Ethereum account contains four fields:\n\n*   The nonce,\
    \ a counter used to make sure each transaction can only be processed once\n\n\
    *   The account's current Ether balance\n\n*   The account's contract code, if\
    \ present\n\n*   The account's storage (empty by default)\n\nIn general, there\
    \ are two types of accounts: externally owned accounts, controlled by private\
    \ keys, and contract accounts, controlled by their contract code. \n\n*   Externally\
    \ owned accounts – As their name suggest, owned by an external entity, outside\
    \ the Ethereum network. Externally owned accounts use an address that they use\
    \ to let people send them Ether, and also as a balance of Ether. This type of\
    \ account can send transactions to transfer Ether or to trigger contract code.\
    \ An externally owned account has no code, and one can send messages from an externally\
    \ owned account by creating and signing a transaction\n\n*   Contract accounts\
    \ – They are owned by smart contracts. They contain an address, associated contract\
    \ code, and also persistent storage. In a contract account, every time the contract\
    \ account receives a message its code activates, allowing it to read and write\
    \ to internal storage and send other messages or create contracts in turn. \n\n\
    Note that \"contracts\" in Ethereum should not be seen as something that should\
    \ be \"fulfilled\" or \"complied with\"; rather, they are more like \"autonomous\
    \ agents\" that live inside of the Ethereum execution environment, always executing\
    \ a specific piece of code when \"poked\" by a message or transaction, and having\
    \ direct control over their own Ether balance and their own key/value store to\
    \ keep track of persistent variables.\n\nTransactions\n\nThe term \"transaction\"\
    \ is used in Ethereum to refer to the signed data package that stores a message\
    \ to be sent from an externally owned account. Transactions contain:\n\n*   The\
    \ recipient of the message\n\n*   A signature identifying the sender\n\n*   The\
    \ amount of Ether to transfer from the sender to the recipient\n\n*   An optional\
    \ data field\n\n*   A STARTGAS value, representing the maximum number of computational\
    \ steps the transaction execution can take\n\n*   A GASPRICE value, representing\
    \ the fee the sender pays per computational step\n\nThe first three are standard\
    \ fields expected in any cryptocurrency. The data field has no function by default,\
    \ but the virtual machine has an OPCODE using which a contract can access the\
    \ data; for example, if a contract is functioning as an on-blockchain domain registration\
    \ service, then it may wish to interpret the data being passed to it as containing\
    \ two \"fields\", the first field being a domain to register and the second field\
    \ being the IP address to register it to. The contract would read these values\
    \ from the message data and appropriately place them in storage.\n\nThe STARTGAS\
    \ and GASPRICE fields are crucial for Ethereum's anti-denial of service model.\
    \ In order to prevent accidental or hostile infinite loops or other computational\
    \ wastage in code, each transaction is required to set a limit to how many computational\
    \ steps of code execution it can use. The fundamental unit of computation is \"\
    gas\"; usually, a computational step costs 1 gas, but some operations cost higher\
    \ amounts of gas because they are more computationally expensive, or increase\
    \ the amount of data that must be stored as part of the state. \n\nThere is also\
    \ a fee of 5 gas for every byte in the transaction data. The intent of the fee\
    \ system is to require an attacker to pay proportionately for every resource that\
    \ they consume, including computation, bandwidth and storage; hence, any transaction\
    \ that leads to the network consuming a greater amount of any of these resources\
    \ must have a gas fee roughly proportional to the increment.\n\nMessages\n\nContracts\
    \ have the ability to send \"messages\" to other contracts. Messages are virtual\
    \ objects that are never serialized and exist only in the Ethereum execution environment.\
    \ A message contains:\n\n*   The sender of the message (implicit)\n\n*   The recipient\
    \ of the message\n\n*   The amount of ether to transfer alongside the message\n\
    \n*   An optional data field\n\n*   A STARTGAS value\n\nEssentially, a message\
    \ is like a transaction, except it is produced by a contract and not an external\
    \ actor. A message is produced when a contract currently executing code executes\
    \ the CALL OPCODE, which produces and executes a message. Like a transaction,\
    \ a message leads to the recipient account running its code. Thus, contracts can\
    \ have relationships with other contracts in the same way that external actors\
    \ can.\n\nNote that the gas allowance assigned by a transaction or contract applies\
    \ to the total gas consumed by that transaction and all sub-executions. For example,\
    \ if an external actor A sends a transaction to B with 1000 gas, and B consumes\
    \ 600 gas before sending a message to C, and the internal execution of C consumes\
    \ 300 gas before returning, then B can spend another 100 gas before running out\
    \ of gas.\n\nEthereum State Transition Function\n\nThe Ethereum state transition\
    \ function, APPLY(S,TX) -> S' can be defined in the following steps:\n\n1.  Check\
    \ if the transaction is well-formed (ie. has the right number of values), the\
    \ signature is valid, and the nonce matches the nonce in the sender's account.\
    \ If not, return an error.\n\n2.  Calculate the transaction fee as STARTGAS \\\
    * GASPRICE, and determine the sending address from the signature. Subtract the\
    \ fee from the sender's account balance and increment the sender's nonce. If there\
    \ is not enough balance to spend, return an error.\n\n3.  Initialize GAS = STARTGAS,\
    \ and take off a certain quantity of gas per byte to pay for the bytes in the\
    \ transaction.\n\n4.  Transfer the transaction value from the sender's account\
    \ to the receiving account. If the receiving account does not yet exist, create\
    \ it. If the receiving account is a contract, run the contract's code either to\
    \ completion or until the execution runs out of gas.\n\n5.  If the value transfer\
    \ failed because the sender did not have enough money, or the code execution ran\
    \ out of gas, revert all state changes except the payment of the fees, and add\
    \ the fees to the miner's account.\n\n6.  Otherwise, refund the fees for all remaining\
    \ gas to the sender, and send the fees paid for gas consumed to the miner.\n\n\
    For example, suppose that the contract's code is:\n\nif !self.storage\\[calldataload(0)\\\
    ]:\n\n    self.storage\\[calldataload(0)\\] = calldataload(32)\n\nSuppose that\
    \ the contract's storage starts off empty, and a transaction is sent with 10 Ether\
    \ value, 2000 gas, 0.001 Ether GASPRICE, and 64 bytes of data, with bytes 0-31\
    \ representing the number 2 and bytes 32-63 representing the string CHARLIE. The\
    \ process for the state transition function in this case is as follows: \n\n1.\
    \  Check that the transaction is valid and well formed.\n\n2.  Check that the\
