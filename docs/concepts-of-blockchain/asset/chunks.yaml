    # Introduction


    ## What is Blockchain?


    Blockchain is a peer-to-peer ledger system that allows peers to transact directly
    with each other without the need of a central authority. The blockchain records
    information of these transactions in a decentralized way that makes it improbable
    to alter.


    In order to understand Blockchain, first, let us understand what are blocks? Blocks
    are digital ledgers which hold batches of valid transactions. Each block contains
    a cryptographic hash of the previous block, a timestamp, and transaction data
    (generally represented as a Merkle tree). To assure the integrity of a block and
    the data contained in it, the block is usually digitally signed.


    The cryptographic hash of the prior block links the two blocks. As blocks contain
    information about the block before it, these linked blocks form a chain, with
    each additional block reinforcing the ones before it. This iterative process confirms
    the integrity of the previous block, all the way back to the initial block, which
    is known as the genesis block.

