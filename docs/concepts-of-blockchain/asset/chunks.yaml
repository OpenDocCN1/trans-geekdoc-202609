  trans: '


    像 `Bitcoin`、`Ethereum`、`Litecoin` 这样的公区块平台也被称为“无许可区块链平台”，这意味着它们在设计上确实努力增加并保护用户的匿名性。如果我们不知道用户是谁，并且没有方法识别用户，我们也就无法围绕该用户创建任何权限或访问规则。因此，任何人都可以向区块链写入数据，任何人都可以从该区块链中读取数据。所以，当你考虑像
    `Bitcoin` 或 `Ethereum` 这样的公共区块链时，请理解从默认和本质上来说，它们的设计是为了是为了保护匿名性。


    在公共区块链中，由于我们不知道用户是谁，我们依靠经济学和博弈论激励来确保系统中的每个人都诚实并按照规则行为。我们通过群体共识建立情境，让诚实的参与者获得经济奖励，而不诚实的人则只会产生工作或成本，且没有任何收回这些成本的可能性。


    公共区块链的一些主要优势是：


    *   账本分布式的 – 数据库不像客户端-服务器模型那样中心化，区块链中的所有节点都参与交易验证。

    *   不可篡改性 – 当内容被写入区块链时，它无法被更改。

    *   开放共识模型 – 对谁可以在网络中运行节点没有任何限制。

    *   开放读写 – 任何人都可以通过向 `Bitcoin` 或 `Ethereum` 这样的区块链提交交易来参与。

    *   低准入门槛 – 公共网络上的交易可以通过互联网连接和手机完成。

    *   安全性 – 通过 `51%` 共识协议，交易是安全的。获取网络的大多数算力可能会导致大规模的双重花费，以及防止交易确认的能力等其他潜在的不良行为。这从未被实现，因为实施此类攻击的计算力成本太高。


    ## 私有闭环区块链


    公共区块链的对立面是私有区块链或许可链。


    当我们谈论私有区块链解决方案时，我们通常指的是私有闭环区块链。我们希望控制谁可以向该区块链写入数据，以及控制谁可以从该区块链读取数据。


    为了做到这一点，第一步是身份管理。私有区块链通常带有身份管理工具或模块化架构，你可以在接入自己的身份管理解决方案。这可以是从 `Active Directory`
    部署到使用 `Google`、`Facebook`、`LinkedIn` 等 `OAuth` 解决方案的任何形式。


    私有区块链背后的理念始于理解用户是谁，因为一旦我们理解了用户是谁，我们就可以确定他们处于什么角色，并利用该角色来确定他们应该访问哪些信息。


    在私有区块链中，我们依靠知道用户是谁这一事实来确保他们诚实行为。我们假设这些用户将表现得相当诚实，因为如果不是，我们确切知道谁是不诚实的，并可以确定不实行为的后果。


    私有区块链的一些主要优势是：


    *   账本分布式的 – 数据库不像客户端-服务器模型那样中心化，区块链中的所有节点都参与交易验证。

    *   不可篡改性 – 当内容被写入区块链时，它无法被更改。

    *   合规性支持 – 作为企业，你可能需要遵守合规性要求，控制你的基础设施将更无缝地实现这一需求。

    *   更快的交易 – 当你在本地部署节点时，参与账本的节点要少得多。

    *   高效共识 – `拜占庭容错` (`BFT`) 对比 `工作量证明` (`PoW`)。

    *   可扩展性 – 添加节点的能力。

    *   许可性 – 企业控制资源。


    区块链考量


    公司在决定区块链如何适用时，必须考虑多个因素：


    *   治理 – 区块链治理涉及管理变更。

    *   智能合约功能 – 每个块链都有独特的需求，但功能取决于环境的类型。

    *   共识算法 – 网络上的节点对账本的状态达成一致。

    *   集成 – 将区块链平台与现有系统对接。

    *   加密货币需求 – 区块链如何交换价值。

    *   成本建模 – 分摊技术成本。


    总体而言，这些决策将由以下参与者做出：


    *   系统架构师 – 他们设计并构建区块链网络。

    *   系统开发者 – 他们设计智能合约。

    *   系统运营师 – 他们与软件交互。

    *   区块链用户 – 他们加入区块链网络。


    ## 区块链交易流程


    尽管区块链在形式和功能上有所，但它们遵循基本的交易流程。


    ![](img/image00243.gif)


    1.  用户请求 – 让我们通过一个基本的 `Bitcoin` 交易遵循这些步骤。如果 Alicia 想给 Billy 发送一些比特币，她会去手机或存储了某些比特币的电脑上打开
    `Bitcoin` 钱包应用程序。要发起交易，Alicia 会向系统发出请求，通过指定金额和 Billy 的比特币地址来向 Billy 的钱包发送比特币。

    2.  智能合约启用 – 当 Alicia 将交易发送到网络时，它会触发智能合约，该合约会检查网络上的节点以确保 Alicia 有可花费的货币，并且她还没有花费。一旦检查完毕，交易被添加到一个提议区块中。

    3.  向网络宣布交易 – 提议区块通过对点协议通信到网络中。

    4.  网络同意交易 – 为了让 `Bitcoin` 网络验证区块，节点或矿工必须先通过完成一道数学题来验证区块的准确性。第一个完成 `Proof-of-Work`
    (`PoW`) 方程的节点将获得新铸造的比特币奖励。一旦方程得出解，其他节点就可以很容易地检查其准确性，从而将新区块接受进区块链网络中。


