    比特币使用哈希函数 `Security Hash Algorithm-256 (SHA-256)` 来验证其网络中的 `PoW` 协议。`SHA-256`
    最初由美国国家安全局 (`NSA`) 设计。`SHA-256` 是 `SHA-2` 加密哈希函数家族的一部分。它接受小于 `2⁶⁴` 位的输入大小，并产生
    `256` 位的固定大小输出。比特币在某些情况下会使用 `SHA-256d`，这意味着连续使用了两次 `SHA-256`，一次针对原始待哈希消息，另一次针对
    `1st` 次哈希的输出。


    该系统使用部分哈希反转来证明工作的完成情况，从而解锁比特币的挖矿奖励，并作为 `Hash-cash` 中发送电子邮件的诚意标记。发送者需要找到一个哈希值以特定数量零开头的消息。发送者找到有效消息所需执行的平均工作量与哈希值所需的零位数量呈指数关系，而接收者可以通过执行单个哈希函数来验证消息的有效性。


    ## 防篡改


    现在我们已经知道了加密哈希函数如何确保数据的完整性，下一步工作是应用这一概念来确保只有授权用户才能访问数据。为了实现这一点，我们需要一种跟踪交易的方法，以管理谁在何时何访问数据。交易的自动、防篡改日志是实现对数据使用情况进行监督的方法。


    以下是概念性的防篡改区块的外观。


    ![](img/image00244.gif)


    它包含四个主要部分：


    * `Block Header` – 该字段代表理解这些组件所需的元数据

    * `Block Size` – 该字段代表区块的大小

    * `Transaction Counter` – 该字段代表区块中包含的交易数量

    * `Transactions` – 该字段代表实际交易数据


    区块的防篡改是通过 `Block Header` 通过应用哈希函数实现的。


    ## 区块 Header


    `Block Header` 指与任何区块相关的所有元数据。它由下图所示的 `6` 个字段组成：


    ![](img/image00245.gif)


    * `Previous Block Hash` – 上一个区块的哈希链接到上一个区块（或其父区块），有效地保护了链的安全性。如果任何区块被修改，随后的区块也将被修改，随后的所有区块也是如此。更改交易历史的任何部分都将改变之后的所有后续交易。

    * `Merkle Root` – `Merkle root` 由交易内所有经过哈希的交易哈希组成。

    * `Nonce` – `Nonce` 是矿工可以更改的值，用于创建不同的排列并在序列中生成正确的哈希。

    * `Timestamp` – 包含时间戳是为了让节点中的每个人都能看到特定事件发生时的永久性、编码记录。它提供了事件发生的日期和当天的具体时间。

    * `Target` – 难度目标简单来说用于调整工作矿工解决区块的难度。

    * `Version` – 比特币版本号对于跟踪整个协议的更改和更新非常有用。


    ## Merkle Tree and Merkle Root


    在计算机科学术语中，树是一种具有根节点和一些子节点的数据结构，这些子节点也可以其他树的根。二叉树是一种……的树


    ![](img/image00246.gif)


    `binary tree` 是一种……的树


    ![](img/image00246.gif)


    `binary tree` 是一种以 `Merkle` 命名的树，他在 `1979` 年获得了该技术的专利。


    `Merkle Tree` 需要满足以下条件：


    * 在底部 `at the bottom`

    * `of the hashes`


    `binary tree` 是一种……的树


    ![](img/image00247.gif)


    `binary tree` 是一种……的树


    `binary tree` 是一种……的树


    ![](img/image00247.gif)


    `binary tree` 是一种……的树


    ## Partial Preimage Hash


    ![](img/image00247.gif)


    网络中的实体在提交 `vote` 之前需要证明他们已经做了某些工作。他们必须为自己的计算机设计一个 `partial preimage hash puzzle`
    来求解，以证明他们做了工作。`Partial preimage` 意味着 `partial input`。在比特币中，我们得到了 `part of the
    input`，我们必须找到 `other part` 以产生某些 `partial output`，并满足 `hash of the block header`
    小于 `target value` 的条件。这就是 `Proof-of-Work (PoW)` 在比特币中的实现。这些 `hash puzzles` 需要具备三个特征：


    * `Computationally difficult` – 确保谜题无法被轻易破解

    * `Parameterizable` – 谜题的难度应该是调节的，以确保它不会变得太简单或太难

    * `Easily verifiable` – 确保网络中的计算机不需要做太多工作即可验证解决方案


    ## 数字签名


    数字签名确保发送到网络其他部分的当前交易也是防篡改的。数字签名验证用户的身份，因为它使用特定的 `private key` 进行签名，并提供 `public
    key` 所有权进行验证。


    例如，假设你想给朋友发送一条消息。你如何确保它没有被篡改？因此，在发送消息之前，用你的 `private key` 对其进行签名以验证你的身份。然后你将 `signed
    message` 发给你的朋友。`message` 是主体，`digital signature` 用于证明该 `message` 是你创建的。你的朋友可以使用你的
    `public key` 验证你的签名。任何时候，如果此 `message` 被篡改，`digital signature` 将不再有效。这就是 `digital
    signature` 使消息防篡改的方式。


    数字签名具有以下关键属性：


    * `Message origin` – 接收者能够验证原始发送者（`private key` 所有者）已授权该消息

    * `Non-repudiation` – 原始发送者（`private key` 所有者）在发送消息后无法撤回、撤销或使签名失效

    * `Message integrity` – 消息在发送后无法被修改


