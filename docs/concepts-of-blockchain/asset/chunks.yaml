  raw: " A smart contract is a program that runs on the blockchain network, and can\
    \ impose contractual agreements. Typically they work as digital agreements that\
    \ enforce a specific set of rules, which are defined by computer code. This code\
    \ is replicated and executed by all blockchain networks.\n\nWhy it is one of the\
    \ key Blockchain feature?\n\n*   Trustless protocols – Blockchain smart contracts\
    \ allow for creation of trustless protocols. This means that the two parties can\
    \ make commitments via blockchain, without having to know or trust each other.\
    \ They can be sure that if the conditions are not fulfilled, the contract will\
    \ not be executed. \n\n*   Remove 3rd party – The use of smart contracts can remove\
    \ the need of intermediaries or 3rd parties, which would reduce operational costs\
    \ significantly\n\n*   Faster settlements – Smart contracts can allow making faster\
    \ settlements for any kind of contract, with the 3rd party out of the way. This\
    \ is one of the best benefits of blockchain features to this day. This way blockchain\
    \ will impact the international trades too!\n\n## Blockchain Use Cases Synopsis\n\
    \nThere are numerous blockchain use cases that are currently being explored. For\
    \ example, managing education certificates or personal health information, where\
    \ these records could be accessible with your permission to anyone else. Let’s\
    \ assume you are a US resident and travelling to India for a vacation. Suppose\
    \ you fall ill and end up in a hospital there, wouldn’t it be great if the doctor\
    \ treating you had full insight into your medical history, knows the allergy you\
    \ have, or any medications you are on. This is a very big area and ties blockchain\
    \ with identity management. \n\nSimilarly, blockchain for voting is a big area\
    \ to explore, to ensure integrity of elections and demonstrate that the results\
    \ haven’t been tempered with. \n\nAnother area of interest is blockchain for media\
    \ and arts, wherein the content creators can use blockchain technology to distribute\
    \ their work to public without the use of 3rd party or an intermediary, via multiple\
    \ scenarios like non fungible tokens (NFT).\n\nWe are also seeing a lot of interest\
    \ in blockchain for fractional asset ownership scenarios, wherein we can leverage\
    \ blockchain tokens and NFTs to fractionalize the asset ownership.\n\nAnd then,\
    \ we have the traditional use cases, like blockchain for banking to ensure transparency\
    \ and accuracy of transactions and avoid frauds; and blockchain for supply chain\
    \ to track the supply, and origin of goods and services. Walmart is pioneering\
    \ the use of blockchain technology in the supply chain field, by using blockchain\
    \ to identify the origin of meat that is sold in the stores, in order to accelerate\
    \ recalls in case of any issue, along with reducing the waste with insights to\
    \ the supply chain.\n\nOn the public sector, there is a lot of interest in the\
    \ blockchain technology for law enforcement purposes; how do we enable different\
    \ government agencies to share data seamlessly, in a safe and secure environment,\
    \ along with protecting users privacy and anonymity.\n\nBlockchain Users\n\n*\
    \   Business to Consumers (B2C) – A B2C business is conducted directly between\
    \ a company and its consumers who are the end-users of its products or services.\
    \ Benefits of blockchain for B2C segment is transparency to consumers, accountability\
    \ from suppliers, sourcing validation, labor verification, and immutable contracts.\n\
    \nA real-world use case is of a firm called TrustChain, which uses blockchain\
    \ to track and authenticate diamonds, and other precious metals across all stages\
    \ of supply chain from mining to the end consumer. As a result, the jewelry industry\
    \ can now track and authenticate diamonds and other precious metals through all\
    \ stages of the supply chain. Blockchain would enable physical product verification,\
    \ process verification, and would serve as a governance oversight.\n\n*   Business\
    \ to Business (B2B) – With a decentralized approach, blockchain removes the intermediary\
    \ such as banks in business to business transactions, to facilitate faster and\
    \ less expensive payments. The shared ledger approach also eliminates the need\
    \ for multiple paper copies that need to be verified and updated constantly.\n\
    \nA real-world use case is of DLT Labs and Walmart Canada, who have initiated\
    \ a tracking program to tackle dispute resolution in disparate invoicing system\
    \ for freights. The blockchain solution connects all points on the supply chain\
    \ with a shared trusted ledger. The carriers are a vital link in the Walmart’s\
    \ supply chain and the DLT blockchain solution ensures that the invoicing system\
    \ runs smoothly. As a result, dispute among the parties involved in freight management\
    \ and Walmart has reduced by 95%.\n\n*   Government to Consumers (G2C) – The public\
    \ sector is the part of the economy composed of both the public and private sector\
    \ companies operating on behalf of the public. Public sector includes all the\
    \ government, military, police, public health, public education, infrastructure,\
    \ housing, financial services, and other industries. The current systems are inherently\
    \ insecure and costly, with in-efficient workflows. Blockchain technology would\
    \ enable more secure, agile, and cost optimum platforms for public use.\n\nA real-world\
    \ example is of Smart Dubai 2021, wherein Dubai aims to move all government operations\
    \ and record keeping into blockchain. The goal is to increase transparency and\
    \ efficiency in the government operations. Blockchain is also becoming the enabling\
    \ layer for a lot of other Smart Dubai initiatives, thereby creating a Smart City.\
    \ For example, projects like automated traffic signals, registration of citizens\
    \ for visas and public healthcare, etc. are all being pioneered on blockchain.\n\
    \n# Blockchain Mechanics\n\nIn this chapter, we will discuss the distributed ledger\
    \ technology, its basic components and how it differs from the previous ledger\
    \ storage technologies. We will gain an insight of how data sharing, storage,\
    \ and cryptography are wrapped into the blockchain foundations, and how the hashing\
    \ function and the Merkle tree data structure helps to immutably store data with\
    \ transparency, without revealing all the details.\n\nWe will also get an insight\
    \ into how the blockchain technology is fundamental in public-key cryptography\
    \ where key pairs support privacy and authenticity by only exposing the public\
    \ key, and keeping the private key secure. We will examine how this agreed-upon,\
    \ append-upon distributed ledger technology guarantees transparency and immutability.\n\
    \n## Accounting Systems\n\nThe history of blockchain is tightly coupled with the\
    \ history of accounting. \n\nBookkeeping or accounting has its roots in ancient\
    \ civilizations, some as old as 5000 years ago, wherein we have evidence of the\
    \ single-entry accounting system, which was the world’s first methodology to prove\
    \ the ownership of an asset. The ledger was associated with the owner. The single-entry\
    \ accounting system mandated a centralized authority to control and govern the\
    \ ledger. Single-Entry Accounting, on the one hand, was a simple, easy to maintain\
    \ the system as it was a one-sided accounting system but on the other, it was\
    \ impossible to authenticate or examine its accountability. Thus, with time, people\
    \ realized that the procedure of accounting needed more transparency and accountability\
    \ and should be able to answer questions like:\n\n*   Who paid what?\n\n*   Who\
    \ owes how much?\n\n*   Which debts are unpaid?\n\n*   Why is money missing?\n\
    \nFurther, for international transactions two central authorities were required.\
    \ For example, if US has to do trade with UK, there would be an owner of the ledger\
    \ in the US as well as in UK, calling for a central authority in both the countries. "
