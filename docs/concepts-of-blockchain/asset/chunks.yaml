  trans: '

    目前，一项名为 `Ethereum 2.0` 或 `Eth2` 的以太坊重大升级正在开源开发中。该升级的主要目标是将网络的交易吞吐量从目前每秒约 15 笔交易提高到每秒数万次。这是通过将工作负载拆分为许多并行运行的区块链（称为
    `sharding`，分片），然后让它们共享一个公共的共识 `Proof-of-Stake`（权益证明）区块链来实现。这样，要恶意篡改任何单一链，都需要篡改公共共识，这使得攻击者付出的成本远高于其通过攻击可能获得的任何收益。


    Ethereum 2.0 设计分三个阶段发布：


    - “阶段 0”被称为“信标链”（The Beacon Chain），已于 2020 年 12 月 1 日发布，创建了 `Beacon Chain`。这是一种
    `Proof-of-Stake` (`PoS`）区块链，将作为 `Ethereum 2.0` 的中央协调和共识枢纽。


    - “阶段 1”被称为“合并”（The Merge），将 `Beacon Chain` 与当前的以太坊网络合并，将其共识机制从 `PoW` 转换为 `PoS`。预计在
    2022 年下半年发布。


    - “阶段 2”被称为“分片链”（Shard chains），将在分片链中实现状态执行，当前的 `Ethereum 1.0` 链预计将成为 `Ethereum
    2.0` 的分之一。`Shard chains` 将网络负载分散到 64 条新链上。预计在 2022 年发布。


    ## 设计概述


    以太坊是一个无许可、非层次结构的计算机网络（`nodes`），这些节点在区块链上构建并对不断增长的系列“区块”达成共识。每个区块都包含一个链标识符，如果该区块被视为有效，则必须有先前的区块。每当节点向其链中添加区块时，它会按顺序执行其中的交易，从而更改以太坊账户的
    `ETH` 余额和其他存储值。这些余额和值统称为 `state`（状态），维护在节点的计算机上，与区块链独立存储于 `Merkle tree`（梅克尔树）中。


    每个节点与网络中一个较小的子集通信，称为其 `peers`（节点对）。每当节点想要在区块链中包含一个新交易时，它会将交易发送给其 `peers`，然后这些
    `peers` 再发送给它们的 `peers`，以此此类推。通过这种方式，交易在整个网络中传播。被称为 `miners`（矿工）的节点维护所有这些新交易的列表并用它们创建新区块，然后发送到网络的其他部分。每当节点接收到区块时，它会检查区块及其所有交易的有效性，如果有效，则将其添加到区块链并执行所有这些交易。由于网络是非层次结构的，节点可能会接收到竞争区块，这可能会形成竞争链。网络通过遵循“最长规则”在区块链上达成共识，该规则规定在任何给定时刻区块最多的链就是规范链。该规则之所以能达成共识是因为矿工不想花费计算工作尝试向一条将被网络抛弃的链添加区块。


    ## Ether


    Ether (`ETH`) 是以太坊协议生成的加密货币，作为矿工在 `Proof-of-Work`（工作量证明）系统中为区块链添加区块的奖励。它是支付交易手续的唯一接受货币，这些费用也支付给矿工。区块奖励加交易费用提供了激励。Ether
    的计量单位为：


    - `wei`

    - `gwei`

    - `kwei`

    - `ether`

    - `szabo`

    - `finney`

    - `robin`

    - `btc`

    - `bitcoin`

    - `ethereum`

    - `Nxt`

    - `0x`

    - `ECDSA`

    - `hash`

