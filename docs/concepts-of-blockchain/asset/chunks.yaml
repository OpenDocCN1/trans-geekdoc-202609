  trans: "\n\n花费比特币所需的凭据可以通过几种不同的方式离线存储，从专门的硬件钱包到私钥的简单纸质打印。\n\n- **纸钱包** – 纸钱包是在没有连接互联网的计算机上生成密钥对创建的；将私钥写入或打印在纸上，然后从计算机中删除。此纸质钱包可以存储在安全的物理位置以备日后提取。纸钱包可以在\
    \ `bitcoinpaperwallet.com` / `bitaddress.org` 等网站上生成。这些网站要求在断开计算机网络后，下载整个网站并在本地运行程序。它们还警告了可能会缓存文件或被攻击的智能打印机和操作系统。物理钱包也可以以金属代币的形式存在，其私钥可以通过位于背面凹槽处、的安全全息膜下进行访问。当安全全息膜从代币上移除时，它会自毁，从而表明私钥已被访问。\n\
    \n- **硬件钱包** – 硬件钱包是一种计算机外设，根据用户请求对交易进行签名。硬件钱包存储私钥，并在受信任的执行环境中执行签名和加密，该环境独立于计算机运行且从不接触互联网。因此，除了已经数字签名的交易外，它们不会与主机计算机共享任何敏感信息。因为硬件钱包从不暴露其私钥，即使可能被恶意软件感染的计算机也没有访问或窃取它们的途径。用户在设置硬件钱包时会设置密码。由于硬件钱包具有防篡改性，提取任何资金都需要密码。硬件钱包的示例包括\
    \ `Ledger`、`Trezor`、`Case` 和 `Keep Key`，这些设备通过 `USB` 连接到计算机以对交易进行数字签名。\n\n为了增强安全性进一步减少他人发现你私钥的概率，可以使用密钥伸展（key\
    \ stretching），即对钱包进行多次哈希处理。攻击者不仅必须猜测初始密码，还必须猜测哈希了多少次，这使得猜测私钥的难度呈指数级增长。\n\n## 轻量级钱包机制\n\
    \n在轻量级或第三方客户端的情况下，你不需要下载整个比特币区块链。你可以利用简单支付验证 (`SPV`）方法，通过仅下载每个区块的头部而不是整个区块，来验证交易是否包含在区块中。这对于受存储容量限制的客户端非常有用，因为不需要存储完整的区块链。\n\
    \n在使用 `SPV` 时，你需要做的一个假设是传入的区块头部不是来自虚链。如果区块头部是伪造或来自虚链，那么你认为有效的交易可能并非如此，有人可以对进行双重花费。然而，只要你连接到多个节点，每个节点被恶意实体控制的概率就非常低。\n\
    \n## 钱包备份\n\n- **JBOK 钱包** – 如果你有多个密钥，如何管理它们，特别是当你频繁在比特币上进行交易时？跟踪密钥的传统方法是通过 `JBOK`（Just\
    \ a Bunch of Keys，一组密钥）钱包。`JBOK` 钱包是一种比特币钱包，它根据用户需要随机生成新的、不相关的密钥。`JBOK` 钱包是比特币区块链上引入的早期钱包，但证明使用非常麻烦，因为用户必须存储每一个密钥对。\n\
    \n- **分层确定性 (HD) 钱包** – 分层确定性 (`HD`) 钱包是描述一种使用种子（seed）派生公钥和私钥的钱包术语。`HD` 钱包可以通过存储单个\
    \ `64 bytes` 的种子进行备份。分层一词描述了密钥的树形结构：钱包种子派生出一个主密钥，主密钥用于派生子密钥，每个子密钥都可以派生它们自己的后代。树中的每个子密钥都可以通过其派生路径描述，该路径包含密钥深度和索引的信息——即它在树形结构中的位置。派生路径告诉钱包如何派生特定的密钥。\n\
    \n## 比特币挖矿\n\n比特币挖矿是通过计算机计算能力完成的记录服务。矿工通过反复将新广播的交易分组为一个区块，然后将区块广播到网络并由接收节点验证，从而保持区块链的一致性完整性和不可篡改。每个区块都包含上一个区块的\
    \ `SHA-256` 加密哈希，因此将其与上一个区块链接，并赋予了区块链名称。\n\n比特币挖矿的步骤如下：\n\n1. **步骤 0**: 初步步骤是下载整个比特币区块链。这让矿工了解比特币历史，以便他能够验证未来的交易。这被称为\
    \ `步骤 0` 有两个原因：\n    - 它只需要执行一次。一旦矿工拥有完整的比特币区块链历史，他就不需要再次下载它。他只需要跟踪来自其他矿工的传入区块。\n\
    \    - 此外，拥有 `SPV` 节点的矿工只需要存储区块头部并向全节点请求信息以验证交易。这意味着这一步是可选的。\n\n2. **步骤 1**: 这一步是验证网络中的有效交易。比特币用户不断向比特币网络发送新交易，矿工的职责是验证所有这些交易。\n\
    \    当矿工接收交易时，他们将其存储在 `mempool`（内存池）中，`mem` 表示内存，`pool` 表示交易供应。所有待处理交易在进入区块之前都存储在\
    \ `mempool` 中。然后矿工根据交易费用选择要验证的交易，并通过通过运行解锁脚本来验证交易的有效性。该脚本成功解锁之前的比特币，交易随后通过。\n\n\
    3. **步骤 2**: 验证交易后，是时候生成一个包含这些交易的区块了。构建区块需要几项信息；例如从交易列表生成的 `Merkle Root`（梅克尔根）、`hash`、`time-stamp`（戳）、`version`（版本）和目标地址。\n\
    \    ```\n    (Images/image0253.gif)\n    ```\n    - **步骤 3**: 这一步涉及工作量证明 (`PoW`)，通过寻找名为\
    \ `nonce`（一次性数字）的数字来解决部分原像哈希谜题。这个 `nonce` 使区块头的哈希小于某个目标值（当区块内容与 `nonce` 一起哈希时，结果在数值上小于网络难度目标）。\n\
    \    ```\n    (Images/image0254.gif)\n    ```\n    通过找到 `nonce`，矿工将他在计算中消耗的能量直接转化为\
    \ `PoW` 共识协议的投票权。\n\n    - **步骤 4**: 找到 `nonce` 后，矿工尽快向整个网络广播他的区块（如果任何竞争对手尚未广播他们的区块），并让其他矿工意识到发现了一个新区块。这些矿工在将其接受到自己的区块链之前会对其进行验证，然后再次广播。通过广播此区块，其他矿工会放弃之前的区块，并开始在这个新的最长链上挖矿。\n\
    \    ```\n    (Images/image0255.gif)\n    ```\n    所有模式的区块广播；来源 – CB Insights\n\
    \n    - **步骤 5**: 一旦 `P-W` 被网络验证，区块将被附加到最长链上。一旦发生这种情况，矿工获得区块奖励，由 coinbase 交易和交易费表示。该区块内的所有交易都被添加到交易历史中，矿工获得一些比特币作为利润。\n\
    \n"
- fmt: "\nA situation can arise when 2 blocks, that were submitted to the network\
    \ at the same time, are competing with one another. In this case, the miners chose\
    \ randomly between the  blocks. Also if the block is orphaned or not in the longest\
    \ chain, then the miner gets no profit.\n\nThis proof is easy for any node in\
    \ the network to verify, but extremely time-consuming to generate, as for a secure\
    \ cryptographic hash, miners must try many different `nonce` values before a result\
    \ happens to be less than the difficulty target. By adjusting this difficulty\
    \ target, the amount of work needed to generate a block can be changed. Every\
    \ 2,016 blocks (approximately 14 days given roughly 10 minutes per block), nodes\
    \ deterministically adjust the difficulty target based on the recent rate of block\
    \ generation, with the aim of keeping the average time between new blocks at ten\
    \ minutes. In this way the system automatically adapts to the total amount of\
    \ mining power on the network.\n\nThe proof-of-work system, alongside the chaining\
    \ of blocks, makes modifications of the blockchain extremely hard, as an attacker\
    \ must modify all subsequent blocks in order for the modifications of one block\
    \ to be accepted. As new blocks are mined all the time, the difficulty of modifying\
    \ a block increases as time passes and the number of subsequent blocks (also called\
    \ confirmations of the given block) increases.\n\n### Mining Incentives\n\nAny\
    \ type of incentive mechanism withing the blockchain protocol aligns personal\
    \ profit with overall profit. Every miner in the network is trying to maximize\
    \ the value of his profit.\n\n`Bitcoin Profit = Bitcoin Revenue – Bitcoin Cost`\n\
    \n`Bitcoin Revenue = Block Reward + Transaction Fees`\n\n`Bitcoin Cost = Fixed\
    \ Cost + Variable Cost`\n\n- **Block Reward** – `Block Reward` is the most significant\
    \ source of revenue for the Bitcoin miners. It is the reward that the miner gets\
    \ once his block is included in the longest chain.\n\nSince the maximum number\
    \ of bitcoins that can be is 21 million, and new blocks are created approximately\
    \ every 10 minutes, so by design the number of bitcoins minted per block is reduced\
    \ by 50% after every 210,000 blocks, or about once every four years. The `Block\
    \ Reward` was 50 Bitcoins when Bitcoin was first established, and has since decreased\
    \ to 6.25 Bitcoins as of May 2020.\n\nThe miner includes a special transaction\
    \ to themselves, the `coinbase transaction`. It allows for minting of Bitcoins,\
    \ as well as incentivizing honest actors to validate blocks. Because miners get\
    \ rewarded for adding new blocks, they are incentivized to produce more blocks.\n\
    \n- **Transaction Fees** – Every Bitcoin transaction spends 0 or more Bitcoins\
    \ to 0 or more recipients. The difference between the amount being spent and the\
    \ amount being received is the `transaction fee`. Bitcoin's design makes it easy\
    \ and efficient for the spender to specify how much fee to pay, whereas it would\
    \ be harder and less efficient for the recipient to specify the fee, so by custom\
    \ the spender is almost solely responsible for paying all necessary Bitcoin transaction\
    \ fees. When a miner creates a block, he is entitled to specify where all the\
    \ fees paid by the transactions in that block should be sent. If the transaction\
    \ results in a valid block that becomes a part of the longest block chain, the\
    \ fee income will be sent to the specified recipient. If a valid block does not\
    \ collect all available fees, the amount not collected are permanently destroyed.\n\
    \n- **Fixed Costs** – The cost of the hardware, that allows users to mine Bicoins,\
    \ is the fixed cost. There are different types of hardware ranging from computation\
    \ devices to computation devices.\n- **CPU (Central Processing Unit)**: The first\
    \ type of hardware.\n- **GPU (Graphic Processing Unit)**: The next type of hardware.\n\
    - **FPGA (Field Programmable Gate Arrays)**: The third type of hardware.\n- **ASICS\
    \ (Application Specific Circuits)**: The fourth type of hardware. \n\n- **Operational\
    \ Costs** – The main component of the operational cost is the energy cost. There\
    \ are three type of energy: embodied energy, electricity, and cooling. On top\
    \ of that, there is infrastructure and overhead as well, such as rental cost and\
    \ employee salary.\n\n### ASICS\n\nBitcoin mining `Application Specific Circuits\
    \ (ASICs)` are highly specialized and powerful computers used to mine Bitcoin.\
    \ Nowadays, all the standard mining farms consist of `ASICs`. Otherwise, it is\
    \ never profitable.\n\n![](Images/image0256.jpeg)\n\nBitcoin ASICS Mining Farm;\
    \ Source: Bitcoin.com\n\nThe above picture illustrates that Bitcoin mining has\
    \ become very industrial, in order to reduce costs and thereby increase profits.\
    \ The racks are for systematic allocation of hardware, and the giant fans above\
    \ the racks are for cooling. There are 2 methods of cooling: water cooling and\
    \ air cooling. Water cooling is more expensive and offers better maintenance of\
    \ hardware. In order to reduce the cost, miners choose places where the climate\
    \ is cold and where the electricity costs are low.\n\nOne of the most powerful\
    \ Bitcoin `ASICS` is `Antminer S9`, with the capacity of 14 trillion hashes per\
    \ second. Its production company, `BITMAN`, claims that `Antminer S9` has provided\
    \ ~70% of the world’s mining power. However, even with such strong device it takes\
    \ considerable time to find a block.\n\n### Mining Pool\n\nA mining pool is a\
    \ joint group of cryptocurrency miners who combine their computational resources\
    \ over a network to increase the probability of finding a block. Hence, mining\
    \ pools allow these miners to join their hash power together. If the mining pool\
    \ is successful and receives a reward, that reward is divided among participants\
    \ in the pool. These rewards are usually divided between the miners who contributed,\
    \ according to the proportion of each miner's processing power or work relative\
    \ to the whole group. In some cases, individual miners must show `PoW` to receive\
    \ their rewards.\n\nMining pools are run by a pool manager, that takes care of\
    \ running a full Bitcoin node and distributing jobs to the miners. The pool manager\
    \ also takes a cut in rewards as compensation. This way, miners don’t even have\
    \ to store the blockchain themselves: they give the mining pool access to their\
    \ hardware in exchange for a share of profit from the mining pool.\n"
  raw: "A situation can arise when 2 blocks, that were submitted to the network at\
    \ the same time, are competing with one another. In this case, the miners chose\
    \ randomly between the 2 blocks. Also if the block is orphaned or not in the longest\
    \ chain, then the miner gets no profit.\n\nThis proof is easy for any node in\
    \ the network to verify, but extremely time-consuming to generate, as for a secure\
    \ cryptographic hash, miners must try many different nonce values before a result\
    \ happens to be less than the difficulty target. By adjusting this difficulty\
    \ target, the amount of work needed to generate a block can be changed. Every\
    \ 2,016 blocks (approximately 14 days given roughly 10 minutes per block), nodes\
    \ deterministically adjust the difficulty target based on the recent rate of block\
    \ generation, with the aim of keeping the average time between new blocks at ten\
    \ minutes. In this way the system automatically adapts to the total amount of\
    \ mining power on the network. \n\nThe proof-of-work system, alongside the chaining\
    \ of blocks, makes modifications of the blockchain extremely hard, as an attacker\
    \ must modify all subsequent blocks in order for the modifications of one block\
    \ to be accepted. As new blocks are mined all the time, the difficulty of modifying\
    \ a block increases as time passes and the number of subsequent blocks (also called\
    \ confirmations of the given block) increases.\n\nMining Incentives\n\nAny type\
    \ of incentive mechanism withing the blockchain protocol aligns personal profit\
    \ with overall profit. Every miner in the network is trying to maximize the value\
    \ of his profit. \n\nBitcoin Profit = Bitcoin Revenue – Bitcoin Cost\n\nBitcoin\
    \ Revenue = Block Reward + Transaction Fees\n\nBitcoin Cost = Fixed Cost + Variable\
    \ Cost\n\n*   Block Reward – Block Reward is the most significant source of revenue\
    \ for the Bitcoin miners. It is the reward that the miner gets once his block\
    \ is included in the longest chain.\n\nSince the maximum number of bitcoins that\
    \ can be is 21 million, and new blocks are created approximately every 10 minutes,\
    \ so by design the number of bitcoins minted per block is reduced by 50% after\
    \ every 210,000 blocks, or about once every four years. The Block Reward was 50\
    \ Bitcoins when Bitcoin was first established, and has since decreased to 6.25\
    \ Bitcoins as of May 2020.\n\nThe miner includes a special transaction to themselves,\
    \ the coinbase transaction. It allows for minting of Bitcoins, as well as incentivizing\
    \ honest actors to validate blocks. Because miners get rewarded for adding new\
    \ blocks, they are incentivized to produce more blocks.\n\n*   Transaction Fees\
    \ – Every Bitcoin transaction spends 0 or more Bitcoins to 0 or more recipients.\
    \ The difference between the amount being spent and the amount being received\
    \ is the transaction fee. Bitcoin's design makes it easy and efficient for the\
    \ spender to specify how much fee to pay, whereas it would be harder and less\
    \ efficient for the recipient to specify the fee, so by custom the spender is\
    \ almost always solely responsible for paying all necessary Bitcoin transaction\
    \ fees. When a miner creates a block, he is entitled to specify where all the\
    \ fees paid by the transactions in that block should be sent. If the transaction\
    \ results in a valid block that becomes a part of the longest block chain, the\
    \ fee income will be sent to the specified recipient. If a valid block does not\
    \ collect all available fees, the amount not collected are permanently destroyed.\n\
    \n*   Fixed Costs – The cost of the hardware, that allows users to mine Bicoins,\
    \ is the fixed cost. There are different types of hardware ranging from computation\
    \ devices to specialized mining farms. The first type of mining hardware is the\
    \ CPU (Central Processing Unit). As of late 2021, mining with CPU would take more\
    \ than 10 million years to find a block. This is because there are much more powerful\
    \ hardware, and it makes extremely hard for CPU to compete with them. The next\
    \ type of hardware is GPU (Graphic Processing Unit). These devices are used for\
    \ processing media and are also generic computation devices. They can hash 10\
    \ times faster than the CPU. It would take GPU ~ 1 million years to find a block.\
    \ The third type of hardware is FPGA (Field Programmable Gate Arrays). They were\
    \ the first specialized mining hardware and were optimized for mining Bitcoin.\
    \ However FPGA were only used briefly as much powerful hardware came into the\
    \ market in 2014. The fourth type of hardware is ASICS (Application Specific Integrated\
    \ Circuits). They are fully specialized devices that only do Bitcoin mining. They\
    \ can be heavily customized, ranging from choosing a lower base cost to higher\
    \ electricity usage, or choosing a smaller device for a lower hash-rate. They\
    \ have high upfront cost and need to be purchased in tremendous batches to make\
    \ a reasonable profit. \n\n*   Operational Costs – The main component of the operational\
    \ cost is the Energy cost. There are different type of costs of energy consumed\
    \ in the process of Bitcoin mining, all of which are considerations for the cost\
    \ of mining Bitcoin. There are three type of energy costs: Embodied energy is\
    \ consumed to produce hardware, electricity is used to power hardware, and cooling\
    \ is used to maintain hardware as it heats up. The electricity and the cooling\
    \ are the variable energy costs that constitute the major portion of the operating\
    \ cost. On top of that, there is infrastructure and overhead to maintain as well,\
    \ such as rental cost and employee salary cost. \n\nASICS\n\nBitcoin mining Application\
    \ Specific Integrated Circuits (ASICs) are highly specialized and powerful computers\
    \ used to mine Bitcoin. Nowadays, all the standard Bitcoin mining farms consist\
    \ of ASICs. Otherwise, it is never profitable. \n\n![](Images/image00256.jpeg)\n\
    \nBitcoin ASICS Mining Farm; Source: Bitcoin.com\n\nThe above picture illustrates\
    \ that Bitcoin mining has become very industrial, in order to reduce costs and\
    \ thereby increase profits. The racks are for systematic allocation of hardware,\
    \ and the giant fans above the racks are for cooling. There are 2 methods of cooling:\
    \ water cooling and air cooling. Water cooling is more expensive and offers better\
    \ maintenance of hardware. In order to reduce the cost, miners choose places where\
    \ the climate is cold and where the electricity costs are low.\n\nOne of the most\
    \ powerful Bitcoin ASICS is Antminer S9, with the capacity of 14 trillion hashes\
    \ per second. Its production company, BITMAN, claims that Antminer S9 has provided\
    \ ~ 70% of the world’s mining power in hardware. However, even with such strong\
    \ device it takes considerable time to find a block.\n\nMining Pool\n\nA mining\
    \ pool is a joint group of cryptocurrency miners who combine their computational\
    \ resources over a network to increase the probability of finding a block. Hence,\
    \ mining pools allow these miners to join their hash power together. If the mining\
    \ pool is successful and receives a reward, that reward is divided among participants\
    \ in the pool. These rewards are usually divided between the miners who contributed,\
    \ according to the proportion of each miner's processing power or work relative\
    \ to the whole group. In some cases, individual miners must show PoW to receive\
    \ their rewards.\n\nMining pools are run by a pool manager, that takes care of\
    \ running a full Bitcoin node and distributing jobs to the miners. The pool manager\
    \ also takes a cut in rewards as compensation. This way, miners don’t even have\
    \ to store the blockchain themselves: similar to cloud computing, they give the\
    \ mining pool access to their hardware in exchange for a share of profit from\
    \ the mining pool."
