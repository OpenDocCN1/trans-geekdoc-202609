  raw: "Open-source development is currently underway for a major upgrade to Ethereum\
    \ known as Ethereum 2.0 or Eth2. The main purpose of the upgrade is to increase\
    \ transaction throughput for the network from the current of about 15 transactions\
    \ per second to up to tens of thousands of transactions per second, by splitting\
    \ up the workload into many blockchains running in parallel (referred to as sharding)\
    \ and then having them all share a common consensus Proof-of-Stake blockchain,\
    \ so that to maliciously tamper with any singular chain would require one to tamper\
    \ with the common consensus, which would cost the attacker far more than they\
    \ could ever gain from an attack.\n\nEthereum 2.0 is designed to be launched in\
    \ three phases:\n\n*   \"Phase 0\" also known as \"The Beacon Chain\" was launched\
    \ on 1 December 2020 and created the Beacon Chain, a Proof-of-Stake (PoS) blockchain\
    \ that will act as the central coordination and consensus hub of Ethereum 2.0.\n\
    \n*   \"Phase 1\" also known as \"The Merge\" will merge the Beacon Chain with\
    \ the current Ethereum network, transitioning its consensus mechanism from PoW\
    \ to PoS. It is expected to be released in the first half of 2022.\n\n*   \"Phase\
    \ 2\" also known as \"Shard chains\" will implement state execution in the shard\
    \ chains with the current Ethereum 1.0 chain expected to become one of the shards\
    \ of Ethereum 2.0. Shard chains will spread the network's load across 64 new chains.\
    \ It is expected to be released in 2022.\n\nDesign Overview\n\nEthereum is a permissionless,\
    \ non-hierarchical network of computers (nodes) which build and come to consensus\
    \ on an ever-growing series of \"blocks\" in the blockchain. Each block contains\
    \ an identifier of the chain that must precede it if the block is to be considered\
    \ valid. Whenever a node adds a block to its chain, it executes the transactions\
    \ therein in their order, thereby altering the ETH balances and other storage\
    \ values of Ethereum accounts. These balances and values, collectively known as\
    \ the state, are maintained on the node's computer separately from the blockchain,\
    \ in a Merkle tree.\n\nEach node communicates with a relatively small subset of\
    \ the network, known as its peers. Whenever a node wishes to include a new transaction\
    \ in the blockchain, it sends the transaction to its peers, who then send it to\
    \ their peers, and so on. In this way, it propagates throughout the network. Certain\
    \ nodes, called miners, maintain a list of all these new transactions and use\
    \ them to create new blocks, which they then send to the rest of the network.\
    \ Whenever a node receives a block, it checks the validity of the block and of\
    \ all the transactions therein and, if valid, adds it to its blockchain and executes\
    \ all of said transactions. As the network is non-hierarchical, a node may receive\
    \ competing blocks, which may form competing chains. The network comes to consensus\
    \ on the blockchain by following the \"longest-chain rule\", which states that\
    \ the chain with the most blocks at any given time is the canonical chain. This\
    \ rule achieves consensus because miners do not want to expend their computational\
    \ work trying to add blocks to a chain that will be abandoned by the network.\n\
    \nEther\n\nEther (ETH) is the cryptocurrency generated by the Ethereum protocol\
    \ as a reward to miners in a Proof-of-Work system for adding blocks to the blockchain.\
    \ It is the only currency accepted in the payment of transaction fees, which also\
    \ go to miners. The block reward together with the transaction fees provide the\
    \ incentive to miners to keep the blockchain growing. Each Ethereum account has\
    \ an ETH balance and may send ETH to any other account. There is currently no\
    \ implemented hard cap on the total supply of Ether. The denominations of Ether\
    \ are as follows:\n\n*   1: wei\n\n*   10^12: szabo\n\n*   10^15: finney\n\n*\
    \   10^18: ether\n\nThe issuance model was as follows:\n\n*   Ether released in\
    \ a currency sale at the price of 1000-2000 Ether per BTC, a mechanism intended\
    \ to fund the Ethereum organization and pay for development that has been used\
    \ with success by other platforms such as Mastercoin and NXT. The Bitcoin received\
    \ from the sale used entirely to pay salaries and bounties to developers and invested\
    \ into various for-profit and non-profit projects in the Ethereum and cryptocurrency\
    \ ecosystem.\n\n*   0.099x the total amount sold (60102216 ETH) allocated to the\
    \ organization to compensate early contributors and pay Ether denominated expenses\
    \ before the genesis block.\n\n*   0.099x the total amount sold maintained as\
    \ a long-term reserve.\n\n*   0.26x the total amount sold allocated to miners\
    \ per year forever after that point.\n\n| Group || At launch || After 1 year ||\
    \ After 5 years |\n\n| --- | --- | --- | --- |\n\n| Currency units || 1.198X ||\
    \ 1.458X || 2.498X |\n\n| Purchasers || 83.5% || 68.6% || 40% |\n\n| Reserve spent\
    \ pre-sale || 8.26% || 6.79% || 3.96% |\n\n| Reserve used post-sale || 8.26% ||\
    \ 6.79% || 3.96% |\n\n| Miners || 0% || 17.8% || 52% |\n\n![Ethereum inflation](Images/image00259.jpeg)\n\
    \nDespite the linear currency issuance, just like with Bitcoin over time the supply\
    \ growth rate nevertheless tends to zero;\n\n Source – Ethereum.org/whitepaper/\n\
    \nAddresses\n\nEthereum addresses are composed of the prefix \"0x\", a common\
    \ identifier for hexadecimal, concatenated with the rightmost 20 bytes of the\
    \ 256 hash of ECDSA public key. In hexadecimal, two digits represent a byte, meaning\
    \ addresses contain 40 hexadecimal digits. Contract addresses are in the same\
    \ format, however, they are determined by sender and creation transaction nonce.\n\
    \nEthereum vs. Bitcoin\n\nEthereum and Bitcoin are the two most popular blockchain\
    \ platforms in the world today. However, both have different goals. Bitcoin is\
    \ the “gold standard” of blockchain. It has been around for the longest time,\
    \ and its protocol has successfully supported an enormous number of transactions\
    \ over the years. It’s intended purpose is solely to allow the transaction of\
    \ Bitcoins. On the other hand, Ethereum is a Smart contract blockchain platform,\
    \ a distributed world computer. Its native asset Ether exists to fund computation\
    \ and to align incentives. Its primary purpose is not to act as a medium of exchange.\
    \ \n\nBitcoin is a global payment system. Ethereum has a much larger vision, and\
    \ therefore supports many more features, like a much more powerful scripting language.\
    \ Moreover, Bitcoin has a stack based primitive scripting language which is not\
    \ Turing complete, meaning that the applications made on the Bitcoin platform\
    \ are pretty limited. Ethereum on the other hand has a Turing-complete scripting\
    \ language. So a wider variety of applications can be made on Ethereum platform\
    \ compared to Bitcoin, making it more developers’ friendly. \n\nAnother key difference\
    \ is that Bitcoin is UTXO based, whereas Ethereum is account based.\n\nIn Bitcoin,\
    \ private keys prove ownership of UTXOs. Whenever you spend your Bitcoin, you\
    \ spend from previous transactions. And to calculate your current balance, you\
    \ have to sum up all the UTXOs you own. The reason Bitcoin uses UTXOs is for easier\
    \ transactions and to avoid double spending. \n\nIn Ethereum, private keys prove\
    \ ownership of an account, which tracks the current balance. Accounts are made\
    \ more space efficient than UTXOs, since to calculate your balance, you only need\
    \ to reference to your account, rather than summing up all your UTXOs. Also, since\
    \ the ultimate goal is to support smart contracts, it is much cheaper and easier\
    \ to look up an account balance, and transfer between accounts using an account\
    \ model rather than a UTXO model.\n\n## Ethereum Design\n\nThe intent of Ethereum\
    \ is to create a protocol for building decentralized applications, providing a\
    \ different set of tradeoffs that are very useful for a large class of decentralized\
    \ applications, with particular emphasis on situations where rapid development\
    \ time, security for small and rarely used applications, and the ability of different\
    \ applications to very efficiently interact, are important. "
