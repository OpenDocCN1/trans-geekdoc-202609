    \ to the Bitcoin protocol\n\n# Blockchain based cryptocurrency – Ethereum \n\n\
    After Bitcoin, the next most popular blockchain platform in Ethereum. \n\nIn this\
    \ chapter, we will discuss Ethereum and its history. We will learn about smart\
    \ contracts and how they are enabled by Ethereum. We will gain an insight on Ethereum\
