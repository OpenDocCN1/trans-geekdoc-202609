- fmt: '

    In Bitcoin, private and public keys are generates through Elliptic Curve Digital
    Signature Algorithm (`ECDSA`). Elliptic-curve cryptography (`ECC`) is an approach
    to public-key cryptography based on the algebraic structure of elliptic curves
    over finite fields. ECC allows smaller keys compared to non-EC cryptography (based
    on plain Galois fields) to provide equivalent security. ECDSA offers a variant
    of the Digital Signature Algorithm (`DSA`) which uses elliptic curve cryptography.


    An elliptic curve is a mathematical curve defined by the equation:


    ```text

    y^2 = x^3 + ax + b

    ```


    It is defined over a finite field to encode every value possible in a defined
    amount of space, so as to limit the key size.


    There are certain unique properties of elliptic curves that help in creating a
    one-way function to generate public key from private keys, and not vice versa.


    Suppose you want to send a your friend a signed message. Initially you both must
    agree on the curve parameters, as below:


    *   `Curve` – The elliptic curve field and equation used

    *   `G` – Elliptic curve base point, a point on the curve that generates a subgroup
    of large prime order `n`

    *   `n` – Integer order of `G`, means that `n * G = O`, where `O` is the identity
    element

    *   `dA` – The private key (randomly selected)

    *   `QA` – The public key (calculated by elliptic curve)

    *   `m` – The message to send


    You will create a key pair, consisting of a private key integer `dA`, randomly
    selected in the interval; and a public key curve point `QA = dA * G`. You need
    to follow the following steps to send the message:


    1.  Calculate hash of the message `m`

    2.  Let `z` be the `Ln` leftmost bits of `e`, where `Ln` is the bit length of
    the group order `n`

    3.  Select a cryptographically secure random integer `k` from `[1,n-1]`

    4.  Calculate the curve point `(x1, y1) = k * G`

    5.  Calculate `r = x1 mod n`. If `r = 0`, go-to step 3

    6.  Calculate `s = k^(-1) * (z + rdA) mod n`. If `s = 0`, go-to step 3

    7.  The signature is the pair `(r,s)`


    For your friend to authenticate your signature, he must have a copy of your public-key
    curve point `QA`, and can verify it as a valid curve point as follows:


    1.  Check that `QA` is not equal to the identity element `O`, and its coordinates
    are otherwise valid

    2.  Check that `QA` lies on the curve

    3.  Check that `n * QA = O`


    After that, he needs to follow these steps:


    1.  Verify that `r` and `s` are integers in `[1,n-1]`. If not, the signature is
    invalid.

    2.  Calculate hash of the message `m`, where `hash` is the same function used
    in the signature generation.

    3.  Let `z` be the `Ln` leftmost bits of `e`.

    4.  Calculate `u1 = zs^(-1) mod n` and `u2 = zs^(-1) mod n`

    5.  Calculate the curve point `(x1, y1) = u1 * G + u2 * QA`. If `(x1, y1) = O`,
    then the signature is invalid.

    6.  The signature is valid if `r = x1 (mod n)`, invalid otherwise.


    As with elliptic-curve cryptography in general, the bit size of the public key
    believed to be needed for ECDSA is about twice the size of the security level,
    in bits. For example, at a security level of 80 bits, an attacker would require
    a maximum of about `2^80` operations to find the private key, the size of an ECDSA
    private key would be 160 bits, whereas the size of a DSA private key is at least
    1024 bits.


    Bitcoin elliptic curve is called `secp256k1`. It equation is `y^2 = x^3 +7`. It
    has taken over a finite field to limit the key size. This curve is specified by
    a couple of parameters, including the curve formula, the field, and a generator
    point. On this elliptic curve, we can do point additions using lines and points.
    To add 2 points `P` and `Q`, we draw a line through them, intersecting at a 3rd
    point `R` across the x-axis, yielding our result `P+Q`. This is a one-way function,
    because for a given point `K` that is `P + Q`, it is difficult to find the individual
    points `P` and `Q`.


    To send a Bitcoin transaction, a user generates a random number `n` for his private
    key, and use the elliptic curve `secp256k1` to his public key. To do so, he adds
    a known generator point `P` which is built into `secp256k1` specification, with
    itself `n` times. Given a public key `nP` it is computationally infeasible to
    get the private key, which makes the process for generating public key from private
    key secure.


    Then to generate the address, we hash the public key `nP` with `SHA-256` first,
    and then with another hash function called `RIPEMD-160`. `SHA-256` makes the address
    quantum resistant such that quantum computers cannot reverse the hash function.
    `RIPEMD-160` then shortens the address size from 256 bits to 160 bits. Together,
    the combination of using `SHA-256` and `RIOEMD-160` is called “double hash” or
    `HASH160`.


    After this, we have a public key hash. The next step is to make this public key
    hash more human friendly. First, we add a version byte in front of the previous
    `RIPEMD-160` hash, wherein we specify which network we are on: the main network
    or a smaller test network. We then run `Base58Check` encode, which converts this
    hash into `Base58` - an alphabet like the usual 62 character (A-Z, a-z, 0-9).
    `Base58` has all the digits 0 to 9 and all upper case lower case letters, except
    the capital and lower case `O`, and also the capital and lower case `I` to avoid
    ambiguity.


    Then we calculate a checksum.


    We perform `SHA-256d` on the extended `RIPEMD-160` hash, running `SHA-256` on
    it twice. We take the first 4 byte of `SHA-256d` as our checksum, and append it
    to the end of the extended `RIPEMD-160` hash. After converting this result to
    `Base58`, we finally get our Bitcoin address.


    In this address, we have successfully encoded the public key hash which allows
    people to pay us, a version byte that mentions which network we are on, and a
    checksum that accounts for any human error. If someone copies the wrong address,
    then the address will not be valid given the checksum.


    ![](Images/image00248.gif)


    ## Bitcoin Transaction Process


    For a transaction to be valid, it must have these three components


    *   A proof of ownership

    *   Sufficient funds

    *   These funds are used only for this transaction


    To enforce this, Bitcoin uses Unspent Transaction Output (`UTXO`) concept. A `UTXO`
    can be imagined as a box that contains Bitcoins and they can hold any amounts.
    Once you have some, in the Blockchain all you have is a bunch of `UTXOs`. For
    all practical purposes, you can think of your `UTXOs` as your box full of piggybanks.
    Lets assume you want to transfer your friend 5 Bitcoins, so you put these 5 Bitcoins
    into a `UTXO` (a piggybank). Once you make that transaction, you break open that
    piggybank, which cannot be restored again. The total amount of Bitcoin you own
    is summation of the value of all your `UTXOs`.

