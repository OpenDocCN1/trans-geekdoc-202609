    # Open source code – Computer code that describes a specific approach to creating
    software. When describing tools for distributing open source code. Discipline
    Tool states, open source initiatives embrace and celebrate principles of open
    exchange, collaborative participation, rapid prototyping, transparency and community-oriented
    development. Open source software is code that anyone can inspect, modify and
    enhance. Much of the internet was built on open source technologies. Users of
    the computer software never interact with the source code, rather it is manipulated
    by programmers who improve and fix it. As with proprietary software, users must
    accept the terms of license, but they are dramatically different structurally.
    `Linux` and `Kubernetes` are examples of open source software.


    Open source software fosters collaboration by sharing code and encouraging modifications
    and improvements. Instead of charging for the software program, software developers
    find it more lucrative to charge for service around developing and maintaining
    these open source projects.


    ## Benefits from Open Source Software


    Developing software in an open source environment means a willingness to share
    and collaborate in a transparent way.


    *   **Control** – To a developer, open source means an individual can contribute
    to the direction the code takes. This open participation means coders who participate
    the most have more influence over the direction of the code.

    *   **Training** – The ability to copy code and make your own changes in test
    environments act as invaluable hands-on training. This also fosters innovation
    as programmers can devise previously unthought-of functionality and code direction.

    *   **Security** – In open source, software programs are considered more secure
    because they are open to peer review where errors can be spotted. Coders are encouraged
    to test code, find errors and develop fixes to bugs as long as they follow the
    process the network has in place.

    *   **Stability** – Open source projects have a certain amount of code stability
    due to openness for public review. A publicly distributed source code is openly
    reviewed and can expose situations that may not have otherwise been tested.

    *   **Community** – Open source inspires the community to get involved. When contributing
    to an open source project, you join a community of people that ultimately affects
    the software you are interested in.


    The programming code for `Bitcoin`, `Ethereum`, `Hyperledger` and other blockchains
    is open source.


    ## Governance


    The Oxford English Dictionary defines governance as “the action or fact of governing
    a nation, a person, an activity, one''s desires, etc.; direction, rule; regulation.”
    A basic description of governance can be defined as a system by which behavior
    is directed. This direction is guided by a set of rules, and a mechanism to enforce
    these rules, which can take many forms from a dictator having complete control
    to a democratic governance model where the voice of the majority is recognized.


    In an economics context, governance is defined as “the use of institutions, structures
    of authority and collaboration to allocate resources and coordinate the effort
    and activity in society or in the economy”.


    On the other hand, from an IT perspective, governance is composed of the leadership
    and the set of structures and processes that guarantee that the IT of an organization
    provides support and extends the its strategy and objectives in a manner that
    is focused on achieving a better alignment between the business and IT. In other
    words, IT governance is a formal framework that provides a structure for organizations
    to ensure that technology investments support business objectives.


    Blockchain governance can be regarded as the integration of norms and culture,
    the laws and the code, the people and the institutions that facilitate coordination
    and together determine a given organization.


    ## Governance Models


    Blockchain governance models reflect a democratic flavor due to the open source
    environment. Blockchains are composed of a community of users who work together
    to strengthen the system. The degree in which the majority rules can vary


    *   **Representative democracy** – This type of governance has a few individuals,
    empowered by the community, to suggest new rules. The amount of authority the
    representative has is granted by the majority. The stakeholders in on-chain governance
    typically include users, developers, and transaction validators. For example,
    if you hold `MakerDAO`’s `MKR` token, you can vote on governance actions proposed
    by the Maker community through its decentralized autonomous organization (DAO).
    The representatives reflect the views of the community. Issues can occur when
    the majority opinion unevenly reflects the community, causing minority groups
    to be underserved. Also the assumption is that the representatives are acting
    in their best interests.

    *   **Direct democracy** – All decisions regarding the governance of the group
    are voted on by the entire community. In this form of governance model, every
    vote counts and people have more control. In this model, it is best to have an
    educated community where everyone is willing to participate. Every blockchain
    ecosystem needs some kind of governance model in place. As discussed in “Bitcoin
    and Blockchain Governance: What it is and Why it Matters” article by Evan Karnakis,
    in traditional systems, laws are made and then enforced. In blockchain, when participants
    (miners, developers, and users) in the network are interacting, they are acting
    in a way that is best for the group. Being able to build a governance structure
    in a decentralized system has proven to be very difficult.


    Most governance structure in the blockchain ecosystem are looking to achieve the
    following goals:


    *   Protocol changes and technical upgrades

    *   Critical bug and vulnerability fixes

    *   Using pooled funds for research and development


    These goals can be achieved through different methods of governance. When designing
    a blockchain, there are 2 major choices:


    *   **On-chain governance** – On-chain governance is a mechanism that enables
    a decentralized community to update a blockchain by voting directly on-chain.
    In the On-chain governance, the rules for instituting changes are encoded into
    the blockchain protocol. This means that any decision being made is automatically
    translated into the code. On-chain governance for a blockchain ecosystem typically
    takes place on Proof-of-Stake blockchains in the form of a vote, and you usually
    must hold the blockchain’s native coin to participate in its governance. The weight
    of your vote is determined by the number of coins you hold. On-chain governance
    widens the group of people who participate in blockchain governance processes,
    limits the threat of chain splits and forks, and allows individual users to register
    their input. Some on-chain governance systems do retain off-chain characteristics.
    For example, though proposals may be encoded in smart contracts, they are often
    still discussed in forums, blog posts, and on Twitter before they are voted upon.

