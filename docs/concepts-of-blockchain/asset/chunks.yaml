- fmt: "\nHowever, Scrypt has its drawbacks too. It requires an equal amount of memory\
    \ to verify, which is not ideal as the puzzles should be easy to verify. In addition,\
    \ even though `Scrypt` was developed to be ASIC resistant, an ASIC has actually\
    \ been developed for it.\n\nAnother idea to achieve ASIC resistance is to chain\
    \ a multiple hash functions together, as it is much harder to create an ASIC that\
    \ deals with multiple has function and not just one. This was the idea behind\
    \ `x11` and `x13`, which chain together 11 and 13 different hash functions. Another\
    \ idea to make ASIC resistant systems was to design coins that periodically switched\
    \ mining puzzles. Making it difficult to optimize. For example, switching from\
    \ `SHA-1` to `SHA-3` to `Scrypt` every month. However, the overhead cost to create\
    \ such an algorithm is very high and have deterred people from implementing it.\n\
    \nA counter argument to ASIC resistance is that since ASICs are designed solely\
    \ to solve a cryptographic puzzle, they are incapable of anything else. Miners\
    \ who own them are thus committed to the network. If a system with a large number\
    \ of miners switch from ASIC switches to an ASIC resistant environment, then the\
    \ exchange rate of `Bitcoin` will crash, and many miners will suddenly be left\
    \ with useless ASIC devices with no incentive to mine anymore.\n\n## Eliminating\
    \ Waste\n\nSince so much computational power is used to solve cryptographic puzzles,\
    \ for just finding random numbers, why not make puzzles which can do useful task.\
    \ For example, miners can search for large primes, stimulate proteins at atomic\
    \ level, look for aliens, or generate predictive climate models.\n\n| Project\
    \ | Founded | Goal | Impact |\n| --- | --- | --- | --- |\n| Great Internet Mersenne\
    \ Prime Search | 1996 | Finding large Mersenne primes | Found the new ‘largest\
    \ prime number’ 12 straight times |\n| Distributed.net | 1997 | Cryptographic\
    \ brute-force demos | First successful public brute-force of a 64 but cryptographic\
    \ key |\n| SETI | 1999 | Identifying signs of extraterrestrial life | Largest\
    \ project to date with over 5 million participants |\n\nThese problems could be\
    \ solved much faster by using the computational power of the `Bitcoin` network.\
    \ \n\nHowever, there are some issues. These distributed computing problems are\
    \ usually unsuitable for `PoW` and don’t work as cryptographic puzzles. There\
    \ is fixed amount of data in the system, leading to a finite number of solutions\
    \ to the problem. If someone finds a solution to a particular problem, what happens\
    \ then? or if there is not enough data to find a solution? These puzzles cannot\
    \ be used for `PoW` anymore.\n\nIn `Bitcoin`, since the puzzle is based on the\
    \ previous block, the problem space is inexhaustible. In contrast, if we use `SETI`\
    \ for our puzzle, we could run out of raw radio telescope data, leaving no problem\
    \ to solve. Let’s assume you are looking for planets in the space. One part of\
    \ the space can be more populated than others. However in the hash function of\
    \ `Bitcoin`, it’s on an average equally difficult to find a solution. \n\nLastly,\
    \ these problems are governed by central entities, as opposed to `Bitcoin`, whose\
    \ problems are created by its protocol. When we rely on a central entity to create\
    \ a problem, it opens up potential for collusion or exploitation.\n\nHence, `PoW`\
    \ is a great idea, but incredibly difficult to implement in real life scenarios.\n\
    \n## Consensus Updates\n\nThe idea behind a consensus update is that `Bitcoin`\
    \ is decentralized, no single entity can influence any updates in the protocol.\
    \ Everyone is the network has to agree and come to a consensus for an update to\
    \ happen.\n\nThis brings us to two ways that blockchains can be updated.\n\n*\
    \   **Hard forks** – A hard fork result from a new protocol that does things not\
    \ allowed in the old protocol. In other words, a hard fork is not backwards compatible.\
    \ For example, `Bitcoin Cash` increasing the block size from `1 Mb` to `8 Mb`.\
    \ The nodes on the old, legacy `Bitcoin` protocol are going to refuse the new\
    \ `8 Mb` blocks, leading to a permanent fork as shown in the figure.\n\n![](Images/image00257.gif)\n\
    \nThese 2 forks would then theoretically continue forever as long as both the\
    \ blockchains have support, and miners who continuously run the software.\n\n\
    *   **Soft forks** – In Soft forks, the rules of the new protocol are only restrained.\
    \ For example, if a new `Bitcoin` fork were to reduce the block size by half Mb,\
    \ then everything valid in the new protocol is still valid in the old protocol.\
    \ However, the old protocol’s blocks are no longer valid in the new protocol,\
    \ meaning that a soft fork is backward compatible but not forward compatible.\
    \ As shown in the figure, the new and old nodes will accept blocks from the new\
    \ protocol, but the old nodes will never have their blocks accepted into the longest\
    \ chain mined by the new nodes.\n\n![](Images/image00258.gif)\n\n## Bitcoin Improvement\
    \ Proposals (BIP)\n\nIn `Bitcoin`, changes to the protocols come in the form of\
    \ Bitcoin Improvement Proposals (`BIP`). These can be changes in the network protocol,\
    \ block or transaction validation, or anything affecting interoperability. Miners\
    \ vote on the `BIP` by including a reference to that `BIP` in the block they mine.\
    \ There are three type of BIPs:\n\n*   **Standard BIP** – An actual upgrade or\
    \ change to the `Bitcoin` protocol. This is how the `Bitcoin` ecosystem changes,\
    \ and what the miners vote on.\n*   **Informational BIP** – Guidelines on how\
    \ people should do things in future, but no change to the `Bitcoin` protocol\n\
    *   **Process BIP** – Specific best practices to the `Bitcoin` protocol\n\n# Blockchain\
    \ based cryptocurrency – Ethereum\n\nAfter `Bitcoin`, the next most popular blockchain\
    \ platform in `Ethereum`. \n\nIn this chapter, we will discuss `Ethereum` and\
    \ its history. We will learn about smart contracts and how they are enabled by\
    \ `Ethereum`. We will gain an insight on `Ethereum` design and how it is different\
    \ from `Bitcoin`. We will gain an insight on `Ethereum` mining and `Ethereum Virtual\
    \ Machine` (`EVM`). Finally, we will discuss on `Ethereum` use cases across industries\
    \ and the `Ethereum` ecosystem.\n\n`Bitcoin`'s primary use case is to store value\
    \ and as a digital currency. `Ethereum` was also created as a mode of payment\
    \ and to store value as a digital currency, however `Ethereum` network also makes\
    \ it possible to create and run decentralized applications and execute “peer-to-peer”\
    \ Smart Contracts.\n\n`Ethereum` platform allows anyone to deploy permanent and\
    \ immutable decentralized applications onto it, with which users can interact.\n\
    \n*   This enables people to deploy Decentralized finance (`DeFi`) applications\
    \ onto the `Ethereum` platform and provide variety of financial services without\
    \ the need for intermediaries like brokerages, exchanges, or banks.\n*   `Ethereum`\
    \ also allows for the creation and exchange of Non Fungible Tokens (`NFTs`), which\
    \ can be used to buy /sell digital products, digital media, digital art, or any\
    \ other real-world items sold as a unique digital property.\n*   `Ethereum` platform\
    \ also offers other cryptocurrencies to operate as `ERC-20` tokens on top of the\
    \ `Ethereum` blockchain.\n\n`Ether`, the native cryptocurrency of the `Ethereum`\
    \ platform, is second only to `Bitcoin` in market capitalization.\n\n## Smart\
    \ Contracts\n\nA “contract” is a written or spoken agreement that is intended\
    \ to be enforced by law. For a contract to be valid, it must be agreed upon. Hence,\
    \ a contract is in itself a consensus mechanism. Through consensus, all the parties\
    \ involved in the contract should be able to agree upon the contents of the contract,\
    \ as well as its execution.\n\nWhat makes a contract smart?\n\nA smart contract\
    \ is a self-executing contract with the terms of the agreement between buyer and\
    \ seller being directly written into lines of code. This code facilitates, verifies,\
    \ and enforces the execution of the contract. The code and the agreements contained\
    \ therein exist across a distributed, decentralized blockchain network. The code\
    \ controls the execution, and transactions are trackable and irreversible.\n"
