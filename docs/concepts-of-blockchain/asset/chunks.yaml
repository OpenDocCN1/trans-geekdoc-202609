    Like a traditional contract, a Smart contract carries a set of conditions / terms
    that must be fulfilled. The difference is that the execution and enforcement of
    the contract is done through carefully designed algorithms, and not through law.
    Hence, Smart contracts permit trusted transactions and agreements to be carried
    out among disparate, anonymous parties without the need for a central authority,
    legal system, or external enforcement mechanism.


    Smart contracts were first proposed in 1994 by Nick Szabo, an American computer
    scientist who invented a virtual currency called "Bit Gold" in 1998, fully 10
    years before the invention of bitcoin. Szabo defined smart contracts as computerized
    transaction protocols that execute terms of a contract. He wanted to extend the
    functionality of electronic transaction methods, such as `POS` (point of sale),
    to the digital realm. In his paper, he also proposed the execution of a contract
    for synthetic assets, such as derivatives and bonds. Szabo wrote: "These new securities
    are formed by combining securities (such as bonds) and derivatives (options and
    futures) in a wide variety of ways. Very complex term structures for payments
    can now be built into standardized contracts and traded with low transaction costs,
    due to computerized analysis of these complex term structures."


    Smart contracts in Ethereum are like autonomous agents that live inside the Ethereum
    network. They react to the external world when they are poked by transactions,
    which cause specific functions. They have direct control over an internal Ether
    balance, internal contract state, and also permanent storage. They generally service
    four main purposes:


    *   They can be used to store and maintain data. This data represents something
    useful to users or other contracts. For example, there could be a smart contract
    defining a new token currency, or a certain organization’s membership, etc.

    *   They can be used to manage a contract or a relationship between untrusting
    users. Its simply running a regular contract but on the distributed Ethereum network.
    For example, you can have smart contracts that manage financial contracts, escrow
    accounts, or insurance premiums.

    *   Smart contracts can be written to call other contracts, using them as a software
    library, leveraging the functionality of an existing contract.

    *   Smart contracts can be used for complex authentication use cases. For example,
    you can define a ‘m’ of ‘n’ multi-signature using a smart contract.


    # Ethereum Overview


    Ethereum is a decentralized, open-source blockchain platform to run smart contracts.
    In short, it’s a distributed computer spread amongst multitude of nodes across
    the world executing codes that people feed into it, and because of this architecture,
    it can run unstoppable applications. Applications are run on the Ethereum platform
    exactly as programmed, without any possibility of downtime, censorship, fraud,
    or 3rd party intervention. Formally, Ethereum is implemented as a distributed
    state machine, and transaction on its network change the global state of the system.
    Nodes in the Ethereum network keep track of and come to consensus on the global
    system state, which includes data about who owns what.


    Like Bitcoin, Ethereum is trustless, immutable, uncensorable, pseudonymous, and
    has no central point of failure. It supports a Turing complete language.


    Ethereum’s native cryptocurrency is Ether (`ETH`), which is the basis of value
    in the Ethereum ecosystem, and also crucial in aligning incentives. Amongst cryptocurrencies,
    Ether is second only to Bitcoin in market capitalization.


    # Ethereum History


    Ethereum was first described by Vitalik Buterin, a programmer from University
    of Waterloo and co-founder of Bitcoin magazine, in late 2013, in a white paper
    with the objective of building decentralized applications. Buterin argued that
    the blockchain technology needed a more robust language for application development
    that could lead to attaching real-world assets, such as stocks and property, to
    the blockchain. He proposed the development of a new platform with a more robust
    scripting language—a Turing-complete protocol, that would eventually become Ethereum.


    Ethereum was announced at the North American Bitcoin Conference in Miami, in January
    2014. The platform had a token sale between July and August 2014 and sold 7.4
    million ether for 3700 Bitcoins in the first 12 hours of its presale.


    Several codenamed prototypes of Ethereum were developed over 18 months in 2014
    and 2015 by the Ethereum Foundation as part of their proof-of-concept series.
    The "Olympic" network was the last prototype and public beta pre-release, and
    provided users with 25,000 Ether for stress testing the limits of the Ethereum
    blockchain. The Ethereum blockchain officially went live on 30th July 2015 with
    creation of its genesis block, and by May 2016, the cumulative value of Ethereum
    tokens was more than $1 billion.


    Around that time, the idea of Decentralized Autonomous Organizations (`DAO`),
    which were programs on the Ethereum that created a distributed government, became
    immensely popular. In 2016, a decentralized autonomous organization called `The
    DAO`, developed a set of smart contracts and raised $150 million to fund the project.
    However in July 2016, an unknown hacker exploited a bug in the underlying code,
    and stole around $120 million of Ether. The event sparked a debate in the crypto-community
    about whether Ethereum should defy the protocol and undo the hack, or not to undo
    it with the belief that “code is law”.


    This resulted in the network splitting into two blockchains: The split that reversed
    the theft is currently branded as Ethereum, and the split that continued on the
    original chain became know as Ethereum Classic. After the reversal, Ethereum subsequently
    reversed twice in the fourth quarter of 2016 to deal with other attacks.


    In March 2017, various blockchain startups, research groups, and Fortune 500 companies
    announced the creation of the Enterprise Ethereum Alliance (`EEA`) with 30 founding
    members. The advent of cryptocurrency exchange-traded-funds (`ETF`) meant that
    an average person could now invest in cryptocurrency without having to worry about
    dealing with exchanges and storing the tokens. Ethereum platform enabled multiple
    Initial Coin Offerings (`ICO`), raising around $1.3 billion with 150 `ICOs` in
    the third quarter of 2017.


    In December 2017, cryptocurrencies started attracting much more mainstream attention,
    and led to increase in the number of millennials investing in Ether. They did
    not want to miss in the next Bitcoin, and ended up investing in Ether, driving
    its price up in a feedback loop. In January 2018, Ethereum was the second largest
    cryptocurrency by market capitalization, behind Bitcoin.


    In March 2021, Visa Inc. announced that it began settling transactions using Ethereum.
    In April 2021, JP Morgan Chase, UBS, and MasterCard announced that they were investing
    $65 million into ConsenSys, a software development firm that builds Ethereum-related
    infrastructure.


    There were two network upgrades in 2021. The first was the "Berlin" upgrade and
    the second was "London upgrade". The `London` upgrade introduced a mechanism for
    reducing transaction fee volatility. The mechanism causes a portion of the Ether
    paid in transaction fees each block to be destroyed rather than given to the miner,
    reducing the inflation rate of Ether.


    As of 2022, Ether is the 2nd most valued cryptocurrency after Bitcoin, with a
    market cap of around $400 billion.

