    \ from contract drafter, signatories, to regulators. If a dispute over the contract\
    \ occurs, many parties can be involved, including the courts. This complexity\
    \ can be seen within many sectors and industries.\n\nAutonomy in blockchain can\
    \ be seen from many different angles. We are going to focus solely on smart contract,\
    \ due to the amount of autonomy they provide for everyone involved in the contract.\
    \ The concept of smart contracts has been around for many years and was first\
    \ proposed by Nick Szabo, who coined this term in 1994. \n\nSmart Contracts \n\
    \nThe most simplified explanation of smart contracts is – “IF THEN ELSE” statement,\
    \ which means IF X happens, THEN do Y, ELSE do Z.\n\nIf this concept is applied\
    \ to two or more parties, all interacting on a mutually agreed upon contract that\
    \ executes based on their actions (or non-actions). An example of smart contract\
    \ can be “if an event happens before the end of this year, then you pay me, else\
    \ I pay you”."
