  trans: "\n\n# 密码学的机械化\n\n第二阶段——密码学的机械化始于第一次世界大战后不久，并持续至今。在这一阶段，密码学从临时的加密方法演变为更为复杂的信息安全艺术与科学。相关的应用技术涉及电话和电报通信，或诸如\
    \ `Brunsvigas`、`Marchants`、`Facits` 和 `Friedens` 等计算机器（使用了齿轮、链轮、棘轮、棘爪和凸轮）。\n\n\
    在第一次世界大战的前两年里，代码系统仍用于外交通信（正如几个世纪以来一直这样做那样），而密码系统几乎专门用于战术通信，但它们缺乏复杂性和安全性。\n\n电报和无线电的通信需求以及机械及机电技术的成熟，在\
    \ 20 世纪 20 年代汇聚在一起，推动了密码设备的重大进步：转子密码机的发展。尽管转子的概念在较旧的机械密码盘中已被预见到，但美国密码密码学家爱德华·H·希伯恩（Edward\
    \ H. Hebern）在 1917 年意识到，通过在电学圆盘（`rotor`）一侧触点到另一侧触点之间的连接中硬布线一种单字母替换，然后级联一系列此类转子，就可以实现几乎任意复杂度的多字母替换。这一组转子通常排列成一个称为\
    \ `basket`（篮子）的堆；堆中每个转子的旋转会导致下一个转子旋转，就像里程表的轮子每驱动轮每旋转一圈，就前进 1/10 圈一样。在运行过程中，堆中的转子提供了一条从触点到触点穿过所有转子的电气路径。在直通转子系统中，按下类打字机键盘上的键触点会将电流发送到末端转子上的一个触点。然后，电流通过堆中其余转子及其相对旋转位置定义的交叉连接网络，传输到输出端板上的某一点，在那里连接到打印机或指示器，从而输出与输入明文字母相对应的密文字母。\n\
    \n从 1921 年开始到接下来的十年里，希伯恩制造了一系列不断改进的转子机。20 世纪 20 年代的特征是密码机发明者向国家密码机构以及不同机构之间提出了一系列挑战，这导致了密码机和机器分析技术的稳步改进。几乎希伯恩在美国开发转子密码机的同时，欧洲工程师（特别是荷兰的胡戈·A·科赫和德国的亚瑟·谢尔比乌斯）独立发现了转子概念，并设计的机器成为历史上最著名的密码机——二战参与者所使用的“恩玛（Enigma）转子机”的前身。这些机器可以实现比手动操作复杂得多的运算，更重要的是，它们的加解密速度更快且错误率更低。\n\
    \n![二世界大战恩玛密码机德国海军在战争期间使用了多种版本的恩玛密码机，包括这种四转子模型。](img/image00236.jpeg)\n\n恩玛转子机；来源：https://www.britannica.com/topic/cryptology/\n\
    \n密码分析历史上最大的成就是波兰和英国对德国恩玛密码的破解，由阿兰·图灵提出，其输出代号为“Ultra”。这些发展对盟国在第二次世界大战中的行动发挥了重要作用。\n\
    \n## 斐波纳契生成器与线性反馈\n\n在二战后的后的几年里，数字计算机被应用于密码机。一类功能类似于转子的电子设备是斐波纳契生成器，其名字源于斐波纳契数列\
    \ 1, 1, 2, 3, 5, 8, 13……每个后续项都是左侧两项之和。如果连续向左移动一位并每次读取五位比特，就能看到斐波纳契生成器与密码学的关联性。这产生了\
    \ 1 到 31 整数的乱序排列，类似于转子产生的乱序排列。\n\n密码学问题在于，用于确定序列中连续状态的组合操作是线性的，因此很容易反转，尽管序列在重复之前长度可以达到\
    \ `2n−1` 位。另一个问题是密钥如何使用。简单地使用密钥来确定从明文 n 元组到密文 n 元组的循环步数在密码学上是不安全的，因为已知明文攻击会迅速泄露密钥。\n\
    \n为了避免与线性相关的问题，密码学家设计了许多非线性反馈逻辑，这些逻辑具有良好的属性，如信息扩散（扩散文本中微小变化的影响）和大周期结构（为了防止穷举搜索），但即使有大量的匹配明文/密文对，要从输出序列反向推导出初始状态，在计算上也是不可行的。用于确定序列中下一位的非线性反馈逻辑，可以用与线性反馈逻辑非常相同的方式。然而，非线性逻辑中密钥对密文的复杂影响，极大地增加了密码分析者面临的困难。\n\
    \n 第三个阶段——数据加密与高级加密标准\n\n第三阶段仅追溯到 20 世纪的最后二十年，标志着所有最激进的变化——密码学向信息时代的剧性延伸：数字签名、认证、执行密码功能的共享或分布式能力等。人们很容易将这一阶段等同于公钥密码学的出现，但这种观点太狭隘了。密码学的第三阶段是必然的结果，必须设计出方法，让电子信息能够执行历史上借助实体文档所完成的所有功能。\n\
    \n"
- fmt: "\nIn 1973 the U.S. National Bureau of Standards, issued a public request for\
    \ proposals for a crypto algorithm to be considered for a new cryptographic standard.\
    \ A second request was issued in 1974, and International Business Machines (IBM)\
    \ submitted the patented ‘Lucifer algorithm’ that had been devised by one of the\
    \ company’s researchers, Horst Feistel, a few years earlier. The Lucifer algorithm\
    \ was evaluated in secret consultations between the NBS and the National Security\
    \ Agency (NSA). After some modifications to the internal functions and a shortening\
    \ of the key size from 112 bits to 56 bits, the full details of the algorithm\
    \ that was to become the Data Encryption Standard (DES) were published in the\
    \ Federal Register in 1975.\n\nThe DES is a product block cipher in which 16 iterations,\
    \ of substitution and permutation process are cascaded. The block size is 64 bits.\
    \ The key, which controls the transformation, also consists of 64 bits; however,\
    \ only `56` of these can be chosen by the user and are actually key bits. The\
    \ remaining eight are parity check bits and hence totally redundant. At each intermediate\
    \ stage of the transformation process, the cipher output from the preceding stage\
    \ is partitioned into the 32 left-most bits, `Li`, and the 32 right-most bits,\
    \ `Ri`. `Ri` is transposed to become the left-hand part of the next higher intermediate\
    \ cipher, `Li + 1`.\n\nThe right-hand half of the next cipher, `Ri + 1`, however,\
    \ is a complex function, `Li + f(Ri, Ki + 1)`, of a subset of the key bits, `Ki\
    \ + 1`, and of the entire preceding intermediate cipher. The essential feature\
    \ to the security of the DES is that ‘f’ involves a very special nonlinear substitution—i.e.,\
    \ `f(A) + f(B) ≠ f(A + B)`—specified by the Bureau of Standards in tabulated functions\
    \ known as S boxes. This process is repeated 16 times.\n\n![Flow diagram for the\
    \ 16-step Data Encryption Standard (DES) operation.](Images/image00237.jpeg)\n\
    \nFlow diagram for 16-step Data Encryption Standard (DES) operation\n\nSource:\
    \ Data Encryption Standard, FIPS Publ. no. 46, National Bureau of Standards, 1977\n\
    \nThis basic structure, in which at each iteration the cipher output from the\
    \ preceding step is divided in half and the halves transposed with a complex function\
    \ controlled by the key being performed on the right half and the result combined\
    \ with the left half using the “exclusive-or” to form the new right half, is called\
    \ a Feistel cipher and is widely used—and not just in the DES. One of the attractive\
    \ things about Feistel ciphers—in addition to their security—is that if the key\
    \ subsets are used in reverse order, repeating the “encryption” decrypts a ciphertext\
    \ to recover the plaintext.\n\nThe standard was adopted at the end of 1976 and\
    \ published at the beginning of 1977. It was mandated that the DES be used in\
    \ unclassified U.S. government applications for the protection of binary-coded\
    \ data during transmission and storage in computer systems and networks and on\
    \ a case-by-case basis for the protection of classified information.\n\nThe use\
    \ of the DES algorithm was made mandatory for all financial transactions of the\
    \ U.S. government involving electronic fund transfer, including those conducted\
    \ by member banks of the Federal Reserve System. Subsequent adoption of the DES\
    \ by standards organizations worldwide caused the DES to become a de facto international\
    \ standard for business and commercial data security as well.\n\nThe security\
    \ of the DES is no greater than its work factor ‘the brute-force effort required\
    \ to search 256 keys’. In 1977 that was considered an impossible computational\
    \ task. In 1997, and in the following years, DES was broken by an exhaustive search\
    \ attack. The main problem with DES was the small size of the encryption key.\
    \ As computing power increased it became easy to brute force all different combinations\
    \ of the key to obtain a possible plain text message.\n\nIn January 1997 the National\
    \ Institute of Standards and Technology (NIST) issued a public request to submit\
    \ candidates to replace the aging DES. This time 15 viable submissions from 12\
    \ countries were received. In October 2000 NIST announced that Rijndael, a program\
    \ created by two Belgian cryptographers, Joan Daemen and Vincent Rijmen, had been\
    \ accepted as the new standard, or the ‘Advanced Encryption Standard (AES)’. The\
    \ NBS had expected the DES to be implemented in special-purpose hardware and hence\
    \ had given little or no consideration to its efficient implementation in software,\
    \ i.e., using general-purpose microprocessors. As a result, the DES was unable\
    \ to take advantage of the rapid development in microprocessors that occurred\
    \ in the last two decades of the 20th century. The AES specifications, on the\
    \ other hand, emphasized hardware and software implementations equally. In part,\
    \ this recognized the needs of smart cards and other point-of-sale equipment,\
    \ which typically have very limited computational capabilities, but more important\
    \ was a recognition of the growing needs of the Internet and e-commerce. Based\
    \ on their experience with the DES, where improvements in computing simply overran\
    \ the work factor of the fixed 56-bit key, NIST specifications for the AES also\
    \ called for the algorithm to be capable of increasing the key length if necessary.\
    \ Rijndael proved itself to be both small enough to be implemented on smart cards\
    \ (at less than 10,000 bytes of code) and flexible enough to allow longer key\
    \ lengths.\n\n## Cryptography Concepts\n\nCryptography is one of the technologies\
    \ that plays a pivotal role in making blockchain secure and immutable. \n\nCryptography\
    \ is defined as the science of sending messages back and forth from one party\
    \ to another, in the presence of adversaries. Most cryptographic functions are\
    \ two-way functions, meaning that we can take a data – encrypt it – and transmit\
    \ it to someone, and then we use that same process to decrypt it at the other\
    \ end. The key components of cryptography are:\n\n*   The data or information\
    \ we are trying to protect\n*   The key, which is a piece of data attached to\
    \ the we are trying to protect\n*   The function which attaches the data and the\
    \ key, end ensures that the data could not be tampered with, while sending it\
    \ back and forth between participants\n*   Cipher, the encrypted message, which\
    \ even if is intercepted by adversaries, they wouldn’t be able to know the real\
    \ data or how to decrypt the cipher back into the original\n\nCryptographic hashing\
    \ is a special class of cryptographic functions. These are one-way functions,\
    \ meaning they can only encrypt the secret. If I put data into a cryptographic\
    \ hash, it attaches the data and the key as one entity, which is called the hash\
    \ result, an encryption based on the data that is encoded. This hash result is\
    \ mathematically impossible to reverse-engineer. If you put any data into a cryptographic\
    \ hash and transmit it to me, I can’t do anything beyond just randomly guessing\
    \ and trying to recreate the original data. Cryptographic hashes are used in the\
    \ scenarios where we want to validate a piece of data without actually sharing\
    \ the data. For example – password management systems used by the banks, where\
    \ they do not store user name or password of the users registered in the online\
    \ banking system, just the hash output of the password. This way, if some of the\
    \ user registered in the banking system enters a password to log in, this is easily\
    \ validated by the hash of the password, without having to know the real password.\n\
    \nLet’s try to use a simple example to create the hash function\n\n*   Data: `Cryptographic\
    \ hash makes blockchain secure and immutable`\n*   Function: Swap each letter\
    \ in the data with a new letter as per the key\n*   Key: `+3`\n*   Cipher: `Fubswrjudsklf\
    \ kdvk pdnhv eorfnfkdlq vhfxuh dqg lppxwdeoh`\n\n## Types of Cryptography\n"
