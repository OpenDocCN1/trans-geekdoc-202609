- fmt: "\n*   `Unlocking script (scriptSig)` – The `scriptSig` is the unlocking script\
    \ found in the transaction input provided by the spender to redeem the output\
    \ of a previous transaction. It requires a public key and a digital signature.\
    \ The system only carry outs transactions if the signatures and their verification\
    \ comply with a series of established rules that guarantee proper behavior on\
    \ the network.\n\n*   `Locking script (scriptPubKey)` – The `scriptPubKey` is\
    \ the locking script found in the transaction output which specifies the requirements\
    \ for redeeming the transaction. It contains a public key hash, also called a\
    \ Bitcoin address. The scheduling of Bitcoin transactions as such is stored in\
    \ this part of the script.\n\n## Script Examples\n\nSuppose you want to send a\
    \ Bitcoin to some address. The script will be:\n\n`scriptPubKey: OP_DUP OP_HASH160\
    \ <pubKeyHash> OP_EQUALVERIFY OP_CHECKSIG`\n\n`scriptSig: <sig> <pubKey>`\n\n\
    In this example, the locking script requires the user who wants to spend from\
    \ a previous transaction must prove that he possess a private key that hashes\
    \ to a specific address. For this reason, the script is called `scriptPubKey`.\
    \ To make the unlocking and locking script work together, we put the unlocking\
    \ script (`scriptSig`) on the top of the locking script (`scriptPubKey`) and run\
    \ them together. The entire resulting script must execute successfully for the\
    \ transaction to be considered valid.\n\nSimilarly, suppose you want to freeze\
    \ your Bitcoins until a certain point in the future. The script will be:\n\n`scriptPubKey:\
    \ <expiry time> OP_CHECKLOCKTIMEVERIFY OP_DROP OP_DUP OP_HASH160 <pubKeyHash>\
    \ OP_EQUALVERIFY OP_CHECKSIG`\n\n`scriptSig: <sig> <pubKey>`\n\nIn this example,\
    \ the locking script will mark the transaction as invalid if the transaction's\
    \ date and time is less than the future date and time set by the user. \n\nThe\
    \ purpose of creating a script language in Bitcoin is to provide a series of easy\
    \ and flexible parameters to enable a transaction. It is this programming language\
    \ that determines whether or not an operation can be performed. Simply put, the\
    \ creation of the `Bitcoin Script` is what gives the programmable nature of Bitcoin.\
    \ This is what allows us, for example, to send a transaction that is validated\
    \ only if certain conditions are met. This property is something unique to Bitcoin\
    \ and cryptocurrencies, something that today's digital money cannot reach, let\
    \ alone physical money. It is the evolution of money reached a point where even\
    \ money can act independently and decentralized simply by attending to the programming\
    \ embedded in it.\n\nMoreover, The Bitcoin script also prevents the creation of\
    \ errors in the system and the unnecessary use of very complex transactions. In\
    \ fact, the script makes transactions relatively easy to calculate. \n\n## Pay-to-Public-Key-Hash\
    \ (P2PKH)\n\n`Pay-to-Public-Key-Hash (P2PKH)` is a type of `scriptPubKey` which\
    \ locks bitcoin to the hash of a public key. A `P2PKH` transaction is one where\
    \ the inputs were locked using the `P2PKH` scriptPubKey. A public key hash is\
    \ also known as an address, and `P2PKH` is the most common script type at present.\n\
    \nLets’ go back to the previous example, wherein you want to send a Bitcoin to\
    \ some address. The script will be:\n\n`scriptPubKey: OP_DUP OP_HASH160 <pubKeyHash>\
    \ OP_EQUALVERIFY OP_CHECKSIG`\n\n`scriptSig: <sig> <pubKey>`\n\nSince, Bitcoin\
    \ script is:\n1. `OP_DUP`\n2. `OP_HASH160`\n3. `<pubKeyHash>`\n4. `OP_EQUALVERIFY`\n\
    5. `OP_CHECKSIG`\n6. `<sig>`\n7. `<pubKey>`\n\nSince, Bitcoin script is:\n1. `OP_DUP`\n\
    2. `OP_HASH160`\n3. `<pubKeyHash>`\n4. `OP_EQUALVERIFY`\n5. `OP_CHECKSIG`\n6.\
    \ `<sig>`\n7. `<pubKey>`\n\nSince, \n1. `OP_DUP`\n2. `OP_HASH160`\n3. `<pubKeyHash>`\n\
    4. `OP_EQUALVERIFY`\n5. `OP_CHECKSIG`\n6. `<sig>`\n7. `<pubKey>`\n\n## Pay-to-Script-Hash\
    \ (P2SH)\n\n`Pay-to-Script-Hash (P2SH)` is a type of `scriptPubKey` which locks\
    \ bitcoin to the hash of a public key. A `P2PKH` transaction is one where the\
    \ inputs were locked using the `P2PKH` scriptPubKey. A public key hash is also\
    \ known as an address, and `P2PKH` is the most common script type at present.\n\
    \n## P2PKH vs P2SH\n\n`Pay-to-Public-Key-Hash (P2PKH)` is a type of `scriptPubKey`\
    \ which locks bitcoin to the hash of a public key. A `P2PKH` transaction is one\
    \ where the inputs were locked using the `P2PKH` scriptPubKey. A public key hash\
    \ is also known as an address, and `P2PKH` is the most common script type at present.\n\
    \n## Multisignature (Multisig)\n\n`Multisig` refers to requiring multiple keys\
    \ to authorize a transaction, rather than a single signature from one key. A typical\
    \ `multisig` scheme is an m-of-n, where you need m of n users to sign-off on a\
    \ transaction before it is considered valid.\n"
