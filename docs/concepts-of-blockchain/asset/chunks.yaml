  raw: "In a recent test by Maersk, shipping a single container of flowers from Kenya\
    \ to the port of Rotterdam resulted in a stack of nearly 200 communications. Using\
    \ this example, we will examine how blockchain has been implemented to create\
    \ trust and security in the digitize document workflow and improve the efficiency\
    \ of global supply chains. The distinct entities involved in the transaction are\
    \ the rowers, export authorities, ports, customers, and importers. Shipping from\
    \ the port of Mombasa requires signatures from three different agencies approving\
    \ the export and six documents that describe the origin, chemical treatments,\
    \ product quality, and custom duties. First, using a PC or a mobile phone the\
    \ Kenyan farm submits a packing list that becomes visible to all participants.\
    \ This action initiates a smart contract that enforces an export approval workflow\
    \ between the three agencies. As each agency signs, the status is updated for\
    \ everyone to see. Simultaneously, information about the inspection of the flowers,\
    \ the sealing of the refrigerated container, the pickup by the trucker, and the\
    \ approval from the customs is communicated to the port of Mombasa allowing them\
    \ to prepare for the container. All actions relating to the documents and the\
    \ physical goods are captured and shared – which documents were submitted, when\
    \ and by whom, where the flowers are, who is in the possession of them, and the\
    \ next steps in the journey. As flowers are perishable, do it is crucial that\
    \ there are minimum delays at every step. Blockchain provides secure data exchange,\
    \ and a tamperproof repository for these documents and shipping events. This system\
    \ could significantly reduce delays and frauds saving billions of dollars annually.\
    \ According to WTO, reducing barriers within the international supply chain could\
    \ increase the total trade volume by 15% and worldwide GDP by almost 5%.\n\nFood\
    \ Industry\n\nIn the food industry, farms are complicated ecosystems with many\
    \ moving parts, careful timing, and seasonal financing structures. However, once\
    \ the agricultural products leave the farm, they become part of a wide-reaching\
    \ supply chain with a lot of parties. Buyers, sellers, distributors, and grocery\
    \ chains – all of them want to know where the agricultural product has been before\
    \ it is served on your dinner table. The trend toward blockchain agriculture promises\
    \ to make each step of growing and distributing food simpler. It offers all parties\
    \ involved a single source of truth for the agricultural supply chain.\n\nWhen\
    \ customers shops for food items in a store, they expect great prices and a good\
    \ customer service, but an unspoken expectation is that the products in the store\
    \ should be safe to consume. The food product is guilty until proves innocent.\
    \ In case of a food getting event or a food scare, all the product is pulled until\
    \ the implicated product is found then the safe product can be put back. However\
    \ if it takes too much time to identify the implicated product, the entire stock\
    \ is discarded as food is a perishable item. Now imagine if the stores could pinpoint\
    \ with certainty, within minutes that which was the implicated product, it would\
    \ save a lot of food wastage and optimize costs. Walmart and IBM are working to\
    \ make that a reality. \n\nThe food ecosystem involves farmers, processors, distributors,\
    \ and each participant traces the food system in their own way. Mostly it is done\
    \ on paper and there is minimal interaction between different players in the ecosystem,\
    \ and these stakeholders cannot have a full view of what is happening in the food\
    \ ecosystem. Walmart is planning to leverage blockchain to bring all the stakeholders\
    \ in the food ecosystem together such that they can collaborate quickly and efficiently.\
    \ Blockchain allows the different segments in the food system to capture information\
    \ about the product, what they have done to it, and where the product has been.\
    \ If we link that data with the other data points, all this information will provide\
    \ us an insight that will enable a safer, more affordable and sustainable food\
    \ system. \n\nHowever, the ultimate goal of blockchain implementation in the food\
    \ ecosystem is transparency. Blockchain will enable the stakeholders to not only\
    \ track where the food came from, but how it was produced, was it produced safely,\
    \ responsibly, was it sustainable grown, and how many days of shelf life are left\
    \ on that product. \n\nHealthcare\n\nBlockchain is transforming the healthcare\
    \ industry. Some challenges the healthcare industry faces are counterfeit drugs,\
    \ siloed data, health record management to name a few. Blockchain can solve these\
    \ issues with interoperability, data integrity and security.\n\nModerna uses blockchain\
    \ to support its smart COVID vaccine management. SAP has an exiting solution unrelated\
    \ to blockchain called Advanced Track and Trace for Pharmaceuticals (ATTP) which\
    \ generates the unique identifiers. Also, Pfizer has been using blockchain in\
    \ transparent clinical trials. \n\nFinance Markets\n\nReduction of settlement\
    \ times will improve the flow of money through ‘fintech’ companies. \n\nSwiss\
    \ Exchange, SIX has a solution that solves the issue in the trade markets of long\
    \ settlement times. The new blockchain platform runs parallel to the existing\
    \ SIX platform, which involves three steps to complete a trade, often over several\
    \ days. Two of those steps vanish in a blockchain distributed ledger, meaning\
    \ a transaction can be completed in a fraction of a second.\n\nTrade finance is\
    \ showing promise for blockchain solutions in letter of credits by making available\
    \ financial mechanisms previously excluded for most people. In the paper from\
    \ Andrea Frosinini, “Reshaping Trade Finance: Towards a ‘New’ Line of Credit”,\
    \ he supplied trade finance paired with blockchain that provides delivery and\
    \ payment assurance to buyers and sellers, reducing operational and transactional\
    \ cost and opening up market opportunities.  \n\nVoltron Trade Finance was co-founded\
    \ by eight member banks including Bangkok Bank, BNP Paribas, CTBC, HSBC, ING,\
    \ Natwest, SEB and Standard Chartered Bank. This consortium has since grown to\
    \ more than 50 banks and corporations. The platform is built on Corda blockchain\
    \ and solves the problem to reduce transaction time. Most letter of credits are\
    \ based on paper and take 5 to 10 days. By using blockchain, the letter of credits\
    \ can be efficiently transacted within 24 hours.\n\n## Public Sector Solutions\n\
    \nBlockchain benefits of security, efficiency and speed have government leaders\
    \ research the far reaching implications that will improve lives and accelerate\
    \ global blockchain solutions. Public sector can be characterized by public administration,\
    \ public service, land and community, and government. According to a presentation\
    \ by Bobbi Muscara, Saptarshi Choudhury and Sean O’Kelly, “Rethinking Public Sector\
    \ through Blockchain”, all blockchain public sector projects must consider the\
    \ four design factors:\n\n*   Identity management for governments\n\n*   Interactions\
    \ for regulated transactions\n\n*   Regulations\n\n*   Governance\n\nSmart Dubai\n\
    \nA real-world example of public sector blockchain solution is of Smart Dubai\
    \ 2021, wherein Dubai aims to move all government operations and record keeping\
    \ into blockchain. The goal is to increase transparency and efficiency in the\
    \ government operations. Blockchain is also becoming the enabling layer for a\
    \ lot of other Smart Dubai initiatives, thereby creating a Smart City. For example,\
    \ projects like automated traffic signals, registration of citizens for visas\
    \ and public healthcare, etc. are all being pioneered on blockchain.\n\nDutch\
    \ Blockchain Coalition\n\nDutch Blockchain Coalition established three pillars\
    \ of society working together to build a blockchain future:\n\n*   Developing\
    \ building blocks – digital identities\n\n*   Realizing the conditions for utilizing\
