- fmt: '

    The miners in the mining pool are trying to solve the problem based on `Merkle
    Root`, and hashing everything in the block header. The miners can prove that they
    are working for the mining pool through shares. Shares are defined as near-valid
    or valid blocks. For example, a miner just found a block hash with half as many
    leading zeroes as a valid block. Mining pool can use this information to gauge
    how much mining power this miner has contributed and reward him for valid shares.
    This way the miner gets paid even if he never finds a valid block,, because these
    near-valid blocks are indicators that he at least tried to find a block.


    The rewards are given through a `coinbase transaction`. The hash puzzle contains
    a `coinbase transaction` that pays block reward to the pool manager. The pool
    manager redistributes this block reward to the miners.


    # Mining Pool Payout Methods


    There are a number of common protocols that govern many of the most popular mining
    pools.


    *   **Proportional Mining Pools** – In this type of pool, miners contributing
    to the pool''s processing power receive shares up until the point at which the
    pool succeeds in finding a block. After that, miners receive rewards proportional
    to the number of shares they submitted before the block was found. This method
    is more advantageous for the mining pool, as they do not need to pay more money
    than they get, but it leads to more variance and risks for miners.

    *   **Pay-per-share Pools** – They operate somewhat similarly in that each miner
    receives shares for their contribution. However, these pools provide instant payouts
    regardless of when the block is found. A miner contributing to this type of pool
    can exchange shares for a proportional payout at any time. The payment is guaranteed
    and constant per share, regardless of how much reward the mining pools makes.
    Most mining pools use this method as it is easy to implement.

    *   **Peer-to-peer Mining Pools** – They integrate a separate blockchain related
    to the pool itself and designed to prevent the operators of the pool from cheating
    as well as the pool itself from failing due to a single central issue.


    # Benefits of a Mining Pool


    While success in individual mining grants complete ownership of the reward, the
    odds of achieving success is very low because of high power and resource requirements.
    Mining is often not a profitable venture for individuals. Many cryptocurrencies
    have become increasingly difficult to mine in recent years as the popularity of
    these digital currencies has grown and the costs associated with expensive hardware
    necessary to be a competitive miner as well as electricity oftentimes outweigh
    the potential rewards. Mining pools require less of each individual participant
    in terms of hardware and electricity costs and increase the chances of profitability.
    Whereas an individual miner might stand little chance of successfully finding
    a block and receiving a mining reward, teaming up with others dramatically improves
    the success rate.


    On top of that, software changes are easy to implement, as only one person is
    running a full node for the mining pool, and can upgrade on the behalf of the
    mining pool.


    # Disadvantages of a Mining Pool


    By taking part in a mining pool, individuals give up some of their autonomy in
    the mining process. They are typically bound by terms set by the pool itself,
    which may dictate how the mining process is approached. They are also required
    to divide up any potential rewards, meaning that the share of profit is lower
    for an individual participating in a pool.


    Also, the miners need to rely on the pool managers, not to misuse their mining
    power and not to withhold rewards. This is the consequence of centralization.
    A small number of mining pools, such as `AntPool`, `Poolin`, and `F2Pool` dominate
    the bitcoin mining process, according to `blockchain.com`. Although many pools
    do try to be decentralized, these groups consolidate much of the authority to
    govern the Bitcoin protocol. For some cryptocurrency proponents, the presence
    of a small number of powerful mining pools goes against the decentralized structure
    inherent in Bitcoin.


    Another disadvantage is that a single entity might be hiding their total amount
    of mining power. This is known as `laundering hashes`, by hiding the original
    mining power. This allows the miner to leverage greater amount of mining power
    without revealing his prowess to the mining pool network and receive higher profits
    in return.


    # Bitcoin Governance


    One of the biggest feature of Bitcoin is Decentralization. However Bitcoin mining
    is becoming more and more centralized with the development of `ASICs`, mining
    pools, and mining farms. `ASICs` are centralized in a sense as they are very expensive
    and only very few people can acquire them. Mining pools and mining farms on the
    other hand are centralized as they are run by single entities.


    This problem can be solved attempting to redesign the underlying hash puzzles.
    A puzzle should be hard to solve but easy to verify. This difficulty should be
    adjusted to account for the changes in the mining technology (e.g. – `ASICs`).
    A puzzle should also be “progress free” meaning that finding a hash does not make
    it easier.


    ## ASIC Resistance


    The original idea of Bitcoin mining was `1 CPU 1 Vote` making it truly decentralized.
    The rise of `ASICs` has diminished it, giving some people more votes than other.


    `ASICs` work because it is easy to create hardware to compute a certain puzzle.
    They are computation bound. A way to solve the problem of ASIC dominance is to
    make puzzles that not only rely on computation speed, but also on memory, giving
    rise to the notion of memory-hard and memory-bound problems. A memory-hard problem
    is the one that needs a large amount of money to solve. A memory-bound problem
    is the one that scales on the amount of memory you have. These problems deter
    ASICs as optimizing computation power is useless if memory is the limit.


    New cryptocurrencies like `Dogecoin` and `Litecoin` have implemented memory-bound
    hash function called `Scrypt`. They use a partial hash-preimage puzzle like Bitcoin,
    just with a different hash function. Hence, Bitcoin ASICs cannot work for Dogecoin
    or Litcoin.


    `Scrypt` has 2 main steps:


    1. Fill a buffer with interdependent data

    2. Access that data in a pseudo random way


    `Scrypt` was originally designed to secure passwords and make them hard to brute
    force, so a memory-bound type of problem makes sense. A password-based key derivation
    function (`KDF`) is generally designed to be computationally intensive, so that
    it takes a relatively long time to compute. Legitimate users only need to perform
    the function once per operation, and so the time required is negligible. However,
    a brute-force attack would likely need to perform the operation billions of times,
    at which point the time requirements become significant and, ideally, prohibitive.


    The `Scrypt` function is designed to hinder such attempts by raising the resource
    demands of the algorithm. Specifically, the algorithm is designed to use a large
    amount of memory compared to other password-based KDFs, making the size and the
    cost of a hardware implementation much more expensive, and therefore limiting
    the amount of parallelism an attacker can use, for a given amount of financial
    resources.

