  trans: "\n\n金融衍生品提供了另一种选择。在这里，不再由单一发行者提供资金来支持资产，而是由一个投机者组成的去中心化市场扮演这一角色，他们押注加密参考资产（例如\
    \ `ETH`）的价格将会上涨。与发行者不同，投机者没有违约的可能，因为对冲合约将他们的资金托管在托管账户中。需要注意的是，这种方法并非完全去中心化，因为仍然需要一个信赖源来提供价格报价器，尽管可以认为这在减少基础设施需求以及减少潜在欺诈风险方面已经是一个巨大的改进。\n\
    \n## 多签名\n\n我们可以利用以太坊内置的身份验证协议来构建多方身份验证钱包。此功能允许我们拥有 `m` of `n` 签名方案，即总共 `n` 个钱包所有者中需要\
    \ `m` 个人对每笔交易进行签名。尽管逻辑相当简单，但 `Solidity` 的实现却相当复杂。\n\n## 去中心化金融 (DeFi)\n\n去中心化金融\
    \ (`DeFi`) 是 `Ethereum` 的一个用例。它在公司和政府控制之外的去中心化架构中提供传统的金融工具，例如让用户赚取利利的货币市场基金。去中心化金融应用通常通过支持\
    \ Web3 的浏览器扩展或应用程序访问，例如 `MetaMask`，它允许用户通过网站直接与 `Ethereum` 区块链交互。许多此类 `DApps`\
    \ 可以连接并协同工作，以创建复杂的金融服务。\n\n此外，通过一种被称为“封装”（wrapping）的过程，某些 `DeFi` 协议允许各种资产的合成版本（如\
    \ `Bitcoin`、`Gold` 和 `Oil`）在 `Ethereum` 上可用并交易，同时兼容以太坊的所有主流钱包和应用程序。\n\nDeFi 平台的示例包括\
    \ `MakerDAO` 和 `Compound`。`Uniswap` 是以太坊上的令牌去中心化交易所，其流动性从 2000 万美元增长到 2020 年的\
    \ 29 亿美元。截至 2020 年 10 月，超过 110 亿美元投资了各种 DeFi 协议。\n\n## 身份与声誉系统\n\n最早的替代加密货币 `Namecoin`\
    \ 尝试使用类似 `Bitcoin` 的区块链来提供名称注册系统，用户可以在公共数据库中与其他数据一起注册他们的名称。\n\n最被引用的主要用例是 `DNS`\
    \ 系统，将如 \"bitcoin.org\" 这样的域名映射到 IP 地址。其他用例还包括电子邮件验证和可能更先进的声誉系统。以下是在以太坊上提供类似 `Namecoin`\
    \ 名称注册系统的基础合约：\n\n```python\ndef register(name, value):\n    if !self.storage[name]:\n\
    \        self.storage[name] = value\n```\n\n该合约非常简单——`Ethereum` 网络内部的一个数据库，可以添加内容，但不能被修改或删除。任何人都可以注册一个带有特定值的名称，并且该注册将永久存在。更复杂的名称注册合约还将具有一个“函数子句”，允许其他合约对其进行查询，以及一种允许名称的“所有者”（即第一个注册者）更改数据或转移所有权的机制。甚至可以在此基础上添加声誉和信任网络功能。\n\
    \n## 去中心化自治组织 (DAO)\n\n“去中心化自治组织”的基本概念是一个虚拟实体，它拥有一组特定的成员或股东，这些成员可能在 67% 的多数情况下有权支出实体资金。逻辑相当简单，但\
    \ `Solidity` 的实现却相当复杂。\n\n`DAO` 允许成员集体对如何分配资金进行投票。这提供了一种去中心化的资源管理和决策方法，无需中央机构。`DAO`\
    \ 的总体大纲如下。\n\n"
