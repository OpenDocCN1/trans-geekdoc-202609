    - **其他相关文件**：一些互联网迷因与 NFT 相关联，这些 NFT 由其创建者或其主体铸造并出售。例如，`Doge`，其柴犬图像的 NFT 在 2021
    年 6 月以 400 万美元售。


    某些虚拟世界（通常营销为元宇宙）已将 NFT 作为交易虚拟物品和虚拟房地产的手段。2018 年的虚拟世界 `Decentraland` 就是其中。


    任何类型的活动门票建议作为 NFT 出售。此类建议将使活动组织者或表演者能够在转售中获得版税。


    - **收藏品**：2020 年初，`CryptoKitties` 的开发者 `Dapper Labs` 发布了 `NBA TopShot` 的测试版本，这是一个出售
    NBA 精选代币收藏品的项目。该项目构建在 `Flow` 之上，这是一个比 `Ethereum` 更新且更高效的区块链。2019 年，耐克专利了一项名为 `CryptoKicks`
    的系统，该系统将使用 NFT 验证实体运动鞋的真伪，并为客户提供鞋子的虚拟版本。


    - **投机**：代表某些数字收藏品和艺术品的 NFT 已作为投机资产被大量使用。


    - **洗钱**：与其他区块链证券和传统艺术品销售一样，NFT 可能被用于洗钱。


    ## NFT 与加密货币有何不同？


    NFT 代表非同质化代币（non-fungible token）。它通常使用与加密货币类似的编程构建，如 `Bitcoin` 或 `Ethereum`，但相似性仅此于此。


    加密货币是“同质化的”，这意味着它们可以相互交易或交换。它们的价值也相等。例如，一个 `Bitcoin` 始终等于另一个 `Bitcoin`。加密货币的同质性使其成为区块链上进行交易的可信手段。


    NFT 则不同。每个 NFT 都有一个数字签名，使得 NFT 无法相互交换或等值（因此，是非同质化的）。例如，一段 `NBA Top Shot` 片段并不等于另一个
    `NBA Top Shot` 片段，仅仅因为它们都是 NFT。


    ## NFT 的历史


    第一个已知的 NFT `Quantum` 由 Kevin McCoy 和 Anil Dash 于 2014 年 5 月创建，由 McCoy 的妻子 Jennifer
    制作的一段视频片段组成。McCoy 在 `Namecoin` 区块链上注册了该视频，并在纽约市博物馆举行的 Seven on Seven 会议现场演示期间以
    4 美元的价格卖给了 Dash。McCoy 和 Dash 将该技术称为“货币化的图形”。通过链上元数据（由 `Namecoin` 实现），一个非同质化的、可交易的区块链标记被明确链接到一件艺术品。这与其它区块链中多单元、同质化、无元数据的“彩色币”（colored
    coins）形成对比。


    2015 年 10 月，第一个 NFT 项目 `Etheria` 启动并在 `Ethereum` 区块链发布三个月后，在伦敦的首个开发者会议 `DEVCON
    1` 上进行了演示。`Etheria` 457 个可购买和交易的六边形瓷砖中大部分在五年内未售，直到 2021 年 3 月 13 日，人们对 NFT 的重新关注引发了购买热潮。在
    24 小时内，当前版本和之前版本的所有瓷砖（每个都硬编码为 `1 ETH`，发布时为 0.43 美元）全部售出，总额达 140 万美元。


    “NFT”一词直到随着 `ERC-721` 标准出现才流行，该标准于 2017 年通过 `Ethereum GitHub` 首次提出，随后推出了多种 NFT
    项目。这些包括 `Curio Cards`、`CryptoPunks` 和 `Decentraland` 平台。2017 年的在线游戏 `CryptoKitties`
    通过出售可交易的猫 NFT 实现变现，它的成功让公众对 NFT 开始关注。


    NFT 市场在 2020 年经历了快速增长，价值增长了三倍达到 2.5 亿美元。2021 年初几个月，在经历了多次高额交易和艺术拍卖后，对 NFT 的兴趣增加。2021
    年的前三个月，用于 NFT 的支出超过了 2 亿美元。


    ## NFT 的未来是什么？


    任何区块链实验的未来都是未知的。然而，专家预测 NFT 将长期存在，并将继续在艺术和游戏领域之外增长，特别是如果加密爱好者和主流投资者继续投入资金。


    NFT 的增长也可以归功于它的特征，这些特征可以代表所有权证明、提供社会地位、授予独家访问权限、管理许可以及认证真伪。它让你像 `Bitcoin` 让你成为自己的银行家一样，拥有你的产品。


    # 基于区块链的加密货币 – Bitcoin


    在本章中，我们将讨论 `Bitcoin` 以及它如何利用区块链技术进行分布式账本记录和交易。我们将从 `Bitcoin` 的历史开始，以及它为什么作为加密货币取得了成功。然后我们将探索
    `Bitcoin` 身份及其共识协议。我们将深入了解加密哈希函数和 `merkle root`（默克尔根），以及它们如何使 `Bitcoin` 不可篡改。我们将学习
    `Bitcoin` 交易过程，以及如何通过 `Bitcoin scripts` 编写 `Bitcoin` 代码。然后我们将深入了解 `Bitcoin` 用户及其钱包。我们将学习
    `Bitcoin` 的挖矿过程。最后，我们将学习 `Bitcoin` 的治理机制。


    ## Bitcoin 历史


    `Bitcoin` 的起源可以追溯到 20 世纪 70 年代和 80 年代的密码客（Cypherpunk）运动。20 世纪 70 年代人们生活在一个模拟世界中，加密主要用于军事目的。当时很少有人拥有电脑，很难想象有一种能连接地球上几乎每个人的技术——互联网。


    两份出版物将密码学带入公开：美国政府发布的《数据加密标准》，以及 Whitfield Diffie 博士和 Martin Hellman 博士于 1976
    年发布的《密码学新方向》。


    20 世纪 80 年代，David Chaum 博士开始撰关于匿名数字货币和伪匿名声誉系统等主题。这是我们今天看到的数字货币的第一步。


    直到 1992 年，一组密码学家开始定期聚会讨论他们的工作和相关想法。除了定期会议，他们还创建了 `Cypherpunk` 邮件列表，在其中讨论了许多想法。其中一个想法是使用密码学保护隐私，这导致了
    `Bitcoin` 的诞生。


    《密码客宣言》指出：“隐私对于电子时代的开放社会是必要的。隐私不是秘密。私有事务是你你不希望全世界知道的事情，而秘密事务是你不希望任何人知道的事情。隐私是选择性地向世界展示自己的权力。”


    密码客并不是唯一担心中心实体通过积累数百万用户不可想象的数据而变得强大的人。还有另一群被称为加密无政府主义者（crypto-anarchists）的人，他们担心大银行和政府削弱普通公民的自主权，并以不可想象的方式影响用户的心理。在银行革命之前，现金是匿名且纯物理的。然而，随着银行数字化，他们他们能够跟踪用户的账户余额和交易。因此，这两组人都预见到需要一种匿名数字货币，赋予用户选择性地向世界展示自己的权力。


    多家不同的公司和研究人员尝试发明一种去中心化货币，但由于与去中心化消除的不一致性，他们都失败了，例如双重花费攻击（double spending attack）——“一种通过修改区块链网络并插入一种特殊的允许用户重新获得加密货币的攻击”。


    '
- fmt: '

    One of these companies was DigiCash, an electronic money corporation founded by
    David Chaum in 1989. DigiCash transactions were unique in that they were anonymous,
    promising complete privacy for users conducting digital transactions, and included
    a number of cryptographic protocols that prevented both governments and banks
    from tracing personal transactions. Due to the overwhelming burden and high costs
    to validate each and every digital signature in the system, DigiCash couldn’t
    survive and declared bankruptcy in 1998 and subsequently sold its assets to eCash
    Technologies, another digital currency company.


    In 1997, Adam Back proposed a concept called Hashcash, and described more formally
    in 2002 paper "Hashcash - A Denial of Service Counter-Measure". Hashcash used
    a proof-of-work system to limit email spam and denial-of-service attacks. In order
    to send an email, a person would have to solve a cryptographic hash puzzle and
    provide a proof-of-work, with a Hashcash stamp added to the e-mail header. This
    Hashcash stamp would validate the e-mails as genuine and not spam. This proof-of-work
    would later become one of the integral concept on which Bitcoin was based.


    Similarly in 1998 Wei Dai published a paper “B-money, an anonymous, distributed,
    electronic cash system”. A proof-of-work function was used to create money. Everyone
    maintains a copy of the databases, and the work is verified by a collective ledger.
    All transactions are accomplished by collective book-keeping and authenticated
    by cryptographic hashes. These ideas would late influence the design of Bitcoin.


    ## Invention of Bitcoin


    Bitcoin adopted some key features from these inventions and learned from their
    mistakes. In 2008, Bitcoin became the first technology to succeed as cryptocurrency.
    The word Bitcoin is a compound of the words bit and coin. The domain name `bitcoin.org`
    was registered on 18th August 2008.


    On 31st October 2008, the Bitcoin whitepaper was published by an unknown person
    or group of people using the name Satoshi Nakamoto. This nine page whitepaper
    titled “Bitcoin: A Peer-to-Peer Electronic Cash System” was as proposal for framework
    of a peer-to-peer digital currency, where the network validates the transactions
    and stores the entire transaction history, enabling users not to rely on any financial
    institution to make safe transactions with one another. This whitepaper envisioned
    an anonymous, trustless, decentralized cryptocurrency which is not subject to
    any censorship or centralization, thus giving the users freedom to transact while
    protecting their privacy.


    Bitcoin was designed to be a deflationary currency, meaning there will only be
    a limited amount of Bitcoins that will ever exist, specifically 21 million. Every
    Bitcoin miner will get a block reward for finding a block, but this reward will
    decrease over time. Eventually the block reward will become 0, when 21 million
    bitcoins would have been mined.


    ## Early Bitcoin Era


    Bitcoin began use in 2009 when its implementation was released as open-source
    software. On 3rd January 2009, the bitcoin network was created when Nakamoto mined
    the starting block of the chain, known as the genesis block. The receiver of the
    first bitcoin transaction was Hal Finney, the creator of the first reusable proof-of-work
    system, who received 10 bitcoins from Nakamoto. In 2010, the first known commercial
    transaction using bitcoin occurred when programmer Laszlo Hanyecz bought two Papa
    John''s pizzas for 10,000 Bitcoins from Jeremy Turdivant. At this point, Bitcoin
    turned into a cryptocurrency with real value from a worthless internet money.
    This purchase validated the use of Bitcoin as an actual currency.


    After early "proof-of-concept" transactions, the first major users of bitcoin
    were black markets, such as Silk Road, earning the reputation of “eBay of Drugs.”
    Silk Road leveraged an anonymous network protocol called `Tor`, which made rendered
    users identity anonymous, and used Bitcoins for transactions. network, Silk Road
    was shut down by FBI in 2013. Similarly `mtgox.com`, one of the largest Bitcoin
    exchanges during the early stages, was used by hackers to siphon of funds and
    had severe breaches of security, and was handling over 70% of all bitcoin transactions
    worldwide by 2014. However, due to severe breaches of security and loosing around
    1 million of its customers Bitcoins, Mt. Gox suspended trading, closed its website
    and exchange service, and filed for bankruptcy protection from creditors in 2014.


    ## Bitcoin Rise and Mainstream Adoption


    Between 2013 and 2015, Bitcoin price fluctuated heavily, skyrocketing from less
    than $14 in 2013 to more than $1000 in 2014, then again declining by 90% and falling
    to $100. This was attributed to two factors – Chinese investors buying and selling
    Bitcoin as speculative investments, and automated trading by Mt.gox which lasted
    till 2014. The Bitcoin Foundation was founded in September 2012 to promote bitcoin''s
    development. Also, the transaction fees were reduced. In 2013, the US Financial
    Crimes Enforcement Network (`FinCEN`) established regulatory guidelines for "decentralized
    virtual currencies" such as bitcoin, classifying American miners who sell their
    bitcoins as Money Service Businesses (`MSBs`), that are subject to registration
    or other legal obligations. Meanwhile the People''s Bank of China prohibited Chinese
    financial institutions from using bitcoins, which led to decline in price again.


    In 2014, several merchants started to accept Bitcoin as a mode of payment. Crypto
    exchanges and wallet firms were also popped letting users buy and sell Bitcoins,
    and merchants accept Bitcoin, without even having to personally join the Bitcoin
    network. In September that year, PayPal partnered with Coinbase, `BitPay` and
    `GoCoin`.


    In 2015, the Bitcoin software release introduced a consensus library which gave
    programmers easy access to the rules governing consensus on the network. The developers
    could now add a new feature which allowed transactions to be made unspendable
    until a specific time in the future. In October 2016, Bitcoin released a new feature
    to optimize its block-size, which would reduce the transaction fees as well as
    increase the maximum transaction capacity of the network. Thereafter the August
    2017 release supported the Lightning Network as well as improved scalability.


    In 2018, the Bitcoin prices were negatively affected by several hacks or thefts
    from various cryptocurrency exchanges, including thefts from `Coincheck` in January
    2018, `Bithumb` in June, and `Bancor` in July. Also, Bitcoin was struggling to
    scale as transactions were becoming less efficient and more time taking, due to
    limitations in block time and block size. In March 2018, a Bitcoin block was created
    every 10 minutes and could hold only 1 MB of transaction data, which is about
    2000 transactions ~ 3 transactions per second. The transactions volume was exceeding
    Bitcoin network capacity, and transactions were being left unconfirmed as they
    were not able to be included in a block. Various increases to this limit have
    been proposed over Bitcoin''s history. Bitcoin Cash has a block size of 32 MB
    and hence 32x more throughput than Bitcoin. Bitcoin SV removed the block size
    limit altogether. This led to another issue on decentralized governance, as no
    change mechanism was included in the Bitcoin protocol.

