    The solution is in smart contracts. We can make a smart contract to guarantee
    the financial commitments for transfer of energy from house A to house B. House
    A can create a smart contract, put in $1000, and assuming if house B and another
    house C also commit $1000, then a contractor can redeem this money in exchange
    for building a smart energy grid.


    This immutable commitment scheme allows anyone to leverage smart money property
    to the fullest. Through smart contracts, we can coordinate between untrusting
    parties without a central entity. In places where the government cannot contribute
    to infrastructure, the citizens are able to do it themselves if they have the
    capital but not the system to securely combine their resources. This is one of
    the most revolutionary concepts of blockchain, giving users the ability to become
    their own service provider.


    ## Ethereum Ecosystem


    ### The Leaders

    Just like Bitcoin, the Ethereum ecosystem is constantly changing. However, Ethereum
    is a bit more politically centralized than Bitcoin. For example, we know that
    its founder it Vitalik Buterin, who is the biggest face in Ethereum. He is personally
    driving Ethereum forward, his opinions can easily shape the entire Ethereum space,
    and he controls a lot of influence.


    Vitalik currently leads the Ethereum’s research team, which contains another key
    player, Vlad Zamfir. Notably, Vitalik and Vlad have different versions for Ethereum’s
    upgrade to the Proof-of-Stake protocol.


    Another key player of Ethereum is Gavin Wood, who is famous for originally proposing
    Solidity as Ethereum’s high level programming language on top of the `EVM`.


    Nick Szabo is a researcher in digital contracts, and is known for coining the
    term “Smart Contract.”


    ### ConsenSys

    ConsenSys can be best described as a software foundry. It facilitates a variety
    of applications which operate of the Ethereum blockchain, and coordinates, incubates,
    accelerates, and spawns what it calls “spoke ventures.” For example, there is
    uPort, which is identity management, the popular Truffle development suite, MetaMask,
    which links your web browser to Ethereum, and Gnosis, the prediction market platform.
    These are all spoke ventures of ConsenSys.


    The Ethereum community also spawns a lot of original research. Most notable is
    Casper, the Ethereum’s PoS implementation protocol. There is also Plasma, a proposed
    scalability upgrade to Ethereum inspired by a similar scalability proposal for
    Bitcoin, called Lightning.


    There have been efforts to port Ethereum over to another blockchain platform called
    Cosmos, which claims to be the internet of blockchains.


    ### Ethereum Governance

    In October 2015, a development governance was proposed as the Ethereum Improvement
    Proposal (`EIP`), standardized on `EIP-1`. The core development group and community
    were to gain consensus by a process regulated `EIP`.


    Ethereum Improvement Proposals (`EIPs`) describe standards for the Ethereum platform,
    including core protocol specifications, client APIs, and contract standards. Network
    upgrades are discussed separately in the Ethereum Project Management repository.


    #### EIP status terms

    - **Idea**: An idea that is pre-draft. This is not tracked within the EIP Repository.

    - **Draft**: The first formally tracked stage of an `EIP` in development.

    - **Review**: An `EIP` Author marks an `EIP` as ready for and requesting Peer
    Review.

    - **Last Call**: The final review window for an `EIP` before moving to Final stage..
    An `EIP` editor will assign Last Call status and set a review end date (`last-call-deadline`),
    typically 14 days later.

    - **Final**: This `EIP` represents the final standard. A Final `EIP` exists in
    a state of finality and should only be updated to correct errata and add non-normative
    clarifications.

    - **Stagnant**: Any `EIP` in Draft or Review, if inactive for a period of more
    than 6 months, is moved to Stagnant. An `EIP` may be resurrected from this state
    by through moving it back to Draft.

    - **Withdrawn**: The `EIP` Author(s) have withdrawn the proposed `EIP`. If the
    idea is pursued at later date it is considered a new proposal.

    - **Living**: A special status for `EIPs` that are designed to be continually
    updated and not reach a state of finality.


    `EIPs` are separated into a number of types, and each has its own list of `EIPs`.


    - **Standard Track**: Describes any change that affects most or all Ethereum implementations,
    such as a change to the network protocol, a change in block or transaction validity
    rules, proposed application standards/conventions, or any change or addition that
    affects the interoperability of applications using Ethereum.

    - **Core**: Improvements requiring a consensus fork (e.g. `EIP-5`, `EIP-101`),
    as well as changes that are not necessarily consensus critical but may be relevant
    to “core dev” discussions.

    - **Networking**: Includes improvements around Light Ethereum Subprotocol, as
    well as proposed improvements to network protocol specifications of `whisper`
    and `swarm`.

    - **Interface**: Includes improvements around client API/RPC specifications and
    standards, and also certain language-level standards like method names (`EIP-6`)
    and contract ABIs.

    - **ERC**: Application-level standards and conventions, including contract standards
    such as token standards (`ERC-20`), name registries (`ERC-137`), URI schemes (`ERC-681`),
    library/package formats (`EIP190`), and wallet formats (`EIP-85`).

    - **Meta**: Describes a process surrounding Ethereum or proposes a change to (or
    an event in) a process. Meta `EIP` or Process `EIPs` are like Standards Track
    `EIPs` but apply to areas other than the Ethereum protocol itself. Examples include
    procedures, guidelines, changes to the decision-making process, and changes to
    the tools or environment used in Ethereum development.

    - **Informational**: Describes a Ethereum design issue, or provides general guidelines
    or information to the Ethereum community, but does not propose a new feature.
    Informational `EIPs` do not necessarily represent Ethereum community consensus
    or a recommendation, so users and implementers are free to ignore Informational
    `EIPs` or follow their advice.


    # Blockchain Platforms


    In this chapter, we will focus on the different blockchain platforms currently
    in use, gain an insight on their design features, and learn about their pros and
    cons.


    Blockchain platforms are the underlying tools to develop decentralized applications
    on blockchain technology (e.g. - enabling decentralized applications pertaining
    to multiparty cooperation or data exchange). These platforms are being used for
    generalized distributed value exchange, consisting of an expanding list of cryptographically
    signed, irrevocable transactional records shared by all participants in a network.
    Each record contains a time stamp and reference links to previous transactions.
    It is a decentralized state transition machine that manages the life cycle of
    digitalized assets and immutably records operations in a distributed ledger.


    Interest in blockchain platforms has been growing significantly to streamline
    supply chains, improve traceability, simplify trade, and improve financial transactions.
    A lot of this interest started with the speculative frenzy surrounding Bitcoin,
    which is based on an older blockchain platform that faces challenges with energy
    consumption and speed. Modern blockchain platforms have been developed to help
    overcome these limitations and provide practical value for other business uses
    and applications.


    The top three blockchain frameworks for these use cases are `R3 Corda`, `Hyperledger`
    and `Ethereum`, with `EOSIO` and `Quorum` gaining ground.


    Key features to consider for blockchain platform evaluation

