- fmt: '

    - Flash loans – These are cryptocurrency loans that borrow and repay funds in
    the same transaction. Borrowers have the potential to make money by entering into
    a contract encoded on the Ethereum blockchain, executes a transaction and repay
    the loan instantly. If the transaction can’t be executed, or it’ll be at a loss,
    the funds automatically go back to the loaner. If you do make a profit, you can
    pocket it, minus any interest charges or fees. Think of flash loans as decentralized
    arbitrage.


    Adoption of DeFi is powered by the omnipresent nature of blockchain. The moment
    a dapp is encoded on the blockchain, it’s globally available.


    ## Future of DeFi


    From taking out the middleman to turning basketball clips into digital assets
    with monetary value, DeFi’s future looks bright. Investors will have more independence,
    which will allow them to deploy assets in creative ways that seem impossible today.


    But for all its promise, DeFi has a long road ahead, especially when it comes
    to uptake by the public.


    ## Non-Fungible Tokens (NFTs)


    You may have heard of the 24-year-old artist who made over $300,000 selling her
    art as Non-Fungible Tokens (NFTs) or Rob Gronkowski selling NFTs of his best Super
    Bowl moments. With this news hitting social media, it’s no surprise how NFTs have
    become the latest cryptocurrency sensation to go mainstream.


    A non-fungible token (NFT) is a non-interchangeable unit of data stored on a blockchain.
    Unlike cryptocurrencies, NFTs cannot be traded or exchanged because they are not
    identical to one another. NFTs are typically used to buy and sell digital items
    like digital files, digital media, digital art, collectibles, and virtual real
    estate. An NFT can be associated with a particular digital asset (video / photos
    / audio) or physical asset (physical file / physical object) and a license to
    use the asset for a specified purpose. This NFT (and, if applicable, the associated
    license to use, copy or display the underlying asset) can be traded and sold on
    digital markets. NFTs use a digital ledger to provide a public certificate of
    authenticity or proof of ownership, but do not restrict the sharing or copying
    of the underlying digital files or the re-creation of identical NFTs.


    NFTs function like cryptographic tokens, but, unlike cryptocurrencies such as
    `Bitcoin` or `Ethereum`, NFTs are not mutually interchangeable, hence not fungible.
    While all bitcoins are equal, each NFT may represent a different underlying asset
    and thus may have a different value.


    NFTs are created when blockchains string records of cryptographic hash, a set
    of characters identifying a set of data, onto previous records therefore creating
    a chain of identifiable data blocks. This cryptographic transaction process ensures
    the authentication of each digital file by providing a digital signature that
    is used to track NFT ownership. However, data links that point to details such
    as where the art is stored can be affected by link rot.


    Ownership of an NFT does not inherently grant copyright or intellectual property
    rights to whatever digital asset the token represents. For example, while someone
    may sell an NFT representing their work, the buyer will not necessarily receive
    copyright privileges when ownership of the NFT is changed and so the original
    owner is allowed to create more NFTs of the same work. In such a sense, the NFT
    is merely a proof of ownership that is separate from a copyright.


    NFTs have seen some use as a speculative investment, and they have drawn criticism
    with respect to the energy cost and carbon footprint associated with validating
    blockchain transactions as well as their frequent use in art scams.


    ## How does an NFT work?


    NFTs are typically held on the `Ethereum` blockchain, although other blockchains
    support them as well. An NFT is created, or “minted” from digital objects that
    represent both tangible and intangible items, including Art, GIFs, Videos and
    sports highlights, Collectibles, Virtual avatars and video game skins, Designer
    sneakers, and Music.


    Even tweets count. Twitter co-founder Jack Dorsey sold his first ever tweet as
    an NFT for more than $2.9 million.


    Essentially, NFTs are like physical collector’s items, only digital. So instead
    of getting an actual oil painting to hang on the wall, the buyer gets a digital
    file instead. They also get exclusive ownership rights, as NFTs can have only
    one owner at a time. NFTs’ unique data makes it easy to verify their ownership
    and transfer tokens between owners. The owner or creator can also store specific
    information inside them. For example, artists can sign their artwork by including
    their signature in an NFT’s metadata.


    ## Uses of NFTs


    - **Digital Files**: NFTs have been used as a means of exchanging digital tokens
    that link to a digital file. Ownership of an NFT is often associated with a license
    to use the underlying digital asset, but generally does not confer copyright to
    the buyer. Some agreements only grant a license for personal, non-commercial use,
    while other licenses also allow commercial use of the underlying digital asset.

    - **Digital art**: Digital art is a common use case for NFTs. High-profile auctions
    of digital art as NFTs have received considerable public attention, with the work
    "Merge" by artist Pak being the most expensive NFT with a a price of $91.8 million
    dollars and `Everydays: the First 5000 Days`, by artist Mike Winkelmann, the second
    most expensive auction at $69.3 million in 2021.

    - **Games**: NFTs can be used to represent in-game assets, such as digital plots
    of land, which some commentators describe as being controlled "by the user" instead
    of the game developer by allowing assets to be traded on the 3rd party marketplaces
    without permission from the game developer. `CryptoKitties` was an early successful
    blockchain online game where players adopt and trade virtual cats. The monetization
    of NFTs within the game raised a $12.5 million investment, with some kitties selling
    for over $100,000 each. Following its success, `CryptoKitties` was added to the
    `ERC-721` standard.


    In December 2021, Ubisoft, the world’s leading gaming company, announced `Quartz`,
    “an NFT initiative which allows people to buy artificially scarce digital items
    using cryptocurrency". The announcement has raised significant criticism, with
    96% dislike ratio over the YouTube announcement video, which has since been unlisted.
    Some Ubisoft developers have also raised their concern over the announcement.


    In February 2021, NFTs reportedly generated around $25 million within the music
    industry, with artists selling artwork and music as NFT tokens. On 28th February,
    2021, electronic dance musician `3LAU` sold a collection of 33 NFTs for a total
    of $11.7 million to commemorate the three-year anniversary of his `Ultraviolet`
    album.

    - **Film**: In May 2018, 20th Century Fox partnered with Atom Tickets and released
    limited-edition `Deadpool 2` digital posters to promote the film. They were available
    from `OpenSea` and the `GFT` exchange. In March 2021, Adam Benzine''s 2015 documentary
    `Claude Lanzmann: Spectres of the Shoah` became the first motion picture and documentary
    film to be auctioned as an NFT. Other projects in the film industry using NFTs
    include the announcement that an exclusive NFT artwork collection will be released
    for `Godzilla vs. Kong` and director Kevin Smith announcing in April 2021 that
    his forthcoming horror movie `Killroy Was Here` would be released as an NFT. The
    2021 film `Zero Contact`, directed by Rick Dugdale and starring Anthony Hopkins,
    was also released as an NFT. In November 2021, film director Quentin Tarantino
    released seven NFTs based on uncut scenes of `Pulp Fiction`. `Miramax` subsequently
    filed a lawsuit claiming that their film rights were violated.

