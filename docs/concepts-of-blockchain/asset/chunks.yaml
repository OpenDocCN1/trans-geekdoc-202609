  trans: "\n智能合约是一种运行在区块链网络上的程序，它可以执行合约协议。通常，它们作为数字协议工作，强制执行一组特定的规则，而这些规则由计算机代码定义。这些代码由所有区块链网络进行复制和执行。\n\
    \n## 为什么它是区块链的关键特性之一？\n\n*   **去信任协议**：区块链智能合约允许创建去信任协议。这意味着双方可以通过区块链做出承诺，而无需相互了解或信任对方。他们可以确保，如果未满足条件，合约将不会执行。\n\
    *   **消除第三方**：智能合约的使用可以消除对中介机构或第三方的需求，从而显著降低运营成本。\n*   **更快的结算**：智能合约可以允许对任何类型的合约进行更快的结算，因为消除了第三方的干扰。这是到为止区块链特性最大的益处之一。通过这种方式，区块链也将影响国际贸易！\n\
    \n## 区块链用例概览\n\n目前正在探索许多区块链应用用例。例如，管理教育证书或个人健康信息，在这些情况下，经过你的许可，任何人都可以访问这些记录。假设你是一个美国居民，去印度度假。假设你生病并进了那里的医院，如果治疗你的医生能够完全了解你的病史，知道你的过敏源或你正在服用的药物，那不是太好了吗？这是一个非常大的领域，并将区块链与身份管理紧密结合。\n\
    \n同样，区块链投票也是一个值得探索的大领域，以确保选举的完整性并证明结果未被篡改。\n\n另一个感兴趣的领域是媒体和艺术领域的区块链，其中内容创作者可以使用区块链技术在不使用第三方或中介的情况下，通过非同化代币（`NFT`）等多种场景向公众发布他们的作品。\n\
    \n我们还看到人们对区块链碎片资产所有权场景表现出极大兴趣，在这种场景中，我们可以利用区块链代币和`NFT`来实现资产所有权的碎片化。\n\n然后，我们还有传统的用例，例如用于银行区块链以确保交易的透明度和准确性并避免欺诈；以及用于供应链区块链以跟踪商品服务的供应和来源。沃尔玛（Walmart）正在试点供应链领域使用区块链技术，通过区块链识别商店售卖肉类的源头，以便在出现任何问题时加速召回，并减少供应链的浪费。\n\
    \n在公共部门，人们对用于执法目的的区块链技术有浓厚兴趣；我们如何让不同的政府机构在安全可靠的环境中无缝共享数据，同时保护用户的隐私和匿名性。\n\n##\
    \ 区块链用户\n\n*   **企业对消费者 (B2C)**：`B2C` 业务直接在公司与其消费者（其产品或服务的终端用户）之间进行。区块链对 `B2C`\
    \ 领域的优势在于对消费者的透明度、供应商的可问责性、来源验证、劳工验证以及不可篡改的合约。\n    一个真实的用例是一家名为 `TrustChain`\
    \ 的公司，它利用区块链在从采矿到最终消费者的供应链所有阶段对钻石和其他贵金属进行跟踪和认证。结果是，珠宝行业现在可以在整个供应链的所有阶段跟踪和认证钻石和其他贵金属。区块链将实现物理产品验证、流程验证，并作为一种治理监督。\n\
    \n*   **企业对企业 (B2B)**：通过去中心化的方法，区块链消除了企业对企业交易中的银行等中介，以实现更快、更廉价的支付。共享账本的方法还消除了对不断验证和更新的多份纸质副本的需求。\n\
    \    一个真实的用例是 `DLT Labs` 和 沃尔玛加拿大`Walmart Canada`），他们启动了一个跟踪计划，以解决不同货运发票系统中的争议解决。区块链解决方案通过共享信任账本连接了供应链上的所有点。承运商是\
    \ `Walmart` 供应链中至关的一环，`DLT` 区块链解决方案确保了发票系统的顺利运行。结果是，货运管理双方与 `Walmart` 之间的争议减少了\
    \ 95%。\n\n*   **政府对消费者 (G2C)**：公共部门是经济的一部分，由代表公众运营的公私部门公司组成。公共部门包括所有政府、军队、警察、公共卫生、公共教育、基础设施、住房、金融服务和其他行业。目前的系统本质上是不安全且昂贵的，工作流效率低下。区块链技术将为公共使用提供更安全、敏捷且成本最优的平台。\n\
    \    一个真实的例子是 `Smart Dubai 2021`，`Dubai` 旨在将所有政府运营和记录保存到区块链中。目标是增加政府运营的透明度和效率。区块链正成为许多其他\
    \ `Smart Dubai` 计划的使能层，从而创建了“智慧城市”。例如，自动交通信号、公民签证和公共医疗注册等项目全都在区块链上进行试点。\n\n# 区块链机制\n\
    \n在本章中，我们将讨论分布式账本技术、其基本组件以及它与以前的账本存储技术的区别。我们将深入了解数据共享、存储和加密是如何封装在区块链基础中的，以及哈希函数和\
    \ `Merkle tree` 数据结构如何在不泄露所有细节的情况下不可篡改地存储数据。\n\n我们还将了解区块链技术如何在非对称加密中发挥基础作用，其中密钥对通过仅公开公钥并保持私钥安全来支持隐私和真实性。我们将检查这种一致的、追加式的分布式账本技术如何保证透明度和不可篡改性。\n\
    \n## 会计系统\n\n区块链的历史与会计的历史紧密结合。\n\n簿记或会计源于古老文明，甚至可以追溯到 5000 年前，那里有单式记账制的证据，它是证明资产所有权的首种方法。账本与所有者相关。单式记账制要求中央权威来控制和管理账本。单式记账一方面系统简单、易于维护，因为它是一个单侧会计系统；但另一方面，无法验证或检查其问责性。因此，随着时间的推移，人们意识到会计程序需要更多的透明度和问责性，并能够回答诸这样的问题：\n\
    \n* 谁付了什么？\n* 谁欠多少钱？\n* 哪些债务未付？\n* 为什么钱丢了？\n"
- fmt: '

    The drawbacks of the single-entry accounting became the trigger point to look
    for a more comprehensive structure and thus, came into being the Double-entry
    accounting. This new form was developed almost 600 years ago with the purpose
    of making the accounting system more comprehensive and hence, instead of maintaining
    one ledger, the accountant keeps two ledgers – one for incoming transactions and
    the other for outgoing transactions. Although the double-entry accounting method
    of bookkeeping was much more advanced and efficient than single-entry accounting,
    still there were several flaws in this too. As there was no connection between
    the different sets of accounting books, the records were separate and therefore,
    lacked in transparency and were difficult to verify. This led to a great trust
    deficit between the various stakeholders, like investors, lenders and/or the state.


    The imperfections of the double-entry accounting led to the need of an economy-wide
    accounting system, one that would help in doing away with huge amounts of administration
    and pave the way for a foolproof and dependable accounting system.


    And so, Triple-entry accounting came in, which is a step ahead of the traditional
    double-entry accounting; one that will relieve the bookkeepers and companies from
    tedious troubleshooting and help remove the mistrust, frauds or manipulations
    faced by them. Triple-entry accounting presents a framework for a new and complex
    way to do accounting. This concept was conceived by the late Yuji Ijiri, a professor
    at Carnegie Mellon University, and popularized by Ian Grigg who associated it
    with blockchain technology, and believed that accounting should no longer be completely
    private.


    Blockchain is the very first implementation of triple-entry accounting system,
    where we have an asset being recorded on the ledger in the context of a transaction.
    In simple terms, blockchain refers to a digital ledger that is distributed among
    multiple locations in order to ensure security and ease of access globally.


    The term ‘Triple-entry accounting` is somewhat misleading as there isn’t any 3rd
    entry; instead, a 3rd component is added to the debit and credit system. The common
    thread or the binding component is Blockchain that links the books together and
    helps in linking two separate double entries and can potentially be viewed for
    external auditing purposes. So, instead of individual firms having their own books
    for the transaction, they go through a contract which evidently includes every
    aspect of a transaction; what the product was, who is the seller, who is the buyer,
    etc. and above all, it’s digitally signed.


    In the triple-entry accounting system, all accounting entries are cryptographically
    sealed by a 3rd entry and thus, it works as a deterrent towards manipulations
    and financial fraud. In traditional double-entry accounting a company’s ledger
    can be compromised by any of the weak human links – may be an employee / bookkeeper
    / auditor. But this unique system of triple-entry accounting leaves no space for
    any corrupt, weak human link and the cryptographic account of the transaction
    is stored permanently and immutably on the ledger.


    As blockchains are completely automated and decentralized, once an entry is recorded,
    it cannot be edited, altered or removed. The highest level of encryption technology
    ensures the accuracy of each transaction, digitally signed, leaving no gaps for
    errors and at the same time verifiable by all. The transactions recorded on the
    blockchain using triple entry simplifies the entire double-entry accounting process
    as once a transaction is recorded on the blockchain by one of the two accountants,
    the other party can also view the particular double entry, easily review it, and
    have it recorded automatically in its own books.


    Thus, the triple-entry accounting is set to potentially revolutionize the future
    of bookkeeping as Blockchain accounting will literally halve the effort.


    ## Ledger


    Ledger is one of the core components of blockchain. In blockchain there is a copy
    of the ledger that exists on every node. In simple terms, blockchain is a distributed
    ledger. Bitcoin was the first popular asset to be recorded on blockchain. Each
    blockchain has its own set of protocols that defines not only the nodes, but how
    they communicate. These networks store the ledger, provide the updates, and effectively
    manage the ledger.


    ## History of Ledger


    In order to gain an insight into the blockchain ledger, let’s start with the history
    of the ledger.


    - **Single Entry Ledger**: First appeared around 3000 BC. Chanakya, an Indian
    economist created the first documented single-entry ledgers. They had only a single
    entry.

    - **Double Entry Ledger**: Double entry ledgers first appeared in the 14th century.
    They tracked debits and credits, and told story of financial transactions from
    buyer’s as as supplier’s point of view. Luca Pacioli, known as the father of accounting,
    was the first person to publish work on double-entry ledger, and introduce it
    in Italy.

    - **Triple Entry Ledger**: Triple entry ledger is an enhancement to the traditional
    double entry system, in which all the accounting entries involving two parties
    are cryptographically sealed by a third entity. It records all debits, credits
    as well as an immutable link to all past debits and credits. Triple entry ledger
    first appeared in the Bitcoin whitepaper written by Satoshi Nakamoto in 2008.
    The key features of triple-entry ledger include tamper-proof records, distributed
    ledger, double-entry + cryptography, validated records, secure and private, and
    digitally signed receipts.


    ## Distributed Ledgers


    The concept of distributed ledgers has been around for hundreds of years. To understand
    the basics of blockchain, it’s important to understand how distributed ledgers
    work.


    A distributed ledger is a collection of data with no central administrator that
    has been agreed upon by consensus.

    '
