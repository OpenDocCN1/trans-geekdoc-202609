    在比特币中，私钥和公钥是通过椭圆曲线数字签名算法 (`ECDSA`) 生成的。椭圆曲线加密 (`ECC`) 是一种基于有限域椭圆代数结构的公钥加密方法。与非椭圆曲线加密（基于普通伽罗华域）相比，ECC
    允许使用较小的密钥提供同等的安全性。ECDSA 提供了数字签名算法 (`DSA`)的一种变体，它使用了椭圆曲线加密。


    椭圆曲线是由以下方程定义的数学曲线：


    ```text

    y² = x³ + ax + b

    ```


    它在有限域上定义，以便在定义的空间内编码所有可能的值，从而限制密钥的大小。


    椭圆曲线具有某些独特属性，这有助于创建一个单向函数，从私钥生成公钥，而反之则不然。


    假设你想给朋友发送一条签名消息。起初你们双方必须对以下曲线参数达成共识：


    *   `Curve` – 使用的椭圆曲线域和方程

    *   `G` – 椭圆曲线基点，曲线上一个生成大素数阶 `n` 子群的点

    *   `n` – `G` 的整数阶，意味着 `n * G = O`，其中 `O` 是单位元素

    *   `dA` – 私钥（随机选择）

    *   `QA` – 公钥（通过椭圆曲线计算）

    *   `m` – 要发送的消息


    你将创建一个密钥对，由一个在区间内随机选择的私钥整数 `dA` 和一个公钥曲线点 `QA = dA * G`组成。你需要遵循以下步骤发送消息：


    1.  计算消息 `m` 的哈希值

    2.  令 `z` 为 `e` 的左侧 `Ln` 位，其中 `Ln` 是群阶 `n` 的位长度

    3.  从 `[1,n-1]` 中选择一个密码学上安全的随机整数 `k`

    4.  计算曲线点 `(x1, y1) = k * G`

    5.  计算 `r = x1 mod n`。如果 `r = 0`，跳转到第 3 步

    6.  计算 `s = k^(-1) * (z + rdA) mod n`。如果 `s = 0`，跳转到第 3 步

    7.  签名即为对 `(r,s)`


    为了让你的朋友验证你的签名，他必须拥有你的公钥曲线点 `QA` 的副本，并如下如下验证其是否为有效的曲线点：


    1.  检查 `QA` 是否等于单位元素 `O`，且坐标其他有效

    2.  检查 `QA` 是否在曲线上

    3.  检查 `n * QA = O`


    之后，他需要遵循这些步骤：


    1.  验证 `r` 和 `s` 是否为 `[1,n-1]` 中的整数。如果不是，则签名无效。

    2.  计算消息 `m` 的哈希值，其中 `hash` 是与签名生成时使用的相同函数。

    3.  令 `z` 为 `e` 的左侧 `Ln` 位。

    4.  计算 `u1 = zs^(-1) mod n` 和 `u2 = zs^(-1) mod n`

    5.  计算曲线点 `(x1, y1) = u1 * G + u2 * QA`。如果 `(x1, y1) = O`，则签名无效。

    6.  如果 `r = x1 (mod n)`，则签名有效，否则无效。


    与一般的椭圆曲线加密一样，认为 ECDSA 的公钥位大小大约是安全级别（位）大小的两倍。例如，在 80 位安全级别下，攻击者最多需要大约 `2⁸⁰` 次操作才能找到私钥，此时
    ECDSA 私钥的大小为 160 位，而 DSA 私钥的大小至少为 1024 位。


    比特币椭圆曲线被称为 `secp256k1`。它的方程为 `y² = x³ +7`。它取自一个有限域，以限制密钥大小。该曲线由几个参数指定，包括曲线公式、域和生成点。在这条椭圆曲上，我们可以使用直线和点进行点加法。要加两个点
    `P` 和 `Q`，我们画一条穿过它们的直线，直线在 x 轴另一侧交于第三个点 `R`，得到我们的结果 `P+Q`。这是一个单向函数，因为对于一个给定的 `P
    + Q` 的点 `K`，很难找到单独的点 `P` 和 `Q`。


    要发送比特币交易，用户为其私钥生成一个随机数 `n`，并使用椭圆曲线 `secp256k1` 计算公钥。为了做到这一点，他将内置于 `secp256k1`
    中的已知生成点 `P` 与自身相加 `n` 次。给定公钥 `nP`，获取私钥在计算上是不可行的，这使得从私钥生成公钥的过程是安全的。


    然后为了生成地址，我们首先用 `SHA-256` 对公钥 `nP` 哈希，然后用另一个名为 `RIPEMD-160` 的哈希函数。`SHA-256` 使地址具有量子性，使得量子计算机无法反转哈希函数。`RIPEMD-160`
    将地址大小从 256 位缩短到 160 位。使用 `SHA-256` 和 `RIOEMD-160` 的组合被称为“双哈希”或 `HASH160`。


    之后，我们得到了一个公钥哈希。下一步是让这个公钥哈希更符合人类习惯。首先，我们在之前的 `RIPEMD-160` 哈希前面添加一个版本字节，其中指定我们处于哪个网络：主网或较小的测试网。然后我们运行
    `Base58Check` 编码，将此哈希转换为 `Base58` —— 一种类似于常用的 62 位字符（A-Z, a-z, 0-9）的字母表。`Base58`
    包含所有数字 0 到 9 以及所有大小写字母，但除了大和小写的 `O` 以及大小写的 `I` 以避免歧义。


    然后我们计算校验和。


    我们对扩展的 `RIPEMD-160` 哈希执行 `SHA-256d`，对其运行两次 `SHA-256`。我们取 `SHA-256d` 的前 4 个字节作为校验和，并将其附加在扩展
    `RIPEMD-160` 哈希的末尾。将此结果转换为 `Base58` 后，我们最终得到了比特币地址。


    在这个地址中，我们成功编码了允许付款的公钥哈希、说明我们所处网络的版本字节，以及防止人为错误的校验和。如果有人复制了错误的地址，那么该地址相对于校验和将是的。


    ![](img/image0248.gif)


    ## 比特币交易流程


    一个有效的交易必须包含以下三个部分：


    *   所有权证明

    *   资金充足

    *   这些资金仅用于本次交易


    为了强制执行，比特币使用了未花费交易输出 (`UTXO`) 概念。`UTXO` 可以被想象为一个包含比特币的盒子，它可以持有任何金额。一旦你拥有了一些，在区块链上你拥有的只是一堆
    `UTXO`。在所有实际情况下，你可以认为你的 `UTXO` 是一个装满储钱罐的盒子。假设你想给朋友转账 5 个比特币，你把这 5 个比特币放入一个 `UTXO`（储钱罐）。一旦你执行该交易，你就打破了这个储钱罐，它无法再次恢复。你拥有的比特币总额是所有
    `UTXO` 价值之和。


