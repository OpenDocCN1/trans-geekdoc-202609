    # 开源代码 – 描述创建软件特定方法的代码。在描述分发开源代码的工具时，“规范工具”（Discipline Tool）指出，开源倡议拥抱并庆祝开放交换、协作参与、快速原型、透明度和以社区为导向开发的原则。开源软件是任何人都可以检查、修改和增强的代码。互联网大部分是基于开源技术构建的。计算机软件的用户从不与源代码交互，而是由程序员对其进行操纵和修复。与专有软件一样，用户必须接受许可条款，但在结构上有显著不同。`Linux`
    和 `Kubernetes` 就是开源软件的示例。


    开源软件通过共享代码以及鼓励修改和改进来促进协作。软件开发者发现，与其对软件程序收费，不如围绕和维护这些开源项目的相关服务收费更有利可。


    ## 开源软件的益处


    在开源环境中开发软件意味着愿意以透明的方式进行共享和协作。


    *   **控制** – 对于开发者来说，开源意味着个人可以对代码的发展方向贡献力量。这种开放的参与意味着参与最多的编码员对代码的方向具有更大的影响力。

    *   **培训** – 在测试环境中复制代码并进行自己更改的能力是无价的实操培训。这也促进了创新，因为程序员可以设计出以前从未想过的功能和代码方向。

    *   **安全** – 在开源中，软件程序被认为更安全，因为它们开放给同行评审，借此发现错误。只要遵循网络现有的流程，编码员就鼓励测试代码、发现错误并对漏洞开发修复方案。

    *   **稳定性** – 由于向公开评审，开源项目具有一定程度的代码稳定性。公开发布的源代码会经过公开审查，并可能暴露其他情况下可能未经过测试的情况。

    *   **社区** – 开源激发了社区参与。当为开源项目做贡献时，你加入了一个社区，这个社区最终会影响你所感兴趣的软件。


    `Bitcoin`、`Ethereum`、`Hyperledger` 以及其他区块链的编程代码都是开源的。## 治理


    《牛津英语词典》将治理（governance）定义为“治理国家、个人、活动、欲望等人的行为或事实；指导；规则；规章。”治理的基本描述可以定义为引导行为的系统。这种指导由一组规则和一种执行这些规则的机制引导，这些机制可以采取许多形式，从拥有完全控制权的独裁者到承认多数意见的民主治理模型。


    在经济学背景下，治理被定义为“利用机构、权威结构和协作来分配资源并协调社会或经济中的努力和活动”。


    另一方面，从 IT 的角度来看，治理是由领导力以及一系列结构和过程组成的，这些确保组织的 IT 能够支持并扩展其战略和目标，并专注于实现业务与 IT 之间更好的对齐。换句话说，IT
    治理是一个正式框架，为组织提供结构，以确保技术投资支持业务目标。


    区块链治理可以被视为规范与文化、法律与代码、人与机构的整合，它们促进了协调并共同决定了一个组织。## 治理模型


    由于开源环境，区块链治理模型呈现出民主色彩。区块链由用户社区组成，他们共同努力以加强系统。多数规则的程度可能有所不同。


    *   **代表制民主** – 这种治理类型由少数受社区授权的个人来建议新规则。代表所拥有的权威由多数授予。链治理的利益相关者通常包括用户、开发者和交易验证者。例如，如果你持有
    `MakerDAO` 的 `MKR` 令牌，你就可以通过其去化自治组织（DAO）对 Maker 社区提出的治理行动投票。代表反映了社区的观点。当多数意见未能均匀地反映社区时，就会出现问题，导致少数群体无法获得服务。此外，假设代表是根据其最佳利益行动。

    *   **直接民主** – 所有关于小组治理的决策由整个社区投票。在这种治理模型形式中，每一票都重要，人们拥有更多的控制权。在这种模型中，最好有一个每个人都愿意参与的受教育社区。每个区块链生态系统都需要某种治理模型。正如
    Evan Karnakis 在《比特币与区块链治理：是什么以及为什么重要》文章中所述，在传统系统中，法律是先制定后执行的。在区块链中，当网络中的参与者（矿工、开发者和用户）进行交互时，他们正以对群体最有利的方式行动。在去中心化系统中构建治理结构被证明是非常困难的。


    区块链生态中的大多数治理结构都在寻求实现以下目标：


    *   协议更改和技术升级

    *   关键漏洞和缺陷修复

    *   使用汇总资金进行研发


    这些目标可以通过不同的治理方法实现。在设计区块链时，有两个主要选择：


    *   **链上治理** – 链上治理是一种允许去中心化社区通过直接在链上投票来更新区块链的机制。在链上治理中，建立更改的规则被编码到区块链协议中。这意味着任何做出的决策都会自动转换成代码。区块链生态系统的链上治理通常发生在权益证明（Proof-of-Stake）区块链上，形式为投票，你通常必须持有该区块链的代币才能参与其治理。你的投票权重取决于你持有的代币数量。链上治理扩大了参与区块链治理过程的人群，限制了链分裂和分分的威胁，并允许个人用户注册他们的意见。某些链上治理系统确实保留了链下特征。例如，虽然提案可能编码在智能合约中，但在投票之前，通常会在论坛、博客文章和
    Twitter 上进行讨论。


