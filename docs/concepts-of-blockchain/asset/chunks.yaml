- fmt: '

    Proof-of-Stake (PoS) is another type of consensus mechanism used to validate cryptocurrency
    transactions. With this system, owners of the cryptocurrency can stake their coins,
    which gives them the right to check new blocks of transactions and add them to
    the blockchain. The first functioning use of PoS for cryptocurrency was `Peercoin`
    in 2012.


    For a blockchain transaction to be recognized, it must be appended to the blockchain.
    The miners adding the blocks receive a reward for doing so. For the blockchain
    to remain secure, it must have a mechanism to prevent malicious user or group
    from taking over. PoS accomplishes this by requiring that validators have some
    quantity of tokens on the blockchain, requiring potential attackers to acquire
    a large fraction.


    PoS model allows owners of cryptocurrency to stake coins and create their own
    validator nodes. When a block of transactions is ready to be processed, the cryptocurrency''s
    `PoS` protocol will choose a validator node to review the block. The validator
    checks if the transactions in the block are accurate. If so, they add the block
    to the blockchain and receive more rewards for their contribution. However, if
    a validator proposes adding a block with inaccurate information, they lose some
    of their holdings as a penalty.


    As an example, let''s look at how `PoS` works with `Cardano`, a major cryptocurrency
    based on `PoS` protocol. Anyone who owns `Cardano` can stake it and set up their
    own validator node. When `Cardano` needs to verify blocks of transactions, its
    `Ouroboros` protocol selects a validator. The validator checks the block, adds
    it, and receives more Cardano for their effort.


    Proof-of-Stake and Proof-of-Work are the two most common types of consensus mechanisms.
    `PoW` was the method of choice for early cryptocurrencies including `Bitcoin`
    and `Ethereum`, while `PoS` has become a common choice for altcoins. `PoS` uses
    validation of staking power to verify transactions, whereas `PoW` uses validation
    of computational prowess to verify transactions.


    ## Proof-of-Work (PoW) versus Proof-of-Stake (PoS)


    The biggest difference between `PoS` and `PoW` is their energy usage. `PoW` requires
    miners to compete to solve mathematical problems. The first miner to solve the
    problem gets to add a block of transactions and earn rewards. This results in
    mining devices around the world computing the same problems and using substantial
    energy. Since `PoS` doesn''t require validators to solve complex equations, it''s
    a much more eco-friendly way to verify transactions.


    Comparisons between `PoS` and `PoW`:


    | PoW | PoS |

    | --- | --- |

    | One computer, one vote | One coin, one vote |

    | Anyone with computer can validate blocks | Only coin owners can validate blocks
    |

    | Anonymous participation | Participants identified using digital signatures |

    | Miners are randomly selected in proportion to hash power | Validators are randomly
    selected in proportion to stake |

    | Reward is given to first miner | Collect network fees as their reward |

    | Huge energy cost in order to solve complex algorithms | Much more cost and energy
    efficient |


    The pros and cons of `PoS` protocol are as follows:


    | Pros | Cons |

    | --- | --- |

    | Energy efficient | Not as proven in terms of security as `PoW` |

    | Fast and inexpensive transaction processing | Validators with large holdings
    can have excessive influence on transaction verification |

    | Doesn’t require special equipment to solve complex problems | Some `PoS` cryptocurrencies
    require locking up staked coins for a minimum amount of time |


    `PoS` is uncertain for security risks as it is recent and not much experienced
    as `PoW`. `PoW` protocol is considered more secure regarding double-spending where
    continuous forking is discouraged by the miners as it makes the network unstable.
    While forking, miners must decide whether to follow original blockchain or adjust
    to the new blockchain. To maintain both the blockchain, miners distribute their
    computational resources to both original and the new blockchain. On the contrary,
    `PoS` called this problem as ‘nothing at stake’ problem. Here, validator receives
    a duplicate copy of stake on forked blockchain, and he can claim double transaction
    fee as reward after signing out from both. To solve this problem, this consensus
    required to enforce a deposit locked for certain periods. `Casper` is a protocol
    which encourages `PoS` protocol for the validators to participate with minimum
    deposit. The deposit could be taken away in case the protocol finds any violation
    by the validator while constant forking.


    ## Consensus Mechanisms in Private Permissioned Block


    ### Hyperledger Fabric Consensus Model

    `Hyperledger Fabric` is a private permissioned blockchain platform that breaks
    consensus into components, allowing users to pick a consensus algorithm for their
    particular situation. Instead of a predetermined consensus model, `Hyperledger`
    has an ordering service that performs consensus-related events, this ordering
    component can pick the consensus model that best suits the blockchain needs. By
    approaching consensus in this modular fashion, `Hyperledger DLT` can change consensus
    models without huge overhauls to the code base.


    ### Corda Consensus Mechanism

    `Corda` is a private permissioned blockchain. Each `Corda` network has a notary
    service made up of independent parties that approve blocks using any applicable
    consensus algorithms. As mentioned in Jamiel Sheikh’s book “Mastering Corda: Blockchain
    for Java Developers”, R3 PROVIDES A SET OF `Corda` applications called `The Corda
    Business Network Toolkit` to manage one or more `Corda` networks. `Corda` does
    not follow the standard blockchain model of transactions being bundled into blocks
    and then being finalized by the network as a whole. Instead, a `Corda` network
    contains one or more notaries consisting of several independent parties. Transactions
    in `Corda` are finalized by a notary with a multiparty digital signature using
    an algorithm like `Raft`.


    # Blockchain Governance


    In this chapter, we will cover blockchain governance. We will start by discussing
    the cooperative way blockchain companies share the computer code for this technology.
    We will also explore how this open source environment is fostering new innovations.
    And then we will examine who really is in charge of blockchains and how the network
    effect determines the direction a blockchain will take.


    Next, we will take a look at how these trustless systems with open interactions
    are more secure than past systems. Finally, we will dive into the idea of collaboration
    among parties who do not trust each other and how blockchain technology is changing
    how they can interact.


    ## Open Source


    Blockchain technology and the developers who work with it reinforce the basic
    tenet of decentralization in many ways. Not only by decision making consensus
    models, but also the way in which it distributes the software code.


    *   Proprietary / Closed source code – Software controlled by the person, team
    or organization who created it and maintains exclusive rights over it. Only the
    original authors can legally copy, inspect, and alter the software. Most users
    of proprietary software sign an agreement giving permission to use the software
    but not alter it. `Microsoft Office` is an example of proprietary software.

