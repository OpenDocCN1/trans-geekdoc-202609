  trans: '


    *   `Unlocking script (scriptSig)` – `scriptSig` 是解锁脚本，位于由花费者提供的交易输入中，用于兑回之前交易的输出。它需要一个公钥和一个数字签名。只有当签名及其验证符合一组确保网络正常运行的既定规则时，系统才会执行该交易。


    *   `Locking script (scriptPubKey)` – `scriptPubKey` 是锁定脚本，位于交易输出中，它规定了兑回交易的要求。它包含一个公钥哈希值，也称为比特币地址。这种方式的比特币交易的安排就存储在脚本的这部分。


    ## 脚本示例


    假设你想向某个地址发送一个比特币。脚本将是：


    `scriptPubKey: OP_DUP OP_HASH160 <pubKeyHash> OP_EQUALVERIFY OP_CHECKSIG`


    `scriptSig: <sig> <pubKey>`


    在这个示例中，锁定脚本要求想要从之前的交易中花费的用户必须证明他拥有一个私钥，该私钥的哈希值对应特定的地址。因此，该脚本被称为 `scriptPubKey`。为了让解锁脚本和锁定脚本协同工作，我们将解锁脚本（`scriptSig`）放在锁定脚本（`scriptPubKey`）的上方并一起运行。整个生成的脚本必须执行成功，交易才被视为有效。


    同样，假设你想冻结你的比特币直到未来的某个时间点。脚本将是：


    `scriptPubKey: <expiry time> OP_CHECKLOCKTIMEVERIFY OP_DROP OP_DUP OP_HASH160
    <pubKeyHash> OP_EQUALVERIFY OP_CHECKSIG`


    `scriptSig: <sig> <pubKey>`


    在这个示例中，如果交易的日期时间小于用户设置的未来日期时间，锁定脚本将该交易标记为无效。


    在比特币中创建脚本语言的目的是提供一系列简单且灵活的参数来启用交易。正是这种编程语言决定了某个操作是否可以执行。简单来说，`Bitcoin Script`
    的创建赋予了比特币可编程性。这使得我们能够发送一个只有在满足特定条件时才有效的交易。这种属性是比特币和加密货币所独有的，是今天的数字货币无法实现的，更不用说物理货币了。这是货币的演进达到了一个点，使得货币仅仅通过其嵌入的编程就可以独立且去中心化地运行。


    此外，比特币脚本还防止了系统错误的产生以及对非常复杂交易的不必要使用。事实上，脚本使得交易计算变得相对简单。


    ## 指向公钥哈希支付 (P2PKH)


    `Pay-to-Public-Key-Hash (P2PKH)` 是一种 `scriptPubKey` 类型，它将比特币锁定公钥的哈希值。`P2PKH` 交易是指输入使用
    `P2PKH` `scriptPubKey` 锁定的交易。公钥哈希也称为地址，`P2PKH` 是目前常见的脚本类型。


    让我们回到之前的示例，你想向某个地址发送一个比特币。脚本将是：


    `scriptPubKey: OP_DUP OP_HASH160 <pubKeyHash> OP_EQUALVERIFY OP_CHECKSIG`


    `scriptSig: <sig> <pubKey>`


    由于比特币脚本是：

    1. `OP_DUP`

    2. `OP_HASH160`

    3. `<pubKeyHash>`

    4. `OP_EQUALVERIFY`

    5. `OP_CHECKSIG`

    6. `<sig>`

    7. `<pubKey>`


    由于比特币脚本是：

    1. `OP_DUP`

    2. `OP_HASH160`

    3. `<pubKeyHash>`

    4. `OP_EQUALVERIFY`

    5. `OP_CHECKSIG`

    6. `<sig>`

    7. `<pubKey>`


    由于，

    1. `OP_DUP`

    2. `OP_HASH160`

    3. `<pubKeyHash>`

    4. `OP_EQUALVERIFY`

    5. `OP_CHECKSIG`

    6. `<sig>`

    7. `<pubKey>`


    ## 指向脚本哈希支付 (P2SH)


    `Pay-to-Script-Hash (P2SH)` 是一种 `scriptPubKey` 类型，它将比特币锁定脚本的哈希值。`P2PKH` 交易是指输入使用
    `P2PKH` `scriptPubKey` 锁定的交易。公钥哈希也称为地址，`P2PKH` 是目前常见的脚本类型。


    ## P2PKH vs P2SH


    `Pay-to-Public-Key-Hash (P2PKH)` 是一种 `scriptPubKey` 类型，它将比特币锁定公钥的哈希值。`P2PKH` 交易是指输入使用
    `P2PKH` `scriptPubKey` 锁定的交易。公钥哈希也称为地址，`P2PKH` 是目前常见的脚本类型。


    ## 多重签名 (Multisig)


    `Multisig` 指需要多个密钥来授权交易，而不是单个密钥的单一签名。典型的 `multisig` 方案是 m-of-n，即需要 n 个用户中的 m 个用户对交易进行签名，交易才被视为有效。


