    \ are, Hyperledger Aries, Hyperledger Transact, Hyperledger Ursa, Hyperledger\
    \ Besu, Hyperledger Iroha, and Hyperledger Indy.\n\nDaml\n\nDaml is a development\
    \ framework for creating systems of records that securely connect across business\
    \ processes and data boundaries while retaining privacy, guaranteeing data integrity,\
    \ and enforcing strict authorization. Allowing such systems to cross boundaries\
    \ – legal, regulatory, organizational, or other – enables them to for seamless\
    \ economic networks.\n\n*   Daml Connect – It is a complete development and application\
    \ stack allowing you to build, integrate, deploy, and maintain full-stack multi\
    \ party solutions with a minimum of boilerplate code.\n\n*   Daml Drivers – They\
    \ allow you to deploy your applications using distributed ledgers, blockchains,\
    \ or databases. Migration between ledger drivers without any code changes as the\
    \ business needs evolve.\n\n*   Daml Hub – It is a cloud service that enables\
    \ rapid distribution application deployment with an always available, easy-to-use,\
    \ and fully managed cloud environment.\n\nSIMBA Chain\n\nSIMBA Chain was founded\
    \ in 2017 from a grant awarded by the Defense Advanced Research Projects Agency\
    \ (DARPA) to Indiana Technology and Manufacturing Companies (ITAMCO) and the Center\
    \ for Research Computing (CRC) at the University of Notre Dame in order to develop\
    \ a secure, un-hackable messaging and transaction platform for the United States\
    \ military. SIMBA Chain is a cloud-based, smart-contract-as-a-service (SCaaS)\
    \ platform, enabling users across a variety of skill sets to implement decentralized\
    \ applications. These applications allow secure, direct connections between users\
    \ and providers, eliminating third parties. The easy-to-use platform is tailored\
    \ for users, developers, government, and enterprises to quickly develop blockchain\
    \ applications for their enterprise.\n\n*   SIMBA’s Smart Contract Designer –\
    \ It allows anyone to quickly and easily create smart contracts. The interface\
    \ allows users to easily build a graph of the relationships between assets and\
    \ transactions. This graphical model is then converted to Solidity Smart Contract\
    \ that can be executed on the blockchain.\n\n## End User Solutions\n\nIdentity\n\
    \nIdentity management is vital for blockchain operation. Identifying objects that\
    \ will interact with a blockchain such as people, places, things (IoT) is the\
    \ first step and consideration when developing a blockchain.\n\nOne solution is\
    \ the Verifiable Organizations Network (VON) project that enables organizations\
    \ – and the people running these organizations – to conduct business online is\
    \ a trusted environment. The core challenge is that on the internet, we can’t\
    \ tell if we are talking to you, or if someone is pretending to be you. We need\
    \ a reliable way to verify the identity of an individual in a manner appropriate\
    \ for the type of transaction and in a privacy-preserving manner.\n\nMarketplace\n\
    \nMarketplace exist to shop renewable energies to make sustainable solutions available\
    \ on open markets. Everyone knows there are countless inefficiencies in the energy\
    \ grid, stemming from the highly centralized nature of our utility systems. With\
    \ the advent of at-home energy production and storage through affordable solar\
    \ panels and home batteries, many users are storing energy surpluses at home without\
    \ a way to ‘sell’ clean energy.\n\nPower Ledger solution offers a peer-to-peer\
    \ energy trading platform. It builds global blockchain energy solutions to provide\
    \ communities access to affordable electricity that is also renewable. By increasing\
    \ the transparency for energy origins, Power Ledger could assist with providing\
    \ customers more choices for where their energy comes from. They accomplish these\
    \ goals through peer-to-peer energy trading, carbon product trading, and microgrids\
    \ management.\n\nMusic and Films\n\nNow there are new ways for artists, producers,\
    \ and labels, to get paid on time, in full royalties going directly back to the\
    \ artists, via Non Fungible Tokens (NFTs). \n\nNFTs are typically held on the\
    \ Ethereum blockchain, although other blockchains support them as well. An NFT\
    \ is created, or “minted” from digital objects that represent both tangible and\
    \ intangible items, including Art, GIFs, Videos and sports highlights, Collectibles,\
    \ Virtual avatars and video game skins, Designer sneakers, and Music.\n\nIn February\
    \ 2021, NFTs reportedly generated around $25 million within the music industry,\
    \ with artists selling artwork and music as NFT tokens. \n\nGaming\n\nThe days\
    \ of video games being just a form of entertainment are long gone. Most of the\
    \ new video games have in-app purchases and loot box features in them. These features\
    \ enable users to use real-life currency to buy new skins and weapons for their\
    \ characters and tools. With the use of DeFi, game developers can implement the\
    \ newer incentive or reward models with DeFi coins. In fact, gaming and eSports\
    \ will likely become one of the major markets as users are more tech-savvy and\
    \ open to newer technologies."
