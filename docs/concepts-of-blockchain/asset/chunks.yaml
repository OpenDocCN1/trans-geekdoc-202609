  trans: "\n\n3. 初始化 `gas = 2000`；假设交易长度为 170 字节且字节费用为 5，减去 850，因此剩余 1150 gas。\n\n\
    4. 从发送者账户中再减去 10 个 ether，并将其添加到合约账户。\n\n5. 运行代码。在这种情况下，这很简单：它检查合约索引为 2 的存储是否被占用，注意到它没有被占用，因此将索引\
    \ 2 的存储设置为值 `CHARLIE`。假设这消耗了 187 gas，那么剩余的 gas 数量为 `1150 - 187 = 963`。\n\n6. 将\
    \ `963 * 0.001 = 0.963` ether 回到发送者账户，并返回结果状态。\n\n![以太坊状态转换](img/image00260.jpeg)\n\
    \n以太坊状态转换函数示例；来源 – Ethereum.org/whitepaper/\n\n如果交易接收端没有合约，那么总交易费用将简单地等于提供的 `GASPRICE`\
    \ 乘以交易的字节长度，随交易发送的数据将是无关。\n\n消息在回滚（reverts）方面的机制与交易等效：如果消息执行耗尽了 gas，则该消息执行以及由该执行触发的所有其他执行都会回滚，但父级执行不需要回滚。这意味着合约调用另一个合约是“安全”的，例如如果\
    \ `A` 使用 `G` gas 调用 `B`，那么 `A` 的执行保证最多只会损失 `G` gas。\n\n注意，有一个用于创建合约的 `OPCODE`\
    \ 称为 `CREATE`；其执行机制通常与 `CALL` 类似，不同之处在于执行输出决定了新创建合约的代码。\n\n## 代码执行\n\n以太坊合约中的代码是用一种低层的、基于栈的字节码语言编写的，被称为“以太坊虚拟机代码”或“EVM\
    \ 代码”。代码由一系列字节组成，每个字节代表一种操作。通常情况下，代码执行是一个无限循环，它不断重复执行当前程序计数器（从零开始）处的操作，然后将程序计数器加\
    \ 1，直到到达代码末尾或检测到错误、`STOP` 或 `RETURN` 指令。这些操作可以访问三种空间来存储数据：\n\n*   栈（stack），一个后进先出（LIFO）容器，可以向其中推入和弹出值\n\
    *   内存（Memory），一个无限扩展的字节数组\n*   合约的长期存储（storage），一个键值存储器。与计算结束后就会重置的栈和内存不同，存储会持久存在。\n\
    \n代码还可以访问传入消息的值、发送者和数据，以及区块头数据，代码还可以返回一个字节数组作为输出。\n\n## 以太坊挖\n\n![以太坊应用区块图](img/image00261.jpeg)\n\
    以太坊应用区块图；来源 – Ethereum.org/whitepaper/\n\n以太坊区块链在许多方面与比特币区块链相似，尽管它确实存在一些差异。以太坊和比特币在区块链架构方面的主要区别在于，与比特币不同，以太坊区块包含了交易列表和最新状态的副本。除了之外，另外两个值——区块高度和难度——也存储在区块中。以太坊的基本区块验证算法如下：\n\
    \n1. 检查引用的上一个区块是否存在并有效。\n2. 检查区块的时间戳大于引用的上一个区块的时间戳，且小于未来 15 分钟。\n3. 检查区块高度、难度、交易根、叔块根（uncle\
    \ root）和 gas 限制是否有效。\n4. 检查区块上的工作证明（Proof-of-Work）是否有效。\n5. 令 `S[0]` 为上一个区块结束状态。\n\
    6. 令 `TX` 为区块交易列表，包含 `n` 个交易。对于 `0...n-1` 中的所有 `i`，设置 `S[i+1] = APPLY(S[i],TX[i])`。如果任何应用返回错误，或者到为止区块消耗的总\
    \ gas 超过了 `GASLIMIT`，则返回错误。\n7. 令 `S_FINAL` 为 `S[n]`，加上支付给矿工的区块奖励。\n8. 检查状态 `S_FINAL`\
    \ 的 Merkle 根是否等于区块头中提供的最终状态根。如果是，则区块有效；否则无效。\n\n状态存储在树形结构中，在每个区块之后，只需要更改树的一小部分。因此，通常在两个相邻区块之间，树的大部分应该是相同的，因此数据可以存储一次并使用指针（即子树的哈希值）引用两次。\n\
    \n 使用一种称为“帕特里树”（Patricia tree）的特殊树来实现此，包括对 Merkle 树概念的修改，允许高效地插入和删除节点，而不只是修改。此外，由于所有状态信息都是最后一个区块的一部分，因此不需要存储整个区块链历史——这种策略如果能应用于比特币，计算得出可以节省\
    \ 5 到 20 倍的空间。\n\n一个常见的问题是就物理硬件而言，合约代码在“哪里”执行。有一个简单的答案：执行合约代码的过程是状态转换函数定义的一部分，它是区块验证算法的一部分，因此如果交易被添加到区块\
    \ `B` 中，由该交易产生的代码执行将会被执行。\n\n## Ethash\n\nEthash 是以太坊计划中的工作证明（PoW）算法。该算法采用的通用路线如下：\n\
    \n1. 存在一个种子（seed），通过扫描到那时的区块头可以为每个区块计算出来。\n2. 从种子开始，可以计算出一个 16 MB 的伪随机缓存。轻客户端存储该缓存。\n\
    3. 从缓存中，我们可以生成一个 1 GB 的数据集，其属性是数据集中的每项仅依赖于缓存中的少数几项。全节点和矿工存储该数据集。数据集随时间线性增长。\n\
    4. 挖矿涉及获取数据集的随机切片并对其进行哈希处理。可以使用低内存进行验证，使用缓存重新生成你需要的特定数据集部分，因此你只需要存储缓存。\n\n大型数据集每\
    \ 3000 个区块更新一次，因此矿工的大部分工作将是读取数据集，而不是修改它。Ethash 是内存受限的，并声称能够抗 ASIC。\n\n## 以太坊虚拟机\
    \ (EVM)\n\n以太坊智能合约通常用高层编程语言编写。最流行的是 `Solidity`，它是 `C++` 和 `JavaScript` 的混合体。还有\
    \ `Vyper`，是一种目前正在开发的新语言。用这些高层语言编写的智能合约必须编译为以太坊虚拟机（EVM）代码。\n\n![](img/image00262.gif)\n\
    \n因此，我们从高级、人类可读语言开始，将其编译为 `EVM` 代码，这是一种低级、简单的语言，机器更容易理解和执行。\n\n当这些代码编译成 `EVM`\
    \ 代码后，以太坊网络中的每个节点都会执行它。只要它们拥有最新版本的 `EVM` 软件，所有节点都以相同的方式执行代码。节点通过执行工作证明协议对新的系统状态达成共识。通过工作证明将投票权与计算能力绑定，可以防止女巫攻击（攻击者通过创建大量伪匿名身份来破坏计算机网络的声誉系统，并利用这些身份获得不成比例的影响）。在以太坊中，区块生成时间为\
    \ 15 秒，而比特币为 10 分钟。这使得智能合约的执行可以快速地完成并确认。\n\n"
- fmt: "\nEthereum miners competitively create blocks by executing the `EVM` code\
    \ and searching for a solution to the mining puzzle. Since `PoW` is a competition,\
    \ only one miner is able to add the block to the Ethereum network, and claim the\
    \ block reward.\n\nEvery Ethereum node runs the `EVM` as a part of its block verification\
    \ process. Contract codes are run by `EVM`. This allows the contracts to live\
    \ on the blockchain forever.\n\nSince `EVM` is a low level bytecode language,\
    \ we can compile complex smart contract codes into simple machine understandable\
    \ instructions in the form of `EVM` code, that all the nodes in the network can\
    \ execute in same deterministic way, and come to a consensus.\n\nAlso, every `EVM\
    \ OPCODE` requires `gas` in order to execute, thereby preventing the infinite\
    \ loop denial of service attack, where attackers trap the computers in the Ethereum\
    \ network in a infinite loop, thereby making them unable to execute more meaningful\
    \ contracts.\n\nOnce the nodes come to a consensus on the network state, the code\
    \ execution on the `EVM` changes the state.\n\n## Ethereum Applications and Use\
    \ Cases\n\nIn general, there are three categories of applications on top of Ethereum.\n\
    \n* The first category is financial applications, providing users with more powerful\
    \ ways of managing and entering into contracts using their money. This includes\
    \ sub-currencies, financial derivatives, hedging contracts, savings wallets, wills,\
    \ and ultimately even some classes of full-scale employment contracts.\n* The\
    \ second category is semi-financial applications, where money is involved but\
    \ there is also a heavy non-monetary side to what is being done; a perfect example\
    \ is self-enforcing bounties for solutions to computational problems.\n* The third\
    \ category is non financial applications, such as online voting and decentralized\
    \ governance.\n\nFew key applications of Ethereum are as follows:\n\n### Token\
    \ Systems\n\nOn-blockchain token systems have many applications ranging from sub-currencies\
    \ representing assets such as dollar or gold to company stocks, individual tokens\
    \ representing smart property, secure unforgeable coupons, and even token systems\
    \ with no ties to conventional value at all, used as point systems for incentivization.\
    \ Token systems are surprisingly easy to implement in Ethereum.\n\nThe key point\
    \ to understand is that all a currency, or token system, fundamentally is, is\
    \ a database with one operation: `subtract X units from A and give X units to\
    \ B`, with the provision that\n\n11. `A` had at least `X` units before the transaction\
    \ and\n12. The transaction is approved by `A`.\n\nAll that it takes to implement\
    \ a token system is to implement this logic into a contract. The basic code for\
    \ implementing a token system in `Serpent` looks as follows:\n\n```python\ndef\
    \ send(to, value):\n    if self.storage[msg.sender] >= value:\n        self.storage[msg.sender]\
    \ = self.storage[msg.sender] - value\n        self.storage[to] = self.storage[to]\
    \ + value\n```\n\nThis is essentially a literal implementation of the \"banking\
    \ system\" state transition function described further above in this document.\
    \ A few extra lines of code need to be added to provide for the initial step of\
    \ distributing the currency units in the first place and a few other edge cases,\
    \ and ideally a function would be added to let other contracts query for the balance\
    \ of an address. But that's all there is to it.\n\nTheoretically, Ethereum-based\
    \ token systems acting can potentially include another important feature that\
    \ on-chain Bitcoin-based meta-currencies lack: the ability to pay transaction\
    \ fees directly in that currency. The way this would be implemented is that the\
    \ contract would maintain an `Ether` balance with it it would refund `Ether` used\
    \ to pay fees to the sender, and it would refill this balance by collecting the\
    \ internal currency units that it takes in fees and reselling them in a constant\
    \ running auction. Users would thus need to \"activate\" their accounts with `Ether`,\
    \ but once the `Ether` is there it would be reusable because the contract would\
    \ refund it each time.\n\nCurrently there are two types of tokens which are based\
    \ on Ethereum:\n\n* `ERC-20 Tokens`: The `ERC-20` (Ethereum Request for Comments\
    \ 20) Token Standard allows for fungible tokens on the Ethereum blockchain. The\
    \ standard, proposed by Fabian Vogelsteller in November 2015, implements an API\
    \ for tokens within smart contracts. The standard provides functions including\
    \ the transfer of tokens from one account to another, getting the current token\
    \ balance of an account and getting the total supply of the token available on\
    \ the network. Smart contracts that correctly implement `ERC-20` processes are\
    \ called `ERC-20 Token Contracts` and help keep track of the created tokens on\
    \ Ethereum. Numerous cryptocurrencies have launched as `ERC-20` tokens and have\
    \ been distributed through initial coin offerings. Fees to send `ERC-20` tokens\
    \ must be paid with `Ether`.\n* `Non-fungible Tokens (NFTs)`: Ethereum also allows\
    \ for the creation of unique and indivisible tokens, called non-fungible tokens\
    \ (`NFTs`). Since tokens of this type are unique, they have been used to represent\
    \ such things as collectibles, digital art, sports memorabilia, virtual real estate,\
    \ and items within games. Land, buildings and avatars in blockchain-based virtual\
    \ worlds can also be bought and sold as `NFTs`, sometimes for hundreds of thousands\
    \ of dollars. The first NFT project, `Etheria`, a 3D map of tradable and customizable\
    \ hexagonal tiles, was deployed to the network in October 2015 and demonstrated\
    \ live at `DEVCON1` in November of that year. In 2021, Christie's sold a digital\
    \ image with an NFT by Beeple for $69.3 million, making him the 3rd most valuable\
    \ living artist in terms of auction prices at the time.\n\n### Financial derivatives\
    \ and Stable-Value Currencies\n\nFinancial derivatives are the most common application\
    \ of a \"smart contract\", and one of the simplest to implement in code. The main\
    \ challenge in implementing financial contracts is that the majority of them require\
    \ reference to an external price ticker; for example, a very desirable application\
    \ is a smart contract that hedges against the volatility of `Ether` with respect\
    \ to the US dollar, but doing this requires the contract to know what the value\
    \ of `ETH/USD` is. The simplest way to do this is through a \"data feed\" contract\
    \ maintained by a specific party, for example, `NASDAQ`, designed so that that\
    \ party has the ability to update the contract as needed, and providing an interface\
    \ that allows other contracts to send a message to that contract and get back\
    \ a response that provides the price.\n\nGiven that critical ingredient, the hedging\
    \ contract would look as follows:\n\n1. Wait for party `A` to input 1000 `Ether`.\n\
    2. Wait for party `B` to input 1000 `Ether`.\n3. Record the US `$` value of 1000\
    \ `Ether`, calculated by querying the data feed contract, in storage, say this\
    \ is `$ x`.\n4. After 30 days, allow `A` or `B` to \"reactivate\" the contract\
    \ to send `$x` worth of ether to `A` and the rest to `B`.\n\nSuch a contract would\
    \ have significant potential in crypto-commerce.\n\nOne of the main problems cited\
    \ about cryptocurrency is the fact that it's volatile; although many users and\
    \ merchants may want the security and convenience of dealing with cryptographic\
    \ assets, they many not wish to face that prospect of losing, let’s say, 23% of\
    \ the value of their funds in a single day. The most commonly proposed solution\
    \ has been issuer-backed assets; such that an issuer creates a sub-currency in\
    \ which they have the right to issue and revoke units, and provide one unit of\
    \ the currency to anyone who provides them with one unit of a specified underlying\
    \ asset (eg. gold, US $). The issuer then promises to provide one unit of the\
    \ underlying asset to anyone who sends back one unit of the crypto-asset. In practice,\
    \ however, issuers are not always trustworthy, and in some cases the banking infrastructure\
    \ is too weak, or too hostile, for such services to exist.\n"
  raw: "Ethereum miners competitively create blocks by executing the EVM code and\
    \ searching for a solution to the mining puzzle. Since PoW is a competition, only\
    \ one miner is able to add the block to the Ethereum network, and claim the block\
    \ reward.\n\nEvery Ethereum node runs the EVM as a part of its block verification\
    \ process. Contract codes are run by EVM. This allows the contracts to live on\
    \ the blockchain forever. \n\nSince EVM is a low level bytecode language, we can\
    \ compile complex smart contract codes into simple machine understandable instructions\
    \ in the form of EVM code, that all the nodes in the network can execute in same\
    \ deterministic way, and come to a consensus.\n\nAlso, every EVM OPCODE requires\
    \ ‘gas’ in order to execute, thereby preventing the infinite loop denial of service\
    \ attack, where attackers trap the computers in the Ethereum network in a infinite\
    \ loop, thereby making them unable to execute more meaningful contracts. \n\n\
    Once the nodes come to a consensus on the network state, the code execution on\
    \ the EVM changes the state. \n\n## Ethereum Applications and Use Cases\n\nIn\
    \ general, there are three categories of applications on top of Ethereum. \n\n\
    *   The first category is financial applications, providing users with more powerful\
    \ ways of managing and entering into contracts using their money. This includes\
    \ sub-currencies, financial derivatives, hedging contracts, savings wallets, wills,\
    \ and ultimately even some classes of full-scale employment contracts. \n\n* \
    \  The second category is semi-financial applications, where money is involved\
    \ but there is also a heavy non-monetary side to what is being done; a perfect\
    \ example is self-enforcing bounties for solutions to computational problems.\
    \ \n\n*   The third category is non financial applications, such as online voting\
    \ and decentralized governance.\n\nFew key applications of Ethereum are as follows:\n\
    \nToken Systems\n\nOn-blockchain token systems have many applications ranging\
    \ from sub-currencies representing assets such as dollar or gold to company stocks,\
    \ individual tokens representing smart property, secure unforgeable coupons, and\
    \ even token systems with no ties to conventional value at all, used as point\
    \ systems for incentivization. Token systems are surprisingly easy to implement\
    \ in Ethereum. \n\nThe key point to understand is that all a currency, or token\
    \ system, fundamentally is, is a database with one operation: subtract X units\
    \ from A and give X units to B, with the provision that \n\n1.  A had at least\
    \ X units before the transaction and \n\n2.  The transaction is approved by A.\
    \ \n\nAll that it takes to implement a token system is to implement this logic\
    \ into a contract. The basic code for implementing a token system in Serpent looks\
    \ as follows:\n\ndef send(to, value):\n\n    if self.storage\\[msg.sender\\] >=\
    \ value:\n\n        self.storage\\[msg.sender\\] = self.storage\\[msg.sender\\\
    ] - value\n\n        self.storage\\[to\\] = self.storage\\[to\\] + value\n\nThis\
    \ is essentially a literal implementation of the \"banking system\" state transition\
    \ function described further above in this document. A few extra lines of code\
    \ need to be added to provide for the initial step of distributing the currency\
    \ units in the first place and a few other edge cases, and ideally a function\
    \ would be added to let other contracts query for the balance of an address. But\
    \ that's all there is to it. \n\nTheoretically, Ethereum-based token systems acting\
    \ can potentially include another important feature that on-chain Bitcoin-based\
    \ meta-currencies lack: the ability to pay transaction fees directly in that currency.\
    \ The way this would be implemented is that the contract would maintain an Ether\
    \ balance with which it would refund Ether used to pay fees to the sender, and\
    \ it would refill this balance by collecting the internal currency units that\
    \ it takes in fees and reselling them in a constant running auction. Users would\
    \ thus need to \"activate\" their accounts with Ether, but once the Ether is there\
    \ it would be reusable because the contract would refund it each time. \n\nCurrently\
    \ there are two types of tokens which are based on Ethereum:\n\n*   ERC-20 Tokens\
    \ – The ERC-20 (Ethereum Request for Comments 20) Token Standard allows for fungible\
    \ tokens on the Ethereum blockchain. The standard, proposed by Fabian Vogelsteller\
    \ in November 2015, implements an API for tokens within smart contracts. The standard\
    \ provides functions including the transfer of tokens from one account to another,\
    \ getting the current token balance of an account and getting the total supply\
    \ of the token available on the network. Smart contracts that correctly implement\
    \ ERC-20 processes are called ERC-20 Token Contracts and help keep track of the\
    \ created tokens on Ethereum. Numerous cryptocurrencies have launched as ERC-20\
    \ tokens and have been distributed through initial coin offerings. Fees to send\
    \ ERC-20 tokens must be paid with Ether.\n\n*   Non-fungible Tokens (NFTs) – Ethereum\
    \ also allows for the creation of unique and indivisible tokens, called non-fungible\
    \ tokens (NFTs). Since tokens of this type are unique, they have been used to\
    \ represent such things as collectibles, digital art, sports memorabilia, virtual\
    \ real estate, and items within games. Land, buildings and avatars in blockchain-based\
    \ virtual worlds can also be bought and sold as NFTs, sometimes for hundreds of\
    \ thousands of dollars. The first NFT project, Etheria, a 3D map of tradable and\
    \ customizable hexagonal tiles, was deployed to the network in October 2015 and\
    \ demonstrated live at DEVCON1 in November of that year. In 2021, Christie's sold\
    \ a digital image with an NFT by Beeple for $69.3 million, making him the 3rd\
    \ most valuable living artist in terms of auction prices at the time. \n\nFinancial\
    \ derivatives and Stable-Value Currencies\n\nFinancial derivatives are the most\
    \ common application of a \"smart contract\", and one of the simplest to implement\
    \ in code. The main challenge in implementing financial contracts is that the\
    \ majority of them require reference to an external price ticker; for example,\
    \ a very desirable application is a smart contract that hedges against the volatility\
    \ of Ether with respect to the US dollar, but doing this requires the contract\
    \ to know what the value of ETH/USD is. The simplest way to do this is through\
    \ a \"data feed\" contract maintained by a specific party, for example, NASDAQ,\
    \ designed so that that party has the ability to update the contract as needed,\
    \ and providing an interface that allows other contracts to send a message to\
    \ that contract and get back a response that provides the price.\n\nGiven that\
    \ critical ingredient, the hedging contract would look as follows:\n\n1.  Wait\
    \ for party A to input 1000 Ether.\n\n2.  Wait for party B to input 1000 Ether.\n\
    \n3.  Record the US $ value of 1000 Ether, calculated by querying the data feed\
    \ contract, in storage, say this is $ x.\n\n4.  After 30 days, allow A or B to\
    \ \"reactivate\" the contract to send $x worth of ether to A and the rest to B.\n\
    \nSuch a contract would have significant potential in crypto-commerce.\n\nOne\
    \ of the main problems cited about cryptocurrency is the fact that it's volatile;\
    \ although many users and merchants may want the security and convenience of dealing\
    \ with cryptographic assets, they many not wish to face that prospect of losing,\
    \ let’s say, 23% of the value of their funds in a single day. The most commonly\
    \ proposed solution has been issuer-backed assets; such that an issuer creates\
    \ a sub-currency in which they have the right to issue and revoke units, and provide\
    \ one unit of the currency to anyone who provides them with one unit of a specified\
    \ underlying asset (eg. gold, US $). The issuer then promises to provide one unit\
    \ of the underlying asset to anyone who sends back one unit of the crypto-asset.\
    \ In practice, however, issuers are not always trustworthy, and in some cases\
    \ the banking infrastructure is too weak, or too hostile, for such services to\
    \ exist. "
