    \ However in a blockchain, there are only 2 possible operations: create a new\
    \ record, and read existing records. This contributes to the idea of immutability,\
    \ that once data is written in the blockchain it cannot be edited or deleted.\
    \ In order to update the date, you need to append another record over the existing\
    \ record showcasing that something about that data has changed.\n\nThis immutability\
    \ is what make blockchain a secure and trustless solution, meaning that I do not\
    \ have to trust anybody that I am interacting with on the blockchain, as long\
    \ as we both trust in the blockchain and the data on the blockchain. Hence, we\
    \ can transact back and forth seamlessly. \n\nThe way immutability work in the\
    \ blockchain is very inefficient. We are asking a large number of nodes on the\
    \ network to perform exactly the same operation as every other node, resulting\
    \ in duplication of work over and over again. The reason to do this is, because\
    \ it ensures that the only way to change data on the blockchain is by changing\
    \ that data on 51% or more of the nodes on that blockchain. Moreover, when the\
    \ network becomes very large, Bitcoin for example having thousands of nodes, it\
    \ becomes practically impossible to change data on the blockchain.\n\nOne important\
    \ point to note is that blockchain does not do anything to validate that the information\
    \ written on it is correct. It only validates that the information has not changes\
    \ since it was originally written.\n\nThe immutability that blockchain provides\
    \ is that data has not changed since it was originally written. Another part of\
    \ this immutability is cryptographic hashing, and the way all the blocks are chained\
    \ together. The blockchain is designed such that immutability is cumulative; each\
    \ node is linked to every other node, creating a cohesive whole that becomes more\
    \ difficult to tamper or alter. If I ever go back and try to change any information\
    \ or prior transaction on the blockchain, I would break the chain in a very obvious\
    \ way that anyone would immediately spot that data has been altered on the blockchain.\n\
    \n*   At the bottom level, transactions are digitally signed by their creators.\
    \ An attacker cannot forge a transaction unless they steal a private key\n\n*\
    \   A block structure is predefined. Attackers cannot modify it\n\n*   Each block\
    \ includes the hash of the previous block, creating a chain between each block\
    \ in the blockchain, which will break if tampered\n\n*   Each block is digitally\
    \ signed by its creator. The creator is selected through blockchain consensus\
    \ protocol, making it difficult for an attacker to be a legitimate creator.\n\n\
    All these four features make blockchain immutable and tamper proof.\n\n# Blockchain\
    \ Functions\n\nIn this chapter, we will focus on the blockchain functions. First,\
    \ we will discuss smart contracts, how blockchain have the ability to store and\
    \ run applications that can execute the terms of an agreement. These digital agreements\
    \ stored and executed on the blockchains remove intermediaries and ambiguity,\
    \ thereby reducing conflicts.\n\nWe will discuss how blockchain secure information\
    \ and how the techniques differ from the traditional database security. Next,\
    \ we will discuss different types of blockchains (public, private, and hybrid)\
    \ and design principles for blockchain development. We will examine steps in a\
    \ basic blockchain transaction from start to finish."
