- fmt: "\nIn September 2019 the Intercontinental Exchange (the owner of the NYSE)\
    \ began trading of bitcoin futures on its exchange called `Bakkt`. On 13th March\
    \ 2020, due to the onset of the COVID-19 pandemic, bitcoin fell below $4,000 during\
    \ a broad market selloff from above $10,000 in February 2020, after 281,000 bitcoins\
    \ were sold, held by owners for only thirty days. In August 2020, MicroStrategy\
    \ invested $250 million in bitcoin as a treasury reserve asset. In October 2020,\
    \ Square, Inc. placed approximately 1% of total assets ($50 million) in bitcoin.\
    \ In November 2020, PayPal announced that US users could buy, hold, or sell bitcoin.\
    \ In December 2020 Massachusetts Mutual Life Insurance Company announced a bitcoin\
    \ purchase of USD $100 million, or roughly 0.04% of its general investment account.\
    \ In February 2021 Tesla made a bitcoin purchase of USD $1.5 billion and announced\
    \ the plan to start accepting bitcoin as payment for vehicles. However in May\
    \ 2021, Tesla reversed course on 12 May 2021, saying they would no longer take\
    \ Bitcoin due to concerns that \"mining\" the cryptocurrency was contributing\
    \ to the consumption of fossil fuels and climate change. In September 2020, the\
    \ Canton of Zug, Switzerland, announced to start to accepting tax payments in\
    \ bitcoin by February 2021. In June 2021, the Legislative Assembly of El Salvador\
    \ voted legislation to make Bitcoin legal tender in El Salvador, making it the\
    \ 1st country to formally introduce Bitcoin as a legal tender. In October 2021,\
    \ US SEC approved the ProShares Bitcoin Strategy ETF, a cash-settled futures exchange-traded\
    \ fund (ETF).\n\n## Why did Bitcoin Technology succeed as cryptocurrency?\n\n\
    Decentralized networks generally suffer from problems like having no central entities\
    \ to ask for information about user accounts, or to identify malicious users,\
    \ leading to certain inconsistencies between users and malicious entities infecting\
    \ the network, the most popular attack being double spending attack. Bitcoin Technology\
    \ solves these problems though two inherent concepts:\n\n1. **Blockchain network**\
    \ which enables the transactions to be validated and broadcasted in the entire\
    \ network using readily available software applications. When a transaction occurs,\
    \ the network nodes validate these transactions, add them to their copy of the\
    \ ledger, and then broadcast these ledger additions to other nodes. Once these\
    \ transactions are accepted in the network, they become a block. Thereafter using\
    \ the `Proof-of-Work` protocol, these blocks are added to the blockchain, and\
    \ quickly published to all nodes, without requiring central oversight. This enables\
    \ the network to determine when a particular bitcoin was spent, which is needed\
    \ to prevent double-spending.\n\n2. **Proof-of-Work (PoW) protocol**. To be accepted\
    \ by the rest of the network, the ledger must contain a proof-of-work. The `Proof-of-Work`\
    \ requires the Bitcoin miners to solve an arbitrary mathematical puzzle to find\
    \ a number called a `nonce` or ‘number one’, which is a random arbitrary number\
    \ issued in an authentication protocol to ensure that old communications cannot\
    \ be reused in replay attacks. It can be used just once in a cryptographic communication,\
    \ such that when the block content is hashed along with the `nonce`, the result\
    \ is numerically smaller than the network's difficulty target. As a result, a\
    \ new hash (a long string of characters) is generated that matches the target\
    \ hash for the current block. This new block is added to the network and published\
    \ to all the nodes, and the crypto miner who solves the problem this wins the\
    \ right to add that block to the blockchain and receive rewards. Proof of work\
    \ is this a form of adding new blocks of transactions to a cryptocurrency's blockchain.\n\
    \nThese two concepts enable anyone with access to internet join the Bitcoin network,\
    \ verify and audit transaction history on their own, as well as create Bitcoins\
    \ through mining via `Proof-of-Work`.\n\n## Bitcoin Identity\n\nIn finance domain,\
    \ identity is a means of authentication to ensure no one else acts on your behalf\
    \ while accessing your financial accounts or conducting transactions. By authenticating,\
    \ people can access their money as well as conduct financial transactions. If\
    \ someone else tries to do implicate your identity and withdraw money from your\
    \ bank, you can get a record of this, get the identity of the person trying to\
    \ impersonate you, ban them from your network and get rid of such malicious activities\
    \ in the future.\n\nNow in the context of Bitcoin, if you want to send your friend\
    \ 1 Bitcoin, he should not be able to add another 0 and make it 10 Bitcoins. He\
    \ should also not be to replicate your signature. Bitcoin ensures prevention of\
    \ such things and integrity of its network through digital signature. It has both\
    \ public and private keys. Public key is the key you give to the public to communicate\
    \ with you, and private key is the secret key that only you own and use to access\
    \ your account.\n\n![](Images/image00238.gif)\n\nIn context of Bitcoin, public\
    \ key can be considered as a locker, and private key can be considered as a key.\
    \ Public key is used for receiving money, and private key is used for redeeming\
    \ money. Other users send Bitcoins to your Bitcoin address, which is derived from\
    \ your public key. To generate an identity, the user selects a random15 private\
    \ key and generates the public key from the private key, using a mathematical\
    \ function. The public-private key concept ensure unique identity of users and\
    \ their authentication in the Bitcoin space\n\n## Bitcoin Consensus \n\nSince\
    \ blockchain information is stored by everyone in the network, a consensus is\
    \ needed to ensure that everyone agrees on the transactions history. Not only\
    \ do all the users need to agree on any transaction update, but they also need\
    \ to agree on a valid transaction update to make sure that no corrupted information\
    \ is acquired by the network.\n\nOne of Bitcoin’s most unique features is its\
    \ consensus algorithm, which set the precedent for a Byzantine Fault Tolerant\
    \ (BFT) peer-to-peer currency system. Byzantine Fault Tolerance is a mechanism\
    \ that enables a decentralized, trustless network to function even in the presence\
    \ of malfunctioning or malicious nodes. Byzantine fault tolerance can be achieved\
    \ if the loyal (non-faulty) generals have a majority agreement.\n\nThe most common\
    \ definition of Bitcoin’s consensus algorithm is proof-of-work (`PoW`), the consensus\
    \ mechanism that relies on participants solving cryptographic puzzles to validate\
    \ new information. However, PoW is part of a larger consensus algorithm that is\
    \ commonly known as `Nakamoto Consensus`. Nakamoto Consensus is what made Bitcoin\
    \ different from prior digital currency implementations.\n\n`PoW` refers to the\
    \ cryptographic mechanism that relies on participants being able to solve hard\
    \ computational problems to have a higher stake in the network. `PoW` essentially\
    \ is a distributed way for participants to determine the most valid block. Each\
    \ participant attempts to find a hash value, which is a valid solution for the\
    \ upcoming block of transactions. The winner who finds the hash value that meets\
    \ the requirement, adds the proposal block to the chain, and obtains the reward.\n\
    \nHashcash proof-of-work is utilized using a hashing algorithm `SHA-256`. This\
    \ involves finding a value `x` such as that when `x` is hashed with this algorithm,\
    \ the required value is found. This is often an iterative process; nonces (numbers\
    \ used once) are added to the end of the string being hashed each successive round\
    \ until the required value is given. Once the participant manages to find a solution\
    \ to the `PoW`, they broadcast their block to the rest of the network, where it\
    \ is then approved if none of the transactions within have already been spent.\
    \ Participant then receives a reward in Bitcoin as compensation for the amount\
    \ of computing power they spent in order to validate the next block of transactions.\n"
  raw: "In September 2019 the Intercontinental Exchange (the owner of the NYSE) began\
    \ trading of bitcoin futures on its exchange called Bakkt. On 13th March 2020,\
    \ due to the onset of the COVID-19 pandemic, bitcoin fell below $4,000 during\
    \ a broad market selloff from above $10,000 in February 2020, after 281,000 bitcoins\
    \ were sold, held by owners for only thirty days. In August 2020, MicroStrategy\
    \ invested $250 million in bitcoin as a treasury reserve asset. In October 2020,\
    \ Square, Inc. placed approximately 1% of total assets ($50 million) in bitcoin.\
    \ In November 2020, PayPal announced that US users could buy, hold, or sell bitcoin.\
    \ In December 2020 Massachusetts Mutual Life Insurance Company announced a bitcoin\
    \ purchase of USD $100 million, or roughly 0.04% of its general investment account.\
    \ In February 2021 Tesla made a bitcoin purchase of USD $1.5 billion and announced\
    \ the plan to start accepting bitcoin as payment for vehicles. However in May\
    \ 2021, Tesla reversed course on 12 May 2021, saying they would no longer take\
    \ Bitcoin due to concerns that \"mining\" the cryptocurrency was contributing\
    \ to the consumption of fossil fuels and climate change. In September 2020, the\
    \ Canton of Zug, Switzerland, announced to start to accepting tax payments in\
    \ bitcoin by February 2021. In June 2021, the Legislative Assembly of El Salvador\
    \ voted legislation to make Bitcoin legal tender in El Salvador, making it the\
    \ 1st country to formally introduce Bitcoin as a legal tender. In October 2021,\
    \ US SEC approved the ProShares Bitcoin Strategy ETF, a cash-settled futures exchange-traded\
    \ fund (ETF). \n\nWhy did Bitcoin Technology succeed as cryptocurrency?\n\nDecentralized\
    \ networks generally suffer from problems like having no central entities to ask\
    \ for information about user accounts, or to identify malicious users, leading\
    \ to certain inconsistencies between users and malicious entities infecting the\
    \ network, the most popular attack being double spending attack. Bitcoin Technology\
    \ solves these problems though two inherent concepts:\n\n1.  Blockchain network\
    \ which enables the transactions to be validated and broadcasted in the entire\
    \ network using readily available software applications. When a transaction occurs,\
    \ the network nodes validate these transactions, add them to their copy of the\
    \ ledger, and then broadcast these ledger additions to other nodes. Once these\
    \ transactions are accepted in the network, they become a block. Thereafter using\
    \ the Proof-of-Work protocol, these blocks are added to the blockchain, and quickly\
    \ published to all nodes, without requiring central oversight. This enables the\
    \ network to determine when a particular bitcoin was spent, which is needed to\
    \ prevent double-spending. \n\n2.  Proof-of-Work (PoW) protocol. To be accepted\
    \ by the rest of the network, the ledger must contain a proof-of-work. The Proof-of-Work\
    \ requires the Bitcoin miners to solve an arbitrary mathematical puzzle to find\
    \ a number called a nonce or ‘number one’, which is a random arbitrary number\
    \ issued in an authentication protocol to ensure that old communications cannot\
    \ be reused in replay attacks. It can be used just once in a cryptographic communication,\
    \ such that when the block content is hashed along with the nonce, the result\
    \ is numerically smaller than the network's difficulty target. As a result, a\
    \ new hash (a long string of characters) is generated that matches the target\
    \ hash for the current block. This new block is added to the network and published\
    \ to all the nodes, and the crypto miner who solves the problem this wins the\
    \ right to add that block to the blockchain and receive rewards. Proof of work\
    \ is this a form of adding new blocks of transactions to a cryptocurrency's blockchain.\
    \ \n\nThese two concepts enable anyone with access to internet join the Bitcoin\
    \ network, verify and audit transaction history on their own, as well as create\
    \ Bitcoins through mining via Proof-of-Work.\n\n## Bitcoin Identity\n\nIn finance\
    \ domain, identity is a means of authentication to ensure no one else acts on\
    \ your behalf while accessing your financial accounts or conducting transactions.\
    \ By authenticating, people can access their money as well as conduct financial\
    \ transactions. If someone else tries to do implicate your identity and withdraw\
    \ money from your bank, you can get a record of this, get the identity of the\
    \ person trying to impersonate you, ban them from your network and get rid of\
    \ such malicious activities in the future.\n\nNow in the context of Bitcoin, if\
    \ you want to send your friend 1 Bitcoin, he should not be able to add another\
    \ 0 and make it 10 Bitcoins. He should also not be to replicate your signature.\
    \ Bitcoin ensures prevention of such things and integrity of its network through\
    \ digital signature. It has both public and private keys. Public key is the key\
    \ you give to the public to communicate with you, and private key is the secret\
    \ key that only you own and use to access your account.\n\n![](Images/image00238.gif)\n\
    \nIn context of Bitcoin, public key can be considered as a locker, and private\
    \ key can be considered as a key. Public key is used for receiving money, and\
    \ private key is used for redeeming money. Other users send Bitcoins to your Bitcoin\
    \ address, which is derived from your public key. To generate an identity, the\
    \ user selects a random15 private key and generates the public key from the private\
    \ key, using a mathematical function. The public-private key concept ensure unique\
    \ identity of users and their authentication in the Bitcoin space\n\n## Bitcoin\
    \ Consensus  \n\nSince blockchain information is stored by everyone in the network,\
    \ a consensus is needed to ensure that everyone agrees on the transactions history.\
    \ Not only do all the users need to agree on any transaction update, but they\
    \ also need to agree on a valid transaction update to make sure that no corrupted\
    \ information is acquired by the network. \n\nOne of Bitcoin’s most unique features\
    \ is its consensus algorithm, which set the precedent for a Byzantine Fault Tolerant\
    \ (BFT) peer-to-peer currency system. Byzantine Fault Tolerance is a mechanism\
    \ that enables a decentralized, trustless network to function even in the presence\
    \ of malfunctioning or malicious nodes. Byzantine fault tolerance can be achieved\
    \ if the loyal (non-faulty) generals have a majority agreement on their strategy.\n\
    \nThe most common definition of Bitcoin’s consensus algorithm is proof-of-work\
    \ (PoW), the consensus mechanism that relies on participants solving cryptographic\
    \ puzzles to validate new information. However, PoW is part of a larger consensus\
    \ algorithm that is commonly known as “Nakamoto Consensus.” Nakamoto Consensus\
    \ is what made Bitcoin different from prior digital currency implementations.\n\
    \nPoW refers to the cryptographic mechanism that relies on participants being\
    \ able to solve hard computational problems to have a higher stake in the network.\
    \ PoW essentially is a distributed way for participants to determine the most\
    \ valid block. Each participant attempts to find a hash value, which is a valid\
    \ solution for the upcoming block of transactions. The winner who finds the hash\
    \ value that meets the requirement, adds the proposal block to the chain, and\
    \ obtains the reward.\n\nHashcash proof-of-work is utilized using a hashing algorithm\
    \ SHA-256. This involves finding a value ‘x’ such as that when ‘x’ is hashed with\
    \ this algorithm, the required value is found. This is often an iterative process;\
    \ nonces (numbers used once) are added to the end of the string being hashed each\
    \ successive round until the required value is given. Once the participant manages\
    \ to find a solution to the PoW, they broadcast their block to the rest of the\
    \ network, where it is then approved if none of the transactions within have already\
    \ been spent based on the timestamp. Participant then receives a reward in Bitcoin\
    \ as compensation for the amount of computing power they spent in order to validate\
    \ the next block of transactions."
