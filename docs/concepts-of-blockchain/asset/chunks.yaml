    \ validators to participate with minimum deposit. The deposit could be taken away\
    \ in case the protocol finds any violation by the validator while constant forking.\n\
    \nConsensus Mechanisms in Private Permissioned Blockchains\n\n*   Hyperledger\
    \ Fabric Consensus Model – Hyperledger Fabric is a private permissioned blockchain\
    \ platform that breaks consensus into components, allowing users to pick a consensus\
    \ algorithm for their particular situation. Instead of a predetermined consensus\
    \ model, Hyperledger has an ordering service that performs consensus related events,\
    \ this ordering component can pick the consensus model that best suits the blockchain\
    \ needs. By approaching consensus in this modular fashion, Hyperledger DLT’s can\
    \ change consensus models without huge overhauls to the code base.\n\n*   Corda\
    \ Consensus Mechanism – Corda is a private permissioned blockchain. Each Corda\
    \ network has a notary service made up of independent parties that approve blocks\
    \ using any applicable consensus algorithms. As mentioned in Jamiel Sheikh’s bool\
    \ “Mastering Corda: Blockchain for Java Developers”, R3 PROVIDES A SET OF Corda\
    \ applications called The Corda Business Network Toolkit to manage one or more\
    \ Corda networks. Corda does not follow the standard blockchain model of transactions\
    \ being bundled into blocks and then being finalized by the network as a whole.\
    \ Instead, a Corda network contains one or more notaries consisting of several\
    \ independent parties. Transactions in Corda are finalized by a notary with a\
    \ multiparty digital signature using an algorithm like Raft.\n\n# Blockchain Governance\n\
    \nIn this chapter, we will cover blockchain governance. We will start by discussing\
    \ the cooperative way blockchain companies share the computer code for this technology.\
    \ We will also explore how this open source environment is fostering new innovations.\
    \ And then we will examine who really is in charge of blockchains and hoe the\
    \ network effect determines the direction a blockchain will take.\n\nNext, we\
    \ will take a look at how these trustless systems with open interactions are more\
    \ secure than past systems. Finally, we will dive into the idea of collaboration\
    \ among parties who do not trust each other and how blockchain technology is changing\
    \ how they can interact. This new form of world wide collaboration can be the\
    \ key to solving world’s toughest problems.\n\n## Open Source\n\nBlockchain technology\
    \ and the developers who work with it reinforce the basic tenet of decentralization\
    \ in many ways. Not only by decision making consensus models, but also the way\
    \ in which it distributes the software code.\n\n*   Proprietary / Closed source\
    \ code – Software controlled by the person, team or organization who created it\
    \ and maintains exclusive rights over it. Only the original authors can legally\
    \ copy, inspect, and alter the software. Most users of proprietary software sign\
    \ an agreement giving permission to use the software but not alter it. Microsoft\
    \ Office is an example of proprietary software."
