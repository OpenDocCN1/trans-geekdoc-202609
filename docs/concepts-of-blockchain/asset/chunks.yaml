- fmt: "\n5. All copies of the ledger updated – The block is spread throughout the\
    \ network through the same peer-to-peer communications that we used for the transaction.\
    \ When the block operators receive a copy of the new block, they add it to their\
    \ copy of the distributed ledger. This guaranteed that all members of the peer\
    \ network agree on the current state of the blockchain’s distributed ledger.\n\
    \n6. User notified of completed transaction – The user’s wallet monitors for the\
    \ creation of new blocks that include transactions associated with the user. When\
    \ a block containing the completed code from the user’s operation is received,\
    \ an event is created to notify the user that the operation is complete. When\
    \ the block containing Alicia’s Bitcoin transfer to Billy is added to the blockchain,\
    \ an alert will be sent to the relevant wallets that the transaction was accepted\
    \ and completed.\n\n# Blockchain Consensus\n\nSince blockchain information is\
    \ stored by everyone in the network, a consensus is needed to ensure that everyone\
    \ agrees on the transactions’ history. Not only do all the users need to agree\
    \ on any transaction update, but they also need to agree on a valid transaction\
    \ update to make sure that no corrupted information is acquired by the network.\n\
    \nConsensus mechanism enables blockchain to move away from a centralized system\
    \ where one entity keeps track of the ledger towards a decentralized system where\
    \ trust does not rest with one entity but all entities and what they decide together.\
    \ The blockchain is a distributed and decentralized system, which means that it\
    \ needs to have a way of tracking the official current state of the system. Since\
    \ the blockchain can include financial transactions and business agreements, it\
    \ is important that all parties involved all in sync regarding the terms of the\
    \ agreement.\n\nAs discussed in “Blockchain Consensus and Fault Tolerance in a\
    \ Nutshell” article by Demiro Massessi, “The blockchain is designed to be a shared,\
    \ synchronized historical ledger, meaning that there needs to be a final decision\
    \ at some point on what should and shouldn’t be included in the official record.\
    \ Since blockchain is decentralized, there is no higher authority that can rubber-stamp\
    \ and finalize the contents of a blockchain block. The method that Satoshi Nakamoto,\
    \ creator of the Bitcoin network, invented to achieve consensus is based on scarcity.\
    \ In one way or another, blockchain consensus algorithms boil down to some kind\
    \ of vote where the number of votes that a user has is tied to the amount of a\
    \ limited resource that is under the user’s control. Based on the economic law\
    \ of supply and demand, collecting enough of an asset to have a controlling share\
    \ will drive up the price of the asset enough to make achieving that level of\
    \ control unfeasibly expensive”.\n\nIn order to ensure that no one spends the\
    \ same Bitcoin twice, Satoshi Nakamoto created the consensus algorithm called\
    \ Proof-of-Work (`PoW`) for the Bitcoin network. \n\nSince them, several other\
    \ consensus algorithms have been invented as per the requirements of the use cases.\
    \ These include `Proof-of-Stake` (`PoS`), `Delegated Proof-of-Stake`, `Practical\
    \ Byzantine Fault Tolerance`, and `Proof of Elapsed Time`.\n\nThe most commonly\
    \ used consensus algorithms are `Proof-of-Work` (`PoW`) and `Proof-of-Stake` (`PoS`).\n\
    \n## Proof-of-Work (PoW)\n\n`Proof-of-Work` (`PoW`) refers to the cryptographic\
    \ mechanism that relies on participants being able to solve hard computational\
    \ problems to have a higher stake in the network. PoW essentially is a distributed\
    \ way for participants to determine the most valid block. Each participant attempts\
    \ to find a hash value, which is a valid solution for the upcoming block of transactions.\
    \ The winner who finds the hash value that meets the requirement, adds the proposal\
    \ block to the chain, and obtains the reward.\n\n### Bitcoin Consensus Mechanism\
    \ via Proof-of-Work (PoW)\n\nThe most common definition of Bitcoin’s consensus\
    \ algorithm is `proof-of-work` (`PoW`), the consensus mechanism that relies on\
    \ participants solving cryptographic puzzles to validate new information. However,\
    \ PoW is part of a larger consensus algorithm that is commonly known as “Nakamoto\
    \ Consensus.” Nakamoto Consensus is what made Bitcoin different from prior digital\
    \ currency implementations.\n\nBitcoin uses `Hashcash Proof-of-Work` to achieve\
    \ consensus, using a hashing algorithm `SHA-256`. This involves finding a value\
    \ `x` such as that when `x` is hashed with this algorithm, the required value\
    \ is found. This is often an iterative process; nonces (numbers used once) are\
    \ added to the end of the string being hashed each successive round until the\
    \ required value is given. Once the participant manages to find a solution to\
    \ the `PoW`, they broadcast their block to the rest of the network, where it is\
    \ then approved if none of the transactions within have already been spent based\
    \ on the timestamp. Participant then receives a reward in Bitcoin as compensation\
    \ for the amount of computing power they spent in order to validate the next block\
    \ of transactions.\n\nMining in Bitcoin is really the commitment of a certain\
    \ amount of computing resources to the sole purpose of solving computationally\
    \ hard problems and validating new blocks. The more computing power an individual\
    \ node has, the more likely it is to find a correct value and thus solve the `SHA-256`\
    \ hash associated with that block. PoW enables Bitcoin to be both fully decentralized\
    \ and fully secure. Anyone can participate in the mining process, without needing\
    \ to own a certain number of Bitcoin beforehand in order to do so. In fact, it\
    \ is completely unknown who the winner of the next mining reward will be at any\
    \ given point in time, with additional computing power only serving to increase\
    \ the probability that an individual node will be successful. Furthermore, the\
    \ mining process also incentivizes nodes to act honestly because of the rewards\
    \ associated with broadcasting the correct block. This means that in order to\
    \ take over the network a malicious attacker has to control over 51% of the hashing\
    \ power and prevent legitimate blocks from being validated. This is commonly known\
    \ as a “51% attack.” Due to the Bitcoin network’s current size, the economic cost\
    \ of accruing over 51% of the hashing power currently present in the network is\
    \ huge, and thus extremely difficult.\n\nThe second part of Nakamoto Consensus\
    \ is what allowed Bitcoin to be the first scalable cryptocurrency platform. Nakamoto\
    \ Consensus places a large emphasis on the longest chain, arguing that the longest\
    \ chain that is also valid according to timestamps is the most legitimate, as\
    \ it had the largest amount of computational resources dedicated to it. This introduces\
    \ trust in an otherwise trustless system, thus allowing the Bitcoin network to\
    \ function without a centralized authority. For example, if a participant has\
    \ been inactive, or has newly joined, they can simply accept the current longest\
    \ chain as proof of what happened previously within the network. They do not need\
    \ to rely on a 3rd party; rather start build upon the longest valid chain, thus\
    \ gaining the ability to receive rewards by proposing a computationally valid\
    \ block. In fact, the “longest chain rule”, as it has been dubbed by the cryptocurrency\
    \ community, enabled Bitcoin to succeed where previous PoW digital currencies\
    \ had failed. It allowed participants to have confidence in the network, as well\
    \ as set a standard through which miners could begin to join and leave at will\
    \ without having to defer to an authority. The longest chain rule has been adopted\
    \ by numerous digital asset systems and blockchains that came after Bitcoin.\n\
    \n## Proof-of-Stake (PoS)\n"
  raw: "5.  All copies of the ledger updated – The block is spread throughout the\
    \ network through the same peer-to-peer communications that we used for the transaction.\
    \ When the block operators receive a copy of the new block, they add it to their\
    \ copy of the distributed ledger. This guaranteed that all members of the peer\
    \ network agree on the current state of the blockchain’s distributed ledger.\n\
    \n6.  User notified of completed transaction – The user’s wallet monitors for\
    \ the creation of new blocks that include transactions associated with the user.\
    \ When a block containing the completed code from the user’s operation is received,\
    \ an event is created to notify the user that the operation is complete. When\
    \ the block containing Alicia’s Bitcoin transfer to Billy is added to the blockchain,\
    \ an alert will be sent to the relevant wallets that the transaction was accepted\
    \ and completed.\n\n## Blockchain Consensus\n\nSince blockchain information is\
    \ stored by everyone in the network, a consensus is needed to ensure that everyone\
    \ agrees on the transactions’ history. Not only do all the users need to agree\
    \ on any transaction update, but they also need to agree on a valid transaction\
    \ update to make sure that no corrupted information is acquired by the network.\
    \ \n\nConsensus mechanism enables blockchain to move away from a centralized system\
    \ where one entity keeps track of the ledger towards a decentralized system where\
    \ trust does not rest with one entity but all entities and what they decide together.\
    \ The blockchain is a distributed and decentralized system, which means that it\
    \ needs to have a way of tracking the official current state of the system. Since\
    \ the blockchain can include financial transactions and business agreements, it\
    \ is important that all parties involved all in sync regarding the terms of the\
    \ agreement.\n\nAs discussed in “Blockchain Consensus and Fault Tolerance in a\
    \ Nutshell” article by Demiro Massessi, “The blockchain is designed to be a shared,\
    \ synchronized historical ledger, meaning that there needs to be a final decision\
    \ at some point on what should and shouldn’t be included in the official record.\
    \ Since blockchain is decentralized, there is no higher authority that can rubber-stamp\
    \ and finalize the contents of a blockchain block. The method that Satoshi Nakamoto,\
    \ creator of the Bitcoin network, invented to achieve consensus is based on scarcity.\
    \ In one way or another, blockchain consensus algorithms boil down to some kind\
    \ of vote where the number of votes that a user has is tied to the amount of a\
    \ limited resource that is under the user’s control. Based on the economic law\
    \ of supply and demand, collecting enough of an asset to have a controlling share\
    \ will drive up the price of the asset enough to make achieving that level of\
    \ control unfeasibly expensive”.\n\nIn order to ensure that no one spends the\
    \ same Bitcoin twice, Satoshi Nakamoto created the consensus algorithm called\
    \ Proof-of-Work (PoW) for the Bitcoin network. \n\nSince them, several other consensus\
    \ algorithms have been invented as per the requirements of the use cases. These\
    \ include Proof-of-Stake (PoS), Delegated Proof-of-Stake, Practical Byzantine\
    \ Fault Tolerance, and Proof of Elapsed Time. \n\nThe most commonly used consensus\
    \ algorithms are Proof-of-Work (PoW) and Proof-of-Stake (PoS).\n\nProof-of-Work\
    \ (PoW)\n\nProof-of-Work (PoW) refers to the cryptographic mechanism that relies\
    \ on participants being able to solve hard computational problems to have a higher\
    \ stake in the network. PoW essentially is a distributed way for participants\
    \ to determine the most valid block. Each participant attempts to find a hash\
    \ value, which is a valid solution for the upcoming block of transactions. The\
    \ winner who finds the hash value that meets the requirement, adds the proposal\
    \ block to the chain, and obtains the reward.\n\nBitcoin Consensus Mechanism via\
    \ Proof-of-Work (PoW)\n\nThe most common definition of Bitcoin’s consensus algorithm\
    \ is proof-of-work (PoW), the consensus mechanism that relies on participants\
    \ solving cryptographic puzzles to validate new information. However, PoW is part\
    \ of a larger consensus algorithm that is commonly known as “Nakamoto Consensus.”\
    \ Nakamoto Consensus is what made Bitcoin different from prior digital currency\
    \ implementations.\n\nBitcoin uses ‘Hashcash Proof-of-Work’ to achieve consensus,\
    \ using a hashing algorithm SHA-256. This involves finding a value ‘x’ such as\
    \ that when ‘x’ is hashed with this algorithm, the required value is found. This\
    \ is often an iterative process; nonces (numbers used once) are added to the end\
    \ of the string being hashed each successive round until the required value is\
    \ given. Once the participant manages to find a solution to the PoW, they broadcast\
    \ their block to the rest of the network, where it is then approved if none of\
    \ the transactions within have already been spent based on the timestamp. Participant\
    \ then receives a reward in Bitcoin as compensation for the amount of computing\
    \ power they spent in order to validate the next block of transactions.\n\nMining\
    \ in Bitcoin is really the commitment of a certain amount of computing resources\
    \ to the sole purpose of solving computationally hard problems and validating\
    \ new blocks. The more computing power an individual node has, the more likely\
    \ it is to find a correct value for the SHA-256 hash, and thus solve the cryptographic\
    \ hash associated with that block’s PoW. \n\nPoW enables Bitcoin to be both fully\
    \ decentralized and fully secure. Anyone can participate in the mining process,\
    \ without needing to own a certain number of Bitcoin beforehand in order to do\
    \ so. In fact, it is completely unknown who the winner of the next mining reward\
    \ will be at any given point in time, with additional computing power only serving\
    \ to increase the probability that an individual node will be successful. Furthermore,\
    \ the mining process also incentivizes nodes to act honestly because of the rewards\
    \ associated with broadcasting the correct block. This means that in order to\
    \ take over the network, a malicious attacker has to control over 51% of the computing/hashing\
    \ power on the network and prevent legitimate blocks from being validated. This\
    \ is commonly known as a “51% attack.” Due to the Bitcoin network’s current size,\
    \ the economic cost of accruing over 51% of the hashing power currently present\
    \ in the network is huge, and thus extremely difficult.\n\nThe second part of\
    \ Nakamoto Consensus is what allowed Bitcoin to be the first scalable cryptocurrency\
    \ platform. Nakamoto Consensus places a large emphasis on the longest chain, arguing\
    \ that the longest chain that is also valid according to timestamps is the most\
    \ legitimate, as it had the largest amount of computational resources dedicated\
    \ to it. This introduces trust in an otherwise trustless system, thus allowing\
    \ the Bitcoin network to function without a centralized authority. For example,\
    \ if a participant has been inactive, or has newly joined, they can simply accept\
    \ the current longest chain as proof of what happened previously within the network.\
    \ They do not need to rely on a 3rd party; rather simply start build upon the\
    \ longest valid chain, thus gaining the ability to receive rewards by proposing\
    \ a computationally valid block. In fact, the “longest chain rule”, as it has\
    \ been dubbed by the cryptocurrency community, enabled Bitcoin to succeed where\
    \ previous PoW digital currencies had failed. It allowed participants to have\
    \ confidence in the network, as well as set a standard through which miners could\
    \ begin to join and leave at will without having to defer to an authority. The\
    \ longest chain rule has been adopted by numerous digital asset systems and blockchains\
    \ that came after Bitcoin.\n\nProof-of-Stake (PoS)"
