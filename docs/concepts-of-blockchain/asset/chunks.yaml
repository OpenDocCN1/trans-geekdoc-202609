    \ all, Namecoin, attempted to use a Bitcoin-like blockchain to provide a name\
    \ registration system, where users can register their names in a public database\
    \ alongside other data. \n\nThe major cited use case is for a DNS system, mapping\
    \ domain names like \"bitcoin.org\" to an IP address. Other use cases include\
    \ email authentication and potentially more advanced reputation systems. Here\
    \ is the basic contract to provide a Namecoin-like name registration system on\
    \ Ethereum:\n\ndef register(name, value):\n\n    if !self.storage\\[name\\]:\n\
    \n        self.storage\\[name\\] = value\n\nThe contract is very simple – A database\
    \ inside the Ethereum network that can be added to, but not modified or removed\
    \ from. Anyone can register a name with some value, and that registration then\
    \ sticks forever. A more sophisticated name registration contract will also have\
    \ a \"function clause\" allowing other contracts to query it, as well as a mechanism\
    \ for the \"owner\" (ie. the first registerer) of a name to change the data or\
    \ transfer ownership. One can even add reputation and web-of-trust functionality\
    \ on top.\n\nDecentralized Autonomous Organizations (DAO)\n\nThe general concept\
    \ of a \"decentralized autonomous organization\" is that of a virtual entity that\
    \ has a certain set of members or shareholders which, perhaps with a 67% majority,\
    \ have the right to spend the entity's funds and modify its code. The members\
    \ would collectively decide on how the organization should allocate its funds.\
    \ Methods for allocating a DAO's funds could range from bounties, salaries to\
    \ even more exotic mechanisms such as an internal currency to reward work. This\
    \ essentially replicates the legal trappings of a traditional company or nonprofit\
    \ but using only cryptographic blockchain technology for enforcement. \n\nA general\
    \ outline for how to code a DAO is as follows. The simplest design is simply a\
    \ piece of self-modifying code that changes if two thirds of members agree on\
    \ a change. Although code is theoretically immutable, one can easily get around\
    \ this and have de-facto mutability by having chunks of the code in separate contracts\
    \ and having the address of which contracts to call stored in the modifiable storage.\n\
    \nProof-of-Existence\n\nLet’s say we came up with an amazing innovation “3D printing\
    \ artificial intelligence on the blockchain.” We wanted to prove that we came\
    \ up with this innovation before a particular date, but we do not want to reveal\
    \ it to the public yet. How do we do it in a way that everyone trusts? By combining\
    \ the hash function and the trustless blockchain. We store a hash of our document\
    \ into the blockchain, such that we could prove to everyone at any later date\
    \ that we were the ones who included this hash on the blockchain, and that the\
    \ information has not been changed.\n\nBy doing so, we now have “Proof-of-Existence”\
    \ of some piece of information at some point in time. With “Proof-of-Existence”,\
    \ we leverage both the public auditability and immutability of the blockchain.\
    \ \n\nThis is an example of a record keeping use case. One of such use case is\
    \ document ownership. We can prove that we own some document at some time through\
    \ a commitment scheme – hash the document with some random number, then we have\
    \ our hash commitment, and we can reveal this input later to prove our ownership,\
    \ as shown in the next use case.  \n\nLand Titles\n\nA problem that several countries\
    \ face is a broken land titles system. Flawed paperwork, forged signature, and\
    \ unclear documents make it difficult to trace the ownership of land. In addition,\
    \ it is difficult for the governments to build infrastructure for each of their\
    \ citizens. The pitfalls which keep the governments from solving this problem\
    \ is mistrust between citizens and these central parties. Corrupt officials are\
    \ susceptible to take bribes and tamper records. In addition, most citizens do\
    \ not trust non-government organizations either, making centralized options infeasible.\
    \ So how do we solve this problem? By decentralization.\n\nWe can track the ownership\
    \ of the documents using Proof-of-Existence. We can create an association between\
    \ the users and document hashes. By associating their addresses to document hashes,\
    \ users can provide their digital signature to prove ownership of land. This provides\
    \ transparency and immutability, since information about all document ownership\
    \ is public and on the blockchain, and also limits centralization because no single\
    \ entity decides which person owns which land titles. \n\nHowever, there is a\
    \ caveat that affects this Ethereum use case. In computer science, one of the\
    \ most popular acronym is “GIGO” – Garbage In, Garbage Out. \n\nA blockchain is\
    \ good at handling internal data through its public auditability, but it cannot\
    \ reach into the real world and validate inputs. If the inputs from the real world\
    \ are incorrect, then the output is also going to be incorrect. \n\nThis requires\
    \ some system for validating inputs into the blockchain. We refer to such entities\
    \ sending information from the real world to the blockchain network as “Oracles.”\
    \ However this sends us back to centralization as we need some trusted 3rd parties\
    \ to serve as oracles and provide correct information into the blockchain whenever\
    \ someone creates a land title. This problem is yet to be solved. \n\nSmart Energy\
    \ Grids\n\nOne of the biggest real world scenarios to leverage smart contracts\
    \ is infrastructure sector. A common infrastructure problem is that of smart energy\
    \ grids. Energy flows from a plant to houses, but what if a house has excess energy?\n\
    \nLet’s say house A has excess energy, and house B lacks energy. How can we build\
    \ an infrastructure from house A to house B without relying on a central party?"
