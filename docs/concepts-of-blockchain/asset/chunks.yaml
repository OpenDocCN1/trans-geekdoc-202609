  trans: "\n任何人都可以向用户发送加密消息，因为他们可以轻松访问该用户的公钥。用户可以使用数字签名来验证这些交易的有效性。在 `RSA` 中，任何人都可以通过将消息转换为数字、对其进行公钥幂运算并发送结果，向用户发送加密消息。用户的公钥和私钥设计设计，使得用户可以通过对收到的消息进行私钥分量幂运算来获取原始消息。`RSA`\
    \ 数字签名涉及相反的过程。用户编写一条消息，并将该消息的压缩形式提升至其私钥指数的幂以创建签名，然后发布该签名。他们的公钥和消息被发布在一起。任何人可以使用一个简单的三步过程来验证签名——使用与消息编写者相同的方法压缩附带的消息、对附带的签名进行用户公钥的幂运算，并验证前两个步骤的结果是否相同。\n\
    \n数字签名的工作原理与 `RSA` 中加密的原理相同。攻击者需要知道用户的私钥才能执行这两种操作中的一种，而算法的设计使得这一过程几乎是不可能的。\n\n\
    这意味着区块链上的身份归根结底是对用户私钥的持有。因此，妥善保护这个私钥非常重要。\n\n在 `Ethereum` 中，用户的身份通过公钥或地址进行管理，用户可以使用相应的私钥对交易进行签名并读取发送给他们的加密消息。\n\
    \n在 `Hyperledger` 和 `Corda` 中，身份被编码在 `x.509` 证书中，包含了用户的公钥。在 `Corda` 中，证书可以是公开的（这意味着它们被发布到区块链上），也可以是机密的（这意味着它们仅与所有与其交易的双方共享）。\n\
    \n# 区块链中的匿名性\n\n匿名性是区块链在某些应用中取得成功的关键部分。如果个人或组织在区块链上进行交易，他们可能不希望这些是公开的。不同的区块链在协议中内置了不同级别的匿名性和隐私保护。\n\
    \n如前所述，公钥加密通过使用一对公私钥来实现加密和数字签名，从而维护了区块链上的身份。\n\n此时，我们需要查看用户的密钥与其真实身份之间的关系。首先要的是，公钥中没有任何部分与其对应的私钥相关。由于私钥是秘密，人们无法从公钥推断出私钥，但你可以从私钥计算出公钥。另一个需要记住的是，私钥只是数字，无法与用户的真实身份绑定。区块链上的身份仅仅是对相关私钥的持有，即使有人猜中或偷了私钥，他们也无法直接从私钥获取其所有者的真实身份。\n\
    \n因此，你无法将公钥与私钥绑定，或将私钥与真实身份绑定，这意味着区块链用户拥有的内置隐私是的。\n\n然而，区块链上的每笔交易都是公开的并永久存储在上面的。这意味着通过研究存储在区块链上的数据来获取元数据，可以学习到很多关于用户身份的信息。通过对餐厅或咖啡馆等地的重复交易，某人可以了解个人居住的地方和习惯。对于企业来说，重复交易可能表明业务关系，如果泄露，可能会导致竞争优势的损失。\n\
    \n在基础区块链上，匿名性仅局限于此。原始区块链上提供的有限的匿名性和隐私保护水平启发了增强隐私的改进措施，同时仍允许在区块链上对交易进行公开验证和确认。\n\
    \n为了增强隐私保护而开发和实施的一些机制包括：\n\n*   `零知识证明` – 它们使用加密算法允许用户在不揭露实际秘密的情况下证明对秘密的认知。验证者证明了对秘密的认知，但并未实际揭露它。一个常见的例子是色盲人士和两个颜色外完全相同的物体。色盲人士向验证者展示一个物体，隐藏两个物体，然后再次展示其中一个。\n\
    *   `隐身地址` – 隐身地址涉及使用一次性地址在区块链上进行交易。隐身地址使得无法将交易关联到已知账户。验证者验证是否为同一个物体，而不揭露物体的颜色。\n\
    *   `环签名` – 区块链交易经过数字签名。通过环签名，从交易中只能确定是组中的某人签署的，而不是具体的某个成员。\n*   `CoinJoin` –\
    \ 查看谁与谁进行交易对用户隐私和匿名性是危险的。CoinJoin 将多个交易混合在一起，使得难以匹配发送者接收者。\n*   `配置交易` – 配置交易利用同态加密，使得对加密数据执行数学运算成为可能。这意味着交易包含的数据可以对公众隐藏，同时仍允许网络验证交易。\n\
    \n## 具体的匿名性实现\n\n*   `Ethereum` – `Ethereum` 正在改进零知识证明、混合和 `DAPPS`（旨在提高匿名性的应用程序）以加强区块链隐私。此外，`Ethereum`\
    \ 的企业解决方案构建者 `ConsenSys` 推出了 `QUORUM`，它是以区块链的一个分支，允许用户从公共区块链中受益的同时享受私有网络的功能。它由\
    \ `JP Morgan` 开发，是一种许可实现。\n*   `Hyperledger`\n    *   `通道` – 区块链的子集，使交易仅对成员可见。\n\
    \    *   `私有交易` – 存储私有数据的哈希以便在区块链上进行公开验证。\n    *   `零知识证明` – 人可以在不暴露秘密本身的情况下证明认知秘密。\n\
    *   `Hyperledger Besu` – 一个运行在 Ethereum 公共网络、私有网络以及 `Rinkeby`、`Ropsten` 和 `Gorli`\
    \ 等测试网络上的 Ethereum 客户端。`Hyperledger Besu` 包含了多种共识算法，包括 `PoW`、`PoA` 和 `IBFT`，并拥有专门为联盟设计的许可方案。\n\
    *   `Corda` – `Corda` 网络上的对方可以用两种方式之一表示：`对方` – 公钥名称和；`匿名对方` – 仅有公钥。\n"
- fmt: "\n# Immutability\n\nImmutability simply refers to the permanence of data.\
    \ Anything we call ‘immutable’ is permanent. One of the benefits of blockchain\
    \ is immutability. The data recorded on a blockchain system can never be altered,\
    \ edited, changed, or deleted once it has been recorded. As this data is stored\
    \ in multiple locations, changing or removing a copy of this data in a single\
    \ place, or a limited number of places poses no threats. \n\nBlockchain goes further\
    \ than this. In addition to recording data points, blockchain also has the capacity\
    \ to record who endorses or agrees with those facts. Let’s think of this as a\
    \ difference between a piece of paper and a contract. A piece of paper can contain\
    \ any data, true or false. A signed contract becomes more than that because the\
    \ signatures represent who agreed with the facts recorded on the paper at the\
    \ time of signing. Blockchain provides a digital implementation of this process,\
    \ and can be an immeasurably valuable tool when you need to capture not only what\
    \ happened, but who was involved as well. Imagine the new opportunities that arise\
    \ when organizations can safely and securely share there most critical data with\
    \ one another, with the trust that the data they are seeing has not been compromised\
    \ or altered.\n\n* **Traditional Database Immutability** – The very nature of\
    \ centrally operated databases can’t be completely immutable. A centrally run\
    \ database can embed things into it with features that mention immutability. But\
    \ is there is a central authority, they have the ability to override that feature.\
    \ Just like immutability has been around for many years, just like the majority\
    \ of the tech used via blockchain; it is the combination of these that makes it\
    \ unique. \n\n* **Blockchain Immutability** – Let’s review the aspects of the\
    \ public blockchain that improve the chances of it being immutable. There are\
    \ many different variables, but the main one is consensus. In a blockchain, it\
    \ refers to the logs of transactions which are created by consensus among the\
    \ blockchain’s participants. The basic notion is that once a blockchain transaction\
    \ has received a sufficient level of validation and posted on the blockchain,\
    \ it can almost never be replaces, reversed, or edited.\n\nFor example, if all\
    \ the nodes within the `Bitcoin` blockchain network are working to solve a really\
    \ hard math problem by running multiple computers simultaneously, the chances\
    \ of anyone overriding that are slim to zero. But if someone wanted to undermine\
    \ the immutability of the `Bitcoin` blockchain, here is how they would do it:\n\
    \n1. Install more mining capacity than the rest of the network put together, creating\
    \ a `51% attack`.\n2. Instead of openly participating in the mining process, they\
    \ would mine their own `secret branch`, containing whichever transaction they\
    \ approve and censoring the rest.\n3. When the desired amount of time has passed,\
    \ they would anonymously broadcast their secret branch to the network.\n\nSince\
    \ the attacker has more mining power than the rest of the network, their branch\
    \ will contain more `Proof-of-Work` (`PoW`) than the rest of the network. Every\
    \ `Bitcoin` node will therefore switch over since the rules of `Bitcoin` state\
    \ that the more difficult branch wins. Any previously confirmed transactions not\
    \ in the secret branch will be reversed and the `Bitcoin` they spent could be\
    \ sent elsewhere. The computing power required to achieve this is enormous and\
    \ probably only theoretical, but it is important to consider.\n\nOne other less\
    \ technical and malicious example would be from the `Ethereum` hard fork that\
    \ directly happened after the `DAO` hack. In this example, the majority of the\
    \ `Ethereum` nodes in the network decided to update the software preventing those\
    \ hackers from withdrawing the cryptocurrency earned (stolen). This update could\
    \ not be enforced, since every `Ethereum` user controls their own computer. Nonetheless,\
    \ it was publicly supported by `Vitalik Buterin`, `Ethereum`’s founder, as well\
    \ as many other community leaders. As a result, most users compiled, and the blockchain\
    \ with the new rules kept the name `Ethereum`. A minority disagreed with the change\
    \ and continued the blockchain according to its original rules, earning the title\
    \ `Ethereum Classic`.\n\n# Transparency\n\nAnything that is see-through is transparent.\
    \ Just like immutability, transparency comes on a spectrum. Certain things are\
    \ more transparent than others. In the context of technology, this can be seen\
    \ as a way of operating that is easy for others to see the actions being performed.\
    \ For example, in open source projects, all the source code is available for everyone.\n\
    \nIn a traditional database, a client can perform four functions on data:\n\n\
    * Create\n* Read\n* Update\n* Delete\n\nThere is usually an administrator, the\
    \ authority giver who allows certain known participants in the database to do\
    \ more than read/create; it allows them to update and/or delete. Due to the fact\
    \ that administrator is controlling who has access and who doesn’t, it is easier\
    \ to track these changes and prevent malicious actors from tampering. In the public\
    \ blockchain, this isn’t necessarily the case.\n\nWithin blockchain, every full\
    \ node its own administrator, can create, read; this is also known as append only.\
    \ These nodes only add data over time in the form of blocks.\n\n* Read – Query\
    \ and retrieve data from blockchain\n* Write – Add more data onto blockchain\n\
    \nAs explained in the “Blockchain versus Traditional Databases” article by `Shaan\
    \ Ray`, ‘if the blockchain has recorded that my wallet has 1 million BTC, that\
    \ figure is permanently store in blockchain. When I spend 200,000 BTC, that transaction\
    \ is recorded onto the blockchain, bringing my balance to 800,000 BTC. However,\
    \ since the blockchain can only append, my pre-transaction balance of 1 million\
    \ BTC also remains on the blockchain, for those who care to look.’\n\n# Autonomy\n\
    \nAutonomy is defined as independence or freedom, the ability to make your own\
    \ decisions without being controlled by anyone else. This freedom can be at macro\
    \ level or microlevel. In the traditional world of doing any transaction with\
    \ another party, there tends to be a lot of administrative paper work, with third\
    \ parties intervening every step. Most of this paperwork is actually not required\
    \ and wastes a lot of time and effort which could be spent elsewhere.\n\nBlockchain\
    \ enables autonomy from intermediaries via automated smart contracts.\n\n# Smart\
    \ Contracts\n\nThe most simplified explanation of smart contracts is – `IF THEN\
    \ ELSE` statement, which means `IF X happens`, `THEN do Y`, `ELSE do Z`.\n\nIf\
    \ this concept is applied to two or more parties, all interacting on a mutually\
    \ agreed upon contract that executes based on their actions (or non-actions).\
    \ An example of smart contract can be “if an event happens before the end of this\
    \ year, then you pay me, else I pay you”.\n"
