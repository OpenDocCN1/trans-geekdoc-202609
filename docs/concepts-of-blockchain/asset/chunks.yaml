  trans: '


    传统网络安全与区块链安全之间的另一个大区别在于传统应用程序与传统技术。在传统网络安全中，我们要么在内部开发所有应用程序，要么依赖单一的受信任第三方提供商来为我们创建应用程序。通常，所有代码都来自一个地方，如果我们没有自己编写代码，我们要做的就是对提供解决方案的第三方持有信任和信仰。在区块链中，我们通常编写智能合约，它们会调用其他智能合约的代码，而这些代码可能来自不同的作者。


    因此，在传统网络安全领域，我们依赖于自己的尽职调查来编写安全代码，或者依赖第三方应用程序提供者的尽职调查；而在区块链领域，我们必须花费更多的时间和精力来确保代码和合约是安全可靠的。


    最后一个大区别是，在传统的业务系统中，所有应用程序要么直接运行在我们拥有的受信任硬件上，要么运行在由 Microsoft Azure 或 Amazon Web
    Service 等第三方提供的具有高度信任度的硬件上。在区块链中，所有代码都运行在不可信的资源和不可信的硬件上，这些硬件可以被世界上任何地方的拥有。这意味着我们必须确保区块链解决方案中的所有信任都来自于协议和代码层本身，因为它是一个分布式网络，我们无法直接控制或访问支持它的硬件。


    | 传统网络安全 | 区块链安全 |

    | --- | --- |

    | 中心化 | 去中心化 |

    | 侧重边界 | 分布式 |

    | 受信任或半信任的基础设施 | 无信任环境 |


    ## 安全攻击


    *   **拒绝服务** – 拒绝服务攻击（`DoS`）是指攻击者使系统无法按照设计为用户提供服务。这可以通过利用系统中的漏洞来实现，但更常见的方法是以高于目标系统能够处理的速度执行合法操作。为了达到有效性，拒绝服务攻击通常关注系统的薄弱环节或瓶颈。


    | 传统环境 | 区块链 |

    | --- | --- |

    | 拒绝服务攻击针对公司的 Web 服务器，以防止客户访问其服务。这可以通过发送超过服务器支持能力的连接请求来实现。 | 拒绝服务攻击涉及向区块链提交超过其处理能力的交易数量。由于许多区块链以固定速率创建固定大小的区块并以分布式方式存储，它们具有一个有有意的攻击者可以超过的最大容量，从而导致区块链无法使用。
    |


    *   **终端安全** – 传统基础设施和区块链环境在终端安全方面也存在差异。终端安全的起源是为了确保针对恶意软件、欺诈、网络威胁以及提取私人信息的尝试进行多层防御。


    | 传统环境 | 区块链 |

    | --- | --- |

    | 终端受企业控制并具有某种程度的异质性。异质性可能是危险的，因为攻击者有更多选择来寻找可利用漏洞。 | 终端是节点，并且可能是完全同质的。虽然同质性意味着一个系统中的缺陷就是所有系统的缺陷，但基于信任和数据隐私特性构建的区块链可以防止此类攻击。
    |


    *   **代码漏洞** – 计算机应用程序依赖于可靠的代码。传统安全与区块链的另一个区别在于对公司应用程序中所用代码的信任程度。


    | 传统环境 | 区块链 |

    | --- | --- |

    | 公司编写大部分代码，漏洞只会产生于公司控制的代码中。 | 任何人都可以编写智能合约，智能合约或底层平台代码中的缺陷可能会产生广泛的影响。但由于智能合约可以经过审核并重复使用，这种不一致性可以在代码中进行修正。
    |


    *   **蓄意误用** – 传统和区块链环境都容易受到基于对系统蓄意误用的攻击。


    | 传统环境 | 区块链 |

    | --- | --- |

    | 可能存在内部攻击或客户对系统的蓄意误用。事实上，拒绝服务攻击是蓄意误用的一种特定类型。 | 区块链系统旨在激励网络参与者（矿工或节点）去做符合其最大利益的事。一个弱是，如果网络一半以上的处理算力被单一小组控制，那么网络就会被该小组控制。
    |


    *   **数据保护** – 传统和区块链环境在数据保护方面的目标上存在差异。


    | 传统环境 | 区块链 |

    | --- | --- |

    | 数据是孤化的，访问由所有者严格控制，将机密性、完整性和可用性的责任掌握在他们手中。 | 数据是分布式的，访问由所有者严格控制。 |


    '
- fmt: "\nThe public blockchain platforms like `Bitcoin`, `Ethereum`, `Litecoin` are\
    \ what we also refer to as permissionless blockchains platforms meaning that they\
    \ really strive to, by design, increase and protect user’ anonymity. If we do\
    \ not know who a user is and do not have a way of identifying users, we do not\
    \ have any way of creating permission or access rules around that user. Hence,\
    \ anyone can write data to the blockchain and anyone can come along and read data\
    \ from that blockchain. So when you think of public blockchains like `Bitcoin`\
    \ or `Ethereum`, understand that by default and by their nature, they are designed\
    \ to protect anonymity.\n\nIn a public blockchain, since we do not know who the\
    \ user is, we rely on economics and game theory incentives to ensure that everybody\
    \ in the system behaves honestly and according to the rules. We set up situations\
    \ through group consensus, through which honest participants are economically\
    \ rewarded, and wherein dishonest ones only incur work or cost, with no possibility\
    \ of ever recouping that cost.\n\nSome key benefits of public blockchain are:\n\
    \n*   Ledger is distributed – The data base is not centralized like in a client-server\
    \ model, and all nodes in the blockchain participate in transaction validation.\n\
    *   Immutable – When something is written to the blockchain, it cannot be changed.\n\
    *   Open consensus Model – No restriction placed on who can operate a node in\
    \ the network.\n*   Open read and write – Anyone can participate by submitting\
    \ transactions to the blockchain, such as `Bitcoin` or `Ethereum`.\n*   Low barrier\
    \ to entry – Transactions on a public network can be accomplished with an internet\
    \ connection and a cell phone.\n*   Secure – With the `51%` consensus protocol,\
    \ the transactions are secure. Obtaining a majority of network power could potentially\
    \ enable massive double spending, and the ability to prevent transaction confirmations,\
    \ among other potentially nefarious acts. This has never been accomplished, as\
    \ the computing power to stage such an attack would be too costly.\n\n## Private\
    \ Closed Blockchain\n\nThe counterpart to the public blockchain is the private\
    \ blockchain or permissioned blockchains.\n\nWhen we talk about private blockchain\
    \ solutions, we generally talk about private closed blockchains. We want to control\
    \ who can write data to this blockchain, as well as control who can read data\
    \ from this blockchain. \n\nIn order to do that, the first step is identity management.\
    \ Private blockchains tend to come with identity management tools or a modular\
    \ architecture, where you can plug in your own identity management solution. This\
    \ can be anything from an `Active Directory` deployment to an `OAuth` solution\
    \ using `Google`, `Facebook`, `LinkedIn`, etc. \n\nThe idea behind the private\
    \ blockchain begins with understanding who the user is, because once we understand\
    \ who a user is, we can determine what role they are in, and we can use that role\
    \ to determine what information should they have access to.\n\nIn a private blockchain,\
    \ we rely on the fact that we know who the user is, to ensure they behave honestly.\
    \ We assume that these users are going to behave fairly honestly, because if not,\
    \ we know exactly who is dishonest and can determine the consequences of dishonest\
    \ behavior.\n\nSome key benefits of private blockchain are:\n\n*   Ledger is distributed\
    \ – The data base is not centralized like in a client-server model, and all nodes\
    \ in the blockchain participate in transaction validation.\n*   Immutable – When\
    \ something is written to the blockchain, it cannot be changed.\n*   Compliance\
    \ Support – As an enterprise, you likely would have compliance requirements to\
    \ adhere to, and having control of your infrastructure would enable this requirement\
    \ more seamlessly.\n*   Faster Transactions – When you distribute the nodes locally,\
    \ but also have much lesser nodes to participate in the ledger,\n*   Efficient\
    \ consensus – `Byzantine Tolerance` (`BFT`) versus `Proof-of-Work` (`PoW`).\n\
    *   Scalability – The ability to add nodes.\n*   Permissioned – The enterprise\
    \ controls the resources.\n\nBlockchain considerations\n\nCompanies must consider\
    \ multiple factors when deciding how blockchain will fit:\n\n*   Governance –\
    \ Governance of blockchains deals with managing changes.\n*   Smart contract functionality\
    \ – Each blockchain has unique needs, but the functionality varies depending on\
    \ the type of environment.\n*   Consensus algorithms – Nodes on the network agree\
    \ to the state of the ledger.\n*   Integration – Bridging blockchain platforms\
    \ with existing systems.\n*   Cryptocurrency requirements – How the blockchain\
    \ will exchange value.\n*   Cost modeling – Splitting the technology cost.\n\n\
    Overall these decisions will be made by the following actors:\n\n*   System Architects\
    \ – They design and build blockchain networks.\n*   System Developers – They design\
    \ the smart contracts.\n*   System Operators – They interact with the software.\n\
    *   Blockchain users – They join a blockchain network.\n\n## Blockchain Transaction\
    \ Flow\n\nAlthough blockchains differ in form and function, they follow a basic\
    \ transaction flow.\n\n![](Images/image00243.gif)\n\n1.  User request – Let’s\
    \ follow these steps with a basic `Bitcoin` transaction. If Alicia wants to send\
    \ Billy some Bitcoins, she would go to a `Bitcoin` wallet application either on\
    \ her phone or a computer where she has some Bitcoins stored. To initiate the\
    \ transaction, Alicia would make a request to the system to send Bitcoin to Billy’s\
    \ wallet by specifying the amount and Billy’s Bitcoin address.\n2.  Smart contract\
    \ enabled – When Alicia sends her transaction to the network, it triggers a smart\
    \ contract that checks with the nodes on the network to make sure that Alicia\
    \ has the currency to spend, and that she hasn’t already spent it. Once checked,\
    \ the transaction is added to a proposed block.\n3.  Transaction announced to\
    \ the network – Proposed block communicated to the network through the peer-to-peer\
    \ protocols.\n4.  Network agrees to the transaction – In order for the `Bitcoin`\
    \ network to validate a block, nodes or miners must validate the accuracy of a\
    \ block by completing a math problem first. The node that completes the `Proof-of-Work`\
    \ (`PoW`) equation first is rewarded with some newly minted Bitcoins. Once a solution\
    \ for the equation is reached, the other nodes can easily check its accuracy,\
    \ thereby accepting the new block into the blockchain network.\n"
  raw: "The public blockchain platforms like Bitcoin, Ethereum, Litecoin are what\
    \ we also refer to as permissionless blockchains platforms meaning that they really\
    \ strive to, by design, increase and protect user’s anonymity. If we do not know\
    \ who a user is and do not have a way of identifying users, we do not have any\
    \ way of creating permission or access rules around that user. Hence, anyone can\
    \ write data to the blockchain and anyone can come along and read data from that\
    \ blockchain. So when you think of public blockchains like Bitcoin or Ethereum,\
    \ understand that by default and by their nature, they are designed to protect\
    \ anonymity.\n\nIn a public blockchain, since we do not know who the user is,\
    \ we rely on economics and game theory incentives to ensure that everybody in\
    \ the system behaves honestly and according to the rules. We set up situations\
    \ through group consensus, through which honest participants are economically\
    \ rewarded, and wherein dishonest ones only incur work or cost, with no possibility\
    \ of ever recouping that cost.\n\nSome key benefits of public blockchain are:\n\
    \n*   Ledger is distributed – The data base is not centralized like in a client-server\
    \ model, and all nodes in the blockchain participate in transaction validation.\n\
    \n*   Immutable – When something is written to the blockchain, it cannot be changed.\n\
    \n*   Open consensus Model – No restriction placed on who can operate a node in\
    \ the network.\n\n*   Open read and write – Anyone can participate by submitting\
    \ transactions to the blockchain, such as Bitcoin or Ethereum.\n\n*   Low barrier\
    \ to entry – Transactions on a public network can be accomplished with an internet\
    \ connection and a cell phone.\n\n*   Secure – With the 51% consensus protocol,\
    \ the transactions are secure. Obtaining a majority of network power could potentially\
    \ enable massive double spending, and the ability to prevent transaction confirmations,\
    \ among other potentially nefarious acts. This has never been accomplished, as\
    \ the computing power to stage such an attack would be too costly.\n\nPrivate\
    \ Closed Blockchain\n\nThe counterpart to the public blockchain is the private\
    \ blockchain or permissioned blockchains.\n\nWhen we talk about private blockchain\
    \ solutions, we generally talk about private closed blockchains. We want to control\
    \ who can write data to this blockchain, as well as control who can read data\
    \ from this blockchain. \n\nIn order to do that, the first step is identity management.\
    \ Private blockchains tend to come with identity management tools or a modular\
    \ architecture, where you can plug in your own identity management solution. This\
    \ can be anything from an Active Directory deployment to an OAuth solution using\
    \ Google, Facebook, LinkedIn, etc. \n\nThe idea behind the private blockchain\
    \ begins with understanding who the user is, because once we understand who a\
    \ user is, we can determine what role they are in, and we can use that role to\
    \ determine what information should they have access to.\n\nIn a private blockchain,\
    \ we rely on the fact that we know who the user is, to ensure they behave honestly.\
    \ We assume that these users are going to behave fairly honestly, because if not,\
    \ we know exactly who is dishonest and can determine the consequences of dishonest\
    \ behavior.\n\nSome key benefits of private blockchain are:\n\n*   Ledger is distributed\
    \ – The data base is not centralized like in a client-server model, and all nodes\
    \ in the blockchain participate in transaction validation.\n\n*   Immutable –\
    \ When something is written to the blockchain, it cannot be changed.\n\n*   Compliance\
    \ Support – As an enterprise, you likely would have compliance requirements to\
    \ adhere to, and having control of your infrastructure would enable this requirement\
    \ more seamlessly.\n\n*   Faster Transactions – When you distribute the nodes\
    \ locally, but also have much lesser nodes to participate in the ledger, the performance\
    \ is faster.\n\n*   More efficient consensus – Enterprise or private blockchains\
    \ have less nodes and usually have a different consensus algorithm, such as Byzantine\
    \ Fault Tolerance (BFT) versus Proof-of-Work (PoW).\n\n*   Scalability – Being\
    \ able to add nodes and services on demand can provide a great advantage to the\
    \ enterprise.\n\n*   Enterprise permissioned – The enterprise controls the resources\
    \ and access to the blockchain, hence private and permissioned.\n\nBlockchain\
    \ considerations\n\nCompanies must consider multiple factors when deciding how\
    \ blockchain will fit into their business model. There is not a “one size fits\
    \ all” blockchain but rather a well-thought-out approach that considers these\
    \ multiple options.\n\n*   Governance – Governance of blockchains deals with a\
    \ system for managing and implementing changes to blockchains.\n\n*   Smart contract\
    \ functionality – Each organization has unique needs when deciding on smart contract\
    \ functionality. Such decisions as to the design, implementation and testing of\
    \ these digital promises need to be determined. Can smart contract replace current\
    \ work flows? Can a smart contract fit in the current business model?\n\n*   Consensus\
    \ algorithms – Consensus models change depending on the type of blockchain environment\
    \ you are creating. In order for a blockchain to work, the participants must come\
    \ to an agreement as to the transactions in the ledger or the state of the ledger.\
    \ This agreement is called consensus. Public blockchains have miners that are\
    \ incentivized to reach consensus whereas private blockchain set up enterprise\
    \ nodes that agree to the state of the ledger.\n\n*   Integration – Consideration\
    \ for current work flows and how to bridge blockchain platforms with existing\
    \ systems. How can blockchain add value to the current organization while leveraging\
    \ current systems?\n\n*   Cryptocurrency requirements – If and how the blockchain\
    \ will exchange value among participants are important discussions that need to\
    \ occur in the design phase.\n\n*   Cost modeling – How to split the technology\
    \ cost among participants in a fair and equitable manner?\n\nOverall these decisions\
    \ will be made by the following actors in the blockchain system:\n\n*   System\
    \ Architects – They design and build blockchain networks. They decide on the node\
    \ types and membership rights.\n\n*   System Developers – They design the smart\
    \ contracts for users.\n\n*   System Operators – They interact with the software,\
    \ ‘permissioning’ and onboarding participants. This includes storing the ledger,\
    \ creating wallets and managing credentials.\n\n*   Blockchain users – They join\
    \ a blockchain network by setting up a wallet and receiving permission to engage\
    \ in a particular function.\n\n## Blockchain Transaction Flow\n\nAlthough blockchains\
    \ differ in form and function, they follow a basic transaction flow.\n\n![](Images/image00243.gif)\n\
    \n1.  User request – Let’s follow these steps with a basic Bitcoin transaction.\
    \ If Alicia wants to send Billy some Bitcoins, she would go to a Bitcoin wallet\
    \ application either on her phone or a computer where she has some Bitcoins stored.\
    \ To initiate the transaction, Alicia would make a request to the system to send\
    \ Bitcoin to Billy’s wallet by specifying the amount and Billy’s Bitcoin address.\n\
    \n2.  Smart contract enabled – When Alicia sends her transaction to the network,\
    \ it triggers a smart contract that checks with the nodes on the network to make\
    \ sure that Alicia has the currency to spend, and that she hasn’t already spent\
    \ it. Once checked, the transaction is added to a proposed block.\n\n3.  Transaction\
    \ announced to the network – Proposed block in communicated to the network through\
    \ the peer-to-peer protocols.\n\n4.  Network agrees to the transaction – In order\
    \ for the Bitcoin network to validate a block, nodes or miners must validate the\
    \ accuracy of a block by completing a math problem first. The node that completes\
    \ the Proof-of-Work (PoW) equation first is rewarded with some newly minted Bitcoins.\
    \ Once a solution for the equation is reached, the other nodes can easily check\
    \ its accuracy, thereby accepting the new block into the blockchain network."
