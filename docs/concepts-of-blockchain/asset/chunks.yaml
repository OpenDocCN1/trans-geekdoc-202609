    权益证明（PoS）是另一种用于验证加密货币交易的共识机制。在该系统中，加密货币的所有者可以质押他们的代币，这赋予了他们检查新交易区块并将其添加到区块链的权利。PoS
    在加密货币领域的首次实际应用是 2012 年的 `Peercoin`。


    要让区块链交易被识别，它必须被添加到区块链中。添加区块的矿工将获得奖励。为了保持区块链的安全，必须拥有一种机制来防止恶意用户或群体接管。PoS 通过要求验证者在区块链上拥有一定数量的代币来实现这一点，这使得潜在攻击者必须获得大量的份额。


    PoS 模型允许加密货币所有者质押代币并创建自己的验证节点。当一个交易区块准备好处理时，加密货币的 `PoS` 协议将选择一个验证节点来审查该区块。验证者检查区块中的交易是否准确。如果是，他们会将区块添加到区块链，并为自己的贡献获得更多奖励。然而，如果验证者提议添加包含错误信息的区块，他们将失去部分持仓作为惩。


    例如，让我们来看看 `PoS` 如何在 `Cardano` 中工作，`Cardano` 是一种基于 `PoS` 协议的主要加密货币。任何拥有 `Cardano`
    的人都可以质押它并建立自己的验证节点。当 `Cardano` 需要验证交易区块时，它的 `Ouroboros` 协议会选择一个验证者。验证者检查区块、添加它，并为他们的努力获得更多的
    Cardano。


    权益证明和工作量证明是最常见的两种共识机制类型。`PoW` 是早期加密货币（包括 `Bitcoin` 和 `Ethereum`）的首选方法，而 `PoS`
    已成为山寨币的常见选择。`PoS` 使用质押能力的验证来验证交易，而 `PoW` 则使用计算能力的验证来验证交易。


    ## 工作量证明 (PoW) 与 权益证明 (PoS)


    `PoS` 和 `PoW` 之间最大的区别在于它们的能量消耗。`PoW` 要求矿工竞争解决数学题。第一个解决问题的矿工可以添加交易区块并获得奖励。这导致世界各地的矿矿设备计算相同的问题并消耗大量的能量。由于
    `PoS` 不需要验证者求解复杂的方程，因此它是一种更环保的验证交易方式。


    `PoS` 与 `PoW` 的比较：


    | PoW | PoS |

    | --- | --- |

    | 一台电脑，一票 | 一枚币，一票 |

    | 任何拥有电脑的人都可以验证区块 | 只有币所有者可以验证区块 |

    | 匿名参与 | 使用数字签名识别参与者 |

    | 矿工根据算力比例随机选择 | 验证者根据质押比例随机选择 |

    | 奖励给第一个矿工 | 收集网络费用作为奖励 |

    | 为了解决复杂算法需要巨大的能量成本 | 成本和能量效率高得多 |


    `PoS` 协议的优缺点如下：


    | 优点 | 缺点 |

    | --- | --- |

    | 节能高效 | 在安全性方面不如 `PoW` 经受验证 |

    | 交易处理快速且廉价 | 持仓量大的验证者对交易验证产生过度影响 |

    | 不需要特殊设备来解决复杂问题 | 某些 `PoS` 加密货币锁定质押代币一段时间 |


    `PoS` 在安全风险方面存在不确定性，因为它是新的，且没有像 `PoW` 那么有经验。`PoW` 协议在双重花费方面被认为更安全，因为矿工鼓励持续分叉，因为这会使网络不稳定。在分叉期间，矿工必须决定遵循原始区块链还是调整到新区块链。为了维护两个区块链，矿工将计算资源分配给原始区块和新区块。相反，`PoS`
    将这个问题称为“无风险”（nothing at stake）问题。在这里，验证者在分叉的区块链上收到质押的副本，并在从两个链签名后可以声称双倍交易费用作为奖励。为了解决这个问题，这种共识需要执行某些期间的锁定存款。`Casper`
    是一种鼓励验证者以最小存款参与 `PoS` 协议的协议。如果协议在持续分叉期间发现验证者有任何违规行为，存款可能会被没收。


    ## 私有许可区块链中的共识机制


    ### Hyperledger Fabric 共识模型

    `Hyperledger Fabric` 是一个私有许可区块链平台，它将共识拆分为多个组件，允许用户根据其特定情况选择共识算法。`Hyperledger`
    没有使用预定义的共识模型，而是有一个执行共识相关事件的排序服务，该排序组件可以选择最适合区块链需求的共识模型。通过这种模块化的方式处理共识，`Hyperledger
    DLT` 可以在不对代码库进行大规模修改的情况下更改共识模型。


    ### Corda 共识机制

    `Corda` 是一个私有许可区块链。每个 `Corda` 网络都有一个由独立方组成的公证服务，他们使用任何相关的共识算法来批准区块。正如 Jamiel Sheikh
    的书《Mastering Corda: Blockchain for Java Developers》中所提到的，R3 提供了一套名为 `The Corda
    Business Network Toolkit` 的 `Corda` 应用来管理一个或多个 `Corda` 网络。`Corda` 不遵循标准的区块链模型（即交易打包成区块然后由整个网络最终确定）。相反，`Corda`
    网络包含由多个独立方组成的一个或多个公证处。`Corda` 中的交易由公证处使用 `Raft` 等算法通过多方数字签名完成最终。


    # 区块链治理


    在本章中，我们将涵盖区块链治理。我们将从讨论区块链公司共享该技术合作代码的方式开始。我们还将探索开源环境如何促进新的创新。然后我们将检查谁真正负责区块链，以及网络效应如何决定区块链的走向。


    接下来，我们将看看这些具有开放交互的去信任系统比过去的系统更安全。最后，我们将深入探讨互不信任的方之间协作的想法，以及区块链技术如何改变他们的互动方式。


    ## 开源


    区块链技术和与其工作的开发者从许多方面强化了去中心化这一基本原则。不仅通过决策共识模型，还通过分发软件代码的方式。


    *   所有有 / 封闭源代码 – 由创建并维护它的个人、团队或组织控制，并拥有独他权利。只有原始作者可以合法复制、检查和修改软件。大多数所有有软件的用户都会签署协议，允许使用软件但不允许修改。`Microsoft
    Office` 是所有有软件的一个示例。


