- fmt: '

    To understand more details, let’s take a trip back to 1500 years, to the island
    of Yap. The people of Yap use a very unique form of currency – `Rai` stone. Each
    stone weighs around 200 kg, making them difficult to move. To exchange them as
    money for goods or services, the divide the stones into sections, and then, they
    would announce to everyone on the island who owned what part of the stone. Everyone
    on Yap island needs to keep the mental ledger of the ownership.


    Every time any person on Yap island conducted a transaction, an announcement is
    made to everyone on the island. Each member would then update their mental ledger.
    In today’s description, this would be distributed ledger. All `Rai` stone ownership
    is known to everyone on the island, and this knowledge is updated whenever a transaction
    is made.


    So why doesn’t just one member keep the accounting of `Rai` stone? What if this
    accountant got sick, or is unable to do accounting, or is dishonest? If the only
    copy of the ledger is altered by any means, the wealth would be lost or gained
    unfairly. This distributed ledger system safeguards `Rai` stone from any tampering.
    Even if one member moves away, everyone still ha multiple copies of the ledger,
    making the ledger fault tolerant and difficult to alter or get lost.


    One day a stone fell into the ocean and the Yap people decided that the stone
    don’t need to be on Yap island to hold value, and could still be traded. This
    system of consensus by the majority of the adults on the island with no central
    administrator is one of the first examples of distributed ledger.


    Let’s review this with an example – Let’s assume Alice agrees to trade Bob her
    stone in the ocean in exchange for all of his cattle. Alice and Bob announce their
    transaction to everyone on Yap island. Everyone updates their mental ledger, and
    come to a consensus that the stone in the ocean is owned by `Bib` from that point
    onwards. Now suppose Alice tries to corrupt Carol, such that Carol’s ledger shows
    that Alice never gave up ownership of the stone. However, Carol will be outvoted
    by the remaining people on Yap island, and her version of the ledger will not
    be accepted. Hence if Alice wants to cheat, she will need to convince more that
    50% of the people on Yap island to accept an alternative ledger.


    We went through history and saw how ledgers have evolved from stone tablets to
    double-entry ledgers. We even took a look at the earliest known examples of distributed
    ledgers.


    Now, let’s discuss the evolution of the ledger in the modern world. Over the last
    few decades, ledgers have evolved from written for to digital form and digitalized
    databases. This has enabled us to be interconnected.


    Today, the accounting system is being revolutionized again, going from digital
    realm or centralized databases to information being stored across multiple locations
    around the globe. This system of recording information across a global network
    is called a decentralized ledger. A decentralized ledger can be described as a
    ledger of any transaction supported by a decentralized network from across different
    locations and people, eliminating the need of a central authority.


    When a transaction is made, every participant on the network is notified. They
    now own an identical copy of the record of transactions, identical to every other
    node on that network.


    Every piece of information on a `blockchain` can be traced back to the exact moment
    when it was created. So, if an audit is conducted, the information can easily
    be found and deemed reliable. This allows the `blockchain` to serve as a truly
    reliable storage of public records and transactions, and eliminate the need for
    a centralized authority of database of records.


    Now that we understand the foundational principle of blockchains – distributed
    ledgers, it’s important to understand another key element that makes blockchain
    so revolutionary ‘Trust’, which is created through two key principles – collaboration
    and cryptography.


    ## Cryptography


    A great way to think of `blockchain` is to think of `blockchain` as another layer
    on the internet, a layer that enables secure and trusted records and transaction
    to occur, which is why a lot of people associate the word `blockchain` with ‘trust’.


    `blockchain` creates a layer of trust between two parties. Without `blockchain`
    to create trusted records and transaction, a 3rd party intermediary is required.
    `blockchain` eliminates the need for a central authority to act as an intermediary
    between the two parties, and instead leverages cryptography and collaboration
    to create trust.


    In the previous section, we discussed about collaboration through distributed
    ledger. Now we will take a further look at how cryptography is used in `blockchain`
    to create the second element necessary for `blockchain` to be a source of trust.


    Information on the `blockchain` is stored on the ledger using cryptography. It
    can be accessed using key and cryptographic signatures. Now, let’s analyze cryptography
    and some of its key concepts, that are utilized with `blockchain`.


    ## History of Cryptography


    There have been three well-defined phases in the history of cryptology.


    ### The First Phase – Manual Cryptography


    The first phase was the period of manual cryptography, starting with the origins
    of the subject in antiquity and continuing through World I. The art of cryptography
    is considered to be born along with the art of writing. As civilizations evolved,
    human beings got organized in tribes, groups, and kingdoms. This led to the emergence
    of ideas such as power, battles, supremacy, and politics. These ideas further
    fueled the natural need of people to communicate secretly.


    The first known evidence of cryptography can be traced to the use of `hieroglyph`.
    Some 4000 years ago, the Egyptians used to communicate by messages written in
    hieroglyph. This code was the secret known only to the scribes who used to transmit
    messages on behalf of the kings. One such hieroglyph is shown below.


    ![Hieroglyph](Images/image0234.jpeg)


    `Heiroglyph` cryptography; Source: https://www.tutorialspoint.com/cryptography


    Later, the scholars moved on using simple mono-alphabetic substitution ciphers
    during 500 to 600 BC. This involved replacing alphabets of message with other
    alphabets with some secret rule. This rule became a key to retrieve the message
    back from the garbled message.


    The earlier Roman method of cryptography, popularly known as `Caesar Shift Cipher`,
    relies on shifting the letters of a message by an agreed number (three was a common
    choice), the recipient of this message would then shift the letters back by the
    same number and obtain the original message.


    ![Caesar Shift Cipher](Images/image0235.jpeg)


    `Caesarshift` cipher; Source: https://www.tutorialspoint.com/cryptography


    It is during and after the European Renaissance, various Italian and Papal states
    led the rapid proliferation of cryptographic techniques. Various analysis and
    attack techniques were researched in this era to break the secret codes, like
    the improved coding techniques such as `Vigenere Coding` came into existence in
    the 15th century, which offered moving letters in the message with several variable
    places instead of moving them the same number of places.


    Throughout this phase cryptography was limited by the complexity of what a code
    clerk could reasonably do aided by simple mnemonic devices. As a result, ciphers
    were limited to at most a few pages in size, i.e., to only a few thousands of
    characters. General principles for both cryptography and cryptanalysis were known,
    but the security that could be achieved was always limited by what could be done
    manually. Most systems could be cryptanalyzed, therefore, given sufficient ciphertext
    and effort.


    ### The Second Phase – Mechanization of Cryptography

