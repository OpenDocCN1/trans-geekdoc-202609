- fmt: '

    In development since 2014, Tezos is an older platform that supports decentralized
    applications, smart contracts and novel financial instruments, such as `NFTs`,
    which can be thought of as a modern variation on trading cards that are tied to
    digital assets. The platform supports a dynamically upgradeable protocol and modular
    software clients that enable it to adapt to new uses. The Tezos community has
    been upgrading the platform at a rapid clip, with recent enhancements that have
    improved performance and increased the size limit on smart contracts.


    ## 7. EOSIO


    The EOSIO blockchain platform was first launched as an open source project in
    2018. It is optimized for developing decentralized applications and smart contracts.
    It uses a complex consensus mechanism based on `PoS` that provides better performance
    than older mechanisms like `Ethereum`, according to its proponents. It also includes
    support for a governance feature for voting on changes to the platform.


    Key strengths include fast transactions and advanced account permission features
    for deploying applications. Over 400 applications have been developed on the platform,
    including identity management, supply chain management and gaming.


    ## 8. Stellar


    Stellar is a newer blockchain platform optimized for various kinds of decentralized
    finance applications. It uses the `Stellar Consensus Protocol`, which purportedly
    can speed the time required to process and finalize transactions on a public blockchain
    network.


    Its blockchain network allows for storing and moving of money. It facilitates
    users to create, trade and send digital representations of all forms of money,
    like dollar, `bitcoin`, etc.


    It also includes security mechanisms for shutting out bad or questionable actors
    in a financial transaction. It has been adopted by several companies for international
    trade and exchanging money across borders.


    The key features of Stellar include:


    * Enables thousands of transactions per second

    * Allows multi signatures and Smart contracts

    * Has 1% annual inflation


    ## 9. Quorum


    Quorum is a customized version of `Ethereum` pioneered by JPMorgan. It takes advantage
    of the core work on the `Ethereum` blockchain platform and repackages it into
    a hardened environment suitable for banks. It has been optimized to support high-speed
    transactions between institutions like banks and insurance companies on a private
    network. It also adds various privacy enhancements to `Ethereum` to improve support
    for regulations like `GDPR` in Europe and `CCPA` in California.


    # Blockchain Use Cases


    This chapter examines blockchain in action. We will see how blockchain provides
    solutions for business, governments and social projects. Businesses fueled by
    blockchain are developing new relationships for more efficient communication and
    trust among the untrusting parties, fostering new business models. Next we will
    discuss the impact blockchain is having in developing countries by offering transparency
    and accountability. We will blockchain based new technologies and emerging breakthroughs.
    Finally, we will gain an insight on the use cases designed to improve the user’s
    experience, decentralized gaming platforms and new marketplaces inventing new
    worlds to interact in.


    ## Blockchain Use Case Categories


    Let’s take a look at how blockchain is improving the way we interact with each
    other. In blockchain, identity management is the key to all the use cases. We
    will characterize these use cases by who is developing the solutions, starting
    with large enterprise solutions to smartphone and web browser applications powered
    by blockchain that pur control back on user’s hands.


    * Enterprise solutions – Business and organizations are implementing blockchain
    to overcome obstacles in transparency and trust forging new associations with
    global implications.

    * Public sector solutions – Governments are using blockchain solutions to improve
    services that they provide to their citizens. Digital identity solutions, central
    bank digital currencies and transparent workflows are bringing efficiency to the
    public sector system with an end result that benefits citizens.

    * Social impact solutions – Social impact blockchain solutions address social
    and environmental challenges. Backed by 17 UN Sustainable Development Goals blockchain
    developers, investors, philanthropists, government agencies and foundations are
    developing solutions that tackle these global problems.

    * Platform developer solutions – Blockchain is a new technology that is constantly
    improving. Developers are creating standards and new platforms to bring this technology
    into the mainstream.

    * End user solutions – Everyday solutions emerge that put decentralized blockchains
    and all the benefits they promise in the hands of individuals from new decentralized
    marketplaces to new ways to express music, art, and even trade property built
    inside a game.


    ## Enterprise Solutions


    Business fueled by blockchain solutions are developing new relationships for more
    efficient communications and workflows, fostering new business models, and solving
    problems with how transact online, to the cost of doing business.


    ### Global Supply Chains


    Supply chain data is not always visible or trusted. In recent times of disruption
    supply chains matter more than ever. Global supply chains and blockchain are working
    to secure systems to better handle these disruptions. The `Covid-19` pandemic
    shed light on the frailty of our supply chains which accelerated the discussion
    over blockchain solutions.


    Global trade functions much as it has since the introduction of the shipping container
    in 1956. Manual, paper-based processes are still common and information about
    the status of goods is locked away in organization silos. Today, 90% of goods
    in global trade are carried by the shipping industry with the supply chain slowed
    by the complexity and sheer volume of point-to-point communication across a loosely
    coupled web of land transportation providers, freight forwarders, custom brokers,
    governments, ports, and ocean carriers.


    `IBM` and `Maersk` are addressing this problem with a distributes permissioned
    platform accessible by the supply chain ecosystem designed to exchange event data
    and handle document workflows. They are employing blockchain technology to create
    a global tamperproof system for digitizing trade workflow and tracking shipments
    end-to-end, eliminating frictions including costly point-to-point communications.
    The collaboration will launch with the potential ability to track millions of
    container journeys per year and integrate with custom authorities on selected
    trade lanes.

