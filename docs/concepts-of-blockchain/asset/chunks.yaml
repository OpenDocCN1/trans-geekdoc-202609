    \ on Ethereum and also compatible with all of Ethereum's major wallets and applications.\n\
    \nExamples of DeFi platforms include MakerDAO and Compound. Uniswap, a decentralized\
    \ exchange for tokens on Ethereum grew from $20 million in liquidity to $2.9 billion\
    \ in 2020. As of October 2020, over $11 billion was invested in various DeFi protocols.\n\
