- fmt: '

    Informally, these properties mean that a malicious attacker cannot replace or
    modify the input data without changing its digest. Thus, if two strings have the
    same digest, one can be very confident that they are identical. Second pre-image
    resistance prevents an attacker from crafting a document with the same hash as
    a document the attacker cannot control. Collision resistance prevents an attacker
    from creating two distinct documents with the same hash.


    An illustration of the potential use of a cryptographic hash is as follows: Suppose
    you give me a tough computational problem to solve and claim that you have already
    solved it. I want to solve this problem, however I would like to ensure that you
    have actually solved this problem as well. So, you would write down your solution,
    compute its hash, and tell me the hash value (whilst keeping the solution secret).
    Let’s assume that I solve this problem in a week. Now you can prove that you solved
    it earlier by revealing the solution, which I can hash and validate with the hash
    value you gave me before.


    An important application of secure hashes is the verification of message integrity.
    Comparing message digests (hash digests over the message) calculated before, and
    after, transmission can determine whether any changes have been made to the message
    or file. Using a cryptographic hash and a chain of trust detects malicious changes
    to the file. Almost all digital signature schemes require a cryptographic hash
    to be calculated over the message. This allows the signature calculation to be
    performed on the relatively small, statically sized hash digest. The message is
    considered authentic if the signature verification succeeds given the signature
    and recalculated hash digest over the message. So the message integrity property
    of the cryptographic hash is used to create secure and efficient digital signature
    schemes.


    Bitcoin uses hash function `Security Hash Algorithm-256 (SHA-256)` to validate
    the Proof-of-Work (PoW) protocols in its network. `SHA-256` was originally designed
    by US National Security Agency (NSA). `SHA-256` is a member of `SHA2` family of
    cryptographic has functions. It takes an input size less that `2^64` bits and
    produces a fixed size output of `256` bits. Bitcoin, in certain instances uses
    `SHA-256d`, meaning that `SHA-256` is used twice in a row, once on the original
    message to be hashed and again on the output of the `1st` hash.


    This system uses partial hash inversions to prove that work was done, unlock a
    mining reward in Bitcoin, and as a good-will token to send an e-mail in Hash-cash.
    The sender is required to find a message whose hash value begins with a certain
    number of zero bits. The average work that the sender needs to perform to find
    a valid message is exponential in the number of zero bits required in the hash
    value, while the recipient can verify the validity of the message by executing
    a single hash function.


    ## Merkle Trees


    A data storage technique that compresses data for storing blockchains with a built-in
    tamper-free component. Merkle trees are built upon hashing principles in that
    each hash becomes part of the next hash to develop a tamper resistant data storage
    model.


    In computer science terminology, a tree is a data structure that has a root node
    and some children, which may also be the roots of other trees. A binary tree is
    a tree in which every node has two children, as shown below.


    ![](Images/image00240.gif)


    A `Merkle Tree` is a very specific version of `Binary Tree`, in which every "child"
    (node) is labelled with the cryptographic hash of a data block, and every node
    that is not a “child” is labelled with the cryptographic hash of the labels of
    its child nodes. A hash tree allows efficient and secure verification of the contents
    of a large data structure. The concept of a hash tree is named after Ralph Merkle,
    who patented it in 1979.


    The following conditions need to be true for a tree to be a `Merkle Tree`:


    * There is a power of two children at the bottom most level

    * The lowest level is made of the hashes of the summarized information


    The construction of the `Merkle Tree` consists of verified Data Blocks. Each of
    them is hashed to get a level of hashes. Then `2` blocks are paired together and
    hashed, making a new level with half as many blocks. This process is continued
    till only one hash remains at the top. This has at the top is called the `Merkle
    Root`. This way any transaction change can be detected after commitment with the
    `Merkle Root`.


    ![](Images/image00241.gif)


    Let’s assume that `Block 3` is changed, then its hash will also change. Because
    of this the hash above will also change, propagating all the way up to the `Merkle
    Root`. Hence, if any transaction is changed, then the corresponding `Merkle Root`
    is also impacted.


    We can validate any transaction with just one piece of information at each level.
    For example, we can validate `Block 1` with `Hash 0`. This makes the network more
    and more efficient as the tree grows larger.


    In case a `Merkle Root` somehow gets tampered, it changes the block header. This
    is turn alters the next block’s `previous block hash`, which will impact all the
    future block hashes as well. The rest of the network will reject the history proposed
    by this blockchain because they will not agree.


    ## Disintermediation Effect


    Now that we have an understanding how ledgers and cryptography work together to
    create a layer of trust, let’s discuss how blockchain has a powerful disintermediation
    effect.


    The developers can create a distributed ledger on a blockchain, and use cryptography
    to give people secure space on that ledger, enabling people to own their data.
    You may be asking – “How this is different from traditional technology?” Today,
    organizations use `/ store / exchange / sell` our data. Blockchain truly empowers
    the users with ownership of their data, and they can share only the information
    they desire. It also enables the users to transact peer-to-peer. For example,
    suppose you go out to eat at a restaurant and pay with your credit card, you are
    not paying the restaurant directly; instead a database record of your account
    at your bank is debited and the database record of the restaurant’s bank account
    is credited. Here, the value and data in the database belong to the intermediary,
    and not you or the restaurant. You are dependent on the credit card company and
    the bank to secure and validate the transaction, which shifts the power to these
    intermediaries. But in the blockchain world, every individual have their own ledger
    record, and the secure key to access it, hence eliminating the need of an intermediary.
    Hence, the transaction is simply debited from your record and credited directly
    to the restaurant’s record. Blockchain slows you to have the power to control
    more than just financial transactions, for example – smart contracts. And with
    blockchain, you can determine who can access these records.


    In previous sections, we discussed how collaboration and cryptography creates
