  trans: '

    NFTs 可用于代表游戏内资产，例如数字土地。一些评论人士将其描述为由“用户”控制，而不是由游戏开发者控制，因为它允许资产在无需游戏开发者许可的情况下，在第三方市场上进行交易。CryptoKitties
    是一款早期成功的区块链在线游戏，玩家可以在其中领养和交易虚拟猫。游戏内 NFT 的货币化筹集了 1250 万美元的投资，某些小猫的售价超过了 10 万美元。在取得成功后，CryptoKitties
    被加入了 `ERC-721` 标准。


    # Decentraland


    Decentraland 是一个构建在以太坊区块链之上的虚拟世界。这是一个完全去中心化的世界，用户可以在其中互动、构建和交换物品，与虚拟朋友一起享受音乐会。Decentraland
    由 DAO 运行，这是一个通过智能合约和去中心化应用（dapps）构建的去中心化组织。


    ## 区块链的未来


    区块链的未来是什么？这是一个很大。区块链目前处于令人兴奋的阶段。


    区块链往往与其他许多令人兴奋的新兴技术一起讨论，例如物联网 (IoT)、人工智能 (AI)、增强现实 (AR) 和 3D 打印。区块链可能会成为这些许多技术革命的赋能层。例如，拥有一个智能冰箱，可以分析我的牛奶摄入量，并在牛奶开始不足时自动重新下单。人们对实施许多此类技术感到紧张，因为我们该如何保护它们，该如何确保隐私并防止任何欺诈？我们该如何确保这些系统中的数据是不可篡改且安全的？区块链就是解决方案。随着区块链的不断演进，我们将看到新兴技术的巨大增长。


    从长远来看，区块链将成为多行星人类经济的赋能层。2018 年，SpaceX 启动了一项将人类送往火星的计划。在未来的 40 到 50 年内，我们可能会看到火星上的人类殖民地。现在火星非常遥远，以光速计算，往返需要
    26 分钟。因此，中心化的互联网模型将无法行通。因此，区块链等技术将成为赋能者，让我们在成为多行星社会时能够继续进行交易和互动。


    因此，区块链具有巨大的潜力，它是一个非常令人兴奋的事情，也是目前值得关注的地方。


