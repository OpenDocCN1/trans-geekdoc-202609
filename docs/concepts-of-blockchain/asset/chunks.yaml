  trans: "\n\n怀俄明州已颁布了共 13 部区块链法律，使其成为美国唯一提供全面法律框架、使个人和公司都能利用区块链技术的州。\n\n# 社会影响解决方案\n\
    \n社会影响区块链联盟（`BSIC`）是一个非营利组织，负责孵化、开发和协作各类区块链产品及解决方案，以解决联合国可持续发展目标范围内的社会环境挑战。其目标是激励非政府组织（NGO）、政府机构、基金会、影响力投资者、慈善家和技术人员之间建立联系并搭建桥梁。\n\
    \n根据 Kayla Matthews 的文章《区块链用于社会善行的 7 种方式》，目前正看到区块链社会影响项目的领域包括：\n\n* 慈善与汇款\n* 金融赋能\n\
    * 身份与土地权利\n* 治理与民主\n* 供应链与环境保护\n\n## Kiva\n全球范围内有超过 17 亿人口没有银行账户，无法获得金融服务。`Kiva`\
    \ 是一家成立于 2005 年、位于旧金山的国际非营利组织，其使命是扩大金融准入，以帮助缺乏服务的社区。`Kiva` 通过众筹贷款和为缺乏服务的群体释放资金，从而改善金融服务的质量和成本，并解决全球金融准入的底层障碍。通过\
    \ `Kiva` 的工作，学生可以支付学费，女性可以创业，农民能够投资设备，家庭可以负担得起应急医疗。\n\n## 罗兴雅项目\n`Rohingya Project`\
    \ 的使命是通过数字化连接，为无国籍的罗兴雅人提供学习、装备和自我赋能的机会，为他们创造一个可行的未来奠基础。通过建立金融和社会包容平台，多年来被边缘化的罗兴雅人可以获得广泛的虚拟服务，包括在线教育、数字身份和奖励代币。\n\
    \n该平台将挖掘罗兴雅社区和其他边缘群体的潜力，并提供应对其被排除在主流之外的选择。\n\n# 平台开发者解决方案\n\n## ConsenSys\n`ConsenSys\
    \ Mesh` 公司提供帮助构建以太坊生态系统的解决方案。`ConsenSys Mesh` 作为基于以太坊的项目孵化器：\n\n* `Codefi` – 金融与商业区块链应用\n\
    * `Diligence` – 基于以太坊的智能合约审计\n* `INFURA` – 管理扩展性和性能问题\n* `Metamask` – 加密货币钱包应用\n\
    * `Quorum` – 开源区块链平台\n* `Truffle` – 应用构建器\n\n## Hyperledger\n`Hyperledger` 是一个用于构建区块链解决方案的开源项目，并拥有支持这些区块链的工具。我们在前面的章节中讨论过\
    \ `Hyperledger Fabric` 和 `Hyperledger Sawtooth`。其他基于 Hyperledger 的平台示例还有 `Hyperledger\
    \ Aries`、`Hyperledger Transact`、`Hyperledger Ursa`、`Hyperledger Besu`、`Hyperledger\
    \ Iroha` 和 `Hyperledger Indy`。\n\n## Daml\n`Daml` 是一个用于创建记录系统的开发框架，能够在跨业务流程和数据边界保护隐私、确保数据完整性并执行严格的授权。允许此类系统跨越法律、监管、组织或其他边界，使其能够实现无缝的经济网络。\n\
    \n* `Daml Connect` – 这是一个完整的开发和应用栈，允许你以最少的样板代码构建、集成、部署和维护全栈多方解决方案。\n* `Daml Drivers`\
    \ – 它们允许你使用分布式账本、区块链或数据库部署应用程序。随着业务需求的演变，可以在不更改代码的情况下在账本驱动程序之间进行迁移。\n* `Daml Drivers`\
    \ ... `Daml Hub` \n\n## SIMBA Chain\n`SIMBA Chain` 成立于 2017 年。`SIMBA Chain` 是一个去中心化平台。随着家庭能源生产和存储的出现，许多用户在家里储存剩余能量但没有“销售”能量的方法。`SIMBA\
    \ Chain`提供了点对点能源交易，并获得了国防研究计划署（`DARPA`）、印第安纳技术与制造业（`ITAM`）以及研究中心（`CRC`）的奖励。\n\n\
    # 端解决方案\n\n## 身份\n身份管理对于区块链运营至关重要。一种解决方案是可验证组织（`VON`）项目，它使组织以及运营这些组织的人能够进行在线业务。\n\
    \n## 市场\n市场用于购买可再生能源`Power Ledger` 提供了一个点对点能源交易平台。它构建全球能源解决方案，为社区提供廉价且可再生的电力。\n\
    \n## 音乐与电影\n现在艺术家、制作人和标签公司有了新的方式，通过非质化代币（`NFTs`）获得及时、全额的报酬，使版税直接返回给艺术家。`NFTs`\
    \ 通常持有在 `Ethereum` 区块网上，尽管其他区块链也支持它们。\n\n## 游戏\n视频游戏仅仅作为娱乐形式的时代早已一去。大多数新视频游戏都包含应用内购买和盲箱功能。通过使用\
    \ `DeFi`，游戏开发者可以使用 `DeFi` 代币实施更新的激励或奖励模型。\n\n"
