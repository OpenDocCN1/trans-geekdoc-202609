    `binary tree` is a tree in which...


    ## Partial Preimage Hash


    ![](Images/image00247.gif)


    The entities in the network need to prove that they have done work before they
    can submit a `vote`. They have to design a `partial preimage hash puzzle` for
    their computers to solve to prove that they have done work. `Partial preimage`
    means a `partial input`. In Bitcoin, we are given a `part of the input`, and we
    have to find the `other part` which produces some `partial output`, meeting the
    condition that the `hash of the block header` needs to be less than `target value`.
    This is how `Proof-of-Work (PoW)` gets implemented in Bitcoin. These `hash puzzles`
    need to have three characteristics:


    * `Computationally difficult` – Ensure that the puzzle cannot be easily solved

    * `Parameterizable` – The difficulty of the puzzle should be adjustable to ensure
    that it never gets too easy or too hard

    * `Easily verifiable` – Ensure that the computers in the network do not have to
    do too much work to validate the solution of the


    ## Digital Signatures


    Digital signatures ensure that the current transactions sent to the rest of the
    network are tamper proof as well. Digital signatures authenticate identity of
    the user, as it was signed with a specific `private key`, providing ownership
    of a `public key` to validate it.


    For example, suppose you want to send your friend a message. How can you make
    sure that it is not tampered. So, before sending the message you sign it with
    your `private key`, authenticating your identity. Then you send the `signed message`
    to your friend. The `message` is the main payload and the `digital signature`
    is used to prove that it was you who created the exact `message`. Your friend
    is able to verify your signature with your `public key`. At any point, if this
    `message` is tampered with, the `digital signature` would not remain valid anymore.
    This is how `digital signature` make the message tamper proof.


    Digital signatures have the following key properties:


    * `Message origin` – Recipient is able to verify that the original sender (owner
    of `private key`) has authorized the message

    * `Non-repudiation` – Original sender (owner of `private key`) cannot backtrack,
    undo or nullify the signature, after sending the message

    * `Message integrity` – Message cannot be modified after sending

