    # Private Blockchains


    Private blockchains are often referred to as ''permissioned'' blockchains. Unlike
    public blockchains, where anyone can download the software, form a node, view
    the ledger and interact with the blockchain, private blockchains are often run
    and operated by an entity ("trusted intermediary"). As the trusted intermediary
    is charge of running the blockchain, it will control who can access and also control
    the type of access rights each has. For example, some participants may be restricted
    to viewing (some or all of) the ledger, whereas others may also have to submit
    new transactions for recording on.


    Private blockchains have been proposed for business use. Computerworld called
    such privatized blockchains oil; however, others have argued that permissioned
    blockchains, if carefully designed, may be more decentralized and therefore more
    secure in practice than permissionless ones. The most common examples of private
    blockchains are RippleXRP and Hyperledger.


    # Bitcoin is NOT Blockchain


    A lot of people believe that Bitcoin and Blockchain are one and the same. They
    are not! Bitcoin is a cryptocurrency which utilizes technology. It is one of the
    most important use case of blockchain. If a user has an `internet` connection
    and `bitcoin` wallet, he can receive and send `bitcoin` over.


    # Blockchain History


    The Early Internet started in the 1960s as a way for government researchers to
    share information. The computers in that era were large and immobile and in order
    to make use of information stored in any computer, one had to either travel to
    the site or have sent through conventional postal system. Another catalyst in
    the formation of Internet was Cold War between US and Soviets. Soviet Union''s
    launch of Sputnik spurred U.S. Defense Department to consider ways information
    could still disseminated even after nuclear attack. This led to the formation
    of `ARPANET` (Advanced Research Projects Network), the network that ultimately
    evolved into what we now know as Internet. `ARPANET` was a great success but membership
    was limited to certain academic and research organizations who had contracts with
    Defense Department. In response to this, other networks were created to provide
    information sharing.


    `ARPANET` started `DARPA` (Defense Advanced Research Agency) experiment in decentralized
    computing between two university labs in California in 1970. On 1983, this communications
    protocol became `TCP/IP`, the standard in networking protocol which is the backbone
    of today’s internet. Prior to this, the various computer networks did not have
    a standard way to communicate with each other. `TCP/IP` allowed different kinds
    of computers on different networks to "talk" to each other. `ARPANET` and Defense
    Data Network officially changed to `TCP/IP` standard on 1983, leading to the birth
    of Internet.


    With `TCP/IP` protocol in place, users had the ability to link hypertext documents
    in information system accessible from any node or computer. All networks could
    now be connected by a universal language. The resulting information system became
    today’s World Wide Web (`www`). With the birth of World Wide Web, expanded usages
    of this technology arose with expanded business opportunities. Web servers which
    host and store the documents and web browsers set up to help you view linked documents,
    create a household need for this new technology, leading to the rise of internet
    revolution.


    The internet can be grouped into three distinct segments by the way people interact
    with it:


    *   Web 1.0 – Internet of Connection

    *   Web 2.0 – Internet of Information

    *   Web 3.0 – Internet of Value


    # Web 1.0 – Internet of Connection


    Web 1.0 refers to the first stage of the World Wide Web evolution. It was a content
    delivery network (`CDN`) that enabled the showcase of the piece of information
    on the websites. There were only a few content creators in Web 1.0 with a huge
    majority of users who were the consumers of content. Personal web pages were common,
    consisting mainly of static pages hosted on ISP-run web servers, or on free hosting
    services.


    The web pages were static and built using `Server Side Includes` or `Common Gateway
    Interface` (`CGI`). `Frames` and `Tables` were used to position and align the
    elements on a page. The content was served from the server’s file system. It costed
    the user as pages viewed and had directories that enabled users to retrieve a
    particular piece of information.


    The essential characteristics of Web 1.0 were:


    *   Development of a host of web-based applications, which fostered in online
    services, such as email.

    *   Content from the administrator

    *   Managed by a central authority

    *   Read-only information, that was ‘pushed’ to the users


    ![Figure A: A typical Web 1.0 Architecture B. Web 2.0 | Download Scientific Diagram](Images/image00230.jpeg)


    Web 1.0 architecture; Source: researchgate.net


    Email was the first widely adopted application on Web 1.0. Computers and their
    connectivity started becoming necessities. Technology advancement in computer
    technology brought on changes, floppy disks became hard disks, storage capacities
    increased from `MB` to `GB` to `TB`. Internet speed increased from kilobits per
    second (`Kbps`) to megabytes per second (`Mbps`) to gigabytes per second (`Gbps`),
    and `RAM` grew from `KBs` to `GBs`.


    Web 1.0 concluded with the development of the dotcom bubble. Startups appeared
    to cash in on this new technology, most notable being Netscape which developed
    the first commercial web browser.


    # Web 2.0 – Internet of Information


    Web 2.0 is an enhanced version of Web 1.0. It refers to worldwide websites that
    highlight user-generated content, usability, and interoperability for end users.
    Web 2.0 is also called the participative social web. It does not refer to a modification
    to any technical specification, but to modify the way Web pages are designed and
    used.


    Web 2.0 had dynamic content that is responsive to user input, in comparison to
    Web 1.0 which was static. It enabled free sorting of information, permitting users
    to retrieve and classify the information collectively.


    Web 2.0 enabled information flows between the site owner and site users by means
    of evaluation and online commenting. Interaction and collaboration between participants
    was allowed in a social media dialogue as the creator of user-generated content
    in a virtual community. Web 2.0 applications tend to interact much more with the
    end user. As such, the end user is not only a user of the application but also
    a participant by these 8 tools mentioned below:


    *   Podcasting

    *   Blogging

    *   Tagging

    *   Curating with `RSS`

    *   Social bookmarking

    *   Social networking

    *   Social media

    *   Web content voting


    The essential characteristics of Web 2.0 were:


    *   User-generated content

    *   Read-write capability, enabling users to interact with information

    *   Information became siloed

    *   Data became a commodity


    ![](Images/image0231.gif)


    Web 2.0 architecture; Source: researchgate.net

