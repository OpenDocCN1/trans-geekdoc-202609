    \ the byte-fee is 5, subtract 850 so that there is 1150 gas left.\n\n4.  Subtract\
    \ 10 more ether from the sender's account, and add it to the contract's account.\n\
    \n5.  Run the code. In this case, this is simple: it checks if the contract's\
    \ storage at index 2 is used, notices that it is not, and so it sets the storage\
    \ at index 2 to the value CHARLIE. Suppose this takes 187 gas, so the remaining\
    \ amount of gas is 1150 - 187 = 963\n\n6.  Add 963 \\* 0.001 = 0.963 ether back\
    \ to the sender's account, and return the resulting state.\n\n![Ether state transition](Images/image00260.jpeg)\n\
    \nEthereum State Transition Function example; Source – Ethereum.org/whitepaper/\n\
    \nIf there was no contract at the receiving end of the transaction, then the total\
    \ transaction fee would simply be equal to the provided GASPRICE multiplied by\
    \ the length of the transaction in bytes, and the data sent alongside the transaction\
    \ would be irrelevant.\n\nThe messages work equivalently to transactions in terms\
    \ of reverts: if a message execution runs out of gas, then that message's execution,\
    \ and all other executions triggered by that execution, revert, but parent executions\
    \ do not need to revert. This means that it is \"safe\" for a contract to call\
    \ another contract, as if A calls B with G gas then A's execution is guaranteed\
    \ to lose at most G gas. \n\nNote that there is an OPCODE, CREATE, that creates\
    \ a contract; its execution mechanics are generally similar to CALL, with the\
    \ exception that the output of the execution determines the code of a newly created\
    \ contract.\n\nCode Execution\n\nThe code in Ethereum contracts is written in\
    \ a low-level, stack-based bytecode language, referred to as \"Ethereum virtual\
    \ machine code\" or \"EVM code\". The code consists of a series of bytes, where\
    \ each byte represents an operation. In general, code execution is an infinite\
    \ loop that consists of repeatedly carrying out the operation at the current program\
    \ counter (which begins at zero) and then incrementing the program counter by\
    \ one, until the end of the code is reached or an error or STOP or RETURN instruction\
    \ is detected. The operations have access to three types of space in which to\
    \ store data:\n\n*   The stack, a last-in-first-out (LIFO) container to which\
    \ values can be pushed and popped\n\n*   Memory, an infinitely expandable byte\
    \ array\n\n*   The contract's long-term storage, a key/value store. Unlike stack\
    \ and memory, which reset after computation ends, storage persists for the long\
    \ term.\n\nThe code can also access the value, sender and data of the incoming\
    \ message, as well as block header data, and the code can also return a byte array\
    \ of data as an output.\n\nEthereum Mining\n\n![Ethereum apply block diagram](Images/image00261.jpeg)Ethereum\
    \ Apply block diagram; Source – Ethereum.org/whitepaper/\n\nThe Ethereum blockchain\
    \ is in many ways similar to the Bitcoin blockchain, although it does have some\
    \ differences. The main difference between Ethereum and Bitcoin with regard to\
    \ the blockchain architecture is that, unlike Bitcoin, Ethereum blocks contain\
    \ a copy of both the transaction list and the most recent state. Aside from that,\
    \ two other values, the block number and the difficulty, are also stored in the\
    \ block. The basic block validation algorithm in Ethereum is as follows:\n\n1.\
    \  Check if the previous block referenced exists and is valid.\n\n2.  Check that\
    \ the timestamp of the block is greater than that of the referenced previous block\
    \ and less than 15 minutes into the future\n\n3.  Check that the block number,\
    \ difficulty, transaction root, uncle root and gas limit are valid.\n\n4.  Check\
    \ that the Proof-of-Work on the block is valid.\n\n5.  Let S\\[0\\] be the state\
    \ at the end of the previous block.\n\n6.  Let TX be the block's transaction list,\
    \ with n transactions. For all i in 0...n-1, set S\\[i+1\\] = APPLY(S\\[i\\],TX\\\
    [i\\]). If any applications returns an error, or if the total gas consumed in\
    \ the block up until this point exceeds the GASLIMIT, return an error.\n\n7. \
    \ Let S\\_FINAL be S\\[n\\], but adding the block reward paid to the miner.\n\n\
    8.  Check if the Merkle tree root of the state S\\_FINAL is equal to the final\
    \ state root provided in the block header. If it is, the block is valid; otherwise,\
    \ it is not valid.\n\nThe state is stored in the tree structure, and after every\
    \ block only a small part of the tree needs to be changed. Thus, in general, between\
    \ two adjacent blocks most of the tree should be the same, and therefore the data\
    \ can be stored once and referenced twice using pointers (ie. hashes of subtrees).\
    \ \n\nA special kind of tree known as a \"Patricia tree\" is used to accomplish\
    \ this, including a modification to the Merkle tree concept that allows for nodes\
    \ to be inserted and deleted, and not just changed, efficiently. Additionally,\
    \ because all the state information is part of the last block, there is no need\
    \ to store the entire blockchain history - a strategy which, if it could be applied\
    \ to Bitcoin, can be calculated to provide 5-20x savings in space.\n\nA commonly\
    \ asked question is \"where\" contract code is executed, in terms of physical\
    \ hardware. This has a simple answer: the process of executing contract code is\
    \ part of the definition of the state transition function, which is part of the\
    \ block validation algorithm, so if a transaction is added into block B the code\
    \ execution spawned by that transaction will be executed by all nodes, now and\
    \ in the future, that download and validate block B.\n\nEthash\n\nEthash is the\
    \ planned Proof-of-Work (PoW) algorithm for Ethereum. \n\nThe general route that\
    \ the algorithm takes is as follows:\n\n1.  There exists a seed which can be computed\
    \ for each block by scanning through the block headers up until that point.\n\n\
    2.  From the seed, one can compute a 16 MB pseudorandom cache. Light clients store\
    \ the cache.\n\n3.  From the cache, we can generate a 1 GB dataset, with the property\
    \ that each item in the dataset depends on only a small number of items from the\
    \ cache. Full clients and miners store the dataset. The dataset grows linearly\
    \ with time.\n\n4.  Mining involves grabbing random slices of the dataset and\
    \ hashing them together. Verification can be done with low memory by using the\
    \ cache to regenerate the specific pieces of the dataset that you need, so you\
    \ only need to store the cache.\n\nThe large dataset is updated once every 30000\
    \ blocks, so the vast majority of a miner’s effort will be reading the dataset,\
    \ not making changes to it. Ethash is memory bound and claims to be ASIC resistant.\n\
    \n## Ethereum Virtual Machine (EVM)\n\nEthereum smart contracts are generally\
    \ written in high level programming languages. The most popular is Solidity, which\
    \ is a mix between C++ and JavaScript. There is also Vyper, which is a newer language\
    \ currently under development. Smart contract written in these high-level programming\
    \ languages have to be compile down to the Ethereum Virtual Machine (EVM) code.\
    \ \n\n![](Images/image00262.gif)\n\nHence, we go from a higher level, human readable\
    \ language, and compile that down to an EVM code, which is a lower level, simpler\
    \ language, and much easier for a machine to understand and execute.\n\nAfter\
    \ this code is compiled into EVM code, every node in the Ethereum network executes\
    \ it. All the nodes execute the code in the same way, so long as they have an\
    \ up-to-date version of the EVM software. Nodes them come to consensus on the\
    \ new system state, by executing the Proof-of-Work protocol. By tying the voting\
    \ power to the computational power via PoW, Sybil attacks (an attack on a computer\
    \ network in which an attacker subverts the service's reputation system by creating\
    \ a large number of pseudonymous identities and uses them to gain a disproportionately\
    \ large influence) can be prevented. In Ethereum, block creation time is 15 seconds\
    \ long, compared to 10 minutes in Bitcoin. This allows the execution of smart\
    \ contracts to be done and finalized quickly. \n\nEVM Execution"
