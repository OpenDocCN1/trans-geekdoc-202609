- fmt: 'A cryptocurrency is a completely digital, decentralized currency that is built
    using the principles of computer science, cryptography, and economics. Cryptocurrencies
    does not exist in physical form, are not backed by or convertible into a commodity,
    and are typically not issued by a central authority, using decentralized control
    as opposed to central bank digital currency. Cryptocurrencies use encryption to
    authenticate and protect transactions, hence their name.


    Bitcoin is considered the first and the most widely used cryptocurrency. Bitcoin
    can be defined as “a decentralized digital currency, which can be sent from one
    user to another on a peer-to-peer network, without the need for intermediaries
    or banking channel.” Bitcoin transactions are verified by network nodes through
    cryptography and recorded in blockchain, which records bitcoin transactions, and
    stores their history in an append-only ledger format, such that data can be added
    to the ledger, but cannot be deleted. It is implemented as a chain of blocks,
    each block containing a hash of the previous block up to the genesis block in
    the chain.


    # How Bitcoin aims to replace banks?


    In order to understand how Bitcoin serves as a substitute for the banks, we first
    need to understand how the banks function.


    The banks manage their user accounts and secure their money, such that only they
    can make transactions through their accounts. The banks does that by verifying
    and validating the identity of its users prior to any transactions. Thereafter
    the banks conduct transactions (deposits / transfers / withdrawals) on behalf
    of their users and record these transactions. The banks update their users account
    balance whenever they make a new transaction, and let them see the history of
    their activity and transactions. The users trust their banks to honestly record
    their activities, as they fall under their country economic and financial regulations.


    However, what if the users can no longer trust banks or their governments, and
    start looking for alternatives. Here Bitcoin comes into picture.


    Bitcoin enable users to be completely anonymous. In Bitcoin, each user can create
    their own identity / avatar. Since the Bitcoin identity is completely discerned
    from their real world identity, it enables the users a high degree of privacy.
    Now, once the users create their identity and make transactions, these transactions
    can be made directly on the peer-to-peer network without the need of involving
    any central entity like the banks. Also as the transactions are recorded by the
    network via `proof-of-work` concept, the users can be confident that these transactions
    are honestly recorded. Thus the users can confidently send funds to one another
    knowing that the transaction will be validated by the entire network without the
    presence of a 3rd party. Finally, since the ledger can only be appended, the users
    can be confident that their existing records cannot be altered. To store the transaction
    information, each Bitcoin user have their individual copy of the ledger. The decentralized
    nature of Bitcoin ensures the integrity of data as well as prevent the risk of
    single point of failure. In the event that a particular node is hacked, since
    everyone is a record keeper, the other nodes can still ensure the integrity of
    data and keep the network running.


    # Decentralized Finance (DeFI)


    Decentralized Finance (DeFI) refers to a system of financial software that enables
    financial products to be made available to the public on decentralized blockchains.
    DeFi offers financial instruments without relying on intermediaries such as brokerages,
    exchanges, or banks by using smart contracts on a blockchain. DeFi platforms allow
    people to lend or borrow funds from others, speculate on price movements on assets
    using derivatives, trade cryptocurrencies, insure against risks, and earn interest
    in savings-like accounts.


    Bitcoin in many ways was the first DeFi application. Bitcoin lets you really own
    and control value and send it anywhere.


    ## Benefits of DeFI


    DeFI leverages key principles of Ethereum to increase security, unlock opportunities,
    and support integrated economic system.


    - **Programmability**: Highly programmable smart contracts automate execution
    and enable the creation of new financial instruments and digital assets.

    - **Immutability**: Tamper-proof data coordination across blockchain increases
    security and auditability.

    - **Interoperability**: Ethereum’s composable software stack ensures that DeFi
    protocols and applications are built to integrate and complement one another.
    With DeFi, developers and product teams have the flexibility to build on top of
    existing protocols, customize interfaces, and integrate third-party applications.
    For this reason, people often call DeFi protocols “money legos.”

    - **Transparency**: On the public Ethereum blockchain, every transaction is broadcast
    to and verified by other users. This level of transparency around transaction
    data not only allows for rich data analysis but also ensures that network activity
    is available to any user. Ethereum and the DeFi protocols running on it are also
    built with open source code that is available for anyone to view, audit, and build
    upon.

    - **Permissionless**: Unlike traditional finance, DeFi is defined by its open,
    permissionless access: anyone with a crypto wallet and an internet connection,
    regardless of their geography and often without any minimum amount of funds required,
    can access DeFi applications built on Ethereum.

    - **Self Custody**: By using Web3.0 wallets like `MetaMask` to interact with permissionless
    financial applications and protocols, DeFi market participants always keep custody
    of their assets and control of their personal data.


    # DeFi Use Cases


    Users typically engage with DeFi via software called `dapps` (decentralized apps),
    most of which currently run on the Ethereum blockchain. Unlike a conventional
    bank, there is no application to fill out or account to open.


    Here are some of the ways dapps and DeFi protocols are already being used:


    - **Traditional financial transactions**: Anything from payments, trading securities
    and insurance, to lending and borrowing are already happening with DeFi.

    - **Decentralized exchanges (DEXs)**: Right now, most cryptocurrency investors
    use centralized exchanges like `Coinbase` or `Gemini`. DEXs facilitate `-to-peer`
    financial transactions and let users retain control over their money.

    - **E-wallets**: DeFi developers are creating digital wallets that can operate
    independently of the largest cryptocurrency exchanges and give investors access
    to everything from cryptocurrency to blockchain-based games.

    - **Yield harvesting**: Dubbed the “rocket fuel” of crypto, DeFi makes it possible
    for speculative investors to lend crypto and potentially reap big rewards when
    the proprietary coins DeFi borrowing platforms pay them for agreeing to the loan
    appreciate rapidly.

