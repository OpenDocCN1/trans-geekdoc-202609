    NFTs can be used to represent in-game assets, such as digital plots of land, which
    some commentators describe as being controlled "by the user" instead of the game
    developer by allowing assets to be traded on the 3rd party marketplaces without
    permission from the game developer. CryptoKitties was an early successful blockchain
    online game where players adopt and trade virtual cats. The monetization of NFTs
    within the game raised a $12.5 million investment, with some kitties selling for
    over $100,000 each. Following its success, CryptoKitties was added to the `ERC-721`
    standard.


    # Decentraland


    Decentraland is a virtual world built on the top of the Ethereum blockchain. A
    fully decentralized world where users can interact, build and exchange items,
    enjoy a concert with virtual friends. Decentraland is run by a DOA, decentralized
    organization built with smart contracts and decentralized applications (dapps).


    ## The Future of Blockchain


    What is the future of blockchain? This is a big question. Blockchain is in an
    exciting place right now.


    Blockchain tends to get talked about in the context of a lot of other exciting
    emerging technologies like Internet of Things (IoT), Artificial intelligence (AI),
    Augmented Reality (AI), and 3D Printing. Blockchain is likely to become an enabling
    layer for many of these technological revolutions. For example, having a smart
    refrigerator that analyze my milk intake and automatically reorders milk as it
    starts to get low. People are getting nervous on the idea of implementing many
    of thee technologies, because how do we protect them, how do we ensure privacy
    and protect any frauds. How to we ensure that the data in these systems is immutable
    and secure? Blockchain is the solution to that. We are going to see a lot of growth
    in the emerging technologies as blockchain continues to evolve.


    In long term, blockchain will become an enabling layer for a multi-planetary human
    economy. In 2018, SpaceX launched a program to send humans to Mars. In the next
    40 to 50 years, we might see a human colony in Mars. Now Mars is really far away.
    At the fastest, it is a 26 minute round trip at the speed of light. Hence, centralized
    models of internet are not going to work. Hence, technologies like blockchain
    will be the enablers to allow humans to continue to trade and interact with each
    other as we become a multi-planetary society.


    Hence, there is a huge potential in blockchain and it is something really exciting
    and a place to be right now.


