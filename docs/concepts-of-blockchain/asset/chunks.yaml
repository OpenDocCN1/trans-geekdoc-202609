    第一代区块链平台“区块链 1.0”网络能够捕捉和记录数据，但无法对数据进行操作。比特币实现了对比特币从一个所有者到另一个所有者转移的捕捉和记录。在当时，没有人想象区块链为一个可以在之上构建应用程序和解决方案的平台。2015
    年以太坊的发布改变这一概念。“区块链 2.0”运而生，现在区块链网络不仅可以捕捉数据，还可以对其进行操作。这一切的实现得益于“智能合约”的引入，这是一种部署在区块链网络上的计算机代码。用户与智能合约进行交易就像与另一个用户交易一样，不同在于与智能合约交易的规则定义在代码中，并用于处理该交易。这使得区块链能够管理和自动化流程，并将结果记录在与所有相关方共享的永久、不可篡改且安全的账本上。


    让我们以二手车为例。爱丽（Alice）挂出她的车，并向任何买家提供保证，保证在接下来的 10,000 英里内没有故障。鲍布（Bob）想买这辆车，并出了 5,000
    美元。爱丽和鲍布达成一致，爱丽现在收取一半购买价（2,500 美元），如果鲍布在拥有的前 10,000 英里内汽车没有重大问题，则再收取另一半。爱丽和鲍布可以创建一个智能合约。这个智能合约会将剩余的
    2,500 美元购买款保留在一个托管账户中，如果鲍布发现汽车有问题，他将向智能合约报告。在鲍布拥有 10,000 英里后，智能合约将根据爱丽和鲍布最初同意的规则，确定剩余资金中有多少应归爱丽，多少应归还给鲍布。交易的所有细节都将记录在一个永久、去中心化的账本上，未来在任何时候都可以用来回答关于爱丽和鲍布之间交易的任何问题。


    目前，“智能”合约通常并不智能智能。简单的解释是，因为这些合约是“如果，那么，否则”语句，它们的复杂度可以根据堆叠方式而异。目前，它们在没有人工智能人工干预的情况下无法做出决策。公司正作为可靠的预言机（Oracles，可靠的信息源）出现，将现实世界的实过滤到区块链中，而区块链使这些信息变得不可篡改。


    任何人都可以在没有中央机构授权的情况下创建自己的智能合约。这些合约在不需要太多人工干预的情况下执行，并存储在区块链技术上，这种技术提供了一种持久性感。这些是能够为双方之间的信息交换更多自主性的三个主要属性。建立一个预先约定的、编码到区块链中并在采取某些操作时自动执行的合同，是不仅提高我们个人或公司自主性，而且将冗余资源转向更具影响力的工作的一步。


    ## 多方交易（等一下，我发现我的思维过程中有一处拼写错误，让我重新格式化）


    ### 多方交易


    在传统的中心化账本系统中，准确性依赖于可以更改中心化账本细节的中间介。源自账本的数据可能是孤岛且被误用的。分布式去中心化账本不依赖于操纵数据的中间介。数据是安全且防篡改的。


    在目前的交易生态系统中，总有一个第三方协助连接发送者和接收者。这一直是从点 A 移动物品到点 B 最高效的方式。但有了第三方建立连接，就需要信任他们能够以高效、经济且有效的方式送达任何内容。这种信任容易受到人为流程错误的影响。区块链可以实现从许多流程中移除中间介。目前正在移除的中间介有一长名单，例如：


    *   能源分销商

    *   支付网络（Visa 和 Mastercard）

    *   顶层平台和内容分发商（YouTube、Facebook、Instagram 等）

    *   中央交易所（NYSE、NASDAQ、NSE、LSE 等）

    *   云数据库提供商（AWS、Azure 等）


    其中一个例子是跨境支付。在从一个国家汇款到另一个国家时，交易最终会在 7 到 10 个不同的检查银行停靠（买家 – 买家银行 – A 国联邦银行 – A 国代理行
    – B 国代理行 – B 国联邦银行 – 卖家银行 – 卖家）。这种不断的停留延迟了资金流动，使其移动更加昂贵（因为每家银行都会收取一小笔费用），并且可靠性降低（检查点的数量增加导致恶意攻击增加）。这种类型的交易严重依赖第三方来促进资金流动。现在，如果我们用区块链替换这个生态系统，信任将通过共识机制建立。这将激励所有参与者在整个网络中帮助保护和验证交易。通过这种内置的“无信任”信任，我们可以移除交易中不提供额外价值的多个中间介，从而加速过程，优化交易成本，并使过程更高效。


    ## 双花费


    比特币并不是创建数字货币的首次尝试，它是第一个能够解决“双花费”这一长期问题的尝试。双花费攻击是一种通过更改区块链网络并插入特殊的区块来允许用户重新获得加密货币的攻击，导致加密货币被使用多次。


    例如，爱丽同时欠鲍布和卡罗尔（Carol）各 5 美元。爱丽的总债务额为 10 美元。假设爱丽目前只有 5 美元。如果爱丽的交易被记录在两个独立的账本上，可能出现一个账本显示她付给了鲍布
    5 美元，而另一个账本显示她付给了卡罗尔 5 美元。将无法判断谁到底收了钱。这就是双花费问题。因此，任何财务账本必须防止爱丽重复花费她的 5 美元。


    数字资产特别容易受到双花费问题的影响，因为被设计为易于复制和分发。例如，你用手机拍了一张照片，可以很容易将其一份发布到 Facebook，另一份发布到 Instagram，通过
    WhatsApp 发给朋友，并通过电子邮件发送给父母。因此，我们看到数字资产易于复制和分发。然而，数字货币不应该易于复制和分发。正是克服这一技术挑战导致了比特币之前的许多失败尝试，如
    Digicash、Hashcash 等。


    比特币技术通过两个内在概念解决了这些问题


    1.  区块链网络允许使用易于获取的应用程序在整个网络中验证并广播交易。当交易发生时，网络节点验证这些交易，将其添加到自己的账本副本中，并将这些账本更新广播到其他节点。一旦这些交易被网络接受，它们就变成了一个区块。


    2.  使用工作量证明协议，这些区块被添加到区块链，并迅速发布到所有节点，无需中央监督。这使得网络能够确定特定的比特币何时被花费，这是防止双花费所需要的。


    这两个概念使得任何接入互联网的人都可以加入比特币网络，独立验证和审计交易历史，并通过工作量证明挖掘比特币。


    ## 加密货币


    加密货币是一种构建在区块链上的可交易数字资产或数字形式的货币。

