  trans: "\n\n以太坊矿工通过执行 `EVM` 代码并寻找挖矿难题的解决方案来竞争性地创建区块。由于 `PoW` 是一种竞争机制，只有一个矿工能够将区块添加到以太坊网络，并获得区块奖励。\n\
    \n每个以太坊节点作为其区块验证过程的一部分运行 `EVM`。合约代码由 `EVM` 执行。这使得合约能够永久地存在于区块链上。\n\n由于 `EVM` 是一种低级字节码语言，我们可以将复杂的智能合约代码编译成以\
    \ `EVM` 代码形式存在的简单机器可理解的指令，网络中的所有节点都可以以相同的确定性方式执行这些指令，并达成共识。\n\n此外，每个 `EVM OPCODE`\
    \ 都需要 `gas` 才能执行，从而防止了无限循环拒绝服务攻击——即攻击者将以太坊网络中的计算机困在无限循环中，从而导致它们无法执行更有意义的合约。\n\n\
    一旦节点对网络状态达成共识，`EVM` 上的代码执行就会改变状态。\n\n## 以太坊应用与用例\n\n总而言之，以太坊之上的应用分为三类：\n\n* 第一类是金融应用，为用户提供了更强大的方式来使用他们的资金管理和签署合约。这包括子货币、金融衍生品、对冲合约、储蓄钱包、遗嘱，最终甚至包括某些类全职雇用合约。\n\
    * 第二类是半金融应用，涉及资金，但所做的活动也具有很强的非货币属性；一个完美的例子是计算问题解决方案的自动执行赏金机制。\n* 第三类是非金融应用，例如在线投票和去中心化治理。\n\
    \n以太坊的几个关键应用如下：\n\n### 代币系统\n\n链上代币系统有许多应用，从代表美元或黄金等资产的子货币到公司股票、代表智能财产的个人代币、安全不可伪造的优惠券，甚至是与传统价值完全无关、用于激励积分系统的代币系统。代币系统在以太坊上的实现异常地简单。\n\
    \n需要理解的关键点是，任何货币或代币系统本质上就是一个只有一个操作的数据库：`从 A 减去 X 单位并给 B X 单位`，且前提是：\n\n11. `A`\
    \ 在交易前至少拥有 `X` 单位，且\n12. 交易经过 `A` 的批准。\n\n实现代币系统只需要将此逻辑实现在合约中即可。在 `Serpent` 中实现代币系统的基础代码如下：\n\
    \n```python\ndef send(to, value):\n    if self.storage[msg.sender] >= value:\n\
    \        self.storage[msg.sender] = self.storage[msg.sender] - value\n       \
    \ self.storage[to] = self.storage[to] + value\n```\n\n这本质上是本文后续描述的“银行系统”状态转换函数的字面实现。需要额外添加几行代码来提供最初分配货币单位的步骤以及其他一些边界情况，理想情况下，还会添加一个函数让其他合约查询某个地址的余额。但仅此而已。\n\
    \n理论上，基于以太坊的代币系统可以可能包含另一个链上基于比特币的元货币所缺乏的重要功能：直接使用该货币支付交易费用的能力。其实现方式是：合约将维护一个 `Ether`\
    \ 余额，并将用于支付费用的 `Ether` 退还给发送者，同时通过收集收取的费用的内部货币单位并在持续的拍卖中将其重新转售来补充该余额。因此，用户需要用\
    \ `Ether` “激活”他们的账户，但一旦 `Ether` 在那里，它就可以重复使用，因为合约每次都会退还它。\n\n目前有两种基于以太坊的代币：\n\n\
    * `ERC-20 代币`：`ERC-20`（以太坊意见请求 20）代币标准允许以太坊区块链上存在同质代币。该标准由 Fabian Vogelsteller\
    \ 在 2015 年 11 月提出，实现了智能合约内代币的 API。该标准提供了包括从一个账户转移代币到另一个账户、获取账户当前余额以及获取网络可用代币总量的函数。正确实现\
    \ `ERC-20` 处理的智能合约被称为 `ERC-20 代币合约`，有助于跟踪以太坊上创建的代币。许多加密货币作为 `ERC-20` 代币发行并通过首次代币发行进行。发送\
    \ `ERC-20` 代币的费用必须用 `Ether` 支付。\n* `非同质化代币 (NFTs)`：以太坊允许创建独特且不可分割的代币，称为非同质化代币\
    \ (`NFTs`)。由于这类代币是唯一的，它们被用于代表收藏品、数字艺术、体育纪念品、虚拟房地产和游戏中的物品等。区块链基础虚拟世界中的土地、建筑和化身也可以作为\
    \ `NFTs` 进行买卖，有时价格高达数十万美元。第一个 NFT 项目 `Etheria`（一个由可交易和自定义的六边形砖组成的 3D 地图）于 2015\
    \ 年 10 月部署到网络上，并在当年 11 月的 `DEVCON1` 上进行了现场演示。2021 年，佳士比将一张由 Beeple 创作的带有 NFT 的数字图像以\
    \ 6930 万美元售出，使其成为当时按拍卖价格计算的第三位最有价值在世艺术家。\n\n### 金融衍生品与稳定价值货币\n\n金融衍生品是“智能合约”最常见的应用，也是代码实现最简单的应用之一。实现金融合约的主要挑战在于，大多数金融合约需要引用外部价格报价器；例如，一个非常有价值的应用是对冲\
    \ `Ether` 相对于美元波动的智能合约，但实现这一点需要合约知道 `ETH/USD` 的值。实现这一点最简单的方法是通过由特定方（例如 `NASDAQ`）维护的“数据源”合约，设计使其具有根据需要更新合约的能力，并提供接口允许其他合约向该合约发送消息并获取价格响应。\n\
    \n在这些关键要素的基础上，对冲合约看起来如下：\n\n1. 等待 `A` 输入 1000 个 `Ether`。\n2. 等待 `B` 输入 1000 个\
    \ `Ether`。\n3. 通过查询数据源合约记录 1000 个 `Ether` 的美元价值到存储，假设为 `$ x`。\n4. 30 天后，允许 `A`\
    \ 或 `B` “重新激活”合约，将价值 `$x` 的以发送给 `A`，并将剩余发送给 `B`。\n\n此类合约在加密货币领域具有巨大的潜力。\n\n加密货币被认为的主要问题之一是其波动性；虽然许多用户和商户可能希望拥有加密资产的安全性和便利性，但他们并不愿意面临一天内损失（例如）23%\
    \ 资金价值的前景。最常提出的解决方案是发行方支持的资产；即发行方创建一种子货币，他们拥有发行和撤销单位的权利，并向提供一个单位特定底层资产（如黄金、美元）的人提供一个单位货币。发行方随后承诺向寄回一个单位加密资产的人提供一个单位底层资产。但在实践中，发行方并不总是值得信赖的，在某些情况下，银行基础设施太薄弱或过于敌对，导致此类服务无法存在。\n\
    \n"
- fmt: "\nFinancial derivatives provide an alternative. Here, instead of a single\
    \ issuer providing the funds to back up an asset, a decentralized market of speculators,\
    \ betting that the price of a cryptographic reference asset (eg. `ETH`) will go\
    \ up, plays that role. Unlike issuers, speculators have no option to default on\
    \ their side of the bargain because the hedging contract holds their funds in\
    \ escrow. Note that this approach is not fully decentralized, because a trusted\
    \ source is still needed to provide the price ticker, although arguably even still\
    \ this is a massive improvement in terms of reducing infrastructure requirements\
    \ as well as reducing the potential for fraud.\n\n## Multi-signature\n\nWe can\
    \ leverage the Ethereum’s built-in authentication protocol to build a multi party\
    \ authentication wallet. This functionality allows us to have an `m` of `n` signature\
    \ scheme, in which `m` out of the total `n` owners of the wallet are required\
    \ to sign off on every transaction. Even though the logic is fairly easy, the\
    \ `Solidity` implementation is pretty complex. \n\n## Decentralized finance (DeFi)\n\
    \nDecentralized finance (`DeFi`) is a use case of `Ethereum`. It offers traditional\
    \ financial instruments in a decentralized architecture, outside of companies'\
    \ and governments' control, such as money market funds which let users earn interest.\
    \ Decentralized finance applications are typically accessed through a Web3-enabled\
    \ browser extension or application, such as `MetaMask`, which allows users to\
    \ directly interact with the `Ethereum` blockchain through a website. Many of\
    \ these `DApps` can connect and work together to create complex financial services.\n\
    \nAdditionally, through a process called \"wrapping\", certain `DeFi` protocols\
    \ allow synthetic versions of various assets (like `Bitcoin`, `Gold` and `Oil`)\
    \ to become available and tradeable on `Ethereum` and also compatible with all\
    \ of `Ethereum`'s major wallets and applications.\n\nExamples of DeFi platforms\
    \ include `MakerDAO` and `Compound`. `Uniswap`, a decentralized exchange for tokens\
    \ on `Ethereum` grew from $20 million in liquidity to $2.9 billion in 2020. As\
    \ of October 2020, over $11 billion was invested in various DeFi protocols.\n\n\
    ## Identity and Reputation Systems\n\nThe earliest alternative cryptocurrency\
    \ of all, `Namecoin`, attempted to use a `Bitcoin`-like blockchain to provide\
    \ a name registration system, where users can register their names in a public\
    \ database alongside other data. \n\nThe major cited use case is for a `DNS` system,\
    \ mapping domain names like \"bitcoin.org\" to an IP address. Other use cases\
    \ include email authentication and potentially more advanced reputation systems.\
    \ Here is the basic contract to provide a `Namecoin`-like name registration system\
    \ on `Ethereum`:\n\n```python\ndef register(name, value):\n    if !self.storage[name]:\n\
    \        self.storage[name] = value\n```\n\nThe contract is very simple – A database\
    \ inside the `Ethereum` network that can be added to, but not modified or removed\
    \ from. Anyone can register a name with some value, and that registration then\
    \ sticks forever. A more sophisticated name registration contract will also have\
    \ a \"function clause\" allowing other contracts to query it, as well as a mechanism\
    \ for the \"owner\" (ie. the first registerer) of a name to change the data or\
    \ transfer ownership. One can even add reputation and web-of-trust functionality\
    \ on top.\n\n## Decentralized Autonomous Organizations (DAO)\n\nThe general concept\
    \ of a \"decentralized autonomous organization\" is that of a virtual entity that\
    \ has a certain set of members or shareholders which, perhaps with a 67% majority,\
    \ have the right to spend the entity's funds. The logic is fairly easy, the `Solidity`\
    \ implementation is pretty complex. \n\nA `DAO` allows members to collectively\
    \ vote on how to allocate its funds. This provides a decentralized way to manage\
    \ resources and make decisions without the need for a central authority. The general\
    \ outline for a `DAO` is as follows.\n"
