- fmt: "\nThe credentials necessary to spend Bitcoins can be stored offline in several\
    \ different ways, from specialized hardware wallets to simple paper printouts\
    \ of the private key.\n\n- **Paper wallets** – A paper wallet is created with\
    \ a keypair generated on a computer with no internet connection; the private key\
    \ is written or printed onto the paper and then erased from the computer. This\
    \ paper wallet can then be stored in a safe physical location for later retrieval.\
    \ Paper wallets can be generated on websites like `bitcoinpaperwallet.com` /bitaddress.org`.\
    \ These websites require to download the entire website and run the program locally\
    \ after disconnecting the computer from the network. They also warn of smart printers\
    \ and operating systems that might cache the file or be compromised. Physical\
    \ wallets can also take the form of metal token coins with a private key accessible\
    \ under a security hologram in a recess struck on the reverse side. The security\
    \ hologram self-destructs when removed from the token, showing that the private\
    \ key has been accessed.\n\n- **Hardware wallets** – A hardware wallet is a computer\
    \ peripheral that signs transactions as requested by the user. The hardware wallet\
    \ store private keys and carry out signing and encryption in a trusted execution\
    \ environment that run separately from the computer and never touches the internet.\
    \ Hence, they do not share any sensitive information with the host computer except\
    \ already digitally signed transactions. Because hardware wallets never expose\
    \ their private keys, even computers that may be compromised by malware do not\
    \ have a vector to access or steal them. The user sets a passcode when setting\
    \ up a hardware wallet. As hardware wallets are tamper-resistant, the passcode\
    \ will be needed to extract any money. Some example of hardware wallets are `Ledger`,\
    \ `Trezor`, `Case`, and `Keep Key`, which are devices that plug into the computer\
    \ via `USB` to digitally sign transactions.\n\nFor enhanced security, to further\
    \ lessen the probability of someone finding your private key, key stretching can\
    \ be employed, which hashes the wallet several times. Not only the attacker would\
    \ have to guess the initial passcode, he will have to guess how many times it\
    \ has been hashed, making it exponentially difficult to guess the private key.\n\
    \n## Lightweight Wallet Mechanics\n\nIn case of lightweight or 3rd party clients,\
    \ you do not need to download the entire Bitcoin blockchain. You can leverage\
    \ Simple Payment Verification (`SPV`) method to verify if transactions are included\
    \ in a block by simply downloading the block headers of each block instead of\
    \ the entire block. This is very useful for clients that are constrained by storage\
    \ capacity as they do not need to store the full blockchain.\n\nOne assumption\
    \ you need to make while using `SPV` is that incoming block headers are not from\
    \ a false chain. In case the block headers are fake or from a false chain, then\
    \ the transaction you see as valid may not be so, and someone can double spend\
    \ you. However, as long as you are connected to multiple nodes, the probability\
    \ of each node being controlled by a malicious entity is significantly low.\n\n\
    ## Wallet Backups\n\n- **JBOK Wallets** – In case you have multiple key, how do\
    \ you manage them, especially if you make frequent transactions on Bitcoin? The\
    \ traditional way to keep track of the keys is through `JBOK` (Just a Bunch of\
    \ Keys) wallets. A `JBOK` wallet is a form of Bitcoin wallet which randomly generates\
    \ new, unrelated keys as needed for the user. `JBOK` wallets were the earlier\
    \ wallets that were introduced on the bitcoin blockchain, but proved cumbersome\
    \ to use as the users would have to store every key pair.\n\n- **Hierarchical\
    \ Deterministic (HD) wallet** – A Hierarchical Deterministic (`HD`) wallet is\
    \ the term used to describe a wallet which uses a seed to derive public and private\
    \ keys. `HD` wallets can be backed up by storing a single seed of `64 bytes`.\
    \ The term hierarchical describes the tree-like structure of the keys: the wallet\
    \ seed derives a single master key, which is used to derive child keys, each which\
    \ can derive their own children. Each child key in the tree can be described by\
    \ its derivation path, which contains information about a key’s depth and index—where\
    \ it resides within the tree structure. The derivation path tells a wallet how\
    \ to derive a specific key.\n\n## Bitcoin Mining\n\nBitcoin Mining is a record-keeping\
    \ service done using computer processing power. Miners keep the blockchain consistent,\
    \ complete, and unalterable by repeatedly grouping newly broadcast transactions\
    \ into a block, which is then broadcast to the network and verified by recipient\
    \ nodes. Each block contains a `SHA-256` cryptographic hash of the previous block,\
    \ thus linking it to the previous block and giving the blockchain its name.\n\n\
    The steps of Bitcoin mining are as follows:\n\n1. **Step 0**: The preliminary\
    \ step is downloading the entire Bitcoin blockchain. This allows the miner to\
    \ know the Bitcoin history such that he can verify future transactions. This is\
    \ known as `Step 0` for two reasons:\n    - It only needs to be done once. Once\
    \ a miner has a full Bitcoin blockchain history, he doesn’t need to download it\
    \ again. He only needs to track the incoming blocks from other miners.\n    -\
    \ Moreover, the miner with `SPV` node only needs to store the block headers and\
    \ request information from full nodes for verifying transactions. Meaning this\
    \ step is optional.\n\n2. **Step 1**: This step is to verify the valid transactions\
    \ in the network. Bitcoin users constantly send new transactions to the Bitcoin\
    \ network, and it is the duty of miners to validate all these transactions.\n\
    As miners receive transactions, they store them in a `mempool` where `mem` means\
    \ memory and `pool` means supply of transactions. All pending transactions are\
    \ stored in `mempool` before making there way into a block. Miners then choose\
    \ which transaction to validate, based on their transaction fees, and verify the\
    \ validity of transactions by running the unlocking script. This script successfully\
    \ unlocks the previous Bitcoins, and the transaction goes through.\n\n3. **Step\
    \ 2**: After validating the transaction, it is time to generate a block with these\
    \ transactions. There are several pieces of information needed to construct a\
    \ block; like `Merkle Root` which is generated from the list of transactions,\
    \ `hash`, `time-stamp`, `version`, and `target address`.\n    ```\n    (Images/image0253.gif)\n\
    \    ```\n    - **Step 3**: This step entails the Proof-of-Work (`PoW`) by finding\
    \ a number called `nonce` (number used once) that solves the partial preimage\
    \ hash puzzle. This `nonce` makes the hash of the block header less than some\
    \ target value (when the block content is hashed along with the `nonce`, the result\
    \ is numerically smaller than the network's difficulty target).\n    ```\n   \
    \ (Images/image0254.gif)\n    ```\n    By finding the `nonce`, the miner would\
    \ have translated the energy burned in the computation directly into the voting\
    \ power of the `PoW` consensus protocol.\n\n    - **Step 4**: After finding the\
    \ nonce, the miner broadcast his block as soon as possible to the entire network,\
    \ if any competitor hasn’t yet broadcasted their block, and such that the other\
    \ miners are aware that a new block has been found. These miners validate the\
    \ block themselves before accepting it to their own blockchain, and then broadcast\
    \ it again. By broadcasting this block, other miners abandon their previous block\
    \ and start to mine on this new longest chain.\n    ```\n    (Images/image0255.gif)\n\
    \    ```\n    Broadcasting of block by all modes; Source – CB Insights\n\n   \
    \ - **Step 5**: Once the `P-W` is verified by the network, the block getting appended\
    \ to the longest chain. Once this happens, the miner receives the block reward,\
    \ represented by the coinbase transaction and the transaction fees. All the transaction\
    \ within that block are added to the transaction history, and the miner receiving\
    \ some Bitcoins as a profit.\n"
  raw: "The credentials necessary to spend Bitcoins can be stored offline in several\
    \ different ways, from specialized hardware wallets to simple paper printouts\
    \ of the private key. \n\n*   Paper wallets – A paper wallet is created with a\
    \ keypair generated on a computer with no internet connection; the private key\
    \ is written or printed onto the paper and then erased from the computer. This\
    \ paper wallet can then be stored in a safe physical location for later retrieval.\
    \ Paper wallets can be generated on websites like bitcoinpaperwallet.com / bitaddress.org.\
    \ These websites require to download the entire website and run the program locally\
    \ after disconnecting the computer from the network. They also warn of smart printers\
    \ and operating systems that might cache the file or be compromised. Physical\
    \ wallets can also take the form of metal token coins with a private key accessible\
    \ under a security hologram in a recess struck on the reverse side. The security\
    \ hologram self-destructs when removed from the token, showing that the private\
    \ key has been accessed. \n\n*   Hardware wallets – A hardware wallet is a computer\
    \ peripheral that signs transactions as requested by the user. The hardware wallet\
    \ store private keys and carry out signing and encryption in a trusted execution\
    \ environment that run separately from the computer and never touches the internet.\
    \ Hence, they do not share any sensitive information with the host computer except\
    \ already digitally signed transactions. Because hardware wallets never expose\
    \ their private keys, even computers that may be compromised by malware do not\
    \ have a vector to access or steal them. The user sets a passcode when setting\
    \ up a hardware wallet. As hardware wallets are tamper-resistant, the passcode\
    \ will be needed to extract any money. Some example of hardware wallets are Ledger,\
    \ Trezor, Case, and Keep Key, which are devices that plug into the computer via\
    \ USB to digitally sign transactions. \n\nFor enhanced security, to further lessen\
    \ the probability of someone finding your private key, key stretching can be employed,\
    \ which hashes the wallet several times. Not only the attacker would have to guess\
    \ the initial passcode, he will have to guess how many times it has been hashed,\
    \ making it exponentially difficult to guess the private key.\n\nLightweight Wallet\
    \ Mechanics \n\nIn case of lightweight or 3rd party clients, you do not need to\
    \ download the entire Bitcoin blockchain. You can leverage Simple Payment Verification\
    \ (SPV) method to verify if transactions are included in a block by simply downloading\
    \ the block headers of each block instead of the entire block. This is very useful\
    \ for clients that are constrained by storage capacity as they do not need to\
    \ store the full blockchain. \n\nOne assumption you need to make while using SPV\
    \ is that incoming block headers are not from a false chain. In case the block\
    \ headers are fake or from a false chain, then the transaction you see as valid\
    \ may not be so, and someone can double spend you. However, as long as you are\
    \ connected to multiple nodes, the probability of each node being controlled by\
    \ a malicious entity is significantly low.\n\nWallet Backups\n\n*   JBOK Wallets\
    \ – In case you have multiple key, how do you manage them, especially if you make\
    \ frequent transactions on Bitcoin? The traditional way to keep track of the keys\
    \ is through JBOK (Just a Bunch of Keys) wallets. A JBOK wallet is a form of Bitcoin\
    \ wallet which randomly generates new, unrelated keys as needed for the user.\
    \ JBOK wallets were the earlier wallets that were introduced on the bitcoin blockchain,\
    \ but proved cumbersome to use as the users would have to store every key pair.\n\
    \n*   Hierarchical Deterministic (HD) wallet – A Hierarchical Deterministic (HD)\
    \ wallet is the term used to describe a wallet which uses a seed to derive public\
    \ and private keys. HD wallets can be backed up by storing a single seed of 64\
    \ bytes. The term hierarchical describes the tree-like structure of the keys:\
    \ the wallet seed derives a single master key, which is used to derive child keys,\
    \ each which can derive their own children. Each child key in the tree can be\
    \ described by its derivation path, which contains information about a key’s depth\
    \ and index—where it resides within the tree structure. The derivation path tells\
    \ a wallet how to derive a specific key.\n\n## Bitcoin Mining\n\nBitcoin Mining\
    \ is a record-keeping service done using computer processing power. Miners keep\
    \ the blockchain consistent, complete, and unalterable by repeatedly grouping\
    \ newly broadcast transactions into a block, which is then broadcast to the network\
    \ and verified by recipient nodes. Each block contains a SHA-256 cryptographic\
    \ hash of the previous block, thus linking it to the previous block and giving\
    \ the blockchain its name. \n\nThe steps of Bitcoin mining are as follows:\n\n\
    1.  Step 0: The preliminary step is downloading the entire Bitcoin blockchain.\
    \ This allows the miner to know the Bitcoin history such that he can verify future\
    \ transactions. \n\nThis is known as Step 0 for two reasons\n\n*   It only needs\
    \ to be done once. Once a miner has a full Bitcoin blockchain history, he doesn’t\
    \ need to download it again. He only needs to track the incoming blocks from other\
    \ miners. \n\n*   Moreover, the miner with SPV node only needs to store the block\
    \ headers and request information from full nodes for verifying transactions.\
    \ Meaning this step is optional.\n\n2.  Step 1 – This step is to verify the valid\
    \ transactions in the network. Bitcoin users constantly send new transactions\
    \ to the Bitcoin network, and it is the duty of miners to validate all these transactions.\
    \ \n\nAs miners receive transactions, they store them in a “mempool” where “mem”\
    \ means memory and “pool” means supply of transactions. All pending transactions\
    \ are stored in mempool before making there way into a block. Miners then choose\
    \ which transaction to validate, based on their transaction fees, and verify the\
    \ validity of transactions by running the unlocking script. This script successfully\
    \ unlocks the previous Bitcoins, and the transaction goes through.\n\n3.  Step\
    \ 2 – After validating the transaction, it is time to generate a block with these\
    \ transactions. There are several pieces of information needed to construct a\
    \ block; like Merkle Root which is generated from the list of transactions, hash,\
    \ time-stamp, version, and target address.\n\n![](Images/image00253.gif)\n\n*\
    \   Step 3 – This step entails the Proof-of-Work (PoW) by finding a number called\
    \ a nonce (number used once) that solves the partial preimage hash puzzle. This\
    \ nonce makes the hash of the block header less than some target value (when the\
    \ block content is hashed along with the nonce, the result is numerically smaller\
    \ than the network's difficulty target).\n\n![](Images/image00254.gif)\n\nBy finding\
    \ the nonce, the miner would have translated the energy burned in the computation\
    \ directly into the voting power of the P-o-W consensus protocol. \n\n*   Step\
    \ 4 – After finding the nonce, the miner broadcast his block as soon as possible\
    \ to the entire network, if any competitor hasn’t yet broadcasted their block,\
    \ and such that the other miners are aware that a new block has been found. These\
    \ miners validate the block themselves before accepting it to their own blockchain,\
    \ and then broadcast it again. By broadcasting this block, other miners abandon\
    \ their previous block and start to mine on this new longest chain.\n\n![](Images/image00255.gif)\n\
    \nBroadcasting of block by all modes; Source – CB Insights\n\n*   Step 5 – Once\
    \ the P-o-W is verified by the network, the block getting appended to the longest\
    \ chain. Once this happens, the miner receives the block reward, represented by\
    \ the coinbase transaction and the transaction fees. All the transaction within\
    \ that block are added to the transaction history, and the miner receiving some\
    \ Bitcoins as a profit."
