- fmt: "\nWyoming has enacted a total of 13 blockchain laws, making it the only US\
    \ state to provide a comprehensive, legal framework that enables blockchain technology\
    \ for both individuals and companies.\n\n# Social Impact Solutions\n\nThe blockchain\
    \ for social impact coalition (`BSIC`) is a not-for-profit organization that incubates,\
    \ develops, and collaborates on blockchain products and solutions that can address\
    \ social and environmental challenges across the United Nations Sustainable Development\
    \ Goals. The aim is to inspire, federate, and create bridges between NGOs, and\
    \ government agencies, foundations, impact investors, philanthropists, and technologists.\n\
    \nAccording to the “7 ways Blockchain can be used for Social Good” article by\
    \ Kayla Matthews, areas that are seeing blockchain social impact projects are:\n\
    \n* Philanthropy and remittances\n* Financial empowerment\n* Identity and land\
    \ rights\n* Governance and democracy\n* Supply chain and environmental protections\n\
    \n## Kiva\nMore that 1.7 billion people around the world are unbanked and cannot\
    \ access the financial services. `Kiva` is an international nonprofit organization,\
    \ founded in 2005 in San Francisco, with a mission to expand financial access\
    \ to help the underserved communities. `Kiva` accomplishes this by crowdfunding\
    \ loans and unlocking capital for the underserved, improving the quality and cost\
    \ of financial services, and addressing the underlying barriers to financial access\
    \ around the world. Through `Kiva`’s work, students can pay for education, women\
    \ can start businesses, farmers are able to invest in equipment, and families\
    \ can afford emergency care.\n\n## Rohingya Project\nThe mission of the `Rohingya\
    \ Project` is to create the foundation for a viable future for the stateless Rohingya\
    \ people by connecting them digitally with opportunities to learn, equip, and\
    \ empower themselves. Through the creation of a financial and social inclusion\
    \ platform, the Rohingyas who have been sidelined for years can be given access\
    \ to a wide range of virtual services including online education, digital identity,\
    \ and reward tokens. \n\nThe platform will tap into the potential of the Rohingya\
    \ community and other marginalized people and offer options to counter their exclusion\
    \ from the mainstream.\n\n# Platform Developer Solutions\n\n## ConsenSys\n`ConsesSys\
    \ Mesh` companies offer solutions to help build out the Ethereum ecosystem. `ConsenSys\
    \ Mesh` acts as an incubator for Ethereum based projects:\n\n* `Codefi` – Finance\
    \ and commerce blockchain applications\n* `Diligence` – Ethereum based smart contract\
    \ audits\n* `INFURA` – Manage scaling and performance issues\n* `Metamask` – Cryptocurrency\
    \ wallet application\n* `Quorum` – Open source blockchain platforms\n* `Truffle`\
    \ – Application builder\n\n## Hyperledger\n`Hyperledger` is an open source project\
    \ with blockchain to build solutions on, and has tools to support these blockchains.\
    \ We discussed about `Hyperledger Fabric` and `Hyperledger Sawtooth` in the earlier\
    \ chapter. Some other examples Hyperledger based platforms are, `Hyperledger Aries`,\
    \ `Hyperledger Transact`, `Hyperledger Ursa`, `Hyperledger Besu`, `Hyperledger\
    \ Iroha`, and `Hyperledger Indy`.\n\n## Daml\n`Daml` is a development framework\
    \ for creating systems of records that securely connect across business processes\
    \ and data boundaries while retaining privacy, guaranteeing data integrity, and\
    \ enforcing strict authorization. Allowing such systems to cross boundaries –\
    \ legal, regulatory, organizational, or other – enables them to for seamless economic\
    \ networks.\n\n* `Daml Connect` – It is a complete development and application\
    \ stack allowing you to build, integrate, deploy, and maintain full-stack multi\
    \ party solutions with a minimum of boilerplate code. \n* `Daml Drivers` – They\
    \ allow you to deploy your applications using distributed ledgers, blockchains,\
    \ or databases. Migration between ledger drivers without any code changes as the\
    \ business needs evolve. \n* `Daml Drivers` ... `Daml Hub` \n\n## SIMBA Chain\n\
    `SIMBA Chain` was founded in 2017. `SIMBA Chain` is a decentralized platform.\
    \ With the advent of at-home energy production and storage, many users are storing\
    \ energy surpluses at home without a way to ‘sell’ energy. `SIMBA Chain` provides\
    \ peer-to-peer energy trading, awarded by `Defense Research Projects Agency` (`DARPA`),\
    \ `Indiana Technology and Manufacturing` (`ITAM`), and `Center for Research` (`CRC`).\n\
    \n# End User Solutions\n\n## Identity\nIdentity management is vital for blockchain\
    \ operation. One solution is `Verifiable Organizations` (`VON`) project that enables\
    \ organizations – and the people running these organizations – to conduct business\
    \ online.\n\n## Marketplace\nMarketplace exist to shop renewable energies. `Power\
    \ Ledger` offers a peer-to-peer energy trading platform. It builds global energy\
    \ solutions to provide communities access to affordable electricity that is also\
    \ renewable.\n\n## Music and Films\nNow there are new ways for artists, producers,\
    \ and labels, to get paid on time, in full royalties going directly back to the\
    \ artists, via `Non Fungible Tokens` (`NFTs`). `NFTs` are typically held on the\
    \ `Ethereum` blockchain, although other blockchains support them as well.\n\n\
    ## Gaming\nThe days of video games being just a form of entertainment are long\
    \ gone. Most of the new video games have in-app purchases and loot box features\
    \ in them. With the use of `DeFi`, game developers can implement the newer incentive\
    \ or reward models with `DeFi` coins.\n"
