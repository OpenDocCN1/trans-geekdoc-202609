    \ change can be detected after commitment with the Merkle Root.\n\n![](Images/image00247.gif)\n\
    \nLet’s assume that Block 3 is changed, then its hash will also change. Because\
    \ of this the hash above will also change, propagating all the way up to the Merkle\
    \ Root. Hence, if any transaction is changed, then the corresponding Merkle Root\
    \ is also impacted.\n\nWe can validate any transaction with just one piece of\
    \ information at each level. For example, we can validate Block 1 with Hash 0.\
    \ This makes the network more and more efficient as the tree grows larger.\n\n\
    In case a Merkle Root somehow gets tampered, it changes the block header. This\
    \ is turn alters the next block’s ‘previous block hash’, which will impact all\
    \ the future block hashes as well. The rest of the network will reject the history\
    \ proposed by this blockchain because they will not agree.\n\nPartial Preimage\
    \ Hash Puzzle\n\nThe entities in the network need to prove that they have done\
    \ some work before they can submit a vote to the network. They have to design\
    \ a partial preimage hash puzzle for their computers to solve to prove that they\
    \ have done work. Partial preimage means a partial input. In Bitcoin, we are given\
    \ a part of the input, and we have to find the other part which produces some\
    \ partial output, meeting the condition that the hash of the block header needs\
    \ to be less than some target value. This is how Proof-of-Work (PoW) gets implemented\
    \ in Bitcoin. These hash puzzles need to have three characteristics:\n\n*   Computationally\
    \ difficult – Ensure that the puzzle cannot be easily solved\n\n*   Parameterizable\
    \ – The difficulty of the puzzle should be adjustable to ensure that it never\
    \ gets either too easy or too hard\n\n*   Easily verifiable – Ensure that the\
    \ computers in the network do not have to do too much work to validate the solution\
    \ of the puzzle\n\nDigital Signatures\n\nDigital signatures ensure that the current\
    \ transactions sent to the rest of the network are tamper proof as well. Digital\
    \ signatures authenticate identity of the user, as it was signed with a specific\
    \ private key, providing ownership of a public key to validate it.\n\nFor example,\
    \ suppose you want to send your friend a message. How can you make sure that it\
    \ is not tampered. So, before sending the message you sign it with your private\
    \ key, authenticating your identity. Then you send the signed message to your\
    \ friend. The message is the main payload and the digital signature is used to\
    \ prove that it was you who created the exact message. Your friend is able to\
    \ verify your signature with your public key. At any point, if this message is\
    \ tampered with, the digital signature would not remain valid anymore. This is\
    \ how digital signature make the message tamper proof.\n\nDigital signatures have\
    \ the following key properties:\n\n*   Message origin – Recipient is able to verify\
    \ that the original sender (owner of private key) has authorized the message\n\
    \n*   Non-repudiation – Original sender (owner of private key) cannot backtrack,\
    \ undo or nullify the signature, after sending the message\n\n*   Message integrity\
    \ – Message cannot be modified after sending"
