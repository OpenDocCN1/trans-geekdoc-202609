    像传统合约一样，智能合约包含了一组必须满足的条件/条款。区别在于，合约的执行和强制是通过精心设计的算法完成的，而不是通过法律。因此，智能合约允许不同、匿名双方之间进行受信任的交易和协议，而无需中央权威机构、法律系统或外部执行机制。


    智能合约最早由尼克·萨博（Nick Szabo）于 1994 年提出，他是一位美国计算机科学家，曾于 1998 年发明了一种名为“比特黄金”（Bit Gold）的虚拟货币，这比比特币的发明早了整整
    10 年。萨博将智能合约定义为执行合约条款的计算机化交易协议。他希望将电子交易方法（如 `POS` 销售点）的功能扩展到数字领域。在当时的论文中，他还提议了对合成资产（如衍生品和债券）进行合约执行。萨博写道：“这些新证券通过通过多种方式将证券（如债券）和衍生品（期权和期货）相结合而形成。由于对这些复杂期限结构进行了计算机化分析，现在可以将非常复杂的期限结构构建到标准化合约中，并以低廉的交易成本进行交易。”


    以太坊上的智能合约就像是以太坊网络内部的自主代理。当它们被交易触碰时会对外部世界做出反应，触发特定的函数。它们对内部 Ether 余额、内部合约状态以及永久存储具有直接控制权。它们通常有四个用途：


    *   它们可以用于存储和维护数据。这些数据代表对用户或其他合约有用的内容。例如，可以有一个智能合约定义新的代币货币，或某个组织的成员身份等。

    *   它们可以用于管理不互信任用户之间的合约或关系。它简单地在分布式的以太坊网络上运行普通合约。例如，你可以拥有管理财务合约、托管账户或保险保费的智能合约。

    *   智能合约可以被写为调用其他合约，将它们作为软件库使用，利用现有合约的功能。

    *   智能合约可以复杂的身份验证用例。例如，你可以使用智能合约定义“n”份之“m”多重签名。


    # 以太坊概述


    以太坊是一个用于运行智能合约的去中心化开源区块链平台。简而言之，它是一个分布在世界许多节点上的分布式计算机，执行人们输入到它的代码。由于这种架构，它可以运行不可阻挡的应用。在以太坊平台上的应用程序完全按照程序编写运行，没有任何宕机、审查、欺诈或第三方干预的可能性。形式上讲，以太坊被实现为一个分布式状态机，网络上的交易改变了系统的全局状态。以太坊网络中的节点跟踪并对全局系统状态达成共识，其中包含了关于谁拥有什么的数据。


    和比特币一样，以太坊是去信任的、不可篡改的、不可审查的、伪名的，并且没有单点故障。它支持图完备语言。


    以太坊的原生加密货币是 Ether (`ETH`)，它是以太坊生态系统价值的基础，在对齐激励方面也至关重要。在所有加密货币中，Ether 的市值仅次于比特币。


    # 以太坊历史


    以太坊最早由维塔里克·布特林（Vitalik Buterin）描述，他是滑铁卢大学的一名程序员，《比特币杂志》的联合创始人。他在 2013 年底的一份白皮书中提出的目标是构建去中心化应用。布特林认为，区块链技术需要一种更健壮的语言来进行应用开发，这种语言可以引导将现实资产（如股票和房地产）附加到区块链。他提议开发一个具有更健壮脚本语言的新平台——一种图完备协议，它最终将成为以太坊。


    以太坊于 2014 年 1 月在迈阿密举行的北美比特币会议上正式发布。该平台在 2014 年 7 月至 8 月之间进行了代币销售，并在预售的前 12 小时内以
    3700 个比特币的价格卖出了 740 万个 ether。


    在 18 个月内，开发了几个代号为以太坊的原型。在 2014 年到 2015 年，以太坊基金会开发了以太坊原型，其中“奥林匹克”（Olympic）网络是最后一个原型和公测版本。以太坊区块链于
    2015 年 7 月 30 日正式上线。


    以太坊网络中的节点跟踪并对全局系统状态达成共识，其中包含了关于谁拥有什么的数据。


    在 2014 年到 2015 年期间，以太坊网络的以太坊基金会开发了以太坊原型，其中“奥林匹克”（Olympic）网络是最后一个原型和公测版本。以太坊区块链于
    2015 年 7 月 30 日正式上线。


    在 2016 年，一个名为去中心化自治组织（DAO）的程序在以太坊上开发了一套智能合约并筹集了 1.5 亿美元。然而在 2016 年 7 月，一个未知的黑客利用代码中的漏洞窃取了约
    1.2 亿美元的 Ether。这一事件引发了加密社区的争论，即以太坊是否应该违背协议并撤销（回滚）被盗窃的资金，还是应该不予撤销并主张“代码即法律”。


    这导致网络分裂为两个区块链：撤销盗窃的分支目前被称为以太坊，而在原始链上继续的分支被称为以太坊经典（Ethereum Classic）。在反转之后，以太坊随后在
    2016 年第四季度进行了两次反转以应对其他攻击。


    2017 年 3 月，各种区块链初创公司、研究小组和财富 500 强企业宣布成立以太坊联盟（EEA），共有 30 个创始成员。以太坊平台开启了多次首次代币发行（ICO），在
    2017 年第三季度通过 150 个 `ICO` 筹集了约 13 亿美元。


    2017 年 12 月，加密货币开始引起更多主流关注，并导致千禧一代投资 Ether 的人数增加。他们不想错过“下一个比特币”，结果投资了 Ether，并在反馈循环中推高了其价格。2018
    年 1 月，以太坊是市值仅次于比特币的加密货币


    2021 年 3 月，维达公司宣布其开始使用以太坊结算交易。2021 年 4 月，摩根大通、瑞信和万事达宣布将向 ConsenSys 投资 6500 万美元，这是一家构建以太坊相关基础设施的软件开发公司。


    2021 年网络进行了两次升级。第一次是“柏林”（Berlin）升级，第二次是“伦敦”（London）升级。`伦敦` 升级引入了一种降低交易费用波动的机制。该机制导致每个区块中支付交易费用的部分
    Ether 被销毁而非给给矿工，从而降低了 Ether 的通胀率。


    截至 2022 年，Ether 是仅次于比特币的第二大加密货币，市值约为 4000 亿美元。


    '
- fmt: '

    Open-source development is currently underway for a major upgrade to Ethereum
    known as `Ethereum 2.0` or `Eth2`. The main purpose of the upgrade is to increase
    transaction throughput for the network from the current of about 15 transactions
    per second to up to tens of thousands of transactions per second, by splitting
    up the workload into many blockchains running in parallel (referred to as `sharding`)
    and then having them all share a common consensus `Proof-of-Stake` blockchain,
    so that to maliciously tamper with any singular chain would require one to tamper
    with the common consensus, which would cost the attacker far more than they could
    ever gain from an attack.


    Ethereum 2.0 is designed to be launched in three phases:


    - "Phase 0" also known as "The Beacon Chain" was launched on 1 December 2020 and
    created the `Beacon Chain`, a `Proof-of-Stake` (`PoS`) blockchain that will act
    as the central coordination and consensus hub of `Ethereum 2.0`.


    - "Phase 1" also known as "The Merge" will merge the `Beacon Chain` with the current
    Ethereum network, transitioning its consensus mechanism from `PoW` to `PoS`. It
    is expected to be released in the first half of 2022.


    - "Phase 2" also known as "Shard chains" will implement state execution in the
    shard chains with the current `Ethereum 1.0` chain expected to become one of the
    shards of `Ethereum 2.0`. `Shard chains` will spread the network''s load across
    64 new chains. It is expected to be released in 2022.


    ## Design Overview


    Ethereum is a permissionless, non-hierarchical network of computers (`nodes`)
    which build and come to consensus on an ever-growing series of "blocks" in the
    blockchain. Each block contains an identifier of the chain that must precede it
    if the block is to be considered valid. Whenever a node adds a block to its chain,
    it executes the transactions therein in their order, thereby altering the `ETH`
    balances and other storage values of Ethereum accounts. These balances and values,
    collectively known as the `state`, are maintained on the node''s computer separately
    from the blockchain, in a `Merkle tree`.


    Each node communicates with a relatively small subset of the network, known as
    its `peers`. Whenever a node wishes to include a new transaction in the blockchain,
    it sends the transaction to its `peers`, who then send it to their `peers`, and
    so on. In this way, it propagates throughout the network. Certain nodes, called
    `miners`, maintain a list of all these new transactions and use them to create
    new blocks, which they then send to the rest of the network. Whenever a node receives
    a block, it checks the validity of the block and of all the transactions therein
    and, if valid, adds it to its blockchain and executes all of said transactions.
    As the network is non-hierarchical, a node may receive competing blocks, which
    may form competing chains. The network comes to consensus on the blockchain by
    following the "longest-chain rule", which states that the chain with the most
    blocks at any given time is the canonical chain. This rule achieves consensus
    because miners do not want to expend their computational work trying to add blocks
    to a chain that will be abandoned by the network.


    ## Ether


    Ether (`ETH`) is the cryptocurrency generated by the Ethereum protocol as a reward
    to miners in a `Proof-of-Work` system for adding blocks to the blockchain. It
    is the only currency accepted in the payment of transaction fees, which also go
    to miners. The block reward together with the transaction fees provide the incentive.
    The denominations of Ether are:


    - `wei`

    - `gwei`

    - `kwei`

    - `ether`

    - `szabo`

    - `finney`

    - `robin`

    - `btc`

    - `bitcoin`

    - `ethereum`

    - `Nxt`

    - `0x`

    - `ECDSA`

    - `hash`

