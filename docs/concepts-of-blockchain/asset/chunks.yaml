    \ hand are centralized as they are run by single entities.\n\nThis problem can\
    \ be solved attempting to redesign the underlying hash puzzles. A puzzle should\
    \ be hard to solve but easy to verify. This difficulty should be adjusted to account\
    \ for the changes in the mining technology (e.g. – ASICs). A puzzle should also\
    \ be “progress free” meaning that finding a hash does not make it easier to find\
    \ the next hash. Lastly, the puzzle should be pseudo randomly generated.\n\nASIC\
    \ Resistance\n\nThe original idea of Bitcoin mining was “1 CPU 1 Vote” making\
    \ it truly decentralized. The rise of ASICs has diminished it, giving some people\
    \ more votes than other. \n\nASICs work because it is easy to create hardware\
    \ to compute a certain puzzle. They are computation bound. A way to solve the\
    \ problem of ASIC dominance is to make puzzles that not only rely on computation\
    \ speed, but also on memory, giving rise to the notion of memory-hard and memory-bound\
    \ problems. A memory-hard problem is the one that needs a large amount of requisite\
    \ money to solve. A memory-bound problem is the problem that scales based on the\
    \ amount of memory you have. These problems deter ASICs as optimizing computation\
    \ power is useless if memory is the limit agent.\n\nNew cryptocurrencies like\
    \ Dogecoin and Litecoin have implemented memory-bound hash function called Scrypt.\
    \ They use a partial hash-preimage puzzle like in Bitcoin, just with a different\
    \ hash function. Hence, Bitcoin ASICs cannot work for Dogecoin or Litcoin. \n\n\
    Scrypt has 2 main steps:\n\n1.  Fill a buffer with interdependent data\n\n2. \
    \ Access that data in a pseudo random way\n\nScrypt was originally designed to\
    \ secure passwords and make them hard to brute force, so a memory-bound type of\
    \ problem makes sense. A password-based key derivation function (KDF) is generally\
    \ designed to be computationally intensive, so that it takes a relatively long\
    \ time to compute. Legitimate users only need to perform the function once per\
    \ operation, and so the time required is negligible. However, a brute-force attack\
    \ would likely need to perform the operation billions of times, at which point\
    \ the time requirements become significant and, ideally, prohibitive. Previous\
    \ password-based KDFs have relatively low resource demands, meaning they do not\
    \ require elaborate hardware or very much memory to perform. This allows an attacker\
    \ with sufficient resources to launch a large-scale parallel attack by building\
    \ hundreds or even thousands of implementations of the algorithm in hardware and\
    \ having each search a different subset of the key space. This divides the amount\
    \ of time needed to complete a brute-force attack by the number of implementations\
    \ available, very possibly bringing it down to a reasonable time frame.\n\nThe\
    \ Scrypt function is designed to hinder such attempts by raising the resource\
    \ demands of the algorithm. Specifically, the algorithm is designed to use a large\
    \ amount of memory compared to other password-based KDFs, making the size and\
    \ the cost of a hardware implementation much more expensive, and therefore limiting\
    \ the amount of parallelism an attacker can use, for a given amount of financial\
    \ resources."
