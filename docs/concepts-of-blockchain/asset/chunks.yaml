    \ War I and continues even today. During this phase, cryptography evolved from\
    \ the ad hoc approaches to encryption to the more sophisticated art and science\
    \ of information security. The applicable technology involved either telephone\
    \ and telegraph communications or calculating machines such as the Brunsvigas,\
    \ Marchants, Facits, and Friedens (employing gears, sprockets, ratchets, pawls,\
    \ and cams).  \n\nDuring the first two years of World War I, code systems were\
    \ used for diplomatic communications, just as they had been for centuries, and\
    \ cipher systems were used almost exclusively for tactical communications, however\
    \ they lacked sophistication and security.\n\nThe communications needs’ of telegraphy\
    \ and radio and the maturing of mechanical and electromechanical technology came\
    \ together in the 1920s to bring about a major advance in crypto devices: the\
    \ development of rotor cipher machines. Although the concept of a rotor had been\
    \ anticipated in the older mechanical cipher disks, an American cryptographer\
    \ Edward H. Hebern, recognized in 1917, that by hardwiring a monoalphabetic substitution\
    \ in the connections from contacts on one side of an electrical disk (rotor) to\
    \ contacts on the other side, and then cascading a collection of such rotors,\
    \ polyalphabetic substitutions of almost arbitrary complexity could be realized.\
    \ A set of these rotors is usually arranged in a stack called a basket; the rotation\
    \ of each of the rotors in the stack causes the next one to rotate, much as the\
    \ wheels in an odometer advance 1/10 of a revolution for every full revolution\
    \ of its driving wheel. In operation, the rotors in the stack provide an electrical\
    \ path from contact to contact through all the rotors. In a straight-through rotor\
    \ system, closing the key contact on a typewriter-like keyboard sends a current\
    \ to one of the contacts on the end rotor. The current then passes through the\
    \ maze of interconnections defined by the remaining rotors in the stack and their\
    \ relative rotational positions to a point on the output end plate, where it is\
    \ connected to either a printer or an indicator, thereby outputting the ciphertext\
    \ letter equivalent to the input plaintext letter.\n\nStarting in 1921 and continuing\
    \ through the next decade, Hebern constructed a series of steadily improving rotor\
    \ machines. The 1920s were marked by a series of challenges by inventors of cipher\
    \ machines to national cryptologic services and by one service to another, resulting\
    \ in a steady improvement of both crypto machines and techniques for the analysis\
    \ of machine ciphers. At almost the same time that Hebern was developing the rotor\
    \ cipher machine in the United States, European engineers, notably Hugo A. Koch\
    \ of the Netherlands and Arthur Scherbius of Germany, independently discovered\
    \ the rotor concept and designed machines that became the precursors of the best-known\
    \ cipher machine in history, the ‘Enigma rotor machines’ used by the participants\
    \ in World War II. These machines could realize far more complex operations than\
    \ were feasible manually and, more importantly, they could encrypt and decrypt\
    \ faster and with less chance of error. \n\n![Enigma cipher machine of World War\
    \ IIThe German navy employed various versions of the Enigma cipher machine during\
    \ the war, including this four-rotor model.](Images/image00236.jpeg)\n\nEnigma\
    \ rotor machine; Source: https://www.britannica.com/topic/cryptology/\n\nThe greatest\
    \ triumphs in the history of cryptanalysis were the Polish and British solution\
    \ of the German Enigma ciphers, proposed by Alan Turing, whose output was code-named\
    \ ‘Ultra’. These developments played a major role in the Allies’ conduct of World\
    \ War II. \n\nIn the years immediately following World War II, the electronic\
    \ technology developed in support of radar and the recently discovered digital\
    \ computer was adapted to crypto machines. The first such devices were little\
    \ more than rotor machines in which rotors had been replaced by electronically\
    \ realized substitutions. The advantage of these electronic machines was speed\
    \ of operation; the disadvantages were the cryptanalytic weaknesses inherited\
    \ from mechanical rotor machines and the principle of cyclically shifting simple\
    \ substitutions for realizing more complex product substitutions. In fact, rotor\
    \ machines and electronic machines coexisted into the 1970s and early ’80s. \n\
    \nOne class of electronic devices that function similar to rotors is the Fibonacci\
    \ generator, named for the Fibonacci sequence of number theory. In the classical\
    \ Fibonacci sequence 1, 1, 2, 3, 5, 8, 13…each successive term, beginning with\
    \ 2, is the sum of the two terms to its left; i.e., Fi = Fi − 1 + Fi − 2. In an\
    \ n-stage Fibonacci generator the contents of an n-bit shift register are shifted\
    \ right one position at each step – the bit at the extreme right being shifted\
    \ out and lost – and the new left-hand bit is determined by the logical sum (1\
    \ + 1 = 1, 0 + 1 = 1 + 0 = 0 + 0 = 0; symbolized by ⊕) of bits occurring in prescribed\
    \ locations in the shift register before the shift was made. For example, for\
    \ n = 5 and xi = xi − 1 ⊕ xi − 4 ⊕ xi − 5 one obtains the 31-bit cycle\n\n0101110110001111100110100100001\n\
    \nwhich is the maximal-length sequence realizable with a five-stage generator.\
    \ The relevance of Fibonacci generators to cryptography is seen if the sequence\
    \ is read five bits at a time by successively shifting one bit position to the\
    \ left. This yields a scrambled ordering of the integers 1 through 31 that resembles\
    \ the scrambled ordering produced by rotors.\n\nThe cryptographic problem is that\
    \ the combining operation used to determine successive states in the sequence\
    \ is linear and hence easily invertible, even though the sequence can be 2n −\
    \ 1 bits in length before repeating. Another problem is how the key is to be used.\
    \ The obvious choice, i.e., simply to use the key to determine the number of steps\
    \ in the cycle from the plaintext n-tuple to the ciphertext n-tuple – Is cryptographically\
    \ insecure because a known plaintext cryptanalysis would quickly reveal the key.\
    \ \n\nTo avoid the problems associated with linearity, cryptographers have devised\
    \ a number of nonlinear feedback logics that possess such desirable properties\
    \ as diffusion of information (to spread the effects of small changes in the text)\
    \ and large-cycle structure (to prevent exhaustive search) but which are computationally\
    \ infeasible to invert working backward from the output sequence to the initial\
    \ state(s), even with very many pairs of matched plaintext/ciphertext. The nonlinear\
    \ feedback logic, used to determine the next bit in the sequence, can be employed\
    \ in much the same way as linear feedback logic. The complicating effect of the\
    \ key on the ciphertext in nonlinear logic, however, greatly contributes to the\
    \ difficulty faced by the cryptanalyst. Electronic cipher machines of this general\
    \ type were widely used, both commercially and by national cryptologic services.\n\
    \nThe Third Phase – Data Encryption and Advanced Encryption Standard\n\nThe third\
    \ phase, dating only to the last two decades of the 20th century, marked the most\
    \ radical change of all – the dramatic extension of cryptology to the information\
    \ age: digital signatures, authentication, shared or distributed capabilities\
    \ to exercise cryptologic functions, and so on. It is tempting to equate this\
    \ phase with the appearance of public-key cryptography, but that is too narrow\
    \ a view. Cryptology’s third phase was the inevitable consequence of having to\
    \ devise ways for electronic information to perform all the functions that had\
    \ historically been done with the aid of tangible documents."
