  trans: '

    链上流程被批评为“富人政治”，因为你持有的代币数量决定了你的投票权重，这意味着“巨鲸”用户通常对系统拥有不成比例的影响。批评者担心，富有的代币巨鲸会投票做出对他们最有利的区块链变更，而不是为了有利于区块链生态系统长期健康的事物进行投票。同样，尽管拥有投票选项，但许多代币持有者从未参与过治理。


    *   **链下治理**：链下治理可以看作是首先在社交层面进行的决策，随后由开发者积极地编码到协议中。例如，比特币开发者通过邮件列表共享他们的改进提议，然后对这些提案进行审查。


    比特币和以太坊以及大多数其他工作量证明区块链系统都利用了链下治理流程。这些区块链的核心利益相关者包括用户、节点运营者、开发者和矿工，他们之间都相互制衡。当所有利益相关者都达成一致并同步进行所有相关的更新和实施时，区块链生态系统的链下治理就能正常运行。如果无法达成共识，网络可能会发生分叉，即分裂为运行不同软件版本的两条链，而具有最高交易哈希算力的链被视为原始链的继任者。


    在链下模型中，协议开发通过会议、在线论坛和邮件列表等手段进行。你必须使用这些通道参与其中。对比特币区块大小争议的历史进行简单回顾，揭了决定是否进行变更的非正式链下过程，以及有时伴随这些过程的复杂性。区块大小争论是比特币社区内部关于是否增加比特币区块大小以容纳更多交易，从而扩展比特币交易处理能力的争端。在整个链下过程中，区块大小争论激烈进行，并跨越各种链下平台和活动。多年来，协议反复达成又破裂，召开了多次会议进行面对面讨论，并威胁且最终执行了区块链分叉。比特币现金（Bitcoin
    Cash）是与主比特币区块链失去共识的最著名数字资产示例，它现在作为一个独立的、代码几乎相同的另一个区块链存在。关于比特币扩展的长期且低效的辩论揭示了链下治理的两个缺点：作为个人用户很难注册你的投入，以及变更可能需要很长时间才能实施。


    ## 区块链治理策略


    针对不同的区块链已经提出并实施了多种区块链治理策略。让我们根据 Demiro Massessi 在《简述区块链治理》文章中所讨论的，按照直接参与决策的人数从少到多的顺序对这些策略进行回顾：


    *   **终身仁慈独裁者**：区块链平台的原始创建者或首席开发者对所有决策拥有最终决定权。

    *   **核心开发团队**：由最活跃的开发者组成的团队决定哪些功能应该或不应该包含在区块链平台中。这种策略通常用于开源编程项目，用户可以提供或请求功能，但开发者对最终发布中应该或不应该包含的内容拥有最终决定权。

    *   **开放治理**：做出区块链治理决策的团队由区块链用户选择（代议民主）。某些区块链使用开放治理的方法来处理治理。

    *   **链上治理**：区块链如何运行的规则存储在链上的智能合约中，并内置了修改的能力和程序（直接民主）。链上治理是针对特定区块链的治理策略。在这种形式的区块链治理中，描述区块链应如何运行的规则存储在区块链本身中。这些规定通常实现为区块链上的智能合约，并内置了方法，允许用户根据其需求和区块链的需求来修改规则。


    ## 比特币治理


    比特币使用工作量证明（`PoW`）共识模型来管理其区块链的运行。但当需要进行更改时，这些更改是如何实现的？比特币社区由三个主要参与者组成：开发者、矿工和用户。这些参与者在意外情况发生时都没有做出紧急决策的能力。比特币使用链下治理模型，决策由开发者、矿工和用户进行平衡。开发者必须编写代码来更改区块链。如果没有矿工和用户的同意，开发者没有办法强制执行。矿工和用户必须选择采纳新的软件更改。


    当需要对比特币协议进行更改时，开发者会将提议的更改与其他协议开发者共享。改进共享可以是发送给 `bitcoin-dev` 邮件列表的电子邮件、正式白皮书，和/或比特币改进协议（`BIP`）的形式。将编写并测试将执行该更改的代码。如果开发者批准了提议和生成的代码，提议将在区块链上进行投票，由矿工决定是否实施该提议。这是通过硬分叉或软分叉实现的。


    该系统并非没有缺陷，从改变区块大小的 `SegWit` 改进协议就可以看出来。围绕区块链去中心化的愿景，通过实施 `SegWit` 更改（即区块链协议运行方式的变更），由一个中央机构负责执行该更改。对于社区的许多人来说，这一决定违背了区块链去中心化哲学的根本原则。结果是比特币网络分裂为两个独立的区块链：


    *   比特币 (`BTC`) – 原始的比特币区块链

    *   比特币现金 (`BCH`) – 从比特币 Core 提议的硬分叉，建议增加交易区块的最大大小。尽管早期取得了成功，比特币经典（Bitcoin Classic）未能被比特币社区广泛采用，并最终没有实现。


    ## 以太坊治理


    以太坊基于比特币代码，但包含一个用于执行智能合约的逻辑引擎。通过以太坊区块链网络连接计算机，计算力被汇在一起创建了以太坊虚拟机（`EVM`）。以太坊不仅是一个具有智能合约功能的运行区块链，还是一个用于构建新区块链的平台。


    与比特币一样，以太坊的三个主要参与者（开发者、矿工和用户）必须更新代码以改进其功能。以太坊改进提案（`EIP`）是指定以区块链潜在新功能的标准。`EIP`
    包含了提议更改的技术规范，并作为社区的“真理来源”。以太坊请求评论 `ERC-20` 引入了基于以太坊协议发行实用代币的标准。信标链（Beacon Chain）引入了权益证明（`PoS`）共识模型和“分片”概念——通过运行并行的侧链来缓解网络拥塞。柏林硬分叉和伦敦分叉是为了稳定支付给矿工的费用而进行的改进，使其不会随以太坊的价格而波动。

    '
- fmt: '

    Ethereum uses the benevolent dictator for life mode of blockchain governance.
    While input from users and the development team is welcome for Ethereum, the final
    authority on decisions regarding Ethereum rest on its founder, `Vitalik Buterin`.


    ## Hyperledger Governance


    Hyperledger was introduced as an open source blockchain project sanctioned by
    `Linux Foundation`. Spearheaded by `Brian Behlendorf`, its mission is to provide
    the community with the tools and education to foster distributed ledger technology
    on an enterprise level. Hyperledger frameworks use an `Open Governance` model
    to make technical decisions regarding the Hyperledger environment. The `Hyperledger
    Technical Steering Committee (TSC)` is the final authority for technical decisions
    in Hyperledger. Each year, the member of this committee are selected from Hyperledger’s
    active contributors and maintainers, who submit themselves as potential candidates
    for the fifteen slots, and these slots are filled based on voting by the same
    group of contributors and maintainers. This model is designed to allow those with
    an active role in the Hyperledger development community to have a say in how Hyperledger
    is governed.


    ## Corda Governance


    Corda is an open source blockchain project designed for business. Developed by
    `R3`, an enterprise blockchain software firm, in collaboration with over 200 technology
    and industry partners. The Corda platform was developed in 2017.


    Corda uses and `Open Governance` model to make technical decisions regarding its
    roadmap. The `Corda Governing Body` is selected to represent the interests of
    all users in Corda network.


    ## Identity of the Blockchain


    Here we are going to discuss identity on the blockchain. Let’s start by understanding
    why we even need to have an identity on the blockchain.


    Centralized systems can be coerced by other forms of authority to shut down their
    network.


    Let’s take `Napster` for example. `Napster` had a decentralized network architecture,
    but they maintained a centralized authority. Therefore, the central authority
    could be attacked and, by taking out the central authority, could effectively
    control `Napster`. This is because `Napster` relied on that mix of centralized
    control over a decentralized network. This impacted identity because you need
    an identity to control.


    Torrents on the other hand do not operate in the same fashion. They provide a
    decentralized network with a decentralized authority. This allows the nodes to
    manage identity differently. It is also the reason why torrents are still being
    used today, in spite of the entertainment industry’s best effort to stop it. Torrents
    remove the central authority.


    So, this brings the question “Why didn’t peer-to-peer networks like torrents attain
    the same level of acclaim as blockchain?” Because there is no guarantee that the
    nodes would do the right thing. Nobody could guarantee that the nodes would cooperate
    with each other.


    This leads to an extremely important question. How do you incentivize the nodes
    in the network to follow the rules? In a torrent system, anyone could download
    and share a file, but there is no real incentive for someone to be a good actor
    on the network. For example, what happens when people on the torrent network stop
    sharing a movie that occupies space on their computers? Now let’s replace ‘movie’
    in torrent network with ‘money’ in bank network. In such a scenario, the transactions
    would never be processed reliably. Further, because of anonymity, you would not
    be able to reward or punish the actors.


    Blockchain solved this problem using `crypto economics`, by incentivizing miners
    to create and maintain a decentralized self-contained network. This differed from
    earlier peer-to-peer networks as it offered economic incentives to the nodes that
    followed the rules, in the form of `cryptocurrency`. The nodes were also punished
    for tampering with the network.


    ## Key Cryptography and Identity


    Public key cryptography is how identity is managed on the blockchain. A user’s
    address on the blockchain is their public key. This has several useful properties.
    Users do not need to reveal their identity on the blockchain, but they can positively
    identify themselves, since determining their private key requires solving a ‘hard
    problem’.

    '
  raw: 'Ethereum uses the benevolent dictator for life mode of blockchain governance.
    While input from users and the development team is welcome for Ethereum, the final
    authority on decisions regarding Ethereum rest on its founder, Vitalik Buterin.


    Hyperledger Governance


    Hyperledger was introduced as an open source blockchain project sanctioned by
    Linux Foundation. Spearheaded by Brian Behlendorf, its mission is to provide the
    community with the tools and education to foster distributed ledger technology
    on an enterprise level. Hyperledger frameworks use an Open Governance model to
    make technical decisions regarding the Hyperledger environment. The Hyperledger
    Technical Steering Committee (TSC) is the final authority for technical decisions
    in Hyperledger. Each year, the member of this committee are selected from Hyperledger’s
    active contributors and maintainers, who submit themselves as potential candidates
    for the fifteen slots, and these slots are filled based on voting by the same
    group of contributors and maintainers. This model is designed to allow those with
    an active role in the Hyperledger development community to have a say in how Hyperledger
    is governed.


    Corda Governance


    Corda is an open source blockchain project designed for business. Developed by
    R3, an enterprise blockchain software firm, in collaboration with over 200 technology
    and industry partners. The Corda platform was developed in 2017.


    Corda uses and Open Governance model to make technical decisions regarding its
    roadmap. The Corda Governing Body is selected to represent the interests of all
    users in Corda network.


    ## Identity of the Blockchain


    Here we are going to discuss identity on the blockchain. Let’s start by understanding
    why we even need to have an identity on the blockchain.


    Centralized systems can be coerced by other forms of authority to shut down their
    network.


    Let’s take Napster for example. Napster had a decentralized network architecture,
    but they maintained a centralized authority. Therefore, the central authority
    could be attacked and, by taking out the central authority, could effectively
    control Napster. This is because Napster relied on that mix of centralized control
    over a decentralized network. This impacted identity because you need an identity
    to control.


    Torrents on the other hand do not operate in the same fashion. They provide a
    decentralized network with a decentralized authority. This allows the nodes to
    manage identity differently. It is also the reason why torrents are still being
    used today, in spite of the entertainment industry’s best effort to stop it. Torrents
    remove the central authority.


    So, this brings the question “Why didn’t peer-to-peer networks like torrents attain
    the same level of acclaim as blockchain?” Because there is no guarantee that the
    nodes would do the right thing. Nobody could guarantee that the nodes would cooperate
    with each other.


    This leads to an extremely important question. How do you incentivize the nodes
    in the network to follow the rules? In a torrent system, anyone could download
    and share a file, but there is no real incentive for someone to be a good actor
    on the network. For example, what happens when people on the torrent network stop
    sharing a movie that occupies space on their computers? Now let’s replace ‘movie’
    in torrent network with ‘money’ in bank network. In such a scenario, the transactions
    would never be processed reliably. Further, because of anonymity, you would not
    be able to reward or punish the actors.


    Blockchain solved this problem using crypto economics, by incentivizing miners
    to create and maintain a decentralized self-contained network. This differed from
    earlier peer-to-peer networks as it offered economic incentives to the nodes that
    followed the rules, in the form of cryptocurrency. The nodes were also punished
    for tampering with the network or a past transaction or submitting a false transaction.
    This is why all public blockchains can operate without an authority. It is also
    the reason why cryptocurrency is mandatory for a public blockchain, and not for
    a private blockchain. Because you need a way to incentivize the actors on the
    network.


    How these rewards and punishments work on the blockchain, and how the blockchain
    can determine what is valid and what is invalid without a central authority?


    On the blockchain, identity is important. You have to be able to prove that your
    assets actually belong to you. Different blockchain use different systems for
    tracking identity and identity information, but most are based on the principles
    of public key cryptography.


    The security of a public key cryptography is based on hard math problems, wherein
    it is easy for someone to calculate it, but hard for someone to reverse that calculation.
    For example in multiplication, you can multiple any two numbers and get the right
    answer. Factoring on the other hand is hard. The best way to factor a large number
    is to try every possible factor until you find the right one. Some public key
    cryptography algorithms are designed so that breaking the algorithm requires factoring
    very large, usually prime numbers. Similarly, another hard math problem used in
    public key cryptography is based on exponents and logarithms. While exponents
    are easy since its essentially multiplication, logarithms are hard since they
    are essentially factoring. Most public key algorithms that use exponents use a
    type called modular exponents, which means that when they are done calculating
    the exponent, they divide the result by a publicly known value called the modulus
    and keep only the remainder.


    RSA is a commonly known public key cryptography algorithm. It is based on exponents
    and logarithms. RSA uses the power law of exponents, meaning that if you take
    a number and raise that number to a power, and then raise that result to another
    power, then you will get the same result as if you simply multiply the two exponents
    together and then raise the base to the result. An RSA user chooses two exponents
    such that any number raised to the product of the two exponents in a given modulus
    produces the original number. One of these is called a public key and is distributed
    freely, while the other is called a private key and is intended to be kept secret.
    If someone wants to send a private message to the user, they convert it to an
    integer using a publicly-known method. They raise it to the power of the user’s
    public exponent, and they send the result to the user. The user raises the received
    value to their private exponent producing the original message. RSA is secure
    because an attacker must be able to calculate a logarithm to determine the secret
    message. Since this takes guessing every possible value until the correct one
    is found, RSA is designed to make the number of potential value so large that
    finding the correct one is nearly close to impossible.


    These algorithms are designed such that an authorized user only has to do the
    ‘easy calculations’, while the attacker has to do the ‘hard calculations’ and
    the algorithm is designed to make solving these ‘hard calculations’ virtually
    impossible.


    Public key cryptography is how identity is managed on the blockchain. A user’s
    address on the blockchain is their public key. This has several useful properties.
    Users do not need to reveal their identity on the blockchain, but they can positively
    identify themselves, since determining their private key requires solving a ‘hard
    problem’.'
