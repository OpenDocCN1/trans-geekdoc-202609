    Bitcoin uses hash function `Security Hash Algorithm-256 (SHA-256)` to validate
    `PoW` protocols in its network. `SHA-256` was originally designed by US National
    Security Agency (`NSA`). `SHA-256` is a member of `SHA-2` family of cryptographic
    has functions. It takes an input size less that `2^64` bits and produces a fixed
    size output of `256` bits. Bitcoin, in certain instances uses `SHA-256d`, meaning
    that `SHA-256` is used twice in a row, once on the original message to be hashed
    and again on the output of the `1st` hash.


    This system uses partial hash inversions to prove that work was done, unlock a
    mining reward in Bitcoin, and as a good-will token to send an e-mail in `Hash-cash`.
    The sender is required to find a message whose hash value begins with a certain
    number of zero bits. The average work that the sender needs to perform to find
    a valid message is exponential in the number of zero bits required in the hash
    value, while the recipient can verify the validity of the message by executing
    a single hash function.


    ## Tamper Proofing


    Now that we know how cryptographic hash functions ensure the integrity of data,
    the next step is to apply this concept to ensure that data are only accessed by
    authorized users. For this we require a method of tracking transactions, to govern
    who has access to data and when. Automatic, tamper-proof logging of transactions
    is a method for enabling oversight of how the data is being used.


    Here is how a tamper evident block looks like conceptually.


    ![](Images/image00244.gif)


    It has four main components:


    * `Block Header` – This field represents the metadata necessary for understanding
    the components

    * `Block Size` – This field represents the size of the block

    * `Transaction Counter` – This field represents the number of transactions contained
    in the block

    * `Transactions` – This field represents the actual transaction data


    The tamper proofing of the block is achieved by the `Block Header`, through the
    application of the hash function.


    ## Block Header


    The `Block Header` refers to all metadata associated with any block. It consists
    of `6` fields as represented by the diagram below:


    ![](Images/image00245.gif)


    * `Previous Block Hash` – The previous block hash links to the previous block,
    or its parent block, effectively securing the chain. If any block is altered,
    then the block after will also be altered, and so all the blocks after that. Changing
    any part of the transaction history will change the entire future transactions
    after that.

    * `Merkle Root` – The `Merkle root` is made up of all of the hashed transaction
    hashes within the transaction.

    * `Nonce` – `Nonce` is the value that miners can alter to create different permutations
    and generate a correct hash in the sequence.

    * `Timestamp` – The timestamp is included so that everyone in the node will be
    able to see a permanent, encoded record of when a particular event occurred. It
    provides the date and time of day when the event occurred.

    * `Target` – The difficulty target is used, simply, to adjust how hard it is for
    the miners working to solve the block.

    * `Version` – The Bitcoin version number is useful in keeping track of changes
    and updates throughout the protocol.


    ## Merkle Tree and Merkle Root


    In computer science terminology, a tree is a data structure that has a root node
    and some children, which may also be the roots of other trees. A binary tree is
    a tree in which...


    ![](Images/image00246.gif)


    A `binary tree` is a tree in which...


    ![](Images/image00246.gif)


    `binary tree` is a tree in which is named after `Merkle`, who patented it in `1979`.


    The following conditions need to be true for `Merkle Tree`:


    * There is `at the bottom`

    * `of the hashes`


    The `binary tree` is a tree in which...


    ![](Images/image00247.gif)


    `binary tree` is a tree in which...


    `binary tree` is a tree in which...


