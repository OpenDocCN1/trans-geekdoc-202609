- fmt: '

    # Why it is one of the key Blockchain feature?


    * Zero Scams – As the system runs on algorithms, there is minimal chance for people
    to scam the users and utilize blockchain for their personal gains.

    * Minimize cyber attacks \- Transparency is just one of the many ways in which
    blockchain can benefit security vendors, regular end users, or even governments
    in the cybersecurity community. It’s not every day that we are presented with
    a technology that can guarantee the legitimacy of attacks and be made public at
    the same time.

    * Authenticity – Blockchain creates a transparent profile of every user. Every
    change on the blockchain is viewable and makes it more concrete. This nature of
    the system makes it a unique kind of system for every kind of person. And hackers
    will have a hard time cracking it.


    ## Consensus


    Blockchain ledgers are different from centralized ledgers because network participants
    have an agreement of the ledger. In order for the new blocks to be added, all
    the nodes need to agree that the transactions are accurate. As there is no central
    authority to validate the nodes, a new way to reach agreement or come to a ‘consensus’
    is required.


    This is enabled by the ‘consensus mechanism’. The architecture is cleverly designed,
    and consensus algorithms are at the core of this architecture. Every blockchain
    has a consensus to help the network make decisions. The ways in which each blockchain
    comes to a consensus is built into the protocol, and the rules built into the
    architecture that determine how the nodes will add ledger transactions.


    There are lots of different consensus algorithms for blockchains over the globe.
    Each has its own unique way to make decisions and perfecting previously introduces
    mistakes. The architecture creates a realm of fairness on the web. The bitcoin
    network uses a `Proof-of-Work` (`PoW`) consensus mechanism. `PoW` refers to the
    cryptographic mechanism that relies on participants being able to solve hard computational
    problems to have a higher stake in the network. `PoW` essentially is a distributed
    way for participants to determine the most valid block. Each participant attempts
    to find a `hash value`, which is a valid solution for the upcoming block of transactions.
    The winner who finds the `hash value` that meets the requirement, adds the proposal
    block to the chain, and obtains the reward.


    ### Why it is one of the key Blockchain feature?


    * Decision-making Process – In simple terms, the consensus is a decision-making
    process for the group of nodes active on the network. Blockchain enables the nodes
    to an agreement quickly. When millions of nodes are validating a transaction,
    a consensus is necessary for a system to run smoothly. You could think of it as
    kind of a voting system, where the majority wins, and the minority has to support
    it.

    * Trustless – The consensus is responsible for the network being trustless. Nodes
    might not trust each other, but they can trust the algorithms that run at the
    core of it. That’s why every decision on the network is a winning scenario for
    the blockchain. It’s one of the key benefits of blockchain features.


    ## Cryptography and Encryption


    How does blockchain offers higher level of security compared to existing technologies?
    It is because of ‘Cryptography’.


    Cryptography is a complex mathematical algorithm that acts as a firewall for attacks.
    Every information on the blockchain is hashed cryptographically. In simple terms,
    the information on the network hides the true nature of the data. For this process,
    any input data gets through a mathematical algorithm that produces a cryptographic
    ‘hash’ which is a different value, but whose length is always fixed.


    Added with decentralization, encryption adds another layer of protection for users.
    The users have a `private key` to access the data and a `public key` to make transactions.


    ### Why it is one of the key Blockchain feature?


    * Tamperproof – All the blocks in the ledger have a unique `hash` and contain
    the `hash` of the previous block. If someone tampers with the data in the block,
    that will change all the hashes of the linked blocks. IDs. And that’s what makes
    the data tamperproof.

    * Authenticity – Encryption and cryptography are combined with the blockchain
    technology to assure the information is authentic. Instead of relying on the 3rd
    party, trust is put into cryptographic algorithms that proves the provenance and
    authenticity of an attestation.

    * Irreversible – Hashing is quite complex, and it’s impossible to alter or reverse
    it. No one can take a `public key` and come up with a `private key`. Also, a single
    change in the input could lead to a completely different ID, so small changes
    aren’t a luxury in the system. If someone wants to corrupt the network, he/she
    would have to alter every data stored on every node in the network. There could
    be millions and millions of people, where everyone has the same copy of the ledger.
    Accessing and hacking millions of computers is next to impossible and costly.
    That’s why it’s one of the best blockchain features. As it’s too hard to bypass,
    you won’t have to worry about hackers taking all your digital assets from you.


    ## Immutability


    There are some exciting blockchain features but among them “Immutability” is undoubtedly
    one of the key features of blockchain technology. But why is this technology uncorrupted?
    Let’s start with a connecting blockchain with immutability.


    Immutability means something that can’t be changed or altered. This is one of
    the top blockchain features that help to ensure that the technology will remain
    as it is – a permanent, unalterable network. But how does it maintain that way?


    Blockchain technology works slightly different than the typical banking system.
    Instead of relying on centralized authorities, it ensures the blockchain features
    through a collection of nodes. Every node on the system has a copy of the digital
    ledger. To add a transaction every node needs to check its validity. If the majority
    thinks it’s valid, then it’s added to the ledger. This promotes transparency and
    makes it immutable. So, without the consent from the majority of nodes, no one
    can add any transaction blocks to the ledger.


    Another fact, that backs up the list of key blockchain features is that, once
    the transaction blocks get added on the ledger, no one can go back and change
    it. Thus, any user on the network won’t be able to edit, delete or update it.


    ### Why it is one of the key Blockchain feature?


    * Trustless environment – Every year there’s a massive amount of money that gets
    hacked through regular channels. In many cases, there’s always an internal link
    for these hacks to know about all the security measures, so in the end, we pay
    the price for our trust. As you all know banks aren’t that trustable now and the
    global economy needs a trustless environment to fully overcome this issue.

    * Corruption-proof –If businesses start to integrate blockchain technology to
    maintain their internal networking system, no one would be able to hack into it
    or alter or even steal information. Public blockchains are a perfect example of
    this. Everyone in the public blockchain can see the transactions, so it is super
    transparent. On the other hand, private or federated blockchain could be best
    for enterprises that want to remain transparent among staff and protect their
    sensitive information along the way from public view.


    ## Programmable


    Some blockchains offer an additional feature, ‘smart contract’, that impose logic
    into the system.


    If you think of bitcoin blockchain as a calculator recording financial transactions,
    you can think of blockchains enabling smart contracts as computers. The first
    of these blockchains is `Ethereum`, which runs `Ethereum Virtual Machine` (`EVM`),
    which has the ability to impose digital agreements or ‘smart contracts’.

