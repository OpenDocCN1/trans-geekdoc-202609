    Web 2.0 见证了新兴市场，在一个无缝且低成本的环境中将不相关的买家和卖家聚集在一起。数据成为了一种被收集、孤岛化出售的商品，消费者开始以一种疯狂的速度交出自己的信息。网站允许用户生成内容，社交媒体成为了他们生活的一部分。社交媒体包含了许多在线工具和平台，人们在上面分享自己的观点、意见、想法和经验。


    ## Web 3.0 – 价值互联网


    Web 3.0 是一个用于描述多种路径下 Web 使用和交互的许多次演变的术语。它指的是 Web 利用和交互的演变，包括将 Web 变为一个数据库。在长期关注前端之后，它实现了
    Web 后端的升级。在 Web 3.0 中，数据不再被所有，而是被共享的，服务会针对同一个网页 / 同一个数据展示出不同的视图。


    语义网（3.0）承诺以比 Google 通过其现有引擎架构所能实现的更合理的方式建立“世界信息”。从机器概念而非人类理解的角度来看，这一点尤为真实。


    Web 3.0 的核心特征是：


    *   **语义网** – 语义网改进了所需的 Web 技术，根据理解词义的能力通过搜索和分析来创建、共享和连接内容。

    *   **人工智能** – 在 Web 3.0 中，结合自然语言处理，计算机可以像人类一样区分。

    *   **3D 图形** – 在 3.0 中，三维设计被广泛使用。

    *   **连接性** – 在 Web 3.0 中，通过元数据数据是互联的。

    *   **无处不在** – 内容由多个应用程序访问，每个设备都是互联的。

    *   **数据独立性** – 身份由用户持有，打破了数据孤岛。


    作为结果，Web 3.0 是开放且智能的。区块链技术、分布式账本、智能合约和机器学习。


    比特币是 Web 3.0 的第一个广泛接受的应用，它代表了一个价值这种速度交换的世界。新的 Web 3.0 浏览器正在构建，以帮助用户管理加密货币、密码和其他区块链功能。


    ![Web 3.0 如何影响高等教育](img/image0232.jpeg)


    ## Web 的演变


    ### Web 1.0、Web 2.0 和 Web 3.0 的主要区别


    | Web 1.0 | Web 2.0 | Web 3.0 |

    | --- | --- | --- |

    | 只读 | 读写 | 读写执行 |

    | 公司中心 | 社区中心 | 个人中心 |

    | 客户端服务器 | 点对等 | 便携式 Web |

    | 所有内容 | 共享内容 | 整合 |

    | 网页 | 交互 | 行为 |

    | 静态 | 标记 | Live |

    | 目录 | 博客 | 应用 |

    | 横幅广告 | XML | RDF |


    ### 区块链历史


    加密学家 David Chaum 在 1982 年首次提出了区块链协议。1991 年，Stuart Haber 和 Scott Stornetta 描述了一种加密安全的不可篡改的时间链。1992
    年，他们引入了梅克尔树。


    然而，又过了 13 年，中本聪（一个人或一群人）在 2008 年构思了第一个去中心化区块链。比特币使其成为第一个不需要信任权威或中央服务器即可解决双花问题的数字货币。


    比特币区块链记录交易并将其历史存储在只写账中。它实现为区块链，每个区块都包含前一个区块的哈希，直到创区块。2014 年 8 月，比特币区块链文件大小（包含网络上发生的所有交易记录）达到了
    20 GB；从 2016 年 1 月到 2017 年 1 月，比特币区块链的大小从 50 GB 增长到 100 GB。到 2020 年初，账本大小已超过 200
    GB。


    根据埃森的创新扩散理论，区块链在 2016 年的采用率达到 13.5%，因此进入早期采用阶段。行业贸易组织在 2016 年成立了全球区块链论坛，这是数字商务协会的一项倡议。比特币的设计启发了其他广泛应用和区块链。


    ### 区块链基础


    现在听到“区块链”这个词，就像在 90 年代初听到“互联网”一样。它似乎虚无缥缈，像是某种不会影响你日常生活的东西。但 25 年后的我们在这里，互联网已经改变了业务、贸易、通信、媒体甚至是人们相互联系的方式。我们每个人的口袋里都带着互联网。我们只需点击一下就可以转账、查询天气、获取路线，甚至点外卖。


    下一个具有这种影响的技术并不是大数据、人工智能或社交媒体。


    它是区块链！


