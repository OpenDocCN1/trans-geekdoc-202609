    \ The computers in that era were large and immobile and in order to make use of\
    \ information stored in any one computer, one had to either travel to the site\
    \ of the computer or have magnetic computer tapes sent through the conventional\
    \ postal system.\n\nAnother catalyst in the formation of the Internet was the\
    \ heating up of the Cold War between the US and Soviets. The Soviet Union's launch\
    \ of the Sputnik satellite spurred the U.S. Defense Department to consider ways\
    \ information could still be disseminated even after a nuclear attack. This led\
    \ to the formation of the ARPANET (Advanced Research Projects Agency Network),\
    \ the network that ultimately evolved into what we now know as the Internet. ARPANET\
    \ was a great success but membership was limited to certain academic and research\
    \ organizations who had contracts with the Defense Department. In response to\
    \ this, other networks were created to provide information sharing.\n\nARPANET\
    \ started a DARPA (Defense Advanced Research Project Agency) experiment in decentralized\
    \ computing communications between two university labs in California in 1970.\
    \ On 1st January 1983, this communications protocol became Transfer Control Protocol/Internetwork\
    \ Protocol (TCP/IP), the standard in networking protocol or computer communications\
    \ protocol, which is the backbone of today’s internet. Prior to this, the various\
    \ computer networks did not have a standard way to communicate with each other.\
    \ TCP/IP allowed different kinds of computers on different networks to \"talk\"\
    \ to each other. ARPANET and the Defense Data Network officially changed to the\
    \ TCP/IP standard on 1st January 1983, leading to the birth of the Internet. \n\
    \nWith the TCP/IP protocol in place, users had the ability to link hypertext documents\
    \ in an information system accessible from any node or computer using this protocol.\
    \ All networks could now be connected by a universal language. The resulting information\
    \ system became today’s World Wide Web (www). With the birth of World Wide Web,\
    \ expanded usages of this new technology arose with expanded business opportunities.\
    \ Web servers, people which host and store the documents and web browsers, companies\
    \ set up to help you view linked documents, help create a household need for this\
    \ new technology, leading to the rise of the internet revolution.\n\nThe internet\
    \ can be grouped into three distinct segments characterized by the way people\
    \ interact with it.\n\n*   Web 1.0 – Internet of Connection\n\n*   Web 2.0 – Internet\
    \ of Information\n\n*   Web 3.0 – Internet of Value\n\n## Web 1.0 – Internet of\
    \ Connection\n\nWeb 1.0 refers to the first stage of the World Wide Web evolution.\
    \ It was a content delivery network (CDN) that enabled the showcase of the piece\
    \ of information on the websites. There were only a few content creators in Web\
    \ 1.0 with a huge majority of users who were the consumers of content. Personal\
    \ web pages were common, consisting mainly of static pages hosted on ISP-run web\
    \ servers, or on free web hosting services. \n\nThe web pages were static and\
    \ built using Server Side Includes or Common Gateway Interface (CGI). Frames and\
    \ Tables were used to position and align the elements on a page. The content was\
    \ served from the server’s file system. It costed the user as per pages viewed\
    \ and had directories that enabled users to retrieve a particular piece of information.\n\
    \nThe essential characteristics of Web 1.0 were:\n\n*   Development of a host\
    \ of web-based applications, which fostered in online services, such as email\n\
    \n*   Content from the administrator\n\n*   Managed by a central authority\n\n\
    *   Read-only information, that was ‘pushed’ to the users\n\n![Figure A: A typical\
    \ Web 1.0 Architecture B. Web 2.0 | Download Scientific Diagram](Images/image00230.jpeg)\n\
    \nWeb 1.0 architecture; Source: researchgate.net\n\nEmail was the first widely\
    \ adopted application on Web 1.0. Computers and their connectivity started becoming\
    \ necessities. Technology advancement in computer technology brought on changes,\
    \ floppy disks became hard disks, storage capacities increased from MB to GB to\
    \ TB. Internet speed increased from kilobits per second (Kbps) to megabytes per\
    \ second (Mbps) to gigabytes per second (Gbps), and RAM grew from KBs to GBs.\
    \ \n\nWeb 1.0 concluded with the development of the dotcom bubble. Startups appeared\
    \ to cash in on this new technology, most notable being Netscape which developed\
    \ the first commercial web browser.\n\n## Web 2.0 – Internet of Information\n\n\
    Web 2.0 is an enhanced version of Web 1.0. It refers to worldwide websites that\
    \ highlight user-generated content, usability, and interoperability for end users.\
    \ Web 2.0 is also called the participative social web. It does not refer to a\
    \ modification to any technical specification, but to modify the way Web pages\
    \ are designed and used. \n\nWeb 2.0 had dynamic content that is responsive to\
    \ user input, in comparison to Web 1.0 which was static. It enabled free sorting\
    \ of information, permitting users to retrieve and classify the information collectively.\
    \ \n\nWeb 2.0 enabled information flows between the site owner and site users\
    \ by means of evaluation and online commenting. Interaction and collaboration\
    \ between participants was allowed in a social media dialogue as the creator of\
    \ user-generated content in a virtual community. Web 2.0 applications tend to\
    \ interact much more with the end user. As such, the end user is not only a user\
    \ of the application but also a participant by these 8 tools mentioned below:\n\
    \n*   Podcasting\n\n*   Blogging\n\n*   Tagging\n\n*   Curating with RSS\n\n*\
    \   Social bookmarking\n\n*   Social networking\n\n*   Social media\n\n*   Web\
    \ content voting\n\nThe essential characteristics of Web 2.0 were:\n\n*   User-generated\
    \ content\n\n*   Read-write capability, enabling users to interact with information\n\
    \n*   Information became siloed\n\n*   Data became a commodity\n\n![](Images/image00231.gif)\n\
    \nWeb 2.0 architecture; Source: researchgate.net"
