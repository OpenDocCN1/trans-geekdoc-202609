  \ Functions: Summary\" 误为 \"PHP 字符串函数\"，翻译时已根据上下文修正逻辑）\n\n\n## PHP 数组函数\n\n\n##\
  \ PHP 数组函数：主要提示\n\n- 引入于 PHP 4，它根据指定的参数创建一个数组。\n- PHP 数组是包含多个值的变量。\n- PHP 数组有三种类型：索引（数字索引）、关联（命名键）和多维（嵌套数组）。\n\
  \n## `array()` 的用法\n\n`array()` 是所有 PHP 数组函数的基础。简单来说，它用于创建数组。让我们来看一个简单的示例：\n\n```php\n\
  <?php\n  $food = ['IceCream', 'Pizza', 'Burger'];\n  echo \"I like \" . $food[0]\
  \ . \", \" . $food[1] . \" and \" . $food[2] . \".\";\n?>\n```\n（注：此处保留图片位置）\n\n\
  ## 正确语法\n\n你可能知道编码时注意正确的语法至关重要，使用 PHP 数组函数也是如此。让我们看看索引数组应该编写：\n\n```\narray(value1,value2,value3);\n\
  ```\n\n现在，关联数组的 PHP 语法有点不同。它们通过键值对来定义。注意，数字或字符串都可以表示键：\n\n```\narray(key=>value,key=>value,key=>value);\n\
  ```\n\n在两种使用 PHP 数组函数的情况下，`value` 元素定义了数组包含的每个值以便 PHP 创建数组。在 PHP 5.4 引入的数组快捷语法中，`array()`\
  \ 可以被替换为 `[]`。例如，与其写 `$food=array(\"IceCream\",\"Pizza\");`，你只需输入 `$food=[\"IceCream\"\
  ,\"Pizza\"]` 即可让 PHP 创建数组。这不会改变新数组函数的方式。\n\n## 练习：代码示例\n\n下面的示例代码创建了一个 PHP 脚本引用的关联数组\
  \ `$age`：\n\n```php\n<?php\n  $age = [\n    'Drago' => 69,\n    'Mark' => 32,\n\
  \    'Luke' => 35\n  ];\n  echo \"Mark is \" . $age['Mark'] . \" years old.\";\n\
  ?>\n```\n\n\n\n如果我们想执行一个 PHP 关联数组循环并打印它的值，我们的代码将如下：\n\n```php\n<?php\n  $food =\
  \ [\n    'Pizza' => 5.90,\n    'IceCream' => 1.90,\n    'Burger' => 2.90\n  ];\n\
  \  foreach($food as $z => $z_value) {\n    echo \"Key=\" . $z . \", Value=\" . $z_value;\n\
  \    echo \"<br>\";\n  }\n?>\n```\n![](img/image00141.jpeg)\n\n现在，这个示例中的脚本遍历索引数组并打印它的值：\n\
  \n```php\n<?php\n  $food = ['IceCream', 'Pizza', 'Burger'];\n  $arrayLength = count($food);\n\
  \  for($z = 0; $z < $arrayLength; $z++) {\n    echo $food[$z];\n    echo \"<br>\"\
  ;\n  }\n?>\n```\n\n![](img/image00142.jpeg)\n\n注意：在遍历数组时，请选择 `for` 和 `foreach` 循环。\n\
  \n现在，让我们看看创建一个多维数组看起来是什么样：\n\n```php\n<?php\n  // 一个二维数组\n  $food = [\n    ['IceCream',\
  \ 50, 32],\n    ['Pizza', 40, 39 ],\n    ['Burger', 35, 20 ]\n  ];\n  echo $food[0][0].\"\
  : Ordered: \".$food[0][1].\". Sold: \".$food[0][2].\"<br>\";\n  echo $food[1][0].\"\
  : Ordered: \".$food[1][1].\". Sold: \".$food[1][2].\"<br>\";\n  echo $food[2][0].\"\
  : Ordered: \".$food[2][1].\". Sold: \".$food[2][2].\"<br>\";\n?>\n```\n![](img/image00143.jpeg)\n\
  \n# 目录函数\n\n## PHP 目录完全指南：精通函数\n\nPHP 目录是一种用于编目录和保存我们文件的结构。它是组织系统的一部分，让我们能够更轻松地跟踪项目和代码文件。\n\
  \nPHP 拥有许多内置函数，让我们能够快速获取目录中特定 PHP 文件的信息。此外，还可以检索有关整个特定 PHP 目录的数据。我们可以轻松让 PHP 列出目录中的文件、打开指定的句柄并执行其他任务。\n\
  \n\n## PHP 目录：主要提示\n\n* 目录函数允许你获取有关各种 PHP 目录及其包含内容的信息。\n* 这些函数内置在 PHP 核心中。\n\n##\
  \ 有用函数列表\n\n以下列表包含了你可以应用于操作所创建的每个 PHP 目录的函数：\n\n![](img/image00144.jpeg)\n![](img/image00145.jpeg)\n\
  \n## PHP 目录：总结\n\n* 使用 PHP 目录函数可以获取任何 PHP 文件目录及其包含的文件的信息。\n* 这些函数是内置的，因此不需要安装。\n\
