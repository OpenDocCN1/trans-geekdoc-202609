  \n\n## PHP 日期格式\n\n\n## PHP 日期格式：主要提示\n\n- 此 `date()` 函数用于在代码中格式化日期和时间。\n- 有特殊的格式化字符：PHP\
  \ 年、周、日等。\n- 你可以使用它让 PHP 自动获取时间戳并更新你网站上的版权日期。\n\n## 语法规则解释\n\n输入日期的语法规则相当简单：\n\n\
  ```\ndate(format, timestamp)\n```\n\n`timestamp` 部分描述一个整数 Unix 时间戳。输入它是可选的——如果你不输入，它将导致\
  \ PHP 自动获取时间戳并显示当前本地时间 (`time()`）。\n\n现在，对于 `format` 部分，就是另一回事了。它是必要的，因为你需要通过它来指定你的\
  \ PHP 日期格式的外观。\n\n## 常用格式化字符\n\n在 PHP 中，年、月、日通常使用特殊符号来引用。PHP 日期函数中最常用的四个字符是：\n-\
  \ `d` (01-31) 代表日期数字。\n- `m` (01-12) 代表月份数字。\n- `Y`（四位数）代表年份。\n- `l`（小写 'L'）表示星期几。\n\
  \n可以添加更多符号（`/`、`.`、`-`）用于额外的 PHP 格式化。在下方的代码示例中，你可以看到创建 PHP 日期的四种不同方法：\n\n```php\n\
  <?php\n echo \"Today is \" . date(\"Y/m/d\") . \"<br>\";\n echo \"Today is \" .\
  \ date(\"Y.m.d\") . \"<br>\";\n echo \"Today is \" . date(\"Y-m-d\") . \"<br>\"\
  ;\n echo \"Today is \" . date(\"l\");\n?>\n```\n![](img/image00114.jpeg)\n\n现在，上面列出的四个字符可能是\
  \ datetime 函数中最常用的，但你的选择不仅限于它们。让我们看看你可以用于 PHP 日期格式的字符完整列表及其含义：\n\n![](img/image00115.jpeg)\n\
