        \[''Burger'', 35, 20 \]


      \];


      echo $food\[0\]\[0\].": Ordered: ".$food\[0\]\[1\].". Sold: ".$food\[0\]\[2\]."<br>";


      echo $food\[1\]\[0\].": Ordered: ".$food\[1\]\[1\].". Sold: ".$food\[1\]\[2\]."<br>";


      echo $food\[2\]\[0\].": Ordered: ".$food\[2\]\[1\].". Sold: ".$food\[2\]\[2\]."<br>";


    ?>


