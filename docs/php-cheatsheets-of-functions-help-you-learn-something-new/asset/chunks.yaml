    # PHPCheatsheets of Functions


    Get to Know Functions and Constants Used for PHP DateTime Format…


    By: Daniel Billotte


    PHP date and time can be formatted in multiple different ways in your PHP code.
    You might need a Unix timestamp or GMT date, a DateTime object or an ISO date.
    Therefore, it is important to learn functions that are applied to manipulate PHP
    DateTime format.


    PHP date formatting is not that hard, but you still have to have specific knowledge
    and expertise. Fetching the date and time from the server you are using is only
    the first step. Don''t let a wrong time zone or PHP date format throw you off
    your feet!


    ## Contents


    | | |

    | --- | --- |

    | [DateTime Functions](#part0002.xhtml#_DateTime_Functions) | 4 |

    | [Error Functions](#part0002.xhtml#_Error_Functions) | 10 |

