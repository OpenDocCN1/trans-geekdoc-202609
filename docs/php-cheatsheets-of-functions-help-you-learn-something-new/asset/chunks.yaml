    作者：Daniel Billotte


    在你的 PHP 代码中，可以用多种不同的方式对 PHP 日期和时间进行格式化。你可能需要 Unix 时间戳或 GMT 日期、DateTime 对象或 ISO
    日期。因此，学习用于处理 PHP 日期时间格式的函数是非常重要的。


