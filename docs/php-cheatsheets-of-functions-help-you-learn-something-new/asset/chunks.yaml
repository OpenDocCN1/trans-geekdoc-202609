    As we have mentioned, among the most used methods stands the PHP file function
    that reads a file into an array. Each element of the array will represent a line
    from a file. Before PHP 4.3, using `file()` PHP could only read character data,
    but now it also works with binary data such as pictures.


    Let''s view the correct syntax that is needed for PHP file function to be executed
    correctly:


    ```

    file(path,include path,context)

    ```


    Only the first of the parameters is required, as it names the exact file for PHP
    `file()` to read.


    ## Options for Runtime Configuration


    The way PHP filesystem functions behave is inevitably affected by the settings
    located in `php.ini`. Let''s see the different options we can use for the configuration:


    ![](Images/image00074.jpeg)

    ![](Images/image00075.jpeg)


    ## List of Functions


    In the table below, you have the list of functions PHP provides to make your work
    with the PHP filesystem easier.


    Some of them (such as `[fopen()](https://www.bitdegree.org/learn/php-fopen#fopen))
    you might also recognize from our previous lessons, in which we learned to work
    with PHP code to open external files:


    ![](Images/image00076.jpeg)

    ![](Images/image00077.jpeg)

    ![](Images/image00078.jpeg)

    ![](Images/image00079.jpeg)

    ![](Images/image00080.jpeg)

    ![](Images/image00081.jpeg)

    ![](Images/image00082.jpeg)

    ![](Images/image00083.jpeg)

    ![](Images/image00084.jpeg)

    ![](Images/image00085.jpeg)

    ![](Images/image00086.jpeg)


    ## PHP File Function: Summary


    - Inbuilt PHP functions that are used to access and manipulate filesystems can
    simply called filesystem functions. They don''t require installation.

    - Directories are separated using forward slashes (/). On Windows you can use
    backward slashes (`\\`) as well.

    - PHP file function is probably used the most. You can read a file into array
    using it. PHP `file()` is able to read both binary data and characters.


    # Filter


    ## Learn to Use PHP Filter: Functions to up Your Security Level


    We might have already discussed PHP filters once or twice. Using them is important
    for the safety of the website or application you are creating.


    We prepared a clear list of PHP filter functions and predefined constants that
    you can quickly refer to. If suddenly you need to PHP validate strings, encode
    special characters or perform other filtering duties, we are here for your every
    need.


    #### Contents

    1. PHP Filter: Main Tips

    2. Options for Runtime Configuration

    3. List of Functions to Apply

    4. Relevant Predefined Constants

    5. PHP Filter: Summary


    ### PHP Filter: Main Tips


    - PHP filters are used to sort, validate and otherwise filter data using PHP script.

    - Since the PHP version 5.2.0, the filter functions are available by default,
    so they don''t have to be installed.

    - `filter_var` in PHP might be considered one of the most valuable functions.


    ### Options for Runtime Configuration


    Always remember that the work of these functions is affected by the settings located
    in `php.ini`:


    ![](Images/image00087.jpeg)


    ### List of Functions to Apply


    In the table below, you can see a list of useful functions that can be used with
    PHP filters. They are valid in PHP 5.2 and all newer versions:


    ![](Images/image00088.jpeg)


    ### Relevant Predefined Constants


    Take a look at these predefined constants. You may find them useful when performing
    PHP filtering as well:


    ![](Images/image00089.jpeg)

    ![](Images/image00090.jpeg)

    ![](Images/image00091.jpeg)


    ### PHP Filter: Summary


    - PHP filtering is useful for coders who need to handle (in most cases, validate
    and sort) the data.

    - Inbuilt PHP filters have been introduced with version 5.2. If you''re using
    this version or a newer one,''s no need to install these functions.

    - Coders use `filter_var` in PHP codes often for its flexibility.


    # Math Functions


    ## Use PHP Math Functions: Understand Mathematical Processes in Your Code


    Out of eight PHP data types, only two hold numerical values. You can perform the
    most basic arithmetic actions using operators, such as modulo or division. For
    more complex mathematical operations, PHP math functions are used. To start using
    them do not need to install any extensions or packages.


    #### Contents

    1. PHP Math Functions: Main Tips

    2. List of Functions

    3. Predefined Constants

    4. PHP Math Functions: Summary


    ### PHP Math Functions: Main Tips


    - PHP math functions are used for handling `float` and `integer` variables.

    - These functions are inbuilt into PHP.


    ### List of Functions


    In the table below, all the PHP math functions are listed alphabetically. If you
    are using PHP 4 or a newer version, you can use any of them freely. In case you
    forget any of these functions, return to this table to refresh your memory! Have
    a look:


    ![](Images/image00092.jpeg)

    ![](Images/image00093.jpeg)

    ![](Images/image00094.jpeg)

    ![](Images/image00095.jpeg)

    ![](Images/image00096.jpeg)

    ![](Images/image00097.jpeg)

    ![](Images/image00098.jpeg)


    ### Predefined Constants


    Now, let''s see some predefined constants that are also used in mathematics. The
    column on the right indicates version of PHP in which particular constant has
    been introduced:


    ![](Images/image00099.jpeg)

    ![](Images/image00100.jpeg)

    ![](Images/image00101.jpeg)

    ![](Images/image00102.jpeg)

    ![](Images/image00103.jpeg)


    ### PHP Math Functions: Summary


    - PHP math functions don''t need to be installed, as they are inbuilt.

    - They are meant to only be used with variables that contain numerical values:
    integers and floats.


    # Mail Function


    ## PHP Mail Function: Communicating With Your Users via Emails


    The easiest way to interact with your users is to make PHP send emails, using
    special `[forms](https://www.bitdegree.org/learn/php-form-example)` and the PHP
    mail function. The main idea of it is that a developer can create special email
    forms for sending emails straight from the script.


    Using PHP `mail()` you can, for example, send weekly newsletters, or configure
    your email box to receive error messages. Therefore, the function provides with
    not only means of communication but also a custom error log.


    #### Contents

    1. PHP mail Function: Main Tips

    2. Options for Runtime Configuration

    3. Functions for Email Sending

    4. PHP mail Function: Summary


    ### PHP mail Function: Main Tips


    - PHP mail function allows you to send emails directly by using PHP script.

    - This function is integrated into PHP''s core, but requires a working email system
    installed to your system (which must be defined in the `php.ini` file)


    ### Options for Runtime Configuration


    The way PHP `mail()` function behaves is always affected by the settings defined
    inside `php.ini`. The table below provides a list of these runtime configurations
    that you can apply:


    ![](Images/image00104.jpeg)

    ![](Images/image00105.jpeg)


    ### Functions for Email Sending


    In the table below, you can see the functions you can use when you want to PHP
    send email:


    ![](Images/image00106.jpeg)


    ### PHP mail Function: Summary


    - Using an inbuilt `mail()` function, you can send emails via your PHP script.

    - For this function to work properly, your system must have an email system installed,
    working, and defined in `php.ini`.


    # Miscellaneous Functions


    ## PHP Function Use Guide: Miscellaneous Functions and Constants


    Explaining PHP function use is smoother when methods can be categorized into clear
    groups. However, some single functions and constants stand alone and don''t belong
    to any specific categories.


    Even though such functions are not a part of a chain of similar methods, they
    still need to be addressed. Therefore, we dedicate a tutorial to PHP miscellaneous
    functions.


