    # DateTime Functions


    ### Contents


    1. PHP DateTime Format: Main Tips

    2. Runtime Configuration

    3. Time And Date Functions

    4. List of Predefined Constants

    5. PHP DateTime Format: Summary


    ## PHP DateTime Format: Main Tips


    * Time and date PHP functions allow you to get date and time from the server you''re
    using.

    * These functions are inbuilt into the PHP core.

    * Keep in mind that these functions are dependant on your server''s locale setting.


    ## Runtime Configuration


    When using these functions to set PHP DateTime format, remember that how they
    behave will be affected by the settings located in `php.ini`:


    | Name | Description | Default | PHP Version |

    | --- | --- | --- | --- |

    | `date.timezone` | Default timezone (is used by all PHP date/time functions)
    | "" | PHP 5.1 and newer |

    | `date.default_latitude` | Default latitude (is used by `date_sunrise()` and
    `date_sunset()`) | "31.7667" | PHP 5.0 and newer |

    | `date.default_longitude` | Default longitude (is used by `date_sunrise()` and
    `date_sunset()`) | "35.2333" | PHP 5.0 and newer |

    | `date.sunrise_zenith` | Default sunrise zenith (is used by `date_sunrise()`
    and `date_sunset()`) | "90.83" | PHP 5.0 and newer |

    | `date.sunset_zenith` | Default sunset zenith (is used by `date_sunrise()` and
    `date_sunset()`) | "90.83" | PHP 5.0 and up |


    ## Time And Date Functions


    Analyze the table below. It is a handy guide for the inbuilt functions that can
    be used for all your needs when it comes to setting the PHP DateTime format. Feel
    free to return to it whenever you need a reminder.


    ![](Images/image00055.jpeg)

    ![](Images/image00056.jpeg)

    ![](Images/image00057.jpeg)

    ![](Images/image00058.jpeg)

    ![](Images/image00059.jpeg)

    ![](Images/image00060.jpeg)

    ![](Images/image00061.jpeg)


    ## List of Predefined Constants


    There are also a few predefined constants that can be used in PHP date formatting.
    Take a look at their names and descriptions:


    ![](Images/image00062.jpeg)

    ![](Images/image00063.jpeg)


    ## PHP DateTime Format: Summary


    * To get dates and time, inbuilt PHP time and date functions and constants are
    used.

    * These functions are related to the locale settings of the server you''re using.

    * Always keep time inconsistencies (such as daylight savings, time zones and leap
    years) in mind when working with PHP date functions.


    # Error Functions


    ### How to Fix PHP Error: A Guide on Handlers, Functions and Constants


    You already learned how PHP error handling works, what PHP errors are in their
    essence, and how to work with them. Still, there is a lot of functions you don''t
    know. Some of them (like PHP display errors) may come in handy often.


    PHP error handling is not a task you''d want to put away for long. Therefore,
    in this tutorial, we will introduce you with various functions and constants that
    will prove helpful to you as you''re using PHP error handlers and creating custom
    error logs.


    ### Contents


    1. PHP Error: Main Tips

    2. Settings for Runtime Configuration

    3. List of Functions

    4. Predefined Constants

    5. PHP Error: Summary


    ## PHP Error: Main Tips


    * PHP error functions allow you to get date and time.

    * Error functions are meant for handling and logged.

    * Logging an error means sending messages to specified file or email.

    * Using PHP error reporting, you can define system''s feedback.

    * These functions are inbuilt into the PHP core.

    * This tutorial explains in detail what is error.


    ## Settings for Runtime Configuration


    The way these functions behave is affected by the settings located in `php.ini`:


    ![](Images/image00064.jpeg)

    ![](Images/image00065.jpeg)

    ![](Images/image00066.jpeg)

    ![](Images/image00067.jpeg)


    ## List of Functions


    For error management, you are welcome to use the following functions. The table
    below indicates common methods that might be applied:


    ![](Images/image00069.jpeg)

    ![](Images/image00070.jpeg)


    ## Predefined Constants


    In PHP error handling, you can use the predefined constants that are designed
    for allowing you to set which errors are supposed to be displayed. Take a look
    at the following table and learn the meaning of each constant:


    ![](Images/image00071.jpeg)

    ![](Images/image00072.jpeg)

    ![](Images/image00073.jpeg)


    ## PHP Error: Summary


    * To handle and log errors, you should use special PHP functions.

    * When an error is logged, their messages are sent to specified file or email.

    * Using PHP error reporting, you can define system''s feedback.

    * These functions don''t require special installation.


    # File Function


    ### How to Use Any File Function: Copy, Delete and Many More


    In developing, functions are tools that you combine with your skills to achieve
    the desired effect. For example, using any PHP file function, you can quickly
    and easily read a file into an array, be it characters or binary data such as
    pictures.


    The navigation of the filesystem becomes effortless when you know which PHP file
    function needs to be applied in certain situations. In this tutorial, we will
    provide you with a handy list of functions used to manipulate PHPystems and files.


    We will review the most frequently used method: the PHP `file()` function, applied
    when it is necessary to read a file into an array. Additionally, you will learn
    the techniques to change groups, modes, and owners of files.


    ### Contents


    1. PHP File Function: Main Tips

    2. Most Common Method: file()

    3. Options for Runtime Configuration

    4. List of Functions

    5. PHP File Function: Summary


    ## PHP File Function: Main Tips


    * PHP file functions allow accessing and manipulating filesystems.

    * These functions are inbuilt into the PHP core.

    * When using this function on Unix, forward slash (/) is used to separate directories.

    * On Windows, forward (/) and backward (\\) slashes may be used for that.

    * One of the most important methods is the PHP `file()` function, used to read
    a file into array.


    ## Most Common Method: file()

