  trans: "\n\n# [4. 预常量](https://www.bitdegree.org/learn/php-function-use#predefined-constants)\n\
    \n# 5. PHP 函数使用：总结\n\n## PHP 函数使用：主要提示\n\n- PHP 杂类函数是指那些不属于其他主要大类别的函数。\n- 它们在\
    \ PHP 配置或其他任务中可能非常有用。\n- 本教程中的每个函数都是 PHP 内置函数。\n\n## 运行时配置\n\nPHP 杂类函数的行为方式始终取决于\
    \ `php.ini` 文件中的设置。让我们来看看使用杂类函数进行 PHP 配置时拥有的选项：\n\n![](img/image00107.jpeg)\n\
    ![](img/image00108.jpeg)\n\n## 方法列表\n\n在本节中，你将了解此杂类类别的 PHP 函数用法。例如，你可以使用 PHP `sleep()`\
    \ 方法设置一个函数在稍后执行。下表中有许多方法可以分析。不过，我们确定其中某些方法将证明自己是有用的。\n\n![](img/image00109.jpeg)\n\
    ![](img/image00110.jpeg)\n![](img/image00111.jpeg)\n![](img/image00112.jpeg)\n\
    \n## 预常量\n\n下面的列表包含了这些 PHP 常量的名称、描述以及执行这些 PHP 常量的版本：\n\n![](img/image00113.jpeg)\n\
    \n## PHP 函数使用：总结\n\n- 所有不属于任何特定类别的函数都被定义为 PHP 杂类函数。\n- 虽然它们是独立的，但每个杂类 PHP 内置函数在\
    \ PHP 配置过程中仍然非常有用。\n- 如果你正在使用 PHP 5 或更高版本，这些函数中没有任何不需要安装。\n\n# PHP 日期格式\n\n###\
    \ PHP 日期格式\n\n#### 目录\n1. PHP 日期格式：主要提示\n2. 语法规则解释\n3. 常用格式化字符\n4. 预常量列表\n\n##\
    \ PHP 日期格式：主要提示\n\n- 此 `date()` 函数用于在代码中格式化日期和时间。\n- 有特殊的格式化字符：PHP 年、周、日等。\n-\
    \ 你可以使用它让 PHP 自动获取时间戳并更新你网站上的版权日期。\n\n## 语法规则解释\n\n输入日期的语法规则相当简单：\n\n```\ndate(format,\
    \ timestamp)\n```\n\n`timestamp` 部分描述一个整数 Unix 时间戳。输入它是可选的——如果你不输入，它将导致 PHP 自动获取时间戳并显示当前本地时间\
    \ (`time()`）。\n\n现在，对于 `format` 部分，就是另一回事了。它是必要的，因为你需要通过它来指定你的 PHP 日期格式的外观。\n\n\
    ## 常用格式化字符\n\n在 PHP 中，年、月、日通常使用特殊符号来引用。PHP 日期函数中最常用的四个字符是：\n- `d` (01-31) 代表日期数字。\n\
    - `m` (01-12) 代表月份数字。\n- `Y`（四位数）代表年份。\n- `l`（小写 'L'）表示星期几。\n\n可以添加更多符号（`/`、`.`、`-`）用于额外的\
    \ PHP 格式化。在下方的代码示例中，你可以看到创建 PHP 日期的四种不同方法：\n\n```php\n<?php\n echo \"Today is\
    \ \" . date(\"Y/m/d\") . \"<br>\";\n echo \"Today is \" . date(\"Y.m.d\") . \"\
    <br>\";\n echo \"Today is \" . date(\"Y-m-d\") . \"<br>\";\n echo \"Today is \"\
    \ . date(\"l\");\n?>\n```\n![](img/image00114.jpeg)\n\n现在，上面列出的四个字符可能是 datetime\
    \ 函数中最常用的，但你的选择不仅限于它们。让我们看看你可以用于 PHP 日期格式的字符完整列表及其含义：\n\n![](img/image00115.jpeg)\n\
    ![](img/image00116.jpeg)\n![](img/image00117.jpeg)\n![](img/image00119.jpeg)\n\
    ![](img/image00120.jpeg)\n\n## 预常量列表\n\n开发者还使用一些用于日期和时间的预定义常数。请看下表：\n\n![](img/image00121.jpeg)\n\
    ![](img/image00122.jpeg)\n\n# 字符串函数\n\n### PHP 字符串函数入门：用更多方式处理字符串\n\n在所有八种数据类型中，PHP\
    \ 字符串被认为是整数、浮点数和布尔值是最简单的类型之一。PHP 有内置的字符串函数来操作字符串。其中一个常见用途是使用 PHP 函数之一将长字符串拆分成较小的部分。你也可以使用它们对特定的\
    \ PHP 字符串进行替换、修改或执行其他操作。\n\n#### 目录\n1. PHP 字符串函数：主要提示\n2. 方法列表\n3. PHP 字符串函数：总结\n\
    \n## PHP 字符串函数：主要提示\n\n- 正如名称所示，PHP 字符串函数有助于对字符串数据执行不同的操作。\n- 它们集成在 PHP 核心中。\n\
    - 最基础且广泛用于的是 PHP 比较字符串和字符串字符串函数。\n\n## 方法列表\n\n让我们看看 PHP 字符串函数的完整列表及其描述。表格按字母顺序组织，所以当你需要替换特定字符串时，可以快速找到它：\n\
    \n![](img/image00123.jpeg)\n![](img/image00124.jpeg)\n![](img/image00125.jpeg)\n\
    ![](img/image00126.jpeg)\n![](img/image00127.jpeg)\n![](img/image00128.jpeg)\n\
    ![](img/image00129.jpeg)\n![](img/image00130.jpeg)\n![](img/image00131.jpeg)\n\
    ![](img/image00132.jpeg)\n![](img/image00133.jpeg)\n![](img/image00134.jpeg)\n\
    ![](img/image00135.jpeg)\n![](img/image00136.jpeg)\n![](img/image00137.jpeg)\n\
    ![](img/image00138.jpeg)\n\n## PHP 字符串函数：总结\n\n- 所有似乎不属于任何特定类别的函数都被定义为 PHP 杂类函数。\n\
    - 虽然它们是独立的，但每个杂类 PHP 内置函数在 PHP 配置过程中仍然非常有用。\n- 如果你正在使用 PHP 5 或更高版本，这些函数中没有任何需要安装的\n\
    \n（注：此处原文多处 \"PHP String Functions: Summary\" 误为 \"PHP 字符串函数\"，翻译时已根据上下文修正逻辑）\n\
    \n# PHP 数组函数\n\n### PHP 数组函数\n\n#### 目录\n1. PHP 数组函数：主要提示\n2. `array()` 的用法\n\
    2.1. 正确语法\n2.2. 练习：代码示例\n\n## PHP 数组函数：主要提示\n\n- 引入于 PHP 4，它根据指定的参数创建一个数组。\n-\
    \ PHP 数组是包含多个值的变量。\n- PHP 数组有三种类型：索引（数字索引）、关联（命名键）和多维（嵌套数组）。\n\n## `array()` 的用法\n\
    \n`array()` 是所有 PHP 数组函数的基础。简单来说，它用于创建数组。让我们来看一个简单的示例：\n\n```php\n<?php\n  $food\
    \ = ['IceCream', 'Pizza', 'Burger'];\n  echo \"I like \" . $food[0] . \", \" .\
    \ $food[1] . \" and \" . $food[2] . \".\";\n?>\n```\n（注：此处保留图片位置）\n\n## 正确语法\n\
    \n你可能知道编码时注意正确的语法至关重要，使用 PHP 数组函数也是如此。让我们看看索引数组应该编写：\n\n```\narray(value1,value2,value3);\n\
    ```\n\n现在，关联数组的 PHP 语法有点不同。它们通过键值对来定义。注意，数字或字符串都可以表示键：\n\n```\narray(key=>value,key=>value,key=>value);\n\
    ```\n\n在两种使用 PHP 数组函数的情况下，`value` 元素定义了数组包含的每个值以便 PHP 创建数组。在 PHP 5.4 引入的数组快捷语法中，`array()`\
    \ 可以被替换为 `[]`。例如，与其写 `$food=array(\"IceCream\",\"Pizza\");`，你只需输入 `$food=[\"IceCream\"\
    ,\"Pizza\"]` 即可让 PHP 创建数组。这不会改变新数组函数的方式。\n\n## 练习：代码示例\n\n下面的示例代码创建了一个 PHP 脚本引用的关联数组\
    \ `$age`：\n\n```php\n<?php\n  $age = [\n    'Drago' => 69,\n    'Mark' => 32,\n\
