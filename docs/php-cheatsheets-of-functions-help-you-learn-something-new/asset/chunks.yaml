    # Directory Functions


    ### The Complete Guide on PHP Directory: Master Functions


    A PHP directory is a structure used to catalog and keep our files. It''s a part
    of an organizing system that lets us keep track of our projects and code files
    more easily.


    PHP has a bunch of inbuilt functions that let us quickly fetch information about
    particular PHP files in the directory. Additionally, it is possible to retrieve
    data about a whole specific PHP directory. We can easily make PHP list files in
    directory, open specified handles, and perform other tasks.


    #### Contents


    1. PHP Directory: Main Tips


    2. List of Useful Functions


    3. PHP Directory: Summary


    ## PHP Directory: Main Tips


    *   Directory functions allow you to get info about various PHP directories and
    what they contain.


    *   These functions are inbuilt into the PHP''s core.


