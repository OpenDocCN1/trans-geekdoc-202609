    \ timestamp)\n```\n\nThe `timestamp` part describes an integer Unix timestamp.\
    \ Entering it is optional - if you don't do it, it will result in making PHP get\
    \ timestamp automatically and display the current local time (`time()`).\n\nNow,\
    \ for the `format` part, it's a different story. It is necessary to enter because\
    \ that's how you specify how your PHP date formats will look.\n\n## Common Formatting\
    \ Characters\n\nIn PHP years, months and days are often referred to using special\
    \ symbols. There are four characters most commonly used with PHP date function:\n\
    - `d` (01-31) represents the day number.\n- `m` (01-12) represents month number.\n\
    - `Y` (four digits) represents a year number.\n- `l` (lowercase 'L') indicates\
    \ the day of the week.\n\nMore symbols (`/`, `.`, `-`) can be added for additional\
    \ PHP formatting. In the code example below, you can see four different ways to\
    \ create PHP date:\n\n```php\n<?php\n echo \"Today is \" . date(\"Y/m/d\") . \"\
    <br>\";\n echo \"Today is \" . date(\"Y.m.d\") . \"<br>\";\n echo \"Today is \"\
    \ . date(\"Y-m-d\") . \"<br>\";\n echo \"Today is \" . date(\"l\");\n?>\n```\n\
    ![](Images/image00114.jpeg)\n\nNow, the four characters listed above might be\
    \ the most commonly used with datetime function, but your choices are not limited\
    \ to them. Let's have a look at the whole list of characters you can use for PHP\
    \ date formats and what they indicate:\n\n![](Images/image00115.jpeg)\n![](Images/image00116.jpeg)\n\
    ![](Images/image00117.jpeg)\n![](Images/image00119.jpeg)\n![](Images/image00120.jpeg)\n\
    \n## List of Predefined Constants\n\nThere are also a few predefined constants\
    \ for datetime that developers use. Take a look at the table below:\n\n![](Images/image00121.jpeg)\n\
    ![](Images/image00122.jpeg)\n\n# String Functions\n\n### PHP String Functions\
    \ Made Easy: Handle Strings in a More Way\n\nOut of all eight data types, PHP\
    \ strings is considered one of the simplest, along with integers, floats, and\
    \ booleans. There are built-in PHP string functions for manipulating strings.\
    \ One of the common uses is to use one of the PHP functions to split the string\
    \ into smaller parts if length of a string. You can also use them to have a specific\
    \ PHP string replaced, modified, or perform other actions.\n\n#### Contents\n\
    1. PHP String Functions: Main Tips\n2. List of Methods\n3. PHP String Functions:\
    \ Summary\n\n## PHP String Functions: Main Tips\n\n- As the naming suggests, PHP\
    \ string functions help to perform different actions on string data.\n- They are\
    \ integrated into the core of PHP.\n- Among the most basic and widely used are\
    \ PHP compare strings and PHP string functions.\n\n## List of Methods\n\nLet's\
    \ see the complete list of PHP string functions and their descriptions. The table\
    \ is organized in alphabetical order, so you can find a particular one quickly\
    \ when you need to, say, have a certain string replaced:\n\n![](Images/image00123.jpeg)\n\
    ![](Images/image00124.jpeg)\n![](Images/image00125.jpeg)\n![](Images/image00126.jpeg)\n\
    ![](Images/image00127.jpeg)\n![](Images/image00128.jpeg)\n![](Images/image00129.jpeg)\n\
    ![](Images/image00130.jpeg)\n![](Images/image00131.jpeg)\n![](Images/image00132.jpeg)\n\
    ![](Images/image00133.jpeg)\n![](Images/image00134.jpeg)\n![](Images/image00135.jpeg)\n\
    ![](Images/image00136.jpeg)\n![](Images/image00137.jpeg)\n![](Images/image00138.jpeg)\n\
    \n## PHP String Functions: Summary\n\n- When performing various actions using\
    \ string data, PHP string functions come in handy. For example, you can easily\
    \ turn PHP array to string or PHP string to array.\n- PHP string functions are\
    \ inbuilt and don't require any installation.\n- One of the most commonly used\
    \ methods are applied to PHP compare strings and PHP trim string.\n\n# PHP Array\
    \ Functions\n\n### PHP Array Functions\n\n#### Contents\n1. PHP array Functions:\
    \ Main Tips\n2. Usage of `array()`\n2.1. Correct Syntax\n2.2. Practice: Code Examples\n\
    \n## PHP array Functions: Main Tips\n\n- Introduced in PHP 4, it creates an array\
    \ of the specified parameters.\n- A PHP array functions as a variable that holds\
    \ multiples values.\n- There are 3 types of PHP arrays: indexed (numeric index),\
    \ associative (named keys) and multidimensional (multiple arrays in one).\n\n\
    ## Usage of `array()`\n\nYou could call `array()` the base of all PHP array functions.\
    \ To put it shortly, it is used to create an array. Let's see a simple example:\n\
    \n```php\n<?php\n  $food = ['IceCream', 'Pizza', 'Burger'];\n  echo \"I like \"\
    \ . $food[0] . \", \" . $food[1] . \" and \" . $food[2] . \".\";\n?>\n```\n![](Images/image00139.jpeg)\n\
    \n## Correct Syntax\n\nYou are probably aware that it's crucial to pay attention\
    \ to correct syntax when coding, and it's no different when you're using PHP array\
    \ functions. Let's see how a piece of script should be written for an indexed\
    \ array:\n\n```\narray(value1,value2,value3);\n```\n\nNow, for the associative\
    \ array PHP syntax is a bit different. They can also be called PHP key value arrays,\
    \ as pairs of keys and values define them. Note that either numbers or a string\
    \ can represent the key:\n\n```\narray(key=>value,key=>value,key=>value);\n```\n\
    \nIn both cases of using PHP array functions, `value` elements define each value\
    \ an array contains to make PHP create array. In the short version of array syntax\
    \ introduced in PHP 5.4, `array()` can be replaced with `[]`. For example, instead\
    \ of `$food=array(\"IceCream\",\"Pizza\");` you can simply type `$food=[\"IceCream\"\
    ,\"Pizza\"]` to make PHP create array. It will not change the way the new PHP\
    \ array functions.\n\n## Practice: Code Examples\n\nThe code in the example below\
    \ creates an associative array PHP script refers to as `$age`:\n\n```php\n<?php\n\
    \  $age = [\n    'Drago' => 69,\n    'Mark' => 32,\n    'Luke' => 35\n  ];\n \
    \ echo \"Mark is \" . $age['Mark'] . \" years old.\";\n?>\n```\n![](Images/image00140.jpeg)\n"
