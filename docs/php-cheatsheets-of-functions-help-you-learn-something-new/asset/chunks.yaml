    ## PHP 日期格式：主要提示


    * PHP 日期时间函数允许你从正在使用的服务器获取日期和时间。

    * 这些函数是内置在 PHP 核心中的。

    * 请记住，这些函数取决于你服务器的本地设置。


    ## 运行时配置


    在使用这些函数设置 PHP 日期时间格式时，请记住它们的行为会受到 `php.ini` 中设置的影响：


    | 名称 | 描述 | 默认值 | PHP 版本 |

    | --- | --- | --- | --- |

    | `date.timezone` | 默认时区（被所有 PHP 日期/时间函数使用） | "" | PHP 5.1 及以上 |

    | `date.default_latitude` | 默认纬度（被 `date_sunrise()` 和 `date_sunset()` 使用） | "31.7667"
    | PHP 5.0 及以上 |

    | `date.default_longitude` | 默认经度（被 `date_sunrise()` 和 `date_sunset()` 使用） | "35.2333"
    | PHP 5.0 及以上 |

    | `date.sunrise_zenith` | 默认日出天顶（被 `date_sunrise()` 和 `date_sunset()` 使用） | "90.83"
    | PHP 5.0 及以上 |

    | `date.sunset_zenith` | 默认日落天顶（被 `date_sunrise()` 和 `date_sunset()` 使用） | "90.83"
    | PHP 5.0 及以上 |


