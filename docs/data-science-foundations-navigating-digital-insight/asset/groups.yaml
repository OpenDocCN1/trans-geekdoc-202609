    When looking for patterns over time, the data might have a trend. It could be
    an upwards trend (values increasing over time) or a downwards trend (values decreasing
    over time). A pattern over time could also be cyclical, for example retail sales
    peaking in the run-up to Christmas every year. Data such as this isn’t stationary,
    and some models require the data to be stationary. Stationary data is where its
    statistical properties, such as mean and variance, don''t vary over time. Where
    the data has a trend or cyclical pattern, the mean and variance do vary over time.
    Tests can be undertaken to determine if the data is stationary and, if it isn''t,
    it might be possible to transform the data so that it is stationary, allowing
    it to be used as part of a model requiring stationary data.


