    context of the data. Experts in what is actually happening in a business can help
    to select relevant items for the analysis and highlight rules that are redundant,
    allowing you to focus on the more meaningful patterns. For example, if you know
    that everyone always buys a case with a new phone, then it could be worth ignoring
    this to focus on patterns that have not been realised. You should also take'
