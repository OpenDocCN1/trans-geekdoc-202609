    ## 神经网络


    神经网络是机器学习的一个分支，也是人工智能（AI）的基础。它们试图模拟大脑的工作方式，神经元之间不同的连接会响应输入并触发，从而产生输出。如果你看到一个球向你飞来（输入），你决定（神经元触发）是躲避还是接住它（输出）。


    这里给出的神经网络解释是简单的，旨在提供基础的理解。神经网络由节点层（也称为神经元）组成。一层的节点与相邻层的节点连接。其中一层是输入层，另一层是输出层。之间可能有一层或多层节点（如图14.2
    所示）。


    当节点接收到输入时，它将为下一层的节点提供一个值。该层中的每个节点将根据来自上一层的输入计算一个值，并将其发送到下一层。这种过程不断重复直到到达输出层，那里会返回结果。


    ## 图 14.2 神经网络


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_306_0.png)


    每个连接都有与其相关的权重。来自发送节点的值通过连接器的权重进行调整，下一层节点接收的是经过调整后的值。节点接收到的值然后被相加，并由该节点的唯一值（称为偏置，bias）进行调整。这决定了发送到下一层的值。在训练神经网络时，与每个连接相关的权重会发生，偏置也是如此。这些权重会不断调整，直到神经网络返回最佳结果为止。这种学习方法被称为反向传播。它通常与强化学习结合使用，强化学习通过与环境交互来实现奖励最大化。


    更复杂的神经网络版本用于生成式 AI 解决方案。这些网络有许多层，正是由于大量的层，导致它们被描述为深度学习。


    ## 人工智能


    NASA 描述 AI 是相对于通常由人类执行的复杂任务。AI 有时分为狭义人工智能（Narrow AI）和通用人工智能（General AI）。这是为了区分能够执行人类特定任务的
    AI 和能够执行人类所有任务的 AI（如图14.3）。


    ## 狭义人工智能


    狭义人工智能是为执行特定任务而设计的 AI。因此，它的能力范围很窄。在过去的一个世纪（2000年以前），如果你被要求判断哪些道路有坑洼，你可能需要查看道路图像来识别它们：这是一项人类任务。我们现在可以使用机器学习来完成这项。这项机器学习正在执行一项狭义的
    AI 任务。它可以识别坑洼，但不太可能发现缺失的屋顶瓦。它是


    ## 通用人工智能


    通用人工智能是可以处理人类可以的所有任务的 AI。在编写时，通用人工智能尚未被创造。超越人类能力的 AI 被称为超级人工智能（Super AI）。


    ## 生成式 AI


    生成式 AI 与通用人工智能的意义不同，尽管它们听起来非常相似。这种类型的 AI 被认为是创造性的，因为它产生了新的内容。根据所使用的模型，它可以是不同的形式，包括图像、文字和声音。生成式
    AI 不是通用人工智能，它仍然缺乏人类能力。例如大语言模型：这些是生成式 AI 的一种类型，可以创建预约语言或预约建议。


    图14.3 AI 定义的层级结构


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_309_0.png)


    ## 基础模型


    基础模型是生成式 AI 的形式。它们使用极大量的多样化数据进行训练。这创建了一个预训练并可以适用于不同用途的模型。结果是创建新应用程序比其他情况快得多，成本低得多。基础模型通过预测序列中的下一项来工作。在语言的情况下，这可能是下一个字母或单词。该序列随后形成可理解且有意义的语言。


    ## AI 风险


    我们将目光从 AI 世界风险风险转移，关注与 AI 输出相关的技术风险。主要风险可以总结为：


    - **偏差**：AI 是否产生了在某些方面存在偏见的输出？

    - **幻觉**：AI 是否虚构了内容，导致输出在某些方面是不正确的？

    - **透明度**：你是否理解 AI 是如何得出结果的？

    - **隐私**：你是否理解并同意你提供的数据被如何使用？


    在工作中使用 AI 时，了解贵组织关于 AI 的政策非常重要。这将有助于降低这些风险。


    ## AI 监管


    AI 监管有不同的方法。英国采取了“亲创新”的 AI 监管方法。这规定了五个原则，供监管机构在其特定领域内监管 AI 的使用（Department for
    Science, Innovation and Technology, 2023）。这些原则与上述风险对齐，并表达为：


