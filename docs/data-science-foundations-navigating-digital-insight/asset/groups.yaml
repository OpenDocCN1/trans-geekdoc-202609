    从与其相关的领域背景来看观察假设测试的结果，有助于我们理解这些结果。一个简单的例子可能是我们的销售预测：如果模型看起来很薄弱，是否可能是因为新冠肺炎期间行为的改变？另一个新冠相关的例子是第
    4 章讨论的 A-level 成绩预测。领域背景让我们看到，那些学生人数太少而无法预测成绩的学校都是私立学校。它还让我们意识到，某些学生在使用模型时可能会受到偏见的影响，因为他们无法获得老师认为他们理得的成绩。


    领域背景也有助于我们理解受众。他们对该领域的的理解程度如何？他们如何感知它？这些都是我们在传达发现时需要考虑的因素。如果我们的销售预测显示销售将远低于高管预期，或者某个有影响力的地区预测表现不佳，我们会如何改变沟通方式？我们的受众是人，我们需要意识到他们会对我们的沟通产生情感反应。


    # 从信息到知识


    当你将从假设测试中收集到的信息转化为知识时，你应该考虑什么？


    我们已经考虑了领域背景，但假设测试的结果本身呢？


    大多数模型会返回一组性能指标，以帮助确定你的模型的价值。确保你理解并正确解释这些指标。很有可能你的大多数受众将依赖你来完成这一点，因为他们不具备自己所需的技能和专业知识。可能的情况下建议让其他人检查或确认你的解释。


    一旦你解释了数据，你就需要考虑如何传达不可避免地与发现的模式和预测相关的相关的确定性。我们还需要将不可预测的外部因素加入模型的不确定性中。这里有两个值得考虑的点：


    - **模型的强度**：如果是一个强模型，这应该带来信心。如果是一个弱模型，还应该被使用吗？


    - **外部信息**：是否有其他信息支持或挑战该模型？


    同样值得，仅仅因为假设在测试中没有被证明，并不意味着这项工作没有价值。它的价值在于证明了某些被认为重要的事情其实并不重要。这意味着在决策和精力投入上可以将其排除或降低优先级，并将资源投入到寻找真正重要的事情上。例如，如果你的假设是增加对特定平台的广告支出会增加销售，而你无法证明这一点，你可以将这部分支出转向其他可以获得回报的平台。


    你可能还需要意识到所使用数据集的局限性，并在适当的情况下沟通这些局限性以及对结果的潜在影响。


    # 叙事故事


    围绕数据讲述故事的想法源于数据新闻。在数据新闻中，数据被用于发现故事也用于评估故事。然后根据数据讲述故事。故事为数据赋予了叙事性，反过来帮助受众理解所传递的知识。它在受众中产生情感反应，并作为行动的号召。


    19 世纪，古斯塔夫·弗莱塔（Gustav Freytag）提出了叙事金字塔模型，该模型已被应用于数据叙事中（Dykes, 2019）。在这个模型中，叙事由四个阶段和一个钩子（我们称为触发器）组成，其版本如图
    13.3 所示。


    # 图 13.3 数据叙事金字塔


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_289_0.png)


    这些阶段是：


    - **背景**：这是解释问题的背景。

    - **核心发现**：这些核心发现的信息。

    - **启示**：这是获得的洞察和知识。

    - **行动**：这是选项和建议的行动。


    **触发器**是导致调查问题的原因。


    在准备你的叙事时，思考叙事的主体。我们通常围绕数据科学家、他们执行的操作以及他们的发现来构建叙事。改变叙事的主体可以建立与受众建立更强的联系。该主体可以是一个人、地点、物体甚至是一个概念。构建背景故事不仅提供了背景，还是建立共情和信任的机会。


    我们可以对比呼叫中心性能调查的叙事：一个是数据科学家可能呈现的方式，另一个是以客户为主体并遵循叙事模型的。这列于表 13.1。


    表 13.1 呼叫中心性能调查的叙事对比


    | 以数据科学家为主体 | 以客户为主体 |

    |---|---|

    | 从源头获取了联系数据。 | 客户互动对我们的品牌很重要，特别是当客户遇到问题时。 |

    | 分析了客户满意度的趋势。 | 客户对呼叫中心的体验对他们的品牌感知和我们的净推荐值（NPS）很重要。 |

    | NPS 下降趋势。员工接触时间缩短与 NPS 之间的相关性。 | 客户推荐我们的意愿正在下降，并预计随着我们缩短员工处理接触的时间而继续下降。 |


    客户的满意度正在降低，这似乎是一个持续的趋势。这与每个客户的接触时间缩短有关。来自客户评论的定性反馈表明，缺乏时间导致了糟糕的体验。


    如果 NPS 的趋势继续，六个月后与我们的主要竞争对手相比，我们的客户体验将处于后四分之一。 | 增加呼叫中心的人员。 | 通过允许员工有更多时间处理每次接触可以提高我们的客户体验，从而增加品牌价值和
    NPS。建议对接触时间进行 A/B 测试以确定对 NPS 的影响。


    如果你还没有遇到过净推荐值，它是衡量客户向他人推荐一个组织的可能程度。A/B 测试是试验两种竞争性服务以确定哪种表现最好。在这种情况下，服务是通过允许的接触时间来区分的。注意故事中同时使用了定性和定量数据。来自调查的的定性反馈提供了证据，说明接触时间的缩短导致了客户满意度的下降。在思考你的叙事时，不要忘记，在需要时讲述客户故事时，数据科学中的细节仍然可以深入挖掘。

    '
