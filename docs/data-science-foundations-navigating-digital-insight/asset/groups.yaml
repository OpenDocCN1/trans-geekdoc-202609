    # RISKS IN STORYTELLING


    Within any set of data, many stories can be found. Back in Chapter 5 we discussed
    how the problem should be framed and the hypothesis developed. This determines
    to an extent the stories we will find in our data. Therefore, these are important
    steps in determining the story our data will tell. However, once we have gained
    the knowledge from testing the hypotheses, we still have choices around the story
    we tell. If you take our contact centre example, the story might have been one
    of how reducing contact time was expected to result in cost efficiencies.


    Selecting the right stories to tell can raise ethical questions. Have the stories
    people might not want to hear buried? In our contact centre, do people want to
    hear the story of declining staff welfare being correlated to shorter customer
    contact times?


    We also need to consider whether we are spinning a story to meet a particular
    end. If this is the case, then we are in the territory of propaganda: using a
    misleading data story to promote a particular point of view.'
