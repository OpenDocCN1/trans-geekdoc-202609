    Steve Mariadas 是某所理工学院的首席执行官，因向行业交付数据技能被皇家委员会授予教学奖金。Steve 热衷于培养每个人的数据人才。Ian Huke
    是一位独立顾问，在进入软件领域之前曾是一名体力工。他曾服务于初创公司和大型组织，参与了变革的方方面面。


