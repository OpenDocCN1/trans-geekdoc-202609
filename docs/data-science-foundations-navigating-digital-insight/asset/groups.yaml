    # 认知业务 (COGNITIVE BUSINESS)


    在 Cognitive Business 的背景下，在Ratcliffe-On-Sea，一家英国电站公司，数据科学家的出现是为了为Cognitive Business
    提供数据驱动的解决方案。预测性维护与电站不同，因为每个电站都具有独特之处。Cognitive Business 描述预测性维护涉及在故障发生之前，智能地识别何时发生故障。这允许预测性维护被应用于许多领域。


    第一个挑战是找到电站的数据。随着工作的进行，Ellie 和她的团队利用机器学习在数据中寻找模式。这允许他们构建了一个原型，并与全球金融公司分享。在顺序化的过程中结合几个不同的模型，会产生一组非常透明的输出。这意味着模型做出的任何决策或建议都有审计轨迹并可以证明合理。Ellie
    解释说，这不仅在监管方面（如果有人对自动决策提出）很重要，而且为了建立潜在客户的信心。Ellie 意识到，可以探索围绕福祉的广泛问题。在决定探索哪些问题时，团队提问了：


    - 监管允许他们做什么？

    - 理解问题将如何带来商业利益？

    - 个人会受到什么影响？


    Ellie 以心理健康为例：查看人们的财务数据可以用于预测抑郁症水平。在医疗环境中，这可能是有益的。但对于 Good With 来说，它没有价值，并且可能被侵犯或对个人产生其他不利。此外，还涉及到特殊类别数据（健康），增加了监管的复杂性，这意味着他们不会探索这一领域。


    在处理数据时，Ellie 强调了理解法规的重要性。她发现，虽然这可能会减慢工作速度，但这意味着项目没有在学会走路之前跑步，从而实现了更好的问题定义和见解。她还强调需要理解将数据科学应用于现实世界的影响，例如，更好的贷款决策可能会增加贷款，导致贷款者资金资金。


    # GOOD WITH


    Good With 是一家财务行为分析公司，其使命是改变人们评估信用的方式，促进金融包容并支持被金融服务排除或服务不足群体。Ellie 和她的同事深受自身金融排斥经历的驱动，并将共同价值观和心理学背景带入工作中。Ellie
    对数据科学的兴趣源于她作为心理学家进行的研究中应用统计技术，随后她转到全球金融公司的数据科学团队。


    Good With 开发了两个核心产品：衡量财务能力和预测借贷风险的替代评分，以及帮助人们培养金融养和管理资金情感方面的个性化学习之旅。该框架的个性化部分由画像（目标受众的代表）驱动。应用于这项工作的流程概述如下：


    最初的定性研究识别了年轻人的四种不同的财务画像。Ellie 想用数据科学的定量方法来验证这些画像。通过问卷和访问银行记录收集了大约 90 个个人的数据。数据经过了预处理，以探索关键特征之间的相关性。这包括使用自然语言处理对文本描述进行分类，以及查看账户余额低于
    0 英元的频率。下一步是查看特征是如何分组的，这些特征被加载到无监督机器学习聚类模型中，该模型识别了四个不同的群体。惊讶的是，这些群体与研究识别出的原始画像高度对齐。有了数据支撑画像，Good
    已经能够进行开发。

    '
