    **Definition:** Probability is the measure of how likely an event is to happen.
    It''s a number between 0 and 1, where:


    A probability of 0 means the event will definitely not happen.


    A probability of 1 means the event will definitely happen.


    A probability in between (e.g. 0.5) means there''s some chance the event will
