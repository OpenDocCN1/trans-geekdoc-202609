    ## Approaches to data science


    To better understand what data science does, we can split it into three main types
    of analytics: descriptive, predictive and prescriptive analytics. Each type represents
    a different stage of understanding and decision-making, and together they provide
    a powerful framework for making informed choices. In the earlier chapters we mentioned
    the different approaches in data analysis. Let''s revisit these terms.


    ## DESCRIPTIVE ANALYTICS: UNDERSTANDING THE PAST


    Descriptive analytics focuses on summarising historical data to understand past
    events. Techniques such as data aggregation, visualisation and basic statistical
    measures provide insights into trends and patterns. Descriptive analytics is similar
    to being a detective looking at what has happened: it involves analysing historical
    data to understand what has already occurred. The goal is to summarise and interpret
    data in a way that makes it easy to see trends, patterns and key insights.


    Applications:


    - **Business reporting**: Creating dashboards to envisage sales performance over
    time.

    - **Customer segmentation**: Analysing demographic data to identify key customer
    segments for targeted marketing.


    Examples of descriptive analytics:


    - A retail store analysing last year''s sales data to see which products sold
    the most.

    - A website tracking the number of visitors and their behaviour over the past
    month.

    - A hospital examining patient admission rates over the last year to identify
    seasonal trends.


    Tools and techniques:


    - Metrics such as averages, totals, percentages and trends.

    - Data visualisation tools such as bar charts, pie charts and line graphs.

    - Dashboards that summarise KPIs.


    Descriptive analytics helps you to paint a clear picture of the past, but it doesn’t
    explain why things happened or what might happen next.


    ## PREDICTIVE ANALYTICS: PEEKING INTO THE FUTURE


    Predictive analytics takes things a step further – it’s like using a crystal ball
    powered by statistics and machine learning to predict **what might happen** in
    the future. By analysing historical data, predictive models identify patterns
    and relationships that can help to forecast future outcomes.


    Think of predictive analytics as answering the question: what’s likely to happen
    next?


    Applications:


    - **Demand forecasting**: Anticipating product demand based on historical sales
    and market trends.

    - **Risk assessment**: Predicting credit default risks for loan applicants using
    financial history and behavioural data.


    Examples of predictive analytics:


    - An e-commerce platform predicting which customers are likely to make a purchase,
    based on their browsing history.

    - A weather app predicting tomorrow’s temperature and chance of rain.


    Tools and techniques:


    - Statistical models such as linear regression and time series forecasting.

    - Machine learning algorithms such as decision trees, random forests and neural
    networks.

    - Risk assessments and probability scores.


    Predictive analytics gives you a glimpse into the future, but it doesn’t tell
    you what to do with that information.


    ## PRESCRIPTIVE ANALYTICS: DECIDING WHAT TO DO


    Prescriptive analytics is the final and most advanced stage. It’s not just about
    understanding the past or predicting the future – it helps you to decide **what
    actions to take** to achieve the best outcome. Prescriptive models combine data,
    predictions and optimisations to recommend the best course of action.


    Think of prescriptive analytics as answering the question: what should we do about
    it?


    Applications:


    - **Pricing strategy**: Optimising prices for maximum profit while considering
    competitor pricing and customer price sensitivity.

    - **Supply chain optimisation**: Recommending inventory levels and logistics strategies
    to minimise costs and improve efficiency.


    Examples of prescriptive analytics:


    - A delivery company optimising routes to minimise fuel costs and delivery times.

    - A marketing team deciding which promotional emails to send to different customer
    groups to maximise conversions.

    - A hospital determining how to allocate resources during a busy flu season to
    ensure patient care.


    Tools and techniques:


    - Optimisation algorithms and simulations.

    - Decision trees and what-if analysis.

    - Advanced AI systems such as recommendation engines.


    Prescriptive analytics empowers decision-makers by providing actionable insights,
    often using real-time data.


    ## HOW THEY WORK TOGETHER


    To see how these analytic types work together, imagine you’re managing a coffee
    shop:


    - **Descriptive analytics**: You analyse last month''s sales data and learn lattes
    are your best-selling product.

    - **Predictive analytics**: You use this data to predict that latte sales will
