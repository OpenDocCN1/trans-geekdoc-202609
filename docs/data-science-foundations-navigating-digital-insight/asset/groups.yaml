    - **Hands-on research**: Immerse yourself in the environment where the data will
    be used or where it originates. This helps you to understand the cultural, social
    or organisational context that might affect your work.


    - **Case studies**: Study specific examples or cases that are relevant to your
    work. Analysing how similar problems have been addressed can provide valuable
    insights.


    ### Literature review:


    - **Academic papers and industry reports**: Read existing literature on similar
    projects, methodologies and technologies. This helps you to understand what has
    already been done by others and avoid reinventing the wheel.


    - **Best practices**: Identify and understand best practices using data and in
    your workplace. This can guide your approach and lead you to people that could
    help and advise.


    ### Qualitative data analysis:


    - **Thematic analysis**: Analyse qualitative data from interviews, focus groups
    or open-ended survey questions to identify common themes, patterns and insights.


    - **Content analysis**: Categorise textual data to quantify patterns or themes,
    which can then be combined with quantitative data for a richer analysis.


    ### Integrating different research:


    - **Cross-validate your findings**: Use both quantitative and qualitative methods
    to cross-validate your findings. For example, you might use qualitative insights
    from interviews to explain patterns you see in the quantitative data.


    - **Iterative process**: Let your qualitative research inform your quantitative
    approach, and vice versa. For instance, initial qualitative findings might help
    to refine your data collection or analysis methods.


    By combining both types of research, you''ll gain a deeper, more comprehensive
    understanding of your problem, the data and the best approach to arrive at a solution.
    This holistic view increases the chances of your results being successful and
    effective.


    # THINGS TO NOTE


    The world of data is rapidly changing the way we work. The ‘traditional’ methods
    of analysing and summarising data should be challenged. The sheer quantity of
    data available to us can be daunting, and knowing how to ‘pull’ the right parts
    from this will take some time and effort. Before you even think about extracting
    data, you should look into what data you could use. Qualitative data is much easier
    to handle than it ever used to be, especially when used with tools that AI can
    support. These views of data can add to or change the perceptions of management
    and the direction of the company strategy. If you are thinking even further ahead,
    question what other types of data there could be. Could images or video add any
    types of useful information and, if so, how do you get at that data as part of
    your sample?


    # SOURCING


    One of the key ingredients of data science is, as the name applies, data. As we
    have discussed in the previous chapter, the data used in any project can be the
    difference between a good outcome and a bad one. To be clear, a good outcome isn''t
    just proving a hypothesis. Failing to prove a hypothesis can be equally valuable,
    potentially avoiding making a poor decision based on a false premise.


    Sourcing data isn''t just about finding some data, it is about ensuring the data
    set contains the data items needed and has the right data properties to allow
    the analysis. In some instances, the source data might need to be manipulated
    to derive data. In [Chapter 8] we have an example of this in data granularity,
    where daily data is used to calculate a monthly figure.


    Remember, just because data is available, it doesn''t mean that you can use it.
    There are both legal and ethical constraints need to be considered. These are
    addressed in [Chapter 4].


    # BIG DATA


    Data is everywhere in the world around us. We are surrounded by the radio frequencies
    that carry data for the devices we use every day. This data permeates all aspects
    of our lives, whether it is checking social media or tapping a payment card to
    travel on the Tube. The acceleration in data has led to the term Big Data and
    three concepts relating to it: volume, velocity and variety. These are known as
    the 3Vs Figure 7.1, and can be useful in helping us to consider some of the challenges
    related to sourcing data.


    - **Volume**: This considers the amount of data that is generated. Think about
    how much data a quick coffee stop can generate. As you walk through the door,
    the security camera will record you, the coffee machine will log its use, your
    payment will be recorded and that''s all before you hit social media while you
    enjoy the caffeine hit. If you look at all the activities in a day that generate
    data, both human and attention automated, that''s a lot of data.


    - **Velocity**: Think about the speed at which the data is created and processed.
    The camera is a real-time recording, the payment is processed in the time it takes
    to say ‘thanks’, the coffee machine will instantaneously flag it if it needs attention
    (after all, time is money) and your social interaction is co-temporal. As you
    can see, much of the data around us is moving fast – very fast.


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_121_0.png)


    - **Variety**: We can see the variety of data being created. We have the unstructured
    data of video and social media alongside the structured data of the payment and
    internet of things (the coffee machine sending its data). If we want to use this
    data, we need to be able to store it and, and equally important, be able to access
    it.


    Other Vs have been added to the 3Vs, and reference is often made to the 5Vs.


    - **Veracity**: This relates to the quality and accuracy of the data. Data quality
    is covered in more detail later in this chapter.


    - **Variability**: Organisations might have inconsistencies in their data. Take
    employees: in one system this might refer to people with employment contracts,
    in another it might include agency staff.


    For us as data scientists, this all creates challenges in identifying and accessing
    the data we need. It can also cause issues as we address the constraints of storing
    and processing the data.


    # DATA COLLECTION


    We talked about several different sources of data when having our coffee break.
    These use different methods to collect the data:


    - **Cameras** record digital images, which are data. These can be video or still
    images.


    - **Sensors** automatically record data and frequently send it to a central data
    repository. This includes the coffee machine recording usage and flagging any
    issues.


    - **Transferred data** occurs when you add your favourite snack to the coffee,
    because the barista might scan the barcode on it, transferring data from the item
    to the point-of-sale system. The same is true when you tap your card to pay for
    it, your details on the card are read by the system.


    - **Human entry** via keyboards, mice, touch screens and other data entry devices.
    In the coffee shop, the barista might use a touch screen to record the sale of
    your coffee. You also enter data when you give the coffee shop a five-star review
    on the shop’s app.


    - **Derived data** is created when existing data is taken and manipulated to develop
    a new data set. The coffee shop might take all your coffee transactions and determine
    from this what customer persona you fit.


    - **Synthetic data** is created when a data set is artificially generated. This
    can be beneficial where there is limited real-world data or concerns exist about
    its quality. In some instances, rather than using actual customer data, an organisation
    will synthesise customer data to overcome privacy concerns.

