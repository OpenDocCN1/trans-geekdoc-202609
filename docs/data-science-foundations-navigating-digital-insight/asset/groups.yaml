    或者关于数据集中项目如何共同出现的的规则，并且它们特别擅长通过查阅海量数据来发现这些模式。


    ## 为什么选择关联规则？


    关联规则对于揭示隐藏关系和做出推荐非常有效，特别是在海量的零售或电子商务交易中。


    ## 统计模型：相关性


    ### 理解相关性


    当你想要理解某件事的发生是因为另一件事时——例如，当气温升高时人们是否会买短裤——相关性可以提供一个事物之间“关联”程度的视角。不过，有些问题需要领域知识来回答。哪个变量取决于另一个变量？人们是因为刀具犯罪增加才买更多的刀，还是因为买了更多的刀导致了刀具犯罪增加？


    ## 输出


    相关性量化了两个变量之间线性关系的强度和方向，表示为于 -1 到 +1 之间的相关系数。


    - **正相关**：两个变量向同一方向移动。随着其中一个增加，另一个也之增加。

    - **负相关**：变量向相反方向移动。随着温度下降，用于取暖的燃气增加。

    - **零相关**：不存在线性关系。


    ## 公式


    皮尔逊相关系数 $r$ 的计算公式为：


    $r = \frac{n \sum x_i y_i - \sum x_i \sum y_i}{(n \sum x_i^2 - (\sum x)^2)(n \sum
    y_i^2 - (\sum y)^2)}$


    其中 $x_i$ 和 $y_i$ 分别是变量 $x$ 和 $y$ 的数据点。


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_194_0.png)


    ## 它看起来是什么样的？


    相关性是谈论数据和统计时最过度使用的的术语之一。记者经常利用两个数据集的相关性来构建故事，只要这有助于证明某事的发生是某人的过错。


    让我们尝试看一个例子，观察电脑游戏时间如何影响学生的成绩。


    我们可以通过询问学生的学校考试成绩以及他们每周花费多少小时玩游戏来收集学生数据。数据可能如下：


    | 学生 | 考试成绩 | 游戏时长 |

    |---|---|---|

    | A | 45 | 5 |

    | B | 95 | 1.5 |

    | C | 63 | 3.5 |

    | D | 28 | 7.5 |

    | E | 78 | 2.5 |

    | F | 56 | 4 |

    | G | 64 | 4 |


    如果我们绘制这些数据，图表将为我们提供非常清晰的趋势，如图 10.2 所示。


    ## 图 10.2 游戏时长趋势图


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_196_0.png)


    使用相关系数公式，这两组数据的数值给出了 -0.97 的答案。由于该值只能在 +1 和 -1 之间，这表明存在非常强的负相关——玩游戏的时间越长，成绩越低。


    值得注意的是，“考试成绩”显示在垂直轴（y 轴）上，而“游戏时长”显示在水平轴（x 轴）上。使用 y 轴表示你认为随另一个变量而改变的变量是常规做法。在这种情况下，我们是在说成绩与游戏时长是对齐的。（你也可以认为“游戏时长”不是成绩的原因，但这是一个待讨论的问题。）


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_197_0.png)


    ## 自省 (KYD)


    相关性可能偶然发生在两个完全独立的事之间。例如，流电视节目的人数正在稳定增长，地球的平均表面温度也在上升。你可能在两者之间显示出正的“相关性”数值，但这并不意味着两者之间存在关系。理解数据的背景以及它们之间是否存在关系至关重要。


    你还应该意识到人们在没有任何支持信息的情况下就使用“相关”一词。不要害怕询问使用了哪些数据以及相关性究竟有多强（或多弱）。


    ## 业务案例


    营销团队使用相关性分析来识别广告支出与销售收入之间的关系，指导预算分配决策。销售受电视广告播放次数的影响吗？


    ## 统计模型：线性回归


    ### 什么是线性回归？


    想象你正在试图根据给植物的水量来预测它将生长多少。线性回归就像是在一组数据点中画一条直线，以显示这两者之间的关系。它帮助我们理解当一个事物变化时，另一个事物是如何变化的。


    线性回归通过对数据拟合线性方程，对连续目标变量与一个或多个预测变量之间的关系建模。


    ### 何时使用线性回归：


    - 预测结果：如果你想预测未来可能发生什么。

    - 理解关系：如果你想看事物之间如何关联。

    - 发现趋势：如果你能看到某种模式。


    ## 输出


    线性回归将产生一个方程；在这种情况下它是 $y = \beta_0 + \beta_1x + \varepsilon$


    其中：

    - $y$ 是预测值。

    - $\beta_0$ 是截距。

    - $\beta_1$ 是斜率（系数）。

    - $\varepsilon$ 是误差项。


    这告诉我们问题的规模以及起点在哪里。


