    # BASIC CONCEPTS


    In the world of data science, we often talk about data points, averages and trends.
    However, understanding the variability and uncertainty inherent in data is just
    as crucial. Measures of spread and probability provide us with the tools to just
    that. This chapter will explore these fundamental concepts in an approachable
    way, helping you to build a solid foundation for more advanced data analysis.


    # AVERAGES


    Mean, median and mode are measures of central tendency that summarise a data set
    with a single value representing the ‘centre’, or typical, value. Each measure
    has its own advantages and disadvantages, making them suitable for different types
    of data and analysis.


    Mean (arithmetic average)


    **Definition:** The mean is calculated by summing all the data points and dividing
    by the number of points. It is the most commonly used measure of central tendency.


    Advantages:'
  - '[PAGE 160]


    +   * Simplicity: The mean is easy to calculate and understand, making it a straightforward
    choice for summarising data.


    +   * Mathematically tractable: The mean is widely used in statistical analysis
    and mathematical modelling because it is algebraically manipulable.


    +   * Uses all data points: The mean considers all data points in the data set,
    providing a comprehensive measure of central tendency.


    Disadvantages:


    +   * Sensitivity to outliers: The mean is highly sensitive to extreme values
    or outliers, which can skew the result and provide a misleading representation
    of the data set.


    +   * Not suitable for skewed distributions: In skewed distributions, the mean
    may not accurately reflect the central location of the data.


    # Median


    **Definition:** The median is the middle value of a data set when it is ordered
    from smallest to largest. If there is an even number of data points, the median
    is the average of the two middle values.


    Advantages:'
  - '[PAGE 161]


    +   - Robustness to outliers: The median is not affected by outliers or extreme
    values, making it a more reliable measure of central tendency for skewed distributions.


    +   - Reflects the middle of the data: The median provides a true central value,
    especially in data sets with significant skewness.


    Disadvantages:


    +   - Ignoring data points: The median does not consider all data points, potentially
    overlooking variations in the data set.


    +   - Less mathematically convenient: The median is less amenable to algebraic
    manipulation and is not used as frequently in statistical modelling as the mean.


    # Mode


    Definition: The mode is the value that occurs most frequently in a data set. A
    data set can be unimodal (one mode), bimodal (two modes) or multimodal (more than
    two modes).


    Advantages:


    +   - Applicable to categorical data: The mode is the only measure of central
    tendency that can be used with nominal data, such as categories or labels.'
  - '[PAGE 162]


    +   - **Identifies most common value**: The mode highlights the most common value
    in a data set, providing insight into the most frequent occurrence.


    Disadvantages:


    +   - **Multiplicity**: A data set can have multiple modes or no mode at all if
    no value repeats, making it less informative in such cases.


    +   - **Less stable**: The mode is less stable than the mean or median, as small
    changes in the data set can lead to changes in the mode.


    Choosing the right measure


    +   - **Mean**: Best used with symmetrical distributions without outliers.


    +   - **Median**: Preferred for skewed distributions or when outliers are present.


    +   - **Mode**: Useful for categorical data or identifying the most common value
    in a data set.


    In practice, it is often beneficial to consider all three measures of central
    tendency to gain a comprehensive understanding of the data’s distribution and
    characteristics. Each measure'
  - '[PAGE 163]


    provides unique insights and can complement the others in data analysis.


    # MEASURES OF SPREAD


    Imagine you have a data set of exam scores for a class of students. While the
    average score gives you an idea of how the class performed overall, it doesn''t
    tell you how varied the scores are. Measures of spread help you to understand
    the diversity in your data.


    # Range


    The range is the simplest measure of spread. It is calculated by subtracting the
    smallest value in the data set from the largest value. For example, if the highest
    exam score is 95 and the lowest is 65, the range is 95 – 65 = 30. The advantage
    of using the range as a measure is that it is easy to compute and therefore understand.
    But be careful, the range can be misleading because it only considers the extreme
    values and these should be evaluated carefully.


    # Variance


    Variance gives a more comprehensive measure of spread by considering how each
    data point differs from the mean. To'
  - '[PAGE 164]


    calculate variance, you take each data point, subtract the mean, square the result
    and then find the average of these squared differences. A high variance indicates
    that the data points are spread out over a wide range, while a low variance suggests
    that they are clustered closely around the mean.


    # Standard deviation


    Standard deviation is simply the square root of the variance. It provides a measure
    of spread in the same units as the data, making it easier to interpret. In our
    exam score example, if the standard deviation is 10, you can say that most students’
    scores are within 10 points of the average.


    # Interquartile range (IQR)


    The interquartile range focuses on the middle 50 per cent of the data, making
    it a robust measure of spread that is less affected by outliers. It is calculated
    by subtracting the first quartile (25th percentile) from the third quartile (75th
    percentile). The ‘percentile’ is just a technical term for how far through the
    data values are, that, the 25th percentile is 25 per of the way through the data
    (or a quarter of the way). In practice, the IQR tells you how much the central
    portion of the data varies, providing insight into the core distribution of the
    data set.'
