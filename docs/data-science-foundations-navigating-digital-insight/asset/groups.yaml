    | 3 | Medium | A | Yes |

    | 4 | High | C | Yes |

    | 5 | Low | B | No |

    | 6 | Medium | B | No |

    | 7 | High | A | Yes |

    | 8 | Low | C | No |

    | 9 | Medium | C | Yes |

    | 10 | Low | B | No |

