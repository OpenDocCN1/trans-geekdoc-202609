  - '[PAGE 99]


    In framing the problem, it is important to understand the context of the problem
    and why it is an important problem. This often requires input from several different
    stakeholders, different people might have different perspectives.


    Let’s consider a music streaming company, we might have a problem with subscriptions.
    However, stakeholders might have different perceptions of that problem: the sales
    director might see it as one of attracting new subscribers, whereas the finance
    director could see it as one of retention because people don’t use the service.
    Framing the problem helps to resolve these differences.


    In this instance, what might the problem look like if the finance director prevails?
    The idea might be that the more a subscriber uses our services the less likely
    are to cancel their subscription. Therefore, if we make recommendations of music
    that subscribers enjoy, they will listen more and retain their subscription. Recommendations
    could be based on artist or recording label. In this instance, there are several
    questions to explore:


    +   - Does the amount of music streamed affect whether someone retains or cancels
    the service?

    - Does recommending music lead to people listening more?'
  - '[PAGE 100]


    +   • If someone likes artist, which other artists will they like?


    It is also helpful to consider the point at which the project will be complete.
    For our music streaming service, it could be when we know what factors increase
    listening and hence retention. But what if it can''t be demonstrated at what point
    you should stop working on the project? This could be defined in several ways,
    for example time-boxing the activity or setting resource limits. Time-boxing is
    where specific time is assigned to an activity, and that activity ends at the
    end of that time. Thinking about when the project should end before it starts
    is helpful to stop projects getting carried away and going past the point where
    they have no substantive value.


    # DEVELOPING THE HYPOTHESIS


    Based on the problem, hypotheses can be developed. A hypothesis is a theory that
    explains a situation that has not been proven, and it provides starting points
    for investigating the problem. Exploring hypotheses allows the problem to be better
    understood, and decisions to be made in relation to it. The hypotheses are tested
    through the creation of models, created from methods and data. These models allow
    the hypotheses to be investigated, providing insight into the problem.'
  - '[PAGE 101]


    If we look at our subscriber retention problem, the hypothesis might be simple:
    people who stream more are more likely to retain their subscription. However,
    this problem is quite general; how much streaming are we talking about, and what
    time periods are we considering?


    Our hypothesis could be:


    +   - Streaming more than eight hours of music in a month affects whether a subscriber
    will cancel their subscription in the following month.


    If this is proved, then further a hypothesis could be explored delving further
    into the problem. For example:


    +   - The greater the number of music recommendations made in a month, the longer
    a subscriber listens to music.


    And then


    +   - Recommending an artist that the subscriber has previously listened to affects
    whether the subscriber listens to the recommendation.


    A problem might have several hypotheses associated with it, which will be explored
    concurrently.'
  - '[PAGE 102]


    # EFFECTIVE ENQUIRY


    To define the problem and the resources needed to investigate it (along with any
    constraints), effective enquiry is required. This will involve both desk-based
    research and speaking to a range of stakeholders. Undertaking the desk-based research
    before speaking to stakeholders can be beneficial. It allows better questions
    to be asked of stakeholders and improves your credibility when talking to them,
    enhancing the quality of information gained and reducing the overall time and
    effort for everyone.


    A good starting point is to understand the domain of the problem. A good source
    of information on this is external news, and sector-specific and technical websites.
    You can then start looking at the specifics of the problem space using your organisation''s
    internal resources. These will vary across organisations: in some, it might be
    looking on the network to see what can be found, in others it will be consulting
    the intranet. Finding previous similar data science projects can be useful.


    When tools and data sources are located, some initial exploratory work will be
    helpful. This can help in identifying constraints and challenges that will need
    to be addressed.'
  - '[PAGE 103]


    Understanding these can help to frame the problem and the plan to explore it.
    There is no point embarking on a project that it isn’t feasible to deliver.


    There are different methods to engage with stakeholders. Two of the most common
    methods are interviews and workshops. Interviews are one-on-one conversations.
    They can be useful in building relationships, and they provide the opportunity
    for in-depth questioning. Workshops are a group activity and effective when information
    needs to be shared and consensus built. A discovery stage is likely to make use
    of both of these techniques. However, whichever you use, it is important to ensure
    you prepare properly so that they are effective and positive events. For interviews,
    preparation often takes the form of developing a question set to use. This will
    often comprise open questions, with more specific follow up questions, allowing
    an effective and informed challenge. For workshops, structuring how the time will
    be used and the interactions you will need can help to keep the workshop on track
    and people focused on the desired outcomes.


    # PRACTICAL TIPS


    +   - Take time to understand the domain of the project and the environment into
    which it will be delivered.'
  - '[PAGE 104]


    +   * Identify the skills and expertise needed to deliver the project.

    * Understand who will provide the skills and expertise: ‘the team’.

    * Determine the resources needed to deliver the project and whether they are available.

    * Frame the problem clearly and identify the hypothesis to be tested.

    * Think about potential sources of data and models that might be used.

    * Draw on other people’s knowledge and expertise.'
  - '[PAGE 105]


    # PROPERTIES OF DATA


    # THE IMPORTANCE OF THE RIGHT PROPERTIES


    History is littered with examples of decisions being made based on people’s gut
    feelings and things whispered in their ear. In the modern world we like to believe
    that we base our future on ‘data’ and can be more certain of what is likely to
    happen. Human psychology is a little book, but to make great decisions still requires
    the ‘right’ data.


    When managers use figures and percentages from a spreadsheet, they look at numbers:
    this key performance indicator (KPI) has been met; this is how well we are doing
    against our target and so on. We expect that everyone knows (and most people do)
    what 100 per cent means, and that meeting this means something. What about the
    words that people use, though? ‘That was a great outcome, ‘Awful customer service’,
    ‘I was really disappointed’’. How do we use the thoughts and words of different
    customers and colleagues to get a view of what is happening? Many times, this
    information can prove far more useful than just numbers on their own.'
  - '[PAGE 106]


    Knowing what type of data we are using is important and will lead us in a particular
    direction. Many of us are brought up dealing with numerical data, but there are
    so many different ways of gathering information in the modern world. Sometimes
    we avoid a way of doing things if it is too ‘difficult’ for us, and sometimes
    we are led into a method that could be completely wrong. An accurate, detailed
    report showing lots of figures just cloud the view of what is really happening
    when words and sentiment are far more useful.


