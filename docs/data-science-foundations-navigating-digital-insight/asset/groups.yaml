    # 故事的可视化


    我们已经讨论了故事如何辅助沟通，以及这需要良好的叙述。这可以通过有效的视觉化来支持。我们在第 11 章中已经探索了如何对数据进行可视化，但我们如何让故事视觉化呢？数据故事讲述的四大支柱概述了可以协助此设计的原则（Feigenbaum
    and Alamalhodaei, 2020）。这些支柱关注故事如何被视觉化，这已经超出了讲述故事时可能使用的图表（图 13.4）。


    - **符号**：这些经常被用于辅助沟通。开车在公路上，你会看到它们，无论是警告马匹的标志，还是学校斑马线标志。要发挥作用，符号需要与你的观众产生共鸣并与他们相关。不要仅仅因为符号看起来是个好主意就选择它；问问自己你的观众会如何看待它。


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_295_0.png)


    - **颜色**：这可以用于引起对重要内容的关注。例如，在一个查看团队预测数字的图表中，那些接受过培训的团队成员可以用不同的颜色显示。在这种情况下，它可能说明了额外培训对预期性能的影响。在使用颜色时，要考虑使用对比来辅助无障碍访问。人们赋予颜色赋予以意义——例如，绿色代表好，红色代表坏，或者蓝色代表冷，红色代表热。利用这些联想可以辅助沟通，如果忽视它们会引起混惑。考虑颜色关联中可能导致混惑的文化差异也很重要。如果我们创建了销售区域集群，我们可能会选择将表现最好的集群显示为绿色，最差的显示为红色。


    - **说明**：用于辅助故事讲述的符号可以有不同的含义，而说明有助于引导人们解释符号，从而帮助他们对所述故事的理解。在讲述我们的呼叫中心故事时使用不开心的脸有助于传达情感；然而，我们需要说明来区分客户和呼叫处理人员。


    - **编辑布局**：这是以支持叙述的方式安排故事的视觉元素。这可能是仪表板的布局、幻灯片演示的顺序，甚至是漫画连环的流程。


    图 13.5 故事分镜草稿


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_296_0.png)


    [图 13.5] 中的故事分镜草稿展示了四大支柱的使用。符号被用于说明叙述中的主题和主题；说明用于标记符号的含义；对比用于显示预测的 NPS 和可能影响客户满意度的额外呼叫时间。最后，编辑布局支持分五步讲述故事。


    # 建议


    建议通常源于对我们问题的调查和对我们假设的测试。然而，很容易针对调查揭出的某些问题提出建议，但这些建议并没有得到假设测试或其他证据的支持。


    回到我们的呼叫中心示例，我们建议增加联系时间以提高客户满意度。然而，从我们所进行的分析来看，我们并不知道事实是否如此。是的，满意度预计将继续下降，是的，联系时间与满意度之间确实存在相关性。这并不意味着较短的联系时间是客户满意度较低的原因。这是一种理论，因此建议进行
    A/B 测试以加理解。


    在提出建议时，要明确哪些是有据可的，哪些仅仅是理论。


    # 操作化


    当对知识有持续需求时，就需要对报告的生成操作操作。这可以通过重复你用于调查问题和测试假设的过程来实现。然而，为了提供良好的用户体验，这个过程可能需要改变。


    此时，回顾利益相关者的需求是好的。他们的需求可能与一次性调查不同。一个关键问题是他们多久需要一次报告以及何时需要收到。此外，所需信息的范围可能会改变。在这种情况下，需要重新定义问题。自动化该过程也可能有利，既可以加快生成，又能通过减少错误增加信任。


    # 实用技巧


    - 了解你的观众及其需求。

    - 考虑用户体验的所有方面。

    - 思考从你的模型获得的信息中可以推导出哪些知识。

    - 思考领域有助于从信息中产生知识。

    - 考虑故事的主体应该是谁或什么。

    - 规划你想讲述的故事以及你将如何构思它。

    - 注意不要只讲人们想听的故事，而不是应该讲述的故事。


    # 机器学习与人工智能


    在第 1 章中，我们回想了《终结者》中反乌托邦的未来：机器接管世界并决定消灭人类的未来。这一直是许多关于人工智能风险写作的参考点。但人工智能是什么？机器学习与它有何关系？数据科学又处于什么位置？


    正如我们遇到的许多其他术语一样，对“人工智能”这一术语并没有共识。英国政府通过其适应性和自主性来定义它（Department for Science, Innovation
    and Technology, 2023）。这是从技术和风险的角度来看 AI，该技术的适应性和自主特征使其难以解释、预测和控制。欧盟《人工智能法案》第 3
    节对 AI 的定义也采取类似的方法，该法也提到了适应性和自主性（European Union, 2025），这些特征允许 AI 系统对隐含和显式目标进行推断和行动。这两个定义都是为了监管
    AI 而制定的。从这些定义退一步，我们得到了一个更广泛的定义，NASA 简洁地表述为：


    人工智能是指可以执行通常由人类推理、决策、创造等完成的复杂任务的计算机系统（NASA, 2024）。


    因此，我们可以将 AI 视为一种适应性和自主性的技术，它执行以前由人类保留的任务。这包括了广泛的应用，从处理客户查询到创建视觉图像——在呼叫中心和创意活动中都承担了人类的角色。


    AI 目前建立在数字技术之上，其一个关键组件是机器学习（ML）。什么是机器学习？嗯，它是一种可以学习的机器。我们可以认为它是设计用于执行一项或多项任务的软件，它执行任务的次数越多，任务性能就越好（Mitchell,
    1997）。AI建立在复杂的机器学习技术之上，赋予了它适应和自主行动的能力。


    那太好了，但数据科学在其中的什么位置？数据科学是机器学习的基础。机器学习基于算法（基于代数、统计和概率）应用于数据——正如你所知，这就是数据科学。


    总结来说，数据科学方法用于开发机器学习。机器学习可以应用于数据科学问题并创建人工智能（图 14.1）。这意味着在某种程度上，这些术语可以互换，例如图像识别技术可以是数据科学的应用、机器学习的使用，或人工智能的一个示例。


    # 图 14.1 数据科学、机器学习与人工智能之间的关系


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_301_0.png)


    # 机器学习


    为了让机器学习工作，模型需要经过训练。只有在经过训练后，它才能用于预测。


    训练与预测


    为了让机器学习工作，模型需要经过训练。只有在训练完成后，它才能被用于预测。


