    ## 图 7.3 ETL 与 ELT


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_131_0.png)


    这两个过程的根本区别在于转换（数据准备）发生的位置。如果我们使用数据湖，很可能会使用 ELT。来自源的原始数据将被放入数据湖中。对于数据仓库和数据市，很可能会使用
    ETL，因为需要对数据进行转换，以确保加载到仓库或数据市中的数据质量。许多数据科学家倾向于使用 ELT，因为他们可以获取原始数据，这可能提供了更多的分析可能性。


    # 数据治理 (DATA GOVERNANCE)


    数据治理既涵盖了关于组织应如何使用和管理数据的战略决策，也涵盖这些策略的执行。对于成熟的组织，这些将在清晰的政策中列出，并配备有效的治理结构。作为一名数据科学家，你需要遵守这些政策；如果尚未建立这些政策，也应该考虑它们带来的收益。数据治理不仅能确保数据的安全使用，还能引导数据的高效利用。


    # 数据生命周期 (Data lifecycle)


    数据生命周期与第 3 章中探讨的数据分析生命周期不同。在这种情况下，关注的是数据本身的生命周期，而不是数据分析的生命周期。不同于人有七个阶段，数据有四个阶段。


    图 7.4 CRUD，数据的四个阶段


    数据生命周期通常被称为 CRUD（见图 7.4）。这源于应用于数据数据库的操作：创建（Create）、记录（Record）、更新（Update）和最后删除（Delete）。然而，在思考如何管理我们的数据时，这些概念对数据科学家来说也很有用。


    对于任何数据科学项目，我们都会从源数据中创建一个数据集。这些数据需要被存储（记录），并在项目过程中对其进行操纵和更新。一旦项目结束，且数据不再有其他用途，就应该将其删除。


    # 数据治理的益处 (Benefits of data governance)


    数据治理可以确保我们在数据生命周期的每个阶段都采取适当行动，从而获得安全且高效使用的高质量数据。


    - **安全性 (Safety)**：数据治理可以确保数据仅用于适当目的。这包括限制访问、强制执行存储要求以及为不再需要的数据提供机制。

    - **效率 (Efficiency)**：虽然数据无处不在，但我们可能会忘记使用数据所带来的成本。这些成本涉及数据准备和存储。良好的数据治理可以通过重用数据和删除不再需要的数据来促进数据的高效利用。这降低了准备成本和存储成本。


    # 数据质量 (DATA QUALITY)


    你可能还记得我们研究手机故障的项目。如果项目在分析中使用五年前的数据，你会觉得如何？如果来自现场销售人员的数据缺失呢？如果某人只有一些他们认为与组织手机相关的数据呢？在所有这些情况下，你很可能会对项目的结果持怀疑态度，至少起码是这样的。


    数据源的质量可以从三个维度来看（见图 7.5）：


    图 7.5 数据质量的三个维度


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_134_0.png)


    - **准确性 (Accuracy)**：问这些问题：数据集是否完整？其中的数据是否被正确记录？为了回答这些问题，你真的需要理解数据的领域背景。

    - **时效性 (Latency)**：数据集有多旧？它仍然具有相关性吗？这随背景而异：如果你处理的是普查数据，几年前的数据可能是有效的；如果你查看的是金融交易数据，几分钟甚至几秒钟都关重要。

    - **血缘 (Lineage)**：你知道数据源自哪里吗？它可以信任吗？许多人追溯家谱以理解起源和根源。数据血缘是关于理解数据的起源以及随着时间推移对其进行的任何更改。例如，如果你从英国国家统计局（ONS）获取了一个人口数据集，你就知道它的来源和质量。如果
    ONS 的数据取自你组织的数据仓库，你对对其进行过的任何更改了如吗？是否存在记录被删除或修改的可能性，并可能对你的项目产生不利影响？


    良好的数据治理可以帮助回答内部数据的这些问题。对于外部数据，开放数据可以帮助我们解决这些问题。对于其他来源，要做好功课：向商业供应商询问这些问题。


    在考虑数据质量时，问以下问题同样重要：这些数据与我的问题相关吗？它有助于探索假设吗？它可能是最新、准确且及时的数据集，但如果它不相关，就没有价值。


    # 元数据 (METADATA)


    简单来说，元数据是关于数据的数据。它可以帮助治理我们使用的数据，并在有效使用时，帮助我们识别良好的数据源。回到我们的手机分析，与之相关的元数据可能包括数据创建信息、最后更新时间、数据大小以及是否被分类为机密等信息。


    你可以看到，对于数据科学项目中使用的数据需要进行思考。数据极其丰富，挑战在于找到合适的数据集。在某些情况下，即使我们不自己收集数据，也需要创意。我们还需要意识到数据生命周期的迭代，获取数据可以导致发现的迭代和准备的迭代。


    # 实用技巧 (PRACTICAL TIPS)


    - 记住：垃圾进，垃圾出（garbage in, garbage out）。

    - 考虑不同的数据源及其优缺点。

    - 考虑数据质量是否足够。

    - 考虑你将如何导出、转换和加载数据。

    - 利用并遵循内部治理。

    - 检查使用数据是否符合伦理和法律。


    # 准备 (PREPARATION)


    准备让人想起厨师准备佳肴的画面。对你来说，这可能是以有序且受控的方式组合和混合成分的精密操作，也可能是一种更混乱的方法，将成分投入创造性的旋涡中。数据准备与此并不相似。它也被称为数据转换、操纵、清洗和整理（wrangling）——后者真正强调了为了分析而治理数据的挑战。


    在构建项目模型时使用的数据集和方法之间相互匹配是非常重要的。如果它们不对等，方法将失败或交付价值有限的结果。即使数据集和方法非常匹配，如果数据质量低，结果可能也是有限的。准备数据时，我们需要理解数据的格式和质量。然后我们可以考虑与使用数据相关的风险和问题，并采取措施减轻这些问题。在前期投入时间将获得丰厚的回报。


    粒度指的是数据的详细程度。如果我们考虑按时间记录数据，我们可以按每天或每小时进行记录。小时数据的粒度高于天数据。重要的是数据的粒度要与匹配


