    - 安全性、与稳健性；

    - 适当的透明度和可解释性；

    - 公平性；

    - 责任制与治理；

    - 可争议性和救济。


    美国在监管方面也采取创新方法。这可以与中国相比，中国对特定的 AI 产品（例如生成式 AI）进行监管。


    欧盟被认为在数据保护方面领先，在 AI 监管方面可能被认为了同样的做法。这是通过《2024年人工智能法案》实现的，该法案根据 AI 带来的潜在风险提供一系列控制措施。它还提议立法以便在
    AI 导致损失或损害时更容易寻求救济（欧洲议会，未注明日期）。


    ## 实用技巧


    - 以对你的受众有意义的方式使用数据科学、机器学习和 AI 的语言。

    - 考虑与每种特定 AI 用相关的风险。

    - 在采用复杂或昂贵的解决方案之前，考虑更简单、更便宜的方案是否同样有效。

    - 记住伦理和合法性与 AI 中的数据使用有关。

    - 检查贵公司关于 AI 使用的政策。


    ## 案例研究


    在本书中，我们包含了许多示例以帮助说明关键点并建立你对这些点的理解。这些示例本质上是简单的，并没有反映大多数数据科学项目的复杂性。为了更生动地描绘数据科学的实际应用，在这里包含了一些使用数据科学的项目案例研究。我们非常感谢愿意分享经验的公司和个人。在阅读这些案例研究时，你将看到书中讨论的许多主题变得生动。我们的贡献者还慷地分享了他们对数据科学和创业的建议，后者反映了数据科学在市场和组织内部创造的创新机会。


    ## 创新工厂


    Anwar 是一位真人秀明星星，对数据科学很感兴趣。在这种背景下，最好不要考虑《爱情岛屿》（Love Island）。相反，可以一下《创业之龙》（Dragons
    Den）或《鲨鱼坦克》（Shark Tank），但处于创新周期的早期，即人们将愿景变为现实——换句话说，开发他们的产品。他在《科学之星》（Stars of
    Science）中担任顾问，既负责技术方面，也同样负责业务方面。他提出问题：谁会买这个产品？为什么要买？


    《科学之星》帮助 Anwar 启动了他的第一项业务（使用声音检测来提醒听力障碍人士注意紧急情况）。他意识到识别声音中的模式有更广泛的应用，并创立了“创新工厂”（Innovation
    Factory）来以此为基础。


    创新工厂所在的伯明翰曾是汽车行业的核心，它仍然是一座汽车城。这可能导致拥堵，从而产生空气和噪音污染。Anwar 的理论是，车辆的声音可以用于检测交通，也可以用于估计污染水平。这导致了“交通耳朵”（Traffic
    Ear）的诞生，这是一种监测交通和污染的成本效益解决方案。


    Anwar 知道他需要收集大量的交通数据来构建算法并训练所需的模型。他并没有预料到会有如此困难。硬件非常简单：声学传感器、摄像头、空气污染传感器和一个中央处理器，以及一些微处理器、适配器和
    Wi-Fi。把它们装起来并不难，直到你需要将所有组件装进一个独立的盒子里，并将其放置在灯柱顶部，那里它将经受恶性天气的影响。


    数据的挑战在于对声音进行分类，以便模型能够识别车辆及其相关的排放。Anwar 或他团队的某人本坐在传感器下方，记录经过的每一辆车辆并将其与声音联系。在双行车道旁无论天气如何坐九个月，对任何人都没有吸引力。这导致了一种自动化这一过程的新颖解决方案：使用摄像头记录车辆细节，并使用这些数据对记录的声音进行标记。这使得能够构建分类模型，允许仅通过声音就能识别不同类型的车辆。其他数据（如速度和空气污染）也被用于开发基于声音的模型。


    这些模型并非存在于真空，它们的输出被输入到一个主模型中，然后由主模型进行分析，提供关于交通和污染水平的整体信息。Anwar 特别强调，所使用的模型受限于收集的数据。在这种情况下，数据集限制于行驶速度不超过每小时40英里的车辆（收集数据道路的限速）。因此，无法通过外推数据来估计以每小时60英里速度行驶的巴士所产生的污染。


    为“交通耳朵”开发的内核技术现在正应用于其他用例。一种是在铁路上。如何让动物离开铁路线并防止火车撞击它们？英国有鹿的问题，澳大利亚是大袋鼠，而印度是大象问题。答案是使用“交通耳朵”技术检测动物，然后用光和声音将它们赶走。这并不那么简单，因为不同的动物有不同的行为，反应方式也不同。需要检测动物的物种以及它们正在做什么；它们是在吃草还是在移动？Anwar
    开发了一种使用生成式 AI 的解决方案。当“交通耳朵”技术检测到动物时，它向 AI 播放几秒视频，AI 就能确定物种和它正在做什么。这会自动触发 20,000
    个设备中相应的响应。而且，是的，动物的反应会被存储，这样就可以利用互动数据来改进模型。


    Anwar 强调了规范性分析的重要性，将数据科学的结果与自动操作联系起来——在这种情况下，就是火车撞击它们的风险。当被请求建议时，他的核心信息是，数据科学（特别是
    AI）是一个快速发展的领域，你必须投资于自己的学习。


    ## 智能容器


    有人会说 Steve 拥有一份理想的工作，只需打开并进行几次测量。至于啤酒，必须得以某种方式处理掉。你可以想象随之而来的愉快气氛和狂野派对。奇怪的是，Steve
    对啤酒并不感兴趣，所以现实情况大不相同。位于南威尔士的 Smart Container 公司帮助公司查看供应链中难以获取的部分容器和产品正在发生什么。这包括酿酒厂以及他们运输饮料的桶。他们的技术跟踪并监测桶及其里面的饮料。通过听取客户的反馈，他们发现产品在桶中会变得碳化过度或碳化不足，这表明饮料质量存在问题或桶已损坏（有爆炸风险）。这提出了一个如何测量密封加压桶中液体碳化程度的问题。Steve
    挺身而出解决这个“黑箱”谜题。假设是可以使用超声波读数来确定填充水平，然后用这来确定碳化水平。文献审查显示关于该主题的信息非常有限。发现的信息来源很差（即它们不是来自经过验证的来源）。这意味着他需要自己收集数据。


