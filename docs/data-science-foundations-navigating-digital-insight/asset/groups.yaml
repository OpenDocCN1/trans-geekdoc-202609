    # VISUALISING A STORY


    We have discussed how a story can aid communication and how this requires good
    narrative. This can be supported by effective visualisation. We have already explored
    how to visualise our data in Chapter 11, but how do we visualise our story? The
    four pillars for data storytelling set out design principles that can assist with
    this (Feigenbaum and Alamalhodaei, 2020). These pillars look at how the story
    is visualised, which goes beyond the charts that might be used in the telling
    of the story (Figure 13.4).


    +   **Symbols**: These are frequently used to aid communication. Drive down a
    road and you will see them, whether it is a sign warning of horses or a school
    crossing. To be effective, the symbols need to resonate with your audience and
    be relevant to them. Beware of picking a symbol just because it seems a good idea;
    ask yourself how your audience would view it.'
  - '[PAGE 295]


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_295_0.png)


    +   **Colour:** This can be used to draw attention to important. For example,
    in a chart looking at forecast figures for a team, those team members who had
    received training might be shown in a different colour. In this case, it might
    illustrate the effect additional training has had on expected performance. In
    using colour, give thought to the use of contrasts to aid accessibility. People
    attach meaning to colour – for example, green for good and red for bad, or blue
    for cold and red for hot. Using these associations can aid communication and cause
    confusion if ignored. It is also important to consider any cultural differences
    in colour association that might cause confusion. If we created clusters of sales
    regions, we might choose to show the best cluster performing in green and the
    worst performing in red.


    +   **Captions:** The symbols used to aid storytelling can have different meanings,
    and captions help to guide people in interpreting the symbols and thus their comprehension'
  - '[PAGE 296]


    of the story being told. Using an unhappy face in telling our contact centre story
    helps to convey feeling; however, we would need a caption to distinguish the customer
    from the contact handler.


    +   **Editorial layout:** This is the arrangement of the visual elements of the
    story in a way that supports the narrative. This might be the layout of a dashboard,
    the order of a slide presentation or even the flow of a comic strip.


    Figure 13.5 Draft storyboard


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_296_0.png)


    The use of the four pillars is shown in the draft storyboard in [Figure 13.5].
    Symbols are used to illustrate the subject and themes within the narrative; captions
    are used to signpost the meaning of the symbols; contrast is used to show the
    forecast NPS and additional contact time that could make a difference to customer
    satisfaction. Finally, the editorial layout supports telling the story in five
    steps.'
  - '[PAGE 297]


    # RECOMMENDATIONS


    Recommendations will often flow from investigating our problem and testing our
    hypothesis. However, it is very easy to make recommendations to address something
    our investigation has revealed that are not backed up by the hypothesis testing
    or other evidence.


    Going back to our contact centre example, we recommend that contact time is increased
    to improve customer satisfaction. However, we don''t know that this is the case
    from the analysis we have undertaken. Yes, satisfaction is forecast to continue
    to fall, and yes there is correlation between contact time and satisfaction. That
    doesn''t mean that shorter contact time is the cause of lower customer satisfaction.
    It is a theory, hence the proposal of A/B testing to develop understanding.


    When putting forward recommendations, be clear as to which can be evidenced and
    which are only theories.


    # OPERATIONALISE


    Where there is an ongoing need for the knowledge, then there is a need to operationalise
    the production of a report. This might be through repeating the process you have
    used to'
  - '[PAGE 298]


    investigate the problem and test your hypotheses. However, this process might
    need to change to deliver a good user experience.


    At this point it is worth revisiting the stakeholder needs. They are likely to
    be different from a one-off investigation. A key question is how frequently they
    need the report and when it needs to be received. Also, the scope of the information
    required might change. In this instance, the problem will need to be reframed.
    There might also be benefit in automating the process, both to speed up its production
    and to increase trust by reducing errors.


    # PRACTICAL TIPS


    +   - Understand your audience and their needs.

    - Consider all aspects of the user experience.

    - Ask what knowledge can be derived from the information obtained from your models.

    - Thinking about the domain should assist in generating knowledge from information.

    - Consider who or what the subject of the story should be.

    - Plan the story you want to tell and how you will envisage it.

    - Beware of telling a story people want to hear, rather than the one that should
    be told.'
