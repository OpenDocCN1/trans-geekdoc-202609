    # Figure 2.1 Stakeholders in the research looking at the link between smoking
    and cancer


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_44_0.png)


    The question you might be asking is why each of the groups shown is a stakeholder
    in the analysis. The simple answer is that they all have a stake in undertaking
    the analysis and/or its outcome. The stakes in our example are:


    +   **Research institutes**: These are the institutes carrying out the analysis
    for the tobacco company. They are doing the work.'
  - '[PAGE 45]


    +   - Tobacco farmers: If the analysis shows (as it did) that smoking is harmful
    it could impact their businesses.


    +   - Health boards: The outcome of the analysis is likely to influence public
    policy and health care provision.


    +   - Cigarette production line workers: Like the tobacco farmers, their livelihoods
    could be impacted by the analysis.


    +   - Company directors: The analysis will influence decisions they make, and
    hence the future of the company.


    +   - Company shareholders: The return they get on their investment in the company
    could be impacted by the research.


    +   - Other tobacco companies: The findings of the analysis could impact their
    business in the same way as it impacts the tobacco company commissioning the analysis.


    +   - Smokers: If the analysis shows that smoking is linked to cancer, they might
    change their smoking habits. They also need to provide their data to make the
    data science happen.


    +   - Potential smokers: Like smokers, the findings might influence their view
    of smoking and ultimately whether they take it up or not. Their data is also needed
    for the research.


    +   - Health service providers: These are the bodies that provide health care,
    which might be public or private. Showing a link with cancer could impact how
    they treat patients with smoking-related cancers and the health care advice they
    give.'
