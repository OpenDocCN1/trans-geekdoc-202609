    # 分类 (CLASSIFICATION)


    理解分类


    分类是一种监督学习技术，用于将数据点归入预定义的类别或标签。它广泛应用于垃圾邮件检测、图像识别和医学诊断等领域。想象你有一盒混合水果。分类就像是将水果分堆——苹果放一堆，橙子放另一堆堆，依此类推。在数据科学中，它是根据特征将数据点归类为不同的组或类别。


