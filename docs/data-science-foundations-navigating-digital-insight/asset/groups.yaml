    # # DATA SCIENCE FOUNDATIONS

    Navigating digital insight

    Stephen Mariadas and Ian Huke


    While data science is powering most modern organisations its technical intricacies
    often remain confined to a few.


    Data Science Foundations provides foundational knowledge for newcomers to the
    field, building their confidence and understanding. This will enable effective
    project constructions through informed decision-making and action. In an accessible
    manner, this book provides explanations of concepts and methods in layman''s terms
    supported by examples. It includes a holistic view of data science covering the
    technical, ethical and delivery challenges illustrated by case studies.


    Aligned with industry-recognised qualifications, this is the definitive guide
    for aspiring data scientists, providing a solid foundation in data analysis techniques.


    +   * Written for the beginner: providing clear explanations in layman''s terms

    * Explanations supported by practical examples

    * Content aligned to data analysis qualifications

    * Covers the technical, ethical and delivery challenges


    A must-read companion for anyone eager to dive into data science.


    **Jake Wilson Phd, Data Scientist, GHSat Inc


