  - '[PAGE 353]


    **Outlier:** A data point that is significantly different from others – it can
    skew results.


    **Overfitting:** A modelling error that occurs when a model is too complex and
    learns noise in the training data, making it perform poorly on new data.


    **Pattern:** An arrangement or sequence of data normally found through examining
    a model.


    **PESTLE:** A framework for identifying external factors that might affect a project,
    the external factors being political, economic, socio-cultural, technological,
    legal and environmental.


    **Power interest grid:** A framework to help determine how to manage stakeholders
    based on their different levels of power and interest.


    **Predictive analytics:** Using data and statistical algorithms to forecast what
    might happen in the future.


    **Prescriptive analytics:** Analysing data to recommend actions – it tells you
    what to do based on predictions.'
  - '[PAGE 354]


    **Principles of data:** Used to describe high-level principles applied when discussing
    data – this has no formal definition but commonly encompasses the data analysis
    lifecycle and the concept of open, public, proprietary, administrative and research
    data.


    **Principles of user experience:** Useful, desirable, usable, valuable, accessible,
    findable, credible.


    **Proprietary data:** Data that is owned and controlled by an organisation.


    **Public data:** Any data that is publicly accessible – this does not imply a
    right to use it.


    **p-value:** A number that helps to determine the significance of results in hypothesis
    testing – a low *p*-value indicates strong evidence against the null hypothesis.


    **Qualitative:** Data that describes qualities or characteristics, for example
    colours, names and opinions.


    **Quantitative:** Data that can be measured and expressed as numbers, for example
    height, weight and age.'
  - '[PAGE 355]


    Ratio: A type of quantitative data with meaningful differences and a true zero,
    for example weight and height.


    Redaction: The blanking of data to preserve confidentiality.


    Research data: Data that has been collected for a specific study or experiment.


    Sampling: The process of selecting a small group from a larger population to study.


    Significance level: A threshold in statistics to determine if results are likely
    due to chance – commonly set at 0.05 or 5 per cent.


    Skew: A measure of how much a distribution leans to one side – positive skew means
    it leans right; negative skew means it leans left.


    Stakeholder: Anyone with an interest (stake) in a project or its outcome.


    Stakeholder wheel: A framework to help identify stakeholders.


    Standard deviation: A measure of how spread out the data points are from the mean
    – a low standard deviation means data points are close to the mean.'
  - '[PAGE 356]


    **Stem-and-leaf plot:** A method of displaying quantitative data that retains
    the original data values while showing the shape of the distribution.


    **Storytelling:** Using narrative to aid audience understanding.


    **Stratified:** A sampling method where the population is divided into groups
    (strata) before sampling to ensure representation.


    **Summary statistic:** A number that summarises or describes a set of data, like
    mean, median or mode.


    **Supervised learning:** Where the data is trained on is labelled or tagged.


    **Synthetic data:** Artificially generated data.


    **Tool:** Software used to build and analyse models.


    **Train and test data sets:** In machine learning, the training data set is used
    to train the model, while the test data set is used to evaluate its performance.


    **Transform:** Where data form or structure is changed.


    **Transparency:** The ability to understand how artificial intelligence has reached
    a result.'
  - '[PAGE 357]


    **Trend:** A pattern of changes over time.


    **Unsupervised learning:** Where the model learns by looking for patterns in unlabelled
    data.


    **User experience honeycomb:** A framework showing the seven principles of user
    experience.


    **Variability:** The inconsistency in data – one of the 5Vs.


    **Variance:** The average of the squared differences from the mean – it shows
    how much the data varies.


    **Variety:** A concept of Big Data highlighting the diverse range of data generated.


    **Velocity:** A concept of Big Data highlighting the speed at which data is created
    and processed.


    **Veracity:** The quality of data – one of the 5Vs.


    **Volume:** A concept of Big Data highlighting the vast amounts of data being
    created.


    **Waterfall:** A linear method of project delivery where activities are cascaded,
    one activity being completed before another starts.'
