    Using the formula for the correlation coefficient, the value for these two sets
    of data gives us an answer of -0.97. As the value can only go between +1 and -1,
    this shows there is a very strong negative correlation – the more hours spent
    gaming, the lower test score.


    It is worth noting that ‘Test score’ is shown on the vertical, or y axis and ‘Hours
    gaming’ is shown on the horizontal, or x, axis. It is normal practice to use the
    y axis for the variable that you think changes based on the other one. In this
    case, we are saying that the test scores are aligned to gaming hours. (You could
    also argue that ‘Hours gaming’ is not the cause of the test scores, but that is
    a debate to be held.)


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_197_0.png)


    ## KYD yourself


    Correlation can happen by chance between two completely independent things. For
    examples, the number of people streaming TV programmes is rising steadily, as
    is the Earth’s average surface temperature. You are likely to be able to show
    a positive ‘correlation’ figure between these two things but does not necessarily
    mean there is a relationship between the two things. Understanding the context
    of the data and whether there could be a relationship between them is absolutely
    critical.


    You should also be aware of people using the word ‘correlated’ without any backup
    information. Don''t be afraid to ask about the data that has been used and exactly
    how strong (or weak) the correlation is.


    ## Business example


    A marketing team uses correlation analysis to identify the relationship between
    advertising spend and sales revenue, guiding budget allocation decisions. Are
    sales impacted by the amount of television adverts broadcast?


    ## STATISTICAL MODEL: LINEAR REGRESSION


    ### What is linear regression?


    Imagine you''re trying to predict how much your plant will grow based on how much
    water you give it. Linear regression is like drawing a straight line through a
    bunch of data points to show the relationship between these two things. It helps
    us to understand how one thing changes when another thing changes.


    Linear regression models the relationship between continuous target variable and
    one or more predictor variables by fitting a linear equation to the data.


    ### When to use linear regression:


