    \  - 置信度 = 3/4 = 75%。\n- 如果客户购买保护壳，他们就会购买电池包：\n  - 置信度 = 3/4 = 75%。\n\n洞察：如果有人购买电池包，他们有\
    \ 75% 的概率也会购买保护壳，因此你可能想将这些物品放在一起。\n\n提升度 (Lift) 衡量了项目共同购买的可能性相对于独立购买概率的增加倍数。Lift\
    \ > 1 项目之间互补，而 < 1 则表明它们是替代关系。\n\n让我们为规则“电池包 → 保护壳”计算所有数据：\n\n### 1. 支持度 (Support)\n\
    1. Support(电池包) = 4/5 = 0.8。\n2. Support(保护壳) = 4/5 = 0.8。\n3. Support(电池包, 保护壳)\
    \ = 3/5 = 0.6。\n\n### 2. 置信度 (Confidence)\n1. Confidence = Support(电池包, 保护壳) /\
    \ Support(电池包)。\n2. Confidence = 0.6 / 0.8 = 0.75 (75%)。\n3. 解释：当人们购买电池包时，75%\
    \ 的人也买了保护壳。\n\n### 3. 提升度 (Lift)\n1. Lift = Support (电池包, 保护壳) / Support (保护壳)\
    \ × Support (电池包)\n2. Lift = 0.6 / 0.64 = 0.9375\n\n关键点：\n\n- Lift = 1：项目是独立的。\n\
    - Lift > 1：项目是互补的。\n  例如：薯片和莎莎酱经常一起购买，提升度可能是 3.0。\n- Lift < 1：项目是替代品。\n\n例如：可乐和百事可乐的提升度可能是\
    \ 0.5。\n\n从生成的结果中可以假设的一些事情（在 Apriori 中被称为剪枝）：\n\n- 如果 {项目 1} 不是频繁的，那么 {项目 1, 项目\
    \ 2} 就不可能是频繁的。\n- 如果 {项目 1, 项目 2} 不是频繁的，那么 {项目 1, 项目 2, 项目 3} 就不可能是频繁的。\n\n这些属性有助于减少需要检查的组合数量。\n\
    \n![](img/7ae4e3b756b64cea6e0099c9c3867e53_238_0.png)\n\n## 自审视\n\n关联规则挖掘中的一个常见错误是忽略数据的领域知识和背景。业务实际情况的专家可以帮助为分析选择相关项目，并突出冗余规则，让你能够关注更有意义的模式。例如，如果你知道每个人在买新手机时都会买保护壳，那么忽略这一点以关注尚未被发现的模式可能是值得的。你还应该注意可能影响结果的其他因素——季节性、地理位置和客户的人口统计特征都会显著改变购买习惯。\n\
    \n## 商业示例\n\n### 产品组合：杂货店使用关联规则挖掘来识别频繁购买的产品组合，为交叉促销策略和商店布局设计提供支持。\n\n- 零售：杂货店根据面包和牛奶经常被一起购买的发现，在货架上将它们放在一起。\n\
    - 电子商务：在线商店可能会根据购买相同商品的其他客户还购买了什么向你推荐产品。\n- 网页设计：网站设计师可能会根据用户的浏览行为将相关内容或广告放在一起。\n\
    \n## 可视化\n\n## 注意事项\n\n在向他人传递信息时，讲述故事是一种被证明有效的策略，但使用统计的力量也可以让你创建给观众留下深刻印象的可视化图。了解人们“喜欢”看什么，并确保他们“看到”正确的结论，是处理数据的关键部分——数字可以转化为故事，洞察可以跃而出。在本章中，我们将探索创建引人注目的可视化的艺术与科学，这不仅能传递信息，还能吸引观众。我们将涵盖关键考虑因素，讨论用户体验（UX）无无障碍，并强调清晰标签的重要性。\n\
    \n### 了解你的受众\n\n在开始选择或设计可视化图之前，了解谁将查看它至关重要。他们是精通数据的分析师，还是寻找快速洞察的业务高管？了解受众有助于你调整可视化图的复杂程度风格以满足他们的需求。分析师可能喜欢带有交互元素的详细可视化图。高管通常更倾向于具有清晰、简洁信息的高层概述。\n\
    \n## 选择正确的图表类型\n\n选择合适的图表类型就像为工作选择正确的工具。不同类型的数据和信息需要不同的视觉表示。\n\n![](img/7ae4e3b756b64cea6e0099c9c3867e53_241_0.png)\n\
    \n**柱状图**：这些图非常适合比较不同类别之间的数量。\n\n![](img/7ae4e3b756b64cea6e0099c9c3867e53_241_1.png)\n\
    \n**折线图**：它们是显示随时间变化的趋势的理想选择。\n\n![](img/7ae4e3b756b64cea6e0099c9c3867e53_241_2.png)\n\
    \n**饼图**：这些对于显示百分比或整体份额很有用。但要小心，因为饼图往往被过度依赖并用于错误的目的。\n\n![](img/7ae4e3b756b64cea6e0099c9c3867e53_242_0.png)\n\
    \n**散点图**：这些非常适合说明变量之间的关系。\n\n简化，简化，再简化\n\n在可视化方面，少往往即是多。通过关注最重要的数据点并移除不必要的元素来避免杂乱。简单不仅提高了清晰度，还能让你的可视化图更美观。\n\
    \n明智使用颜色\n\n颜色可以是你工具箱中强大的工具，但必须谨慎使用。坚持一致的配色方案，并使用颜色突出关键信息，而不是让观众崩溃。\n\n- **色彩色彩**：保持可视化图的一致性以便解释。许多机构都有自己的“主题”或“调色板”。\n\
    - **对比色**：使用对比来吸引对数据点的注意。\n\n## 数据可视化的用户体验\n\n直观设计\n\n有效的可视化图应该是直观的，让用户快速获取信息。逻辑清晰地安排元素，并确保信息的流动是自然的。\n\
    \n- **层级**：组织元素引导观众的眼睛看向最重要的信息。\n- **留白**：策略性地使用留白分离元素并提高可读性。\n\n交互性\n\n交互元素可以通过允许按自己的节奏探索数据来增强用户体验。考虑加入工具提示、过滤器和缩放功能以提供更丰富的体验（图\
    \ 11.1 和 11.2）。\n\n![](img/7ae4e3b756b64cea6e0099c9c3867e53_244_0.png)\n\n图 11.1\
    \ 工具提示：在悬停在数据点上时提供额外信息\n\n![](img/7ae4e3b756b64cea6e0099c9c3867e53_244_1.png)\n\
    \n图 11.2 过滤器：允许用户自定义视图并关注特定的数据集\n\n响应式设计\n\n在当今的多设备世界中，确保你的可视化图是响应式的，并且从桌面电脑到手机的所有屏幕尺寸上看起来都很良好。\n\
    \n"
