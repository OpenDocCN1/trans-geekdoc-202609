    # CLASSIFICATION


    Understanding classification


    Classification is a supervised learning technique used to categorise data points
    into predefined classes or labels. It is widely applied in applications such as
    spam detection, image recognition and medical diagnosis. Imagine you have a box
    of mixed fruits. Classification is like sorting fruits into piles – apples in
    one pile, oranges in another and so on. In data science, it’s about categorising
