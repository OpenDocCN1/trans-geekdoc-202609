    Scale


    When we measure things, we use different units of measurement, and these often
    have different ranges. For example, in measuring age we normally use years, and
    this range might be 0 to 120, if you are very lucky. In measuring daily mobile
    phone usage, the unit could be minutes and the range 0 to 1440, if you are an
    insomniac. Differences in the ranges of data can cause models to give undue weight
    to some attributes. In these circumstances, the data is scaled so that the'
  - '[PAGE 147]


    ranges across the attributes are the same. This then gives them equal weight in
    the model. There are different techniques to do this, referred to as feature scaling.
    Each attribute (referred to as a feature) is replaced with a value, often with
    a range between 0 and 1 or -1 to 1. In our example, using range of 0 to 1, if
    we had an age of 120 and scaled it, it would result in a 1. If the age is 60,
    the value would be 0.5. A1 would also be returned when someone spent 24 hours
    on the phone in a day. If they spent an hour, it would be a 0.042 (to three decimal
    places). This is often referred to as normalisation.


    If we wanted to investigate phone faults using age and time the phone is in use,
    then feature scaling this data would ensure that the model is not influenced by
    time on the phone having a greater range than age.


