    two variables, expressed as a correlation coefficient between –1 and +1.


    - **Positive correlation**: Both variables move in the same direction. As one
    goes up, so does the other one.

    - **Negative correlation**: Variables move in opposite directions. As the temperature
    drops, more gas is used for heating.

    - **Zero correlation**: No linear relationship exists.


    ## The formula


    Pearson’s correlation coefficient, $r$, is calculated as:


    $r = \frac{n \sum x_i y_i - \sum x_i \sum y_i}{(n \sum x_i^2 - (\sum x)^2)(n \sum
    y_i^2 - (\sum y)^2)}$


    where $x_i$ and $y_i$ are data points for variables $x$ and $y$, respectively.


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_194_0.png)


    ## What does it look like?


    Correlation is one of the most over-used terms when talking about data and statistics.
    Journalists will quite often use the correlation of two data sets to build a story
    when it helps to justify that it is it someone’s fault for something happening.


    Let''s try an example of looking at how time spent on computer games affects student
    grades.


    We can gather data on students by asking for their test grades at school and also
