    data has been anonymised, it is often still possible to identify someone, for
    example combining anonymised mobile phone with geolocation data from, say, a tweet
    can identify the user of the phone (Palmer, 2013). Therefore, this GDPR exemption
    should be used with caution.


    ## Access controls


    If you want to ensure someone doesn’t misuse data, then a good way to stop it
    is to prevent them gaining access to the data in the first place. Access controls
    can be applied to both where data is stored and where it is reported. Many organisations
    have policies that set out who can access data and how permissions to access it
    are granted.


    ## PRACTICAL TIPS


    - Ethics and lawfulness are different, although they often align.

    - Ethics are not defined and can change with context and time.

    - Data regulation is based on principles that need interpretation, not on rules.

    - Other laws, not just data protection, govern the use of data.

    - Make sure you understand your organisation’s policies on the use of data.

    - Consider the ethical and lawful use of data at the start of the project.

    - Keep the ethical and lawful use of data under review throughout the project.


    ## DISCOVERY


    When an organisation kicks off a data science project, one person is normally
    made accountable for its delivery: the sponsor. They might be the person who came
    up with the idea or someone to whom the responsibility has been delegated. One
    of their roles is to initiate the project.


    The first step in the data analysis lifecycle is discovery. Discovery is when
    the project is investigated to understand its objectives, scope, resource needs
    and constraints. Constraints might be time, financial, technology and, of course,
    data. An important part of discovery is determining whether the project is feasible.
    This includes not only whether it is worth doing, but also whether it has the
    resources (including expertise) to deliver it. Sometimes this will be referred
    to as a feasibility study.


    The scope and scale of discovery will vary. Before starting a project, it is worth
    spending time to consider what it will take to deliver, the challenges you might
    encounter, whose help you''ll need and ultimately whether it is worth doing. It
    could save you a lot of angst and heartache. This is true both for a simple sales
    forecast and pharmaceutical research, although in the latter case discovery is
    likely to be a significantly larger undertaking.


    Discovery is the time to start looking at stakeholders. Important stakeholders
    in the project we haven’t yet considered are the delivery team.


    ## THE TEAM


    To help identify who should be in the team, we think about roles involved in a
    data science project and the skills and expertise they bring. The descriptions
    we have used are generic, and different organisations might have their own role
    titles and definitions. In looking at this, we should remember that one person
    might play many, if not all, the roles. For larger projects, such as pharmaceutical
    trials, the roles might be broken down further with greater specialisation within
    them. When identifying the team, you might want to consider the data analysis
    lifecycle and who you will need help from in each step to make the project a success.
    Roles you might find on a project are illustrated in Figure 5.1 and include:


    - **Sponsor:** They set the direction of the project through defining its objectives
    and scope. This is likely to be a senior person, accountable for the project.
    In the setting of direction, the sponsor is likely to consult with others.


    Figure 5.1 Generic data science project roles


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_94_0.png)


    - **Subject matter expert:** They provide the domain knowledge. They are key to
    the definition of the problem, understanding the data and analysing the results.


    - **Researcher:** In some instances, work will need to be undertaken to gather
    the data needed for the project. This could be through studies, experiments or
    surveys. Often, the data has already been collected.


    - **Data engineer:** They will transform the data and make it available in standard
    formats and to a certain quality. This is often the extraction of raw data from
    its sources and then transforming and loading it into a warehouse for analysis.
    However, you will still need to prepare the data to ensure that it meets the needs
    of the project.


    - **Data architect:** They define the environment (both technical and non-technical)
    in which the project takes place. For example, they might determine where the
    data can be stored to ensure it is secure. The creation of the environment might
    be undertaken by a technician.


    - **Data compliance officer:** Compliance ensure that the data is used in line
    with regulations and the organisation’s policies. This can be in the form of setting
    policies and operating procedures to ensure compliance.


    - **Project manager:** They facilitate the activity required to deliver the project.
    Collaboration between the stakeholders is key to the success of most projects,
    and the project manager can play an important role creating an environment that
    encourages and supports this.


    - **Data scientist:** They identify the data and methods required, build and analyse
    the models created and communicate the findings.


    In putting the team together, it is worth considering who will provide a check
    and challenge on the models used. Having this process reduces the risk of models
    being used inappropriately and invalid conclusions drawn.


    Many organisations have the role of data analyst. A data analyst might be seen
    as focusing on the descriptive analytics (reporting what has happened), although
    many data analysts take the role of the data scientist in projects.


    We should not forget that data science projects can take place as part of a wider
    programme of work and that other roles will be involved in delivering that programme.
    For example, change management and IT/development operations (DevOps) might be
    involved in operationalising the findings.


    ## UNDERSTANDING THE DOMAIN


    It is said that nothing exists in a vacuum, and that is true of data science.
    It is important to understand the context to properly understand the problem –
    this is often referred to as domain context. The context helps to determine the
    scope and objective of a project. It provides a context in which to understand
    the data used and models created. The PESTLE framework discussed in Chapter 2
    is a useful tool for understanding the external domain of a project.


    Consider how the domain context could differ if the organisation is an emergency
    response organisation, phones used in extreme conditions and reliability could
    be a matter of life or death. This domain is very different from many other organisations.
    Likewise, the way the results will be communicated is likely to change if the
    managing director initiated the request rather than the phone manager. The managing
    director will have different drivers and knowledge from that of the phone manager.


    ## RESOURCES


    We have already talked about the people needed to deliver a project. Other resources
    that are required include the tools and infrastructure needed to undertake the
    analysis and, of course, the data itself.


    In many instances, you will be constrained in relation to the tools and infrastructure
    available to you – you will need to work within the existing data architecture
    of your organisation. However, it is beneficial to consider what is available
    and how well that meets the needs of the project. This might highlight challenges
    that will need to be addressed by the project. For example, you might need to
    resolve issues of data storage and computational power, or the tools might not
    provide the capabilities needed to easily prepare the data, or the methods they
    support might be limited.


    It is also essential to understand the potential sources of data. This might throw
