    For our example: Next Difference = 30 + (-10) = 20


    **Undo the differencing**: To get the actual forecasted sales for Week 8, we add
    the predicted difference (+20) to the sales from Week 7 (630):


    Week 8 Sales = 630 + 20 = 650


