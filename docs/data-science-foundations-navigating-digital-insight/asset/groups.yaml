    ## BAR CHART


    ### What is a bar chart?


    Bar charts are one of the most common and versatile types of visualisations, used
    to compare quantities across categories. They display rectangular bars with lengths
    proportional to the values they represent (Figure 11.3).


    ### When to use bar charts


    - **Comparing categories**: They are ideal for showing comparisons between discrete
    categories, such as sales across different regions.

    - **Display counts**: They are useful when illustrating the frequency of different
    values in a data set.


