    - **移动端友好布局**：针对小屏幕设计时要考虑触摸交互。


    ## 数据可视化的可访问性


    - **色盲考虑**：大约有 8% 的男性和 0.5% 的女性患有视觉异常（美国视光学协会，2024年）。为了让你的可视化结果具有可访问性，请考虑使用色盲友好的色板，并避免仅依赖颜色来传递信息。


    - **色盲友好色板**：现代应用程序中提供了许多工具，包含了专为无障碍设计的调色板。


    - **替代标记**：除了颜色外，还使用模式或形状来区分数据点。


    ### 文本和字体大小


    确保可视化中的所有文本都是清晰可见的。使用清晰的无衬线字体，并避免过小的字体。


    - **最小字体大小**：保持字体大小在 12 点以上以确保可读性。


    - **对比度**：确保文本与背景颜色之间有足够的对比度。


    ### 描述性文本和替代文本


    为依赖屏幕阅读器的用户加入描述性文本和替代文本（alt text）。这确保了你的可视化结果对视障人士也是可访问的。


    - **描述性标签**：为图表和图形提供上下文和解释。


    ### 数据可视化中的标签


    使用清晰简洁的标签。标签是数据可视化的无名英雄。它们提供了必要的上下文，并帮助用户理解他们正在看的内容。


    - **轴标签**：清晰地标记坐标轴以指示所代表的数据。


    - **数据标签**：在需要清晰时，为数据点添加标签。


    - **避免标签重叠**：确保标签不会重叠或使可视化界面混乱。这会导致数据难以解释，并损害整体设计。


    - **智能放置**：使用算法智能定位标签，避免重叠。


    - **图例使用**：当空间有限时，使用图例来解释颜色或符号。


    ### 一致性与格式


    在整个可视化过程中保持标签格式的一致。这包括字体选择、大小和对齐方式。


    - **统一风格**：对所有标签应用一致的样式以获得视觉统一的效果。


    - **对齐**：整齐地对齐标签以增强可读性和审美吸引力。


    ## 柱状图


    ### 什么是柱状图？


    柱状图是最常见且多功能的可视类型之一，用于比较不同类别之间的数量。它们显示矩形条，其长度与所代表的值成正比（图 11.3）。


    ### 何时使用柱状图


    - **比较类别**：它们是展示离散类别之间比较的理想选择，例如不同地区的销售情况。

    - **显示计数**：在说明数据集中不同值的频率时非常有用。


    记住：通过限制类别数量和使用一致的配色方案来保持柱状图简单，避免让观众感到无从。


    ### 图 11.3 每月销售示例柱状图


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_248_0.png)


    ## 直方图


    ### 什么是直方图？


    直方图与柱状图类似，但专门用于显示连续数据集的分布。它们将数据划分为箱（bins）或区间，显示数据点落在每个区间内的频率（图 11.4）。直方图的形状提供了数据在数值范围内分布情况的视图。


    ### 何时使用直方图


    - **理解分布**：它们是可视化连续变量（如考试成绩或年龄）分布的完美选择。

    - **识别偏度**：它们对于发现数据中的偏度或离群值非常有用。


    记住：选择合适的箱宽，以确保直方图准确代表数据分布而不丢失细节。


    ### 图 11.4 示例直方图


    ### 学生考试成绩分布


    每个条代表一个分数的范围（例如 70-79）

    高度显示频率

    （发生次数）


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_250_0.png)


    ## 折线图


    ### 什么是折线图？


    折线图使用由线连接的点来表示随时间变化的数据点。它们是可视化连续数据趋势的完美选择（图 11.5）。


    ### 图 11.5 示例折线图


    ### 每月销售表现

    显示随时间或序列变化的趋势


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_251_0.png)


    ### 何时使用折线图


    - **追踪随时间的变化**：它们是展示变量随时间变化的理想选择，例如股价或温度。

    - **比较多个系列**：它们有助于在同一张图上比较多个数据系列。


    记住：使用不同的线条样式或颜色来区分同一张图上的多条线，以确保清晰度。


    ## 面积图


    ### 什么是面积图？


    面积图类似于折线图，但线下的区域被填充了，强调了随时间变化的幅度。它们是可视化累积数据的极佳工具（图 11.6）。


    ### 图 11.6 示例面积图


    ![](img/7ae4e3b756b64ceae0099c9c3867e53_252_0.png)


    ### 何时使用面积图


    - **显示随时间变化的趋势**：它们用于说明趋势并比较随时间变化的多个数量。

    - **可视化部分与整体的关系**：它们是展示各个部分随时间如何对整体贡献的理想选择。


    记住：在重叠的面积图中使用透明度，以确保可见性。


    ## 散点图


    ### 什么是散点图？


    散点图使用连接的点来表示随时间变化的数据点。它们是可视化两个变量之间关系的完美选择（图 11.7）。


    ### 图 11.7 示例散点图


    ![](img/7ae4e3b756b64ceae0099c9c3867e53_253_0.png)


    ### 何时使用散点图


    - **探索关系**：它们非常适合展示变量之间的关系或相关性。

    - **识别离群值**：它们是发现偏离模式的理想选择。


    记住：为你的散点图添加趋势线以突出整体方向。


    ## 箱线图


    ### 什么是箱线图？


    箱线图（或须须图）通过显示最小值、第一分位数、中位数、第三分位数和最大值对数据进行总结。它们是可视化数据离散程度和偏度的极佳工具（图 11.8）。


    ### 图 11.8 示例箱线图


    ![](img/7ae4e3b756b64ceae0099c9c3867e53_255_0.png)


    ### 何时使用箱线图


    - **比较分布**：它们对于比较不同类别的分布非常有用。

    - **识别离群值**：它们是识别数据集中离群值的理想选择。


    记住：当你有多个数据集需要比较时，箱线图非常有帮助，因为它们为每个分布提供了清晰的总结。


    ## 热图


    ### 什么是热图？


    热图用颜色表示矩阵格式的数据值，使复杂的关系变得可见。你可以轻松看到数据中的“热点”（图 11.9）。


    ### 何时使用热图


    - **可视化相关性**：它们是展示相关矩阵或多个变量之间关系的完美选择。

    - **突出模式**：它们对于发现大型数据集中的模式、趋势和异常非常有用。


    ### 图 11.9 示例热图


    ![](img/7ae4e3b756b64ceae0099c9c3867e53_256_0.png)


    记住：选择一种清晰区分低值和高值的颜色梯度以增强可读性。


    ## 茎叶图


    ### 什么是茎叶图？


    茎叶图以半表格的形式显示定量数据，在保留单个数据点的同时将它们组织成茎和叶。它们对于小型数据集特别有用。茎是数据数值的第一部分，叶显示单个数值的末部分，例如在图
    11.10 中，茎 1 和叶 0 显示数据点 10（我们可以快速看到有四个 87 的数据点）。


    ### 何时使用茎叶图


    - **探索小型数据集**：它们是在保留原始数据值的同时可视化小型数据集的理想选择。

    - **理解分布**：它们有助于快速可视化数据的形状和分布。


