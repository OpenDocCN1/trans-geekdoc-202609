    those with and those without potholes.


    If you think about it, supervised learning is great when you know what you are
    looking for, in our case potholes. Unsupervised learning might not be as effective
    in these cases. For example, when looking at the images of roads, it might detect
    patterns relating to whether there are pavements or the time of day the images
    were captured. However, unsupervised learning comes into its own when you are
    unsure what you are predicting, for example if you are looking for patterns to
    help find faults and don’t know what those faults look like.


    These methods can be combined to enable the benefits of both supervised and unsupervised
    learning to be realised.


    ## DATA SCIENCE AND MACHINE LEARNING


    Data science is used to develop ML. If you look at our image recognition example,
    you can see some of the data science methods we have explored being. In unsupervised
    ML, classification is used to identify the potholes. In our unsupervised ML, we
    are using clustering to determine the state of the roads.


    ## NEURAL NETWORKS


    Neural networks is a branch of ML, and is fundamental to AI. They look to model
    how the brain works, with different connections between neurons firing in response
    to inputs, leading to outputs. If you see a ball coming towards you (input), you
    decide (neurons firing) whether to duck or catch it (the output).


    The explanation of neural networks given here is a simple one, to provide a basic
    understanding. A neural network consists of layers of nodes (also known as neurons).
    The nodes in one layer are connected to the nodes in the adjoining layer. One
    layer is the input layer and one layer is the output layer. There may be one or
    more layers of nodes in between (Figure 14.2).


    When a node receives an input, it will provide a value to the nodes in the next
    layer down. Each node in that layer will calculate a value based on the inputs
    from the previous layer and send this to the next layer. This repeats until the
    output layer is reached, which is where the result is returned.


    ## Figure 14.2 A neural network


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_306_0.png)


    Each connection has a weight associated with it. The value from the sending node
    is adjusted by the weight of the connector, and it is the adjusted value that
    is received by the node in the next layer. The values received by a node are then
    added up and adjusted by a unique value for that node called the bias. This determines
    the value sent to the next layer down. In training the neural network, the weighting
    associated with each connector is changed, as is the bias. These are adjusted
    until the neural network returns an optimum result. This approach to learning
    is called back propagation. It is often used with reinforcement learning which
    interacts with an environment to maximise rewards.


    More complex versions of neural networks are used in generative AI solutions.
    These networks have many layers, and it is the huge number of layers that leads
    the use of them being described as deep learning.


    ## ARTIFICIAL INTELLIGENCE


    NASA describes AI in relation to complex tasks normally performed by humans. AI
    is sometimes split into narrow AI and general AI. This is to distinguish between
    AI that can do specific tasks a human can do and AI that can do all the tasks
    a human can do (Figure 14.3).


    ## Narrow AI


    Narrow AI is AI that is designed to perform a specific task. As such, it only
    has a narrow range of capabilities. In the last century, pre-2000, if you were
    asked to determine which roads had potholes it is likely you would need to look
    at the images of the road to identify them: a human task. We can now use ML to
    do this. This ML is performing a narrow AI task. It can identify potholes, but
    is unlikely to be able to spot missing roof tiles. It is


    ## General AI


    General AI is AI that can handle all the tasks a human can. At the time of writing,
    general AI has yet to be created. AI that goes beyond human capabilities is referred
    to as super AI.


    ## Generative AI


    Generative AI has a different meaning from general AI, although they sound very
    similar. This type of AI is seen as creative because it produces new material.
    Depending on the model being used, this can be in different forms including images,
    words and sounds. Generative AI is not general AI, it still lacks human capabilities.
    Take large language models: these are a type of generative AI that create natural
    language whether it be a chatbot to book a hair appointment or advice on data
    protection.


    Figure 14.3 Hierarchy of AI definitions


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_309_0.png)


    ## FOUNDATIONAL MODELS


    Foundational models are a form of generative AI. They are trained using extremely
    large quantities of diverse data. This creates a model that is pre-trained and
    can be adapted to different uses. As a result, new applications can be created
    much quicker and at significantly lower cost than otherwise be the case. Foundational
    models work by predicting the next item in a sequence. In the case of language,
    this might be the next letter or word. The sequence then builds up into comprehensible
    and meaningful language.


    ## Risks of AI


    We will take a step back from the end of the world as an AI risk and focus on
    the more technical risks relating to AI outputs. The main risks can be summarised
    as:


    - **Bias**: Does the AI produce outputs that are in some way biased?

    - **Hallucination**: Has the AI made something up, so the output is in some way
    incorrect?

    - **Transparency**: Can you understand how the AI has reached the outcome it has?

    - **Privacy**: Do you understand, and are you happy with, the data you have provided
    is being used?


    In using AI within your work, it is important to understand your organisation’s
    policy in relation to AI. This will be designed to help mitigate these risks.


