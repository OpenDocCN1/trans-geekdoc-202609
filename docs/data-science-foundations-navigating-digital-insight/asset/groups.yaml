    the specific sector in which you work. This might be put in place by a regulatory
    or professional body. An example of this is the Caldicott Principles that apply
    to health and social care. BCS, The Chartered Institute for IT also has a professional
    code of conduct for members. This has four key principles:


    - You make IT for everyone.

    - Show what you know, learn what you don’t.

    - Respect the organisation or individual you work for.

    - Keep IT real, keep IT professional, pass IT on.


