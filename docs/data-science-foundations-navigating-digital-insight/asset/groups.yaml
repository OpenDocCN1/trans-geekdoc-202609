    predict health outcomes to improve the health of the general population. However,
    as we have already alluded to it, it might also be used to target specific individuals
    and treat them differently. Again, they could be prejudiced by this, raising the
    question of whether this is ethical lawful.


    # WHO MIGHT BE IMPACTED?


    The stakeholder wheel we discussed in Chapter 2 is a useful tool for identifying
    stakeholders in a project, including those who provide data and benefit from the
    analysis. Considering lawfulness and ethics in relation to each stakeholder can
    help to identify any risks that need to be addressed.


    # ETHICS


    You may recall the stakeholders we looked at in the analysis of the link between
    smoking and cancer. One of those stakeholders was the tobacco companies. How did
    they react to the research findings? Ultimately, they lied about them – a very
    clear example of unethical behaviour related to data science.


    However, the ethics of a situation are not always so clear-cut. Let''s consider
    another example. In 2020, exams for A-levels were cancelled due to the pandemic
    (BBC, 2020). The question, then, was how to award grades to those who were due
    to sit them. Data science to the rescue: look at the historic performance of schools
    and then apply a similar profile of grades to the current cohorts in any school
    – a rigorous scientific approach compared to the alternative of relying on teachers’
    assessment.


    This might have been fair for a lot of students, but what about those grades were
    downgraded from their teacher’s prediction? Add to this that certain schools were
    too small to be included in the model, so their pupils’ grades weren’t downgraded.
    An ethical question was whether to use the model, given the perceived unfairness
    to some individuals. The result was a backtrack and use of teacher assessment,
    an approach that could also be critiqued.


    # What are ethics?


    Ethics are frequently discussed, but often not defined. What are they? This is
    something that was debated in ancient civilizations and is still debated now.
    For our purposes, we will define them as the principles by which we and society
    judge our and others’ behaviours. It is important to recognise that ethics change
    over time; some argue that ethical rules should never be broken, others argue
    that they are flexible and depend on context.


    Although there is no legal sanction for behaving unethically if that behaviour
    does not break the law, it is important as it is fundamental to trust and in turn
    reputation. If you are not concerned about reputation, it''s worth remembering
    the £37 billion loss of value in Facebook when questions were raised to how data
    was collected and used by Cambridge Analytica in election campaigns (BBC, 2018).


    # Ethical questions


    The subjectivity of ethics means we can''t set out a clear set of ethical rules
    to follow. To help navigate this tricky subject, we suggest asking the following
    two questions:


    - Will this harm anyone?

    - Are people happy for their data to be used in this way?


    ## Will it harm?


    Harm can occur in many forms. It could be direct harm, or it could be indirect.
    Harm doesn''t have to be physical; it could be harmful to other aspects of our
    lives, including educational prospects, financial well-being and social relationships.
    When thinking about harm, we need to consider the risk of harm and that others
    would regard as harmful what we might consider to be benign.


    What ethical considerations might there be if we wanted to explore minority groups’
    experiences of services to support them? This should be beneficial in understanding
    services could be improved. However, it could also have adverse consequences for
    those involved in the research. It might lead to the targeting of those contributing
    to undertaking the research by those opposed to those minority groups. This doesn''t
    mean the research shouldn''t take place, but steps should be taken to mitigate
    the risk of harm. Many organisations will have processes in place to review the
    ethics of research projects and, where they are not in place, individuals and
    teams should undertake appropriate reviews. Here, we have an example of an ethical
    consideration in relation to the collection of data.


    ## Are people happy?


    Elon Musk raised concern at his private jet’s movements being shared on social
    media, as it would make it easier for someone to attack his family (Halpert and
    Moloney, 2022). Here, he was concerned about harm, but there is also a question
    of someone’s right to control the use of data that relates to them.


    Do you want your data used to identify goods and services you might be interested
    in? Are you happy for it to be used in medical research? How about using it to
    promote political adverts to influence you vote? Here, we are considering the
    ethical question, not the legal one. The fact that a box has been ticked giving
    consent doesn’t mean someone would be happy for their data to be used that way.
    The use to which the data is to be put might not have been envisaged by them at
    the time they ticked the box. They might also have had little choice but to consent
    to access goods, services or employment. As we will see, ethics and lawfulness
    overlap.


    Having read this section on ethics, you might think it has provided no answers
    and just raised questions. You would be right, and that is the point of it – to
    think before launching into a data science project and during the project. Think
    about the data used, think about the people involved and think about what might
    be done with the insight generated.


    # LEGISLATION AND REGULATION


    Ethics is subjective; helpfully, legislation and regulation are a little more
    objective. These are limits on the use of data that society has set as a standard,
    that have legal consequences if not complied with. Different countries take different
    approaches to setting these standards. Some will have overarching data protection
    laws, such as the UK, others regulate by specific sector, for example the USA.
    We will focus on the UK’s overarching legislation: the Data Protection Act 2018.


    # Data Protection Act


    The Data Protection Act 2018 gave effect to the European General Data Protection
    Regulation (GDPR). Rather than set out rules as how data can be used, it has a
    set of principles that should be followed. The advantage of principles is that
    they can be applied to different situations. Rules tend to address specific scenarios,
    making them complex and inflexible. This does, however, mean the principles require
    interpretation.


    # GDPR principles


    This is a brief introduction to the GDPR principles, and we would encourage you
    to explore this subject further to better understand the detail and nuances. You
    will find that these align with many of the ethical considerations we have discussed.
    You should remember that these principles apply to living persons and not to other
    entities, such as companies or those who are dead.

