    ## 数据科学基础


    洞察数字洞察


    Stephen Mariadas 和 Ian Huke


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_1_0.png)


    一本关于数据科学的卓越指南。清晰且具有实用的见解，涵盖了整个生命周期——对于初学者来说非常完美，对所有人来说都是极佳的参考。


    **Chris Weston**，NashTech 技术顾问


    《数据科学基础》是一本完美的入门指南，通过真实世界的案例对核心概念提供了清晰、引人入胜的概述。对于任何渴望投入数据科学的人来说，都是必读之伴。


    **Jake Wilson PhD**，GHGSat Inc. 数据科学家


    这是一个非常切时的话题，影响着每个人的生活。一本关于基础的书可能会非常枯燥，但作者在分享概念、原则、方法与通过真实世界的案例和场景使其栩生生之间取得了完美的平衡。我的公司正在为客户交付几个使用物联网（IoT）的项目，这些项目广泛地使用数据科学来提供服务；更广泛地说，我们的团队参与了许多涉及数据科学方面（无论是明显的还是离散的）的项目。这本书绝对会我交给那些即将启动新项目的团队成员。强烈推荐。


    John Opsblum，联合创始人兼首席咨询官


    这就是我需要的书！这是一本关于数据科学的优秀、深思熟且简洁的基础性介绍，充满了引起共鸣的案例、实用的技巧以及一个实现成功数据科学项目的全面框架。对数据科学、机器学习与人工智能之间关系的解释，以及对不同数据科学模型的概述，对于增强我的理解具有无价的价值。这本书将成为我信赖的伴侣，我确定我会反复翻阅它。


    Paul Williamson，高级业务分析师（私募股权）


    作为数据专业人士的必读之作，这本书将技术深度与实践指导相结合。它完善了模型选择策略并加强了沟通，将原始数据转化为有意义且可操作的洞察。


    Raimondo Fanale MBCS，Intuisco Ltd 研发经理


    对于任何将数据科学视为“黑术”但又想提高对其理解程度的人来说，这是一本“必读”之书。它引导读者了解数据科学概念和实践，通过大量使用案例研究和真实案例使其变得真实。书中内容令人新颖地没有了术语，提供了实用的建议并使主题人性化。强烈推荐。


    **Nigel Turner**，*EMEA 首席信息管理顾问，全球数据战略*


    《数据科学基础》对于那些开始旅程或已经在从事高级数据分析的人来说，是一个受欢迎的补充资源。它成功地平衡了全面性和可读性；涵盖了数据科学的所有领域，但没有假设读者具备先验知识。作者的一部杰作。


    **Martin Bell**，*BEXIT Ltd 首席及首席数据科学家*


    一本关于数据科学的精彩介绍，涵盖了问题定义、统计学、模型选择、沟通和可视化。清晰简洁，对于任何该领域的新手来说都是一个极佳的起点！


    **Richard Fritz-Hewer**，*CMC Partnership 数据科学家*


    # 数据科学基础


    ## BCS，英国特许信息学会


    BCS（英国特许信息学会，英文称为 The Chartered Institute for IT）致力于让信息技术（IT）为社会造福。我们利用网络的力量带来积极、切实的改变。我们捍卫全球
    IT 行业以及从事该行业的个体的利益，以造福所有人。


    ### 交流 IT 专家经验与知识


    学会促进工业界、学术界和商界专家之间的联系，以促进新思想、教育和知识共享。


    ### 支持从业人员


    通过持续的职业发展和一系列备受推崇的 IT 认证，学会寻求促进符合业务需求的专业实践。它为全球范围内的成员和志愿者社区提供实用的支持和信息服务。


    ### 制定标准与框架


    学会与政府、行业和相关机构合作，建立良好的工作规范、行为准则、技能框架和通用标准。它还为雇主提供一系列咨询服务，帮助他们采纳最佳实践。


    ### 成为成员


    超过 70,000 名包括学生、教师、专业人士和从业人员在内的人员享有 BCS 成员的福利。这些福利包括接入国际社区、参加国家活动的邀请、职业发展工具以及一份季刊。请访问
    www.bcs.org 了解更多信息。


    更多信息


    BCS, The Chartered Institute for IT, 3 Newbridge Square, Swindon, SN1 1BY, United
    Kingdom. T +44 (0)1793 417 (周一至周五，09:00 至 17:00)


