    这种做法的困难之处在于数据是定序的（即它具有顺序），这可能会影响模型。因此，我们需要增加列（每种故障类型一列），并将值以二进制（1 或 0）的形式记录，这是一种名义数据。将一个字段中的分类数据移动到多个字段中的二进制数据的技术被称为“独热编码”（one-hot
    encoding）。


