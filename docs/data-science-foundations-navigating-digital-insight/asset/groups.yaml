    - **Prepare**: Once we have the data sets, we might not need all the data within
    them, so we might remove the data that isnt needed. We might also find that some
    records are inaccurate, leading us to correct or remove them. Parts of the data
    could also be in an inappropriate format, for example the age of the phone is
    held as a string not an integer (these are data types in the database). Often,
    preparation is the most intensive activity in a data science project.

    - **Explore**: Having thought through the tools and methods available, we select
    the most, taking account of our data. This might involve some prototyping of different
    models.

    - **Create**: We then build the model using the selected methods and data.

    - **Analyse**: The model outputs are considered and interpreted to allow us to
    draw conclusions on which phones are likely to develop a fault in the next six
    months.

    - **Communicate**: The results of the analysis can be communicated by us to those
    asking the question.


    This scenario makes it look very easy to move through the flow, but in practice
    there is often significant iteration. We can consider some of the problems we
    might encounter in looking at phone faults (Figure 3.2):


    1. When trying to source the data, we can only find it for some phones. We therefore
    go back to those asking the question to confirm they want us to go ahead with
    a more limited scope.

    2. On preparing the data, we find that, although phone faults are contained in
    our data set, the details of the phone are contained in another data set that
    needs to be sourced.

