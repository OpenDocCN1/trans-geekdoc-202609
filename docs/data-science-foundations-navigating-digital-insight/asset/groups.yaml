    # Figure 10.6 k-means clustering example


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_225_0.png)


    k-means clustering will produce a graphical visualisation showing data points
    grouped around a given number of central points (centroids). The example in Figure
    10.6 has four clusters with four centroids, showing that the data can be clearly
    grouped into four separate groups.


    # The formula


    The purpose of k-means clustering is to minimise the total of all the distances
    between a data point and a centroid. We do this by changing the centroids around,
    and keep on trying until we get to a point that gives us the smallest total. Therefore,
    the formula we use, related to adding up all the distance between points and centroids,
    is:


    ```

    $J = \sum_{j=1}^{n} \sum_{i=1}^{c} ||x_i - d_j|^2$

    ```


    where $n$ is the number of clusters, $c$ the number of data points and the right
    half is measuring the distance between each data point and a centroid.


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_226_0.png)


    # What does it look like?


    $k$-means clustering involves a lot of calculations, as we have to check all data
    points against different centroids. To show a very simple example of how this
    works, let''s try a small data set. Using the following data about six students
    for their **height** (in cm) and **weight** (in kg), we can try and group them
    into two clusters:


    | Student | Height (cm) | Weight (kg) |

    | :--- | :--- | :--- |

    | A | 160 | 55 |

    | B | 170 | 65 |

    | C | 165 | 60 |

    | D | 180 | 80 |

    | E | 175 | 75 |

    | F | 190 | 90 |


    # Step 1: What is the ''k'' in k-means?


    The $k$ in k-means is the number of clusters (groups) you want to create. Here,
    we will use $k = 2$ for two groups of students based on their height and weight.


    # Step 2: Initialise cluster centres


    To begin, we randomly pick two points as ''starting cluster centres''. Let''s
    randomly choose:


    - Cluster centre 1 ($C_1$): (160, 55) $\rightarrow$ Same as Student A.

    - Cluster centre 2 ($C_2$): (190, 90) $\rightarrow$ Same as Student F.


    These centres are just starting points. They will move as we calculate better
    cluster groupings.


    # Step 3: Assign each student to the nearest cluster


    Now, for each student, we calculate which cluster centre is closer – $C_1$ or
    $C_2$ – based on the distance formula we described in Chapter 9.


    # Formula for Euclidean distance


    Let''s calculate the distance for each student to both cluster centres:


    | Student | Height (cm) | Weight (kg) | Distance to $C_1$ (160, 55) | Distance
    to $C_2$ (190, 90) | Closest cluster |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | A | 160 | 55 | 0 | 50.00 | $C_1$ |

    | B | 170 | 65 | 14.14 | 36.06 | $C_1$ |

    | C | 165 | 60 | 7.07 | 42.72 | $C_1$ |

    | D | 180 | 80 | 36.06 | 14.14 | $C_2$ |

    | E | 175 | 75 | 29.15 | 18.03 | $C_2$ |

    | F | 190 | 90 | 50.00 | 0 | $C_2$ |


    This gives us the results:


    - Cluster 1 ($C_1$): Students A, B, C

    - Cluster 2 ($C_2$): Students D, E, F


    # Step 4: Recalculate cluster centres


    After assigning students to clusters, we recalculate the centre of each cluster
    (centroid). To find the new centroid:


    - Take the average of the Height and Weight for all the students in the cluster.


    New centroid for Cluster 1 ($C_1$):

    Students in Cluster 1: A (160, 55), B (170, 65), C (165, 60)

    - New Height: $\frac{160+170+165}{3} = 165$

    - New Weight: $\frac{55+65+60}{3} = 60$

    $C_1 = (165, 60)$


    New centroid for Cluster 2 ($C_2$):

    Students in Cluster 2: D (180, 80), E (175, 75), F (190, 90)

    - New Height: $\frac{180+175+190}{3} = 181.67$

    - New Weight: $\frac{80+75+90}{3} = 81.67$

    $C_2 = (181.67, 81.67)$


    # Step 5: Repeat assignment and recalculation


    Now we repeat Step 3 (assign students to the nearest cluster) and Step 4 (recalculate
    cluster centres) until the cluster centres stop moving (this is called convergence).


    Let''s go through one iteration of assigning students to clusters:


    | Student | Height (cm) | Weight (kg) | Distance to new $C_1$ (165, 60) | Distance
    to new $C_2$ (181.67, 81.67) | Closest cluster |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | A | 160 | 55 | 7.07 | 36.53 | $C_1$ |

    | B | 170 | 65 | 7.07 | 23.28 | $C_1$ |

    | C | 165 | 60 | 0 | 27.21 | $C_1$ |

    | D | 180 | 80 | 25.0 | 2.36 | $C_2$ |

    | E | 175 | 75 | 18.03 | 8.33 | $C_2$ |

    | F | 190 | 90 | 36.06 | 12.5 | $C_2$ |


    - Cluster 1 ($C_1$): Students A, B, C

    - Cluster 2 ($C_2$): Students D, E, F


    Since the clusters haven''t changed, we''ve reached convergence, and the algorithm
    stops.


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_231_0.png)


    # Know yourself


    When you are clustering data, the first thing to consider is how many groups/clusters
    would be appropriate. There may be cases where the data will say that five groups
    would make the most sense, but in real life this number of groups would not be
    workable.


    As we are looking at ‘distances’, you should also be aware of clustering using
    geographical data. An example would be looking into opening a new shop and trying
    to choose the best spot – there are going to be many factors apart from distance
    that can affect the clustering of customers.


    ## Business examples


    **Customer segmentation:** A telecommunications company uses clustering to segment
    customers based on usage patterns, enabling personalised marketing campaigns and
    service offerings.


    - **Social media:** Social media platforms use clustering to recommend friends
    or groups to you based on your interests and connections.

    - **Search engines:** Search engines use clustering to group similar webpages
    together in search results.

    - **Market research:** Companies use clustering to identify different customer
    segments and understand their needs.


    # Association


    # Understanding association rule mining


    Association rule mining identifies relationships and patterns within data sets,
    often used in market basket analysis to discover associations between products
    purchased together. Imagine you''re at a grocery store – association rule mining
    is like noticing that people who buy water often also buy crackers. It helps us
    to discover interesting relationships and patterns between different items in
    a data set.


    # Apriori algorithm


    The Apriori algorithm is a popular method for mining frequent item sets and discovering
    association rules. It uses a bottom-up approach, generating candidate item sets
    and pruning those that do not meet a minimum support threshold.


    # STATISTICAL MODEL – APRIORI ASSOCIATION RULES


    When to use association rule mining:


    - **Market basket analysis**: Understanding which products are frequently bought
    together to optimise product placement and create targeted promotions.

    - **Web usage mining**: Analysing website traffic to understand user behaviour
    and improve website design.

    - **Medical research**: Identifying potential risk factors for diseases by analysing
    patient data.

    - **Fraud detection**: Discovering patterns of fraudulent transactions.


    # The output


    Association rules do not **predict** outputs, but are very good at spotting patterns
    in very large data sets that a human would struggle to see just by looking.


    The model outputs a few values that quantify associations between items.


    Key concepts:


    - **Support**: This is the proportion of transactions that contain a particular
    item set.

    - **Confidence**: This is the likelihood that a rule is true for a transaction
    (two or more items) that already contains the first item.

    - **Lift**: This is the ratio of the observed support to the expected support
    if the items were independent.


    # What does it look like?


    Imagine you own a mobile phone shop and want to understand what products customers
    typically buy together. This could help you to place different products together
    and increase sales even more.

    '
  mdcn: '


    # 图 10.6 k-means 聚类示例


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_225_0.png)


    k-means 聚类将生成一个图形化可视化，显示数据点围绕给定数量的中心点（质心）分组。图 10.6 中的示例显示了四个簇和四个质心，表明数据可以被清晰地分为四个独立的组。


    # 公式


    k-means 聚类的目的是最小化所有数据点与其对应质心之间距离总和。我们通过移动质心并不断尝试，直到找到一个使总和最小的点。因此，我们使用的与累加点与质心之间所有距离相关的公式是：


    ```

    $J = \sum_{j=1}^{n} \sum_{i=1}^{c} ||x_i - d_j|^2$

    ```


    其中 $n$ 是簇的数量，$c$ 是数据点的数量，右半部分衡量每个数据点与质心之间的距离。


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_226_0.png)


    # 它看起来是什么样的？


    $k$-means 聚类涉及大量的计算，因为我们需要根据不同的质心对所有数据点进行检查。为了展示其工作原理的简单示例，让我们尝试一个小型数据集。使用以下关于六名学生**身高**（cm）和**体重**（kg）的数据，我们可以尝试将他们分为两个簇：


    | 学生 | 身高 (cm) | 体重 (kg) |

    | :--- | :--- | :--- |

    | A | 160 | 55 |

    | B | 170 | 65 |

    | C | 165 | 60 |

    | D | 180 | 80 |

    | E | 175 | 75 |

    | F | 190 | 90 |


    # 第 1 ：k-means 中的 ''k'' 是什么？


    k-means 中的 $k$ 是你想要创建的簇（组）的数量。在这里，我们将使用 $k = 2$，根据学生的身高和体重将他们分为两组。


    # 第 2 步：初始化簇中心


    首先，我们随机选择两个点作为“起始簇中心”。让我们随机选择：


    - 簇中心 1 ($C_1$): (160, 55) $\rightarrow$ 等于学生 A。

    - 簇中心 2 ($C_2$): (190, 90) $\rightarrow$ 等于学生 F。


    这些中心仅仅是起点。当我们计算出更好的簇分组时，它们将会移动。


    # 第 3 步：将每个学生分配到最近的簇


    现在，对于每个学生，我们根据第 9 章中描述的距离公式，计算哪个簇中心更近——$C_1$ 还是 $C_2$。


    # 欧式距离公式


    让我们计算每个学生到两个簇质心的距离：


    | 学生 | 身高 (cm) | 体重 (kg) | 到 $C_1$ (160, 55) 的距离 | 到 $C_2$ (190, 90) 的距离 | 最近的簇
    |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | A | 160 | 55 | 0 | 50.00 | $C_1$ |

    | B | 170 | 65 | 14.14 | 36.06 | $C_1$ |

    | C | 165 | 60 | 7.07 | 42.72 | $C_1$ |

    | D | 180 | 80 | 36.06 | 14.14 | $C_2$ |

    | E | 175 | 75 | 29.15 | 18.03 | $C_2$ |

    | F | 190 | 90 | 50.00 | 0 | $C_2$ |


    这得出了结果：


    - 簇 1 ($C_1$): 学生 A, B, C

    - 簇 2 ($C_2$): 学生 D, E, F


    # 第 4 步：重新计算簇中心


    在将学生分配到簇后，我们重新计算每个簇的中心（质心）。要找到新的质心：


    - 取簇中所有学生身高和体重的平均值。


    簇 1 ($C_1$) 的新质心：

    簇 1 中的学生：A (160, 55), B (170, 65), C (165, 60)

    - 身高平均值：$\frac{160+170+165}{3} = 165$

    - 体重平均值：$\frac{55+65+60}{3} = 60$


    簇 2 ($C_2$) 的新质心：

    簇 2 中的学生：D (180, 80), E (175, 75), F (190, 90)

    - 身高平均值：$\frac{180+175+190}{3} = 181$

    - 体重平均值：$\frac{80+75+90}{3} = 81$


    '
