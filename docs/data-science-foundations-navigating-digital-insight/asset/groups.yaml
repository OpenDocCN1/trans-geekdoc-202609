    different sources. For example, data from the enterprise resource planning (ERP),
    customer relationship management (CRM) and email systems might all be placed in
    the data lake.


    +   - Data warehouse: This is a store of data used for reporting. It is normally
    at an enterprise level, bringing together data from different systems. In most
    cases, the data has undergone a level of data preparation, covered in Chapter
    8. Looking at our example, subsets of the ERP and CRM data might be brought together
