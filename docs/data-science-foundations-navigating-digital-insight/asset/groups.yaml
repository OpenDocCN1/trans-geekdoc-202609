  - '[PAGE 148]


    Many models require the data in them to be numeric rather than textual. This means
    that data might need to be changed from a word into a number. If you look at the
    restructured table of phone faults in Table 8.2, you can see that, rather than
    recording a yes/no in the field, we have used 1 and 0. This allows the data set
    to be used in models that do not accept alpha values.


    # Category of data


    Creating additional columns and populating with 1s and 0s might seem a lot of
    hassle. If the model needs numeric values, why not just leave one field and give
    each of the faults a number (Table 8.5)?


    Table 8.5 Fault types


    | Fault type | Fault type value |

    |---|-|

    | Screen | 1 |

    | Operating system | 2 |

    | Processor | 3 |'
  - '[PAGE 149]


    The difficulty with this is that the data is ordinal (i.e. it has a rank), and
    this might affect the model. Hence, the addition of columns, one for each of the
    fault types and the recording of the value as a binary (1 or 0), a type of nominal
    data. The technique to move categorical data in one field into binary data in
    many fields is called ‘one-hot encoding’.


    This example considers a model that requires nominal binary data. Other models
    might have different requirements as to the properties of the data used in them.


    # PROPERTIES OF DATA SETS


    As well as the data having properties, data sets can also have properties. Two
    properties often encountered are patterns over time and skewness.


    Patterns over time


    When looking for patterns over time, the data might have a trend. It could be
    an upwards trend (values increasing over time) or a downwards trend (values decreasing
    over time). A pattern over time could also be cyclical, for example retail sales
    peaking in the run-up to Christmas every year. Data such as this isn’t stationary,
    and some models require the data to be stationary. Stationary data is where its
    statistical properties,'
  - '[PAGE 150]


    such as mean and variance, don''t vary over time. Where the data has a trend or
    cyclical pattern, the mean and variance do vary over time. Tests can be undertaken
    to determine if the data is stationary and, if it isn''t, it might be possible
    to transform the data so that it is stationary, allowing it to be used as part
    of a model requiring stationary data.


    # Skewed data


    We have seen in Chapter 6 that skewed data is where the data is unevenly distributed
    around the mean. A model''s output can be affected by how skewed the data is within
    it. If this is the case, steps can be taken to normalise the data, leading to
    an even distribution either side of the mean. This even distribution is referred
    to as normal distribution or Gaussian distribution. Statistical tests that assume
    normalised distribution are called parametric tests, those that don''t are nonparametric
    tests.


    # QUALITY RISKS


    As we have seen in Chapter 7, when sourcing our data it is important to consider
    the data quality. Considering the data quality is equally important in preparing
    the data. At this stage, we are looking at the quality risks in the data set and
    the action that needs to be taken to mitigate them. These quality risks'
  - '[PAGE 151]


    might be inherent in the source data or have been introduced in the extraction,
    loading or subsequent manipulation of the data.


    # Missing values


    Data sets can have missing values for many reasons. These could include data not
    being collected in the first instance or data sets not being complete. Where data
    is found to be missing, this should be investigated. Within our contact centre
    project, the record of the contacts might have been lost or corrupted, potentially
    due to an IT failure.


    When combining data, it is important to consider the way the data is combined,
    as different techniques can produce different combined data sets. A missing value
    in a data set might lead to data in that table and corresponding tables being
    lost. For our contact centre, if there was no data for a particular day in either
    our contacts-dealtwith or people-working tables, we could lose the corresponding
    record in the other table, depending on the approach taken to combine the data.


    # Duplication


    There is also a possibility that rows of data might be duplicated when the data
    is combined. Again, we need to take care when'
  - '[PAGE 152]


    selecting how we combine our data to avoid this. In doing so, consideration needs
    to be given to the data structure, particularly where the relationships between
    tables are not 1 to 1. By this, we mean that the unique key in one table has multiple
    records with the same key in another table.


    # Sample size


    Your data within your data set might be perfect. However, the data set might be
    too small to be effectively used in a model. In most cases the more data you have,
    the more accurate the model you can build. Some models are better at working with
    small data sets than others.


    # Outliers


    Where there are outliers in the data set, it is worth considering the cause of
    the outliers, to decide whether to keep or remove the data. For example, if we
    looked at our contact centre data and saw a spike in the number of people working
    due to new trainees being brought on board, we might decide to exclude that data
    as it is not the ‘normal’ operation of the contact centre.


    # Bias'
  - '[PAGE 153]


    We have considered some of the causes of bias in our data sets in Chapter 6. Bias
    is an ethical issue, and bias might not be apparent. It is worth thinking about
    how bias might be introduced into the core data set. A classic example is if we
    look at the characteristics that made a person a good recruit for a job. If we
    look at the data in the curriculum vitae of successful applicants for similar
    roles, the data set might be biased due the biases within those recruiting to
    those roles.


    Wrong data set


    Our search for good candidates for a role also illustrates the challenge of ensuring
    we have the right data set to address the problem. It could be argued that the
    data from the curriculum vitae of successful applicants can only help to identify
    the characteristics of successful applicants, but it tells you nothing about whether
    they are good at the job. In this case, another data set would need to be found
    that reflects successful candidates who perform well in the role.


    # QUALITY CHECKS


    Some quality checks require understanding the data set and the domain to which
    it relates, others can be done by looking at the quality of the data source. For
    example, in looking at data to'
  - '[PAGE 154]


    help find good candidates for a role, you need to consider whether the data sets
    have missing data. This could be done by looking at the data set for blank or
    null fields. However, it could be harder to determine if there was bias in the
    data set, for example because a recruiter had previously rejected candidates based
    on their age. In this instance, knowledge of the domain and comparing the data
    set to other similar data sets is likely to be helpful.


    # Visual inspection


    A visual inspection of the data can be helpful to identify any anomalies that
    require investigation. Where the data set is large, a sample of the data can be
    inspected, and there are tools to assist in this. For example using filters to
    look for specific values and using conditional formatting to highlight them. Some
    tools are more sophisticated, for example they might help identify duplicates.
    A visual inspection of the data is always a good idea.


    # Graphical inspection


    The data can be presented graphically to help identify any anomalies in it. Box
    plots are effective in identifying outliers, and skew in data is apparent if plotted
    in a histogram.'
  - '[PAGE 155]


    Graphically presenting null values or duplicate records can also assist in identifying
    potential issues.


    Cross checks


    Where data has been transformed, it can be cross checked against the source data
    or data sets created during the transformation. Where the data structure hasn''t
    changed, checking that the number of rows correspond can be helpful, as well as
    comparing statistics relating to the data (e.g. the mean value of a column). Check
    sums can still be used where the data had been manipulate, for example if we take
    a daily record of hours worked and derive the total hours worked per month, the
    total of both over any period should be the same. More detailed checks can be
    carried out by looking at fields and columns to check data isn''t missing or corrupted.


    Data quality dashboard


    If a data set is updated on a regular basis, you might consider setting up a data
    quality dashboard. This would reduce the effort in quality checking the data and
    provide confidence in the data science and insights driven by it.


    # MITIGATION STRATEGIES'
