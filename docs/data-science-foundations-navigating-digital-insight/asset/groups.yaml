    # COMBINING CHARTS


    Using more than one chart, representing multiple data sets, can create a deeper
    view of the data, and there is a particular pairing that is common, powerful:
    scatter plots and line graphs. Together, these charts can provide a richer and
    more insightful view of your data.


    # Why combine scatter plots and line graphs?


    ###elling a complete story


    While single charts can convey specific aspects of your data, combining them allows
    you to tell a more complete story. Scatter plots and line graphs complement each
    other perfectly by highlighting individual data points and overall trends simultaneously
    (Figure 11.11).


    - **Scatter plots**: These showcase the relationship between two variables by
    plotting individual data points.

    - **Line graphs**: these emphasise trends and changes over time by connecting
    data points with a line.


    Figure 11.11 Example scatter plot and line graph combined


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_259_0.png)


    # Uncovering insights


    Combining scatter plots and line graphs can reveal insights that might be missed
    when using either chart alone. This combination allows you to see both the granular
    details and the big picture, making it easier to identify patterns, correlations
    and outliers.


    # Creating the perfect combo


    ### Step 1: Start with a scatter plot


    A scatter plot serves as the foundation for your combined chart. By plotting individual
    data points, you can explore relationships and spot patterns between two variables.


    Example: Imagine you''re analysing the relationship between study hours (x axis)
    and test scores (y axis) for a group of students. A scatter plot will help you
    to see how each student''s study habits relate to their performance.


    ### Step 2: Add a line graph


    Overlaying a line graph on your scatter plot provides a visual representation
    allowing the relationship between data sets to be explored.


    Example: Adding a line graph plotting hours studied against minutes gaming allows
    you to explore the relationship between the three variables: hours studied, test
    score and minutes gaming


    ### Step 3: Enhance with colour and style


    Use colour and style to differentiate between the scatter plot and line graph,
    ensuring clarity and visual appeal. Consistent colour schemes and line styles
    can highlight key insights and make your combined chart easy to interpret.


    Example: Use distinct colours for the scatter points and line to avoid confusion.
    You might opt for blue dots for the scatter plot and a bold red line for the line.


    # Real-world applications


    ### Sales performance analysis


    Businesses often use combined scatter plots and line graphs to analyse sales performance
    over time. By plotting individual sales transactions as scatter points and profit
    as a line graph, companies can identify seasonal trends between sales and profit.


    - Scatter plot: Individual sales transactions plotted over time.

    - Line graph: A line showing profit over time.


    ### Scientific research


    In scientific research, combined scatter plots and line graphs are used to explore
    the relationship between variables, such as dosage and drug efficacy, temperature
    and reaction rate, or any other two related phenomena.


    - Scatter plot: Experimental data points showing dosage over time.

    - Line graph: A line showing the efficacy of a drug over time.


    # Tips for effective combined charts


    ### Keep it simple


    While combining charts can enhance insights, avoid overloading the visualisation
    with too much information. Keep your design clean and focus on the most relevant
    data points and trends.


    ### Label clearly


    Ensure that both the scatter plot and line graph are labelled clearly, with axes,
    titles and legends that describe the data accurately. This helps viewers to understand
    the context and significance of the visualisation.


    ### Interactive elements


    Consider adding some of the interactive elements we discussed earlier, such as
    tooltips or filters.


    Visualisations are often subjective and sometimes even quite emotive. People can
    feel very strong about what they ‘like’ to see and you should always bear this
    in mind – knowing your audience is crucial. Try not to fall into the trap of making
    visualisations look incredibly technical; the message from the data is often lost
    when someone does not quite understand what they are seeing.


    While we do not want to offer direct advice on what you should choose, there are
    certainly some styles to avoid – 3D graphs are almost never a good idea.


    # PRACTICAL TIPS


    - Gather audience feedback to know what works for different people (but remember
    you will probably not please everyone, just aim for the important majority).

    - Choose the right chart type for your message. Starting with the wrong chart
    type will make it very difficult to have a clear message.

    - Keep it simple; prioritize clarity. Start with the least possible contents and
    justify adding more, rather than having everything and taking things away.

    - Label everything clearly.

    - Maintain a consistent colour scheme (and if you have to meet corporate standards
    – make sure you do).


