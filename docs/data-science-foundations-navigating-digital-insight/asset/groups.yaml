    应用 ARIMA 需要若干步骤，这绝对是必要的。应用 ARIMA 需要若干步骤，这显然是必要的，使用工具来计算。让我们通过一些手机销量，使用工具来预测未来发生什么：


    | 周 | 手机销量 |

    | :--- | :--- |

    | 1 | 500 |

    | 2 | 520 |

    | 3 | 530 |

    | 4 | 570 |

    | 5 | 580 |

    | 6 | 600 |

    | 7 | 630 |


    # 步骤 1：检查数据平稳性


    ARIMA 在数据没有趋势时效果最好。为了让数据平稳，我们计算值之间的差异。


    | 周 | 差异 |

    | :--- | :--- |

    | 2 | 20 |

    | 3 | 10 |

    | 4 | 40 |

    | 5 | 10 |

    | 6 | 20 |

    | 7 | 30 |


    # 步骤 2：确定 ARIMA 参数 (p, d, q)


    ARIMA 有三个参数：


    1. **p (自回归)**：这是使用的过去值的数量。

    2. **d (整合)**：这是数据被差分的次数。

    3. **q (移动平均)**：这是使用的过去误差的数量。


    在我们的示例中，我们使用 ARIMA(1, 1, 1)。


    # 步骤 3：创建 ARIMA 模型


    ARIMA 模型结合各个部分（AR, I, MA）来预测未来：


    - **AR**：查看之前的值。

    - **I**：对差分数据工作。

    - **MA**：调整过去的误差。


    # 步骤 4：对数据进行拟合


    1. 从差分数据开始：从第 7 周，差异是 +30。

    2. 使用 AR：查看之前的差异来预测下次差异。如果 $p = 1$，模型假设下次差异可能相似（接近 +30）。

    3. 加上 MA：调整过去的误差。假设模型低估了第 7 周的销量 10 台手机。MA 组件通过从预测中减去 10 来修正这一点。

    4. 结合所有部分：模型预测下次差异为 (之前的差异) + (误差调整)。


    对于我们的示例：下次差异 = 30 + (-10) = 20


    **逆差分**：为了获得第 8 周的实际预测销量，我们将预测的差异 (+20) 加到第 7 周的销量 (630)：


    第 8 周销量 = 630 + 20 = 650


    # 步骤 6：预测未来的周


    你可以为额外的周重复此过程。


