    | Regulator | The compliance team will be updated at the monthly compliance board
    meeting |

    | Employees (Early project) | HR will be asked to inform the project of any questions
    raised in relation to phones. |

    | Employees (Late project: once they are aware it will impact them) | Updates
    will be provided weekly on the intranet and team leaders will communicate the
    proposed changes in team meetings. |


    One final point on stakeholders: they will have different levels of understanding
    of the problem and data science. It is important to understand this and adapt
    your language and explanations to reflect this.


    # PRACTICAL TIPS'
  merge: -1
  img_proc: true
