- pgno: 92
  md: '# DISCOVERY


    When an organisation kicks off a data science project, one person is normally
    made accountable for its delivery: the sponsor. They might be the person who came
    up with the idea or someone to whom the responsibility has been delegated. One
    of their roles is to initiate the project.


    The first step in the data analysis lifecycle is discovery. Discovery is when
    the project is investigated to understand its objectives, scope, resource needs
    and constraints. Constraints might be time, financial, technology and, of course,
    data. An important part of discovery is determining whether the project is feasible.
    This includes not only whether it is worth doing, but also whether it has the
    resources (including expertise) to deliver it. Sometimes this will be referred
    to as a feasibility study.


    The scope and scale of discovery will vary. Before starting a project, it is worth
    spending time to consider what it will take to deliver, the challenges you might
    encounter, whose help you''ll need and ultimately whether it is worth doing. It
    could save you a lot of angst and heartache. This is true both for a simple sales
    forecast and pharmaceutical research, although in the latter case discovery is
    likely to be a significantly larger undertaking.'
