- pgno: 223
  md: 'Clustering is an unsupervised learning technique that groups similar data points
    together based on their features, used for EDA, pattern recognition and data compression.
    Imagine you have a box of mixed chocolates. Clustering is like sorting chocolates
    into piles based on their similarities, such as colour, shape or filling. In data
    science, it''s about grouping data points together that are like each other.


    # Common clustering algorithms


    +   - **k-means**: A partitioning method that assigns data points to clusters
    based on their proximity to cluster centroids.

    - **Hierarchical clustering**: A method that builds a hierarchy of clusters using
    either an agglomerative or divisive approach.

    - **Density-based spatial clustering of applications with noise**: A method that
    identifies clusters based on the density of data points, allowing for the detection
    of arbitrarily shaped clusters (sometimes abbreviated to DBSCAN).


    When to use clustering:


    +   - **Customer segmentation**: Grouping customers with similar buying habits
    to tailor marketing campaigns.

    - **Image analysis**: Grouping similar images together, like photos of cats or
    landscapes.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '+   - **Anomaly detection**: Finding unusual data points that don’t fit into
    any group, which could indicate fraud or system failures.

    - **Document clustering**: Grouping similar documents together, such as news articles
    on the same topic.


    Evaluating clustering results


    Clustering results are evaluated using metrics such as silhouette score, Davies-Bouldin
    index and within-cluster sum of squares. Visualisation techniques such as scatter
    plots and dendrograms also aid in assessing cluster quality.


    # The output'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Figure 10.6 k-means clustering example


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_225_0.png)


    k-means clustering will produce a graphical visualisation showing data points
    grouped around a given number of central points (centroids). The example in Figure
    10.6 has four clusters with four centroids, showing that the data can be clearly
    grouped into four separate groups.


    # The formula


    The purpose of k-means clustering is to minimise the total of all the distances
    between a data point and a centroid. We do this by changing the centroids around,
    and keep on trying until we get to a point that gives us the smallest total. Therefore,
    the'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'formula we use, related to adding up all the distance between points and centroids,
    is:


    ```

    $J = \sum_{j=1}^{n} \sum_{i=1}^{c} ||x_i - d_j|^2$

    ```


    where $n$ is the number of clusters, $c$ the number of data points and the right
    half is measuring the distance between each data point and a centroid.


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_226_0.png)


    # What does it look like?


    $k$-means clustering involves a lot of calculations, as we have to check all data
    points against different centroids. To show a very simple example of how this
    works, let''s try a small data set. Using the following data about six students
    for their **height** (in cm) and **weight** (in kg), we can try and group them
    into two clusters:


    | Student | Height (cm) | Weight (kg) |'
  merge: -1
  img_proc: true
