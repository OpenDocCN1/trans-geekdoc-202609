  md: '# RISK MITIGATION STRATEGIES


    Follow policy


    Where your organisation has a policy in place, follow it. This means you need
    to know where the policies are, what is in them and who to ask if something isn’t
    clear. Just keep in mind that the policy might not properly reflect the legal
    and regulatory standards to which you will be held.


    Data classification


    Where your organisation has a data classification policy, understand the classification
    that applies to the data you plan to use and apply the appropriate classification
    to the data sets you create. Data classification in this context means applying
    a label to the data, which then sets out how the data items should be used and
    managed. Example classifications are given in Table 4.1.


    These are examples, and your organisation might have different classification
    levels and controls related to them. It is also worth remembering that data classification
    is sometimes'
