  md: '# COMMUNICATION


    You might recall that we talked about framing the problem and developing a hypothesis
    back at the beginning of the data analysis lifecycle, in discovery. Having completed
    all the hard work in investigating the problem and drawing insight from it, we
    now need to communicate our findings. If we communicate them well, people will
    have knowledge that can inform and influence their decisions and actions. However,
    sub-optimal communication might mean that people don''t properly understand, and
    result in poor decisions. It is therefore important to think carefully about and
    invest time in how we communicate our findings. We need to ensure that it is meaningful
    to and resonates with our audience.


    The data, information, knowledge, wisdom (DIKW) pyramid (Wikipedia, n.d.) helps
    us to think about the differences between the data, our tested hypotheses, the
    insight from these and the actions that result.


    In our version of this model (Figure 13.1), data represents the raw data that
    we sourced, information derives from our testing of our hypotheses, knowledge
    is what we will communicate and wisdom is what we hope our audience will gain
    from our communication. To derive knowledge from the information, we'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'will need to combine our information with other information derived from the
    domain in which we are working.


    # Figure 13.1 The DIKW model


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_280_0.png)


    # PRINCIPLES OF USER EXPERIENCE


    Communication can be made in many forms, including written, visual and oral. Often,
    it is a combination of these – for example, a presentation. In this case, the
    presentation materials will normally be made up of words and images, with a voiceover
    by the presenter. In this instance, there is an opportunity to explain and react
    to an audience. Where a written or visual report is produced and made available
    to the audience, the opportunity to explain further does not exist. It is important
    to understand the communication channel to ensure that you tailor your communication
    to deliver a good user experience.'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'When considering user experience, the user experience honeycomb can be a useful
    guide (Morville, 2004). Although developed for user interfaces, it sets out seven
    principles of user experience that can help when thinking about how and what to
    communicate (Figure 13.2).


    # Figure 13.2 The user experience honeycomb


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_281_0.png)


    Let''s consider what this means in terms of communicating our findings, in relation
    to our problem and having tested our hypothesis.


    +   - **Usable**: Is it easy for the audience to engage with?

    - **Useful**: Does it meet the audience''s needs?

    - **Desirable**: Does the audience want to use it?

    - **Findable**: Can the audience locate the information they need? Both within
    the communication and where to find the communication?'
  merge: -1
  img_proc: true
- pgno: 282
  md: '+   - Accessible: Can those with disabilities access it?

    - Credible: Do and should the audience trust it?

    - Valuable: If all the above are met, then do the audience value it?


    If you think about it, the whole data analysis lifecycle contributes to a good
    user experience. The usefulness, desirability and credibility of the communication
    are dependent upon the framing of the problem, the data sourcing and preparation
    and the methods applied. The design of the communication also plays a part in
    whether these principles are met. Design is similarly an important factor in whether
    the knowledge shared is useful, findable and accessible. How the communication
    is stored and shared also plays a role in whether the knowledge is findable and
    accessible.


    Let''s look at resource planning and how we might communicate our findings. Rather
    than consider this from the data scientist''s perspective, let''s step into the
    shoes of the resource planner. Their need is simple: a forecast of customer contact
    volumes for the next month, updated each week. It might be possible to manually
    pull together a report each week in Excel – consisting of a multitude of different
    rainbow-coloured charts with a full range of models covered. This could be sent
    out by email around the start of the week. Sounds OK? Perhaps not if you'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'compare it with a live report that the resource planner can access at any time
    by clicking a link on your intranet home page, and which clearly shows the forecast
    number of contacts for the next month.


    # IMPROVING USER EXPERIENCE


    In many instances, the audience might have a preference as to how they are communicated
    with. Often, there are opportunities to improve on this; however, in the first
    instance changing the way you communicate with an audience can have a negative
    effect on the user experience. This doesn''t mean to say that the communication
    shouldn’t change, but it needs to be handled sensitively. The issue is how to
    educate your audience. Consider:


    +   - Who will act as an advocate?

    - Can small changes be made?

    - Are you able to build a consensus in your audience over time?


    # KNOW YOUR AUDIENCE


