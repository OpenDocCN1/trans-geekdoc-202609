    for example in levels of wealth and availability of finance.

    - **Socio-cultural**: Reflecting changes in the population and their interests.

    - **Technological**: The availability of and expected advances in technology.

    - **Legal**: Laws and regulation, including expected changes.

    - **Environmental**: Current themes and interest in the natural world.


    [Figure 2.3](#) briefly looks at dynamic concert ticket pricing in this context.
    When looking at these elements, you can see how dynamic ticket pricing could attract
