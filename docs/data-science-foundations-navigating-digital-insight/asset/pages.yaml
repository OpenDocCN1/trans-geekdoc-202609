    # Responsive design


    In today’s multi-device world, ensure that your visualisations are responsive
    and look great on all screen sizes, from desktops'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'to mobile phones.


    +   - **Scalable graphics**: Use vector graphics or responsive frameworks to ensure
    clarity on any device.


    +   - **Mobile-friendly layouts**: Design with touch interactions in mind for
    smaller screens.


    # Accessibility in data visualisation


    +   - **Colour blindness considerations**: Approximately 8 per cent of men and
    0.5 per cent of women have colour vision deficiency (American Optometric Association,
    2024). To make your visualisations accessible, consider using colour-blind friendly
    palettes and avoid relying solely on colour to convey information.


    +   - **Colour-blind palettes**: There are many tools available in modern applications
    that include palettes designed for accessibility.


    +   - **Alternative markings**: Use patterns or shapes in addition to colour to
    differentiate data points.


    Text and font size


    Ensure that all text in your visualisations is legible. Use clear sans-serif fonts
    and avoid text sizes that are too small.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '+   - Minimum font size: Keep font sizes above 12 points for readability.


    +   - Contrast: Ensure sufficient contrast between text and background colours.


    Descriptive text and alt text


    Incorporate descriptive text and alternative text (alt text) for users who rely
    on screen readers. This ensures that your visualisations are accessible to individuals
    with visual impairments.


    +   - Descriptive labels: Provide context and explanations for charts and graphs.


    Labelling in data visuals


    Use clear and concise labels. Labels are the unsung heroes of data visualisations.
    They provide essential context and help users to understand what they’re looking
    at.


    +   - Axis labels: Clearly label axes to indicate what data is being represented.


    +   - Data labels: Add labels to data points when necessary for clarity.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '+   - Avoiding overlapping labels: Ensure that labels do not overlap or clutter
    the visualisation. This can make the data difficult to interpret and detract from
    the overall design.


    +   - Smart placement: Use algorithms to position labels intelligently, avoiding
    overlaps.


    +   - Legend use: When space is limited, use a legend to explain colours or symbols.


    Consistency and formatting


    Maintain consistent formatting for labels throughout your visualisations. This
    includes font choice, size and alignment.


    +   - Uniform style: Apply a consistent style to all labels for a cohesive look.


    +   - Alignment: Align labels neatly to enhance readability and aesthetic appeal.


    # BAR CHART


    What is a bar chart?


    Bar charts are one of the most common and versatile types of visualisations, used
    to compare quantities across categories. They display rectangular bars with lengths
    proportional to the values they represent(Figure 11.3).'
