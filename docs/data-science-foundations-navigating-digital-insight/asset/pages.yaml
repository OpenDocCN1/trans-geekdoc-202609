    # PREDICTING VALUE OVER TIME: TIME SERIES ANALYSIS


    Time series analysis involves forecasting future values based on historical data
    collected over time, used in various domains to predict trends and patterns. When
    we look at data across time, things might be more complicated than a straight
    line (as we saw in linear regression). Often, we can see movements across different
    times of year – think about sales around Christmas. Many time series analysis
    methods take account of this ‘seasonality’ and use mathematical techniques to
    model them. The equations used in these methods are more complex and beyond the
    scope of this book, but the modern data scientist would use tools to run the models,
    so the important priority is understanding what the model shows rather than the
    calculations themselves.


    Imagine you’re tracking your weight over a year. Time series analysis is like
    looking at how your weight changes by month, spotting any patterns (like gaining
    weight during the holidays) and predicting what your weight might be next month.
    It deals with data that happens over time, like stock prices, weather patterns
    or website traffic.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'When to use time series analysis:


    +   **Forecasting**: Use for predicting future values, for example predicting
    next year’s sales for a business.


    +   **Trend spotting**: Use for identifying long-term patterns, for example seeing
    if the number of tourists visiting a city is increasing or decreasing over time.


    +   **Seasonality detection**: Use for finding repeating patterns within a certain
    time period, for example noticing that ice cream sales are always higher in the
    summer.


    +   **Anomaly detection**: Use for finding unusual or unexpected events, for example
    spotting a sudden drop in website traffic.


    Components of time series:


    +   **Trend**: The long-term movement in the data.


    +   **Seasonality**: Regular, repeating patterns or cycles.


    +   **Noise**: Random variability not attributed to trend or seasonality.


    Techniques for time series forecasting:


    +   **Exponential smoothing**: This applies exponentially decreasing weights to
    past observations for forecasting, which means it gives less weight to older values.'
  merge: -1
  img_proc: true
