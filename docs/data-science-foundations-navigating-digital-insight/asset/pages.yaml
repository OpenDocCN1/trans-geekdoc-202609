- pgno: 187
  md: '+   - Null hypothesis ($H_0$): This assumes no effect or relationship between
    variables. It acts as the default assumption tested against the alternative hypothesis.


    +   - Alternative hypothesis ($H_A$): This suggests that an effect or relationship
    exists. Researchers aim to support this through statistical testing.


    # Formulating a hypothesis


    Crafting a hypothesis involves identifying a research question and developing
    a testable statement. For example, a retail chain might investigate the effect
    of a new store layout on sales:


    +   - $H_0$: The new store layout does not affect sales.


    +   - $H_A$: The new store layout increases sales.


    # Hypothesis testing


    Hypothesis testing involves statistical methods to determine whether to reject
    the null hypothesis:


    +   1. Selecting a significance level ($\alpha$): Commonly set at 0.05 (5 cent),
    this represents the probability of rejecting the null hypothesis when true (Type
    I error).


    +   2. Calculating a test statistic: This quantifies the difference between observed
    data and the null hypothesis, using'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'metrics such as t-score or z-score.


    +   3. **Making a decision:** A critical value is calculated based on a number
    of factors including the significance level and test type. This is then compared
    to the test statistic to determine whether the null hypothesis should be rejected
    or accepted.


    Business example


    A pharmaceutical company tests whether a new drug reduces blood pressure more
    effectively than an existing drug. The hypothesis test determines if the observed
    difference is statistically significant, guiding product development decisions.


    # HOW TO CHOOSE BETWEEN DIFFERENT MODELS


    When working on a data science project, one of the most important decisions you’ll
