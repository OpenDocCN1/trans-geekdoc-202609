    Will this harm anyone?


    Are people happy for their data to be used in this way?


    Will it harm?


    Harm can occur in many forms. It could be direct harm, or it could be indirect.
    Harm doesn''t have to be physical; it could be harmful to other aspects of our
    lives, including educational prospects, financial well-being and social relationships.
    When thinking about harm, we need to consider the risk of harm and'
