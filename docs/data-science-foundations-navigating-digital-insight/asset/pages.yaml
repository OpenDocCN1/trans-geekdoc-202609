- pgno: 240
  md: '# VISUALISATIONS


    # CONSIDERATIONS


    Telling your story is a well-proven tactic when trying to get a message across
    to others, but using the power of statistics can also enable you to create visualisations
    that leave lasting impressions on your audience. Knowing what people will ‘enjoy’
    looking at, and ensuring they ‘see’ the right conclusions, are a critical part
    of working with data – numbers can transform into stories, insights leap off the
    page. In this chapter, we''ll explore the art and science of creating compelling
    visualisations that not only convey information but also engage your audience.
    We’ll cover key considerations, discuss user experience (UX) and accessibility
    and stress the importance of clear labelling.


    Know your audience


    Before you even start choosing or designing your visualisation, it''s crucial
    to understand who will be viewing it. Are they data-savvy analysts or business
    executives looking for quick insights? Knowing your audience helps you to tailor
    the complexity and style of your visualisations to meet their needs. Analysts
    might appreciate detailed visualisations with'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'interactive elements. Executives often prefer high-level overviews with clear,
    concise messages.


    # Choose the right chart type


    Selecting the appropriate chart type is like choosing the right tool for a job.
    Different types of data and messages call for different visual representations.


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_241_0.png)


    **Bar charts:** These are great for comparing quantities across categories.


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_241_1.png)


    **Line charts:** They are ideal for showing trends over time.


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_241_2.png)


    **Pie charts:** These are useful for displaying percentages or the share of a
    whole. Be careful, though, because pie charts are often over-relied upon and used
    for the wrong purposes. Use sparingly.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '![](img/7ae4e3b756b64cea6e0099c9c3867e53_242_0.png)


    **Scatter plots:** These are perfect for illustrating relationships between variables.


    Simplify, simplify, simplify


    When it comes to visualisations, less is often more. Avoid clutter by focusing
    on the most important data points and removing unnecessary elements. Simplicity
    not only enhances clarity but also makes your visualisations more aesthetically
    pleasing.


    Use colour wisely


    Colour can be a powerful tool in your visualisation arsenal, but it must be used
    thoughtfully. Stick to a cohesive colour scheme and use colour to highlight key
    information rather than overwhelm the viewer.


    +   - **Consistent colours:** Maintain consistency across visualisations for easy
    interpretation. Lots of organisations have a ‘theme’ or ‘palette’ of colours to
    use.

    - **Contrasting colours:** Use contrast to draw attention to important data points.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# USER EXPERIENCE IN DATA VISUALISATION


    Intuitive design


    An effective visualisation should be intuitive, allowing users to grasp the message
    quickly. Arrange elements logically and ensure that the flow of information is
    natural.


    +   - **Hierarchy**: Organise elements to guide the viewer’s eye to the most important
    information first.

    - **White space**: Use white space strategically to separate elements and improve
    readability.


    Interactivity


    Interactive elements can enhance user experience by allowing viewers to explore
    data at their own pace. Consider incorporating features like tooltips, filters
    and zooming to provide a richer experience (Figures 11.1 and 11.2).'
  merge: -1
  img_proc: true
