- pgno: 119
  md: '# SOURCING


    One of the key ingredients of data science is, as the name applies, data. As we
    have discussed in the previous chapter, the data used in any project can be the
    difference between a good outcome and a bad one. To be clear, a good outcome isn''t
    just proving a hypothesis. Failing to prove a hypothesis can be equally valuable,
    potentially avoiding making a poor decision based on a false premise.


    Sourcing data isn''t just about finding some data, it is about ensuring the data
    set contains the data items needed and has the right data properties to allow
    the analysis. In some instances, the source data might need to be manipulated
    to derive data. In [Chapter 8] we have an example of this in data granularity,
    where daily data is used to calculate a monthly figure.


    Remember, just because data is available, it doesn''t mean that you can use it.
    There are both legal and ethical constraints need to be considered. These are
    addressed in [Chapter 4].


    # BIG DATA


    Data is everywhere in the world around us. We are surrounded by the radio frequencies
    that carry data for the devices we use'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'every day. This data permeates all aspects of our lives, whether it is checking
    social media or tapping a payment card to travel on the Tube. The acceleration
    in data has led to the term Big Data and three concepts relating to it: volume,
    velocity and variety. These are known as the 3Vs Figure 7.1, and can be useful
    in helping us to consider some of the challenges related to sourcing data.


    +   **Volume:** This considers the amount of data that is generated. Think about
    how much data a quick coffee stop can generate. As you walk through the door,
    the security camera will record you, the coffee machine will log its use, your
    payment will be recorded and that''s all before you hit social media while you
    enjoy the caffeine hit. If you look at all the activities in a day that generate
    data, both human and attention automated, that''s a lot of data.


    +   **Velocity:** Think about the speed at which the data is created and processed.
    The camera is a real-time recording, the payment is processed in the time it takes
    to say ‘thanks’, the coffee machine will instantaneously flag it if it needs attention
    (after all, time is money) and your social interaction is co-temporal. As you
    can see, much of the data around us is moving fast – very fast.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '![](img/7ae4e3b756b64cea6e0099c9c3867e53_121_0.png)


    +   - **Variety**: We can see the variety of data being created. We have the unstructured
    data of video and social media alongside the structured data of the payment and
    internet of things (the coffee machine sending its data). If we want to use this
    data, we need to be able to store it and, and equally important, be able to access
    it.


    Other Vs have been added to the 3Vs, and reference is often made to the 5Vs.


    +   - **Veracity**: This relates to the quality and accuracy of the data. Data
    quality is covered in more detail later in this chapter.

    - **Variability**: Organisations might have inconsistencies in their data. Take
    employees: in one system this might refer to'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'people with employment contracts, in another it might include agency staff.


    For us as data scientists, this all creates challenges in identifying and accessing
    the data we need. It can also cause issues as we address the constraints of storing
    and processing the data.


    # DATA COLLECTION


    We talked about several different sources of data when having our coffee break.
    These use different methods to collect the data:


    +   **Cameras** record digital images, which are data. These can be video or still
    images.


    +   **Sensors** automatically record data and frequently send it to a central
    data repository. This includes the coffee machine recording usage and flagging
    any issues.


    +   **Transferred data** occurs when you add your favourite snack to the coffee,
    because the barista might scan the barcode on it, transferring data from the item
    to the point-of-sale system. The same is true when you tap your card to pay for
    it, your details on the card are read by the system.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '+   * **Human entry** via keyboards, mice, touch screens and other data entry
    devices. In the coffee shop, the barista might use a touch screen to record the
    sale of your coffee. You also enter data when you give the coffee shop a five-star
    review on the shop’s app.


    +   * **Derived data** is created when existing data is taken and manipulated
    to develop a new data set. The coffee shop might take all your coffee transactions
    and determine from this what customer persona you fit.


    +   * **Synthetic data** is created when a data set is artificially generated.
    This can be beneficial where there is limited real-world data or concerns exist
    about its quality. In some instances, rather than using actual customer data,
    an organisation will synthesise customer data to overcome privacy concerns.


    It is also worth considering how these different collection methods can be joined.
    Let''s take our coffee machine. Its sensors record how hot the water is. This
    data is then transferred to head office. Here, an algorithm is applied using this
    and other data to determine whether the machine needs a service, resulting in
    a request for maintenance, where a service call is automatically scheduled. This
    is an example of the internet of things in action, where devices collect and share
    information with each other.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'When we collect data from people, it is often in the form of having them enter
    data into a system or complete a survey. We consider the risks relating to this
    and how they can be mitigated further on in this chapter.


    # PRINCIPLES OF DATA: DATA TYPES


    In sourcing data, different types of data can be considered. The data types we
    are considering here are the data types associated with the principles of data.
    The term ‘data type’ is used in different contexts, where it has a different meaning,
    an example being data types used by computers. We can think of the principles
    of data, data types, as indicating the availability of data and the reason for
    its creation (Figure 7.2). The difficulty with these labels is that they can have
    slightly different meanings depending on who you are talking to. If you come across
    these terms, it is always worth checking which are relevant and their meaning
    in the context you find them.


    Availability refers to how accessible the data is, and has three broad categories:


    +   **Public data**: This is generally taken to mean any data that is publicly
    accessible, that is, anyone can access it. This includes data found on the internet
    and social media. It is worth'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'remembering that just because something can be accessed doesn’t mean it can
    be used. If you are intending to go on holiday, then the flight times and prices
    presented to you online are public data. That doesn’t necessarily give you a catch-all
    right to collect and use them.


    +   **Open data:** This is a subset of public data, normally released by a government
    or its agents. In this instance, the data is of a known quality, and it has a
    licence associated with it that determines how it can be used. The benefit of
    this is that the data is transparent and therefore can be used with confidence.
    This doesn’t mean the data is free; in some instances, a fee might be payable
    for its use. Census data published by the Office of National Statistics (ONS)
    is an example of this type of data.


    Figure 7.2 Types of data (availability and creation)


    | Availability | Open | Public | Proprietary |

    |---|---|---|--|

    | Creation | Research | Administrative / Operational |


    +   **Proprietary data:** This is data that is not publicly available. The individual
    or organisation who owns it has not made it'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'public and they control how it is used.


    Creation refers to how the data was generated. It can be split into two categories:


    +   - **Administrative and operational data**: This is the data generated through
    the activities of an organisation, and the terms aren’t mutually exclusive. The
    transaction details of our coffee purchase are administrative and operational
    data. Similarly, if we grew coffee and recorded the yield of the crops and the
    weight of beans roasted, these would also be administrative and operational data.

    - **Research data**: Where data is specifically collected for a study or from
    an experiment, it is research data. Thinking back to the link between smoking
    and cancer, the data used to prove this would be research data. This data tends
    to be academic in nature, so if you respond to a survey about your morning coffee
    it might be better seen as administrative or operational data as it has been collected
    to run an organisation better.


    # FINDING DATA


    When sourcing data there are various places we can find it. We might already have
    it in our organisation. If we haven’t got it,'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'we might be able to obtain it from a third party. Failing that, we will need
    to collect it ourselves.


    In a world of Big Data, organisations hold a lot of data. This is proprietary,
    administrative and operational data. It is not always clear what data is available
    nor its quality. Data governance covered in this chapter, can assist with this.


    It is possible to source open and public data. In some instances, data is published
    online. This can provide a rich source of data (e.g. Census data). It is also
    possible to purchase data from third parties; an example of this is financial
    trading data. Data can also be obtained from social media and other websites using
    approaches such as screen scraping or via their programming interfaces.


    There is huge variation in the scope and scale of data collection activities.
    Consider the effort involved in collecting data in a pharmaceutical trial compared
    to a small customer survey. Thought must be given to the method of data collection
    to ensure the quality of the data. In all instances, don''t underestimate the
    effort involved because there are often unforeseen challenges that need to be
    resolved, as can be seen in our case studies in Chapter 15.'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'When we rely on people to collect data, we need to remember they are human,
    and humans make errors. This is particularly the case when typing in information.
    Therefore, it is helpful to ensure that the data people are entering is validated.
    This might be through using drop downs or tick boxes or checking the format of
    the information. Think about when you enter an address to have your latest online
    purchase sent to. You might type in the address and the system will check that
    the postcode is valid. It’s even better if the postcode is used to look up the
    address, allowing you to select your postal address from a trusted source. In
    this instance, there is less chance of your parcel going astray. It also results
    in quality data for our algorithm to help us better profile our customers.


    No doubt you are frequently asked to take part in a survey, normally on your customer
    experience or a product you have bought. The challenge with surveys is ensuring
    you have a representative set of data and that the questions you ask are clear.
    You might think that this is easy, but even the experts get it wrong, as can be
    seen the UK 2021 census. In this case, the statistics on gender identity downgraded
    from official statistics, due to potential confusion over the question being asked
    (Melley, 2024).


    # STORING DATA'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'In many instances, organisations set up separate data stores, which allow data
    to be accessed without affecting operational systems. They also have the advantage
    of data reuse, reducing costs and increasing efficiency. Three types of stores
    are often referred to:


    +   - Data lake: This is a store of data in its raw format, which can contain
