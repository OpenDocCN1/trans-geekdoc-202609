  md: '# GLOSSARY


    3Vs: Relates to the volume, velocity and variety of Big Data.


    5Vs: Adds veracity and variability to the 3Vs.


    Accuracy: The completeness of a data set.


    Administrative data: Data that has been generated through the activities of an
    organisation.


    Aggregation: Combining data – often used to report on a group rather than individuals,
    where individuals might be recognised if reported on individually.


    Agile: Often used to refer to iterative and incremental methods of project delivery
    – the term relates to software delivery methods based on principles set out in
    the Agile Manifesto.


    AI Act 2024: European Union regulations for the use of artificial intelligence.


    Algorithm: A sequence of steps or instructions to solve a problem, which might
    be found in a method.


    Apriori algorithm: A method used in data mining to find frequent item sets and
    generate association rules.'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'ARIMA: A statistical method used for forecasting time series by analysing past
    values – it uses a mix of moving averages and regression methods.


    Array: A structured collection of items, often in rows and columns, used in programming
    and data analysis.


    Artificial intelligence: Where a computer system performs a task normally done
    by a human.


    Association rules: Patterns that show relationships between variables in data
    – often used in market basket analysis.


    Bias: A systematic error that leads to incorrect results – it can happen in data
    collection or analysis.


    Big Data: Used to describe the prevalence of data in today’s society, having three
    key core concepts: volume, velocity, variety (the 3Vs).


    Box and whisker plot: A graphical representation that shows the distribution of
    data based on five summary statistics.


    Cartesian plane: A two-dimensional space defined by an x axis (horizontal) and
    a y axis (vertical) used to plot points.


    Categorical: Data that can be placed into groups.'
  merge: -1
  img_proc: true
- pgno: 346
  md: 'Classification: A method of grouping data into categories based on characteristics.


    Clustering: A technique that groups similar data points together without predefined
    categories.


    Correlation: A measure of how two variables are related – it shows whether they
    move together or in opposite directions.


    CRUD: Create, read, update, delete – often referred to as the data lifecycle.


    Data analysis lifecycle: A framework setting out the iterative steps needed to
    successfully deliver a data project.


    Data classification: This can have different meanings:


    +   * A way of categorising data to support good governance.

    * To define the nature of the data, for example structured/unstructured.

    * A method for analysing data.


    Data governance: Sets out the strategy of managing data and operationalises it.


    Data lake: A data store where the data has been stored in its raw format.'
  merge: -1
  img_proc: true
- pgno: 347
  md: '**Data lifecycle:** The lifecycle of a data item or data set, often referred
    to as CRUD.


    **Data mart:** A subset of a data warehouse focused on a specific domain, for
    example sales.


    **Data Protection Act 2018:** The UK law giving effect to GDPR.


    **Data science:** Using analytical methods in an endeavour to gain insight from
    diverse data, or the art of finding patterns in data.


    **Data set:** A collection of data.


    **Data storytelling pyramid:** A framework for narrative consisting of background,
    trigger, key findings and action.


    **Data structure:** Ref to the structure in which data is held, for example a
    table.


    **Data type:** How data is held in a field, for example integer – it can also
    refer to whether the data is public, open, administrative or research.


    **Data warehouse:** A data store where the data is used for reporting – the data
    is often prepared to enable this.'
  merge: -1
  img_proc: true
- pgno: 348
  md: 'Decision tree: A flowchart-like structure that helps to make decisions based
    on different conditions.


    Deep learning: A term used to describe the use of neural networks with many layers.


    Derived data: Where new data is created from combining or transforming existing
    data.


    Descriptive analytics: Analysing data to describe what happened – it uses past
    data to summarise results.


    DIKW: A framework representing data, information, knowledge and wisdom.


    Domain: The context in which the project is taking place – this informs the problem,
    the stakeholders and the interpretation of outputs.


    ELT: The process of extracting, loading and transforming data.


    Enrich: Where additional data is added to a data set.


    Ethics: The principles by which we and society judge our own and others’ behaviours
    – these change over time.


    ETL: The process of extracting, transforming and loading data.'
  merge: -1
  img_proc: true
- pgno: 349
  md: '**Export:** Where data is taken from a data store.


    **Feature:** Key characteristic or attribute of a data set.


    **Feature scaling:** Creating a common scale for different features, that is,
    ensuring they have the same range.


    **Foundational model:** A form of generative AI that has been pre-trained and
    can be adapted to different uses.


    **Four pillars of data storytelling:** Design principles to aid the visualisation
    of data storytelling consisting of symbols, colour, captions and editorial layout.


    **GDPR:** The General Data Protection Regulation contains the European Union’s
    rules for use of data.


    **General AI:** Artificial intelligence that can handle all tasks a human can
    undertake.


    **Generative AI:** Artificial intelligence that generates new data or content.


    **Granularity:** The level of detail in the data.


    **Hallucination:** Where artificial intelligence makes something up, that is,
    returns an incorrect result.'
  merge: -1
  img_proc: true
- pgno: 350
  md: '**Heat map**: A graphical representation of data where values are depicted
    by colour – it helps to visualise data density.


    **Histogram**: A graphical representation of the distribution of numerical data
    showing the frequency of data points in intervals.


    **Hybrid**: A method of project delivery combining aspects of linear and iterative
    and incremental methods.


    **Hypothesis**: A theory that provides a starting point for an investigation.


    **Hypothesis testing**: A test to determine statistically the extent to which
    a hypothesis can be explained by the data.


    **ICO**: The Information Commissioner''s Office can investigate and take enforcement
    action for breaches of data protection laws.


    **Imputation**: Where a value is given to a missing data item, often determined
    from the data around it.


    **Insight**: An understanding of what the model has revealed upon evaluation.'
  merge: -1
  img_proc: true
- pgno: 351
  md: '**Intellectual property:** Referred to created works such as music, art and
    literature.


    **Internet of things:** A network of interconnected devices embedded with sensors
    and software.


    **Interval:** A type of quantitative data where the difference between values
    is meaningful, but there is no true zero – an example is temperature in Celsius.


    **Latency:** The delay in transferring or processing data.


    **Lineage:** The origin and history of the data set.


    **Linear regression:** A statistical method that models the relationship between
    a dependent variable and one or more independent variables using a straight line.


    **Lists:** A simple collection of items, usually in a specific order.


    **Load:** Where data is placed in a data store.


    **Machine learning:** Where software designed to perform a task improves the more
    it undertakes a task.


    **Metadata:** Data about data.'
  merge: -1
  img_proc: true
- pgno: 352
  md: 'Method: A technique used to analyse the data.


    Model: A representation of a problem space made up of methods and data.


    Narrow AI: Artificial intelligence that is designed to perform a specific task.


    Neural network: A branch of machine learning that uses layers of nodes to take
    inputs and deliver an output.


    Nominal: A type of qualitative data that categorises without a specific order,
    for example colour.


    Obfuscation: The blurring of data to data to preserve confidentiality.


    One-hot encoding: Converting categorical data into numerical data.


    Open data: Public data of a known quality and a licence for its use.


    Operational data: Data that has been generated through the activities of an organisation.


    Ordinal: A type of qualitative data that has a clear order or ranking, for example
    ratings (such as 1 star to 5 stars).'
  merge: -1
  img_proc: true
- pgno: 353
  md: '**Outlier:** A data point that is significantly different from others – it
    can skew results.


    **Overfitting:** A modelling error that occurs when a model is too complex and
    learns noise in the training data, making it perform poorly on new data.


    **Pattern:** An arrangement or sequence of data normally found through examining
    a model.


    **PESTLE:** A framework for identifying external factors that might affect a project,
    the external factors being political, economic, socio-cultural, technological,
    legal and environmental.


    **Power interest grid:** A framework to help determine how to manage stakeholders
    based on their different levels of power and interest.


    **Predictive analytics:** Using data and statistical algorithms to forecast what
    might happen in the future.


    **Prescriptive analytics:** Analysing data to recommend actions – it tells you
    what to do based on predictions.'
  merge: -1
  img_proc: true
- pgno: 354
  md: '**Principles of data:** Used to describe high-level principles applied when
    discussing data – this has no formal definition but commonly encompasses the data
    analysis lifecycle and the concept of open, public, proprietary, administrative
    and research data.


    **Principles of user experience:** Useful, desirable, usable, valuable, accessible,
    findable, credible.


    **Proprietary data:** Data that is owned and controlled by an organisation.


    **Public data:** Any data that is publicly accessible – this does not imply a
    right to use it.


    **p-value:** A number that helps to determine the significance of results in hypothesis
    testing – a low *p*-value indicates strong evidence against the null hypothesis.


    **Qualitative:** Data that describes qualities or characteristics, for example
    colours, names and opinions.


    **Quantitative:** Data that can be measured and expressed as numbers, for example
    height, weight and age.'
  merge: -1
  img_proc: true
- pgno: 355
  md: 'Ratio: A type of quantitative data with meaningful differences and a true zero,
    for example weight and height.


    Redaction: The blanking of data to preserve confidentiality.


    Research data: Data that has been collected for a specific study or experiment.


    Sampling: The process of selecting a small group from a larger population to study.


    Significance level: A threshold in statistics to determine if results are likely
    due to chance – commonly set at 0.05 or 5 per cent.


    Skew: A measure of how much a distribution leans to one side – positive skew means
    it leans right; negative skew means it leans left.


    Stakeholder: Anyone with an interest (stake) in a project or its outcome.


    Stakeholder wheel: A framework to help identify stakeholders.


    Standard deviation: A measure of how spread out the data points are from the mean
    – a low standard deviation means data points are close to the mean.'
  merge: -1
  img_proc: true
- pgno: 356
  md: '**Stem-and-leaf plot:** A method of displaying quantitative data that retains
    the original data values while showing the shape of the distribution.


    **Storytelling:** Using narrative to aid audience understanding.


    **Stratified:** A sampling method where the population is divided into groups
    (strata) before sampling to ensure representation.


    **Summary statistic:** A number that summarises or describes a set of data, like
    mean, median or mode.


    **Supervised learning:** Where the data is trained on is labelled or tagged.


    **Synthetic data:** Artificially generated data.


    **Tool:** Software used to build and analyse models.


    **Train and test data sets:** In machine learning, the training data set is used
    to train the model, while the test data set is used to evaluate its performance.


    **Transform:** Where data form or structure is changed.


    **Transparency:** The ability to understand how artificial intelligence has reached
    a result.'
  merge: -1
  img_proc: true
- pgno: 357
  md: '**Trend:** A pattern of changes over time.


    **Unsupervised learning:** Where the model learns by looking for patterns in unlabelled
    data.


    **User experience honeycomb:** A framework showing the seven principles of user
    experience.


    **Variability:** The inconsistency in data – one of the 5Vs.


    **Variance:** The average of the squared differences from the mean – it shows
    how much the data varies.


    **Variety:** A concept of Big Data highlighting the diverse range of data generated.


    **Velocity:** A concept of Big Data highlighting the speed at which data is created
    and processed.


    **Veracity:** The quality of data – one of the 5Vs.


    **Volume:** A concept of Big Data highlighting the vast amounts of data being
    created.


    **Waterfall:** A linear method of project delivery where activities are cascaded,
    one activity being completed before another starts.'
  merge: -1
  img_proc: true
