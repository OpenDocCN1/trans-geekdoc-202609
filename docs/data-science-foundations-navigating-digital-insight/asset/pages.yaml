    +   **Support**: How often items appear together as a percentage of total transactions.

    - **Confidence**: How likely it is that item 2 is purchased when item 1 is purchased.


    Let’s find some rules with minimum support of 40 per cent (appears in two out
    of five transactions):


    # Step 1: Find frequent item sets


    +   - {battery pack} appears in 4/5 transactions = 80 per cent.

    - {case} appears in 4/5 transactions = 80 per cent.

    - {screen protector} appears in 4/5 transactions = 80 per cent.

