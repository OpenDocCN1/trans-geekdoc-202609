- pgno: 46
  md: 'The stakeholders go much wider than this. If we think about the health implications
    of smoking, then the funders of health care, whether insurance companies or taxpayers,
    will be interested. This in turn would create interest from people paying for
    services. In fact, the public’s interest in the first instance is likely to be
    driven by wider health concerns rather than the financial implications. By this
    point, both politicians and governments will be showing an interest.


    It isn’t always obvious who is going to be interested in a data science project.
    It is unlikely those who developed the dynamic pricing for concert tickets would
    have expected this to draw comment from the United Kingdom’s prime minister. Those
    comments came following the public reaction to prices charged for the Oasis 2025
    tour (McArthur and Youngs, 2024).


    From the above, we can see that a wide range of people have a stake in the analysis.
    Understanding who they are and why they have a stake in the analysis is important.
    This can affect how a problem is framed and how the outcome is communicated, including
    who to. More importantly, who the stakeholders are needs to be understood to identify
    any ethical issues – if they are not clear, ethical considerations might not be
    apparent.


    The stakeholder wheel'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'The representation of the smoking and cancer stakeholders above uses the ‘stakeholder
    wheel’ (Figure 2.2). This is a useful framework for helping to identify the stakeholders
    in any piece of analysis. It sets out the different categories of stakeholder,
    and these can be considered to see if they apply to your project.


    # Figure 2.2 The stakeholder wheel


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_47_0.png)


    The categories are:


    +   - **Partners**: These are organisations that provide specialist services to
    an organisation. These include organisations to whom data services are outsourced.


    +   - **Suppliers**: These are organisations that provide the goods and services
    an organisation uses. These could be impacted'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'by analysis that is undertaken, for example changes in demand for their goods
    and services or in contractual terms because of a data science project.


    +   **Regulators**: Most organisations are subject to regulation that might be
    general or specific to the sector. Most organisations are subject to regulations
    relating to their use of data. These regulations are shaped, implemented and enforced
    by regulatory authorities.


    +   **Employees**: These are the people who work within an organisation and, like
    suppliers, could be impacted by the analysis undertaken.


    +   **Managers**: This group are the people commissioning and acting on the data
    analysis.


    +   **Owners**: There are several different ways an organisation can be owned.
    For a commercial organisation, it could be direct ownership by individuals or
    through shares. This group tends to provide oversight and can set strategy. Notfor-profit
    organisations tend to be ‘owned’ by trustees. Data science can affect their investment
    decisions and how they shape the organisation’s future.


    +   **Competitors**: Most organisations have competitors, whether it be for customers
    or funding. The industry they are in could be impacted by insight gained by another
    organisation (as'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'with tobacco), or how organisation acts in response to the insight gained (such
    a launching new product).


    +   * **Customers**: This group might change their behaviours because of data
    science. This could be through consuming more product (e.g. streaming another
    movie based on a recommendation) or stop using a product (as many people have
    done with tobacco).


    +   * **Data subjects**: These are the people whose data is used by a project.
    For the smoking and cancer analysis, it would be the smokers and non-smokers who
    were subject to the research. It is important to identify this group of stakeholders
    as you need to understand them to ensure their data is used ethically and lawfully.


    +   * **Society**: This is a bit of a catch-all. Is the project likely to have
    a wider impact on society? If so, who might be interested? In considering this,
    you might want to focus in on specific segments of society. For example, if looking
    at the accident and emergency waiting times for a particular hospital, there might
    be little national interest but lots of local interest.


    The stakeholder wheel is a framework that can be adapted to the projects you undertake.


    What changes might we make if we were working on data science projects for a recruitment
    company? A common'
