    +   - {case, screen protector} appears in 3/5 transactions = 60 per cent.


    +   - {battery pack, case, screen protector} appears in 2/5 transactions = 40
    per cent.


    # Step 2: Generate rules and calculate confidence


    For {battery pack, case}:


    +   - If customer buys battery pack, they buy a case:


    +   - Confidence = 3/4 = 75 per cent.


    +   - If customer buys a case, they buy a battery pack:


    +   - Confidence = 3/4 = 75 per cent.


