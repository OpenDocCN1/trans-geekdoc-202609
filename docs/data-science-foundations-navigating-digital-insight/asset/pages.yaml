    # Association


    # Understanding association rule mining


    Association rule mining identifies relationships and patterns within data sets,
    often used in market basket analysis to discover associations between products
    purchased together. Imagine you''re at a grocery store – association rule mining
    is like noticing that people who buy water often also buy crackers. It helps us
    to discover interesting relationships and patterns between different items in
    a data set.


    # Apriori algorithm


    The Apriori algorithm is a popular method for mining frequent item sets and discovering
    association rules. It uses a bottom-up approach, generating candidate item sets
    and pruning those that do not meet a minimum support threshold.


    # STATISTICAL MODEL – APRIORI ASSOCIATION RULES'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'When to use association rule mining:


    +   - **Market basket analysis**: Understanding which products are frequently
    bought together to optimise product placement and create targeted promotions.

    - **Web usage mining**: Analysing website traffic to understand user behaviour
    and improve website design.

    - **Medical research**: Identifying potential risk factors for diseases by analysing
    patient data.

    - **Fraud detection**: Discovering patterns of fraudulent transactions.


    # The output


    Association rules do not **predict** outputs, but are very good at spotting patterns
    in very large data sets that a human would struggle to see just by looking.


    The model outputs a few values that quantify associations between items.


    Key concepts:


    +   - **Support**: This is the proportion of transactions that contain a particular
    item set.'
  merge: -1
  img_proc: true
- pgno: 234
  md: "+   * **Confidence**: This is the likelihood that a rule is true for a transaction\
    \ (two or more items) that already contains the first item.\n* **Lift**: This\
    \ is the ratio of the observed support to the expected support if the items were\
    \ independent.\n\n# The formula\n\n**Support** = the percentage of transactions\
    \ that contain an item (e.g. item 1).\n\n**Confidence** = the percentage of transactions\
    \ that contain item 1 and also contain item 2.\n\n| Lift = Support for Item 1\
    \ and Item 2 / Support for Item 1 $\times$ Support for Item 2 |\n\n![](img/7ae4e3b756b64cea6e0099c9c3867e53_234_0.png)\n\
    \n# What does it look like?\n\nImagine you own a mobile phone shop and want to\
    \ understand what products customers typically buy together. This could help you\
    \ to place different products together and increase sales even more."
  merge: -1
