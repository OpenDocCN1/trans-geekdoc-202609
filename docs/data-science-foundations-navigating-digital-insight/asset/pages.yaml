- pgno: 218
  md: 'at each step. A decision tree works by splitting the data into smaller groups
    at each step (called nodes) to make the groups as ‘pure’ as possible. Pure means
    that most of the items in a group belong to the same category (e.g. all ‘Yes’
    or all ‘No’). There are different ways of calculating how pure things are; one
    of the common methods is using entropy and information gain. Entropy measures
    uncertainty, and information gain tells us how much we reduce uncertainty by splitting:


    ```

    $H = -\sum_{C} p(c) \log_2 p(c)$

    ```


    To determine the best split, decision trees rely on a mathematical concept called
    information gain.


    $H_{attr}$ is the entropy


    ```

    $H_{attr} = -\sum_{V} p(v) \sum_{C} p(c|v) \log_2 p(c|v)$

    ```


    where $c$ is the outcome, $v$ is the attribute and $p$ is the probability of it
    occurring.


    ```

    $InfoGain_{attr} = H - H_{attr}$

    ```


    InfoGain = $H$: This means that the attribute and outcome are correlated and $H$
    is on a scale of 0 to 1, so InfoGain can be up to'
  merge: -1
  img_proc: true
