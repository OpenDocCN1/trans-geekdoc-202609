- pgno: 156
  md: 'When a data quality issue is found, you need to decide how to mitigate the
    risk it poses. There are several strategies that can be adopted, and thought needs
    to be given to how the strategy will affect the data set and model of which it
    is part.


    +   **Accept**: This is where the issue identified is accepted and you proceed
    to use the data set with the quality issue in it.


    +   **Correct**: In some instances, it is possible to correct the data quality
    issue. This might be a manual or automated process.


    +   **Remove**: The poor-quality data is removed from the data set. This is often
    through deleting the row or column of data that contains the issue. Removing data
    can lead to bias in the data set, especially when the data that is missing is
    not random. For example, if everyone occasionally forgot to enter data into a
    system, this is more random than if one member of staff consistently failed to
    load data.


    +   **Imputation**: In this instance, a value is determined for the missing data
    item and that value is used as a substitute. The substitute value is normally
    an estimate based on other data in the data set.


    +   **Enrich**: If a data set lacks the data it needs, it can be enriched. The
    data set could be missing data, or the data set might be too small. In some instances,
    there might not be sufficient variation in the data for the model to be effective.
    Enrichment is where additional data is added to address the'
  merge: -1
  img_proc: true
- pgno: 157
