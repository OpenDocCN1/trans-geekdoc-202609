- pgno: 299
  md: '# MACHINE LEARNING AND ARTIFICIAL INTELLIGENCE


    In Chapter 1 we recalled the dystopian future of Terminator: a future where machines
    have taken over the world and determine to eradicate humans. This has been a reference
    point for many of those writing about the risks of artificial intelligence. But
    what is artificial intelligence? How does machine learning relate to it? Where
    does data science fit into this?


    As with so many other terms we have come across, there is no consensus on the
    term artificial intelligence. The UK government define it by its adaptivity and
    its autonomy (Department for Science, Innovation and Technology, 2023). This is
    looking at AI from a technology and risk perspective, the adaptative and autonomous
    characteristics of the technology making it difficult to explain, predict and
    control. A similar approach is taken to defining AI in Section 3 of the EU’s Artificial
    Intelligence Act, which also refers to adaptiveness and autonomy (European Union,
    2025), these characteristics allowing the AI system to infer and act on implicit
    as well as explicit objectives. Both of these definitions have been drafted in
    relation to regulating AI. A step back from these takes us to a wider definition,
    which NASA has succinctly stated as:'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'Artificial intelligence refers to computer systems that can perform complex
    tasks normally done by human-reasoning, decision making, creating, etc. (NASA,
    2024)


    Therefore, we can see AI as adaptive and autonomous technology that performs tasks
    that have previously been the preserve of humans. This includes a wide range of
    applications, from dealing with a customer query to creating visual images – taking
    on the human roles in both call centres and creative endeavours.


    AI is currently built on digital technology, and a key component of this is machine
    learning (ML). What is machine learning? Well, it is a machine that can learn.
    We can think of this as software that is designed to perform a task or tasks,
    whose performance of the task improves the more it undertakes the task (Mitchell,
    1997). AI is built on complex ML techniques that give it the ability to adapt
    and act autonomously.


    That’s great, but where does data science fit into this? Data science is fundamental
    to ML. Machine learning is based on the application of algorithms (based on algebra,
    statistics and probability) to data, – as you know – is data science.'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'To summarise, data science methods are used to develop ML. ML can be applied
    to data science problems and to create AI (Figure 14.1). This means that, to an
    extent, the terminology can be used interchangeably, for example image recognition
    technology could be the application of data science, the use of ML or an example
    of AI.


    # Figure 14.1 The relationship between data science, machine learning and artificial
    intelligence


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_301_0.png)


    # MACHINE LEARNING


    We have defined ML as software that is designed to perform a task or tasks, and
    the performance of the task improves the more it undertakes the task. Let''s take
    image recognition, technology that uses ML: the more images you show it, the better
    it will be at identifying the images. How does it do this?


    Training and predicting


    For ML to work, the models need to be trained. Only when it has been trained can
    it be used to predict.'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'Training involves exposing the ML to data from which it can learn. What if
    you were asked to develop image recognition to determine whether there were potholes
    in the road? How would you train it? In this instance, you could train it by allowing
    the ML to consume many images of roads with potholes and those without.


    Once the ML has been trained, it can be used to predict. In our example, our image
    recognition system could be shown an image of a road and it would predict whether
    the road has potholes in it or not. A classification model.


    # Learning approaches


    There are two common methods of learning: supervised and unsupervised.


    # Supervised learning


    In supervised learning, the data used is labelled or tagged. This allows the ML
    to identify the patterns in the data associated with labels. The more data it
    consumes, the better the data patterns associated with the labels, and thus the
    better the ML is at applying labels based on the data presented.'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'How would this work with our pothole images? In this instance, you might expose
    lots of images of roads to the ML. Those with potholes in them would be labelled
    ‘pothole’, and those without wouldn’t. The ML would identify the patterns in the
    data associated with the ‘pothole’ label, and when shown an image with those patterns,
    would identify them as being associated with the label ‘pothole’, thus allowing
    potholed roads to be identified.


    # Unsupervised learning


    In the case of unsupervised learning, the data used is not labelled or tagged.
    Instead, the ML looks for patterns within the data. It can then cluster the data
    based on those patterns.


    How would this work for pothole detection? Simply put, the ML would consume images
    of roads with and without potholes. It would detect patterns in the data that
    distinguished the pothole images from those without, in effect creating two clusters:
    those with and those without potholes.


    If you think about it, supervised learning is great when you know what you are
    looking for, in our case potholes. Unsupervised learning might not be as effective
    in these cases. For example, when looking at the images of roads, it might'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'detect patterns relating to whether there are pavements or the time of day
    the images were captured. However, unsupervised learning comes into its own when
    you are unsure what you are predicting, for example if you are looking for patterns
    to help find faults and don’t know what those faults look like.


    These methods can be combined to enable the benefits of both supervised and unsupervised
    learning to be realised.


    # DATA SCIENCE AND MACHINE LEARNING


    Data science is used to develop ML. If you look at our image recognition example,
    you can see some of the data science methods we have explored being. In unsupervised
    ML, classification is used to identify the potholes. In our unsupervised ML, we
    are using clustering to determine the state of the roads.


    # NEURAL NETWORKS


    Neural networks is a branch of ML, and is fundamental to AI. They look to model
    how the brain works, with different connections between neurons firing in response
    to inputs, leading to outputs. If you see a ball coming towards you (input), you
    decide (neurons firing) whether to duck or catch it (the output).'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'The explanation of neural networks given here is a simple one, to provide a
    basic understanding. A neural network consists of layers of nodes (also known
    as neurons). The nodes in one layer are connected to the nodes in the adjoining
    layer. One layer is the input layer and one layer is the output layer. There may
    be one or more layers of nodes in between (Figure 14.2).


    When a node receives an input, it will provide a value to the nodes in the next
    layer down. Each node in that layer will calculate a value based on the inputs
    from the previous layer and send this to the next layer. This repeats until the
    output layer is reached, which is where the result is returned.'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# Figure 14.2 A neural network


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_306_0.png)


    Each connection has a weight associated with it. The value from the sending node
    is adjusted by the weight of the connector, and it is the adjusted value that
    is received by the node in the next layer. The values received by a node are then
    added up and adjusted by a unique value for that node called the bias. This determines
    the value sent to the next layer down. In training the neural network, the weighting
    associated with each connector is changed, as is the bias. These are adjusted
    until the neural network returns an optimum result. This approach to learning
    is called back propagation. It is often used with'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'reinforcement learning which interacts with an environment to maximise rewards.


    More complex versions of neural networks are used in generative AI solutions.
    These networks have many layers, and it is the huge number of layers that leads
    the use of them being described as deep learning.


    # ARTIFICIAL INTELLIGENCE


    NASA describes AI in relation to complex tasks normally performed by humans. AI
    is sometimes split into narrow AI and general AI. This is to distinguish between
    AI that can do specific tasks a human can do and AI that can do all the tasks
    a human can do (Figure 14.3).


    # Narrow AI


    Narrow AI is AI that is designed to perform a specific task. As such, it only
    has a narrow range of capabilities. In the last century, pre-2000, if you were
    asked to determine which roads had potholes it is likely you would need to look
    at the images of the road to identify them: a human task. We can now use ML to
    do this. This ML is performing a narrow AI task. It can identify potholes, but
    is unlikely to be able to spot missing roof tiles. It is'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'good at one specific task that would previously have involved a human.


    # General AI


    General AI is AI that can handle all the tasks that a human can undertake. At
    the time of writing, general AI has yet to be created. AI that goes beyond human
    capabilities is referred to as super AI.


    # Generative AI


    Generative AI has a different meaning from general AI, although they sound very
    similar. This type of AI is called generative as it generates new data. Depending
    on the model being used, this can be in different forms including images, words
    and sounds. This AI is seen as being creative because it produces new material
    that, due to the data it is built on, is meaningful. Therefore, it might generate
    computer code that works or a picture of a subject and in a style that people
    relate to. Generative AI is not general AI, it still lacks all human capabilities.
    Take large language models: these are a type of generative AI that create text
    reflecting natural language. Although not covering all human capabilities, they
    can be applied to many different tasks requiring the generation of'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'natural language whether it be a chatbot to book a hair appointment or advice
    on data protection.


    Figure 14.3 Hierarchy of AI definitions


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_309_0.png)


    # FOUNDATIONAL MODELS


    Foundational models are a form of generative AI. They are trained using extremely
    large quantities of diverse data. This creates a model that is pre-trained and
    can be adapted to different uses. As a result, new applications can be created
    much quicker and at significantly lower cost than would otherwise be the case.
    Foundational models work by predicting the next item in a sequence. In the case
    of language, this might be the next letter or word. The sequence then builds up
    into a comprehensible and meaningful language.


    Risks of AI'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'We will take a step back from the end of the world as an AI risk and focus
    on the more technical risks relating to AI outputs. The main risks can be summarised
    as:


    +   - **Bias**: Does the AI produce outputs that are in some way biased?

    - **Hallucination**: Has the AI made something up, so the output is in some way
    incorrect?

    - **Transparency**: Can you understand how the AI has reached the outcome it has?

    - **Privacy**: Do you understand, and are you happy with, the data you have provided
    is being used?


    In using AI within your work, it is important to understand your organisation’s
    policy in relation to AI. This will be designed to help mitigate these risks.


    Regulation of AI


    There are different approaches to the regulation of AI. The UK has a ‘pro-innovation’
    approach to AI regulation. This sets out five principles to be used by regulators,
    to regulate the use of AI within their specific sectors (Department for Science,
    Innovation and Technology, 2023). These are aligned to the risks outlined above
    and expressed as:'
  merge: -1
  img_proc: true
- pgno: 311
  md: '+   - safety, security and robustness;

    - appropriate transparency and explainability;

    - fairness;

    - accountability and governance;

    - contestability and redress.


    The USA also has a pro-innovation approach to regulation. This can be compared
    to China, who regulates specific AI products (e.g. generative AI).


    The EU was seen to take the lead on data protection and might be seen as being
    doing the same in relation to AI regulation. This is through the AI Act 2024,
    which provides a set of controls on AI based on the potential risk the AI poses.
    It is also proposing legislation to make it easier to seek redress where AI causes
    loss or damage (European Parliament, n.d.).


    # PRACTICAL TIPS


    +   - Use the language of data science, ML and AI in a way that is meaningful
    to your audience.

    - Consider the risks relating to each particular use of AI.

    - Before adopting a complex or expensive solution, consider if a simpler, cheaper
    one would be equally effective.'
  merge: -1
  img_proc: true
- pgno: 312
  md: '+   - Remember that ethics and lawfulness relate to the use of data in AI.

    - Check your company policy on AI use.'
  merge: -1
