    # MANAGING STAKEHOLDERS


    As we have discussed, a data science project can have a wide group of disparate
    stakeholders. They will have different stakes in the project, which means that
    we will need to deal with them'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'differently. This poses the problem of how to work out how to manage each stakeholder
    effectively to achieve good project outcomes. Fortunately, we have some frameworks
    that can help us in this. The first is the power interest grid, which in turn
    can help us us to develop a communication plan.


    # Power and interest


    We have already emphasised the different degrees of power over the project and
    interest in it that stakeholders have. In our phone project, the phone manager,
    who we will refer to as the sponsor of the project, will have lots of power and
    a high level of interest. Compare this with employees who will have little interest
    and little power (at least initially). In terms of managing these stakeholders,
    it would be sensible to put more effort into the sponsor than the employees. However,
    life isn''t simple, and you have stakeholders, such as regulators, who have substantial
    powers but little interest in specific projects. The regulator could impose large
    fines if employee data was misused in the phone analysis, but it is unlikely to
    be concerned with the project unless things go wrong. For employees, if the project
    results in changes to the phone service provided (e.g. the adoption of a more
    reliable but a less popular phone), they might suddenly have a lot of interest
    although still very little power.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'To help us navigate this, we can consider different strategies depending on
    the level of power and interest a stakeholder has. Potential strategies include:


    +   * **Keep close**: This is where you keep your stakeholder closely informed
    of what is happening so that their views can be understood and considered. This
    strategy tends to be applied with high power, high influence stakeholders.

    * **Keep onsite**: In this instance, enough is done to ensure that the stakeholder
    is satisfied that everything is in order and they don''t need to get involved.
    This is often used for stakeholders who have a lot of power but little interest.

    * **Keep informed**: This strategy is employed where stakeholders have lots of
    interest but little power. In this instance, it is about providing sufficient
    information and engagement to satisfy their interest.

    * **Keep track**: If a stakeholder hasn''t any real power or interest, it is sensible
    to keep track of them to see if this changes. If it does, one of the other strategies
    can be employed.


    This can be visual in a power interest grid (Newcombe, 2003), illustrated in Figure
    2.4. You will find various versions of this grid, some which are more complex,
    containing a wider range of management strategies.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'Figure 2.4 A generic power interest grid


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_56_0.png)


    Our phone project stakeholders are shown in Figure 2.5. It is a simple example,
    and you could have multiple stakeholders in each of the boxes for clarification.
    Why have we placed the stakeholders in the particular boxes?'
