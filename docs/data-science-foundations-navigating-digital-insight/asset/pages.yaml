- pgno: 180
  md: '+   - A weather app predicting tomorrow’s temperature and chance of rain.


    Tools and techniques:


    +   - Statistical models such as linear regression and time series forecasting.

    - Machine learning algorithms such as decision trees, random forests and neural
    networks.

    - Risk assessments and probability scores.


    Predictive analytics gives you a glimpse into the future, but it doesn’t tell
