    # STORYTELLING


    The idea of telling stories around data has its roots in data journalism. In data
    journalism, data is used to both find and evaluate stories. The story is then
    told based on the data. The story brings a narrative to the data that in turn
    helps the audience to understand the knowledge imparted. It creates an emotive
    response in the audience and acts as a call to action.'
  merge: -1
