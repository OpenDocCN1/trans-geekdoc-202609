    # Structure


    Data can be held in many different structures. These data structures include lists,
    arrays, records, trees and tables.


    +   * **Lists** are an ordered collection of data items. The items in a list can
    change.

    * **Arrays** are a collection of items that can be accessed by an index. An array
    can have multiple dimensions – a two-dimensional array often being represented
    as a matrix.

    * **Records** are collection of fields, which mark like a row in a table.

    * **Trees** are used to hold hierarchical data. The data is held in nodes that
    have a parent–child relationship with other nodes.'
