- pgno: 61
  md: '# PROJECT DELIVERY


    Projects that employ data science come in many different forms. Some, such as
    pharmaceutical research, might take many years, others can be delivered in an
    afternoon. However, they all have some common activities.


    If you are in a small business and looking to predict profitability for the next
    year, you need to: work out what you are doing; find and prepare your data; determine
    the methods to be used to analyse it; build your model; evaluate the outcome;
    and share your findings. The same activities are required if you are working for
    a pharmaceutical company on medical trials. However, in the first instance you
    might do everything in a day, in the latter case it is likely to take a team of
    people years.


    Therefore, you need to consider how the activities are going to be planned and
    managed. This includes understanding the problem space to be explored along with
    the resources and time needed to do it. If, having done this, the project looks
    feasible, you then need to bring those resources together, creating a team to
    deliver and manage the activities to fruition.


    # DATA ANALYSIS LIFECYLE'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'People can get very excited about the outcome of data science, but frequently
    don''t appreciate the effort that goes into that result. The data analysis lifecycle
    is a framework that looks at the steps needed to successfully deliver a data project.
    It can help in planning work and managing stakeholder expectations.


    There are many versions of the lifecycle, and, like all frameworks, it can be
    adapted for your needs. The one we have used in Figure 3.1 describes the steps
    in terms that easily relate to data science.


    The outer ring shows the overall flow through the steps from discovery to communication,
    while the inner ring shows that it is iterative. A step may be returned to and
    revisited at any point and any number of times. The circular nature also reflects
    that in answering one question others will arise, hence the flow from communication
    back to discovery.


    Each step contributes to the success of the data science initiative:


    +   **Discover** considers and defines the problem that the analysis will explore
    and the resources that will be needed to undertake it.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '![](img/7ae4e3b756b64cea6e0099c9c3867e53_63_0.png)


    +   - **Source** looks for and at the data that is available to answer the question.

    - **Prepare** ensures the data is of a suitable quality and format to be used
    in the analysis.

    - **Explore** investigates appropriate methods to answer the questions and the
    ability to use the available data to build effective models.

    - **Create** builds the actual models to be used in the analysis.

    - **Analyse** evaluates the models created.

    - **Communicate** shares the insight gained from the analysis of the models.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '+   * Operationalise embeds the analysis into the regular operation of an organisation.
    Many data science projects are a one-off investigation and therefore this step
    doesn''t always take place.


    Let us return to our phone fault example. What might the steps in the data analysis
    lifecycle look like?


    +   * Discover: We might receive a request by email or via a portal. A discussion
    might take place with the sponsor to clarify what they need from the analysis.
    Then this might be confirmed by email.


    +   * Source: Having considered the data we need to answer this question, we might
    look at the data available to identify suitable data sets to be used in the analysis.


    +   * Prepare: Once we have the data sets, we might not need all the data within
    them, so we might remove the data that isn''t needed. We might also find that
    some records are inaccurate, leading us to correct or remove them. Parts of the
    data could also be in an inappropriate format, for example the age of the phone
    is held as a string not an integer (these are data types in the database). Often,
    preparation is the most intensive activity in a data science project.


    +   * Explore: Having thought through the tools and methods available, we select
    the most ones, taking'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'account of our data. This might involve some prototyping of different models.


    +   - **Create:** We then build the model using the selected methods and data.


    +   - **Analyse:** The model outputs are considered and interpreted to allow us
    to draw conclusions on which phones are likely to develop a fault in the next
    six months.


    +   - **Communicate:** The results of the analysis can be communicated by us to
    those asking the question.


    +   - **Operationalise:** The exploration of phone reliability is a one-off project,
    so it does not need to be embedded into the operation.


    This scenario makes it look very easy to move through the flow, but in practice
    there is often significant iteration. We can consider some of the problems we
    might encounter in looking at phone faults (Figure 3.2):


    +   1. When trying to source the data, we can only find it for some phones. We
    therefore go back to those asking the question to confirm they want us to go ahead
    with a more limited scope.


    +   2. On preparing the data, we find that, although phone faults are contained
    in our data set, the details of the phone are contained in another data set that
    needs to be sourced.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '3. When exploring the methods, we find that the method needs the different
    makes of phone to be recorded as a separate data field, rather than all the makes
    being held in one data field, resulting in the need to restructure the data.


    4. On analysing the results of the model, we find that it is weak and requires
    further exploration, perhaps leading us to add or remove data fields to strengthen
    the model. In this case, going back two steps in the framework.


    5. On communicating the results, a further question is asked – whether a previous
    repair makes any difference – which, although in the model, isn’t something we
    considered, meaning that we need to analyse the model outputs further to respond
    to the question.


    Gates might be used to move from one step of the data analysis lifecycle to the
    next. This is where the project is reviewed to determine whether a step is sufficiently
    advanced to move on to the next (recognising the iterative nature of data science
    projects). This might be an informal discussion or, for larger more complex undertakings,
    a formal review to determine whether the gate should be passed through.


    # MANAGING THE LIFECYLE'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'Those commissioning projects often want a level of certainty from their projects:
    what will be delivered, when and at what cost. These three factors interact; when
    one changes, the others change. Data science projects are no different, with the
    added complication that, although an answer to the question posed might be delivered,
    it could have a level of uncertainty or might not give the answer the commissioner
    wants.


    **Figure 3.2 Phone fault data analysis lifecycle showing iterations**


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_67_0.png)


    To understand the three key aspects of a project – scope (the problem), the time
    and the cost – a feasibility exercise is often'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'undertaken before a project starts or at the start of the project. This looks
    at what will be needed to undertake the project and whether it is feasible. This
    is closely aligned with the discovery step in the data analysis lifecycle, and
    is covered in more detail in Chapter 5.


    Once a decision has been made to go ahead, the commissioner will want to track
    progress. Often this is delegated to a project manager. They will adopt an approach
    to managing the project''s progress. This might be a linear approach, or an iterative
    incremental one. In many instances, the approach will be a combination of the
    two.


    It is also worth remembering that the data science might be part of a larger project
    or programme of work. In this case, the data science part of the project will
    fall within the governance of the overall programme of work. If we were feeling
    entrepreneurial, we might want to launch an app that builds a perfect CV for any
    role, based on a person''s unique career history. This will clearly involve data
    science, creating the capability to understand what a good CV looks like for any
    role. However, there is other development activity required, for example developing
    the user interface, not to mention the sales and marketing required to launch
    the app. This illustrates that data science doesn''t take place in a vacuum.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Linear delivery


    Linear project delivery is often referred to as Waterfall – the idea being, as
    you complete one activity, you cascade to the next. This requires a clear understanding
    of all three factors, scope, time and cost, to allow a clear delivery plan to
    be created at the start of the project. Changes can be made in all these factors
    through change control. When a change is desired, it goes through the change control
    process to ensure the impact of the change is clearly understood. The change can
    then be accepted, with the plan being amended to reflect it, or the change can
    be declined.


    # Iterative and incremental delivery


    Iterative and incremental development involve a repeating process that incrementally
    addresses the problem. This often involves the use of sprints and backlogs. A
    backlog is a catalogue of work that needs to be done, and a sprint is a period
    to do the work. A project will have multiple sprints, with each sprint often being
    one or two weeks long. At the start of each sprint, it will have a number of the
    work items from the backlog assigned to it. If the sprint doesn’t deliver a backlog
    item, it is placed back in the backlog. This gives a high level of flexibility,
    as the content of the backlog can change as the'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'project progresses and items in the backlog can be prioritised for each sprint.
    Agile adopts these methods.


    # Hybrid delivery


    It is possible to take a hybrid approach. This might typically consist of a high-level
    linear plan with the detail being managed through sprints. In this situation,
    the data analysis lifecycle can provide the framework for the linear plan, showing
    the focus at any one time. The iterations required to address the problem are
    managed at the granular level through the backlog and sprints.


    # PRACTICAL TIPS


    +   - Plan your activity and time – the data analysis lifecycle can help with
    this.

    - Allow time to go back to previous steps – the data analysis lifecycle is iterative.

    - Planning can help to manage stakeholder expectations.

    - Consider how the project fits with other initiatives.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# ETHICS AND LAWFULNESS


    Data science opens a vast wealth of possibilities and opportunities. However,
    just because we can do something, doesn’t mean we should. What would your response
    be if asked to develop a model to predict the health outcomes for people like
    you? This might might have lots of positive benefits in improving health within
    the population, including you. That in turn might lead to economic gains, from
