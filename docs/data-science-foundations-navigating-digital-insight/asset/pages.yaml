  md: 'analysing historical data to understand what has already occurred. The goal
    is to summarise and interpret data in a way that makes it easy to see trends,
    patterns and key insights.


    Applications:


    +   - **Business reporting**: Creating dashboards to envisage sales performance
    over time.

    - **Customer segmentation**: Analysing demographic data to identify key customer
    segments for targeted marketing.


    Examples of descriptive analytics:


    +   - A retail store analysing last year''s sales data to see which products sold
