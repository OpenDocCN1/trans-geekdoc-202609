  md: '# Figure 9.1 The Cartesian coordinate plane


    ![](img/7ae4e3b756b64cea6e0099c9c3867e53_169_0.png)


    # Understanding the Cartesian coordinate system


    The Cartesian coordinate system, named after the French mathematician René Descartes,
    is a two-dimensional plane for plotting points, lines and shapes. It consists
    of two perpendicular axes: the horizontal axis (x axis) and the vertical'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'axis (y axis). These axes intersect at a point called the origin labelled as
    (0, 0).


    In Figure 9.1, the plane is divided into four quadrants:


    +   - **Quadrant I**: Both x and y are positive.

    - **Quadrant II**: x is negative, y is positive.

    - **Quadrant III**: Both x and y are negative.

    - **Quadrant IV**: x is positive, y is negative.


    Each point on the plane is represented by a pair of coordinates (x, y), indicating
    its position relative to the origin.


    # Plotting points


    Plotting a point involves identifying its x coordinate and y coordinate and locating
    its position on the plane. For example, the point (3, 4) is three units to the
    right of the origin and four units up.


    Steps to plot a point:


    +   1. **Locate the x coordinate**: Start at the origin and move horizontally
    to the x coordinate. Positive x values move right; negative x values move left.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '+   2. Locate the y coordinate: From the x coordinate position, move vertically
    to the y coordinate. Positive y values move up; negative y values move down.


    +   3. Mark the point: Place a dot at the intersection of the horizontal and vertical
    positions. Label the point with its coordinates for clarity.


    # Measuring distance between points


    The distance between two points on the Cartesian plane can be calculated using
    the distance formula, derived from the Pythagorean theorem. This formula provides
    a straightforward way to find the straight-line distance (or Euclidean distance)
    between two points.


    # Distance formula


    For two points, (x₁, y₁) and (x₂, y₂), the distance $d$ between them is given
    by:


    ```

    distance = \sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2}

    ```


    Example: calculating distance


    Let''s calculate the distance between the points A(1, 2) and B(4, 6).'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'Identify coordinates:


    $x_1 = 1, y_1 = 2$


    $x_2 = 4, y_2 = 6$


    Apply the formula:


    $d = \sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2}


    $d = \sqrt{(4 - 1)^2 + (6 - 2)^2}


    $d = \sqrt{(3)^2 + (4)^2}


    $d = \sqrt{9 + 16}$


    $d = \sqrt{25}$


    $d = 5$


    Therefore, the distance between points A(1, 2) and B(4, 6) is five units.


    In Figure 9.2, the line connecting points A and B represent the distance we calculated
    using the distance formula.'
  merge: -1
