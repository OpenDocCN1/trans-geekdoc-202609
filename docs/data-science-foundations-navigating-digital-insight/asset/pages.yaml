- pgno: 77
  md: 'Although there is no legal sanction for behaving unethically if that behaviour
    does not break the law, it is important as it is fundamental to trust and in turn
    reputation. If you are not concerned about reputation, it''s worth remembering
    the £37 billion loss of value in Facebook when questions were raised to how data
