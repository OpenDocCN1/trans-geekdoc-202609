  md: 'To be used in our tools and models, the data might need to be of a particular
    data type. For example, if we are forecasting future values over time, the dates
    in our data set will need to have the data type date/time. However, they could
    have been stored as a string data type, or the data type might have been corrupted
    in our export or load. Another example is where an integer is stored as a float
    or a string. It is therefore important to check and, where necessary, change the
    data type.


    When using dates, it is also worth considering their format. You might just be
    interested in the day, month and year, but the date may include a time as well.
    In this case, you might need to change the data type to address this or, in some
    instances, restructure the data to remove the parts that are not required.


    Scale


    When we measure things, we use different units of measurement, and these often
    have different ranges. For example, in measuring age we normally use years, and
    this range might be 0 to 120, if you are very lucky. In measuring daily mobile
    phone usage, the unit could be minutes and the range 0 to 1440, if you are an
    insomniac. Differences in the ranges of data can cause models to give undue weight
    to some attributes. In these circumstances, the data is scaled so that the'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'ranges across the attributes are the same. This then gives them equal weight
    in the model. There are different techniques to do this, referred to as feature
    scaling. Each attribute (referred to as a feature) is replaced with a value, often
    with a range between 0 and 1 or -1 to 1. In our example, using range of 0 to 1,
    if we had an age of 120 and scaled it, it would result in a 1. If the age is 60,
    the value would be 0.5. A1 would also be returned when someone spent 24 hours
    on the phone in a day. If they spent an hour, it would be a 0.042 (to three decimal
    places). This is often referred to as normalisation.


    If we wanted to investigate phone faults using age and time the phone is in use,
    then feature scaling this data would ensure that the model is not influenced by
    time on the phone having a greater range than age.


