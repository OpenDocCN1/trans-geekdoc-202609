    # PROPERTIES OF DATA SETS


    As well as the data having properties, data sets can also have properties. Two
    properties often encountered are patterns over time and skewness.


    Patterns over time


    When looking for patterns over time, the data might have a trend. It could be
    an upwards trend (values increasing over time) or a downwards trend (values decreasing
    over time). A pattern over time could also be cyclical, for example retail sales
    peaking in the run-up to Christmas every year. Data such as this isn’t stationary,
    and some models require the data to be stationary. Stationary data is where its
    statistical properties,'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'such as mean and variance, don''t vary over time. Where the data has a trend
    or cyclical pattern, the mean and variance do vary over time. Tests can be undertaken
    to determine if the data is stationary and, if it isn''t, it might be possible
    to transform the data so that it is stationary, allowing it to be used as part
    of a model requiring stationary data.


    # Skewed data


    We have seen in Chapter 6 that skewed data is where the data is unevenly distributed
    around the mean. A model''s output can be affected by how skewed the data is within
    it. If this is the case, steps can be taken to normalise the data, leading to
    an even distribution either side of the mean. This even distribution is referred
    to as normal distribution or Gaussian distribution. Statistical tests that assume
    normalised distribution are called parametric tests, those that don''t are nonparametric
    tests.


