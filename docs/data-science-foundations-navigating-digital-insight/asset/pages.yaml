  md: '# MODEL EVALUATION


    In this chapter, we delve into the essential process of evaluating data science
    models. Evaluation is crucial to ensure that the models you build are not only
    accurate but also meaningful and reliable. We will cover key concepts and techniques
    to assess model performance, interpret results and ensure they generalise well
    beyond the data used to train them. This activity relates to the analyse stage
    of the data analysis lifecycle.


    Let''s start at the beginning. When we talk about the outputs from models, there
    is going to be mention of likelihood, significance, confidence and so on, let''s
    start with probability, which we mentioned in Chapter 9, but will go into more
    detail now.


    # WHAT IS PROBABILITY?


    **Definition:** Probability is the measure of how likely an event is to happen.
    It''s a number between 0 and 1, where:


    A probability of 0 means the event will definitely not happen.


    A probability of 1 means the event will definitely happen.'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'A probability in between (e.g. 0.5) means there''s some chance the event will
    occur.


    Key formula for probability:


    $P(Event) = Number of favourable outcomes ÷ Total number of possible outcomes


    Example 1: rolling a die:


    Imagine you roll a standard six-sided die. What''s the probability of rolling
    a 3?


    Favourable outcome: Rolling a 3 (just 1 outcome).


    Total possible outcomes: Rolling any number from 1 to 6 (6 outcomes).


    $P(Rolling a 3) = 1 \div 6 \approx 0.167$


    So, the probability of rolling a 3 is roughly 16.7 per cent.


    Example 2: flipping a coin:


    If you flip a coin, what''s the probability of getting heads?


    Favourable outcome: Heads (1 outcome).'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'Total possible outcomes: Heads or tails (2 outcomes).


    $P(Heads) = 1 \div 2 = 0.5$


    So, there''s a 50 per cent chance of flipping heads.


    # WHAT IS A P-VALUE?


    **Definition:** A $p$-value tells us how likely it is to observe the data we have
    (or something more extreme) if the null hypothesis is true. It is a measure of
    ''surprise'' in our data.


    A small $p$-value (e.g. 0.05 or less) suggests that our data is unlikely to happen
    unless something unexpected is happening.


    A large $p$-value (e.g. > 0.05) means our data is consistent and as we expected.


    Think of the $p$-value as answering this question:


    What is the probability of observing data like this if there is nothing going
    on?


    It is commonly accepted that a 0.05, or 5 per cent, chance of something happening
    is a good level to work at. If there is a 5 per cent chance, or less, of an event
    occurring, and it does happen, we can say in the social sciences this is unlikely
    enough'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'to surprise us. Sometimes the value we choose can be different, for example
    0.01.


    # HYPOTHESIS TESTING: A STEP-BY-STEP GUIDE


    Hypothesis testing is a formal process we use to determine whether a hypothesis
    about a population is supported by sample data. Here are the steps to conduct
    a hypothesis test:


    # Step 1: State the hypotheses


    There are always two hypotheses in hypothesis testing:


    Null hypothesis ($H_0$): This is the default assumption. It states that there
    is no effect, no difference or no relationship.


    Example: A coin is fair, and the probability of heads is 0.5.


    Alternative hypothesis ($H_a$): This is what you’re trying to prove. It states
    that there is an effect, a difference or a relationship.


    Example: The coin is biased, and the probability of heads is not 0.5.


    # Step 2: Choose a significance level ($\alpha$)'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'The significance level is the threshold for deciding when to reject the null
    hypothesis. When would we think that there is a bias?


    Common choices: α = 0.05 (5 per cent) or α = 0.01 (1 per cent).


    If the $p$-value is less than α, we reject the null hypothesis, and this means
    there is some bias. Be aware that you should choose the level before we run our
    model and not risk being influenced by our answers.


    # Step 3: Collect data and calculate the test statistic


    The test statistic is a number that summarises your data and helps you to compare
    it with what the null hypothesis predicts. The type of test statistic depends
    on the test you’re performing (e.g. z-test, $t$-test, etc.).


    # Step 4: Calculate the $p$-value


    Using the test statistic and a statistical table (or software), find the $p$-value
    (also referred to as the critical value). This tells you how unusual your data
    is under the null hypothesis.


    # Step 5: Make a decision'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'If $p \le \alpha$: Reject the null hypothesis ($H_0$). This means there''s
    enough evidence to support the alternative hypothesis ($H_\alpha$).


    If $p > \alpha$: Fail to reject the null hypothesis. This means there''s not enough
    evidence to support $H_\alpha$.


    Example of hypothesis testing: Is a coin fair? Let''s say you flip a coin 20 times
    and get 17 heads. You suspect the coin might be biased.


    State the hypotheses:


    $H_0$: The coin is fair ($P(\text{Heads}) = 0.5$).


    $H_\alpha$: The coin is biased ($P(\text{Heads}) \neq= 0.5$).


    Choose a significance level:


    $\alpha = 0.05$.


    Collect data and calculate the test statistic:


    Number of heads = 17.


    Total flips = 20.


    Use a binomial test to calculate the $p$-value. Note: the binomial test is a method
    of calculating the probability of something'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'happening or not happening in many independent events.


    Calculate the $p$-value:


    Using software or a binomial probability table, find the $p$-value for getting
    17 or more heads (or 17 or fewer heads for a two-tailed test). The $p$-value might
    be, for example, 0.003.


    Make a decision:


    Since $p = 0.003 < \alpha = 0.05$, we reject the null hypothesis. There''s strong
    evidence that the coin is biased.


    # IS THIS CHANCE? UNDERSTANDING SIGNIFICANCE


    When evaluating a model, it''s vital to determine whether performance is genuine
    or merely a result of random chance. **Significance testing** helps in this regard,
    telling you how likely it would be to happen so that you can make a decision on
    whether you have spotted a pattern or trend. Apart from $p$-values and null hypotheses,
    you may come across the term confidence intervals.


    +   -Confidence intervals**: These provide a range within which we expect the
    true performance metric (e.g. accuracy,'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'precision) to lie with a certain level of confidence, usually 95 per cent.


    By using these measures, you can judge whether your model''s predictions are meaningful
    or just flukes.


    # HOW MUCH DOES THE MODEL EXPLAIN? COMPARING TRAIN AND TEST


    A critical aspect of model evaluation is understanding how well the model generalises
    to new, unseen data. This involves comparing its performance on the training set
    (the data used to build the model) with the test set (new data not seen by the
    model during training and therefore a way of checking the results).


    +   **Overfitting**: This occurs when a model performs exceptionally well on the
    training set but poorly on the test set. It means that the model has learned the
    noise and specifics of the training data rather than the underlying patterns.
    It has been overly designed to match the test set.


    +   **Underfitting**: Conversely, underfitting happens when the model performs
    poorly on both training and test sets, indicating it hasn’t captured the underlying
    trend in the data.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '+   **Performance metrics**: Common metrics include accuracy, precision, recall
    and F1-score. However, it''s essential to monitor these across both the training
    and test sets. Significant disparities between the two may indicate overfitting
    or underfitting.


    Striking the right balance between these sets ensures that your model explains
    the data well and can generalise effectively.


    False positives and false negatives


    In many real-world applications, not all errors are created equal. If you build
    a model that predicts something will happen and it doesn''t, this is an error.
    The impact of this error depends on the context of a problem. Imagine predicting
    that someone will catch the flu, but they don''t. You may have given them an unnecessary
    vaccine, which is not likely to be the end of the world. Being able to label the
    errors in your model is key to understanding its impact.


    +   **False positive (Type I error)**: This occurs when the model predicts a positive
    outcome incorrectly. For example, diagnosing someone as having a disease when
    they don''t.


    +   **False negative (Type II error)**: This happens when the model misses a positive
    outcome, such as failing to detect a'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'disease in a patient who actually has it.


    The consequences of these errors vary by context. In medical diagnosis, a false
    negative might be more critical than a false positive. However, in spam detection,
    false positives (marking legitimate emails as spam) might be more problematic.


    The numbers of errors are often shown in a simple table called a **confusion matrix**.
    It shows how well your model''s predictions align with the actual outcomes in
    your data. If we use the spam emails example, when detecting an email as spam
    we can have one of four outcomes:


    +   1. We mark it as spam, and it is – got it right.


    +   2. We mark it as spam, and it isn’t – got it wrong (false positive).


    +   3. We do not mark it spam, and it is – got it wrong (false negative).


    +   4. We do not mark it spam, and it isn’t – got it right.'
  merge: -1
