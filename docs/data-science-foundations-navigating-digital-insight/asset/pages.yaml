- pgno: 99
  md: 'In framing the problem, it is important to understand the context of the problem
    and why it is an important problem. This often requires input from several different
    stakeholders, different people might have different perspectives.


    Let’s consider a music streaming company, we might have a problem with subscriptions.
    However, stakeholders might have different perceptions of that problem: the sales
    director might see it as one of attracting new subscribers, whereas the finance
    director could see it as one of retention because people don’t use the service.
    Framing the problem helps to resolve these differences.


    In this instance, what might the problem look like if the finance director prevails?
    The idea might be that the more a subscriber uses our services the less likely
