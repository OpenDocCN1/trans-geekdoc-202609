    # LEGISLATION AND REGULATION


    Ethics is subjective; helpfully, legislation and regulation are a little more
    objective. These are limits on the use of data that society has set as a standard,
    that have legal consequences if not complied with. Different countries take different'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'approaches to setting these standards. Some will have overarching data protection
    laws, such as the UK, others regulate by specific sector, for example the USA.
    We will focus on the UK’s overarching legislation: the Data Protection Act 2018.


    # Data Protection Act


    The Data Protection Act 2018 gave effect to the European General Data Protection
    Regulation (GDPR). Rather than set out rules as how data can be used, it has a
    set of principles that should be followed. The advantage of principles is that
    they can be applied to different situations. Rules tend to address specific scenarios,
    making them complex and inflexible. This does, however, mean the principles require
    interpretation.


    # GDPR principles


    This is a brief introduction to the GDPR principles, and we would encourage you
    to explore this subject further to better understand the detail and nuances. You
    will find that these align with many of the ethical considerations we have discussed.
    You should remember that these principles apply to living persons and not to other
    entities, such as companies or those who are dead.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'Lawful, fair and transparent


    +   - **Lawful**: Data should only be processed where lawful under the act and
    where it doesn’t breach other laws such as the Equality Act. Processing is only
    lawful under the act where there is genuine consent or a contractual need, or
    public interest, or where there is a legitimate interest in processing it and
    this is not overridden by the individual’s interest. Legitimate interest provides
    a wide basis for the use of data.


    +   - **Fair**: However, the use must also be fair, so the data should be used
    in line with the person’s expectations and should not have an undue adverse effect
    on them.


    +   - **Transparent**: The individual also needs to be informed of the purpose
    for which their data will be processed and the consequences of that processing.


    Limited purpose


    Data should be collected for specific purposes and not processed in a manner incompatible
    with those purposes. However, there are circumstances where the purpose can be
    expanded, including where the new purpose is compatible with the old purpose.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Data minimisation


    Data should be limited to that necessary for the purpose for which it is being
    processed. If a data item is not needed to achieve the purpose, it should not
    be used.


    # Accuracy


    Data should not be inaccurate or misleading.


    # Storage limitation


    Data should only be kept for as long as is necessary for the purpose for which
    the data is being processed. However, this doesn’t apply where the person can
    no longer be identified within the data.


    # Integrity and confidentiality


    Data should be kept safely and securely. This means protecting it against accidents
    and malicious acts.


    # Accountability


    Organisations need to be able to show compliance with the above principles. This
    accountability is to regulators, to the subjects of the data and to the courts.'
  merge: -1
  img_proc: true
