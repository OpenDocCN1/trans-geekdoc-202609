- pgno: 89
  md: 'Aggregation is used where there is a small data set, and it can be easy to
    work out who data relates to even where it is obfuscated or redacted. This might
    be based on information in the data set or other information that people have
    access to. This could include inferences made about people and individuals’ interaction
    with them. In these cases, you can aggregate the data set so that individuals
    are not represented. Aggregating the data means that it is displayed for a group
    rather than by individual. In many instances, small groups will be excluded from
    reporting, to protect privacy.


    Anonymising data


    In this case, you remove all personal data. However, you need to be aware that
    some of the data you retain might allow someone to be identified. For example,
    if you leave an Internet Protocol (IP) address and an age in a record, it is likely
    these data items could be used to identify an address and a particular person
    living there. Data could be changed for an ID or ‘token’, which removes personal
    data, for example each employee could be given a unique reference number. However,
    it should be remembered that the individual could be identified by someone who
    has the data set containing the unique reference numbers and names. You might
    recall that data where people can’t be identified falls outside of GDPR. However,
    even where'
  merge: -1
