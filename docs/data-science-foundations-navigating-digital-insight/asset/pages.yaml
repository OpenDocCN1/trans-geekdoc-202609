- pgno: 58
  md: '+   - Employees (early project): The impact on employees isn’t known, so they
    have little interest and little power.


    # Communication plan


    The strategies identified using the power interest grid can be used to create
    a communication plan. This simply sets out how the stakeholders will be communicated
    with. This could be through one-to-one sessions, meetings or written updates.
    These could be set up specifically for the project or be existing communication
    channels.


    An example of the communication plan for the phone analysis is shown in Figure
    2.6. The plan shows how each stakeholder group will be communicated with. Having
    a communication plan mitigates the risk that different stakeholders aren’t appropriately
    engaged in the project. As with stakeholders, the communication plan should be
    kept under review throughout the project – it is a living document. We consider
    communication of the analysis in Chapter 13.


    It is worth noting in this example that the communication plan focuses on the
    compliance team, who represent the regulator in this project. They understand
    the regulations and, if needed, would represent the project to the regulator.'
  merge: -1
  img_proc: true
